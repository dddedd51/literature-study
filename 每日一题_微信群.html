<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日一题 · 微信群</title>
<style>
:root{
  --bg:#f7f3ea; --card:#fffdf8; --ink:#2b2620; --ink2:#3a352d; --sub:#8a8073; --line:#e3dccd;
  --gold:#c8902a; --accent:#9a3b2e; --seal:#9a3b2e;
  --fs:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs)}
html,body{background:var(--bg);color:var(--ink);
  font-family:"LXGW WenKai","霞鹜文楷",KaiTi,"楷体",STKaiti,serif;
  line-height:1.9;letter-spacing:.01em;
  background-image:radial-gradient(circle at 18% 10%,rgba(200,144,42,.06) 0,transparent 34%),
                   radial-gradient(circle at 86% 20%,rgba(154,59,46,.05) 0,transparent 38%),
                   radial-gradient(circle at 58% 90%,rgba(59,107,94,.05) 0,transparent 40%);
  min-height:100vh;}
a{color:var(--accent)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 90px;}

/* ===== 顶栏 ===== */
.bar{position:sticky;top:0;z-index:40;background:rgba(247,243,234,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:9px 12px;margin:0 -16px 0;}
.bar .btitle{margin-right:auto;font-weight:700;color:var(--accent);font-size:15px;letter-spacing:1px}
.bar button,.bar a.bl{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;text-decoration:none;
  line-height:1.5;transition:all .13s ease;}
.bar button:hover,.bar a.bl:hover{border-color:var(--accent);color:var(--accent)}
.bar .grp{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);
  background:var(--card);border-radius:8px;padding:2px;}
.bar .grp button{border:none;background:transparent;padding:4px 9px;font-weight:700}
.bar .grp button:hover{color:var(--accent);background:rgba(200,144,42,.09);border-radius:6px}
.bar .grp b{min-width:30px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums;
  color:var(--ink);font-weight:700}

/* ===== 页头 ===== */
.hero{text-align:center;padding:22px 8px 4px}
.hero h1{font-size:29px;letter-spacing:5px;font-weight:700}
.hero .sub{color:var(--sub);font-size:13.5px;margin-top:7px;letter-spacing:1.2px}
.hero .rule{width:190px;height:2px;margin:13px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* ===== 统计 ===== */
.stats{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.stat{flex:1;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.035)}
.stat b{display:block;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.35}
.stat span{font-size:11.5px;color:var(--sub);letter-spacing:.5px}
.stat.plain b{color:var(--gold)}

/* ===== 日期条 ===== */
.date-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;
  margin:14px 0 12px;box-shadow:0 3px 12px rgba(0,0,0,.04);}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;row-gap:10px;}
.dcol{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.daybar button{font-family:inherit;font-size:13.5px;cursor:pointer;color:var(--ink);
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;
  transition:all .13s ease;display:inline-flex;align-items:center;gap:4px;}
.daybar button:hover{border-color:var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.06);transform:translateY(-1px)}
.daybar button:active{transform:translateY(0)}
.day-arrow{border:none!important;background:transparent!important;color:var(--sub);font-size:18px;padding:8px 6px!important;}
.day-arrow:hover{color:var(--accent)!important;box-shadow:none!important;transform:none!important}
#goToday{border-color:transparent;background:var(--gold);color:#fff;font-weight:700;
  box-shadow:0 3px 8px rgba(200,144,42,.28);}
#goToday:hover{background:#b87d1e;-webkit-text-fill-color:#fff}
.date-sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.d-title{display:flex;flex-direction:column;align-items:center;line-height:1.1;gap:3px;}
#dateLabel{font-size:22px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(120deg,var(--accent),#c8902a);-webkit-background-clip:text;background-clip:text;color:transparent;}
#weekLabel{font-size:12px;color:var(--sub);
  background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;}
#datePick{font-family:inherit;font-size:13px;border:1px solid var(--line);background:#fff;
  color:var(--ink);border-radius:999px;padding:7px 12px;transition:border-color .13s ease;}
#datePick:hover{border-color:var(--gold)}

/* ===== 题目卡 ===== */
.qcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);
  border-radius:14px;margin:16px 0;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.045);}
.qcard.done{border-left-color:#3b6b5e}
.qhead{padding:15px 18px 13px;cursor:pointer;position:relative;
  background:linear-gradient(90deg,rgba(200,144,42,.045),transparent 65%);}
.qhead:hover{background:linear-gradient(90deg,rgba(200,144,42,.085),transparent 65%)}
.qtop{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.seal{flex:none;background:var(--seal);color:#fff;font-size:12px;letter-spacing:1.5px;
  border-radius:6px;padding:2.5px 9px;font-weight:700}
.dt{font-size:12.5px;color:var(--sub);letter-spacing:.5px}
.dt .src{color:#b5a992}
.qstitle{font-size:17.5px;font-weight:700;line-height:1.65;letter-spacing:.4px;color:var(--ink)}
.qmeta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.star{color:var(--gold);font-size:13px;letter-spacing:1px}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;color:var(--sub);border:1px dashed var(--line);border-radius:999px;
  padding:1.5px 9px;letter-spacing:.5px}
.arrow{margin-left:auto;color:var(--sub);font-size:13px;transition:transform .25s ease;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.qcard.open .arrow{transform:rotate(0)}
.qcard .arrow .tri{display:inline-block;transition:transform .25s ease;font-size:11px}
.qcard.open .arrow .tri{transform:rotate(90deg)}

/* ===== 15 分钟计时 ===== */
.timer{display:flex;align-items:center;gap:9px;background:#fdf9f0;border:1px solid var(--line);
  border-radius:11px;padding:8px 12px;margin:12px 0 0;flex-wrap:wrap}
.timer .tclock{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;
  color:var(--accent);min-width:74px}
.timer .tlab{font-size:12px;color:var(--sub);letter-spacing:.5px}
.timer button{font-family:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--line);
  background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;transition:all .13s ease}
.timer button:hover{border-color:var(--accent);color:var(--accent)}
.timer button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.timer .ring{margin-left:auto;width:52px;height:52px;flex:none}
.timer .ring circle{fill:none;stroke-width:6;stroke-linecap:round}

/* ===== 正文 ===== */
.qbody{max-height:0;overflow:hidden;transition:max-height .4s ease}
.qcard.open .qbody{max-height:26000px}
.qinner{padding:4px 20px 18px;border-top:1px dashed var(--line)}
.ans-title{color:var(--sub);font-size:12.5px;margin:14px 0 8px;letter-spacing:1.5px}
.ans{font-size:16.5px;line-height:2.05;white-space:pre-wrap;word-break:break-word;color:var(--ink2);
  text-align:justify}
.tipbox{margin-top:16px;background:#fdf7ec;border:1px dashed var(--gold);border-radius:10px;
  padding:12px 15px;}
.tipbox .th{font-size:12.5px;color:#a5801f;letter-spacing:1.5px;margin-bottom:6px;font-weight:700}
.tipbox .ans{font-size:15.5px;line-height:1.95;color:#4a4237}
.qacts{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.qacts button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);
  background:#fff;color:var(--ink);border-radius:999px;padding:7px 15px;transition:all .13s ease}
.qacts button:hover{border-color:var(--accent);color:var(--accent)}
.qacts .donebtn.on{background:#3b6b5e;color:#fff;border-color:#3b6b5e;font-weight:700}
.qacts .closebtn{margin-left:auto;border:1px solid var(--line);color:var(--sub)}
.qacts .closebtn:hover{border-color:var(--accent);color:var(--accent)}

/* ===== 空状态 ===== */
.empty{text-align:center;color:var(--sub);padding:46px 18px;background:var(--card);
  border:1px dashed var(--line);border-radius:14px;line-height:2;font-size:15px}
.empty b{color:var(--accent)}

/* ===== 总览 ===== */
.overview{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;box-shadow:0 2px 8px rgba(0,0,0,.035)}
.overview .oh{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:1px;margin-bottom:10px;
  display:flex;align-items:center;gap:8px}
.overview .oh::before{content:'';width:5px;height:15px;border-radius:3px;
  background:linear-gradient(180deg,var(--gold),var(--accent));flex:none}
.oitem{display:flex;align-items:baseline;gap:9px;padding:6px 0;border-bottom:1px dotted var(--line);
  font-size:14px;cursor:pointer;line-height:1.7}
.oitem:last-child{border-bottom:none}
.oitem:hover .ot{color:var(--accent)}
.oitem .od{flex:none;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
.oitem .ot{flex:1;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oitem .og{flex:none;font-size:11.5px;color:var(--sub);border:1px solid var(--line);
  border-radius:999px;padding:0 8px}
.oitem .og.done{color:#3b6b5e;border-color:#bcd6c2;background:#eaf3ec}
.oitem.cur{background:linear-gradient(90deg,rgba(200,144,42,.09),transparent 70%);
  border-radius:8px;padding-left:6px;margin-left:-6px}

.footnote{color:var(--sub);font-size:12.5px;margin-top:26px;line-height:1.95;text-align:center}
.footnote code{background:#f1ebdd;border-radius:4px;padding:1px 5px;font-size:12px}

@media (max-width:640px){
  .wrap{padding:0 12px 80px}
  .hero h1{font-size:23px;letter-spacing:3px}
  .qstitle{font-size:16.5px}
  .bar{padding:8px 12px}
  .bar .btitle{font-size:13.5px;letter-spacing:.5px}
  .timer .ring{display:none}
  .qinner{padding:4px 15px 16px}
}
@media print{
  .bar,.timer,.qacts,.date-wrap,.overview{display:none!important}
  .qcard{break-inside:avoid;box-shadow:none}
  .qbody{max-height:none!important}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <span class="btitle">每日一题 · 微信群</span>
    <span class="grp" title="正文字号">
      <button type="button" id="fMinus" aria-label="缩小字号">A−</button>
      <b id="fsNow">16</b>
      <button type="button" id="fPlus" aria-label="放大字号">A+</button>
    </span>
    <button type="button" id="expandAll">展开本篇</button>
    <button type="button" id="printPage">打印</button>
  </div>

  <div class="hero">
    <h1>每日一题</h1>
    <div class="sub">微信群「文学史笔记」整理 &nbsp;|&nbsp; 每天一题，15 分钟看完</div>
    <div class="rule"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="date-wrap">
    <div class="daybar">
      <div class="dcol">
        <button id="prevDay" class="day-arrow" title="前一天" aria-label="前一天">◀</button>
      </div>
      <div class="d-title">
        <span id="dateLabel">—</span>
        <span id="weekLabel"></span>
      </div>
      <div class="dcol">
        <button id="goToday" type="button">今天</button>
        <button id="goLatest" type="button">最新一题</button>
        <span class="date-sep"></span>
        <input type="date" id="datePick" aria-label="选择日期">
        <button id="nextDay" class="day-arrow" title="后一天" aria-label="后一天">▶</button>
      </div>
    </div>
  </div>

  <div id="content"><div class="empty">加载中…</div></div>

  <div class="overview" id="overview" style="display:none;"></div>

  <div class="footnote">
    内容来源：微信群每日一题转发（答案据「文学史笔记」整理）· 打卡记录与字号偏好存在本机浏览器<br>
    新题进库方式：把当天的聊天记录转发给助手，追加到 <code>每日一题_微信群.data.js</code> 最前面即可，页面无需改动
  </div>
</div>

<script src="每日一题_微信群.data.js"></script>
<script>
(function(){
  'use strict';

  /* ========== 本地数据兜底：数据文件缺失时也能跑 ========== */
  var FALLBACK = {
    items: [{
      date: '2026-09-14',
      subject: '现当代文学',
      q: '周作人对中国新文学的发展贡献有哪些？',
      a: '答:周作人是中国现代文学史上现代散文的集大成者，也是"五四"时期最有影响力的理论先导者和批评家。周作人对中国新文学的发展主要表现为:\n(1)"人的文学\'\n1周作人对新文学的思想建设进行了诸多思考与探讨，其最突出的贡献，是以"人的文学"来概括新文学的内容，标示新文学区别于旧文学的本质特征。"人的文学"成为"五四"时期文学的一个中心概念。\n2周作人在1918年底发表的《人的文学》这篇著名的文章中，要求新文学必须以人道主义为本，观察、研究、分析社会"人生诸问题"，尤其是底层人们的"非人的生活":作家必须以认真严肃的、而并非游戏的态度，去描写"非人的生活"，对改造社会持积极的态度，而且，还要展示"理想的生活"。\n3在周作人这里，所谓的人道主义具体指个人主义的"人间本位主义"，只有作家自己觉悟了，"占得人的位置"，才能"讲人道，做人类"。周作人将新文学的本质界定为"重新发现‘人\'"的一种手段，根本目标在于促进人性的健全发展。\n(2)"平民文学"\n1919年初，周作人又提出"平民文学"的概念，实际上是"人的文学"的具体化。\n1周作人将封建传统的旧文学概括为"贵族的文学"，认为"平民的文学"恰是反其道而行之的。两者间的区别主要是指"文学的精神区别，指它的普遍与否，真挚与否"。周作人指出平民文学应以通俗的白话语体描写人民大众生活的真实情状，忠实地反映"世间普通男女的悲欢成败"，描写大多数人的"真挚的思想与事实”。\n2周作人所提倡的"人的文学"或"平民文学"，是以人道主义为本的"为人生的文学"，强调文学是人性的，是人类的，也是个人的。这些主张虽然有些抽象，但恰与"五四"时期个性解放的热潮相合，所以有相当的代表性，对文学革命的推进起到很大的作用。\n(3)"人生的艺术派"\n1920年，周作人做了一次题为《新文学的要求》的演讲，针对当时新文坛中已经出现的"人生派"与"艺术派"的分野，提出自己的见解。\n1他认为"为什么而什么"的态度是不可取的，因为"人生派"的流弊容易讲到功利里去，以文艺为理论的工具变成文坛上的说教。文学根本不必"为什么"，只是用"艺术的方法"表现作者对于人生的情思。\n2他出版的评论集《自己的园地》，强调尊重创作个性，书写表达作者各自的情思，既反对以个人为艺术工匠的"为艺术派"，又反对以艺术为人生仆役的"为人生派"，而主张"人生的艺术派"。\n(4)对现代散文文体的理论确认\n传统文学中的散文泛指与韵文相对的所有散文体文章，文学散文与非文学的文字没有明确界限，文学散文未能独立出来成为一种文学体裁。文学革命以后，文学性散文创作兴起，有必要对文学散文进行文体确认。\n1刘半农最早提出将"文学的散文"与"文字的散文"区别开来，但其所谓"文学的散文"还包括小说、杂文等，并没有从几种文体中独立出来。\n2周作人于1921年6月发表题为《美文》的文章，真正从理论上确认了文学性散文的地位。该文将那种以抒情叙事为主的艺术性的散文视作美文，摆到了与小说、诗歌、戏剧并列的位置，实际上也就阐明了艺术性散文的文类品格。\n3周作人不但能写一手别有韵味的散文，主要是小品文，而且常作散文批评，强调好散文需具备饶有"趣味"的内容，"平淡自然"的气质，追求能引发读者体味思索的"涩味"与"简单味"，他的散文批评也更能从一个角度切近散文创作的规律，上升到美学批评的高度。\n总之，周作人的这些理论都是以人道主义为本的"为人生的文学"，强调文学是人性的、人类的、也是个人的。这些主张虽然有些抽象，但恰与"五四"时期个人解放的热潮相合，具有一定的代表性，对中国新文学的发展起到了很大的推动作用。',
      tip: '答案来源文学史笔记。\n拿到这道题先想：什么是贡献？具体到周作人这里，即他的理论和实践。理论就是人的文学、平民文学，实践即周作人的散文。\n所以答题思路就是分两大板块，先讲理论再讲实践，在答实践的时候，讲自己背诵的其代表作以及艺术特色影响答进去。'
    }]
  };

  var DATA = (window.__DAILYWEIXIN && window.__DAILYWEIXIN.items) ? window.__DAILYWEIXIN : FALLBACK;

  /* ========== 工具 ========== */
  function pad(n){ return (n<10?'0':'')+n; }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function todayObj(){ var d=new Date(); return {y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()}; }
  function iso(o){ return o.y+'-'+pad(o.m)+'-'+pad(o.d); }
  function parse(isoStr){
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(isoStr||'').trim());
    return m ? {y:+m[1],m:+m[2],d:+m[3]} : null;
  }
  function shift(o,delta){
    var d=new Date(o.y,o.m-1,o.d); d.setDate(d.getDate()+delta);
    return {y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()};
  }
  function fmtCn(o){
    var wd=['日','一','二','三','四','五','六'][new Date(o.y,o.m-1,o.d).getDay()];
    return { line:o.y+' 年 '+o.m+' 月 '+o.d+' 日', week:'星期'+wd, short:o.m+'/'+o.d };
  }
  var LS = (function(){
    try{ localStorage.setItem('__t_wx','1'); localStorage.removeItem('__t_wx'); return true; }catch(e){ return false; }
  })();
  function lsGet(k){ if(!LS) return null; try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ if(!LS) return; try{ localStorage.setItem(k,v); }catch(e){} }
  function lsDel(k){ if(!LS) return; try{ localStorage.removeItem(k); }catch(e){} }

  /* ========== 题目索引（按日期倒序） ========== */
  var items = (DATA.items || []).filter(function(it){
    return it && it.date && parse(it.date) && it.q;
  }).slice();
  items.sort(function(a,b){
    if(a.date < b.date) return 1;
    if(a.date > b.date) return -1;
    return (parseInt(a.seq,10)||0) - (parseInt(b.seq,10)||0);
  });
  var byDate = {};
  items.forEach(function(it){
    if(!byDate[it.date]) byDate[it.date] = [];
    byDate[it.date].push(it);
  });
  var allDates = Object.keys(byDate).sort();
  var minDate = allDates.length ? parse(allDates[0]) : todayObj();
  var maxDate = allDates.length ? parse(allDates[allDates.length-1]) : todayObj();

  var viewedDate = allDates.length ? parse(allDates[allDates.length-1]) : todayObj();
  var CLAMP = { min:minDate, max:{ y: maxDate.y, m: maxDate.m, d: maxDate.d } };

  /* ========== 打卡：每天只记一个钥匙，含未打开的题也算完成 ========== */
  var K_DONE = 'wxdaily_done';      // { "2026-09-14": "1,2" }
  var K_CARD = 'wxdaily_carddone';  // { "2026-09-14|1": 1 }
  var K_FS   = 'wxdaily_fs';
  function readJSON(k, dft){ var r=lsGet(k); if(!r) return dft; try{ var o=JSON.parse(r); return (o&&typeof o==='object')?o:dft; }catch(e){ return dft; } }
  var DONE = readJSON(K_DONE, {});
  var CARD = readJSON(K_CARD, {});

  function dayDone(dateStr){
    var raw = DONE[dateStr];
    if(!raw) return 0;
    return String(raw).split(',').filter(function(x){ return x!==''; }).length;
  }
  function markDay(dateStr, idx){
    var set = String(DONE[dateStr]||'').split(',').filter(function(x){ return x!==''; });
    var k = String(idx);
    if(set.indexOf(k)===-1){ set.push(k); DONE[dateStr]=set.join(','); lsSet(K_DONE, JSON.stringify(DONE)); }
  }
  function unmarkDay(dateStr, idx){
    var set = String(DONE[dateStr]||'').split(',').filter(function(x){ return x!=='' && x!==String(idx); });
    if(set.length) DONE[dateStr]=set.join(','); else delete DONE[dateStr];
    lsSet(K_DONE, JSON.stringify(DONE));
  }
  function isCardDone(dateStr, idx){ return !!CARD[dateStr+'|'+idx]; }
  function setCardDone(dateStr, idx, on){
    if(on) CARD[dateStr+'|'+idx]=1; else delete CARD[dateStr+'|'+idx];
    lsSet(K_CARD, JSON.stringify(CARD));
  }

  /* 全勤天数：从第一题那天到今天，中间没断过（今天不强制） */
  function fullStreakDays(){
    if(!allDates.length) return 0;
    var end = todayObj();
    var d = { y:end.y, m:end.m, d:end.d };
    var n = 0, guard = 0;
    // 今天没打卡不算断（还没到晚上），从昨天起算
    if(dayDone(iso(d)) === 0) d = shift(d, -1);
    while(guard++ < 4000){
      if(dayDone(iso(d)) > 0){ n++; d = shift(d,-1); }
      else if(iso(d) < allDates[0]){ break; }
      else { break; }
    }
    return n;
  }
  function totalDoneDays(){
    var n=0; allDates.forEach(function(k){ if(dayDone(k)>0) n++; });
    return n;
  }
  function totalDoneQuestions(){
    var n=0; allDates.forEach(function(k){ n += dayDone(k); });
    return n;
  }
  function totalQuestions(){
    var n=0; allDates.forEach(function(k){ n += byDate[k].length; });
    return n;
  }
  function coverageToday(){
    // 已更新到哪一天
    if(!allDates.length) return '—';
    return maxDate.m+'/'+maxDate.d;
  }

  /* ========== 渲染：顶部统计 ========== */
  function renderStats(){
    var el = document.getElementById('stats');
    el.innerHTML =
      '<div class="stat"><b>'+items.length+'</b><span>已收题目</span></div>'+
      '<div class="stat plain"><b>'+allDates.length+'</b><span>覆盖天数</span></div>'+
      '<div class="stat"><b>'+totalDoneQuestions()+'</b><span>已背题数</span></div>'+
      '<div class="stat plain"><b>'+fullStreakDays()+'</b><span>全勤连续天数</span></div>'+
      '<div class="stat"><b>'+coverageToday()+'</b><span>更新至</span></div>';
  }

  /* ========== 渲染：日期条 ========== */
  function renderDateBar(){
    var f = fmtCn(viewedDate), t = todayObj();
    var isToday = iso(viewedDate) === iso(t);
    document.getElementById('dateLabel').textContent = f.line;
    var wk = f.week;
    if(isToday) wk += ' · 今天';
    var list = byDate[iso(viewedDate)] || [];
    if(list.length) wk += ' ｜ 当天 '+list.length+' 题';
    document.getElementById('weekLabel').textContent = wk;
    document.getElementById('datePick').value = iso(viewedDate);
  }

  /* ========== 渲染：题目卡 ========== */
  var CARDS = [];
  function cardHtml(it, idx, dateStr){
    var star = it.star ? '<span class="star">'+'★'.repeat(Math.max(1,Math.min(5,it.star)))+'</span>' : '';
    var chips = [];
    if(it.subject) chips.push('<span class="chip">'+esc(it.subject)+'</span>');
    if(it.type) chips.push('<span class="chip">'+esc(it.type)+'</span>');
    if(it.qno) chips.push('<span class="chip">'+esc(it.qno)+'</span>');
    if(it.tags) (Array.isArray(it.tags)?it.tags:[]).forEach(function(tg){ chips.push('<span class="chip">'+esc(tg)+'</span>'); });
    var isDone = isCardDone(dateStr, idx);

    var timer =
      '<div class="timer" data-timer="'+idx+'">'+
        '<span class="tclock" data-clock>15:00</span>'+
        '<span class="tlab">默写 / 回忆</span>'+
        '<button type="button" data-tact="start">开始</button>'+
        '<button type="button" data-tact="reset">归零</button>'+
        '<button type="button" data-tact="5">5 分</button>'+
        '<button type="button" data-tact="15">15 分</button>'+
        '<svg class="ring" viewBox="0 0 52 52" aria-hidden="true">'+
          '<circle cx="26" cy="26" r="22" stroke="#eadfc8"></circle>'+
          '<circle cx="26" cy="26" r="22" stroke="#9a3b2e" data-ring '+
            'stroke-dasharray="138.2" stroke-dashoffset="0" transform="rotate(-90 26 26)"></circle>'+
        '</svg>'+
      '</div>';

    var tipBox = it.tip ? ('<div class="tipbox"><div class="th">▍答题思路 / 备注</div>'+
      '<div class="ans">'+esc(it.tip)+'</div></div>') : '';

    return '<div class="qcard'+(isDone?' done':'')+'" data-idx="'+idx+'">'+
      '<div class="qhead" data-toggle>'+
        '<div class="qtop">'+
          '<span class="seal">每日一题</span>'+
          '<span class="dt">'+esc(prettyDate(dateStr))+'<span class="src"> · 微信群整理</span></span>'+
          (star ? '' : '')+
        '</div>'+
        '<div class="qstitle">'+esc(it.q)+'</div>'+
        '<div class="qmeta">'+ star + (chips.length?'<span class="chips">'+chips.join('')+'</span>':'') +
          '<span class="arrow"><span data-arrow-txt>展开答案</span><span class="tri">▶</span></span>'+
        '</div>'+
      '</div>'+
      '<div class="qbody"><div class="qinner">'+
        timer+
        '<div class="ans-title">▍参考答案</div>'+
        '<div class="ans">'+esc(it.a||'（暂无答案）')+'</div>'+
        tipBox+
        '<div class="qacts">'+
          '<button type="button" class="donebtn'+(isDone?' on':'')+'" data-tact="done">'+
            (isDone?'✓ 已背':'标记已背')+'</button>'+
          '<button type="button" class="closebtn" data-toggle>▲ 收起</button>'+
        '</div>'+
      '</div></div>'+
    '</div>';
  }
  function prettyDate(dateStr){
    var o = parse(dateStr);
    if(!o) return dateStr;
    return o.y+' 年 '+o.m+' 月 '+o.d+' 日';
  }

  function renderContent(){
    var dateStr = iso(viewedDate);
    var list = byDate[dateStr] || [];
    var c = document.getElementById('content');
    CARDS = [];
    if(!list.length){
      var t = todayObj();
      var isToday = dateStr === iso(t);
      c.innerHTML = '<div class="empty">'+
        (allDates.length
          ? (isToday
              ? '今天还没有新题 —— 微信群更新后，把聊天记录转发给助手就会自动入 <b>最新一题</b>。<br>也可以左右翻日期，回看之前背过的题。'
              : '这一天没有题目。点右侧日期框选一天，或按 ◀ ▶ 翻到有题的日期。')
          : '题库为空。请把微信群每日一题的聊天记录转发给助手，追加到 <b>每日一题_微信群.data.js</b>。')+
        '</div>';
      return;
    }
    var html = '';
    list.forEach(function(it, i){ html += cardHtml(it, i, dateStr); });
    c.innerHTML = html;
    applyFont();
  }

  /* ========== 字号 ========== */
  var FS = parseInt(lsGet(K_FS),10);
  if(isNaN(FS)) FS = 16;
  FS = Math.max(13, Math.min(23, FS));
  function applyFont(){
    document.documentElement.style.setProperty('--fs', FS+'px');
    var n = document.getElementById('fsNow'); if(n) n.textContent = FS;
  }
  function setFont(d){
    FS = Math.max(13, Math.min(23, FS+d));
    lsSet(K_FS, String(FS));
    applyFont();
  }

  /* ========== 15 分钟计时器 ========== */
  var timers = {};   // idx -> {left, total, tid, running}
  function fmtClock(sec){
    sec = Math.max(0, Math.round(sec));
    return pad(Math.floor(sec/60))+':'+pad(sec%60);
  }
  function paintTimer(idx){
    var st = timers[idx]; if(!st) return;
    var box = document.querySelector('.timer[data-timer="'+idx+'"]');
    if(!box) return;
    var clk = box.querySelector('[data-clock]');
    if(clk) clk.textContent = fmtClock(st.left);
    var ring = box.querySelector('[data-ring]');
    if(ring){
      var C = 138.23;
      var ratio = st.total>0 ? Math.max(0, Math.min(1, st.left/st.total)) : 0;
      ring.setAttribute('stroke-dashoffset', String(C*(1-ratio)));
      ring.setAttribute('stroke', st.left<=0 ? '#3b6b5e' : (st.left/st.total<=.34 ? '#c8902a' : '#9a3b2e'));
    }
    var sb = box.querySelector('[data-tact="start"]');
    if(sb){
      sb.textContent = st.running ? '暂停' : (st.left<st.total && st.left>0 ? '继续' : (st.left<=0 ? '重新开始' : '开始'));
      sb.classList.toggle('on', st.running);
    }
  }
  function timerStart(idx){
    var st = timers[idx]; if(!st) return;
    if(st.running){ clearInterval(st.tid); st.running=false; paintTimer(idx); return; }
    if(st.left <= 0) st.left = st.total;
    st.running = true;
    st.tid = setInterval(function(){
      st.left -= 1;
      if(st.left <= 0){
        st.left = 0; clearInterval(st.tid); st.running = false;
        try{ beep(); }catch(e){}
      }
      paintTimer(idx);
    }, 1000);
    paintTimer(idx);
  }
  function timerReset(idx, minutes){
    var st = timers[idx]; if(!st) return;
    if(st.tid) clearInterval(st.tid);
    st.total = (minutes||15)*60;
    st.left = st.total;
    st.running = false;
    paintTimer(idx);
  }
  var AC = null;
  function beep(){
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    AC = AC || new Ctx();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(.001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.22, AC.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001, AC.currentTime+1.1);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+1.15);
  }

  /* ========== 渲染：总览 ========== */
  function renderOverview(){
    var box = document.getElementById('overview');
    if(!items.length){ box.style.display='none'; return; }
    box.style.display='';
    var cur = iso(viewedDate);
    var head = '<div class="oh">全部题目 · 共 '+items.length+' 题</div>';
    var rows = items.map(function(it){
      var ds = it.date, idx = (byDate[ds]||[]).indexOf(it);
      var done = isCardDone(ds, idx);
      return '<div class="oitem'+(ds===cur?' cur':'')+'" data-goto="'+esc(ds)+'" data-idx="'+idx+'">'+
        '<span class="od">'+esc(ds.slice(5).replace('-','/'))+'</span>'+
        '<span class="ot">'+esc(it.q)+'</span>'+
        '<span class="og'+(done?' done':'')+'">'+(done?'✓':esc(it.subject||'题'))+'</span>'+
      '</div>';
    }).join('');
    box.innerHTML = head + rows;
  }

  /* ========== 事件绑定 ========== */
  function bindBar(){
    document.getElementById('fMinus').onclick = function(){ setFont(-1); };
    document.getElementById('fPlus').onclick  = function(){ setFont(1); };
    document.getElementById('expandAll').onclick = function(){
      var cards = document.querySelectorAll('.qcard');
      if(!cards.length) return;
      var anyClosed = Array.prototype.some.call(cards, function(c){ return !c.classList.contains('open'); });
      Array.prototype.forEach.call(cards, function(c){
        c.classList.toggle('open', anyClosed);
        var t = c.querySelector('[data-arrow-txt]');
        if(t) t.textContent = anyClosed ? '收起答案' : '展开答案';
      });
      this.textContent = anyClosed ? '收起本篇' : '展开本篇';
    };
    document.getElementById('printPage').onclick = function(){ window.print(); };
  }
  function bindDate(){
    document.getElementById('prevDay').onclick = function(){ gotoDate(shift(viewedDate,-1)); };
    document.getElementById('nextDay').onclick = function(){ gotoDate(shift(viewedDate,1)); };
    document.getElementById('goToday').onclick = function(){ gotoDate(todayObj()); };
    document.getElementById('goLatest').onclick = function(){
      if(maxDate) gotoDate(maxDate);
    };
    document.getElementById('datePick').addEventListener('change', function(e){
      var o = parse(e.target.value);
      if(o) gotoDate(o);
    });
  }
  function gotoDate(o, idx){
    if(!o) return;
    // 允许超出题库范围（提示空），但限制在合理区间内
    if(o.y < 2000 || o.y > 2100) return;
    viewedDate = o;
    renderDateBar();
    renderContent();
    renderOverview();
    if(typeof idx === 'number'){
      var card = document.querySelector('.qcard[data-idx="'+idx+'"]');
      if(card){
        card.classList.add('open');
        var t = card.querySelector('[data-arrow-txt]'); if(t) t.textContent='收起答案';
        setTimeout(function(){ card.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
      }
    } else {
      window.scrollTo({top:0, behavior:'smooth'});
    }
  }
  function bindContent(){
    var c = document.getElementById('content');
    c.addEventListener('click', function(ev){
      var tgt = ev.target;

      // 计时器
      var tact = tgt.closest && tgt.closest('[data-tact]');
      if(tact && tact.closest('.timer')){
        var box = tact.closest('.timer');
        var idx = parseInt(box.getAttribute('data-timer'),10);
        var act = tact.getAttribute('data-tact');
        if(act==='start') timerStart(idx);
        else if(act==='reset') timerReset(idx, 15);
        else timerReset(idx, parseInt(act,10)||15);
        return;
      }
      // 标记已背
      var dbtn = tgt.closest && tgt.closest('.donebtn');
      if(dbtn){
        ev.stopPropagation();
        var card = dbtn.closest('.qcard');
        var i = parseInt(card.getAttribute('data-idx'),10);
        var ds = iso(viewedDate);
        var on = !dbtn.classList.contains('on');
        dbtn.classList.toggle('on', on);
        dbtn.textContent = on ? '✓ 已背' : '标记已背';
        card.classList.toggle('done', on);
        setCardDone(ds, i, on);
        if(on) markDay(ds, i); else unmarkDay(ds, i);
        renderStats(); renderOverview();
        return;
      }
      // 展开 / 收起
      var tog = tgt.closest && tgt.closest('[data-toggle]');
      if(tog){
        var cd = tog.closest('.qcard');
        var open = !cd.classList.contains('open');
        cd.classList.toggle('open', open);
        var at = cd.querySelector('[data-arrow-txt]');
        if(at) at.textContent = open ? '收起答案' : '展开答案';
        return;
      }
      // 点题目头部空白也展开
      var head = tgt.closest && tgt.closest('.qhead');
      if(head){
        var cd2 = head.closest('.qcard');
        var open2 = !cd2.classList.contains('open');
        cd2.classList.toggle('open', open2);
        var at2 = cd2.querySelector('[data-arrow-txt]');
        if(at2) at2.textContent = open2 ? '收起答案' : '展开答案';
      }
    });
  }
  function bindOverview(){
    document.getElementById('overview').addEventListener('click', function(ev){
      var row = ev.target.closest && ev.target.closest('[data-goto]');
      if(!row) return;
      var ds = row.getAttribute('data-goto');
      var idx = parseInt(row.getAttribute('data-idx'),10)||0;
      var o = parse(ds);
      if(o) gotoDate(o, idx);
    });
  }

  /* ========== 启动 ========== */
  bindBar(); bindDate(); bindContent(); bindOverview();
  applyFont();
  renderStats();
  renderDateBar();
  renderContent();
  renderOverview();
  window.addEventListener('beforeunload', function(){
    Object.keys(timers).forEach(function(k){ if(timers[k].tid) clearInterval(timers[k].tid); });
  });

  // 暴露给调试
  window.wxdaily = {
    reload:function(){ renderStats(); renderDateBar(); renderContent(); renderOverview(); },
    goto:function(ds){ var o=parse(ds); if(o) gotoDate(o); }
  };
})();
</script>

<!-- back-to-plan-patch --><script>
/* 返回计划：从《百日冲刺计划》跳来的页面右下角会出现返回按钮 */
(function(){
  var qs = location.search || '';
  if(!/[?&]from=plan/.test(qs)) return;
  var m = qs.match(/[?&]d=(\d+)/);
  var href = '百日冲刺计划.html' + (m ? '?d=' + m[1] : '');

  function go(){
    if(window.opener && !window.opener.closed){
      try{ window.opener.focus(); }catch(e){}
      try{ window.close(); }catch(e){}
      if(window.closed) return;          /* 关掉了：原来那个标签就停在出发那天 */
    }
    location.href = href;                /* 关不掉就本标签跳回去 */
  }

  function draw(){
    if(document.getElementById('__backPlan')) return;
    var st = document.createElement('style');
    st.textContent =
      '#__backPlan{position:fixed;right:16px;bottom:16px;z-index:99999;font-family:inherit;'+
      'font-size:14px;font-weight:700;line-height:1;color:#fff;cursor:pointer;border:none;'+
      'background:linear-gradient(120deg,#9a3b2e,#c8902a);padding:12px 18px;border-radius:99px;'+
      'box-shadow:0 6px 20px rgba(154,59,46,.34);letter-spacing:1px;'+
      'transition:transform .15s,box-shadow .15s}'+
      '#__backPlan:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(154,59,46,.44)}'+
      '#__backPlan:active{transform:translateY(0)}'+
      '#__backPlan small{font-weight:400;opacity:.86;font-size:12px}'+
      '@media print{#__backPlan{display:none}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.id = '__backPlan'; b.type = 'button';
    b.innerHTML = '\u2190 返回计划' + (m ? ' <small>D-' + m[1] + '</small>' : '');
    b.onclick = go;
    document.body.appendChild(b);
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', draw);
  else draw();
})();
</script>
