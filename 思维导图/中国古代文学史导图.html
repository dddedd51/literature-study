<script>

(function(){
  var svg = document.getElementById('mmSvg');
  var nav = document.getElementById('eraNav');
  var quiz = document.getElementById('quizLink');
  var eraTitle = document.getElementById('eraTitle');
  var nodeCnt = document.getElementById('nodeCnt');
  var T = new markmap.Transformer();
  var color = d3.scaleOrdinal(BOOK.palette);
  var mm = null, cur = 0, depth = 2;

  function foldTo(root, d){
    (function walk(n, lv){
      if(n.children && n.children.length){
        n.payload = n.payload || {};
        n.payload.fold = (lv >= d) ? 1 : 0;
        n.children.forEach(function(c){ walk(c, lv+1); });
      }
    })(root, 0);
  }
  function show(i, push){
    cur = (i + BOOK.eras.length) % BOOK.eras.length;
    var era = BOOK.eras[cur];
    var root = T.transform(era.md).root;
    foldTo(root, depth);
    var opts = {duration:220, maxWidth:320, spacingVertical:12, spacingHorizontal:110, paddingX:16, color:color, initialExpandLevel:99};
    if(!mm){ mm = markmap.Markmap.create(svg, opts, root); }
    else { mm.setOptions(opts); mm.setData(root); }
    setTimeout(function(){ try{ mm.fit(); }catch(e){} }, 80);
    eraTitle.textContent = era.name;
    nodeCnt.textContent = era.nodes + ' 个节点';
    quiz.href = era.link;
    Array.prototype.forEach.call(nav.querySelectorAll('button[data-i]'), function(b){
      b.classList.toggle('on', parseInt(b.getAttribute('data-i'),10) === cur);
    });
    if(push !== false){ try{ history.replaceState(null,'','#e='+cur); }catch(e){} }
    document.title = era.name + ' · ' + BOOK.title + ' 思维导图';
  }

  /* 侧栏 */
  var head = nav.querySelector('.nav-head');
  BOOK.eras.forEach(function(e, i){
    var b = document.createElement('button');
    b.setAttribute('data-i', i);
    b.innerHTML = '<span class="idx">' + (i+1) + '</span><span class="nm">' + e.name + '</span><span class="cnt">' + e.nodes + '</span>';
    b.onclick = function(){ show(i); if(window.innerWidth<=760) nav.classList.remove('show'); };
    nav.appendChild(b);
  });
  if(BOOK.footnote){
    var fn = document.createElement('div');
    fn.className = 'footnote';
    fn.innerHTML = BOOK.footnote;
    nav.appendChild(fn);
  }
  var hm = document.getElementById('hamburger');
  hm.onclick = function(){ nav.classList.toggle('show'); };

  /* 层级按钮 */
  document.getElementById('depthTool').addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if(!b) return;
    depth = parseInt(b.getAttribute('data-d'),10) || 2;
    Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('on', x===b); });
    show(cur);
  });
  document.getElementById('fitBtn').onclick = function(){ try{ mm.fit(); }catch(e){} };

  /* 键盘切换 */
  document.addEventListener('keydown', function(ev){
    if(ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
    if(ev.key === 'ArrowRight') show(cur+1);
    else if(ev.key === 'ArrowLeft') show(cur-1);
  });

  /* 初始 hash */
  var m = (location.hash||'').match(/e=(\d+)/);
  show(m ? Math.min(parseInt(m[1],10), BOOK.eras.length-1) : 0, false);
})();

      '#__backPlan:active{transform:translateY(0)}'+
      '#__backPlan small{font-weight:400;opacity:.86;font-size:12px}'+
      '@media print{#__backPlan{display:none}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.id = '__backPlan'; b.type = 'button';
    b.innerHTML = '\u2190 返回计划' + (m ? ' <small>D-' + m[1] + '</small>' : '');
    b.onclick = go;
    document.body.appendChild(b);
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', draw);
  else draw();
})();
</script>
</body>
</html>
