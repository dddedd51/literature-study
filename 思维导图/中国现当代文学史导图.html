<style>
:root{
  --bg:#f7f3ea; --card:#fffdf8; --ink:#2b2620; --sub:#8a8073;
  --line:#e3dccd; --accent:#3b6b5e; --gold:#c8902a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);height:100%;
  font-family:"LXGW WenKai","霞鹜文楷",KaiTi,"楷体",STKaiti,serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;}
/* 顶栏 */
#topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;flex:none;
  background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.05);z-index:20;}
#topbar .back{color:var(--sub);text-decoration:none;font-size:14px;padding:4px 8px;border-radius:6px;white-space:nowrap;}
#topbar .back:hover{background:#f0e9da;color:var(--accent);}
#topbar .book{font-weight:700;color:var(--accent);font-size:16px;white-space:nowrap;}
#topbar .era{font-size:15px;color:var(--ink);border-left:1px solid var(--line);padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw;}
#topbar .spacer{flex:1;}
#topbar .tool{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px;}
#topbar .tool button{font-family:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);
  padding:4px 9px;border-radius:6px;cursor:pointer;white-space:nowrap;}
#topbar .tool button:hover{background:#f0e9da;}
#topbar .tool button.on{background:var(--accent);color:#fff;}
#topbar .fit{font-family:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:5px 10px;cursor:pointer;color:var(--ink);}
#topbar .fit:hover{background:#f0e9da;}
#topbar .quiz{font-size:14px;font-weight:700;text-decoration:none;color:#fff;background:var(--accent);
  border-radius:8px;padding:6px 14px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12);}
#topbar .quiz:hover{filter:brightness(1.12);}
/* 主体 */
#layout{display:flex;flex:1;min-height:0;}
#eraNav{width:236px;flex:none;overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:10px 8px;}
#eraNav .nav-head{font-size:13px;color:var(--sub);letter-spacing:2px;padding:2px 8px 8px;}
#eraNav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-family:inherit;
  font-size:14.5px;border:0;background:transparent;color:var(--ink);padding:8px 9px;border-radius:8px;cursor:pointer;margin-bottom:2px;}
#eraNav button:hover{background:#f0e9da;}
#eraNav button.on{background:var(--accent);color:#fff;}
#eraNav button.on .cnt{color:rgba(255,255,255,.75);}
#eraNav .idx{flex:none;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;
  background:rgba(0,0,0,.06);font-size:12px;}
#eraNav button.on .idx{background:rgba(255,255,255,.22);}
#eraNav .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#eraNav .cnt{flex:none;font-size:11px;color:#b3a998;}
#eraNav .footnote{margin-top:10px;padding:8px 9px;font-size:12.5px;color:var(--sub);line-height:1.6;
  border-top:1px dashed var(--line);}
#eraNav .footnote a{color:var(--accent);}
/* 画布 */
#mmWrap{flex:1;position:relative;min-width:0;}
#mmSvg{width:100%;height:100%;display:block;cursor:grab;}
#mmWrap .hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:#b3a998;
  background:rgba(255,253,248,.85);border:1px solid var(--line);border-radius:8px;padding:4px 10px;
  pointer-events:none;letter-spacing:.5px;}
#nodeCnt{position:absolute;right:12px;top:10px;font-size:12px;color:#b3a998;
  background:rgba(255,253,248,.85);border:1px solid var(--line);border-radius:8px;padding:4px 10px;pointer-events:none;}
.markmap{--markmap-font-size:15px;}
.markmap-node text{fill:#2b2620;}
.markmap-node text a{fill:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:700;}
.markmap-link{stroke-width:1.6px;}
/* 窄屏 */
@media (max-width:760px){
  #eraNav{position:absolute;left:0;top:0;bottom:0;z-index:15;transform:translateX(-100%);transition:.2s;box-shadow:4px 0 16px rgba(0,0,0,.08);}
  #eraNav.show{transform:none;}
  #topbar .book{display:none;}
  #hamburger{display:inline-flex !important;}
}
#hamburger{display:none;font-family:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:5px 10px;cursor:pointer;font-size:14px;}
</style>

<script>

    var b = document.createElement('button');
    b.setAttribute('data-i', i);
    b.innerHTML = '<span class="idx">' + (i+1) + '</span><span class="nm">' + e.name + '</span><span class="cnt">' + e.nodes + '</span>';
    b.onclick = function(){ show(i); if(window.innerWidth<=760) nav.classList.remove('show'); };
    nav.appendChild(b);
  });
  if(BOOK.footnote){
    var fn = document.createElement('div');
    fn.className = 'footnote';
    fn.innerHTML = BOOK.footnote;
    nav.appendChild(fn);
  }
  var hm = document.getElementById('hamburger');
  hm.onclick = function(){ nav.classList.toggle('show'); };

  /* 层级按钮 */
  document.getElementById('depthTool').addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if(!b) return;
    depth = parseInt(b.getAttribute('data-d'),10) || 2;
    Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('on', x===b); });
    show(cur);
  });
  document.getElementById('fitBtn').onclick = function(){ try{ mm.fit(); }catch(e){} };

  /* 键盘切换 */
  document.addEventListener('keydown', function(ev){
    if(ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
    if(ev.key === 'ArrowRight') show(cur+1);
    else if(ev.key === 'ArrowLeft') show(cur-1);
  });

  /* 初始 hash */
  var m = (location.hash||'').match(/e=(\d+)/);
  show(m ? Math.min(parseInt(m[1],10), BOOK.eras.length-1) : 0, false);
})();
</script>
<!-- back-to-plan-patch --><script>
/* 返回计划：从《百日冲刺计划》跳来的页面右下角会出现返回按钮 */
(function(){
  var qs = location.search || '';
  if(!/[?&]from=plan/.test(qs)) return;
  var m = qs.match(/[?&]d=(\d+)/);
  var href = '../百日冲刺计划.html' + (m ? '?d=' + m[1] : '');

  function go(){
    if(window.opener && !window.opener.closed){
      try{ window.opener.focus(); }catch(e){}
      try{ window.close(); }catch(e){}
      if(window.closed) return;          /* 关掉了：原来那个标签就停在出发那天 */
    }
    location.href = href;                /* 关不掉就本标签跳回去 */
  }

  function draw(){
    if(document.getElementById('__backPlan')) return;
    var st = document.createElement('style');
    st.textContent =
      '#__backPlan{position:fixed;right:16px;bottom:16px;z-index:99999;font-family:inherit;'+
      'font-size:14px;font-weight:700;line-height:1;color:#fff;cursor:pointer;border:none;'+
      'background:linear-gradient(120deg,#9a3b2e,#c8902a);padding:12px 18px;border-radius:99px;'+
      'box-shadow:0 6px 20px rgba(154,59,46,.34);letter-spacing:1px;'+
      'transition:transform .15s,box-shadow .15s}'+
      '#__backPlan:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(154,59,46,.44)}'+
      '#__backPlan:active{transform:translateY(0)}'+
      '#__backPlan small{font-weight:400;opacity:.86;font-size:12px}'+
      '@media print{#__backPlan{display:none}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.id = '__backPlan'; b.type = 'button';
    b.innerHTML = '\u2190 返回计划' + (m ? ' <small>D-' + m[1] + '</small>' : '');
    b.onclick = go;
    document.body.appendChild(b);
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', draw);
  else draw();
})();
</script>
