  }
  qEl.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){
      ev.preventDefault();
      if(matches.length > 1 && qEl.value.trim()){
        clearMarkers(); mIdx = (mIdx + 1) % matches.length; jumpMatch();
      } else { doSearch(); }
    } else if(ev.key === 'Escape'){ qEl.value = ''; doSearch(); }
  });
  var deb = null;
  qEl.addEventListener('input', function(){
    clearTimeout(deb); deb = setTimeout(doSearch, 420);
  });

  /* ---- 5. 控件 ---- */
  document.getElementById('tools').addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if(!b) return;
    if(b.classList.contains('fchip')){
      curFilter = parseInt(b.getAttribute('data-f'), 10);
      Array.prototype.forEach.call(document.querySelectorAll('.fchip'), function(x){
        x.classList.toggle('on', x === b);
      });
      matches = []; qhit.textContent = '';
      refresh();
    } else if(b.classList.contains('dbtn')){
      curDepth = parseInt(b.getAttribute('data-d'), 10);
      Array.prototype.forEach.call(document.querySelectorAll('.dbtn'), function(x){
        x.classList.toggle('on', x === b);
      });
      refresh();
    }
  });
  document.getElementById('fitBtn').onclick = function(){ try{ mm.fit(); }catch(e){} };
  svgEl.addEventListener('dblclick', function(ev){ if(ev.target === svgEl){ try{ mm.fit(); }catch(e){} } });

  /* ---- 6. 初始 ---- */
  var hm = (location.hash || '').match(/f=(-?\d+)&d=(\d+)/);
  if(hm){
    curFilter = Math.max(-1, Math.min(parseInt(hm[1], 10), DATA.books.length - 1));
    curDepth = parseInt(hm[2], 10) || 2;
    var fb = document.querySelector('.fchip[data-f="' + curFilter + '"]');
    var db = document.querySelector('.dbtn[data-d="' + curDepth + '"]');
    if(fb){ Array.prototype.forEach.call(document.querySelectorAll('.fchip'), function(x){ x.classList.toggle('on', x === fb); }); }
    if(db){ Array.prototype.forEach.call(document.querySelectorAll('.dbtn'), function(x){ x.classList.toggle('on', x === db); }); }
  }
  refresh(false);
})();
</script>
<!-- back-to-plan-patch --><script>
/* 返回计划：从《百日冲刺计划》跳来的页面右下角会出现返回按钮 */
(function(){
  var qs = location.search || '';
  if(!/[?&]from=plan/.test(qs)) return;
  var m = qs.match(/[?&]d=(\d+)/);
  var href = '../百日冲刺计划.html' + (m ? '?d=' + m[1] : '');

  function go(){
    if(window.opener && !window.opener.closed){
      try{ window.opener.focus(); }catch(e){}
      try{ window.close(); }catch(e){}
      if(window.closed) return;          /* 关掉了：原来那个标签就停在出发那天 */
    }
    location.href = href;                /* 关不掉就本标签跳回去 */
  }

  function draw(){
    if(document.getElementById('__backPlan')) return;
    var st = document.createElement('style');
    st.textContent =
      '#__backPlan{position:fixed;right:16px;bottom:16px;z-index:99999;font-family:inherit;'+
      'font-size:14px;font-weight:700;line-height:1;color:#fff;cursor:pointer;border:none;'+
      'background:linear-gradient(120deg,#9a3b2e,#c8902a);padding:12px 18px;border-radius:99px;'+
      'box-shadow:0 6px 20px rgba(154,59,46,.34);letter-spacing:1px;'+
      'transition:transform .15s,box-shadow .15s}'+
      '#__backPlan:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(154,59,46,.44)}'+
      '#__backPlan:active{transform:translateY(0)}'+
      '#__backPlan small{font-weight:400;opacity:.86;font-size:12px}'+
      '@media print{#__backPlan{display:none}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.id = '__backPlan'; b.type = 'button';
    b.innerHTML = '\u2190 返回计划' + (m ? ' <small>D-' + m[1] + '</small>' : '');
    b.onclick = go;
    document.body.appendChild(b);
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', draw);
  else draw();
})();
</script>
