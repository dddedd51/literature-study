之，“草叶”体现了惠特曼对民主社会和理想人格的理解与期盼。<\/p><p>③<span class=\"srctag\">郑版19世纪浪漫主义文学第6题，朱版19世纪中期文学第14题<\/span>《草叶集》的基本主题：第一，注重表现自我。作者反复歌咏自我，将自我刻画成一个强健有力的英雄。诗歌中，自我立足于实际，自主自强，获得了超越性，并且扩大到整个民族、宇宙，成为美利坚民族的代表，与永恒融为一体。第二，歌咏劳动和创造的伟大价值。作者歌颂劳动人民，认为他们最美，正是人类的劳动创造了物质文明和精神文明，正是他们伟大的创造力量才使人类拥有了城市、房屋和书籍等等生活基础。此外，诗人所歌颂的大自然也是人们劳动和建设的条件。第三，赞美自由和民主。作为一个平民诗人，惠特曼不同于贵族诗人的浪漫情调，他着重歌颂劳动人民创造世界的伟大业绩，同情被压迫的黑人奴隶，对民主理想的实现充满坚定的信念。同时，他也看到了获得民主有时需要付出血的代价，因此他歌颂那些献身民主的英雄，并将民主思想扩展到整个欧洲。<\/p><p>④<span class=\"srctag\">郑版19世纪浪漫主义文学第6题，朱版19世纪中期文学第14题<\/span>《草叶集》的艺术特色：第一，作者在诗歌形式上进行了大胆创新，创造了“自由体”的诗歌形式。《草叶集》打破了传统的诗歌格律，没有固定的韵脚，不是以音步，而是以短句作为诗歌内在韵律的基础，以语气和语调的变化来安排节奏，具有内在逻辑的节奏感，自由奔放，毫无斧凿痕迹。第二，《草叶集》喜欢运用“目录诗”和“平行句”，给表面无章法的自由诗以内在的节奏感。诗歌将一连串的人名、地名以诗行的形式排列在一起，形成磅礴的气势。诗歌喜欢采用一些语法结构相同，意义相关的重叠句、平行句，获得奔腾起伏、自由豪放的效果。第三，诗歌风格多种多样，而且具有强烈的音乐性。整个诗歌如同一首交响乐，诗人根据不同场合的需要采用不同的语调，有时高亢有力，有时轻柔哀婉，有时粗野傲慢，变化多端，体现了自由和创造的精神。第四，诗人扩大了诗歌的表现范围，涉及的题材广泛多样。作者歌咏的对象从城市到工厂，从自然景物到人工景物，突破了传统诗歌的表现对象，将各种人类创造的现代文明融入诗中，扩大了诗歌的题材。<\/p><p>⑤<span class=\"srctag\">朱版19世纪中期文学第14题<\/span>文学地位：作为19世纪美国杰出的诗人，他的创作具有鲜明的民族色彩和乐观精神，折射了美国资本主义处于上升时<\/p><p>期广大人民的情绪和愿望。他的诗歌以其民主的内容和革新的形式对美国乃至世界诗坛都产生了深刻影响。其自由不羁的诗歌风格在20世纪美国诗歌创作中留下的印记仍然清晰可见，芝加哥诗派的桑德堡采用惠特曼的自由式长句，歌唱民主，歌唱普通人；“垮掉的一代”的领袖金斯堡以无拘无束的“嚎叫”风格演绎着自己与惠特曼开创的美国诗歌传统的关系。<\/p><div class=\"subsec\">（4）麦尔维尔<\/div><p>①作家概况：继霍桑之后美国浪漫主义小说最重要的代表作家，曾受霍桑的影响，相信恶念永存，擅长描写航海生活的作品，代表作为《白鲸》。<\/p><p>②<span class=\"srctag\">郑版19世纪浪漫主义文学第7题<\/span>《白鲸》的意义：第一，从一般的社会意义来分析，小说以“披谷德号”捕鲸的故事，揭露了资本主义社会财富的血腥来源，抨击了资本主义制度的残酷和黑暗，反映了捕鲸工人危险而又艰苦的生活，歌颂了工人们机智、勇敢、互相支持的高贵品德。第二，在宗教背景下，白鲸代表着宗教的“恶”和“原罪”。“披谷德号”寓意人生的漫长旅途，带有加尔文教宿命论的思想。第三层是其复杂的象征意义。这种象征意义体现在白鲸“莫比·迪克”、“披谷德号”和船长埃哈伯形象上。有人把白鲸看作“善”的象征，有人认为它是“恶”的体现以及资本主义制度的本身，还有人说它是不善不恶的永恒的大自然的代表。“披谷德号”这艘船的名字本身就象征着灭亡。船长的象征意义也非常复杂，有人将之视为企图摧毁美和善的邪恶的代表，有人认为他是人类反抗的化身，还有人认为他是为了使自己成为主宰而徒劳地与宇宙力量抗争的狂徒。不同的阐释，说明了这部作品意义的丰富以及经久弥新的艺术生命力。<\/p><p>③<span class=\"srctag\">郑版19世纪浪漫主义文学第7题<\/span>《白鲸》的艺术特色：首先，广泛运用各种象征手法。小说中的很多景物都具有丰富的象征意义。例如，烟斗、白鲸、海洋、陆地等等，都具有深刻的象征性。其次，卓越的自然景物描写，尤其是对大海的描写给人印象极深。诗人以变化多端的笔调，描绘出大海多姿多彩的美丽景色，饱含了浓厚的诗情画意。再次，巧妙地运用大量的引证和议论。作者在故事中插入大量的捕鲸知识，使小说具有百科全书性质，增强了小说的真实性和趣味性。<\/p><p><b>（5）后期浪漫主义文学的其他诗人和作家：霍桑<\/b>：具有强烈的清教徒意识，以宗教善恶观看待世界，把社会矛盾归结为抽象的“恶”。他善于挖掘隐秘的“恶”，偏爱描写超自然、怪诞、恐怖的现象和阴暗心理，代表作为《红字》。朗费罗：19世纪美国最受欢迎的诗人之一。他的诗歌歌颂爱国主义精神，反对蓄奴制，同情印第安人，代表作为《海华沙之歌》。<\/p>", "star": 0, "key": 0}, {"no": 7, "title": "欧洲其它国家的浪漫主义诗人与作家", "html": "<p>密茨凯维奇：19世纪波兰最伟大的诗人，代表作有诗剧《先人祭》和长诗《塔杜施先生》。裴多菲：19世纪匈牙利最伟大的诗人，代表作有《自由与爱情》。<\/p>", "star": 0, "key": 0}]}, {"chapter": "第七章", "title": "19世纪现实主义文学", "link": {"quiz": "外国文学史习题_分章刷题.html#d6"}, "mindmap": 1, "kps": [{"no": 1, "title": "19世纪现实主义文学概况", "html": "<p>（1）<span class=\"srctag\">郑版19世纪现实主义文学第1题<\/span>历史背景（形成条件、原因）：①西欧资本主义政治制度确立之后的产物。随着欧美资本主义经济的发展和政治制度的确立，启蒙时期宣扬的民主、自由、平等、博爱的社会理想并没有得以实现，时代情绪开始由19世纪初期的乐观、激越向冷静、务实转变。②科学成就和科学思潮对人们生活和思维方式的影响。19世纪自然科学取得突出成就，不仅帮助人们更加客观准确地认识自然和自我，而且还倡导了一种推崇观察、分析和研究的认知方式，推动作家采取科学的方式研究、观察社会。③自古希腊以来的传统现实主义创作方法、文艺复兴时期人文主义文学、18世纪启蒙文学和英国现实主义小说等，都在文学内部为现实主义文学思潮的出现奠定了基础。<\/p><p>（2）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪现实主义文学第2题，朱版19世纪中期文学第1题<\/span><b>基本特征<\/b>：思想特征：①把文学作为分析与研究社会的手段，为人们提供了特定时代丰富多彩的社会历史画面，具有很高的认识价值。②以人道主义为思想武器，深刻地揭露与批判社会的黑暗，同情下层人民的苦难。③普遍关心社会文明发展进程中的生存处境问题，表现出作家对人的命运与前途的深切关怀。艺术特征：①追求艺术的真实模式，强调客观真实地反映生活。②重视描写人与社会环境的关系，塑造典型环境中的典型性格。③具有内倾向性与外倾向性两种倾向，将内心世界与外部社会形态结合。④以叙事文学为主，小说创作特别是长篇小说走向了成熟与繁荣。<\/p><p><b>（3）发展脉络<\/b>：现实主义文学思潮形成于19世纪的30年代，现实主义文学思潮的发展总体上分为两个时期，19世纪30年代至60年代为前期，其中心在法、英等国；19世纪70年代至20世纪初为后期，其中心在俄国、北欧和美国等。<\/p><p><b>（4）<span class=\"keymark\">☆<\/span>现实主义与自然主义<\/b>：19世纪中后期，受达尔文进化论的影响，文坛开始出现强调生物遗传与社会环境决定人物性格的观点，并在创作界和理论界的推动下，形成了自然主义文学思潮。其对现实人生的客观态度，使之常被视为现实主义文学的进一步发展，但是在创作思想和方法上却与现实主义文学有着重要区别。首先，各自的文学追求存在差异。现实主义文学按照生活本来的面貌予以反映；而自然主义文学却希望按照科学的方法探讨遗传或社会环境对人物性格和行动的潜在的决定性影响。其次，二者的创作方法不同。现实主义文学重视典型人物的塑造，在突出人物个性的同时，挖掘人物与时代的关系和人物与同类型人物的共同社会特性，展现人物性格与环境的互动关系；而自然主义文学重视描写处于赤贫状态下人的外在条件，不注意对人物性格和精神层面的刻画。再次，它们在风格和基调上也呈现出差异。现实主义文学高扬人道主义，其创作充满了对社会不良习气和制度的批评，也不乏温情和人文关怀；而自然主义文学则突出命运与社会环境对人的决定性影响，弥漫着宿命论思想和悲观情绪。<\/p><p><b>（5）批判现实主义<\/b>：后人对西方19世纪中后期现实主义的概括与评价。法国的蒲鲁东在《艺术的社会使命》一书中，最早作出“现实主义是批判的”论断。正式提出批判现实主义并给其下定义的是高尔基。高尔基指出：“资产阶级的‘浪子＇的现实主义，是批判的现实主义；批判的现实主义揭发了社会的恶习，描写了个人在家庭传统、宗教教条和法规压制下的‘生活和冒险＇，却不能够给人指出一条出路。批判一切现存的事物倒是容易，但除了肯定社会生活以及一般＇存在＇显然毫无意义以外，却没有什么可以肯定的。”<\/p><p><b>（6）社会主义现实主义：<\/b>在苏联成为主要的创作原则和方法，其统治和影响长达近六十年的时间。在斯大林强权政治影响下，1934年苏联作家协会阐释并倡导“社会主义现实主义”，加强对文学与艺术创作思想倾向和方法的控制。它要求文学创作将现实主义对生活的客观描写与对社会主义世界观的宣传、教育结合在一起。20世纪80年代，随着苏联的解体，其在文坛上的统治地位开始瓦解，但其影响持续到了90年代初期。在社会主义现实主义盛行过程中，其影响波及到了其它社会主义国家的文学创作、理论建设与批评实践。高尔基的《母亲》被视为社会主义现实主义的第一部代表作品。<\/p>", "star": 1, "key": 1}, {"no": 2, "title": "法国文学", "html": "<p><b>（1）文学概况<\/b>：①现实主义文学思潮的发源地。19世纪30、40年代法国现实主义文学反映资产阶级和封建阶级的斗争，以及资产阶级内部的矛盾，具有强烈的批判性和揭露性，同时表现出对封建时代的依恋之情。斯丹达尔和巴尔扎克是法国现实主义文学的奠基人，后来者还有梅里美、小仲马、福楼拜、都德和莫泊桑等。②19世纪中后期出现了巴黎公社文学，标志着无产阶级文学的发展，它也被称为新颖的现实主义文学，鲍狄埃是其代表人物。<\/p><div class=\"subsec\">（2）斯丹达尔<\/div><p>①作家概况：法国现实主义文学的最早和最重要的作家之一，1830年发表的小说《红与黑》，被称为19世纪现实主义文学的奠基之作。斯丹达尔是现实主义文学理论的倡导者，论著《拉辛与莎士比亚》被称为现实主义文学的宣言书。他信仰法国大革命时期的政治理想，参加过拿破仑领导的战争，这些都在其创作中打下了深刻的烙印。<\/p><p>②<span class=\"keymark\">☆<\/span>创作特点：思想特点：首先，擅长从政治斗争和不同势力集团之间的冲突中来反映某一历史时期的本质。其次，着力通过主人公的命运去表现时代的变化，作家本人的爱憎感情和政治理想。第三，意大利地理和人文特征被他赋予了重要意义，成为其小说描写的内容。第四，强调对感情之细微变化的表现。艺术特色：首先，他是第一个在心理描写方面具有自觉意识的小说家，擅长运用内心独白来表现人物内心激烈而复杂的情感，尤其在爱情心理描写方面成就突出。其次，他采取客观的叙述方法。第三，语言风格追求《民法》式的简约。第四，塑造了个性鲜明且非常富有时代特色的典型人物形象。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪现实主义文学第4题<\/span>《红与黑》的思想内容：《红与黑》<\/p><p>包含了爱情、政治和社会三方面的内容。第一，爱情小说。通过描写于连的两次爱情，斯丹达尔批判了德·雷纳尔夫妇的封建婚姻，以及贵族上流社会流行的金钱、门第观念。第二，政治小说。表达了鲜明的政治倾向性。首先，作者揭露了复辟王朝时期的腐败、黑暗以及贵族和平民之间的尖锐矛盾。其次，小说描绘了复辟王朝时期激烈的政治斗争。最后，《红与黑》揭露了贵族政权企图依靠外国势力干预政局的卖国行径。第三，社会风俗小说。小说描写了复辟王朝时期法国社会的风俗，提供了这一时期法国真实的社会历史画卷。故事发生的三个主要场景分别是汝拉山区维里埃尔小城的市长家、贝尚松的神学院和巴黎的德·拉莫尔侯爵府，三个场景所处的三个城市的风土人情得到了细致描写，不仅各具特点，而且共同概括了法国的时代风貌。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪现实主义文学第5题，朱版19世纪中期文学第2题<\/span>《红与黑》中的于连形象：于连是法国波旁王朝复辟时期个人奋斗者的典型。他出生低下，受到启蒙思想的影响，希望自己能施展才华、建功立业，并开始了个人奋斗的人生。在实现个人理想的过程中，于连多层次、矛盾的性格得到了揭示。首先，强烈的自我意识是其性格的主导特点。在启蒙思想的影响下，他形成了强烈的自我意识，并由此产生出平等观念、反抗意识与个人野心。其次，于连的性格也呈现出复杂的特点。作为一名地位低贱的下层社会青年，在波旁王朝复辟时期，为实现自我理想，他不得不采取伪装和投机的手段。而他对自我社会地位的敏感，也决定了其个人反抗的动摇性，影响到其性格的矛盾表现。再次，就其性格而言，他的身上还存在着双重性。他一方面勇敢真诚，敏感自尊，另一方面又自卑怯懦，不乏虚伪投机心理。这一性格特征加重了其面对政治理想跟社会现实冲突时的矛盾表现。在目的和手段之间，在理想和现实之间，他常常陷于矛盾之中。面对冷酷的现实，他不得不通过妥协来实现自己的人生目的，在不择手段往上爬的过程中，充当保皇党的同谋；另一方面又一直坚守自己对拿破仑的崇拜，不愿出卖灵魂。此外，于连的性格是发展的。他的性格发展跟环境有着密切关系，经历了从反抗到妥协再到反抗的变化。一旦实现个人的目标，他就放弃反抗，跟当权者同流合污。在认识到自我悲剧的必然性和社会性之后，平民意识才在他身上再度增强。通过选择死亡，他最后表示了自己对社会的彻底绝望与否定。总之，通过于连的毁灭，小说真实地反映了法国1830年7月革命前夕尖锐的阶级冲突，以及即将爆发的反抗情绪，表达了对复辟的波旁王朝的强烈抗议，以及对广大中小资产阶级青年知识分子的深切同情。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《红与黑》的艺术成就：首先，描写与揭示了典型环境和典型人物的关系。围绕于连的个人成长，小说重点描写了小城维里埃尔市长家、省城贝尚松神学院和巴黎木尔侯爵府三个典型环境，反映了人物性格发展和成长跟环境的互动关系，凝练地表现了法国社会非常富有代表性的空间环境，即地方小城、省城和首都，以及盛行其中的社会风俗，展现了法国社会的时代画卷。其次，塑造了于连这一典型形象。小说描写了于连的个人成长，叙述了其奋斗、失败、遗世<\/p><p>独立、同流合污、幡然醒悟的过程，突出地展现了其心理活动、情感追求，因为注重人物性格发展跟环境变化的关系，这一形象在突出个性的同时，也概括性地反映了波旁王朝复辟时期中小资产阶级青年知识分子的普遍特征。再次，《红与黑》细腻、精确、生动的心理描写，开创了现实主义文学内倾性的方向。最后，《红与黑》从传统的封闭结构向现代的开放结构过渡，摆脱了传统的时间结构格局，表现出“心理结构”的特征。<\/p><p>⑥《红与黑》书名的象征意义：第一，象征不同的政治理想。“红”代表拿破仑时代的军装，暗示自由平等、充满英雄业绩的拿破仑时代；“黑”代表教士的黑袍，指黑暗反动的波旁王朝复辟时期。第二，象征不同的人生道路，浓缩了于连的人生轨迹。“红”代表从军，“黑”代表加入教会。第三，就小说的叙事而言，概括了故事的走向，预示了于连的最终命运。“红”代表鲜血，预示于连的死亡，“黑”代表孝服，暗示了玛蒂尔德最后埋葬于连的结局。<\/p><div class=\"subsec\">（3）巴尔扎克<\/div><p>①作家概况：法国现实主义文学最伟大的代表。他的《人间喜剧》以卓越的现实主义描绘技法和巨大的批判力量，将法国现实主义文学推向了高峰。《欧也尼·葛朗台》和《高老头》是其代表作。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《人间喜剧》的思想内容：90多部作品组成的《人间喜剧》，“提供了一部法国‘社会＇特别是巴黎‘上流社会＇的卓越的现实主义历史”。第一，反映了资产阶级取代贵族阶级的罪恶发家史。第二，反映了贵族阶级的没落衰亡史。第三，描写了一幕幕争夺金钱的惨剧，揭露了金钱的罪恶。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪现实主义文学第6题，朱版19世纪中期文学第3题<\/span>《人间喜剧》的艺术成就：首先，提供了一套现实主义美学原则。巴尔扎克以系统、整体的思想看待社会，甘当法国社会的“书记”，重视对“物”的描写，全面反映历史。其次，塑造典型环境中的典型人物。《人间喜剧》各色人物多达2000多个，个性突出的典型人物就有几十个。这些典型人物都反映了个体与时代、环境的互动关系。第三，小说在结构和叙述方面进行了富有成效的探索。利用“人物再现法”和分类整理的方式，《人间喜剧》使各自独立的作品互相联系，形成一个整体。就具体的作品而言，巴尔扎克重视叙事的剪裁，使故事发展充满波折，加之多采用全知叙述而较少主观议论，戏剧性突出。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪中期文学第4题<\/span>《高老头》的思想内容：首先，淋漓尽致地揭露了金钱对社会关系的控制作用，以及由此而产生的种种社会罪恶。其次，再现了政治野心家的成长过程，通过拉斯蒂涅最终的堕落，既抨击了资产阶级利己主义道德原则、物欲横流的社会现实，也揭示了破落的贵族子弟堕落为资产阶级野心家的社会命运。再次，通过鲍赛昂子爵夫人情场失意，拉斯蒂涅接受资产阶级道德原则，揭示了贵族阶级被资产阶级取代的历史过程。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪中期文学第4题<\/span>《高老头》中拉斯蒂涅的形象：他是复辟王朝后期到七月王朝时期的资产阶级政治家和野心家的典型。他是外省的<\/p><p>没落贵族子弟，来到巴黎，不愿埋头读书，更不愿顺着社会阶梯一步步攀登，而是羡慕挥金如土的生活，受到巴黎社会环境的影响，最后成为资产阶级野心家。他的性格发展经过了三个阶段。首先，鲍赛昂子爵夫人亲自教他读“人生这部书”，培养他自私自利的人生观，传授他以牙还牙对付社会和他人的伎俩。伏脱冷给他上了人生的第二课，用赤裸裸的语言剖析社会的本质，让他不择手段地获取金钱。高老头的苦难和死亡，最后完成了他的社会教育。他埋葬了高老头，也埋掉了自己的最后一点人性，这时的他决定堕落成为向财富和权势进攻的资产阶级野心家。小说通过拉斯蒂涅的演变，反映了贵族阶级的衰亡和资产阶级的兴起，揭露了资产阶级金钱原则和利己主义思想的罪恶。<\/p><p>⑥<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪中期文学第4题<\/span>《高老头》的艺术成就：首先，塑造典型人物。在典型人物的塑造上，采用不同方法突出人物的个性，并通过环境描写揭示人物的社会特征，塑造了伏脱冷、拉斯蒂涅、高里奥等性格鲜明且富有代表性的人物。其次，环境描写真实、精确、细致。鲍赛昂子爵夫人的家与下层人物生活的伏盖公寓不仅构成了人物活动的空间，也成为时代社会风俗得以展现的舞台。再次，情节结构巧妙，线索纷繁。以高里奥、拉斯蒂涅、伏脱冷和鲍赛昂子爵夫人四人的故事交叉来组织情节，以拉斯蒂涅的活动来穿针引线，故事情节跌宕，结构紧凑。最后，《高老头》中一些人物在此后的作品中反复出现，是“人物再现法”开始运用的作品，在整个《人间喜剧》的构思中占据着重要地位。<\/p><div class=\"subsec\">（4）福楼拜<\/div><p>①作家概况：19世纪中期法国重要的现实主义作家，通过“梅塘集团”对法国文坛产生了重要影响，起着承前启后的作用，其对“真实”的强调直接影响到自然主义文学，而其叙述“中立”的创作实践以及对小说语言纯净、准确的追求则波及到20世纪作家。代表作品为《包法利夫人》，其它作品有《情感教育》、《圣安东的诱惑》、《萨郎波》和《三故事》等。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>艺术主张：一是追求真实性。他注重对材料的收集，甚至实地考查，以达到逼真的效果。二是追求客观的态度。他认为艺术应该像科学一样客观，作家不带偏见，不直接表露自己的感情。三是追求艺术美。他重视形式美，其语言句子十分精美，但也强调形式与内容的统一。<\/p><p>③《情感教育》的人物与主题：小说副标题为“一个年轻人的故事”。莫罗是小说的主人公，七月王朝时期中小资产阶级青年的典型。他是一个“集一切弱点之大成”的青年，意志薄弱，才智平庸，但耽于幻想，在不同事业和女性中游离辗转，最后事业和爱情都了无结果，典型地反映了其所处时代平庸、混乱的特征。主题：以1848年法国大革命贯穿整个法国社会生活，真实再现了这一革命前后时期的社会历史面貌，抨击了七月王朝的丑恶现实。同时，小说也表现了作者蔑视群众，厌弃斗争的思想局限。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《包法利夫人》的思想内容：小说的副标题为“外省风俗”，通过爱玛的悲剧，揭露了庸俗、卑鄙和险恶的社会现实，痛斥了资本主义社会精神空虚堕<\/p><p>落的生活，控诉了资本主义社会的罪恶的金钱关系。作者指出爱玛的悲剧是社会造成的，社会的物质和精神环境诱使其由纯真走向堕落，而资本主义社会风行的利己主义、资产阶级虚伪的浪漫情调、禁欲主义教育、高利贷的盘剥则将其推向毁灭。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《包法利夫人》中的爱玛形象：爱玛是一个在贵族资产阶级社会的腐蚀和逼迫下堕落、毁灭的妇女形象。爱玛出生于一个薄有田产的农民家庭，本来天生丽质，生性纯洁，并且得到父亲的溺爱，被送往修道院接受上流社会的教育。但是，不恰当的教育使她沉迷于中世纪浪漫幻想的爱情故事之中，向往上流社会奢华的生活。这种不健康的教育带给她的不切实际的幻想，为其后来不幸的婚姻生活埋下了种子。离开修道院，她的家庭出身使她只能嫁给一个不苛求嫁妆的乡村医生包法利。丈夫的平庸愚蠢、不思上进，生活环境的闭塞无聊，不仅没有改变爱玛，反而让她不计后果地追求虚幻的爱情，也让富裕的地主罗道耳弗乘虚而入，爱玛开始走向堕落与毁灭。被罗道耳弗抛弃后，爱玛没有觉醒，在偶遇旧相识赖昂后再一次陷于情欲之中。为了满足自己和情人的奢华生活，在商人的诱骗下她欠下了高额债务，最后再次被情人抛弃，而且还面临清偿债务的判决。在求告以往的情人、债主无果的情况下，走投无路的爱玛吞砒霜自杀。爱玛是平庸恶浊社会的受害者和不健康教育的牺牲品，她的悲剧性命运是社会造成的。通过爱玛由追求到幻灭的人生历程，福楼拜揭示了爱玛悲剧的社会性和普遍性，谴责了社会环境的庸俗以及人们精神生活的空虚和堕落。同时，对爱玛身上不切实际的幻想和享乐习气，福楼拜予以了批评，但对其悲剧性命运，则表达了深切的同情。<\/p><p>⑥<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《包法利夫人》的艺术特色：首先，在典型人物塑造上，小说更注重精神气质的描绘，而不是性格特点的刻画。其次，在环境描写方面，放弃了大量细致地予以客观再现的方法，而是侧重环境对人物精神特征的影响。再次，语言准确、简炼、朴实。在遣词造句上，用词极其讲究，特别是比喻运用独特。第四，在叙事风格上，表现出冷峻客观的叙事态度，在叙述角度上力求变化，被评论家称为电影手法。最后，在结构上也有创新。小说按女主人公的经历安排情节，以农业展览会作为情节转变的节点，由此形成前后对称的两部分，结构均衡稳固。<\/p><p><b>（5）其他现实主义作家<\/b>：①梅里美：其创作以现实主义为主，但带有浪漫主义文学的一些风格特征，反映了这一时期法国文坛现实主义与浪漫主义的互相渗透关系。其创作以短篇小说为主，代表作品有《高龙巴》和《嘉尔曼》。《嘉尔曼》塑造了一个真诚坦率又独立不羁的吉普赛女青年形象，以她对绝对自由的追求否定了资本主义的法律与道德文明。②都德：19世纪后期现实主义小说家，其创作带有自然主义倾向，反映了19世纪中后期法国现实主义文学与自然主义文学之间的复杂关系。其短篇小说享有很高的声誉，代表作品有描写普法战争，宣扬爱国主义的《最后一课》和《柏林之围》等。<\/p><p>（6）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪后期文学第1题<\/span>巴黎公社文学：在1871年巴黎公<\/p><p>社革命前后约20年间，革命者创作了大量关于公社革命活动的诗歌、小说、戏剧、杂文、回忆录和历史著作等，文学史称之为“巴黎公社文学”，其中以诗歌数量与成就最多、最大。它采用通俗活泼的形式、群众的语言，反映了无产阶级和广大劳动人民的斗争生活，表现了无产者的革命理想和革命激情。鲍狄埃是巴黎公社文学的代表，其创作的《国际歌》形象而精辟地阐述了马克思主义学说，表达了革命者的英雄主义和乐观主义精神。巴黎公社文学为20世纪无产阶级文学的发展奠定了基础。<\/p>", "star": 1, "key": 1}, {"no": 3, "title": "英国文学", "html": "<p><b>（1）文学概况<\/b>：①英国现实主义文学形成于19世纪30年代，40至50年代达到繁荣。②英国现实主义文学以人道主义为思想武器，较多地反映劳资矛盾及“小人物”的命运，具有丰富的人道主义思想与浓厚的改良主义色彩。主要作家有狄更斯、萨克雷、勃朗特姐妹和盖斯凯尔夫人等，他们被马克思称为“现代英国的一批杰出的小说家”。女作家、女诗人在这一时期非常活跃，形成了一个引人注目的创作群体。③19世纪70年代之后，现实主义文学的主要代表作家有哈代、萧伯纳和高尔斯华绥等。④19世纪30、40年代，出现了宪章派文学，它是无产阶级文学的萌芽。⑤侦探小说开始兴起，培养了广泛的阅读群体，反映了通俗文学影响的扩大。<\/p><div class=\"subsec\">（2）狄更斯<\/div><p>①作家概况：19世纪英国杰出的小说家，现实主义文学的代表，其创作几乎触及英国社会的各个领域，真实地展现了英国资本主义扩张时期广阔的社会图景，揭露了维多利亚“盛世”背后严峻的社会问题。在英国文学史上，其地位仅次于莎士比亚。<\/p><p>②创作分期：第一时期：1837-1841年。创作基调乐观向上，作品主人公是理想化的资产阶级和小人物，多采用流浪汉小说的形式，结构比较松散，具有浓厚的幽默色彩。代表作品包括《匹克威克外传》、《奥立佛·退斯特》和《老古玩店》等。第二时期：1842-1858年。狄更斯对资本主义社会有了更深刻的认识，怀疑、失望代替了幻想和乐观，“为富不仁者”代替了“仁爱者”，在保留幽默讽刺风格的同时，加强了批判倾向。主要作品有《马丁·朱述尔维特》、《董贝父子》、《大卫·科波菲尔》、《荒凉山庄》、《艰难时事》和《小杜丽》等。第三时期：1858-1870年。创作的乐观基调进一步减弱，呈现出冷峻的色彩，主人公总要付出沉重的代价才能得到圆满的结局。早期的幽默与讽刺手法更加弱化，悲观感伤情绪增加。主要作品有《双城记》、《远大前程》和《我们共同的朋友》等。<\/p><p>③<span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪现实主义文学第9题<\/span>狄更斯现实主义小说的思想特点：狄更斯现实主义小说的思想内容丰富而复杂。就其基本思想倾向来看，具有三个方面的特征。首先，批判维多利亚盛世时代的资本主义社会。其次，倡导人道主义价值伦理观。再次，广泛而深入地探索人性。人道主义思想贯穿这三个方面。人性是狄更斯人道主义思想的基础和出发点，道德是狄更斯人道主义思<\/p><p>想的主要内容，对社会的批判是狄更斯从人道主义出发对社会进行观察和评价的结果。在人道主义思想的统率下，三个方面既各自独立，又互相联系。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《双城记》的思想内容：为了儆诫英国的统治阶级，呼吁改良，狄更斯以1840年法国大革命为背景，以巴黎和伦敦为舞台，描写了法国贵族厄弗里蒙地侯爵、农民得伐石太太、医生梅尼特等及其家人的故事，真实地揭示了法国大革命的历史必然性，探讨了法国大革命爆发的原因，肯定了法国大革命的正义性。但是，小说对待革命暴力的否定态度，表现了狄更斯人道主义思想的局限，折射了其思想的矛盾性与复杂性。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《双城记》的艺术成就：首先，多元整一的结构。小说涉及到多条故事线索，但通过人物、情节和故事使不同故事线索相互联系、交叉和渗透，具有了丰富性和整一性。例如梅尼特医生的女儿露茜就起到了非常关键的联系作用，她的人生经历就将不同线索串联在一起。其次，感受型的现实主义创作方法。小说一方面立足历史事实，正面描写法国大革命；另一方面饱含感情地表达了作者的主观态度。第三，善于利用象征、对照来渲染气氛，揭示主题。第四，灵活地运用了悬念、倒叙、顺序、插叙等多种叙事方法，增加了故事的戏剧性。最后，语言简洁精炼、生动形象。他善于用精炼的语言描写革命场面，生动逼真，同时也表现出黑色幽默的色彩。<\/p><p>⑥《艰难时世》的思想内容：首先，通过庞得贝和葛擂硬这两个资产阶级人物形象，批判了19世纪盛行的功利主义哲学和曼彻斯特政治经济学。其次，直接描写了劳资矛盾，通过焦煤镇工人遭受的非人待遇，展示工人反抗的必然性，谴责资本家的剥削与压迫，赞美劳动人民的勤劳、朴实与善良本性。再次，主张以仁爱来对抗资产阶级的残酷，感化冷酷的资产阶级，宣扬人道主义思想。<\/p><div class=\"subsec\">（3）英国女作家、女诗人的创作<\/div><p>①文学概况：19世纪维多利亚时代，英国女作家、女诗人创作人数倍增，涌现了一些杰出的代表，除了勃朗特三姐妹外，还包括乔治·艾略特、盖斯凯尔夫人、伊丽莎白·勃朗宁和多萝西·罗塞蒂等。在诗歌和小说中，她们不仅展现了女性的生活体验，塑造了独立自主的女性形象，而且还将视线投向了广阔的社会生活，创作出了富有深刻社会内涵的作品。当今，随着女性主义思潮的兴起，维多利亚时代的英国女作家、女诗人的创作得到了重新阐释，其对女性自我意识的表现得到了赞扬，文学价值得到进一步挖掘。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《简爱》：简爱的形象：光彩夺目的新女性形象。首先，她是一个平民女子，出身贫苦，身为家庭教师，相貌平凡。其次，这一形象具有强烈的自由平等意识，敢于反抗不平等的性别关系，成为19世纪正处于萌芽状态的欧美女性运动的形象代表，其富有激情的言辞强烈地表达了普通女性追求自由平等的强烈愿望。再次，其独立的个性、成熟的思想使其成为社会成见和不平等秩序的批判者，反映了其思想和品格的时代特色与进步意义。思想内容：通过简·爱和罗切斯特的爱情故事，揭露和批判了不合理的资本主义社会，热烈地表达了女性对独<\/p><p>立、平等和自由的强烈渴望。艺术特征：首先，现实主义与浪漫主义的统一。小说对社会弊端的深刻揭示，与对女主人公激烈丰富的感情世界的描写、表达结合在一起，饱含了强烈感情。其次，人物个性化特征突出，塑造了简·爱这个富于反抗精神的新女性形象。再次，小说故事性强，善于安排故事情节。第四，语言质朴无华，景物描写富有浓厚的地方色彩，具有哥特式小说的神秘性。最后，《简·爱》带有强烈的自传色彩。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《呼啸山庄》：思想主题：首先，作者展现了男女主人公心灵挣扎的历程，对他们的爱情悲剧给予了同情，揭露了冷酷的社会制度和门第偏见对纯真爱情的扼杀，以及由此造成的各种悲剧，表现了在资本主义社会里渴望爱情、友谊、知识的人们的孤独和绝望情绪。其次，通过两个庄园的没落，揭示了农村地主阶级走向衰亡的悲剧命运。与此同时，作者也陷入了个人反抗和个人复仇的局限。再次，作者还表现了文明与自然的冲突。呼啸山庄的凯瑟琳和希刺克厉夫代表了自然，而画眉山庄的林顿家庭则代表了文明。艺术特色：第一，体现出丰富的艺术想象力，对超越生死界限之爱情的表现感人肺腑，惊心动魄，对感情的描写又与独特的自然描写结合在一起，具有超越性、强烈性和诗性等特征。第二，具有复杂而独创的情节结构，利用不同层次的叙述人进行叙述，在不同时间和视角间进行切换，打破了线性的传统模式，体现出现代小说的特征。第三，塑造了性格鲜明的人物形象。作者笔下的人物都形象生动，有血有肉。第四，大量使用象征的手法，善于运用生动的场景和自然环境来渲染、营造具有象征性的气氛，揭示人物性格。第五，语言个性化。第六，表现出现实主义与浪漫主义相结合的特点。<\/p><div class=\"subsec\">（4）哈代<\/div><p>①作家概况：享有世界声誉的英国小说家和诗人，维多利亚时代后期最重要的小说家，被称为“一座屹立在19世纪和20世纪交界处的悲戚而刚毅的雕像”。其小说描写了在资本主义冲击下传统的威塞克斯农村社会崩溃，农民阶级毁灭的悲剧性命运。<\/p><p>②小说创作分期：早期小说描写田园理想、宗法制农村社会的传统风气，代表作有《绿荫下》、《一双蓝眼睛》、《远离尘嚣》和《贝姐的婚姻》。中期小说开始将笔触指向资本主义制度和伦理道德对宗法制田园社会的侵蚀，作品有《还乡》、《卡斯特桥市长》和《林地居民》。后期小说主要描写宗法制社会的农民在走投无路之后的悲剧性命运，代表作为《德伯家的苔丝》和《无名的裘德》。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪后期文学第8题<\/span>《德伯家的苔丝》的思想内容和主题：小说通过苔丝一生的悲惨遭遇，生动地再现了19世纪末英国南部乡村破产农民的悲剧性命运，无情地揭露了资本主义社会制度的罪恶，猛烈抨击了资产阶级虚伪的道德、法律、宗教和婚姻制度，由对资本主义社会的一般性描写转入到对这个社会进行全面而彻底的揭露、控诉和批判。《德伯家的苔丝》揭示了维多利亚时代资产阶级的伦理道德、宗教法律、婚姻爱情、教育制度和人际关系等重<\/p><p>大社会主题。首先，通过苔丝以及家人的不幸遭遇，表达了对英国南部宗法制乡村破产农民在资本主义入侵之下悲剧性命运的同情。苔丝一家的命运代表了英国南部整个农民阶级的命运，正是因为家庭沦入赤贫的状态，苔丝才不得不离开家，来到外地谋生，而这正开启了她的不幸之旅。其次，通过苔丝的不幸，控诉了资产阶级的虚伪道德。苔丝被诱奸，在资产阶级道德面前不仅没有获得同情，反而被看成一个淫荡的榜样，一个伤风败俗的罪人，遭到无辜迫害。再次，通过亚雷的恶行，揭示了宗教的伪善本质和资产阶级法律的反动。亚雷奸污了善良的苔丝，却没有受到道德谴责和法律惩罚，相反成为良心导师，当上了传道牧师。苔丝最后杀死亚雷，被资产阶级法律以维护正义的名义施以死刑，揭示了宗教和法律狼狈为奸，鱼肉破产农民的社会本质。最后，通过苔丝与克莱的爱情，揭露了资产阶级爱情婚姻的虚伪本质。克莱是一个封建婚姻的反叛者，他坚持要娶苔丝为妻。但是，一旦他知道苔丝失身，却无法摆脱封建爱情婚姻观念的束缚，陷入了虚伪的资产阶级道德泥坑。总之，这些社会主题的揭示，使得苔丝这一形象具有了更加广泛的代表性，也使得作家哈代对资本主义社会的批判上升到了本质的高度。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪文学第11题，朱版19世纪后期文学第8题<\/span>《德伯家的苔丝》中的苔丝形象：小说的副标题为“一个纯洁的女人”，女主人公苔丝是小说肯定和赞扬的对象，是哈代塑造的最优秀的典型形象之一，同时也是资本主义侵入农村、引起小农经济破产这一社会转型期的无辜牺牲品。首先，她是一个外在美与内心美相统一的女性形象，是美的象征。苔丝是一个美丽、纯洁、勤劳、善良的农村姑娘，在苔丝身上，作者集中概括了劳动人民的优秀品质，赞扬了她的勤劳、善良、感情真挚和心地纯洁。其次，她是一个具有高尚道德和强烈反抗精神的女性。她敢于反抗不公平的命运、宗教偏见和亚雷的胁迫。代表资本主义伪善道德、法律的亚雷，代表封建宗法制传统贞洁观念的克莱，将她美好的人生毁灭。但是，她从不自暴自弃，始终不向环境和命运屈服，具有鲜明的反抗精神。一旦她明确意识到自己的一生是被亚雷所毁时，就不顾一切地杀死了他。最后，苔丝的悲剧命运具有社会性，她是此时英国无数破产农民的代表。她的毁灭不仅是她个人的悲剧，也是时代的悲剧。通过苔丝的悲剧，作品控诉了黑暗的资本主义社会。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《德伯家的苔丝》中苔丝悲剧的原因：个人悲剧：苔丝自身性格也存在弱点，她过分夸大了失去贞操所带来的罪恶，使得她始终不能摆脱这种耻辱感。苔丝始终受到这种道德的谴责而无法自拔，最终走向毁灭。时代悲剧：首先，资本主义的“文明”侵入宗法制农村，给农民带来破产和贫苦的命运，这是造成苔丝悲剧的社会原因。其次，资本主义伪善的道德、法律，以及封建宗法制、传统贞洁观念，共同将苔丝推上断头台。命运悲剧：哈代受到古希腊命运悲剧的影响，认为人们在冷酷的现实面前无力摆脱命运的恶意捉弄。他笔下的苔丝和俄底浦斯一样，“不想服从命运，可又不得不服从，他斗不过命运”，表现了作者的悲<\/p><p>观主义和宿命论思想。<\/p><p>⑥《德伯家的苔丝》的艺术特点：首先，小说把握了时代氛围，表现出鲜明的民主主义倾向，拓展了悲剧观念并塑造了“圆形人物”。其次，景物描写极其出色，景物富有诗意，并跟人物命运的起伏、主题的揭示结合在一起。再次，心理描写生动，注重在矛盾冲突中刻画人物的心理、情感流程。最后，小说结构严谨。苔丝一生的几个阶段安排得井然有序，结构巧妙。<\/p><p><b>（5）<span class=\"starmark\">★<\/span>宪章派诗歌<\/b>：19世纪30、40年代，在英国宪章运动兴起的过程中，宪章运动者利用各种文学形式尤其是诗歌、歌曲等鼓动人们反抗资产阶级，宣传革命思想，这些诗歌被称之为“宪章派诗歌”。在内容上，它具有鲜明的政治倾向性和战斗性。在形式上，广泛采用歌谣体和圣诗体，通俗易懂，节奏明快，为广大群众所喜闻乐见。宪章派诗歌是无产阶级文学的萌芽。其诗人多为产业工人，琼斯、林顿和梅西为杰出代表。<\/p><p>（6）<span class=\"keymark\">☆<\/span>侦探小说：19世纪中期开始，侦探小说开始以连载的形式出现在杂志中，其中维尔基·柯林斯创作的作品尤其引人注目，他在爱伦·坡的影响下，继承了其小说人物和结构模式，但是予以发展，将短篇扩展为长篇，囊括进更多的社会内涵，也在叙事技巧上更趋复杂。其代表作为《白衣女人》。19世纪后期，柯南·道尔侦探小说的连载发表与相继出版，取得巨大成功。其侦探小说将知识性、社会性与审美性融合在一起，标志着英国侦探小说的高峰，也反映了此时通俗文学的广泛影响力。其作品后来汇集为《福尔摩斯探案集》。<\/p>", "star": 1, "key": 1}, {"no": 4, "title": "德国文学", "html": "<p><b>（1）文学概况<\/b>：①现实主义文学：以人道主义为创作思想的“青年德意志派”，具有现实主义倾向的作家海涅与毕希特，通过文学批判了封建君主专制和割据，也批判了资本主义发展过程中反映出来的弊端。②无产阶级文学：德国工人运动中涌现出来的文学，表达了无产阶级的立场和情感，以工人诗人维尔特为代表。<\/p><div class=\"subsec\">（2）海涅<\/div><p>①作家概况：在德语近代文学史上，堪称继莱辛、歌德和席勒之后最杰出的诗人、散文家和思想家。其早期创作使之成为德国浪漫主义的杰出代表，青年时代后期随着思想的成熟，开始向现实主义转变，并撰文批评德国浪漫主义，推动德国文坛风气的变化。其创作发展很好地折射了德国文坛由浪漫主义向现实主义的过渡，以及浪漫与现实在此时期的交融。<\/p><p>②创作分期：1819-1829年：在浪漫主义文学的影响下走上创作道路，创作的抒情诗体现了浪漫特色，主要作品为《歌集》。1830-1848年：流亡法国，为报刊撰写时评，结识马克思后，思想接近社会主义，诗歌创作达到高峰，写作了富有战斗精神的政治诗和讽刺诗，代表作为论著《论德国宗教和哲学的历史》和《论浪漫派》，诗歌《德国，一个冬天的童话》和《西里西亚纺织工人》等。1848年以后：其政治诗仍然反映了坚定顽强的斗争精神和对未来的信念，但抒情诗充满了彷徨和苦闷情绪，代表作为诗集《罗曼采罗》，通讯录《卢台奇亚》。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版19世纪现实主义文学第13题<\/span>《德国，一个冬天的童话》的思想内容：暴露和批判德国社会现实的黑暗，向人们传达社会革命的新思想，激励人们建设理想世界。其内容有四个方面：第一，对德国检查制度的讽刺。第二，对德国封建制度的憎恨。第三，对基督教会的批判。第四，对社会革命的预言。艺术特色：第一，浪漫主义与现实主义的高度结合。第二，采用游记作为全诗的结构形式。第三，抒情和叙事相结合。第四，多处采用直接对话的方式，使诗句生动活泼。第五，犀利的讽刺语言。<\/p><p>④<span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪中期文学第8题<\/span>《德国，一个冬天的童话》题解：《德国，一个冬天的童话》具有丰富的象征意义，作者通过童话般的故事，描写了德国社会的黑暗，揭露了封建反动政府的罪恶，指出了它的腐朽、没落以及必然走向灭亡的实质。就其题名而言，它表现了三方面的寓意。首先，就诗歌创作方式来说，诗作采用大量的童话和幻想故事，对德国丑恶、反动、腐朽的现实进行了辛辣的讽刺。其次，就诗歌表现的主题而言，通过“冬天”这个具有萧条与冷清的意象，代表了德国丑恶的社会现实，用“童话”来象征德国市民和统治者自欺欺人的幻想。童话只是反动势力企图掩盖罪恶本质的一个美好幻想，这种梦幻终究要破灭。就诗人对未来的憧憬而言，诗人表达了对新德国的期盼，相对黑暗的现实，美好未来起到了反衬作用，就像“冬天的童话”一样激励着人们。<\/p>", "star": 1, "key": 1}, {"no": 5, "title": "俄国文学", "html": "<p><b>（1）文学概况<\/b>：①俄国现实主义文学形成于19世纪30年代，50、60年代不断发展，70至80年代达到鼎盛时期。②俄国的民主主义文学批评的繁荣，捍卫了俄国现实主义文学批判社会的发展方向。③俄国现实主义文学具有很强的战斗性与很高的人民性，集中批判了俄国专制制度和农奴制度的腐朽，一些作品也揭露了资本主义发展过程中出现的社会问题。④出现了灿若群星的伟大作家，他们是普希金、莱蒙托夫、果戈理、别林斯基、冈察洛夫、车尔尼雪夫斯基、奥斯特洛夫斯基、涅克拉索夫、陀思妥耶夫斯基、托尔斯泰和契诃夫等。俄国现实主义作家也被称为“自然派”。<\/p><p><b>（2）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>自然派：<\/b>俄国19世纪中后期出现的批判封建专制和农奴制度的现实主义作家。19世纪30年代，果戈理创作了揭露社会现实黑暗的作品，这些作品被反动文人攻击为“自然派”，革命民主主义批评家别林斯基及时地予以了还击，撰文阐述果戈理小说的现实主义价值，指出了“自然派”文学跟人民的关系，捍卫了俄国现实主义文学的批判性和斗争性，继承了这一传统的现实主义作家就被称为“自然派”。他们极力忠实地描写现实，抨击腐朽的农奴制度和专制制度，同情小人物的悲惨命运。在体裁上，他们多采用叙事文学形式广泛而深刻地反映俄国社会现实。代表作家有果戈理、屠格涅夫、冈察洛夫和陀思妥耶夫斯基等。<\/p><div class=\"subsec\">（3）普希金<\/div><p>①<span class=\"srctag\">朱版19世纪初期文学第10题<\/span>作家概况：普希金被称为“俄罗斯诗歌的<\/p><p>太阳”，是俄罗斯浪漫主义文学的杰出代表，俄罗斯现实主义文学的奠基人。他将俄国文学从模仿法国、英国文学引向了民族化道路，并自觉以民主、自由的思想来指导自己的创作，其创作对俄国进步思想运动和革命运动产生了积极而深远的影响。<\/p><p>②文学分期：1825年前：杰出的浪漫主义诗人，写了大量的抒情诗、叙事诗、政治诗与讽刺诗，如《自由颂》、《致察尔达耶夫》、《高加索的俘虏》、《强盗兄弟》和《茨冈》等。1825年后：他的创作思想与创作形式发生了变化，主要创作带有现实主义倾向的文学作品，散文创作进入收获时期，主要作品有短篇小说《驿站长》、中篇小说《黑桃皇后》、长篇小说《上尉的女儿》与诗体长篇小说《叶甫盖尼·奥涅金》。<\/p><p>③<span class=\"keymark\">☆<\/span>《叶甫盖尼·奥涅金》的思想内容：通过描写叶甫盖尼·奥涅金和达吉雅娜等人的生活遭遇，诗歌反映了19世纪初俄国广阔的社会生活，揭示了十二月党人失败后尼古拉一世反动统治下青年的苦闷情绪，探讨了贵族知识分子的前途与命运问题，肯定了与人民密切联系的道路。因为它在反映现实生活的广泛与深刻方面取得的成就，而被别林斯基称为“俄罗斯生活的百科全书和最富于人民性的作品”。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪现实主义文学第15题，朱版19世纪初期文学第11题<\/span>《叶甫盖尼·奥涅金》的人物形象：奥涅金：是俄国文学史上第一位多余人形象。贵族青年奥涅金终日无所事事，整天在上流社会各种社交生活中周旋。他受到进步思想的影响，对上流社会感到厌倦，但是又缺乏坚定的信念和无畏的勇气，加之自视甚高，最终“永远不会站在政府方面”，同时也“永远不能够站在人民方面”，成为一个苦闷忧郁的“多余人”。奥涅金形象概括了19世纪初期俄国贵族青年的阶级和时代特征。通过这一形象，普希金提出了贵族知识分子脱离人民群众的社会问题。达吉雅娜：她是一个具有“俄罗斯灵魂”的迷人的艺术形象，正面回应了俄罗斯贵族青年与人民的关系问题。首先，她是一位具有平民色彩的女性形象。通过她的名字、她对家乡的热爱，诗歌体现了作家自己对俄罗斯祖国母亲的炽热之情，以及与普通民众的血肉联系。其次，她受到了进步思想的影响。达吉雅娜也受到先进思想的熏陶，喜欢理查逊与卢梭的作品，要求个性解放，憎恨上流社会的虚伪。她被奥涅金与众不同的气质所吸引，大胆表达爱慕之情。跟奥涅金不同，她跟俄罗斯乡村有着密切联系，而且还勇于承担责任，在自己的生活中践行道德理想。她最后拒绝了奥涅金的求婚，寻找忠于自己家庭的人生之路，表现出纯洁与高尚的品质。<\/p><p>⑤<span class=\"starmark\">★<\/span>《叶甫盖尼·奥涅金》的艺术特色：首先，开创了诗体长篇小说这一种特殊形式，将诗与散文有机地结合起来。其次，作品具有鲜明的抒情性，作品中出现大量的“抒情插笔”，直接抒发诗人的情感。再次，在再现社会生活的广度和深度上方面，在典型性格的塑造方面，在环境和场景的描写上都达到现实主义的水平。第四，在人物塑造上，善于运用对比的手法。第五，将诗和散文结合，既有诗的精练、含蓄，又有散文的流畅、朴素；独创了“奥涅金诗节”，全诗由四音步抑<\/p><p>扬格十四行诗构成的诗节完成。<\/p><div class=\"subsec\">（4）果戈理<\/div><p>①作家概况：俄国现实主义文学的奠基人，“自然派”的主要作家。他继承了普希金的现实主义文学传统，增强了对社会的批判与讽刺，推动了俄罗斯文学新时期的到来。<\/p><p>②创作发展：1831-1832年，他发表浪漫主义作品《狄康卡近乡夜话》，一举成名。《密尔格拉得》和《彼得堡故事集》的出版，标志着果戈理现实主义艺术手法和艺术风格的形成。1836年，他发表了讽刺喜剧《钦差大臣》，1942年创作了长篇小说《死魂灵》的第一部，抵达其创作高峰，同时也终结了其现实主义创作之路。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版19世纪中期文学第9题<\/span>《死魂灵》的思想内容：小说以骗子乞乞科夫收购死去农奴的户籍这一经历为主线，广泛描写了19世纪初俄国的社会生活，深刻地批判了唯利是图的新型资产者、腐朽没落的官僚阶层，以及作为农奴制支柱的贵族地主，揭示了农奴制的腐朽和行将崩溃的趋势。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪现实主义文学第16题，朱版19世纪中期文学第9题<\/span>《死魂灵》的人物形象：《死魂灵》描写了一系列地主形象，在揭示其共同具有的剥削、贪婪、寄生等阶级属性的同时，又刻画了几位地主的不同个性。玛尼罗夫是位外表“高雅可爱的地主绅士”，但实质上肤浅无能，毫无实际生活能力。女地主科罗潘契加善于理财，讲究实际，但愚昧迟钝、无知狭隘。罗士特莱夫吹牛、说谎，是一个厚颜无耻的流氓加恶棍式的无赖、地方恶少式的地主典型。索巴凯维奇是俄罗斯地主阶级中最顽固、最凶狠的代表，他既贪婪残忍，又精明狠毒，反映了贵族阶级的残忍本性和剥削性。泼留希金是守财奴和吝啬鬼的典型，他对财富的一味占有转变为对财富的巨大浪费，丧失了正常的人性，反映了贵族阶级的腐朽性。将五个地主串联起来的人物是乞乞科夫斯基，他是一个由贵族地主过渡到新兴资产阶级的典型。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版19世纪中期文学第9题<\/span>《死魂灵》的艺术特色：首先，平实逼真的细节描写。通过景物和人物环境的细致描写，小说真实地再现了现实生活，生动地凸显了几个地主的不同个性。其次，高超的肖像描摹技巧，塑造了典型化的地主群像。在揭示贵族地主共同的阶级属性和剥削本质之外，小说还通过描写每个人的外貌特征、生活环境与对乞乞科夫的接待，刻画了不同地主的个性。每一位地主都栩栩如生，惟妙惟肖。再次，“含泪的笑”也是其创作的一大特色。果戈理集中了专制制度和农奴制度的一切腐朽和堕落予以讽刺嘲笑，在笑声中扫荡了贵族阶级的特权与尊严，但是果戈理对祖国的命运和前途充满了关切和忧虑，在讽刺之中又蕴含了一定的悲剧色彩，形成了其独具魅力的讽刺艺术。最后，小说人物语言丰富多彩，且与个性相吻合。果戈理吸收了民间文学的滋养，广泛利用口语、方言、俚语和谚语等民间语言精华，赋予每一个地主以符合其身份与特征的个性化语言。<\/p><div class=\"subsec\">（5）屠格涅夫<\/div><p>①作家概况：19世纪俄国著名现实主义小说家、散文家和戏剧家，也是第一位获得欧洲认知的俄国作家。其创作的突出特征，在于敏锐地反映社会生活发展的新动向，主要作品有《猎人笔记》、《罗亭》、《贵族之家》、《前夜》、《父与子》、《处女地》和《散文诗》等。<\/p><p>②<span class=\"keymark\">☆<\/span>《猎人笔记》的思想内容：一方面展现了俄罗斯农民拥有的丰富的精神世界和创造力量，另一方面也表现出他们被奴役和被摧残的无权地位，表达了对农民的同情和对农奴制度的愤懑。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《父与子》的思想主题：通过“父辈”巴威尔和“子辈”巴扎罗夫之间不可调和的矛盾与斗争，小说浓缩地展示了俄国两种社会力量的冲突，即贵族知识分子组成的自由主义者和平民知识分子组成的革命民主主义者的社会较量。通过巴扎罗夫形象，屠格涅夫真实地表现出了代表社会进步力量的平民知识分子的时代特征，对其能力和作用予以了肯定，反映了作家的进步思想。但是，对于巴扎罗夫这类“新人”形象的革命理想和事业，屠格涅夫未能深入理解和认同，在描写其对“父辈”的胜利之后，又让其过早夭折，反映了作家自由主义思想的局限。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪中期文学第10题<\/span>《父与子》中的巴扎罗夫形象：巴扎罗夫是一个体现了俄罗斯时代特点的“新人”典型。首先，这一形象具有新的时代特征和进步意义。他出身于平民知识分子家庭，是一名医科大学生，他的身上呈现出新的阶级、思想和精神特征。他为人正直，拥有坚定的信仰和行动能力，满腔热情地献身科学，坚守着自己的阶级立场，仇视俄罗斯现存制度，蔑视贵族偏见，在思想和感情上与人民有着密切联系。在与代表贵族知识分子“父辈”形象的巴威尔展开争论、冲突和决斗中，巴扎罗夫的性格优点表现得十分突出，而且屡次打败巴威尔，反映了屠格涅夫意在表现“民主主义对贵族阶级的胜利”这一主题，体现了屠格涅夫对平民知识分子历史作用的正确认识。其次，巴扎罗夫形象不仅具有进步性，而且还具有真实性。屠格涅夫描写了这个人物形象的一些缺点，例如他盲目否定一切，以庸俗唯物主义的观点看待科学、艺术和大自然等，客观地反映了当时一些平民知识分子身上的一些不足。再次，从这一形象的塑造来看，也反映了屠格涅夫自身思想的局限。小说以巴扎罗夫感染病毒过早离开人世作为结束。巴扎罗夫最后的结局，表明作者对革命和革命前途都缺乏清晰的认识，一定程度上反映了屠格涅夫的贵族阶级立场。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>屠格涅夫长篇小说的艺术特色：首先，杰出的心理描写，使其长篇小说被称为“社会心理小说”。他善于通过人物行动来间接表现人物的内心活动，简洁而有余韵。而且他还能通过描写人物心理的时代特征，敏锐把握社会发展的脉搏。其次，浓烈的浪漫主义抒情氛围，使其现实主义被称为“诗意的现实主义”。其语言简洁，但含义蕴藉，心理抒写与景物渲染结合在一起，具有浓郁的抒<\/p><p>情色彩。再次，长篇小说具有简洁的特点。人物和情节的安排，语言的运用，都简洁而有韵味。最后，他创造了一种新的小说形式。他以中篇的篇幅承载长篇的分量，创造了综合诗歌、戏剧等多种文学形式为一体的长篇小说。<\/p><div class=\"subsec\">（6）陀思妥耶夫斯基<\/div><p>①作家概况：陀思妥耶夫斯基是俄国19世纪杰出的小说家，也是一位思想和创作极为复杂矛盾的作家。其对人性的深刻认识，以及其小说创作艺术的独特性，都使其创作更多地与20世纪现代主义文学联系在一起。其主要著有《穷人》、《两重人格》、《白夜》、《死屋笔记》、《罪与罚》、《白痴》、《卡拉马佐夫兄弟》和《群魔》等作品。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪中期文学第11题<\/span>小说的思想倾向与创作特色：思想倾向：陀思妥耶夫斯基的思想经历了巨大的变化，形成他充满矛盾的世界观，影响到其小说的思想倾向。一方面，他批判资产阶级贪婪、凶残的本性，揭露他们假民主、假自由与假平等的本性；另一方面，他又拒斥理性主义精神，宣扬忍耐、宽容的宗教思想，将俄罗斯的民族出路归结为宗教救赎。当然，他的宗教信仰不是宗教的迷狂，而是体现在人世的现实中，宣扬基督式的完全克己的慈悲博爱。创作特色：首先，在小说主题方面，陀思妥耶夫斯基一方面揭露资本主义的黑暗面，同情穷苦人民，具有人道主义思想；另一方面又反对暴力革命，主张用基督教宣扬的精神感化来缓和阶级矛盾。其次，在人物形象塑造方面，陀思妥耶夫斯基善于塑造社会底层人物，描绘这些“小人物”的病态心理，如《罪与罚》中的拉斯柯尔尼科夫的犯罪心理。最后，在小说艺术方面，其心理描写具有深度，擅长表现病态心理，小说结构呈现出复调小说的共时性特征。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪中期文学第12题<\/span>《罪与罚》的思想内容：首先，小说真实地展示了19世纪中叶俄国城市贫民的悲惨境遇，表现了作者对贫苦人民的深切同情和对地主、资产阶级罪恶的痛恨。其次，通过拉斯柯尔尼科夫信奉“超人理论”的失败，小说揭示这一理论的极端个人主义实质，进而否定了俄罗斯西化的社会道路和思想。再次，通过主人公的悲剧和救赎，作者宣扬了宗教思想和宗教伦理观念。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪中期文学第12题<\/span>《罪与罚》中的拉斯柯尔尼科夫形象：拉斯柯尔尼科夫是一个穷大学生，因交不起学费而辍学。他遇到陷入绝境的马尔美拉多夫父女，不甘做“平凡的人”。为了证明自己是“不平凡的人”，杀死狠心的高利贷老太婆。拉斯柯尔尼科夫是一个具有双重人格的形象。他既是个心地善良、乐于助人的穷大学生，又是一个有天赋与正义感的青年；同时他性格又有着病态的孤僻，有时候很冷漠无情。他接受了西方的“平凡人”和“不平凡的人”的理论，试图通过这种荒谬的理论作为反抗社会的借口，但杀人的负罪感使他陷入无法摆脱的内心恐惧。最后，他终于在索尼娅的规劝下皈依上帝，经过自首流放后走向新生。通过这一形象，作者否定了这种“超人”理论，揭示了其极端<\/p><p>个人主义的本质，强调了无视社会道德法律就会受良心惩罚的宗教伦理思想。但是，主人公最后皈依宗教，也宣扬了作者提倡的宗教救世的消极思想。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪中期文学第12题<\/span>《罪与罚》的艺术特色：首先，深刻的心理描写。作者善于描绘“人的内心的全部深度”，即通过内心独白、梦境的运用，描写和展示人物的自身感受和内心分析，无情地剖析人格分裂的主人公的病态心理。其次，不同意识和观念的激辩成为其描写的重要对象。再次，复调结构。陀思妥耶夫斯基善于让不同的人物、声音和观念彼此独立地表达，形成复杂的对话关系。<\/p><p>⑥<span class=\"keymark\">☆<\/span>《罪与罚》题解：首先，“罪”一方面是指小说主人公拉斯柯尔尼科夫的犯罪心理与行为。作品深刻细腻地揭示了他的一系列犯罪心理与犯罪理论，展示他一步步走向犯罪的道路。最后他杀死了高利贷老太婆及其妹妹，成为道德与法律上的罪人。另一方面，它也指资本主义社会的罪恶本质。资本主义社会的罪恶，使这些贫苦的人走投无路，最后走向犯罪。因而，资本主义是一切“罪”的根源。此外，“罚”首先是对拉斯柯尔尼科夫肉体与精神的惩罚。他遭到警察的追查，法院的审判，监禁与流放的惩罚。但更重要的是道德的审判和良心的谴责，使他受到内心痛苦的煎熬。其次，“罚”是主人公对社会反抗的象征，对黑暗资本主义社会的惩罚，如拉斯柯尔尼科夫杀死高利贷老太婆。但是，拉斯柯尔尼科夫最后受到宗教精神感化而走向新生，说明作者希望通过和平的感化来救赎人民，体现了作者宗教救世思想的局限，也削弱了“罚”的社会意义。<\/p><div class=\"subsec\">（7）托尔斯泰<\/div><p>①作家概况：托尔斯泰是俄国最杰出的现实主义作家，他被列宁称为“俄国革命的一面镜子”，是具有“最清醒的现实主义”的“天才艺术家”。其代表作有《战争与和平》、《安娜·卡列尼娜》和《复活》等。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪后期文学第10题<\/span>托尔斯泰主义：托尔斯泰不仅是一位杰出的文学家，还是一位伟大的思想家。他从青年时期起，就对道德完善非常感兴趣。在屠格涅夫揭露农奴制度黑暗的作品影响下，他离开大学，回到家乡进行改革。60、70年代，托尔斯泰思想发生激烈的矛盾冲突，经过痛苦思考，最后放弃贵族立场，站在宗法制农民一边，并从宗法制农民的角度彻底否定了专制制度和农奴制度。其系统的宗教、社会思想被概括地称为“托尔斯泰主义”，主要内容包括“勿以暴力抵抗邪恶”、“宽恕博爱”和“道德自我完善”。托尔斯泰主义的核心内容是宗教伦理观念，反映了他与俄国农民在思想上的联系。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪后期文学第12题<\/span>《复活》的思想内容：小说以贵族地主聂赫留朵夫为妓女玛丝洛娃伸冤而四处奔走为线索，全面展示了俄国社会从城市到乡村的现实生活，深刻地暴露了专制制度和农奴制度的黑暗腐朽，揭示了俄国社会生活的各种矛盾，猛烈抨击了沙皇俄国时代的一切国家制度、社会制度、教会制度和经济制度，彻底否定了地主土地占有制。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪后期文学第12题<\/span>《复活》的人物形象：聂赫留朵夫：<\/p><p>是一个“忏悔贵族”的典型形象，也是一个自传性的主人公形象。他本是一个纯洁善良、有理想和抱负的青年，但贵族社会的腐化习气侵蚀了他。当他在法庭上看到曾经被自己诱奸的玛丝洛娃之后，灵魂受到震惊，开始为玛丝洛娃四处奔走伸冤，所到之处，让他看到了整个统治集团的堕落反动。最后，聂赫留朵夫终于由一个“忏悔贵族”变成了所属阶级的猛烈抨击者。玛丝洛娃：是一个被侮辱与被损害的下层妇女典型。她原是一个半养女半侍女的女奴，与聂赫留朵夫相爱，但遭他诱奸，后被赶出家门。迫于生计，她沦落为妓女，而且以自暴自弃来表达自己的绝望。后来，聂赫留朵夫真诚的忏悔和帮助逐渐感染了她，其麻木的灵魂开始复苏。她在流放的途中结识了同行的政治犯，对革命者的思想和行为有了进一步的了解，从而在精神和灵魂上迎来了彻底的新生。小说通过她的不幸遭遇，集中地概括了受屈辱的人们在黑暗社会的共同命运，并且通过她的精神复活，表现了觉悟后的普通大众身上焕发出来的巨大的精神力量。总之，这两个人物的精神生活都经过了三个阶段：纯洁、堕落和复活。他们经历的精神复活过程，使得这部作品的主题具有了更加丰富复杂的内涵。从作家的思想来看，聂赫留朵夫的精神与生活变化使其具有了托尔斯泰思想代言人的地位；然而，作家对玛丝洛娃精神复活过程的描写，却使得这一人物更多地反映了作家现实主义创作观与方法的胜利，超越了作家自我思想的局限。在描写玛丝洛娃精神复活的过程中，作家最后让她在聂赫留朵夫和政治流放犯之间选择了后者作为自己的伴侣，完成了其精神、灵魂与思想的真正复活。这一选择违背了托尔斯泰自我的思想，但敏锐地感知了时代新的社会力量及其历史意义。从这个意义上来说，玛丝洛娃的复活才是真正的复活。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪后期文学第12题<\/span>《复活》的艺术特色：第一，社会全景小说。小说笔锋所及，俄国社会生活的方方面面无不遭到深刻揭露，从首都到外省，从城市到乡村，从贵族的府邸到农奴的茅舍，从法庭到监狱，呈现的是整个社会制度的腐朽堕落。第二，充满批判的激情。对社会罪恶的认识，让托尔斯泰采用大声疾呼的方式直接将自己的思想表达出来，作品具有宣言式的风格。第三，细致的心理描写。小说深入各种人物的内心，抓住思想感情的瞬间变化，披露人物的灵魂。第四，巧妙的结构。《复活》用聂赫留朵夫为玛丝洛娃伸冤奔走的方式，广泛而深刻地反映了俄国的社会生活，突出了重大主题。第五，重视细节描写，并通过这些细节描写不动声色地表达了作者对统治阶级的辛辣讽刺。<\/p><p>⑥<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《安娜·卡列尼娜》的思想内容：小说通过安娜和列文追求新生活这两条平行而又互相联系的线索，以史诗般的风格展现了农奴制度废除以后俄国动荡不安的社会生活，真实地反映了19世纪70年代俄国社会生活的复杂矛盾和时代特征，也体现了这个时期托尔斯泰思想的变化。安娜追求爱情的悲剧线索，反映了城市贵族的生活，批判了贵族社会的虚伪。列文进行改革失败最后在宗教中获得解脱的线索，反映了农奴制废除后俄国农村的动向，体现了托尔斯泰的社会思想。此外，在体现托尔斯泰的社会思想方面，这部小说尤其反映了托尔<\/p><p>斯泰这一时期的精神痛苦。在彻底转向宗法制农民的立场之前，托尔斯泰经历了非常痛苦的精神危机，这部作品写于他世界观激变的前夕，真实记录了托尔斯泰本人的精神探索，尤其是他的精神痛苦。列文体验到的改革失败的痛苦，对俄国现实的焦虑，很好地反映了托尔斯泰此一时期的思想特征。<\/p><p>⑦<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《安娜·卡列尼娜》的人物形象：安娜：是一个有着资产阶级个性解放思想的贵族社会的叛逆者形象，通过这一形象的毁灭，托尔斯泰批判了贵族上流社会的虚伪与堕落，同时也反映了托尔斯泰思想的局限以及他坚持现实主义创作原则的胜利。大胆追求有价值的生活和个性解放是安娜最鲜明的特点。她不仅外貌娴雅、端庄、自然而质朴，而且有丰富深刻的精神世界，强烈而真挚的感情，充沛的生命力和获得真正幸福的渴望，在思想道德和才智等方面，她都高于当时一般的贵族妇女。然而安娜的追求以悲剧告终。通过安娜的悲剧，托尔斯泰表达了对贵族上流社会的批判，同时，也反应了作者对安娜追求个人感情幸福的否定。托尔斯泰并不赞成安娜体现的个性自由的西方思想，但是在写作的过程中，他克服了自我思想的局限，将美丽的外表和丰富的精神世界赋予了安娜，并倾注了深刻的同情，通过安娜的抗争否定了上流社会，剖析了其悲剧的社会内涵，将其塑造成一个感人的女性形象，反映了其坚持现实主义创作原则的胜利。列文：“忏悔贵族”的典型，具有自传性色彩的主人公。跟安娜追求自身的幸福不同，这一人物形象更多地是在探索俄国社会的发展道路。对农奴制度改革后社会现实的不满，使列文力图避开资本主义发展模式，找到普遍富裕的道路。有感于自己的富足和农民的贫困之间的巨大差距，他主张与人民接近，合作经营，均分红利。他以这种“不流血的革命”，来抵制资本主义的侵蚀，但这样的社会主张不过是美丽的幻想，改革以失败告终，列文精神濒临崩溃，最后在宗教中获得灵魂的安宁。通过这一精神探索者的形象，托尔斯泰表达了自己的社会思想。列文的矛盾与痛苦，正是作家这一时期精神危机的反映。<\/p><p>⑧<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《安娜·卡列尼娜》中安娜悲剧的原因：安娜的悲剧命运是由多方面原因造成的。首先，封建社会和虚伪的道德习俗造成了安娜的不幸。她被姑母安排嫁给了一个比自己大20岁的省长，维持着冷漠的婚姻长达8年，这种门当户对然而没有感情的婚姻从一开始就决定了其不幸的根源。作为一名具有鲜明的叛逆精神的女性，对伏伦斯基的爱激起了她追求幸福生活的渴望，抛弃了没有感情基础的婚姻，公然跟情人伏伦斯基同居，向虚伪的道德习俗发起了挑战。安娜在封建专制社会里追求个性解放、感情自由，必然带来社会反对势力的反扑。伏伦斯基不能理解安娜的感情和精神需求，卡列宁为了体面而拒绝离婚，上流社会关闭了对安娜敞开的大门，走投无路的安娜选择了自杀，而不是回到卡列宁身边，或听任伏伦斯基的放纵，以自己的生命完成了对封建社会和习俗的最后也是最强烈的抗争。其次，安娜自我思想意识未能彻底解放，也成为其悲剧命运的内在原因。她无法从心理上彻底摆脱社会习俗和舆论对其行为的指责，常常产生“犯罪”的恐惧，加剧了其内心的矛盾和痛苦，只能通过自杀来寻求解脱。再次，托尔斯泰对安娜<\/p><p>追求个性解放的矛盾态度。在小说中，托尔斯泰揭示了安娜悲剧的社会性，对其不幸倾注了同情，将其塑造成一个感人的女性形象。但是，就托尔斯泰自身的婚姻观、价值观来看，他一直都不赞成西方的个人主义思想，反对女性抛弃家庭的责任，主张传统的女性观，所以，他给予安娜的命运结局是悲剧性的。<\/p><p>⑨<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《安娜·卡列尼娜》的艺术成就：第一，小说注重描述人物心理运动、变化的过程，体现了“心灵辩证法”的成熟。在描写列文的精神世界中，小说注重对其精神探索过程的追逐描写，有层次地展开其心理运动。在披露安娜的精神世界中，小说则突出其内心情感与心理矛盾的多重性与复杂性。而在具体的情节展开过程中，小说则善于捕捉人物瞬间心理的变化过程。第二，善于通过描写人物的外部特征来揭示其内心世界。作者常常利用眼神、动作来传达内心情感，揭示“被压抑的生气”。第三，小说通过内心话语的描写直接展示人物的内心世界。其内心话语常常表现出随机和跳跃的特征，使得其揭示的心理过程更加真实、复杂。第四，结构独特而严谨。小说叙事采用两条平行的线索展开，一为爱情，一为社会改革，但彼此构成内在的对照，揭示了主题。此外，小说利用安娜的哥哥奥勃朗斯基连接起两条线索，使这部描写了众多人物和事件的小说，在结构上构成了一个整体，被称之为“拱形结构”。<\/p><div class=\"subsec\">（8）契诃夫<\/div><p>①作家概况：俄国19世纪末叶最为重要的小说家和剧作家，有“短篇小说大师”之称。他的创作预示着俄国古典文学的终结，相对此前的俄国现实主义作家的创作而言，他的作品在批判俄国社会现实的同时，更多地传递了旧时代即将崩溃、新时代正在酝酿的时代特征，表达了对新时代的憧憬和迎接新时代的乐观情绪。<\/p><p>②创作历程：80年代走上文学创作之路，早期短篇小说创作成就最突出。早期短篇小说主要有《一个文官的死》、《胖子与瘦子》、《变色龙》等，讽刺了小人物身上的奴性。80年代中期，随着对社会认识的加深，其文学创作中抒情的忧伤色彩增强，《哀伤》、《苦恼》和《万卡》等为其代表作品。1890年之后，其创作批判社会的力度加强，对新时代的憧憬增加了创作的乐观情绪，小说《第六病室》、《套中人》，戏剧《樱桃园》等为代表作。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪现实主义文学第21题，朱版19世纪后期文学第13题<\/span>短篇小说的思想倾向和艺术特点：思想倾向：契诃夫早期的小说大多是一些逗人发笑的作品，其中也不乏具有深刻思想内容的佳作，嘲笑和揭露了专制制度的腐朽以及小市民的奴性意识，同时也表达了对劳动人民的同情。1890年，他前往流放地库页岛，思想发生了很大的变化。他看到了人们的悲惨生活，对黑暗现实的揭露也更为深刻。他批判了托尔斯泰主义，知识分子以及小市民的庸俗丑恶。但是，作者在其小说中也流露出悲观的情绪，对未来充满期望却不能指出一条正确的道路，缺乏反抗精神。艺术特点：第一，善于选取日常生活中习以为常的人和事，尖锐地提出社会问题，深刻揭示蕴含的哲理，鞭挞庸俗的习气。第二，高度的简洁性。他的小说短小精悍，结构精巧，安排得当，擅长运用开门见山的<\/p><p>手法进入故事，不拖泥带水，结尾具有开放性，留下想象的空间。此外，其小说情节单一，没有多少离奇曲折的故事线索，也没有大起大落的跌宕情节。在描写人物方面，作者选择最有代表性的细节，不在外形描写上多花笔墨，而多是在心理与性格刻画上下功夫，使其小说具有心理抒情小说的特点。语言简洁生动，朴实凝练。第三，幽默的笔调，具有悲剧性和喜剧性相结合的特点。善于运用“含泪的笑”的讽刺，通过漫画式的夸张以及对比手法，一针见血地揭示人物性格，达到讽刺的目的。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《樱桃园》的多层内涵：理解《樱桃园》的丰富内涵，必须认识到“樱桃园”形象丰富的象征意义。戏剧的基本情节围绕“樱桃园”而展开。女主人公朗涅夫斯卡娅从巴黎回到家乡处理自己的庄园樱桃园，她不想采纳商人罗巴辛的建议将之改成别墅出租，但其拍卖后买下樱桃园的正是罗巴辛，可想而知它最后的命运。戏剧结束的时候，远处隐约传来的，正是砍伐樱桃树的斧头声。“樱桃园的易主与消失”成为这一戏剧丰富内涵生成的核心。首先，酝酿于19世纪末期问世于20世纪初期的《樱桃园》，以“樱桃园”的形象，生动地表现了革命前夕贵族阶级的失落与忧伤。其次，在平民知识分子特罗菲莫夫和安尼雅看来，从伐树的斧头声中传达出新生活的脚步。再次，在普遍的意义上，主人公童年生活的“樱桃园”具有精神家园的意义，它的消失象征着一个熟悉、温馨的世界的失去，在人们心中勾起的是面对新时代那种喜忧参半的复杂情感。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪现实主义文学第22题，朱版19世纪后期文学第14题<\/span>契诃夫的戏剧创新（艺术成就）：首先，他将诗歌的抒情性、小说的叙述性编织进戏剧的机体中，将象征主义等现代主义表现方法融入现实主义中，不仅对俄罗斯戏剧的发展作出了贡献，而且在戏剧创作方面表现出了对传统现实主义的超越，流露出20世纪现代主义意识。其次，契诃夫戏剧冲突模式以“人与环境的冲突”取代了传统的“人与人的冲突”，不仅表达了对当时俄国社会的批判，而且还表现了因与环境冲突而造成的精神痛苦，具有普遍性意义，使得其戏剧超越了具体时空的束缚，得到了更多观众的认可。最后，他的戏剧语言朴实无华，寓意深刻，优美凝练而富于哲理性。<\/p>", "star": 1, "key": 1}, {"no": 6, "title": "美国文学", "html": "<p><b>（1）文学概况：<\/b>①美国现实主义文学到19世纪80年代才真正形成，它是在19世纪50年代废奴文学的基础上发展起来的，主要作家有希尔德列斯、斯托夫人、马克·吐温、亨利·詹姆斯、弗兰克·诺里斯、斯蒂芬·克莱恩、欧·亨利和杰克·伦敦等。②美国的现实主义文学常常从民主主义理想出发批判资本主义的罪恶，揭穿“美国梦”的虚幻色彩，反映劳动人民的不幸，具有较强的民主性和人民性。<\/p><p><b>（2）马克·吐温<\/b><\/p><p>①作家概况：马克·吐温是美国后期现实主义文学的卓越代表，著名的幽默讽刺小说家，美国文学史上第一位用美国口语写作的作家，其创作标志着美国民<\/p><p>族文学的成熟。他以清醒的现实主义，揭露了美国民主政治的真相以及金钱的腐蚀作用，抨击种族歧视的社会现实。<\/p><p>②文学分期：1870年以前：继承了美国西部幽默文学的传统，写作的作品大多讽刺美国民主制度的欺骗性，反对种族歧视，代表作有《竞选州长》、《哥尔斯密的朋友再度出洋》和《傻子出国记》。70-90年代：创作的鼎盛时期，尖锐的讽刺、无情的揭露是这一时期的主要特点。这一时期的主要作品有《镀金时代》、《汤姆·索亚历险记》、《败坏了赫德莱堡的人》和《哈克贝利·芬历险记》等。晚期创作：主要创作游记、杂文和政论，在内容上倾向于批判帝国主义扩张政策和行径，主要作品有游记《赤道环游记》和政论《给坐在黑暗中的人》。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版19世纪现实主义文学第24题，朱版19世纪后期文学第15题<\/span>马克·吐温的幽默风格：马克·吐温是19世纪美国最杰出的幽默家、讽刺家，他的幽默是典型的美国式幽默，有着不对称、夸张、反传统的特征。他早期的作品表现了幽默的特点，但往往缺乏深刻的思想内涵，只是停留在逗笑取乐的层面上。随着对美国社会生活的深入了解，其后期作品的幽默常常与讽刺结合在一起，具有强烈的现实批判性。他的幽默包含着滑稽诙谐的笔调，常常运用漫画式的夸张手法，既揭露现实，也富有哲理意味，又具有强烈的艺术感染力。首先，他的作品情节具有奇特的幽默讽刺特点。马克·吐温善于通过故事情节的巧妙设置而达到幽默讽刺的效果。他小说的故事看上去离奇，但是在现实生活中却非常真实。通过这种违反生活逻辑的情节，其小说真实地反映了生活的本质，也具有了一种幽默讽刺效果。其次，他笔下的主人公常常为天真单纯的老实人，其单纯的思想跟复杂的现实之间的落差，常常是幽默产生的关键。再次，他的作品语言妙语连珠、涉笔成趣，形成了他独特的幽默讽刺风格。他的语言机智、风趣，具有密西西比河地区浓郁的口语特征，包含有一些生活笑话、喜剧情节等，妙趣横生，韵味无穷。最后，因为坚信民主主义思想，他的幽默在嘲讽的同时，又带有乐观的色彩。<\/p><p>④《哈克贝利·芬历险记》的思想内容：作为美国现实主义文学的代表作家，马克·吐温用自己的笔和作品对美国社会的现实加以揭露和批判。他通过哈克贝利·芬这个富于正义感和叛逆精神的儿童形象来观察美国社会，以幽默、讽刺的笔触展示了19世纪丰富多彩的社会画面，表达了对美国社会问题的深刻思考。他批判了美国政治，传统的教育方式，种族歧视，资本主义道德观，人性的堕落，以及宗教和传教士的虚伪。同时，小说也包含了作者希望实现人人平等、自由的民主理想，表现了美国民族无拘无束、勇于开拓进取的时代精神。<\/p><p>⑤<span class=\"keymark\">☆<\/span>《哈克贝利·芬历险记》的人物形象：哈克：一个聪明、质朴、有正义感、富于冒险精神的少年，是具有民主精神的美国下层人民的典型。他不是为了体验浪漫的冒险而出逃，而是为了获得身心的自由，从现实的束缚中摆脱出来，从而经历种种艰险。此外，在逃亡的过程中，他与黑奴吉姆相依为命，帮助吉姆获得自由。他以平等的态度对待吉姆，虽然担心自己违背法律，但逃亡中对吉姆的<\/p><p>认识、两人建立的友谊让他下定决心帮助吉姆。吉姆：是一个善良、敢于反抗压迫的黑奴形象。跟以往被丑化的黑奴形象不同，吉姆形象真实而生动。首先，他敢于反抗压迫，为了摆脱被贩卖的命运，从主人家逃走。其次，他具有丰富的精神世界和善良的优秀品格。在种族压迫制度化、合法化的年代，这个形象的出现是非常重要的，它反映了作者反对种族歧视的进步倾向。<\/p><p>⑥<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版19世纪现实主义文学第23题<\/span>《哈克贝利·芬历险记》的艺术成就：首先，作者把现实主义的精雕镂刻与浪漫主义的热烈抒情结合在一起，把人物心理的真实描写和幽默风趣的夸张融为一体。其次，小说采用第一人称叙述手法，以孩子般的视觉与口吻观察社会、叙述现实，形式活泼，感情真切。再次，人物形象的塑造鲜明生动。作者细腻生动地展示了哈克与吉姆的心理特征，揭示了哈克的内心矛盾。第四，情节生动曲折，结构富有个性，作者以感情来支配整个叙事，并且以密西西比河来串联历险故事，使叙事结构严谨而不显得散漫。最后，小说语言流畅、准确，具有口语化的特点。他的语言保持了美国西部口语的幽默讽刺特点，大量采用了美国南方方言、黑人俚语，显得生动、朴实、平凡，而且具有浓郁的美国特色。<\/p>", "star": 0, "key": 1}, {"no": 7, "title": "北欧文学", "html": "<p><b>（1）文学概况<\/b>：北欧现实主义文学是在西欧现实主义文学的影响之下发展起来的，形成于18世纪40、50年代，文学成就较大的国家有丹麦、挪威等。丹麦的主要作家和文学评论家分别是安徒生和勃兰兑斯，挪威的主要作家是易卜生。<\/p><div class=\"subsec\">（2）易卜生<\/div><p>①作家概况：欧洲近代现实主义戏剧的杰出代表，被誉为“现代戏剧之父”。他站在民主主义的立场上，批判了资本主义制度及其道德观念，将戏剧作为介入社会、讨论社会问题的手段，把现实主义创作原则与方法扩展到了戏剧领域，一扫欧洲戏剧舞台陈腐庸俗的风气，革新了欧洲戏剧艺术，推进了其现代化进程。易卜生毫不妥协的批判精神、成熟的戏剧艺术影响到萧伯纳和詹姆斯·乔伊斯等现代戏剧家和作家。<\/p><p>②文学分期：1850-1868年：浪漫主义戏剧时期，取材挪威历史与传说，宣扬爱国主义思想。1869-1890年：社会问题剧时期，反映资本主义社会的道德、法律、教育和妇女解放等问题，主要作品有《社会支柱》、《人民公敌》、《玩偶之家》和《群魔》等。1891-1906年：象征主义戏剧时期，对人的灵魂拷问加强，感伤和神秘色彩浓厚，主要作品有《野鸭》和《当我们的死者醒来的时候》等。<\/p><p>③易上生主义：文学革命的发起者胡适最早给易卜生剧作的思想冠以“易卜生主义”的名号，并且在《易卜生主义》一文中对其进行了明确的诠释。他将易卜生主义概括为两方面的内容：一是“写实主义”，敢于反抗社会、反抗传统、反抗世俗偏见的现实主义战斗精神；二是主张人的“内向”解放，树立“健全的个人主义”人生观。我国著名的易卜生研究专家王忠祥教授将易卜生主义定义为一种易卜生式的人道主义，并且认为易卜生主义是一种审美的人文主义，充满了审美的乌<\/p><p>托邦的伦理道德理想，代表了挪威小资产阶级的激进性、开创性和独立性，体现了“自由农民之子”的精神特性以及时代要求。作为“自由农民之子”的代表易卜生一方面运用人道主义思想武器批判封建残余思想和大资产阶级当权派的贪婪专横，另一方面凭借个人的精神反叛去追求个性彻底解放的理想世界，其思想既反映了挪威进步的小资产阶级的积极性，也折射了他们的局限性。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪现实主义文学第25题<\/span>《玩偶之家》的女性主义思想（娜拉形象分析）：《玩偶之家》中的女性主义思想主要是通过娜拉这一形象表现出来的。通过对娜拉形象的塑造，作者提出了现代家庭中的妇女平权问题。旧观念认为女人是男人的附属品，女性没有独立的经济地位，持有这一思想的海尔茂严重控制了娜拉的自我发展。为了取悦海尔茂，娜拉不得不表现得像一个被宠坏的小孩，一个需要保护的弱者，一个温柔、顺从的妻子。最后，娜拉终于在觉醒中离家出走。她用实际行动表明了经济独立的要求和女性自我意识的觉醒，对以海尔茂为代表的父权思想的维护者，给予重重一击。娜拉的出走并不是一时的冲动，而是建立在她对海尔茂言行背后父权思想的清醒认识上，回应着激进的女权主义主张。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《玩偶之家》的艺术特色：首先，戏剧题材与情境的创新。易卜生突破传统的爱情题材，将社会日常生活搬上舞台，深化了戏剧的现实主义倾向，体现了“社会问题剧”的特点。第二，把讨论带入戏剧中，起到干预生活的作用。易卜生没有简单地沿袭传统的写作方法，而是创造性地运用了“讨论式”的艺术手法，“提出并且试探讨论对于观众有切身关系的品性和行动问题”，为整个剧坛带来了新的气息，为整个戏剧注入了新的血液。第三，戏剧冲突波澜起伏，情节精炼，结构严密。易卜生善于采用“连锁式”的冲突和“追溯回顾法”来安排情节，巧妙地运用了“突转”与“发现”技巧。他将复杂的生活矛盾浓缩在精炼的情节中予以表现，常常将剧情安排在矛盾发展的高潮，使得戏剧冲突既激动人心，又能有条不紊地深入展开。第四，他笔下的人物性格突出，心理刻画细腻生动。第五，语言独特，富有表现力和动作性。人物的语言都符合人物的性格和身份以及剧情的发展需要。同时，他擅长通过人物带有动作性的语言，去表现人物的喜怒哀乐，展示人物心理的微妙变化。<\/p><p>⑥易卜生与中国：首先，中国现代戏剧的兴起跟易卜生有着密切关系。正是在易卜生这样的戏剧家的启发下，富有现代意义的戏剧才开始涌现。其次，易卜生对中国知识界的影响越过了戏剧，进入到思想文化领域。早在五四新文化运动时期，胡适在《新青年》编辑出版了“易卜生”专刊，并撰写文章推介“易卜生主义”，呼吁人们像易卜生社会问题剧中的主人公那样敢于向腐朽的社会发出抗争，大胆揭露社会的弊端。鲁迅对“娜拉走后怎样”的设问，以及由此而引发的广泛讨论，不仅推动了对女性解放实质的思考，而且还加深了对易卜生思想的深入理解。<\/p>", "star": 1, "key": 1}]}, {"chapter": "第八章", "title": "19世纪自然主义和其他文学流派", "link": {"quiz": "外国文学史习题_分章刷题.html#d7"}, "mindmap": 1, "kps": [{"no": 1, "title": "自然主义", "html": "<p><b>（1)19世纪自然主义文学产生的社会历史背景<\/b>：19世纪下半叶，欧美资本主义开始从自由资本主义向垄断资本主义过渡。同时，法兰西第二帝国不断发展壮大，进行殖民扩张和对外战争，激化了社会和民族矛盾，最终爆发了普法战争。此外，工人阶级壮大，在社会主义思潮和工人运动的影响下，1871年巴黎公社产生。思想基础：随着时代的进步和科学的不断发展，遗传学和决定论等自然科学取得了巨大成就，并对社会产生了普遍影响。实证主义哲学在此环境中产生，它要求文学艺术探索人，认为个人的社会性由生理条件所决定，为自然主义文学提供了哲学支撑。文学自身的发展演变：19世纪后期出现的自然主义文学是法国19世纪现实主义文学发展的结果。19世纪中期法国现实主义文学中就出现了以福楼拜为代表的作家，他们追求客观公允的叙述，要求中立，<\/p><p>反对表露作家的主观感情与价值评判。在自然科学成就和实证哲学的支撑下，这一文学倾向在19世纪后期进一步发展，就出现了科学精神更加突出的自然主义文学。<\/p><p><b>（2）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>自然主义<\/b>：19世纪后期至20世纪初期在法国兴起，后波及到欧美各国的文学思潮。自然主义文学在实证主义哲学和进化论、遗传学与决定论等自然科学的影响和启发下产生，以真实描写客观现实和人性、人的机体为目的；主张超越政治和道德，以遗传学和生理学原理去解释人的行为与社会现象；要求作家不介入，不作价值评判，对社会进行冷静客观的、照相实录式的描写。自然主义文学在创作中使用科学的观察方法和实验方法，把人等同于一般生物，重视生理作用和遗传性问题，偏离了文学的独立品性，有时过于拘泥于细节真实，而失去了反映社会的典型性、深刻性和广泛性，充满了宿命论思想和悲观色彩。其理论倡导者为左拉，代表作家有左拉、龚古尔兄弟和莫泊桑。<\/p><p>（3）<span class=\"srctag\">郑版19世纪自然主义和其他文学流派第1题，朱版19世纪后期文学第<b>3题<\/span>理论主张<\/b>：①泰纳奠定了自然主义文学的理论基础。他将孔德的实证哲学运用于文学批评之中，提出了“种族、环境、时代”三要素的观点，要求文学创作从这三个方面研究和描写人。泰纳过分强调了人的种族因素，而忽视了人的社会属性与阶级属性。②自然主义理论的确立开始于左拉。他于19世纪80年代，发表了《实验小说》和《自然主义小说家》两部论文集，将自然主义文学推向高潮。在以左拉为代表的自然主义作家看来，文学创作的目的是“科学研究和科学课题”，作家要从生理学尤其是遗传学角度来寻找、表现人物行动和命运发展的原因；创作要引入科学方法，要进行扎实细致的实地考察和认真的调查研究，才能达到科学的精确性；叙述要追求客观、中立的风格，“不要夸张，不要强调，只要事实”。<\/p><p>（4）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪自然主义和其他文学流派第1题，朱版19世纪后期文学第3题<\/span>基本特点：思想特点：①它上承法国现实主义文学的基本原则，将真实和客观性视为文学创作的首要条件。②自然主义接受了巴尔扎克以描写一段历史时期来反映整个社会的成功经验，以再现家族史的方式来创作多卷集作品，不仅反映了新的社会现象，而且这些作品汇集起来也客观地再现了19世纪后期法国的社会现实。③从生理学，尤其是遗传学角度去理解、描写人物行动和命运发展的原因。艺术特点：①巨细无遗地描绘现实，排斥想象，具有一种实录生活和照相的特征。②擅长描写群众场面，注重群体的写照；忽略典型的创造，或只追求人物的气质特点以及与生理、病理的关系。③淡化情节，不追求戏剧性的变化，按生活的“本来面目”反映现实。④将某些压迫人、扭曲人的社会现象拟人化，从而描写物对人的异化，将矿井和火车等描写成吞噬人的怪物，显得生动形象。<\/p><div class=\"subsec\">（5）左拉<\/div><p>①<span class=\"srctag\">朱版19世纪后期文学第4题<\/span>作家概况：左拉是自然主义文学的理论家和代表作家。他创作了《卢贡-马卡尔家族》，反映了“第二帝国时代一个家族的自然史和社会史”。左拉的创作跟其自然主义文学理论和创作观念并不完全重合，部分作品超越了自然主义，而达到了现实主义文学的高度。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪自然主义和其他文学流派第3题<\/span>《卢贡-马卡尔家族》的思想内容：《卢贡-马卡尔家族》包括20部长篇小说，描写了法国“第二帝国时代一个家族的自然史和社会史”。第一，作为一部自然史，小说反映了一个家族的“血统和环境的问题”。小说以阿黛拉伊德·富克先后与卢贡和马卡尔生活而留下的后代子孙为血缘线索，描写各自后代的生活，表现了不同的遗传基因对他们生活和不幸命运的影响。第二，作为一部社会史，小说表现了第二帝国的始末和盛衰的过程。小说以第二帝国时代为背景，描写了卢贡-马卡尔家族5代人的生活，通过这个家族的变迁，将与这个家族盛衰紧密相连的历史反映了出来，表现了政治动荡、社会变革环境下的经济状况和社会状况。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版19世纪自然主义和其他文学流派第3题<\/span>《卢贡-马卡尔家族》的艺术特色：第一，善于描写群体以及群体性的行动，如罢工工人、军队行进、争购的顾客群、热闹聚会等大场面，淡化人物性格的描写和典型人物的塑造。第二，擅长精细入微的描绘，在描写客观世界上力求纤毫毕现，开20世纪新小说描写物的先河。第三，左拉对生活充满美好的期望，行文中往往流露出强烈的感情，并且喜欢运用象征，使其作品具有一定的抒情色彩。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版19世纪后期文学第5题<\/span>《萌芽》的思想内容：首先，第一次在文学上生动地描写了资本主义社会的主要矛盾，生动地再现了资产阶级与无产阶级之间你死我活的尖锐斗争。小说以煤矿工人作为主人公，描写了他们的生活，尤其是他们组织的罢工。通过展现工人们恶劣的工作条件和非人的生活环境，小说揭示了罢工的经济、政治原因，暴露了资本主义社会普遍存在的社会问题。其次，小说第一次正面描写了工人的集体罢工。小说描写了2500名矿工在普鲁东思想和马克思主义学说的影响下，在国际工人联合会领导和支持下自觉组织起来，进行罢工。他们破坏矿场、包围煤矿公司，同政府派来镇压的军警展开浴血奋战，虽然最后难逃失败的结局，但工人的觉悟和能力在斗争中都得到了提高，在先进思想的武装下他们对未来充满坚定信念，以自己的斗争唤起了全法国的工人。再次，作品展现了工人阶级的集体力量，赞美了他们大公无私、团结一致和英勇搏斗的精神。小说描写煤矿工人和家属们团结一致，跟资本家、公贼和军警作斗争，并联合其它矿山的工人，共同组织罢工。在斗争中，他们一边罢工，一边开展互相救济的工作，显示出训练有素的组织能力和团结协作的社会主义精神。最后，小说表达了对未来的美好期盼。小说以“萌芽”为题，意为工人阶级<\/p><p>已经觉醒，他们的力量将像破土的种子一样茁壮成长，摧毁剥削人的资本主义制度，建立起一个更加公正、美好的世界。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版19世纪后期文学第5题<\/span>《萌芽》的人物形象：马赫是逐渐觉悟的优秀矿工的代表。他正直善良、吃苦耐劳、乐于助人，得到了同伴的尊敬。在工人运动领袖的影响下，他的思想开始觉悟，参与到工人斗争之中。在斗争中，他的觉悟得到了逐步提高，由普通的工人成长为坚强的战士，最后在罢工中献出了自己的生命。马赫的性格发展，典型地反映了工人阶级在先进思想的影响下成长壮大的历史过程。马赫嫂是一位普通的家庭妇女，但成长为一名有觉悟的坚强战士。她勤劳、朴实，曾对资本家抱有一定的幻想，在先进思想的影响和严酷斗争的教育下，她对罢工和资本家的认识发生了巨大变化，抛弃了对资本家仁慈的幻想，由反对丈夫参加斗争，转变到自己投身其中。为了支持罢工，她变卖仅有的一点家当，在斗争失败和亲人相继离开人世的打击面前，仍然表现出坚强的意志，顽强地生活下去，坚信复仇的日子终将到来。艾蒂安是早期工人运动的领袖。作为矿工的一员，艾蒂安对工人阶级的不幸感同身受，对资产阶级充满了仇恨，并且积极探索革命道路，在大量阅读各种理论著作之后，成为社会主义思想的信仰者。在组织工人罢工的过程中，他一边组织罢工，一边建立互助基金，与“第一国际”保持联系，同时，他勇敢坚定，富于自我牺牲精神，表现出一名工人运动领袖的思想和精神品质。但是，他对革命和社会主义的理解过于简单，加上个人主义思想仍然挥之不去，在革命失败后，他放弃了暴力斗争，选择了合法的斗争形式。艾蒂安既反映出工人运动领袖的优秀品质和思想特征，也暴露了早期领导者身上存在的一些局限，同时也反映出左拉还没有真正理解马克思主义和无产阶级革命运动的实质。<\/p>", "star": 1, "key": 1}, {"no": 2, "title": "唯美主义", "html": "<p><b>（1）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>唯美主义<\/b>：唯美主义是19世纪中后期在法、英等国流行的一种文艺思潮，最初产生于绘画领域，后来扩展到诗歌、小说和戏剧领域。唯美主义作家痛恨资本主义的功利哲学和市侩习气，针对“为金钱的艺术”和“为人生的艺术”，而提出“为艺术而艺术”的文艺主张。唯美主义认为艺术不应反映生活，无需顾及道德，艺术“具有独立的生命”，要追求纯粹的美。唯美主义的作品在艺术上讲究辞藻、韵律，重视对静物的描绘，形式较为精致。唯美主义在文学上开拓了美的领域，扩大了文学表现的范围，其对形式美和美感独特性的强调，具有一定的参考价值，并对20世纪现代主义文学产生了直接影响。但它过分强调美的纯粹性，割裂了形式与内容、艺术与生活的联系，阻碍了自身的进一步发展，致使其在19世纪90年代就走向沉寂。英国的佩特、王尔德和法国的戈蒂埃等都为其倡导者和实践者。<\/p><p>（2）【郑版19世纪自然主义和其他文学流派第2题，朱版19世纪后期文学第<\/p><p><b>2题】理论主张<\/b>：①艺术高于生活。唯美主义认为，不是艺术反映了现实，而是现实反映了艺术；现实社会是丑恶的，只有美才有永恒的价值；艺术家不应带有任何功利主义的目的，也不应接受道德标准的约束。②为艺术而艺术。对于唯美主义而言，文艺应脱离政治、道德、社会而“自治”，要超越任何的功利目的，才能实现纯粹的美。创造美，是艺术应该追求的唯一目的。③形式之美是纯粹美的体现。唯美主义提出“形式是一切”，重视艺术形式的美，着力探讨诗歌与音乐、绘画的关系，锤炼文学的表现形式。<\/p><p>（3）<span class=\"srctag\">郑版19世纪自然主义和其他文学流派第2题<\/span>发展状况：①康德哲学，是西方唯美主义的直接滥觞。康德提出了“无目的之合目的性”的美感学说，强调美感的主观性、无功利性和纯粹性，为唯美主义奠定了坚实的理论基础。②19世纪30年代，法国诗人戈蒂埃提出了唯美主义文艺理论，首倡“为艺术而艺术”的口号，反对艺术的功利目的，并在诗歌创作中努力实现自己提出来的文艺主张。60年代，唯美主义在法国形成第一次高潮。巴那斯派出现，他们的影响和创作实绩进一步拓展了戈蒂埃的工作。其参与者认为艺术的最高任务是实现美，艺术独立于真理、功利和道德。③19世纪40年代开始，唯美主义在英国逐渐形成一定的声势，并在80至90年代抵达第二次高峰。作家罗斯金为英国的唯美主义奠定了理论基础，指出美的理想就是道德的目的。文艺理论家瓦尔特·佩特系统地提出了唯美主义文艺理论，指出艺术美脱离现实，是孤立的、独特的。作为佩特学生的王尔德则将其接受的唯美主义文学理论和批评思想创作化、生活化，并提出了美高于生活的观点。王尔德的文学活动，代表了唯美主义发展的高峰，但随着他的入狱，其创作走向停滞，唯美主义也日趋沉寂。<\/p>", "star": 1, "key": 1}, {"no": 3, "title": "前期象征主义", "html": "<p><b>（1）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>象征主义：<\/b>象征主义文学是19世纪70年代至20世纪40年代在西方出现的现代主义文学流派，它是西方现代主义文学中出现最早，持续时间最长的一个流派。象征主义文学的发展分为两个阶段，19世纪70年代至90年代为前期象征主义，20世纪初到40年代，为后期象征主义。1886年让·莫雷亚斯发表了《象征主义宣言》，标志着象征主义的诞生。象征主义注重借助外在的具体事物，挖掘内心世界，赋予抽象观念以有声有色的物质形式，大量运用联想、暗示与通感，追求诗歌的神秘性与音乐性。兰波、魏尔伦和马拉美为早期象征主义的代表诗人。<\/p><p>（2）<span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪自然主义和其他文学流派第2题，朱版19世纪后期文<b>学第2题<\/span>思想艺术特点<\/b>：思想上：认为精神世界和自然世界互相应和、互相沟通，诗人的任务就在于挖掘自然与人之间的契合关系和内在联系；表现出对现代资本主义文化深切的危机意识，试图通过艺术来超越平庸、虚假的社会现实和堕落、浅薄的文化。艺术上：第一，大量描写城市中的丑恶现象和忧郁的情绪，化丑为美，丑中见美。第二，善于运用通感、暗示和象征手法，以具体意象去反映抽象<\/p><p>事物，并升华为哲理，充满了神秘色彩。第三，追求诗歌的音乐效果，诗画结合，在语言和韵律上精益求精，在诗歌形式上追求简练精粹、工整优雅。<\/p><p>（3）<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版19世纪自然主义和其他文学流派第2题<\/span>发展状况：①象征主义的发端可以追溯到美国诗人爱伦·坡那里，而波德莱尔在19世纪中期的文学活动则开启了象征主义在文学思想和表现方法方面的探索，成为这一文学潮流的先驱。波德莱尔将都市的丑恶纳入了诗歌表现范围，从中发掘美，传达了对资本主义文化的失望情绪。他提出了“通感”说，指出人与自然、物质与精神、人的各种感官都存在着互相感应的关系。②19世纪80年代，在波德莱尔文学活动的影响下，一批诗人团结在《象征主义者》等报刊周围，揭起了象征主义的大旗，形成了一股潮流。其中，莫雷亚斯发表了《象征主义宣言》，魏尔伦、兰波和马拉美为成果丰硕的代表诗人。<\/p>", "star": 1, "key": 1}]}, {"chapter": "第九章", "title": "20世纪欧美现实主义文学和俄苏文学", "link": {"quiz": "外国文学史习题_分章刷题.html#d8"}, "mindmap": 1, "kps": [{"no": 1, "title": "20世纪现实主义文学概况", "html": "<p><b>（1）社会背景：<\/b>①资本主义进入垄断阶段，导致各国国内阶级矛盾、国家和地区之间的民族矛盾日益尖锐，为20世纪上半叶带来了两大突出的历史现象，即战争与革命。在1914-1945年，资本主义社会世界性的经济危机带来了两次世界大战，从而引发了两次世界范围的革命高潮。在第一次世界大战的炮火声中，俄国人民取得了1917年十月革命的胜利，建立了世界上第一个社会主义国家。第二次世界大战后，殖民地、半殖民地人民的民族民主革命运动蓬勃兴起，众多国家纷纷赢得了民族独立，直接导致殖民体系的土崩瓦解。②二战后，世界政治<\/p><p>格局动荡不安。20世纪90年代之前，形成了资本主义与社会主义两大阵营的对垒，社会主义国家取得了巨大成就，而以英美为首的资本主义国家调整了国内外政策，加大了国家干预经济的力度，推进社会福利救助制度，迎来了普遍的繁荣。20世纪90年代之后，东欧发生剧变，苏联走向解体，世界政治格局呈现一元主宰下多极并存竞争的新局面。③科学技术取得了巨大发展，相继开始了第三次、第四次科技革命，极大地影响到人们的日常生活，乃至时空观的变化，提高了人们的素质。而随着社会财富的增加，西方实现了高度的城市化，开始步入消费社会，社会结构得到了改变，阶级对立日益被多元化的社会和文化差异所取代。④社会思想、心理学和哲学的发展，冲击着人们的传统观念。马克思主义学说和共产主义理想成为新兴社会主义国家建设和发展的思想指南。而精神分析学说和非理性主义哲学在西方的兴起，则为人们重新评价乃至颠覆绵延几千年的历史和传统提供了新的基点。<\/p><p>（2）<span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第1题<\/span>现实主义文学<b>概况<\/b>：①20世纪现实主义文学继承了19世纪现实主义文学的人道主义思想和批判精神，以及真实反映现实生活的创作原则与方法，但是在对文学发展作出创新性贡献方面，却难以与19世纪现实主义文学相提并论。②20世纪现实主义文学虽然缺乏创新的能力，但是常常呈现出回归的力量，尤其是在局势动荡的时期和两次世界大战期间，对现实的揭露和批判常常成为各国文学的主流。③20世纪现实主义文学受到了新思想和现代主义文学的影响，作家思想激进，程度不一地受到了社会主义思想的熏染，而在创作方法上则更多地借鉴了现代主义文学的创作经验。④苏联文学倡导的社会主义现实主义，可以视为现实主义文学在20世纪进一步发展的尝试与表现。<\/p><p><b>（3）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版20世纪欧美现实主义文学第1题<\/span>现实主义文学的基本特<\/b>点：思想特点：①受到十月革命和国际无产阶级革命运动的影响，批判意识进一步增强，常常从阶级观念或社会主义思想角度观察社会问题，描绘社会现实。②继承了19世纪现实主义文学的创作经验，力图全面反映一个时代的社会生活，善于从一个家族的荣枯变迁来全面地展现社会历史的变化。③无产阶级的生活和斗争，越来越多地成为现实主义文学反映的内容。④受两次世界大战的影响，现实主义作家纷纷表现反法西斯的主题，抒发爱国主义激情。艺术特点：①频频出现“长河小说”，内涵丰富，容量巨大。②受到现代主义文学的影响，吸收了象征、意识流、荒诞、变形等现代主义的表现方法，丰富了艺术表现技巧与手段。③更注重描写心理，淡化了情节和典型人物的塑造。<\/p>", "star": 1, "key": 1}, {"no": 2, "title": "英国现实主义文学", "html": "<p><b>（1）文学概况<\/b>：英国是这一时期现实主义文学最有成就的国家之一，在小说和戏剧领域都取得了丰硕的成果，现实主义作家人数众多，而且出身于工人阶级的知识分子加入了进来，为英国现实主义文学输入了新的血液。萧伯纳、劳伦<\/p><p>斯、高尔斯华绥、毛姆、康拉德和金斯利·艾米斯等为突出代表。<\/p><div class=\"subsec\">（2）劳伦斯<\/div><p>①作家概况：20世纪英国文学史上最重要的作家之一。他是一位出身于矿工家庭的作家，创作形式广泛，囊括了小说、戏剧、诗歌和散文创作，而最能代表其文学成就的是小说创作，代表作品为《儿子与情人》、《虹》和《查特莱夫人的情人》。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第11题<\/span>《虹》的思想内容：通过描写布兰温一家三代人恋爱婚姻的故事，小说展示了他们在两性关系上的痛苦体验，揭示了资本主义文明中人与自然、人与社会、人与人、人与自我的异化关系，批判了资本主义物质主义和工业文明，表现了现代人的困惑与挣扎，反映了人们希望挣脱精神枷锁、建立和谐的两性关系、追求新生活的强烈愿望。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第11题<\/span>《虹》的艺术特色：第一，由现实主义向现代主义转变，表现出由外向内转的趋势。小说一方面真实地再现现代资本主义社会的客观生活和物质形态，另一方面又热衷于描绘在自然本能驱使下人物的心理与情绪状态，具有现代小说心理探索的内倾性特征。第二，在结构上，呈现出历时的时间结构与共时的空间结构的融合。小说以一家三代人的爱情和婚姻为主线，但是三代人对两性关系的心理体验，以及这些体验的对照，又使得小说的内在心理共时结构得到了突出。与此相一致，劳伦斯还在叙述和文体上进行了创新性尝试。第三，独特的象征风格。劳伦斯喜欢用象征手法去表现人的心理情绪，一切大自然的现象在他的作品中几乎都被赋予了人类精神之灵光。<\/p>", "star": 0, "key": 1}, {"no": 3, "title": "法国现实主义文学", "html": "<p><b>（1）文学概况<\/b>：法国现实主义文学在20世纪迎来了第二个高潮，小说创作十分繁荣，着力于从家庭剖析社会，关注国际上的民族解放运动和反法西斯斗争，敏锐地把握了时代脉搏。法朗士、罗曼·罗兰、马丁·杜伽尔、安德烈·马尔罗、莫里亚克和安德烈·纪德等为杰出代表。<\/p><div class=\"subsec\">（2）罗曼·罗兰<\/div><p>①作家概况：20世纪法国最伟大的现实主义作家，他既创作小说，也写作戏剧和散文，于1915年获得诺贝尔文学奖。《约翰·克利斯朵夫》为其代表作。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第9题<\/span>《约翰·克利斯朵夫》的思想内容：首先，它是一部音乐小说。这部小说以音乐家贝多芬为原型，塑造了约翰·克利斯朵夫这一人物形象，描写了他与音乐紧紧相连的一生。小说以他的经历为线索，描写了其精神的成长，对音乐的追求，对音乐精神的理解与捍卫，以及创作过程中的痛苦和欢乐，包含了大量的音乐内容。其次，它也是一部社会小说。克利斯朵夫的行程遍及欧洲各主要国家，所到之处的社会特征与文化氛围，也成了小说描写的重要内容。小说反映了1880年到第一次世界大战期间法<\/p><p>国和欧洲社会的广阔现实，揭露了资产阶级的虚伪、统治阶级的腐朽以及道德文化的堕落等种种社会弊端，具有强烈的批判性。再次，这部作品也可以看作一部思想小说。作家以约翰·克利斯朵夫的心路历程为中心，展现了他反抗的性格与思想发展历程，成为“一部现代心灵的道德史诗”，弘扬了崇高的英雄主义精神。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版20世纪欧美现实主义文学第4题，朱版20世纪现实主义、社会主义现实主义文学第9题<\/span>《约翰·克利斯朵夫》的人物形象：约翰·克利斯朵夫是一个具有反抗思想和独立精神的音乐家，也是一个伟大的英雄。他有着强健的体魄和坚韧的生命力，他的生命充满无穷的信心和勇气，敢于挑战旧道德和旧秩序，始终捍卫作为一个音乐家的精神独立。但是，他也是一名孤独的反抗者。他的思想里包含了众多复杂的因素，一方面具有小资产阶级的反抗意识，另一方面也有着资产阶级的软弱性和妥协性。他追求精神独立，不理解无产阶级运动，他的个人反抗自然也得不到群众的理解，势必成为时代的落伍者。约翰·克利斯朵夫身上包含了鲜明的时代特点，反映了德国、法国知识分子的思想与精神面貌，通过他的经历与遭遇，小说揭示了资产阶级文化与精神的堕落，肯定了毫不妥协的反抗精神和英雄主义气概。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第9题<\/span>《约翰·克利斯朵夫》的艺术特色：首先，小说具有浓厚的音乐色彩。小说的结构具有音乐性，各卷如同乐章，分成序曲、发展、高潮和结尾，气势浩荡，犹如奔腾的长河。第二，小说注重人物的内心描写，展现人物思想与感情的探索过程，尤其善于刻画音乐家对音乐精神的深刻理解。第三，塑造了个性突出，并具有代表性的人物形象。罗曼·罗兰以贝多芬为原型，融合了欧洲其他音乐家的生平材料，将克利斯朵夫塑造成20世纪音乐家的代表形象，表现了时代的精神特征。第四，语言简单朴素，不加雕琢，但是却蕴含深刻的精神内涵。第五，小说还开创了一种“长河小说”的形式，展现了广阔的社会内容，具有史诗性质。<\/p>", "star": 1, "key": 1}, {"no": 4, "title": "德国现实主义文学", "html": "<p><b>（1）文学概况<\/b>：20世纪德国引人注目的现实主义作家是亨利希·曼、托马斯·曼，以及本时期著名诗人、剧作家和戏剧理论家布莱希特。<\/p><div class=\"subsec\">（2）托马斯·曼<\/div><p>①作家概况：20世纪前期德国著名现实主义作家，于1929年获得诺贝尔文学奖。其创作的代表作品为《布登勃洛克一家》、《魔山》和《浮士德博士》等。其小说的基调为现实主义，但融合了现代主义文学的表现方法。<\/p><p>②<span class=\"srctag\">郑版20世纪欧美现实主义文学第6题，朱版20世纪现实主义、社会主义现实主义文学第12题<\/span>《布登勃洛克一家》的思想内容：小说的副标题为“一个家族的没落”，揭示了这部小说描写的内容和表达的主题。首先，小说描写了一个旧式资产阶级家庭精神道德和经济上的没落。小说以布登勃洛克这个德国殷实的市民家庭四代人的生活为中心，展示了这个家族由繁荣兴盛到衰落失败的过程，揭露<\/p><p>了资本主义社会赤裸裸的金钱关系，以及唯利是图的本性。其次，形象地反映了德国由自由资本主义走向垄断资本主义的历史过程，表现了德国传统社会在19世纪中叶走向没落的历史趋势，预示性地表现了西方社会的衰落，隐含了作者对西方文化危机的担忧。再次，小说探讨了艺术与生活的关系问题。托马斯·曼一直对艺术与生活的关系问题感兴趣，并在这部小说中对之进行了探讨。小说表现了艺术精神对资本主义社会利己原则和惟利是图习气的抗衡，反映了作者对艺术的高度肯定。但同时，小说又常常将这种具有艺术气质的主人公塑造成神经质的人物，赋予其一事无成的命运，表达了对其不能胜任重整家族事业的惋惜之情，客观上反映了托马斯·曼本人对艺术的悲观认识和矛盾看法。<\/p><p>③<span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第12题<\/span>《布登勃洛克一家》的人物形象：托马斯·布登勃洛克是19世纪后期欧洲传统实业家的典型形象。他谨遵家训，以家庭的兴旺繁荣为已任，为追求财富而全身心地投入工作，将个人的事业与家庭的发展紧密地结合在一起。他遵守传统的商业道德，注重信誉、积极稳健，关心社会和市政建设，很快获得了社会名望与地位。但是，他缺乏其祖父的坚强意志和冷静务实精神。他敏感而紧张，是一个多思多虑的人。遇到事情，他总是犹豫不定，在矛盾和困难面前产生种种幻灭感，最后陷入悲观与绝望的境地。汉诺是布登勃洛克的末代子孙。他生来体弱多病，性格胆小、敏感、懦弱，无心于商业活动，成天沉湎于音乐和艺术的幻想之中。他的性格和气质，给家族事业造成了毁灭性的打击。这一人物形象象征了欧洲文化的衰落，也表现了托马斯·曼对艺术和浪漫主义的矛盾态度。<\/p><p>④<span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第12题<\/span>《布登勃洛克一家》的艺术特色：第一，继承了欧洲的现实主义文学传统，塑造了众多栩栩如生的典型形象。布登勃洛克一家四代人老约翰、小约翰、托马斯·布登勃洛克、汉诺个性鲜明，具有浓厚的时代气息。第二，结构严谨，详略得当，前后呼应。小说前半部按照时间顺序展开叙事，后半部则更多聚焦于人物内心世界的揭示。家庭生活中的同样物件和家庭中的同一人物在小说中重复出现，既起到了见证家庭历史的作用，也具有了联系不同情节线索的功能。第三，小说擅长描写家庭生活场景，并由此而反映了19世纪中叶德国社会的风俗人情，折射了历史的变迁。最后，小说语言风格多样，平稳含蓄中略带忧伤，抒情中间杂以讥诮。<\/p>", "star": 0, "key": 0}, {"no": 5, "title": "美国现实主义文学", "html": "<p><b>（1）文学概况<\/b>：这一时期美国现实主义作家的创作，将美国文学推向了高峰。一些具有世界影响的作家从中产生，欧·亨利、杰克·伦敦、海明威、德莱塞和塞林格等为突出代表。他们透过美国的繁荣，揭露了社会矛盾和精神危机，表现出清醒的现实主义批判精神。此外，从20世纪中期开始，美国少数族裔文学取得了巨大成就，黑人文学、华裔文学和犹太文学等都成果丰硕，并因其对民族文化身份的关注而具有深厚的社会文化意义。<\/p><div class=\"subsec\">（2）海明威<\/div><p>①<span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第14题<\/span>作家概况：海明威是“迷惘的一代”的代表作家，20世纪30年代则以“反战”而著称，主要作品有《大阳照样升起》、《永别了，武器》、《丧钟为谁而鸣》和《过河入林》等。《老人与海》是其最著名的作品，标志着海明威一生创作的顶峰。1954年，他因“精通叙事艺术”和“对当代风格所发生的影响”而荣获诺贝尔文学奖。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《老人与海》的思想主题：通过古巴渔民桑提亚哥前往大海钓鱼，与马林鱼、鲨鱼搏斗的故事，小说表现了丰富的内容，揭示了多重主题。首先，塑造了“硬汉”桑提亚哥这一人物形象，赞扬了永不服输的拼搏精神。小说描写老渔民桑提亚哥在三个月内坚持不懈地出海，跟天气、大海、马林鱼、鲨鱼搏斗，虽然最后带回来的是大马林鱼的骨架，但桑提亚哥在睡梦中梦见的仍然是象征着力量的狮子。其次，表现了存在主义自由选择的哲学思想。桑提亚哥时刻面临着严峻的考验，他本可以选择放弃，但他始终坚持抗争，以积极的态度对待人生的厄运，最后虽然失败，但找到了自己存在的价值和意义。桑提亚哥的形象是一个大写的人的形象，他的拼搏精神具有普遍的象征意义。如同桑提亚哥那样，人类既然面对着乖谬的世界和悲剧性的命运，就应该选择正视现实、直面人生，而不是逃避退缩，由此而赋予存在以尊严和价值。再次，象征性地表现了人类的艰难处境和不可避免的悲剧性命运。桑提亚哥84天出海都没有钓到鱼，不是因为他技术不高，而是他的运气不好。当他终于钓到了鱼的时候，成群的鲨鱼闻风而至，吃光了马林鱼的肉。桑提亚哥的经历，仍然流露出作者对人生和命运的无奈情绪，隐喻性地表现了海明威对人生和人类命运的悲剧性认识。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《老人与海》的人物形象：桑提亚哥是海明威“硬汉”形象中最杰出的代表。首先，他有超群的毅力和非凡的意志。在艰苦的生存环境面前，老人表现出顽强的生命力和乐观的精神。接连84天没有钓到鱼，但他毫不气馁，再次出海。在与大马林鱼的一系列搏斗中，他充分展示了人的精神力量，表现了人的崇高与伟大。其次，他有清醒的自我意识和理性精神。凭着理性力量和自我意识，他战胜了大海，也战胜了自我。再次，他有善良、乐观和豁达的胸怀。他屡屡遭受挫折，但从不沮丧，虽然带回陆地的是马林鱼骨架，但精疲力竭的老人在睡梦中梦见的仍然是充满力量的狮子，隐喻性地表达了老人的高远志向和英雄情怀。总之，桑提亚哥是一个具有浓厚象征意义和哲理内涵的“硬汉”形象。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第14题<\/span>《老人与海》的艺术特色：第一，简洁、清新、干净的散文文体风格。《老人与海》力求简洁，没有任何艰深难懂的词汇，避免使用形容词等修饰语言。第二，含蓄、凝练的意境。海明威提出了创作上的“冰山”原则，将八分之七的内容隐藏在语言之下予以表现，只写老人与鱼的搏斗，而将时空背景等隐去，既突出了桑提亚哥的拼搏精神，也赋予其形象以深远的隐喻意义。第三，善于使用比喻、象征、重复、对比<\/p><p>等手法。《老人与海》中的大海、马林鱼、鲨鱼、老人和小孩等都具有丰富的象征意义。<\/p>", "star": 1, "key": 1}, {"no": 6, "title": "20世纪俄苏文学", "html": "<p><b>（1）文学概况<\/b>：①19世纪末20世纪初，俄国文化迎来了新的高潮时期，史称“白银时代”。这一时期的文学也取得了引人注目的成就。第一，现实主义文学在继续发展。老一辈作家仍然在创作，新一代作家如高尔基等人加入了进来，为现实主义文学的发展注人了新的活力。现实主义文学在继承19世纪现实主义文学批判传统的基础上，在题材、主题和人物上取得了新的突破。第二，具有现代主义色彩的各种文学流派纷纷涌现，出现了许多各具风格的新锐作家，例如别雷、梅列日科夫斯基等，为俄国文学的发展开辟了新的天地。②从1917年十月革命到80年代，为苏联文学时期。无产阶级作家创作团体出现，社会主义现实主义逐渐成为这一时期基本的文学创作和批评方法。虽然文学主流受到极左思潮的影响，但仍然产生了许多优秀作品，而一些作家致力于文学个性的追求，创作出了具有独特艺术风格的作品，它们构成了颇具实力的文学潜流或支流。<\/p><p>（2）<span class=\"srctag\">郑版20世纪俄苏文学第1题，朱版20世纪现实主义、社会主义现实主<b>义文学第2题<\/span>社会主义现实主义<\/b>：1934年，苏联第一次作家代表大会召开，确立了社会主义现实主义为苏联文学创作和批评的基本方法。社会主义现实主义要求作家从现实的革命发展中真实地、历史地和具体地去描写现实，同时将其与用社会主义精神改造和教育人民结合起来。它对苏联文学的发展起到过积极的作用，但也产生了一些消极的影响。1989年，苏联作家协会在新《章程》中删除了社会主义现实主义的提法，1991年苏联解体之后，这一创作和批评方法也随之消失。<\/p><div class=\"subsec\">（3）高尔基<\/div><p><b>①作家概况<\/b>：俄国伟大的无产阶级作家，苏联文学的创始人，被称为“无产阶级艺术的最杰出的代表”。其代表作《母亲》在世界文学史上具有划时代的意义和深远影响。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版20世纪俄苏文学第4题<\/span>自传体三部曲的阿辽沙形象：第一，阿辽沙立足于高尔基自身的经历，是一个具自传性特点的人物形象。第二，对善良的不倦追求和对真理的执著探求，是阿辽沙突出的精神特征。小说在描写阿辽沙成长过程中，突出了不同社会力量对其的影响，展现了这一人物由对现实苦难的漠然，到厌弃邪恶、向往善良，由自发反抗到自觉反抗的过程。第三，这一形象折射了时代的不幸。阿辽沙经受了众多的磨难，但是小说没有突出他的不幸，而是集中描写了其精神成长的过程，突出了他对真、善、美的追求，以及他对社会不幸的进一步认识，既描写了普通人的反抗，也反映了这一时期社会的本质。第四，体现了俄罗斯20世纪初期新人的成长。高尔基立足于自我生活的真实，牢牢把握人物精神的成长，将时代真实与艺术真实紧紧地结合在一起，以19世纪末20世纪初的俄罗斯社会背景为舞台，塑造了阿辽沙这一人物形象，赋予这一<\/p><p>人物以深厚的历史代表性和鲜明的时代特征，反映了一代新人的精神成长历程。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第4题<\/span>《母亲》的思想内容：首先，作品真实地再现了贵族地主和资产阶级上流社会的腐败、丑恶，塑造了投身革命的工人形象帕维尔与作为群众代表的母亲形象，展现了列宁领导的俄国无产阶级革命的发展全过程。小说反映了马克思主义的传播，工人与人民群众的觉醒，展示了革命斗争从自发到自觉，从经济斗争到政治斗争，从城市到农村的发展过程，揭示了工农联盟的意义。其次，通过描写工人阶级进行的反对地主、资产阶级专制统治的革命斗争，小说歌颂了无产阶级不屈不挠的革命精神和英雄气概，预示了社会主义将取代资本主义的必然性。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版20世纪俄苏文学第3题，朱版20世纪现实主义、社会主义现实主义文学第4题<\/span>《母亲》的人物形象：帕维尔是由普通工人成长为无产阶级战士的俄国第一代革命家的典型形象。他的成长经历和斗争历程，形象地概括了俄国工人的觉醒与成长过程，体现了俄国工人阶级勇往直前、坚韧不拔的革命精神和高尚的道德情操，揭示了工人阶级学习、掌握马克思主义真理的重大意义。通过帕维尔这一人物形象，小说揭示了马克思主义的巨大革命潜力，它一旦为人民群众所掌握，就会产生不可战胜的力量。母亲尼洛夫娜是一名成长的群众代表。她由普通家庭妇女成长为无产阶级的革命战士。她是一个旧式的家庭妇女，经过革命洗礼转变为坚定的革命者。小说描写她出于对儿子的爱，而逐渐接近革命和革命者，思想得以提高，变成了一名自觉的革命战士。母亲尼洛夫娜精神成长的过程，高度概括了俄国劳动人民思想觉醒和反抗斗争的发展道路，深刻地反映了革命发展的历史，揭示了马克思主义理论教育人、改造人的巨大威力。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第4题<\/span>《母亲》的艺术特色：第一，现实主义与浪漫主义的结合。小说中的“五一游行”、“法庭审判”，都是现实生活的真实写照，真实地展现了俄国无产阶级斗争的壮丽图景。同时，小说中的人物熔铸了浪漫主义的理想色彩，充满了对美好未来的憧憬和对共产主义的坚定信念。第二，成功塑造了无产阶级战士和革命家形象。无产阶级革命战士在小说中成为主人公，这是文学史上首次塑造的真实生动的工人革命家典型形象，开创了无产阶级文学的新纪元。第三，小说善于以发展的眼光展现人物性格的成长，揭示人物心理的变化。例如，小说描写了母亲对宪兵的态度由恐惧、仇恨到鄙视的发展过程，展现了其性格的觉醒。第四，体现了现代和传统相结合的特点。小说的构思采用了人物精神成长的传统模式，但展现的是工人革命家新道德面貌的形成过程；采用第三人称全知叙事与第三人称限制叙事相结合的方法，既展示了工人运动的全貌，又突出了运动中个体的独立性和主体性。总之，《母亲》的创作符合社会主义现实主义的创作原则，在现实的革命发展中真实地、历史地描写了无产阶级斗争，实现了用社会主义思想教育读者的目的，常常被视为社会主义现实主义的典范之作。<\/p><p>-<\/p><div class=\"subsec\">（4）肖洛霍夫<\/div><p>①作家概况：苏联文学的杰出代表，以描写顿河地区的生活而闻名于世，主要作品有《顿河故事》、《静静的顿河》、《人的命运》和《被开垦的处女地》等。1965年，肖洛霍夫荣获诺贝尔文学奖。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第7题<\/span>《静静的顿河》的思想内容：首先，塑造了许多体现历史前进方向的革命者、布尔什维克和红军指战员的形象，描写了他们在伟大的革命斗争中的英勇牺牲精神，讴歌了他们为之斗争的苏维埃政权的彻底胜利。其次，小说也描写了旧政权的垂死挣扎，以及白军终将失败的必然趋势。再次，在旧政权与新政权、白军和红军、旧世界与新世界的激烈斗争中，小说展现了以葛利高里·麦列霍夫一家为代表的普通哥萨克人的历史命运。小说以20世纪初期动荡的社会和政治局势为广阔的时代背景，真实地反映了1912年到1922年间哥萨克经历的重大历史事件，描写了普通哥萨克人在这些历史事件中的痛苦抉择，走向新生活过程中的艰难曲折，以及他们充满迷误和痛苦的悲剧命运，展现了作者对哥萨克人和顿河这块土地的热爱之情。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版20世纪俄苏文学第5题，朱版20世纪现实主义、社会主义现实主义文学第7题<\/span>《静静的顿河》的人物形象：葛利高里是小说的主人公，他是顿河地区哥萨克农民的代表形象。小说结合哥萨克人的历史和现实，将葛利高里置于时代变革中予以表现，刻画了其极富个性但又复杂矛盾的性格。葛利高里热情善良、勤劳纯朴，具有哥萨克劳动者的一切美好品质。同时，他身上也有哥萨克的愚忠和粗野的历史局限，这两者的结合造成了他复杂矛盾、摇摆不定的性格特征。他几次在革命与反革命、红军与白军中辗转，摇摆不定，其性格中的善良和沙皇军队的丑恶现象，使得他一度受到进步思想的影响，但对荣誉的狭隘理解，以及对革命缺乏正确认识，又让他脱离革命队伍，投靠白军，却又难以找到真正的归宿感，最后成为了一个悲剧性人物。通过葛利高里，小说反映了哥萨克地区的复杂性，以及哥萨克人走向新生活的艰难过程和必然性。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版20世纪现实主义、社会主义现实主义文学第7题<\/span>《静静的顿河》的艺术成就：第一，结构宏大，内容丰富，史诗性地展现了广阔的社会历史画面。小说通过葛利高里悲剧性的人生道路，描写了普通哥萨克人动荡起伏的命运，以及苏维埃政权由建立到巩固的历史过程，囊括了20世纪初期重大的历史事件，既刻画了顿河地区哥萨克村庄的日常生活场景，也反映了波澜壮阔的战争场面和动荡变化的时代风云，显示出作家驾驭史诗性题材的非凡才能。第二，塑造了众多个性鲜明的人物形象。从哥萨克贵族到普通哥萨克农民，从高级将领到哥萨克士兵，从沉着老练的革命领袖到莽撞偏激的革命青年，无不个性突出，血肉丰满。尤其是在哥萨克人的塑造上，小说成功地展示了他们勇敢、豪爽、热爱生活的性格魅力。第三，浓厚的乡土气息。小说描绘了顿河草原的美丽景色，以及哥萨克地区的风土人情，运用民歌民谣以及方言俚语，使小说具有浓厚的地域特色。此外，小说将人物内心世界的刻画与顿河地区自然风光的描绘紧紧地<\/p><p>结合在一起，既为人物活动提供了富有浓郁地方色彩的空间背景，也突出了人物与所生活的土地之间的深厚感情。<\/p>", "star": 1, "key": 1}]}, {"chapter": "第十章", "title": "现代主义和", "link": {"quiz": "外国文学史习题_分章刷题.html#d9"}, "mindmap": 1, "kps": [{"no": 1, "title": "现代主义文学概述", "html": "<p><b>（1）现代主义文学<\/b>：现代主义文学是20世纪上半期欧美多种反叛传统、追求新奇的文学流派的总称。它包括众多相对独立的流派，其中，最重要的是后期象征主义、表现主义、意识流小说、未来主义、超现实主义等文学流派。现代主义文学既是一个庞大复杂的国际性文学思潮，又表征着一种独特的审美倾向和文化精神。因此，五光十色的现代主义流派又呈现出整体性，具有共同的特征。在思想上，现代主义文学富有强烈的反传统精神，提倡非理性，善于表现人在现代社会中的异化主题，具有强烈的文化批判性。在艺术上，现代主义文学着重表现潜意识、欲望、幻觉和直觉等非理性心理，追求新奇别致的文学形式，开掘了审丑、荒诞、悖谬、变形等现代审美观念，创造了异彩纷呈的现代艺术景观。<\/p><p>（2）<span class=\"srctag\">朱版20世纪现代主义、后现代主义文学及其他重要作家第1题<\/span>产生原因（历史文化背景、哲学基础）：①欧美科学技术的飞速发展和两次世界大战的爆发，极大地冲击了西方延续了两千年的基督教文化传统，动摇了西方近代理性主义文化价值体系，进而引发人们质疑整个资本主义现代文明。②西方非理性主义哲学思潮与现代心理学的发展，加剧了非理性主义和悲观主义色彩，同时也极大地将人、人的意志、人的自我活动和生命存在的形式与本质等问题置于关注的中心，刷新了人们对自我、社会和世界及其关系的重新认识。叔本华的唯意志论、尼采的权力意志论、柏格森的直觉主义和弗洛伊德的精神分析学说，成为非理性主义文化大潮的主要支流。③文学自身的发展，也为现代主义文学的出现准备了内在的条件。早在19世纪初期的浪漫主义文学那里，现代主义文学的端倪就已经开始显露，而后期浪漫主义的一些作家与诗人，例如爱伦·坡和波德莱尔等，其创新性的文学表现就已经具有现代主义文学的特征，而现实主义文学在19世纪后期的发展，也具有了向内转的趋势，对社会的批判也开始呈现出从制度层面深入到文化层面的转向。<\/p><p>（3）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版现代主义文学第1题<\/span>基本特点：思想特点：①反叛传统的理性主义价值体系，具有强烈的文化批判倾向。现代主义文学站在非理性主义立场上，反叛西方近代理性主义文化价值体系，质疑整个资本主义现代文明，反思现代人的价值和命运，表现现代人的困惑与精神危机，具有强烈的文化批判倾向。②表现异化的主题。现代主义文学揭示了人类赖以生存的4种基本关系，展示了人与自然、人与社会、人与人、人与自我之间关系的扭曲畸形和全面异化，再现了现实世界的残酷和荒谬，表现了现代西方人的恐惧、孤独和悲观绝望。艺术特点：①强调表现内心世界和心理真实，具有主观性和内倾性特征。受非理性主义哲学和现代心理学的影响，现代主义文学家认为，主观世界尤其是非理性意识才是世界的本源和最高的真实。他们把认识人自身的奥秘，探索和表现本能欲望、潜意识、直觉、幻觉等非理性的深层心理机制看成文学的重要使命。②提倡“以丑为美”、“反向诗学”，大量描写丑的事物；运用象征隐喻的神话模式，追求艺术的深度模式。立足于对人性与西方文化传统的失望情绪，现代主义文学常常关注人性与社会的丑恶，并希望通过描写丑恶、暴露丑恶，而实现对现实的超越。为了实现对内在真实的表现，现代主义文学常常运用象征与隐喻，创造性地借用西方神话传说，以此获得深广的历史文化背景，从而实现对西方文化的反思，象征性地表现隐藏在表象后面更为本真的真实。③热衷于艺术技巧的革新与实验。现代主义文学认为形式就是内容，文学创作本质上就是创造新的艺术形式。现代主义文学以前所未有的求新、求变、求异的艺术热情，大胆地在文学形式的各个方面进行创新实验，开掘了审丑、荒诞、悖谬、变形等现代审美观念，锤炼了象征、荒诞、内心独白、自由联想、梦幻等艺术表现手法，创造了异彩纷呈的现代主义文学景观。<\/p>", "star": 1, "key": 1}, {"no": 2, "title": "后期象征主义", "html": "<p><b>（1）后期象征主义<\/b>：20世纪20至40年代，象征主义进一步发展，并且迅速成<\/p><p>为世界性的现代主义文学流派，被称为后期象征主义。后期象征主义仍然坚持以象征暗示的方法表现内心“最高的真实”，但是跳出了个人情感的狭小范围，而呈现出回应时代与社会的总体特征。在艺术上，后期象征主义抛弃了前期象征主义过于隐晦艰涩的艺术风格，主张情与理、主观与客观、有限与无限的统一。后期象征主义的文学成就主要体现在诗歌领域，代表诗人有瓦莱里、里尔克、庞德、叶芝和艾略特。<\/p><div class=\"subsec\">（2）艾略特<\/div><p>①诗人概况：20世纪西方现代诗歌的杰出代表，开创了现代主义一代诗风，是“当今诗歌风格整个革命的创造人”。他还创作戏剧、撰写文学批评文章，其文学活动对20世纪西方文学以及世界文学都产生了重要影响。1948年，他因诗歌创作而获得诺贝尔文学奖。其主要作品有《荒原》、《空心人》、《灰星期三》和《四个四重奏》等，《荒原》被视为现代诗歌的里程碑。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版20世纪现代主义、后现代主义文学及其他重要作家第5题<\/span>《荒原》的思想内容：诗歌运用了大量的西方神话故事和传说，使来自于这些神话故事和传说的内容、情节和意象在诗歌中互相交织，错综呈现，形成了一个多层次的文化象征背景，含蓄蕴藉地表达了诗歌的主题。首先，展示了一战后西方人的精神幻灭。诗人用象征的笔法，将伦敦视为现代西方的象征，描写了这个城市的衰败、荒芜，揭示了生活其中的人们的空虚与堕落，反映了诗人深刻而冷峻的荒原意识，以及对西方人失去宗教信仰之后的担忧。其次，表达了对西方文明复苏的企盼。诗人用繁殖神死而复生的神话、圣杯传奇中的渔王故事、耶稣复活的故事和东方哲人的训诫，提醒人们克制欲望，才能迎来精神的复活，为精神幻灭的现代西方人提出了拯救的途径。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版现代主义文学第3题，朱版20世纪现代主义、后现代主义文学及其他重要作家第5题<\/span>《荒原》的艺术特征：第一，艺术上象征与思想上写实的结合。诗人通过具体可感的形象，象征性地表达了西方现代人的精神幻灭与传统文化的失落，使严峻的思考和深刻的思想以形象生动的方式得到了表达。第二，运用了丰富复杂的象征。诗歌采用了大量的神话传说与宗教故事，拓展了诗歌的表现范围与内涵，为诗歌主题的表达提供了多层次的文化背景和象征框架。第三，广泛用典与“镶嵌画”手法相结合。艾略特在诗歌中引用了35个作家的56部作品，涉及7种语言。这些传统作品中的诗句、情节和人物或直接入诗，或与诗歌相对应，或被戏拟，以一种镶嵌画的方式出现于诗歌之中。第四，“非个人化创作”与“客观对应物”的结合。诗人认为，“诗歌不是感情的放纵，而是感情的脱离；诗歌不是个性的表现，而是个性的脱离。”诗人要表露感情的唯一途径是寻找“客观对应物”。在诗歌中，艾略特注重对声音、形象、色调、光影甚至感触、意识的直接展示，而把作者的叙述与抒情完全放弃，取得了十分真实的效果。<\/p>", "star": 1, "key": 1}, {"no": 3, "title": "表现主义", "html": "<p>（1）表现主义：表现主义是一个具有广泛影响的现代主义文学流派，产生于20世纪初的德国，后流行于欧美各国。它的出现是对注重外在客观现实描写的<\/p><p>现实主义文学和自然主义文学的反拨。表现主义文学认为，艺术是表现不是再现，主张透过事物的表象，去展现其内在的本质，或内在的生命冲动，表现作者的“主观现实”。表现主义文学的成就主要体现在戏剧领域，表现主义戏剧常常以荒诞的情节、离奇的舞台形象、观念化的人物和大量的内心独白，来表现人物的思想感情。奥地利小说家卡夫卡、瑞典戏剧家斯特林堡、美国戏剧家奥尼尔等都为其代表人物。<\/p><div class=\"subsec\">（2）卡夫卡<\/div><p>①作家概况：奥地利小说家，西方现代主义文学的奠基者。他被誉为表现主义大师，但其创作对现代主义文学各流派都产生了影响，其主要作品有《变形记》、《审判》、《城堡》和《美国》等。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《变形记》的思想内容：通过人变成甲虫的荒诞故事，小说富有创造性地表现了现代人异化的存在状态和绝望的精神世界。第一，格里高尔由人变为甲虫，展示了现代人丧失自我价值和个性的悲剧，表现了人的异化主题。格里高尔为了家人而忙忙碌碌，得不到他人的尊重，就是家人也在他变形之后充满了对他的厌弃，他的存在完全被外在的世界和命运所主宰。他的变形看似荒诞，但真实地揭示了资本主义社会人存在的“非人化”境遇。第二，展现了格里高尔变形后悲苦的精神世界，反映了现代人彼此之间的疏远与隔离。格里高尔变成甲虫后，仍然想着家人，但他却遭到家人的抛弃，母亲吓得昏厥倒地，父亲则暴跳如雷，妹妹虽然照顾他，但时间一长也开始厌弃。变形后的葛里高尔，人性如故，但感受到的却是更加深重的孤独感和悲哀感，折射了西方现代社会里人与人之间因无法沟通而造成的孤独、冷漠与悲凉。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版现代主义文学第5题<\/span>《变形记》的艺术特色：第一，真实与荒诞的结合。小说虽然描写了人变成甲虫的荒诞故事，但表现了作者对现代西方社会和人们生存与精神状态的清醒认识。借由大量真实的细节描写，小说将这个荒诞的故事叙述得真实可感，例如格里高尔变成甲虫后的内心体验，他的日常生活，甚至房间的陈设等，都描写得细致入微、真实具体。第二，冷漠平静的叙事方式。小说采用极其客观、平静的语调描述人变成大甲虫后的经历，暗示了异化问题的普遍性，激发读者进而思考人的存在境遇。第三，运用意识流的手法，极力渲染人物的内心世界。格里高尔变成大甲虫的内心感受和心理活动，是小说描写的主要内容。小说通过联想、幻觉的运用，既展示了人变成甲虫以后的恐惧、焦虑、觉悟和痛苦，也表现了常人的心理，在揭示了异化主题的同时，又增加了小说的艺术感染力。<\/p>", "star": 1, "key": 1}, {"no": 4, "title": "意识流小说", "html": "<p><b>（1）意识流小说<\/b>：意识流小说是20世纪初在西方兴起的一个现代主义文学流派。意识流小说不重视描摹客观世界，而着力于表现人的内心真实，尤其是人的意识流程，常利用心理时间来组织叙事，大量运用象征暗示、内心独白、自由联想等艺术手法来追踪人的意识流程，展示人迷离恍惚的精神世界。意识流小说在20世纪20至30年代一度掀起高潮，到40年代后，纯粹的意识流小说就不存<\/p><p>在了，但经过意识流小说所锤炼的各种创作方法和观念，却仍然在产生持续不断的影响。其代表作家有乔伊斯、伍尔夫、普鲁斯特和福克纳等。<\/p><div class=\"subsec\">（2）乔伊斯<\/div><p>①作家概况：爱尔兰作家，意识流小说的经典大师，也是现代主义文学最重要的代表作家之一。乔伊斯的主要作品有《都柏林人》、《一个艺术家青年时代的写照》、《尤利西斯》和《芬内根们的苏醒》。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《尤利西斯》的思想内容：小说以1904年6月16日早晨8点到次日凌晨2点这18个小时为时间框架，描写了都柏林人斯蒂芬、布卢姆、玛莉恩在这一段时间内在都柏林的经历。小说将这三个人18小时内的活动置于与希腊荷马史诗《奥德修纪》的对应、对照进而对比中，表现了作者对现代西方人和西方文明的看法。首先，小说记录了都柏林三个平凡人物一天的琐碎生活，通过人物的身心感受，逼真、细腻地反映了都柏林人的日常生活和精神状态，表现了他们道德和精神生活的瘫痪麻痹，以及内心难以排遣的痛苦。其次，小说借用神话故事框架作为主题深化的文化背景，表现了作者对当代西方人和现代文明的认识。作者采用奥德修斯的古罗马名“尤利西斯”作为小说的书名，意欲写一部具有普遍意义的现代史诗，以都柏林作为现代西方的中心，以布卢姆、斯蒂芬和玛莉恩代表西方文化养育的所有人。通过布卢姆与奥德修斯两位父亲的对比，斯蒂芬与帖雷马科两个儿子的对比，以及玛莉恩与潘奈洛佩两位母亲、妻子的对比，小说表现了英雄主义精神的彻底消失，揭示了西方现代文化中的庸人主义、虚无主义与肉欲主义，指出它们正是西方社会道德沉沦和精神瘫痪的罪魁祸首。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版现代主义文学第8题，朱版20世纪现代主义、后现代主义文学及其他重要作家第8题<\/span>《尤利西斯》的艺术特色：第一，采用了荷马史诗《奥德修纪》的故事框架，为小说主题的开掘提供了深广的文化空间。小说以《奥德修纪》的结构为依托，分为三部，并以史诗的故事、人物、主题作为小说深层次主题展开的文化背景。第二，拓展了意识流表现方法。小说以三个人物的意识流程为表现对象，而且描写了玛莉恩凌晨两点似睡未睡、要醒没醒时的意识活动，大量运用内心独白、自由联想、蒙太奇、梦境与幻觉，揭示了人物内心最隐蔽、最深层的心理活动，表现了现代人难以言传的心灵痛苦。第三，语言上进行大胆的创新实验，创作了一种新的意识流语体。为了追踪人物隐蔽的意识流程，小说在语言上进行了大胆的创新实验，将内心独白、自由间接引语以及传统的叙事描写紧密地结合在一起，使用高度省略和语法、句法结构不完整的句子，将各种文体乃至异国文字编织在一起，形成了其独具风格的语言艺术。<\/p>", "star": 1, "key": 1}, {"no": 5, "title": "后现代主义文学概况", "html": "<p><b>（1）<span class=\"starmark\">★<\/span>后现代主义<\/b>：后现代主义是产生于20世纪50年代初的文学思潮，是西方后工业化社会的产物。它与现代主义文学有着密切的联系，但是其文化倾向又具有新的特征，呈现出与现代主义文学的差异。后现代主义文学不是指称一个具体的作家群体，而是指称在文化倾向上呈现出共同性的一些文学流派，它们彼此之间没有广泛认同的纲领与宣言，对中心和权威的消解、对多元化和差异<\/p><p>化的倡导，是后现代主义文学文化价值观的重要特征之一。在艺术上，后现代主义文学主张颠覆传统美学观念，消解文本的深度思想意义，模糊文本之间的界限，追求开放性、不确定性的文本结构。后现代主义文学主要包括存在主义文学、荒诞派戏剧、新小说、垮掉的一代、黑色幽默和魔幻现实主义。<\/p><p><b>（2）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版后现代主义文学第1题<\/span>基本特点<\/b>：①激烈地反传统。后现代主义文学不仅反对西方传统文化，而且还反对现代主义文学的精英意识，为此而消解作品深层次意义的表达和探求，对文学的价值表现出怀疑，具有“反小说”、“反戏剧”的特征。②文学创作不再是为了赋予人生以意义，而是为了写作本身的欢愉。对权威和经典的彻底否定，使得后现代主义文学寻求语言的彻底解放，以此抵制传统文化尤其是理性传统对思想和心智的束缚，拒绝表现严肃的主题，而将写作变成能指滑动的符号游戏。③文本意义的不确定性和开放性。后现代主义否定中心的存在，强调语言和文本的歧义性、多义性和对话性，颠覆了传统的创作原则与方法，使得文本内容、结构和意义呈现出开放的特征。④向大众文学的靠拢。受后工业社会消费文化的影响，以及对权威和经典的否定，后现代主义文学在文学趣味和品格上抛弃了现代主义文学的精英态度，而在创作方法和风格上呈现出大众文学的一些特征。<\/p>", "star": 1, "key": 1}, {"no": 6, "title": "存在主义文学", "html": "<p><b>（1）<span class=\"starmark\">★<\/span>存在主义文学<\/b>：存在主义文学是在存在主义哲学基础上形成的后现代主义文学流派，产生于第二次世界大战前夕的法国，战后盛行于整个西方世界。存在主义文学的基本主题传达了存在主义的哲学思想，揭示世界和人存在的荒诞，肯定人的存在先于人的本质，表现人在荒诞境况中的自由选择和精神自由，具有鲜明的哲理化倾向。为了描绘世界的荒诞感，存在主义文学将真实性原则提到了重要高度，并采用冷漠、客观的叙述语调。存在主义文学主要采用小说和戏剧两种文学样式。让-保尔·萨特，阿尔贝·加缪是存在主义文学的领军人物。<\/p><p><b>（2）萨特<\/b><\/p><p>①作家概况：法国当代著名哲学家、小说家、剧作家、文艺评论家和社会活动家，二战后西方存在主义文学的主要代表，其哲学思想对二战后的西方文学影响深远。其主要文学作品有小说《墙》、《厌恶》和《自由之路》，戏剧《苍蝇》、《禁闭》与《死无葬身之地》等。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版20世纪现代主义、后现代主义文学及其他重要作家第10题<\/span>哲学思想：第一，“存在先于本质”。人先有自身存在，然后通过自为，才确定自身的本质。第二，“世界是荒诞的”。外部世界是自在的存在，人的存在是自为的存在，它们都是非理性的、杂乱无章的，其本质是荒诞的。第三，“自由选择”。人是自为存在的，可以追求自我的外化。“自由选择”是人的自由意志通往相应本质的桥梁，通过选择、行动，以实现对自我的肯定，决定自己的本质，抗拒荒诞。但是，自由是本体论上的自由，而非行动上的自由。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>境遇剧：萨特为宣扬自己的存在主义思想所创作的戏剧，他将其称<\/p><p>为“境遇剧”，视之为一种新的戏剧类型。它们不是按传统戏剧的创作原则来处理环境与人物的关系，而强调对情境的刻画，常常将人物置于特定的艰难情境甚至绝境中，让他们通过“自由选择”来决定自己的本质，把握自己的命运。这种戏剧极为有效地表现了当代人普遍的忧患意识和两难选择状态，肯定了存在主义的人道主义伦理道德观。《禁闭》是典型的“境遇剧”，其中的典型情境是地狱。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版后现代主义文学第3题<\/span>《禁闭》的思想内容：作者通过剧中三个鬼魂在地狱里勾心斗角、尔虞我诈的故事，描写了他们彼此追逐但又难以如愿的三角关系，表现了“他人即地狱”的存在主义哲学思想，宣扬了自由选择、超越自己的人道主义伦理道德观。首先，剧中三个鬼魂生前沉溺于欲望之中，伤害了他人；而今沦于地狱，仍然勾心斗角，尔虞我诈，将对方视为自己欲望的客体，形成了彼此追逐、不得安宁的三角关系。通过这些描写，戏剧表现了他人就是地狱的哲学观念，即如果你不能正确对待他人，他人就是你的地狱；如果不能正确对待他人对你的判断，他人的判断就是你的地狱；如果你不能正确对待自己，那么你也是自己的地狱。其次，通过荒诞的情节，戏剧象征性地展示了当代社会人与人之间日益恶化的关系，表现了潜在的主题，即进行自我选择、承担选择的责任，对改变当代生活具有非常重要的意义。萨特之所以将现代人的存在和人与人之间的关系以荒诞的形式予以表现，就是为了使人们警醒，不要做自己欲望、他人判断的奴隶，而要严肃地认识自己、超越自己，才能砸碎精神地狱，迎来自由的新生活。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《禁闭》的艺术特点：第一，题材的荒诞性。作者选取的是非现实的题材，描写地狱里的罪人，以及他们在地狱中的荒诞感受，呈现出浓郁的荒诞感，表现了对人生的悲剧性认识。第二，境遇的极限性。三个有罪的鬼魂置身于地狱一个密闭的空间里，在自然条件、环境和社会关系中都处于一种极限的境遇中，充分地展现了戏剧矛盾，为完美地刻画人物提供了具有震撼力的场景。第三，哲理的深刻性。萨特将深刻的哲理寓于戏剧中，通过三个灵魂在地狱的表演，生动地传达了“他人即地狱”的思想，概括了当时西方社会人的存在境遇和人与人之间的关系，具有普遍的意义，蕴含了深刻的哲理。<\/p>", "star": 1, "key": 1}, {"no": 7, "title": "荒诞派戏剧", "html": "<p><b>（1）荒诞派戏剧<\/b>：荒诞派戏剧是20世纪50年代兴起于法国，然后迅速流行于欧美各国的一个反传统戏剧流派。荒诞派戏剧以存在主义哲学为思想基础，强调世界的荒诞性、人生的痛苦和反抗的无意义，具有浓厚的悲观主义、宿命论色彩。在艺术上，荒诞派戏剧完全抛弃了传统戏剧的程式和手法，而主张用荒诞的手法直接表现荒诞的存在。它突破传统戏剧的基本规律，摒弃了传统戏剧的情节与冲突；剧中人物形象支离破碎，缺乏鲜明的个性；舞台象征化，语言混乱好似“梦呓”，以轻松的喜剧形式表达了严肃的主题。代表剧作家有贝克特和尤内斯库等，其各自的作品《等待戈多》和《椅子》等为荒诞派戏剧的代表剧作。<\/p><p><b>（2）贝克特<\/b><\/p><p>①作家概况：爱尔兰剧作家、小说家和诗人，荒诞派戏剧的领袖人物之一，新<\/p><p>小说的代表作家。1969年，他因“以崇高的艺术表现人类的苦恼”而荣获诺贝尔文学奖，其代表作为《等待戈多》。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《等待戈多》的思想内容：通过两个流浪汉永无休止而又毫无希望的等待，和一主一仆两人的奇异关系，戏剧表现了信仰危机时代现代西方人的悲剧性人生、无聊的精神生活状态，以及希望改变自己的生活处境但又难以实现的绝望心理，隐喻性地揭示了世界的荒诞、人生的痛苦与毫无意义。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版后现代主义文学第4题<\/span>《等待戈多》的艺术特色：《等待戈多》是荒诞派戏剧最具代表性的作品，具有突出的反传统戏剧的特点。第一，没有戏剧冲突与完整的戏剧情节。《等待戈多》一反传统戏剧的表现方法，抛弃了情节结构的连贯性、逻辑性，而采用重复再现法，让开端、结尾、场景和生活片段等重复出现，来强调生活的单调乏味、荒诞无聊。第二，人物没有个性，性格破碎。《等待戈多》剧中人物没有性格，更谈不上个性，被抽象化为现代西方人的代表。第三，语言荒诞离奇。《等待戈多》的语言没有逻辑性，变得支离破碎，甚至语无伦次、自相矛盾，既反映不了人物的个性，也无法在彼此之间进行沟通。<\/p>", "star": 1, "key": 1}, {"no": 8, "title": "黑色幽默", "html": "<p><b>（1）黑色幽默<\/b>：20世纪60、70年代主要流行于美国的一个后现代主义文学流派。在思想上，黑色幽默的作家深受存在主义哲学的影响，关注现实，对现实的荒诞有一种痛苦而恼怒的深层体验。在艺术上，它以轻松调侃、玩世不恭，实则无可奈何的语调叙述阴郁可怕的故事，获得一种悲喜剧因素混杂的审美效果，故此而被视为阴郁的幽默、绞刑架下的幽默。其主人公常常是性格乖僻的“反英雄”人物，情节具有非逻辑性，整体上具有寓言性。海勒、冯尼格特、品钦等为其代表作家，各自的小说《第二十二条军规》、《第五号屠宰场》和《万有引力之虹》为黑色幽默的代表作。<\/p><p><b>（2）海勒<\/b><\/p><p>①作家概况：海勒是当代美国文坛最重要的作家之一，被视为黑色幽默派的一面旗帜，其代表作为《第二十二条军规》。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版20世纪现代主义、后现代主义文学及其他重要作家第13题<\/span>《第二十二条军规》的思想内容：小说以二战为背景，描写了一支驻扎在意大利附近的美国空军部队的军营生活，无情地嘲讽和抨击了黑暗的现实，揭示了深刻的社会危机，表达了人必须作出人生选择的思想。第一，通过尤索林在美国空军的生活遭遇，揭示了战争的荒谬实质，美国军事官僚机器的黑暗和非人道，以及美国政治与军事政策的伪善本质。第二，通过对军营黑白颠倒、生死难辨、美丑倒错等生活现象的描写，小说隐喻地表现了现代社会“有组织的混乱”和“制度化的疯狂”，及其统治力量对人性的异化和扼杀，抨击了噩梦般的社会现实，揭示了世界和人生的荒谬性。“第二十二条军规”就是统治集团力量和其荒谬实质的形象化体现，它将人置于无法反抗的境地，无视人的生命与存在，将世界变成一个疯人院，使人生变得荒诞不经。第三，表达了在荒诞世界里进行自由选择的存在主义思想。尤索林抱着爱国热情参加军队，却发现战争不过是骗局，正义不过是幌<\/p><p>子。他曾经试图反抗，但在现实面前最后不得不采取逃避的策略。即便如此，作为荒谬世界的“清醒者”，他的逃避从侧面突出了现实的荒诞，也反映了他拒绝与现实同流合污的勇气，体现了存在主义的哲学思想。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版后现代主义文学第5题，朱版20世纪现代主义、后现代主义文学及其他重要作家第13题<\/span>《第二十二条军规》的艺术特色：海勒的《第二十二条军规》代表了黑色幽默的最高成就，集中体现了“黑色幽默”的特征。第一，以喜剧的方式表现悲剧性的内容与主题。小说利用荒诞不经的情节，反讽俏皮的语言，描写人难以摆脱的困境，揭示了现实生活的荒诞不经，在笑声中嘲笑了社会，但是饱含着辛酸与无奈。第二，成功塑造了“反英雄”形象。作品中的人物往往是一群卑鄙无耻之徒，却平步青云。小说中的主人公虽然不甘于同流合污，但他并不想改变这个社会，在害怕死亡的惊恐中最后选择当一名逃兵。第三，“反小说”的叙事结构。《第二十二条军规》缺乏一条完整的故事线索，通过“人像展览式”的戏剧性结构构建了一个荒诞的世界，整体上显得凌乱破碎，但呼应了小说的荒诞氛围。<\/p>", "star": 1, "key": 1}, {"no": 9, "title": "魔幻现实主义", "html": "<p><b>（1）魔幻现实主义：<\/b>魔幻现实主义是拉丁美洲的一个后现代主义文学流派，发端于20世纪30、40年代，在60年代达至高潮。它在植根民族文化传统的基础上，借鉴了欧美现代主义文学的经验，将印第安人的传统观念、拉丁美洲的历史和贫穷落后的现实融为一炉，在故事情节中夹杂着神话传说、奇迹梦幻等超自然因素，运用现代主义文学象征寓意、联想暗示、时序颠倒等表现方法，展现一个魔幻与现实交织的文学世界，以此来表现拉丁美洲的独特现实，探讨祖国和民族的命运，具有浓重的地方色彩和民族特色。代表作家为哥伦比亚的马尔克斯、危地马拉的阿斯图里亚斯、古巴的卡彭铁尔和墨西哥的鲁尔弗，马尔克斯的《百年孤独》为最杰出的代表作。<\/p><div class=\"subsec\">（2）马尔克斯<\/div><p>①作家概况：哥伦比亚最著名的当代作家，拉丁美洲魔幻现实主义文学最杰出的代表。1982年，他荣获诺贝尔文学奖，《百年孤独》为其获奖代表作。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版20世纪现代主义、后现代主义文学及其他重要作家第15题<\/span>《百年孤独》的思想内容：《百年孤独》是一部意蕴丰富的史诗性作品。第一，描写了布恩迪亚家族一百年的兴衰史。布恩迪亚家族来到马贡多小镇居住，七代人经历了兴起、繁荣、衰落到彻底消失的过程，构成了小说描写的主要内容。第二，象征性地表现了作者对哥伦比亚的历史和现实的认识。作者以布恩迪亚家族七代人充满神奇色彩的生活和经历，以及小镇马贡多由开拓、发展到毁灭的过程，揭露和批判了哥伦比亚国内独裁政权的残暴、殖民主义者和侵略者对拉美民族的政治压迫与经济掠夺。第三，揭示了哥伦比亚及整个拉丁美洲屈辱历史的原因，探讨了如何摆脱与世隔绝状态的途径。通过布恩迪亚家族的百年历史和马贡多小镇的命运，小说对拉丁美洲的社会现实进行了深层次的探讨，指出民族精神的愚昧落后、保守闭塞，才是该地区饱受无休止党派纷争、外来者的经济剥削<\/p><p>与政治压迫的根本原因。同时，以布恩迪亚家族和马贡多的彻底消失，象征性地表现了愚昧落后的可怕后果，警醒人们认清现实，挣脱愚昧、保守的精神枷锁，真正团结起来，才能迎来民族的美好未来。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版后现代主义文学第6题，朱版20世纪现代主义、后现代主义文学及其他重要作家第15题<\/span>《百年孤独》的艺术特色：《百年孤独》是魔幻现实主义文学的经典之作，集中体现了魔幻现实主义文学的艺术特点。第一，用魔幻的手法反映拉丁美洲的社会现实生活。小说将奇迹显现、鬼魂形象、荒诞不经的情节穿插于故事之中，展示了一个虚实融合、人鬼混杂、现实与超自然现象并存的魔幻世界，形象地审视了拉丁美洲与世隔绝、愚昧落后的历史，充分体现了魔幻与现实相融合的特征。第二，大量借鉴西方现代主义文学的表现方法，并在叙事角度上进行了创新。小说借鉴了超现实主义文学的表现方法，运用离奇的想象、梦幻以及梦呓来表现布恩迪亚家族的历史。在叙事上，站在未来的角度进行倒叙，但是在故事展开中又采用了顺叙进行叙事，将再现与审视、魔幻与真实、未来与过去和现在融合在一起，既配合了作品魔幻的特征，也很好地展开了对史诗性题材的开掘。第三，独特的象征手法。小说通过各种富有象征性的场景以及情节，暗示了哥伦比亚的社会历史，从而唤醒人们，走出拉美的落后困境，不仅具有魔幻色彩，而且具有鲜明的现实意义。<\/p>", "star": 1, "key": 1}]}, {"chapter": "第十一章", "title": "亚非文学", "link": {"quiz": "外国文学史习题_分章刷题.html#d10"}, "mindmap": 0, "kps": [{"no": 1, "title": "亚非文学的基本概况", "html": "<p>亚非文学也称为东方文学，与西方文学相对应，包括近东、中东、远东和非洲的文学。亚非文学分为古代亚非文学、中古亚非文学和近现代亚非文学。亚非文学具有悠久的历史和鲜明的民族特色，与宗教关系密切，注重伦理道德教化，同时也吸收了外来民族文学的精华与民间口头文学的特质。亚非文学取得了巨大的成就，对西方文学的产生和发展都起到了积极的作用。<\/p>", "star": 0, "key": 0}, {"no": 2, "title": "古代亚非文学", "html": "<p><b>（1）文学概况<\/b>：古代亚非文学包括古埃及文学、古巴比伦文学、古希伯来文学、古印度文学与古中国文学。其主要成就有古希伯来的《圣经》、印度的两大史诗《摩诃婆罗多》和《罗摩衍那》。<\/p><p><b>（2）<span class=\"srctag\">郑版古代亚非文学第1题<\/span>基本特点：<\/b>①起源早、时间长且具有多源性特征。古代亚非文学早在公元前4000年至公元前3000年古埃及就开始，一直持续发展到公元2至8世纪。与古希腊罗马文学呈现出来的统一性不同，古代亚非文学呈现出多源性的特征。②浓厚的宗教色彩。古代亚非文学与宗教存在着密切的关系，宗教与文学处于相混相融的阶段，许多文学作品本身就是宗教经典。③民间色彩强烈。古代亚非文学大多是民间口头创作，主要文学形式为神话传说、民族史诗和歌谣等。这些作品初期经口头流传，后由人搜集整理而成，具有民间文学的特征。④体裁丰富多样。古代亚非各国文学有各自独特的文学风格和不同面貌的文学形式，体裁丰富多样，有神话、史诗、歌谣、故事、箴言、传记、寓言和戏剧等。<\/p><div class=\"subsec\">（3）《圣经》<\/div><p>①《旧约》文学的类型与主题：作为古希伯来文学的总汇，《旧约》留存了古希伯来人的神话、传说、史诗、史传、小说、抒情诗、智慧文学、先知文学和启示文学等文学类型。古希伯来文学的主题主要呈现为“惩罚与拯救”和“以赛亚意识”。<\/p><p>②《新约》文学：新约文学分为福音书文学、纪事文学、书信文学和启示文学四种类型。福音书文学的中心内容为基督教创始人耶稣的生平和学说。纪事文学的代表作是《使徒行传》，记载了耶稣升天后使徒们四处行道的故事。书信文学主要是“使徒书信”，是初期使徒在传教过程中往来的信件，反映了各地教会的情况，并探讨了初期基督教的信条和教义。启示文学主要是《新约》卷末的《启示录》，主要记述了世界末日的灾难和上帝的审判，以及基督与魔鬼的争战和基督的最后胜利。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版古代亚非文学第2题<\/span>《圣经》文学的特征：第一，《旧约》和《新约》都具有浓郁的希伯来民族的特征，展示了希伯来民族历史的宏伟画卷，但同·时也是地中海沿岸各民族文化融合的产物。《旧约》文学受到了古埃及、两河流域地区、腓尼基等地文学的影响，《新约》文学则更是东西方文化交融的产物。第二，宗教性和理想主义的统一。《旧约》和《新约》都是宗教经典，其基本内容是对上帝的信仰。但是，其中寄托了古希伯来人和早期基督徒对社会理想的美好想象，就是上帝形象本身，也具有超越宗教的文化内涵，成为一个理想主义的精神实体。第三，具有优美的情致、崇高的风格和浓郁的抒情色彩。《圣经》文学保留了古希伯来民族口头文化时期的大量典籍，具有民间文学清新质朴的艺术情致。而出自早期先知之手的作品，则充满了雄辩、精巧和崇高的艺术风格。此外，灵魂渴望被救赎、赞美上帝等宗教感情贯穿全书，浓烈而具有激情，赋予全书以强烈的主观色彩。<\/p><div class=\"subsec\">（4）《摩诃婆罗多》<\/div><p>①<span class=\"keymark\">☆<\/span>思想内容：《摩诃婆罗多》意为“伟大的婆罗多族的故事”，被视为“历史传说”。全书18篇，中心故事只占全诗一半篇幅，其余的则是穿插其中的神话传说和寓言故事。婆罗多人后裔俱卢族和般度族争夺王位，最后两败俱伤的故事，为史诗的中心故事。在史诗中，般度族王子坚战公正、仁慈，俱卢族王子难敌则贪婪、残忍，通过他们两人的冲突，史诗颂扬了以般度王子坚战为代表的正义力量，谴责了以俱卢王子难敌为代表的邪恶势力；同时史诗也描写了王位争夺之战带来的巨大伤亡，表达了印度人民在列国纷争时代的理想和愿望，即终止分裂与混战，实现和平与统一。史诗中的插话，既有独立完整的神话传说和描写爱情故事的诗歌，也有对后世印度教产生重要影响的宗教诗歌，广泛地反映了古代印度人民的生活和思想，被视为印度古代知识的宝库，在印度文化中占有举足轻重的地位，有“第五吠陀”之称。<\/p><p>②<span class=\"srctag\">郑版古代亚非文学第4题<\/span>莎维德丽形象：莎维德丽是《摩诃婆罗多》中一个著名插话故事中的人物形象。她本是一位古代国王的女儿，自愿嫁给流亡森林的瞎子国王的儿子。一年后丈夫死去，死神来带走她丈夫的灵魂，而她则紧紧追随死神，最后凭借忠贞和智慧，赢得了死神的恩惠，不仅让自己的丈夫死而复生，也使得老国王双目复明，并收复了国土。莎维德丽为了捍卫自己的爱情，勇敢、执著、坚强、镇定，她的形象教导人们要不畏强暴，不怕艰辛，在遭到挫折的困难时期，更要坚定信心，勇往直前。<\/p><div class=\"subsec\">（5）《罗摩衍那》<\/div><p>①思想内容：《罗摩衍那》意为“罗摩传”或“罗摩的漫游”，在印度被称为“最初的诗”或“大诗”。它以罗摩与妻子的悲欢离合为主线，描写了印度宫廷内部的王权斗争，谴责了在王权继承问题上争权夺利的行径，批判了反面人物的凶残、无耻，赞扬了正面人物的善良、英勇；表明了人民希望开明君主实行仁政的思想，但也流露出统治阶级的思想意识和道德观念。<\/p><p>②<span class=\"keymark\">☆<\/span>艺术特色：第一，故事情节结构简洁清晰。以主人公的活动为中心情节，通过人物的矛盾展开故事。第二，人物形象栩栩如生、性格鲜明。史诗多用白描和抒情的笔调，着意描绘人物的内心世界，注意人物思想的变化，塑造了一系列个性鲜明、富有生气的人物形象。第三，具有浪漫主义色彩。史诗在自然景物的描写方面成就突出，并与人物塑造结合在一起，做到了情景交融。第四，语言简洁优美，韵律和谐，善于运用比喻、双关、象征、夸张的艺术手法。<\/p>", "star": 1, "key": 1}, {"no": 3, "title": "中古亚非文学", "html": "<p><b>（1）文学概况<\/b>：中古亚非文学的主要成就反映在中国、印度、日本、波斯和阿拉伯等国文学中。印度剧作家迦梨陀娑的剧作《沙恭达罗》，日本作家紫氏部的长篇小说《源氏物语》和波斯诗人萨迪的诗歌集《蔷薇园》，以及阿拉伯民间故事集《一千零一夜》等，为中古亚非文学的代表作品。<\/p><p>（2）<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版中古亚非文学第1题<\/span>基本特点：思想特点：①在宗教思想的影响下，表现出超越现实、追求无限的思想倾向。②注重表情写意、抒发感情，主观内省精神突出。③重视伦理道德，文学带有浓厚的道德色彩。④非主流文学<\/p><p>表现出了对正统的宗教思想、封建伦理道德的反叛，表现了怀疑论思想、民主思想和平民意识。⑤表现出自然山水情趣。艺术特点：①追求和谐美。②表现型文学占据主导地位。③在人物塑造方面，民族英雄和道德文化英雄、女性形象最为突出。④文学表现形式自成一格。中古亚非各民族文学表现形式都具有独特的民族性，但又呈现出一些共性。⑤创作方法和风格丰富多样。<\/p><div class=\"subsec\">（3）迦梨陀娑的《沙恭达罗》<\/div><p>①<span class=\"keymark\">☆<\/span>《沙恭达罗》的思想内容：诗剧《沙恭达罗》以抒情的笔调，描写了净修女沙恭达罗与国王豆扇陀爱情生活的曲折和欢乐。诗剧歌颂了纯真爱情，表现出民主倾向和进步思想，并以婉转的方式批评了统治者的荒淫。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版中古亚非文学第2题<\/span>《沙恭达罗》的艺术特色：第一，情节结构曲折，引人入胜。迦梨陀娑将印度人人皆知的故事拿来，通过艺术构思和创造性的表现，将其讲得生动有趣。其情节衔接自然，层层递进，波澜起伏，前后呼应。第二，人物形象生动鲜明，心理刻画细腻。沙恭达罗形象的塑造，尤为引人注目。戏剧描写了沙恭达罗的天生丽质、纯朴真挚，刻画了她柔中带刚的独特个性，揭示了她内心最细微、最隐秘的思想感情。第三，现实与浪漫、悲剧与喜剧结合。作者描写人间现实生活的同时，也描写了天堂人神来往的景象，以及男女悲欢离合的爱情，具有浪漫主义色彩。而且剧情也在悲剧与喜剧之间相互转换。第四，语言丰富多彩，具有个性化和抒情性。第五，景色描写生动迷人，清新优美，情景交融，富有诗情画意。<\/p><div class=\"subsec\">（4）紫氏部的《源氏物语》<\/div><p>①<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版中古亚非文学第3题）<\/span>《源氏物语》的思想内容：首先，通过对光源氏及其周围女性爱情悲欢离合的描写，反映了平安王朝各个方面的生活，尤其是宫廷贵族的感情生活。其次，表达了佛教因果报应和往生净土的思想。小说描写了佛教的仪式和宗教生活，反映了佛教对当时宫廷社会和上层贵族的影响，宣扬了因果报应和往生净土的宗教思想。再次，通过男女主人公的悲欢离合故事，流露了作者的“物哀”情绪，表现了“对人生不如意的哀感”。最后，虽然作者一再说明只写爱情，不写政治，但仍然在客观上揭示了平安王朝晚期贵族生活的荒淫、奢华，宫廷社会的权力倾轧，贵族阶级必然灭亡的趋势，以及女性的卑下命运。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《源氏物语》的艺术成就：第一，结构阔大，内容庞杂。全书涉及四代天皇，跨越70余年，描写了三代人的爱情悲剧，塑造的人物多达400多个。小说前44回以源氏为主人公，后10回以其子熏君为主人公，前后两部分可以独立成章，但汇集在一起又阐释了因果报应主题。前44回结构松散，但各位女性与源氏的关系，又使这些章节彼此联系在一起。第二，人物形象多姿多彩，生动鲜明。紫氏部以女性特有的细腻和敏感，成功表现了人物心灵的细微感触，展示了人物复杂丰富的内心世界，塑造了具有鲜明个性的人物形象。第三，情景交融，感物兴叹。紫氏部善于以情感化的景物刻画人物，推进情节或烘托人物的心理。第四，诗文结合，语言优美、细腻而优雅。在散文叙述中，交织穿插富于抒情色彩的诗歌，使文与歌融为一体，形成典雅清丽的艺术氛围。<\/p><div class=\"subsec\">（5）萨迪的《蔷薇园》<\/div><p>①<span class=\"srctag\">郑版中古亚非文学第5题<\/span>《蔷薇园》的思想内容：《蔷薇园》是中古波斯诗人萨迪的代表作，分为8篇，包括长短不一的171个故事。首先，同情弱小者，挚爱劳动群众，具有仁爱精神。作者赞美劳动者的纯朴善良品质，歌颂他们蕴藏的巨大力量。其次，谴责暴政，鞭挞社会丑恶。诗人谴责统治者横征暴敛、草营人命的罪行。最后，宣扬仁慈忠厚，在宗教信仰中寄托理想。<\/p><p>②<span class=\"srctag\">郑版中古亚非文学第5题<\/span>《蔷薇园》的艺术特色：第一，采用诗文相间的形式，具有韵散结合的特点。作者往往先通过散文的笔法来叙述故事，再用诗歌对叙述内容进行高度概括，使得作品既具有散文的生动流畅，也饱含诗歌的凝练简洁和韵律感。第二，具有哲理性。该诗文集采用格言警句，总结了大量来自生活的经验，如“勤劳远比黄金贵重”、“事业成于坚忍，毁于急躁”等。第三，风格多样，语言新奇平易。诗文集庄严、诙谐、讽刺的风格于一体，运用白描手法描绘栩栩如生的场面，语言朴实精练而畅达，自然而清新。<\/p><div class=\"subsec\">（6）《一千零一夜》<\/div><p>①<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版中古亚非文学第6题<\/span>《一千零一夜》的思想内容：首先，生动地反映了劳动群众对美好生活的憧憬与追求。故事集贯穿着善与恶、美与丑的斗争，表现了善良战胜邪恶的道德理想、社会理想和宗教理想。其次，真实地描绘了人民群众的现实处境与命运，表现了他们的苦难与不幸，深刻地揭示了人民苦难的根源，批判了统治阶级的骄奢淫逸。再次，讲述了中世纪阿拉伯的商业繁荣和商人航海冒险的生活，表现了阿拉伯人重商的传统，以及阿拉伯人探索进取和慷慨达观的性格气质。最后，歌颂美好的爱情和婚姻，强调了幸福在于真情，反映了人们对美好生活的向往。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版中古亚非文学第6题<\/span>《一千零一夜》的艺术特点：第一，浪漫的幻想和现实人情世态的结合。阿拉伯人想象丰富，具有开放好奇的民族心态。他们将写实与夸张、理想与幻想、神话与现实结合在一起，既达到了审美愉悦的目的，也具有现实意义。第二，框架结构的整一性与众多曲折动人故事的丰富性相结合。《一千零一夜》采用故事套故事的框架结构方式，把数百个故事连成一个整体。而这些故事来自民间口耳相传的传统，具有情节曲折、惊险动人的特征，加之故事丰富多彩，充分体现了民间文学的特征。第三，鲜明的对比手法和生动的细节描写。故事充满善与恶、真与假的对立，以及神话与现实、人物和场景之间的对比，细节描写生动细腻，突出了人物的性格特征，表达了爱憎分明的态度。第四，诗文并茂，语言通俗易懂。故事吸收民间口语的精华，韵散结合，生动活泼，优美流畅，具有较强的抒情色彩。<\/p>", "star": 1, "key": 1}, {"no": 4, "title": "近现代亚非文学", "html": "<p><b>（1）文学概况<\/b>：近现代亚非文学指19世纪下半叶到20世纪下半叶一百多年间亚非各国的文学。其主要成就有夏目漱石的《我是猫》，川端康成的《雪国》，泰戈尔的《吉檀迦利》，纪伯伦的《先知》，马哈福斯的《三部曲》和索卡因的《解释者》。<\/p><p>（2）<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版近现代亚非文学第1题<\/span>基本特点：第一，鲜明的政治倾向性和<\/p><p>时代特色。近现代亚非文学诞生于东方各国民主、民族解放运动的斗争中，以反帝、反殖、反封建为文学主题，要求民族独立解放以及独立后的经济发展和民主政治建设，具有丰富的社会政治内容。第二，既具有世界性，也具有民族性。近现代亚非文学与世界各国文化交流活跃，其本身是在欧美近现代文学的影响下发展起来，在借鉴西方文学的同时，致力于继承民族文化遗产，弘扬民族文化传统，表现出自觉的民族意识。第三，近现代亚非文学借鉴西方文学，从内容到形式都实行了革命，摆脱了传统文学的桎梏，逐渐形成了既具有世界性，又具有民族性的新文学，具有巨大的转折意义。第四，文学形式复杂多样，但仍以现实主义文学为主流。近现代亚非文学在内容和形式上都有所创新，融合西方现代主义各派文学的特点，流派众多，但是现实主义文学仍然占据着主流位置。<\/p><div class=\"subsec\">（3）夏目漱石的《我是猫》<\/div><p>①<span class=\"keymark\">☆<\/span>《我是猫》的思想内容：小说以一只没有姓名的猫作为叙述者，描写了它的主人苦沙弥和一些知识分子的生活交往与言谈行为，尖锐揭露和批判了明治“文化开明”的资本主义社会。小说围绕金田小姐的婚事风波，揭露了资产阶级的低俗、粗鄙和凶狠的剥削本性，批判了弥漫社会的拜金主义风气，抨击了警察制度的反动本质，在赞扬明治时期小知识分子的正直、善良品质的同时，也批判了他们自命清高、无所事事、空虚无聊的性格缺陷，体现了作者对知识分子精神出路的关注与思考。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版近现代亚非文学第3题<\/span>《我是猫》的艺术特色：第一，独特的叙述视角。小说以猫为叙述者，以猫眼看人世，从而产生一种“陌生化”的效果，深化了主题的表达。第二，出色的幽默讽刺艺术。《我是猫》继承了日本诙谐文学的传统，又吸收了西方讽刺文学的手法，对明治维新以后的社会进行了揭露和批判。第三，灵活、自由的结构形式。全书以猫的见闻和感受为主线，以苦沙弥及周围的人物活动为中心，将一些平凡琐碎的日常生活片段连缀在一起，虽然显得松散，但是叙述流畅、自然天成。第四，丰富多彩的语言风格。作品的语言通俗，有生活气息，巧妙地使用汉语、雅语，生动活泼、简洁凝练、含蓄幽默而不失严肃，滑稽而不落俗套。<\/p><div class=\"subsec\">（4）川端康成的《雪国》<\/div><p>①<span class=\"starmark\">★<\/span>《雪国》中的驹子形象：驹子是一位生活在社会底层的乡村女子，最后沦落为一名艺伎，但焕发出美的光彩。她虽然出身贫贱，并沦为“五等艺伎”，但仍然渴望“正正经经的生活”，对真正的爱情充满期待，坚持刻苦学习，勤奋练习三弦，还读小说、记日记，当看到岛村对自己平等相待，便将所有的感情倾注到岛村身上，表现出纯真的心性和对待生活的执著态度。虽然生活艰辛，但她仍然乐观积极，勇于承担责任，为了给师傅的儿子治病，她不惜当艺妓挣钱，显示了她的善良与顽强，也体现了下层女性的坚韧。但是，由于生活的艰辛以及长期的屈辱生活，其性格逐渐发生了一些变化，灵魂开始扭曲，形成了复杂而畸形的病态性格。这些描写既赋予这一人物形象以真实饱满的艺术魅力，也表现了作家川端康成虚无徒劳的人生观和美学思想。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版近现代亚非文学第5题<\/span>《雪国》的艺术特色：第一，在创作方<\/p><p>法上，东西结合，运用了西方现代主义和日本传统文学的多种艺术方法。《雪国》将日本古典文学传统与西方现代主义方法结合起来，运用自由联想和象征手法，细致地描写人物瞬间的感触和朦胧的意识，烘托出富有日本传统美学韵味的虚无主题。第二，在人物塑造上，重视对微妙细腻心理的刻画。《雪国》注重人物纤细的感情和瞬间的感受，常常从细微处进行捕捉和表现。第三，在结构安排上，自由灵活，井然有序。《雪国》在整体上没有严密完整的构思，通过“短篇”连缀起来，而且各部分之间联系松散，但从人物、主题和情节来看，各篇之间有着内在的联系。第四，在作品风格上，既美且悲，抒情意味浓厚。作者继承了日本传统文学的“物哀”和“余情美”，将美与悲融会在一起，创造出悲中有美、美中有悲的独特境界。<\/p><div class=\"subsec\">（5）泰戈尔的《吉檀迦利》<\/div><p>①<span class=\"starmark\">★<\/span>《吉檀迦利》的思想内容：首先，表达了印度教的哲学思想。诗人以诚挚而又热烈的感情表达了希望与神合一的渴望，歌颂了神的无限的恩赐、无限的爱和无限的意志。其次，通过献给神的颂歌，歌唱了生命的荣枯、现实世界的欢乐与悲哀。再次，表达了爱国主义思想和对光明、自由的追求。诗集中的神，无所不在，既是印度教中的神，也是人类美好理想和真理的化身。诗歌通过对神人合一渴望的表达，探讨了人生理想和祖国、民族的前途，歌颂了光明与自由，表达了民主平等和自由进步的社会理想，以及博爱、和平的人道主义思想，充满着浓烈的爱国主义精神。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版近现代亚非文学第6题<\/span>《吉檀迦利》的艺术特色：第一，哲理性与抒情性的完美结合。诗集将泛神论哲学思想融化在优美的诗行之中，以真挚的感情表达了对理想的追求，抒情色彩浓厚。第二，诗歌语言和意象朴实无华，清新动人。诗歌运用口语，选取日常生活中最基本、最常见的形象入诗，突出这些形象可感、可触、可视的特征，形成具体朴实、清新动人的风格。第三，散文诗的韵律。诗歌吸收了格律诗所特有的重复和音节相同的原则，结合了散文诗千变万化的特点，创作了具有内在节奏感的韵律。<\/p>", "star": 1, "key": 1}]}];
