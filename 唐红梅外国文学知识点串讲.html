  var stat = document.getElementById('stat');
  var html = '', toch = '';

  DATA.forEach(function(ch, ci){
    var link = ch.link;
    var mm = ch.mindmap ? ' <a href="思维导图/外国文学史导图.html">配套导图 →</a>' : '';
    toch += '<a class="toc-ch" href="#ch'+ci+'">'+ch.chapter+' '+ch.title+'<span class="cnt">'+ch.kps.length+'</span></a>';
    ch.kps.forEach(function(k){
      toch += '<a class="toc-kp" data-kp="ch'+ci+'-k'+k.no+'" href="#ch'+ci+'-k'+k.no+'">'+k.no+'．'+k.title+'</a>';
    });
    html += '<section class="chapter" id="ch'+ci+'">'
      + '<h2 class="ch-h"><span class="idx">'+ch.chapter+'</span>'+ch.title+'</h2>'
      + '<div class="ch-links"><a href="'+link.quiz+'">本章刷题 →</a>'+mm+'</div>';
    ch.kps.forEach(function(k){
      var badges = '';
      if(k.star) badges += '<span class="badge star">★ 高频考点</span>';
      if(k.key)  badges += '<span class="badge key">☆ 重要知识点</span>';
      html += '<details class="kp" id="ch'+ci+'-k'+k.no+'" data-star="'+(k.star?1:0)+'" data-key="'+(k.key?1:0)+'">'
        + '<summary><span class="knum">'+k.no+'.</span><span class="ktitle">'+k.title+badges+'</span></summary>'
        + '<div class="body">'+k.html+'</div></details>';
    });
    html += '</section>';
  });
  toc.innerHTML = toch;
  content.innerHTML = html;

  /* 搜索 + 筛选 */
  var qEl = document.getElementById('q'), curF = 'all';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function apply(){
    var kw = qEl.value.trim().toLowerCase();
    var shown = 0, total = 0;
    document.querySelectorAll('.kp').forEach(function(el){
      total++;
      var okF = (curF==='all') || (curF==='star' && el.getAttribute('data-star')==='1')
              || (curF==='key' && el.getAttribute('data-key')==='1');
      var okK = !kw || (el.textContent.toLowerCase().indexOf(kw) >= 0);
      var vis = okF && okK;
      el.style.display = vis ? '' : 'none';
      if(vis) shown++;
      var t = el.querySelector('.ktitle').textContent;
      var tid = el.id;
      var tl = document.querySelector('.toc-kp[data-kp="'+tid+'"]');
      if(tl) tl.classList.toggle('hit', vis && !!kw && (t.toLowerCase().indexOf(kw)>=0));
    });
    document.querySelectorAll('.chapter').forEach(function(sec){
      var any = false;
      sec.querySelectorAll('.kp').forEach(function(el){ if(el.style.display!=='none') any=true; });
      sec.style.display = any ? '' : 'none';
    });
    stat.textContent = '显示 ' + shown + ' / ' + total + ' 个知识点';
  }
  var deb=null;
  qEl.addEventListener('input', function(){ clearTimeout(deb); deb=setTimeout(apply, 250); });
  document.getElementById('toolbar').addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if(!b) return;
    if(b.getAttribute('data-f')){
      curF = b.getAttribute('data-f');
      document.querySelectorAll('#toolbar button[data-f]').forEach(function(x){ x.classList.toggle('on', x===b); });
      apply();
    }
  });
  document.getElementById('ex-all').onclick = function(){ document.querySelectorAll('.kp').forEach(function(el){ if(el.style.display!=='none') el.open = true; }); };
  document.getElementById('co-all').onclick = function(){ document.querySelectorAll('.kp').forEach(function(el){ el.open = false; }); };

  /* 字号 */
  function getFs(){ return parseFloat(localStorage.getItem('thm_fs')||'17'); }
  function setFs(v){ v=Math.max(13,Math.min(26,v)); localStorage.setItem('thm_fs',v);
    document.documentElement.style.setProperty('--fs',v+'px'); }
  setFs(getFs());
  document.getElementById('fs-plus').onclick = function(){ setFs(getFs()+1); };
  document.getElementById('fs-minus').onclick = function(){ setFs(getFs()-1); };

  /* hash 定位自动展开 */
  function openTarget(){
    var m = (location.hash||'').match(/^#(ch\d+-k\d+)$/);
    if(m){ var el = document.getElementById(m[1]); if(el){ el.open = true; } }
  }
  window.addEventListener('hashchange', openTarget);
  openTarget();
  apply();
})();
</script>
<!-- back-to-plan-patch --><script>
/* 返回计划：从《百日冲刺计划》跳来的页面右下角会出现返回按钮 */
(function(){
  var qs = location.search || '';
  if(!/[?&]from=plan/.test(qs)) return;
  var m = qs.match(/[?&]d=(\d+)/);
  var href = '百日冲刺计划.html' + (m ? '?d=' + m[1] : '');

  function go(){
    if(window.opener && !window.opener.closed){
      try{ window.opener.focus(); }catch(e){}
      try{ window.close(); }catch(e){}
      if(window.closed) return;          /* 关掉了：原来那个标签就停在出发那天 */
    }
    location.href = href;                /* 关不掉就本标签跳回去 */
  }

  function draw(){
    if(document.getElementById('__backPlan')) return;
    var st = document.createElement('style');
    st.textContent =
      '#__backPlan{position:fixed;right:16px;bottom:16px;z-index:99999;font-family:inherit;'+
      'font-size:14px;font-weight:700;line-height:1;color:#fff;cursor:pointer;border:none;'+
      'background:linear-gradient(120deg,#9a3b2e,#c8902a);padding:12px 18px;border-radius:99px;'+
      'box-shadow:0 6px 20px rgba(154,59,46,.34);letter-spacing:1px;'+
      'transition:transform .15s,box-shadow .15s}'+
      '#__backPlan:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(154,59,46,.44)}'+
      '#__backPlan:active{transform:translateY(0)}'+
      '#__backPlan small{font-weight:400;opacity:.86;font-size:12px}'+
      '@media print{#__backPlan{display:none}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.id = '__backPlan'; b.type = 'button';
    b.innerHTML = '\u2190 返回计划' + (m ? ' <small>D-' + m[1] + '</small>' : '');
    b.onclick = go;
    document.body.appendChild(b);
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', draw);
  else draw();
})();
</script>
