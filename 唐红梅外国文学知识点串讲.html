  font-weight:600;line-height:1.5;}

.kp .ktitle{flex:1;}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;
  margin-left:8px;vertical-align:2px;letter-spacing:1px;}
.badge.star{background:#fdecea;color:var(--star);border:1px solid #f5c6c0;}
.badge.key{background:#faf3e3;color:var(--key);border:1px solid #ecd9a8;}
.kp .body{padding:4px 18px 14px 34px;font-size:.96em;}
.kp .body p{margin:.65em 0;text-align:justify;}
.kp .body b{color:#1d1812;}

  border-left:3px solid var(--accent2);padding-left:9px;}
.srctag{display:inline-block;font-size:.78em;color:var(--src);background:#eef4f1;
  border:1px solid #d3e2db;border-radius:4px;padding:0 7px;margin:0 2px;vertical-align:1px;letter-spacing:.5px;}

.keymark{color:var(--key);font-weight:700;}

/* 收起态提示 */
.kp>.body{display:none;}
.kp[open]>.body{display:block;}
@media (max-width:860px){

}

<script>
var DATA = [{"chapter": "第一章", "title": "古代文学", "link": {"quiz": "外国文学史习题_分章刷题.html#d0"}, "mindmap": 1, "kps": [{"no": 1, "title": "欧洲古代文学的内容与特征", "html": "<p><b>（1）内容<\/b>：欧洲古代文学包括古希腊文学和古罗马文学。<\/p><p><b>（2）基本特征：<\/b>古希腊、古罗马文学是奴隶社会的产物，反映了欧洲从氏族社会向奴隶制社会过渡时期的现实生活，是西方文学的开端。生命意识、人本意识和自由观念是古希腊、古罗马文学的基本精神，也是后来欧洲文学与文化的基本精神内核。<\/p>", "star": 0, "key": 0}, {"no": 2, "title": "古希腊文学概况", "html": "<p><b>（1）<span class=\"starmark\">★<\/span><span class=\"srctag\">朱版古代文学第1题<\/span>分期<\/b>：①公元前12世纪至公元前8世纪，这是古希腊从氏族社会向奴隶制社会过渡的时期，史称“荷马时代”，这时文学的主要成就是神话和史诗。《荷马史诗》、赫西俄德的《工作与时日》和《神谱》为代表作品。②公元前8世纪至公元前6世纪，这是古希腊奴隶制社会开始形成的时期，历史上称为“大移民时代”，这一时期文学的主要成就是抒情诗和寓言，代表诗人有品达、萨福和阿那克里翁。伊索为杰出的寓言作家，其《伊索寓言》对后来法国、德国和俄国的寓言创作产生了直接影响。③公元前6世纪末至公元前4世纪初，这是古希腊奴隶制发展的全盛时期，史称“古典时期”。这一时期文学的主要成就是戏剧、散文和文艺理论。戏剧家的代表有悲剧诗人埃斯库罗斯、索福克勒斯和欧里庇得斯，以及喜剧诗人阿里斯托芬，各自的代表作分别为《被缚的普罗米修斯》、《俄底浦斯王》、《美狄亚》和《鸟》。柏拉图和亚里斯多德为文学理论家，其各自的论著《理想国》和《诗学》奠定了欧洲文艺理论的基础。④公元前4世纪末至公元前2世纪，史称“希腊化时期”，文学的主要成就是新喜剧和田园诗。新喜剧的扛鼎者为米南德，《恨世者》为其代表作。<\/p><p>（2）<span class=\"keymark\">☆<\/span>地位：古希腊文学是欧洲文学的源头。①文学样式丰富，既有神话、史诗、悲剧、喜剧，又有寓言、抒情诗、散文和小说，为后来的欧洲文学提供了范例。②在反映的内容和表达的主题方面，古希腊文学贯穿了热爱生活、肯定现实、赞扬人的能力与智慧的人生哲学，奠定了欧洲文学精神价值追求的基本特征和内容。③在创作方法上，已经具有了现实主义和浪漫主义两种因素，为后来的文学创作提供了借鉴。④文艺理论发达，形成了再现说和表现说两种文艺观，开启了此后唯物主义和唯心主义两种文艺思想的先河。<\/p>", "star": 1, "key": 1}, {"no": 3, "title": "希腊神话", "html": "<p>（1）<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版古代文学第1题<\/span>产生根源：①希腊神话是生产力发展处于低级阶段的反映。古代希腊人由于生产力水平低下，知识不足，对于自然灾害和自然现象难以理解，只能借助想象作出解释。他们根据自己的判断，认为大自然的一切现象、一切变化，都必然是神力在操纵，于是就赋予各种自然力量以神的形象。②希腊神话的起源跟希腊人的原始崇拜关系密切。古代各希腊城邦宗教崇拜的对象，正是古希腊神话中的神和英雄。③希腊神话也源于氏族社会记录历史、解释人伦关系的需要。古希腊神话不仅是古希腊人建立原始宇宙观的必然结果，也是古希腊人试图记录社会发展过程、建立社会秩序的反映，为民除害的英雄、发明工具的巧匠逐渐被尊奉为神，伦理道德秩序通过英雄的故事得到传播。④此外，弗洛伊德认为神话起源于古代人的“白日梦”。他认为神话是人类的世俗梦想歪曲了事实之后的产物。从这一角度来理解古希腊神话的起源也是值得尝试的。总之，古希腊神话起源于多方面的社会、历史、文化和心理需求，古希腊神话也就曲折地反映了古希腊的自然和社会形式。<\/p><p>（2）<span class=\"starmark\">★<\/span><span class=\"srctag\">朱版古代文学第2题<\/span>内容：古希腊神话包括神的故事和英雄传说。<\/p><p>①神的故事：主要涉及到开天辟地、神的产生、神的故事、神的谱系、人类的起源等内容；神的故事中又包括旧神与“俄林波斯神系”。②英雄传说：主要是对远古的历史、社会生活和人与自然作斗争等事件的回忆。这些英雄都被说成是神与人结合所生，实际上代表了集体的力量和智慧。英雄传说以不同的英雄为中心形成了许多体系，其中伊阿宋盗取金色羊毛的故事、七雄攻打忒拜的故事、俄底浦斯王的故事、特洛伊战争的故事和奥德修斯的故事等最为突出。<\/p><p><b>（3）艺术形象：<\/b>俄林波斯山的主神有十二个，具体哪十二个，说法不一，但其家长都是宙斯。其次还有阿波罗、赫淮斯托斯、赫耳墨斯、狄俄尼索斯等。另外还有一些美丽的女神形象，如雅典娜、阿耳忒弥斯、阿佛洛狄忒等。希腊神话中神的形象具有与人同形同性的基本特征，他们有人的形体和七情六欲，不同的是他们具有永恒的生命、非凡的体魄和超人的能力。英雄大多是神与人所生的后代，介于人神之间，担当着人的保护者角色。丑恶的怪物形象也是希腊神话中的一组艺术形象，这类形象具有人兽混合的特征，是人类灾难的化身，衬托了英雄的勇武和智慧。总之，希腊神话的艺术形象反映了古代原始氏族社会的社会生活，也记录了人类早期社会朴素的道德观念和社会发展的痕迹。<\/p><p>（4）<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版古代文学第1题，朱版古代文学第2题<\/span>艺术特点：①古希腊神话最大的特点就是众神的高度人格化，人神同形同性。古希腊绝大部分神不仅形体与人相似，而且思想感情的活动也与人一致，都有七情六欲、喜怒哀乐。②希腊神话具有极强的想象力、故事性和哲理性。它把自然万事万物拟人化、神化，通过想象创造出鲜明的形象；而且希腊神话故事完整，情节曲折，十分生动；再者它们都是先民劳动经验的积累和智慧的结晶，许多故事寓意丰富。③创作方法多样。希腊神话中既有现实主义的真实描写，也有浪漫主义的想象和夸张，具有强大的艺术生命力。<\/p><p><b>（5）<span class=\"srctag\">朱版古代文学第2题<\/span>希腊神话在古希腊文学中的重要性：<\/b>①希腊神话是希腊文学不可分割的宝贵部分。希腊神话是古希腊人民对现实社会的最早的艺术反映。②希腊神话是希腊艺术的武库，也是它的土壤。希腊神话思想性和艺术性都达到了相当高的程度，可以说是人类再也难以企及的典范。希腊一切文学艺术作品，大多以神话为题材，无论是史诗、悲剧还是后来的美术、雕塑都取材于此，从而保留了希腊神话，也促进了文学艺术的发展。<\/p><p><b>（6）对后世的影响：<\/b>古希腊神话是整个欧洲文学艺术的土壤与宝库，对后世影响深远。①古希腊神话不仅为古希腊时期的文学艺术奠定了基础，而且也为后来欧洲文学艺术的发展提供了丰富的艺术素材和创作灵感。从古罗马时期开始，欧洲的作家、艺术家就不断地从古希腊神话中获得灵感，创作出新的作品。例如，维吉尔的《埃涅阿斯纪》和奥维德的《变形记》就直接脱胎于古希腊神话。中世纪的但丁，17世纪古典主义悲剧家，18世纪的弥尔顿，19世纪浪漫主义作家诗人，直到20世纪西方现代派作家，都不乏以古希腊神话为题材的作品。这些欧洲历代文学家、艺术家的再创造，保存了完整的希腊神话并使其不断焕发出新<\/p><p>的艺术生命力，持续不断地为文学发展做出贡献。②人类童年的美好记忆，具有永久的艺术生命力。希腊神话是人类童年时代不自觉的艺术产物，是正常儿童全面发展的艺术表现，不仅就古代神话来说是一种“规范和高不可及的范本”，而且还因为反映了古希腊原始初民的哲学思想和人文意识，体现出生机勃勃的抗争精神和以人为本的思想，为此后西方文化的发展创新提供了基础与动力，也是促进人类进步的巨大的精神源泉。<\/p><p><b>（7）希腊神话与中国古代神话的比较：<\/b>①从起源上讲，两类神话都是人类社会发展处于原始阶段的产物。人类由于自身生产力的低下和知识的缺失，对于自然界的现象理解有限，便将一些自然现象理解为神的意志，从而产生了神话。但是，二者产生的具体时间不同，这反映在它们对人的起源的认识和表现上。古希腊认为人类来源于男性，把普罗米修斯当作人类的始祖，认为他用泥土模仿天神的模样创造了人类。中国神话认为人类来源于女性，把女娲当作人类的始祖，认为是她捏合黄土仿照自己的模样造出了人类。②从神话反映的内容和主题上看，希腊神话多反映神的故事，但赞美的则是人的能力和才智，肯定现实人生的幸福，表达了对智慧和力量的推崇。中国神话多围绕劳动展开，神的故事和形象往往具有历史化的特点，多肯定神和英雄的优秀品质，表现出历史化和伦理化的倾向。③从神的形象上看，希腊神话中的众神具有神人同形同性的特点。希腊神话中的大多数神摆脱了兽形的特征，而具有人的形象，并有着与人一样的喜怒哀乐和爱恨情仇。中国神话中的神则多具有人兽同体的特征，其道德上的超凡之处常常得到突出。总之，两者的相同，反映了人类神话产生的共同历史背景；而两者的差异，揭示了两者产生的具体时间之不同，也展现了人类神话的多样性，还折射了不同地域和文化的独特性。<\/p>", "star": 1, "key": 1}, {"no": 4, "title": "荷马史诗", "html": "<p>（1）<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版古代文学第3题<\/span>形成过程<b>：<\/b>①公元前12世纪末，古希腊的阿开亚人与小亚细亚的特洛伊人之间爆发了一场为时十年的战争，战争结束后，战争中涌现的氏族部落领袖的英雄故事就流传开来，在传诵过程中，这些故事不仅跟神话交织在一起，而且还逐步系统化。②公元前9世纪至公元前8世纪，民间艺人对故事进行了整理，形成了两部史诗的规模，具有了完整的情节和统一的风格。荷马可能是其中成绩较为突出的代表性人物。③公元前6世纪中叶，史诗形成文字。公元前3世纪至公元前2世纪，亚历山大学者做了最后的修订，将两部史诗各分成24卷，形成了今天的定本。<\/p><p><b>（2）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版古代文学第4题，朱版古代文学第3题<\/span>思想内容<\/b>：两部史诗各自反映的内容既具联系，又有区别。《伊利昂纪》是一部正面描写氏族战争的英雄史诗，再现了阿开亚人围攻特洛伊城的故事，歌颂的是战争中的英雄；《奥德修纪》描写的是攻城英雄奥德修斯在战争结束后回归家乡的经历，展现的是人与自然的抗争，以及对家庭的维护，赞扬的是人的勇敢、智慧和毅力。但是，两部史诗都表现出共同的思想。①通过英雄形象的描写，表现了古希腊人个体本位的<\/p><p>价值观念。史诗中的英雄通过自己的力量和智慧夺取胜利，敌我双方的英雄都得到了史诗的歌颂。个人荣誉、爱情、财富、王位都是英雄们行动的动机，呈现出热爱生活，肯定和追求人的现实幸福与价值的乐观精神。②通过对众神的描写，表现了古希腊人古朴的哲学观和人文意识。《荷马史诗》聚焦于人间的故事，但反映的却是一个人神共处的世界。在这里，神拥有神力，掌管着自然力量，统领着神界、人界与冥府，将知识和智慧带给人类，也将灾难和祸害送到人间。此外，神跟人别无二致，具有人的性格特征和生活模式，跟人来往密切。神的特征和神人关系，流露了古希腊人古朴的哲学思想和人文意识。③通过描写人与命运的冲突，表现了古希腊文学和文化中的悲剧意识。古希腊人相信命运，甚至认为神都难以干涉命运的发展，命运与死亡成为巨大的阴影笼罩着希腊人的生活，但是史诗中的英雄不仅没有消极地屈从命运，相反还呈现出充满英雄气概的积极抗争精神，凸显出强大的主体性力量，反映了古希腊人积极的人生观和独特的悲剧意识。<\/p><p><b>（3）<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版古代文学第3题<\/span>人物形象<\/b>：荷马史诗刻画了一系列古代英雄的形象。这些形象既有部落英雄英勇善战的共同属性，又有初步形成的个性特征。最重要的人物形象有三个，即阿基琉斯、赫克托耳和奥德修斯。①阿基琉斯：古代英勇战士的理想形象，带有神话色彩。他是神与人之子，是一个非常骁勇又重视个人荣誉的将领。他自然而又自觉地遵从部落集体利益，但任性执拗，一旦个人利益与集体利益发生冲突，就从战场中退出，造成希腊人的失利；同时他也爱好荣誉，忠于朋友，为给好友报仇雪恨，重新披挂上阵，扭转了战争局面，帮助阿开亚人夺得最后的胜利。在这个氏族英雄的身上，其英雄主义具有了开始萌芽的个人意识，也使得这一形象具有了生动真实和具体鲜活的艺术魅力。②赫克托尔：是一个明确并履行自己光荣职责的氏族英雄形象。他的骁勇善战仅次于阿基琉斯，但他更富于集体主义精神。他将为部落牺牲看成是一种最高的荣誉，明知不敌对方，仍毅然告别家人，奔赴战场，体现了一名部落英雄的集体主义精神和崇高的道德品质。同时，他感情丰富而细腻，性格温和，对妻儿老小情真意切，深受同族与部落的拥戴，在他身上充分体现了荷马时代的英雄观念。③奥德修斯：是一名足智多谋的政治家和部落领袖。除了英勇、顽强、战斗不息等英雄特征之外，他最突出的个人特征是智慧过人。凭借智慧和勇敢，他帮助阿开亚人赢得了胜利，并最终在漂泊十年后回到家乡，保护了自己受到威胁的财产与妻子。奥德修斯的智慧，以及他为维护个人私有财产、个人权利和家庭荣誉而进行的斗争，都体现了人的个人意识的觉醒。<\/p><p>（4）<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版古代文学第4题，朱版古代文学第4题<\/span>艺术特征：①结构精湛、布局完整。史诗涉及的内容繁杂，但经过精心剪裁和巧妙布局，将中心情节集中在一小段时间、一个人物或突出事件上，将其他的故事以穿插或倒叙的方式表现出来，既反映了事件的全貌，又突出了重点，显示了结构的严整与统一。例如，《伊利昂纪》围绕着阿基琉斯的两次愤怒展开，突出了英雄主义主题；而《奥德<\/p><p>修纪》则以奥德修斯返回家乡为主线，辅以儿子忒勒马科斯出门寻找父亲的副线，错落有致地交替展开，揭示了回乡的急迫与重要。②采用多种描写方法塑造了众多鲜明生动的人物形象。作品中人物众多，天神、英雄、贵族女性、奴隶和怪物，皆特征鲜明，生动鲜活。众多的英雄形象既具有氏族英雄的共性，又个性鲜明。在具体塑造人物形象的过程中，史诗通过运用细节描写、心理刻画、个性化的语言、特定的修饰语以及环境的烘托，达到了突出不同人物个性特点的目的。③语言质朴、自然，叙述明晰轻快又不失沉稳与庄严，大量使用比喻和重复的叙述手法，便于记忆和传诵，也到达了修饰与强调的目的。④体现了现实主义精神与浪漫主义色彩的结合。史诗一方面描写战争、漂流等人间现实生活，另一方面又融合了神话故事、天堂地狱场景，获得了神奇瑰丽的艺术效果。<\/p>", "star": 1, "key": 1}, {"no": 5, "title": "古希腊悲剧", "html": "<p>（1）<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版古代文学第5题<\/span>起源与特征<b>：<\/b>①古希腊悲剧起源于民间祭祀酒神狄俄尼索斯的歌舞和仪式。公元前6世纪初，在伯罗奔尼撒流行庆祝狄俄尼索斯性质的合唱，这种合唱构成了古希腊悲剧歌队的前身；当这种合唱传入古希腊地区之后，担任领队的诗人首创回答，与歌队对唱，由此产生了古希腊戏剧的第一个角色；在埃斯库罗斯创作期间，他对悲剧进行了改革，增加了第二个演员，使严格意义上的戏剧对话成为可能，并削弱了歌队的合唱成分，增加了戏剧的对话性，由此，希腊悲剧的形式和主体才固定下来。②古希腊悲剧大都取材于神话和传说，但都具有很强的现实意义，表现出强烈的民主思想和英雄主义精神。<\/p><p><b>（2）<span class=\"starmark\">★<\/span><span class=\"srctag\">郑版古代文学第5题，朱版古代文学第6题<\/span>三大悲剧诗人及其艺术上的特征<\/b>：古希腊产生过许多悲剧作家，其中以埃斯库罗斯、索福克勒斯和欧里庇得斯最具代表性。①埃斯库罗斯：古希腊悲剧之父，是希腊悲剧形成时期的代表作家，生活在雅典民主制开始形成的时期。相传他创作了70部悲剧，仅留存7部，代表作为《被缚的普罗米修斯》和《俄瑞斯忒亚》。他对希腊悲剧艺术做出了重大贡献，把演员从一个增加到两个，使得戏剧冲突的双方都拥有了代言人，加强了对话部分，削弱了歌队的作用；首创了三部曲的形式；在演出技巧上也进行了不少改革，创造了舞台背景，运用华丽的服装，使面具初步定型化；着重从独白、对话上刻画人物，描写巨人式的英雄形象。其悲剧风格庄严崇高，抒情气氛浓厚，但情节比较简单，人物性格缺乏发展。②索福克勒斯：索福克勒斯是雅典民主制盛极而衰时期的悲剧诗人，他把古希腊悲剧艺术的发展推向高峰，被誉为“悲剧艺术中的荷马”。《俄底浦斯王》和《安提戈涅》是其最杰出的作品。在悲剧艺术发展中，他增加了第三个演员，让歌队参与剧情，使悲剧冲突的表现得到更加深广的背景；其悲剧结构完美紧凑，技巧娴熟；着重从行动上刻画人物，描写理想化的人物。③欧里庇得斯：欧里庇得斯与索福克勒斯生活在同一时代，但思想更具民主性。因热心研究哲学，故有“舞台上的哲学家”称号。《美狄亚》和《特洛伊妇女》是他最著名的作品。欧里庇得斯着重从心理活动上刻画人物，不太关注戏剧结构；关注女性命运问题，其剧作多以塑造女性主人公为主，流露出浓厚<\/p><p>的女权意识；现实针对性强烈，神话中的英雄在其笔下变成了有道德缺陷的小人，而女性则成为了被同情或赞扬的对象，其创作标志着英雄悲剧的结束。<\/p><div class=\"subsec\">（3）《俄底浦斯王》<\/div><p>①<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>剧情梗概：《俄底浦斯王》叙述了一个杀父娶母的骇人故事。忒拜王拉伊俄斯从神谕中得知他的儿子命中注定要犯下杀父娶母的罪行，儿子一出生，国王便命令牧羊人将其抛弃荒山等死，但是牧羊人将婴儿送给了邻国科林索斯国王的仆人，这个孩子被抱往科林索斯后被国王认养成人，取名俄底浦斯。成年后，俄底浦斯也从神谕中得知日后杀父娶母的命运，于是逃离科林索斯，在前往忒拜的路上偶遇生父拉伊俄斯，在争吵中失手杀死了父亲。由于他破译了斯芬克斯之谜，被王位空缺的忒拜拥立为国王，又娶王后为妻并生儿育女。由于俄底浦斯犯下了乱伦大罪，遭到天谴，神示在忒拜降下瘟疫。当先知转告神谕，说只有严惩杀死前国王的凶手才能消除瘟疫之后，俄底浦斯认真查处，最后发现凶手是自己，他也惊骇地看到杀父娶母预言的实现。最后，王后在羞愧中自杀，俄底浦斯刺瞎双眼，并自行流放，完成了对自己的惩罚。<\/p><p>②<span class=\"keymark\">☆<\/span>俄底浦斯形象：俄底浦斯王是《俄底浦斯王》的主要人物形象，他虽然犯下了杀父娶母的罪过，但却是这部悲剧作品歌颂的对象。首先，俄底浦斯是一个贤明的君王，表现出爱民负责的性格特征。他看到忒拜遭受瘟疫，亲自走出王宫，听取百姓的请求。对瘟疫造成的危害，他感到伤心难过。为了拯救城邦，派人前往神庙听取建议。当得知瘟疫流行跟杀死先王的凶手逍遥法外有关后，亲自领导和追查凶手。当认识到凶手跟自己有关的时候，他没有选择逃避，而是坚持一查到底。而当查明真相后，他没有进行辩解，也不推卸责任，而是严厉惩罚自己，实现了严惩凶手的诺言。其次，他还是一个敢于反抗不幸命运的英雄。为了摆脱杀父娶母的厄运，成年的俄底浦斯离开了生活的城邦，但不幸却向自己的出生地走去。他猜出了斯芬克斯之谜，为忒拜城扫除了一大祸害，却被推举为王位空缺的忒拜的国王，并按照当地的规定，继承了先王的妻子，不知不觉中完成了命运的谶语。在既定的悲剧性命运面前，他选择了抗争，而不是接受，在抗争中呈现了自己正直诚实、意志坚强、富有高度责任感的优秀品质，成为一位值得同情的主人公。所以，虽然俄底浦斯在跟命运抗争中走向了毁灭，但是，他却成了悲剧歌颂的对象。借由他的毁灭，悲剧进而质疑了命运的合理性与权威。<\/p><p>③<span class=\"srctag\">朱版古代文学第8题<\/span>思想内容：该悲剧的思想内容主要通过其中的悲剧冲突反映出来。在俄底浦斯抗拒命运、追查凶手的过程中，他却不知不觉向命运的最后结局走去，将追查导向自己，展示了自己作为一个国王和一名英雄的优秀品质。所以，通过他的毁灭，悲剧质疑了命运的合理性和正义性，对俄底浦斯倾注了同情，赞扬了他的坚强意志和英雄行为，肯定了人敢于反抗命运的主体精神，反映了雅典奴隶主民主派的思想意识。<\/p><p>④<span class=\"srctag\">朱版古代文学第8题<\/span>结构艺术：《俄底浦斯王》在结构上堪称希腊戏剧的典范，索福克勒斯因此获得“戏剧艺术中的荷马”之称。首先，采用了倒叙的手<\/p><p>法，将俄底浦斯杀父娶母的事实留待最后揭露，而寻找杀死老国王的凶手就成了剧情发展的推动力，不同人物的上场，逐渐将点滴往事一一披露，最后导致了剧情的突转。其次，善于利用和制造悬念。戏剧一开场就将寻找凶手的急迫性提了出来，但是直到最后，凶手才得到确认，这一悬念激发了观众急切的心情，也增加了戏剧冲突的紧张程度。而随着剧情的进展，为寻找和确认凶手，不同的证人被召来，新的悬念被带进戏剧中，也推动了戏剧冲突的发展。再次，巧妙运用“突转”和“发现”来增强悲剧效果。主人公由逆境转为顺境，又从顺境转为逆境，通过不断的突转，最后引出发现，将矛盾冲突推向高潮，也使悲剧气氛得到了进一步的烘托与强化。<\/p><div class=\"subsec\">（4）《美狄亚》<\/div><p>①剧情梗慨：科尔喀斯公主美狄亚爱上了前来取金羊毛的异域王子伊阿宋，帮助伊阿宋盗走了金羊毛，并在与伊阿宋逃跑中杀死追来的兄弟。两人来到科林索斯，生下了两个儿子。为了个人荣华富贵，伊阿宋准备另娶科林索斯公主，并将美狄亚和两个孩子放逐。在忍无可忍的情况下，为了报复丈夫，美狄亚设计毒死了公主，又忍痛杀死了两个儿子，绝了丈夫的后嗣，然后乘坐龙车带着两个孩子的尸体逃离科林索斯。<\/p><p>②<span class=\"starmark\">★<\/span>主题：通过美狄亚被抛弃的命运，反映了当时社会变革时期女性的现实处境，表达了争取女性权益的主题。在当时的奴隶制社会中，一夫一妻制已经稳定，但婚姻和家庭只对女性有约束力，而男子却可以为所欲为，女性在家庭和群体中社会地位低下。作者注意到妇女地位问题，并能站在女性的立场上反映这一问题，谴责了男女不平等的社会现象，抨击了伊阿宋忘恩负义的行为，对美狄亚这类女性表示了同情，借美狄亚的台词为女性权益进行了声辩，表明了剧作家进步的女性观。此外，通过美狄亚和伊阿松的故事，悲剧描写了伊阿宋贪婪自私、背信弃义的形象，表达了作者对社会的批判态度和民主主义思想。伊阿宋从神话故事中的英雄一下跌落为无耻小人，寄托了作者对雅典民主制衰落之后社会现实的批判之情，表达了其民主主义思想。<\/p><p><b>（5）古希腊戏剧和中国戏剧的比较<\/b>：西方戏剧比中国戏剧早一千多年，而且产生于截然不同的文化环境，两者的差异远远多于二者的相同之处。①从戏剧的思想主题上看，古希腊戏剧比较强调戏剧的思想教化作用，把戏剧的审美功能和教育功能联系在一起。中国戏剧受“文以载道”思想的影响，强调道德的评价和道德的取向，认为戏剧应该以伦理道德教化为主。②从戏剧艺术上看，两者差异突出。古希腊戏剧注重叙事，而中国戏剧注重抒情；古希腊戏剧注重描写人物的行动与对白，中国戏剧注重人物的说唱以及人物的心理活动，捕捉人物微妙的内心感受；古希腊戏剧注重写实，中国戏剧注重写意；古希腊戏剧歌乐舞分离，而中国戏剧歌乐舞三位一体；古希腊戏剧结构形式完整、严谨，重视突转的作用，而中国戏剧结构比较灵活，不受具体时空限制。③中希悲剧问题。对中希悲剧的认识，通常的观点反映在朱光潜论中西悲剧的看法上。朱光潜认为中国古代没<\/p><p>有悲剧，因为中国古代戏剧不论人物和事件怎样悲惨，不论戏剧本身含有多么强烈的悲剧因素，到最后总是有一个扬善惩恶的大团圆结尾，有悖于西方悲喜剧之间界限分明的审美定势和价值取向。但是，事实上中国戏剧中有许多充满悲剧气息的作品，它们的存在确实反映了中希悲剧的不同，但也提醒人们应该避免以西就中的生硬。产生于古希腊悲剧创作基础上的悲剧概念或悲剧观念具有借鉴价值，但是难以完全涵盖中国戏剧中的悲剧作品，就中国戏剧理念和创作实践来看，中国的悲剧是具有中国自己特色的悲剧。<\/p>", "star": 1, "key": 1}, {"no": 6, "title": "古希腊喜剧", "html": "<p><b>（1）起源与内容<\/b>：古希腊喜剧起源于祭祀酒神狄俄尼索斯的民间歌舞表演，同时又受到民间滑稽戏的影响。古希腊喜剧大多取材于现实生活，早期喜剧更是直接涉及当时人们普遍关心的重大政治社会问题，具有很强的现实针对性。<\/p><p><b>（2）发展阶段<\/b>：①旧喜剧：公元前5世纪在雅典上演的喜剧作品称为旧喜剧，主要反映人民普遍关心的政治和社会问题，具有强烈的政治讽刺色彩。阿里斯托芬为代表作家，创作有《鸟》等作品。②中期喜剧：公元前400年至前323年上演的喜剧作品称为中期喜剧，以对社会的描写代替了政治讽刺，但很少有完整作品流传于世。③新喜剧：公元前323年至前263年上演的喜剧作品称为新喜剧，大多描写家庭生活和爱情故事，对生活予以理想化再现，削弱了早期喜剧的讽刺性和社会性。新喜剧对罗马喜剧家影响很大，并通过罗马喜剧家的改编，影响到后世欧洲的喜剧。新喜剧代表为米南德，著有《恨世者》。<\/p><p><b>（3）阿里斯托芬：<\/b>被誉为希腊喜剧之父，是唯一有完整作品流传于世的旧喜剧作家，他的创作代表了古希腊喜剧的最高成就。他留下的完整剧本有11部，代表作为《阿卡奈人》。他的喜剧涉及当时许多重大的政治和社会问题，尤其关心战争与和平问题。其喜剧手法夸张，情节生动，构思巧妙，常在嬉笑怒骂中表达严肃的主题，被恩格斯称为有强烈倾向的诗人。<\/p>", "star": 0, "key": 0}, {"no": 7, "title": "文艺理论的成就", "html": "<p>柏拉图和亚里斯多德是古希腊最重要的文艺理论家，分别奠定了西方文艺观、美学观的唯心主义与唯物主义传统。亚里斯多德的《诗学》是欧洲第一部体系完整的文艺理论著作。<\/p>", "star": 0, "key": 0}, {"no": 8, "title": "古罗马文学", "html": "<p><b>（1）历史地位<\/b>：①古罗马文学是古希腊文学与欧洲近代文学的桥梁。古罗马文学在欧洲文学史上起着承前启后的作用。后世很多作家都是通过罗马文学来发掘古希腊文学的价值，在18世纪以前，欧洲各国文学，主要是受古罗马文学的影响。②文艺复兴时期，欧洲资产阶级作家提出复古，是通过古罗马文学来学习希腊文学。17世纪古典主义直接受到古罗马戏剧创作和理论的影响，例如贺拉斯的诗学理论就为古典主义理论家布瓦洛的诗学观点提供了直接的借鉴。18世纪，贺拉斯“寓教于乐”的文艺思想得到了启蒙思想家的推崇。③罗马文学本身也取得了很大成绩，涌现出如贺拉斯和奥维德那样的著名诗人，在文学史上具有<\/p><p>一席之地。其文学虽然受到古希腊文学的直接影响，但也具有一些个性特征，即具有更强的理性精神和集体意识，增强了庄严崇高的气质。<\/p><p><b>（2）<span class=\"srctag\">朱版古代文学第1题<\/span>发展阶段<\/b>：①共和时期（公元前240-前30)：罗马文学的形成和发展时期。喜剧创作成就较高，普劳图斯和泰伦斯是这一时期的代表作家。②黄金时期（公元前100-17)：古罗马文学的辉煌时期。文学成就主要表现在散文和诗歌方面。最能体现“黄金时代”特点的作家是“奥古斯都”时期的三位著名诗人：维吉尔、贺拉斯和奥维德。维吉尔的主要成就是三部诗歌作品，即《牧歌》、《农事诗》和《埃涅阿斯纪》；贺拉斯是古罗马著名诗人和文艺理论家，其重要的文艺论著为《诗艺》，其文艺思想上承亚里斯多德的传统，下启18世纪古典主义戏剧理论。奥维德是“奥古斯都”时期最后一位大诗人，《变形记》是其代表作。③白银时期（公元17-130)：罗马文学的衰落时期。悲剧、讽刺诗、传记文学和散文体小说创作较为活跃，塞内卡的悲剧《特洛亚妇女》，阿普列尤斯的散文体小说《金驴记》代表着这一时期的文学成就。<\/p>", "star": 0, "key": 0}]}, {"chapter": "第二章", "title": "中世纪文学", "link": {"quiz": "外国文学史习题_分章刷题.html#d1"}, "mindmap": 1, "kps": [{"no": 1, "title": "中世纪历史文化背景", "html": "<div class=\"subsec\">（1）中世纪文化是欧洲多种文化融合的产物<\/div><p>①众多部落文化的融合。这种融合既体现在包括克尔特人、日耳曼人和斯拉夫人等北方游牧文化的融合，也反映在发达的古希腊罗马文化与落后的北方游牧文化的融合。②东西方文化的交融。基督教本身就是东西方文化融合的产物。通过基督教，中东的犹太教经典和文化传入欧洲。在欧洲地区中，拜占庭因为位于东西方交接地，而更突出地体现了东西方文化融合的特点。③基督教文化与世俗文化的融合。基督教统治着中世纪欧洲的精神领域，它通过纳入或改<\/p><p>造一些世俗文化实施归顺，而世俗文化也难以逃脱基督教宗教文化这一大背景的影响。<\/p><div class=\"subsec\">（2）基督教兴起的时间与影响<\/div><p>①公元4世纪，罗马皇帝宣布基督教为国教，8世纪统一教会形成，从此，宗教统治钳制欧洲政治、思想将近一千年。②基督教的传播解决了欧洲人的信仰问题。欧洲人继承了希腊人的理性，但是理性无法解决人们超越有限生命的渴求，而基督教则填补了这一需求。③基督教为欧洲人确立了价值观，其宗教伦理道德确立了社会生活的秩序。④基督教同化了野蛮民族，维护了欧洲在古罗马灭亡后的统一，维持了欧洲的政治秩序。⑤在一定程度上促进了科学、哲学、艺术、教育等学科的发展。<\/p><div class=\"subsec\">（3）封建国家与城市的出现<\/div><p>①封建国家纷纷出现，奠定了欧洲现代各国的雏形。②11世纪，手工业日益从农业中分离出来，专职的工商业者聚居在城堡、寺院附近的交通要道，逐渐形成工商业城市。<\/p>", "star": 0, "key": 0}, {"no": 2, "title": "中世纪文学概况", "html": "<p>（1）内容：历史上的中世纪初期和中期的文学，即5到15世纪的文学。历史上的中世纪后期的文学为文艺复兴时期文学。<\/p><p>（2）<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版中世纪文学第2题<\/span>基本特点：思想特点：①基督教思想统治着中世纪文化。基督教思想成为中世纪封建统治的精神支柱，各类文学无不打上了它的烙印，教会文学更是为普及宗教教义而产生。②爱国主义和英雄主义思想突出。中世纪各民族国家开始形成，出现了很多将宗教思想与忠君爱国的英雄主义结合起来予以歌颂的文学作品。③不同阶层的文学出现。中世纪的社会结构等级森严，加之时间漫长，不同历史发展时期在具体情况方面的差异，导致为特定阶层服务的文学相继出现，并在不同的发展时期呈现出各自的繁荣景象。④一定程度上具有反封建、反教会的进步意义。骑士文学描写骑士爱情生活，肯定现世人生，承接了古希腊人本主义思想，具有否定中世纪禁欲主义的积极意义。后期出现的市民文学，反封建、反教会的思想更加突出，开启了文艺复兴人文主义文学的先河。艺术特点：①文学描写和反映的范围扩大。由于各种不同性质的文化的相互交融，各种各样的题材进入了文学创作领域，拓展了文学的表现空间。②艺术形式获得长足发展。诗歌发展更为精雅与完备，叙事文学中结构布局和技巧运用已趋自觉。③艺术表现方法得到新的开拓。充分吸收了古代以及各民族文学艺术表现形式，寓意、象征、梦幻、哲理、现实描写、浪漫抒情乃至运用动物故事等都流行一时。④对文学情感特性把握的能力得到进一步提高。在一些爱情题材的作品中，人的喜怒哀乐等复杂的心理得到成功描绘，文学的情感特性被创作者自觉追求。<\/p><p>（3）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版中世纪文学第1题<\/span>基本类型：教会文学、英雄史诗与谣曲、骑士文学和城市文学。<\/p><p>①<span class=\"srctag\">朱版中世纪文学第2题<\/span>教会文学：作者是僧侣，又称僧侣文学，适应基督教教会的需要而产生，曾长期垄断着欧洲中世纪初期的文坛。其目的是为了普及基督教教义，歌颂上帝的权威，大多取材于《圣经》，内容多描写上帝万能、圣母奇迹、圣徒布道和信徒苦修等。在艺术上，它多采用梦幻故事的形式和寓意、象征的表现方法，对整个中世纪欧洲文学产生了广泛影响。教会文学主要包括圣经故事、圣徒传、赞美诗、祈祷文和宗教剧等。<\/p><p>②<span class=\"starmark\">★<\/span><span class=\"srctag\">郑版中世纪文学第3题<\/span>英雄史诗与谣曲：“英雄史诗”产生于8-12世纪，由人民集体创作。主要反映民族的重大历史事件，歌颂杰出英雄的事迹，表现主人公忠君爱国和笃信宗教的高尚品质。五大英雄史诗为英国的《贝奥武甫》，法国的《罗兰之歌》，西班牙的《熙德之歌》，俄国的《伊戈尔远征记》以及德国的《尼伯龙根之歌》。“谣曲”是一种故事性的诗歌。它在民间口头文学的基础上发展而来，于15世纪在英国开始繁荣。谣曲以描写生活的悲剧或历史题材为主，也包括神话传说，还有一部分反映农民与封建主的斗争。其大多数作品塑造了下层人民喜爱的英雄，表现了劳动人民的思想感情，具有一定的平民意识。英国的一组关于侠盗罗宾汉的谣曲最有影响，塑造了一批以罗宾汉为代表的劫富济贫的侠客好汉，描写了他们的侠义行为，表现了民众的反抗精神。在艺术上，这些作品大多风格雄浑壮伟，情节曲折生动，语言朴实自然，具有浓厚的生活气息和鲜明的现实主义色彩。<\/p><p>③<span class=\"starmark\">★<\/span><span class=\"srctag\">郑版中世纪文学第3题，朱版中世纪文学第5题<\/span>骑士文学：产生于12-13世纪封建社会的全盛时期，属于世俗贵族阶级的文学。它是中世纪骑士制度盛行时代的产物，作者为骑士。其内容主要描写骑士行侠冒险的经历和对贵妇人的爱情，宣扬“忠君、护教、行侠”的骑士精神，反映了骑士阶层的生活理想，具有反对禁欲主义、追求现实生活和世俗享乐的积极意义，代表了中世纪世俗文学的主要成就。骑士文学包括骑士抒情诗和骑士传奇，骑士抒情诗最早产生于法国的普罗旺斯，又被称为“普罗旺斯抒情诗”，其中尤以抒写骑士与贵妇在凌晨惜别之情的“破晓歌”最为著名。骑士传奇中最为流行的故事是亚瑟王与圆桌骑士的冒险故事。骑士传奇的浪漫情调、离奇故事和爱情描写，影响到后世的浪漫主义文学，其围绕主要人物经历展开故事的结构方法，以及对人物形象的塑造和内心活动的揭示，都为欧洲后世长篇小说的出现奠定了基础。<\/p><p>④<span class=\"srctag\">郑版中世纪文学第3题<\/span>城市文学：市民创作的文学，又称“市民文学”，产生于欧洲城市兴起的11世纪至12世纪，在民间创作的基础上发展而来。它主要描写市民的日常生活，站在市民的立场赞扬市民的机智聪明，表达了对封建领主和僧侣的不满，反映了处于萌芽中的资产阶级的精神特征，具有明显的反封建、反教会的思想倾向和浓郁的现实主义色彩。市民文学语言质朴幽默，风格生动活泼，创作手法以讽刺为主，也采用寓意象征等表现方法。城市文学在法国最为繁荣，体裁有韵文故事、讽刺故事诗、抒情诗和市民戏剧等，《列那狐传奇》为代表作品。<\/p>", "star": 1, "key": 1}, {"no": 3, "title": "但丁", "html": "<p><b>（1）作家概况：<\/b>但丁是人文主义的先驱者，中世纪最伟大的作家，其创作反映了中世纪向文艺复兴运动过渡时期的时代特征。恩格斯高度评价了但丁及其创作的意义，指出：“封建的中世纪的终结和现代资本主义纪元的开端，是以一位大人物为标志的。这位人物就是意大利人但丁，他是中世纪的最后一位诗人，同时又是新时代的最初一位诗人。”但丁的主要作品有政治论著《飨宴》、《论俗语》和《帝制论》，阐述了其积极进步的文化思想、语言观和政治理念；文学作品有抒情诗集《新生》和长诗《神曲》，《神曲》代表了其创作的最高成就。<\/p><p><b>（2）《神曲》题解：<\/b>神曲原名《喜剧》。中世纪的喜剧泛指结局圆满的故事，介于悲剧和哀歌之间，且因为喜剧不同于高雅的悲剧，往往要求通俗平易，故多使用俗语，以适合一般民众的审美水平。在这部作品中，诗人灵魂最终得以进入明亮的天堂，结局美好，加之采用意大利俗语创作，因而但丁称之为“喜剧”。在文艺复兴时期，这部作品得到了薄伽丘的高度肯定，被赞誉为“神圣的《喜剧》”，从此得名，中译本将之译为“神曲”。<\/p><p><b>（3）《神曲》的基本内容<\/b>：《神曲》是一部具有划时代意义的叙事长诗，是但丁一生思想和艺术探索的结晶。《神曲》分为《地狱》、《炼狱》、《天堂》三部分，描写诗人自我幻游地狱、炼狱和天堂三界的故事。①诗人采用中世纪梦幻文学的形式，自叙了步入人生中途的自我，在一片黑暗的森林中迷路，当前有悬崖，后有豹、狮、狼三只野兽的危险时刻，古罗马诗人维吉尔受但丁喜欢的女性贝娅特丽丝之托前来援救，将但丁引向光明。维吉尔引导但丁游历了地狱和炼狱，最后由贝娅特丽丝引导游历了天堂。②在《神曲》中，“地狱”共9层，第一层是候判所，其余8层为有罪灵魂，按生前所犯各罪分别接受酷刑之所；“炼狱”共7级，加上净界山和地上乐园共9层，犯罪较轻的灵魂按7大罪分别在这里修炼洗过，然后一层层上升；“天堂”分为9重，生前为善、有德行的人在这里享受快乐。天堂之上是上帝所在的天府，这里比天堂更加美丽光明。但丁见到上帝的一刹，全诗也戛然而止。③但丁采用中世纪梦幻文学的形式，将意大利社会现实与历史、宗教思想，以及古希腊神话传说融为一体，形象地表达了其复杂而深邃的政治与文化思想，描绘了一幅丰富多彩的社会生活画面，极其广泛地反映了当时意大利的社会政治和文化方面的情况，具有百科全书性质。<\/p><p><b>（4）<span class=\"starmark\">★<\/span>《神曲》的思想主题<\/b>：①《神曲》是作者从政治上、道德上探讨意大利民族统一的寓言性总结。但丁创作这部作品，目的就是为了探讨意大利的出路问题，给面临纷争的意大利人指出一条从黑暗走向光明的途径。在诗篇中，地狱象征着封建中世纪黑暗的现实生活，炼狱象征着从丑恶的现实到达理想境界的痛苦过程，天堂象征着力争实现的美好理想。诗歌对迷途、地狱、炼狱和天堂的描写，寓意着迷惘的意大利人经过苦难和考验，终将走向光明与至善。从当代意识来看，诗歌的艺术境界也具有普遍性意义，表现出对人类命运的深沉忧虑，以及对人类美好前景的坚信。②诗人站在新旧时代交替的历史高度，极其广泛地描绘了意大利的社会<\/p><p>现实，在保持与中世纪文化精神联系的同时，表现了人文主义思想。诗歌描写了人们对世俗感情和现实幸福的追求，肯定了对知识的探求和理性的重要作用，赞美了人的智慧，体现了人文主义思想的精髓。同时，《神曲》还对现实中的教会、教皇、僧侣们的恶德败行，以及正在形成中的资本主义生产关系的弊端和利己主义进行了·揭露与批判，表达出强烈的现实批判色彩，透露出人文主义思想的曙光。<\/p><p><b>（5）<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版中世纪文学第4题<\/span>《神曲》的艺术特色<\/b>：①梦幻的神秘色彩与现实的写实手法相结合。《神曲》以梦幻文学的形式描写了但丁的灵魂幻游三界的经历，大量运用象征和隐喻，带有浓厚的宗教幻想色彩，但作品也反映了当时尖锐复杂的党派之争，揭露了教会的黑暗和世俗社会的矛盾，描绘了当时的社会生活，具有强烈的现实针对性。②构思宏伟，结构富有严密性、均衡性与完整性。《神曲》分为3部，每部33歌，加上“序曲”，共100歌。各部篇幅基本相等，采用连锁押韵方式衔接，每部诗的末尾均以“群星”一词作结，在整体上工整而协调。③大量运用象征、隐喻和梦幻。《神曲》从头至尾充满象征和隐喻。诗人迷途中出现的狮、豹、狼分别代表着强暴、淫欲和贪婪，维吉尔代表知识和理性，贝娅特丽丝是爱和信仰的化身，地狱象征黑暗社会，天堂为理想境界，炼狱是人类由黑暗走向光明必经的痛苦历程。作品的结构也具有象征性，“3”的含义就意味着宗教神学的“三位一体”，100歌中的“100”是“10”的平方，象征完美中的完美。④用意大利语写作，打破了用拉丁文写作的惯例，使作品从内容到形式都具有鲜明的民族特色。此外，其语言丰富、生动，写情写景充满诗情画意，人物性格鲜明。<\/p><p><b>（6）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《神曲》的二重性：<\/b>《神曲》的二重性特点是研究但丁及其《神曲》的一个重要问题。但丁是新旧交替时代的一位诗人，他的《神曲》在思想内容和艺术上均表现出二重性。在思想内容方面，《神曲》既有鲜明的进步倾向性，又明显地打上了中世纪神学思想的烙印。在艺术上，《神曲》保留着中世纪文学作品的神秘象征特色，又折射出文艺复兴时期现实主义文学的光芒。思想上的二重性：①在世界观方面，但丁根据基督教来世主义，把现世生活看成来世永生的准备；另一方面，他又表现出对现世的强烈兴趣，热情歌颂积极进取的精神。②在政治主张方面，但丁一方面具有强烈的爱国主义理想，渴望和平统一，无情批判封建暴君、叛徒、卖国贼和党派纷争；另一方面又把希望寄托在神圣罗马帝国皇帝亨利七世身上，强调民族出路在于节欲苦修和道德净化。③在对待宗教态度上，他一方面揭露教会的黑暗，表达了对依仗权势、为非作歹的教皇的仇恨，并把他们统统打入地狱之中，给予严厉的惩罚；但是另一方面他毕竟是一位虔诚的教徒，歌颂了宗教信仰对灵魂的指引作用，将宗教神学置于至高无上的地位。④在对待人的理智和感情问题上，但丁一方面严厉地批判了中世纪的蒙昧主义，热情赞美人的才能、智慧和自由意志，反对宗教禁欲主义，肯定世俗的感情和爱情追求；另一方面，又从宗教观点出发，把勇于探索、具有进取精神的奥德修斯当作一个异教徒罚入地狱的候判所，把彼此相爱的保罗和弗朗齐丝卡，以及殉情自杀的狄<\/p><p>多、希腊的海伦和帕里斯等作为放纵情欲者打入地狱。艺术上的二重性：①《神<\/p><p>曲》是新旧时代交替时期不同性质的文学的融合，体现了中世纪文学的主观幻想与文艺复兴时期人文主义文学的真实冷峻的奇妙结合。一方面，它采用中世纪·梦幻文学的表现形式，充满象征和隐喻，带有浓厚的宗教神秘色彩；另一方面又表现出现实主义的特色，呈现出文艺复兴时期人文主义文学的面貌。它以幻想的三界旅行为框架，但目的是为了探讨意大利民族的发展道路。诗篇生动地描写了意大利的政治、社会生活，勾画了多姿多彩的具有现实性的人物形象，致使出现于诗篇中的各种人物，无论是历史人物还是虚构人物，都读来真切自然，具有现实的典型意义。此外，在一些具体的篇章中，但丁则以现实主义的笔墨，展现了一幕幕具有浓郁生活气息的场景。②结构上具有中世纪文学的神秘象征特征，但其语言却采用意大利俗语。作品结构大量运用宗教具有象征色彩的数字来构思，应和其宗教思想；在语言运用方面，诗篇大胆抛弃了中世纪的官方教会语言拉丁语，使用民族语言进行创作，为意大利民族语言的发展奠定了基础，也为文艺复兴时期的语言革新做出了创新性尝试。<\/p>", "star": 1, "key": 1}, {"no": 4, "title": "中世纪文学的评价问题", "html": "<p>（1）对中世纪文学的评价与对中世纪文化的评价紧密结合在一起。在西方思想文化发展的历史中，许多学者认为中世纪是古希腊古罗马古典与文艺复兴两大辉煌时期的漫长黑夜，是文化断层，从而贬低中世纪文学的作用。意大利人文主义者用“中世纪”称呼刚刚过去的一千年，意指其黑暗和无知，他们认为希腊、罗马辉煌的古典文化传统在自己的时代才获得再生与复兴。18世纪启蒙时期的理性主义者，更是系统地批判了中世纪的神学思想和封建统治，进一步巩固了人们对中世纪黑暗与愚昧的认识。但是，从19世纪初期浪漫主义文学对其价值的肯定开始，中世纪文化和文学逐渐获得了更多的认可。<\/p><p>（2）对待中世纪文学，应该采取客观公正的态度。①从总体上来看，中世纪文学的主要成就和内容都决定了中世纪文学的主体属于统治阶级文学。中世纪教会文学占据统治地位，成为教会实施精神奴役的工具，在思想性和艺术性上都与古希腊文学截然对立。虽然代表世俗文学主要成就的骑士文学非常繁荣，表现出对现实爱情的追求，但其具体内容局限于骑士和贵妇人的爱情和冒险，对应的是统治阶级的人生观和寄生生活，脱离现实生活，矫揉造作。②还需要看到中世纪文学本身的复杂性。欧洲中世纪文学包括不同阶级属性的文学，既有统治阶级的教会文学和骑士文学，也有民间的市民文学，还有民族形成时期留下的史诗和大量的谣曲，它们反映的生活和表达的价值观念存在很大差异，文学表达方法也丰富多样，取得的文学成就也各不相同。然而，不论是英雄史诗，还是骑士文学和市民文学，都联系着古代和未来，如此来看中世纪文学，文学的“断裂”是不存在的，武断地贬低也是不符合文学实际的。③对中世纪文学的合理评价，还需要跟重新认识中世纪文化结合在一起。中世纪与文艺复兴之间并无明显分界线，历史的延续性决定这两者之间的反差并不如想象的那样强烈，复兴古典文化<\/p><p>在中世纪后期已经开始，并取得很大成就，而且中世纪的神学体系也将古希腊罗马的哲学思想纳入其中为己所用，一定程度上保留与传播了古典文化，所以中世纪文化与古希腊罗马文化也难以彻底割裂开来。<\/p>", "star": 0, "key": 0}]}, {"chapter": "第三章", "title": "文艺复兴时期文学", "link": {"quiz": "外国文学史习题_分章刷题.html#d2"}, "mindmap": 1, "kps": [{"no": 1, "title": "文艺复兴运动", "html": "<p>（1）<span class=\"srctag\">朱版文艺复兴时期文学第1题<\/span>文艺复兴：文艺复兴是欧洲新兴资产阶级在14世纪至17世纪初掀起的反封建、反教会的思想运动。它是封建制度开始解体、资本主义生产关系形成过程中的产物，首先出现在意大利，随后波及到欧洲各国。新兴资产阶级打着“回到希腊罗马去”的旗号，声称要把久已湮没的古典文化“复兴”起来，故称之为“文艺复兴”。但它不是简单的复古，而是通过复兴古希腊罗马文化，肯定人的价值和权利，达到反抗封建统治和反对教会的目的。它不仅是一场文学运动，而且还是思想文化体系的一次大变革，影响到哲学、政治、世界观和教育等领域，对欧洲乃至整个人类社会都有深远影响。<\/p><p>（2）<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版文艺复兴时期文学第1题，朱版文艺复兴时期文学第1题<\/span>时<b>代背景<\/b>：①生产力的发展使意大利的威尼斯、佛罗伦萨等城市产生了萌芽的资本主义生产关系，出现了资本主义性质的手工业市场以及工商业，也产生了资产阶级。随着环球航行的成功和海外掠夺的兴起，资本主义生产关系得到进一步发展，资产阶级不断壮大。新兴阶级要求自由地发展资本主义，争取政治权利，首先在文化和意识形态方面发起进攻。②在发展商品经济的同时，西方利用中世纪东方的文明成果推进了海外贸易、扩张、掠夺等进程，人们活动的天地得以扩大，培养了人们的自信心，鼓舞着人们进一步探索人存在的价值和意义。③中世纪民间一直存在的异端思想，以及13世纪前后在欧洲内部萌发的市民文化，都为文艺复兴时期的思想与文化变革奠定了一定的基础。④中世纪的十字军东征，给西方带回了东方文化和古希腊罗马文化。尤其是1453年土耳其攻陷了东罗马帝国的首都君士坦丁堡之后，大批东罗马帝国的学者逃亡西欧，被中世纪湮没了近千年的古代文化在西方获得了被重新发现的机会。资产阶级学者从这些古代文化中，发现了许多与封建神学相对立的精神，引发了一场研究古典学术的热潮。于是，饱含人本精神和现实主义思想的古希腊罗马文化为资产阶级即将喷涌而出的思想和激情提供了一个载体。<\/p>", "star": 0, "key": 1}, {"no": 2, "title": "人文主义", "html": "<p>（1）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版文艺复兴时期文学第2题<\/span>人文主义：这个词源于拉丁文Humanus，即“人的”。它是欧洲文艺复兴时期形成的新兴资产阶级的主体思想，也是文艺复兴运动中资产阶级进行反封建、反教会斗争的思想武器。它既是一种以个人为核心，以人性论为基础的资产阶级世界观，也是一种主张维护人的尊严和权利，重视人的价值和自由发展的新的伦理道德观。人文主义的具体内容如下：以人为中心的世界观反对以神为中心的世界观；用人性反对神性；用个性解放反对禁欲主义；用理性反对蒙昧主义；拥护中央集权，反对封建割据。<\/p><p><b>（2）<span class=\"keymark\">☆<\/span>进步性与局限性：<\/b>①人文主义作为新兴资产阶级的思想武器，否定了<\/p><p>宗教神学观和封建教会，充分肯定了人的存在以及人的价值与尊严，有力地冲击了封建生产关系及其精神支柱，有巨大的进步作用，为后世资产阶级思想体系与理论的形成奠定了基础。②人文主义者肯定的“人”，实质上只是资产阶级自身，他们宣扬的自由、幸福、平等，实质上只是资产阶级个人的自由、幸福、平等，而这些又都是建立在对广大劳动人民的剥削之上的，带有轻视劳动人民的思想倾向。同时，人文主义者认为人的自由意志不受任何制约，人性是自由的，这是一种唯心主义哲学观，容易导致极端的个人主义，即“马基雅弗利主义”，使得他们在追求个人享乐的同时陷入庸俗的情欲追求之中。<\/p>", "star": 1, "key": 1}, {"no": 3, "title": "人文主义文学", "html": "<p>（1）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版文艺复兴时期文学第2题，朱版文艺复兴时期文学第2题<\/span><b>基本特点<\/b>：①就文学的文化主旨精神而言，人文主义文学与当时的哲学、科学、艺术等领域一样，对人的关注成为人文主义文学的精神核心。②描写现实生活，表达人文主义思想，成为人文主义文学的主要内容和重要主题。人文主义文学将人文主义思想作为斗争武器，着力描写现世生活，表现人物的精神世界和欲望要求，肯定了人的权利，传达了资产阶级的价值标准。③在创作方法上，为配合表现现实生活的艺术追求，人文主义文学抛弃了中世纪宗教文学寓意、象征、梦幻的创作方法，在继承民间文学写实主义传统的基础上，将浪漫主义与现实主义有机地结合在一起，再现了更高的艺术真实。④在文学形式上进行了创新。人文主义文学扩大了传统文学的体裁领域，创立了十四行诗、流浪汉小说和悲喜混杂剧等多种文学表现形式。⑤人文主义文学突破了拉丁语的束缚，采用民族语言进行创作，为各国民族文学的形成奠定了重要的基础。<\/p><p><b>（2）发展分期<\/b>：①14世纪至15世纪中叶为人文主义文学产生和发展的早期，主要繁荣于意大利和英国。②15世纪下半叶至16世纪上半叶，是人文主义文学的进一步发展时期，法国成就突出。③16世纪下半叶至17世纪初，是人文主义文学的晚期，西班牙和英国的人文主义文学代表了其主要成就。<\/p>", "star": 1, "key": 1}, {"no": 4, "title": "意大利文学", "html": "<p><b>（1）文学概况<\/b>：意大利人文主义文学开始最早，分为前后两个时期。①14世纪至15世纪中叶为早期，以彼特拉克和薄伽丘的创作为代表，主要作品有彼特拉克的十四行诗诗集《歌集》和薄伽丘的《十日谈》。②15世纪到16世纪为后期，以阿利奥斯托和塔索的创作为代表，主要作品有阿利奥斯托的《疯狂的紫罗兰》和塔索的《被解放的耶路撒冷》。<\/p><p><b>（2）彼特拉克<\/b>：文艺复兴的第一个人文主义者，他使十四行诗这种诗歌形式趋于定型，被称为“诗圣”。他用意大利语写了著名的抒情诗集《歌集》，歌咏对女友劳拉的爱情，表达了人文主义以个人幸福为中心的新型爱情观。<\/p><div class=\"subsec\">（3）薄伽丘<\/div><p>①作家概况：意大利文艺复兴时期最杰出的作家，学识渊博的人文主义者。他热心搜集古代著作，提倡学习古希腊文，是意大利第一个通晓古希腊文的人文<\/p><p>主义学者。代表作为短篇小说集《十日谈》，因其中强烈的反宗教思想受到教会仇视，晚年致力于研究但丁和《神曲》，写作《但丁传》。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版文艺复兴时期文学第5题<\/span>《十日谈》的思想主题：这部作品以欧洲中世纪爆发的大瘟疫为背景，描写3名男青年和7名女青年为避难结伴来到郊区，在居住期间每人每天讲一个故事互相娱乐，10天里总共讲了100个故事，这100个故事就是《十日谈》的主要内容。通过这些故事，薄伽丘揭露了教会的腐败堕落、僧侣的虚伪奸诈，抨击了封建特权和男女不平等的社会现象，塑造了新兴资产阶级的形象，歌颂了他们的聪明才智，描写了现实生活中的男女爱情故事，赞扬了平等自由的爱情，表达了个性解放、人人平等的人文主义思想。<\/p><p>③《十日谈》中爱情描写的意义：《十日谈》中的爱情描写是薄伽丘小说的一个重要贡献。《十日谈》中100个故事中多半是描写男女爱情的故事，在这些故事中，薄伽丘肯定了情欲，赞扬了现实生活中的爱情。薄伽丘对爱情的赞扬是基于其对人性的独特理解，他从自然本性出发，将爱情升华为人的天性，并将爱与欲融为一体，赞扬爱情与情欲的合理性。薄伽丘将爱情与情欲等同，致使《十日谈》中出现了一些庸俗性的描写，但是，就整体而言，其意义仍然是非常重大的。在当时的社会环境下，薄伽丘对爱情的不同认识和表现，具有反对宗教禁欲主义和封建婚姻制度的积极意义，起到了解放思想的进步作用。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版文艺复兴时期文学第5题<\/span>《十日谈》的艺术特色：第一，强烈的现实主义色彩。《十日谈》的故事大多取材于现实，以现实主义的手法描写新兴资产阶级的生活，讽刺僧侣和教会，充满了浓厚的现实主义色彩。第二，采用框架结构形式。《十日谈》采用了《一千零一夜》的框架式结构，运用统一的主题和一个总的故事，将众多各自独立的小故事组织起来，既表达了作者的思想感情，又具有丰富多样的艺术魅力。第三，注重刻画人物性格，描写人物心理，人物性格突出，形象饱满。在《十日谈》中，薄伽丘尤其擅长描写恋爱中女子的内心体验。第四，语言精炼流畅，俏皮生动。其语言风格一反中世纪晦涩、阴郁的特点，轻松活泼，风趣幽默，洋溢着浓厚的生活气息。<\/p><p>⑤<span class=\"starmark\">★<\/span><span class=\"srctag\">朱版文艺复兴时期文学第5题<\/span>《十日谈》在欧洲文学史上的重要意义：首先，《十日谈》采用意大利民族语言写成，为意大利散文艺术的发展奠定了基础。其次，发展了中古短篇故事，并在此基础上开创了欧洲短篇小说的艺术形式。再次，其框架小说的结构形式，直接影响了其他作家的创作，例如英国乔叟的《坎特伯雷故事集》和法国国王的姐姐那伐尔的《七日谈》等。最后，《十日谈》中的故事来源广泛，分别取自古典书籍、东方故事、中世纪冒险故事、法国短篇故事和故事诗，以及意大利本土的民间故事，后世作家纷纷从这些故事中寻找写作题材，乔叟、莎士比亚、莫里哀和莱辛等都创作了取材于《十日谈》的作品。<\/p>", "star": 1, "key": 1}, {"no": 5, "title": "法国文学", "html": "<p><b>（1）文学概况<\/b>：在意大利人文主义文学的直接影响下，法国人文主义文学于15世纪末出现，并取得了很大的成就，代表作家有龙沙、那伐尔、拉伯雷和蒙田<\/p><p>等。法国人文主义文学具有如下特征：始终呈现出贵族和平民两种倾向，具有贵族倾向的作家把持着文坛；依附王权，反对天主教会；重视民族语言的统一和民族文学的发展，革新了诗歌形式，开创了散文体裁。<\/p><p><b>（2）<span class=\"starmark\">★<\/span>七星诗社：<\/b>16世纪法国人文主义文学的诗歌流派。它由6个人文主义诗人和他们的希腊语老师组成，贵族倾向浓厚，领袖人物为龙沙，杜·贝莱执笔的《保卫和发扬法兰西语言》为其宣言书。他们的诗歌肯定现实生活，歌颂自然和爱情，表达了人文主义的思想。七星诗社还对民族语言的统一和民族诗歌的发展作出了贡献。他们提出要统一民族语言，保卫民族语言，主张用法语写作。在诗歌创作理论方面，提出要创作大型史诗和能与希腊罗马文学相媲美的民族文学。<\/p><div class=\"subsec\">（3）拉伯雷<\/div><p>①作家概况：法国文艺复兴时期最具平民倾向的作家，欧洲文艺复兴时期最重要的作家之一，博学多才，堪称文艺复兴时期的“巨人”。其代表作《巨人传》（1534~1553）出版后风行一时，因其中充满反教会的思想而被巴黎神学院列为禁书，后在国王的准许下，全书才得以出版。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版文艺复兴时期文学第6题<\/span>《巨人传》的思想内容：小说共5部分，描写了巨人家族三代国王高朗古杰、高康大、庞大固埃一代胜过一代的故事，最后庞大固埃和朋友巴奴日远涉重洋，寻找到神瓶。小说通过对力大无穷、形体巨大的巨人家族的描写，全面地展示了人文主义理想。首先，拉伯雷表现了“巨人主题”。小说描写的巨人拥有健壮伟岸的体魄，惊人的力量，丰富的知识，以及完美高尚的品质，展示了人文主义教育下培养出来的新人形象，充分肯定了人、人性和人的创造力。其次，通过三代巨人的经历，小说对法国社会现实进行了深刻揭露，突出地抨击了司法体系、捐税制度、官吏制度和教会的腐败，无情嘲讽了封建神学界和法学界。再次，通过“德廉美修道院”的描写，小说表现了乌托邦式的社会理想，表达了人类要求自由平等的美好愿望。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版文艺复兴时期文学第6题<\/span>《巨人传》的人物形象：高朗古杰、高康大、庞大固埃三代巨人形象具有非常丰富的象征意义，是人文主义教育培养出来的资产阶级新人形象，寄托了文艺复兴时期“全知全能的人”之理想。首先，三代巨人无论是形体还是才能方面，都超乎寻常。作者采用夸张的笔墨，描写了三代巨人形体巨大，力量无穷，食量惊人，爱好享乐，并且智慧过人，能力超强。在笨拙、迂腐的神学人员对比下，三代巨人更是显得自然健康，充满勃勃生机，体现出摧毁旧世界、锻造新世界的巨大力量。其次，他们如饥似渴地学习知识，培养各种才能，成为德智体全面发展的新人。他们不仅学习文学，钻研古典著作，还掌握各种自然科学知识；不仅研究学问，还学习武艺、锻炼体魄；不仅注重知识的积累，而且还重视道德修养。再次，三代巨人都拥有高贵完美的品格。他们温柔敦厚，平等待人，体恤下情，一旦外族入侵，他们总是身先士卒。例如，高康大就告诫庞大固埃要注重品德的修养，“有知识而无良心是灵魂的毁灭”，“爱护邻居<\/p><p>如同爱护自己一样”。总之，他们体现了作者对知识和理想的追求，反映了作者对人、人性和人的创造力的歌颂，也典型地反映了新兴资产阶级朝气蓬勃、除旧布新的时代精神。<\/p><p>④<span class=\"keymark\">☆<\/span>《巨人传》的艺术特色：第一，植根于民间文学的土壤。小说取材于法国民间故事，加以创造性改造，表达了新的思想内容。第二，运用渊博的知识和丰富的想象，多角度地描绘色彩斑斓的法国现实世界，写实与幻想相结合，传达了新时代的精神风貌。第三，采用极度夸张和辛辣讽刺的手法，无情地讽刺和抨击了反动腐朽的封建统治、迂腐繁琐的经院哲学和虚伪无知的宗教人士。第四，以市民语言为基础，大量采用民间俗语、俚语和行话，形成了嬉笑怒骂、生动流畅的语言风格，深受读者喜欢。第五，开创了长篇小说这种新的文学形式，扩大了文学反映现实的容量，为此后长篇小说的发展奠定了基础。<\/p>", "star": 1, "key": 1}, {"no": 6, "title": "西班牙文学", "html": "<p><b>（1）文学概况：<\/b>西班牙人文主义文学兴起的时间要晚于意大利和法国，但却取得了令世界瞩目的成绩，迎来了西班牙文学史上的“黄金时代”。西班牙人文主义文学的成就主要体现在小说和戏剧方面。小说开创了流浪汉小说这种新体裁。塞万提斯是西班牙人文主义文学的杰出代表，戏剧家维加是民族戏剧的奠基者。<\/p><p><b>（2）<span class=\"starmark\">★<\/span><span class=\"srctag\">朱版文艺复兴时期文学第7题<\/span>流浪汉小说<\/b>：16世纪产生于西班牙的一种欧洲近代小说，是城市兴起和经济衰退的产物。流浪汉小说基本取材于现实，聚焦于城市无业游民的生活，多以主人公的活动为线索，通过他们自述身世的方式，按照其亲身经历和所见所闻来进行叙事，展示了广阔的社会图景，客观上揭露了社会的黑暗。但是，因为流浪汉小说常常采用玩世不恭或同流合污的态度对待种种不合理的社会现象，所以，其思想具有一定的消极影响。流浪汉小说对于此后欧洲长篇小说的发展，特别是长篇小说的人物描写和结构模式方面，产生了深远影响。无名氏的《小癞子》是西班牙最早的流浪汉小说。<\/p><div class=\"subsec\">（3）塞万提斯<\/div><p>①作家概况：西班牙文艺复兴时期最杰出的现实主义作家，被后人誉为“现代小说之父”，其小说《堂吉诃德》代表着文艺复兴时期西班牙小说的最高成就。<\/p><p>②《堂吉诃德》的思想内容：小说描写了穷乡绅堂吉诃德阅读骑士小说而入迷，带着仆人桑丘·潘沙行侠仗义的故事。首先，通过堂吉诃德身处资本主义已经兴起的时代却企图通过恢复骑士道来扫尽人间不平，揭示了这种主观幻想与西班牙社会现实的巨大落差，在肯定堂吉诃德良好愿望的同时，对其行为进行了善意的讽刺，而对造成其产生不切实际幻想的骑士小说予以了彻底的否定。其次，通过堂吉诃德和潘沙主仆二人几次的行侠游历，小说广阔地反映了16世纪末、17世纪初的西班牙社会现实。小说以史诗般的笔墨描绘了这个时代的广阔图景，涉及到宗教、道德、法律、文学和艺术等领域，揭露了西班牙封建统治的没落与腐败，以及教会的腐朽与反动，对人民的苦难寄予了深切同情。堂吉诃德不时遇见被押解的苦役犯、被吊死的“土匪”、“强盗”和种种不公平的现象，为此他<\/p><p>诅咒他的时代是“可恶的时代”、“多灾多难的时代”，表达了对社会的不满情绪。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版文艺复兴时期文学第4题，朱版文艺复兴时期文学第10题<\/span>《掌吉诃德》中的堂吉诃德形象：西方文学史上第一个正面的喜剧人物，是一个悲剧性和喜剧性混杂在一起的人物形象。首先，堂吉诃德是一个非常复杂的人物形象，他身上既有落后的旧观念，又有文艺复兴时期的人文主义思想。堂吉诃德年近半百，唯一的爱好就是读骑士小说，为此而执迷不悟，找出破乱的甲胄和长矛，外出行侠仗义，不仅没有帮助别人，反而还害人又害己，成为一个疯疯癫癫的旧骑士。但是，一旦他忘记了骑士小说，不提骑士道，他就见解精辟，学识丰富，俨然一位知识渊博、思想敏锐的学者，处处流露出人文主义的思想观点。其次，堂吉诃德目的与手段的矛盾，造成悲剧性和喜剧性在这一人物身上的有机融合。在资本主义生产关系兴起的历史时期，他却要复兴封建时期的骑士道，提着破矛屡次外出行侠仗义，在行侠的过程中，以骑士小说的虚幻眼光看待现实世界，闹出很多笑话，致使自己成了众人的笑柄。但是，他外出行侠是为了维护人间正义，铲除不平。在行侠的过程中，他屡遭挫折，甚至被打断肋骨，但他不屈不挠，勇往直前，显示出崇高的精神品质和执著的奋斗精神。堂吉诃德具有英雄的品质，然而，他的追求不仅跟时代脱节，而且也不被人们所理解，当他最后清醒过来的时候，却即将离开人世，这些都赋予其性格以浓厚的悲剧色彩。总之，堂吉诃德身上的矛盾，说明了这一形象本身的复杂性、丰富性和艺术性，也反映了处于新旧交替时期西班牙社会现实的矛盾。通过这一形象，作者赞扬了他为理想献身的高尚精神，同时也讽刺了他不切实际的幻想，批判了西班牙苟延残喘的封建制度和封建观念，彻底扫荡了泛滥的骑士小说。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版文艺复兴时期文学第11题<\/span>《堂吉诃德》中的桑丘·潘沙形象：桑丘·潘沙是文艺复兴时期西班牙纯朴农民的典型。首先，其性格具有农民的时代特征。一方面，他具有劳动人民的勤劳、机智、善良的品质和乐观主义精神，在当“海岛总督”期间表现出惊人的才智和务实的精神。另一方面，他又有封建制度下小生产者眼光短浅、狭隘自私和贪图小利的弱点。他当骑士侍从是为了摆脱贫困，求得温饱。其次，其思想和性格呈现出了变化发展。在堂吉诃德崇高理想和执著精神的影响下，桑丘的性格发生了改变，善良、乐观逐渐成为其性格的主导方面。他心甘情愿地跟着堂吉诃德受尽磨难，哪怕分文未得；他不再自卑，并且认识到自我的价值，在当总督期间，体现了自己的才能与智慧。桑丘形象的塑造，既衬托了堂吉诃德形象，又真实地反映了文艺复兴时期西班牙农民的艰难处境以及要求改变现状的强烈愿望。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>掌吉诃德与桑丘·潘沙的关系：首先，堂吉诃德与桑丘·潘沙这对主仆在作品中构成鲜明的对比关系。他们二人无论从外表还是性格都形成对照，一个又高又瘦，一个又矮又胖；一个沉溺于幻想，目的高尚，一个立足于现实，讲求实际。其次，两人互相感染，逐渐成为不可分割的整体。堂吉诃德最后终于清醒过来，痛恨骑士小说和骑士道。与此相对应，在堂吉诃德潜移默化的影响<\/p><p>下，桑丘的思想和性格也发生了变化，现实的利益从其考虑中退出，代之以与堂吉诃德的友谊、对堂吉诃德的关心。在担任海岛总督期间，桑丘显示了务实精神和治理才能，实现了堂吉诃德的理想。总之，堂吉诃德和桑丘虽然出身和性格各不相同，但都从不同方面代表了人类普遍的思想感情，二人是既互相对比又互相影响的关系，增加了故事的生动性，突出了各自性格的差异，而且还呈现了人性的丰富性与复杂性，多角度地反映了文艺复兴时期西班牙的社会现实。<\/p><p>⑥<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版文艺复兴时期文学第12题<\/span>《堂吉诃德》的艺术特色：第一，反映了广阔的社会生活图景，具有较强的现实性。作者将现实与虚幻结合起来，在看似荒诞不经的故事中描绘真实的社会现实。第二，人物形象生动。小说塑造了700多个来自不同阶层的人物形象，主要人物性格突出，堂吉诃德和桑丘·潘沙这两个典型人物的塑造，更是表现了作者高超的人物刻画功力。第三，善于运用对比的描写手法。作品中的主人公堂吉诃德与桑丘形成鲜明的对照，一高一矮，一瘦一胖；一个勇敢莽撞，一个谨小慎微，更加突出了彼此的个性。第四，讽刺手法的运用。小说以戏谑的笔调模仿骑士小说，以达到讽刺骑士小说的目的。在叙述过程中，作者通过多重讽刺视角描写生活与人物，借用堂吉诃德的疯话与桑丘的傻话，讽刺人物的迂腐可笑以及黑暗的现实社会，达到了多重目的，具有强烈的讽刺效果。第五，从情节结构上看，《堂吉诃德》吸取了英雄史诗、西班牙民歌、传奇小说、流浪汉小说和骑士小说的特点。小说采用了流浪汉小说、骑士传奇的结构模式，但是以崇高的理想和执著的追求提升了流浪汉小说的文学品格，以辛辣的讽刺和对社会的真实描写代替了骑士传奇远离现实的不足。第六，语言贴近生活，真实、质朴、明晰，叙述中融人了讥诮、幽默的成分，采用了大量的西班牙民间俗语和谚语，语言生动形象，具有丰富的寓意。<\/p>", "star": 1, "key": 1}, {"no": 7, "title": "英国文学", "html": "<p><b>（1）文学概况<\/b>：英国人文主义文学萌芽于14世纪，在16世纪进入鼎盛时期，在人文主义文学中取得的成就最大、影响也最大，堪称文艺复兴时期人文主义文学的顶峰。英国人文主义文学取得了全面的繁荣，诗歌、戏剧、小说和散文都取得了巨大成就，涌现出了乔叟、莫尔、大学才子派以及莎士比亚等代表人物。<\/p><p><b>（2）<span class=\"starmark\">★<\/span>大学才子派<\/b>：大学才子派是英国文艺复兴时期的一批戏剧作家。他们大都在牛津或剑桥受过教育，具有较深的古典主义和人文主义修养。他们将古希腊罗马戏剧、中世纪民间戏剧等各种戏剧形式融为一体，不仅继承了前人的成果，而且在内容和艺术形式上颇有创新，创作出结构严谨、情节生动、诗意盎然的剧作，为英国民族戏剧的诞生作出了重要贡献，促进了伊丽莎白时代戏剧的发展和繁荣，为莎士比亚的创作准备了条件。其代表人物有约翰·李利、托马斯·基德和克里斯托弗·马洛等。<\/p><div class=\"subsec\">（3）莎士比亚<\/div><p>①作家概况：欧洲文艺复兴时期的巨人，他的创作使英国的人文主义文学具有了世界意义，在欧洲戏剧和文学发展史上都具有至关重要的地位。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版文艺复兴时期文学第13题<\/span>文学成就与创作分期：其创作分为三个时期。1590-1600年为第一时期，创作历史剧、喜剧和诗歌。《亨利四世》、《仲夏夜之梦》和《罗密欧与朱丽叶》为这一时期的代表作。这一时期戏剧创作的基本情调乐观、明朗，作品描写了爱情战胜偏见、贤明君王战胜篡权僭主的故事，表现出追求现实欢乐生活、反对禁欲主义、拥护中央王权的人文主义主题。1601-1607年为第二时期，创作悲剧和悲喜剧，《哈姆莱特》、《奥瑟罗》、《李尔王》和《麦克白》等为这一时期的悲剧代表作，《特洛伊罗斯与克瑞西达》、《终成眷属》和《一报还一报》为悲喜剧作品。随着王权专制的推行，社会冲突加剧，莎士比亚认识到人文主义理想与严峻现实的巨大反差，其创作转而反映现实与理想的矛盾，揭露社会邪恶势力，剧作风格变得悲愤沉郁。1608-1613年为第三时期，主要创作传奇剧，《泰尔亲王配力克里斯》、《辛白林》、《冬天的故事》和《暴风雨》等为这一时期的代表作品。这一时期封建王权专制加剧，戏剧的繁荣时代已经过去，莎士比亚的戏剧创作呈现出新的转向，虽然仍然歌颂人文主义理想，但在作品中借助神奇的力量解决冲突，调和矛盾，作品基调变得清丽、俊秀，呈现出高妙远逸、圣洁至纯的特征。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版文艺复兴时期文学第13题<\/span>戏剧的主要内容与创作特点：历史剧：第一，取材于英国史实，表达人文主义的政治历史观。莎士比亚的10部历史剧系统反映了英国从13世纪到16世纪三百多年的社会历史，展示了英国封建社会从动乱纷争到中央集权的整个历史过程，表达了作者谴责僭主昏君、肯定贤明君主，反对封建割据、拥护中央王权的政治理想。第二，通过生动的情节、众多的人物和广阔的历史背景，再现历史和各种社会力量的冲突，既具有史诗性，又具有丰富性。第三，注重历史与现实的结合。创作历史剧，对民众进行政治启蒙教育和爱国教育，是莎士比亚对英国社会现实的回应。当时正值英国国民沉浸在打败西班牙无敌舰队的高涨情绪之中，莎士比亚创作历史剧，希望让世人认识到社会存在的隐患，所以他总是以人文主义思想来剪裁历史，予以创造性再现。喜剧：第一，取材于意大利故事、古代作品、民间传说，表现青年男女对爱情的追求，描写他们为获得爱情而进行的斗争，歌颂了人文主义在个人和家庭生活中的胜利。第二，戏剧以大团圆为结局，富有乐观色彩和明朗色调。第三，抒情色彩浓厚，洋溢着勃勃生机。故事多发生在阳光明媚的南欧各地，女性形象美丽自信，景物风光旖旎明媚，场面充满诗情画意。悲剧：第一，通过描写各种对抗的社会力量的冲突，来反映人文主义理想与社会现实的矛盾。代表人文主义力量的正面主人公最终遭受毁灭，但在道义上获胜，违反人道的人受到惩罚，彰显了正义的力量，奠定了其悲剧的现实主义基调。第二，外在的社会冲突与人物内心情感的冲突结合在一起，揭示了悲剧主人公复杂的思想感情，推动着其性格发展变化。第三，艺术上具有特别悲壮的色彩。莎士比亚以高贵的英雄为悲剧主人公，描写他们的毁灭，充满沉郁悲愤的情感色彩。第四，融合了喜剧因素，达到了以<\/p><p>喜衬悲、以喜促悲的效果，深化了主题的表达。传奇剧：第一，其传奇剧描写具有浪漫色彩的传奇故事。莎士比亚的传奇剧通过魔法和神奇的力量来解决善恶的矛盾冲突，而且故事多发生在具有田园色彩、遗世独立的自然环境中，洋溢着梦幻、神奇的色彩。第二，剧情多以大团圆结尾，呈现出家庭关系由和到分，再由分到和的发展模式，场景相应出现了由宫廷到自然再到宫廷的变化。第三，表达了宽恕与和解的主题。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版文艺复兴时期文学第6题，朱版文艺复兴时期文学第14题<\/span>《哈姆莱特》中的哈姆莱特形象：哈姆莱特是一个处于人文主义理想和严峻现实矛盾中的人文主义者形象。首先，他身为王子，却接受了人文主义教育。哈姆莱特以人为中心去认识世界，认识人生，他认为“人是万物的灵长、宇宙的精华”，“世界是美好的花园”；他才艺出众，被视为“朝臣的眼睛、学者的辩舌、军人的利剑”；他对待朋友以诚相待，平等对待霍拉旭。这些思想和观念都反映了人文主义思想对他的影响。其次，其性格呈现出发展和不断丰富的特征。现实挫败了哈姆莱特的美好认识，他从快乐的王子变为忧郁的王子。父亲蹊跷离世，母亲快速改嫁，叔父继承了王位并且娶了他的母亲，现实的急剧变化让哈姆莱特跌入痛苦之中，对人生和世界感到失望。面对父亲鬼魂的嘱托，他辨析忠奸、寻找机会，一再在复仇行动中表现得犹疑不决，表现为一个延宕的王子。但是，一旦他确定了奸人，就变得果敢沉着，成为一个行动的王子，在与强大的邪恶势力斗争中献出了自己的生命，不仅为父亲复仇，也达到了重整社会秩序的目的。总之，哈姆莱特形象概括了新旧交替时期人文主义者的思想面貌，表现出了人文主义者同黑暗现实的矛盾和斗争，以及他们探求真理的历程，揭示了理想和现实的矛盾与距离，以及解决这一矛盾、缩短这种距离的必要性和迫切性。<\/p><p>⑤<span class=\"starmark\">★<\/span>哈姆莱特悲剧的原因：造成哈姆莱特悲剧的原因是多方面的。从客观上看，哈姆莱特的悲剧是因为正义和邪恶势力之间力量过于悬殊。奸王克劳狄斯是社会邪恶势力的代表，他奸诈、阴险，并纠集了整个宫廷、利用各种手段来排除哈姆莱特对其构成的威胁。哈姆莱特与其的斗争，就是人文主义者与不义僭主的斗争，是刚刚兴起的人文主义者与强大的封建势力之间的斗争，是“历史的必然要求和这个要求实际上不可能实现之间的悲剧性冲突”。从主观上看，哈姆莱特自身思想的缺点以及他对复仇的看法，也是造成其悲剧结局的原因。他在学校接受了人文主义理想，面对残酷的现实，这种习得的理想就显得较为脆弱，必然导致哈姆莱特的彷徨与犹疑，甚至对理想产生怀疑，从而陷入困境。所以，人文主义理想建立的空泛性，以及人文主义思想与现实的脱节，都为哈姆莱特最后的悲剧性结局起到了推波助澜的作用。而就哈姆莱特复仇的目的来看，其希望“重整乾坤”的目的也使其复仇超越了家庭范围，具有了社会意义。他不得不审慎对待，寻找合适的时机，达到以正视听的社会效果，为此而贻误时机。此外，他受到宗教思想的影响，失去了杀死正在忏悔的克劳狄斯的良机，为自己最后的<\/p><p>毁灭埋下了隐患。总之，造成哈姆莱特悲剧的原因是多重的，既有社会的因素，也有他自身思想的局限，所以，他的悲剧既是命运悲剧，也是性格悲剧，更是时代悲剧。<\/p><p>⑥<span class=\"starmark\">★<\/span>《哈姆莱特》复仇主题的认识：《哈姆莱特》整个故事是围绕复仇这个主题展开的，如何认识其复仇主题，关系到如何认识这部作品。首先，哈姆莱特的复仇具有社会性。他需要完成父亲交给他的家庭复仇任务，但是他所受的人文主义教育让他看到了凶手篡权与谋杀带来的社会恶果，即宫廷沆瀣一气，奸王混淆视听。所以，他将复仇扩大到伸张正义的社会层面，希望达到“重整乾坤”、匡扶正义的目的。为此，莎士比亚运用了其它两条复仇副线与之对照，以衬托哈姆莱特复仇的人文主义价值。其次，在复仇的过程中，哈姆莱特表现出延宕的特征。如何认识延宕，是认识哈姆莱特复仇的关键。哈姆莱特不是因为性格的软弱而推迟复仇的行动，而是因为邪恶势力客观上的强大，以及他自身思想认识的局限，一旦他确认了克劳狄斯的罪行，他就由延宕变为果敢坚决，最后在与敌人搏斗中献出了自己的生命，显示了人文主义者的行动能力与精神力量。再次，复仇以悲剧结局，但戏剧没有渲染悲观思想，而是肯定了哈姆莱特在道义上的胜利。哈姆莱特在公众面前揭露了克劳狄斯的罪行，并与之同归于尽，既铲除了奸人也达到了以正视听的目的。戏剧通过霍拉旭为哈姆莱特举行的葬礼，表达了哈姆莱特在道义上的胜利。总之，哈姆莱特的复仇表现了其崇高理想以及立志重整乾坤的人文主义精神，同时也深刻地体现出人文主义者要求冲破封建势力束缚的强烈愿望。<\/p><p>⑦<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版文艺复兴时期文学第7题，朱版文艺复兴时期文学第15题<\/span>《哈姆莱特》的艺术特色：第一，现实主义与浪漫主义的融合。通过创造性地运用历史题材，《哈姆莱特》体现了时代的人文主义思想和精神，广泛地展示了现实生活的图景，但同时它又着力表现了人物内心复杂的情感和激烈的思想斗争，将残酷的宫廷斗争、日常的家庭生活场景，与神秘怪异的鬼魂、墓地的戏谑、真疯和装疯结合在一起，表现出现实主义与浪漫主义的双重特性。第二，情节丰富生动。《哈姆莱特》中描写了三条为父复仇的线索，以哈姆莱特复仇为主线，辅之以雷欧提斯和小福丁布拉斯复仇的副线，三条线索彼此交织，互相对照，既突出了哈姆莱特复仇所具有的人文主义意义，也在互相转化中展开了广阔的社会画面。第三，悲喜剧因素融合。《哈姆莱特》是悲剧，但是作者打破了悲喜剧的严格界限，将喜剧因素融入其中，获得了丰富的美学效果。例如，掘墓人场景和波洛涅斯送别儿子场景，都具有喜剧气氛。第四，人物形象丰满，性格鲜明。莎士比亚通过个性化的语言，运用对比的手法，塑造了众多个性突出、丰富饱满的人物形象。第五，语言多姿多彩，形象生动，富有艺术表现力。《哈姆莱特》的语言形象化突出，特别善于运用比喻和隐喻来表达人物的复杂心理，人物的语言呈现出多样化风格，紧密地配合着人物的性格。<\/p>", "star": 1, "key": 1}]}, {"chapter": "第四章", "title": "17世纪文学", "link": {"quiz": "外国文学史习题_分章刷题.html#d3"}, "mindmap": 1, "kps": [{"no": 1, "title": "17世纪文学概况", "html": "<p>（1）历史背景（古典主义的背景）：①英国爆发资产阶级革命。英国资产阶级发展壮大，进而要求政治权力。为推翻封建主义制度，在1649年进行了资产阶级革命，废除了君主制，建立了共和国。1688年经过“光荣革命”，英国建立了君主立宪制，确立了资产阶级的政治地位。英国资产阶级革命对17世纪英国文学有着直接的影响。②法国封建王权的统治处于强盛时期。法国君主专制是资产阶级和封建贵族相互抗衡与妥协的产物。为了与教会抗衡，法国封建王权与发展中的资产阶级妥协，以使其为王权服务。同时资产阶级的力量还不够强大，需<\/p><p>要王权的保护，才能维护自身利益。以上原因，使得法国的封建王权与资产阶级关系密切，它们的结合对于巩固法国的统一，反对梵蒂冈宗教势力的控制具有积极作用。<\/p><p><b>（2）文学概况<\/b>：17世纪欧洲主要的文学思潮有法国的古典主义文学、英国的清教徒文学和巴罗克文学。法国古典主义文学是17世纪欧洲的主要文学思潮，以戏剧成就最为突出，出现了以高乃依、拉辛为代表的悲剧家，以莫里哀为代表的喜剧家，以及文艺理论家布瓦洛和寓言诗人拉封丹等。英国清教徒文学的最重要代表人物是约翰·弥尔顿，其代表作品《失乐园》被认为是欧洲文学史上文人史诗的绝唱之作。巴罗克文学的代表人物是意大利的马里诺、西班牙的贡戈拉和卡尔德隆，德国的格里美尔豪森和英国的玄学派诗人约翰·多恩等。<\/p>", "star": 0, "key": 0}, {"no": 2, "title": "古典主义文学", "html": "<p>（1）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版17世纪文学第2题<\/span>古典主义：古典主义是17世纪兴起于法国，后流传到欧洲其他各国的一种文学思潮。因为它在文艺理论和创作实践上以古希腊罗马文学为典范，而被称为“古典主义”。古典主义在政治上拥护中央集权，主张国家统一，歌颂贤明君主；在思想上崇尚理性，强调人的行为应受理智和意志的支配；在艺术上侧重表现荣誉、责任观念战胜感情的过程，提倡模仿古代，遵守三一律。它是近代欧美文学的第二次文学思潮，是封建社会向资产阶级社会过渡时期的产物，为君主专制政体服务是其创作的目的。法国的古典主义文学最具代表性，出现了悲剧作家高乃依和拉辛，喜剧作家莫里哀等。<\/p><p><b>（2）产生基础<\/b>：①法国封建王权的强大。当时，法国是欧洲最强大的君主专制国家。封建统治者采取一系列的政策措施来巩固王权，发展工商业，设立专门机构控制文学艺术。②理性主义哲学的兴起。17世纪笛卡儿的唯理主义哲学形成很大声势，影响到法国社会风气的变化，推崇理性、轻视感情逐渐成为时代的精神特征。③文学自身发展的要求。经过文艺复兴之后，欧洲文学面临着较为繁杂的局面，就文学自身的发展来看，对此进行适当的整饬也就符合文学发展自身调节的规律。<\/p><p>（3）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版17世纪文学第2题，朱版17世纪文学第2题<\/span>基本特征：①具有为君主专制王权服务的鲜明政治倾向性。古典主义文学拥护中央集权，歌颂贤明君主，强调国家利益的至高地位，要求文学为王权服务。②注重理性。古典主义将理性看作时代精神的核心，强调个体对王权的服从，对义务的践行，主张克制情欲。③模仿古代，遵循规则。古典主义将古希腊罗马文学视为楷模，重视艺术规范，尤其遵守三一律，推崇悲剧，主张运用严格的艺术规范，包括华丽、典雅的语言，处理旧有的题材，反映王公贵族的生活。④推崇华丽、典雅的文风，人物塑造类型化突出。<\/p><p><b>（4）古今之争<\/b>：古典主义一直是17世纪法国文坛的主潮，但是其过分推崇古典的思想也遭到了挑战。17世纪末，法国文学界古典主义者和反对派之间爆发<\/p><p>了关于崇古与崇今的争论，这是对古典主义清规戒律发起的一次挑战，文学史上称之为“古今之争”。以古典主义理论家布瓦洛为代表的古典主义拥护者捍卫古典主义原则，坚持厚古薄今，而以沙尔·贝洛为代表的厚今派主张今人胜过古人，要求摆脱桎梏。这场争论时起时落，一直延续到19世纪，并以古典主义的失败而告终。古今之争的出现，对古典主义造成了巨大的冲击。厚今派的文学主张反映了当时进步的文学思想，也预示着18世纪启蒙思潮的到来。<\/p><p><b>（5）<span class=\"keymark\">☆<\/span>积极性与局限性<\/b>：①古典主义时期产生了许多杰出作家，创作出众多伟大的作品，同时在维护民族语言的纯洁和促进民族语言、文化的发展方面作出了重要贡献。而就文学自身的发展来看，它对自文艺复兴以来欧洲过于繁杂的文学局面进行了一定的整饬。②古典主义是一种狭隘的现实主义，它服务于封建王权，粉饰太平，简化矛盾，具有浓厚的封建色彩；它过分崇古，追求高雅，美化宫廷趣味，妨碍作家深入反映现实；夸大理性的作用，忽视个人情感；其人物塑造流于公式化和概念化，性格单一。<\/p><div class=\"subsec\">（6）高乃依<\/div><p>①<span class=\"srctag\">朱版17世纪文学第4题<\/span>作家概况：古典主义悲剧的创始人，其代表作为《熙德》，其它重要作品有《贺拉斯》和《西拿》等。其作品取材于古代英雄故事，表现理性战胜情感的主题，充满爱国主义精神和英雄主义热情，气势悲壮激越。<\/p><p>②<span class=\"keymark\">☆<\/span>《熙德》的主题：作品通过展示男女主人公面临爱情与荣誉、义务冲突时的抉择，表现了理性战胜感情，国家利益高于一切的思想。在此基础上，作者也肯定了对个人幸福、爱情的追求。<\/p><p>③<span class=\"keymark\">☆<\/span>《熙德》的艺术特点：首先，作品庄严崇高，体现了古典主义的理想美。作品的主要内容是传说中的英雄的故事，崇高壮伟。其次，作品冲突激烈而尖锐，主要描写封建贵族面临的个人感情与国家义务之间的冲突。再次，作品语言充满激情，严谨周密，铿锵有力。<\/p><div class=\"subsec\">（7）让·拉辛<\/div><p>①<span class=\"srctag\">朱版17世纪文学第4题<\/span>作家概况：古典主义悲剧的后起之秀，其代表作品《安德洛玛克》被认为是第一部标准的古典主义悲剧，其它作品有《费得尔》和《爱丝苔尔》等。其悲剧多采用古希腊作品中的题材，表现情感战胜理性，人物因此招致悲剧结局，侧重爱情心理描写。<\/p><p>②《安德洛玛克》中的安德洛玛克形象：安德洛玛克是特洛伊英雄赫克托耳的寡妻，特洛伊大战后沦为爱庇尔国王庇吕斯的奴隶。在剧中涉及到的责任与情欲的冲突中，她是唯一一位体现了责任感和执著精神的人物形象。当被庇吕斯要挟时，她选择假装答应，待保全儿子后选择时机自杀，体现了其忠于爱情、忠于国家，机智勇敢、敢于反抗暴力的优秀品质，是一位具有高度理性，而且在道义上赢得胜利的女性形象。<\/p><p>###### ③《安德洛玛克》的主题：揭露了宫廷的黑暗和贵族社会的腐败，谴责丧失理<\/p><p>智、沉沦于情欲的王宫贵族，赞扬了不畏强暴、保全名誉的安德洛玛克，寄予了作者情感与理智高度统一的古典主义理想。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版17世纪文学第4题<\/span>高乃依与拉辛的创作比较：相同点：他们都是法国古典主义文学的代表作家。二者都具有进步的民族主义思想，主要创作悲剧，取材于古代，肯定理性的重要，并在一定程度上表示了对专制集权的不满。不同点：第一，高乃依写作于法国君主专制制度的上升时期，从正面突出了理性的崇高，表现了资产阶级力求妥协和维护王权的思想情绪。拉辛的悲剧写作于封建王朝的衰落时期，其作品揭露了封建统治的黑暗和贵族阶级的贪婪，表现了更加鲜明的民主倾向。第二，高乃依的悲剧以反映国家民族的大事、英雄伟业为主，而拉辛的悲剧则较多地关注个人感情。第三，高乃依描写意志坚强的理想人物，剧中理性战胜感情，人物结局圆满；拉辛描写有缺点的人物，剧中情欲战胜理性，以悲剧收场。第四，高乃依用热烈生动的语言表现人物的伟大，拉辛则重在情感的揭示，尤其擅长描写女性心理。高乃依的语言有崇高的阳刚之美，拉辛的语言典雅、和谐而简洁，具有柔情细腻的优雅风韵。<\/p><div class=\"subsec\">（8）莫里哀<\/div><p>①作家概况：法国古典主义文学最杰出的代表，古典主义喜剧家，古典主义时期最具有平民倾向的戏剧家，代表作有《伪君子》、《恨世者》、《吝啬鬼》和《堂璜》等。其创作分为四个阶段：第一阶段为创作奠基时期，主要创作滑稽剧和情节喜剧；第二阶段为古典主义喜剧开创时期，主要创作社会问题剧；第三阶段为全盛时期，也是他与教会和封建势力斗争最激烈的时期；第四阶段为创作晚期，创作轻松幽默的滑稽剧和芭蕾舞剧。<\/p><p>②喜剧创作的基本特点：思想上：第一，具有深刻的思想内容。其喜剧直接描绘现实，具有民主主义思想。第二，具有强烈的战斗精神。其喜剧揭露资产者的恶习，抨击大贵族的虚伪，赞扬下层人物的聪明机智。艺术上：第一，对戏剧形式进行改造，打破悲喜剧的界限，将不同风格的喜剧因素融于一体。第二，对戏剧表现方法进行了深入探索。其喜剧描写令人发笑的怪癖以及恶习，善于利用地位颠倒和意料不到的逆转、舞台动作以及语言技巧来制造喜剧效果。第三，灵活运用“三一律”。莫里哀既忠于“三一律”规则，但又不固守古典主义戏剧的这一原则，表现出对“三一律”规则的灵活运用。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版17世纪文学第8题，郑版17世纪文学第3题<\/span>《伪君子》中的人物形象：达尔杜弗：一个伪善的没落贵族和宗教骗子。首先，伪善是其性格的主要特点。他伪装虔诚骗取奥尔贡和其母亲的信任，暗地里却觊觎奥尔贡的财产、垂涎其妻子，背着奥尔贡实施勾引其妻子、夺取其财产的阴谋。在日常生活中，他也表里不一，表面上装成一个节欲、苦修的虔诚教士，实际上却从不拒绝世俗的享乐，而且还为其欲望和贪婪进行无耻的狡辩。其次，阴险狠毒也是其性格的特征。一旦恶行败露，他就暴露出凶狠恶毒的嘴脸，还将奥尔贡的秘密上告警<\/p><p>察，达到霸占其财产的目的。达尔杜弗具有高度的典型性，其形象已经成了“伪善者”的代名词。通过达尔杜弗这个人物，莫里哀深刻地揭露了上流社会伪善的习气和教会的虚伪荒淫，暴露了宗教骗子的社会危害性，显示出强烈的反宗教倾向。奥尔贡：资产阶级的代表形象。他拥护王权，但也不免受到上流社会风气的影响，迷恋宗教而失去理智。桃丽娜：该剧中最生动的正面人物形象。她身为女仆，但勇敢机智，聪明灵活，目光敏锐。她最早认识到达尔杜弗的伪善本质，并予以了痛斥和揭露。她还敢于反对奥尔贡的封建专制作风，与奥尔贡论战，帮助年轻人争取婚姻自由。莫里哀将女仆桃丽娜置于反封建、反宗教的重要位置上，并将之塑造成超越剧中其他人物的正面形象，赞扬了她所体现的下层人物的优秀品质，反映了莫里哀的民主主义思想。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版17世纪文学第4题<\/span>《伪君子》的艺术特点：第一，按照古典主义原则来创作，遵守三一律。《伪君子》故事情节单一，围绕达尔杜弗的伪善展开；时间也控制在24小时之内；地点集中在奥尔贡家中的客厅。第二，戏剧结构严谨，冲突集中，层次分明。《伪君子》通过开场的争吵引出戏剧冲突，暗示人物的性格特征。第三，喜剧中融入悲剧、闹剧等多种戏剧因素。奥尔贡女儿的婚姻几乎被断送，他自己面对的是失去财产、被捕入狱的命运，这些都构成了该剧的悲剧因素，使剧情发展更为紧张，矛盾更为尖锐，从而使反面人物的丑恶本质和作品的社会批判性显露得更加突出。而民间闹剧、风俗喜剧和传奇喜剧因素的加入，则增加了该剧滑稽戏谑的情趣、浓郁的生活气息和冲突的紧张性。第四，戏剧语言个性化。《伪君子》中人物的语言都符合各自的身份，桃丽娜的语言犀利、朴素、生动，符合其爽朗的个性；达尔杜弗的语言矫饰、造作，长篇大论地玩弄教义，暴露了这个伪善者口是心非、表里不一的本质。<\/p><div class=\"subsec\">（9）<span class=\"keymark\">☆<\/span>古典主义悲剧和古希腊悲剧的比较<\/div><p>①在悲剧理念上，法国古典主义悲剧以古希腊悲剧为楷模，承袭了亚里斯多德的悲剧理论，追求崇高、严肃的风格。但是，古典主义悲剧尤其强调理性的重要作用，呈现了与古希腊悲剧最大的不同。②在主题上，古典主义悲剧受到政治的影响，与古希腊悲剧相比，其爱国主义与英雄主义中的政治内涵得以增强。③在题材上，法国古典主义悲剧与古希腊悲剧基本都取材于神话故事，而不以人们的现实生活为题材。但古典主义在有限的故事空间里，对旧有题材进行了构思和演绎，融人了时代的新内容。④在悲剧人物上，古典主义悲剧中的人物较古希腊悲剧有更为明确的社会属性，人物性格更富个性，更加注重普通人的感情；而且，不局限于希腊悲剧的帝王将相。⑤在艺术形式上，古典主义悲剧继承了布瓦洛关于古希腊悲剧、喜剧的严格界限之说，将其分为崇高和卑下两种体裁。此外，二者都遵守“三一律”，但与古希腊悲剧相比，古典主义悲剧的情节更加复杂曲折。<\/p>", "star": 1, "key": 1}, {"no": 3, "title": "清教徒文学", "html": "<p><b>（1）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>清教徒文学<\/b>：英国在17世纪率先进行了资产阶级革命。这场革命<\/p><p>由英国清教徒开展，属于清教徒革命。在清教革命中诞生的文学即为清教徒文学，它成为17世纪英国文学的主要内容。清教徒文学利用文学传播清教思想，宣传新兴资产阶级的价值观念，与天主教会和保守的封建王权作斗争，反映了时代的精神。清教徒文学的代表作家有约翰·弥尔顿和约翰·班扬，其各自的代表作为《失乐园》与《天路历程》。<\/p><div class=\"subsec\">（2）弥尔顿<\/div><p>①作家概况：17世纪英国诗人、清教思想家和新兴资产阶级的政论家，被恩格斯评价为“第一个为弑君辩护的人”。其思想上承文艺复兴人文主义，下启18世纪的启蒙主义。弥尔顿取材于《圣经》的长篇诗作《失乐园》和《复乐园》被称为文人史诗的典范，诗剧《力士参孙》寄托了其革命情怀和毫不妥协的战斗精神。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版17世纪文学第6题<\/span>《失乐园》的思想内容：首先，通过亚当夏娃偷吃禁果被逐出地上乐园的故事，体现了生产劳动和文明的社会进化过程，也揭示了人类堕落的根源，表现了清教宗教观。其次，通过亚当夏娃坦然接受被惩罚的命运，反映了清教徒以苦为乐、节俭劳作的人生观和命运观。再次，通过撒旦反抗上帝而失去天上乐园的故事，赞美了撒旦反抗权威的崇高精神。总之，长诗通篇贯穿了诗人高昂的革命激情和对英国资产阶级革命的反思。<\/p><p>③<span class=\"keymark\">☆<\/span>撒旦形象分析：对于撒旦形象的理解，学术界也存在不同的见解。在西方文化传统中，《圣经》中的撒旦是一个反面人物，是魔鬼的化身、上帝和世人的敌对者，是教唆人们犯罪的元凶。但是，在《失乐园》中，弥尔顿对这一形象进行了创造性的改写，将他塑造成一个敢于藐视权威、反抗强权的英雄。弥尔顿笔下的撒旦气宇轩昂，拥有不屈不挠的复仇意志和毫不妥协的反抗思想，渗透着强烈的革命精神，体现了那个时代的精神特征。此外，在诗歌后半部分，撒旦形象发生了一定的转变，他变得越来越矮小和令人憎恨，甚至蜕变成反革命的头目。这一形象的变化，反映了弥尔顿在革命低潮时期对革命和革命者行为的反思，也反映了弥尔顿自身面对理智和自由意志冲突时的矛盾。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版17世纪文学第6题<\/span>《失乐园》的艺术特色：第一，继承了文人史诗的特点，具有雄浑宏伟的风格。《失乐园》取材于《圣经》，题材重大，结构宏伟，场景壮阔，格调高昂，富有革命激情。第二，巧妙隐蔽的讽喻技巧。弥尔顿是一名革命者，在复辟王朝极其险恶的环境下，他通过隐蔽的讽喻，曲折地表达了自已毫不妥协的政治思想。第三，史诗想象丰富，细节生动而有独创性。诗人把希腊、罗马的神话故事同《圣经》的宗教故事融为一体，加入自己丰富的想象，使故事更加生动多彩，富于艺术性。第四，节奏和音调铿锵有力。诗人采用无韵五音步抑扬格诗体的形式，按照情感变化来调整节奏和音调，诗句舒展自由，流畅而富有变化，具有音乐美。<\/p>", "star": 1, "key": 1}, {"no": 4, "title": "巴罗克文学", "html": "<p>（1）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版17世纪文学第1题<\/span>巴罗克文学及其特点<b>：<\/b>“巴罗克”一词出<\/p><p>自西班牙文，意为“形状不规则的珍珠”，后指“精巧”、“怪异”，被用来描述流行于16世纪的一种艺术风格。它以富丽繁复、精雕细刻为主要特征，呈现出宗教狂热与世俗感官享受的奇特混合。巴罗克文学于17世纪初在意大利、西班牙发源，在法国兴盛。巴罗克文学重视艺术的表现形式，而疏忽内容，热衷于追求与众不同的隐喻、冷僻的典故和复杂的语言技巧。巴罗克文学刻意雕琢与夸饰，脱离社会现实，其奢华、夸张的风格满足了当时天主教会的宗教目的和封建贵族的心理。其代表作家有意大利的马里洛，西班牙的贡哥拉，法国的沙龙派和英国的玄学派。<\/p><p><b>（2）<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版17世纪文学第5题<\/span>影响：<\/b>巴罗克文学追求艺术的形式之美，语言精雕细琢，华丽繁复，象征、暗示蕴藉深厚。它拓展了文学的表现空间，也丰富了文学的表现手法。在文学形式方面，它提高了文学的艺术性，发展了一种新的美学趣味和倾向。它对17世纪的古典主义文学家，例如高乃依、拉辛、弥尔顿等都产生过一定的影响。其艺术表现方法对19世纪浪漫主义文学产生了直接作用，对唯美主义和表现主义等思潮都具有借鉴意义，对19世纪以来的拉美文学也有深刻影响。<\/p>", "star": 1, "key": 1}]}, {"chapter": "第五章", "title": "18世纪文学", "link": {"quiz": "外国文学史习题_分章刷题.html#d4"}, "mindmap": 1, "kps": [{"no": 1, "title": "启蒙运动", "html": "<p>（1）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版18世纪文学第1题<\/span>启蒙运动：启蒙运动是18世纪欧洲资产阶级发动的第二次反封建、反教会的思想文化运动。“启蒙”一词原意为“光明”和“照亮”，启蒙思想家主张以近代科学文化知识“启迪”人们的理性，“照亮”愚昧无知的封建社会，以扫荡基督教会和封建统治一千多年来散布的迷信和偏见，建立“理性王国”，故有“启蒙”之称。启蒙运动追求政治和思想上的自由，反对宗教蒙昧主义，反对封建专制制度，宣扬自由、平等、理性、科学、民主与法制。它是文艺复兴时期人文主义思想的继续和发展，带有强烈的政治革命性质，为资产阶级革命作了思想准备。其代表人物有伏尔泰、孟德斯鸠、卢梭和狄德罗等。<\/p><p>（2）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版18世纪文学第1题，朱版18世纪文学第1题<\/span>产生的背景（产生的原因）：①资本主义经济发展创造了社会条件。17、18世纪，西欧资本主义获得了较大发展，新兴资产阶级的力量日益壮大，掌握了越来越雄厚的经济实力。资本主义经济的发展和资产阶级力量的壮大，为启蒙运动的兴起奠定了经济基础和阶级基础。但是，与这一社会需求相对立的却是当时欧洲大陆独霸政权的专制主义和教权主义。所以，反封建、反教会，甚至反宗教，就提上了资产阶级革命的议事日程。②自然科学和生产力的突破性发展，带来人的价值的进一步发现。近代数学、物理、化学、生物学和地质学开始形成，尤其是英国自然科学的发展推动了产业革命的到来，从而使资本主义经济和资产阶级力量空前壮大。在扩大的贸易和生产活动中，人的视野得到扩展，人的价值被进一步发现。③英国革命和唯物主义哲学的积极影响。英国经过17世纪资产阶级革命后建立的君主立宪政体和代议制，为欧洲其它国家的资产阶级提供了政治示范，而英国在革命后取得的快速发展，更是激发了欧洲大陆进步知识分子对民主和自由的向往。英国的哲学和社会科学等进步思想成为了欧洲资产阶级学者认真研读的对象，这些新思想的传播，为启蒙主义运动提供了理论基础和思想支撑。<\/p><p>（3）<span class=\"srctag\">朱版18世纪文学第1题<\/span>特点：启蒙运动不只是一场新文化运动，还是一场气势宏大、扫荡陋习的反封建、反教会的思想革命运动。启蒙运动有两大特点，一是反对宗教蒙昧主义，宣扬理性与科学；二是反对封建专制制度，宣扬民主与法制。<\/p><p><b>（4）发展脉络<\/b>：启蒙运动萌发于荷兰，经英国，后在法国形成巨大声势，由法国传入德国，继而波及欧洲其它国家，如俄国、意大利等。法国启蒙运动最典型、最富于革命精神，影响也最大。<\/p>", "star": 1, "key": 1}, {"no": 2, "title": "启蒙文学", "html": "<p>（1）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>启蒙文学：随着启蒙运动的发展，许多启蒙思想家直接进行文学创作，把文学作为宣传启蒙思想、批判封建制度和天主教会的有力武器。他们抛弃<\/p><p>古典主义文学的宫廷倾向，以及它的僵化原则，纷纷从理论和实践方面提出了新主张，进行了新实验，形成了声势浩大的文学运动，文学史把这一体现了启蒙主义文艺思想和美学原则的文学创作称为启蒙文学，它构成了启蒙运动的重要组成部分。启蒙文学具有鲜明的政治倾向性，以资产阶级和平民为主人公，创造了新体裁，文学形式多样。伏尔泰、孟德斯鸠、狄德罗和卢梭等为杰出代表。<\/p><p>（2）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版18世纪文学第1题，朱版18世纪文学第2题<\/span>特点：①反封建、反教会的思想内容和鲜明的政治倾向性。启蒙文学继承了文艺复兴时期人文主义文学反封建、反教会的传统，但是具有更加强烈的政治性和革命性。②具有较强的民主性，以第三等级的普通人为正面描写对象，甚至将之塑造成英雄形象，而王公贵族、教士等成为被批判的对象，在文学的人民性方面前进了一大步。③理性色彩浓厚，人物形象性格单一。启蒙文学家以自由、平等、博爱为口号，全面批判封建制度，描绘“理性王国”的乌托邦美好图景。有些作家正面、直率地宣传政治主张和学说，致使作品主人公成为启蒙思想的代言人，性格单一，削弱了作品的文学性。④创造了新的文学形式，艺术表现手法丰富多彩。启蒙文学打破了古典主义文学严格的体裁限制，而且还创造了多种新形式，如哲理小说、正剧、书信体小说、对话体小说和教育小说等。<\/p>", "star": 1, "key": 1}, {"no": 3, "title": "英国文学", "html": "<p><b>（1）文学概况<\/b>：①18世纪初期的英国文学，受到古典主义文学的影响，用古典主义创作方法来描写当时贵族、资产阶级的生活，代表人物是诗人亚历山大·蒲柏。②随着政治生活的活跃和城市的发展，大众传媒出现，英国现实主义小说于18世纪20年代兴起，作家们宣传资产阶级价值观，批判封建残余思想和资本主义社会的阴暗面，赞扬资产阶级积极进取的精神，力图通过启蒙教育促进社会改良，代表作家有笛福、斯威夫特、菲尔丁和理查生等。③18世纪中后期，随着英国工业革命的深入，启蒙运动许诺的自由、平等、博爱的社会理想并没有得以实现，贫富对立愈益突出，对社会的不满通过一种哀怨之情表达了出来，出现了感伤主义文学，代表作家和诗人有斯泰恩、格雷和杨格等。此外，对理性的反叛，对现实的不满，催生了另一种小说类型的出现，即哥特式小说。这类作品多以哥特式建筑为背景，描写发生于此的凶杀、流血事件，渲染了神秘、恐怖和怪诞的气氛。华尔浦尔、拉德克利夫夫人和马修·刘易斯是其代表作家。<\/p><p>（2）<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版18世纪文学第4题<\/span>现实主义小说的发展：现实主义小说代表着18世纪英国文学的最大成就。这些小说反映了资本主义原始积累时期的社会状况，描写资产阶级的生活；在小说结构上，具有流浪汉小说的特征，以人物的旅途经历为线索展开描写。①18世纪初期，英国现实主义小说主要描写资产阶级海外经商、殖民和探险活动，表现出强烈的海外殖民扩张意识，充满了积极的乐观色彩。笛福和斯威夫特为这一时期现实主义小说的代表作家。笛福的《鲁滨逊漂流记》标志着英国现实主义小说的诞生，奠定了这种新型文学样式的基<\/p><p>础，他由此而被称为“小说之父”。②40、50年代，英国现实主义小说进一步发展，作家更注意描写下层人民的生活，关注家庭生活中的爱情、婚姻问题，注重反映人物的不幸和痛苦的内心体验，表现出感伤的色彩，在结构上突破了流浪汉小说的传统方法，而集中描写一个完整事件。理查逊和菲尔丁为突出代表，各自创作了《帕米拉》和《汤姆·琼斯》。<\/p><p><b>（3）英国现实主义小说特点<\/b>：①立足现实，反映人间百态。英国现实主义文学抛弃了古典主义文学取材于历史或传说的传统，大胆从当代现实生活中挖掘题材，通过特殊人物在特殊环境中的种种经历和感受来设置情节，安排场景，塑造人物，揭示人物心理，表达作者对社会人生的看法。②注重小说艺术。英国现实主义小说家重视小说内在结构的统一性，注重描写人物性格，发现了人物性格和环境的关系，在时间、地点描写方面力求精确，在再现自然环境和社会环境方面，运用大量真实具体的细节描写，以获得再现社会风俗画的效果。③广泛使用日常生活语言，贴近现实，具有真实、鲜活的艺术魅力。<\/p><div class=\"subsec\">（4）笛福<\/div><p>①作家概况：笛福是现实主义小说的开创者，其小说创作开启了一次真正的文学革命。其代表作《鲁滨逊漂流记》、《辛格顿船长》等立足于现实，正面描写此时英国资产阶级的生活与思想，为英国现实主义小说的发展开辟了道路。<\/p><p>②<span class=\"keymark\">☆<\/span>《鲁滨逊漂流记》的思想内容：《鲁滨逊漂流记》是笛福的代表作品，也是英国现实主义小说的奠基之作。其描写的具体内容分为三个部分，即鲁滨逊三次离家航海的经历、鲁滨逊在荒岛上的经历，以及从荒岛归来后的故事。其中，鲁滨逊在荒岛上28年的生活构成小说的主干部分。它采用鲁滨逊回忆的方式，以第一人称叙述视角描写鲁滨逊自己的飘流、冒险、拼搏和追求，展现了英国早期资本主义得以发展的现实，突出地歌颂了资产阶级的个人进取精神，也表现了强烈的海外殖民扩张意识。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>鲁滨逊形象：文学史上出现的第一个资产阶级的正面人物形象，是资本主义处于上升时期资产阶级的典型形象。首先，他为追逐财富而不惜冒险。与其父辈安分守己的生活不同，他渴望投身于充满危险和艰难的海外贸易活动，冒着生命危险多次跨洋出海，当过俘虏，饱尝了艰辛，同时也赚取了巨大的财富。鲁滨逊对于新世界的向往和勇往直前的精神，反映了资产阶级的时代特征以及昂扬饱满的乐观心态。其次，勤劳务实是其性格的主要特征。孤身一人流落荒岛，鲁滨逊不绝望，也不后悔，而是脚踏实地地开辟新生活，收集食物，发明制作工具，开始播种耕作，养殖牲畜，上演了人类文明的发展历史，经过28年的不懈劳动，最后将荒岛建设成一个富足的理想王国。鲁滨逊形象的这一特征，充满了对劳动和人的聪明才智的赞扬，反映了清教以苦为乐、勤俭劳动的人生哲学，表现了资本主义上升时期的资产阶级要求发挥个人才智的强烈愿望。再次，鲁滨逊也是一名真正的殖民主义者。他冒险的目的是为了赚取巨额的财富，在这一<\/p><p>过程中，外在的环境和其他种族的人民不过是其有待征服的对象。其对黑人出尔反尔，将“星期五”当作奴隶，贩卖黑奴，用火枪赶走前来的土著，用《圣经》驯服“星期五”的心灵，他改变了荒岛的自然面貌，同时也将殖民关系引入了荒岛。但是，在笛福的笔下，鲁滨逊不仅作为“西方文明社会的白人”得到确认，而且还被赋予仁慈诚实、正直慷慨、勤劳务实等优秀品质，以歌颂西方文明积极进取的时代精神和昂扬乐观的人生哲学。笛福对鲁滨逊形象这一特征的肯定性描写，美化了资本主义以及殖民活动，客观上反映了西方殖民过程的血腥与掠夺以及殖民文化的罪恶和偏见。总之，鲁滨逊这个人物真实地反映了在新的生产力与生产关系下出现的一种新人物，艺术地再现了新兴资产阶级中资产者和殖民者的典型形象，概括了他们的思想感情、性格特征和时代烙印。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《鲁滨逊漂流记》的意义和地位：《鲁滨逊漂流记》是英国第一部现实主义小说，奠定了现实主义小说这一新的文学形式，在思想与艺术上都为现实主义小说开辟了道路，标志着从传奇故事向近代写实小说的历史性过渡。首先，小说具有很强的真实性。笛福小说观的首要原则是“真实性”，他从当代现实生活中取材，完全用写实的手法描写人物及其活动的环境，在行动中刻画人物性格，出色地利用细节描写，运用第一人称叙述视角进行叙事，带给小说一种真实具体的效果。其次，塑造了一个“真正的资产者”形象。作者塑造了资产阶级平民主人公形象，高度概括了早期资本主义时代的精神和新兴资产阶级的思想特征，歌颂了资产阶级的奋斗，充分肯定了劳动的价值。再次，小说情节单纯，结构严谨。在叙述方式上，作者采用航海日志体的写法，按照时间顺序逐项地作详细的记录，主人公的亲身经历将一系列事件串联起来，构成小说的情节线索。运用第一人称叙述视角进行叙事，主人公既是事件的参与者，又是观察者，同时还是叙述者，这就使得小说更加真实可信，也让小说内在结构趋于紧凑统一。最后，《鲁滨逊漂流记》确立了一种“鲁滨逊故事”（“the Robinsonade”）或航海遇难小说的新类型，对后世荒岛探险小说、海难逃生小说等产生了重要影响。总之，《鲁滨逊漂流记》在小说史上第一次将一个普通人的日常生活作为关注的中心，而且将小说的重心从对事件的叙述转移到了对一个中心人物的塑造上，实现了从流浪汉小说向近代长篇小说的飞跃。<\/p><div class=\"subsec\">（5）菲尔丁<\/div><p>①<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版18世纪文学第5题<\/span>作家概况：18世纪英国最杰出的小说家，著名的戏剧家。其小说理论和创作实践不仅对英国而且对西方19世纪现实主义文学的发展都产生了重要影响。他认为小说是“散文滑稽史诗”，主张严格遵循自然，表现“真实的自然人性”，要如同史诗一样反映广阔的生活，针砭社会，小说的情节要具有内在统一性，人物塑造要具有典型性。菲尔丁的小说创作实践了他所提出的小说主张，触及到18世纪英国社会生活的方方面面，在反映生活的广度和深度上超过了其他同时代的作家。在小说艺术方面，菲尔丁有非常自觉<\/p><p>的认识，所以他在创作过程中追求较高的艺术境界，注重对人物性格的刻画，揭示人物的心理，突出人物和环境的关系，尤其在小说结构艺术方面融合了西方传统叙事文学的模式，推动了西方长篇小说艺术的发展。总之，其小说创作代表了18世纪英国现实主义小说的最高成就，为19世纪现实主义文学的发展起到了积极作用。《汤姆·琼斯》为其代表作，其它作品还有《约瑟·安德鲁传》、《大伟人江奈生·魏尔德传》和《阿米莉亚》等。<\/p><p>②<span class=\"keymark\">☆<\/span>菲尔丁小说创作的特点：首先，其小说突破资产阶级家庭生活的范围，反映了英国社会生活中的许多重要现象，展现出一幅幅社会风俗图景。其次，他的小说敢于反抗时代风气，对传统的道德、宗教、法律提出尖锐批评。再次，在小说艺术结构上，仍然采用了流浪汉小说的结构框架，但是进行了恰当的剪裁，结合人物性格和命运的发展突出主要事件，在社会环境中塑造人物，提炼了结构，扩充了小说的表现内容。最后，小说情节生动，人物心理描写深刻。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版18世纪文学第5题<\/span>《汤姆·琼斯》的思想内容：小说以弃儿汤姆·琼斯与苏菲娅的爱情故事以及汤姆被逐、离家流浪的经历为线索，全景式地反映了当时的社会生活，描绘了从乡村到城市、从社会底层到上流社会的一幅幅丰富生动的生活画面，揭露了婚姻问题中的门第偏见，抨击了拜金主义和上流社会的道德堕落，赞扬了下层人物身上具有的诚实、正直的优秀品德。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版18世纪文学第5题<\/span>《汤姆·琼斯》的人物形象：小说中描写的人物多达40多个，个个都真实生动，别具特色，其主要人物形象更是个性突出，性格饱满。汤姆·琼斯：心地善良、真诚热情的青年形象。他关心他人，扶弱济困，甚至宽恕敌人，为人豁达大度，知恩图报。但同时，他也有性情冲动，急躁放任等不足。苏菲娅：纯洁、善良、美丽的女性形象。她温柔、娴雅和孝顺，但是当爱情受到威胁的时候，她又敢于反抗，不为任何利诱和威胁所动，坚持对爱情的追求，与汤姆终成眷属。奥尔华绥：正直善良、亲切可爱的乡村绅士。他心地宽厚，乐于助人，但常常又被人欺骗而是非不清、赏罚不明。总之，菲尔丁在突出这些人物性格的主要特征的同时，还刻画了他们身上或多或少的缺陷，或对立的特点，这些不同方面的性格因素融合在一起，真实地塑造了人物丰满的形象，增加了作品真实可信的现实感。<\/p><p>⑤<span class=\"keymark\">☆<\/span>《汤姆·琼斯》的现实主义特征：第一，具有史诗般的规模。菲尔丁详尽地描述了当时英国社会生活的各个方面，作品空间广阔，规模宏大，包罗万象，可以说是一部概括了18世纪英国社会生活的散文史诗。第二，具有高度的真实性。《汤姆·琼斯》真实地再现了英国社会生活的方方面面。在人物塑造方面也遵守真实原则，例如汤姆·琼斯形象，小说既描写了他正直、勇敢的一面，也表现了他轻率、鲁莽的不足。这些不同的性格因素融合在一起，使得人物形象有血有肉，真实立体。第三，具有强烈的批判性。《汤姆·琼斯》无情地揭露和嘲讽英国贵族社会中的种种弊端和黑暗腐朽，真实地再现了底层人物的生活。<\/p><p>⑥<span class=\"keymark\">☆<\/span>《汤姆·琼斯》的结构特点：《汤姆·琼斯》的结构艺术代表了当时长篇小说结构艺术的最高成就。首先，融合了西方叙事文学的传统。它一方面借鉴《小赖子》、《堂吉诃德》等流浪汉小说的时间结构模式，另一方面又学习《巨人传》的空间转换形式，从而构成一种新的小说结构类型。小说保留了流浪汉小说以主人公生平传记构成小说基本情节的特征，抛弃了流浪汉小说情节凌乱的弊端，集中描写几个空间场景来串联故事情节。其次，小说结构精巧严正，详略得当。全书共18卷，分为三大部分，各6卷，相应地集中展现了主人公在乡村、流亡路上和伦敦的经历。汤姆的青少年经历占全篇的三分之一，22岁后的生活占三分之二，这样既可以进行全局的鸟瞰，又可以进行重点描写。再次，情节线索多样，故事发展曲折。小说以汤姆和苏菲娅的爱情波折为主线，辅之以汤姆身世之谜的副线，并利用次要人物穿针引线。故事发展迅速，矛盾冲突环环相扣，完整而富有情趣。<\/p><p><b>（6）其他现实主义小说家<\/b>：斯威夫特：英国启蒙主义文学的激进派代表，代表作品《格列佛游记》是享誉世界的讽刺名著。《格列佛游记》通过描写主人公格列佛多次航海遇险的遭遇和见闻，对英国的资本主义制度进行了辛辣的讽刺，也批评了英国政权的腐败和社会黑暗，反映了作者对理想社会的向往。理查生：感伤主义文学的先驱，书信体小说与家庭小说的开创者。其代表作《帕米拉》描写女仆帕米拉以美好的道德情操和虔诚的宗教信仰，赢得主人的爱情，并在婚后受到人们的尊重。《克拉丽莎》描写了少女克拉丽莎在婚姻的折磨中死去的悲惨故事，提出了妇女婚姻不能自主的社会问题。<\/p><div class=\"subsec\">（7）感伤主义文学<\/div><p><span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版18世纪文学第3题<\/span>感伤主义文学：18世纪后期流行于欧洲的一种文学思潮，因英国作家斯泰恩的游记《感伤的旅行》而得名。感伤主义文学的特点是崇尚感情，把情感放在理性之上，夸大感情的作用，细致地描写人物的心情和不幸遭遇，以唤起读者对人物命运的同情与怜悯，同时也因为对劳动者的疾苦深表同情，流露出对社会的不满，具有人道主义思想。但因为常常以生、死、黑夜和孤独为题材，其格调悲哀，语言灰暗。感伤主义文学突出感情，呈现出主观性和情感性的审美特质，成为19世纪浪漫主义文学的先声。感伤主义文学体裁多样，包括小说、戏剧、诗歌等，但最喜欢使用的文学体裁为哀歌、旅行记和书信体小说，代表作家有斯泰恩、哥尔德斯密斯和卢梭等，斯泰恩的《感伤的旅行》、哥尔德斯密斯的《威克菲尔德的牧师》，以及格雷的《墓园挽歌》等为代表作品。<\/p><div class=\"subsec\">（8）哥特式小说<\/div><p><span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>哥特式小说：“哥特”原指哥特人和中世纪的哥特式建筑。哥特小说是18世纪后期在英国出现的一种新的小说体裁。哥特小说以中世纪哥特式古堡为背景，描写发生在阴森恐怖的城堡中的神秘故事和谋杀事件，充满神秘、恐怖、怪诞的气氛。哥特小说由英国作家华尔蒲尔首创，代表作是华尔蒲尔《奥特朗托<\/p><p>堡》、拉德克利夫夫人的《奥多芙的神秘》和马修·G·刘易斯的《修道士》。哥特小说是对理性主义的反拨，表现了人们对资产阶级革命后的社会现实产生的不满情绪，对后来的浪漫主义、现实主义和现代主义都有不同程度的影响。<\/p>", "star": 1, "key": 1}, {"no": 4, "title": "法国文学", "html": "<p><b>（1）文学概况<\/b>：法国是启蒙运动的中心，涌现了一大批享有世界声誉的启蒙思想家和文学家。法国启蒙文学是在资产阶级酝酿革命的时代背景下诞生与发展的，所以其批判力度最强，最富有民主战斗精神。从18世纪20年代起，法国启蒙文学就开始形成巨大的声势，经过了早期、中期和后期的发展过程。<\/p><p><b>（2）百科全书派<\/b>：法国启蒙思想家的别称。他们在历时20年编撰35卷的《百科全书》的过程中，团结在一起，将之变成了一场以知识开启心智、以理性扫荡专制和愚昧的启蒙运动。他们以编撰《百科全书》为契机，总结了启蒙运动在自然科学和社会科学方面的成就，从政治制度、法律机构到宗教、文化、艺术等方面对封建社会的上层建筑和意识形态发动了一次全面的攻击，传播了科学知识和革命思想，使得唯物主义和自然神论成了当时法国一切有教养的青年的信条，为即将到来的法国大革命进行了思想和舆论上的准备。狄德罗、达兰贝尔、伏尔泰、爱尔维修、孟德斯鸠和卢梭等都是百科全书派的中坚力量。<\/p><p><b>（3）<span class=\"srctag\">朱版18世纪文学第6题<\/span>早期启蒙文学的代表作家<\/b>：孟德斯鸠：法国第一个真正意义上的启蒙作家，理论著作《法的精神》阐述了三权分立的思想，代表作《波斯人信札》是第一部哲理小说。《波斯人信札》以旅法波斯青年与家人通信的形式，评述了法国的政治、宗教和社会问题，一方面揭露了上流社会的腐朽生活，抨击封建专制制度，否定上帝和教皇的权威，另一方面也表示了自己对政治、宗教、法律和时事的看法，提出了带有宗法制色彩的社会理想。伏尔泰：法国启蒙运动中的领袖人物。他将哲理小说作为反封建、反教会的武器，其悲剧创作遵从古典主义的规范，小说创作有《查第格》、《天真汉》和《老实人》等代表作品。《老实人》通过“老实人”和其教师的遭遇，讽刺了为现存秩序辩护的盲目乐观主义哲学，也否定了悲观主义思想，描绘了理性王国的美好图景，宣扬了通过劳动改变社会的理性主义思想和积极进取的奋斗精神。<\/p><p><b>（4）<span class=\"srctag\">朱版18世纪文学第6题<\/span>中期启蒙文学的代表作家<\/b>：中期启蒙文学家的思想更加激进民主，他们将法国启蒙文学推到了繁荣的顶峰。狄德罗：法国启蒙运动的领导者，《百科全书》的总编辑，唯物主义与无神论的代表，现代美学的先驱之一。其戏剧作品创作为现代戏剧的兴起奠定了基础，代表作有《私生子》、《一家之长》和《当好人还是坏人？》等。其创作的小说主要为自白体和对话体形式，代表作分别为《修女》和《拉摩的侄儿》，后者被恩格斯称为“辩证法的杰作”。<\/p><div class=\"subsec\">（5）卢梭<\/div><p>①<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版18世纪文学第8题<\/span>作家概况：杰出的启蒙思想家和文学家，启蒙运动中最具民主倾向的代表，其政治思想对资产阶级革命和政治生活影响巨<\/p><p>大，其文学创作开启了19世纪浪漫主义文学的先河。其理论论著有《社会契约论》，提出了“天赋人权”观念和民主共和的理想。此外，他还著有自传作品《忏悔录》，教育小说《爱弥儿》，散文《山中来信》、《孤独漫步者的遐想》，以及小说《新爱洛依丝》。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版18世纪文学第2题<\/span>《新爱洛依丝》的思想内容：这部书信体小说描写了家庭教师圣普乐与贵族女学生朱丽的爱情悲剧。小说反映的是18世纪的生活，但是采用了中世纪爱情悲剧的女主角爱洛依丝的名字来命名，突出了小说反封建反专制的时代主题。12世纪的少女爱洛依丝与老师相爱，最后以悲剧结束，时代在迁移，但爱情悲剧仍然不断上演，新的悲剧故事的发生，凸显了旧的封建制度的顽固反动。围绕这一爱情悲剧，小说反映了以下几方面的主要内容：首先，描写并歌颂了爱情，唱响了反封建的主题。卢梭一反古典主义压抑感情而强调理性的原则，热烈讴歌爱情，将爱情描绘成纯洁、崇高的感情，并通过描写主人公追求合乎人性的爱情而经受的折磨与痛苦，揭露了“社会道德”对自然人性的扼杀，挞伐了非人道的封建观念。其次，描写并赞颂了大自然的神奇与美丽。在小说中，卢梭描绘日内瓦湖的美丽风景与乡村生活场景，并将其与腐败堕落的都市生活对立起来，展现了大自然和宁静的乡村生活对人们身心的积极影响。再次，披露了作者有关教育、文艺和社会平等的民主主义思想。小说借人物有感而发或长篇议论，将作家的观点杂然并存，扩大了小说的社会容量，也深化了对朱丽和圣普乐爱情悲剧之社会根源的揭露与批判。总之，这是一部爱情悲剧小说，但超越了对爱情的描写，表现了要求人性解放、个性自由的强烈愿望，谴责了封建等级制度和门第观念，体现了作者激进的民主主义思想。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版18世纪文学第2题<\/span>《新爱洛依丝》的文学地位：《新爱洛依丝》是卢梭的代表作，也是18世纪欧洲最重要的小说。首先，它表达了作家的民主主义思想，而成为18世纪启蒙文学的代表。小说通过朱丽和圣普乐的爱情悲剧，挞伐了封建专制社会和封建婚姻的门第观念，表达了争取自由的强烈愿望。在描写过程中，作家常常借人物来表达自我的各种社会思想。卢梭是启蒙思想家中最富有民主精神的一位思想家和文学家，其民主主义思想的表达，拓展了小说的社会容量，也加深了小说的批判力度，加强了这部作品在启蒙文学中的代表性。其次，它在描写的内容和方法上，突破了18世纪启蒙主义文学哲理小说的局限，开启了19世纪浪漫主义文学的先河。它不仅以激烈的感情、美丽的大自然作为描写对象，而且还以饱含情感的笔墨，采用情景交融的方法予以再现，既反映了人与自然的和谐关系，也增加了作品的艺术感染力，在文学性上超越了18世纪的启蒙文学，并以其创新性的贡献预示了下一个文学时代的到来。总之，这是一部承上启下的作品，反映了18世纪启蒙文学要求自由的呼声，批判了封建专制制度和社会习气，并在内容和风格上率先表现了19世纪浪漫主义文学的特征。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版18世纪文学第3题，朱版18世纪文学第8题<\/span>卢梭的影响：卢梭的思想和文学创作对文学发展作出了重要贡献，其思想对19世纪的浪漫主义作家和诗人产生了积极影响，其创作开启了浪漫主义文学的先河，具有示范意义。第一，卢梭提出了回归大自然的号召，并将大自然作为审美观照的对象予以再现，描写并讴歌大自然的神奇与美丽，拓展了审美视野，丰富了文学的表现范围。第二，注重对感情的表现，对人性进行了深入挖掘。《新爱洛依丝》颂扬了人的自然真实感情，尤其是男女之间充满激情的爱情，描绘了日内瓦湖区美丽的自然风光和宁静的乡村生活，展现了人与自然和谐相处的美好境界。《忏悔录》剖白了作者自我的灵魂，开启了文学艺术坦诚描写自我的先河，主人公敏感的性格，对大自然的感情，甚至无名的忧郁，都成为后来浪漫主义文学中主人公的共同特征。第三，作品充满激情。其作品被称为“抒情长诗”，以浓郁的感情色彩见长。文笔细腻准确，将对自然景物的描写与人物感情的抒发结合在一起，情景交融，感人至深。总之，卢梭对大自然的重新认识，对文学描写对象的拓展，以及对新的表现方法的创新性尝试，都对19世纪浪漫主义作家和诗人的思想与创作产生了积极影响，他的创作奠定了浪漫主义文学发展的文学基础，可以说，浪漫主义作家和诗人正是在卢梭开创的道路上前进。<\/p><p>（6）<span class=\"srctag\">朱版18世纪文学第6题<\/span>后期启蒙文学的代表作家：博马舍：法国18世纪最后一位启蒙文学家，主要创作有戏剧论著和戏剧作品，反对古典主义戏剧，提倡描写资产阶级生活的市民剧。其戏剧创作表现出强烈的反封建精神，《费加罗三部曲》（《有罪的母亲》、《塞维勒的理发师》、《费加罗的婚姻》）为其代表作品，其中《塞维勒的理发师》塑造了第三等级的代表塞维勒机智、勇敢的生动形象。塞维勒对伯爵的胜利，是第三等级对封建贵族的胜利，富有革命意义和斗争精神，被拿破仑称之为“行动中的革命”。<\/p>", "star": 1, "key": 1}, {"no": 5, "title": "德国文学", "html": "<p>（1）<span class=\"keymark\">☆<\/span>文学概况：18世纪的德国还处于封建诸侯割据的状态，资本主义的发展受到了严重阻碍。①德国启蒙文学的首要任务是创造具有近代意义的民族文学，以消除封建割据，实现民族国家的统一，并弘扬个性，促进人民觉醒。②18世纪德国文学经历了三个发展阶段：20年代至世纪中期的启蒙文学早期阶段、70-80年代“狂飙突进运动”标志的启蒙文学高潮阶段、1796-1804年间的古典主义时期。<\/p><p><b>（2）启蒙文学早期阶段<\/b>：启蒙文学起步于18世纪20~40年代。高特舍德写作《为德国人写的批判诗学试论》，倡导纯洁民族语言，建立德国统一的民族文学。至18世纪中期，德国启蒙文学开始繁荣，莱辛为杰出代表。莱辛著有美学论著《拉奥孔》、戏剧评论集《汉堡剧评》和悲剧《爱米丽雅·迦洛蒂》等，将德国文学引向正确的发展轨道，成为德国民族文学的奠基人。<\/p><p>（3）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版18世纪文学第9题<\/span>“狂飙突进运动”：狂飙突进运动发生在<\/p><p>18世纪70年代到80年代中叶的德国。它是德国新兴资产阶级发起的第一次全国性的文学运动，也是启蒙运动在德国的继续与发展。“狂飙突进”得名于剧作家克林格尔在1776年出版的一部剧本《狂飙与突进》。狂飙突进运动的参与者多为青年知识分子，充满反叛激情，主张民族统一，强调文学的民族性，要求发扬文学的民族风格；反对封建束缚，强调天才，强烈地要求个性解放；接受了卢梭返回自然的思想，歌颂理想化的大自然和淳朴的人民。其成就主要体现在戏剧领域，代表作家是青年时期的歌德和席勒，理论家是赫尔德。由于没有明确的斗争目标和斗争纲领，这场运动很快走向消退，反映了德国资产阶级的局限。但是，这一运动促进了德国民族意识和个性的觉醒，将德国启蒙文学推向迅猛发展的阶段。其对感情和天才的强调，对民族文学的重视，也使这一运动成了19世纪浪漫主义文学的先导。<\/p><div class=\"subsec\">（4）魏玛古典主义时期<\/div><p>①<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>魏玛古典主义（德国“古典主义”）:18世纪80年代，德国文坛出现了古典主义文学，称之为“魏玛古典主义”，实质上是启蒙主义文学的另外一种表现。此间席勒和歌德均被邀至魏玛公国，两位大诗人合作了十年，使德国文学发展到前所未有的高峰，而形成了德国文学的“古典时期”。歌德和席勒在狂飙突进运动冷却后，转向精神领域寻求实现理想的途径。他们追求古典艺术的纯朴、宁静、和谐的美，试图用这种美来改造与教育人，达到古希腊人与自然的完美和谐的理想境界。歌德和席勒在这时期的创作，促进了德国民族文学的繁荣，把德国文学提高到了全欧的先进水平，也奠定了德国文学的世界地位。歌德创作的戏剧《伊菲格尼亚在陶里斯》，标志着其思想和创作从狂飙突进运动向古典主义的转变。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>魏玛古典主义与17世纪法国古典主义的比较：魏玛古典主义与法国古典主义艺术形式相同，都追求古希腊古典艺术呈现出的纯朴、宁静与和谐的美，艺术上讲究形式的完整与和谐。但是，两者的目的与性质完全不同，魏玛古典主义者借助古典的美去教育人、改造人，培养人完整和谐的个性，以达到道德完善、改变社会的目的，而17世纪法国古典主义却是遏制感情，服从王权；魏玛古典主义的文学创作表现为感情与理智的和谐，理想与现实的统一，充满了启蒙思想与现实主义精神，实质上是启蒙主义文学的继续和发展，而17世纪法国古典主义文学的创作则表现感情服从理性、个人服从义务的主题，带有维护王权的政治倾向性。<\/p><div class=\"subsec\">（5）席勒<\/div><p>①作家概况：德国古典美学时期的美学家、剧作家和诗人，狂飙突进运动的代表之一，与歌德一起将德国的古典主义推向了高峰，为德国民族文学的发展作出了巨大贡献。席勒著有理论著作《审美教育书简》、《论素朴的诗和感伤的诗》和《悲剧艺术》等，探讨了美育对培养自由理性的人以及改造社会的重要性，对现<\/p><p>实主义与浪漫主义的差异进行了区分与论述。席勒的文学创作以戏剧成就最大，代表作有《强盗》、《阴谋与爱情》、《华伦斯坦三部曲》、《奥尔良的姑娘》和《威廉·退尔》等。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版18世纪文学第10题<\/span>《阴谋与爱情》的思想内容：恩格斯称这部作品为“德国第一部有政治倾向的戏剧”，高度概括了这部戏剧的特征。这是一部具有强烈反封建精神的悲剧。首先，戏剧展现了宰相的儿子裴迪南与平民少女露伊斯的爱情悲剧，揭示了封建贵族与市民阶级间的尖锐矛盾，揭露了封建统治者的暴行，歌颂了市民阶级的反抗精神，宣扬了自由、平等的思想。其次，该剧将爱情悲剧与宫廷政治阴谋联系在一起，大大加强了剧本对于封建统治力量的揭露力度，广泛地反映了德国社会现实，也突出了这部悲剧的社会意义。再次，剧本深刻描写了德国的黑暗现实，显示了席勒强烈的批判精神。剧本描写公爵为了换取送给情妇的首饰，竟然将7000人卖到美国去镇压独立革命；宰相谋杀前任，这些情节均实有其事，席勒将之一一写进剧本之中，以超人的胆量揭露了统治者的罪行。<\/p><p>③<span class=\"srctag\">朱版18世纪文学第10题<\/span>《阴谋与爱情》的人物形象：斐迪南：一个与旧传统决裂的贵族青年。他虽然是宰相之子，但却是贵族阶级的叛逆者，并且认识到所属阶级的罪恶，拒绝继承父亲的财产。他爱上露伊斯，因为他看到了其平民的高尚与纯洁。为了追求平等、自由的爱情，他拒绝了父亲的安排，跨越阶级的鸿沟，抵制父亲的压制，表现出可贵的反叛精神与勇气。但是在追求爱情的过程中，他缺乏冷静的思考和对付丑恶现实的心理准备，相信了谎言，直接导致了悲剧的发生。这一人物形象反映了在新思想的冲击下，封建阶级开始土崩瓦解的社会发展趋势，以及走向新生活的贵族青年难以摆脱旧阶级局限的客观现实。露伊斯：具有反抗精神的市民形象。她是一个纯洁、美丽、善良的姑娘，向往自由平等的爱情，独立自尊，敢于冲破阶级藩篱，大胆追求理想爱情。但是，她不能忍受权贵的侮辱，又缺乏积极主动的反叛精神，一旦现实阻力太大，就选择了退让。这一形象反映了德国进步青年要求自由、平等的思想和愿望，以及市民阶级反抗精神的不彻底性。瓦尔特：腐朽的封建宫廷的产物，反动统治者的代表。他是一个在朝廷权势斗争中玩弄权术的老手，强烈的权力欲，阴险、暴虐构成了其性格的主要特征。为了谋取权力，他谋杀前任，牺牲儿子的幸福，不惜利用各种卑鄙、凶残的手段达到目的。这一形象概括地反映了封建统治者的罪行和现实的严酷。<\/p><p>④<span class=\"keymark\">☆<\/span>《阴谋与爱情》的艺术特色：首先，它取材现实，具有强烈的针对性和斗争性，充满了现实主义精神。剧本人物是以符腾堡公国的一些现实人物作为原型而创作的，揭露现实的黑暗，向专制制度发起毫不妥协的挑战，是该剧创作的目的。其次，人物性格鲜明而复杂。在展示正面人物高尚品德的同时，也描写了他们身上的种种弱点。在塑造反面人物的时候，注意反映不同的反面人物各自<\/p><p>的个性特征。再次，情节集中生动，戏剧冲突尖锐。围绕裴迪南与露伊斯的爱情，产生了一系列的矛盾冲突，剧情曲折多变，具有很强的吸引力。最后，人物语言具有个性化色彩，极富感染力。<\/p><div class=\"subsec\">（6）歌德<\/div><p>①作家概况：德国18世纪后期、19世纪初期的伟大诗人、作家和思想家。其创作把德国文学推向了一个前所未有的高峰，并对欧洲文学的发展产生了积极影响，奠定了他在欧洲文学史上的重要地位。歌德一生成就卓著，在诗歌、戏剧、小说、文艺理论、哲学、历史学、造型艺术，以及自然科学领域都有很大的建树。其代表作有剧本《葛兹·冯·伯利欣根》、书信体小说《少年维特之烦恼》和诗剧《浮士德》等。《浮士德》的创作历时60余年，熔铸了诗人全部生活实践和艺术实践的体验，是其历经毕生探索而得出的思想艺术总结，其它作品则是这部“巨大的自白的许多片断”，它也代表着当时欧洲文学的最高成就，在欧洲文学史上与《荷马史诗》和《神曲》齐名。歌德的美学思想散见于《诗与真》、《箴言与回忆》、《关于艺术的格言和感想》与《歌德谈话录》中，他首次提出了“世界文学”这一概念。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《少年维特之烦恼》及维特形象：德国第一部引起广泛国际反响的文学作品。它取材于歌德自身和朋友的经历，描写了主人公维特和绿蒂的爱情悲剧。维特形象：18世纪德国进步知识青年的代表。他出身于市民家庭，才华出众，思维敏捷，感情丰富细腻；追求自由、平等的思想，痛恨封建等级制度和贵族特权；热爱自然，厌恶冷酷无情的社会。他爱上了善良美丽的绿蒂，但封建门第观念和传统习俗阻隔在两人之间；他投身于事业，但官场等级森严，屡遭排挤。难以排遣爱情和事业烦恼的维特，陷于痛苦中无法自拔，最后以自杀抗议扼杀人性的社会。维特的悲剧具有社会性，反映了当时小资产阶级知识青年找不到社会出路的苦闷情绪。通过维特的悲剧，小说反映了现实生活中的不合理现象，表现了年轻一代人的反抗以及自身的弱点，揭示了造成年轻人悲剧的社会原因，批判了落后的社会制度和势利庸俗的社会风气。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《浮士德》的情节结构：《浮士德》是一部诗体悲剧，它取材于欧洲中世纪的民间传说，描写了象征性人物浮士德博士一生的奋斗经历。作品结构庞大复杂，全剧没有首尾相连的故事情节，而是以浮士德的思想发展为线索，贯穿始终，描述他探求真理的一生。诗剧分为两部，由两场赌赛和五个阶段的悲剧构成。《天上序幕》为全剧的开场，引出全剧的主旨，概括了全剧的内容。两个赌约分别为上帝和魔鬼关于浮士德灵魂探索结局的赌约，以及魔鬼与浮士德就浮士德灵魂归宿的赌约。五个悲剧阶段分别为：学者悲剧阶段、爱情悲剧阶段、政治悲剧阶段、古典美悲剧阶段、改造大自然悲剧阶段。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版18世纪文学第4题，朱版18世纪文学第12题<\/span>《浮士德》中的浮士德形象：浮士德既是带有作者精神自传特征的人物形象，也是资本主义上升<\/p><p>时期资产阶级的典型，还是整个人类的代表。首先，作为资产阶级的典型形象，浮士德既反映了资产阶级积极进取的时代精神，也反映了资产阶级特有的局限性。从歌德自我的精神探索和欧洲知识分子奋斗历程中，歌德提炼出来五个阶段，以探索人生真谛、实现理想、有所作为的进取精神一以贯之，推动浮士德一一经过具有代表性的五个探索阶段，概括了欧洲自宗教改革以来资产阶级知识分子探索人生、追求真理的整个历程。同时，在探索的过程中，浮士德只是满足于个人的探索，对真理的追求也只局限于思想领域，一旦面临现实困境就选择逃避而不是反抗，其最后的理性王国也是建立在掠夺和占有的基础上，客观上反映了资产阶级的局限性和阶级本质。其次，浮士德又是人类的代表，概括了人类积极进取的精神，反映了人性的双重性，他的探索“囊括着人类的全部历史”。虽然浮士德历经挫折，但他积极探索，表现出一种向善的精神。其死后灵魂被上帝带上天国，彰显的是对其一心向善之精神的褒奖。同时，浮士德身上也体现了人性的双重性，存在着善与恶、灵与肉的冲突。一方面，他不满足于既有的生活，另一方面他也时常沉迷于名利、地位和权势之中，虽然最后摆脱了现实诱惑和个人欲求的束缚，但是他抵达理想世界的曲折过程本身就说明了其人性内在冲突的存在。浮士德身上的这种“灵”与“肉”的矛盾，“善”与“恶”的斗争，展示了人类自身的复杂性和真实性，体现了歌德的唯物主义辩证法思想，也反映了人类探求真理的艰巨性以及歌德对人类终将走向至善的坚定信念。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版18世纪文学第4题，朱版18世纪文学第12题<\/span>《浮士德》中的梅菲斯特形象：梅菲斯特是《浮士德》中另一个重要的人物形象，其脱胎于欧洲的历史传说，但已不是传统的反面人物。在诗剧中，这一形象超越了传统的魔鬼原型，而表达了新的意义。首先，梅菲斯特作为浮士德形象的对立面而存在，代表了恶。他是虚无主义、悲观主义、颓废主义的代表，是欲望的化身。梅菲斯特蔑视理性，仇恨人类，自称“恶”是其本质，对社会和人类持悲观、虚无的态度，概括了新兴资产阶级极端利己主义者贪婪、冷酷的精神特征。其次，他是激发浮士德不断进取的动力。正是因为他的引诱，浮士德走出了书斋，走向了更为广阔的社会，踏上了不断探索的人生之路，所以，他客观上推动着浮士德向善的发展。总之，梅菲斯特身上，也同样体现了歌德的唯物辩证主义思想。<\/p><p>⑥<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《浮士德》中浮士德和梅菲斯特形象的关系：两个人物形象在诗剧中是一种辩证的关系。首先，浮士德和梅菲斯特是对立的，浮士德代表善和肯定，梅菲斯特代表恶与否定。其次，浮士德和梅菲斯特又是统一的。正是在梅菲斯特的推动下，浮士德才得以走出书斋，不断探索，走向至善。所以，两者体现了善恶相反相成的关系。此外，两人的精神存在相通之处。在对待宗教神学和封建制度方面，两者都具有强烈的批判精神，而在兼并土地和扩大资本原始积累方面，浮士德的贪婪也不亚于梅菲斯特，所以，两者的思想和性格实际上反映了新兴资产阶级精神特征的两个方面，而这两个方面对于新兴资产阶级来说是不可分割的。<\/p><p>⑦<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版18世纪文学第5题<\/span>《浮士德》的思想内容：首先，通过浮士德的人生经历，总结了资产阶级几百年来的精神发展史，赞美了他们自强不息的进取精神，宣传了启蒙思想，号召摆脱中世纪的愚昧状态，克服人类内在和外在的矛盾，创造资产阶级的理想王国。其次，肯定创造和劳动的价值，要人们“每天每日去开拓生活和自由，然后才能作自由和生活的享受”，从而建立人类的理想家园。再次，饱含深刻的批判精神。通过浮士德的探索，诗剧批判了封建宫廷、教会和经院哲学等整个腐朽的封建制度及其思想精神支柱。同时，对资产阶级的殖民掠夺，残酷的原始积累，以及其自身种种不切实际的空想等，诗剧都予以了毫不留情的揭露。最后，诗剧表达了作者对人生的切身体验以及对人类终将走向至善的坚定信念。<\/p><p>⑧<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版18世纪文学第5题<\/span>《浮士德》的艺术特色：第一，作品将现实主义与浪漫主义巧妙地结合在一起。一方面，《浮士德》以庞大的结构囊括了古往今来各种人物和场面，构成了丰富多彩的画面，深刻揭示了德国黑暗的社会现实；另一方面，作者描写天上地下、现实未来、人类魔鬼，还采用想象、夸张等手法，呈现了一幅幅富有诗意的画面。第二，运用矛盾对比的方法来安排场面、塑造人物，贯穿了辩证法的精神。全诗充满光明与黑暗，崇高与卑劣的对比。浮士德的善和梅菲斯特的恶、天帝的仁慈与魔鬼的邪恶都形成鲜明的对比。第三，采用多种诗歌形式，融抒情与讽刺于一炉。诗剧采用了自由韵体、民歌体、古希腊悲剧的诗体，几乎涵盖了当时欧洲的各种诗体。此外，歌德还能根据内容的要求，灵活运用各种表现形式，集叙事、抒情、议论为一体，语言风格变化多端。第四，戏剧结构也别具一格。作品基本不受舞台演出的局限，始终把人物的思想发展作为结构中心，情节展开自由，突破了时间界限，给人浑然一体的感觉。第五，诗剧运用了大量典故，象征手法突出，表达了丰富的哲理。诗人用象征性的语言将深厚的哲理融入人物、事件之中，实现了形象性和哲理性的统一。<\/p>", "star": 1, "key": 1}]}, {"chapter": "第六章", "title": "19世纪浪漫主义文学", "link": {"quiz": "外国文学史习题_分章刷题.html#d5"}, "mindmap": 1, "kps": [{"no": 1, "title": "浪漫主义文学概况", "html": "<p>（1）<span class=\"srctag\">郑版19世纪浪漫主义文学第1题，朱版19世纪初期文学第1题<\/span>社会背景（产生的原因）：①英国工业革命和法国大革命催生的社会思潮的产物。一方面，工业革命使人们自我意识和个性解放思想增强，这些为浪漫主义的产生提供了条件；另一方面，法国大革命激发了各国民主革命和民族解放运动，催生了浪漫主义这一文学上的自由主义。②德国古典主义和英法空想社会主义为其提供了思想理论基础。德国康德、谢林和黑格尔等哲学家肯定人的主体精神和能力，为浪漫主义的主观性提供了理论支撑。圣西门、傅立叶等人的空想社会主义，则为人们提供了一种理想的大同世界模式，激发了人们富于想象和幻想的特点。③文学自身发展的结果。18世纪英国感伤主义文学、哥特式小说、德国狂飙突进运动，以及法国卢梭对“返归自然”的提倡与实践，都为浪漫主义文学思潮的出现提供了条件。而旧有的古典主义原则与创作方法已经变得毫无生气，严重束缚了作家的创作，直接导致作为反拨力量的浪漫主义文学之出现。<\/p><p>（2）<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪浪漫主义文学第1题，朱版19世纪初期文学第2题<\/span><b>基本特征<\/b>：思想特点：①强调创作的绝对自由，反对古典主义“三一律”等清规戒律，要求突破文学描绘现实的范围，宣扬个性解放和创作自由。②具有民主主义精神，同情下层民众的苦难，以人道主义思想为武器，或从资产阶级的角度抨击封建制度，或站在留恋旧制度的立场，抨击资本主义的罪恶。③重视民间文学，追求异国情调，具有怀旧倾向。浪漫主义作家喜欢挖掘中世纪民间文学的成果，借鉴中世纪文学重情感和想象的特点。同时，他们还喜欢异国生活，沉浸于异国他乡的神奇风光中。④偏重于描写自然风光，寄情山水，着力歌颂大自然，标举卢梭“返归自然”的主张。浪漫主义作家厌恶资本主义文明和现实，借大自然来反衬现实的丑恶。艺术特点：①强调个人感情的自由抒发，具有强烈的主观性。浪漫主义注重主观与自我的表现，善于展示人物的内在情感，抒情色彩浓厚。②浪漫主义文学对各种艺术形式进行了卓有成效的探索，尤其重视对民间文学的挖掘，以及诗歌体长篇小说的创作。③浪漫主义文学喜欢运用对比、夸张和想象，描写超凡、孤独、怪异的形象，重视丑的美学价值，大力提倡想象，追求强烈的艺术效果。④偏好忧郁感伤的情调，着重探索忧郁、感伤和痛苦的精神境界，表现出贵族怀旧式和资产阶级不满现实的忧郁，如勒内所代表的“世纪病”式的忧郁。<\/p><p><b>（3）消极浪漫主义与积极浪漫主义<\/b>：文学史上常常将浪漫主义区分为消极浪漫主义和积极浪漫主义。实际上，这一区分对应的是浪漫主义作家在思想倾向上的差异，以及浪漫主义文学在情感趋向上的不同。浪漫主义作家在思想倾向上分为贵族倾向和资产阶级倾向两种，浪漫主义所包含的情感倾向也存在着积极和消极之分。一般用“积极浪漫主义”指称具有民主主义思想倾向的作家，如<\/p><p>拜伦、雪莱、普希金、雨果和惠特曼等人，以及表现了积极乐观向上情绪的作品，如拜伦的诗作、雨果的小说等。而“消极浪漫主义”指称依附王权、思想妥协的浪漫主义作家，如英国的华兹华斯、法国的夏多布里昂与缪塞和俄国的茹科夫斯基等人，指称的作品具有颓废、灰暗的情感基调，如缪塞的《一个世纪儿的忏悔》和夏多布里昂的《勒内》。<\/p>", "star": 1, "key": 1}, {"no": 2, "title": "英国浪漫主义文学", "html": "<p><b>（1）<span class=\"srctag\">朱版19世纪初期文学第3题<\/span>英国浪漫主义文学概况<\/b>：英国浪漫主义文学大致分为两个阶段。第一阶段为18世纪90年代到19世纪第一个十年，这一时期是浪漫主义的初期，主要以“湖畔派”诗人为代表。第二阶段从19世纪20年代到30年代，这是浪漫主义的繁盛时期，出现了以拜伦、雪莱为代表的第二代浪漫主义诗人。<\/p><div class=\"subsec\">（2）华兹华斯<\/div><p>①诗人概况：华兹华斯是英国浪漫主义文学的先驱，“湖畔派”诗人的代表，一位桂冠诗人，其代表诗作为《丁登寺赋》、《孤独的收割者》和《我们共七个》等。<\/p><p>②创作特点：首先，在题材上，他善于描写大自然，赋予大自然以一种提升人之精神境界与道德修养的力量。同时，他也喜欢描写同大自然息息相关的平凡人，抒写他们的悲欢哀伤。其次，在艺术上，其诗歌语言极度纯粹，思想精致深刻，感情真挚朴实，想象力丰富。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span>《抒情歌谣集·序言》的理论主张：第一，关于诗歌题材，主张从宫廷转向民间，从城市转向乡村湖畔，写普通人民的日常生活。第二，关于诗歌语言，主张采用人民大众的语言，做到通俗易懂，节奏上应与口语音调一致。第三，关于诗的本质，提出“诗是强烈感情的自然流露”，强调诗人的真情实感。<\/p><p><b>（3）柯勒律治：<\/b>“湖畔派”的重要诗人。他强调形象思维，推崇想象。其作品充满神秘浪漫色彩，善于把玄妙迷离、古怪离奇的轶事写得逼肖现实生活，代表作品有《古舟子咏》和《忽必烈汗》等。<\/p><p><b>（4）骚塞：<\/b>“湖畔派”诗人。他早年是激进的革命派，后来转而维护王权，被封为桂冠诗人。他的抒情诗充满离奇怪异的形象，美化封建制度，宣扬神秘主义，代表作为《审判的幻影》和《书斋咏怀》等。<\/p><div class=\"subsec\">（5）拜伦<\/div><p>①诗人概况：英国19世纪最杰出的浪漫主义诗人，被歌德誉为“19世纪最伟大的天才”。其代表作品有长诗《恰尔德·哈洛尔德游记》和《唐璜》、组诗《东方叙事诗》和《普罗米修斯》、诗剧《曼弗雷德》和《该隐》等。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪初期文学第4题<\/span>《恰尔德·哈洛尔德游记》的思想内容：《恰尔德·哈洛尔德游记》以哈洛尔德的游历为线索，融合描写、议论和抒情为一体，记述了哈洛尔德的异国见闻和思想感情，反映了19世纪初英国和一些南欧国家的社会生活，歌颂了南欧各国人民反抗民族压迫、争取自由解放的斗<\/p><p>争。诗歌共四章。第一章主要再现了哈洛尔德在西班牙、葡萄牙的游历，详细描写了西班牙人民反抗拿破仑的斗争，反映了被压迫民族的苦难以及对自由的渴望。第二章主要描写主人公在希腊的游历，反映了入侵者土耳其总督的残暴，呼吁希腊人民起来反抗压迫。第三章描写主人公在比利时和瑞士的游历，以及主人公在一些著名历史遗址的追忆与凭吊，在呼吁反抗专制与暴政的同时，也表现了诗人对拿破仑失败后封建王权复辟的欧洲局势的担忧。第四章描写主人公在意大利的游历，对遭受奥地利压迫的意大利人民表示同情，号召意大利人民以光荣的先辈为楷模，起来推翻入侵者的压制。诗歌最后以歌颂象征自由的大海作为结束，表现了诗人对自由和人民力量的坚定信念。总之，通过对哈洛尔德游历生活的叙述和抒情主人公有感而发的议论与抒情，长诗热情歌颂了南欧各国人民反抗异族压迫的斗争，表达了自由必胜、人民终将获得解放的民主主义思想。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版19世纪初期文学第4题<\/span>《恰尔德·哈洛尔德游记》的艺术特色：第一，浓郁的主观抒情性和强烈的现实针对性相融合，叙事和议论、抒情相结合。全诗充满了奔放的感情和丰富的想象，弥漫着浓郁的抒情色彩，但也直接描写了当时英国和南欧一些国家遭受压迫的社会现实，反映了诗人的政治理想。作者以哈洛尔德的游历为线索来建构诗歌，但是常常在叙述中插入大量的议论和抒情篇章，袒露诗人的感想和情绪。第二，情节结构自由。作品不侧重叙述完整的故事，而是以主人公的游历为主线，穿插了大量感世抒怀的篇章，内容和形式较为自由散漫。第三，出色的风景描写。作者善于描绘异国奇特的自然风光，很多自然景观和历史遗址的描写都让人产生如临其境之感。第四，善于运用对比手法。诗歌中，美与丑、光荣的历史与黑暗的现实、被压迫民族的苦难与入侵者的残暴等形成多方面的强烈对比。第五，语言生动流畅，多用华丽的词句，融叙事、抒情、议论和描写为一体，具有很强的艺术表现力。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪浪漫主义文学第4题<\/span>拜伦式英雄：拜伦《东方叙事诗》中出现的具有相似精神特征的一系列人物形象，这些形象带有拜伦本人的一些思想和性格特征，故被文学史称为“拜伦式英雄”。他们大多性格高傲而倔强，同社会尖锐对立，愤世嫉俗，毫不妥协，具有强烈的反叛精神，但孤军奋战；他们向往自由和民主，但又看不清前途，常常表现出悲观失望和忧郁苦闷的情绪。“拜伦式英雄”在精神上具有反叛性、孤独性和浪漫性的特征，体现了19世纪上半叶不满现实又找不到出路的青年的共性，表达了一代人对于暴政的彻底否定和强烈反抗，但同时也流露出个人主义思想和悲观情绪，具有一定的消极意义。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪初期文学第5题<\/span>《唐璜》的思想内容：《唐璜》是一部未完成的长篇诗体小说，但是其深厚的思想内容和无与伦比的风格使之成为拜伦的代表作。诗歌突出地表现了拜伦的民主主义思想。首先，通过唐璜在欧洲和北非的冒险经历，诗歌高度概括地反映了18世纪末到19世纪初欧洲广阔的社会现实以及这一时代的特征，将讽刺矛头直指“神圣同盟”和欧洲的封建反动<\/p><p>势力，表现了诗人的民主和自由思想。其次，诗歌揭示了欧洲上流社会婚姻制度和社会道德的虚伪。作者还以英国社会为蓝本，突出讽刺了贵族上流社会和拜金主义风尚，揭露了英国贵族的庸俗虚伪，以及资产阶级在其它地区进行的经济掠夺。再次，表达了诗人对正义事业的热爱，对遭受奴役的人民的同情，以及对反抗斗争的期盼与召唤。总之，长篇诗体小说广泛反映了18世纪末到19世纪初欧洲的社会生活，表达了诗人追求民主自由的政治理想和战斗情怀，也代表了当时人民反抗专制暴政和资本主义金钱社会的强烈愿望。<\/p><p>⑥<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪浪漫主义文学第5题<\/span>《唐璜》揭露和讽刺的具体内容：首先，讽刺了当时欧洲普遍存在的社会现象，即封建专制制度的暴虐和社会道德的虚伪。其次，讽刺了英国社会的各个方面。从制度到风气，从物质到精神，尤其对上流社会金玉其外败絮其中的本质，诗篇都进行了痛快淋漓地讽刺。<\/p><p>⑦<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪浪漫主义文学第5题<\/span>唐璜形象：拜伦诗体长篇小说《唐璜》中的主人公，他本是西班牙传说中的中世纪人物，多次出现在文学作品中，多为一个纨绔子弟。但是在拜伦的诗作中，这一形象得到了全新的再创造。拜伦不仅将这一形象活动的时间放在18世纪末的欧洲各国，而且还对他的性格进行了崭新地塑造。首先，唐璜作为一个普通的贵族青年出现在诗歌中。他是一个英俊、胆大的年轻人，顺从天性，无视清规戒律，真心对待感情，敢于面对危险和挑战。但是，他也缺乏坚定的信念，容易随波逐流，随遇而安。唐璜身上的二重性体现了拜伦对现实世界生活多样性和道德复杂性的关注与思考。其次，在拜伦诗歌出现的人物形象中，唐璜也具有独特性。他身上没有惯常的“拜伦式英雄”的特征，既不是像哈洛尔德那样忧郁孤独，也不像曼弗雷德那样愤世嫉俗。但是，作为一个普通的贵族青年，唐璜身上体现出了鲜明的时代特征。<\/p><p>⑧<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版19世纪浪漫主义文学第5题，朱版19世纪初期文学第5题<\/span>《唐璜》的艺术特点：首先，浪漫主义色彩和现实主义因素的融合。诗中充满了丰富的想象，情节离奇，充满异国情调。但诗中许多描写都揭示了欧洲的社会现实，很多议论也是针对欧洲的重大政治事件而发，具有强烈的现实批判精神。第二，表现手法多样，风格情调多彩。诗歌夹叙夹议，将叙事和抒情融为一体。诗篇中穿插了大量的议论和抒情，既有针砭时弊的揭露与讽刺，又有哲理的沉思和诙谐的欢笑，文风变化多端。第三，独特的讽刺艺术。诗人以一种嘲讽的姿态，对社会现状、政治制度、道德风尚、生活习惯以及英国社会都给予了最深刻的批判。第四，在语言格律方面，诗中采用口语体，化繁为简，明白晓畅，笔调富于变化，具有音乐感。诗篇创造性地借鉴了意大利滑稽史诗的“8行三韵体”，洋洋洒洒16000多行，帮助拜伦赢得了“潇洒风格的大师”之称号。<\/p><div class=\"subsec\">（6）雪莱<\/div><p>①诗人概况：英国著名的浪漫主义诗人，是第一个表现了空想社会主义理想<\/p><p>的诗人，被恩格斯称为“天才的预言家”。雪莱主要创作有长诗《麦布女王》和《伊斯兰的起义》、抒情诗《西风颂》和《致云雀》，诗剧《解放了的普罗米修斯》和《钦契》等。<\/p><p>②<span class=\"keymark\">☆<\/span>《西风颂》的思想内容和艺术特点：思想内容：诗人以豪迈奔放的激情赞扬了自然界摧枯拉朽的西风，借横扫残枝败叶又播撒种子、催生新生命的西风形象，赞美了除旧布新的革命风暴，寄托了诗人献身革命的强烈愿望。艺术特点：第一，充满反抗精神与理想主义色彩。西风象征革命的力量，预示了美好的未来，寄予了诗人的崇高理想。第二，富于象征性和哲理性。西风既是破坏者，也是保护者，象征着大自然更新的力量，也象征着社会革命的力量。同时，西风这一意象还揭示了新事物终将取代旧事物的客观规律，表达了深刻的哲理。第三，抒情气氛浓烈。诗歌采用第一人称，运用呼语、告白式的语言，歌唱大自然、爱情和理想，表达了对自由、光明和美的热烈追求。第四，艺术手法多样，形式独特。诗歌运用象征、比喻、拟人和夸张等手法，形式和谐对称，音韵整齐而富于变化。<\/p><p>③<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">朱版19世纪初期文学第6题<\/span>《解放了的普罗米修斯》的思想内容：诗剧取材于古希腊神话和埃斯库罗斯的悲剧《普罗米修斯》三部曲。通过诗人的再创造，普罗米修斯形象获得了崭新的寓意，表达了新时代的进步思想。首先，反映了现实斗争。诗歌虽然采用古希腊题材，但植根于19世纪初的英国社会现实，通过普罗米修斯反抗宙斯独裁专制的斗争，真实地揭露了英国专制统治给人民带来的灾难与罪恶。其次，塑造了普罗米修斯的高大形象。诗剧一反埃斯库罗斯悲剧中普罗米修斯最后妥协的结局，将普罗米修斯的反叛精神进行到底，寄托了自己的革命情怀和崇高理想，歌颂了人民群众反抗专制统治的革命精神和英雄气概。最后，展现了一个美好的大同世界。诗剧最后描写反抗者推翻了残酷的暴君，解放了所有的被压迫者，迎来了一个人人平等、幸福快乐的美好世界，从而也肯定了暴力革命的合理性与必然性，表达了诗人建立自由平等的美好社会之理想，以及对美好前途的乐观精神。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版19世纪初期文学第6题<\/span>《解放了的普罗米修斯》的艺术特点：首先，诗剧气魄宏大，想象丰富。诗歌立足现实又不拘泥于现实，将人类追求光明的斗争通过神话题材揭示出来，并放在全宇宙的背景下展开，景色壮丽雄伟，情节富有幻想色彩，形象生动离奇。第二，全剧用诗歌形式写成，而且常常直抒胸臆，风格热情洋溢，具有强烈的抒情性，体现了浪漫主义的典型特征。第三，具有浓郁的象征性和深刻的哲理性。诗剧运用的神话故事本身就具有象征色彩，概括了人类善与恶、专制与反抗的斗争。作为人类哲学日历上最早的殉道者，普罗米修斯这一神话人物身上具有的象征性和哲理性在该诗中得到了突出，他不仅作为人类反抗黑暗统治的代表和善的化身，而且还被赋予了新的时代特征，即<\/p><p>坚定的政治信念和毫不妥协的斗争精神。诗剧中其他人物也具有象征性，如宙斯象征着“恶”与“暴君”，推翻宙斯的冥王象征着“正义”等。<\/p><p><b>（7）<span class=\"keymark\">☆<\/span>拜伦与雪莱诗歌创作比较<\/b>：相同点：首先，在思想上，两者有着很多相似性。他们都通过诗歌来揭露社会现实的黑暗和反动统治的腐朽专制，赞扬法国大革命，同情工人运动和被压迫的人民，歌颂民主、自由和平等的理想。其次，在艺术上，他们都是积极的浪漫主义作家，善于描绘气势磅礴的景象，诗作带有浓厚的异国情调，表现出鲜明的浪漫主义特点。不同点：第一，在思想上，雪莱受空想社会主义思想的影响，对未来充满坚定信念，思想乐观。拜伦更多受到民主主义和自由主义思想的影响，对压制自由、民主的现实更为关注，精神上表现得更为苦闷、悲观。第二，在诗歌风格上，雪莱的诗歌充满对未来的希望，具有乐观主义精神，而拜伦表现对社会的不满，带有悲观的情绪。第三，在人物形象上，拜伦塑造了“拜伦式的英雄”，作为孤独的反抗者，他们最后都以失败而告终。雪莱笔下的人物多表现得积极向上，乐观自信，如普罗米修斯体现了革命家不畏强权的英雄气概。第四，在表现手法上，拜伦将浪漫的激情与现实的讽刺相结合，将叙事、议论和抒情融为一炉，其诗歌富于哲理性。雪莱则更加注重想象和抒情，诗歌中充满理想主义色彩，显得热情崇高，具有民主主义革命家的战斗激情。<\/p><p><b>（8）济慈<\/b>：英国杰出的浪漫主义诗人，具有进步的思想倾向。他热爱古希腊文化，厌恶资本主义的丑恶现实，追求美的境界，对唯美主义产生了影响。他的创作期只有5年，却写出了很多传世之作，如《夜莺颂》、《秋颂》和《希腊古瓮颂》等。<\/p><p><b>（9）司各特：<\/b>欧洲历史小说的创始人，创作有诗歌、小说、历史著作和传记。他的最大贡献在于其历史小说。其历史小说把浪漫主义与现实主义相结合，将个体命运交织在社会变迁中予以表现，为小说的进一步发展奠定了基础。司各特共写作了27部历史小说，代表作品有《艾凡赫》等。<\/p>", "star": 1, "key": 1}, {"no": 3, "title": "德国浪漫主义文学", "html": "<p><b>（1）德国浪漫主义文学概况<\/b>：德国是浪漫主义文学思潮的发源地，德国浪漫主义文学早在18世纪末就已经开始。文学耽于幻想、推崇精神的传统，政治经济的落后，以及德国古典唯心主义哲学的发达，都为浪漫主义在德国首先兴起产生了决定性作用，也使得德国浪漫主义具有了唯心主义倾向和宗教色彩。德国浪漫派反映了德国资产阶级在政治和文艺上要求获得自由解放的愿望。此外，德国浪漫派重视民间文学，在民间故事和歌谣的收集方面作出了杰出的贡献。<\/p><p><b>（2）耶拿派<\/b>：1798年，奥·施莱格尔和弗·施莱格尔兄弟俩在耶拿城创办文艺杂志《雅典娜神殿》，第一次提出“浪漫主义”这一名称，并阐述浪漫主义文学主张与纲领。以这个杂志为中心，聚集了一些作家诗人，形成了“浪漫主义文学美学小组”，史称早期浪漫派或耶拿派。其主要成员除了施莱格尔兄弟外，还有诗人诺瓦利斯、作家蒂克、哲学家谢林与费希特等。耶拿派在思想上表现出向往中<\/p><p>世纪以及美化基督教的特征，其创作具有较为浓厚的宗教神秘主义色彩，但是在纯洁民族语言、推动民族文学发展方面起到了积极作用。施莱格尔兄弟是其理论阐述者，诺瓦利斯和蒂克是其创作代表，《夜的颂歌》为诺瓦利斯的代表诗作，蒂克著有三卷本《民间童话集》。<\/p><p><b>（3）海德尔堡派（海德堡派）<\/b>:1805年，一批年轻的、志同道合的德国作家在海德尔堡创办刊物《隐士报》，并发表理论主张和文学作品，由此形成一个新的文学团体，史称“海德尔堡派”。他们重视民间文学，收集大量民歌和民间故事，在文学影响和创作实绩方面都超越了早期浪漫派，但是思想和风格方面仍然表现出与早期浪漫派的承接关系。阿尔尼姆和布仑塔诺收集编写的民歌集《男孩的神奇号角》和格林兄弟整理的民间故事《儿童与家庭童话集》都是其杰出的作品。<\/p><p><b>（4）霍夫曼<\/b>：德国最有影响的浪漫主义作家，他的作品具有奇异和荒诞的色彩，《金罐》、《熊猫穆尔的人生观》和《小查克斯》（《侏儒查克斯》）为其代表作，其创作开启了20世纪现代主义文学的先河。<\/p>", "star": 0, "key": 0}, {"no": 4, "title": "法国浪漫主义文学", "html": "<p>（1）<span class=\"srctag\">朱版19世纪初期文学第3题<\/span>法国浪漫主义文学概况<b>：<\/b>法国浪漫主义文学的出现要晚于德国和英国，但是成就突出，在文艺理论、诗歌、小说、戏剧等各个领域都取得了突破，并成为19世纪上半叶法国文学的主流。此外，由于法国19世纪社会政治斗争异常激烈，影响到文学，使得浪漫主义文学具有较为鲜明激进的政治色彩。<\/p><p><b>（2）早期浪漫主义文学的代表<\/b>：夏多布里昂：法国早期浪漫主义的代表，思想保守，维护复辟的波旁王朝，其创作带有浓厚的贵族文学倾向，代表作有中篇小说《阿达拉》、《勒内》和《墓外回忆录》。《勒内》塑造了一个患有“世纪病”的典型人物形象。斯塔尔夫人：具有民主倾向的早期浪漫主义评论家和作家。其理论著作《论德国》和《论文学》介绍了德国的浪漫主义，批判了古典主义，提出了文学与时代和环境的密切关系。<\/p><div class=\"subsec\">（3）雨果<\/div><p>①<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版19世纪初期文学第8题<\/span>作家概况：雨果是法国浪漫主义文学运动的领袖，著名的社会活动家和人道主义者，在诗歌、戏剧、小说、文艺理论和政论等各个方面都有惊人的建树。他的诗作不但数量丰富，而且主题多样，形式完美，表现手法细致多彩；他的小说精彩动人，雄浑有力，以五光十色、气势宏伟的画面见长，为浪漫主义小说开辟了广阔的天地。其创作将法国浪漫主义文学推向了一个新的高峰，对后来的作家产生了重要影响。在当时法国文坛激烈的斗争中，他为进步文学的发展作出了重要贡献。1827年，他发表的《＜克伦威尔＞序言》，成为浪漫主义运动的宣言，具有划时代意义。1830年，雨果的浪漫主义戏剧《欧那尼》上演，在观众中引发了古典主义戏剧和浪漫主义戏剧追随者之间的<\/p><p>斗争，即著名的“长发对秃头”的战斗，最后浪漫主义文学支持者获得了胜利，结束了古典主义戏剧在法国剧坛的统治地位。就其长达60年的文学创作生涯而言，他总能够不断推陈出新，发展变化。1831年雨果发表的长篇小说《巴黎圣母院》，代表了浪漫主义文学的创作和艺术特征，是浪漫主义小说的代表作。1851年，雨果开始被迫流亡国外，时间长达19年，其间创作的作品现实主义色彩增强，代表作有长篇小说《悲惨世界》、《海上劳工》和《笑面人》，反映了其创作不断发展，思想不断深化的过程。<\/p><p>②<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版19世纪浪漫主义文学第8题<\/span>雨果诗歌创作的特点：雨果的诗歌创作贯穿他的一生，他集抒情诗人、讽刺诗人和史诗诗人于一身，取得了超越前人的成就。在思想内容方面，雨果的诗歌反映了他的人道主义和民主主义思想。他的讽刺诗和史诗，批判了倒行逆施的法国统治者，表达了对人类不断走向进步的信心。他的抒情诗并没有停留在抒发个人情感上面，而是表达了其宽广的胸怀和博大的人道主义思想，既有对劳动和劳动者的尊重，也有对大自然魅力的感知，还有对人类苦难的同情和对自由的召唤。在艺术上，雨果的诗歌具有独特性，代表了法国诗歌在浪漫主义时期的发展方向。第一，雨果开拓了诗歌的领域，扩大了诗歌的表现功能。第二，诗歌风格豪迈奔放，想象雄奇壮伟。第三，运用对照原则创作诗歌，揭示主题。其诗歌意象、内容和语言对比强烈，效果突出。第四，大量运用同位语隐喻，化抽象为具体，表达更为深邃的内涵。第五，善于创造性地运用各种诗体和诗歌形式，表现出高超的诗歌艺术才能。<\/p><p>③<span class=\"keymark\">☆<\/span>《巴黎圣母院》的主题与爱丝梅哈达形象：《巴黎圣母院》描写了吉普赛舞女爱丝梅哈达的爱情和不幸命运，反映了作者对封建专制、中世纪邪恶宗教势力以及封建贵族的憎恨，揭示了在禁欲主义的压抑下人性的扭曲和堕落的过程，赞美了高尚纯洁的品质，宣扬了善良、仁慈的精神力量，表达了对受压迫的下层人民的同情，体现了作家的民主精神和人道主义思想。爱丝梅哈达是真、善、美的化身，她美丽善良，无论是内心还是外表都表现出淳朴的美。作家对这一理想形象的塑造是通过一系列对照完成的。首先，她的善良跟克洛罗的邪恶形成对照，表达了作家对宗教势力的憎恨，以及对不幸者的深切同情。其次，她的美丽与加西莫多的丑陋形成巨大反差，反衬了两人内心的一致，表达了作家对仁爱的歌颂。再次，她对待爱情的真诚态度跟浪荡子弗比斯的欺骗形成对照，突出了她内心的纯洁美好，谴责了轻浮、自私的不道德行为。<\/p><p>④<span class=\"keymark\">☆<\/span><span class=\"starmark\">★<\/span><span class=\"srctag\">郑版19世纪浪漫主义文学第9题，朱版19世纪初期文学第9题<\/span>《悲惨世界》的思想内容：首先，小说以史诗性的宏大规模，全面展示了法国大革命时期和拿破仑时期的社会面貌，反映了“贫穷使男子潦倒，饥饿使妇女堕落，黑暗使儿童赢弱”的社会现实。其次，通过瓦尔让、芳汀和珂赛特的不幸遭遇，揭露了资本主义社会的尖锐矛盾和贫富悬殊，批判了当时的政治、经济、道德等各个<\/p><p>方面的黑暗，鞭挞了虚伪的资产阶级和不公平的法律制度。再次，通过福来主教和转变后的瓦尔让形象，宣扬了仁爱的精神力量，同时小说也正面描写了革命起义，反映了作家对实现共和的期望，体现了作家一贯的人道主义思想和逐渐增强的民主主义战斗精神。总之，他关注底层贫穷人民的悲惨处境和不幸命运，探索从经济方式上来消除贫困与失业，否定现实世界里的严苛法律，宣扬以超阶级的仁慈、博爱来改造社会和人生的人道主义思想。但是，作品中表现的人道主义思想也有其局限性。雨果借人道主义的仁慈来感化统治阶级的冷酷，这显然是不可能实现的主观幻想。<\/p><p>⑤<span class=\"keymark\">☆<\/span><span class=\"srctag\">朱版19世纪初期文学第9题<\/span>《悲惨世界》的人物形象：瓦尔让是普通下层成年男性的代表，他的不幸概括了“贫穷使男子潦倒”的社会现象，而他最后在福来主教仁爱精神感召下的转变以及其后的行为，典型地反映了雨果的人道主义思想。瓦尔让本是一个善良淳朴的工人，为了抚养外甥，在失业的情况下打破橱窗偷面包，被判处五年苦役，因为惦记家人一再越狱，结果累计判处19年监禁。从出身、经历、品德和习性各方面来说，瓦尔让都是一个劳动者，体现出劳动人民的各种优秀品质。但是，不公平的社会和严苛的法律促使他走上犯罪的道路，可以说，他是被压迫、被损害、被侮辱的劳苦人民的代表。在福来主教仁爱精神的感召下，瓦尔让变成了一个具有博爱精神的人，他忏悔自信，帮助他人，开办了带有空想社会主义色彩的工厂，养育孤女珂赛特，为救无辜的商马第而自首，并且感化了沙威，其行为使其成为了仁爱的典范。芳汀是浪漫主义文学中伟大母亲的典型，也是19世纪法国文学中被侮辱、受压迫妇女的代表。她是一个贫苦和诚实的姑娘，被引诱后沦落到社会底层，因为未婚生育而被解雇，为养活自己的女儿不得不卖掉头发和门牙，最后沦为出卖肉体的妓女。芳汀的不幸是社会造成的，她是这个黑暗社会中下层女性的真实写照。沙威是统治阶级的忠实奴才和冷酷残忍的爪牙，代表了法律的不公和严苛。他忠于职守，维护法律所捍卫的社会秩序和权力阶级的利益，仇视反叛和下层人民，丧失了人性和自我。在瓦尔让仁爱精神的感化下，他陷入复苏的人性与冷漠的法律之间的冲突中，最后跳河自杀。通过这一人物形象的塑造，作家批判了法律的严苛与不公，宣扬了人道主义思想。<\/p><p>⑥<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版19世纪浪漫主义文学第9题，朱版19世纪初期文学第9题<\/span>《悲惨世界》的艺术特色：第一，现实主义和浪漫主义的结合。小说展现了法国社会的广阔现实。小说以滑铁卢战役揭开序幕，以复辟时期和七月王朝初期为主要的时代背景，描绘了战场、贫民窟、修道院、法院、监狱、工厂、巴黎拉丁区、街垒战等，构成了一幅壮阔的社会历史画卷。但是，作家并不是照相似的描摹，而是以史诗般的雄浑笔墨、浓厚的抒情气氛来再现时代风貌，表现出浪漫与现实交融的特征。活动其中的人物经历极为奇特，并且具有超凡的精神力量和高尚的品<\/p><p>格。小说还描写了很多奇异的景色以及恐怖的场景，这些都增加了作品的浪漫主义色彩。第二，细致精彩的心理描写。小说力图向读者展示人物心灵“最隐秘的皱纹”，揭示人物的内心矛盾和思想斗争，以此来展现人物的性格特征。第三，广泛运用对照艺术。小说将不同类型的人物性格以及社会环境进行对照，反映出社会的黑暗。例如理想善良的人物福来主教、瓦尔让、芳汀与丑恶、卑鄙的人物沙威、泰纳迪埃形成鲜明的对比，突出人物之间迥异的性格特征。第四，具有政论色彩。雨果面对资本主义社会的严酷现实，常常在小说中站出来发表议论，以充分表达民主主义和人道主义思想。第五，语言极富特色。其语言高昂激烈、热情洋溢，经常运用多义词，富有隐喻性。<\/p><p>⑦<span class=\"keymark\">☆<\/span><span class=\"srctag\">郑版19世纪浪漫主义文学第8题<\/span>雨果小说创作的特点：雨果的小说创作受到作家人道主义思想的影响，在主题上的特征为：反封建反专制，歌颂劳动和宽恕仁爱，表达了对社会罪恶的痛恨，以及对不幸者的深切同情。在艺术上，雨果小说创作的风格也非常鲜明。第一，善于运用对照手法构思小说，安排故事，塑造人物。在善与恶、美与丑的对照中，作家揭示了希望表达的人道主义思想。第二，善于塑造下层人物，并常常将其刻画成理想品格的化身，赋之以超凡的精神力量。在人物描写中，注重细腻刻画人物的内心世界，并将其与人物性格的揭示结合起来。第三，情节的传奇性。雨果小说的情节发展起伏跌宕，充满巧合，表现出作家高超独特的想象能力。第四，善于将无生命的事物描写得有声有色，富有生命力，呼应了作品中理想人物超凡的精神力量，也增加了作品的浪漫气息。第五，以史诗的气魄和规模再现社会和历史，赋予作品以浓厚的史诗色彩，扩展了浪漫主义小说的表现力。第六，语言充满激情，善用长句和多义词，叙述中穿插大量政论性质的议论，具有崇高的史诗风格。<\/p><p><b>（4）法国后期浪漫主义的其他诗人与作家：<\/b>乔治·桑：具有民主主义思想倾向的浪漫主义女作家。她的创作经历了从妇女问题小说到社会问题小说，再发展到田园小说的过程，代表作有《康素爱萝》、《安吉保的磨工》和《魔沼》等。缪塞：浪漫主义作家，其创作形式包括诗歌、戏剧和小说。《一个世纪儿的忏悔》是一部具有自传色彩的长篇小说，塑造了一个“世纪病”患者的形象。大仲马：法国戏剧家、小说家。大仲马的主要文学成就是通俗历史小说，对后世的通俗小说产生了重要影响，代表作有《三个火枪手》和《基督山伯爵》。<\/p>", "star": 1, "key": 1}, {"no": 5, "title": "俄国浪漫主义文学", "html": "<p>（1）<span class=\"srctag\">朱版19世纪初期文学第3题<\/span>俄国浪漫主义文学概况：俄国浪漫主义文学是在英法等国浪漫主义文学影响下，随着1812年卫国战争掀起的爱国热潮而迅速发展起来的。它以诗歌为主，富有鲜明的战斗精神，充满了对自由、民主的强烈渴望，为俄国民族文学在19世纪中后期的繁荣打下了牢固基础。<\/p><p><b>（2）茹科夫斯基<\/b>：俄国早期浪漫主义文学的代表人物，被认为是俄国第一位抒<\/p><p>情诗人，也是浪漫主义诗歌的奠基人。茹科夫斯基翻译了英国感伤主义诗人格雷的《墓园挽歌》而成名，其创作也受到了格雷的一定影响，呈现出沉思、忧伤、神秘的特征。他的主要诗作有《俄国军营的歌手》、《柳德米拉》和《十二个睡着的姑娘》。<\/p><p><b>（3）十二月党诗人<\/b>：1825年12月14日，俄国进步的贵族青年军官举行起义，试图推翻沙皇专制制度，史称“十二月党人起义”。这些革命者的政治活动跟文学活动密切相关，他们将文学作为宣传政治思想的武器，创办刊物，组织文学协会，撰写评论，创作传播民主自由思想的诗歌，被称为“十二月党诗人”。在文学观念上，他们反对古典主义以及感伤主义，主张文学表现诗人的主观世界，即爱国主义的革命情感，并且重视民族文学，追求文学的人民性、民族性与浪漫精神的结合。他们的创作充满对专制政体和农奴制的憎恨，表达了对人民的热爱，传播了民主主义思想，对19世纪俄国文学产生了重要影响。代表诗人有雷列耶夫、拉耶夫斯基和丘赫尔别凯等。<\/p><p><b>（4）其他浪漫主义诗人和作家<\/b>：普希金：俄国浪漫主义文学的领袖，后期转向现实主义文学，成为俄国现实主义文学的奠基人。莱蒙托夫：继普希金之后俄国19世纪上半叶杰出的诗人，俄国浪漫主义文学的代表。抒情诗《帆》、《诗人之死》和叙事诗《恶魔》、《童僧》为其诗歌代表作，长篇小说《当代英雄》塑造了“多余人”形象毕巧林。<\/p>", "star": 0, "key": 0}, {"no": 6, "title": "美国浪漫主义文学", "html": "<p><b>（1）美国浪漫主义文学概况<\/b>：美国浪漫主义文学深受西欧浪漫主义文学的影响，但民族意识的高涨、创造民族文化的迫切需要，推动了其浪漫主义文学民族特征的形成，即争取和歌颂个性自由和精神解放。同时，美国浪漫主义文学蔚然成风，也使其成为新大陆第一次大规模的文学运动，标志着美国民族文学的诞生。<\/p><p><b>（2）早期浪漫主义文学的诗人与作家<\/b>：华盛顿·欧文：美国文学的奠基人之一，开创了美国短篇小说的传统，被称为“美国文学之父”。其作品描写具有美国特色的自然景物和风土人情，摆脱了英国文学传统的桎梏，代表作为《瑞普·凡·温克尔》和《睡谷的传说》。詹姆斯·费尼莫·库柏：美国文学的奠基人之一，第一个在小说领域里采用民族题材的美国作家，开辟了航海题材小说、边疆题材小说和历史题材小说，反映了热爱自由、坚定乐观的美国民族精神，代表作有《开拓者》和《最后的莫希干人》等。埃德加·爱伦·坡：现代主义文学的鼻祖，西方侦探小说之父。他提倡“纯艺术”、“纯诗歌”，主张诗歌的音乐美，认为诗歌要表现美妇人的死亡，小说创作的目的在于“效果”，读者在震惊之余才能获得享受。其代表诗作有《乌鸦》，短篇小说有《毛格街凶杀案》等。<\/p><div class=\"subsec\">（3）惠特曼<\/div><p>①诗人概况：惠特曼是美国现代诗歌之父。从1839年起，惠特曼开始发表诗歌和杂文，1855年他第一次出版了诗歌集《草叶集》，收诗12首，1892年最后<\/p><p>一版《草叶集》囊括的诗歌近400首。<\/p><p>②《草叶集》题解：第一，代表着理想和对美好未来的希望。在诗歌中，诗人表白：“我猜想它是我意志的旗帜，由代表希望的碧绿色的物质所织成。”第二，它象征着普通人，象征着发展中的美国，也象征着自由精神和民主平等观念。“哪里有土，哪里有水，哪里就长着草。”“草叶”最平凡、朴素，能随处生长，最富有生命力，历久长青。第三，草叶也体现了泛神论的思想。草叶虽然纤小微弱，但是从一片草叶中也能看到一个微观世界。诗人认为草叶是上帝的手绢，有上帝的签名，草叶被赋予神性，寄托了诗人对自然和生命本质的理解。总
