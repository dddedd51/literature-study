{"id":"150","stars":"★★★","title":"“新感觉派”小说的历史地位","body":"一、中国最完整的一支现代派小说\n\n30年代在上海都市读者群中风靡一时的新感觉派，是第二代海派。新感觉派小说是中国最完整的一支现代派小说。它的登场，清楚地表明西方现代主义文学在中国的引入，已然越过了初期，进而问鼎于独立的地位。对于海派自身来说，由于它与世界新潮文学携手，同步发展，也就终于冲出了旧文学、旧小说的藩篱，让市民文学越过仅仅是通俗文学的界线，攀上某种先锋文学的位置。\n\n二、创造了真正的都市文本形式\n\n新感觉小说最突出的意义在于它是真正观照现代大都市的文学。可以说，乡土文化在中国文化传统中占据着主导地位，乡土在地域和文化上具有广延性，甚至也覆盖了都市文化。30年代上海的左翼作家尽管身居都市，但采取的态度却是从都市遥望乡村，或是以乡村为背景来观照都市。上海在大部分来自乡土的左翼作家眼里是一种异已的存在，甚至是万恶之源。而“新感觉派”小说家则是由上海洋场社会塑造出来的作家，也同时是真正从内容到形式都有大都市气息的作家。新感觉派没有产生堪称经典的杰作，但从它开始，中国第一次有了自己的都市文学。\n\n三、提供了半殖民地都市的真实画面，揭示了资本主义的罪恶和对人性的戕害\n\n新感觉派小说表现半殖民地大都市形形色色的日常现象和世态人情，并侧重展现都市生活的畸形与病态，从而提供了另一类型的都市文学。新感觉派小说家喜欢感性地描写富于现代都市气息和特征的人物：从舞女、水手、投机商、银行职员到少爷、姨太太等；这些人物活动的处所则是影戏院、赛马场、夜总会等畸形繁荣的都市环境。在描写处于这种畸形环境中的人物时，又突出了他们病态的行为和畸形的心理：卖淫、乱伦、暗杀和性放纵心理、二重分裂人格等。新感觉派尤擅描写那\n\n本身就象征着繁华和堕落、联结着社会上层和下层的舞女，造成了“海派文学”的甜俗。新感觉派作家在一定程度上也提供了半殖民地都市的真实画面，揭示了资本主义的罪恶和对人性的戕害。","keywords":"现代主义 先锋文学 都市文本形式 半殖民地都市真实画面","note":"“新感觉派”是海派小说一个十分重要的阶段，某种程度上起着承上启下的作用，体现了西方现代主义对中国小说发展的影响，同时也是第一个被引进的现代主义小说流派，在现代文学史上具有重要的地位。而也正因为其重要的地位，“新感觉派”也是名词解释中高频出现的内容，大家要重点掌握。"},{"id":"151","stars":"★★★★","title":"“新感觉派”小说的创作特征（25西安外国语大学、26山东师范大学）","body":"“新感觉派”小说是中国现代小说史上第一个独立的现代主义文学流派，也是30年代海派文学中一个较有成就的流派。它不但促进了现代都市文学的发展，而且丰富了现代小说的表现方法。具体来说，“新感觉派”小说主要具备如下特征：\n\n一、“新感觉派”小说家擅长于捕捉都市化意象\n\n“都市”构成了“新感觉派”小说中的真正主角。“都市”本身便是一个集合性的意象，它派生出琳琅满目的具体化意象，譬如汽车服装、广告、舞厅、咖啡馆、摩天大楼、霓虹灯、电影院等等。这一切都生成为小说中的文学意象，是都市文化中标志性的符码，叠加在一起织成了都市的风景线，反映了大都市的外在景观。而其暗含着的内在景观则是充满了商业化和娱乐气息的消费文化，是中产阶级和市民阶层的生活习惯、节奏、态度和情趣。\n\n二、充分调动了各种现代技巧来传达都市的感性\n\n“新感觉派”并没有产生波德莱尔在巴黎世界中生成的现代都市哲学，他们真正的价值在于提供了对都市的丰富的感性直观体验。在小说中，他们充分调动了各种现代技巧来传达都市的感性，在小说结构、形式、方法、技巧等方面有所创新。譬如他们追求视觉、听觉、味觉、触觉、嗅觉等诸种感官的复合体验和通感，学习和借鉴电影蒙太奇的技巧，致力于小说场景的无序化组接，打乱叙事时间和结构，在形式上活用印刷字体冲击读者视觉感受，省略标点造成意象与场景的密度等等。这些形式都激活了文学的感性和小说的想象力，传达出现代都市所展示的人类心理体验和感性存在的新视野。\n\n三、完整故事隐退，叙事成为空间化结构\n\n在“新感觉派”小说中，传统的线性故事讲述方式被一种“圆圈式”的场景叙事代替。舞厅的视角堪称“新感觉派”小说核心的视角。小说叙事者往往追寻着舞厅中的主人公的眼睛，场景的呈示有如一个电影摇镜头。在这种叙事模式中很难再生成有头有尾的完整故事，舞场上邂逅的男女大都是逢场作戏，这种短暂的邂逅时间自然无法涵容绵延几载甚至终生不渝的爱情故事。完整的故事隐退了，叙事成为空间化结构。这使得小说很难以复杂离奇的故事性情节取胜，只有侧重于挖掘心理潜意识、瞬间体验和感觉世界。\n\n四、在艺术与思想上存在缺陷和不足\n\n首先，“新感觉派”对二重人格的描写，虽有一些成功之作，但有些作品在刻画人物时不是从生活出发，而是从弗洛伊德学说出发，教条主义地把人物弗洛伊德主义化，甚至于古人也难幸免。其次，刘呐鸥、穆时英的一些作品在暴露大都市资产阶级男女的荒淫、堕落时，同时流露出对这种腐朽生活方式的留恋、欣赏，表现出作家主体精神的颓废。西方现代派文学（包括日本新感觉派小说）的悲观主义倾向对中国新感觉派作家的负面影响，在他们的作品中留下了印记。最后，“新感觉派”小说家们更多地沉溺于都市的感官刺激，震惊于光怪陆离的意象世界的体验，缺乏自反的背景，也就缺乏自反式的观照。先锋性的形式实验尚未获得深刻的生命体验和哲学升华的底蕴，从而显出一种文化贫血症。","keywords":"都市化意象 现代技巧 故事隐退 空间化结构 二重人格 主体精神颓废 文化贫血症","note":"“新感觉派”的创作特征与都市生活和现代主义联系紧密，前者更多地表现在作品的主题、背景和意象选用等方面，而后者更多的表现在艺术上。需要注意的是，“新感觉派”虽然是第一个被引进的现代主义小说流派，但这并不代表其创作是完美的，要注意到其在思想艺术上的局限性，要辩证地分析。"},{"id":"152","stars":"★★","title":"刘呐鸥小说创作特点","body":"一、表现现代生活和男女社交情爱场景\n\n刘呐鸥采用“新感觉体”，把当时上海刚形成的现代生活和男女社交情爱场景，尽情摄入。有人指出他“是一位敏感的都市人，操着他的特殊的手腕，他把这飞机、电影、JAZZ、摩天楼、色情（狂）、长型汽车的高速度大量生产的现代生活，下着锐利的解剖刀”，这大体上是反映了他的小说面貌的。\n\n二、将现代派文学神形兼备地移入东方大都会-上海\n\n《都市风景线》因能将本来是植根于西方都会文化的现代派文学神形兼备地移入东方大都会，才审美地发现了上海的“现代性”。作者将叙述者的“感觉”上升到最显著的层面，使人耳目一新地推出意识跳跃、流动的小说文体。刘呐鸥小说的意义在于说明：现代都市要用现代情绪来感受，都市男女的故事也不单单是猎取一点病态心理夸张地予以表现，而在于对城市人的生存处境的细加体验。\n\n刘呐鸥几篇写得有特点的小说，如《残留》运用内心独白，全篇意识流化，表明城市给人造成的极度压抑。《风景》是写现代机械的直线和角度的压力，竟迫使人们逃离城市，去企图寻找赤裸裸的人间真实。这些作品的意义，都在证明，对于现代都市，再不能用鸳蝴派的陈旧暴露眼光来识别了。\n\n三、在批判城市中迷失而缺少了真正的批判能力\n\n刘呐鸥所“感觉”到的上海是五光十色的，又是混沌不清的，是充满活力的，也是冷漠、孤独、荒凉无边的。当然，这可能更接近现代物质文明下的都市本体。刘呐鸥的芜杂是因为他在批判城市中迷失而缺少了真正的批判能力，这差不多是他这一派的共同的限制。至于刘本人，杜衡把他与穆时英加以区分，说“他的作品还有着‘非中国＇即＇非现实”的缺点”，主要指他与中国现实结合得不够，洋味太浓。\n\n无论如何，刘呐鸥的小说体现了市民文学的新特征。刘呐鸥通过借鉴西方艺术手法，将艺术创新的先锋意识融入市民文学之中，改变了市民文学过于通俗性的弊病，适应了当时中国小说对于现代性的要求，也为中国现代新市民小说的产生和发展作了最初的探索。","keywords":"“新感觉体”现代派文学 缺少真正的批判能力","note":"刘呐鸥只有一部小说集《都市风景线》，所以在考查时会直接通过这部作品考查刘呐鸥的创作特征，大家要根据情况灵活应对。要注意的是，刘呐鸥的小说创作受到了西方现代派文学的影响，突破了“鸳蝴”陈旧的暴露方式，但与中国现实结合却不够，这是其不足之处。"},{"id":"153","stars":"★★","title":"穆时英小说创作特征","body":"穆时英，人称“新感觉派的圣手”“鬼才”等，为一时风行的海派作家。穆时英是真正意义上的新式洋场小说家。因为充足的才气，无顾忌的描写，会觉得他有点文字暴发户的味道。他把新感觉的文体，发挥得淋漓尽致。他的小说创作特征，主要表现为以下几点：\n\n一、创造了心理型的小说流行用语和特殊的修辞，表现上海的繁华\n\n穆时英创造了心理型的小说流行用语和特殊的修辞，用有色彩的象征、动态的结构、时空的交错以及充满速率和曲折度的表达式，来表现上海的繁华，表现上海由金钱、性所构成的众声喧哗。是穆时英等人的新感觉派小说，在现代文学上第一次使得都市成为独立的审美对象，可供品赏，同时进行一定的文化思索。\n\n二、对物质文明和商业文明具有双重姿态\n\n穆时英的城市意味比较复杂，总体还是批判性的，但一个个的局部，如夜总会、舞厅、饭店等，又呈迷醉状。这是他对物质文明、商业文明的一种双重的姿态，也是一种现代的姿态。\n\n三、潜在的哀婉抒情气息\n\n除了批判一迷恋，穆时英的现代派十足的作品内面，始终还有第三重的审美意味，就是潜在的哀婉抒情气息。这是他作为中国文化传接者无法摆脱的。他不仅将“抒情”贯穿回忆往昔的题材，如《公墓》《莲花落》中，而且在他的纯都市小说中也有所贯穿。而且他随时又能把“抒情”一反，做激烈的动作性描写，讲究节奏，快速组接，像《上海的狐步舞》《红色的女猎神》那样，特别富于刺激。所以有人说他是“技巧派”，沈从文说他“邪僻”，“所长在创新句，新腔，新境，短处在做作”，同时推崇他的《五月》，说是“特具穆时英风，铺排不俗”。\n\n穆时英的影响当时就十分显著，所谓“穆时英笔调”，所谓“穆时英作风”，一时风靡上海滩，从先锋型的大牌刊物，到商业性的画报、小报，都可见对他模仿的文字。穆时英是连同他的文字，都带有传奇性质的。\n\n【李凡关键词：心理型小说 城市整体批判性 哀婉抒情气息】","keywords":"","note":"穆时英在现代文学史上被誉为“中国新感觉派圣手”，将新感觉派小说推向成熟，同时亦为中国现代“都市文学”的先驱者，海派文学的代表作家。他的作品大都描绘二三十年代上海都市文明昙花一现、畸形发展时的社会生活，很能代表“新感觉派”的创作风格，经常会考查，大家要注意。"},{"id":"154","stars":"★★★","title":"施蛰存小说创作风格","body":"一、有意地运用精神分析学说来创作心理分析小说\n\n施蛰存的心理分析小说在30年代堪称独步。历史题材的故事新编在前，如《将军底头》《石秀》《李师师》等，用精神分析来重新解释历史人物和事件。《梅雨之夕》《狮子座流星》《春阳》这些篇什，心理分析更从尘封的故纸堆一直深入到现代都市，深入到女性的世界中去。应当说，在现代环境下的男女发生的矛盾，是更适于窥视人性经久不息的涌动层面的，由人的内在生命来表现人性，表现男女情爱，就这样成了施蛰存小说的母题。\n\n二、不断改变手法，尝试新技巧\n\n心理分析小说要推行到市民群体中去，势必要以新奇的趣味来取胜，所以，他的小说又不断改变手法，尝试新技巧，显得十分的不安分。他写潜意识，写出了《夜叉》，写出了《魔道》；施蛰存受爱伦·坡的影响写了《凶宅》，类似一种心理探秘，自己也跌进了“魔道”吃了一惊，很快开始转向。他的《小珍集》里的一些优秀之作，就显示了某种回归写实、探索心理现实主义的新路途。\n\n三、根深蒂固的城乡二元倾向\n\n作为一个海派都市小说家，施蛰存还有一特点，即根深蒂固的城乡二元倾向。他栖身于上海，但松江有老屋存焉，这是他的文学“后院”。他的早期小说有赖于对江南乡镇的回溯，已经显出他与穆时英、刘呐鸥的相异。后来的心理分析小说脱去模仿的痕迹，成熟的代表作一律是乡镇进入城市的那种“文化碰撞”结构。《春阳》写为旧式婚姻牺牲了青春的中年乡镇富婆，在春天的阳光和商业大都会气息的诱发下，萌动的一次注定要失败的性爱心理。一个弗洛伊德心理小说的框架，却把社会变迁隐约地包含在人物心理变迁之内。十几年里上海的畸形繁荣，与其周边的保守城镇的关系，就包含在这春阳一日的变化之内。其他如《雾》《鸥》等，也都是这样的结构。可以说，施蛰存的城乡统有的“情结”，贯穿了他的文学全程，并保证他的创作拥有一贯的气息。他是最早认识到现代派需有中国特色的一个作家，并将之付于实践。","keywords":"精神分析学说 表现男女情爱 变换手法 城乡二元倾向","note":"施蛰存自己评价自己给中国小说带来什么新的东西时说，是“把心理分析、意识流、蒙太奇等各种新兴的创作方法，纳入了现实主义的轨道”，考查时可能会让大家通过这句话，来分析他的创作特点，大家要注意。"},{"id":"155","stars":"★","title":"三十年代雅俗互动的文学态势是怎样形成的","body":"一、左翼文学出于政治需要进行“大众化”的讨论\n\n左翼文学因一种政治的需要，对“五四”文学进行反省，认为自己没能掌握下层读者是绝大的缺失，一再地进行“大众化”的讨论。\n\n瞿秋白写《普洛大众文艺的现实问题》《大众文艺的问题》，鲁迅写《文艺的大众化》《门外交谈》，茅盾写《问题中的大众文艺》《“连环图画小说”》等，提出要运用“旧形式”和“大众语”，以便将革命文学伸向群众。不过提倡归提倡，真正能拿得出来的通俗作品不多。这些作品是否能被大众接受是值得怀疑的。它们毫无通俗文学应具备的娱乐功能，倒是很有形式探索的性质。它们是“虚拟”的大众精神食粮，并不能占领通俗文学的市场，也构不成对已有通俗文学的威胁。这仅仅是30年代“雅”文学自觉向“俗”文学移动的一种愿望罢了。\n\n二、海派小说挤压了旧派通俗小说的生存空间，拓宽了大众文学市场\n\n真正具备由“雅”向“俗”移动的实践性的，是新文学内部产生的海派。其中，像张资平、叶灵凤等所做的，是新文学作者“下海”直接从事通俗小说的实际写作，一直到这一时期末写出《鬼恋》的徐訏。他们代表着新文学为争得知识者以外的读者市场而制作通俗读物的倾向，这与章回小说作家发生竞争关系。海派中还有“新感觉派小说”出现，证明市民读者群在30年代有了变化。随着上海等现代都市市民文化消费水平的提高，一部分读者已不完全满足于旧派通俗文学，才在城市里酿成“穆时英风”的读书市场效应。新海派的产生，一方面占去了旧通俗文学的部分领地，一方面也进一步拓宽了原先就已经不小的大众文学市场。\n\n三、旧派通俗文学积极向新文学学习\n\n由“雅”及“俗”的形势，必然刺激旧派通俗文学。随着新文学部分地“俗”化，通俗文学在向新文学和外国文学定型的模式学习的过程中，不断提高自身的品位，反过来由“俗”及“雅”。张恨水、刘云若等便是其中的佼佼者。\n\n雅俗互动的过程并不平衡：通俗的“雅化”是悄然进行的；新文学争夺大众的声势在抗战以前“雷声大，雨点小”；张资平等的“俗化”受到严厉斥责，被认为是新文学的“堕落”；而当时北方的京派文学却我行我素，不受市场牵制，执著于它纯文学化的努力。就在这样的形势下，通俗文学进入它的新旧转换的阶段。","keywords":"政治需要 “大众化”讨论 海派小说拓宽市场 旧派文学学习新文学","note":"三十年代，随着社会形势的变动，无论是政治的需要，还是文学自身发展的要求，都推动了雅俗文学不断趋近、融合，这样一个雅俗互动的过程中，诞生了张恨水这样的文学大家。而这一趋势进一步发展，在四十年代，更是出现了张爱玲这种出入于雅俗之间的作家。"},{"id":"156","stars":"★★","title":"为什么说张恨水是社会盲情小说集大成者","body":"一、张恨水立足传统章回体，让章回小说容纳不同时代的题材内容。\n\n张恨水对待小说创作具有独特的立场。一方面，他的文学观念里始终不放弃章回小说的形式和通俗文学的娱乐性，而另一方面，他认为大多数的作者“决不能打肿了脸装胖子，而能说他的小说，是能负得起文艺所给予的使命的”。\n\n张恨水立足章回体而不断拓宽其功能，追求新的潮流，不甘落伍。他让章回小说能容纳不同时代的题材内容，他注意章回的回目格式的变化，他尝试过言情以外的武侠、侦探、历史、讽刺、幻想、荒诞等各种写法，以把章回体调适为一种富于弹性的新旧皆宜的文体，并不仅仅能用来写鸳蝴式的故事。\n\n二、学习新文学的写作手法，为社会言情小说注入灵魂。\n\n在进行章回小说创作时，张恨水不但让章回小说容纳不同的题材内容，还积极学习新文学的写作手法，如为了保持结构的完整划一，张恨水列有一个人物表，不时的查阅表格，以免错误，这正是新文学作家惯用的方法。学习的成果便是《金》世家》，其人物描写的细致、倒叙的开头、百万字小说的结尾呈半开放式的状态，这都超出了一般章回小说的格局，而与新文学作品打通了。所以，作为表现大家族的小说，《金粉世家》不仅常被论者拿来与《红楼梦》相比，还平行地与巴金的《家》做比较。《家》和《金粉世家》写旧家族的溃败，显然有激烈与温良之分，有雅俗之别，但都是现代小说之一。\n\n三、创立了崭新的章回体形式\n\n张恨水以一个南方文人的身份久居京华古都，他通俗文学的那种北方气质被南方文化接受并加调理后所形成的特色，也是他的魅力之一。所以他的文字也像“言情”掺和了“武侠”，细腻中挟带了豪爽。他所操的文学形式，质和体都属于章回，但慢慢越来越不像原先的章回：结构不再是一段一段的，而是按照原意有一个全开放的不交代主人公结局的非鸳蝴式结尾；人物心理描写复杂了；风俗描写、风景描写、环境描写，以书中的天桥景致为代表，可直逼西方小说的笔法，但全书细细叙事的传统声口和文化气味仍是浓厚的。这一切，都在《啼笑因缘》这部作品中体现了出来，所以这部作品于南方引起轰动，奠定了张恨水全国性通俗小说大家的名声。","keywords":"立足章回体 拓宽题材内容 新文学写作方法 崭新的章回体形式","note":"张恨水是社会言情小说的集大成者，根本原因就是他的作品超越了鸳蝴，为通俗小说发展做出了巨大贡献。这里常常会结合张恨水的《金粉世家》和《啼笑因缘》两部代表作让大家进行分析，要特别注意。"},{"id":"157","stars":"★★★","title":"中国诗歌会诗人群创作有什么特点","body":"中国诗歌会诗人要求诗歌自觉地表现大时代阶级斗争的“急风狂雨”，要求诗歌缩短与“大众”的距离。这里所显示的诗歌观包含了两个方面的要求，一是要求诗人站在阶级的意识形态”的立场上去把握与反映现实；其二是要求“诗与诗人的大众化”。由此，这一时期的中国诗歌会的创作而产生了以下特点：\n\n一、及时、迅速地反映时代重大事件，强调诗歌对实际革命运动的直接鼓动作用\n\n中国诗歌会要求诗歌及时、迅速地反映时代重大事件，表现工农大众及其斗争，强调诗歌对实际革命运动的直接鼓动作用，以诗歌“催促和鼓励全国给敌人蹂躏、践踏、剥削得遍体鳞伤的大众，为着正在危亡线上的民族和国家，作英勇的搏斗”。\n\n在反抗日本帝国主义侵略斗争成为时代中心以后，中国诗歌会又及时提出了“国防诗歌”的口号，创作了大量的鼓动抗日爱国热情的诗歌。\n\n中国诗歌会诗人的上述努力，扩大了诗歌的表现领域，并表现了强烈的理想主义与英雄主义色彩，别具一种刚健、粗犷、壮阔的力的美，以及历史沸腾时期的昂扬的激情。\n\n二、强调“自我”在“集体”、“小我”在“大我”中的融合\n\n中国诗歌会强调“诗的意识形态化”，这自然大大加强了诗的理性化色彩与主观性；但作为诗歌“主体”的，却并非诗人自己，而是奉行战斗集体主义的群体。因此必定要强调“自我”在“集体”、“小我”在“大我”中的融合。\n\n三、直接描墓现实，提倡诗歌“歌谣化”\n\n这一时期中国诗歌会诗人的创作，在艺术表现上，大都采取直接描摹现实的方式。这就导致了抒情性因素减弱与叙事性因素加强的趋势。叙事诗也在同一背景下得到了重视与发展，即使是感情的抒发，也大都采取直抒胸脆的方式。这类面对读者的大声呐喊，与对诗歌鼓动功能的强调直接有关，也是适应那个慷慨悲歌的时代要求的。\n\n在诗歌形式上，中国诗歌会诗人提出了“歌谣化”的主张，强调“诗歌应当与音乐结合一起，而成为民众歌唱的东西”。&#x4E3A;了促进诗歌的大众化，中国诗歌会的诗人还做了创造诗歌新形式的各种试验。尽管未尽人意，但却表明，中国诗歌会的诗人并非仅仅关心诗的内容的革新、新意识的灌输，他们对诗的形式上的变革也同样采取了激进的态度。在历史的承接上，他们在拒斥文人传统的同时，却热心于向民间歌谣吸取资源：不仅是歌谣体的形式，更包括关注现实与民间疾苦，表达平民百姓的呼声，朴素、刚健的诗风等精神传统。\n\n四、中国诗歌会诗人的创作也存在着明显的不足。\n\n（一）中国诗歌会把诗歌作用归结为直接的宣传与鼓动，容易忽视诗歌本身的艺术特性，成为“意识形态的传话筒”。\n\n（二）中国诗歌会的产生于阶级斗争与民族斗争疾风暴雨中的时代战歌，大都是急就之章，艺术上比较粗糙；把反映现实生活重大题材推至极端，完全否定与抹杀了非重大题材的作品，也导致了诗歌的单一化。\n\n（三）中国诗歌会“诗的意识形态化”的提倡，可能导致“群体”中“我”的感情与个性的消失，诗歌创作中主观世界的消失与对艺术个性的忽略。中国诗歌会的创作，开始扩大了新诗的表现领域，但之后由于思想、艺术观念的片面性，却导致了另一种形式的狭隘化。","keywords":"反应时代重大事件 工农大众斗争“诗的意识形态化”叙事性因素增强“歌谣化”不足：忽视艺术性 单一化忽视个性","note":"中国诗歌会是我们常常考查到的一个重点，这里要注意到，中国诗歌会的主张，有其进步的地方，也有不足的地方，要辩证地分析。其进步的地方在于现实主义色彩强烈，积极反映现实；而其不足在于过分强调诗歌的宣传与鼓动效果，忽视了诗歌本身的艺术性，造成诗歌题材的单一化。中国诗歌会是第二个十年中十分重要的一个诗歌流派，在名词解释中出现的频率也很高，大家要注意重点掌握。"},{"id":"158","stars":"★★★","title":"臧克家诗歌创作的艺术风格是怎样的","body":"一、坚持现实主义精神，严肃地正对现实生活中的险恶苦难\n\n臧克家的诗歌创作，在形式上受到新月派的很大影响；不过虽然他并不直接表现工农革命斗争，但对下层人民却表示了极大的同情，在坚持现实主义精神这一点上，他与中国诗歌会的诗人确有相通之处。\n\n谈及臧克家，人们首先注意到并引起争论的，是臧克家在他的诗中为苦闷、彷徨中的中国青年提供了与新月派、现代派诗人以及中国诗歌会诗人都不同的另一种人生态度，这就是诗人自称的“坚忍主义”：严肃地正对现实生活中的险恶苦难；带着倔强的精神，沉着而有锋棱地去迎接磨难，“苦死了也不抱怨”。这种“坚忍主义”显示了臧克家在精神上与中国农民的深刻联系，由此形成了“不肯粉饰现实，也不肯逃避现实”的清醒现实主义精神。\n\n二、题材上关注底层人民\n\n当新月派、现代派诗人唱着“对于天的怀乡病”时，臧克家始终眼光向下，注视着苦难中的中国大地和挣扎在死亡与饥饿线上的底层人民。他写《难民》《炭鬼》《当炉女》《神女》《贩鱼郎》《洋车夫》《歇午工》，写他们生活的不幸，精神上的苦恼-那“老马”：“背上的压力往肉里扣，它把头沉重地垂下”；那“洋车夫”：“雨从他鼻尖上大起来了”，也写他们内在的力量，把未来的希望寄托在“炭鬼”们的身上。\n\n三、受到中国传统诗歌“苦吟派”的影响\n\n臧克家甚至在写诗态度上也是农民式的：认真而执著地提倡“苦吟”，老老实实、苦心孤诣地去捕捉每一个形象，寻找、锤炼每一个字句，顽强地追求着“深刻到家，深刻到浅易的程度”的艺术境界，把感情、倾向性凝聚、隐藏在诗的形象里，经得起读者咀嚼与回味，并且讲究诗的形式的凝练、整齐，讲究诗的节奏、韵律。在臧克家这里，是可以更清楚地看到中国传统诗歌（特别是“苦吟派”）的影响的。","keywords":"现实主义 底层人民“苦吟派”","note":"臧克家虽然未曾加入中国诗歌会，但他的诗歌思想内涵和中国诗歌会的创作风格很是接近，其突出特点是与农民联系密切，是我们考查的一个重点，其创作特征我们要关注一下。考查时可能会将中国诗歌会诗人群的诗歌与臧克家的诗歌作为对比，大家要特别注意，"},{"id":"159","stars":"★★","title":"后期新月派诗歌的创作特点是什么","body":"一、坚持的仍是超功利的、自我表现的、贵族化的“纯诗”的立场，但诗感上透露出了空虚、迷茫，逃避现实\n\n新月派仍然采用了“内容”与“形式”的二分法，但其重心的转移是明显的。这意味着对闻一多所坚持的（可以上溯到“学衡派”以至梁启超）“格律是艺术的必须的条件”的立场的一种松动。后期新月派年轻诗人的创作中，也出现了向自由诗发展的趋向。\n\n后期新月派坚持的仍是超功利的、自我表现的、贵族化的“纯诗”的立场。在这一基本点上，前后期新月派是一致的。问题在于前、后期新月派诗人“自己”，他们的“诗感”发生了变化，表现为幻灭的空虚感和迷茫的感伤情绪。后期新月派诗人“从乌烟瘴气的现实社会中逃避过来”，回到自我内心世界，回到诗的艺术世界中，并且失之于彼，收之于此，在这两方面都达到了一种新的深入。\n\n二、特别强调抒情诗的创造\n\n正是回到内心世界，后期新月派才特别强调抒情诗的创造，而有别于同时期中国诗歌会诗人对外部世界的叙事的偏重。后期新月派诗人如陈梦家所说，抒情的重心是在揭示“灵魂的战栗”。于是，在后期新月派的诗歌里，引人注目地出现了大都市的病态和现代人的精神异化。\n\n三、积极进行诗的形式试验\n\n后期新月派的诗人同样以极大的热情从事诗的形式试验，其中影响最为深远的是“十四行诗体”的转借与创造。闻一多已经注意到中国传统的律诗与西方十四行诗的相似，后者内部结构中也存在着“起，承，转，合”的关系，后期新月派诗人正是在十四行诗体里发现了中、西诗歌诗体形式的某种“契合点”，从而为新诗的形式创造提供了新的经验。\n\n新月派诗人曾试图引入多种西方诗体，如三叠令、四环调、巴俚曲、栾兜儿等，但都未立住脚；转借十四行诗的试验，却产生了一批成果，如孙大雨的《决绝》、饶孟侃的《弃儿》、卞之琳的《一个和尚》、朱湘的《十四行英体》之十二、陈梦家的《太湖之夜》、罗念生的《自然》、李惟建的《祈祷》等，这些作品为绵延至今的汉语十四行诗的写作开辟了道路。","keywords":"“纯诗”立场 逃避现实 抒情诗的创造 诗的形式实验","note":"新月派前后期创作风格有很明显的区别，这与当时的时代转变密不可分，他们的诗歌创作追求和中国新诗会有很大的区别，所以可能会将二者的作品放在一起进行比较，这需要大家对这两个诗歌流派都有所掌握。"},{"id":"160","stars":"★★","title":"后期新月派与现代派的“趋近”体现在哪里","body":"新月诗人的思维模式，价值观念，既有对传统的因袭，又有对西方现代主义的吸纳，所以在后期新月诗派与19世纪末20世纪初的世界当代诗潮相融合的过程中，古典主义与现代主义诗论是交汇在一起的。\n\n一、专注于内心世界与诗的艺术世界，具有幻灭感与迷茫感伤情绪\n\n现代主义是一战后整个欧洲危机意识的产物，是20世纪最有影响的文学思潮，就诗歌发展来说，现代主义诗人们认为比战争破坏更严重的是整个文明社会的毁灭、城市人的猥琐无生气的生活和信仰的丧失，这种深刻的危机感使现代诗人首先产生了深刻的“荒原”意识。\n\n而大革命失败以后，社会现实的黑暗与知识分子精神的幻灭，深深影响到了后期新月派诗人。他们和现代派诗人一道，”从乌烟瘴气的现实社会中逃避过来”，回到自我内心世界，回到诗的艺术世界中。与之对应，后期新月派诗人“自己”的“诗感”发生了变化：徐志摩用“向瘦小里耗”来概括他后期对自我生命的体悟，这也是他后期诗的基本“诗感”，另一位后期新月派的代表诗人陈梦家在他的成名作《一朵野花》中流露出幻灭的空虚感和迷茫的感伤情绪，这正是后期新月派的失型诗感与诗绪，都体现出了与现代派的趋近，\n\n二、在艺术表现和抒情方式上的趋近\n\n（一）强调抒情诗的创造，表现大都市的病态、现代人的精神异化\n\n西方现代主义诗学的特点在于创作中摒弃情绪的直接表现和陈述，重在对内心世界微妙感觉的捕捉和情绪的呈现与暗示，在象征性的形象中实现情绪与形式的统一，这与后期新月诗派的美学追求有诸多相通之处。后期新月派与现代派一样，特别\n\n强调抒情诗的创造，而有别于同时期中国诗歌会诗人对外部世界的叙事的偏重。在后期新月派的诗歌里，引人注目地出现了大都市的病态、现代人的精神异化。\n\n（二）暗示和象征手法的广泛应用\n\n通过暗示和象征构成隐晦的艺术境界，这是三十年代许多诗人的追求，后期新月派诗人与现代派诗人都是如此也不例外。徐志摩《两个月亮》中一个“老爱向瘦小里耗”，最后消失在满天星点里；另一轮“完美的明月”，尽管“永不残缺”，却难以把握，一闭眼，就“婷婷地升上了天”：这正是徐志摩内心矛盾的某种暗示，其意义是要在读者的联想与体味中完成的。","keywords":"内心世界 诗的艺术世界 幻灭感 迷茫感伤情绪 抒情诗的创造 大都市的病态 现代人的精神异化 暗示和象征手法","note":"后期新月派的创作风格和现代派在诗歌内容表达和艺术手法上有很多相近的地方，这种趋近其实也和当时的社会背景有很大的关系，都受到了大革命失败以后社会现实和知识分子精神世界变动的影响，所以二者常常会拿来放在一起进行比较，大家一定要注意。"},{"id":"161","stars":"★★★★","title":"现代派诗歌的创作特征是怎样的","body":"现代派诗歌普遍受到法国象征主义诗歌的启发和影响，同时又承接了以李金发为代表的20世纪20年代初期象征诗派的某些艺术追求，对诗歌有着自己独特的理解。现代诗派的基本特征主要表现在以下几个方面：\n\n一、追求“纯诗”的艺术观\n\n施蛰存在《又关于本刊中的诗》中声称：“《现代》中的诗是纯然的诗，而且纯然的现代诗。它们是现代人所感受的现代情绪，用现代的词藻排列成的现代诗形。”这里所强调的，一是要写纯然的“诗”，这就表明了新诗谱系上与早期象征派的“纯诗一贵族化的诗”传统的承接；二是写“现代”的诗。这种“纯诗”的观念反映在创作上，便是将诗歌作为灵魂的避风港，用以抵制现实社会带来的一切痛苦与烦优，在一种超脱的幻象中寻求所谓灵魂的净化。\n\n二、病态的心灵，浊世的哀音\n\n现代诗派的诗人，都有一颗青春的病态的心，在现代派诗人的笔下，很难看到时代斗争的投影和对人生的关注；在他们的诗歌世界里，其中心常常是一个孤零零的“我”。把自己和斗争的时代隔开，自然看不到前进的方向，只能陷于狭小的精神牢笼中，在那里咀嚼小小的悲欢。现代诗派的作品之所以大都内容苍白、基调消沉，如同败叶秋蝉，而且大都蒙上一层无法掌握自已命运的阴影，根本原因就在这里。\n\n三、“象征派的形式，古典派的内容”的统一\n\n现代派诗歌总体上追求“象征派的形式，古典派的内容”的统一，现代诗形更体现在表层形式上，而在审美趣味和文化心理取向上则显示出鲜明的古典主义特征。\n\n现代诗派的诗歌创作在形式上更接近于我国20年代出现的象征诗派，但对象征诗派神秘的内容和晦涩的诗风，却有较大的突破。他们借助从域外获得的陌生化的眼光，重新发现了传统诗艺中与西方相亲和的部分，将国外象征派的诗艺融化到本民族的语言和欣赏习惯中来，致力于寻找中西诗歌审美追求的契合点。在诗艺上，现代派诗人注重暗示的技巧，很少直接呈示主观感受，而是借助意象、隐喻、通感、象征来间接传达情调和意绪，这使得现代派诗歌大都具有含蓄和朦胧的诗性品质。","keywords":"“纯诗”艺术观 病态心灵 象征派、古典派的统一 含蓄朦胧","note":"现代派诗歌在中国现代诗歌发展史上具有很重要的地位，是考查的重点内容。它既承接二十年代象征诗派，又收到了西方现代派文学的影响-或者说是西方现代主义对中国文学的影响在诗歌领域的体现。故此，现代派诗歌的创作特征我们要重点掌握。此外，现代派是三十年代最重要的一个诗歌流派，其本身以及与之相关的《现代》杂志等都是名词解释中会出现的内容，大家也要注意一下。"},{"id":"162","stars":"★★★★","title":"试述戴望舒诗歌创作风格","body":"戴望舒一向被公认为20世纪30年代中国现代派诗歌的举旗人，他的诗歌充分代表了现代派诗歌的基本特点和倾向，具体来说，表现在以下方面：\n\n一、带有东方特征的、民族性很强的现代审美原则与艺术追求\n\n戴望舒是一位富有艺术自觉意识的诗人，他将民族特点、个人特点和名副其实的“现代”风味融为一体。他带着中国晚唐温李那一路诗的影响进入诗坛，并接连受到了英美浪漫派、法国象征派和法国、西班牙现代派诗人的影响。这些影响是统一于戴望舒的诗艺探索之中的，他把这种探索同民族现实生活、古典诗歌艺术融合，从而形成了成熟期的独特风格。他的诗作在表现内在灵魂的深度与传达的隐藏适度方面，体现着带有东方特征的民族性很强的现代审美原则与艺术追求。\n\n二、朦胧美与古朴美构成的双重底蕴\n\n戴望舒认为诗是诗人隐秘灵魂的泄露，创作动机“是在于表现自己与隐藏自己之间”。他运用象征、隐喻的意象与曲折、隐藏的手法，委婉地展现主观心境，把情绪和意绪客观化，这种表达特点造成了戴望舒诗歌从情绪、意象到语言都具有朦胧美，同时，戴望舒的诗又是最为清澈透明的。他始终是反对艰涩混沌的艺术形式的，他甚至反对对诗歌艺术技法包括格律音韵等方面的过度追求，戴望舒的诗歌创作有一种中国古典传统诗歌的通脱清闲的意境。显然，法国象征主义的朦胧美与中国传统诗歌的古朴美，构成了戴望舒诗歌的双重底蕴。\n\n三、重举“诗的散文化”的旗帜，强调打破诗的格律\n\n戴望舒诗歌摆脱了音乐的束缚，运用自然的现代口语，服从于诗人情绪展开需要的内在节奏，创造了具有散文美的现代自由体诗。这种诗“在亲切的日常说话调子里舒卷自如，锐敏准确，而又不失它的风姿，有节制的潇洒和有工力的淳朴。日常语言的自然流动，使一种远较有韧性因而远较适应于表达复杂化、精微化的现代感应性的艺术手段，得到充分的发挥”。戴望舒的诗在亲切的日常生活调子里舒卷自如，敏锐，精确，而又不失它的风姿，有节制的潇洒和有功力的纯朴。意象物境日常生活化，诗句的排列自由化，有意识地摒弃了外在的音韵节奏和字句雕琢，这样就更便于表达对复杂精微的现代生活的感受，比格律诗更有弹性。\n\n四、在日常生活中寻觅抒情意象，在微细的琐屑事物中发现诗\n\n在诗歌对象的审美选择上，戴望舒成熟期的作品在日常生活中寻觅抒情意象，在微细的琐屑事物中发现诗。江南“雨巷”的凝视，一切有灵魂没有灵魂的东西的“记忆”，深闭而荒芜的“园子”，相对而视的一盏“灯”，都开掘出了令人深思凝想的诗意。戴望舒最突出的一批意象是含有诗人自我写照的孤独行人、游子、流浪者、单恋者。他曾因发表《雨巷》被称为“雨巷诗人”，这同时也是大时代时期知识分子幻灭、迷茫的真实写照。\n\n［李凡说：戴望舒的诗歌风格本质上就是现代派诗歌的风格，现代派诗歌创作特征在他的诗歌中都有体现，不过我们需要结合戴里舒的作品，去做具体分析。作为三十年代具有代表性的一位诗人，戴望舒的诗歌创作很可能与郭沫若、艾青的诗歌创作联系起来考查，大家也要注意一下。】","keywords":"东方特征 民族性 朦胧美 古朴美 双重底蕴 诗的散文化 日常生活中寻找抒情意象","note":""},{"id":"163","stars":"★★★","title":"戴望舒诗歌特色经历了怎样一个变化","body":"一、前期诗作特点\n\n戴望舒的诗作融合了中国晚唐诗风和法国象征派的诗歌风格，从而形成了成熟期的独特风格。他的诗歌在表现内在灵魂的深度与传达的隐藏的适度方面，都很好地体现了自己带有东方特征的、民族性很强的现代审美原则与艺术追求。\n\n（一）戴望舒早期和成熟期的作品，多写爱情的苦闷和个人的忧郁。成熟期更是把这种低沉抑郁的情绪做到了完美的表达，呈现在诗中的是两种抒情形象，即苦闷的孤独者和飘忽仇怨的少女。\n\n（二）在诗歌对象的审美选择上，戴望舒善于在日常生活中寻觅抒情意象，努力在细微的琐碎事物中发现诗。\n\n（三）运用象征的意象与曲折隐藏的手法，委婉地展现诗人的主观心境，把情绪客观化。戴望舒认为诗是诗人隐秘的灵魂的泄露，创作动机是“在于表现自己与隐藏自己之间”。这种表达特点造成了戴望舒从情绪、意象到语言都具有朦胧美。\n\n（四）戴望舒诗歌的成熟期，摆脱了音乐的束缚，运用自然的现代口语，服从于诗人情绪展开需要的内在节奏，创造了具有散文美的自由体诗。\n\n（五）奇幻的语言又是戴望舒成熟期诗歌的特征。从《我的记忆》后，戴望舒诗歌追求“全感觉”的意象特征，通过通感、隐喻等方式，形成出神入化的奇幻之美。\n\n二、后期诗作特点\n\n（一）1937年抗战爆发后戴望舒投身于民族解放斗争的行列，诗的内容和格调发生了巨大的变化，此后写的一批诗作，关注国家民族命运，在苦难中审视个人的不幸，回荡着爱国主义的激情，格调由幽玄、枯涩转变为明朗、雄健。\n\n（二）后期戴望舒的情绪和诗风发生了很大的变化，开始追求诗的内在情绪上抑扬顿挫的韵律美以及表现形式的美。他大胆突破新月派“三美”戒律，倡导更适应和更能传达现代人情感的自由体诗。\n\n战争的纷乱和灾难使戴望舒经历了从逃避现实到回归现实，从消极避世到积极关注人生和现世的转变，使他的诗歌也显现了从情感的贫弱到内涵的厚重，从风格的单一到艺术的全面成熟的明显变化。","keywords":"爱情苦闷 个人忧郁 日常生活 象征意象 曲折手法 奇幻的语言 爱国主义激情 明朗、雄健","note":"戴里舒的诗作风格前后有了很大的变化，这与当时的时代环境密不可分，具体表现在诗歌内容和格调两个方面，大家可以从这个角度去切入，通过对比加深印象。像戴望舒这样前后期风格发生重大变化的作家也很多，如巴金、余华等，可能会被联系到一起考查，大家也要注意一下。"},{"id":"164","stars":"★★★★","title":"现代派诗歌与中国传统诗歌的深刻联系体现在哪里","body":"“意”与“象”的浑然一体，“人”与“自然”的浑然一体，正是30年代现代派诗歌的主要追求与特征。人们由此发现的是30年代现代派诗歌与中国传统诗歌主流的深刻联系：\n\n一、意象选用上显示出对传统的回归\n\n传统的意象抒情诗把意境美的创造作为审美理想境界，追求言外之旨，象外之境，言有尽而意无穷的诗境成了中国诗歌的传统。这一诗歌传统也明显地影响了戴望舒为代表的现代派诗歌，他们的象征诗往往表现为一种意象的意境美与氛围美，既有象征意象的思致隐奥，又有意象意蕴的悠长，既有意象的朦胧幽晦，又呈现出意境的空灵；既讲究意象的个体的凝重，又追求整体意境的浑成。这就是他们所致力追求的意象意境化。在现代派的诗歌中，无论是对主客体交融的“意象”的注重、意象原型的选用，以及意象叠加的诗的组合方式，还是“人”与“自然”的和谐与交融的追求和贯注于（人与自然）意象中的感伤情调，都显示出对传统的回归，这也正是30年代的典型的现代“诗情”。\n\n二、追求“华美而有法度”，具有音乐美和绘画美\n\n从诗经、楚辞、乐府到唐诗、宋词、元曲，中国诗歌走了一条与音乐、绘画联姻的道路。现代派诗歌继承并发扬了古典诗歌音乐乐感节律的可唱性与画面色调的可视性特点，努力实现形式自觉，甚至有时候力图凭借艺术品类间的交互融汇，与音、色、形的系统调动，促使诗向音乐与绘画靠近，在音乐性与画意美中收回自己的全部价值，抵达形式即内容的境地。\n\n戴望舒的《雨巷》，就是靠占压倒优势的音乐性而被人誉为“替新诗的音节开了一个新的纪元”，贯通全篇的六江韵部与复沓的旋律，将诗人萦回不绝的感伤表现得起伏婉转，之后创作的《我的记忆》虽然反叛了音乐性，可是40年代写的《我思想》又重新向音乐性回归，并且他流传下来的又恰是诗人自己反对过的音乐诗。\n\n三、艺术表现上的含蓄和朦胧\n\n古典诗歌陶冶了现代中国现代主义诗歌含蓄蕴藉的审美趣味。在体验情感的问题方面，中国人善于使情感在物中依托，或者说是进行主客浑然的心物感应与共振。这种情景交融、体物写志的赋的精神，是东方诗歌意境理论的精髓。所以纯粹一维的中国“古诗之妙，专求意象”，如雾里观花，水中望月，透着一种光色隐约的朦胧美。对于意境这种传统法度的精华，现代派诗歌自然加以承袭，并在实践中自觉将它与西方的意象艺术沟通，用外在物象整体地契合、烘托内在情思，求超逸象外、言近旨远的效果。在诗艺上，现代派诗人注重暗示的技巧，很少直接呈示主观感受，而是借助意象、隐喻、通感、象征来间接传达情调和意绪，这使得现代派诗歌大都具有含蓄和朦胧的诗性品质。","keywords":"意象选用 华美而有法度 音乐美 绘画美 艺术表现 含蓄和朦胧","note":"现代派诗歌的一大追求就是中西诗艺的融汇，要把新诗引向具有民族特征又体现现代性的道路上去。因而在现代诗歌技巧之外，现代派诗歌又显露出了古典性特征，与中国传统诗歌联系紧密，这主要体现在意象选用、音乐美和绘画美、艺术表现含蓄朦胧这些方面，对此大家要注意掌握。相关内容可以参考罗振亚《重铸古典风骨-中国现代主义诗歌对传统诗歌接受管窥》，具体资料可以在李凡文学正版群中领取。"},{"id":"165","stars":"★★★★","title":"试分析二十世纪三十年代中国现代派诗人的诗学资源（26武汉大学）","body":"追求诗表现生活的敏感性和深邃性，追求内面世界与外面世界的统一，在抒情内容和表现方式新的秩序和新的平衡中，来努力完成“纯诗”的建设，是现代派诗歌的独特的艺术趋向。为此，他们积极从中外诗学中汲取营养，主要有以下方面：\n\n一、对20年代象征派的继承与革新\n\n从中国30年代现代派的诗艺来看，他们显然是和中国早期象征派诗歌有着直接的渊源关系的。现代诗派也和李金发一\n\n样，都是推崇法国象征主义的，只不过象征诗派井没有完整把握西方象征主义的真正精髓，也没有把象征主义与中国民族生活很好结合起来，因而创作的象征诗更多地停留在外部形式与技巧的模仿上，其艺术成就不能说是很大的。特别是其晦涩、神秘、看不懂的弊端，大大地败坏了象征诗在读者中的声誉，正是因为这样，以戴望舒为代表的现代派诗人开始重新认识象征主义把握象征主义的精义，寻找象征主义与中国民族传统的结合点，但是，不可否认，李金发、穆木天、王独清等的象征主义理论主张，及他们注重隐喻、注重感觉、注重意象、注重暗示和跳跃性的创作实践，给了他们很大的启发，可以说，现代诗派的出现，也正是对象征诗派继承和革新的结果。\n\n二、对于西方后期象征派、意象派和现代主义诗歌的吸收\n\n从外国艺术渊源来看，现代派诗人们在广泛接触介绍前提下比较更加关注的是三个艺术流派：\n\n（一）以瓦雷里、耶麦、福尔、果尔蒙等人代表的法国后期象征派诗歌，包括这个流派影响下创作的流派和其它国家的诗人，如阿波里奈尔、洛尔伽等；属于后期象征派的爱尔兰大诗人夏芝也为他们所十分关注。卞之琳在《新月》第4卷第4期上曾发表一篇题为《魏尔伦与象征主义》的译文，在前言中特意强调，西方象征派注重“亲切与暗示”，这也正是中国“旧诗词底长处”，像戴望舒的《我的记忆》那样的诗，将灵魂受伤的“记忆”外化为一个“忠实的友人”，这艺术表现上的亲切、温和、含蓄，就吸收了魏尔伦诗的特点。\n\n（二）美国20年代初期风行一时的意象派诗歌运动。这里包括庞德、罗威尔、H.D及其他意象派诗人群。施蛰存在《现代》杂志创办不久，就译介了美国意象派三个女诗人的一组短诗。\n\n（三）20年代中崛起于欧美大陆的以T.S．艾略特为代表的现代主义诗歌潮流，以“城市诗人”著称的桑德堡也属此列。&#x8FD9;三个艺术流派和潮流，主要是经过三十年代现代派诗人之手介绍到中国诗坛，并对这个诗人群产生较大的影响。\n\n三、对于中国古典诗歌，尤其是晚唐诗歌的接受\n\n就中国古典诗歌来看，现代派诗人们在广泛的涉猎阅读的基础上，把眼光更多地注意于“一些富于情调的唐人绝句”，特别是李商隐，温庭筠、冯延已等人代表的“晚唐五代时期那些精致的冶艳的词”，更对戴望舒、何其芳、卞之琳等人的诗歌有很深的影响。这些诗人着重写自己内心的感觉和情绪，又给这种情调一种迷离惝恍的朦胧外衣，很合现代派诗人注重诗歌象征意蕴的审美情趣，也使他们从这里找到了同西方的象征派诗、意象派诗、现代主义诗歌相契合的艺术融合点。\n\n综上所述，正是在继承20世纪20年代的诗学探索，并广泛吸收中外诗歌中的有益成分的基础上，现代派诗人完成了自己独特的艺术创作。","keywords":"20世纪中国象征诗派 西方后期象征派 意象派 现代主义诗歌 晚唐诗歌","note":"30年代现代派诗歌的一大特点，便是中西方诗学的融合与联结。他们一方面广泛接触西方现代诗歌，另一方面又从中国传统诗歌中汲取营养。但同时也要注意到，现代派诗人的出现，与20年代的诗歌探索也有着密切的联系，要注意全面。相关内容可以参考孙玉石《寻找中外诗歌艺术的融汇点-中国现代派诗人的艺术探求》"},{"id":"166","stars":"★★★","title":"卞之琳诗歌创作风格是怎样的","body":"卞之琳用“小处敏感，大处茫然”来概括这个时期的自己，他“茫然”于时代风云，对艺术却高度敏感而热情，被人们称为最醉心于新诗技巧与形式的艺术家。他的诗歌创作，主要有以下特点：\n\n一、借用于现代辞藻的巧妙组合来达到古典意境的效果\n\n卞之琳在诗的技巧探求上，融会传统的意境与西方的戏剧性处境，化合传统的含蓄与西方的暗示。卞之琳的诗注意自我意识的客观化，作者的自我意识出离了中心而遁化。同时，卞之琳以暗示和象征构成隐晦的艺术境界。可以说，卞之琳在技巧上是现代的，在心灵深处依旧是古典的，他恰恰是借用于现代辞藻（尤其是某些非诗意或具体的辞藻）的巧妙组合来达到古典意境的效果，他是一个现代派的古典派：花瓣是现代的，骨子却是古典的。\n\n二、表现出一种理性之美\n\n卞之琳是中国新诗史上少有的具有自觉的哲学意识的诗人。他的诗不以社会现实的具体关注为旨归，而是从某种具象性事物生发开来，提升到哲学高度，表现出一种理性之美，卞之琳认为写诗是把生活经验中那些最深沉的感受，通过艺术过程，使之结晶升华，成为艺术品，起艺术的社会作用，他写诗时的克制、淘洗与提炼，都是循着这个倾向有意而为之的。这个倾向决定了他的诗歌创作的特征，就诗的内容说，诗作是诗人对人生体验与沉思的结晶。卞之琳贡献了一种“情境的美学”，这种情境是传统的意境与西方诗歌的小说化、戏剧化技巧相融会的结果，读者从他的诗中捕捉到的，是日常生活的场景和情境，但一经卞之琳点化，便蕴涵了丰富深长的回味和耐人咀嚼的人生哲理。其中隐含了一种将普通生活审美化的高超本领。\n\n三、基于言语本身的音乐性，讲究格律\n\n卞之琳的诗歌基于言语本身的音乐性，讲究格律，尤其是音顿、音韵和体式。他主张以顿建行，基本的主张是：以二三个单音字为主构成顿（“音组”），由一个或几个顿可以成为一个诗“行”，由几行划一或对称安排，加上或不加上脚韵安排，就可以成为一个诗“节”，一个诗节也可以独立成为一首诗，几个或许多个诗节划一或对称安排，就可以成为一首短诗或一部长诗。卞之琳自谓除了初期，除了少数自由诗，自已一直有意识地这样写诗。卞之琳以顿的参差均衡构成了诗的节奏特征，以韵的呼应变化造成诗的音响效果。繁复的韵式是卞诗的主要特点。卞诗押韵方式的多样化，还见于对阴韵、复韵及内韵的诸多讲究上。卞之琳进行了新诗史上最繁复的诗体实验，无论是写作有限制的自由诗还是规范格律诗，都依据相体裁衣原则，做到体式翻新。","keywords":"现代辞藻组合 理性之美 音乐性 讲究格律","note":"现代派诗人之中，除了戴望舒，就以卞之琳知名度最高，其《断章》更是广为流传，因此卞之琳在考查中出现也相对较多。卞之琳的诗歌首先体现出了现代派诗人的总体特征，但在此之外，又有自己的个性，如讲究格律，表现出理性之美。这部分内容，我们要注意掌握。"},{"id":"167","stars":"★★★★","title":"鲁迅杂文的意义","body":"鲁迅的杂文任何时候都是中国现实中活生生的存在，对正在进行的中国思想、文化发生作用，对现实的中国人心产生影响。它可以不断地重新发表，仍然给读者以仿佛针对当前的现实而写的感觉；它能够一遍又一遍地阅读，每读一次，都会有新的感受，新的发现，常读而常新。对以上似乎矛盾的阅读现象的进一步思考，可以发现鲁迅杂文的如下意义：\n\n一、反映着当时的时代特征，是反映中国国情和人情的范本\n\n作为一种报刊文体，杂文与现代传播有着血肉般的联系，在这个意义上，杂文是富于现代性的文体；或者说，它是现代作家、知识分子通过现代传播媒介与他所处的时代、中国以及世界的社会、思想、文化现实发生有机联系的一个重要、有效的方式。正因为杂文与“现在时”的生活有着如此密切的互动关系，它也就能够成为一个时代的忠实的记录。\n\n在一定的意义上，可以说鲁迅的杂文不仅是现代中国社会、政治、历史、法律、宗教、哲学、道德、文学、艺术，乃至经济、军事.....的“百科全书”，而且以其对中国现代国民的文化心理、行为准则、价值取向，以及民性、民情、民俗、民魂的真实、生动而深刻的描绘，成为一部活的现代中国人的“人史”。人们说，要了解中国的特别国情，就要了解创造这特别国情的中国人；而要了解中国人，莫过于细心阅读鲁迅杂文这一文献：这是有道理的。\n\n二、具备先锋性与不可重复性，具有典范意义\n\n杂文是一个未经规范化的文体，在这个意义上，它是一种无体之文。正是杂文这种“无体的自由体式”使鲁迅天马行空的思想艺术，得到淋漓尽致的发挥。鲁迅正是利用杂文的形式，发挥他不拘一格的创造力与想象力，进行他的文体试验；在这个意义上，“杂文”又确实是具有某种先锋性的。这是鲁迅终于找到的最足以发挥他的创造天才，也可以说是最适合于他的文体。正因为如此，鲁迅的杂文，就具有了某种不可重复性。鲁迅杂文的这种“个人性”其实倒是体现了“文学的现代性”的基本特征，从而具有某种典范意义。\n\n三、把我国传统的议论性散文推进到诗化、艺术化的高度\n\n鲁迅在我国传统散文理论和实践的基础上，经过十多年杂文创作的探索、实践，到了他的后期才逐渐地将传统的议论文、小品文发展成为独特形式的诗-杂感文学。鲁迅对于杂文，特意强调要有“文思”。它的真实性不一定全靠事实取得，也可以凭藉于推测、联想、想象之类而取得，即所谓“假中见真”，这便从本质意义上开拓了议论性散文诗化、艺术化的根本途径。鲁迅杂文的创作，更为有效地实践了这一艺术原则，达到了纯然诗化、艺术化的境界。鲁迅正是在极不寻常的发展中，确立了他的杂文艺术前所未有的历史地位。","keywords":"时代特征 中国国情和人情 不可重复性 典范意义 诗化、艺术化","note":"鲁迅先生的杂文在现当代仍是中国社会中活生生的“存在”，对正在发展的中国思想、文化发生作用，对现实的中国人心产生影响。读者一遍又一遍地阅读，每读一次，都会有新的感觉和发现，可谓常读常新。鲁迅的杂文是我们历年考查的一个重点，他杂文的意义在于真切的反应了当时的时代，具备先锋性和现代性，对于杂文这一文体的出现具有开创作用，同时将中国传统的议论性散文推进到了诗化、艺术化的高度。这部分内容，都需要我们去仔细掌握。"},{"id":"168","stars":"★★★","title":"鲁迅为什么钟爱杂文创作","body":"一、杂文与现代传播联系紧密，适合让鲁迅用来勾勒“中国人的灵魂”\n\n作为一种报刊文体，杂文与现代传播有着血肉般的联系，在这个意义上，杂文是富于现代性的文体；或者说，它是现代作家通过现代传播媒介与他所处的时代、中国的社会、思想、文化现实发生有机联系的一个重要、有效的方式。\n\n鲁迅正是通过杂文这种形式，自由地伸入现代生活的各个领域，迅速地接纳、反映瞬息万变的时代信息，做出政治的、社会历史的、伦理道德的、审美的评价与判断，并及时地得到生活的回响与社会的反馈。\n\n随着现代传播对人的现代生活的影响日益深刻，杂文也就真正深入到现代生活中，并成为其中一个有机组成部分。这样的作用与价值是其他非报刊文体所不可能具有的。正因为杂文与“现在时”的生活有着如此密切的互动关系，它也就能够成为一个时代的忠实的记录，鲁迅对此有着相当的自觉与自信。\n\n鲁迅曾经“想到可以择历来极其特别，而其实是代表这中国人性质之一种的人物，作一部中国的‘人史＇”，所以鲁迅特别钟爱杂文创作。\n\n二、杂文没有特定的文体，适合鲁迅发挥创造力与想象力，进行文体实验\n\n杂文是一个未经规范化的文体，在这个意义上，它是一种无体之文。“无体”固然会给它的学习、推广、再生产造成困难，却同时提供了特别大的自由创造的空间。“以为非这样写不可，就这样写”，一切出于内心自由欲念的驱动，最方便地表达自己。\n\n可以说，正是杂文这种“无体的自由体式”使鲁迅天马行空的思想艺术，得到淋漓尽致的发挥，我们看到鲁迅是那样自由地飞翔于杂文这块广阔的天地里，进行着既是现实的，又是超越性的思考，无忌地出入于文学、历史、地理、哲学、心理、民俗、人类学、政治学、文化学，以至自然科学等各门学科，无拘地表现自己的大愤怒，大憎恶，大轻蔑与大欢喜，将各种艺术形式-诗的、戏剧的、小说的、散文的、绘画的，以至音乐的熔为一炉。鲁迅正是利用杂文的形式，发挥他不拘一格的创造力与想象力，进行他的文体试验。","keywords":"现代传播 深入现代生活 未经规范的问题 创造力与想象力","note":"鲁迅钟爱杂文，与它的特点息息相关。而杂文这一文体，也经由鲁迅之手而飞速发展。杂文与现代传播联系紧密和没有特定文体的特点，有助于让鲁迅发挥特长和传达自己的思想，让鲁迅将自己的批判能力尽情地展露出来。"},{"id":"169","stars":"★★★★★","title":"鲁迅杂文的思想艺术特质（25南开大学）","body":"一、思想特质\n\n（一）批判性、否定性的特色\n\n鲁迅曾把杂文分为“社会批评”与“文明批评”两类，所强调的正是杂文的“批评（批判）”内涵与功能。鲁迅杂文所显示的“不克厥敌，战则不止”的不屈不挠的批判精神，从根本上有违于中国文化与中国士大夫知识分子的“恕道”“中庸”传统，集中地体现了鲁迅其人其文的反叛性、异质性。\n\n鲁迅以不断地批判来体现自身的价值，鲁迅在他的杂文中所达到的难以置信的批判广度，以及为人所难以接受的批判的深刻性与尖锐性，根源于“立人”的理想与彼岸关怀。看不到鲁迅杂文里的批判背后的理想，否定中的肯定，也同样难以真正接近（理解）鲁迅杂文的否定性特质。\n\n（二）在反常规的多疑思维烛照下批判的犀利与刻毒\n\n鲁迅的批判，不同于一般的思想评论，他把自己的批判锋芒始终对准人，对准人的心理与灵魂：这就是一种文学家的观照，因此，他最为关注、并且要全力揭示的，正是人们隐蔽的，甚至自身也未必完全自觉意识的心理状态。\n\n鲁迅批判的中国人的心理是人们所不想说、不便说的，鲁迅一说，就成了“刻毒”。鲁迅还提出了“推背式”的思考方法，即“正面文章反面看”，据此而写出的一些杂文，这都是深刻到了令人毛骨悚然的地步，自然也是“刻毒”。\n\n鲁迅的杂文思维也是非规范化的，他常在常规思维路线之外，另辟蹊径，别出心裁，就打开了全新的思路。鲁迅杂文的这些分析、论断，常对读者的习惯性思维构成一种挑战；但细加体味，却不能不承认其内在的深刻性与说服力。\n\n鲁迅杂文的犀利、刻毒，令人难以接受，还在于他的同样违反“常规”的联想力。鲁迅能够把外观形式上离异最远，似乎不可能有任何联系的人和事联结在一起，对“历史（过去）”与“现实（现在）”的联系具有独特感受与发现。\n\n二、艺术特质\n\n（一）“个”与“类”统一的类型化写作\n\n鲁迅杂文的取材、构思的起点都是具体的、感性的、个别的现象（“这一个”），然后将其置于时代、社会、历史的更大时空下进行剖析与开掘，以一种非凡的思想穿透力，竭力排除其个别性、具体性、特殊性，快刀斩乱麻地迅速切入本质，做出具有普遍意义的整体概括，并加以简括的名称，将“这一个”提升为“这一类”的“标本”，同时又保留着形象、具体的特征。这是鲁迅杂文的一个最根本的特点：它是一种“类型化的写作”，是“这一个”和“这一类”的统一。\n\n（二）主观性与诗性特征\n\n鲁迅杂文确是由某一外在客观人事引发的，但它所关注与表现的，却是作者自己的主观反应。因此，出现在鲁迅杂文里的人事，已不再具有纯粹的客观性，而是在过滤、折射过程中发生了变异而主观化了的，是主客体的一种新的融合。读者能够透过杂文里的描述与抒写，看到活生生的鲁迅：他的所见，所思，所感，也即他的困惑的思想，他的被损害的心理，他的激荡的情感-他的心灵的“歌哭”。读者能透过其冷峻理智的外衣感受到作者内心的火一般热烈的情感。这才是鲁迅杂文的真正的内核，鲁迅的杂文在根底上是“诗”的。\n\n（三）自由创造的杂文语言\n\n与思想的天马行空相适应，鲁迅杂文的语言也是自由无拘而极富创造力的。鲁迅是那样自如地驱遣着中国汉语的各种句式，他的杂文可以说把汉语的表意、抒情功能发挥到了极致。鲁迅好用反语、夸张，亦庄亦谐，三言两语就能画出论敌的“鬼脸”，语言简洁峭拔，充满幽默感。另一方面，鲁迅杂文的语言又是反规范的，他仿佛故意地破坏语法规则，违反常规用法，制造一种不和谐的“拗体”，以打破语言对思想的束缚，同时取得荒诞、奇峻的美学效果。\n\n鲁迅的杂文，正是集中地体现了始终没有走出奴隶时代的鲁迅的叛逆性与异质性。","keywords":"批判性、否定性 批判犀利“个”与“类”的统一 主观性 自由创造 诗与政论的结合","note":"鲁迅杂文是中国现代杂文至今无人企及的高峰。鲁迅深刻丰富的思想，热烈深沉的感情，伟大的人格和独特的个性，艺术家的才能，熔铸在杂文创作中，表现出鲜明独特的艺术个性，影响和培育了一代代杂文作者。故此，许多学校都会专门针对鲁迅杂文的创作特征进行考查。鲁迅杂文的思想艺术特征是重点中的重点，包含的内容比较广泛，被考查的频次也很高，其中每一点都有可能被拿出来单独命题，需要大家好好理解掌握。分析鲁迅杂文的艺术特征，需要注意结合鲁迅独特的思想境界。"},{"id":"170","stars":"★★★★","title":"试分析鲁迅杂文的文体特征","body":"鲁迅作为一个杰出的文体家，既表现于代表着我国小说艺术的一次巨大飞跃的中国现代小说在他手里诞生，也在他手里成熟并达到高峰；更表现于他精心培育的杂文这种新文体在中国文学和世界文学中独标一帜。鲁迅杂文的文体特征，主要表现在以下方面：\n\n一、体裁杂多而统一于杂文质\n\n研究者一般把鲁迅的小说、散文诗、回忆性散文之外的文章，统称为杂文，鲁迅一生无疑是以这样一种文体创作为主的。不过，鲁迅自身对于“杂文”就有“短评”“杂感”“杂文”三种不同的命名，我们既要重视三者之间的统一，又要认识三者之间的差异。如果从此出发，可以看到，鲁迅近20年的杂文创作，是在“短评”基础上产生“杂感”，又是在“杂感”基础上产生“杂文”的。不过，鲁迅杂文各种文体之间存在着部分固有的不同的旧质，而又都部分地获得了不同程度的新质-即鲁迅所说的：要“为现在抗争”“任意而谈，无所顾忌”，“而且生动、泼刺、有益，而且也能够移人情”-我们姑且就把这新质称为“杂文质”，于是就成了既部分地保有各种文体固有旧质又部分地获得同一新质的杂文了。\n\n所以，鲁迅的杂文是一种新文体，这种文体体裁特点是以杂感为主体的杂多体裁的统一，是杂多体裁统一于不同程度的“杂文质”。\n\n二、语言特色繁多而统一于诗化\n\n鲁迅的杂文语言以现代口语为基础，又和一般口语化的文学语言不同，对口语做了加工提高。鲁迅杂文的语言融合了西方语言和古代语言的有益成分：对西方语言主要取其句式，使包含有复杂内容的句子表达得更加周密；对古代文言中仍有生命力的词汇和语法都批判地吸收，使之变成鲁迅杂文语言的有机组成部分。这样就使鲁迅杂文语言成为以活的民众口语为基准，广采博取古代和西方语言中的有益成分，成为词汇特别丰富、语法变化多端、雅俗共赏、富于艺术表现力和东方民族风味的现代性文学语言，呈现出精炼性、抒情性、形象性、音乐性、含蓄性、哲理性和讽刺性等多方面的特色。不过，这繁多的特色都统一于“诗化”，鲁迅杂文语言的七个主要特色都是鲁迅杂文“诗化”的构成因素。\n\n所以，鲁迅杂文是散文的诗化，也是诗化的散文，鲁迅杂文语言的总特点是特色繁多而统统一于“诗化”。\n\n三、风格多样而统一于战斗性\n\n鲁迅是形成了自己独特风格的伟大作家，特别是他的杂文，尽管发表时用了种种笔名，但是看惯了鲁迅杂文者还是不难认出它们出之于鲁迅，就是因为他在中国散文中提供了一种特有的“前不见古人，而后人又绝不能追随的风格”。\n\n鲁迅杂文风格是多样性的，主要表现有如下几个方面：\n\n（一）精炼深刻，鲁迅杂文从形式到内容的整体都表现精炼深刻的特色，它精于选题，精于提炼主题，在思想内容和艺术形象上深入开掘和精心刻画，文字上苦心锤炼。\n\n（二）锋利泼辣，锋利就是尖锐，如匕首投枪，泼辣就是勇猛有魄力，嬉笑怒骂，皆成文章。\n\n（三）冷峻醇厚、冷峻即对敌人和一切丑恶的东西冷若冰霜，峻急严厉；醇厚指对师友、同志、人民的真、深、强烈的感情像诗一样浓烈，像酒一样醇厚。\n\n（四）机智幽默，鲁迅杂文所表现的机智，在中外古今作家中是罕有的，几乎没有任何题材不可用，没有任何题目不能写，且根据表现不同主题的需要，随机应变地使用各种笔法体式和语言。正由于鲁迅特有的机智，鲁迅杂文充满幽默感，鲁迅杂文的讽刺也大都成了幽默的讽刺。\n\n（五）从容婉曲，从容即驰骋自如，婉曲即婉转曲折，鲁迅杂文写得婉曲是因当时政治环境的需要，也是出于对杂文艺术价值的追求。\n\n不过，总体来看，“战斗”是鲁迅杂文的总风格，其他都是次风格，鲁迅杂文的五个次风格都是因“战斗”的这个总风格而产生的，又统一为“战斗”这个总风格服务的。因此可以说，鲁迅杂文是风格多样性的统一-统一于战斗的总风格。\n\n总之，对于鲁迅杂文的文体特点，似乎也可以用这三句话来概括：体裁杂多而统一于杂文质，语言特色繁多而统一于诗化，风格多样而统一于战斗性。\n\n［李凡关键词：体裁杂多 杂文质 语言特色繁多 诗化 风格多样 战斗性】","keywords":"","note":"在鲁迅先生创作后期，他倾注了大部分心血于杂文创作中，可以说，鲁迅先生的名字是与他的杂文紧密联系在一起的。其中，除了鲁迅杂文中深邃的思想之外，鲁迅杂文的文体特征也常会被考查。鲁迅杂文的文体特征，我们主要从体裁语言和风格三个角度进行分析。从体裁来看，鲁迅的杂文可以被分为“杂感”“短评”“杂文”等类型，不过这些体裁都统于“杂文质”之下，都是杂文；从语言上来看，鲁迅的杂文语言特色繁多，不过都统一于“诗化”这一特征之下，如讽刺性等特征都是“诗化”这一特征的因素；从风格上来看，尽管鲁迅杂文风格多样，不过都是为“战斗性”这一总的风格服务的，对于这一部分内容，我们要注意重点掌握。相关内容可以参考刘泰隆《鲁迅杂文的文体特点》，具体资料可以在李凡文学正版群中领取。"},{"id":"171","stars":"★★★★","title":"鲁迅杂文的创作历程","body":"鲁迅的杂文创作可分为以下三个时期：\n\n一、形成期\n\n从1918年鲁迅在《新青年》上发表“随感录”到1925年“女师大风潮”发生期间所写的杂文可以归入这一时期。它们大都收入《热风》《坟》两个杂文集中，这个时期正是五四新文化和新文学的倡导期。这时期的杂文多是针对带有普遍性的社会现象和思想观念而发的，其特点是就一些分散的题材解剖或针砭带有高度普遍性的思想观念。\n\n鲁迅这时期的杂文还带有形成期的明显特征：《坟》中的杂文更接近“论”，以细密的逻辑层层推进，说理充分；《热风》中的杂文更接近“感”，热情充沛，直抒胸腻，情感性的特征更为明显。\n\n二、发展期\n\n从1925年“女师大风潮”发生后到1927年国民党在一系列的血腥大屠杀中建立起自己的政权之前所创作的杂文可以归入这一时期，它们多数收在《华盖集》和《华盖集续编》两个杂文集中，这个时期鲁迅杂文的显著特征是，除继续写作形成期那种一般的社会批评和文化批评杂文外，更多的是围绕当时重大的历史事件写成的，并且有了比较集中的目标。鲁迅的思想个性和艺术个性得到了更明确的表现，这一时期，鲁迅杂文对中国国民性的解剖已经深入到了一个新的层次，鲁迅思想的尖锐性和深刻性更充分地体现了出来，超出了一般概念和口号的层次，对中国社会各种社会现象和言论的深层本质有了更直接的针砭和解剖，在艺术上，鲁迅这时期的杂文开始出现具有高度典型意义和象征意义的“叭儿狗”一类的意象，并且具有了形式多样化的特征。\n\n三、成熟期\n\n1927年以后的鲁迅杂文都可归入这一时期。这一时期的主要杂文集有《而已集》《南腔北调集》《二心集》《三闲集》《花边文学》《准风月谈》《伪自由书》《且介亭杂文》《且介亭杂文二集》《且介亭杂文末编》，之所以把1927年以后的杂文视为一个时期，有下列两个原因：一是1927年以前，由于辛亥革命之后共和政治体制在形式上的建立，鲁迅一直把思想启蒙的重点放在整个国民性的改造上。二是1927年以后，鲁迅才把杂文写作作为自己的主要创作形式。\n\n这一时期鲁迅与各种故作超然闲适的颓废骑墙派（“京派文学”“小品文”“幽默”“第三种人”“为艺术而艺术”）或依附国民党政府的“民族主义文学”进行不妥协的抗争，继续批评“国民劣根性”，批评包括左翼在内的各种堕落、伪诈、巧滑与激进幼稚病。除继续探索杂文笔法的多样化，这一时期他还引入了更加确定的议论形式，但也保留着必要的含混与沉默。因为始终执滞于具体事件，即使有意识地从既定理论立场推演开去，也随处可见智慧的余裕、反抗性和创造的冲动。总之，鲁迅后期杂文不论是在现实解剖的广阔性和丰富性上，还是在社会思想综合分析的尖锐性和深刻性上，都是对前期杂文的发展。","keywords":"题材解剖 高度普遍性 重大历史事件 更明确表现 现实解剖的广阔性和丰富性 社会思想综合分析的尖锐性和深刻性","note":"无论是在思想上还是在艺术上，鲁迅的杂文创作都经历了一个逐渐发展并走向成熟的过程，不同时期的杂文创作呈现出了不同的特色。这些变化，实际上与当时社会的变动与鲁迅个人思想的成熟是密不可分的。对于这一部分内容，我们要有所掌握。"},{"id":"172","stars":"★★★★","title":"谈谈鲁迅杂文的思想主题","body":"鲁迅杂文涉及的问题极其宽广，涵盖了现代中国人生活的各个方面，其核心是揭露现实生活中无处不在的奴役关系，大声疾呼人的自由与解放。具体来看，鲁迅杂文的思想主题，主要包括以下方面：\n\n一、直接抨击时弊\n\n在现代中国，时弊就是渗透到普通人日常生活每个角落的专制的毒液，抨击时弊的杂文矛头直指当权者的专政。鲁迅前期抨击北洋军阀政府的腐败残暴，后期抨击国民党政府的一党专政，这一类杂文涉及政治经济军事外交和意识形态各方面，尤其集矢于落后腐败的政治在所有这些领域对广大群众的精神愚弄和奴役。鲁迅并不简单地批评时政，他尽量从中华民族历史地形成的文化心理结构入手，挖掘无处不在的奴役关系的根源，以暴露当政者的用心。\n\n二、关注农民、妇女和儿童\n\n农民、妇女、儿童，是鲁迅杂文经常的谈论对象。这些人是中国式的奴役关系中最底层命运最悲惨也是无力诉说的一群。鲁迅对他们的悲惨处境寄予深厚同情，但并不居高临下地布施，更不宣扬任何意义上的弱者的道德，而是在人格平等的意义上讨论他们的问题，所以他一样冷静地解剖他们身上的弱点。无情地解剖了被压迫者灵魂上由压迫者强行植入的愚籍与奴性，才更深刻地揭露了统治者的权利结构和意识形态的毒害。鲁迅从不孤立地审视弱者，而是把他们放在整体奴役关系中考察，对弱者的认识是认识整个奴役关系的一个环节。\n\n三、解剖现代知识分子\n\n鲁迅谈论更多的是现代知识分子。他的早期杂文经常抨击遗老遗少，但很快就集矢于现代知识分子。鲁迅批评现代知识分子，着眼于他们源于传统的趋炎附势、恃强凌弱、善于瞒和骗的奴性。鲁迅批评的大都是新思想新文化的倡导者，批评他们，不同于单纯批评老中国的“旧”，而是批评新派知识分子的自我意识，批评在他们的意识中被构造的现代中国的道德和文化形象。但鲁迅并不批评现代中国知识分子所追求的价值理想，而是批评他们追求这些价值理想时的实际表现。他善于将种种言论、学说、主义、名词、口号和主体剥离，看他们实际达到怎样的道德境界。\n\n四、思考“国民性”，思考中国与世界的关系\n\n鲁迅杂文的批评对象更多并无具体年龄性别或阶级特征，而是一般的“中国人”。他无情地揭露中国人的愚、怯懦、凶残、冷漠、巧滑、懒惰、夸张、异想天开、善于宣传，但一面也竭力表扬中国人从古到今都不缺乏的“埋头苦干”和“拼命硬干”。\n\n鲁迅杂文的另一项重要内容，是思考中国和世界的关系，探索中国如何看齐世界前进大势而又不为先进文化所主宰。这种思考终其一生未尝间断。鲁迅不是静止地研究或评价国民性，而是专注于在世界文化格局中创造性地寻求改造国民性、改变中国现实文化状况的可能性-他是抱着为民族找出路的苦心写杂文的。\n\n【李凡关键词：抨击时弊 农民、妇女和儿童 现代知识分子 思考“国民性”】","keywords":"","note":"鲁迅杂文思想的核心是揭露现实中无所不在的奴役关系，疾呼人的自由与解放，因此对于当时社会中存在的奴役和压迫都有所反映，包括封建制度对人的压迫、人对人的压迫、民族之间的压迫......在这之中，他同情被压迫者，揭露讽刺施暴者，并对如何破解这些压迫奴役关系进行了深入的思考。这一部分内容，大家要注意掌握。"},{"id":"173","stars":"★★★★","title":"试分析鲁迅杂文批判性与否定性的成因","body":"鲁迅曾把杂文分为“社会批评”与“文明批评”两类，所强调的正是杂文的“批评（批判）”内涵与功能。鲁迅杂文之所以具有批判性和否定性特色，主要归结于以下几点：\n\n一、具备不屈不挠的批判精神，具有反叛性、异质性\n\n顺次翻开鲁迅十四本杂文集，就可以看到一部不停息地批判，论战，反击......的思想文化斗争的编年史，鲁迅杂文所显示的“不克厥敌，战则不止”的不屈不挠的批判精神，从根本上有违于中国文化与中国士大夫知识分子的“恕道”“中庸”传统，集中地体现了鲁迅其人其文的反叛性、异质性。\n\n因此，几乎从诞生那一天起，鲁迅的杂文就遭到否定，抗拒，以致辱骂，从当年的“刀笔吏”，“睚眦必报”，“不满于现状的批评家”，直到今日明里暗里、口诛腹诽的“鲁迅好骂人”之类：这也是从未停息的。\n\n二、通过不断地批判来体现自身的价值\n\n鲁迅是因为感同身受着中国社会的“弱者”的痛苦，而自觉地进行他的反抗的。鲁迅以不断地批判来体现自身的价值。鲁迅认为，现代知识分子与他所生活的现实世界有着一种不相容性，“批判”是他们与现实唯一的联系点，他们的基本任务就是不断揭示现实人生，社会现存思想文化的困境，以打破有关此岸世界的一切神话。\n\n三、“理想之光”照耀着鲁迅的批判，而使他的批判更广泛深入\n\n鲁迅认为，首先要争到“人的价格”，成为“真的人”，当务之急，“一要生存，二要温饱，三要发展”，苟有阻碍者全在批判之列；他认为，“争存于天下”，“首在立人”，更要求着人的个体精神独立与自由，因此他把批判的锋芒指向任何形式、任何范围的对人的奴役与压迫。并几乎在现实社会的一切方面都发现了这种奴役与压迫关系的延续与再生产，他的批判也就永无终结。\n\n可以看到，鲁迅在他的杂文中所达到的难以置信的批判广度，以及为人所难以接受的批判的深刻性与尖锐性，正是根源于“立人”的理想与彼岸关怀。看不到鲁迅杂文里的批判背后的理想，否定中的肯定，也同样难以真正接近（理解）鲁迅杂文的否定性特质。","keywords":"不屈不挠 反叛性 异质性 自身价值 个体精神独立与自由 批判广度","note":"鲁迅杂文最重要的特色就是其批判性，这一批判性来源于鲁迅，作为一位斗士，鲁迅关注“人”，反抗奴役和压迫，认为不断地批判是自身存在的意义。而杂文这一文体，正将鲁迅身上的批判精神展露的淋漓尽致，因而显示出了批判性。在考查中，许多学校都会针对鲁迅杂文这一特征出题，大家要注意一下。"},{"id":"174","stars":"★★★★","title":"为什么说鲁迅的批判是犀利而刻毒的","body":"一、揭露人的灵魂\n\n鲁迅的批判，不同于一般的思想评论，他把自己的批判锋芒始终对准人、对准人的心理与灵魂：这就是一种文学家的观照。因此，他最为关注、并且要全力揭示的，正是人们隐蔽的，甚至自身也未必完全自觉意识的心理状态。\n\n比如鲁迅的《论照相之类》不仅表现了中庸之道下的中国民族病态心理，而且反映了封建性压抑下的性变态。此种心理是人们所不想说、不便说的，鲁迅一说，就成了“刻毒”。鲁迅还提出了“推背式”的思考方法，即“正面文章反面看”，据此而写出的一些杂文，都是深刻到了令人毛骨悚然的地步，自然也是“刻毒”。\n\n二、杂文思维是非规范化的\n\n鲁迅的杂文思维也是非规范化的，他常在常规思维路线之外，另辟蹊径，别出心裁，这就打开了全新的思路。鲁迅杂文的这些分析、论断，常对读者的习惯性思维构成一种挑战；但细加体味，却不能不承认其内在的深刻性与说服力。由于鲁迅的杂文往往具有某种试验性与先锋性，读者对鲁迅杂文的接受，必有一个从陌生到逐渐熟悉、以至由衷地叹服的过程。鲁迅杂文之“难懂”，大概就在于此。\n\n三、违反“常规”的联想力，对过去与现在的联系有独特的感受与发现\n\n鲁迅杂文的犀利、刻毒，令人难以接受，还在于他的同样违反“常规”的联想力。人们最感惊异的是，鲁迅能够把外观形式上离异最远，似乎不可能有任何联系的人和事联结在一起：&#x4ED6;总是在“形”的巨大反差中发现“神”的相通。这在鲁迅的杂文中，几乎是俯拾皆是，构成了鲁迅杂文中的基本联想模式。\n\n鲁迅联想力的另一个重要方面是他对“历史”与“现实”的联系的独特感受与发现。尽管在理性层面，鲁迅和他同时代的许多知识分子一样，信奉着历史进化论，但他直接感受到的，他的心理与情感体验到因而真正刻骨铭心的，却是这老中国时间的停滞，历史的循环，与过去的重来。正是这历史的鬼魂与现实的活人的循环叠合构成了鲁迅杂文的另一个基本的联想模式。\n\n★★【李凡说：提到鲁迅的杂文，绕不开的就是他杂文的批判性。而多年以来，对于鲁迅杂文的抗拒一直没有停下，这其中的原因便在于鲁迅杂文批判的犀利与刻毒。出题时，还可能会结合某些作家的具体话语来出题，大家要好好把握。】★★","keywords":"人的心理与灵魂 杂文思维非规范式 违反“常规”的联想力 独特感受与发现","note":""},{"id":"175","stars":"★★★","title":"鲁迅的想象力有什么特点","body":"鲁迅杂文犀利、刻毒，其中一个非常重要的原因便是鲁迅违反“常规”的联想力，这主要有以下特征：\n\n一、将外观形式上似乎不可能产生联系的人和事联系在一起\n\n人们最感惊异的是，鲁迅能够把外观形式上离异最远，似乎不可能有任何联系的人和事联结在一起：他总是在“形”的巨大反差中发现“神”的相通。这在鲁迅的杂文中，几乎是俯拾皆是，构成了鲁迅杂文中的基本联想（想象）模式。\n\n例如，文人雅士的小品文“遍满小报的摊子上”，与“烟花女子，已经不能在弄堂里拉扯她的生意，只好涂脂抹粉，在夜里到马路上来”（《小品文的危机》）；“批评家”砍杀杂文的高论与孔雀翘尾巴露出的屁眼（《商贾的批评》）等等。\n\n在鲁迅的联想的两端，一端是高贵者及其殿堂，一端全是地上“最不干净的地方”。经鲁迅妙笔牵连，就达到了“神圣”（之人，之物）的“戏谑化”，“高雅”的“恶俗化”，这其实是揭示了更大的真实的。被嘲弄者（也即自命的“高贵者”）一方越不齿于此，越是仿佛被追摄其魂一般，摆脱不掉，自然视为“刻毒”之极。\n\n二、对“历史（过去）”与“现实（现在）”的联系的独特感受与发现\n\n鲁迅联想力的另一个重要方面是他对“历史（过去）”与“现实（现在）”的联系的独特感受与发现。\n\n尽管在理性层面，鲁迅和他同时代的许多知识分子一样，信奉着历史进化论，但他直接感受到的，他的心理与情感体验到的，因而真正刻骨铭心的，却是这老中国时间的停滞，历史的循环，与过去的重来。正是这历史的鬼魂与现实的活人的“循环叠合”构成了鲁迅杂文的另一个基本的联想（想象）模式。\n\n如果说前一类“把彼此不相干的事情牵连在一起”的联想给人以荒诞之感，那么，这类“新与旧、历史与现实重合”的联想，就让人感到绝望。这与人们所喜好的种种乐观主义的豪言相比，自然显得不合时宜，也是一种“怪”。","keywords":"违反“常规”“神”的相通“历史”与“现在”历史的循环","note":"鲁迅想象力的特点，主要是违反“常规”，无论是横向的“神”的想通，还是纵向的历史循环，都是一般人在正常的思维逻辑无法联系起来或发现的内容，但细细品味，又合情合理。这种形象力，以荒诞消解了崇高，暴露了历史的绝望，因而令人难以接受，这也使得鲁迅的杂文显露出犀利、刻毒。"},{"id":"176","stars":"★★★","title":"如何理解鲁迅杂文的“个”与“类”","body":"一、从具体的人与事中提取具有普遍意义的整体概括\n\n鲁迅的思维起点总是具体的、个别的人与事；他具有一种特殊的敏感，能够从所接触到的纷繁的事物中，发现具有广阔思想内涵、可供开发的人与事，以此作为他的杂文的材料；然后将其置于时代、社会、历史的更大时空下进行剖析与开掘，以一种非凡的思想穿透力，竭力排除其个别性、具体性、特殊性，快刀斩乱麻地迅速切入本质，做出具有普遍意义的整体概括，并加以简括的名称，将“这一个”提升为“这一类”的“标本”，同时又保留着形象、具体的特征，成为“个”与“类”的统一。\n\n二、是鲁迅杂文的基本艺术手段\n\n勾画“个”与“类”统一的类型形象，可以说是鲁迅杂文基本的艺术手段。“叭儿狗”之外，还有“当受着豢养，分着余炙的时候，也得装着和这贵公子并非一伙”的“二丑”；“脖子上挂着小铃铎，作为知识分子的徽章，把羊群领入屠场”\n\n的“带头羊”等等，这些杂文里类型“共名”与鲁迅小说里的形象如阿Q、祥林嫂、闰土、爱姑、狂人、孔乙己、魏连殳、吕纬甫等等一样，具有长远的艺术生命力：鲁迅早已预言，“杂文这东西”是迟早要“侵入高尚的文学楼台去的”。\n\n三、并不是对某个人的盖棺论定\n\n鲁迅的这种艺术手段也是鲁迅在进行论战时所采取的基本方法，也是最容易引起争议的。一旦成为论战的对手，特别是成为杂文的题材，鲁迅给自己规定的任务，就不是对某人做出全面评价，而是将某人一时一地的言行作为一种典型现象来加以解剖，它所采取的方法是“攻其一点，不及其余”，只抓住具有普遍意义的某一点，而有意排除了为这一点所不能包容的某人的其他个别性，特殊性，从中提炼出一种社会类型。这样，在鲁迅杂文里被指名道姓的人与事（陈源、梁实秋、林语堂等等），实际上只是一种社会类型的“代名词”，并不是对个人的“盖棺论定”，鲁迅说他的论战杂文里“没有私敌，只有公仇”，所强调的也正是这一点。","keywords":"具体的人与事 普遍意义的整体概括 基本艺术手段 社会类型","note":"鲁迅的“个”与“类”，是从具体个体身上提取普遍特性，是通过对一个具体对象的批判体现对整个社会的批判并不是对于某一个的定性，其作用大致类似于小说中的“典型人物”，大家要注意在理解的基础上进行记忆。"},{"id":"177","stars":"★★★","title":"如何理解鲁迅杂文的主观性","body":"鲁迅宣称：我的杂文“不过是，将我所遇到的，所想到的，所要说的，一任它怎样浅薄，怎样偏激，有时便都用笔写了下来.....就如悲喜时节的歌哭一般，那时无非借此来释愤抒情”。他的这种说法体现了自己杂文的主观性，而具体来说，鲁迅杂文的主观性，主要体现在以下方面：\n\n一、鲁迅杂文关注表现的是自己的主观反应\n\n鲁迅杂文确是由某一外在客观人事引发的，但它所关注与表现的，却是作者自己的主观反应。一切客观人事都是要通过鲁迅主观心灵的过滤、折射，才成为他的杂文的题材；因此，出现在鲁迅杂文里的人事，已不再具有纯粹的客观性，而是在☑过滤、折射过程中发生了变异的主观化了的，是主客体的一种新的融合。\n\n二、透过鲁迅的杂文，可以看到鲁迅的精神内核\n\n读者就能够透过杂文里的描述与抒写，看到（触摸到）活生生的鲁迅：他的所见，所思，所感，也即他的困惑的思想，他的被损害的心理，他的激荡的情感-他的心灵的“歌哭”。这才是鲁迅杂文的真正内核，鲁迅的杂文在根底上是“诗”的。鲁迅确实说过，他的杂文里有“中国大众的灵魂”；但如果看不到与“大众灵魂”叠合在一起的“鲁迅的灵魂”，至少是没有完全读懂鲁迅的杂文。\n\n以早已被读熟了的《记念刘和珍君》一文为例，人们通常注意到这篇杂文对烈士的悼念，对反动军阀与帮凶文人的揭露这都没有错；但却有意无意地忽略了文章或隐或显的感情线索：作者始终在“说话”与“不说话”之中徘徊。\n\n贯穿全文的“肯定”与“否定”的往返起伏，淋漓尽致地写出了鲁迅在“沉默”与“开口”两者间选择的困惑：这是面对屠杀应做出怎样的反应（默受与抗争）的困惑，更是人的根本生命选择的困惑。这里所显示的由“三一八”惨案引起的内心的困惑与痛苦，或许是构成了《记念刘和珍君》这篇杂文的更深层次的内蕴。\n\n鲁迅的许多杂文，都是包含有这样的更为内在的作家的主观精神（情感）的。读者如果不能进入鲁迅的精神世界，恐怕就很难领悟鲁迅杂文的神韵-这需要读者自身生命的投入，通过体味、感同身受而达到心灵的沟通。","keywords":"作者主观反应“鲁迅的灵魂”内在的作家主观精神","note":"鲁迅的杂文，熔铸着鲁迅的精神内核，体现着鲁迅对于某些客观事物的思考，因而具有主观性。这道题目，也可以用来回答“为什么说鲁迅的杂文是‘诗”的”，或根据其他作家的评论来出题，大家要灵活把握。"},{"id":"178","stars":"★★★★","title":"鲁迅的杂文在语言上有什么特点","body":"与思想的天马行空相适应，鲁迅杂文的语言也是自由无拘而极富创造力的。鲁迅的杂文语言以现代口语为基础，又和一般口语化的文学语言不同，对口语做了加工提高。另一方面，又融合了西方语言和古代语言的有益成分，这样就使鲁迅杂文语言成为以活的民众口语为基准，广采博取古代和西方语言中的有益成分，成为词汇特别丰富、语法变化多端、雅俗共赏、富于艺术表现力和东方民族风味的现代性文学语言，呈现出如下特征：\n\n一、将汉语表意、抒情的功能发挥到了极致\n\n鲁迅自如地驱遣着中国汉语的各种句式：或口语与文言句式交杂；或排比、重复句式的交叉运用；或长句与短句、陈述句与反问句的相互交错，混合着散文的朴实和骈文的华美与气势，真可谓“声情井茂”。鲁迅的杂文可以说把汉语的表意、抒情功能发挥到了极致。\n\n二、语言是反规范的\n\n鲁迅杂文的语言是反规范的，他仿佛故意地破坏语法规则，违反常规用法，制造一种不和谐的“拗体”，以打破语言对思想的束缚，同时取得荒诞、奇峻的美学效果：这都是鲁迅为表达自己对外部事物的独特反应、内心世界的“离奇和荒芜”所需要的。比如他有时将含义相反的或不相容的词组织在一起，于不合逻辑中显示深刻；有时他又随意乱用词语，所有这一切，又非事先的精心设计，而是笔到之处，自然流出；待写到兴会淋漓时，就更是无拘无忌地将诸多不相谐的语言顺手拈来，为“我”所用。\n\n三、生动形象，机智幽默\n\n鲁迅好用反语、夸张，亦庄亦谐，三言两语就能画出论敌的“鬼脸”，语言简洁峭拔，充满幽默感。他的杂文造语曲折，往往不直接得出结论，而采用比喻暗示、对比等，通过叙述描画突出事物的内在矛盾，含不尽之意于言外。鲁迅杂文常将深刻的议论诉诸生动形象的叙事与描述，不着一字，其意自彰。论辩是语言的交锋，针对对方的语言随机应变，涉笔成趣，是其惯用的技巧，又通过夸张等讽刺手法，揭示对手的逻辑与行为的荒谬之处，机锋巧设，幽默隽永。","keywords":"散文的朴实 骈文的华美 表意、抒情 不和谐的“拗体”生动形象 机智幽默","note":"鲁迅杂文的语言特点是与其思想的天马行空相匹配的，“他要用语言来表达一些语言难以表达的复杂的情感和心理，所以他常常破坏现有语言的规则、现有的修辞学，做‘语言的冒险”，创造一种非常独特的修辞、一种新的语言”。理解了这一点，就更容易去理解鲁迅杂文的语言特征了。"},{"id":"179","stars":"★★★","title":"林语堂散文创作有什么艺术特点","body":"一、大力提倡幽默\n\n早在20年代，林语堂就曾撰文将西方的humour译成“幽默”并加以提倡，《语丝》上发表的某些杂文，也有过浓厚的幽默味。林语堂在30年代创办《论语》等刊物，重新大力提倡幽默，除了作为一种美学追求，更是作为一种写作立场，一种人生姿态。林语堂也讲要面对现实，不过并非直接去干预和批判现实，也不攻击任何对象，而是站在比较超远的立场上，以戏剧“看客”的姿态，“看这偌大国家扮春香闹学的把戏”，并将文化劣根上的滑稽可笑之处写出。其中也会有讽刺批评，但更多的是“幽默”中的领悟。他认为将讽刺去其酸辣，而后达到冲淡心境，便成幽默。林语堂所追求的是对现实作冷静超远的旁观，是除去讽刺的心灵启悟。\n\n二、“以自我为中心，以闲适为格调”\n\n林语堂又主张小品文应“以自我为中心，以闲适为格调”，显然，这是针对当时主流派文艺家强调意识形态，强调文艺的社会使命的观点的。不过，林语堂的确在创造一种散文笔调，闲适是这种笔调所形成的文体特征。林语堂指明闲适笔调的小品“认读者为‘亲爱的＇故交，作文时略如良朋话旧，私房娓语。此种笔调，笔墨上极轻松，真情易于吐露，或者谈得畅快忘形，出辞乖戾，达到如西文所谓‘衣不钮扣之心境＇”。林语堂认为幽默也好，闲适也好，最终都为着解脱性灵，而广达自喜，潇洒自在，便是他所认为的小品文的本色。\n\n三、散文题材广泛庞杂\n\n30年代是林语堂散文创作的高峰期，从1932年《论语》创刊，到1936年去美国，他发表的各种文章近300篇，其中一部分收在《大荒集》和《我的话》二集中。如林语堂自评所言，他是“两脚踏东西文化，一心评宇宙文章”，他的散文题材非常庞杂，“宇宙之大，苍蝇之微”，皆可入其毫颠，几乎无所不谈。\n\n四、惯用中西比较的眼光看问题，部分作品仍然具有批判色彩\n\n林语堂国学和西学的底子都比较厚实，熟悉中西文化，后来还用中英文双语写作，他惯用中西比较的眼光看问题。他的小品文常常都是从一件具体事物谈开去，引发出对传统文化与外来文明比较冲突的许多联想。对国民性改造以及传统文化转型的思考，贯穿在他许多小品文的写作中。他的《吾国与吾民》，以他惯用的谈话体笔法，深入浅出地介绍中国的社会、历史与文化生活，包括中国民族的“德性”、老庄孔孟学说，以及中国语言、诗歌、戏曲、书法、绘画、建筑，等等。文字生动幽默，是“对外输出”中国文化的成功范例。","keywords":"提倡幽默“闲适”的笔调 题材广泛庞杂 中西比较 批判色彩","note":"林语堂的散文创作特点，离不开他对幽默的推崇，也离不开他学贯中西的经历，大家可以从这两点去切入理解。需要注意的是，无论是提倡“幽默”还是闲适的笔调，其实都是林语堂创作主张的体现，这些是他一贯的追求，显示出明显的“为艺术”的特征。相较于论述题，林语堂相关内容在名词解释中出现的频率反而更高一些，像是《论语》《宇宙风》这些杂志，就很可能在名词解释中出现，大家要关注一下。"},{"id":"180","stars":"★★★","title":"如何理解林语堂的幽默","body":"林语堂的多数小品文都追求幽默的情味，这成了他突出的艺术个性，关于林语堂的幽默，我们需要注意以下内容：\n\n一、幽默既是林语堂的美学观，也是其人生观。\n\n早在20年代，林语堂就曾撰文将西方的humour译成“幽默”并加以提倡，《语丝》上发表的某些杂文，也有过浓厚的幽默味。林语堂在30年代创办《论语》等刊物，重新大力提倡幽默，除了作为一种美学追求，更是作为一种写作立场，一种人生姿态。\n\n林语堂认为幽默是人生的一部分，人生永远充满幽默。他甚至将幽默当做一种人生与文化的普泛概念来推崇，他认为这种人生态度与美学观集中了中国文化中的一些好的东西，比如对于真诚的推崇，对于宽容的提倡，对于人类的同情与仁爱等。他从中西方文化融合的角度出发，认为幽默有两层意思：一种是日常生活中的幽默；一种是对于人生态度的认同，是一种凝聚着高级智慧与人生自觉意识的幽默。\n\n二、在面对现实时采取戏剧看客的姿态\n\n林语堂也讲要面对现实，不过并非直接去干预和批判现实，也不攻击任何对象，而是站在比较超远的立场上，以戏剧看客的姿态，“看这偌大国家扮春香闹学的把戏”，并将其文化劣根的滑稽可笑之处写出。\n\n三、注意将幽默与讽刺区分开来\n\n林语堂解释“幽默”的含义时，很注重其与讽刺的区别。在他看来，讽刺每趋于酸腐，去其酸辣，而后达到冲淡心境，便成幽默。因此，幽默必须先有深远之心境，而带一点“我佛慈悲”的念头，然后文章火气不太盛，读者得淡然之味。林语堂所追求的是对现实作冷静超远的旁观，是除去讽刺的心灵启悟，显然不同于当时左翼作家所主张的战斗的批判现实的文风。\n\n四、建立在林语堂对于中国文化的深层思考之上\n\n林语堂所提倡的幽默，既融入了他个人的生活价值观，同时也建立在他对于中国文化的深层思考之上，其中就包含着对“道学”与“正统”的叛逆。林语堂主张用幽默来消解人生的苦痛和忧虑，使人生恢复活力。\n\n五、拓展了现代散文的审美领域\n\n如果比照“五四”以来现代散文较多存在的感伤浪漫或教化的色彩，林语堂的幽默便显得从容睿智，行文结构也化板滞为轻松，变矫情为自然，从另一个方面拓展了现代散文的审美领域。","keywords":"美学追求 写作姿态 人生立场 戏剧看客 幽默与讽刺 对于中国文化的深层思考 拓展审美领域","note":"林语堂是“幽默”这个汉语词语的创作者，而幽默也是林语堂一贯的追求，体现在他的小品散文之中，所以常常会被考查到，需要我们有所了解。林语堂的幽默是他的美学追求，也是其人生观的体现，要注意其与讽刺的区别。"},{"id":"181","stars":"★★","title":"瞿秋白杂文创作具有怎样的特点","body":"左翼作家处于被国民党当局实施的文化围剿的压迫中，他们当然更看重散文的现实批判性与论战效果，作为匕首与投枪的杂文很自然成为他们首选的文体，而瞿秋白是一个典型的代表。瞿秋白的杂文创作，主要具备如下特征：\n\n一、思想内容\n\n瞿秋白的杂文多收在《乱弹及其他》一书中，他的杂文主要包括四种主题：第一、深刻揭露了国民党的反动统治。第二、无情揭露了帝国主义的强盗本质。第三、彻底揭穿了胡适等资产阶级反动文人的无耻嘴脸。第四、热情歌颂了光明和未来。\n\n总之，暴露黑暗和歌颂光明是瞿秋白杂文的鲜明主题，有着积极的战斗作用。这种战斗，既是说理的，又是形象的，显示了杂文的特殊功能。\n\n二、艺术特征\n\n（一）深受鲁迅影响\n\n瞿秋白的十几篇杂文，被鲁迅收入自己的集子《伪自由书》《南腔北调集》和《准风月谈》中，读者竟不能加以区分。这足可证明鲁迅对瞿秋白创作的巨大影响。以瞿秋白为代表的这些作家杂文的风格特色是可以用“鲁迅风”加以概括的。\n\n（二）尖锐的政论色彩\n\n瞿秋白的《＜鲁迅杂感选集＞序言》是一篇较早运用马克思主义阶级分析观点研究鲁迅的经典文献，其对杂文的见解也表露其间。他的杂文多是社会批评和文艺杂感，用阶级分析观点抨击政敌，批判各种腐败的文艺现象，具有尖锐的政论色彩。《民族的灵魂》《流氓尼德》《财神的神通》《美国的真正悲剧》，都是产生过较大反响的篇目。\n\n（三）善于抓住本质，勾勒典型，但有其局限性\n\n和鲁迅一样，瞿秋白的杂文善于抓住本质，勾勒典型，但对非左翼作家的某些苛刻认识，以及对唯物辩证法创作方法的倡导等，留有“左”倾路线的余痕，某些篇章未免失之褊急。\n\n（四）善于创造新的杂文形式\n\n瞿秋白的才气表现在善于创造新的杂文形式上，他把中国的杂剧、诗词、寓言和民歌等融入进去，又注意普通话与方言的融合运用，十分具有独创性。","keywords":"“鲁迅风”政论色彩 抓住本质 新的杂文形式","note":"三十年代左翼作家看重散文的现实批判性，所以多用杂文，又深受鲁迅影响，瞿秋白是一个典型代表。从瞿秋白身上，可以看到鲁迅对当时左翼作家的影响，故此大家需要对相关内容有所了解。"},{"id":"182","stars":"★★★","title":"京派散文有什么特点","body":"一、对纯正的散文艺术趣味都抱有虔诚的态度\n\n京派散文家何其芳给自己提出的任务是“为抒情的散文发现一个新的园地”。他这样表达着自己的追求：“我企图以很少的文字制造出一种情调：有时叙述着一个可以引起许多想象的小故事，有时是一阵伴着深思的情感的波动。......我追求着纯粹的柔和，纯粹的美丽。”在各种文体互相渗透，而散文日益朝“叙事化”和“说理化”方向发展的1930年代，何其芳的上述自觉追求具有独树一帜的意义，基本上可以代表京派散文的艺术追求。\n\n二、比较注重对散文文体创造的追求\n\n京派散文比较注重对散文文体的创作，比如何其芳的散文常采用“独语”的调式，爱在黄昏的灯光下吟哦孤独与寂寞，探索内心的矛盾冲突。类似这样带有“梦中道路的迷离”感觉的美丽的叙说，自然是年轻人所喜欢的。在他的散文中，这种“独语”又多表现为一种感觉结构，将浸透着感觉汁液的朦胧的意象拼贴与组合，组成美丽的心灵感验世界。所以他写的散文多有冥思，意象扑朔迷离，想象奇特，诗情洋溢。\n\n又如吴伯箫写散文讲求炼句，句式的长短偶奇，错落有致，形成特有的节律韵调，他曾想创一种文体：小说的生活题材，诗的语言感情，散文的篇幅结构。这追求自然不同于何其芳，但热衷于文体的完备与创造，却是颇能反映北方青年散文作者群的创作意识的。\n\n三、致力于抒情散文探索\n\n京派散文致力于抒情散文的探索，而这又以师陀和沈从文最具代表性。师陀写出散文集《黄花苔》、《江湖集》，哀叹北方山野的凋零。接触到的社会问题，并不能明晰地加以反映，却构成哀婉的田园诗风味。作者对各式小人物的同情，使人在灰暗中感到些许的温热。\n\n京派代表作家沈从文的散文和他的小说一样，有独特的成就。《湘行散记》这部散文集，记录了他的故乡湘西特异的山水景致和风土人情。他以乡村中国的眼光表现普通人的命运和质朴的生命形式，较多地继承了中国古代游记与笔记的传统，能够简练流畅地写景叙事，穿插着对往昔的追忆，平和之中自有其动人处。","keywords":"纯正的散文艺术 散文文体创造 抒情散文探索","note":"京派散文作家风格各不相同，但具有相似的创作追求，所以被归纳到一起。京派散文追求纯正的艺术，注重文体创造，注重抒情散文，与30年代注重叙事和说理的散文作出了明显的区分。具体分析时，可以结合具体作家作品进行。"},{"id":"183","stars":"★★★","title":"何其芳散文创作有什么特点","body":"一、追求散文的抒情性\n\n何其芳不满意“五四”以来散文的状况，认为除了说理、讽刺的作品之外，抒情多半流于身边琐事的叙述和个人遭遇的感伤的告白，散文创作的形式感不强。他给自己提出的任务是“为抒情的散文发现一个新的园地”。他这样表达着自己的追求：“我企图以很少的文字制造出一种情调：有时叙述着一个可以引起许多想象的小故事，有时是一阵伴着深思的情感的波\n\n动。．....．我追求着纯粹的柔和，纯粹的美丽。”在各种文体互相渗透，而散文日益朝“叙事化”和“说理化”方向发展的30年代，何其芳的上述自觉追求具有独树一帜的意义。\n\n二、“独语”的调式\n\n何其芳的散文常采用“独语”的调式，爱在黄昏的灯光下吟哦孤独与寂寞，探索内心的矛盾冲突。类似这样带有“梦中道路的迷离”感觉的美丽的叙说，自然是年轻人所喜欢的。这种“独语”又多表现为一种感觉结构，将浸透着感觉汁液的朦胧的意象拼贴与组合，组成美丽的心灵感验世界。所以他写的散文多有冥思，意象扑朔迷离，想象奇特，诗情洋溢。“他用一切来装潢，然而一紫一金，无不带有他情感的图记。这恰似一块浮雕，光彩匀停，凹凸得宜。由他的智慧安排成功一种特殊的境界。”\n\n三、追求艺术的形式美\n\n何其芳不满社会，又不愿画出现实的丑恶形体，便到艺术的形式美中去寻找颜色、图案、梦幻、暗示、想象、比喻、典故，堆砌起思想和哲理的碎片，纤弱的感情，雾般的朦胧，文字是绚丽和缠绵的，集合了晚唐五代诗词及外国印象派的艺术之美。何其芳努力使散文成为精致的艺术品，力矫散漫浅露的流弊，但有时雕琢过分，有伤自然。\n\n四、后期散文日趋朴素自然\n\n何其芳在与故乡现实有了较多接触后，闯出了个人的圈子，思想与艺术见解发生剧变。《还乡杂记》集里的《老人》《街》，记录了人民的深重苦难。作家自己也不无惊讶地发现：“我的感情粗起来了。”从此再也没有了精致之作。抗战以后，他与沙汀、卞之琳一起赴延安，走上了革命道路。其后何其芳的散文虽不再有雕琢的痕迹，日趋朴素自然，却也不像《画梦录》那样富有艺术的独创性了。","keywords":"散文抒情性“独语”艺术的形式美 朴素自然","note":"何其芳是京派散文的代表作家，他的艺术特点很能代表京派作家的共同特点，不过，在京派散文共同追求的基础上，何其芳采用了“独语”的调式，后期日趋朴素，是又是其个性所在。大家可以将两者结合起来记忆。这里要提醒大家的是，何其芳的《画梦录》是十分重要的一个名词解释，很多高校在考查时都会关注这一知识点，大家要多准备一下。"},{"id":"184","stars":"★","title":"开明派散文有何特征","body":"一、把文学教育作为写作目标之一\n\n散文小品因适于传授写作技能，为学生学习写文章提供范文，所以在中、小学语文教学中历来受重视。文学教育也历来是文化素质教育的重要方面，有相当多的现代作家都当过中、小学教员，很自觉地把文学教育作为写作的目标之一。可称为“开明派”的一支散文作家队伍，便在这方面显得突出。\n\n二、讲究品格、气节和操守，与政治往往保持一定的距离\n\n开明派散文家大都是上海立达学园的同事，30年代又聚集在开明书店周围，有丰子恺、夏丏尊、叶圣陶诸先生。他们品格高尚，但很少参与到政治之中去。\n\n三、把写散文作为一种思索方式\n\n开明派散文几乎都乐于把写散文作为一种思索方式，因此多重理念，讲究结构的叙事与议论结合的语式，许多作品的拟想读者就是青少年学生。\n\n丰子恺只用平常的字词，务求明白，不喜欢装修粉饰，他的文字有一种朴讷而又明亮的味道。\n\n叶圣陶主要写小说，偶尔也写散文，本时期的散文多收在《未厌居习作》中，抒写却保持他一贯的平实，状物写人都针缕绵密，无一冗词。他的一些作品常作中学生习作的轨范。\n\n夏丏尊是丰子恺的老师，散文只一本《平屋杂文》，多写身边琐事，素淡的文笔中常溢出遐想与情思，也很注重篇章结构，常用得缜密完整，属于功力派一路。\n\n四、在平凡中开掘哲理\n\n开明派作家所作散文常常能于平凡中开掘哲理，比如丰子恺创作风格体物入微，在真朴琐屑之中饱含情理，于细微处发现宏旨精义，而且处处浸润着作者那疏淡隽逸的人格调子。\n\n开明派文人的精神与他们身上流淌的江南文化的血液有着密切关系。注重个人的精神趣味、追求生活的艺术质地的江南文人生活方式，深刻地介入和规定了开明派文人的社会存在方式。以与现实政治保持距离的退守姿态为自己换取心灵和艺术生存空间，这种中和的文化态度保证了他们精神世界的丰富完整。\n\n【李凡关键词：文学教育 与政治保持距离 思索方式 平凡中开掘哲理】\n\n【李凡说：开明派散文家多为老师，品格高尚，较少参与政治，其代表作家为丰子恺、叶圣陶和夏丏尊。联系这些人的散文创作特征，就大致可以明确这一流派的整体创作特征了。大家可以从这个角度去切入理解。开明派这一概念也有可能在名词解释中出现，大家要留意一下。】","keywords":"","note":""},{"id":"185","stars":"★★★★★","title":"试分析《雷雨》中的雷雨意象","body":"现实人类的生存状况激活了曹禺无意识深处的雷雨原型，才促使他创作出了《雷雨》这部经典剧作。而《雷雨》所传达出的关于雷雨的多层意蕴，触及了人们灵魂中的某些根本的东西，也委婉曲折地表达了曹禺对现实社会人类生存境界的深情关注，从而使《雷雨》产生了不朽的艺术魅力\n\n一、雷雨意象的表现\n\n从总体上看，《雷雨》对雷雨意象的描绘与塑造主要通过以下几方面体现出来：\n\n（一）多方面展示了雷雨到来之前的特有氛围。有时是对天气的直接刻画，有时则是以人物的动作、行为、语言来侧面表现这种氛围。在《雷雨》第一幕，雷雨虽然没有出现，但到处弥漫着雷雨前的特有气息-郁热、潮湿，没有一丝风。在这样的自然环境里，人人都感到郁热、烦躁，焦灼不安。与郁热的雷雨前氛围相一致的是众人烦躁的情绪。第二幕的结尾是一场雷雨的降临，但此前依然是比第一幕更加压抑的雷雨前景象。第三幕的开始依然是更加郁热的气氛。至此，雷雨意象已经是“未见其人，先闻其声”地占据了人们的心田。\n\n（二）从光与声两方面描绘雷雨的强大声势，强化雷雨意象的特征。雷雨在剧中真正出现是在第二幕的结尾，曹禺以传神的手法，通过对雷雨光与声的描绘展示它的威势和神韵。第三幕的开始，雷雨开始声色俱厉地近距离出现在人们面前。直到第三幕结束，暴风雨的声音压倒了一切。而进入第四幕，“外面还隐隐滚着雷，雨声淅沥可闻”“除了偶尔天空闪过一片耀目的电光，蓝森森的看见树同电线杆，一瞬又是黑漆漆的”。接下来，仆人、繁漪、四风、侍萍接连从外面的雨地里走来，以浑身雨水淋漓的形象显示了外面大雨滂沱的情形。\n\n（三）随着剧情的逐渐推进，写出了雷雨由远及近、由弱到强、渐行渐进的到来过程。在第一幕里，渲染的只是雷雨前的闷热气氛。第二幕，闷热加剧，风声骤起，闪电出现，结尾后悄然降下一场热雨。第三幕，空气依然郁热闷人，更大的一场雨正在酝酿中，其后雷声渐起，愈来愈强，直至幕落，风雨裹着闪电雷声铺天盖地而来。第四幕，闪电雷声不断，大雨倾污如注，冲倒了厂房，淹没了河沟。在此过程中，三死两疯的悲剧达到了高潮。\n\n二、雷雨意象的深层意蕴\n\n受古代一系列关于雷雨击杀罪恶之人经验的影响，曹禺在用雷雨意象烘托人物、渲染气氛的同时，更重要地表达了剧中人物罪的意识、灵魂的审视和救赎意识。\n\n（一）用雷雨前的气氛表达人物罪的意识。由于对雷雨怀着强烈的崇拜与敬畏之情，面对它的到来，身负罪过的人都会产生罪的意识。在《雷雨》中，雷雨意象的构成首先是雷雨之前的闷热、潮湿、几乎令人窒息的气氛。此时，剧中人物罪的意识主要通过焦虑的情绪体现出来。从心理学上看，人的焦虑情绪的产生主要是由于罪的意识和救赎的困难。在《雷雨》第一幕及第二幕雷雨来临之前的郁热气氛里，主要人物几乎都处在焦虑的情绪之中，而焦虑的原因也几乎都源于罪的意识。曹禺用雷雨前特有的气氛，表达了剧中人物罪的意识。\n\n（二）在阵阵雷声和闪电里表现人物灵魂的自我审视。基于雷电会惩恶扬善、击杀罪恶之人的观念，面对着越来越响的雷声、越来越近的雷雨，《雷雨》中的人物不自觉地进行自我灵魂的审视。其中周萍的表现最为明显。\n\n（三）在雷雨之中展现人物的救赎意识。救赎意识体现在侍萍和周朴园身上是罪过的担当和补偿。在雷雨滂沱的环境中，周朴园最后去掉了所有的伪装，他真诚地说要给予侍萍补偿。而周萍与四风的救赎意识则体现在了自杀的行为上，他们以自我毁灭的方式，救赎自己也救赎他人。鲁大海面对家庭中让他极度痛苦的罪恶，他选择了出走，远离家人，远离故土，自我放逐，在自我放逐中救赎亲人的罪恶。","keywords":"特有氛围 光与声 强大声势 到来过程 深层意蕴 罪的意识 自我审视 救赎意识","note":"《雷雨》这个剧本叫做“雷雨”，而“雷雨”又一直贯穿在全剧，在全剧的一开始便告诉观众要有一场大雨，实际上确实一直到最后一场，雷雨才下来。剧本发展的过程也就是一个雷雨爆发的过程。因此，对于“雷雨”这一意象，我们要仔细分析。相关内容可以参考杨敏《＜雷雨＞中的“雷雨”意象及其原型分析》，具体资料可以在李凡文学正版群中领取。"},{"id":"186","stars":"★★★★★","title":"《雷雨》的艺术特色是怎样的","body":"一、严谨的戏剧结构和强烈的戏剧冲突\n\n《雷雨》深刻的思想性和高超的艺术性是通过严谨的戏剧结构和强烈的戏剧冲突来表现的。全剧符合“三一律”的结构方式，将30年的时间浓缩到一天，空间集中于两个舞台背景来展现。剧中两个家庭分别代表了不同层面的社会现实以及不同层次的人物关系。两家贯穿30年的恩怨纠葛也几乎囊括了当时中国各种尖锐复杂的社会矛盾和思想矛盾。纵观全剧，8个人物之间无一不有冲突，共同构织成错综复杂的“冲突网络”，推动情节发展，使剧情波澜起伏、张弛有致。另外，剧作家采用“回溯法”的方式，从“现在”的矛盾上溯到30年前的恩怨。流畅的情节线索和交织的矛盾冲突网络，大大加强了剧作的思想艺术容量，加之渗透在作品中的紧张、郁闷的内在情感基调，将全剧凝聚成一个牢固的整体，更能产生震撼人心的艺术效果。\n\n二、浓烈、明丽、精确传神而又极富个性化的语言\n\n《雷雨》中不同的人物有不同的语言特色，人物语言的个性化不仅符合人物特定的身份地位，而且能最大限度地体现出人物的心理和情感特征。作者根据人物的地位、心理乃至所处的说话场合以及环境气氛的不同而为人物设定不同的语句词汇、语调节奏，表现出语言的个性化。这一点在周朴园的身上表现得最突出。同时，作者善于把握并写出不同特色的语言，讲究语言的动作性和抒情性，即在人物语言中寄寓着人物内心的思想感情和意象，形成丰富的潜台词，通过充满暗示性的潜台词来渲染奇特的舞台气氛，达到一种出其不意的戏剧效果。\n\n三、追求戏剧的诗意\n\n曹禺曾将创作《雷雨》比喻成“写一首诗”。作者雷雨般的热情与雷雨这一自然意象浑然一体，形成完整的情景交融的诗意境界。而富有诗意的人物及语言也增强了全剧的诗意。“雷雨”是贯穿全剧最重要的象征意象，是家庭和社会郁闷烦躁的环境气氛的象征，是促使家庭矛盾一触即发，预示着封建家庭即将崩溃的力量的象征，是对宇宙和人物命运隐秘的恐惧的象征，反映了剧中人物的宿命感，也反应了作者对命运问题的探寻。\n\n四、富有个性的典型人物\n\n《雷雨》中的人物形象，无论主次都具有充满矛盾的性格和错综复杂的情感，人物性格既鲜明而又不是单一固定的，在发展流变中不断得到加强和突出。而且人物命运充实生动，底蕴深厚。毫不夸张地说，《雷雨》中的八个人物，每个人都可独自成戏。《雷雨》中的人物，外部动作性很强，内心矛盾冲突尤其强烈，人物对话的潜台词十分丰富，情绪起伏强烈激荡，给人以一种躁动不安、压抑窒息的感觉。其中最具代表性的便是周朴园与蘩漪。\n\n周朴园是带有封建性质的资产阶级代表人物，是一切悲剧的元凶。他专横暴戾，冷酷无情地压制、摧毁家中一切人的个性、尊严和自由思想。\n\n蘩漪是一个鲜明独特、复杂而富有深度的艺术形象。她的性格抑郁乖戾、热情强悍、极端而尖锐。剧中蘩漪的反抗是极端的，在《雷雨》中她最具有“雷雨”的性格。\n\n【李凡关键词：严谨的戏剧结构 强烈的戏剧冲突 语言个性 戏剧的诗意 典型人物】\n\n【李凡&#x8BF4;：《雷雨》是曹禺的代表作，也是宣告着中国现代话剧成熟的一部标志性作品，在文学史上的意义不言而喻。在考查之中，戏剧部分整体考查频率不如小说等体裁，但凡考查戏剧相关内容，多数情况下会考查曹禺；而考查曹禺，又往往会涉及《雷雨》。《雷雨》的艺术特色，主要从结构、语言、人物以及风格四个角度，结合作品具体分析，这其中一些比较关键的概念，比如“三一律”“雷雨”意象等都要有所体现，大家要好好把握。这里需要注意的是，《雷雨》本身以及其中主要的人物形象，如周朴园、蘩漪等都是在名词解释中高频出现的内容，大家要注意一下。】","keywords":"","note":""},{"id":"187","stars":"★★★★","title":"《雷雨》中人物的生存困境（25广西师范大学）","body":"现代人生存的生存困境，使现代人长期处于焦虑之中，它包含了各种剧烈的感情、焦虑、孤独，无法言语的绝望等等。《雷雨》正是对那些挣扎在情感信念及现实冲突生存困境中的现代人内心灵魂的图解，这主要表现在以下方面：\n\n一、两种文化观念背景下，个人情感和意志的两难选择\n\n《雷雨》中的人物生活在封建文化和资产阶级文化的夹缝中，他们的思想观念，文化背景，或多或少受到了传统封建文化的熏陶浸淫，在他们的思想深处，有着深刻的封建道德观念，同时，因为处在资产阶级新兴发展阶段，人们受到资产阶级自由民主等社会新思想的冲击或外界不断变化的现实的影响，被压抑的人性欲望被唤醒，“原始的情绪”和“蛮性的冲动”被激发，个人情感意志产生了强烈的表达冲动，处在这样两种不同文化观念的纠葛之中，人们的情感和意志常常处于两难。\n\n比如说周朴园，就深受封建文化和资产阶级思想的影响。少年时，曾像周冲一样对社会有过美好的梦想，对生活充满憧憬，青年时期，他如周萍一般听任自己的“原始的情绪”和“蛮性的冲动”，违背封建道德，然而，随着年龄的增长，社会阅历的丰富，他自觉屈从封建文化，竭力维护封建秩序，甚至不惜让自己的亲人在窒息的空气中生活。第四幕，当他被迫让周萍与鲁侍萍相认时的一番话语及表演，是周朴园主观内心世界的真情告白，更是他对封建道德伦理秩序和资产阶级金钱至上这两种文化的认同与选择。可这样的选择终究是痛苦的，因此，在这个暴风雨来临的晚上，周朴园陡然感觉自己老了，雷雨过后，当家人或死或疯或出走，只留下周朴园独自一人，他陷入了难以名状的忧郁痛苦之中，最后只好求助于圣经，以求得内心的沉静。\n\n二、欲望追求过程中的绝望挣扎\n\n个人欲望追求与社会道德的不调和，使得现代人在追求个人欲望时遇到重重阻碍而陷入无边的苦闷之中，这也就决定了蘩漪、周萍和四凤的个人追求一定是绝望的挣扎，他们只能以悲剧收场。这其中，蘩漪的悲剧更为典型。\n\n蘩漪是《雷雨》中最具有雷雨性格的人，是以大胆追求爱情和个性解放的资产阶级新女性形象出现的，生命的本能欲求迫使她勇敢地走上了封建叛逆者之路，然而她的反抗与叛逆注定了是不可能彻底的，她为了拯救自己，竟不惜向周萍提出“不，不，你带我走......要把四凤接来一块住，我都可以”这样屈辱的要求，蘩漪对封建道德的叛逆终究还是逃不脱封建文化场的束缚，蘩漪的个人欲望追求最终换来的只可能是更为荒唐的结果和悲剧的结局，最后她的绝望挣扎使她愈加忧郁阴鸷并终于崩溃。\n\n三、理想信念与现实的不可调和\n\n从周冲、周萍到周朴园，曹禺展示的实际上是一个现代人的“成长”轨迹：少年时有所谓的理想却往往和现实有着不可调和的矛盾，只能是空想，在现实面前不堪一击，被摧毁轻而易举，这种理想的追求是自发的不是自觉的，理想的翅膀被折断后，则畏缩不前向社会妥协，这是对社会现实的被迫屈从。\n\n青年时期，蛮性欲望带来的冲动与热可以驱使人一度听凭感情发展，不顾一切做出不合社会道德规范和文化秩序的事情来，但是这种热并不能长久维持，等热劲过去，理智恢复，重新回到现实文化场中，衡量利益得失与发展前程，他会主动屈从社会道德和文化秩序规范，犹如化蛹为蝶，虽然痛苦，却是主动追求的一次蜕变，是对社会道德和文化秩序的本质上的认同。\n\n到了中年时期，有家有业，就追求稳定，稳定的前提是秩序的保证，权势地位与金钱是秩序保证的有力武器，于是，彻底放下自己曾经的理想信念，自觉压抑自己的情感欲望，甚至不惜牺牲亲情，尽力去维护社会道德秩序，对社会道德和文化秩序的屈从认同也升级为坚决彻底的捍卫者。\n\n周朴园和周萍也都曾经和周冲一样，对社会充满憧憬，然而现实文化场却使他们的理想逐渐被消解，甚至成为封建道德\n\n文化的维护者、捍卫者。可以推测，如果周冲不死，理想与现实的不可调和的现实，必将驱使他重蹈父兄的覆辙。","keywords":"两种文化观念 情感和意志的两难选择 封建道德观念 原始的情绪 蛮性的冲动 欲望追求 绝望挣扎 理想信念与现实 不可调和","note":"对于《雷雨》中的生存困境，其实在钱理群版《中国现代文学三十年》中已经有过讨论，不过课本上的内容写得较为抽象晦涩，理解起来很不容易，这部分呢相当于是将其简单直白的表现出来。大家在理解这部分内容时，可以结合剧本中的人物进行分析。相关内容可以参考傅红英《挣扎在现实生存困境中的现代灵魂-（雷雨）深层语码解读》，具体论文可以在李凡文学正版群中领取。"},{"id":"188","stars":"★★★","title":"《雷雨》中蘩漪的形象是怎样的（25云南大学）","body":"一、蘩漪是追求自由和幸福的新女性形象\n\n蘩漪是位资产阶级家庭出身的小姐，受过五四新思潮的影响，她任性、傲慢，追求着人格独立、个性自由和爱情幸福。她有着火炽的热情，一颗强悍的心，敢于冲破一切的桎梏，她爱起你来像一团火，那样热烈，恨起你来也会像一团火，把你烧毁。然而，十八年孤苦空虚在周家窒息的生活，把她渐渐地变成了石头一样的死人。只有大少爷周萍闯入她的生活圈子后，才点燃了她的热情，复活了她的生机。她就死死抓住这根救命稻草不放。蘩漪与周萍的乱伦关系既是她对爱情的追求，也是对周朴园专制统治的一种变态的畸形的反抗。\n\n二、蘩漪是具有雷雨性格的女性\n\n蘩漪在难以抗拒的令人窒息的环境中走上变态和极端的道路：爱变成恨，倔强变成疯狂，她要报复周家父子对她的欺骗、玩弄和侮辱。蘩漪对周朴园的专横自是、冷酷虚伪的丑恶本质以及周家的种种罪恶，进行了淋漓尽致的揭露。蘩漪对周朴园的反抗，从消极到积极，从被动到主动，从退守到进攻，愈演愈烈。\n\n三、蒙漪建立在利己主义、个人主义基础上的反抗是有限的、不能持久的\n\n蘩漪性格中有阴暗、脆弱、自私的一面。她在破坏这个罪恶家庭时，也在破坏别人的幸福；她在追求爱情自由时，也损害着别人的爱情自由。这个敢爱敢恨的女人在追求解放和幸福的时候，将自己和别人都带入了毁灭的境地，不免带有极端个人主义的思想弊病。以玉石俱焚的决绝试图去冲破庞大的封建道德网络，固然洋溢着不可思议的勇气和果敢，但无谓的牺牲多少带有点苍白的病态。为了达到自己的目的，她不惜牺牲别人的一切。不过，她是周、鲁两家家庭悲剧的推动者而不是制造者，她的悲惨遭遇是值得同情和怜悯的。\n\n蘩漪的挣扎与抗争，正是追求个性的人同封建专制展开的生死搏斗。剧作在倔强和脆弱、疯狂和清醒、冲动和冷静等矛盾的统一中凸显繁漪内心深处的挣扎，使得这一形象既有光彩照人的性格魅力，又深含着令人同情的因素，从而也使她最后燃烧自己毁灭他人的悲剧具有了更强烈的审美震撼力。\n\n【李凡关键词：追求自由和幸福 雷雨性格 利己主义 个人主义】","keywords":"","note":"曹禺关注苦难中的女性，塑造了一系列身处黑暗与苦难之中的女性形象，而其中又以蘩漪最具有代表性。这是一个受“五四”思潮影响，追求自由和幸福，但又因为自由和幸福不可得而逐渐扭曲的一个女性形象。这一形象让大家不由得联想到了美狄亚，二者在很大程度上有相似之处。"},{"id":"189","stars":"★★★","title":"《雷雨》中周朴园是一个怎样的形象","body":"周朴园是父权文化的代言人，是典型的封建大家长形象。周朴园早年有资产阶级自由平等思想，在经历婚姻失败后又转向封建专制思想，成为父权文化的代言人。他的这种性格特征，主要是通过他与侍萍、蘩漪两位女性人物的关系表现出来的。\n\n一、复杂的男性权威形象\n\n周朴园和侍萍的结合，最初是建立在对侍萍侍女身份的理解和尊重上的，他冲破了家庭的阻力，并拥有一段美好的爱情回忆。然而在面对家庭和商业利益双重压力时，周朴园抛弃侍萍。多年之后，周朴园在与侍萍相遇时，又迅速显示出封建大家长的嘴脸。\n\n二、专制残暴\n\n周朴园用“存天理灭人欲”的宗教天条武装着头脑，他坚信自己的家庭是“最圆满、最有秩序的家庭”，自己教养出来的子弟是“健全的子弟”，也正是为了维护自己心中“最圆满、最有秩序的家庭”，他才会置妻子蘩漪的情感于不顾，极为残忍冷酷地实施“存天理灭人欲”的诛心之术。从“喝药”这一幕中，就能体现出其专制暴君的形象。具有“雷雨”性格的\n\n蘩漪不愿吃药，周朴园的体贴和关心完全是为了使蘩漪成为服从的榜样、受命的奴隶。他炮制人生的苦药，并用爱当作借口威逼蘩漪喝下去，显示了对妻子无上的统治权力。\n\n三、自私、冷漠中还残留着一丝人性\n\n周朴园出生于周公馆，是周家的少爷。当时的环境和他的成长经历，使他成了一个狡诈、冷漠、自私、专制的人。无论是在家庭还是在公司中，他都极力维护自己的利益，不会真心实意地对待任何人。但周朴园毕竟是一个人，面对曾经的恋人，面对自己的儿女，他有时也会流露出那么一丝关切。只是这种关切是那么的微不足道，转眼就会被他的狭隘和冷酷“吞没”。\n\n总之，周朴园是《雷雨》中的中心人物，这样一个典型具有复杂性格的封建大家长人物形象的成功塑造，显示出了曹禺高超的剧作水平。","keywords":"封建大家长 男性权威 专制残暴","note":"周朴园是《雷雨》中塑造的最成功的男性形象，是一个典型的封建大家长形象。在考查时，可能会让他与高老太爷这样同样是封建大家长的形象进行对比，不过相较于高老太爷，周朴园的形象整体更复杂一些，大家可以比较记忆。"},{"id":"190","stars":"★★★★","title":"《日出》的艺术特色和《雷雨》相比有什么发展","body":"一、艺术构思的突破\n\n《雷雨》采用不少惊心动魄的场景，展开尖锐复杂的矛盾冲突；《日出》不再追求精心构筑的故事，注重展现日常生活，关注与表现的中心由传奇变态转向平凡常态。同时，又借鉴了契诃夫“横断面的描写”方法，剧本没有完整的故事情节，没有对人物身世的详细描述，只是将“有余者”和“不足者”中人生零碎与分散的现象结合，充分展现了富人的奢侈腐败及穷人的穷困潦倒。\n\n二、写作技巧方面的突破\n\n《雷雨》主要由几个主要人物分别出场，将爱恨情仇交织，以展现家庭悲剧的深度。而《日出》则不再集中于几个人身上，以交际花陈白露与其旧友方达生为全剧的穿线人物，借鉴印象派绘画的散点技法，用片段的方法，用多少人生的零碎来阐明一个观念。\n\n同时，戏剧的场景由家庭移向社会，以陈白露寄居的高级大旅馆与小东西身陷的三等妓院来展现现代大都市，由他们联结了腐朽没落的上层社会和受侮辱损害的下层社会，让“有余”和“不足”两个世界交错展现，使得读者看到半殖民地半封建都市社会生活的全貌。由此揭示和鞭挞都市社会的丑恶与腐朽的本质，控诉剥削人的不合理社会，表达作者对现代都市所奉行的“损不足以奉有余”的“人之道”的抗争，暗示“一个伟大的未来即将来临”的光明前景。\n\n三、外来艺术的借鉴方面的突破\n\n《雷雨》作为“五四”后出现的第一部多幕话剧，以“五四”前后的社会为背景，通过家庭纠纷和劳资冲突揭露出以周朴园为代表的带有浓厚封建性的资产阶级家庭的罪恶及其必然崩溃的命运。在结构上借鉴了希腊悲剧家的“回溯法”，与易卜生的《群鬼》多有相似之处；此后曹禺在《日出》中，有感于《雷雨》太过戏剧化而决定舍弃矛盾集中的方法，尝试以观念连接全剧结构，采用非整体渗透而是以片段的方式体现两个阶级分化的现实，并借鉴了美国电影《大饭店》的技巧，形成较为接近西方自然主义的戏剧主张。\n\n四、结构上的突破\n\n《雷雨》是属于锁闭式结构。剧本在一天的时间、两个场景内集中展开了周鲁两家前后三十年复杂的矛盾纠葛，情节高度集中，剧作矛盾众多而线索分明，这种结构，很有戏剧性，曹禺自己认为“太像戏”了。\n\n《日出》则是另外一种结构，即人像展览式结构，“用多少人生的零碎来阐明一个观念”，没有中心事件和中心人物，&#x6BCF;个角色都占有相等的轻重，互为宾主，交相陪衬，共同烘托出“损不足以奉有余”的社会，结构的联系是“人之道损不足以奉有余”这一基本观念。用的是“横断面的描写”，减少故事的起伏和起承转合、巧合等手法与技巧。\n\n五、人物塑造上的突破\n\n在人物形象塑造上，《日出》不仅比《雷雨》的人物数量多、人生经历更复杂，而且无论是人物的群体性格特征还是个性特征，都更加鲜明突出，人物的悲剧命运也更具社会批判力。《日出》中的各色人等，都被金钱利欲这架大机器推上人生之途，但每人所品尝的个中滋味是各不相同的。每个人都有自己的悲剧，但悲剧的蕴涵是千差万别的。而且，《日出》中的人物命运还蕴涵着一种更为深刻的对应、比照的关系，这些人物除了各自命运的独特意义之外，在他们的命运之间，还有一\n\n种内在的关联，有的甚至是一种必然的发展趋势，这就使人物个体的命运相互构织成社会命运的网，把个人悲剧与社会悲剧更紧密地融为一体。","keywords":"展现日常生活 印象派散点技法 以观念连接结构 人像展览式结构 人物塑造","note":"《雷雨》取得成功后，曹禺没有故步自封，而是对自己的作品进行了反思，让自己取得了进一步的发展，才有了《日出），所以二者经常会被放在一起比较，大家要特别注意。相较于《雷雨》，《日出》在构思、技巧、结构和人物塑造等多个方面都做出了突破，同时，《日出》中还需要特别注意的是“不足者”和“有余者”这两组人物形象的对比，相关内容可以在李凡文学正版群中领取。"},{"id":"191","stars":"★★★","title":"如何理解《原野》中的“爱”与“复仇”主题","body":"在（雷雨》里已经显露峥嵘的“生命的蛮性”与“复仇”的命题，在《原野》里，终于得到了淋漓尽致的发挥：\n\n一、根源于人的感情欲望本身，极度扭曲的爱\n\n读者大概都很难忘记第一幕开始，金子与仇虎调情、捡花那场戏：这一对被情欲燃烧得几乎疯狂的男女，竟会爱得如此痛苦，情人间如仇敌般互相折磨，在对方筋肉的抽动中享受着爱的快感，在丑的变形中发现美的极致。\n\n焦母对于她的儿子焦大星的爱又何尝不是强烈而刻骨铭心的，正是为了独占对方的感情，疯狂的爱竟转化成对媳妇疯狂的恨，并得到了金子同样疯狂的反击，陷入了无休止的嫉妒、怨恨的感情折磨中，自身也发生了情感的毒化，性格的扭曲。\n\n发生在焦家的悲剧比之周朴园的家庭悲剧，也许更普遍，它根源于人的感情欲望本身，就几乎不可解脱，只能带来永久的困感。\n\n二、“复仇”给人内心带来的矛盾与拷问\n\n《原野》里，与“爱”交织在一起的是“复仇”。\n\n戏剧以仇虎“从地狱里逃回来复仇”为开端，“阎王，我回来了”一声高叫，就把“复仇”的主题推向顶点。但剧作家却出人意料地安排了焦阎王的突然去世，只剩下瞎了眼的焦母，性格懦弱的焦大星，和尚在摇篮中的小黑子。这不但使仇虎的复仇失去了对象，连复仇的合理性都受到了挑战。\n\n于是发生了戏剧重心的转移：由外部的复仇行为转向由复仇引发的内心矛盾，由外在命运的挣扎转向自身灵魂的挣扎。于是，当仇虎依照“父仇子报”“父债子还”“断子绝孙”的传统，真的实现了残酷的复仇后，他却无法摆脱内心深处的“有罪感”，陷入了灵魂的分裂与挣扎。\n\n“仇杀故事的路线”由此发生陡转：不是仇虎追杀焦家人，而是焦母把仇虎追赶到了原始森林，并出现了精神幻觉。戏剧结束时，观众看到：“大地轻轻地呼吸着，巨树还那样严肃，险恶地矗立当中，仍是一个反抗的魂灵”-尽管最终肯定了复仇，却依然没有解决它的内在矛盾与困惑。","keywords":"根源于情感欲望本身 永久的困惑 自身灵魂的挣扎 反抗的灵魂","note":"《原野》的主题是“爱”与“复仇”，但这又与普通的以“爱”或“复仇”为主题的作品不同，《原野》中的“爱”不是通常认知中人与人之间的感情，而是极度扭曲的欲望，“复仇”也没有带来正义的贯彻和心灵的解脱，而是内心的拷问。在这里，曹禺通过对这两个主题的展现，表现了自己对“人生困境”的困惑以及对神秘宇宙的哲学思考"},{"id":"192","stars":"★★★★","title":"《北京人》的艺术特色是怎样的","body":"一、由“戏剧化的戏剧”生命向“生活化（散文化）的戏剧”生命转变\n\n1940年，曹禺创作了他的第四部杰作：《北京人》。此时的剧作家已经走出了生命的郁热期，进入了生命的“沉静”状态。《北京人》也就有了另一种氛围，另一番情调-这里有：“秋风吹下一片泠泠的鸽哨响”，快乐而安闲，“卖凉货的小贩，敲着“冰盏＇......丁铃有声，清圆而冽亮”“在苍茫的尘雾里传来城墙上还未归营的号手吹着的号声”“随着风在空中寂寞的振抖”......，这是曹禺追求已久的由“戏剧化的戏剧”生命向“生活化（散文化）的戏剧”生命的转变：不仅是对人的日常生活的表面形态的关注，更是对人的日常生活的内在神韵与诗意的开掘，普通人的精神世界的升华。只有在《北京人》&#x91CC;，曹禺才实现了他“走向契诃夫”的宿愿。\n\n二、“生命的诗”\n\n北平曾氏大家庭里，曹禺首先发现的是“孤独”-对人与人之间的“不相通”的悲哀的体味与思索。这是一次层层深入的开掘：开始，剧作家在他的男女主人公曾文清与愫方身上发现了自觉于心灵的隔绝，又渴望着心灵沟通的两个灵魂的接\n\n近。但是在“静默”的表象背后，隐藏着两个不同的灵魂。心灵本就相隔“天涯”，“若比邻”云云只是自欺欺人的虚词，这是不能不引起透骨的悲凉之感的。而愫方竟是为着这样的无用的生命做出无私的奉献，更使人感到，人的美好的感情、追求是多么容易被无端地扭曲和捉弄。\n\n曹禺式的“残忍”观念因此而得到更深刻的阐发。在这个意义上，我们可以把《北京人》称为曹禺“生命的诗”。\n\n三、对中国传统文化的历史观照\n\n当曹禺进一步追问“曾文清怎样从‘人’变成‘生命的空壳’”时，他就转向了对中国传统文化的历史观照。曹禺显然认为，这是一个土大夫家庭的子弟，染受了过度腐烂的北平士大夫文化的结果。作为一种没落的贵族文化，它悠闲、雅致，却带有浓厚的寄生性，最能消磨人的生存意志。这是人的真正“堕落”：人的生命的彻底浪费，人的个人与社会价值的彻底丧失。\n\n同时，曹禺就创造了一个舞台奇观：三个不同时代的“北京人”，代表三种截然不同的文化，同时出现在《北京人》同一个舞台空间里，在历史的参照与对比中，更显出“今日北京人”的生存方式及其所代表的封建士大夫文化的全部荒谬性，&#x540C;时将读者、观众推到一定的距离之外，达到某种超越，“以一种悲悯的眼来俯视这群地上的人们”。-《北京人》在更高的层面上又回到了《雷雨》“序幕”与“尾声”的追求，但于悲悯之外，又增加了几分嘲讽，由悲剧转向了喜剧。","keywords":"“生活化戏剧”“生命的诗”历史观照","note":"《北京人》是曹禺在40年代创作的一部杰作，此时作家已经进入了生命的沉静期，无论是思想的深刻性，还是对话剧创作的探索上，相较之前都更进一步，所以在《北京人》中进行了更为深刻的思考，显示出了许多和曹禺之前作品不一样的艺术特色，这一点需要我们了解。"},{"id":"193","stars":"★★★★","title":"曹禺的《家》和巴金的《家》相比，有什么特点（25湖北大学）","body":"曹禺写于1942年的《家》是一次更富创造力的“再创作”。相比于原作，它主要有以下特点：\n\n一、表现重心的转移\n\n从巴金的小说《家》到曹禺的《家》，人们发现了表现重心的转移，不仅以觉慧的反抗为中心转向以觉新、瑞珏、梅小姐三个人物的关系为主要发展线索，而且剧作家对他（她）们爱情生活的关注与描写的重点，已经主要不是悲剧性内容的揭示，而是努力开掘与发掘内涵的生命力量与美。\n\n曹禺的《家》以觉新为主要描写对象，觉慧成了次要人物，戏剧开头写觉新的新婚苦闷，中间突出描写了觉新、梅表姐和瑞珏三人在战乱中见面时的复杂的内心心态和内心碰撞，最后写了瑞珏的死和觉新的醒悟。期间虽然穿插写了觉慧和鸣凤、觉明和琴以及婉儿受虐、克安和克定荒淫的故事，但都是略写、并不突显。而巴金《家》则是以觉慧为着眼点，以觉慧的眼来看周围的一切，写他与身边人、事的关联和观照、内心的想法，苦闷和反抗。\n\n二、人物形象塑造纯真、明朗\n\n剧本着力塑造了觉新、瑞珏、梅等人物形象，特别是瑞珏、梅这两个女性形象，是曹禺在原著基础上的新创造。这两个女性形象，瑞珏温婉，梅芬哀凄，然而又都真挚执着，焕发着青春和诗意的光彩。瑞珏可以说是曹禺塑造的全新女性形象，已经将蘩漪、陈白露、花金子因残忍的压抑而导致的心灵扭曲，情感、心理、性格的病态荡涤干净，也不像愫方那样“整日笼罩在一片迷离的秋雾里”，瑞珏更是晶莹剔透的，充溢着“纯真”之气。剧作家写到觉新时，也给予了更多的理解与同情，使他的形象具有某种明朗的色彩。对鸣凤与觉慧的爱情，更是投入了巨大的激情。这使得剧作《家》成为继《北京人》之后的一部缠绵的抒情剧作，而又有别于充满着悲怆激昂精神的小说《家》。\n\n三、诗化的戏剧语言\n\n曹禺的《家》是一曲“青春的赞歌”，也是创作“诗剧”的自觉尝试。剧作家唤出了“杜鹃声声”，让生命中的青春力量彻底释放，青春的诗意美得到淋漓尽致的发挥与展开。与此相适应，他又创造了“诗化的戏剧语言”-曹禺戏剧生命创造的原动力，不仅是思想、情感的内在要求与冲动，也来自语言的诱惑。","keywords":"表现中心转移“纯真”之气 明朗的色彩 诗化的戏剧语言","note":"曹禺的《家》是一次优秀的再创作，虽然和原作表现出了许多的不同，但在人物塑造和语言表达上都达到了较高的水准，所以会把二者放在一起进行对比，需要我们对这两本作品都有深入的了解，大家要注意。"},{"id":"194","stars":"★★★★","title":"曹禺剧作的思想主题","body":"曹禺将情境作为其戏剧创作的契机，重视氛围情境的营造。曹禺剧作的戏剧情境有着一以贯之的特色，这就是以暴露封建大家庭的罪恶、社会现实的黑暗为母题，以苦难中的女性为中心人物。具体来说，曹禺剧作的思想主题主要表现在以下方面：\n\n一、对现实的批判与不满\n\n纵观曹禺的剧作，作者对现实的强烈不满、否定之情始终贯穿其间。从家庭到社会，从都市到原野，作者都为人们描绘了黑暗的狰狞、凶残以及那些生活在黑暗之中的弱小灵魂悲惨的呼号与徒劳的挣扎。曹禺以其剧作表现了他对黑暗现实的愤懑。笼罩着曹禺四大剧作的是郁热、烦闷、燥动、压抑、恐怖、残忍、凄惨等等复杂因素混合在一起的情绪和氛围。曹禺戏剧通过人物出走的描写，深刻地揭露出了旧家庭以至旧社会的黑暗与丑恶。当然，曹禺剧作的批判性主题绝非如此单纯而明晰，而是大多具有一种抽象或者说模糊的性质，但其中对社会现实的深切观照和对人生的终极关怀始终是不容忽视的显要特质。\n\n二、对封建社会作文化批判\n\n曹禺笔下的妇女，无一例外地依靠男人生活。而这些妇女所依附男人则是些软弱无力、颓靡枯槁、一无能事的废物。他们甚至不如十九世纪俄国文学中的“多余人”。“多余人”的最大特征是长于思想短于行动。曹禺剧作中的周萍、张乔治、胡四、焦大星、江泰、文清、曾霆等人不但没有行动，甚至连思想都没有。他们精神虚弱、委靡颓废、苍白无力，简直就是些“生命的空壳”。大星、周萍、文清这群“废物”就是封建家庭中年轻一代的典型形象。他们是封建文化造就的“精品”。曹禺通过这些形象告诉人们：腐烂的封建文化已毫无存在的价值了！所以说对封建社会作文化批判，是曹禺剧作的思想特色之一。\n\n三、关注苦难中的女性，突出妇女解放工作的艰巨性\n\n曹禺剧作塑造了一批光彩照人的人物形象，特别是苦难中的女性形象。这些女性大致可以分为两种类型，即以繁漪、花金子为代表的刚烈型和以侍萍、愫方为代表的柔顺型。前者如火，如霆，如雷雨，如决大川；后者如水，如月，如晓露晨霜，如空谷幽兰。前者为悲愤，为抗争；后者为哀怨，为忍让。这些苦难中的人物形象不仅是曹禺剧作家族的主要成员，而且以其活动构成了曹禺剧作的中心冲突。这些苦难中的妇女，无一例外地依靠男人生活。因此，“五四”提出的解放妇女的工作还十分艰巨。这是曹禺戏剧提供的一个认识内容。\n\n【李凡关键词：现实批判 封建社会 文化批判 苦难女性 妇女解放】","keywords":"","note":"曹禺剧作的思想内容与茅盾、巴金等小说创作的思想内涵是一致的，在当时那样一个时代环境下，这些觉醒了的作家无不在批判现实黑暗，抨击封建主义，他们的区别在于所采用的文学体裁不同。这其中，曹禺的独特性在于塑造了一系列苦难中的女性，如蘩漪、陈白露等，通过她们的生存境遇表达了对女性的关注，突出了妇女解放的艰巨性。"},{"id":"195","stars":"★★★★★","title":"曹禺剧作的艺术特征","body":"从《雷雨》的紧张热烈、激荡郁债，到《北京人》的平淡而深沉、忧郁而明朗，曹禺一方面保持戏剧风格中属于他个人所有的一贯稳定性特质，另一方面又发展了自己的戏剧艺术与特色。在戏剧艺术手法方面，曹禺表现出非凡的艺术才华。\n\n一、情感与形象的直觉性\n\n曹禺是一位拥有炽热激情的作家。这种独特而炽热的审美情感决定了他创作的艺术风貌：“雷雨”式的沉闷压抑，“雷雨”式的汹涌激荡。面对创作素材，他不是冷静地分析、理智地编排，而是一种全身心的投入，在真切的感受和体验中，在与对象的相互交融中去构思、去创作的。这种独特而炽热的审美情感，决定了他戏剧创作的形象思维过程具有情感与形象的直觉性特点。他独特的审美情感在所创作的戏剧世界中留下了鲜明的痕迹。\n\n二、擅长组织戏剧冲突\n\n曹禺剧作在构织戏剧冲突方面的艺术技巧是公认的，精巧周密、紧张激烈的戏剧冲突一直是曹禺剧作的一种本色。曹禺剧作善于在多线索交织的情节推动下，通过集中的矛盾关系、严谨统一的结构来组织戏剧冲突。曹禺处理戏剧冲突，能深入剧中人的内心世界，或表现人物与人物之间的心灵交锋，或刻画剧中人内心的自我交战。表面的争执、外部的冲突都包蕴着剧中人的内心交战。一切外在的冲突、争辩与日常生活场量，都是酝酿、激发与表现内心冲突。只有这类冲突，才是真正富\n\n有戏剧性的冲突。剧中有“戏”，善于写“戏”，是曹禺剧作最重要的甚至是其固有的表现手段之一，可以说，对戏剧结构的严格讲究和精心营造，是曹禺剧作体现出的一个无形的观念。\n\n三、人物语言个性化\n\n曹禺在人物语言的个性化方面也显示出了极高的艺术才能。他总能根据人物不同的生活经历、身份、教养以及处在不同境况下的心理状态来选择人物的语汇、语调与节奏，以表现人物不同的个性。更重要的是，曹禺剧作的台词极富动作性。台词与舞台动作相配合，又使台词延伸出丰富的潜在涵义，揭示出人物复杂的感情及个性，他往往只用一两个词，一句简短的话，甚至几个语气词来表现人物的复杂情致与内在动作，用无声语言即停顿来抒情。\n\n【李凡关键&#x8BCD;：&#x76F4;觉性 戏剧冲突 语言个性化】","keywords":"","note":"曹禺的创作生涯很长，经典作品也很多，但曹禺的剧作创作特征，一开始在《雷雨》这部作品中就展露无遗，无论是汹涌澎湃的感情、激烈的戏剧冲突还是个性化的人物语言，都可以在《雷雨》中找到。而这种创作特征一直贯穿于其创作生涯之中，故此，我们可以结合《雷雨》这部作品理解曹禺的创作特征。"},{"id":"196","stars":"★★★★","title":"结合曹禺作品，谈谈你对他的话剧诗意性特色的认识（25南京大学）","body":"【答题框架】\n\n曹禺剧作的诗化特征不仅要从作品中浓郁的诗意、充满诗情画意的场面、借鉴诗歌表现等外在的艺术形式来衡量，而更应该看到，曹禺是将戏剧作为诗来写，诗情与诗意是本质性的，内化在作家构思创作的全过程并渗透在剧作中，有些不具备诗的形式的作品恰恰更富于诗的意味。具体可以从两方面来看：\n\n一、创作角度\n\n从创作角度说，曹的戏剧创作方式与其他剧作家有较大的差异，而更接近于诗人的创作。\n\n（一）从创作状态来看，尽管曹禺也象大多数剧作家那样有一个收集准备素材阶段，但面对创作素材，他不是冷静地分析，理智地编排，而是一种全身心的投入，在真切的感受和体验中，在与对象的相互交融中去构思、创作的。那种“情感的汹涌的流”推动着他，左右着他，从而使他得以将诗的内涵纳入剧的形式之中。\n\n（二）从构思方式来看，曹禺常常不是先有一个明确的思想主题，考虑周详然后进入写作，而是先有一种朦胧的，类似于诗歌意境或音乐旋律的感受萦绕脑际，这不仅是曹禺戏剧构思的开端，而且也成为他整部作品的基本氛围。这一特点在曹禺前期的创作中尤为明显。\n\n二、作品角度\n\n从作品角度说，将戏剧作为诗来写，并不一定是要求戏剧符合诗的形式规范，而毋宁说是追求诗的意境，使之具有浓郁的情感色彩和主观因素。\n\n（一）曹禺的剧作无不洋溢着强烈的抒情性，其人物身上往往集中了极端的爱与恨。如《雷雨》所着力表现的，就是那种“不是恨便是爱，不是爱便是恨”的极端的情感。英国湖畔诗人华兹华斯曾有一句名言：一切好诗都是强烈情感的自然流露。这恰与曹禺剧作的抒情特征相吻合。\n\n（二）诗歌中最为常见的象征性意象，在曹禺剧作中同样大量存在，大概而言，曹禺剧作中的象征性意象包括三种情况：&#x4E00;种是以场景、道具方式存在的象征性意象；二是以人物性格方式存在的象征性意象；三是由作品命名构成的象征性意象。这些象征性意象从不同层面烘托、渲染了戏剧的诗意氛围，而且成为戏剧有机的组成部分。\n\n（三）从作品表现性来看，曹禺的创作虽基本取材于现实生活，但作家并不满足于仅仅按照生活本来的面目去进行描摹，常常是有意超越客观真实，采用表现主义的手法，这一点在其前期创作中表现得尤为明显。","keywords":"创作角度 创作状态 构思方式 作品角度 抒情性 象征性 表现性","note":"曹禺作品的诗意特征是贯穿曹禺创作生涯的一个典型特征，所谓诗意，简单来说就是“像诗里表达的那样给人以美感的意境”，在分析时，不单单要注意作品的形式、思想内容、表达方式等方面，还要注意创作时的态度，分析曹禺的作品的诗意特征也是如此。曹禺的诗意特征，不仅表现在作品本身，还流露与曹禺创作的全过程之中，大家要注意一下。"},{"id":"197","stars":"★★★★","title":"试说明曹禺戏剧创作的地位与贡献","body":"曹禺的戏剧深刻、集中地表现了反专制与个性解放的新文学主题，出色地描写了没落专制家庭及其众多人生相，在中国现代戏剧史上树起了一座丰碑，曹禺戏剧的历史贡献，主要表现在以下方面：\n\n一、发展了我国的悲剧艺术\n\n曹禺戏剧发展了我国的悲剧艺术，进一步开拓了悲剧文学的表现领域与精神刻画的深度，为悲剧艺术提供了典范。曹禺塑造了繁漪、陈白露、愫方这样卓越的悲剧女性，刻画了鲁侍萍、周萍、曾文清等优秀的艺术典型，为现代戏剧的人物画廊贡献出一系列光彩夺目的悲剧形象。这些曹禺式的悲剧人物在我国悲剧艺术发展上的意义，还在于他们显示了悲剧人物和悲剧样式的发展。古代悲剧历来以表现英雄、伟人为主，曹禺从现实生活提炼出悲剧冲突，描写平凡生活中受压迫与摧残、遭压抑与扭曲的悲剧人物，反映出悲剧丰富、深刻的社会意义。剧作家描写了灰色人物、小人物的悲剧，运用艺术手段把这种精神痛苦的深度传达得淋漓尽致。他的悲剧主要不是呈现为悲壮、崇高的美，而是写出一种优愤深沉、缠绵沉挚的美。\n\n二、推动了中国现代话剧文学样式的成熟，奠定了其文学史、戏剧史地位\n\n曹禺戏剧的高度艺术成就对中国现代话剧文学样式的成熟起了决定性作用，奠定了这一新生艺术样式在中国现代文学中的地位。从1934年到1936年曹禺接连发表《雷雨》《日出》，标志着我国话剧文学样式的成熟。《雷雨》《日出》《北京人》以卓越独特的艺术成就，高度满足了话剧作为舞台艺术所提出的关于人物、冲突、结构、语言等方面的艺术要求，成为中国话剧创作的典范。曹禺戏剧在吸收外来艺术、形成个人风格的同时，能从剧本的精神风貌与艺术表现方面体现出深厚的民族特色，奠定了现代话剧这一新生艺术样式在中国现代文学史、戏剧史的地位。\n\n三、曹禺追求“大融合”的戏剧境界，为中国现代话剧的发展开拓了广阔的领域\n\n曹禺执著追求的，是一种“大融合”的戏剧境界。这是人类戏剧宝库中的精华：从希腊悲剧与喜剧、莎士比亚，到易卜生、契诃夫、奥尼尔......的大融合。这是中国传统戏剧艺术与西方戏剧艺术的融合，是中国传统诗学与西方象征主义的融合。这是戏剧与哲学、具体与抽象、形而下与形而上的融合。这是追求“生活幻觉”效果与舞台“假定性”效果的融合。这是情节剧、佳构剧与心理剧的融合，是戏剧与诗、戏剧与散文、戏剧化的戏剧与生活化的戏剧的融合，是写实与写意、写实与非写实的融合，这是喜剧与悲剧的融合等等。\n\n因此，曹禺对于中国现代话剧的意义，不仅在于他的戏剧创作标志着、并促进了中国现代话剧的成熟，更重要的是，他极富想象力与创造力的实验性的创作，为中国现代话剧的发展开拓了广阔的领域，提供了无限丰富的可能性，展示了多元的、自由创造的发展前景。\n\n【李凡关键词：悲剧艺术 文学样式成熟 文学史、戏剧史地位“大融合”戏剧境界 开拓广阔领域】","keywords":"","note":"曹禺可以说是中国现代文学史乃至“五四”以来最重要的一位剧作家，无论是其创作成就，还是其历史贡献，都是我们必须要重点关注的。中国现代话剧的开端并没有像鲁迅的《狂人日记》、郭沫若的《女神》这样的一部标志性的作品，而中国现代话剧的成熟则有这样一部标志性作品-《雷雨》。曹禺的历史贡献就在于此，他凭借自己的创作推动中国现代话剧走向成熟，为中国现代话剧发展开拓了道路。"},{"id":"198","stars":"★★","title":"三十年代红色戏剧有什么特点","body":"红色戏剧是无产阶级戏剧的一部分，它的出现，与国民党统治区的话剧运动热潮相呼应。大革命失败以后，大量追求革命的知识分子被实际斗争排拒出来，集中到上海，他们苦闷彷徨，又不甘心于沉沦，希望在文艺中寄托和发泄自己的苦闷。\n\n于是，在政治形势逆转的低气压下，以上海为中心，再一次掀起了话剧运动的热潮。与之相呼应的是，在解放区根据地，也涌现出了红色戏剧。与国民党统治区话剧运动热潮相比，红色戏剧有许多不一样的特征，主要包括以下内容：\n\n一、为红色政权服务，带有官兵自我娱乐与自我教育的性质\n\n如果说在国民党统治区进行的“无产阶级戏剧”活动受到当局的限制与压迫，那么在中国共产党领导下的“红色戏剧”运动则是为“巩固红军，巩固红色政权”服务的，因而受到了鼓励与保护。所谓“红色戏剧”，开始是红军中宣传队的演出，因而带有官兵自我娱乐与自我教育的性质。\n\n二、是政治工作的一部分\n\n解放区成立了专业性的八一剧团，又扩建为工农剧社，并在中央苏区各县、区，各红军部队建立分社、支社，并开办了高尔基戏剧学校，形成专业与业余结合，部队、农村与机关结合的演出系统。除节日庆祝演出，带有较强的娱乐性外，着重于对党的方针政策的宣传与现场鼓动，是政府（与军队）政治工作的一个部分。\n\n三、强调即兴发挥，重视群众参与\n\n红色戏剧在演出形式上常与歌舞结合，强调现场的即兴发挥，并重视观众的参与，演出地点、布置都以简便、灵活为原则，具有鲜明的“广场戏剧”的特色。比如1933年除夕之夜，战士剧社为正在准备迎战国民党第四次围剿的红军一军团演出四幕话剧《庐山之雪》，就是在古庙里搭起戏台，四周点燃着篝火，并且实行“兵演兵，将演将”，军团主要领导如林彪、罗荣桓、罗瑞卿等都和士兵一起登台，演出采用“幕表制”，台词由演员在排演中临时创作，这样的演出引起极大轰动，台上台下融成一片。","keywords":"自我娱乐与教育 政治工作一部分 即兴发挥 群众参与","note":"红色戏剧是三十年代广场戏剧重要的一部分内容，其可以简单地理解为“为红色政权服务的广场戏剧”，我们可以从这一点出发去具体理解红色戏剧的特征。在三十年代的戏剧创作中，广场戏剧的成就是不同忽视的，像是红色戏剧、农民戏剧和国防戏剧这些关键概念都有可能在名词解释中出现，大家要注意一下。"},{"id":"199","stars":"★★★","title":"三十年代洪深戏剧的特点是怎样的","body":"一、具有明确的现实针对性和现实意义\n\n三十年代，一直活跃在话剧界的洪深，显示了更为激进的创作倾向。《走私》一剧将揭露走私的题材与反帝抗日斗争联系起来，就具有了强烈的现实意义。另一个独幕剧《咸鱼主义》是批评小市民在国难当头自顾自心理，也有明确的现实针对性。\n\n二、主要反映农村农民问题\n\n三十年代洪深最重要的作品是《农村三部曲》，其中包括《五奎桥》《香稻米》《青龙潭》三个剧本，都是描写农村生活的。其中以《五奎桥》影响最大。“五奎桥”象征封建地主阶级的权威和利益，围绕桥的拆毁，集中地反映了江南农村广大农民和豪绅地主之间的矛盾与斗争。这是现代戏剧史上较早地运用比较明确的阶级观点来反映农民斗争的剧作，曾引起观众强烈反应。据剧作家自己说明，《农村三部曲》是在“左联”影响下，“对政治的认识，开始有若干转变”以后的“新思想”的产物。\n\n三、“机械的现实主义”\n\n在艺术上，“农村三部曲”体现了洪深现实主义的追求，作者善于把握社会各个方面的矛盾关系，尤其是独幕剧《五奎桥》比较集中地反映了当时突出的社会问题，结构紧凑，矛盾集中，戏剧冲突围绕“五奎桥”而展开，波澜起伏，当戏剧冲突逐渐进入高潮时，立即结束，使作品具有比较好的艺术效果。洪深比较善于塑造艺术形象，将人物形象的塑造置于错综复杂的矛盾之中，在矛盾中展示人物的不同性格。《五奎桥》中的农民李全生、地主周乡绅，以及《香稻米》中的黄二官等形象，都给人留下了比较深刻的印象。\n\n由于对农村生活并不熟悉，所根据的主要是第二手材料，在“入手编制的时候，我总是将所希望的最后效果预先决定，而后谨守范围地，细心耐气地再去寻找具体的方法”。洪深的这种创作方式当时就受到了批评。\n\n剧评家张庚指出，《三部曲》反映生活的方式和它在观众中间所得的反应，和一篇农村问题的论文没有途径上的差异，因此，剧本的基本弱点是“形象化的不够，是太机械地处理了题材”，表现出一种“机械的现实主义”的倾向。\n\n而洪深的这种创作倾向在一些要求进步、迫切希望改变自己旧思想和创作面貌的作家中是有一定代表性的。这里的主观动机显然是真实与善良的，但因为违背了创作的客观规律，而给作品的思想与艺术带来了损害，这教训是深刻的。","keywords":"现实针对性 农村农民问题 机械的现实主义","note":"洪深是三十年代比较活跃的话剧作家，其创作在具有现实针对性，表现农村农民问题的同时，也陷入了“机械的现实主义”的局限。需要注意的是，洪深也有“农村三部曲”，大家要注意将其与茅盾的“农村三部曲”做出区分。"},{"id":"200","stars":"","title":"试论夏衍的话剧创作（25北京大学）","body":"夏行的剧作在平凡中舒卷着时代的风云，在冲淡里激盈着沸腾的热情，富有浓郁的生活气息，耐人寻味，发人深思，使人感到一种深厚的艺术魅力。\n\n一、取材于平凡的生活事件，是夏衍剧作风格上的一大特色\n\n夏衍更多的是从日常生活现象中去寻找戏剧性，围绕着家庭、友谊、爱情、职业、科学等一般问题，揭示生活的真实图景和人生进程。由于它们不是从社会生活中孤立抽取出来的，因而透过这些平凡乃至琐细的生活侧面，我们能窥见现实社会的巨大冲突，阶级关系的曲折变化，触摸到大时代跳动的脉搏。\n\n他的戏剧虽然没有伟大的场面，伟大的人物，但从这些生活海洋中的涟漪微波，是完全可以使人感到时代的掀天巨澜的。它们证明，当舞台上出现了真正的人，当深刻的生活冲突真正成为剧本的基础的时候，那些初看起来好象是毫无舞台性的平凡生活，就会成为异常动人的戏剧。\n\n二、注重内在的心理活动的再现，是夏行剧作风格的又一特色\n\n由于夏衍侧重于表现现实的日常生活，因此剧中的动作往往不是那样紧张、猛烈和表露。剧本刻画的重点不在人物外在的行为，而是他们的内心世界。他的戏的精髓，可以说是建筑在心理描写上面的。夏衍以细致的笔触掘开人物在这种特定情况下的心灵的奥秘，展示出人物在精神上所蒙受的重重苦难和创伤。\n\n夏衍的心理描写是以生活的本来面目出现，利用合乎人物个性的细节语言加以准确的刻画的，表现得比较含蓄真实，给人以回味，发人深省。剧作家的笔调是那样冷静，委婉，含而不露，他仿佛躲在背后，竭力掩藏自己对人物和事件的评价似的，然而它们却像一块沉重的石头投入你的心中，激起你情感的波澜，长久地给人以沉思和回味。\n\n三、结构的简约谨严，是夏衍剧作风格的另一个鲜明特色\n\n夏衍的剧作虽然不以情节的丰富曲折见长，缺乏大起大落、飞空腾跃的气势；然而他的剧本结构紧凑、严密、具有简括而不空泛、明朗而不单调的优点。\n\n一方面，夏衍剧作的主题一般都很具体和明确。剧本的情节结构是在主题思想的指导下形成，并受其制约的。夏衍的剧作不随意堆砌情节和人物，剧中的情节线索异常单纯，也没有藤萝交葛、复杂错综的人物关系，因而剧作的主旨十分明晰、突出。\n\n另一方面，在戏剧结构问题上，夏衍坚持从生活出发，从剧情和性格出发，因而他采用某些戏剧结构手段和技巧，却不露痕迹，十分自然、合理，往往使你觉察不到他那独特的安排和匠心。","keywords":"取材于平凡生活 内在心理活动再现 结构简约谨严","note":"夏衍是三十年代和曹禺一样走出了自己剧作风格的剧作家，他从曹禺的话剧中学到了创作方法，又形成了自己的特色，产生了很深远的影响，是三十年代中国剧作家的一个代表，需要我们好好掌握。在分析时，大家可以从题材、心理描写和结构三个角度切入，展开论述。相关内容可以参考王文英《论夏衍戏剧艺术的创新》、陈坚《夏衍剧作的艺术风格》，具体资料可以在李凡文学正版群中领取。"},{"id":"201","stars":"★★","title":"李健吾剧作风格是怎样的","body":"李健吾的戏剧创作几乎涉及戏剧的各种类型，并且还独创了用“南戏的精神”改造话剧的“传奇剧”。从三十年代中期到解放前，是李健吾戏剧创作的成熟期。在这期间，他创作出一大批优秀的戏剧作品，并改编了莎士比亚、萨尔度等外国名家的剧作。无论是创作剧还是改编剧，都代表了他的剧作的艺术特点和水平。他这时期的戏剧创作，主要包括以下特色：\n\n一、将剖析人性作为戏剧美学的核心\n\n李健吾主张文学应当建立在人性的基础之上，剖析人性可以视为其戏剧创作一贯的美学追求，是其戏剧美学的核心。李健吾全部剧作，可以说，就是在致力于解开人和人性这一永恒之谜。人性观既是他艺术观的出发点，也是他的创作依据。对于志在“接近灵魂”的李健吾来说，心理与情感-个人的，或者群体的-是他所关注的一个中心主题。即使对于“时代纪念碑”式的作品，他判断其价值的出发点，也仍然是人的心灵，而并非宏大却往往流于空洞的“时代”或“社会”。只有\n\n在显示人的存在的意义时，戏剧性才给自己找到了真正生命与感动观众的力量。这就是人、人性在李健吾戏剧美学中的灵魂地位。\n\n二、让观众在得到娱悦的同时感受剧本的魅力和进行认真的思考\n\n李健吾的这一创作特征集中体现在其《这不过是春天》这部作品里，剧中厅长夫人身上充满着“理想和现实的矛盾，纯情挚爱和世俗利益的矛盾，物质享受和精神空虚的矛盾，青春不再和似水流年的矛盾，强烈的虚荣心和隐蔽的自卑感的矛盾”。其他人也同样如此：秘书为保住自己的职业而斗争，侦探利用夫人与旧情人的矛盾来为自己谋利等等，这些，都构成了戏剧的矛盾冲突，但并不像曹禺剧作那样引起观众心灵的震撼，而是让观众在得到愉悦的同时感受剧本的魅力和进行认真的思考。\n\n三、时代性不强，但有较高的艺术价值\n\n李健吾的剧作时代性都不太强，但有较高的艺术价值，对话俏皮利落，结构严密紧凑，构思奇巧而追求趣味性，形成了独特的风格。李健吾吸纳了中国传统艺术和西方戏剧两方面的资源，融会贯通，创作出有民族特色的现代戏剧精品。其剧作艺术技巧圆熟，戏剧冲突多样而紧凑，运用“佳构剧”的技巧，善于处理情节的“突转”，做到结构严谨、精练紧凑。在心理刻画场面渲染和语言运用上，都显示出高超的艺术水准，在中国话剧艺术史上有着不可替代的独特地位。\n\n第三个十年","keywords":"剖析人性 感受剧本的美丽 较高的艺术价值","note":"李健吾是三十年代走出自己风格的剧作家之一，他的剧作，和曹禺、夏衍的剧作有很大的不同，这两位更多地注重剧作的时代性，而李健吾更多地关心“人”，其戏剧美学的核心是剖析人性。但无论是曹禺、夏衍还是李健吾的剧作，都是我国现代话剧创作的重要收获。这部分内容，我们要注意掌握。相关内容可以参考姜洪伟《李健吾剧作论》，具体资料可以在李凡文学正版群中领取。"},{"id":"202","stars":"★","title":"抗日战争前期国统区文学有何特点","body":"一、整体基调表现为昂扬激奋的英雄主义\n\n抗战初期，整个国统区文学的基调表现为昂扬激奋的英雄主义。“救亡”压倒了一切，文学活动也就转向以“救亡”的宣传动员为轴心。“救亡”焕发了巨大的民族凝聚力，昔日因政治或文学观点的不同而彼此对立的各家各派作家，此时也都捐弃前嫌，在民族解放的旗帜下实现了统一，成立了“文协”。\n\n“文协”成立时提出了“文章下乡，文章入伍”的口号，鼓励作家深入战争现实生活，这毫不勉强地为众多不同派别的作家所接受。文学必须充当时代的号角，必须直接反映现实，必须为普通民众所接受，这些观念都成为众多作家的共识。\n\n文学创作有了共同的爱国主义的主题和共同的思想追求：表现民族解放战争中新人的诞生，新的民族性格的孕育与形成，甚至在情绪与风格上也彼此相同，无不在热诚地渲染昂奋的民族心理与时代气氛，英雄主义的调子贯穿一切创作，表现出来的统一的色彩，鲜明而单纯。\n\n二、以纪实性、宣传性见长的报告文学等文艺形式长足发展\n\n战前井不发达的报告文学和通讯此时成了最热门的体裁，战地通讯或有关抗战英雄业绩的报告在各种报刊上大量发表，新闻性、纪实性显得比文学性更受作家的重视，也更能得到瞬息万变的战争环境中读者的欢迎。诗歌朝“广场艺术”的方向发展，发表量猛增。各种诗歌体式都有往“广场艺术”靠拢的倾向，普遍追求通俗、鲜明、昂扬，还出现了墙头诗、传单诗、枪杆诗等便于鼓动宣传的形式。各种大众化的小型轻便的文艺形式在文坛唱了主角。\n\n三、文学的多样化、个性化的部分丧失，部分作家陶醉在廉价的乐观主义中\n\n抗战初期文学强调服从于“救亡”这一时代中心，强调的是文学的功利性、宣传性，表现了现代文学与民族命运血肉联系的特质，这正是现代文学作为振兴过程中落后国家的民族文学所特具的优越性与生命活力。但是“文章下乡，文章入伍”这一普遍的认同与昂扬乐观的爱国主义文学潮流下面，又潜伏着一些不利于文学健全发展的问题，那就是文学战斗性、时代性的获取，是以文学的多样化、个性化的部分丧失为代价，而作家们又大都为此陶醉在廉价的乐观主义中，这表明了现代文学的不成熟。","keywords":"英雄主义 纪实性、宣传性 多样化、个性化部分丧失 廉价的乐观主义","note":"虽然四十年代国统区文学多暴露和讽刺色彩，但抗日战争初期的文学，格调还是比较高昂的。这一时期“救亡”压倒了一切，文学的基调、形式、内容都是为了适应政治与战争宣传的需要，取得了一定的成就，但也无可避免地暴露了一些问题，大家要注意辩证地看待。"},{"id":"203","stars":"★","title":"抗日战争相持阶段国统区文学有何特点","body":"一、民族精神的觉醒\n\n抗日战争相持阶段，国内政治形势发生急剧逆转，社会心理与时代气氛、情绪也为之一变。初期受速战论鼓动的昂扬激奋的社会心理，已经慢慢沉静下来，人们开始正视战争的残酷性和取得胜利的艰巨性，正视由于战争而沉渣泛起的各种封建文化的积垢和现实中的腐败现象。作家们的心理随即转化为沉郁苦闷。\n\n这种“新的苦闷和抑郁”不仅仅是个人的，更是民族的、时代的，是抛掉廉价乐观之后的清醒，是对战争前途、民族命运的优虑，具体来说，则又包含着对于战争中暴露出来的中国社会痼疾的正视与思考，本质上反映了一种民族精神的觉醒。\n\n二、艺术表现追求丰富性、复杂性与深刻性\n\n（一）爱国主义主题的扩展与深入，题材向纵深、立体的开拓与发掘。作家们在主题、题材的开掘中，由于有了探讨民族命运这样一个总的思想背景，因此，都自觉地追求历史感，这就给上述这一题材创作带来了新的文学风貌：现实的黑暗、民族的痼疾，在“历史”的俯视下既显出它的全部荒诞性，又以其滞后的历史惰性力量给人以重压，这样，揭露现实的作品就往往有交织着冷峻苦涩的喜剧感。回顾历史的作品则从对这古老而伟大的民族传统的历史沉思中获取了或是感伤、凄婉，或是崇高的诗情，同时也自觉不自觉地将所谓的“传统美德”诗意化，在民族情绪的高扬中，现代文学所具有的反封建的思想锋芒反而有所削弱。\n\n（二）探索知识分子道路的作品突破了传统现实主义的朴素性和单纯性，向更注重人物内心开掘的现代心理现实主义发展。\n\n纵观这一时期的创作，可以看到现代文学一面向着民族现实与历史土壤的深层深入，一面又重获得了前一时期曾经失去的文学品格，无论文学内容，还是美学风格都呈现出了多样化趋向，显示出特定的历史时代所特具的沉郁、凝重而博大的风采。\n\n三、最重要的文学形式就是长篇小说、多幕剧、长篇叙事诗与抒情诗\n\n这跟当时普遍追求“史诗格调”的创作倾向有关。这一时期是民族经历巨大痛楚而奔向解放的时代，是英雄业绩层出不穷的时代，同时也是腐朽与新生激烈搏杀的时代，作家们为这样的大时代所振奋，憬悟到只有史诗格调才足以表现这个伟大的年代。许多作家都不约而同搞“大体裁”，力图以史诗的规模去记录大时代的面影，以更为宽广的历史视角去展示复杂的社会生活变迁。","keywords":"民族精神觉醒 爱国主义主题 历史感 现代心理现实主义 “史诗格调”","note":"抗日战争相持阶段和抗日战争初期相比，整体氛围发生了明显的改变，从乐观昂扬转变为了苦闷和抑郁，而这一转变也影响到了文学创作，并进而影响到了文学创作的艺术表现和文学形式。总体来说，与抗日战争初期相比，这一时期的文学思考地更加深入，形式上也更加宏大，大家可以联系形势的变化来理解这些创作特征的变化。"},{"id":"204","stars":"★","title":"解放战争时期国统区文学有何特点","body":"解放战争爆发之后，国民党恶劣的政局引起普遍的反抗，共产党借此在国统区掀起了民主运动的热潮。这是“五四”以后规模最大的全国性民主运动，文学再一次因为与民主运动的血肉联系而获得了活力。这一时期，国统区文学主要表现出以下特征：\n\n一、主题集中在对黑暗的诅咒与对腐朽的现实政治的否定，以及自我反省与总结\n\n这一时期文学的主题与题材大体上是沿着前一时期的开拓继续发展，而又更集中于两个领域：对黑暗的诅咒与对腐朽的现实政治的否定，以及知识分子在新时代到来之前的自我内省与历史总结。创作的时代烙印也越发鲜明，各类题材、体裁的作品几乎都笼罩着时代大转折时期所特有的氛围：紧张、愤激、嘲谑与痛苦，希望、期待、焦躁与不安，从而呈现出繁复的音响，但仍然可以看出讽刺的主调。突出的现象是讽刺暴露性的喜剧增多，或揭示战争中的人情世道，或概括乱世中的丑恶社会现象，或讽刺官僚制度的腐朽，都以不同的风致给话剧创作带来新的气象。其他文学体裁也大都突出显示了以讽刺为主要手段的喜剧性色彩。\n\n旧中国已走到如马克思所说的“把陈旧的生活形式送进坟墓”的阶段，这种“历史形式的最后一个阶段就是喜剧”。行将就木的旧制度旧角色表现出空前未有的历史谬误，这在敏锐地感受到历史曙光井真诚地期望着新社会到来的作家心灵上所激起的感情，就表现为讽刺性的喜剧主调，而且越是临近新中国的诞生，表现得越是明显。\n\n二、力求向民族形式与大众化方向发展\n\n在解放区文学的影响下，一部分作家力求向民族形式与大众化方向发展-这同时也受到了外国文学的影响：从抗战文学发展的上一时期开始，作家们在苦闷彷徨中探索文学深入发展的道路时，又大大加强了与世界文学的联系。\n\n这一时期国统区作家所表现出来的与民间文学、世界文学接近的趋势，以及关于文学群众化与现代化的努力，是对“五四”以来中国现代文学发展道路很好的综合、总结，并在实践上将现代文学的创作水平提高了一步。","keywords":"对黑暗的诅咒 自我反省与总结 讽刺的主调 民族形式与大众化","note":"解放战争时期国统区的文学更多地受到了社会形势变动的影响。这一时期，全国性民主运动蓬勃开展，文学再次与民主运动紧密结合，这些都影响到了文学创作的思想内容和发展方向。不过，和“五四”时期有所不同的是，这一时期的文学表现出了追求民族形式的特征，这一点大家要注意一下。"},{"id":"205","stars":"★★","title":"解放区文学的特征是怎样的","body":"一、整体基调明朗、朴素\n\n如果说抗战及其后国统区创作基调是沉郁凝重，或间有喜剧性的批判色彩，那么解放区创作的基调则是明朗、素朴，两者形成鲜明的比照。\n\n二、题材上集中于民族斗争、阶级斗争和劳动生产\n\n作家们很少再写以往新文学中常见的知识分子个人的情感生活，甚至也很少注意对现实生活的矛盾和黑暗的揭露，所取替的是对新社会、新制度的赞美以及对人民群众斗争生活的热情描绘，普通的农民、士兵、干部成为作品中重点表现的对象，翻身解放了的“新人”成为文学的主角。\n\n解放区文学集中于写民族斗争、阶级斗争和劳动生产，现实性、政治性和政策性都很强，其所表现的新的生活形态风貌，也是文学史上独有的。\n\n三、对文学民族大众化的自觉探索\n\n新文学作家不管以往有怎样的艺术个性，这时都将目光转向曾作为中华民族摇篮的黄河流域“黄土地”，以及生活在这土地上作为民族主体的广大农民。作家们以前所未有的热情在认真体味研究中国农民的思想、情感、心理与审美情趣，刻苦发掘钻研民族文艺和传统民间艺术形式，力图创造出为农民所喜闻乐见的艺术形式，去充分反映与表达农民的生活命运与思想情感。所有这些努力与成就都显示出一种文学发展趋向：新文学在解放区这里发生了最重大的变化，那就是试图把“根”深深地扎到民族文化土壤和人民的生活中。\n\n四、文学发展具有片面性\n\n作家到农民中去接受改造，不可避免地受到了农民及农民身上积淀的某些传统文化道德中封建性因素，包括保守狭隘的小生产意识的影响。反映在文学观念上，则形成了一种文学发展的片面性。\n\n解放区文学运动基本上是一种在政治的直接推动下单向突进式发展的文学运动，强调了配合和服务于政治，相对忽视了文学自身的艺术规律；强调了工农兵方向，却又出现了轻视知识分子的倾向；强调了对农民的传统的艺术形式的继承，却放松了对艺术形式手法现代化的要求；强调了作品通俗易懂，却忽视了文艺发展格局中也应有高雅优美的部分。","keywords":"明朗、朴素 民族斗争、阶级斗争和劳动生产 民族大众化 片面性","note":"解放区文学整体基调明朗朴素，政治性很强，多为斗争需要服务，取得了很高的成就，但也不可避免地会存在一些问题。同时大家也可以注意到，解放区文学的一些特征在十七年文学中也可以看到，大家可以把它们对照着记忆。"},{"id":"206","stars":"★","title":"沦陷区文学具备怎样的特点","body":"一、在英雄主义、浪漫主义与反英雄、反浪漫的张力中发展\n\n一些作家努力坚持“五四”新文学的传统：在东北沦陷区与华北沦陷区都曾有过“乡土文学”的倡导与论争，而如华北沦陷区的评论家楚天阔的解释，“乡土文学”“至少含有‘民族’‘国民’‘现实”‘时代’这些意义在内”，因此，在“乡土文学”旗帜下产生了一批揭示沦陷区人民真实的生存困境与不屈不挠的民族生存意志而又富于乡土气息的现实主义的作品。\n\n另一些作家则从个体的战争体验出发，转向对作家（知识者）自我的平凡性，对于“软弱的凡人”的历史价值，对于人的日常平凡生活的重新发现与肯定。由此而形成了以张爱玲为代表的新的美学追求，这样的从时代中心主题向“日常生活”与“永久的人性”的转向，所形成的“反英雄、反浪漫”的倾向，与前述“乡土文学”坚持的英雄主义、浪漫主义的文学传统，形成互相对立、又互相补充制约的文学潮流。这一时期沦陷区文学正是在二者的张力中得到发展的。\n\n二、雅文学与俗文学两大文学潮流在对立中的接近趋向\n\n由于政治的限制，在文学几乎被迫失去了表达与激发民族救亡热情的启蒙功能以后，文学市场的需求，就成为沦陷区文学发展更为直接的动因。沦陷区作家正是徘徊于“作家内在精神追求”与“文学市场需求”之间，艰难地、煞费苦心地寻求二者的契合点。\n\n于是，沦陷区文学中最引人注目的文学景观与文学成就即是通俗小说的空前繁荣及“通俗小说现代化”的努力，与此相映成辉的还有以上海为中心的职业化、商业化的剧场戏剧的空前繁荣与早期文明戏的隔代呼应，涌现出了李健吾、师陀、周贻白等一大批剧作家。\n\n在“雅文学”方面也有重要的收获，战后出版的钱锺书的《围城》，师陀的《果园城记》《结婚》等均写作于这一时期。正是在这样的基础上，出现了张爱玲这样的出入于“雅”与“俗”、“传统”与“现代”之间的作家，标志着沦陷区文学（以至整个中国现代文学）“雅俗共赏”的时代美学追求所达到的历史水平。","keywords":"英雄主义、浪漫主义 反英雄、反浪漫 雅文学与俗文学接近趋同“雅俗共赏”","note":"沦陷区文学由于其特殊的政治环境和时代背景，显示出了一些很矛盾的特质，整体看来可以简单的概括为“对立统一”，其中，英雄主义、浪漫主义和反英雄、反浪漫的对立统一明显带着二十年代左翼文学作家与自由主义作家对立的余波，而雅俗在对立中趋近则更多地是文学发展的必然要求。"},{"id":"207","stars":"★★★","title":"谈谈你对“孤岛文学”的认识","body":"一、“孤岛文学”的内涵\n\n“孤岛文学”是指抗战时期上海租界的文学。1937年“八·一三”事变后，上海沦陷，但由于当时日本并未向英美法等国宣战，上海的租界成为日军侵略洪水中的“孤岛”，部分作家留在上海租界，在日寇势力的包围之中坚持抗日文艺运动，直至1941年12月珍珠港事件爆发，日军侵入租界止，历时四年零一个月。人们把这一特殊时段、特殊区域的文学称为“孤岛文学”。\n\n二、“孤岛文学”的特征\n\n“孤岛”形势特殊，条件特殊，“孤岛”文学也自有其特殊性。\n\n（一）“孤岛文学”战斗性强，因邻近日、伪统治中心南京，揭露敌人阴谋及时，抨击敌人有力。\n\n（二）“孤岛”信息来源广，传播快，不仅能迅速汇聚大后方和抗日民主根据地的信息，而且能很快得到国际上反法西斯战争和反法西斯文学的大量信息；“孤岛”也不受国民党的文艺控制，能更自由地开展抗战文艺运动，印刷和传播抗日民主根据地反映新生活新面貌的文艺书刊。\n\n（三）由于“孤岛”直接处于前线，热烈的抗战宣传和内在的封闭压抑并存，又承继了30年代都市文学的现代主义实验、洋场风貌和讽刺笔调，外部环境受战争破坏较少，所以保持了较高的艺术水准。\n\n三、“孤岛文学”的贡献\n\n“孤岛文学”在出版和创作两个方面对抗战文学做出了贡献。\n\n（一）上海沦陷后大量报刊被迫停刊、迁移或重组，严重影响了抗日爱国的宣传和作品的发表。在此情况下，“孤岛”作家利用租界这一特殊区域，以英、美商人的名义出版发行了许多报刊。这些报刊在揭露日军暴行、宣传抗日救国思想、批判汉奸文人的卖国言行等方面发挥了重要作用。\n\n（二）“孤岛文学”在创作方面也取得了丰硕的成果，在杂文和戏剧创作上更是成就斐然。\n\n（1）杂文方面，以柯灵创办的《世纪风》副刊为平台，聚集了一批才华横溢的杂文作家。他们以杂文为武器，揭露和批判日伪的丑恶言行，也对一些诸如“抗战八股”“与抗战无关”等与当时抗战的主旋律不和谐之声进行批评。这些杂文嬉笑怒骂、幽默锋利，颇具鲁迅文章的风格。\n\n（2）抗战爆发前上海就是中国戏剧运动的中心，抗战爆发后上海戏剧界更是掀起了救亡演出热潮。受此影响，“孤岛”的戏剧活动也特别活跃。孤岛的戏剧工作者不但创办了专门的戏剧刊物《剧场艺术》和《戏剧杂志》，还组织了为数众多的\n\n各种群众性的戏剧团体。在戏剧创作上，以揭露日伪罪恶、激发人们爱国热情和反抗斗志的现实题材和历史题材剧本成就最高。\n\n【李凡关键词：上海租界 战斗性强 信息来源广，传播快 较高的艺术水准 出版和创作 杂文 戏剧】\n\n【李凡说：“孤岛文学”是抗日战争期间一个十分重要的文化现象，也是特殊历史时期特殊地域的一种十分特殊的文化现象。其创作特征，既取决于其特殊的区位，又受到了上海30年代文学创作的影响，并且在出版和创作上都取得了不俗的成就。这一考点相对较偏，但在部分院校考查中也会出现。相关内容可以参考杨幼生《上海“孤岛”文学特点初探》、刘勇《上海“孤岛文学”》，具体资料可以在李凡文学正版群中领取。这里要提醒大家，“孤岛文学”这一关键概念在名词解释中也经常出现，大家要注意一下。】","keywords":"","note":""},{"id":"208","stars":"★★","title":"结合作品论述抗战时期迁徙和流亡经验在1940年代各类型文学作品中的体现（26北京大学）","body":"二十世纪四十年代战争中的中国文学舞台的主演者正是一批“流亡者”。流亡在这个特定的历史时期意味的是“国家”“民族”的“流亡”。这些迁徙和流亡经验在各个类型的文学作品中，主要有如下体现：\n\n一、迁徙和流亡经验在小说中的体现：对故土故乡的怀念，对传统文化的理解和体验\n\n流亡者们确定自己在流亡的同时又渴望寻找家园，回到失去的生存空间。流亡生活加深了对故土故乡的怀念，也丰富了对人，对传统文化的理解和体验。对祖国、故乡的怀念是流亡文学中重要的一部分，而其中所表露的感情深度也更加深刻。“家庭”题材的作品大量出现，是四十年代中国文学中的突出现象。仅长篇小说，就出现了诸如老舍的《四世同堂》、巴金的《寒夜》、路翎的《财主底儿女们》等作品。路翎的《财主底儿女们》中的主人公蒋少祖曾经是传统文化最激烈的反叛者，如今却在“那些布满斑渍的，散发着酸涩的气味”的古版书中，“嗅到了人间最温柔、最迷人的气息，感到这个民族的顽强的生命，它的平静的、悠远的呼吸”。\n\n二、迁徙和流亡经验在诗歌中的体现：悲剧性的人生体验\n\n中国四十年代的知识分子是一个个在战乱中的饥饿与死亡线上挣扎的真实的“流亡者”。残酷的人情世故，狭隘的地方主义情志，都曾给这些作家心灵上留下创痛。对流亡生活，异地生活的种种体验，使得抗战时期的诗歌具有浓厚的悲剧性。七月派的创作内容，许多都是流亡者在浪迹国土过程中的所见所闻，所感所录。艾青《雪落在中国的土地上》中，始终回荡着这样的呼唤：“中国的苦痛与灾难／像这雪夜一样广阔而又漫长呀！／雪落在中国的土地上／寒冷在封锁着中国呀！”这样的文字常给人以刻骨铭心之感，正是因为它注入了作者自身的生命体验。\n\n三、迁徙和流亡经验在散文中的体现：民族国家观念和抗战救亡意识增强，呈现出集体化、平民化的共同特色\n\n逃难流亡，成为战时的一种普遍现象。流亡作家们纷纷由个人走向了民间，由温文尔雅的知识分子融入颠沛流离的难民队伍中，从生活方式到思想感情都难民化、国民化了，强化了难民、国民和文化战士集于一身的角色认同，都增强了民族国家观念和抗战救亡意识。自称“在太平时深居简出，作文向不呐喊”的丰子恺，发出了“我们要以笔代舌，而呐喊＇抗敌救\n\n国’！我们要以笔当刀，而在文艺阵地上冲锋杀敌”的抗战宣言。\n\n不仅如此，迁徙和流亡经验在散文中还体现为一种集体化、平民化的共同特色，普遍增强了散文的现实性和时代感。不仅郭沫若、茅盾、老舍、巴金、丰子恺等老作家的逃难记充满爱国热情，连青年作家缪崇群也改变过往病弱自怜的倾向，自觉意识到“新中国的儿女们没有一个是应该忧郁的”，方敬也告别过往“幽微的音调”，“现在我要弹奏的是另外一种新的响亮的琴”。这种思想感情的变迁是当时许多作家所经历过的，他们都在战乱流离年代共趋于慷慨悲歌之路，突出表现了广大作家融入全民抗战洪流的集体意识。\n\n四、迁徙和流亡经验在戏剧中的体现：强烈的历史感和命运感，引发历史剧创作热潮\n\n从文学上看，抗战时期的迁徙和流亡是在民族存亡的危急关头产生的，给中国现代文学注入了一种沉重的悲剧意识。这种悲剧意识带有民族性，具有强烈的历史感和命运感。抗战中兴起的历史剧创作热潮，就与这种流亡生活很有关联。郭沫若从1941年12月到1943年4月，先后写了《棠棣之花》《屈原》《虎符》《高渐离》《孔雀胆》及《南冠草》等多部历史剧，并陆续在重庆、桂林等地上演，就正好迎合了当时人们对于历史文化的追寻。特别是《屈原》，之所以当时能深深打动人心，与它表现了一种与现实相通的感情息息相关。屈原的形象，本身就是一个流亡者和流放者，他被迫流落异地，但心系祖国和人民，很容易引起当时人们的共鸣。\n\n中国抗战时期的迁徙和流亡书写是现代中国文学中精彩的一章，其意义远远超越了文学范围，它对于中国整个民族精神和文化的转型，对于中国南北文化的交流和沟通，都具有不可估量的深远影响。","keywords":"小说 故土故乡 传统文化 诗歌 悲剧性 人生体验 散文 民族国家观念 抗战救亡意识 集体化 平民化 戏剧历史感 命运感 历史剧创作热潮","note":"抗战时期，在日寇铁蹄肆虐的情况下，作家们被迫远离故土，颠沛流离。比较有代表性的像是东北作家群。这种迁徙和流亡经验必然会在他们的作品中表现出来。回答这道题，首先要对抗战时期的文学有较为深刻的认识，其次，要注意时间限制在“四十年代”，最后，题目问的是“各类型”作品，所以各个类型的作品都要讨论。相关内容可以参考于丹丹、姚雅丽《中国抗战时期文人的流亡体验与流亡话语》、殷国明、王平《中国抗战流亡文学简论》"},{"id":"209","stars":"★★★","title":"如何评价毛泽东《在延安文艺座谈会上的讲话》","body":"一、是“二战”以来马克思主义文论中最有体系色彩且影响最大的论作之一\n\n《讲话》论及了延安整风中提出的许多问题，对当时当地的文艺运动有现实针对性，但其对革命文艺历来所关注并需要重点解决的诸多理论问题也做了系统的论述，是马克思主义文艺理论“中国化”的重要成果。《讲话》不应看作仅仅是毛泽东个人的理论发现，它是中国共产党领导中国革命文艺运动历史经验的总结。\n\n《讲话》发表后，无论在解放区时期还是中华人民共和国成立之后，一直是中共制定文艺政策指导文艺运动的根本方针，具有无可怀疑的权威性。《讲话》试图解决这样一个新的课题，即在无产阶级政党执政、有条件推进大规模的群众运动的历史阶段，应当如何领导文艺工作，怎样才能创造出适合本阶级要求的新型的文艺。只有理解《讲话》，方能理解半个多世纪以来的中国文学。《讲话》的理论辐射甚至远远超出文艺运动范围，在思想史上也具有重要的意义。\n\n二、推动了解放区文艺的发展\n\n1942年以后，解放区文艺在《讲话》的指引下，发生了重大变化。作家更加深入了解解放区人民的生活和斗争实际，体验工农兵群众的思想感情，学习他们生动丰富的语言，促使自己思想感情和创作发生变化，从而创作出一批具有中国作风、中国气派、为群众喜闻乐见的优秀中长篇小说、短篇小说、报告文学、抒情诗和长篇叙事诗。\n\n三、主要解决的现实问题是战争环境中党领导文艺运动的指导思想、基本政策，具有时代性\n\n在当时的社会环境和历史条件下，《在延安文艺座谈会上的讲话》无疑具有正确性、权威性，并且起到了统一思想的作用。但毕竟来不及也没有可能充分考虑共产党统一全中国、变成执政党以后条件的变化，以及在变化了的条件之下，应该如何看待文艺、领导文艺，应如何对待文艺创作的主体-知识分子阶层等一系列重大问题。因此，在建国以后，《讲话》的一些本来只适于特殊历史条件的结论被任意引申推广，就难免产生了某些偏颇。不过，在当前文学环境下，诸如：文艺为人民大众服务、“在普及基础上的提高，在提高指导下的普及”以及作家要深入人民生活等都还是不过时的，对我们目前文艺的健康发展仍有指导意义。","keywords":"马克思文艺理论中国化成果 解放区文艺 时代性 正确性、权威性 统一思想","note":"毛泽东《在延安文艺座谈会上的讲话》是马克思主义文艺理论中国化的重要成果，主要从政治层面讨论了一些文艺问题，在当时的条件下起到了积极作用，这一点需要大家好好掌握。此外，《在延安文艺座谈会上的讲话》作为第三个十年中十分重要的一个关键概念，很可能在名词解释中出现，大家要留意一下。"},{"id":"210","stars":"★★","title":"毛泽东《在延安文艺座谈会上的讲话》的主要内容是怎样的（25河南大学、26河南师范大学）","body":"《讲话》不同于纯粹的文艺论著，毛泽东是以党的领导者身份谈文艺问题的，其政治策略性很强，主要考虑的是一些有关党如何领导文艺的根本性的政策问题，多属于所谓文艺的“外部关系”问题，而对文艺本身的规律的细节讨论较少。\n\n一、核心命题是革命文艺“为群众”以及“如何为群众”\n\n毛泽东高屋建瓴，提纲挈领，从诸多纷繁的问题中先抽出一个核心命题，那就是革命文艺“为群众”以及“如何为群众”。毛泽东把“为什么人的问题”说成是一个“根本的问题，原则的问题”，明确提出了文艺“首先是为工农兵服务”，然后才是为城市小资产阶级劳动群众和知识分子服务。这就提出了所谓“工农兵方向”，比一般讲大众化、平民化要具体得多，而\n\n且政治内涵非常突出，完全是就解放区的特殊历史条件而言，推而广之，也是考虑在无产阶级政党执政的环境中的文艺发展方向。\n\n二、从政治家的角度要求文艺家思想的统一、立场的转变，途径就是与工农兵结合\n\n毛泽东主要是从政治的层面提出“如何为群众”的，他不认为这些只是一般的写作形式、方法问题，而主要是指作家、艺术家的政治立场如何转变、思想感情如何朝工农兵靠拢的问题，也就是世界观和思想情感改造的问题。《讲话》在解决“如何为群众”的问题时突出了作家、艺术家的“思想改造”这一关键。为实现思想高度统一，毛泽东对知识分子种种不适于革命环境的表现进行尖锐的批评，于是“如何为群众”的问题，就首先落实到作家、艺术家通过与工农兵结合而首先转变思想情感这一措施上。\n\n毛泽东主要是从政治家的角度要求文艺家思想的统一、立场的转变，途径就是与工农兵结合。这种“结合”既解决了思想统一的问题，又解决了创作源泉的问题。因此，这可以说是毛泽东文艺思想的一个总纲，《讲话》整个理论体系的核心即在此。\n\n三、把文艺与政治的关系问题作为其阐释的重点\n\n确定文艺的工农兵方向，需要对文艺的性质功能做新的理解，因此《讲话》又把文艺与政治的关系问题作为其阐释的重点。强调文艺从属于政治，要求文艺工作者自觉地为无产阶级政治服务，这是毛泽东理论的基本出发点；同时在此前提下要求“政治性与真实性的统一”，指出“缺乏艺术性的艺术品，无论政治上怎样进步，也是没有力量的”，对文学的艺术性的要求仅仅是为了更好地服务政治。这是毛泽东作为无产阶级政治家，在特定的以政治为中心的历史条件下，对文艺问题思考的结论，也是《讲话》的特色。\n\n可以说，《讲话》是把20世纪20、30年代创造社、太阳社的无产阶级革命文学理论，瞿秋白等的文学是政治的留声机理论及“左联”的文艺大众化理论加以整合和扬弃，建构起了一套系统而完整的具有中国特色和时代特色的马克思主义文艺理论体系。","keywords":"政治策略性很强“如何为群众”思想统一 立场转变 与工农兵结合 文艺与政治的关系","note":"毛泽东《在延安文艺座谈会上的讲话》从政治层面对文艺的创作方式提出了要求，产生了很深远的影响，比如十七年时期整体文学创作都倾向于为政治服务，就是受到了《在延安文艺座谈会上的讲话》影响，因此对于其主要内容，大家要仔细掌握。"},{"id":"211","stars":"★★★","title":"谈谈你对四十年代胡风理论的认识","body":"一、胡风理论主要内容\n\n（一）主观战斗精神\n\n胡风从30年代起就坚持批评文学创作中的公式主义与客观主义倾向。胡风认为要强调作家的“主观战斗精神”，提倡重体验的现实主义。他认为创作主体需要在客观对象的活的表现中熔铸自己的同感的肯定或反感的否定，而客观对象也会以其真实性来促成修改，甚至推翻作家的上述认识。这个“相生相克”的动态过程的结果就是新的艺术世界的诞生。而能够促成这一过程深入进行的动力则是作家认识世界的思想力，体验现实的感受力，投身于现实的热情，合而称之，即为“主观战斗精神”。\n\n（二）胡风以“主观战斗精神”说为基础来构筑他的文学理论体系，同时又有现实针对性地提出三个重要的观点，作为支撑其理论体系的三个支柱：\n\n其一是“到处都有生活”说，即主张在题材的问题上让作家有充分选择的自由，不加任何限制，作家应根据所熟悉的生活范围和适于自己艺术创造力发挥的条件去确定写作的题材。\n\n其二，胡风提出“精神奴役创伤”说。他认为应当承继“五四”提倡过的“改造国民性”主题，应看到人民群众的“精神要求虽然伸向着解放，但随时随地都潜伏着或扩展着几千年的精神奴役底创伤”。他还认为三四十年代存在一种将人民抽象化、理想化，同时贬低知识分子历史作用的倾向，他把这种倾向称为“民粹主义底死尸”复活。因此，他很反感那种将知识分子从人民中间抽离出来另眼看待的做法。\n\n其三，胡风还提出了“世界进步文艺支流”说，他认为“五四”文学革命运动“正是市民社会突起了以后的、积累了几百年的、世界进步文艺传统底一个新拓的支流”，强调“五四”文学与世界文学的联系。\n\n二、胡风理论的价值\n\n胡风是马克思主义文艺理论中国化的重要探索者。他不断突破当时文艺学界的各种理论禁锢，拓展马克思主义文艺理论的深度和广度。其中国化探索突出体现在以下几个方面：用“主客观化合论”对文艺创作的内在机制作了辩证阐发；用“精神奴役创伤”论将马克思主义的异化观在文艺领域作了拓展性阐述；用“主观战斗精神”论构建了中国马克思主义文艺能动反映论；用“到处都有生活”说拓展了革命现实主义的理论论域；在“五四传统一现实主义”阐释框架中深入探讨了“民族形式”问题。这些构成了一个涉及文艺诸多重大问题且有着严密的逻辑结构和理论自洽性的革命现实主义文艺理论体系。胡风的这一理论体系是20世纪马克思主义文艺理论中国化进程中的重要成就，其历史地位和学术价值都不容置疑。","keywords":"重体验的现实主义 主观战斗精神 到处都有生活 精神奴役创伤 世界进步文艺支流 马克思主义文艺理论中国化","note":"胡风的理论和对他理论的批评是四十年代现实主义“主观”问题论证的重要内容，是考查时常常会提到的内容，他的理论有其不成熟的地方，但也有很强的积极意义，大家要有所掌握。相关内容可以参考陈思和《胡风对现实主义理论建设的贡献》，具体资料可以在李凡文学正版群领取。胡风理论中一些重点概念，比如主观战斗精神、精神奴役创伤这些在名词解释中出现的频率并不低，大家也要留意一下。"},{"id":"212","stars":"★★★","title":"以赵树理为代表的作家创作的历史特点是怎样的","body":"赵树理被解释为一种新型文学方向的代表，是能体现毛泽东《在延安文艺座谈会上的讲话》所提出的文艺路线的典范。由于赵树理的创作顺应了大众化的文艺方向，这种“方向性”的提倡对整个解放区文学乃至五六十年代的文学，都影响巨大。而以赵树理为代表的一批作家的创作主要有以下历史特点。\n\n一、致力于推动文学的大众化\n\n赵树理追求大众化主要是出于一种生活实践的内在的要求，是与农民进行精神对话的自然需要，而不是自上而下的赐给，所以他不像二三十年代许多提倡大众化的革命作家那样，写出来的作品总是有些隔阂，往往“衣服”是民众的，“品貌”仍是知识分子的。能够忠实地反映农民的思想、情绪、意识、愿望及审美要求，并真正能为普通的农民所接受，这是赵树理这一代作家最突出的特点。\n\n二、作家的创作是自己亲身经历的历史变革的文学记录\n\n赵树理及其所代表的这一代作家的另一个重要历史特点是：他们首先是从事革命的实际工作者，然后才是作家；他们直接参加革命与建设的实践活动，长期忘我地在农村基层参与农村变革，他们的创作是自己亲身经历的历史变革的文学记录。生活创造者与生活描写者统一的这种社会实践和创作方式在赵树理身上表现得尤为突出，这决定着他（及他所代表的一代作家）的文学观及创作姿态。\n\n三、“问题小说观”\n\n赵树理的“问题小说观”，使得他能够深入到实际生活的深处，去揭示和针砭社会变革中的偏差与弊端；共产党所领导的农村变革与其相应的方针政策对农民命运、心理、情绪的影响，成为赵树理观察与表现农村生活的重心所在。他自觉地追求创作与现实生活紧密配合的宣传、鼓动作用与指导作用，又不滞留于公式化、概念化的困境，他的作品除了融入对农民的挚爱情感，也融入历史考察的理智。这都构成了赵树理及其所代表的一代作家创作的历史特点。\n\n赵树理是在对“五四”以来新文学“欧化”倾向进行反省的基础上，建立他那种格外偏重大众化、通俗化的文学主张的，他主要从民间文学中汲取艺术营养，这在解放区作家中也有代表性。","keywords":"文学的大众化 亲身经历的文学记录 问题小说观","note":"赵树理被解释为一种新型文学方向的代表，是能体现毛泽东《在延安文艺座谈会上的讲话》所提出的文艺路线的典范。他所代表的，不单单是他自己，而是与他风格相近的一大批作家。赵树理相关的名词解释，我们需要重点关注的是一些作品如《小二黑结婚》，以及“赵树理方向”这一个比较关键的概念。"},{"id":"213","stars":"★★★","title":"以赵树理为代表的这一代作家创作上有什么不足","body":"一、文化修养不足，思想视野的相对狭窄\n\n赵树理是在对“五四”以来新文学“欧化”倾向进行反省的基础上，建立他那种格外偏重大众化、通俗化的文学主张的，他主要从民间文学中汲取艺术营养，这在解放区作家中也有代表性。\n\n他们虽然也在承续“五四”新文学的传统，但和二三十年代诸多新文学作家不同的是，他们与西方文学处于相对隔绝状态。这自然也是战争时期解放区遭受文化封锁的结果，与第一、二代作家，特别是与鲁迅、郭沫若、茅盾这样“学者化”了的文化巨人型的作家相比，文化修养不足及由之产生的思想视野的相对狭窄，无疑对赵树理及同代作家产生了消极影响；他们对于民间文化遗产的汲取自然也是一种补偿，但其缺失也是明显的。\n\n二、“问题小说观”的文学观念具有历史局限性\n\n赵树理及其所代表的这一代作家的另一个重要历史特点是，他们首先是从事革命的实际工作者，然后才是作家，这决定着他及他所代表的一代作家的文学观以及创作姿态，让他们产生了一种“问题小说观”。\n\n赵树理的这种“问题小说观”，使得他能够深入到实际生活的深处，去揭示和针砭社会变革中的偏差与弊端。他自觉地追求创作与现实生活紧密配合的宣传、鼓动作用与指导作用，又不滞留于公式化、概念化的困境，他的作品除了融入对农民的挚爱情感，也融入了历史考察的理智。这都构成了赵树理创作的历史特点。\n\n不用说，这同时包含着历史的特殊长处与历史局限性，并预伏着一定的危机。当农村变革运动及采取的相应政策基本符合历史发展的客观要求，符合人民利益和愿望时，党、人民、实际生活及作家自身的和谐、统一，有力地保证了赵树理式的“问题小说”政治倾向性与真实性的统一-赵树理本时期的创作基本上属于这一情况；而一旦党的指导方针政策发生了某种偏差，而且在一定的历史时期内不能得到纠正时，赵树理式的“问题小说”的创作就可能出现某种危机。","keywords":"文化修养不足 思想视野狭窄 “问题小说观”历史局限性","note":"赵树理可以说是解放区作家的一个代表，这种代表性既表现在成就方面，又表现在局限性方面。我们在看到赵树理的历史特点的时候，也要注意到，他的文学观念和创作实践也有不足的地方，主要表现在文化修养和思想视野等方面，需要我们辩证地进行分析。"},{"id":"214","stars":"★★★★","title":"在塑造农民形象方面，赵树理有什么继承与发展突破","body":"一、继承了之前的人道主义和阶级的观念，并选择直接与农民对话。\n\n从20年代鲁迅与乡土作家，到30年代的作家，他们都曾经出色地描写过乡土中国，而且大都以人道主义或阶级的观念去发现农民，他们笔下的农民主要作为被同情和怜悯的对象。赵树理事实上承继和推进了这一文学传统，不过他并不是从一般意义上发现农民，而是直接与农民对话，展示劳动者在逐步打破枷锁的过程中所焕发的历史主动精神和新的道德风貌。\n\n赵树理对农民的命运、思想、心理有深刻的了解，他处在农村大变革的历史情景中，深入地观察、把握农民的思想情感，他的小说总的来说具有了现实主义描写的艺术深度，出现了许多以往文学所不具备的新的素质。\n\n二、继承了鲁迅表现中国农民的大体角度，但主要表现中国农民在政治、经济翻身过程中所实现的思想上的翻身。\n\n在现代文学史上，赵树理是继鲁迅之后最了解农民的作家。赵树理深切地懂得旧中国农民的痛苦不仅仅在政治上受压迫，在经济上受剥削，而且在精神上被奴役，他最懂得农民摆脱旧的文化、制度、习俗束缚的艰难。这样，赵树理在观察表现中国农民社会时，就有了与鲁迅大体相同的角度，即从农民的精神面貌、心理状态以及人与人的关系的角度去进行历史的考察。\n\n但赵树理的时代又不同于鲁迅的时代，如果说鲁迅主要是揭露中国农民精神上的创伤，以唤起人们的觉醒，赵树理则主要表现中国农民在政治、经济翻身过程中所实现的思想上的翻身-农民精神、心理状态的变化，人的地位及家庭内部关系（长幼关系、婚姻关系、婆媳关系等）的变化，并且从这个变化过程中，来显示农民改造的长期性与艰巨性。\n\n三、继承了鲁迅开创的大胆清醒地正视人生，反对瞒与骗的现实主义的战斗传统，但写出了占主导地位的光明面和新生的事物。\n\n赵树理在解放区农民运动发展的初期，就从生活中发现并提出了关系着革命前途的根本问题，这正是鲁迅所开创的大胆清醒地正视人生，反对瞒与骗的现实主义的战斗传统在新的历史条件下的发展。\n\n由于时代前进了，解放区农民获得了初步的民主和经济上的翻身，他们的处境与地位已经不同于过去的任何历史时代，因此在赵树理的作品里，不仅写出了生活中的消极面和农民的弱点，更写出了占主导地位的光明面和新生的事物。他如实地描写农民，有歌颂也有暴露，但是在作品中占支配地位的是进步力量。他的作品尽管描写了老一代尚未觉醒的农民，描写了被封建思想毒害的农民干部和知识分子，但是读了之后仍给人以信心和力量，其原因，就在于他还塑造了更多的农村新人的形象，描写了新人物
