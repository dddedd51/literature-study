出现的社会环境。","keywords":"人道主义和阶级的观念 直接与农民对话 表现中国农民的大体角度 现实主义战斗传统 光明面和新生的事物","note":"赵树理塑造中国农民的做法和鲁迅及鲁迅之后的作家一脉相承，但由于时代、环境的不同，赵树理在此基础上又有了新的发展，在思想主题、反映内容和创作方式上都与鲁迅做出了区分，这一点需要我们特别注意。"},{"id":"215","stars":"★★★★","title":"赵树理的现实主义有什么特点","body":"一、出现了许多以往文学所不具备的新的素质\n\n赵树理并不是从一般意义上发现农民，而是直接与农民对话，展示劳动者在逐步打破枷锁的过程中所焕发出的历史主动精神和新的道德风貌。\n\n农民化的作家赵树理并不只是属于农民读者的，他独特的艺术创造魅力让整个40年代的文坛惊异与叹服，因为赵树理对农民的命运、思想、心理有深刻的了解，他处在农村大变革的历史情景中，深入地观察、把握农民的思想情感，他的小说总的来说具有了现实主义描写的艺术深度，出现了许多以往文学所不具备的新的素质。\n\n二、现实主义战斗传统在新的历史条件下的发展\n\n鲁迅和赵树理都看到了想要改变，最重要的是农民必须不断与自己本身的弱点作斗争，勇于洗涤自己的灵魂，才能创造新的生活。赵树理在解放区农民运动发展的初期，就从生活中发现并提出了上述关系着革命前途的根本问题，这正是鲁迅所开创的大胆清醒地正视人生，反对瞒与骗的现实主义的战斗传统在新的历史条件下的发展。\n\n三、追求史诗性\n\n赵树理的有些小说也并不局限于揭示实际生活中的问题，而力图以更阔远的目光去观察近代农村社会的变迁，这类作品的思想内涵更为厚重一些，比如《李家庄的变迁》，尽管赵树理缺乏驾驭宏大生活场面的笔力，但这部小说的规模和它所包含的内容，显示了赵树理现实主义创作也有追求史诗性的企图。\n\n四、具有浓厚的地域民俗色彩\n\n赵树理小说描写新的天地、新的人群，都以晋东南农村为背景，其浓厚的地域民俗色彩，那山西味道、晋阳气息是构成他的现实主义艺术的重要方面。\n\n赵树理很少写自然景物，却用很多笔墨写民俗，写那种系乎水土地气的民风民性，他是把民俗作为一种“社会景物”、一种社会精神附着物。对他的小说而言，写民俗主要是为了提供一种文化和政治环境，表现人物在社会变革中的精神变迁，同时也为加强小说的故事性。民俗描写往往是赵树理小说最吸引人的部分，有的显然具有文化人类学的参考价值。后来在赵树理影响下形成的“山药蛋派”作家群，是当代文学中最有地域文化特点的流派之一，他们的创作也大都以充分的民俗描写展示现实主义的魅力。","keywords":"直接对话农民 新的素质 现实主义战斗传统 追求史诗性 地域民俗色彩","note":"赵树理在进行文学创作时，坚持了现实主义创作手法，这一点是从鲁迅等作家那里继承而来的。但同样是现实主义手法，在不同的作家的手中会显示出不同的特点，在赵树理这里便是追求史诗性和具有地域民族色彩。这既是归因于赵树理的创作理念，又是时代发展后提出的新的要求。大家要结合赵树理的具体作品和创作风格具体分析。"},{"id":"216","stars":"★★★★","title":"赵树理塑造了哪几类农民形象","body":"一、深受封建思想毒害还未觉醒、背负着沉重的历史传统的老一代农民\n\n这种农民类型的代表人物有《小二黑结婚》中的二诸葛，一个为封建迷信观念扭曲了的人物。《李有才板话》中的老秦，生活在社会最底层，却满脑袋封建等级思想。正是通过对这些背负着封建主义沉重历史包袱的旧式农民的深入剖析，赵树理才对解放了的中国农村社会有了自己独特的认识与发现：尽管在新社会，没落腐朽的封建经济制度已经消灭，但封建传统思想、小生产意识的影响仍然长期存在，要使农民真正获得精神上的解放，还需要一个漫长的历史过程。这一赵树理式的主题使赵树理的作品具有了同类农村题材小说所难达到的思想高度与深度。\n\n二、由于封建思想的毒害没有肃清而可能发生蜕变的年轻一代农民、甚至部分知识分子和干部\n\n赵树理深入地观察生活，敏锐地发现了年轻一代农民、甚至有些知识分子和干部也由于封建思想的毒害没有肃清而可能发生蜕变，《李有才板话》中的小元和《邪不压正》中的小昌就是这样。鲁迅和赵树理都看到了想要改变，最重要的是农民必须不断与自己本身的弱点作斗争，勇于洗涤自己的灵魂，才能创造新的生活。赵树理在解放区农民运动发展的初期，就从生活中发现并提出了上述关系着革命前途的根本问题，这正是鲁迅所开创的大胆清醒地正视人生，反对瞒与骗的现实主义的战斗传统在新的历史条件下的发展。\n\n三、农村新人的形象\n\n在赵树理的作品里，不仅写出了生活中的消极面和农民的弱点，更写出了占主导地位的光明面和新生的事物。他如实地描写农民，有歌颂也有暴露，但是在作品中占支配地位的是进步力量，塑造了更多的农村新人的形象-比如《小二黑结婚》里面的小二黑和小芹，同时描写了这些新人物出现的社会环境。\n\n赵树理写出了这些新人物的鲜明性格特征，还写出了他们之所以能够取得胜利和成长的典型环境。农民原来长期挣扎在水深火热的生活中，但在解放区新天地里，广大农民开始掌握自己的命运，过上了一种前所未有的新的生活。表现这些历史性的变革和塑造新的农民形象是历史赋予作家的新的使命，赵树理就是最早承担这一历史任务并取得突出成就的作家。","keywords":"封建思想毒害 沉重的历史传统 可能发生蜕变 农村新人形象","note":"赵树理笔下的农民形象分类主要是从由旧到新的程度进行划分的，在做具体分析时，大家注意结合具体人物进行。同时，赵树理笔下的农民形象和鲁迅笔下的农民形象，尤其是老一代农民形象有很多相似之处，可能会放在一起进行比较，大家要特别注意。"},{"id":"217","stars":"★★★★★","title":"试分析赵树理评书体式现代小说形式的特征","body":"【答题框架】\n\n赵树理对中国以说唱文学为基础的传统小说的结构方式、叙述方式、表现手段进行了扬弃与改造，创造了一种评书体的现代小说形式，既使农民为主体的中国读者乐意接受，又能够反映现代生活，表现现代中国人的思想、情感与心理。这主要有以下特点。\n\n一、讲究情节的连贯性与完整性\n\n赵树理扬弃了传统小说章回体的程式化框架，而汲取了讲究情节连贯性与完整性的结构特点：&#x5F00;头总要设法介绍清楚人物，故事连贯到底，最后必定交代人物的结局、下落，做到故事来龙去脉清楚，有头有尾。\n\n在故事叙述过程中，又借鉴了传统说书艺术中“扣子”的手法，在不破坏情节完整的条件下，做到大故事里套着小故事，并保留故事中的种种关节来吸引读者，类似于传统小说中的“欲知后事如何，且听下回分解”。整个叙事结构完整，脉络清楚，又时有波澜，能够“抓”住读者。\n\n二、借鉴评书、戏曲等艺术形式，注意小说的故事性与讲述性\n\n在描写与叙事的关系上，赵树理吸取传统评书式小说的手法，把描写情景融化在叙述故事中，把人物放在情节发展矛盾冲突中，通过自身的行动和言语来展现其性格，少有静止的景物与心理描写。赵树理喜欢用诸如小掌故、外号、嗜好、习惯动作或口头禅之类的印记式特征，去“定位”人物的思想性格，也和戏曲“脸谱”的功用相类似。评书或戏曲都重故事情节，讲究惩恶扬善。往往以“大团圆”结局，这些结构、模式的运用也都可以在赵树理小说中见到。\n\n当然，赵树理对评书、戏曲等艺术形式也不是一味地照搬，而是有所选择和扬弃，如摒弃了评书在小趣味上大加渲染的传统手法，适应今天读者的要求，力求使故事进展得快一点，主要的内容厚一点。\n\n同时，赵树理十分注意使创作能够适应自己直接的读者层-农民群众的欣赏水平、习惯、审美要求。赵树理注意小说的故事性与讲述性，使小说不光能看，也能朗读。这种口头性文体对于小说叙事结构的创新，丰富了现代小说的表现力。\n\n三、语言的艺术性和通俗性结合\n\n赵树理小说叙事风格明快、简约，富于幽默感，这很大程度上得力于他对小说语言艺术探索的成功。他不但在人物对话上，而且在一般叙述的描写上，都是口语化的；他的语言具有明白如话的特色，而且吸收了传统说书艺术的长处，能琅琅上口，具有可朗读性。但赵树理不同于那些仅仅模仿照搬传统形式的作家，在他的作品中，很少用方言、土语、歇后语，力图用最普通、平常的话语来准确传神地表现最丰富、复杂的内容。\n\n在语言的艺术性和通俗性的结合上，赵树理的语言达到了很高的境界。赵树理小说的风格适合农民大众，却又是非常个人化的。赵树理那种乐天、深厚而又幽默的情性，很自然地融会在他的泥土味的小说叙事格调之中。赵树理的小说即使不署其名，读者也很容易把他和其他作家区分开来。","keywords":"情节的连贯性与完整性 小说的故事性与讲述性 语言的艺术性和通俗性","note":"赵树理评书体的现代小说体式，看名字我们就知道，这一体式与传统评书等民间艺术息息相关。赵树理之所以会形成这一体式，与其创作理念有关，他希望创作既受农民欢迎，又能充分反映现代生活的现代小说，所以积极借鉴民间艺术形式，形成了自己独特的小说体式，大家要明确这一点。"},{"id":"218","stars":"★★★★★","title":"试分析四十年代赵树理小说创作的总体特征（25江南大学）","body":"赵树理出身民间，又自觉追求文学的民间性，甘愿毕生做一个“文摊文学家”。但他又并非像都市通俗小说家那样为商业利益而迎合读者，他照顾下层读者的接受习惯和审美趣味的目的，是想教育他们和提高他们的审美。这正与毛泽东《在延安文艺座谈会上的讲话》的精神暗合，因1949年以前，他被视为代表解放区文学“方向”的作家。赵树理这一时期的小说创作，主要具备如下特征：\n\n一、问题小说的追求\n\n赵树理及其所代表的这一代作家的另一个重要历史特点是，他们首先是从事革命的实际工作者，然后才是作家，这决定着他及他所代表的一代作家的文学观以及创作姿态，让他们产生了一种“问题小说观”。\n\n赵树理主张的问题小说不同于新文学初期的“社会问题小说”，而是“农村工作问题小说”，是自觉地以革命工作者的立场和身份去解决革命工作中的实际问题。他的问题小说不是为了立言，而是立行性的，是革命工作的一种方式。为了破除农村里“出租土地不纯是剥削”的错误观念，赵树理写了《地板》；关于解放区改造二流子问题，他有《福贵》；关于农业合作化中短缺文化人才，有《小经理》；关于农村家庭和人际关系中的旧观念，有《传家宝》；关于土改中的干部队伍不纯和工作偏差，有《邪不压正》。\n\n赵树理的这种“问题小说观”，使得他能够深入到实际生活的深处，去揭示和针砭社会变革中的偏差与弊端。他自觉地追求创作与现实生活紧密配合的宣传鼓动作用与指导作用，又不滞留于公式化、概念化的困境，他的作品除了融入对农民的挚爱情感，也融入了历史考察的理智。这都构成了赵树理创作的历史特点。\n\n二、新评书体的小说样式\n\n赵树理对中国以说唱文学为基础的传统小说的结构方式、叙述方式、表现手段进行了扬弃与改造，创造了一种评书体的现代小说形式，既使农民为主体的中国读者乐意接受，又能够反映现代生活，表现现代中国人的思想、情感与心理。这种小说体式主要有以下特点。\n\n（一）讲究情节的连贯性与完整性。赵树理扬弃了传统小说章回体的程式化框架，而汲取了讲究情节连贯性与完整性的结构特点。在故事叙述过程中，又借鉴了传统说书艺术中“扣子”的手法，整个叙事结构完整，脉络清楚，又时有波澜，能够“抓”住读者。\n\n（二）借鉴评书、戏曲等艺术形式，注意小说的故事性与讲述性。在描写与叙事的关系上，赵树理吸取传统评书式小说的手法，把描写情景融化在叙述故事中，把人物放在情节发展矛盾冲突中，喜欢用诸如小掌故、外号、嗜好、习惯动作或口头禅之类的印记式特征，去“定位”人物的思想性格，往往以“大团圆”结局。\n\n同时，赵树理注意小说的故事性与讲述性，使小说不光能看，也能朗读。这种口头性文体对于小说叙事结构的创新，丰富了现代小说的表现力。\n\n（三）语言的艺术性和通俗性结合。赵树理不但在人物对话上，而且在一般叙述的描写上，都是口语化的；他的语言具有明白如话的特色，而且吸收了传统说书艺术的长处，能琅琅上口，具有可朗读性。在语言的艺术性和通俗性的结合上，赵树理的语言达到了很高的境界。赵树理小说的风格适合农民大众，却又是非常个人化的。\n\n三、民间化的幽默艺术\n\n赵树理是解放区和根据地土生土长的作家，有地道的农民气质，对农民满怀深情，了解中国农民的痛苦与渴望新生的愿望，也洞悉中国农村的历史复杂性。因此，赵树理是自觉贴近农民，努力怀着乐观的期待，用喜剧的笔调去书写他们在新变革时代里的成长。\n\n这又不是生活的美化与简化，赵树理真诚地正视着农民成长过程中不可避免的新旧矛盾和冲突，但在他的笔下，这主要不表现为你死我活的尖锐斗争，而是生活本身的人情世态。面对农民身上的缺点和落后意识，赵树理总抱着同情和理解去认真地批评，而不是严厉批判。所以他的小说不是讽刺喜剧，而是幽默喜剧。这又不是俯看人生、显示精神优越感的知识者式的幽默，而是贴近普通人、闪烁着民间智慧的乡土幽默。\n\n富有时代感的民间幽默小说的创造，是赵树理富有个性的美学特色。\n\n四、浓郁的地域民俗色彩\n\n赵树理的小说都以家乡晋东南农村为背景，浓郁的地域民俗色彩也是他显著的创作特色。禾场炕头，男耕女织，节庆葬敛，敬神驱鬼，婚俗礼仪，吹拉弹唱，家长里短，都能娓娓道来，写得鲜活生动又贴切自然。这种生趣盎然的乡风民俗色彩，与民间幽默美学、新评书小说体式相得益彰，铸就了赵树理小说世界的独特性。","keywords":"问题小说的追求 新评书体的小说样式 情节连贯性与完整性 故事性与讲述性 语言艺术性和通俗性结合 民间化的幽默艺术 浓郁的地域民俗色彩","note":"赵树理的小说创作可以说是四十年代解放区文学创作的代表，并且对之后中国新文学的发展产生了重大影响，故此在考查中出现的频率非常之高。赵树理小说创作的总体特征是“问题小说”的创作观念，在小说形式上采用新评书体，整体呈现出民间化的幽默艺术和浓郁的地域民俗色彩。需要注意的是，赵树理的“问题小说”和“五四”时期的“问题小说”有很大的差别，同时在回答第三点新评书体小说样式时注意将前一道题的内容补充进来。"},{"id":"219","stars":"★★★★★","title":"赵树理对中国新文学的贡献是怎样的","body":"一、赵树理代表着一种新的文学方向\n\n赵树理被解释为一种新型文学方向的代表，是能体现毛泽东《在延安文艺座谈会上的讲话》所提出的文艺路线的典范。由于赵树理的创作顺应了大众化的文艺方向，这种“方向性”的提倡对整个解放区文学乃至五六十年代的文学，都影响巨大。\n\n赵树理是在对“五四”以来新文学“欧化”倾向进行反省的基础上，建立他那种格外偏重大众化、通俗化的文学主张的，他主要从民间文学中汲取艺术营养，这在解放区作家中也有代表性。赵树理的出现不仅宣告了文艺大众化在解放区的成功，也不仅意味着一种新的农村题材小说模式的崛起，更重要的是，它还标志着知识分子叙述者全面让位于政治话语主体，标志着“五四”以来的中国新文学真正开始了整体结构的转型。\n\n二、坚持现实主义表现手法，继承与发展了鲁迅等农民形象塑造手法\n\n赵树理继承了之前的人道主义和阶级的观念，并选择直接与农民对话，继承了鲁迅表现中国农民的大体角度，主要表现中国农民在政治、经济翻身过程中所实现的思想上的翻身，继承了鲁迅开创的大胆清醒地正视人生，反对瞒与骗的现实主义战斗传统，更写出了占主导地位的光明面和新生的事物。\n\n如同老舍笔下的北京市井风俗为人们认识北京文化展示了生动的图景，赵树理对晋东南农村习俗的描绘也为人们了解北方黄土地文化的特色保留了最真实的素材，后来在赵树理影响下形成的“山药蛋派”作家群，是当代文学中最有地域文化特点的流派之一，他们的创作也大都以充分的民俗描写展示了现实主义的魅力。\n\n三、开创了评书体现代小说形式\n\n赵树理对中国以说唱文学为基础的传统小说的结构方式、叙述方式、表现手段进行了扬弃与改造，创造了一种评书体的现代小说形式，既使农民为主体的中国读者乐意接受，又能够反映现代生活，表现现代中国人的思想、情感与心理。其特点主要有四：第一，结构上讲究完整性、连贯性和戏剧性，有头有尾，环环相扣。第二，写人物注重行动性，让人物在自己的语言和行动中鲜活起来，少有静止的心理刻画。第三，将描写融于叙述，但不像传统评书那样大加渲染小趣味，力求节奏更快一些，适应现代的阅读需求。第四，运用经过提炼的生活化语言，笔调幽默轻快，有田间讲古、炕头谈心般的亲切感。\n\n赵树理是有意将小说作为通俗故事来写的，他对小说叙事结构和语言的探索，获得了突出的成就，实现了艺术性与大众性的比较完美的结合。这正是赵树理创作的主要特色和贡献，并由此决定了赵树理在中国现代文学史上的特殊地位。\n\n四、政治术语和方言土语的杂糅\n\n赵树理小说中人物语言扑面而来的乡土气息成为后来作家们的榜样，他在人物语言中偶尔夹杂一些政治术语，也有不少仿效者。\n\n政治术语和方言土语的杂糅有利于显示人物的政治角色，更深一层还可以见出人物和政治的关系情状。现代小说中政治术语的复杂运用，始作俑者是鲁迅-《采薇》中写“华山大王小穷奇”由周武王的“恭行天罚”而发明自己的“恭行天搜”-而做出进一步发展的是赵树理，赵树理让善良的农民偶尔讲一些政治术语时，总是有意识地强调因为不理解不熟练而产生的心虚和羞涩。他没有违反实际，勉强他们说得流畅自然，这就比较真实地反映了农民在当时历史条件下的政治觉悟和思想水平。赵树理的这一语言成就得到了后来文学家的全面肯定，成为了后来作们的榜样。","keywords":"新的文学方向 现实主义手法 农民形象塑造 评书体现代小说形式 政治术语和方言土语的杂糅","note":"赵树理的文学贡献，是经常被考查到的重点内容，需要我们牢固掌握。赵树理对于中国新文学的贡献，不仅仅是一个“赵树理方向”，更包括对小说人物塑造、形式、语言等多方面艺术的推进，对当时以及十七年时期的小说创作都产生了重要影响，大家要干万注意。同时，这部分内容还可以用来回答“赵树理的文学意义”这样的问题，大家可以灵活变通。"},{"id":"220","stars":"★★★★","title":"如何理解“赵树理方向”","body":"毛泽东延安文艺讲话之后，赵树理成为解放区文学的典范作家，“赵树理方向”即成为工农兵文艺方向的代表。关于“赵树理方向”，我们需要注意以下内容：\n\n一、“赵树理方向”的内涵\n\n所谓赵树理方向，即是指赵树理的创作精神及其成果，实应为边区文艺工作者实践毛泽东文艺思想的具体方向。而赵树理创作精神，主要表现在以下方面：\n\n（一）继承并发扬了“五四”新文学的革命现实主义传统，真实地反映了解放区现实生活，塑造了新的农民形象。满足“历史要求”，为现代文学注入了新质。\n\n（二）较好地解决文艺的民族化、大众化问题，赵树理的作品从内容到形式，真正具有“新鲜活泼的、为中国老百姓所喜闻乐见的中国作风和中国气派”。\n\n（三）正确地处理文艺与政治，作家与群众的关系，始终强调现实主义的文学不但要真实反映现实，而且要在改造现实中发挥自己的力量。\n\n二、“赵树理方向”提出的原因\n\n四十年代，解放区文艺界提出“赵树理方向”，赵树理的小说被作为解放区文学的旗帜，是必然的。\n\n毛泽东延安讲话之后，一大批从国统区来的作家，都是需要转变世界观和需要熟悉工农兵的城市知识分子，自身的“改造”尚需时日，更不可能在一个短时期内就创作出“人民群众喜闻乐见”的、与党的方针政策完全合拍的大众文学。\n\n赵树理对农村的熟悉，对共产党农村工作作风的了解，对农民革命的热衷以及他得天独厚的民间艺术积累，都注定他将\n\n成为这个历史时期解放区文学的楷模。他通过自己的创作实践，解决了许多现代作家想解决而没能解决的文艺的民族化、大众化问题；解决了文艺“为什么人”和“如何为”的问题；体现了《讲话》精神。这些对当时解放区文艺的发展确实具有普遍的、积极的引导意义。\n\n三、“赵树理方向”的意义\n\n（一）历史意义\n\n就解放区文艺的发展看，《讲话》的功绩是不容抹杀的。在当时的社会历史环境中，提倡文艺为工农兵服务，号召文艺工作者深入到工农兵群众之中是非常必要的。“赵树理方向”作为当时文艺界提出的一个口号，在促进《讲话》精神的贯彻、实施上有其特殊的贡献，在繁荣解放区文艺方面也有显著的功绩，这是有目共睹的事实。\n\n（二）现实意义\n\n赵树理的创作精神最突出的是：深入生活，实事求是的精神；自觉为人民群众服务的精神，孜孜不倦，坚持文学大众化、民族化的精神。这些创作精神，对当今的文学创作仍具有积极作用。\n\n新时期文学创作取得了巨大成就，但也出现了某些问题。一些作家在享受创作自由时，创作观出现了偏差。他们将政治与艺术对立起来，片面强调文学的审美作用，贬低甚至否定文学的教育作用。有的作家以表现自我为追求，忘记了社会主义文学的宗旨-为社会主义服务、为人民服务。有的作家把文学当作商品，只讲名利，不讲社会责任。在这样的创作观的指导下，创作难免要出现失误。“实事求是”“为人民群众服务”“文艺民族化、大众化”正是当前文学发展中应当解决的问题。这也就是重新认识“赵树理方向”的现实意义之所在。","keywords":"内涵 具体方向 革命现实主义传统 民族化、大众化 处理关系 提出原因 引导意义 意义 历史意义 促进《讲话》精神贯彻、实施 繁荣解放区文艺 现实意义 创作精神","note":"从20世纪80年代中后期至今，围绕赵树理的文学创作和“赵树理方向”的文学史评价和学术研究，开始重新受到文学批评界及学术界的重视，众多研究者纷纷提出要重新认识“赵树理方向”，对于这一概念的认识也莫衷一是，故而许多学校会专门针对这一关键概念出题，所以这也是赵树理相关内容中比较重要的一个知识点，大家最好全面掌握。"},{"id":"221","stars":"★★★★★","title":"试分析赵树理小说创作的民族化大众化特色","body":"赵树理是真正的人民的艺术家，他熟悉农民，热爱农民，用自己的创作为他们服务，一直坚持在“五四”以来许多革命的文艺家就努力探索的民族化大众化的道路上迈进。\n\n一、赵树理坚持民族化大众化的原因\n\n（一）因为出身而与农民联系紧密\n\n赵树理是解放区土生土长的作家。他出身农民，从小生活在农村，后来又一直在农村工作，具有地道的农民气质，不仅熟悉农民的日常生活，而且了解他们的精神世界。比起一般作家来，赵树理对农民有一种特别深厚的感情。他始终坚持为农民创作，他的小说写的都是农民生活，反映的都是农村现实生活中的情况和农民关心的问题。\n\n（二）赵树理希望改变“五四”以来新文学创作脱离农民的状况\n\n在现代文学史上，由于客观环境的限制和新文学本身的的“阵地”缺点，人民群众特别是广大农民和新文学很少有什么关系。一些革命的文艺家也看到这一问题，曾经多次掀起文艺“大众化”的讨论，甚至有人在创作上还作过初步尝试。然而问题得不到真正解决。造成这种状况的原因之一就是许多文艺家虽然主张大众文艺，提倡民族化，却一直不明白“大众文化，实质上就是提高农民文化”这一问题，忽视农民的存在，赵树理希望改变这一状况，所以坚持民族化大众化的方向。\n\n二、赵树理小说创作民族化大众化的表现\n\n赵树理大量吸收了中国古典小说和民间说书艺术的传统手法，对它们给予必要的改造，在此基础上，创造出人民群众喜闻乐见的新的艺术形式。\n\n（一）在作品结构上讲求“顺”和“连”\n\n以作品的结构言，赵树理的小说就很讲求“顺”和“连”-这也是我国民族说唱艺术的基本要求。群众听说唱文学，要求有头有尾，顺理成章，连结有序，脉络分明，他们对小说的叙述故事也是同样的要求。赵树理深知群众的习惯和爱好，很懂得其中的学问。他的小说无论是开头、连接、结尾，都注意照顾读者的习惯。\n\n例如作品的开头，赵树理有时不惜用很长篇幅详细交代小说故事发生的时间、地点、人物，让读者一开始就心中有数。在叙述过程中，赵树理串连故事时会非常注意故事发展的连贯性，中间尽量不要有大的跳跃。作品的结尾也是如此。一股农\n\n民读者不喜欢作品戛然而止或留下“悬念”，而希望事情和人物都有个完满的结局。赵树理也很重视这点，他的小说对人物命运、事态结局，都-交代清楚，并且也几乎都采取了“大团圆”的结尾。\n\n（二）将人物形象和人物关系融化在故事叙述和发展之中\n\n赵树理小说的人物描写也学习了传统艺术手法。他很少精雕细刻人物的外貌，也不作大段细腻的心理描写，人物性格通常在几个短短的故事叙述中就明朗起来。他善于通过对话表现人物性格，读者只要从对话中就可以想象出人物的模样。为了突出人物，赵树理在小说中还不轻易描物状景，必要的景物描写也节省到最低限度。\n\n赵树理只是生动自然地讲故事，让人物自己行动，把人物的关系融化在故事的发展中，把自然和社会环境融化在人物的眼睛里和语言里，不露一点描写的痕迹。可以说，赵树理真正学得了中国传统小说表现人物方法的神髓。\n\n（三）语言通俗易懂，雅俗共赏\n\n赵树理小说的语言更具有民族化大众化的特色。可以说，从“五四”以来，赵树理是最早的真正用人民大众的语言写作而获得成功的语言艺术家，他的作品的出现，根本改变了过去文学作品的语言为广大劳动人民不懂、不熟悉、不喜欢的情况。\n\n赵树理对语言问题有一个总的看法，即认为语言应该属一个民族的说话习惯，不应该属作品的写作方法。他在进行创作时，宁肯在语言的艺术化方面“能化多少就化多少”，也不肯“违背中国劳动人民特有的习惯”。正因此，他的作品，只要是中国人，有一定文化水平的群众就看得懂，念起来，不识字的人也听得懂。老幼能懂，这是作品语言的通俗化大众化；雅俗共赏，这又是作品语言艺术力量的所在。于通俗中见精炼，于朴素中见隽永，于自然中见严谨和幽默，不以华丽自炫，不以古奥惑人，简朴实在，平易近人，这正是一个艺术家的真本领，真功夫。\n\n三、对赵树理民族化大众化特征的评价\n\n赵树理坚持为农民创作，努力在民族化大众化的道路上迈进，他的精神，他的方向，是完全应该肯定的。从“五四”文学革命开始的新文学运动，总的说来正是朝着民族化大众化的方向发展的。尽管在二、三十年代，新文学有这样那样的缺点，没有很好接通和人民大众的关系，但是革命的文艺家一直在努力解决这个问题。他们为此进行过多次讨论和各种探索。赵树理是在他们的基础上，在他们之后，用自己的创作闯出了一条新路，他在民族化大众化方面取得的成绩是不能低估，更不能抹煞的。","keywords":"原因 与农民联系紧密 改变新文学创作脱离农民的状况 表现 作品结构“顺”和“连”人物形象 人物关系故事叙述和发展 通俗易懂 雅俗共赏 评价","note":"民族化与大众化文学思潮可以说是贯穿整个中国现代文学史的一个思潮，并且学术界近年来对于这一思潮也越来越重视。而在现代文学史诸多重要作家中，赵树理创作的民族化大众化特色是比较明显的，故此我们要注意。赵树理的小说创作之所以具有民族化大众化的特征，既是得益于其农民的出身，又与其创作理念息息相关，而这一特点的表现就在于对民间艺术的借鉴上。相关内容可以参考张恩和《论赵树理小说创作的民族化大众化特色》，具体资料可以在李凡文学正版群中领取。"},{"id":"222","stars":"★★★","title":"张天翼后期的创作风格是怎样的","body":"一、专注暴露与讽刺，注意表现潜伏的危机\n\n随着抗战的持续深入，作家们的视线由光明转向阴暗。由张天翼带头掀起的暴露、讽刺小说的浪潮袭来。张天翼的《华威先生》便以提供了一个“包而不办”的抗战文化官僚的典型形象而著称。这篇小说急就于1938年2月的战时长沙，是作者对抗战热情掩盖下的社会现实的敏锐一瞥，却积淀着他长期丰厚的生活经验。《华威先生》之所以成为张天翼的代表作，是因为它批判的尖锐和内涵的深远、讽刺笔调的冷峭、叙述节奏的明快、语言的劲捷、短篇体制的圆熟，都达到了相当高的水准。特别是华威这个典型，可以进入中国现代文学的人物画廊。\n\n在抗日统一战线刚刚形成的历史时期，张天翼最早透过光明，看清了潜伏的危机，揭发出内部存在的争夺领导权的严酷性。这一切，被以后的历史确凿地证明了，华威这个人物形象，也因其包含着的历史预见性，而熠熠发光。\n\n二、讽刺尖锐而有分寸\n\n张天翼把讽刺的笔触伸向旧社会生活的各个方面，真实反映那个“畸形的社会”的病态人生，特别是小市民以及小知识分子的灰色生活，关注底层劳动人民的疾苦。《“新生”》里的知识分子李逸漠，被抗战打破了隐士梦，想要新生又让旧的生活方式箍得紧紧的，在华威、谭九和抗日民众之间急剧摆动，成为时代的孤独者。作者在写这个人物时，讽刺的火焰减弱，而全力暴露他的脆弱、寂寞的内心。可以看到，张天翼这时运用讽刺和暴露的分寸感，已经掌握得十分精确。\n\n三、短篇小说创作手法纯熟\n\n张天翼本质上是一个优秀的短篇小说家，凡较长的作品都写得不够精练。他于近百部短篇中，造就出一种善于运用夸张的线条、充满戏剧性节奏韵律、用切入的方式来展示性格的讽刺小说体制。张天翼塑造讽刺典型形象的艺术表现手法灵活多样，他善于从日常习见的生活现象中提炼出富有典型意义的情节，善于漫画式的、粗笔勾勒的夸张，来刻画、塑造人物形象，展示人物的性格，使人物形象鲜活、生动，从而造成强烈的讽刺效果，其作品内涵深远、笔调冷峭、节奏明快。","keywords":"现实主义手法 讽刺尖锐有分寸 短篇小说创作手法纯熟","note":"在沙汀、艾芜之前，张天翼是最富盛名的讽刺小说家，与沙汀关注农村不同，张天翼的讽刺直指各式官僚，这其中便以《华威先生》为典型代表。四十年代讽刺小说繁荣的一个表现便是拥有重大讽刺典型，尤其是各式官僚形象，这其中张天翼功不可没。故此，对于张天翼的小说创作，我们需要关注。"},{"id":"223","stars":"★★","title":"张天翼《华威先生》取得成功的原因","body":"《华威先生》是张天翼的代表作，也是抗战时期一部影响很大的讽刺力作。主人公华威先生是现代文学史上一个独特的艺术典型具有较高的认识价值和审美价值。这部小说之所以取得成功，离不开作者的努力，具体来说，主要包括以下方面内容：\n\n一、积淀着作者长期丰厚的生活体察\n\n张天翼的《华威先生》以提供了一个“包而不办”的抗战文化官僚的典型形象而著称。这篇小说急就于1938年2月的战时长沙，是作者对抗战热情掩盖下的社会现实的敏锐一瞥，却积淀着他长期丰厚的生活体察。华威先生是国民党统治区的一个“消极抗日、积极反共”的国民党政客形象，是抗战时期文化官僚的代表。通过华威先生这一艺术典型，作者有力地抨击了国民党破坏抗日统一战线，限制、防范、敌视人民群众抗日活动的罪行。\n\n二、讽刺尖锐，写作技法纯熟，塑造人物典型\n\n《华威先生》之所以成为张天翼的代表作，是因为它批判的尖锐和内涵的深远、讽刺笔调的冷峭、叙述节奏的明快、语言的劲捷、短篇体制的圆熟，都达到了相当高的水准。特别是华威这个典型，可以进入中国现代文学的人物画廊。\n\n这个短篇几乎无情节，只有华威匆匆忙忙地钻进各种抗战会场进行表演的几个片断，像是一个人物“小品”。华威的忙，与解决任何实际的抗日问题都无关，他要的只是一切会议、团体统统由他占领，只是到处兜售“一个领导中心”，把一个党派的狭隘利益与个人私利充分地混合。这样，在抗日统一战线刚刚形成的历史时期，张天翼最早透过光明，看清了潜伏的危机，揭发出内部存在的争夺领导权的严酷性。这一切，被以后的历史确凿地证明了，华威这个人物形象，也因其包含着的历史预见性，而熠熠发光。\n\n三、具有超越时代的价值\n\n华威的个性极强，那种攫取权力的狂热性质、无孔不入的亢奋劲头、外部具有的“开会迷”的行为，使得这个典型特别隽永。因为人们不难在自己的周围碰到这种带点流氓气质、要权不要命的小官僚。这就使这个写得并不复杂丰富，而且不免有点类型化的人物，又有了某种超越时代的因素，各样的读者都能对他发生欣赏的兴味。","keywords":"生活体察 讽刺尖锐 技法纯熟 人物典型 历史预见性 超越时代","note":"《华威先生》取得成功，和作者对主人公华威形象的成功塑造密不可分。整部作品对抗战时期官僚主义的暴露和讽刺，都是通过这一形象完成的。不仅如此，在当下环境中，还是有华威这样的小官僚，因而这个形象具有超越时代的价值，大家对此要有所关注。《华威先生》作为比较重要的一部作品，在名词解释中出现的可能性也很高，大家要关注一下。"},{"id":"224","stars":"★★★","title":"沙汀后期的小说创作风格是怎样的","body":"一、内在的不露声色的客观描写和浓缩描写\n\n沙汀是抗战之后最杰出的讽刺小说家之一，具有与鲁迅逼似的沉郁厚重的讽刺美学品格。在鲁迅身后，赵树理之前，沙汀在讥刺中国农村现实方面是富有鲜明民族特色的作家。沙汀暴露的矛头直指国民党反动政府的种种积弊，而且十分尖锐，富有艺术概括力。在讽刺风格的不断发展中，他已经进入到一种内在的不露声色的客观描写和浓缩描写的境界。\n\n二、解放区特色\n\n沙汀在抗战初期曾有为时两年的延安及抗日民主根据地之行，这给他的小说带来了新的因素。这一时期的许多小说都增添了与解放区有关的内容。即或再写国统区阴暗的故事，也显出某种光明。如《勘察加小景》全篇在丑恶的记述中，处处把\n\n握住劳动人民之间的那点温情的诗意，把丑和美一并揭示，意蕴深厚。这篇小说恢复了沙汀早期作品《土饼》等以诗情点染穷困的笔法，而且技巧更加圆熟，对人生的体验更加耐人寻味。1944年，沙汀在国统区学习了毛泽东的《在延安文艺座谈会上的讲话》和整风文件后，创作思想有了变化。1946年写的《还乡记》，叙述的虽还是令人气闷的故事，却第一次塑造了走向集体斗争的贫农形象冯大生，在沙汀小说中初次闪出反抗者的光彩。冯大生最后又一次的出走，预示了人物思想性格发展道路的趋向。小说发表时碍于政治原因，不可能写得太露。但自发反抗不成，下一步的前途可以推测，悲观气息为之一扫。\n\n三、揭露旧时代的普遍黑暗\n\n抗战胜利前后和解放战争时期，沙汀创作日丰。短篇集《呼嚎》《医生》，以对四川农村的谙熟程度和高度的政治热情，敲起了蒋家王朝全面覆灭的丧钟。他几乎揭露了国民党濒临灭亡前干下的每一桩丑行。《范老老师》中出现了国统区人民争民主、反内战的新主题，而正面的农民和小知识者形象也开始挺直了脊骨，加强了历史反讽的深度。沙汀讽刺小说展开的社会动乱画面越广阔，返照旧时代普遍黑暗的价值便越大。\n\n四、革命现实主义的创作方法和含蓄深沉的艺术个性\n\n沙汀以革命现实主义的创作方法，和含蓄深沉的艺术个性，给中国现代讽刺文学带来贡献。他严谨的客观描写手法，并非是客观主义，而是将作者深深藏在人物、事件背后的独特表达手段。他严于选材，善于捕捉艺术细节，运用夸张和戏剧性情节，刻画出众多的旧时代农村基层统治者狰狞的喜剧形象，语言幽默质朴，比较口语化，富于地方色彩。他继承了中国古典讽刺小说的传统，深受“五四”乡土文学的影响，又认真借鉴了果戈理、契诃夫等以俄苏文学为主的外国文学经验，在现代讽刺小说的民族化方面取得了不凡的成绩。","keywords":"客观描写 浓缩描写 旧时代普遍黑暗 革命现实主义 含蓄深沉","note":"沙汀是抗战之后最杰出的讽刺小说家之一，他的小说创作与鲁迅理以及一系列乡土小说作家都有相同之处，如关注农村、接受俄苏文学经验等，不过沙汀更多地集中于暴露和讽刺，这一点需要我们有所了解。"},{"id":"225","stars":"★★★★","title":"钱锺书小说创作风格是怎样的","body":"40年代的讽刺最后是由钱锺书收束的。这种收束，无论是从讽刺主题的现代性上，或者是讽刺小说体式与世界文学当下的联结上，都是十分出色的一笔。钱锺书的小说创作特征，主要表现在以下方面：\n\n一、揭露抗战期间中上层知识界的众生相\n\n以《儒林外史》的描写气魄，揭露抗战期间中上层知识界的众生相，是钱锺书小说的主旨之一。他撩开爱情、亲情及家庭关系的帷幕，来洞穿受到封建传统文明与现代西方文明夹击的中国知识分子的精神病态，从而进行道德的探索和批判。短篇的视角稍显狭窄，但心理内涵深厚。\n\n钱锂书通过对各种留学知识分子的无情剖析，返照了西方社会文明的一个侧面。对中国西式知识分子的自嘲及中国化了的西方文明的再审视，是40年代相当一部分作家作品的共同倾向；与同一时期一些作家作品对中国传统文化的再发掘，形成了发人深省的强烈对比。如果与左翼作家愤怒斥责的政治讽刺相比，钱锺书对知识阶层的嘲笑，与整个中国命运的联系，当然不那样直接，但是他有历史透视的相当深度。\n\n二、反讽技巧高超\n\n钱钟书的反讽技巧高超，大到主题意蕴的暗示，小到对人物隐秘心理和心理转折的发掘，对人情世态的精致入微的观察和表现，都堪称独步。他的描写，无一不聪睿、俏皮、流动，在说天道地中掺入讽喻的机趣，在热辣的喜剧高潮之中仍能酿成足够的悲凉气氛。钱锺书有旁支斜出的叙述风格，有诡奇、尖刻、焕发机智、富有知识容量的书面讽刺语言，特别是编制新奇、犀利、多样的比喻句和警句，顺手拈来，即成妙语。只是有时显得枝蔓过多，不免有炫耀知识之嫌。\n\n三、注重暴露人性的弱点\n\n钱锺书小说讽刺的对象集中于人性的弱点，或者说人类用文化和情感掩盖的粗俗的动物本能，这本能因为毕竟被文化和情感掩盖着，经过了层层化装，更显微妙，揭示出来，也更惊心动魄。这一创作倾向在《人·兽·鬼》中体现了出来，除《灵感》一篇是对具体社会现象而发外，其余三篇均可视为这类作品。《猫》里的爱默、《纪念》里的曼倩与《上帝的梦》里那一对要求上帝为自己另造一异性的男女，显然有着内在的相通之处。这一创作倾向在作者此后所写的《围城》中得到了发展。\n\n钱锺书的讽喻小说，与左翼的政治暴露性讽刺不同，他熔道德、风俗、人情的批判于一炉，使一种机智讽刺得以确立，并大大增加了它的现代性质。在鲁迅、老舍、张天翼、沙汀之后，钱锺书成为现代文学又一位优秀的讽刺小说家。","keywords":"中上层知识界众生相 中国知识分子精神病态 反讽技巧高超 暴露人性的弱点","note":"钱锺书是四十年代最重要的讽刺小说作家之一，与沙汀关注农村不同，钱锺书更多关注的是中上层知识分子，并取得了突出的成就，成功收束了四十年代的讽刺小说。钱锺书相关的名词解释，主要是围绕其代表作《围城》出题，包括作品本身及其中方鸿渐这一典型人物，大家要留意一下。"},{"id":"226","stars":"★★★★","title":"试分析《围城》的多重意蕴","body":"钱锺书的《围城》是意蕴丰厚的长篇小说。其所表现的生活内涵，作者对社会、人生的思索及其独特构筑的“艺术世界”，需要反复琢磨，深入体味。《围城》基本采用了写实的手法，总体结构却又是象征的，其丰厚的意蕴大致表现为三个层面。\n\n一、“生活描写层”\n\n《围城》的第一个意蕴层，如该书出版序言中所说，是“写现代中国某一部分社会，某一类人物”。具体讲，第一个层面是对抗战时期古老中国城乡世态世相的描写，包括对内地农村原始、落后、闭塞状况的揭示，对教育界、知识界腐败现象的讽刺。《围城》用大量的笔墨客观而尖刻地揭示出一种丑陋的世态世相，读者从小可以感受到四十年代中国社会生活的某些落后景致与沉滞的气氛。这个描写层面可称为“生活描写层面”。\n\n二、“文化反省层”\n\n《围城》是从“反英雄”角度写知识分子主人公的，其“视点”在中国现代文学同类题材作品中显示出独特性：不只是揭露“新儒林”的弱点，或探求知识者的道路，而企图以写“新儒林”来对中国传统文化进行反省。\n\n“新儒林”中各色人物，其实都是古老文化受外来文明冲击而行将崩折的历史产物，是半殖民地文化上层上孳生起来的特殊的人群。《围城》试图以对这群“新式”知识分子（特别是留学生群）的心态刻画，来对传统文化进行反省，这正是作品的深刻所在。它不止于探索知识者的道路，而要更深入去反省知识者身上所体现出来的民族传统文化的得失，或者说，通过知识者这一特殊的角度，从文化层次去把握民族的精神危机。\n\n三、“哲学意蕴层”\n\n对人生、对现代人命运富于哲理思考的含义，这就是作为《围城》这部作品第三层面的“哲理思考意蕴”。将主人公方鸿渐所有的经历简化一下，那无非就是，他不断地渴求冲出“围城”，然而冲出之后又总是落入另一座“围城”，就这样，出城，等于又进城，再出城，又再进城......永无止境。这结构带总体象征意味，寄寓着作者对人生更深的哲学思考，概括起来就是：人生处处是围城。作品象征地暗示于读者：“城”外的人（局外人）总想冲进，“城”里的人又总想逃出来，冲进逃出，永无止境。超越一点儿来看，无论冲进，逃出，都是无谓的，人生终究不可能达到自已原来的意愿，往往是你要的得不到，得到的又终非你所要的。人生就是这么一个可怜的“寻梦”。从这一点来看，这部小说已经蕴含着类似西方现代主义文学中普遍出现的那种人生感受和宇宙意识，那种莫名的失望感与孤独感。","keywords":"生活描写层 文化反省层 哲学意蕴层","note":"《围城》是钱锺书先生的代表作，也是他唯一一部长篇小说，但仅凭这部小说钱锺书就可以在现代文学史上占有一席之地，可见这部小说的成就之高。而从思想内容来看，这部小说到如今仍具有现实价值，这是因为其不仅仅反映了当时知识分子的生存状况，反省了传统文化，更是因为其对现代人生存和命运的思考，对人生处处是围城的发现，这种思考与鲁迅对于“人只能无可奈何地返回自身”的发现一样，超越了时间。"},{"id":"227","stars":"★★★","title":"试分析《围城》中方鸿渐的形象（25黑龙江大学、26西北师范大学）","body":"在《围城》所写的为数众多的知识分子形象系列中，方鸿渐占据最重要的位置。他既是唯一贯穿全文的人物，又寄托着作者的思考。所以，理解方鸿渐就是理解《围城》的关键所在。\n\n一、方鸿渐的形象特征\n\n方鸿渐是钱锂书将自我平庸化后塑造出来的一个形象，是一个弱质的知识分子形象。这一形象，主要具备如下特征：\n\n（一）本性正直善良、聪明幽默\n\n方鸿渐本性善良正直、聪明幽默，有学问，性格和顺，有天赋的想象力，才气横溢，博闻强识，涉猎颇广；自尊心极强极敏感，容易受伤害；看人看事很有眼力，对虚伪和愚蠢颇有洞察力，谈话机智幽默锋芒毕露，是个“不讨厌”的好人。\n\n（二）意志薄弱、优柔寡断\n\n方鸿渐虽然本质不错，但意志薄弱、优柔寡断，既缺乏明确坚定的人生信念，也不懂得处世谋生的艰难。因而他极易为环境所左右，为他人所牵制，常常坠入尴尬难堪的境地。并且处处碰壁、步步退缩，每况愈下，正如赵辛楣所说，“全无用处”。\n\n二、方鸿渐失败的原因\n\n（一）社会原因\n\n方鸿渐身上有不良的习气，他本人也没有太大的才学；但从本质上看，他还是个善良的人。他对爱情，婚姻和职业的追求，反映了一个平凡的人的合理愿望；而一个合理的社会，原应满足这些愿望，但他却不幸生活在一个在作者看来时时处处都是“围城”的旧中国，这样，伴随着他的追求的并不是愿望的实现，而是无穷的困扰和苦恼，最后是孤独、幻灭和绝望。\n\n（二）自身原因\n\n方鸿渐的失败有客观原因，也与其自身的弱点有关。这首先表现在他胸无大志，在生活的追求和挣扎中，缺少奋斗的动力，犹如一叶孤舟，在生活的风浪中随波逐流了一阵之后便倾覆了。其次是懦弱无能。他是中国现代弱质知识分子的代表，始终生活在各类“围城”的矛盾夹缝中，没有勇气和能力主宰自己的命运，最后成了“围城”中“死的样品”。\n\n三、方鸿渐这一形象的意义\n\n（一）引发对传统文化的深刻反思\n\n《围城》以方鸿渐这样一个已经为传统文化衰腐性所消蚀掉活力的“生命的空壳”作为主人公，而这个“空壳”的外表居然又涂抹上许多洋味的时髦的色彩，其立意是很深的：读者会在中外文明的碰撞中来思考这样一位矛盾的角色，从而引发对传统文化深刻的反思。\n\n（二）是小说叙事的主要视角，在结构上贯穿全书\n\n从结构上来说，方鸿渐既是小说的主人公，又发挥着小说叙事的主要视角功能，是唯一贯穿全书的人物。对他充满喜剧色彩的悲剧命运和悲剧性格也从不断的发展和变化中来考察，作了整体的、多侧面的描写，并且寄托了作者的哲学思考。","keywords":"善良正直 聪明幽默 意志薄弱 优柔寡断 社会原因 自身原因 反思 主要视角","note":"方鸿渐是中国现当代文学史上又一个知识分子的典型，可以与孔乙己、潘先生、庄之蝶等知识分子形象联系起来，共同组成一个知识分子形象画廊。类似这样针对某一类形象发展出题的现象在当下考查中出现得越来越多了，大家要注意一下。"},{"id":"228","stars":"★★★★","title":"《围城》的艺术特色","body":"《围城》在艺术上取得了较高成就，是钱锺书小说创作艺术的集中表现，具体来说，表现在以下方面：\n\n一、基本内容是描写人性的弱点和表现人生的荒凉\n\n《围城》通过像男女、同路、同事、婆媳妯娌、亲家等这类比较一般的人际关系的描写，来揭示人类的“基本根性”尤其是劣根性。通过这类关系的描写以及形形色色的人物形象的塑造，人性的自私忌刻、贪鄙卑污、虚荣骄傲、偏执狭隘、奸诈狡猾以及意志薄弱等，就被淋漓尽致地展示了出来。\n\n以上述这种对于人性弱点的描写为基础，《围城》又艺术地表现了作者对于人生问题的某些感悟。在作者看来，人性既然是那样卑污狭隘，那么，人与人也就很难和谐相处，人生也就永远追求不到理想境界，然而人又是耽于幻想的，总希望新的处境胜于旧的处境，于是便永远摆脱不了“围城”心态，即在城外的想冲进去，而在城内的却想冲出来。描写人性的弱点和表现人生的荒凉是《围城》的基本内容。\n\n二、智慧型悲喜剧\n\n《围城》在中国现代文学史上堪称奇书，犀利俏皮中不乏睿智沉思，笑趣盎然处又见悲凉底蕴，描摹世相百态时融入知识才学，关切现实的同时又渗透文化辩难与哲性体悟。虽说小说整体上渗透着悲剧感，但这种悲剧感又不断被各种机趣盎然的穿插所漾开，而漾开后又在嬉笑中悄然回流。描写人性弱点时多体现为揶揄嘲讽的喜剧态度，表现人生荒凉时则多透露出沉重伤感的悲剧情调。作者的喜剧态度表现得比较明显，而悲剧情调流露得较为含蓄。二者交融，便构成了作品的基本审美特征。这不是那种主情性的含泪的笑式的悲喜剧，而是凭借智慧在笑与悲之间从容游走的智慧型悲喜剧。\n\n三、善用比喻、机智俏皮的语言特色\n\n《围城》的魅力，离不开它的夹叙夹议、取喻设警、犀利隽永、旁逸斜出又涉笔成趣的语言特色。钱钟书博闻强记，性喜联想，因而旁征博引，比喻联翩。这些比喻不仅有助于描绘难以直写的情状，有时还能通过本体与喻体间的联系形成强烈\n\n的讽刺效果。如讽刺方鸿渐买的假文凭“仿佛有亚当、夏娃下身那片树叶的功用，可以遮羞包丑”。同时，钱钟书能通过巧妙的修辞方法，出其不意地造成幽默的效果。如赵辛楣与方鸿渐在苏小姐家相遇，赵辛楣出于妒忌，故意表示傲慢。这时作品中是这样写的：“赵辛楣躺在沙发里，含着烟斗，仰面问天花板上挂的电灯道：‘方先生在什么地方做事呀？”\n\n四、反讽技巧高超，讽刺手法灵活多样\n\n钱锺书的反讽技巧高超，大到主题意蕴的暗示，小到对人物隐秘心理和心理转折的发掘，对人情世态的精致入微的观察和表现，都堪称独步。同时，《围城》中讽刺手法灵活多样，比喻、用典、比较、推理等手法中处处见锋芒，达到近乎完美的讽刺效果。\n\n作为学贯中西的大学问家，在《围城》中钱锺书大量采用中外文化、文学的典故。典故的内容除文学之外，还涉及哲学、宗教、兵法、医学、生物等知识。同时，《围城》中的比喻，来源广泛，标新立异，带有深刻的哲理意味。不仅如此，《围城》还擅长用讽刺性的比喻进行评点的技巧，显示出作者渊博的知识和丰富的经验。此外，《围城》中还采用了重复手法，增强了讽刺的艺术性。最后，在《围城》中，作者还能把彼此没有关联的事物放在一起进行比较，能找出别人难以发现的共同点，这样由此及彼达到了很高的讽刺效果。\n\n五、通过心理描写塑造人物\n\n《围城》人物塑造上也取得了成功。主人公方鸿渐是写得最为丰满的一个，另外一些人物也写得性格十分鲜明。如孙柔嘉表面稚弱而胸有城府，苏文纨表面文雅却自私刻薄；赵辛楣执著而稍嫌傻气，唐晓芙聪明却过于骄傲；李梅亭蝇营狗苟，顾尔谦阿谀逢迎，高松年老奸巨滑，韩学愈狠琐阴毒；鲍小姐淫荡，范小姐做作；方逐翁陈腐，陆太太势利。这些人物都能给人留下深刻印象。\n\n《围城》中人物塑造的成功，很大程度上得力于作者高超的心理描写才能。《围城》中运用了大量的心理描写来剖析人物的性格特征，如通过方鸿渐买文凭时一方面想买个假文凭返乡哄骗翁丈，另一方面又自命清高、不屑与爱尔兰人同流的矛盾心理突出方鸿渐的复杂性格，并巧妙地把反语、幽默用于心理刻画中，尖酸刻薄地嘲弄了方鸿渐这个不学无术又想欺世盗名、装潢门面的浪荡子。","keywords":"描写人性的弱点 表现人生的荒凉 智慧型悲喜剧 善用比喻 机智俏皮 反讽技巧高超 讽刺手法灵活多样 心理描写","note":"《围城》这部作品近年来在考查中出现的频率明显有增高的趋势，大家要格外注意一下。大家可以发现，《围城》这部作品并不靠情节取胜，而是以语言艺术见长，机智俏皮的语言和高超的反讽技巧正是这部作品的精华所在，这部分内容我们要掌握。相关内容可以参考刘亚萍《谈＜围城》的讽刺艺术》，具体资料可以在李凡文学正版群中领取。"},{"id":"229","stars":"","title":"路翎小说的艺术风格是怎样的","body":"一、关注流浪者和知识者，挖掘落后人们的奴性，又从暗淡平庸的心灵世界中看到人民精神力量的闪光。\n\n路翎笔下的人物众多，破产农民、矿工、卖艺人、船工、逃兵、妓女、匠人、教师、恶棍、商贩、青年学生等。但最主要的是两类：流浪者和知识者。\n\n（一）关注流浪者的生活遭遇与反抗力量\n\n战乱时代造成了大批颠沛流离的下层人物，这是一些被压在社会底层，背负着生活重担的人。这些流浪汉几乎处于绝境的生活遭遇，以及从他们身上进发出来的强烈的反抗力量，是路翎的主要注视点。路翎把“人性”中的强和弱纠合在一起，&#x4ED6;歌颂“强力”，又写出其中带有的“精神奴役的创伤”。他挖掘落后人们的奴性，又从暗淡平庸的心灵世界中看到人民精神力量的闪光。在这些小说中，小人物都具有一颗伟大的心。\n\n（二）表现抗战前后知识分子的悲剧道路\n\n历史地表现抗战前后中国知识分子的悲剧道路，也是路翎小说的主旨。最重要的作品当然首推长篇《财主底儿女们》。&#x5C0F;说在“一二八”到“七·七”以后这一个大的历史背景下，通过苏州首户蒋捷三家的分崩离析，第二代蒋蔚祖、蒋少祖、蒋纯祖三人不同的思想历程，试图表现“以青年知识分子为辐射中心点的现代中国历史底动态”。这是自巴金的《家》问世以来又一部描写封建大家庭及其子女道路的宏大作品。\n\n二、透过现实生活表现个人内心体验。\n\n路翎在现代心理小说的探索方面有得有失。实践着胡风派的理论，用主观精神的“扩张”，“拥入”客观世界，他的作品主观色调强烈，作者生命力的燃烧和突击、思想力量的伸展和膨胀，都是很明显的。他尤其以对人的精神世界包括无意识世界进行开掘为特色。\n\n路翎对人的理解，某些方面带有现代派的观念，这便是社会烙印与人性、兽性的混合。他的作品认为人的本性往往是被社会的表象掩盖的。人的生命是痛苦、高贵而孤独的，是一个搏战的过程，深层的挖掘会令人战栗。这样，路翎小说的心理刻画，在揭示人的灵魂的复杂、丰富性方面就别具特殊的价值；他运用错综的表现人物心理深广度的写法，在掌握大起大落的心理节奏，处理人物之间心理感应的波澜方面，显出一种陀思妥耶夫斯基的气质，也使得中国的现实主义小说在他手中与世界的文学潮流更接近。这是以路翎为代表的“七月”派小说的独特性所在。","keywords":"挖掘奴性 精神的闪光 知识分子的悲剧道路 现代心里小说","note":"路翎的小说创作显示出了明显的“七月派”的创作特色，在坚持了革命现实主义传统的同时，积极寻求主客观的相互拥抱、融合，大家可以将路翎小说创作的特征与“七月诗派”的诗歌创作主张以及特征联系起来，共同记忆。"},{"id":"230","stars":"★★★","title":"谈谈胡风现实主义理论和路翎小说创作的关系","body":"【答题框架】\n\n路翎小说十分明显地受到了以主观为核心的胡风理论思想的影响，这主要表现在以下方面：\n\n一、遵循“主观战斗精神”说，注重对人的精神世界的开掘\n\n胡风认为要强调作家的“主观战斗精神”，提倡重体验的现实主义。他认为创作主体需要在客观对象的活的表现中熔铸自己的同感的肯定或反感的否定，而客观对象也会以其真实性来促成修改，甚至推翻作家的上述认识。这个“相生相克”的动态过程的结果就是新的艺术世界的诞生。而能够促成这一过程深入进行的动力则是作家认识世界的思想力，体验现实的感受力，投身于现实的热情，合而称之，即为“主观战斗精神”。\n\n路翎实践着胡风派的理论，用主观精神的“扩张”“拥入”客观世界，他的作品主观色调强烈，作者生命力的燃烧和突击、思想力量的伸展和膨胀，都是很明显的。他尤其以对人的精神世界包括无意识世界进行开掘为特色。如长篇小说《财主底儿女们》下半部重点展现第二代蒋纯祖的漂泊颠沛生活与心灵挣扎历程。路翎对于人物悲怆心灵的深层拷问近乎残忍，大起大落，波澜震荡，不乏陀思妥耶夫斯基式心理小说的味道。\n\n二、遵循“精神奴役创伤”说，关注人性的同时又发掘他们精神力量的闪光\n\n胡风提出“精神奴役创伤”说。他认为应当承继“五四”提倡过的“改造国民性”主题，应看到人民群众的“精神要求虽然伸向着解放，但随时随地都潜伏着或扩展着几千年的精神奴役底创伤”。他还认为三四十年代存在一种将人民抽象化、理想化，同时贬低知识分子历史作用的倾向，他把这种倾向称为“民粹主义底死尸”复活。因此，他很反感那种将知识分子从人民中间抽离出来另眼看待的做法。\n\n路翎遵循胡风的主张，将目光对准了流浪者的“精神奴役创伤”。战乱时代造成了大批颠沛流离的下层人物，这是一些被压在社会底层，背负着生活重担的人。这些流浪汉几乎处于绝境的生活遭遇，以及从他们身上进发出来的强烈的反抗力量，是路翎的主要注视点。路翎把“人性”中的强和弱纠合在一起，他歌颂“强力”，又写出其中带有的“精神奴役的创伤”。他挖掘落后人们的奴性，又从暗淡平庸的心灵世界中看到人民精神力量的闪光。在这些小说中，小人物都具有一颗伟大的心。如《饥饿的郭素娥》中逃难流落至矿区的郭素娥，从肉体到精神都陷入极度的“饥饿”，却又健壮而狂野。\n\n三、遵循“到处都有生活”说，关注流浪者和知识者\n\n胡风提出“到处都有生活”说，即主张在题材的问题上让作家有充分选择的自由，不加任何限制，作家应根据所熟悉的\n\n生活范围和适于自己艺术创造力发挥的条件去确定写作的题材。\n\n路翎首先引起文坛注目的，是对于矿区苦难生活与人物悲痛心灵的表现及开掘，这一时期在作家笔下，出现了具有鲜明个性印记的两类人物：“农民型工人”和“流浪者型工人”。而这些题材的选取，与路翎曾任国民政府经济部矿冶研究所职员、煤焦办事处职员的经历有关。而《财主底儿女们》将目光对准知识者，反映封建大家族及其儿女的命运，则与路翎在作为苏州首富的外公家生活，耳闻目睹舅妗一辈争夺家产的痛切的生活和情感的积累有关。","keywords":"主观战斗精神 对精神世界的开掘 精神奴役创伤 关注人性 发掘精神力量的闪光 到处都有生活 关注流浪者和知识者","note":"众所周知，胡风对于七月派的创作有着至关重要的影响，而作为七月派小说作家的典型代表之一，路翎的小说创作毫无疑问地受到了胡风理论的影响，所以二者很有可能会被放在一起出题。大家在作答时，一方面要注意把握胡风的理论，另一方面要注意把握路翎的小说创作特征，同时要注意二者之间的联系。"},{"id":"231","stars":"★★","title":"冯至小说《伍子胥》有何特点","body":"一、依据历史又提炼历史、纯化历史，将古代逃亡故事与真实人生体验合而为一\n\n真正把象征体的小说写成杰作的，是诗人冯至的历史题材的诗化叙事体《伍子胥》。《伍子胥》可说是国统区作家利用战时生活的独特领会，把一个古代的逃亡的故事与一种真实的人生体验合而为一了。这部取材于历史故事的象征体诗化小说经过了16年的酝酿，最初是受到里尔克的《旗手里尔克的爱与死》所触发。等到抗战的大后方，在有了对现实生活的相当积累和足够的体验之后，冯至依据历史，又提炼历史、纯化历史，写出了与鲁迅《铸剑》主题迥然不同的诗体小说。\n\n二、注重表现感觉与体验，将“复仇”主题消解、转化为“抉择”主题\n\n《伍子胥》不按风俗细节或描写人事戏剧性争斗的写实体来写，也不按心理体来展示一个逃亡者的灵魂战栗，而是用一个个散文诗的片断来表现各种人事、风物在伍子胥一路飘泊中所引起的感觉和体验。对现实的影射不是全然没有，比如卞之琳便指出小说中写楚国七个伤病者被抛在野外有气没力地举起一只枯柴似的手来抵御乌鸦和野狗的情景，便是当时昆明人都知道的郊外倒毙的四川壮丁的命运。\n\n但这都是从伍子胥的总体逃亡感受中去表现，这感受就是他仿佛遭到了一次“抛掷”：“因为一段美的生活，不管为了爱或是为了恨，不管为了生或是为了死，都无异于这样的一个抛掷：在停留中有坚持，在陨落中有克服。”这就使我们理解到40年代体验型的小说，是如何在现实生活与历史生活的错综之中，升华出一个存在主义的人生命题：在关于怎样取舍的决定中，使人感受到了生命的意义。“复仇”的主题被消解、转化为一个“抉择”的主题。\n\n三、采用散文诗的形式，通过纯净的美的境界来表现人生认知\n\n冯至小说体验性的表达方式，既与路翎的情绪芜杂、一时泥沙俱下不同，又与爵青、袁犀的知性暗示不同。《伍子胥》将一种人生认知，用纯净的美的境界来表现。所谓平凡中出奇，于平静的风物描写的掩饰之下，来托出一个不安宁的灵魂，和这个灵魂对生命的诗化感受。作者擅长控制语言的情调、节奏，当伍子胥在吴市吹箫，小说的文字把具象、色彩、声音融会在一处，如同一篇美丽绝伦的散文交响诗在书中响起。所以卞之琳说：冯至由写诗到向小说领域的偶一尝试，“符合了现代世界严肃小说的诗化亦即散文化（不重情节）这样的创作潮流”。","keywords":"历史题材 诗化叙事 散文诗片段 影射现实 体验性的表达方式","note":"《伍子胥》这部小说很容易让大家想到鲁迅《故事新编》中的作品，尤其是《铸剑》这一篇，二者都涉及到了复仇，所以二者很可能被联系起来考查，大家要注意一下。《伍子胥》真正把象征体的小说写成杰作，历史题材与诗化叙事等艺术手法也和路翎有很大的不同，这都和冯至个人的创作经历息息相关，大家需要有所了解。《伍子胥》作为冯至十分重要的一部小说，在名词解释中出现的可能性很大，大家要关注一下。"},{"id":"232","stars":"★★★","title":"汪曾祺早期小说创作风格是怎样的","body":"汪曾祺的小说创作深受沈从文的影响，二人一脉相承，都属于抒情小说或诗化小说作家，在小说风格上有很大的相似性，如故事淡化，结构散文化，语言抒情化等。具体来说，汪曾祺的早期小说创作，主要具备以下特征：\n\n一、象征性的写法与中国笔记小说韵味结合\n\n汪曾祺于40年代末期表现出京派回忆型小说不绝如缕的传统。1948年出版的《邂逅集》收他早期的作品，其中最有代表性的《复仇》不着重故事，讲究的是气氛和人物造像，有现代派文学的影响痕迹，被现代哲理思想穿透。但这种象征性的写法后来与中国笔记小说韵味结合了，隐形的现代性更显得沉稳。\n\n二、对现代社会人性完美的无限向往，具有典型的京派小说风格\n\n汪曾祺对现代人性完美的向往，主要表现在以下方面：\n\n（一）美好的人物形象\n\n《老鲁》写战争时期一个普通校工的淡泊守志。《鸡鸭名家》里的孵鸡行家余老五、长途赶鸭能手陆长庚，《戴车匠》里车二尺长船用滑车和小小螺蛳弓的戴姓车匠，都具轻利、诚朴、守节的平民风尚。\n\n（二）对逝去的美的倚重\n\n汪曾祺小说有写“最后一个”的模式，像最后一个掌握孵化绝技的农人，像最后一个使用木车床的匠人，还有像《异秉》里写的最后一次檐下设摊的小贩王义成，都能激发起人们一丝永恒的怀旧情绪。\n\n由现代社会的缺憾，引出京派作家内心深藏的那块人类童年土地保存的那点古朴人情美、自然美的光影，象征着他们对现代社会人性完美的无限向往。追忆过去而连接明日，京派把历史前后打通，这一点正在汪曾祺身上体现出了出来。\n\n三、文体上继承真与幻的统一，而且更加爽朗\n\n汪曾祺的小说文体也继承了沈从文和废名的真与幻的统一，而且更加爽朗，越来越脱离隐晦。他的小说，描写的情绪内涵较深，平平出之，散发出文化的意味。结构貌似散漫，叙述似乎缺乏高潮，气氛的营造却足够浓厚。这是正宗的文化小说的路子。《鸡鸭名家》里的湖泊，即几十年后汪曾祺复出所写的名篇《大淖纪事》里的大淖，这仿佛预示了中国文化小说的未来。\n\n【李凡关键&#x8BCD;：象征性写法 京派风格 人性完美的无限向往 真与幻的统一】","keywords":"","note":"汪曾祺的小说与沈从文、废名一脉相承，又有自己的发展，很有特色，体现了京派小说的典型特征和在四十年代新的发展，大家需要对此有所了解。汪曾祺早期的小说多采用象征性笔法，发掘社会人性美，追求真与幻的统一，处处可见沈从文、废名等人的影子，大家可以将这几位联系起来记忆。"},{"id":"233","stars":"★★★★","title":"张爱玲对于中国文学史的贡献","body":"张爱玲是现代文学史上一位有独特地位的重要作家。她在文学史上的意义，在于她对现代文学的独特贡献。\n\n一、在题材上表现了中国社会在现代化进程中的两个重要侧面\n\n从题材上讲，张爱玲的小说为我们表现了中国社会在现代化进程中的两个重要侧面：一个是民国初期的都市旧式大家庭的生活，一个是十里洋场的都市市民人生。她用一支华丽的笔，从婚姻和家庭的角度，来表现上海和香港这两个殖民地都市社会充满病态的人生。她笔下的人生从封建的旧式大家庭，到都市日常生活，其中隐含着一个过程。这也与作者张爱玲本人的生活经历有关。还有一部分作品，张爱玲为我们展示了封建宗法家庭的文化背景，如何沉重地影响了看上去已经走出封建家庭的现代人。\n\n二、在小说文体方面取得了突出成就\n\n张爱玲出身满清达官显宦之家，父亲是旧派纨绔子弟，母亲和姑母崇尚西洋文明，为新女性。她就读于上海的教会中学和香港大学，接受了现代的历史观念和文化观念，接受了西方小说的影响，但她8岁读《红楼梦》，一生称赞《海上花列传》，写出的小说，其中活动着各色旧人物，而且偏是用改造过的言情小说体式来表达的。这一切，使她有可能创造出熔古典小说、现代小说于一炉的，古今杂错、华洋杂错的新小说文体。这些小说历来被人称之为“新鸳蝴体”“新洋场小说”“娱情小说”等等，单从名字上便透出一种雅俗共存的文学气味来。她用自己高超的文学才能铸造出了具有雅俗结合的特点的小说文体。她的小说对今天的许多作家仍然有着重要的影响。\n\n三、既通俗又先锋，既中国又现代，是中国文化调教出来足以面对世界的优秀文本\n\n张爱玲40年代的小说成就，有她本人的天才成份和独特的生活积累条件，也是中国20世纪文学发展到这个时期的一个飞跃。她的小说，使得现代小说有了贴近新市民的文本，既是通俗的，又是先锋的，既是中国的，又是现代的，是中国文化调教出来足以面对世界的，因而也绝不是孤立的现象，国统区的徐訏、无名氏程度不同地也进入这种境界，日后的港台文学受张爱玲的影响很大，不可忽视。","keywords":"两个重要侧面 小说文体 既通俗又先锋 既中国又现代","note":"张爱玲可以说是新时期重写文学史之时被重新发现的一位作家，从八十年代以来，文学界对张爱玲的关注度越来越高，相关的研究也越来越深入，相应的，张爱玲在考查中出现的频率也越来越高，部分院校对其重视程度甚至超过茅盾、巴金等作家，当下一些热门专题如城市书写、女性写作等也都可以将张爱玲归入其中，故此，对于张爱玲相关内容我们需要重点关注。"},{"id":"234","stars":"★★★★★","title":"张爱玲小说创作特征是怎样的","body":"一、多表现以苍凉为底色的现世人生悲剧，悲剧色彩浓郁\n\n张爱玲曾说，她是用“衬出人生的素朴的底子”的参差的对照的手法来写作的。这源自她对于人生的独特体验和理解。张爱玲笔下的男女们，一个个都是都市人生的失败者，在作者笔下是些不彻底的人物，是一些软弱的凡人，构成了现代都市人的主体。沧桑的历史感、切实的现世感与现代都市的日常人生和心灵相融会，构成张爱玲小说最主要的审美取向与特色，也形成她以苍凉为底色的独特的悲剧感-不是表现为走向顶点的激烈冲突状态，而是在一个个黯淡、哀婉的平凡故事里，以既悲观又享乐的态度去体味现世人生的浮世悲欢与苍凉。她把自己笔下世俗庸常的男女，置于新旧交杂的社会与战乱动荡的时局中，呈现他们在种种诱惑中的惶惑，种种经营中的虚无，种种追求中的无可附着。\n\n二、注重服饰意象的营造\n\n张爱玲在文学表现上的天赋，莫过于她对服饰意象的营造。她营造出一系列环佩叮当、衣香鬓影的服饰意象。同时，在张爱玲的服饰意象世界中，戒指、镯子、项圈这些首饰也是重要的组成部分。这些圆形的饰品，本是象征着团圆、喜庆与永恒，但在张爱玲的笔下，却成为控制、死亡、悲剧的象征。张爱玲将服饰世界建构成一个丰盈的意象系统。她继承了《红楼梦》对服饰细致入微描写的传统，将客观的描写融入意象的表达，并依此构建出意象缤纷的世界。意象繁复的衣香鬓影世界就成为张爱玲小说最生动、最独特的组成部分。\n\n三、古今杂错、华洋杂错\n\n张爱玲创造出熔古典小说、现代小说于一炉的，古今杂错、华洋杂错的新小说文体。这些小说历来被人称之为“新鸳蝴体”“新洋场小说”“娱情小说”等等，单从名字上便透出一种雅俗共存的文学气味来。张爱玲写作，既有传统的语汇和手法，也有意识的流动。\n\n张爱玲注重借鉴西方现代文学的思想方法和艺术技巧。她能在叙述中运用联想，使人物周围的色彩、音响、运势，都不约而同地富有照映心理的功用，充分感觉化，造成小说意象的丰富而深远。这里明显留下西方现代派的先锋痕迹。在思想方法方面，《金锁记》《心经》明显地受到了弗洛伊德心理分析学说的影响。在艺术技巧上，张爱玲则将日本新感觉派小说的某些手法融合、吸收到《传奇》的以写实为主的描写中，使之具有了独特的风采。\n\n张爱玲构造故事，设置人物，又以中国古典小说为根底。张爱玲注意吸收中国传统小说的艺术营养。在叙述方式上，她喜欢以讲故事的形式组织情节，刻画人物，按自然次序叙述，很少使用倒叙方法。在描写方面，她也有意向古典现实主义小说学习。从题目到叙述风格，张爱玲的小说都有极强的市井小说的色彩，使中国读者读起来分外亲切，容易接受。\n\n四、题材上关注言情，用华美绚丽的文辞来表现沪、港两地男女间干疮百孔的经历\n\n张爱玲是个主情主义者。她崇尚纯洁真挚的两性之爱，不满于金钱社会对于人类感情生活的侵蚀。因为尊重感情生活，张爱玲对于那些不敢追求爱情或怯懦地迁就无爱婚姻的猥琐平庸的男人也多有微词。\n\n然而在金钱社会中，要想使感情生活完全不受金钱的干扰毕竟是一种幻想。总有人为了金钱和地位而牺牲爱情，也总有人希望用金钱和地位来收买爱。也正因为张爱玲熟悉日益金钱化的都市旧式大家庭的丑陋，所以用华美绚丽的文辞来表现沪、港两地男女间干疮百孔的经历，是她最主要的文学切入点。她从中看到了中国都市人生中新旧交错的一面，即都市的生活方式已经发生现代的改变，但人们的习惯、观念仍然是传统的。她所提供的，正是处于现代环境下依然顽固存留的中国式封建心灵的文化错位。\n\n五、具有现代性的女性解剖\n\n作为一个女性作家，张爱玲真正了解女性在现代社会的生存处境。女人所处的环境，所受的压力，有旧家族内的冷漠眼光，有命运的拨弄，更有来自女性自身的精神重负。这类缓慢毁灭的过程，画下了现代女性痛苦挣扎的轨迹，取材范围虽嫌狭小，心理开掘却达到一定的深度。可以看出，张爱玲小说的女性解剖，相当的具有现代性。","keywords":"苍凉底色 人生悲剧 服饰意象 古今错杂、华洋错杂 华美绚丽的语言 干疮百孔的经历 女性解剖","note":"张爱玲的小说创作特征，与张爱玲的个人生活经历与学习经历密切联系，她出身于封建达官显宦之家，受到古典小说尤其是《红楼梦》的浸染，又就读于上海的教会中学和香港大学，受到了西方现代文学影响，在创作时又身处“抗战”时期的上海，这使她对封建制度和都市生活都有深刻的认识，使她的作品既显露出中西交融的特征，又弥漫着悲剧色彩，这些内容需要我们去理解记忆。"},{"id":"235","stars":"★★★★★","title":"以具体作品为例，谈谈你对张爱玲“苍凉”美学风格的理解（25北京大学）【答题框架】","body":"作为一个深受中国传统文化影响的优秀小说家，张爱玲从小就养成一种敏于体悟生命苦难、多思善感而又偏于悲悯一路的文学气质。不仅如此，她还继承了中国传统意识的坚忍性、柔韧性以及偏于弥合困境的特点，在写到笔下人物面对生活中的悲剧性境遇时，往往采取一种隐忍退让委曲求全的态度。种种因素作用下，张爱玲的小说形成了“苍凉”的美学风格，这主要表现在以下方面：\n\n一、在题材上多表现以苍凉为底色的现世人生悲剧\n\n张爱玲曾说，她是用能“衬出人生的素朴的底子”的参差的对照的手法来写作。这源自她对于人生的独特体验和理解。她的小说里，几乎“全是些不彻底的人物。他们不是英雄，他们可是这时代的广大的负荷者。因为他们虽然不彻底，但终究是认真的。他们没有悲壮，只有苍凉。悲壮是一种完成，而苍凉则是一种启示”。沧桑的历史感、切实的现世感与现代都市的日常人生和心灵相融会，构成张爱玲小说最主要的审美取向与特色，也形成她以苍凉为底色的独特的悲剧感-不是表现为走向顶点的激烈冲突状态，而是在一个个黯淡、哀婉的平凡故事里，以既悲观又享乐的态度去体味现世人生的浮世悲欢与苍凉。她把自己笔下世俗庸常的男女，置于新旧交杂的社会与战乱动荡的时局中，呈现他们在种种诱惑中的惶惑，种种经营中的虚无，种种追求中的无可附着。\n\n二、充斥着作者悲观情思的意象的运用\n\n张爱玲很少有纯客观的意象描写，她总是让读者通过人物的视角来观察这个世界，这个世界的每一个角落都被人物的感受所投射，每一个意象都为人物特定的心理氛围所笼罩，人与物之间达到了高度的契合，以至一个意象其实就是一种心理状态。小说中繁复鲜活的意象后面，隐藏的依然是张爱玲彻骨的悲观感和广漠的苍凉感；小说独特的文字色彩和内在韵律，所呈现的依然是张爱玲深刻的人生感悟。她笔下的意象，深隐着作者的浓郁情思，包孕着许多内在的、深刻的、难以言传的意念和感悟。\n\n在某种意义上，张爱玲的意象话语使她的小说获得了一种“存在编码”：凄怆、悲哀、荒凉、月亮、乱世、人类、生命、情欲、阴暗、鸦片、恶梦、恐怖......这些关键词，烘托出了整个小说广漠的悲哀的氛围。它们弥漫于小说的情节、小说的语言，无法剥离，无处不在，具体而又虚渺，切近而又茫远，既是小说的，又是作者本人的。\n\n三、“苍凉”“荒凉”等字眼的直接使用\n\n“苍凉”或者“荒凉”，是张爱玲所倾心和常用的字眼。她作为一个经过豪门衰落的女子，面对十里洋场的光怪陆离，她感受到的是时间对人的无情压力。乱世的“苍凉”也正是张爱玲所欣赏的和企盼的。她说：“我不喜欢壮烈。我是喜欢悲壮，更喜欢苍凉。......苍凉之所以有更深长的回味，就因它像葱绿配桃红，是一种参差的对照。”“悲壮是一种完成，而苍凉则是一种启示。”\n\n面对这“乱世”不可捉摸的命运，张爱玲只能在永久的艺术形式里，感受她所认识的荒凉时代，演绎她的回忆、她对未来的恐惧、她对现实的悲哀，还原出人在历史变动面前的凡俗和无奈。","keywords":"题材 现世人生悲剧 充斥着悲观情思的意象“苍凉”“荒凉”直接使用","note":"提起张爱玲的小说创作，无论如何也离不开“苍凉”这一个关键词，可以说，“苍凉”一词可以精准地概括张爱玲的小说创作风格，而这种风格的形成，与张爱玲由于人生经历所形成的性格密切相关，某种程度上也可以说是“风格即人”。而这一风格的具体表现，则在其作品的题材、意象选用和具体文字上。相关内容可以参考范伯群《沪港洋场中的苍凉梦魇一一论张爱玲的前期小说创作》、李掖平《生存悲剧的荒凉书写-论张爱玲小说的悲剧意识》，具体论文可以在李凡文学正版群领取。"},{"id":"236","stars":"★★★★","title":"试分析张爱玲小说创作中的女性意识","body":"在张爱玲的文学创作中，女性意识已经有了某种程度的自觉。张爱玲为女性文学掀开了女性心狱充满疮痍的一页，真实地掀开了黑夜里女性生活的残酷画面。\n\n一、张爱玲女性意识产生的背景\n\n由于特殊的生活环境和教育背景等多种原因，张爱玲的女性意识的萌发是极早的。首先是封建旧家庭男尊女卑性别歧视的压力，使张爱玲从小便萌生了要为自己和天下的女人争取正当权利和人格尊严的渴望与信念。\n\n另外，张爱玲后来的成长环境和受教育的背景也对她的女性意识的形成与发展产生了决定性的作用。张爱玲出生并成长在上海，而20世纪三四十年代的上海，特殊的历史背景、洋场租界的身份，使其文化的庞杂性和交汇性。加之张爱玲中学就读于圣玛丽亚女校，较之同龄人能更早地接受到西方现代文明的熏陶，让原本就存在的朦胧的女性意识进一步明晰化。后来在香港大学的学习经历，使张爱玲更有机会直接接触到西方世界里方兴未艾的女性主义思想，耳濡目染之中无疑进一步强化和固置了她的独立自存的女性意识。\n\n二、张爱玲女性意识的特征\n\n（一）具有自审的眼光，关注对母性的自审\n\n与“五四”以来其他女作家不同，张爱玲颇具自审的眼光，多从女性深层心理结构上去挖掘女性自身的痼疾及其文化根源。将女性深层的传统意识和心理疾病挖掘、展露，以此来探索女性不幸的根源是张爱玲独特的视角。作为女性，张爱玲不是掩饰女性的缺点，而是以敏锐的眼光去剖析女性自身，真实地指出由于女性自身的缺陷而造成的种种不幸。\n\n张爱玲对女性的自审的最重要内容是对母性的自审。在自己的作品中，张爱玲解构传统意义上的母亲形象，颠覆母亲神话，把解剖刀切入母性深层，揭示出母性，继而揭出女性、人性的负面。\n\n（二）对现代女性思想中积淀的传统封建思想的深刻批判\n\n在张爱玲的笔下，无论是新派还是旧派女性，都摆脱不了对男性的依赖心理。旧派女性没有自觉，心甘情愿地成为男性的附庸，婚姻是她们寻找和保护安稳生活的唯一手段和最终归属。新派女性坦然接受现代物质文明，但仍然固守着以男性为生命支柱的思想意识。\n\n张爱玲通过众多作品，探幽发微地揭示和批判了中国女性骨子里依然深深浸润的奴性意识，指出正是这种自甘依附于男性，处处以男人为生活中心甚至全部世界的病弱心理和奴性性格，使女性自身成为了阻碍自己发展的内在原因。她提醒井希望女性尽快挣脱历史的、文化的、心理的男权传统樊笼，尽快结束非人、非女人的女奴心狱生活，成为自由自主的女性优美自在的存在。\n\n三、张爱玲女性意识的意义\n\n张爱玲作品中的女性意识的客观意义是不可忽视的。她大胆地揭出女性的心理痼疾，并且站在一个较高的层面对女性进行自审，具备同代人所没有的眼光，这显示了她在精神上的难能可贵的自觉。她不是盲目乐观地追随丁玲等女作家所开拓的女性意识的空间，而是认为女性从心理上、精神上根本就没有自我解放，女性依旧无法摆脱长期的男权社会所形成的些亚文化群体特征。这是种深刻而独特的女性内审意识。所以说，张爱玲的女性创作主题，比其他女作家更为彻底、不遮掩也不自欺于表层的认识。从某种意义上讲，它解构了自“五四”以来很多女作家共同创造的一个关于女性彻底解放的神话。","keywords":"生活环境 教育背景 母性 自审 传统封建思想 女性内审意识 解构神话","note":"作为一位女性作家，张爱玲的创作毫无疑问拥有女性意识，而张爱玲女性意识更多地受到了自身教育经历和生活环境的影响，更多地表现为对女性的审视和批判，这与同时代的女性作家很不相同，因而更值得关注一些。在考查时，有可能将其与其他女性作家的女性意识做对比，大家也要注意一下。"},{"id":"237","stars":"★★★★","title":"试分析《红楼梦》对张爱玲小说创作的影响","body":"张爱玲自幼熟读《红楼梦》，以至于“不同的本子不用留神看，稍微眼生的字自会蹦出来”。《红楼梦》对她来说是“一切的泉源”。《红楼梦》对张爱玲小说创作的影响，主要表现在以下方面：\n\n一、悲剧传统\n\n《红楼梦》之所以能睥睨干古，持久地震撼着读者的心灵，最大的奥妙，就在于它的悲剧性，在于它是“悲剧中之悲剧”。《红楼梦》的人物，“无不与痛苦相终始”，最后共同的归宿是“落了片白茫茫大地真干净”。曹雪芹以人生的严酷，历史的无情，人间美的被毁灭，强烈地震荡着读者怜悯、惋惜、惊异、激愤种种复杂的情感，让读者体验到悲剧的审美感受。\n\n张爱玲发扬了自曹雪芹创新的悲剧传统。《红楼梦》令人感到彻骨冰寒的命定、世事无常之感，引起了张爱玲深深的共鸣。生于乱世的张爱玲因家族和个人的际遇使其作品中总是笼罩着世纪末的荒凉感，这成为她作品的底色。张爱玲的作品同样是繁复、华美的细节与悲哀的人生主题相缠绕的结晶，同样具有悲哀的主题和欢悦的细节相融合的特点。她的小说与散文，无不是意象繁复、文字华美，而气质苍凉、主题悲哀。\n\n二、言情传统\n\n作为情学奇观的《红楼梦》，是人文主义思潮战胜儒家风教功利文学观的成果。曹雪芹大胆坦言：洋洋一部《红楼梦》“大旨谈情”。这所谓“情”，包括爱情和世情两方面的内涵。爱情，在《红楼梦》中一洗风月笔墨的淫秽污臭，一反才子佳人的“不近情理”，用儿女真情焕新了世人耳目。至于描摹世情，绘出栩栩如生的生活的真实质感，也是《红楼梦》的题旨之一。它脱去了稗官野史的那种怪异色彩，直接源于现实，“离合悲欢，兴衰际遇”皆“追踪蹑迹，不敢稍加穿凿”。\n\n张爱玲真正继承和发扬了《红楼梦》的言情传统。婚烟恋爱，几乎是她全部小说的内容之所在。小说集《传奇》里的故事，都紧紧扣在男女之间发展。男女主人公之间的感应、摩擦、摸索、闪躲，无一不得到细致入微的刻画，并成为故事的主干。同时，爱情在张爱玲笔下，又是绝对和世情结合在一起的。没有任何浪漫化理想化的提高，在人情世态的平实、尴尬、残忍、冷酷的描绘与展示中，张爱玲再次打通了走向《红楼梦》的传统之路。\n\n三、对女性的关注与女性形象的塑造\n\n曹雪芹的开宗明义：他写《红楼梦》，就是要记下令他难忘的女子，使“闺阁昭传”。《红楼梦》中的众女儿，无不给人们留下了深刻的印象。可以说，曹雪芹是一位描摹女性形象、表达女性性灵与命运的圣手。曹雪芹纵然惜和热爱她们，又不一例外地让她们失去了欢乐与青春，-被摧残而归于“薄命司”。正是这种不幸结局，才强化了小说的悲剧性，显示出现实人生的严酷和令人绝望。\n\n张爱玲小说的主人公，绝大多数是女性。她们生活于清末至抗战中期不同的时代背景下，有小姑娘，新娘子，老处女，姨太太，贵妇人，巧媳妇......关注女性，表现女性，尤其是表现她们的悲剧命运，张爱玲完整地继承和发扬了《红楼梦》的这个传统。张爱玲笔下的女性，无论何种身份何种性格，都无一例外的浸泡在一种无可奈何的悲剧感中，都和大势已去的旧时代一起，注定了绝望和黑暗的命运。\n\n四、艺术方法的借鉴\n\n艺术方法的借鉴，是张爱玲小说从《红楼梦》中吸取营养的最有迹可寻的证据。\n\n（一）在故事题材、语言上向《红楼梦》学习\n\n选取一个大家族为典型环境，用亲朋关系串起形象体系，表现没落的悲剧命运，这是张爱玲学会的第一招。对家庭生活进行细腻描写，少有突进跳跃式情节和经天纬地的事件，在看似琐碎的家庭悲欢离合中，演出一幕幕凄凉的人生悲剧，这是又一招。而在语言的运用，人物的塑造、意境的构建上，任何一个读张爱玲小说的人，都可以明显的看到《红楼梦》的影子。一篇《金锁记》就是个典型的例子，其中服装的精细描写，言语的精巧，简直可以放进《红楼梦》里去乱真。\n\n（二）写意手法\n\n《红楼梦》是以传真写实见长的，同时，又兼用“写意”。所谓写意，是指在“似”与“不似”之间力求传神和意境创造的美学追求。曹雪芹通过一系列意象、意境和情趣韵味的创造，使《红楼梦》达到了深远、广博、醇厚的美学境界。\n\n别致新颖，不落窠臼的意象的使用，是张爱玲的拿手好戏，仅一个意象“月亮”，就蕴含了无穷无尽的韵味。张爱玲笔下大量意象的运用，正是一种写意。它不仅使读者获得了审美愉悦，又肩负了不同的作用，从不同角度，不同侧面丰富了小说的意蕴，将小说的题旨传达得更为含蓄隽永，从而也使小说具有了更为深厚、深远的象征色彩。\n\n（三）开头设置楔子或“入话”\n\n中国古代白话小说，无论长篇或短篇，大都有楔子或“入话”作开头。它或是诗词，或是小故事，或是对小说主题及其它情况的说明。《红楼梦》也不例外。钟情于古典小说尤其是《红楼梦》的张爱玲，自觉地承继这一传统。以讲故事者的身份，在小说开头设置一个短短的引子，有时候还在结局时与引子呼应，这种模式是张爱玲小说的常见格局。\n\n五、服饰意象的营造\n\n张爱玲在文学表现上的天赋，莫过于她对服饰意象的营造。她营造出一系列环佩叮当、衣香鬓影的服饰意象。衣香鬓影是她笔下世界不可或缺的重要组成部分，而意象繁复的衣饰世界也成为张爱玲作为一位女性作家最有其性别特征的体现。张爱玲发表的第一篇小说《沉香屑第一炉香》即是一个以衣衫作道具的人生寓言。美丽的衣衫使曾经天使般的少女堕落，张爱玲写出了拜金的都市社会里最悲凉的人生寓言。\n\n张爱玲将服饰世界建构成一个丰盈的意象系统。她继承了《红楼梦》对服饰细致入微描写的传统。她将客观的描写糅入意象的表达将观念转化成为活色生香的意象缤纷的世界。意象繁复的衣香鬓影世界就成为张爱玲小说最生动、最独特的组成部分。","keywords":"悲剧传统 言情传统 关注女性 女性形象塑造 艺术方法 题材 语言 写意手法 楔子或“入话”服饰意象","note":"张爱玲的小说创作，既受到西方文化影响，又受到中国传统文学影响，而中国传统文学中，对张爱玲影响最大的无疑是《红楼梦》，这些影响表现在悲剧、言情传统，女性形象的塑造，艺术技巧和意象使用等多个方面，大家可以结合张爱玲的小说创作特征进行理解记忆。相关内容可以参考赵莎《张爱玲与＜红楼梦）》、吴敏《传统小说艺术的现代性演进一一论张爱玲与《红楼梦＞》，具体资料可以在李凡文学正版群中领取。"},{"id":"238","stars":"★★★★★","title":"试分析张爱玲与赵树理小说创作的相同之处","body":"作为“抗战”时期解放区和沦陷区小说作家的代表，赵树理和张爱玲二人在出身、学习环境、创作风格等方面有很大的差异，但是，作为中国现代文学史重要的两条支流，二人也有许多相同之处，具体表现在以下方面：\n\n一、都注意向传统古典小说学习\n\n张爱玲构造故事，设置人物，以中国古典小说为根底。张爱玲注意吸收中国传统小说的艺术营养。在叙述方式上，她喜欢以讲故事的形式组织情节，刻画人物，按自然次序叙述，很少使用倒叙方法。在描写方面，她也有意向古典现实主义小说学习。从题目到叙述风格，张爱玲的小说都有极强的市井小说的色彩，使中国读者读起来分外亲切，容易接受。\n\n赵树理对中国以说唱文学为基础的传统小说的结构方式、叙述方式、表现手段进行了扬弃与改造，创造了一种评书体的现代小说形式。赵树理扬弃了传统小说章回体的程式化框架，而汲取了讲究情节连贯性与完整性的结构特点。在描写与叙事的关系上，赵树理吸取传统评书式小说的手法，把描写情景融化在叙述故事中，把人物放在情节发展矛盾冲突中，通过自身的行动和言语来展现其性格，少有静止的景物与心理描写。\n\n二、都注重雅俗交融\n\n毫无疑问，张爱玲写的是“新的现代体式的小说”，但她又完全没有所谓“新文艺腔”，而很自然地承传了传统的章回小说，特别是《红楼梦》的手法与韵味；她的小说是通俗的，甚至有点类似当时流行的鸳鸯蝴蝶派，但其艺术之深湛又决非一般流行作品所能比拟。张爱玲的小说在看似琐屑的平凡中，蕴涵着极其不俗的人生感悟和生命体验，写出了永恒的人性。她虽然讲的是普通饮食男女的故事，但着意追求的是故事的意境，她用丰富多彩的意象，把人性深处的贪欲、丑陋淋漓尽致地表现出来，勾画出苍凉彻悟的人生境界。\n\n对于置身于解放区革命队伍中的赵树理来说，要想将一种崭新的革命思想输入农村，就必须借助于乡村社会已有的欣赏心理与接受习惯，并充分照顾到他们现有的知识文化水平及感受与思维方式。赵树理毫不犹豫地选择了农民喜闻乐见的民间说唱文学的形式，来宣传党的方针政策和革命道理。因此，赵树理的雅俗互融主要表现在思想内容上的革命性和先锋性，形式上的民间化和大众化。\n\n三、都表现出了现代性\n\n所谓“现代性”是指启蒙时代以来的“新的”世界体系生成的时代，一种持续进步的、合目的性的、不可逆转的发展的时间观念。\n\n张爱玲安身立命于沦陷区世俗的小市民社会中，以现代市民作家的口吻讲述了一个又一个旧式大家庭中没落淑女的家庭婚姻故事，在看似通俗的传奇故事里，不仅表现了芸芸众生在物欲、情欲、金钱欲冲击下的丑态，而且还真切地传达出张爱玲对人生的特殊感悟和对人性悲剧的深刻思考。所以她的作品看起来俗，实际上是雅，而且是大雅，她是一个在创作中表现\n\n出和强烈意识到“现代性”的作家。\n\n赵树理文学的“现代性”主要表现在创造性地利用“民间形式”，来表述一种既与民族国家现代性意识形态相协商又与其相区别的独特观念。简单来说，就是以一种接近民间传统的形式来承载革命思想、方针政策等先锋性和革命性的内容，这就打破了从晚清一直延续到“五四”的“西方＝新＝现代”、而“传统＝旧＝落后”的线性现代性观念，而是将“传统”看成是可以转化为“现代”的，并且强调无论何种形式的“现代化”必须在本土的文化资源之中生长。","keywords":"向传统古典小说学习 雅俗交融 现代性","note":"赵树理和张爱玲两位作家看似毫无联系，但在其具体创作上却殊途同归，有许多相似之处。之所以有这样的相似之处，是因为二者的创作高峰期毕竟处于同一时代，无论是雅俗融合还是对传统古典小说学习，以及对现代性的追求，都是当时文学创作的整体发展趋势，所以二者虽然题材内容差异巨大，却仍表现出了许多相似性。类似这种两个作家对比的题目在近年来的考查中出现得越来越多，大家要重视起来。相关内容可以参考张黎《中国文学传统的现代回响及其与“现代性”之关系》、王源《抗战时期中国文学的雅俗互融合-兼论张恨水、张爱玲、赵树理》，具体资料可以在李凡文学正版群中领取。"},{"id":"239","stars":"★★★★★","title":"试分析张爱玲的都市书写有何特征","body":"张爱玲的创作是走女性自我叙述之路，执著地反映普通女性在都市生活中遭遇到的种种琐事，表达对生存状态的不满和愤慨。其作品既属于女性文学中一个独特的层面，又属于市民文学中一个独特的层面，可以称其为“都市女性写作”，它的基本特征主要表现在三个方面：\n\n一、在创作理念上认同现代都市市民价值观\n\n作为都市人的张爱玲，特别注重表现这种讲求实利的市民意识，物质功利观在女作家的意识中占据着举足轻重的地位，也正是在这点上，更鲜明地显示出她从日常生活出发看问题的立场和现代市民独特的精神和价值观。\n\n“五四”以来的绝大多数新文学作家都崇尚自然，厌恶都市文明。身受上海风熏染的张爱玲却毫不讳言自己对都市的依恋和热爱，她喜欢自己的小市民身份，自称是一个“世俗的人”，要“从柴米油盐，肥皂，水与太阳中去寻找实际的人生。”在张爱玲看来，“凡俗”才是真实的人生形态，是她才智得以生存的土壤。她将自己对人生的观照凝定在普通人的身上。在作家看来，都市生活不仅仅是舞厅、酒吧夜生活的浮光掠影，它是每日每时发生在琐细平凡、有质有感的家庭，这个都市细胞内部的日常人生，是世俗的人间，是浮世的悲欢。张爱玲对上海的传奇叙述就是建立在这种现代都市市民的价值观上，她对城市的天然亲和与对现代城市市民价值的认同，使作家与她笔下的市民们的价值观、人生观是没有距离的。\n\n二、在表现内容上关注都市女性的生活、心理、矛盾和困惑\n\n作为都市女作家，张爱玲把自己的创作定位在都市女性上，运用独特的视角来敏锐地反映都市女性的生活、心理、矛盾和困惑。\n\n张爱玲的作品所展示的可以说是一个地道的女性世界。她的创作几乎全部可以归入女性话题范畴：如女人的特质与天性、女人对男人的依赖与反抗、女人自食其力的艰辛、什么是男女的真正平等、女人在婚恋生活中的遭际命运......作家熟悉那个时代都市里形形色色的女性生活，在小说里塑造了一系列体现城市精神的女性形象。这些世俗化的女性与传统标准格格不入，她们大多生活于现代都市的没落家庭，“为门第所限，不能做女打字员，女店员，做‘女结婚员＇是她们唯一的选择”。在这里，爱情的浪漫让位给利益的权衡，婚恋的理想在现实中消解了、破坏了。与同时代的丁玲、白薇等女作家笔下的女性相比，人家着意的是自由，是感情，是精神层面的恋爱，张爱玲却是把爱情婚姻看作生存手段，平添了一种市侩。\n\n三、在创作题材上注意表现恋爱、婚姻家庭琐事\n\n世俗化的创作观念在张爱玲的文学创作中得到很好的表现，她的创作很少涉猎时代重大题材，没有正面描写战争和政治等敏感话题，而是用全部体验去感知市民阶层的世俗化的生存境遇，就题材而言，几乎清一色是恋爱、婚姻家庭琐事，且大多数是不如意或不幸的婚恋故事。她喜爱描写男女间种种不明不白、猥琐、难堪、失面子的小事：高等情致的调情，像《倾城之恋》；低等的姘居，比如《连环套》；疲惫的婚嫁，像《鸿鸾禧》；死寂的婚姻，比如《等》，以及在现代时空下，市井小民的恋爱、婚姻和家庭生活。\n\n张爱玲认为：“人在恋爱的时候，是比在战争和革命的时候更素朴，更放恣的。”这种文学视角不是政治家的眼光，不是超凡拔俗的知识分子的眼光，不是纯情和浪漫女作家的眼光，而是沉入世俗人生中芸芸众生的眼光，其中渗透对市民的理解。\n\n【李凡关键词：创作理念 现代都市市民价值观 表现内容 都市女性的生活、心理、矛盾和困惑 创作题材 恋爱、婚姻家庭琐事】","keywords":"","note":"“都市书写”是近年来考查中出现频率比较高的一个概念，而在现当代文学史上，像是茅盾、老舍、张爱玲、王安忆等等都曾表现都市中的人和事，不过由于其各自的出身、思想等方面的不同，在都市书写时采取的角度、反映的题材也都有不同。张爱玲作为四十年代十分有代表性的一个女作家，其作品既有女性创作的特征，又有都市文学的特征，她认同市民价值观，注重表现都市女性生活和思想，关注婚姻、恋爱等琐事。相关内容可以参考孙丽玲《20世纪40年代的都市女性写作-张爱玲苏青创作论》，具体资料可以在李凡文学正版群中领取。"},{"id":"240","stars":"★★","title":"苏青小说创作特点是怎样的","body":"苏青，一个20世纪30年代出现于上海文坛的女性作家，曾以其女性敏锐细腻的感受来揭露和剖析多被常人忽视的人生问题，同时又带有独特而深刻的人生哲理。她的创作风格的形成与其人生经历有着必然的联系。那种世俗化的创作风格在当时的上海有着很大的读者群。她的小说创作，主要具备以下特征：\n\n一、平实的写实体\n\n苏青并无旧通俗小说的笔法，只是用平实的写实体，以一个女性的大胆笔触描写男女情事，仿佛便有了“言情”内质。自传体小说《结婚十年》从1944年初版至1948年，竟印行了十八版，连《续结婚十年》也很快印行了四版，苏青成为典型的畅销书作家。\n\n二、表现女性涉世而终遭幻灭的一种情怀\n\n苏青的小说虽有“言情”的构架，其实并不叙述多少脉脉含情的东西，写的是一个现代中国女性，如何挣脱“家庭主妇”的命运，走上职业妇女道路，她自食其力的社会遭遇，幻想、失落、痛苦、独立，渴望被爱、渴望受到保护而不可得，这样的一部人生史。《结婚十年》定下了苏青小说的全部调子，即女性涉世。其他作品，续集之外，中篇《歧途佳人》和《涛》里的部分短篇，无不是这个基调的延长和变形。苏青的故事永远是女人，是说不完的女性涉世而终遭幻灭的一种情怀。\n\n她的趣味是务实不避利，俗气但不失真诚。最能表明女性叙述人发卖个人经历讨生活而不扭扭捏捏的坦诚心地，以及隐秘的“为人妻”和“主妇”情结的无奈。\n\n三、俗中又带了点无意的隽逸\n\n苏青的世俗化受到市民读者的喜欢，但俗中又带了点无意的隽逸，不至混同于一个老百姓，这也是她与富于幻想的市民容易取得共同语言的地方。这样的市民文学的质地，便决定了苏青小说那种实录通俗故事的品格。她没有独特的技巧，所用技巧都是现成的，是二三十年代遗留下来的，她只要细致地叙述自己或叙述一个类似自己的女人，作品便有了吸引力，便能受到市民读者的青睐。","keywords":"写实体 涉世而遭幻灭的情怀 无意的隽逸","note":"苏青在“雅俗共赏”这一点上与张爱玲小说具有些共性，二者又都是女性作家，所以很可能会将二者放在一起进行对比，大家要注意。苏青的小说创作具有明显的女性色彩，主要表现女性涉世而终遭幻灭的情怀，世俗化性质强烈，却又带有一点隽逸色彩，很受市民读者青睐。"},{"id":"241","stars":"★★","title":"梅娘小说创作的艺术特征","body":"一、描写宦商封建大家庭的女性生存状态\n\n梅娘先后活动于东北和华北。由于梅娘的特殊的身世，小说以描写宦商封建大家庭的女性生存状态为显著特色。同样是在婚姻恋爱的题材凸现追求独立、自由的女性形象，以及她们的生活遭遇，梅娘的叙述要比张爱玲“俗”，却比苏青“雅”。她最有代表性的作品，是所谓水族系列小说：中篇《蚌》、短篇《鱼》、中篇《蟹》。三部作品的人物故事虽没有连贯性，在精神气质上却是一致的。它们揭示了大家庭女性的三种生命处境：《蚌》的梅丽追求个人幸福和自己所爱恋的人，但社会、家庭已经给她设下了无法逃脱的牢笼，她只有等待宰割，就如同蚌肉的命运；《鱼》的女主人公的反抗性便进一步，试图用性爱的自由来叛逆无爱的婚姻，但可叹所爱的男人只是个懦夫，她像鱼一样没能钻破鱼网；《蟹》的女性结局比前两者光明得多，大户人家出身的孙伶，终于离家出走，蟹的行走能力确实要比蚌、鱼都强大。\n\n梅娘后来有些短篇如《侏儒》《春到人间》，表达生活的幅度有所扩大，触及到人间更多的不平，心理刻画和人性描写都较为深入。\n\n二、讲究标题的象征性，注重情节结构安排\n\n梅娘的小说讲究标题的象征性，表明对人的生存困境的注视程度，这比一般的通俗小说要高出一筹，但她的青年男女故事又有相当的可读性，行文的舒展有致、女性讲述故事的细致敏感，都为她获得了北方都市的大众读者。\n\n梅娘是善于讲故事的，表现在小说创作中，就是她非常注重小说情节结构的安排。如小说《蚌》讲述的故事很简单，是传统的男女从相爱相知到误会，再到分手的故事。但梅娘通过传统小说的章节结构来组织作品，又与传统小说每个章节题目概括本节内容不同，她在每一节中都选取一个吸引人的标题，在章节的延伸中将悬念一个个解套，增强了小说的故事性。一节一个独立的故事，一节又一节，一环又一环，环环相扣，这既保证了故事的连贯性，又暗埋伏笔和悬念，保证了故事的生动和魅力。这种章节相对独立又彼此相通的结构方式，与作家在杂志上连载的方式也有一定的关系；而这种小说章节的组织结构，在其后期的长篇小说《夜合花开》《小妇人》中也有较好的运用。小说抒情状物细腻生动，故事情节安排既单纯又引人入胜，二者完美结合，构成了梅娘小说的整体艺术特色。","keywords":"女性生存状态 标题的象征性 情节结构的安排","note":"梅娘虽然现在声名不显，但在四十年代是与张爱玲齐名的女性作家，在当时造成了很重要的影响，“南玲北梅”这一概念甚至在考查中也出现过，所以我们需要关注一下。梅娘的小说创作很明显也受到了自身经历的强烈影响，在题材上关注女性生存状态，追求标题的象征性，也注重小说结构。"},{"id":"242","stars":"★★","title":"徐訏小说创作风格是怎样的","body":"徐訏的小说便将通俗文学与非通俗文学的两种成分结合，形成了它的独特性。总体来看，徐訏的小说创作，主要表现出以下特征：\n\n一、强烈的浪漫主义色彩\n\n徐訏30年代便开始其创作生涯，却直到1936年赴法学习哲学前写出中篇《鬼恋》才成名。《鬼恋》确定了他小说的基调：浪漫虚构，大众传奇，表现爱与人性善恶的多重性。返国后所写的三个中篇《荒谬的英法海峡》《吉布赛的诱惑》《精神病患者的悲歌》散发出强烈的异域情调和超现实的浪漫想象。\n\n二、大众意识与纯文人倾向交织\n\n徐盱小说的大众性，主要是善于编织奇幻虚渺的传奇故事，包括爱情故事。徐訏把品位较高的文学传向大众，这与张爱玲是颇为一致的，但他的大众意识似更明确，他后来追述说：“艺术的本质就是大众化的”，在他的心目中，“小说是书斋的雅静与马路的繁闹融合的艺术”。其中，“马路的繁闹”，是他的奇幻故事满足东南沿海一带市民读者在卑琐繁杂的生活中追求新奇和陌生的欲望，所产生效果的生动写照。\n\n“书斋的雅静”指的是徐訏的纯文人倾向。徐訏对理想化人性的不懈追求，表现在他所有的作品中。对于情爱甚至性爱，徐訏小说有较高的文化探讨的热情。情爱和性爱既代表一种现实的生命，又代表一种超越的生命，高尚的性爱与生命同构，具有悲剧性质，而真正的情爱稍纵即逝，易于幻灭，难以保持自尊，也在揭示生命的严峻性。所以徐訏男女爱情的结局都无从圆满，性爱的形而上的表现处处与西方现代主义文学穷究人生哲理的倾向相通。\n\n三、心理体验层面丰富\n\n徐訏小说的心理体验层面丰富，有的直接运用弗洛依德精神分析的方法来描写复杂的人性，如《精神病患者的悲歌》运用心理演绎构成小说本体；《风萧萧》里出色的梦境描写，对人物潜意识心理的挖掘；中篇《旧神》表现女子犯罪起于男子的罪恶，心理分析贯穿前后，都使他的作品具有某种先锋性质。\n\n四、现代化的叙述技巧\n\n徐訏的小说叙述技巧很现代，他的重要作品均以第一人称“我”（一般是男主人公）的人物内视点来进行叙述。《风萧萧》便是如此，全书从“我”这个感觉主体出发，叙述显得机巧而富寓意，景象、人物、事件、对话都有象征含义在内，时时插入议论，并不着力刻写人物性格，却将人物心理经叙述者的体验，用“我”的感受作为媒介向读者传达。","keywords":"浪漫主义色彩 大众意识 纯文人倾向 心理体验层面丰富 现代化的叙述技巧","note":"徐盱的小说具备强烈的浪漫主义色彩和传奇色彩，被公认是对港台和东南亚华文文学起到重大影响的作家，所以大家对他的创作风格要有所掌握。徐盱的创作是面向大众的，但其在艺术技巧上却是先锋的、现代的，显露出了雅俗交融的特色，大家可以仔细体会一下。"},{"id":"243","stars":"★★★","title":"孙犁小说的创作风格是怎样的","body":"孙犁的小说着重于挖掘农民的灵魂美和人情美，艺术上追求诗的抒情性和风俗化的描写，带有浪漫主义的艺术气质。孙犁的小说，主要有以下特点：\n\n一、着重对女性形象的赞美\n\n读孙犁的小说可以发现，作者着意刻画、赞美的人物都是妇女。妇女，尤其是农村妇女，在旧社会生活的地位是极为低下的，但在解放区，她们的聪明才智第一次得到了发挥。孙犁正是通过描写她们的思想感情，来反映出多彩多姿的时代光辉。\n\n《荷花淀》中勤劳朴实的水生嫂，《麦收》里勇敢担当的二梅，《“藏”》中青春好胜的浅花，《光荣》里热情善良的秀梅，《吴召儿》中机智果敢的吴召儿，《钟》里敢爱敢恨的慧秀等农村妇女形象，都给人留下了深刻的印象。\n\n二、浓郁的乡土气息\n\n孙犁小说具有浓郁的乡土灵气，尤以白洋淀为代表，写出了白洋淀的自然美与人情美，显示出作者对之的真挚情感。孙犁大多数作品是以写冀中平原、冀西山区的农村生活为主，作品大多不触及社会的主要矛盾，而充溢着乡土气息。\n\n三、清新明净的语言风格\n\n孙犁的小说语言自然朴素，清新优美，毫无雕琢之气。其小说以简朴的语言描写自然风物与人物内心，充满浓郁的生活气息与诗情画意，把语言的通俗和优美、简练和细腻、直率和含蓄、清淡和浓烈，和谐地统一在一起，如行云流水，却又状物传神，形成了清新明净的语言风格，一如他故乡白洋淀的荷花与少女。\n\n四、散文式的小说结构\n\n孙犁的小说不是以情节取胜，在他的小说中常常没有完整的情节，而是用一连串的生活画面，或一种思想，一组细节串通起来，做到了“形散而神不散”，孙犁的小说常采用散文式的、追随人物感情流动的抒情结构，在手法上，叙述和抒情相结合，营造出一种战斗的诗情画意美。\n\n五、诗意风格\n\n孙犁小说不重紧张的情节，而追求诗的意境，善于表现人的命运及丰富复杂的感情世界。在孙犁看来，革命，不仅仅指拿着枪杆子去战斗；革命的根本目的与使命，是在战斗中涤荡旧的污泥浊水，创造美的生活、美的心灵与性格。因此，在他的作品里，从不正面描写战争的激烈与残酷，而是以白洋淀明媚如画的风光为背景，挖掘农民内在的灵魂美、人情美，以此歌颂美的新时代、新农村的诞生，歌颂创造着美的革命，表现自己对于美的追求，于平和的描述中侧面表现出时代风云。\n\n六.以小见大，表现时代主题\n\n孙犁的作品，立足于小人物描写来反映时代主题，反映时代精神。孙犁青年时代就参加了革命，半个多世纪中，他经历了我国历史上一个充满变革的激烈动荡的时代。但在他的作品里，却很少见到叱咤风云的大场面，他主要描写的是普通老百姓的日常生活，力图通过在我国革命进程中那些最普通、最常见的生活事件，表现出作家所经历的那个时代，表现出特定环境中人们的精神风貌。我们透过他的小说，可以遥看到历史车轮辗过的痕迹。","keywords":"女性形象 乡土气息 语言清新 散文化 诗意风格 时代主题","note":"孙犁是现代“荷花淀派”的创始人和代表作家，主有作品有《白洋淀纪事》《铁木前传》等，他将情感的抒发和故事、景物的描写自然融合，使得作品具有浓郁的浪漫主义色彩和抒情诗的韵致，形成清新雅丽的独特风格，从而被誉为“小说中的诗”。“荷花淀派”相当重要，其名词解释请去正版群中下载。同时，孙犁和赵树理同样作为解放区作家的代表，可能会放在一起进行对比，大家要特别注意。"},{"id":"244","stars":"★★★","title":"试比较《太阳照在桑干河上》与《暴风骤雨》","body":"丁玲的《太阳照在桑干河上》与周立波的《暴风骤雨》成为土地改革时期大量涌现的“土改小说”的代表作-无论其已经达到的，或没有达到的，都足以代表解放区土改题材长篇小说的成就与不足。这两本小说各有特色，具体比较来说，主要包括以下内容：\n\n一、在阶级关系表现上，《太阳照在桑干河上》更胜一筹\n\n丁玲的《太阳照在桑干河上》最大成就在于正确地表现了农村的阶级关系，真实地反映了生活固有的复杂性：一方面，由于作家自觉掌握与运用阶级分析的观点，因此，在表现农村阶级关系的广度、深度及准确度上，都超过了“五四”以来表\n\n现农村阶级斗争题材的作品；另一方面，由于作家坚持从生活实际出发，在真实地反映农村阶级关系的复杂性上，在对人性的分析、批判和表达上，又超过了反映土地改革的同类作品。\n\n与《太阳照在桑干河上》相比，《暴风骤雨》的主要弱点就在于把农村复杂的阶级关系一定程度上简单化、规范化了。在小说里，地主与农民的矛盾成了唯一的矛盾，地主之间、贫农之间似乎不存在矛盾；而且斗争双方营垒分明，阶级阵线就像政策条文规定的那么清楚，绝不存在互相渗透关系：作家所要反映的似乎不是生活本身，而是经政策过滤过的生活的规范化形态。对革命现实主义创作方法的这种不正确的理解，导致了《暴风骤雨》对生活简单化的描写，影响了小说的现实主义成就。\n\n二、《暴风骤雨》在表现生活本身固有的丰富性与生动性上更优秀\n\n《暴风骤雨》对生活的表现，也有自己独到的优点：全篇充满了浓郁的生活气息，真实生动的生活场景，富于农民情趣的幽默活泼的生活细节。周立波既善于以饱满的激情描写壮阔的群众场面（如斗争韩老六的场面），又善于细致入微地描绘家庭日常生活的场景。作品中有许多必不可少的、显示出生活真实的丰富形态的闲笔。与《暴风骤雨》相比，《太阳照在桑干河上》就比较缺乏这样具体可观的场面、细节，而较多单调的、缺少色彩的叙述。在表现生活本身固有的丰富性与生动性上，《暴风骤雨》是更见其长的。\n\n三、在人物塑造上，二者各具特色\n\n在《太阳照在桑干河上》中，丁玲特别善于通过精细而富有历史深度与历史真实感的心理刻画，写出人物思想、性格、&#x5FC3;理的复杂性。作者善于从运动状态去刻画农民的心理，把人物置于土地改革的历史大变动、大风暴中，去考察、表现他们心理状态的变化：那几千年的历史沉淀下来的旧观念、旧传统，与同样蕴积了几千年的翻身解放的历史要求之间互相搏斗与消长的历史过程。丁玲当然无法预见以后的历史演变（她自己也成了历史灾难的受害者），但由于她忠实于现实，她对农民思想、心理刻画的历史真实性，使得她的描写，具有较高的历史价值，成为中国现代农民心理发展史上重要的一页。\n\n相比起来，《暴风骤雨》中的地主形象塑造得立体感不够。《暴风骤雨》的主要成功在于农民的塑造。作者描写这些人物没有像《太阳照在桑干河上》那样着重于写农民在与地主斗争的同时如何克服自身的弱点而成长，而是着重于表现农民积极分子阶级觉悟的觉醒。\n\n四、二者语言也各具特色\n\n《太阳照在桑干河上》的语言细腻，有时失之沉闷，却也不乏优美的篇章。《暴风骤雨》则明快、简净，富有地方特色，&#x5145;满了农民所特有的幽默感，但有些地方方言口语的运用也失之冷僻。\n\n总之，丁玲是在坚持自己的文学探索精神基础上，对农村的新世界投入深深一瞥；而周立波是试图站在民间的地位上，运用政策思想，“仿制”一个接近农民的叙述文体。二者的得失成败都是具有意义的。","keywords":"阶级关系 生活丰富性与生动性 人物形象塑造 文学语言","note":"《太阳照在桑干河上》和《暴风骡雨》都是在土地改革中反映土改的优秀作品，二者各有所长，经常会被放在一起进行比较。同时，二者也都会单独拿出来进行考查，让大家分析艺术特色，这一点也要注意。"},{"id":"245","stars":"★","title":"如何理解四十年代雅俗对立逐渐消解","body":"一、通俗文学与纯文学创作形式相互渗透\n\n在通俗文学的一面，它往“雅”的方向移动，主要是加强了文学的现实批判性，加强了历史的、文化的探索精神。通俗文学移步换形地将文体形式和自己的审美情感，更多地也向“雅”的方向转化，以至从这时开始，涌现出了未经过章回体写作训练的新型通俗小说家如予且等，即是俗雅融和的一种标志。\n\n那么，在纯文学的一面，除了按文学审美陌生化及文学自律性的规例不断向前之外，争取广大读者也是一条谁也无法逃避的规例。曾受旧派小说影响的新小说家也涌现出来，如张爱玲。介于“雅”“俗”之间的作家（如徐訏、无名氏、赵树理等）越来越多，成为一个绝大的趋势。\n\n二、此期的报刊杂志变化表现、推动雅俗合流\n\n抗战后，城市里通俗文学刊物多呈现雅俗合璧状态。1938年创刊的《杂志》一直出版到1945年，执笔者由老鸳蝴作家和新市民小说家两部分构成。还有顾冷观1940至1944年袭用旧名办起来的《小说月报》，钱须弥自1942年到1945年主编的《大众》，陈蝶衣、文宗山1943年到1949年合编的《春秋》，作者队伍大都如此。\n\n可以看出，此类通俗文学刊物在与旧的传统不截然断绝的情况下，调和新旧关系，同时努力追求自身的现代化、新文学化。已经新文学化了，还要选载一点旧体笔记和诗词，还可以来几篇学术考证文字，以满足一部分市民读者和旧式文章家的喜好。\n\n三、这一时期三个地区文学的雅俗融和各有特点，但都形成了潮流\n\n沦陷区因新文学的地盘一时间几乎空出，通俗文学市场的需求突然增大，而显得分外繁盛。上海等地言情文学的繁盛情景，一直持续到抗战胜利后。华北沦陷区以北派武侠小说为代表，达到了现代武侠的一个高峰。\n\n国统区的新文学力量是最强大的，抗战初期提倡“文章下乡”“文章入伍”，用民间形式、旧戏曲形式进行创作，创办众多通俗文学的报刊和社团，一时也成为风气。原来的章回小说大家张恨水，在新形势下向新文学的进一步靠拢，有着重大的意义。国统区显示了多样的雅俗联手的过程。\n\n至于解放区，由于文学更大范围地转入战时状态，读者对象转向偏僻农村中文化偏低的农民，通俗化的必要性、紧迫性加强了，运用行政手段鼓励写作包含新思想的农民读物便成了当务之急。","keywords":"雅俗文学相互渗透 报刊杂志 三个地区","note":"四十年代的雅俗融合潮流，受到了当时时代变化的影响，也是由于雅文学和俗文学各自继续发展的需要，总体上来说是中国小说创作进一步发展深化的结果。真正现代化的中国通俗文学，应当说是迟至这个时期才大体确立的，大家对此要有所了解。"},{"id":"246","stars":"★★★★","title":"艾青在我国新诗发展史上具有怎样的地位","body":"一、显示了中国新诗的历史趋归\n\n艾青在新诗发展的第二个十年的后期，即以《大堰河-我的保姆》引起了诗坛的注目，被称为“吹芦笛的诗人”。诗人自己宣称，这“芦笛”是从“彩色的欧罗巴”带回的，评论家也指出从艾青的诗“明显地看得出西方近代诗人凡尔哈仑、波特莱尔的影响”。艾青的诗在起点上就与我们民族多灾多难的土地、与人民取得了血肉般的联系。诗人同时还顽强地宣布要在世人的“嘲笑”中坚持“我的姿态”，唱出“我的歌”，表现出独立意志和自觉的自我意识。\n\n艾青早期诗歌所显露出来的世界潮流、民族传统与个人气质的交汇，显然不只属于艾青个人，而是显示了中国新诗经过近二十年的发展必然出现的历史趋归。\n\n二、艾青是属于我们民族自己的成熟诗人，并影响了抗战时期诗歌创作\n\n民族解放战争的号角一吹响，艾青即从时代的“流浪汉”变成了时代的“吹号者”，迅速地在争取独立、自由、解放的斗争中找到了自己的位置。他深入到人民中间，思索着民族的命运，探索新诗通向“民族心灵深处”的道路。\n\n1939年，他献出了第二本诗集《北方》和长诗《向太阳》以后，人们一致地确认：我们民族自己的成熟诗人终于出现了。这距离《大堰河-我的保姆》的发表不过五年时间，但距离《新青年》发表第一批白话新诗已有21年。1940年，评论家冯雪峰对艾青的历史地位做了理论上的评定：“艾青的根是深深地植在土地上”，是“在根本上就正和中国现代大众的精神结合着的、本质上的诗人”“中国新诗的创造可以说正由他们在开辟着道路”。抗战时期国统区最有影响的诗歌流派“七月派”的青年诗人们，一再申明“他们大多数人是在艾青的影响下成长起来的”，自觉地以艾青作为他们的旗帜。另一个重要诗歌流派-中国新诗派的代表诗人穆旦在写作起点上也显然受到艾青的影响。\n\n三、艾青的诗典型地表现了中国新诗是20世纪世界诗歌的一个组成部分\n\n艾青是最早走向世界的中国新诗人之一，他的《大堰河-我的保姆》发表后不久即被译为日文，在日本进步青年中产生了强烈反响，在以后的几十年间，一直在世界范围内广泛流传，至今已传遍英、法、德、西班牙、日、俄、罗、波、捷、匈、保等十多个国家。艾青的诗典型地表现了中国新诗是20世纪世界诗歌的一个组成部分的历史特点。\n\n艾青的诗在中国新诗发展历史上所完成的是历史的“综合”的任务。艾青一方面坚持井发展中国诗歌会诗人“忠实于现实的、战斗的”传统，另一方面又克服、扬弃其“幼稚的叫喊”的弱点，批判地吸收现代派诗人在新诗艺术探讨中取得的某些成果，进一步丰富与发展了新诗艺术，成为新诗第三个十年最有影响的代表诗人。","keywords":"世界潮流、民族传统和个人气质交汇 历史趋归 民族自己的 世界诗歌的组成部分","note":"艾青可以说是四十年代最重要的一位诗人，其历史地位，不单单是横向的对于当时诗歌创作的影响，更是纵向地，对既往中国新诗成就的总结和归纳。艾青相关的名词解释中，我们需要重点关注的是“艾青式的忧郁”这一关键概念，考查频率较高。"},{"id":"247","stars":"★★★★","title":"请谈谈艾青诗歌意象艺术的探索","body":"艾青带给现代诗歌意象艺术的首要贡献，是意象的时代色彩、现实的生活气息和艺术审美表现的融合与有机统一。艾青的诗歌在意象的选择与表现上能够独出机杼，形成了对“五四”以来中国现代诗歌意象表现上的艺术超越，把中国现代诗歌意象世界推进到了一个开阔壮观的宏大境界。\n\n一、诗歌意象的时代精神体现与艺术美追求的融合\n\n在意象的选择上，艾青找到了具有意象的理性深度内涵，又能体现意象的艺术观感的审美效度的典型意象，这就是人们熟悉的“土地”与“太阳”两个意象中心。艾青1930年代诗歌的主题是“苦难”“斗争”与“光明”，他的诗歌主题较鲜明而集中地凝聚在“土地”与“太阳”这两个具有母题意义的原型意象中心上。这两个中心意象蕴含了诗人对生活的独特艺术感受，体现了他的诗与时代精神的紧密联系。\n\n（一）“土地”意象\n\n（1）“土地”意象的深度内涵\n\n①文化精神内涵\n\n土地是繁殖生命的沃土，是生命再生的象征符号，是人类的生命源泉的所在。而且，在中国农耕社会里，“土地”是人们世世代代肉体与灵魂的归宿。在人与自然、人与土地的亲和关系中，中国人形成了牢固的自然崇拜、土地崇拜的情结。艾青倾心的“土地”意象情结，是有着中国传统文化的血脉渊源的。\n\n②民族情感内涵\n\n“土地”意象情结的另一深度内涵，则是它直接突入了那个时代民族情感的精神内核，连接着一个时代人民大众的心灵磁场。当人们世代生存的土地被大片掠夺，与他们生息相通的土地被肆意践踏之时，诗人泣血苦吟之声怎能不成为一个民族的共同心声！“土地”的意象里，凝聚着诗人对祖国-大地母亲最深沉的爱，爱国主义是艾青作品中永远唱不尽的主题。\n\n（2）“土地”意象的美学意义\n\n艾青诗歌不仅具有“土地”的品格与精神，还有“土地”的气息与色彩。从颜色到血质，从生到死，土地是中国农民的宿命，“土地”也是艾青诗歌的宿命。他从土地获得生命，他把生命交给土地，他把死后的“羽毛”埋在土地里。他用生命的热力熔铸的土地意象，如同一座诗的丰碑，记录了一个民族特定的心灵影像，也是贫瘠的中国现代诗坛矗立起的一座艺术的高山。\n\n（二）“太阳”意象\n\n（1）“太阳”意象的特征\n\n艾青的“太阳”，是融入了他自己的体验的意象结晶，是打上了他那个时代的精神印记与审美意识的太阳。如果说郭沫若的太阳情结中较突出体现了现代人格的自我崇拜意识与创造意识，那么艾青的太阳意象情结里更多融入了华夏民族对天与地的虔诚的崇拜。\n\n（2）“太阳”意象的内涵\n\n①情感内涵\n\n“太阳”意象是诗人灵魂和爱国主义情感的另一种表现形式：对于光明、理想和美好生活的热烈的、不息的追求。其大量诗作，都表现了诗人对于光明的热望和神圣情感。在艾青诗歌中，形成了一个以太阳为中心而扩展开的太阳意象谱系或族群。艾青的不少诗篇，就是太阳、光明、春天、黎明与火的颂歌，他借此表达对光明理想的热烈向往与坚定信念。\n\n②文化内涵\n\n太阳意象同样是深刻烙印着人类经验的一个具有原型意义的意象，诗人对太阳意象的选择有着先民太阳崇拜的原始的经验的遗留。艾青诗歌中太阳意象的寓意，以其对生命再生意义的赋予，使他的太阳诗具有了永恒的主题意义。如果说“土地”意象主要表达的是民族生存的现实关怀的话，那么“太阳”意象似乎更多体现出的是对人类生命形式的理想化的想象。\n\n艾青诗歌的这两个中心意象内涵的超越品质与审美化形式，是中国现代意象诗走向成熟的一个标志，体现了中国现代意象诗内在品质的民族化与现代性特征的较成功的结合。\n\n二、意象艺术表现方法：现实主义、浪漫主义和象征主义有机融合\n\n艾青诗歌意象探索上的又一贡献，是他在意象艺术的表现方法上，找到了一条现实主义、浪漫主义与象征主义有机融合的自由而开放的道路。\n\n艾青的诗歌以现实主义的意象诗学原则为基础，将现实主义诗歌立足现实、关注人生的时代精神化为诗的血脉，诗歌意象充满了浓郁的现实生活的气息。\n\n另一方面，艾青的诗歌意象又常常为赤子之心的火热情感诗意化、生命化，获得一种浪漫主义的主观化、情绪化的诗性品格。这类意象化诗歌，所表现的是一种苦难岁月中对生活的坚定信念，对光明未来的执着向往的情怀。\n\n此外，艾青在他的诗歌意象世界中，还自觉吸纳了象征主义的方法，象征意象常常与写实意象或抒情性浪漫主义意象交织，创造出朴实而深邃的诗境。","keywords":"意象选择 典型意象 土地 中国传统文化血脉渊源 民族情感的精神内核 特定的心灵影像 太阳 打上时代精神印记 对于光明、理想和美好生活的追求 对人类生命形式的想象 意象中心 表现方法 有机融合","note":"艾青诗歌的意象这部份内容在艾青相关内容中考查频率还是比较高的，这不仅仅是由于艾青对于“土地”“太阳”这两个意象的使用，更是因为艾青在诗歌意象艺术上的探索。其中特别值得注意的是艾青的表现方法-现实主义、浪漫主义和象征主义的有机结合，大家可以好好体会一下。"},{"id":"248","stars":"★★★★","title":"如何理解“艾青式的忧郁”","body":"艾青的诗神是忧郁的：在他的诗里，回旋着忧郁的调子，这浸透了诗人的灵魂、永远摆脱不掉的忧郁，是构成艾青诗歌艺术个性的基本要素之一。我们可以把它叫做“艾青式”的忧郁。\n\n一、“艾青式的忧郁”浸透着诗人对祖国、人民极其深沉的爱，更表现了诗人对生活的忠实与思索\n\n艾青小时候的经历让他有了一种“农民的忧郁”。长大后个人境遇、气质与西方文学思潮的结合，形成了艾青早期作品中流浪汉的“漂泊的情愫”。在抗日战争的炮火中，艾青辗转于中国的“北方”，不仅理解了“载负了土地的痛苦的重压”的北方农民的现实苦难，而且对这“古老的国土”所“养育”的“世界上最艰苦与最古老的种族”的感时愤世、忧国忧民的传统产生了心灵的契合。从小感染到的“农民的忧郁”与“飘泊情愫”遂升华到新的时代的高度。这忧郁里，浸透着诗人对祖国、人民极其深沉的爱，更表现了诗人对生活的忠实与思索。\n\n二、“艾青式的忧郁”产生于对中国革命和抗日战争长期性、艰苦性的这种深刻认识与体验中\n\n艾青身上有一种农民式的忠实于生活的清醒的现实主义态度。正因为如此，抗日战争初期，当大多数诗人都沉湎在廉价的乐观中，预言着轻而易举的胜利的时候，艾青却对生活有更深沉的观察与思索：他在全民抗战的胜利中，看见了阴影、危机，看见了祖国大地的贫穷，战争的真正主人-人民还生活在苦难中。诗人说，他“不幸发现了”这样的生活真理：“中国的路，是如此的崎岖，是如此的泥泞呀。”艾青的忧郁，正是产生于对中国革命和抗日战争长期性、艰苦性的这种深刻认识与体验中。\n\n三、“艾青式的忧郁”表现了他对美好生活执著的追求与坚强的信念\n\n艾青的忧郁当然不表示他对生活的灰心与绝望；相反，还表现了他对美好生活执著的追求与坚强的信念。因此，他的“忧郁”给读者一种更加深沉的力量，诗人自己说：应该“把忧郁与悲哀看成一种力”。","keywords":"对祖国、人民极其深沉的爱 对生活的忠实与思索 清醒的现实主义态度 对美好生活的执著追求与坚强信念","note":""},{"id":"249","stars":"★★★★","title":"艾青诗歌的艺术手法有何特点","body":"一、感受世界和艺术地表现世界的方式的中心环节是“感觉”\n\n艾青有着自己独特的感受世界和艺术地表现世界的方式，其中心环节是“感觉”。人们回忆说：“艾青写诗，像印象派画家那么重视感觉和感受。他常常处在一种沉思的状态里，为的是怎样才能抓住那种刹那间得来的新鲜印象，加以渲染，并且用恰当的诗句描画出来。”艾青在总结自己艺术经验时，也十分明确地提出“诗人应该有和镜子一样迅速而确定的感觉能力”。\n\n二、强调主观情感对感觉的渗入\n\n艾青同时不满足于捕捉感觉，反对“摄像师”式的仅仅将感觉还原于感觉，强调主观情感对感觉的渗入，追求“对于外界的感受与自己的感情思想”的“融合”，并在二者的融合中产生出多层次的联想，创造出既是明晰的，又具有广阔象征意\n\n义的视觉形象，这就是艾青最常用的艺术方法。艾青诗里的色与光，不再是对感觉、印象的简单记录，而是一种暗示、象征，既具有自然形态的形式美，又积淀着社会、历史、心理、哲学等的深刻内容，在形式与内容、色彩与主题之间存在着一种对应的关系，同时又为诗人个性所渗透，可以称之为艾青的光与色。比如，在表现“太阳”的主题时，艾青往往采用通红、金色、浅黄、浅蓝的色调。这或强烈或温柔明洁的光，会你联想起光明与生活的美好。\n\n三、中西诗学相融合的道路\n\n正是在强调捕捉瞬间感觉、印象在艺术创造中的作用这一点上，最深刻地显示了艾青的诗艺与西方印象主义绘画之间的联系。而强调瞬间印象、感觉的捕捉，主观情感的渗入，这恰恰又是西方印象主义绘画与西方象征主义诗歌及中国古代诗歌美学原则的相通之处。这样，通过西方印象主义绘画这个中间环节，艾青的诗，一方面与西方象征主义诗歌相联结，另一方面又与中国古典诗歌的传统取得了内在的联系。艾青的诗歌，之所以是最具有世界性的，同时又是中国民族的，在艺术表现上，这应该是一个带有根本性的原因。这表明，艾青的诗歌创作，也是通过自己独特的途径，走着中西诗学相融合的道路，这是与中国新诗的发展的历史趋向相一致的。艾青并以自己杰出的艺术成就，成为这一历史归趋的代表。","keywords":"从“感觉”出发 主观情感对感觉的渗入 中西诗学相融合","note":"艾青的诗歌和现代文学史上众多诗人的创作一样，都受到了中西方诗学的双重影响，而联系这两方面影响的核心是“感觉”。像这样中西融合的现象，在当下的考查中得到了越来越多的关注，在考查相关作家时往往会从这一点切入，具有类似特征的作家大家最好都要留意一下。"},{"id":"250","stars":"★★★★","title":"艾青的诗歌形式有何特点","body":"艾青诗歌具有独特的感受世界和艺术地表现世界的方式。他的诗很自然地借鉴了西方象征主义与印象派的艺术手段，却又能与中国古典诗歌常用的“意象”方式沟通，这形成了艾青诗歌独特而杰出的艺术形式。他的诗歌，主要具备如下特征：\n\n一、推崇自由诗体\n\n艾青是自由诗体的自觉提倡者，他说，自由诗体是“新世界的产物”“受格律的制约少，表达思想感情比较方便，容量比较大-更能适应激烈动荡、瞬息万变的时代”“自由体的诗是带有世界性的倾向”。艾青在诗坛上出现较晚，使他有机会吸收以前各种自由体诗（包括小诗、象征派、现代派诗歌）的长处，也能借鉴格律诗派诗歌的艺术成果，再加上他还更多地受到了西方现代派诗歌的影响，更重视诗歌意象的捕捉和创造，因此，他的自由诗体特点更加明显。艾青诗歌不讲究外在的整齐，不重押韵，追求自由地毫无拘束地表达情感，他的诗比以前的自由体诗更自由。\n\n二、追求“诗的散文美”\n\n艾青还专门提倡诗的“散文美”。认为“散文是先天的比韵文美”，它最接近口语，“新鲜而单纯”“富有人间味，它使我们感到无比的亲切”。艾青还特别看重诗的“调子”：“调子是文字的声音与色彩，快与慢，浓与淡之间的变化与和谐。”\n\n可以看出，艾青的“诗的散文美”，既是对自然本色，贴近人的日常生活，朴素、洗练、亲切的诗风的追求，又是对口语化的诗的语言与更注重“调子”的自由诗体的追求。\n\n三、奔放与约束之间的协调\n\n艾青诗体的特点是，奔放与约束之间的协调，即是在变化里取得统一，在参错里取得和谐，在运动里取得均衡，在繁杂里取得单纯。他的诗在形式上不拘泥于外形的束缚，很少注意诗句的韵脚或字数、行数的划一，但又运用有规律的排比、复沓造成变化中的统一，参差中的和谐。如《大堰河-我的保姆》全诗十三节，少则四行一节，多则十六行一节，少则每行两字，多则每行二十二字；全诗不押韵，但每一节首尾句短而重复，以确定基调与色彩，中间几行基本采用排比句式，且多长句，以尽情抒发与描摹。","keywords":"自由诗体“诗的散文美”奔放与约束之间的协调","note":"理解记忆艾青诗歌形式的特征，大家可以联系受艾青影响极大的七月派的诗歌形式。七月派坚持自由诗的创作，将自由诗推上了一个新的高峰，而相应的，艾青诗歌形式上最重要的一点便是“诗的散文美”，这样的追求让他推崇自由诗体，追求奔放与约束之间的协调。很多内容都可以这样互相对照着记忆，大家可以把这些相呼应的知识联系起来。"},{"id":"251","stars":"★★★★★","title":"艾青诗歌的艺术特征是怎样的（26北京大学）","body":"艾青是现代文学史上杰出的诗人，其作品具有感知、寓理、抒情等诗美个性，建构出代表现代诗美审美发展趋势的品格。\n\n一、忧郁的诗绪\n\n艾青的诗神是忧郁的，在他的诗里，回旋着忧郁的调子，这浸透了诗人灵魂、永远摆脱不掉的忧郁，是构成艾青诗歌艺术个性的基本要素之一。我们可以把它叫做“艾青式”的忧郁。艾青的忧郁，产生于对中国革命和抗日战争长期性、艰苦性的深刻认识与体验中。这忧郁里，浸透着诗人对祖国、人民极其深沉的爱，更表现了诗人对生活的忠实与思索。“艾青式的忧郁”是时代情绪、民族传统、西方文化的影响与艾青个人气质的一种“契合”。\n\n艾青的优郁并不表示他对生活的灰心与绝望；相反，还表现了他对美好生活执著的追求与坚强的信念，因此，他的“忧郁”给读者的是一种更加深沉的力量。\n\n二、独特的表现方式\n\n艾青有着自己独特的感受世界和艺术地表现世界的方式，其中心环节是“感觉”。首先是从“感觉”出发，同时不满足于捕捉感觉，反对“摄像师”式的仅仅将感觉还原于感觉，强调主观情感对感觉的渗入，追求“对于外界的感受与自己的感情思想”的“融合”，并在二者的融合中产生出多层次的联想，创造出既是明晰的，又具有广阔象征意义的视觉形象。\n\n三、运用光与色彩象征诗义\n\n艾青诗里的色与光，不再是对感觉、印象的简单记录，而是一种暗示、象征，既具有自然形态的形式美，又积淀着社会、历史、心理、哲学等的深刻内容，在形式与内容、色彩与主题之间存在着一种对应的关系，同时又为诗人个性所渗透，可以称之为艾青的光与色。\n\n在表现“太阳”的主题时，诗人所采用的通红、金色、浅黄、浅蓝的色调，或强烈或温柔、明洁的光，都使你联想起光明与生活的美好。灰黄与金红是艾青的两种基本色调，表现着他所拥抱的世界的两个侧面。\n\n四、提倡诗的“散文美”\n\n艾青还专门提倡诗的“散文美”。这既是对自然本色，贴近人的日常生活，朴素、洗练、亲切的诗的风格的追求，又是对口语化的诗的语言与更注重“调子”的自由诗体的追求。\n\n艾青诗体的特点是，奔放与约束之间的协调，即在变化里取得统一，在参错里取得和谐，在运动里取得均衡，在繁杂里取得单纯。他的诗在形式上不拘泥于外形的束缚，很少注意诗句的韵脚或字数、行数的划一，但又运用有规律的排比、复沓造成变化中的统一，参差中的和谐。","keywords":"忧郁的诗绪 主观情感对感觉的渗入 光与色彩象征诗义 诗的“散文美”","note":"艾青诗歌的艺术风格，需要我们把艾青诗歌的主题思想、表现手法、诗歌形式等方面综合起来探讨，需要大家对艾青相关的整体知识有一个较好的掌握。这一部分可以和前面几道题的内容联系起来，形成一个整体框架，共同记忆。"},{"id":"252","stars":"★★★","title":"艾青诗歌对七月派诗歌的影响","body":"艾青诗歌以创作实绩深深影响了七月诗派。他们一致追求形象的声、色、线，使诗歌焕发出生命力的光彩；他们的诗歌都呈现出一种崇高的品格与灵魂；他们从生活自然中提取意象与诗情，把主观激情融入其中，使诗歌具有生命的张力。艾青对七月派诗歌的影响，主要集中在以下几个方面：\n\n一、诗歌形式上，追求“诗的散文美”\n\n艾青追求“诗的散文美”，这既是对自然本色，贴近人的日常生活，朴素、洗练、亲切的诗的风格的追求，又是对口语化的诗的语言与更注重“调子”的自由诗体的追求。艾青诗体的特点是，奔放与约束之间的协调，即在变化里取得统一，在参错里取得和谐，在运动里取得均衡，在繁杂里取得单纯。他的诗在形式上不拘泥于外形的束缚，很少注意诗句的韵脚或字数、行数的划一，但又运用有规律的排比、复沓造成变化中的统一，参差中的和谐。\n\n这些影响了七月派诗歌形式，和内在的“力”相适应，七月派诗的形式是自由奔放的，他们追随艾青，提倡散文美，自觉地把自由诗推向一个坚实的新高峰。\n\n二、诗歌情感上，主张主观情绪融入客观对象\n\n艾青不满足于捕捉感觉，反对“摄像师”式的仅仅将感觉还原于感觉，强调主观情感对感觉的渗入，追求“对于外界的感受与自己的感情思想”的“融合”，并在二者的融合中产生出多层次的联想，创造出既是明晰的，又具有广阔象征意义的视觉形象，这就是艾青最常用的艺术方法。这一艺术手法也被七月派诗歌继承发扬，他们反对冷淡地摹写生活，而主张将诗人的人格、情感、血肉、审美趣味强烈地渗透到客观对象中，达到主客观的互相拥抱、融合。\n\n三、诗歌色彩上，凝聚象征意味\n\n艾青诗里的色与光，不是对感觉、印象的简单记录，而是一种暗示、象征，既具有自然形态的形式美，又积淀着社会、历史、心理、哲学等的深刻内容，在形式与内容、色彩与主题之间存在着一种对应的关系，同时又为诗人个性所渗透，可以称之为艾青的光与色。这些内容，都影响了七月派诗歌在色彩上的运用。\n\n四、诗歌技巧上，浪漫主义与象征主义结合\n\n七月派诗歌的革命现实主义融进了象征主义、浪漫主义艺术技巧是受到了艾青的影响。艾青的诗一方面坚持了革命现实主义“忠于现实的、战斗的”传统，另一方面又克服与扬弃了其“幼稚的叫喊”的弱点，吸收了象征主义、浪漫主义等诗歌的艺术技巧，从而使自由体诗在艺术上达到了一个新的高度，推动了中国新诗的健康发展。他对象征与暗示、通感等方法的运用相当娴熟，这些都影响到了七月派诗人的诗歌创作。","keywords":"诗的散文美 主观情绪融入客观对象 象征意味 浪漫主义 象征主义","note":"艾青对七月派的影响，其实是艾青的表现手法和风格与七月派诗歌相似之处，需要大家对二者都有相当的了解。这些主要体现在二者的形式、情感、色彩和技巧四个方面，大家可以分别展开进行论述。同理，这道题也可以回答“艾青与七月派诗歌有什么相通之处”这样的问题。"},{"id":"253","stars":"★★","title":"抗战时期诗歌整体风格有何特点","body":"一、现实主义诗风成为主流\n\n这一时期中国诗歌会所倡导的具有强烈的时代性、战斗性的写实主义诗风风靡诗坛，成为不同流派的诗人的共同归趋。\n\n中国的现代诗人本质上都是，而且首先是自己民族忠实的儿子。因此，他们时时自觉意识到时代、民族呼唤的压力，他们宁愿放下自己弹惯了的琴弦，也要追随中国诗歌会作时代鼓手的呐喊。而且时代已经改造了读者群，他们一反过去静观欣赏的习惯，也要求着时代的战歌，而不再欣赏缠绵的牧歌和哀曲。于是，产生于这一时期的大量诗歌、诗集都具有了共同的风貌，各个诗人以往的风格反而不易辨别，与其说这是诗人的诗，不如说是时代的诗。\n\n二、直接抒情，直面现实\n\n这一时期所有的诗都忠实地记录了抗战初期的民族情绪：尽管大敌当前，国破家亡，却没有惶惑不安，消极颓废，每一个诗行都满溢着全民族大奋起的昂扬与乐观。抒情内容的健康与浅露，和现代中国民族向上精神的不成熟性正相适应。这一时期诗歌的抒情方式则大多是直抒胸臆的宣言式的呐喊战叫，同时又加入了大量的议论式的陈词，这造成了一种时代所需要的气氛，容易产生现时性的鼓动效果，却不免空泛而失去了诗歌应有的历史性的回味。\n\n还有大量的诗是直面现实的：诗人与人民共同经历着颠沛流离的逃亡生活，灾难深重的民族、人民的广泛人生世界也就大量地闯入了诗的领域，给战前某些自我封闭的诗歌世界吹进了清新的生活之风，注入了新鲜的生命的泉水；叙述描写方式则回到了直接描摹、具体再现的简单粗陋形式上。\n\n三、让诗成为听觉艺术\n\n这一时期在诗歌民族化、群众化的强烈呼声下，诗歌形式的探索与改造，受到了重视，诗人们以极大的热情进行了多方面的试验。诗人们努力寻找诗歌“为现实斗争服务，与人民接近”的方式，出现了诗朗诵运动，主张“要使得诗重新成为＇听觉艺术＇，至少是可以不全靠眼睛的艺术，而出现在群众之前，才能使诗更普遍地，更有效地发挥其武器性，而服务于抗战”。\n\n四、散文化的自由诗体成为主流\n\n这一时期无论是诗朗诵运动，还是街头诗的试验，都推动着新诗语言与形式向通俗化、散文化方向的发展。抗战时期新诗从诗人的书桌，走到民众之中，走向世界反法西斯战线的东方战场，被严重的民族危机所激发起来的全民族的抗战热情，近百年来民族郁积的总爆发，都必然冲破诗歌格律的束缚，向散文化方向发展，自由诗体在中国诗坛上再次崛起，成为抗战时期诗歌形式的主流。","keywords":"现实主义 直接抒情 直面现实 听觉艺术 诗歌散文化 自由诗体","note":"抗战时期诗歌的整体风格是与当时的时代环境相适应的，在那样一个呼唤抗争、民族情绪高涨的时代，文学必须要如实反映现实，直白地抒发情感，因此这一时期的诗歌多遵循着现实主义手法，直接抒情。第三个十年的诗歌相关内容中我们需要重点关注中国新诗会（九叶派）和七月诗派这两个重要的诗歌流派。"},{"id":"254","stars":"★★","title":"抗战后期中国新诗有怎样的发展","body":"随着抗日战争转入相持阶段，抗战诗歌的发展也进入一个深入时期。抗战初期的诗歌对诗歌艺术审美特性的严重忽视，以及由之产生的报复性的后果，越来越为诗坛与社会所不能容忍。这一时期的新诗，出现了如下发展：\n\n一、时代要求推动现实主义诗歌走向成熟\n\n尽管这一时期并没有就“新诗向何处去”进行有组织的大规模的正式讨论，但一些座谈会及许多杂志的文章中都一再地涉及新诗发展方向问题。大多数诗人的注意力都集中于如何丰富和提高现实主义诗歌艺术的表现力，推动现实主义诗歌走向成熟这一时代的要求上。\n\n二、属于中华民族的阔大诗风逐渐形成\n\n艾青为扩大现实主义诗歌思想艺术容量，向象征主义诗歌艺术的自觉借鉴、对诗歌语言暗示性的追求和总体象征式的抒情手法，都直接地影响了这一时期诗歌艺术的探索。艾青式的忧郁和沉思有如浓雾流泻于《射虎者及其家族》及同时期其他优秀诗作中，形成了与这一时期的时代心理、民族情绪相适应的沉郁、凝重的诗的氛围，属于中华民族的阔大诗风。\n\n三、现代新诗有了自己的现代诗学的雏形\n\n这一时期的诗人，通过历史与现实经验的总结，对诗的内容与形式的认识达到了新的水平：李广田对诗歌艺术（包括诗歌形式）的探索成为理论家和诗人注意的中心，出现了艾青《诗论》、朱自清《新诗杂话》、李广田《诗的艺术》、朱光潜《诗论》等把新诗艺术探讨提到理论高度的学术著作，现代新诗终于有了自己的现代诗学的雏形，这是现代新诗趋向成熟的又一个重要标志。\n\n四、现代新诗形式美的追求促成了现代新诗个性的追求\n\n在这一时期诗的艺术探索中，诗的形式、诗的散文化问题是人们特别关注的。艾青明确提出了“诗的散文美”的概念，把诗歌形式散文化的问题提到美学的高度，自由诗体的提倡与形式主义诗风的否定、朴素的审美趣味的崇尚结合在一起，其实质是要给雄伟奔放的民族情绪以“天然去雕饰”的朴素外观，以表现现代民族情绪为职责的中国现代新诗终于有了适于自己的外在形式。这使现代新诗对形式美的追求在一度冷落后又达到了更自觉的阶段。\n\n与此相联系的是，对抗战初期失落了的诗的个性有了新的自觉追求。正是在对诗的个性的自觉追求中，逐渐形成了新的诗歌流派-七月诗派。","keywords":"新诗发展的历史道路 阔大诗风 现代诗学的雏形 新诗形式美的追求 新诗个性的追求","note":"抗战后期新诗的发展主要是将抗战前期忽略的新诗审美特征的追求给拾起来，在诗风、形式和主题等方面进行发展，这些发展，既是诗歌自身发展的需要，又是时代的要求。并且，这些发展在客观上推动了七月派的诞生，大家要注意一下。"},{"id":"255","stars":"★★★","title":"七月派诗人的创作主张是怎样的","body":"七月诗派以提倡革命现实主义与自由诗体为主要旗帜，在抗日战争与解放战争时期国民党统治区的诗歌创作中产生了巨大影响。他们的创作主张如下：\n\n一、继承革命现实主义传统\n\n七月诗派是直接继承了30年代中国诗歌会的革命现实主义传统的。胡风说：“现实主义的第一义的任务是参加战斗，用他的文艺活动，也用他的行动全部。”把诗作为战斗的武器，就必然追求诗歌与时代的密切结合，诗歌与人民融为一体，追求诗歌鲜明的毫不含糊的政治倾向性与革命功利主义的创作目的性，以及诗歌的史诗品格。\n\n二、反对客观主义\n\n七月派诗人并不是简单地恢复继承30年代中国诗歌会诗歌传统，无论是在生活态度，还是艺术理论与实践上，以及由此形成的艺术风格上，他们都有着自己的鲜明特色。\n\n七月派诗人无疑是主张正视现实的，但他们更反对“对于生活的追随的态度”乃至“卖笑的态度”，他们把用无可奈何的宿命论观点去对待生活中的矛盾与苦难，以及光有不平、牢骚而无行动，统统称之为小市民的犬儒主义，而加以鄙视；他们认为“在必然”的法则里，人的力量是决定的东西”，因此，强调发扬主观战斗精神去能动地影响、改造现实。在这一点上，七月派诗人可以说是直接发扬了鲁迅在本世纪初所召唤的“立意在反抗，指归在动作”的摩罗诗人的战斗传统的。基于这样的人生态度，他们在艺术上鲜明地打出了反对客观主义的旗帜。\n\n（一）首先，他们反对亦步亦趋地“琐碎地”描摹生活现象本身，而主张凭借正确地把握了的历史力量，“突入生活”，从生活现象突进、深入到生活的底蕴，从客观对象具体形态中开掘出内在的深广的历史社会内容，创造出包含着个别对象，又比个别对象深广的、更强烈的反映了历史内容的（甚至比现实更高的）艺术形象。\n\n（二）其次，他们反对冷淡地摹写生活，而主张将诗人的人格、情感、血肉、审美趣味强烈地渗透到客观对象中，达到主客观的互相拥抱、融合；在他们看来，“客观对象没有进入人的意识以前，是“不受作家主观影响的客观存在＇，但成了所谓＇创作对象＇的时候，就一定要受‘作家主观影响＇的，否则就不会有什么创作”。七月诗派强调“突入”生活的底蕴，强调诗歌中主观与客观、历史的东西与个人的东西的统一融合，正是对中国诗歌会主张直接描摹现实、将自我消融于大我之中的诗歌观的历史的纠正。","keywords":"革命现实主义传统 反对客观主义 突入生活 开掘历史社会内容 主观情绪渗透到客观对象","note":"七月派是第三个十年中十分重要的一个诗歌流派，其创作主张有对中国诗歌会诗歌传统的继承，但更多地受到了艾青的影响，从而形成了自己鲜明的特色，大家可以结合艾青诗歌的相关内容进行记忆。"},{"id":"256","stars":"★★★★","title":"七月派诗歌的整体艺术风格是怎样的","body":"一、反对客观主义，主张主客观互相拥抱、融合\n\n七月派诗人无疑是主张正视现实的，但他们更反对“对于生活的追随的态度”乃至“卖笑的态度”，强调发扬主观战斗精神去能动地影响、改造现实。基于这样的人生态度，他们在艺术上鲜明地打出了反对客观主义的旗帜，主张凭借正确地把握了的历史力量，“突入生活”，从生活现象突进、深入到生活的底蕴，从客观对象具体形态中开掘出内在的深广的历史社会内容，创造出包含着个别对象，又比个别对象深广的、更强烈的反映了历史内容的（甚至比现实更高的）艺术形象。七月派诗人主张将诗人的人格、情感、血肉、审美趣味强烈地渗透到客观对象中，达到主客观的互相拥抱、融合。\n\n七月诗派强调“突入”生活的底蕴，强调诗歌中主观与客观、历史的东西与个人的东西的统一融合，正是对中国诗歌会主张直接描摹现实、将自我消融于大我之中的诗歌观的历史的纠正。\n\n二、发掘民族自信力与历史乐观主义精神，同时注入自己的个性\n\n七月诗派塑造的抒情主人公形象，给诗坛提供了新的东西。七月派诗人们甚至从天上的雨，地上的小牛犊，一个跃动的夜，一座动乱的城，一条喑哑的江，一株“根深深地盘结在泥土的下面”的树......都发现了坚韧强劲的民族生命力与历史乐观主义的民族自信力。无疑是抗日民族解放战争的历史潮流孕育了诗人的这种情思；同时，这也注入了诗人的个性。七月派诗人对现实的认识升华到了一个新的高度。他们所发掘的，正是一种民族自信力与历史乐观主义精神。\n\n三、诗歌形式自由奔放\n\n七月诗派的上述总体倾向并不排斥诗人个人的独特创造。阿垅的《纤夫》、冀汸的《跃动的夜》、曾卓的《铁栏与火》、牛汉的《鄂尔多斯草原》、化铁的《暴雷雨岸然轰轰而至》，都是充满力度、足以显示“七月风”的代表作。但也各有特色：阿垅沉稳、坚忍；曾卓似急待喷发的“火”；牛汉带来草原黑的死寂、红的壮丽和绿的生命的复活；化铁气势磅礴地唤来大破坏的雄浑的力。和内在的“力”相适应，七月派诗的形式是自由奔放的，他们追随艾青，提倡散文美，自觉地把自由诗推向一个坚实的新高峰。","keywords":"主客观融合 民族自信力与历史客观主义 形式自由奔放","note":"七月诗派崛起于抗战烽火之中，跨越了抗日战争与解放战争两个历史阶段，是这一时期坚持时间最长、影响广大的文学流派。梳理这一诗派的艺术风格，要将其放在整体诗歌发展脉络之中，并注意其与艾青诗歌创作的联系。它既纠正了之前中国诗歌会的偏颇，又推动了自由诗的发展，反映了中国新诗的成熟，大家对此要有所了解。"},{"id":"257","stars":"★★★","title":"冯至后期诗歌的创作风格是怎样的","body":"一、“属于个人的诗”\n\n诗人冯至正是在林间小屋的凝神默思里，获得那辉煌而庄严的瞬间体验，达到生命与艺术的豁然贯通。冯至诗歌的主题思想，都是诗人对身边事物个人化的新的发现。\n\n战争在七月派诗人那里，唤起的是关于一个民族在血与火的考验中“骄傲地活着”与“不屈地死去”的生命价值的思考；在冯至这里则转化为关于个体与人类的生存状态、人的生命的形而上的体验与思考。如果前者“叙写政治感”，也即阶级感\n\n与民族感，“是属于公众的诗”，那么，冯至则是“吐露内心感”“是属于个人的诗”。同样是从身边的日常生活与自然中发现内在的哲理，在冯至这里，真正成为刻骨铭心的生命体验，并自觉上升到生命哲学的层次。\n\n二、受到西方思潮影响，同时具有东方哲学的底蕴\n\n冯至关于人的生命的体验与形而上的思考，与从歌德到存在主义的西方思潮的关系，是比较容易注意到的-既存在着影响，也有平行思考（例如对战争的类似体验）的相通。同时，冯至与传统思想的联系也是明显的，例如诗人关于自我与万物的沟通的体验与思考，就显然有“天人合一，物我一体”的思想因素。诗人自己还说，这样的经验，就“像是佛家弟子，化身万物，尝遍众生的苦恼一般”，冯至的诗也因此获得了某种东方哲学的底蕴。\n\n三、试图将自然流动的美凝定为一种有法度的美\n\n人们通常把《十四行诗集》最后一首看作是冯至诗的艺术宣言。它一方面是自由无拘的，无边无际的，不可把握的智性思考，另一面却是有形的感性呈现，形式的规范与定型-诗人正是要在这二者的矛盾和相互制约所形成的张力中，寻找自己的“诗”的存在形态。于是，冯至的诗里，出现了一系列“流动”的与“凝定”的意象。前者如“歌曲”“韵律”“风”“水”“云”；后者如“山”“路”“泥土”“树”“塔”“殿堂”，等等。人们不难发现这些意象所具有的亲切感：它们不仅是日常生活中最常见，与人的生存关系最为密切的，而且大都是有传统原型的。更为重要的是，这些“流动”的与“凝定”的意象，在冯至的诗里，并非只是静态地呈现，而是表现为前者向后者的动态的“转化”过程。所有这一切，都表现了诗人的美学理想：他是试图将自然流动的美凝定为一种有法度的美。\n\n四、采用十四行诗的形式和现代白话口语，达到了诗情、哲思与外在形式的和谐\n\n冯至选择了“十四行诗体”，难能可贵的是，冯至完全采用现代白话口语，连关联词也很少使用，却将这种外来的诗体形式运用自如，达到了内在诗情、哲思与外在形式的和谐。而冯至《十四行诗集》整体风貌中所显示的庄严、单纯与从容，以及艺术上的相对完美，使得它在40年代文学，以至整个现代文学之中，都是一个独特的存在。另一方面，冯至《十四行诗集》的成功是一个重要的征候，它表明中国现代新诗人，已经有足够的思想艺术力量，消化外来形式，利用它来创造中国自己的民族新诗。","keywords":"“属于个人的诗”西方思潮 东方哲学底蕴 流动走向凝定 十四行诗与白话口语","note":"冯至的诗歌风格和七月派诗歌风格迥然不同，又因为二者处于同一时代，所以可能会将二者放在一起比较。冯至这一时期的诗歌显露出了明显的中西文化相融合的特征，体现出了冯至希望吸收西方文化升华中国新诗的野心，并且也的确取得了重要的成就，主要体现在他的《十四行诗集》之中，大家要注意一下。"},{"id":"258","stars":"★★★","title":"如何评价冯至的《十四行集》","body":"一、使中国现代诗歌第一次具有了“形而上的品格”\n\n战争在七月派诗人那里，唤起的是关于一个民族在血与火的考验中“骄傲地活着”与“不屈地死去”的生命价值的思考；在冯至这里则转化为关于个体与人类的生存状态、人的生命的形而上的体验与思考。如果前者“叙写政治感”，也即阶级感与民族感，“是属于公众的诗”，那么，冯至则是“吐露内心感”“是属于个人的诗”。\n\n正是在这个意义上，人们评价说：“由27首诗组成的《十四行集》”，是中国新诗史上“最集中、最充分地表现生命主题的一部诗集，它是一部生命沉思者的歌”，它使中国现代诗歌第一次具有了“形而上的品格”。\n\n二、反映了大时代背景下中国知识分子对操守和人格的省思与坚持\n\n《十四行集》意象的精警与自然，语言的节制与沉厚，令人想到步入中年的作者在艺术上日臻圆熟，心情渐入化境。正如朱自清所评论的，这些诗作是“从敏锐的感觉出发，在日常的环境里传味出精微的哲理”“在平淡的日常生活里发现了诗”，并援引闻一多的话说：“我们的新诗好像尽是些青年，也得有一些中年方好，冯先生这一集大概可以算是中年了。”这种“中年人”的情调，不单是那种里尔克式的哲学意味、沉思气氛和孤寂感，而是反映了大时代背景下中国知识分子对操守和人格的省思与坚持。\n\n三、中国现代新诗人消化外来形式创造民族新诗的典范\n\n冯至虽采用西方十四行诗的形式，却并没有严格遵守这种诗体的传统格律，而是在德国诗人里尔克影响下采用变体，利用十四行结构上的特点保持了语调的自然，并且完全采用现代白话口语，连关联词也很少使用，将这种外来的诗体形式运用自如，达到了内在诗情、哲思与外在形式的和谐。而冯至《十四行集》整体风貌中所显示的庄严、单纯与从容，以及艺术上的相对完美，使得它在40年代文学，以至整个现代文学之中，都是一个独特的存在。另一方面，冯至《十四行集》的成功\n\n是一个重要的征候，它表明中国现代新诗人，已经有足够的思想艺术力量，消化外来形式，利用它来创造中国自己的民族新诗。","keywords":"形而上的品格 对操守和人格的省思与坚持 消化外来形式创造民族新诗的典范","note":"冯至的《十四行集》在中国现代诗歌发展史上具有很重要的地位，不但蕴含了冯至的创作理念，还体现了中国自己民族新诗的某些特征，可以结合冯至诗歌整体创作特征进行理解记忆。"},{"id":"259","stars":"★★★★","title":"简述“中国新诗派”的诗歌理论主张（25华东师范大学）","body":"一、“综合”的基本观念\n\n“综合”是中国新诗派的诗歌观念中的一个基本观念。诗人们这样明白表示，他们所提出的诗的新倾向“纯粹出自内发的心理需求，最后必是现实、象征、玄学的综合传统”。\n\n（一）首先是“现实”的因素：他们“绝对强调人与社会、人与人、个体生命中诸种因子的相对相成，有机综合”，这里是一个个体的人、人类的人与社会（民族、阶级）的人有机综合的概念，而且是要从现实中去把握、发现的；中国新诗派的诗人是以“对当前世界人生的紧密把握”为追求的。另一方面，他们也没有如30年代中国诗歌会诗人那样，将“现实”绝对化与狭窄化。在他们看来，“现实”既包括政治生活，也有日常生活在内；既指外部现实，也指人的内心世界；既是时代社会的，也是个人的，正是在“生活的现实的突进”与“心灵现实的突进”两个方面的统一上显示了中国新诗派诗人的个性。\n\n（二）以“玄学”作为诗学的基本要素，追求思想的感性显现，表明中国新诗派的诗人彻底抛弃了“诗的本质是抒情”的诗学观。\n\n（三）中国新诗派把他们的诗学里的“象征”规定为“表现于暗示含蓄”，这与他们所提倡的追求“表现上的客观性与间接性”的“新诗戏剧化”的主张是一致的。中国新诗派诗人追求的是意象与思想的凝合，把传统的主观抒情变为戏剧性的客观化处境，这与30年代现代派诗人将意象与诗情融合而实现诗的意境化不同。\n\n二、依据现代人思维的变化\n\n值得注意的是，中国新诗派诗人在强调“从抒情的进展到戏剧的”必要时，其主要依据是现代人思维的变化：“现代文化的日趋复杂，现代人生的日趋丰富，直线的运动显然已不足应付这个奇异的现代世界”，必须“放弃原来的直线倾泻，而采取曲线的戏剧的发展”。由此产生了他们的“现代诗”的定义：“现代化的诗是辩证的，包含的，戏剧的，复杂的，创造的，有机的，现代的”“现代诗接受了现代文化的复杂性，丰富性，而表现了同样的复杂与丰富”。\n\n三、反对诗歌过度散文化\n\n中国新诗派还要求对语言进行改造。中国新诗派的理论家们强调“诗的思维与语言的根本改造”，这集中体现了中国新诗派诗人的反叛性与异质性，恰恰是对早期白话诗的一个遥远的呼应。可以说是实现“中国诗的现代化”的历史性的努力把它们连接在一起的。\n\n但新诗派并不是对早期白话诗的简单重复，中国新诗派的诗人同时提醒要区分“诗的散文化”与“散文化的散文化’”、“逻辑本文”与“诗本文”、“生活语言”与“诗语言”，因此，他们也反对“对于民间语言、日常语言，及‘散文化’的无选择、无条件的崇拜”。这里包含的对早期白话诗偏颇的纠正与发展也是明显的。","keywords":"综合 现代人思维变化 诗歌语言","note":"中国新诗派的创作理念和七月派有很多不同，但二者处于同一时代，代表着当时中国新诗两种不同的创作追求，所以也会被放在一起进行比较，大家要有所了解。中国新诗派追求现实、象征和玄学的综合，依据现代人思维的变化进行创作，与七月派现实主义的倾向明显区分。二者的区别更是体现在对待诗歌散文化的态度上。"},{"id":"260","stars":"★★★★","title":"简述九叶诗派艺术成就（25中国人民大学）","body":"【答题框架】\n\n九叶诗派的主要代表人物包括辛笛、陈敬容、杜运燮、杭约赫（曹辛之）、郑敏、唐祈、唐湜、袁可嘉和穆旦（查良铮）等。1981年出版了诗歌合集《九叶集》，因此被称为“九叶诗派”。九叶诗派艺术成就主要体现在如下方面：\n\n一、九叶诗派追求“新诗戏剧化”，开创了独特的九叶诗体\n\n九叶诗派的诗体具有清新的意象、抒情的语言和具有前瞻性的思想。这使得九叶诗派的诗体显得更加新颖，也给后人诗歌创作带来很大的启发。注重在诗歌里营造新颖奇特的意象和境界，承接了中国新诗现代主义的传统，为新诗的发展做出了贡献。\n\n二、现实主义与现代主义的结合\n\n九叶诗派既反对逃避现实的伪艺术论，也反对扼杀艺术的唯功利论，他们企图在现实和艺术之间求得恰当的平衡。他们注重在诗歌里营造新颖奇特的意象和境界，语言清晰准确而诗意朦胧含蓄。同时，他们承接了中国新诗现代主义的传统，从现代日常生活中锻造语言，融注主观意志使之成为智性化的心象结构。\n\n三、独特抒情表达方式的构建\n\n九叶诗派在抒情表达上追求客观化和间接性，为诗的情志寻求“客观对应物”，避免直抒胸臆一泻到底的浮浅。他们的咏物诗在写实层次上建构象征空间，通过暗示来曲折表达。这种抒情方式使得他们的诗歌作品充满了深刻的内涵和丰富的想象力。\n\n四、具有时代风神的文学主张\n\n九叶诗派在文学观念上主张“人的文学”“人民的文学”和“生命的文学”。\n\n他们在艺术上坚持反对浪漫主义诗风，致力于新诗的“现代化”建设和“感受力的革命”，旨在使新诗成为现实、象征和玄学的融汇。他们的诗作视野开阔，具有强烈的时代感、历史感和现实精神，深深扎根于现实的土壤，讴歌人民的奋然抗争，诅咒反动统治的倒行逆施，力求写出时代精神和社会生活的本质。\n\n此外，九叶诗派的诗作具有反叛色彩和异端性质，他们的诗学理论和创作实践在当时并未获得较大反响，但包含着丰富的价值与启示。他们的诗歌作品不仅打破了“诗必须表现情感”的传统信条，还提出了“新诗现代化”的主张，更新了固有的诗歌观念。\n\n五、作品各具特色，风格多样\n\n九叶诗派中的每位诗人都有其独特的风格。例如，郑敏的诗深沉而静穆，杭约赫、唐祈的诗气势宏大、热情奔放，袁可嘉的诗形式严谨而意蕴深沉，杜运燮的诗则渗透着讽刺和幽默。这种多样化的风格使得九叶诗派的作品更加丰富多彩，也为现代新诗的百花园增添了新的色彩。\n\n六、大胆创新，融合中西\n\n九叶诗派在艺术上进行了大胆创新，既继承了我国古典诗歌的技巧，又从西方现代派诗中吸收了一些表现手法，更接近于表现现代复杂、快速的生活节奏。（李凡说：此处如有时间，可简单举例）\n\n七、对中国现代诗歌的深远影响\n\n九叶诗派对中国现代诗歌的影响是深远的。他们不仅丰富了中国新诗的艺术表现手法，还为中国新诗的发展提供了新的思路和方向。此外，他们还培养了一批优秀的诗人和翻译家，为中国现代诗歌的繁荣和发展做出了重要贡献。\n\n综上所述，九叶诗派的艺术成就体现在他们独特的诗歌理念、创新的抒情方式、多样化的作品风格以及对中国现代诗歌的深远影响等方面。他们的诗歌作品不仅具有高度的艺术价值，还为中国新诗的发展注入了新的活力和动力。","keywords":"新诗戏剧化 九叶诗体 现实主义 现代主义 独特抒情表达方式 时代风神 风格多样 融合中西 深远影响","note":"作为四十年代与七月诗派双峰井峙的一大诗歌流派，九叶诗派走出了属于自己的独特道路，在中国现代诗歌史上占据着相当重要的地位，而新时期以来，九叶诗派无疑是受到了越来越多的关注，在考查中出现的频率也有了明显的提升，对此我们要有所把握。"},{"id":"261","stars":"★★★","title":"穆旦的诗歌创作风格是怎样的","body":"一、反叛性与异质性\n\n最能体现中国新诗派的反叛性与异质性的，无疑是穆旦。穆旦的诗歌意味着对以“圆”为中心的传统哲学与诗学的“超越”，与以“残缺”为中心的现代哲学与诗学的建立。诗人排拒了中国传统的中和与平衡，将方向各异的各种力量，相互纠结、撞击，以致撕裂。所有现代人的生命的困惑全都在这里展开，相互对立、渗透、纠结为一团，这正是现代人的思维方式与情感方式。于是，我们可以说，早期白话诗人所提出的建立现代新诗的现代思维方式与情感方式的历史任务，到穆旦这里开始得到了初步的落实，这自然是意义重大的。\n\n穆旦以怀疑主义的眼光观照现代生活所提出的思想（生命）命题，终于打破了一切乌托邦神话。这是冷峻的逼视，是清醒的超越，更是“反抗绝望”的自觉。\n\n二、“使诗的形象现代生活化”“用‘非诗意’辞句写成诗”\n\n穆旦始终坚持“使诗的形象现代生活化”。穆旦诗中所有引起生理与心理不舒服，又充满矛盾的意象，以及由“美丽”向“荒凉”的转换，都是传统诗词中不可能有、甚至视为大忌的，但确实又是诗人在现代生活中的充满荒诞、无奈的真实感受与体验。而所谓用“‘非诗意＇辞句写成诗”，则是指诗人所采用的与传统抒情相异的“几近于抽象的隐喻似的抒情”方式。这是一种主体意识的自由伸展、运动，大量采用内心直白，或者是抽象而直接地理智化叙述，或者是将肉体感与形而上的玄思相结合，诗中任意出现对立两极间的跳跃、猛进、突转，造成一种陌生与生涩的奇峻、冷峭、惊异的美：这正是与他叛逆的思想与诗情相一致的。\n\n这样抽象化的抒情，如穆旦晚年所说，“传统的诗意很少”，可能使人“觉得抽象而枯燥”，但穆旦仍然坚持“这正是我所要的”。\n\n三、诗的语言上坚持“五四”现代白话诗的传统\n\n在诗的语言上，穆旦也同样拒绝文言，坚持“五四”现代白话诗的传统。他也反对遣词造句上意义的模糊与朦胧，主张“诗要明白无误地表现较深的思想”-这正是对早期白话诗人诗歌语言观的坚持与发展。穆旦充分发挥了汉语的弹性，利用多义的词语、繁复的句式，以表达现代人的“较深的思想”与诗情，同时又自觉地大量运用现代汉语的关联词，以揭示抽象词语、跳跃的句子之间的逻辑关系。可以看出，穆旦所创造的是一种诗人郑敏所说的“介于口语与书面语之间的文体”“它扭曲，多节，内涵几乎要突破文字，满载到几乎超载”，他确实走到了“现代汉语写作的最前沿”。\n\n穆旦不仅在诗的思维、诗的艺术现代化，而且在诗的语言的现代化方面，都跨出了在现代新诗史上具有决定意义的一步，从而成为“中国诗歌现代化”历程中的一个带有标志性的诗人。他的诗，一方面在各个方面都显示出对于传统诗学的叛逆性与异质性，成为对早期白话诗的一个隔代的历史呼应；另一面，却同样显示出鲜明而强烈的民族性。于是，在穆旦诗的冷峭里，更有着“新诗中不多见的沉雄之美”。","keywords":"反叛性与异质性 诗的形象现代生活化 非诗意 白话诗传统","note":"穆旦创作手法的特点便是“现代化”，包括诗的思维、诗的艺术、诗的语言。所以，这道题，也可以用来回答“穆旦诗中的现代化体现在哪里”以及“穆旦的贡献是什么”这些问题，大家要注意灵活变通。"},{"id":"262","stars":"★★","title":"抗日战争时期敌后根据地诗歌创作有何特征","body":"在40年代的敌后根据地里，由于“文艺为工农兵服务”成为主流意识形态，并且得到了根据地政权的支持，“诗的歌谣化”发展到了极致。\n\n这首先是通过政党、政权、群众团体的组织动员力量，用群众运动的方式，开展了工农兵群众性的新歌谣的创作运动。所谓“新歌谣”，就是在民间传统歌谣形式中注入革命的内容，以达到宣传、教育、普及革命思想的目的。歌颂革命与革命政党、政权、领袖、军队，就成为新歌谣的基本主题。也有一些新歌谣是围绕党的中心工作，进行现场鼓动的。这样的歌谣体创作，既有强烈的战斗性，又具有民间文学特有的幽默感与通俗性，是很能鼓舞士气的。\n\n另一方面，则是组织知识分子（诗人、作家）到工农兵中去进行采风（对新、老民间歌谣进行搜集、整理、加工），同时进行人与诗的改造。“改造”的结果使新诗发生了根本性变化：民间诗歌资源成为发展新诗的主要（以至唯一）资源；“诗的歌谣化”成为新诗发展的主要方向。这样，“五四”早期白话诗所进行的“歌谣体新诗”试验，所提出的“诗的平民化”的命题都被发展到了极端。正是“诗的歌谣化”决定了这一时期敌后根据地（与40年代后期的解放区）诗歌创作的基本面貌与特点。主要表现在以下几个方面：\n\n一、和新歌谣一样，“颂歌”（歌唱革命带来的新思想、新生活，歌唱革命政党、政权、领袖与军队）成为新诗的主要内容与体式。\n\n二、抒发个人感情被视为小资产阶级情调，由此导致诗人主体的消失，诗人成为大众（阶级）的代言人，和民谣一样，表现群体的思想感情。\n\n三、诗歌创作显示出“抒情的放逐”，趋向于群众斗争与劳动生活的如实描写与具体叙述。\n\n四、追求语言的朴实、易懂，大量采用口语、土语入诗，以普通不识字的工农兵能听懂为新诗通俗化的标准；\n\n五、尽量吸收、借用民谣的形象原型、体式、表现手法、韵律与语言，追求自然、自由而又富有节奏感的音乐效果。","keywords":"歌谣化 歌颂革命 平民化 民间诗歌资源","note":"敌后根据地新诗的显著特点是诗的歌谣化和平民化，这种特定的形成和这些诗歌的来源以及创作方式息息相关，大家可以从这个角度去切入进而掌握。敌后根据地的诗歌相关名词解释中我们需要注意“新诗歌谣化”这一关键现象以及《王贵与李香香》这些重点作品，虽然这部分整体考查的可能性不高，但大家也要有所准备。"},{"id":"263","stars":"★★","title":"《王贵与李香香》有何艺术特色","body":"《王贵与李香香》追求陕北民间说书那样的叙述语调，更是转借了许多陕北民歌的素材，这些本土本色的“比”与“兴”，给全诗带来了清新的气息。\n\n一、在传统的情歌体式中注入了阶级矛盾与斗争的新观念\n\n作者在传统的情歌体式中注入了阶级矛盾与斗争的新观念，都是以民间的素材起句，而以革命意识作结。爱情的曲折、磨难，是因革命的曲折、磨难所造成；而对爱情的忠贞也即是对革命的忠贞，最后也是革命的胜利才促成了情人的“团圆”。\n\n到诗的结尾，长诗男女主人公已经从普通的农民成长为把个人命运自觉与革命相联系的革命战士。这样，诗人就将民间歌谣、戏曲“情人历难而团圆”的模式创造性地转化为“在革命（与爱情）的考验中成长为新人”的革命诗歌的新模式。\n\n二、采用了陕北民歌“信天游”的格式，而又有了新的发展\n\n长诗在形式上采用了陕北民歌“信天游”的格式，而又有了新的发展。“信天游”本是一种抒情的民歌体，每两句为一节，表达一个比较完整的意思，多用以对唱、联唱；现在，诗人仍以两句为一节，但并不构成独立意义单位，而是以数十节合为一章，加以标题，构成一个相对完整的情节，然后，以“章”联缀成“部”，三“部”合为一诗，叙述了一个长篇故事。这样，就完成了民间抒情诗体向现代叙事诗的转化，同时又保留了信天游诗体中的浓郁的抒情色彩。这主要得力于对传统“比兴”手法的借用。“比兴”的运用显然增强了长诗的艺术表现力，但数干行诗全用“比兴”，又造成了艺术上的单一与板滞。《王贵与李香香》采用信天游的形式，每节中的两行是押韵的，音节也大体一致，节与节之间又允许换韵，这样，既具有鲜明的节奏感，运用又相对自由宽松。\n\n《王贵与李香香》一方面可以看作是民间文学与农民文化对现代新诗的一种渗透与改造，另一面，则是利用民间形式进行革命宣传、启蒙教育的一个尝试，而这两方面都对以后新诗的发展产生了深远的影响。","keywords":"阶级矛盾与斗争 革命诗歌的新模式”信天游”的格式“比兴”的运用","note":"《王贵与李香香》是敌后根据地长篇叙事诗的一个典型代表，很能体现敌后根据地长诗的特点，这部作品既坚持了革命文学的要求，又坚持了民间文学的传统，可以说是革命性与民间性结合的一个范例，和十七年时期的文学有很多相似之处。"},{"id":"264","stars":"★★★","title":"张爱玲散文有何特点","body":"张爱玲的散文虽不如她的小说那样冷艳奇崛，可是因为是自由书写性灵的缘故，她的散文因而更是写尽了她身边的一切所感所依，比起尽言他人事婉现自己身影的小说更能体现她的精神气质和个性魅力。张爱玲的散文创作，主要具备如下特征：\n\n张爱玲散文常写的是一些似乎与自己毫无关涉的人和事，抒发的是一些好像与沉重的人生关系不大的碎语闲言，但在这些散漫流畅的自在之谈中可见张爱玲对人生独到的观察视角和思考见解，而且，人们依然强烈地感受到张爱玲鲜明的主体意识。她不仅用散文谈自己的童年、自己的梦想、自己的家人与朋友、自己的生活情趣和艺术见解，而且也透过自己的眼光和感受谈人世沧桑、民族根性、文化品格、宗教信仰等。尽管她更多地采用了一种幽默、优雅、轻松、有时甚至是戏谑的笔法，但在所有这些背后，透出的那种世界的本质的苍凉，乃是永恒的，是张爱玲一以贯之的。\n\n二、贴近生活的原生状态\n\n张爱玲的散文洒脱无束，很少讲究精巧的谋篇布局，更贴近生活的原生状态，更显出一种大手笔的气度。在拉家常似的散谈之中，写出特有的情致，在随意的点染中，直抒自己的情怀，在没有什么章法的构架里，叙述着一个又一个故事。张爱玲的散文常有细节描绘的意象化，给人的印象也很深，她还喜欢不时插进些议论，似乎在有意显示语言的机智。这种不事渲染的本色本调，是张爱玲的另一种追求和潇洒。\n\n三、“私语”模式\n\n张爱玲散文有意与当时文学主潮拉开距离，只注重以自己的感觉去玩味庸常人生，这种审美层次的“玩味”能给读者带来“一撒手”的阅读快慰。张爱玲成功地运用“私语”诉说模式讲述自己的心声，造成情真意切、个性丰满的散文境界。她的散文在充满个性的絮叨中时时进出惊人妙语，娓娓的轻柔诉说中不失对人事的深刻见识，在对外部世界看似漫不经心的谈吐中表现自己独特的体会和思考，有一种言近旨远的审美境界，同时这种散文叙事方式也预言了当代女性散文发展的一大趋势。","keywords":"苍凉色调 原生状态“私语”模式","note":"张爱玲的散文和她的小说一样极富个性，二者的特征也有许多相似之处，比如在整体风格上的苍凉色调。大家可以把这部分内容与张爱玲小说的艺术特征联系起来进行记忆。相较于张爱玲的小说，张爱玲的散文单独出题的频率不高，不过一些学校在考查赏析题、写作题时，可能会涉及张爱玲的散文，大家要注意一下。"},{"id":"265","stars":"★★","title":"梁实秋的散文有何艺术特色","body":"抗战时期，一部分作家并不直接干预抗战现实，但也并非不关注人生，他们承接了《论语》派注重幽默闲趣那一种路子，以旁观姿态打量和揭示人生，推崇生活的智慧。梁实秋就是其中的典型代表。他以《雅舍》为代表的散文主要有以下艺术特色：\n\n一、充满生活气息又富有哲理意味\n\n梁实秋在文艺主张上强调理性，以理节欲。在散文创作上也体现这一精神，往往以理启人，以智悦人，充满理趣。梁实秋以超然姿态打量人生、揭示人生，推崇生活的智慧。他的散文不以抒情见长，而重议论，有意回避热点题材，不为时尚左右，多以生活中常见的事物为题，诸如男人、女人、理发、穿戴、吃饭、下棋，等等，但谈论中博雅的知见和幽默的遣趣交织，把人生体味艺术化了，别有一种阅读的魔力。作者似乎是信手拈来，向读者娓娓道出，风趣隽永，令人回味无穷，充满生活气息又富有哲理意味。\n\n二、简洁雅致，内涵丰富\n\n梁实秋对散文的要求一向是追求雅洁而厌恶粗陋，他的小品散文内容集中，主题突出，在篇幅上力求简短，一般只有一二千字，有的篇章如《雅舍谈》中的某些篇什甚至只有几百字。在语言文字的表述上，以“五四”以来的白话文为主，夹以必要的文言词句，文白相间；在句式上以灵活多变概括力强的短句为主，兼用容量较大，富表现力的长句，长短互补。使文章既简洁雅致，又传达出较丰富的内涵。\n\n三、幽默、谐趣\n\n梁实秋散文把生活艺术化，不仅体现在对生活的苦难面诗意化，他还擅长把生活中的阴暗面喜剧化。与梁实秋中庸、平和、淡泊、闲适的人生态度相适应，他的散文中绝少尖锐、辛辣的讽刺。作者明知人性的弱点和社会的黑暗，但并不做辛辣讽刺或批判，他擅长的是那种漫画化的揶揄或者打趣，其中既有智者式的洞察，也能让人感觉到他对于芸芸众生抱着一种亲切的理解、体贴态度。梁实秋把玩世态人情，针对一些人生笑料和俗人常态，诸如虚荣好胜、偏执狭隘等通病，多用亦庄亦谐的笔法加以喜剧化，委婉讽喻，谑而不虐。","keywords":"生活气息 哲理意味 简洁雅致 内涵丰富 幽默 谐趣","note":"梁实秋的散文创作与《论语》的幽默小品一脉相承，显示出了与这一时期的何其芳、巴金等截然不同的姿态。不过在这之中，梁实秋融入了自己的特色，体现出了梁实秋的作文主张，大家要注意一下。相关内容可以参考王虹《论梁实秋的散文创作》、高自双《论梁实秋的散文艺术》，具体资料可以在李凡文学正版群中领取。"},{"id":"266","stars":"★★","title":"抗战初期的戏剧总动员与全民总动员，使中国话剧产生了哪些变化","body":"一、现代话剧的“舞台”“观众”与“演员”都发生了深刻的变化\n\n抗战初期的戏剧总动员与全民总动员，使中国现代话剧的“舞台”“观众”与“演员”都发生了深刻的变化。\n\n首先没有了卡尔登大剧院或国民大会场那样的剧场和舞台，演出场所被限制在街头、广场，即从“剧场戏剧”走向“广场戏剧”；其次，观众不再是城市里衣冠楚楚的知识分子和小市民阶层了，他们是小城市里的商人、农民、工人和士兵，文化水准比较低，却有一点热情（也不免有点好奇心）；再次，因为客观环境不同，演出的戏就要求装置简单，人物与故事现实，对白通俗，演技有一定程度的夸张。过去在都市里的那一套，如果一点不变搬了来，结果是弄巧成拙，观众也莫名其妙。\n\n二、政治功能增强，艺术表现更通俗短小\n\n从“剧场戏剧”走向“广场戏剧”意味着戏剧观念、艺术表现、写作方式、演出形式等一系列变化。戏剧“政治宣传、鼓动、教化”的功能推向了极致，削弱、压倒戏剧的商业性能与娱乐功能。由此提出的是戏剧写作、表现上的新要求，如“（戏剧）主题第一应该“显明”，不要含胡”“第二应该简单，应该清楚地指导观众怎样同情的方向”。此外，还有短小，通俗易懂，演出灵活、简便等艺术表现上的特殊要求。\n\n三、演出形式上打破与观众之间的墙\n\n最能显示“广场戏剧”的特色的是它的演出形式。在这方面，抗战初期的演剧队有许多创造，即有街头剧、广场剧、茶馆剧、游行剧、活报剧、谐剧等。可以看出，“广场戏剧”最鲜明的特色是打破了舞台与观众之间的“墙”，使观众参与到戏剧中来，整个广场成了一个剧场，不仅演员与观众之间，连观众与观众之间，都产生了心灵的感应与情感的交流，广场的戏剧演出，就成了千万人的狂欢节-这正是戏剧的政治教化功能与宣泄功能的统一。\n\n四、话剧民族化\n\n这一时期“广场戏剧”实验的另一个方向是“话剧民族化”的尝试。面对文盲（半文盲）而又长期受到民族戏曲熏陶的观众，广场戏剧演出，就必然地要吸取锣鼓、杂耍、曲艺等民间艺术，以及民族的音乐曲调，像游行剧的大规模演出，更是要打破单一的话剧格局，而将歌、舞、说、演、唱熔为一炉。","keywords":"舞台观众演员的变化 写作、表现上的新要求 打破与观众之间的墙 话剧民族化","note":"抗战初期的戏剧总动员与全民总动员，使中国的话剧创作朝着广场戏剧的方向不断发展，而广场剧的特点便是平民化、大众化，所以这一时期的话剧在主题、内容、演出方式等方面都朝着这个角度靠拢，具体表现在演员观众互动增多、艺术表现更加通俗以及话剧民族化这些方面，同时为了适应时代需要而增强了政治功能，大家要注意。"},{"id":"267","stars":"★★","title":"《白毛女》的艺术成就有哪些","body":"一、《白毛女》是现代民族歌剧的奠基之作，是在民族文化传统基础上广泛吸取各种营养而建立起来的。\n\n新文学运动以来就陆续有一些作者创作现代歌剧。而在秧歌运动影响下创造的新歌剧，既融会了西洋歌剧的形式，特别是充分发挥了其善于抒情的特长，精心设计了一些脍炙人口的抒情唱段，极大地丰富了艺术表现力；同时又不拘于西洋歌剧只唱不说的框框，参照传统戏曲的手法，适当安排剧中人物的道白，使剧情进展更加明快晓畅，也更适合农民群众的欣赏。在创造性地吸取民族、民间音乐素材的同时，在歌剧音乐的戏剧性与性格化方面也做了大胆的尝试。这是既区别于中国古典戏曲，又区别于西洋歌剧，在民族文化传统基础上广泛吸取各种营养而建立起来的，综合戏剧、诗歌、音乐、舞蹈、美术为一体的音乐戏剧形式。\n\n二、对民间（农民）艺术资源的自觉借鉴、利用与改造。\n\n《白毛女》的意义，还在于它对民间（农民）艺术资源的自觉借鉴、利用与改造，全剧主题不仅具有强烈的革命意识形态性-把戏剧的主题提到社会制度的高度，完全纳入了“歌颂新政权”的时代主题；同时又坚持了“人的解放”的“五四”新文学的主题，纳入了现代文学传统；而这样的主题提升，并没有脱离“人鬼互变”的民间与传统文学的基本模式。\n\n除了总体的艺术构思之外，在具体的艺术处理上，《白毛女》也十分注意农民观众的欣赏趣味与习惯，注意从民间戏曲中吸取养料。同时，剧中又插入像“除夕过年”那样的充满生活情趣（包括诙谐趣味）的场景描写，表现了以家庭与邻里和\n\n谐关系为中心的民间日常生活的理想。并以喜儿与大春的“青梅竹马”的爱情故事作为情节发展的副线，并由此展现了“鸳鸯拆散”-“绝处不死”-“英雄还乡”-“相逢奇遇”-“善恶终有一报”等一系列情节线索，这都是农民观众所熟悉的，对他们是很有吸引力的。\n\n这就是说，在歌剧《白毛女》中是同时存在着政治的与民间的两种话语，它们之间的统一，使《白毛女》获得了成功，不但成为当时广大农村不可缺少的精神食粮，而且对中国老百姓始终具有吸引力。","keywords":"奠基之作 革命意识形态 民间艺术资源 两种话语","note":"《白毛女》所处的时代，要求它既要兼顾政治性也要兼顾民间性，而《白毛女》将二者完美融合，是中国现代歌剧艺术的奠基之作，在中国歌剧史上具有很重要的地位，在考查中也很可能出现，大家要有所了解。"},{"id":"268","stars":"★★★","title":"《白毛女》成功的因素","body":"【答题框架】\n\n《白毛女》是一部经久不衰的红色经典，它的轰动效果在中国戏剧史上是十分罕见的。它的成功，主要归功于以下因素：\n\n一、《白毛女》取得巨大成功的首要因素在于民间（农民）文化形态、西方民主和自由思想影响下的五四新文化精神和无产阶级革命文化理念三者的融合统一\n\n《白毛女》对中国传统民间文化资源进行了大胆的利用和有效的扬弃。《白毛女》的创作，经历了两个阶段。最初是一些受过五四新文化运动熏陶的剧作家们利用这个民间素材，创作出一个“以破除迷信，发动群众”为主题的剧本。后来，经过“鲁艺”师生的集体商讨和研究，由剧作家贺敬之、丁毅执笔，提升和凝练出了一个“旧社会把人变成鬼，新社会把鬼变成人”的革命主题。《白毛女》的创作过程，可以说是一个不断演变、改进和提升的过程。根据这一过程，可以发现，全剧主题不仅具有浓厚的革命话语和政治色彩-戏剧的主题提升到社会制度和人类解放的层面，完全顺应和符合“歌颂新政权”的时代主题，同时，也坚持了五四新文学以来“人的解放和自由”的主题，回归和融入现代文学思想传统。而这一主题的演变和提升，并没有脱离农民群众的欣赏趣味和思维习惯，不仅保存了“人鬼互变”的民间与传统文学的基本模式，同时也吸取了民间戏曲的艺术形式。\n\n二、《白毛女》取得巨大成功的第二个因素在于塑造了生动鲜明的农民形象\n\n杨白劳的命运是中国封建社会干百万被压迫、被剥削的劳动人民缺乏阶级觉悟，缺乏反抗精神的真实写照，也深刻反映了旧式中国农民在面对强大的封建势力时与生俱来的奴性思想和弱性格。青年农民王大春则是中国新型农民的典型代表。女主人公喜儿的塑造，在整部戏剧中是最为精彩夺目的。她的悲剧命运、性格转变、情感波澜、反抗精神在观众的心中引起了强烈的震撼和共鸣。\n\n三、《白毛女》取得巨大成功的第三个因素在于借鉴和融合了西洋歌剧、秧歌剧、民歌、中国传统戏曲等艺术精华，充分体现了解放区戏剧运动民族化、大众化的方向\n\n《白毛女》借鉴了西洋歌剧和我国秧歌剧的特点，以歌唱和音乐舞蹈来演绎故事，展现心理抒发感情；同时，它又不局限于西洋歌剧只唱不说的框套，继承和发展了中国传统戏曲的艺术手法，不仅有鲜明的人物形象，也有人物形象的道白、吟诵等。故事情节随着矛盾的集中和突出而环环相扣，跌宕起伏，更加适合中国老百姓的欣赏习惯和审美趣味。在歌剧的语言方面，《白毛女》的歌词大多是具有中国民歌风味的好诗。在歌剧的音乐处理上，结合西洋音乐加以改编民歌和地方戏曲，创造出具有中国作风和中国气派的民族乐曲。这种崭新的音乐语言，大大增强了歌剧的艺术表现力。\n\n总之，《白毛女》取得如此辉煌的成绩，对于我国现代民族歌剧的创建和发展具有重要的思想启示和艺术借鉴，促进了\n\n解放区新歌剧的繁荣，为中国五四以来的戏剧舞台添上了一笔亮丽多姿的风景，也对此后中国歌剧的发展产生了深远的影响和作用。","keywords":"民间（农民）文化形态 五四新文化精神 无产阶级革命文化理念 融合统一 生动鲜明的农民形象 借鉴和融合 民族化 大众化","note":"《白毛女》取得成功的原因，从具体来看，需要从创作理念、人物塑造和艺术技巧三个角度进行讨论。而从宏观角度来看，《白毛女》取得成功，主要得益于民间文化与精英文化的融合统一，外国戏剧艺术与中国传统戏剧艺术的融合统一。正是在这种兼收并蓄的情况下，才有了《白毛女》的成功，大家可以从这一角度去切入分析。"},{"id":"269","stars":"★★","title":"抗战时期历史剧创作繁荣的原因是什么","body":"一、民族主义情绪的高涨\n\n历史剧创作的兴起与繁荣，自然是与抗日战争中民族主义情绪的高涨直接相联系的。在上一个十年后期，随着抗日救亡运动的兴起，就曾出现过一个历史剧创作热潮，产生了《赛金花》《武则天》《石达开的末路》《金田村》等作品。抗战初期，剧作家在以主要精力从事现实题材的创作时，对历史题材仍然予以了热情的关注，《李秀成之死》《正气歌》等历史剧都起到了激发民族情绪的积极作用。抗战进入了相持阶段，“中国向何处去”成为全民族关注与探索的问题。围绕这一中心，出现了“重新认识与研究民族历史与文化”的文化思潮，形成了研究中国历史与哲学的热潮，并取得了突破性的成就。戏剧领域历史剧创作高潮正是在这样的思想文化背景下出现的。\n\n二、剧作家失去了公开抨击时弊的自由，只能采用历史题材借古讽今\n\n由于在国民党法西斯统治下，剧作家失去了公开抨击时弊的自由，只能采用历史题材，借古讽今，借古喻今。这就决定了这一时期历史剧创作强烈的现实的政治功利性的特点：引起剧作家创作冲动与兴趣，并成为观察与表现中心的，不是历史的“人”的思想、感情、心理，而是借历史的“人”来表现现实的“人”的思想、感情、心理，而且剧作家无论对历史的“人”还是现实的“人”的思想、感情、心理的发掘、表现，也是集中于政治意识，以及与政治密切相关的那部分道德、情操。\n\n剧作家立足于现实政治生活，选取与今人气质相通的历史人物，与今事精神相通的历史政治事件，作为创作题材；现实政治所提出的“坚持抗战，反对投降；坚持团结，反对分裂；坚持进步，反对倒退”的历史任务成为这一时期历史剧创作的总主题。\n\n历史上战国时代六国联合抗秦的斗争、明末清初汉族人民反抗满族入侵的斗争，以及太平天国内部分裂的历史教训，尤其引起了历史剧作者的强烈兴趣。\n\n三、观众空前热烈的欢迎\n\n这一时期政治在民族生活中占据着特殊重要地位，因此以强烈的时代性、现实针对性、高度政治化为其主要特征的历史剧，就受到同样高度政治化的观众空前热烈的欢迎，并且在艺术实践中逐渐形成了具有现代中国民族特点与时代特点的历史剧理论、剧作的特色与传统，在现当代戏剧史上产生了深远影响。","keywords":"民族主义情绪 借古讽今 强烈的现实的政治功利性 观众空前热烈的欢迎","note":"历史剧创作的繁荣，归根结底是时代的要求。无论是历史剧的形式，还是历史剧中表现出来的思想内容，都是顺应时代的结果。不过前者是国民党当局言论管控下的无奈选择，后者则是民族主义情绪的呼唤。当时复杂的历史环境，造就了历史剧的繁荣。"},{"id":"270","stars":"★★★","title":"夏衍的《法西斯细菌》有何艺术特色","body":"一、作品立意十分深刻\n\n夏衍的《法西斯细菌》堪称当时戏剧创作潮流的代表作。作品立意十分深刻-后来流行的、也为作者所追认的所谓“批判科学至上主义”主题说，至多只是剧本的浅层意义。而更接近作者创作初衷的应是：剧作家要把剧本的主人公写成“悲剧里的英雄”。这就是说，在剧作家看来，知识分子要求专心致志为全人类研究科学，原本是一个无可非议的正当的愿望，帮助知识分子实现这一愿望，正是“民主自由”的现代中国的历史责任与必要标志，然而，中外法西斯主义的存在，却扼杀了知识分子这一起码的善良美好的愿望，这才是真正的“悲剧”所在，这不仅是知识分子自身理想不能实现的悲剧，更是我们的时代、我们的民族不能保护自己民族的精英，给他们以起码的创造性劳动条件的悲剧，说到底，这是一个文明暂时无力战胜“愚蠢和野蛮”的悲剧。这样的开掘，就触及到了20世纪中国民族历史与民族文化（包括民族文学）的一个实质性问题。\n\n二、塑造的人物有丰厚、复杂的美\n\n剧本所描写的俞实夫，这个人物身上所表现出来的建设现代化国家的爱国主义理想，以及为实现理想的献身精神，坚忍、执著的性格，实事求是、脚踏实地的科学作风，宽容、谦和的气度，具有一种令人感佩而亲近的精神魅力，集中地体现了现代中国民族性格的内在的美。\n\n这个人物身上的弱点也是现代中国民族的，特别是他们中的知识分子的那不晓人世艰难的理想主义，那不通世故的天真，那股唐·吉诃德式的劲头，是让人既感动又不能不发笑的，笑完了还会涌上一点儿苦味儿。剧作家在普通知识分子的平凡人生中，从他们既常被忽视，更易被歪曲、误解的思想、性格中，发现了英雄主义的本质，作家笔下的这类英雄形象给予读者的美感不再具有单一性，是一种难以一言道尽的丰厚、复杂的美。\n\n三、艺术形式表现大胆\n\n剧作家在艺术表现上更是大胆的，这是夏衍继《上海屋檐下》之后又一次艺术的冒险：不是把时间、空间浓缩，而是着意地拉长、扩大，在五幕剧的有限容量内放下十年间的政治风云：从“九·一八”事变前夕，到“八一三”上海战争，从太平洋战争的爆发，到1942年春抗战转折关头；并且正面展现“东京-上海-香港-桂林”人生舞台与戏剧舞台的大转移。时间、空间跨度的扩大，表明了剧作家对开阔视野、表现大时代背景、“将抗战中各阶层人民的苦乐-泼在纸上”的史诗性的追求。\n\n四、艺术表现的简洁、含蓄与准确\n\n夏衍始终关注的，不是大的历史事件本身，而是社会历史大风暴所激起的人物情感的风暴，是受着历史发展的外在逻辑制约、影响的人物思想、感情、心理发展的内在逻辑。他所倾心的不仅是人物心理刻画的历史深度，而且还追求艺术表现的简洁、含蓄与准确。从《上海屋檐下》到《法西斯细菌》，剧作家夏衍既发展了“自己”，又保持了“自己”。","keywords":"立意深刻 丰厚、复杂的美 艺术形式表现大胆 简洁、含蓄与准确","note":"夏衍《法西斯细菌》表现的是知识分子中的英雄形象，和以往作品中的英雄形象有很大的不同。作品立意深刻，同时将作品中的英雄形象刻画的更加丰厚、复杂，在艺术形式和艺术表现上也做出了突破。大家可以从这个角度去切入理解这部作品。作为夏衍十分重要的一部作品，《法西斯细菌》很可能在名词解释中出现，大家要注意。"},{"id":"271","stars":"★★","title":"赖和为什么被称为“台湾新文学之父”","body":"一、赖和最早最有力地激发了台湾新文学的精神\n\n赖和最早最有力地激发了台湾新文学的精神，即以现实社会的批判和乡土文化的寻根为本，替本省乡土文学树起了第一面旗帜，并且决定了本省籍作家应走的方向。1926年元旦，赖和在《台湾民报》上发表了白话短篇小说《斗闹热》，这是台湾较早的白话小说，小说结构比较散漫稚拙，但对祭神风俗的质朴的描写中，可以感受到作家对乡土文化迷恋的深情。他开创了台湾新文学的一个传统：揭露现实，追寻乡土，认同祖国。台湾新文学作者中有许多都受过赖和的提携和指导，尽管有各自不同的风格，但都为赖和创作中所体现的真诚的人格和良知所折服。也许就精神魅力而言，赖和被称为“台湾的鲁迅”是不难理解的。\n\n二、赖和执著地坚持写作“以民众为对象”的作品\n\n赖和执著地坚持写作“以民众为对象”的作品，他的作品揭露批判殖民统治的不义，充溢着民族的忧愤。1932年初赖和所写的《丰作》和当时大陆上以《春蚕》（茅盾）为代表的写丰收成灾的风气不谋而合。小说真实地刻画了添福兄那种忠厚忍让的性格，在抗议殖民统治对贫农竭泽而渔的盘剥的同时，显然也思考国民性改造的问题，热切期盼农民的觉醒与反抗。\n\n三、不讲求技巧，但朴拙真诚，很有生活气息\n\n赖和的小说不讲求技巧，但朴拙真诚，很有生活气息。他有意在白话文中掺入许多本土方言，外省读者可能感觉拗口，但也能体味到那种浓烈的地域文化的新异性。赖和的作品不多，除上述数篇外，还有十多个短篇，却在台湾文坛赢得极高的声望，这主要靠的是他那坚实的面向民间的文学信念。\n\n四、赖和是台湾新诗的奠基者之一\n\n赖和又是台湾新诗的奠基者之一。他试图以诗歌来纪实和抒情，取材往往都是现实中发生的重大事件。赖和的诗比较粗犷，缺少艺术提炼，有时过于拘泥于事件的复写。他受革命思潮的洗礼，一生坚持正义，反抗殖民统治和独裁专制，屡遭迫害，在日据时期和光复后都曾被捕入狱，但始终以文学为改造社会之利器。","keywords":"激发了台湾新文学的精神 对乡土文化迷恋 以民众为对象 台湾的鲁迅 台湾新诗的奠基者","note":"赖和是台湾新文学之父，通过自身探索为台湾文学发展指明了方向，同时也是台湾新诗的奠基人之一，因此被称为“台湾的鲁迅”，在现代文学发展史上具有很重要的地位，大家需要有所了解。这道题也可以用来回答“为什么赖和被称为“台湾的鲁迅’”这样的题目。"},{"id":"272","stars":"★","title":"杨速的创作风格是怎样的","body":"如果说赖和揭示民间疾苦时多出于人道主义的同情，杨速则表现出了不一样的气质与精神追求。他的小说，主要具备如下特征：\n\n一、受到了当时左翼文学思潮的影响，注意从历史变革的层面表现无产者的命运和社会的变迁。\n\n杨逵注意从历史变革的层面谛视无产者的命运和社会的变迁。他的中篇小说《送报夫》叙写了一位流浪日本的台湾杨姓青年的痛苦遭遇。那不只是个人被老板欺榨的不幸，也是众多失业者的灾难：小说通过一个平凡的报夫的生活困境，写出了世界性的资本主义经济危机如何给社会带来灾祸。小说描写日本失业者和杨姓青年患难与共，他们发现无论对台湾人还是日本人，可恶的资本家都是“一样的畜生”“日本的劳力的人不会压迫台湾的人”。于是他们结成工人同盟，和老板斗争，终于争得了待遇的改善。这篇小说有明显的革命意味，力图将社会现象的刻写提高到历史变革的高度，显然受了当时左翼文学思潮的影响。\n\n二、隐晦的象征手法。\n\n为了避开日本殖民者的书报检查，杨逵有时采用比较隐晦的象征手法写作。发表于1942年的《泥人形》一篇，取材于当时作者自办“首阳农园”的日常生活，篇中人物即是家人，所写全是种地、接客、教子等琐事，用的是散文笔法，居家琐事中的所思所感又都寓意深远，启人深思。小说结尾，一场倾盆大雨将泥娃娃包括泥塑的坦克、大炮、军舰淋作一滩烂泥，暗示着日本帝国主义必然溃灭的命运。在当时，这象征性的描写成为一种历史的预言，读来让人感觉有一种凛然正气。\n\n三、具有浓重的意识形态意味，但视野广远，大气磅礴。\n\n杨逵关注现实，参与社会变革，思想开阔，性格豪爽，又受普罗文学思潮影响，其创作大都由现实直逼时代的思想制高点，虽然有浓重的意识形态意味，但视野广远，大气磅礴，有一种粗犷的力度。他的小说，艺术上不算完整，但很适合他所处的那个渴求反抗与解放的年代。","keywords":"历史变革 无产者的命运 左翼文学思潮 隐晦的象征手法 意识形态意味 大气磅礴","note":"杨速在1924年前往日本半工半读，就读于日本大学夜间部文学艺术科，正值日本劳工运动和学生运动蓬勃之时，并且杨速曾经参加反田中义一内阁的游行活动，这些经历明显影响到了杨逵的作品。同时影响到他作品的还有当时的高压环境。理解了这些，再认识杨速的作品创作特征就比较简单了。"},{"id":"273","stars":"★","title":"吴浊流小说创作特征是怎样的","body":"一、坚持现实主义，记录真实的历史\n\n台湾日据时期特殊的历史情状在许多现实主义作家笔下得到真实地展现，吴浊流是其中最出色的历史记录者之一，他的小说是具有社会性质的审美的概括。他的多数小说都写于1937年中国抗战爆发之后，也就是台湾殖民者推行“皇民化运动”，更加强化文化钳制政策之时。许多作家迫于政治高压，都不得不搁笔，但吴浊流却写下一篇篇嘲讽小说，以社会批判的笔触解剖众生相，刻写殖民者统治下被扭曲的社会心理。《先生妈》是其中最著名的一篇。小说用强烈对照的手法，赞扬了“先生妈”的民族气节，抨击了钱新发可鄙的奴才相，小说用的是嘲讽之笔，其中对“皇民化运动”的许多可笑场面的描写非常真实，等于为日本殖民者的丑行“立此存照”。\n\n吴浊流说，文学家的责任是为历史作证，其作品要“经得起历史批判，要对得起子孙”。吴浊流的小说是可以帮助人们了解历史的。\n\n二、对社会世相的分析有明显的立场与批判眼光\n\n从1943到1945年，吴浊流在日本警察严密监视之下冒着生命危险暗中写下《亚细亚孤儿》这部长篇。该小说称得上是日据时代台湾社会苦难历史的“镜子”，其焦虑夸张的心理情绪描写也反映了台湾知识者精神疏离的历程。整部小说以主人公曲折的生活经历为线索，依次在台湾、日本、大陆几方面展示战争期间的各种社会情状，登场的人物包括各行各业各阶层，网罗在一起，就是一幅畸形的殖民化社会的长幅画卷。这部小说在思恋乡土的情结上构架爱国反日的主题，但又不时流露出“异乡人”失根的痛楚。\n\n作者力图以历史的理智去控制那思恋与失望交织的乡愁，突出了小说的政治色彩。作者对社会世相的分析有明显的立场与批判眼光，虽然描写的不够细致，人物刻画也较为粗疏，但场面结构宏大，确实有史家叙写的襟怀，可以作为史诗来读。《亚细亚的孤儿》被普遍视为日据时期的现实主义代表性力作，并非偶然。\n\n当代文学史\n\n共和国文学发展脉络梳理\n\n李凡说：当代文学的发展脉络极具复杂性，远非短短数篇文字就可概括，很多考生在学完了当代文学后依旧是一头雾水，鉴于此，当代文学部分先给大家呈现脉络，大家在做题的时候，要先把当代文学的脉络篇熟读一遍。为方便大家阅读理解，现把此部分的导航目录展示如下，受限于篇幅，具体内容会以电子版的形式分享给大家，大家可以到李凡文学正版群中自行领取。\n\n第一节 解放区文艺规范在新中国的普及与强化\n\n一、第一次文代会和新中国文艺体制\n\n（一）第一次文代会-解放区文艺规范的中心化\n\n（二）新中国文艺体制\n\n1．作家身份的干部化\n\n2．组织机构与报刊的体制化\n\n二、系列性的文艺批判运动\n\n（一）1951年对电影《武训传》的讨论\n\n（二）1954年对俞平伯《红楼梦》研究的批判\n\n（三）1955年对胡风文艺思想的批判\n\n（四）1957年文艺界的“反右”运动\n\n（五）关于“十七年”时期文艺批判运动的反思\n\n三、活跃创作与批评的间断性文艺政策\n\n（一）“双百”方针\n\n（二）“文艺八条”\n\n四、文艺规范的强化\n\n（一）从“赵树理方向”到批评赵树理\n\n（二）“社会主义现实主义”和“两结合”\n\n（三）“写英雄”／“赶任务”／“三结合”\n\n第二节“文化大革命”文坛的倾斜和裂变\n\n一、“文化大革命”时期的主流文学\n\n（一）文艺界“文化大革命”的总纲领-《纪要》\n\n1．出笼过程\n\n2．主要内容\n\n（二）极“左”文艺规范\n\n1．“根本任务”论\n\n2．“三突出”创作原则\n\n（三）“样板”文艺\n\n二、“文化大革命”时期的地下文学\n\n（一）综述\n\n（二）关键
