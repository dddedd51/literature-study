《北流》的书写发现了另一个家乡，并重新构建家乡；其次，《北流》在结构上完全是生活流、是碎片化的结构，这符合生活的状态，表现了林白渐近晚年的文学观和新的文体意识。","keywords":"“女性神话谱系”“回忆”中“飞翔”散漫、灵动《北流》的文本实验","note":"林白1958生于广西北流市，和陈染一样都是90年代女性主义文学的代表作家，二者在创作上也有许多相似之处，大家可以将二者结合起来进行记忆。"},{"id":"439","stars":"★★★","title":"试论迟子建小说创作","body":"迟子建是当代著名的女作家，她的小说大多以东北农村小镇的乡土故人为追忆和书写的对象，用独特的体验构建出一个异彩纷呈的瑰丽世界，描绘一幅幅奇异的北国风情画卷。代表作有《北极村童话》《白雪的墓园》《树下》《原始风景》《晨钟响彻黄昏》《雾月牛栏》等。她宁静而又理性的创作态度在当代女性作家中极具个性，其小说创作有以下特征：\n\n一、小说创作的视角\n\n迟子建在小说叙事策略的选取与意义表达上采取了儿童或者少年的叙述角度，以此作为切入现实世界的依据，体现了她在一种纯真心理状态下对于生命的体认。同时，她又以女性特有的心智结构以及女性与生俱来的母性，通过对日常细碎事物的描摹，在对自然诗意生命本能的眷恋与追寻中，展现人物丰富而敏感的心理世界，从而使艺术视角穿越了历史，回归到心灵本真的境地。儿童视角作为一种叙述视角，在作家这里形成了特有的价值取向和审美风格，即使是一些与儿童生活无关的作品，迟子建也喜欢选择一些具有儿童气质的弱者或傻子的视角作为叙述角度，这些都使得作品充满一种浓郁的童话色彩与天真淳朴的气息。如获得鲁迅文学奖的小说《雾月牛栏》中的主人公痴呆儿宝坠，就是未长大的少年，其在文本叙事进程中与儿童视角有大致相同的功能。\n\n二、小说创作的风格\n\n迟子建的小说充满了地域色彩与自然之美。从迟子建的众多作品里我们都可以切身感受到那股东北人民所特有的精神气质，感受到古老黑土地上所散发出的芬芳。作家引领读者重返质朴丰润的大自然，面向自然、敞开心扉，在与自然的交流中获得宽厚的关爱，同时也体验到与自然共存的莫大喜悦，以乐观的态度对待这个美好的世界，以平和的心境去看待生死与功名。迟子建在对民间的持续关照中特别看重风俗和神话传说，在她的很多作品里都有对民间习俗的精彩描绘和对民间文化的真诚书写，她对它们有种特别的迷恋和信仰。在作品《白雪的墓园》中“我”与父亲的相见，那种感觉何等真切，“每到腊月二十七我们便到墓园请父亲回家过年，非常喜欢的父亲也会在家里通宵逗着小外孙玩，直到大年初三我们再把父亲送回去”。作家把失去亲人的悲痛化作另一种情感表达，在这里没有悲伤，没有泪水，有的只是脉脉温情的流注。那片黑土地上的人们在冰天雪地里寻找着生命的奇迹，丰富着自己的情感体认。大自然的精神启示着人的生命意识，这一切都在作家的作品里得到有力的彰显。\n\n三、小说创作的立场\n\n迟子建的小说创作坚持民间立场和女性立场，充满了底层关怀。她以一个纯真女子的目光去打量小说里女主人公的命运，&#x53BB;讲述那些令人心酸的故事，运用自己的一套话语系统和修辞策略，在单纯明快的童话情节中渗透出强烈的人文关怀。小说创作的立场在她的以女性为主人公的一些作品中表现得尤其明显。如《原始风景》里娇憨、任性的小姨在父母的宠爱下无忧无虑，自有一番别样的天真和质朴，但最终还是无法逃脱悲剧的宿命。她对生活在这个时代的小人物的生存之痛的关注，最终目的是想唤起人们重新审视和思考普通人生命存在的价值和意义。\n\n总之，迟子建的小说创作采取了儿童或者少年的叙述角度，充满了地域色彩与自然之美，坚持民间立场和女性立场，因而成为当代小说界一道亮丽的风景。","keywords":"宁静而又理性 儿童或者少年的叙述角度 地域色彩与自然之美 民间立场和女性立场 底层关怀","note":"对迟子建小说创作特色，我们主要从小说叙述视角、小说风格特色和小说创作立场三个角度去分析，作为一位女性作家，迟子建的小说当然也会表现出女性立场，所以她的小说很可能会和其他女性作家的小说放在一起进行比较，尤其是同为东北女性作家的萧红、梅娘等人，大家要注意一下。"},{"id":"440","stars":"★★★","title":"试分析迟子建《额尔古纳河右岸》的艺术特色","body":"迟子建的《额尔古纳河右岸》与其说是一部小说，毋宁说是一部记载鄂温克民族近百年来遭受苦难和文化变迁的宏大史诗，迟子建在字里行间袒露着对这个弱小民族的挚爱及对个体命运、族群命运的强烈关注。可以说，《额尔古纳河右岸》不仅是一部厚重的、洋溢着作家创造力和想象力的长篇，而且是一部兼具民族历史、民间立场与自然叙事的力作。这部作品的艺术特色，主要表现在以下方面：\n\n一、采用女性化的历史叙事，具有浓厚的历史意识\n\n在《额尔古纳河右岸》中，第一人称叙述者是一个鄂温克女人，小说借“我”的视角-鄂温克民族最后一位酋长的妻子讲述了一个民族近百年所经历的悠长而伤感的发展变化史，穿越的时间跨度则更加久远。透过叙述人的平静讲述，小说概括了几代人甚至一个民族的成长过程，使这部以迁徙漫游为主要情节的小说，具有了民族成长的意义。而在一个女人的讲述中，鄂温克人与异族的仇杀、猎人与狼的殊死搏斗、饥荒战争与政治斗争这些本应残酷的情节也变得悠远、悠然乃至优美了。\n\n《额尔古纳河右岸》虽然是一部女性书写和女性叙述的小说，但同样具有深厚的历史意识与历史精神。小说文本以真实而准确的时间叙述话语方式来标明历史的身份，从而构成作品饱含历史感的显形式。同时，作家在作品中对民族历史事件进行真实再现与重铸，并由此折射出民族历史情感。正是在这种客观再现与主观情感的交融叙述中，小说作品才显现出民族历史的忧怨、悲壮与作家尊重民族历史、珍爱兄弟民族历史的心态。\n\n二、采用民间视角，充分展示鄂温克族民间文化的丰富性、神秘性和多样性\n\n在《额尔古纳河右岸》里，迟子建以民间的内在形态与精神立场，书写了鄂温克民族近百年的历史，充分表现了作家对民间文化形态的亲和与认同。\n\n透过《额尔古纳河右岸》这部作品，作家主要以民间视角与世俗关怀来如实呈现鄂温克族普通人的日常生活状态。小说中描写的鄂温克人的生活片断，都是基于衣食住行、婚丧嫁娶等平常琐事，但这些日常生活却具有自身的独特性和浓郁的民族性。作家以朴素平实的写作姿态，营造出一个原色调、本真态的“民族民间”。\n\n迟子建在小说创作中还把民族民间文化作为自己灵魂的栖息地，并在其中感受着民间世界的丰富与博大。毋庸置疑，每个民族都有积淀在个体心灵底部的东西，那就是深层的民族文化心理结构，这种文化心理制约着族群的行为方式、生存方式、感受方式和思维方式。在《额尔古纳河右岸》里，作家就充分展示了鄂温克族民间文化的丰富性、神秘性和多样性。\n\n三、注重表现自然美，充分体现了鄂温克族崇尚“天人合一”的自然历史观\n\n鄂温克人被誉为“森林之子”，终年生活在原始森林里，因此，鄂温克民族的历史与大自然、大森林息息相关。在《额尔古纳河右岸》中，迟子建并没有因为鄂温克民族近百年历史的沉重与苦难而遗忘自然美、压抑自然美，相反，作家把鄂温克民族的历史叙事建立在对自然景物、季节变迁、民间风俗的详细描绘基础之上，充分体现了鄂温克民族崇尚“天人合一”的自然历史观。\n\n在《额尔古纳河右岸》里，大自然、大森林不仅是鄂温克人赖以生存和生活的主要载体，而且是他们生命的一部分，他们敬畏、尊重大自然，又亲近、怜惜大自然，与自然相互依存，你中有我，我中有你。对自然的尊重和亲近，在鄂温克人的世界里还表现在各种各样的民间风俗上。民间风俗昭示着自然万物的存在以及人与自然的和谐关系，是鄂温克人敬仰自然热爱生命的产物。","keywords":"女性化历史叙事 历史意识 民间视角 丰富性、神秘性和多样性 表现自然美“天人合一”的自然历史观","note":"近年来迟子建整体在考查中出现的频率明显有升高的趋势，并且一些学校在考查时也有追求热点的迹象，对于相关作家以及作品我们要注意多作准备。《额尔古纳河右岸》作为迟子建的代表作，前段时间又因董宇辉火了一把，所以部分学校可能会围绕这一热点出题。相关论文可以参考李红秀《论＜额尔古纳河右岸》》、周景雷《挽歌从历史密林中升起-读迟子建的＜额尔古纳河右岸》》，具体资料可以在李凡文学正版群中领取。"},{"id":"441","stars":"★★★","title":"谈谈你对铁凝小说女性主义叙事的认识","body":"铁凝的小说大都以女性为主人公。铁凝为读者塑造了现代中国女性的多种鲜活形象，为20世纪文学画廊留下了多彩的篇章。从《哦，香雪》《没有纽扣的红衬衫》到《麦秸垛》《棉花垛》《玫瑰门》和《大浴女》等，都贯穿着一个共同的主题：对女性体验、女性现代境遇的表达与质询。\n\n一、女性原欲心理的贲张，是“三垛”和《大浴女》的主要叙事动力\n\n这一主要叙事动力主要得益于铁凝对女性的审视和自觉：“我设想这大约归结于我本人在面对女性题材时一直力求摆脱纯粹女性的目光。我渴望获得一种双向视角或者叫做‘第三性’视角，这样的视角有助于我更准确地把握女性真实的生存境况。在中国，并非大多数女性都有解放自己的明确概念，真正奴役和压抑女性心灵的往往也不是男性，恰是女性自身。”\n\n二、对压榨、异化女性的男权文化的犀利解构，也是对女性文化的严厉自审以及强烈的女性生命欲望的张扬\n\n《玫瑰门》中司猗纹在命运戏弄、人生挫折、精神流浪中形成自虐与虐他的变态生活方式，她在家庭生活中虐待公公、窥探他人隐私和耗费自己的过程就是生命“如同浸润毒汁的罂粟花”，成为恶之花光影的过程。而外孙女苏眉预示着新的女性生长。小说对女人在文化环境中的命运的揭示蕴含在“玫瑰门”中。“玫瑰门”实际上是作为女性生殖产道的叙事意象（它与“垛”的意象相呼应），既意味女性强大的生命力，又表明其遭遇的无穷灾难，是对女性荣耀和苦难的深刻象征。这一切构成丰繁深厚的女性人文意蕴，标示了《玫瑰门》女性主义叙事的意义深度。\n\n三、女性自我命运心理的挖掘，披露人性中潜在的丑恶本质\n\n在写于世纪末的长篇《大浴女》中，铁凝站在理性哲学的高度，对女性的内心苦难进行拷问，披露人性中潜在的丑恶本质。作者撕破了人们的外在虚伪遮挡，让人物“赤裸”地互相观望与窥破，进而使女性的身与心、灵与肉、欲与理的撕扯和矛盾被裸现出来。\n\n小说讲述了尹小跳、唐菲、孟由由等人物，从“文革”到当下，在不同社会历史时期的女性情欲、心理受难、身心受戕害并寻找救赎的历史。几位女性中，唐菲塑造得最为典型，她凝结了女性在政治围困和经济围困中的种种苦难，尤其以在苦难洗浴中的人性扭曲和尊严丧失为主要叙写内容。尹小跳与已退休的副省长俞大声，在公园长椅上关于犹太人文化观念的对谈，显示了铁凝在女性探索路程上暖昧的表达。\n\n总之，铁凝总是在冷静的现实主义笔法的描述中，展现传统与现代、纯朴与世故、文明与野蛮、女性的自主与依附等种种矛盾，且这类女性的矛盾与困境往往与对社会文明进程的思考交织在一起。","keywords":"女性原欲心理的贲张 对男权文化的犀利解构 女性自我命运心理的挖掘","note":"值得注意的是，女性主义叙事实则是一个很宏大的话题，这个话题可以针对所有女性作家出题，故此之后会专门针对女性作家开设一个专题，帮助大家总结一下重要女性作家的创作特点。详情请关注李凡文学正版群。"},{"id":"442","stars":"★★★","title":"谈谈铁凝《哦，香雪》的艺术特色","body":"一、浓郁的抒情色彩\n\n铁凝的《哦，香雪》是一篇抒情意味浓厚的短篇小说，作品题目的感叹语调也提示和透露了这一点，但更重要的是时代思潮的影响，70年代末兴起的个性解放和主情主义思潮，使这一时期的小说出现了一种抒情化的倾向。\n\n小说以一个北方偏僻的小山村台儿沟为叙述和抒情背景，通过对香雪等一群乡村少女的心理活动的生动描摹，叙写了每天只停一分钟的火车给一向宁静的山村生活带来的波澜，并由此抒发了优美而内涵丰富的情感。小说的情节十分简单，而相对较多的景物描写和心理描写，使作品具有浓郁的抒情色彩。\n\n二、诗意的语言\n\n著名作家孙犁当年曾这样评价：“《哦，香雪》从头到尾都是诗，它是一泻千里的，始终一致的。”\n\n看开头这句：写大山的“温存和粗暴。”这句话把大山人格化来写，无疑给大山注进了血肉和情感。诗意的语言，使得山水万物都充满了感情，也增加了文章的抒情力度。\n\n再比如：“就因为台儿沟太小了，小得叫人心疼，就是钢筋铁骨的巨龙在它面前也不能昂首阔步，也不能不停下来”，还有描写火车发出沉重的叹息声，“像是在抱怨台儿沟的寒冷”，“古老的群山终于被感动得颤栗了，它发出宽亮低沉的回音，和她们共同欢呼着。”诗意的语言，让读者看到倔强的大山和生硬的火车，秋天的败草、黯然的树林还有默默流淌的小溪，都充满了温情和魅力，让人流连在美的意境中。\n\n三、性格鲜明的人物刻画\n\n小说的主人公香雪，是一个像白纸一样纯洁无瑕的青春少女，也是台儿沟唯一考上初中的孩子。作家主要从以下几个方面刻画香雪的形象：\n\n（一）纯真无邪，善良质朴：在火车上做买卖的香雪，在别人的眼里是这样的：“洁净得仿佛一分钟前才诞生的面孔”“柔软得宛若红缎子似的嘴唇”，使得人们“心中升起一种美好的感情”。\n\n（二）积极上进，向往未来：别的姑娘在火车上看到的是人家头上戴的“金圈圈”，香雪注意到的则是“皮书包”和“铅\n\n笔盒”；当别人换一些挂面、纱巾、发卡时，她会抓空儿问“北京的大学要不要台儿沟的人”和“什么是配乐诗朗诵”。显示出香雪与其她姑娘不同的精神追求，她向往的是通过知识改变命运。\n\n（三）维护尊严，勇敢坚强：&#x4ECE;前胆小怯懦的香雪，就连刚见到火车时都有些“恐惧”，而当她发现铅笔盒后，不假思索地“跑向火车”，然后勇敢地“站在火车上”，再后来，毅然在陌生的“西山口”下车，最后无所畏惧独自走了三十里夜路，因为在香雪的心里，得到了铅笔盒就是换回了自己的尊严和平等。换来铅笔盒的过程，也让她变成了一个勇敢、坚定、☒执着又顽强的小姑娘。\n\n☒四、类似于全知全能的叙述视角\n\n在小说的叙述结构上，作者并没有以情节线索来安排叙述，而是根据情感抒发的内在逻辑，把一些情节片段加以组接。她极力在“一分钟”里开掘，细致入微地描写了香雪们对新生活的纯真、热切的向往和追求；将一些每天一分钟里发生的事件以特定的方式加以精心的选择、排列和叙述，最后以香雪换铅笔盒的“冒险”为终结，尤其对香雪夜归的情景做了浓墨重彩的渲染，使情感的抒发达到高潮，就如一支优美动人的小夜曲。\n\n五、小故事背后的严峻思考\n\n小说的情感基调是清新、婉丽、优美、纯净的，但并不意味着纤弱、单薄和浅显，相反它寄寓了作者对时代现实的严峻思考：那纯朴的美是迷人的，但它恰恰又是与贫穷和闭塞联系在一起，在时代列车的呼啸声中，这种美还能保留多久呢？香雪和她的伙伴们，连同整个台儿沟，在走向新时代的路途中，将会经历怎样的变故呢？80年代是一个对“现代化”充满迷信的时代，一种新的二元对立的思维模式-现代化必然代表进步、文明和美好；反之，就是落后、封建和野蛮-正在逐渐形成并影响人们的思维方法，但敏锐的作家铁凝却对现代化（火车的象征）进入以前的人性淳朴的民间社会作出赞美，这种深远的意蕴，将会超越时空而发生永恒的魅力。","keywords":"抒情色彩 诗意的语言 性格鲜明的人物刻画 全知全能的叙述视角 严峻思考","note":"短篇小说《哦，香雪》是著名作家铁凝1982年发表的作品，全篇内容不足8000字。《哦，香雪》中虽然也表现出了对香雪这样的纯真少女的赞美，体现出一种女性主义叙事的特色，但里面更多寄予的是作者对“现代化”的一些思考。这种思考与当时的思想潮流相结合，使小说体现出了浓郁的抒情色彩。"},{"id":"443","stars":"★★★★","title":"请结合双雪涛等人作品，介绍新东北作家群（25吉林大学）","body":"【答题框架】\n\n“新东北作家群”，概指双雪涛、班宇、郑执等一批近年来出现的东北青年作家，称之为“群”，在于他们分享着近似的主题与风格。这具体表现在以下方面：\n\n一、主题：表现90年代东北“下岗潮”以及由此引发的工人阶级乡愁\n\n从创作主题上，“新东北作家群”回应了90年代东北“下岗潮”事件。国有体制改革，工厂倒闭，大批工人下岗，不☒仅给家庭经济带来致命一击，也使工人精神备受打击，被主流社会抛弃。这些都在双雪涛等人的作品中有所展现，如双雪涛《平原上的摩西》就以铁西区为背景，讲述二十世纪80年代、90年代和21世纪初的东北，以出租车谋杀案为核心，讲述了“下岗潮”背景下7个人物的经历和命运。\n\n不过，双雪涛、班宇、郑执的多部作品虽都以“下岗潮”为背景，却都不约而同地避免宏大主题，将关注点落在时代裹\n\n挟下个体生命的尊严，书写两代人的生存状态与精神困境，即消沉坠落的“父一辈”与创伤叛逆的“子一代”，以及那些“被侮辱与被损害”的边缘人物。某种程度上说，“新东北作家群”所体现的东北文艺不是地方文艺，而是隐藏在地方性怀旧中的普遍的工人阶级乡愁。\n\n二、叙事视角：以“子一代”的视角讲述父一代的故事\n\n从作品的叙事视角上看，“新东北作家群”大量从“子一代”视角出发，从父子关系入手，讲述父一代的故事，比如双雪涛的《大师》《无赖》《光明堂》《飞行家》、班宇的《逍遥游》《盘锦豹子》《肃杀》《空中道路》以及郑执的《仙症》。\n\n“子一代”曾置身于“下岗潮”中，他们笔下工人家庭的悲欢离合是东北命运的缩写，小说中“特定的父母”是一代工人阶级父辈的化身。他们作为经验主体书写父辈的下岗往事，自然比置身事外的文学创作者和批评家更加情真意切。作为与父辈关系最亲近的“子一代”，他们亲眼看见下岗给父辈带来的变化，和父辈如何艰难地应对生活的苦难，而这种坚韧的精神也使“子一代”敬仰。\n\n三、叙事手法：运用现代主义叙事技巧，显示出先锋性\n\n“新东北作家群”的小说虽以历史事件为背景，具有现实主义倾向，但在叙述上则脱离了传统工业小说的刻板形式，运用现代主义的叙事技巧建构小说。\n\n班宇在对话中就曾表示自己在创作小说的过程中，深受余华、格非、苏童等先锋作家的影响，双雪涛也曾在《我的师承》中说道自己被余华启迪，由此，“新东北作家群”在小说结构、叙事技巧、时间意识等方面展现出先锋性。\n\n这首先表现在通过多角度交叉叙述，利用设置章节和多个叙述视角的方式，将不同的时间段放置于同一文本。如双雪涛《平原上的摩西》就打破线性时间叙述，由七个人物以第一人称视角独立又相互纠缠的叙述，由此构成一个完整的故事。此外，他们还常采用镶嵌叙事，即“故事中套故事”的叙事嵌套结构，比较有代表性的就是双雪涛《北方化为乌有》。\n\n四、叙事语言：多用短语和东北日常口语，大量使用直接引语\n\n和以往“青春文学”常见的长句与陌生化比喻相比，“新东北作家群”的小说多用短句，充满着大量东北日常口语。而和以往的青春文学作家多用自由间接引语不同，“新东北作家群”作家大量使用直接引语。这里显然有两种文学观的差异：自由间接引语一定程度上让出叙述人的权威，从人物的视点引出人物的内心世界；直接引语不直接进入人物的内心世界，而是停留在人物的对话上。一个极端的例子是班宇的《双河》，小说第二节第一段“我”与关系暧昧的刘菲在菜市场相遇，这短短一段有26个“说”，通过“我说”与“刘菲说”，层层揭示出“我”与刘菲的互相试探。\n\n“新东北作家群”肩负青年作家的责任感，以“子一代”之文字为“失语”的父辈发声，书写被遮蔽、遗忘的历史，对东北文学乃至当代文学都具有深远意义。","keywords":"主题 下岗潮 工人阶级乡愁 叙事视角“子一代”的视角 父一代的故事 叙事手法 现代主义 先锋性 叙事语言 短语 东北日常口语 直接引语","note":"“新东北作家群”这一概念的提出与东北作家群类似，二者的主体都是东北作家，并且各自内部有着近似的风格和主题，而他们的形成，同样是受到了时代变动的影响。近年来，新东北作家群受到了注意越来越多，从考查的角度来看，不仅是东北地区的高校，像是北京大学、北京师范大学的考查中都出现了相关的题目，所以对于这部分内容我们要注意理解。相关内容可以参考黄平《“新东北作家群”论纲》、赵美《“新东北作家群”创作研究》，具体资料可以在李凡文学正版群中领取。"},{"id":"444","stars":"★★★","title":"试结合作品分析新时期以来城市文学的发展 【答题框架】","body":"城市小说走入创作的自觉是在80年代以来，80年代后期至90年代，是城市小说发展的高峰期。这一时期城市文学的发展状况，可以从以下方面进行讨论：\n\n一、新时期以来城市小说兴盛的原因\n\n（1）中国社会的结构变化为城市文学的发展提供了机遇\n\n改革开放使中国的政治、经济、文化等方面发生了深刻的变革，加速了中国现代化、城市化进程，城市在整个社会生活中越来越发挥着主导作用。随着中国乡镇向城市的过渡，农村人口向城市聚集，城市人口迅速增长，城市规模急剧扩张，加快了都市化的步伐，城市文学也随之勃兴，呈现出广阔的发展前景。\n\n（2）从文学自身发展规律来看，城市小说的形式也是文学积累的结果\n\n80年代初至80年代中期，是新时期文学多元化发展的兴盛期，以城市生活为表现对象的力作迭出，作家在对城市进行多层次的审美观照时，也在不断地寻找与之相适应的文学观念与文学样式。在这一文学积累过程中，逐渐强化了创作主体意识，打破了以往从政治、经济等社会关系层次来反映城市问题的创作套路，作家逐渐形成自觉或不那么自觉的城市意识，城市小说的审美取向，也逐渐集中到展示城市人的生存状态，描绘市井的风貌人情上，以此展开对历史与现实中的城市文化生态和心态的当代性思考。这种不断强化的城市意识，使城市小说创作逐渐形成了审美风格不同的作家群，也使城市小说的发展愈有其具体目标和追求，城市小说的总体形象开始在本时期文学中凸现出来。\n\n二、80年代初期至中期的城市小说\n\n（1）以表现历史悠久的城市为主\n\n从纵向角度来看，进入作家创作视野的城市，大都有着悠久的历史，从市井古镇到水陆商埠，从历史名城到现代都市，本身经历了一个相互关联、相互影响，不断扩大发展的递进过程，这既是一个城市生态和经济的发展过程，也是一个文化过程，保留着不同发展阶段的文化积淀，形成了具有历史沿袭性的城市生活传统和习俗，以及与此相协调的文化氛围。\n\n在城市进化过程中体现出的多种文化形态，为拥有不同文化背景和审美心理的作家提供了各自不同的创作空间，由此形成他们处理城市题材和主题的不同类型，并从创作的整体走向上反映出城市发展的历史沿革，记下了宏阔历史背景下世情民俗的流变。如邓友梅的《烟壶》和冯骥才的《阴阳八卦》等市井小说，起笔于清末，将主题置于种“历史化”的叙写之中，描摹了历史背景中的市井世相、民风遗俗，主要着眼于对传统文化形态的艺术表现上。叶兆言的“夜泊秦淮”系列，在辛亥革命以降的几十年的城市背景中，以文学的想象追溯和复原着城市的历史，刻画了民间市井社会中的各类市民形象，以及历史名城南京的生活图景。\n\n（2）显示出浓郁的地域文化色彩\n\n从横向的角度去观照城市小说，也有其特殊的意义。中国幅员辽阔，城市类型也多种多样，南方与北方，沿海与内地，文化型与经济型，大城市与中小城市之间，往往有着较大的差异，自然形成了城市间不同的文化个性和文化氛围。城市文化个性中，既有方言形式与地域风物、民俗习惯的区别，也有在当代各种经济文化力量冲击下产生的新的城市文化特点。特定的城市环境影响和塑造着城市人的文化心态和精神气质，形成了体现共性特征的市民文化形态，这就构成了地域文化格局中的城市文学类型，并对城市小说创作的不同文化意蕴和艺术风格产生潜移默化的影响。如写胡同四合院里世俗人生的京味小说在老北京人日常化人生享用中，展示出京城文化的魅力。又如冯骥才的《怪世奇谈》系列和林希的《“小的儿”》《高买》等作品，充分表现了旧天津卫世俗化的文化性格，勾画出津味小说的发展轮廓。\n\n三、80年代后期至90年代城市小说\n\n（1）小说题材进一步拓展\n\n城市小说的突起改变了过去以乡土文学为主体构架的文学创作格局，城市生活越来越成为作家创作的主要表现对象。城市文化的多元性、包容性和变异性，使得城市空间具有强烈的人文色彩及多种语境特质，城市在各种不同的经济和文化力量冲击下的变迁发展，以及城市环境所造就的各种复杂的人格类型，为城市小说创造了多样化审美的可能性和特殊性。\n\n不断变动中的城市现实为城市小说开辟了新的题材视域，过去一直被压抑的工商、金融、股市等主题，开始随着市场经济的勃兴和商品化进程的加快而越来越受到重视，出现了越来越多的写经商、炒股、兑汇的小说。城市人法律意识的提高，使司法刑侦题材成为热门。“打工族”成为作品中的主要形象，其中既有公司白领、银行职员、媒体记者，也有广告人、经纪人、音乐制作人、设计师等，还有现代城市中的弱势群体，如打工仔、下岗职工、保姆、盲流等。中产阶层构成了新的消费主体，股东、经理、歌星、影星、模特，成为小说中的一道风景。久被忽视的民间社会和市民文化传统得到关注，在作品中出现了个体老板、食客、寓公、小贩、黑道人物、坐台小姐等。\n\n（2）处理题材的角度发生了新变\n\n在城市意识的审美观照下，知识分子题材、女性题材、爱情题材，在题材的撷取和主题处理的角度上都迥异于过去，它首先面对的是人与城市环境交互作用下所产生的文学命题，要表达的是城市人的生存体验和精神感悟，对城市人生态和心态具有普遍的概括意义。如写女性，写爱情，在不同城市背景下的叙写有着明显差异，北京徐坤的《厨房》，挖掘的是爱在精神上的深层困境；而广州张欣的《爱又如何》强调的是爱所必须依存的物质基础，体现出城市环境对人的观念和行为方式的渗透和影响。在城市进程中所出现的新事物以及面临的新的社会矛盾和问题，如网络、媒体、环保、下岗再就业、社会腐败、第三者、家庭情感危机等等，都进入了作家的创作视野，可以说城市现实中所出现的一切新的社会现象和人物类型，几乎都被城市小说所覆盖，城市文化的多元性和城市生活的变动性，将会不断地为城市小说提供新的描写对象。\n\n（3）小说样式得到了突破\n\n90年代以来的城市小说发展，除题材开拓面的广度和深度外，另一显著特征是其在形式层面所进行的创新探索。城市小说在叙事技巧和语言上的新变，不单是形式的变化，也反映出作家知识结构和审美模式的变化。在不同的形式层面上，作家以不同的话语方式和不同的叙事技巧，进行着小说文体的创新，完成对既有小说模式的革新与突破，不但积极吸收借鉴西方现代的创作手法和技巧，使小说的样式更具实验性和前卫性，而且也注重对传统小说文体的创造，不断为其补充新质，以创新去丰富对题材的表现，体现了多样化的审美追求和创作风格。","keywords":"兴盛原因 社会结构变化 机遇 自身发展规律 文学积累80年代初期至中期 表现历史悠久的城市 地域文化色彩 80年代后期至90年代 题材进一步拓展 角度发生了新变 样式得到了突破","note":"从鲁迅开始，中国现当代小说就形成了一个表现农村、关注农民的小说创作传统，这在一定程度上与中国当时城市化水平不高，农民人口占据主体有关。不过，新时期以来，随着城市化的发展，城市人口逐年增加，而相应的，表现城市的小说创作也越来越多，并形成了一个引人注目的文学现象。在理解这部分内容时，可以联系一些比较有代表性的作家如邓友梅、冯骥才等加深印象。"},{"id":"445","stars":"★★★","title":"结合《保卫延安》《西线轶事》《亮剑》谈谈当代战争题材小说的发展演进","body":"【答题框架】\n\n战争题材小说是当代小说的重要类别之一，从对英雄的崇拜到客观评价英雄，从写英雄的行为到展示他们丰富的内心世界，当代战争题材小说经历了一个漫长的发展演变过程。总体来看，当代战争题材小说主要经历了以下发展阶段：\n\n一、十七年时期战争题材小说：类史诗战争叙事下的完美英雄\n\n十七年时期的战争题材小说具有鲜明的“类史诗性”，这首先是指作品的美学风格具有特别宏大和壮美的特点，注重宏大场景和英雄人物的刻画，叙述格局开阔恢弘；其次是指小说历史线索的系统性和大的时间跨度等特点。\n\n十七年战争题材小说的代表是《保卫延安》，其“类史诗性”首先表现在其类史诗的壮阔景观，小说以1947年3月至9月的延安保卫战这一著名战事中的青化砭伏击战、蟠龙镇攻坚战、长城线上的运动战和沙家店歼灭战等战斗为线索，正面构造了战争的宏大场景。众多的英雄人物，是《保卫延安》“类史诗性”的另一体现。从高级将领到基层指挥员、从普通战士到根据地的支前模范，小说都有涉猎。其中连长周大勇是小说叙事线索的核心，其次还有战士王老虎、马全有，旅长陈兴允，团参谋长卫毅，政工干部李诚等。这些人物基本上都是完美高大的，不存在“成长”的过程。\n\n二、新时期战争题材小说：战争描写社会化下平易朴实的“人化”英雄\n\n新时期以来，一大批新锐的战争题材小说作家走上文坛，以各自的创作实力和成就，打破了战争题材小说创作的局限，为其带来了一系列重要而深刻的变化。这其中十分重要的一个方面便是新英雄人物形象的塑造。与前30年战争题材小说中的理想浪漫式的“神化”英雄人物相比，新时期战争题材小说中的英雄人物则显得更为平易朴实，是“人化”的英雄。\n\n比如发表于1980年的《西线轶事》就塑造了战士刘毛妹这样一位崭新的英雄形象，并通过他将战争与广阔的社会生活联系起来，打破了以往单一描写战争的局限，实现了战争描写的社会化，这对后来军旅小说创作具有开创性的意义。与以往那些“高、大、全”式的英雄人物相比，作者笔下的英雄是一个深受“文革”戕害，性格变异，但内心世界却非常丰富复杂的青年。这一形象既揭示了十年浩劫给部队和军人造成的创伤，另一方面也更新了关于英雄和英雄主义的概念，为新军旅小说的形象塑造开辟了新途径。\n\n三、新世纪战争题材小说：人性化书写下的个性化英雄\n\n新世纪的战争题材小说更加注重人性表现，注重故事性和情节性。这一时期战争题材小说中的主人公有着以往英雄人物不曾有过的人情味、烟火气，草根性，又有着超越表象的坚毅、不屈和忠诚，他们不再是成为“人”的英雄，也不再是成&#x4E3A;“英雄”的人，而真正成为了他们自己。\n\n都梁的长篇小说《亮剑》的主人公李云龙就是一个一生都在血与火中搏斗的名将，重诺轻死、铁骨柔肠、豪气干云、肝胆照人。都梁自觉从“绿林”“侠义”等题材中吸收其粗野、活泼、洋溢着原始生命力的艺术营养，用以打破此前战争文化与政治伦理规范下的刻板英雄形象。","keywords":"十七年时期 类史诗战争叙事 类史诗的壮阔景观 众多的英雄人物 新时期 “人化”英雄 新世纪 个性化英雄 故事性和情节性","note":"在考查中，许多学校更多地倾向于纵向对文学史进行考查，比如从某一题材和类型入手，梳理这一题材在整体文学史上的流变。作答这类题目时，首先要对文学史有一个宏观的把握，对各个时期的文学创作特征要有所了解。此外，涉及具体的题材时，要注意积累一些比较重要的作品，从作品的角度进行分析会更轻松一些。如果报考院校考查类似题目比较多的话，要多留意一下过往真题。"},{"id":"446","stars":"★★★★","title":"20世纪小说中农民形象的流变（25华中师范大学）","body":"【答题框架】\n\n中国社会根深蒂固的乡土性表明农民阶层在历史文化中自始至终占据着主体位置，而农民作为一种具有丰富审美内涵的文学形象在文学文本的历史传承中则呈现出明显的分期特征。纵观中国现当代文学史，由于历史原因及诸多其他因素，农民形象众多，特色迥异，其具体流变，可分为如下阶段：\n\n一、20世纪20年代：“国民劣根性”统摄下的麻木的农民\n\n“五四”运动促进了知识分子现代意识的觉醒，使得他们开始重新审视乡土中国、审视乡土中国中一直占据主体位置的失语的农民阶层。与此同时，各种乡村农民运动不断兴起。在这种政治文化思潮的策引下，处于社会最底层的沉默的大多数-农民，他们的生存状态、人生命运、文化心理逐渐为中国社会所重视。\n\n这一时期的农民形象，以鲁迅笔下的阿Q等为典型代表。鲁迅用他哲人的敏锐的洞察力感觉到中华民族的痼疾-“国民的劣根性”。这种劣根性在农民身上得以最显著最顽强地体现。诸如麻木冷漠、迷信保守、目光短浅、因循守旧、固执狭隘、欺弱怕强、盲目自大等等，成为根深蒂固的“农民意识”。这一意识渗入民族灵魂，成为整个中华民族心理基础结构的一部分，似沉重的梦魇压在国人身上，阻碍着人民的觉醒，影响着历史的进程。\n\n这个时期，紧随鲁迅以启蒙者姿态及冷峻、清醒的现实主义态度写农民的作家还有蹇先艾、许钦文、许杰、彭家煌等。他们把笔伸向幅员广阔的乡村，刻画了各具特色的农民形象，描绘出具有不同地方色彩的乡村动乱、萧条、落后、愚昧的真切生活图景。\n\n二、20世纪30年代：在重压下仍保留着个人尊严与性格的农民\n\n20世纪30年代，整个中国社会思想文化愈益政治化。“五四”思想文化启蒙偏重个性，也就是注重个体生命自由的启蒙，但随着现实生存环境日益严酷，那种建立在个性自由基础上的文化启蒙便被更为急迫的民族生死存亡的现实需要所抑制。知识分子中一些人也逐渐开始反思“五四”，认识到脱离社会现实、空谈个性自由的虚妄，比如郭沫若由“为艺术而艺术”到倾向左翼文化立场的内心表白，就颇有代表性。而这一时期的农民形象，也同样发生了转变。\n\n这一时期的农民形象，以茅盾笔下《春蚕》中的农民形象和沈从文笔下的农民形象为典型代表。《春蚕》中的老通宝等农民，虽然仍旧迷信、愚昧，但却表现出了传统中国农民身上最令人感叹唏嘘的美好性格：勤劳、俭朴，对祖先创下的家业百般呵护和珍惜。至于沈从文笔下的农民形象，尤其是农村女性形象，如《边城》中的翠翠，《三三》中的三三等，都是那么温柔、美丽、晶莹剔透，闪烁出一种自然的纯美。\n\n可以说，这一时期的作家，在注意到农民身上的愚昧、落后的同时，也发现了他们身上的闪光点，并积极探索这些闪光点之于中国社会及其变革的重要意义。\n\n三、20世纪40年代：社会变革之中呈现出崭新面貌的农民\n\n从20世纪40年代开始，中国现代文学农民形象激烈嬗变，一大批簇新的农民形象走上并逐渐占领文坛，即所谓的“农村新人”。这些农村新人，又以赵树理笔下的小二黑、李有才等形象最为典型。这些农村新人形象身上已经不再具有愚昧、落后的标签，取而代之的是革命、进取等新的精神内涵。这些形象，可以说是十七年时期农民形象的先声。\n\n当然，这些作品中，除了农村新人形象之外，还有这二诸葛、何仙姑这样的旧式农民形象。但即使是这些旧式农民，他\n\n们身上的落后性，往往也不是愚昧、麻木，而是保守、迷信。可以说，这一时期的农民形象，整体都呈现出昂扬、向上的面貌。\n\n四、20世纪50-70年代：政治个性成长与符号化倾向明显的农民形象\n\n这一时期，中国农村先后经历了农业合作化运动、1958年掀起的“大跃进”以及人民公社化运动，面对现实的变化，一批作家以各种不同的心态投入创作，诞生了不少反映时代风貌的小说。历史事实已经证明，这时的农民们可以说开始明显地接受政治的影响，文学作品也表现出鲜明的政治倾向性，而相对的，对于人的个性与人文意识的表现，却显不足。从这一时期作品的总体风格而言，由于饱含着政治激情，所以变得明朗而单纯，作品的主人公似乎没有了自我的复杂意识和私心杂念，成为简单的政治图解。生命的灵动被外在的政策与观念融而为一。\n\n在20世纪50年代到70年代间，最有影响也最具有代表性的农民形象无疑是柳青《创业史》中的梁生宝。梁生宝固然是个社会主义新人，将中国农民的传统美德与共产党员的优秀品质很好地结合在一起，但他从件件小事中都能发现重大理论意义，实在有点人为拔高的意思。\n\n总之，可以说，这一时期农民形象的描绘逐渐呈现为公式化、概念化的倾向以至达到极致。这个阶段的农民形象不同程度地丧失了“农民”的内涵，是“农民”的失落。\n\n五、20世纪80-90年代：文化开放环境下多元化的农民形象塑造\n\n新时期文化开放带来了文学艺术的又一次繁荣，农民形象塑造在继承和发展现代文学开辟的基本类型的同时又出现了诸多新质。农民形象体系日趋驳杂丰富，各自蕴涵着独特的审美价值与文化特质。可以说，这一时期的农民形象塑造正在朝着多元化的方向进一步发展，总体来说，可以分为以下几种类型：\n\n（一）文化表征型\n\n新时期作家面对传统文化这个巨大的空间量时表现出非常复杂的态度。他们热衷于对传统文化内涵的清理与整合，但各自审美立场的差异还是比较明显的，有的承继“五四”鲁迅开创的劣根性文化批判传统，以冷峻的审视目光和锋利的手术刀来解剖中国传统文化深处的肿瘤，希望仍然是“引起疗救的注意”。有的则在传统文化的深谷面前止步流连，尽管他们亦发现了其中的负面因素，但当下现实的破碎状态迫使他们藏匿起批判的欲望，转而为传统文化唱起了动人心弦的挽歌。反映在小说中，作为乡土中国主体形象的农民自然成为作家们书写的理想对象，因为农民在中国传统政治文化结构中所处的中心位置表明农民是中国传统文化人格的集中体现之一，农民的精神、性格及其行为方式是传统文化潜移默化于乡土中国大地上的缩影。这样一来，作家文化批判的诉求使得农民形象自身成为传统文化的一种表征。根据作家各自审美立场的差异及侧重点，文化表征型的农民形象分为两个层面：痼疾型文化农民形象与理想型（或称之为挽歌型）文化农民形象。\n\n（1）痼疾型文化农民形象。这是对“五四”时期鲁迅国民性改造（实际上主要是农民性批判）主题的继承。他们处于文化愚昧状态，自私保守、缺乏独立的人格意识、过度依赖于政治权力等等意识形态，他们对于自身的生存困境缺乏清醒的自我认知意愿与能力，抱着一种卑怯苟活的心态。这样的人物以李顺大（《李顺大造屋》）、陈奂生（陈奂生系列）、许茂（《许茂和他的女儿们》）、丙崽（《爸爸爸》）等为代表。\n\n（2）理想型（挽歌型）文化农民。作家理性审视文化传统范畴，并以文学形象的形式予以浓缩其某方面的精神内涵，其目的是要干预现实，应和传统文化现代化转化的重大命题。表现在小说文本中有肖疙瘩（《树王》）、郑麦生与张树声（《乡村情感》）等。理想型文化农民是作家某种文化理念的具象表达，他们大多坚守自己的文化立场（无论是自觉还是不自觉的，从根本上说都是作家赋予的），通过各种特异的不合时宜的方式顽强实践着这种文化理想。郑麦生与张树声在时代的变迁中依然共同维系着深沉的朴素的乡村情感，这种情感实际上是传统文化中仁义理念的体现。\n\n（二）现实变革型\n\n新时期中国社会正处于由农业社会向工业社会乃至后工业社会过渡的剧烈转型期，传统的乡村世界自身亦经历着这种时代文化变革的阵痛。当现代性全面介入乡村社会，并最终以主流意识形态的面目获得合法合理的强势地位时，传统文化视野中的农民文化心理及其行为选择上产生出了种种复杂焦虑的变革迹象，主要体现为离土与守土的矛盾。在离土与守土的矛盾中大致催生出两种形象系列：离土者与守土者。\n\n（1）离土者\n\n离土者多具有开放的文化心态，面对现代工业文明不可阻挡的前进趋势选择了积极的应和姿态。这种农民形象也是80年代以来作家们致力营构的主要人物形象，但是这种离土的大胆行为注定是违背了乡村固有的生存原则，受到了各种因素的影响，包括浓厚的乡村文化心理意识、混沌的工业文明以及他们自身所无法逃避的性格缺陷等等。人物包括田保根（《苍生》）、\n\n王才（《腊月·正月》）、禾禾（《鸡窝洼人家》）、高加林（《人生》）、孙少安（《平凡的世界》）等等。\n\n（2）守土者\n\n守土者们拥有传统乡村道德精神与文化伦理的支持而理所当然地固守在乡村。他们反对离土者对乡土社会的背弃，恐惧、淡漠乃至拒绝现代性对于乡村传统文化精神的介入与改造。但在乡村改革浪潮汹涌而来的必然趋势面前，他们对于土地的坚守显得保守狭隘，只能承担无可奈何的悲剧角色。其中一部分守土者在经济现代性逐步改变乡村贫困面貌与农民生存困境的利益诱惑下，也逐步变更自我的文化守旧心理，开始接纳新鲜的现代性事物。\n\n高晓声的《荒池岸边柳枝青》中的守土农民面对着大片废弃的鱼塘，信守着种田保险的想法，谁也不愿意承包，只是用“拈阄”这种碰碰运气的方法决定自己的命运。贾平凹《远山野情》中的跛子、《小月前本》中的才才都认为农民就应当是遍身土气、粗茶淡饭、破衣蔽体，对于土地以外的事物普遍抱着不信任或鄙弃的姿态。\n\n（三）民间生存型\n\n80年代以来小说中余占鳌与戴凤莲（《红高粱家族》）、菊豆（《伏羲伏羲》）、先爷（《年月日》）、上官鲁氏（《丰乳肥臀》）等等农民形象群体的确体现出一种民间“自由一自在”的审美特征，所以将其概括为“民间生存型”农民。\n\n（1）民间生存型农民秉持朴素坚韧的乡村文化精神，以自由自在的乡村文化心态对抗意识形态同化改造乡村的企图。&#x8FD9;种文化对抗的对象主要表现在两个方面：\n\n①传统伦理道德对于自然人性的束缚与戕害\n\n在中国乡村社会的基层，伦理道德更多是以“小传统”的形式沉淀于农民日常生活的方方面面，这种无形的历史传承规束着乡村社会的进程与农民的生存思维。民间生存型则以叛逆行为对抗传统伦理道德的规束与制约，其中为作家叙述得最为频繁的莫过于农民独特的情爱观念。《红高粱家族》中余、戴二人的情爱观念早已摆脱了正统道德范畴，折射出浓郁的生命欲望与性爱意识。《乡村温柔》中牟葛彰对自我一生浪漫温柔情事的自得叙述，不禁使人惊叹于农民文化心态的自由开放。\n\n②革命、工业化等等现代性范畴介入并击碎了平静稳定的乡村结构。农民无法理解革命，普遍表现出了对于革命的排斥与消解。三姓村人、沂蒙山区人、矮人坪人、五人坪人、受活人等等一个个乡村农民群落的存在彰显出民间生存型“自由一自在”的审美特征。\n\n（2）民间生存型农民身上还呈现出一种自觉承担苦难的生命强力意识。从经验层面上看，民间立场写作中农民所承担的苦难形式是多种多样的。站在民间立场的写作，农民面对苦难表现出自觉承担、绝望抗争的决绝姿态。它的特殊之处在于“自觉”，它不依赖任何外来力量的启蒙指引，它赖以抗争的资源是朴素的乡村生命伦理与法则。《红高粱》中以余占鳌为首的农民反抗源自自由生存的渴欲与乡村文化伦理的坚持，并未出现既往历史叙述中所出现的革命启蒙引导一新人成长一革命英雄的惯常模式，这是乡村世界面对外来恶势力介入时因苦难与生存的矛盾而滋生的本能抗争力。民间生存型农民以民间生存的独特方式在传统乡村与外来介入者或说异己者的冲突碰撞中坚韧地固守，并彰显着自足自立的乡村民间生存原则。","keywords":"20世纪20年代 国民劣根性 麻木的农民20世纪30年代 重压下保留着个人尊严与性格20世纪40年代崭新面貌20世纪50-70年代 政治个性成长 符号化倾向明显20世纪80-90年代 多元化 文化表征型 痼疾型 理想型（挽歌型）现实变革型 离土者 守土者 民间生存型 乡村文化精神 自觉承担苦难 生命强力意识","note":"自鲁迅开始，中国就形成了一个乡土小说传统，农村和农民一直都是作家所表现的重点。不过，随着社会思潮的变动，不同时期的农民呈现出了不同的面貌，而新时期以来，随着文学的再一次繁荣，作家们审视农民的角度更加多样，笔下的农民形象也更加多元。大家在理解这一部分内容时，可以结合各个时期的代表作家作品，加深一下印象。相关内容可以参考施学云《论20世纪80年代以来小说中的农民形象及其文化内涵》、徐晶晶《论当代农民题材小说及农民形象演变》、肖佩华《中国现当代文学农民形象流变轨迹》，具体论文可以在李凡文学正版群中领取。"},{"id":"447","stars":"★★★","title":"谈谈你对90年代诗歌的认识","body":"进入90年代，新诗热潮减退，诗歌的受众队伍逐渐缩小，诗人的地位受到前所未有的挑战。但是，诗歌并未如某些评论家所预言的那样已经“死亡”，随着生存环境和艺术风尚的改变，新诗在90年代也悄悄地发生了转型，并在艺术探索上取得了某些进展。\n\n一、90年代诗人构成\n\n从诗人队伍的构成看，老、中、青三代诗人从各自不同的角度展开诗艺探索，艺术上的分野在90年代变得越来越明显。\n\n（一）老一代诗人大多延续着过去年代的诗歌观念，其艺术手法、审美取向大多能从他们过去的创作中找到明显的演变\n\n轨迹，体现着具有历史意义的发展。\n\n（二）90年代具有实力的青年诗人大多与80年代的先锋诗歌有关，他们中相当一部分是80年代中后期的第三代诗人。&#x8FD9;批诗人是80年代以来继艾青等第一代诗人、舒婷等第二代诗人之后的又一代诗人，因此被称为第三代诗人。90年代还出现了一批更年轻的诗人，大多出生于70年代，在他们身上，个人化追求更加明显。他们的艺术探索不对历史与现实负责，也不对既有的诗歌艺术规律负责，只是对他们自己所认识的诗歌负责。他们大多向传统的诗歌观念提出了挑战，不少人的作品具有明显的后现代特征：消解传统与崇高，追求世俗性、琐屑性，历史反思功能大大减小。伊沙、沈浩波、尹丽川等人的诗歌实验就引起了诗歌界的诸多争鸣。\n\n（三）女性诗歌和网络诗歌在90年代也较引人注目。女性诗人是90年代诗坛上的活跃分子。除了大量写作的性别特征并不明显的女诗人外，不少诗人在女权主义思潮的影响下，从不同角度张扬女性意识，对女性的生命、生活、追求进行了多方面的思考。\n\n网络诗歌是90年代中后期诗坛上出现的新现象。它主要利用互联网作为平台，国内著名的诗歌网站包括灵石岛、界限、扬子鳄、诗歌报、诗江湖、诗生活等。许多诗歌刊物也设立了专门的网站。网络诗歌主要包括三种类型，一是把已经发表的诗歌作品张贴到网络上；二是在网络上首发的诗，不少诗作者把自己创作的作品通过网络发表，并进行讨论，这种诗与平面媒体诗歌没有多少区别；三是利用高科技手段创作的只能在网络上发表和阅读的诗，比如多媒体诗等。与一般诗歌相比，网络诗歌打破了诸多交流上的限制，具有虚拟性、自由性、民间性、交互性，增加了诗歌的传播方式，是传统媒介的有益补充。\n\n二、90年代诗歌观念\n\n我们不能忽视90年代诗歌存在的困境与问题。在80年代曾极力推举以朦胧诗为代表的新潮诗的诗论家孙绍振，对90年代后新潮诗进行了尖锐批评：“总的来说，自从所谓后新潮诗产生以来，虽然也有新探索，但是，所造成的混乱，似乎比取得的成绩更为突出，新诗的水平并没有全面的提高。”有的论者还对私人化写作、解构崇高等现象提出了批评。\n\n（一）90年代诗歌观念复杂的原因\n\n90年代的诗歌观念是复杂的，这与外在的自由空气有关，也与人们对诗歌的理解有关。过去的一些诗歌观念仍然被许多诗人所接受和延续，比如群体本位观念、诗与现实的关系、诗与诗人的关系、诗歌的艺术功用等，但这些受到一些青年诗人的质疑与挑战，从而导致了诗歌观念的更替与新变。\n\n（二）90年代诗歌主题\n\n青年诗人是90年代诗坛上最为活跃的部分。迷茫与困惑是90年代诗歌艺术探索中最主要的人文主题。颠覆与解构，曾是这个时代文化的关键词。以个人为中心的个人化写作是90年代青年诗人艺术探索的中心话题。\n\n个人化写作与人的观念的变化密切相关。过去的诗歌所表现的人主要是社会、文化、历史中的人，是在一定的道德规范约束中的人，因而，过去的诗比较注重以群体为本位，在对群体的关怀中寻找人的位置与价值，理想与崇高是许多诗人所追求的境界。而在90年代，由于文化转型的影响，不少诗人对人的理解发生了很大变化，他们更看重人的个人性因素，而对人的文化属性、社会属性关注较少。在张扬生命意识的同时，淡化甚至忽略了诗的使命意识，出现了琐屑化、庸俗化的弊端。在一些诗人的作品中，反崇高、反理想的倾向非常明显。\n\n（三）“他们”和“倾向”\n\n在90年代诗人群体中，“他们”诗人群、“倾向”诗人群因为与80年代的艺术联系和独特的诗歌主张而受到了较多关注，也引起了诗学界的论争。《他们》是1985年创办于南京的一份综合性民间刊物，主要发表诗歌作品，1995年出版9期后停刊。关注日常生活和追求口语化是“他们”的共同特点。《他们》是连接八九十年代诗歌艺术的重要阵地之一，其口语化实验对90年代诗歌的发展产生了重要影响。\n\n另一个影响较大的民间刊物是《倾向》。《倾向》于1988年9月创办于上海。《倾向》创刊号提出了“知识分子写作”的主张，1991年第3期“编者前记”明确指出：“《倾向》关注理想的诗歌，提供秩序或尺度，它要把一只坛子放在田纳西-它使凌乱的荒野围着山峰排列。”这种对秩序与责任的追求，与追求自由性和民间性的诗歌思潮形成了差异。《倾向》的作者很广，但大多来自学院，他们尤其对西方诗歌具有较深的了解。他们的诗试图从历史、哲学的角度关注生命的现状与出路，充满忧患意识。王家新说：“只有从文学中才能产生文学，从诗中才能产生诗。”\n\n三、知识分子写作与民间写作\n\n在90年代的诗坛上，由于学术风气比较民主，经常出现不同诗歌观念之间的论争。知识分子写作与民间写作的论争就引起了诗坛的广泛关注。《北京文学》等报刊连续发表了相关的论争文章，集中展示了这场论争中的主要观点。\n\n（一）知识分子写作\n\n知识分子写作的代表诗人主要有西川、王家新、欧阳江河、陈东东、臧棣、张曙光等，臧棣又是知识分子写作的诗论家。他们在诗歌创作中既追求独立的诗歌精神，又重视知识的作用，具有比较广阔的艺术视野，大多受到西方哲学、文化、诗歌观念的影响。\n\n（二）民间写作\n\n民间写作是由80年代后期口语化思潮延续下来的一种艺术追求。民间写作有较多的作者群，他们主张关注日常生活，向民间采集素材和语言，坚持诗的个人性，反对中国诗的西化。他们在艺术上追求自由，不太讲究诗歌的艺术法度，在诗体探索上没有固定的规范，在美学取向上没有一致的目标。有些作品显得非常个人化、私密化，虽然体现了诗人的艺术机智，但没有宏大的叙述，对历史与现实大多只切取片段加以打量。民间写作明显受到解构主义思潮的影响。民间写作发展到极端就是所谓“下半身”写作。“下半身”写作是个人化写作的极端化发展，“标志着营造诗意时代的终结”。\n\n民间写作与知识分子写作的论争提出了新诗发展中一些较重要的话题，但显露出来的浮躁情绪与非学术倾向也引起了诗坛的注意。","keywords":"老、中、青三代 女性诗歌 网络诗歌 迷茫与困惑 个人化写作“他们”诗人群“倾向”诗人群 知识分子写作 民间写作","note":"虽然进入90年代，诗歌的创作热潮开始减退，但诗歌创作并没有完全沉寂，从诗人角度来看，仍有新鲜血液涌入，老诗人也并未消失，诗歌创作观念也在不断地更新，一些新的诗歌现象也涌现了出来。这部分内容中涉及的一些文学团体如“他们”诗人群、文学现象如个人化写作都是名词解释中很可能出现的内容，大家要重点留意一下。"},{"id":"448","stars":"★","title":"有学者认为21世纪诗歌是20世纪90年代诗歌的延续，请谈谈你的看法","body":"21世纪诗歌仍处于朦胧、易变、繁杂的现在进行时状态，菁芜夹杂，“鲜花”与“野草”并生，但其不同于以往的精神和艺术个性已经形成，并且越来越清晰，所以其并不是20世纪90年代诗歌的延续。具体来说，表现在以下方面：\n\n一、诗人们学会了承担，使写作伦理在诗歌中大面积地得以复苏。新世纪诗人经历了SARS、海啸、雪灾、地震、奥运、&#x5171;和国六十年华诞等一系列大悲大喜的事件之后，更懂得了承担的涵义，愈加注重从日常生存处境和经验中攫取诗情，最大限度地寻找诗歌与当代生活之间的对话、联系。其中对城乡底层的持续关注，非但恢复了人的真实生存镜像，充溢着人道之光，有时甚至具有针砭时弊的社会功能。\n\n二、诗作处理生活的艺术能力普遍有所提高。新世纪的诗人们应和题旨和情感的呼唤，都比较注意各个艺术环节的打造，在表达策略上注重生活经验向诗性经验的转化。其向度是多元的，主要表现在以下几个方面。\n\n首先是依然在意象、象征的路上出新。其次是为了增加表现力适度向其他文类扩张的文体互渗。诗人们自觉挖掘和释放细节、过程等叙述性文学因素的能量，把叙述作为改变诗和世界关系的基本手段，以缓解诗歌内敛积聚的压力。再次是大量去除晦涩朦胧后的朴素的文本姿态，有力地契合、贴近着表现对象。这既指诗中的物象、事态和情境饱蕴人间烟火之气，也指语言上的朴实无华，向清新自然“天籁”境界趋附。\n\n三、实现了诗的自由本质，使个人化写作精神落到了实处。诗的别名是自由，它的最佳状态应该在心灵、技法与语言上都不受任何外在因素的羁绊。新世纪诗坛众语喧哗，人气旺盛，在一定程度上抵达了这一理想境地。心理的、历史的、社会的、审美的、哲学的、感觉的、想象的、现实的等每一种向度，都获得了自由的生长空间；“40后”“50后”“60后”“70后”“80后”“90后”，每一代诗人都在各自的位置上施展功夫，谁也不挡谁的路；官办刊物、民办刊物和网刊各司其职，几个阵地、渠道间彼此应和解构着写作的话语霸权；地方诗歌多点开花，和上世纪八九十年代诗歌大体只有南北之分、各省意识尚未苏醒相比，而今四川、江苏、湖北、安徽、山东、广东、甘肃、海南等，都渐次亮出旗帜，各地区间“呼朋引伴”，对峙而又互补。诗学风格、创作主体、生长媒体与地域色彩等纷呈的镜像聚合，异质同构，“和平共处”，形成了诗坛生态平衡的良好格局，人气、氛围俱佳。特别是引渡出一批才华、功力兼得的诗人和形质双佳的优卓文本，以抒情个体的绚丽与丰富，创造了一种个人化精神高扬的文学奇观。可以毫不夸张地说，每一位诗人都在寻找着自己个性的“太阳”。\n\n综上所述，21世纪诗歌并不是20世纪90年代诗歌的延续，虽然距离真正崛起仍旧任重而道远，但确实是充满希望。","keywords":"写作伦理复苏 艺术能力普遍提高 意象、象征出新 文体互渗 朴素的文本姿态 个人化写作精神","note":"相较于90年代诗歌对80年代诗歌的破旧立新，新世纪以来诗歌创作的创新并不是十分明显，也无法彻底改变诗歌渐趋边缘化的形势。不过，相较于90年代的诗歌，21世纪的诗歌的确有新质在逐渐形成，与90年代的诗歌还是有很大** --- 区别的，二者并不能简单地混为一谈，因此，并不能武断地认为21世纪诗歌是20世纪90年代诗歌的延续。"},{"id":"449","stars":"★★★★","title":"试述新时期至今中国新诗“叙事性”（25南开大学）","body":"新时期以来的中国诗歌，经历了从抒情传统到叙事转向的复杂演变。这一过程不仅反映了诗歌美学的自我更新，也折射出社会转型期中诗人对现实、历史与个体经验的重新审视。从“归来者”诗人的理性抒情到“第三代”的反叛实验，再到90年代“叙事性”的成熟与新世纪的多元狂欢，诗歌的叙事维度逐渐从边缘走向中心，成为当代诗歌的重要话语方式。这一脉络的梳理，不仅有助于理解诗歌内部的技艺变革，更能窥见时代精神与诗人主体性之间的深刻互动。\n\n一、新时期初期（1976-1989)：偶现的叙事火花\n\n新时期伊始，整个诗坛沉浸在对“文革”梦魇的控诉与清算以及美好未来的理想主义憧憬之中，对于诗歌技艺的斟酌则接续了现代主义诗歌流脉，呈现理性化抒情的特征。但是，仔细地品读和斟鉴，我们还是可以在经历抒情的汪洋大海潮涌冲刷的银沙滩上拾得叙事的珍贝。\n\n（一）“归来者”中的叙事\n\n“归来者”诗人牛汉的诗一直包蕴着井喷式的情感，在“归来”之后的诗作中，也一如既往地实践着胡风倡导的“主观突入客观”的美学原则，但同牛汉年轻时代的作品相比较，“归来”之后的诗作则显得语调更为平和、情绪也内敛了许多，在渲染主观情绪之外也注重对“客观对应物”的直陈叙说。如《悼念一棵枫树》在平实厚重的陈述性语句中感慨历史理性对个体价值的摧残。不过，在牛汉的诗中，“叙事”只是托物言志、以物抒情的一个手段，而这一创作路子在牛汉“归来”后的诗作中随处可见，如《蚯蚓的血》《羽毛》《海上蝴蝶》《一圈带血的年轮》等作品。\n\n穆旦是“归来者”诗人中一个独特的存在。作为“九叶诗人”中的一员，穆旦的诗偏于知性内敛、节制情感的路子。他所倡导的“新的抒情”，就是将机智同情感相结合的抒情方式，是“忠实于生活”的不断丰富与拓展。穆旦晚年创作的《春》《夏》《秋》《冬》等诗作，也都延续了诗人“新的抒情”的美学主张，只是情绪更加深沉、手法愈发纯熟。不过，除了“新抒情”演绎，穆旦进一步深化了戏剧化视角与戏剧性情境设置的表现手法，在诗作中插入具体的生活场景加强了细部的真实感，体现出某些“叙事性”的特质。在《停电之后》《听说我老了》《友谊》《冥想》等诗作中，穆旦很好地将“叙”与“情”结合起来，先预设一个情境或事件，然后代入情绪与想象的内空间。\n\n（二）“朦胧诗”中的“叙事”\n\n朦胧诗人善于运用意象叠加的方法入诗，意象间往往不作任何停留，罗振亚先生将其概括为“蒙太奇意象组合的结构呈现”。这种写法使得朦胧诗人的意象呈现与散播方式，是以多个具有直观性物质形态的事象链接为媒介的，中间没有逻辑或情绪的直接连结，这一意象铺排的过程也体现出某种“叙事”的倾向。这一手法广泛地存在于朦胧诗中，如顾城的《弧线》、江河的《让我们一块儿走吧》、舒婷的《群雕》、北岛的《结局或开始》《东方的想象》等。除此之外，一些朦胧诗人也尝试着在诗作中夹杂着事件的过程，进行更为明显的叙事化探索。如舒婷的诗，就善于在文本中融入记忆的闪回，营造出画面的片段感。\n\n总体而言，“朦胧诗”独领风骚了一个经典抒情诗的时代，但在情感的抒发方式中，却也隐忍着“叙事”待发的因子，\n\n无论是意象叠加过程的呈现，还是动作、行动细节的强化，都体现出某种“叙事”火花的闪现。\n\n（三）集体性哗变：“第三代”的叙事表演\n\n如果说，“归来的诗”“朦胧诗”中隐约可现着“叙事”的萌芽，但其美学指向仍属于现代主义诗歌艺术范畴，是强调中心主义、结构主义和深度模式的诗学实践。那么，在“第三代”诗人的视域下，“叙事”不再是偶现的火苗，而是具备着先锋意义和效应的利器。\n\n（1）“去意象化”（“反意象”）\n\n出于对“朦胧诗”“影响的焦虑”的摆脱，“第三代”诗人从不同角度实践着先锋诗歌的叙事形态尝试，其中，“去意象化”或“反意象”倾向，化“意象化抒情为事态化抒情”则是最为显著的表现。“朦胧诗”中的意象联缀，发展至“第三代”诗人笔下，演化为一种事态化抒情的倾向，将情绪的书写借若干带有情节片段或行动的过程来表现，就是将“诗演绎为一种行为一个片段一段过程”。如韩东的《写作》，借用了一个情境，几个连续性动作和一个片段式情节，诗的情趣和韵道注重借“句意象”（徐敬亚语），或者是通过事象来呈现，将“意象化抒情”转换为“事态化抒情”。“去意象化”实验将“象”从“意”的统摄或控制中解脱出来，形成一种交流和对话的态势，为90年代先锋诗歌“叙事性”的出现埋下了萌生的种子。\n\n（2）“冷风景”\n\n“第三代”诗人所进行的又一先锋性探索，即是杨黎所倡导的“冷风景”式的反抒情方式。他们以近乎现象还原的方式消解着诗歌“抒情”的本质，进行着“一系列从热抒情到冷抒情，软抒情到硬抒情的风格剧变。”“冷风景”的抒情策略有效地克制了诗歌单纯依赖于情感的倾向，在“客观化抒情”的路径上尝试新的可能。“第三代”诗人普遍性地实践着“反抒情”的书写方式，除了杨黎之外，“非非”的其他诗人何小竹、蓝马，以及“他们”的韩东、丁当、于小伟等也都善于营造极端克制性抒情的态势。\n\n正是通过“第三代”极端地进行“反意象”“冷抒情”“口语化”等一系列诗体实验，才使得90年代“叙事性”得以形成，并稳步建设成为90年代以降最为重要的诗学话语。\n\n二、“叙事性”诗学话语的成熟：90年代诗歌\n\n如果说80年代诗歌中的“叙事”是偶一为之的话，那么到了90年代，便迎来了“叙事性”从创作实绩到理论建构的“成熟”。如果说，“叙事”在80年代更多地是作为“事由”，或诗情的铺垫而存在的话，那么，90年代的“叙事性”则走向了“综合创造”的过程。90年代诗歌的叙事性，主要表现在以下方面：\n\n（一）日常生活的诗意想象\n\n到了90年代，随着诗歌“边缘化”现象的有增无减，诗歌日益成为无人问津的精神孤岛，诗人迫切地需要调整自身的写作策略，使其同此在的现实人生发生必要的联系，大范围“介入”生活的诗歌作品在90年代弥漫开来。因此说，90年代诗歌最主要的特征就是恢复诗歌同此在经验的对话机制，大胆地向历史、现实和生活敞开，在俗世之间发掘日常生活的诗意美学。也正因此，90年代的诗歌以展现现实生活“平凡人”“小叙事”的平易近人的姿态重新焕发了生机。\n\n（二）诗歌文本的敞开性\n\n“叙事性”发生的根源在于诗歌迫切寻求自身的突破，建立一种敞开的包含的诗学，由单一的线性模式向多维度转化，由单纯抒发情感向表现多重异质性经验靠拢。90年代本质上不是一个抒情的年代，也不是一个“诗歌”的时代。面对这样一个“非诗”的历史时期，诗歌必须敞开自身的内空间，转换既有的表现模式，以一种包含的姿态提升诗歌综合异质人生的能力。因此说，90年代诗歌是一个倚重“叙事性”不断消解中心的时代，诗歌不再呈现整饬、统一的态势，而是向着多元、个人化的方向发展，寻求诗歌表现能力的无限可能性。\n\n诗歌文本的敞开，并非单纯表现为对异质经验的占有，而是一种立体化多维度的呈现，从形式到内容，90年代诗歌均呈现出一种开放、包含的态势。“叙事性”发生的初衷正在于诗歌迫切需要同存在和复杂的经验世界建立一种联系，表现内容疆域的扩大也必然要求诗歌汲取叙事文体的表现优势，将诗同小说、戏剧、散文等文体特征相融合，形成新的美学风格，在90年代，诗人们不仅注重诗同文学体裁间的互渗和借鉴，也有一部分先锋性较强的作品，更吸收非文学、甚至公文类写作的特征，同诗歌文体形成互动与交流。可以说，90年代的绝大部分诗人都倾心于从叙事文体中寻求艺术表现的新质，追求文体的开放性，运用多种方式消弭文体间的界限，借鉴多重异质美学质素，提升、丰富诗歌涵括现实人生的能力和表现力。\n\n（三）抒情主体的消隐\n\n90年代诗歌中，随着“叙事性”的兴起，越发客观化展现生活原貌的写作倾向，凸显了生活中的细节、现象、过程等\n\n方面，而诗歌中的抒情主体却逐渐消隐了。孙中明的《应该有一匹马》、朱增泉的《北京猿人头盖骨》、代薇的《起风了》等等，都体现了“我”的缺席，或试图将“我”的主观情绪一摸而去，单纯、客观地呈现事件、事象、过程和细节。这类客观化叙事不仅节制了诗歌过分抒情的倾向，有效地节制情感宣泄，而且，当抒情主体同事件本身拉开相当距离的时候，事件的呈现并不过分黏着和依赖主体的讲述，而是突显其本身蕴含的意味，也提升了诗歌思考和回味的空间。\n\n三、新世纪诗歌：“叙事性”的进一步发展\n\n新世纪诗歌中的“叙事性”，某种程度上接续了90年代诗歌发展的流脉，只是覆盖面更为广泛，几乎所有的诗人都不同程度上进行着将“叙事”融入写作中的尝试，“叙事性”已然成为新世纪诗歌的美学主潮，并呈现出了“狂欢化”色彩，这主要表现在以下方面：\n\n（一）能指的狂欢\n\n相较于90年代诗歌，“新世纪”更注重诗歌同现世民生的联系，从某种程度上来讲，它似乎已经脱离了90年代诗歌对于世俗美学的发现所带来的惊喜，更加强调的是诗人同社会公共话语空间的紧密联系，以及诗人对社会重大问题发言的权力和责任，正基于此，新世纪十年中，“底层写作”“打工诗歌”“新农村诗歌”“地震诗歌”等一系列同中国生存现场联系密切的诗歌现象，激起了巨大的轰动效应。新世纪诗歌强烈的“在场”意识，激发了其对“能指”，或者说“物象世界”的极大关注，从诗中我们可以感受到，新世纪诗歌的“叙事性”同90年代相比，更侧重于对生活本身，事件过程，以及物象世界的关注，更为浅显、澄明和客观。\n\n（二）肉体叙事的狂欢\n\n新世纪以降，“身体叙事”伴随着“下半身”口号的出现，又一次形成一股来势凶猛的写作热潮。不过，新世纪的“身体叙事”已经陷入了某种感官叙事的窠臼，虽然透露出某种反抗意识形态的挑衅姿态，但是，多数作品在主动大胆地裸露“下半身”的同时，具有文化符号意味的“身体”已经完全被“一具具在场的肉体”所取代。因此说，新世纪诗歌中的“肉体化叙事”已经不屑于营构朦胧的欲望化图谱，而是赤裸裸地制造了一场“人类性器展”-阴茎、乳房、阴蒂、精液、鸟等“下半身”标识性词汇被诗人悉数曝光，以极尽“低级趣味”之能事，和粗鄙、丑陋的姿态，展现着一幕幕惊世骇俗的肉体狂欢。可以说，新世纪诗歌中充斥着的“肉体化叙事”完全是一次集体性挑衅行为，追求纯快感写作的姿态，彰显一种感官的刺激，以性行为、肉体呈现和“作”的顽主式生活态度，使诗坛笼罩在身体乌托邦和猛烈的荷尔蒙分泌氛围中。\n\n（三）口语的狂欢\n\n随着新世纪“民间写作”诗人群风光无限，以及网络诗歌的盛行，“口语”在新世纪又一次成为了诗歌重要的话语资源，随着新世纪诗歌中紧贴生活层的能指型叙事以及肉身叙事“狂欢化”倾向的出现，对“口语”的选择与运用也呈现出日渐狂欢的态势。“口语”是相对于“书面语”而存在的一种语言形式，它的特点是便于交流和口耳相传。新世纪十年来的诗歌现场内，随处可见这类运用日常生活化口语写作的例子。但是，相当一部分“口语化”诗歌，并非是自觉追求“写作难度”的产物，而是停留于对生活用语的机械仿写，毫无诗歌兴味儿的提升。某些完全停留在口语的平流层中的诗作，某种程度上，已经将口语化诗歌推向非常危险的境地，实际上形成了一种写作的惰性，而这种艺术惰性的滋生，必然将诗歌推向庸俗化的情景之中，曾经极具先锋意味的“口语化”写作，转瞬间变成了新的意识形态漩涡，将诗歌从90年代个性化探索的路径中拖进集体性复制的危机之中。\n\n纵观新时期以来中国诗歌的叙事性发展，从最初的零星闪现到90年代的自觉建构，再到新世纪的泛滥与狂欢，叙事已从一种表现手法升华为诗歌的核心美学范式。这一历程既体现了诗歌对现实生活的主动介入，也暴露出在市场化、网络化语境中诗歌面临的新的困境。","keywords":"新时期初期 偶现的叙事火花“归来者”“朦胧诗”集体性哗变“去意象化”“冷风景”成熟90年代诗歌 日常生活的诗意想象 文本的敞开性 抒情主体的消隐 新世纪诗歌 进一步发展 能指 肉体叙事 口语的狂欢","note":"所谓诗歌的叙事性，指的是诗歌通过语言、结构和技巧呈现事件、人物或情节的能力。中国是一个诗歌的国度，不过从《诗经》和楚辞开始，中国诗歌就形成了绵延几千年的抒情传统，而这一传统也被中国新诗继承了下来。不过，新时期以来，叙事在诗歌中的比重越来越大，并对一直以来的抒情传统作出了挑战，而这一现象，也理应受到我们的关注。相关内容可以参考杨亮《新时期先锋诗歌的“叙事性”研究》，具体论文可以在李凡文学正版群内领取。"},{"id":"450","stars":"★★★","title":"90年代散文创作类型及特征","body":"众声喧哗，开放多元，是90年代散文创作的基本特征。这可从这一时段有关散文的各种命名中得到印证：\n\n一、“大散文”\n\n大散文是贾平凹由于不满意散文的现状而提出的寄寓了他的散文理想的一个概念。他说：“我们确实是不满意目前的散文状态，那种流行的，几乎渗透到许多人的显意识和潜意识中的对于散文的概念，范围是越来越狭小了，涵义是越来越苍白了。”他用行动力矫狭小、苍白的散文倾向，于1992年自创《美文》杂志，张扬“大散文”旗帜，以此“鼓呼大散文的概念，鼓呼扫除浮艳之风，鼓呼弃除陈言旧套，鼓呼散文的现实感，史诗感，真情感，鼓呼真正的散文大家，鼓呼真正属于我们身处的这个时代的散文＇”。“大散文”疏离狭隘的私人化写作倾向，作者基于普遍的人类精神，有人文情怀，在一个较有高度的文化基点上，以散文的方式观照、体悟、思考现实社会、历史演化以及人类生命存在的图式。余秋雨《文化苦旅》中的许多篇什，周涛的《游牧长城》，汪应果的《灵魂之门》，可谓文化大散文类的代表性作品。\n\n二、“艺术散文”\n\n论者提出，“创作‘主体’以第一人称写法和真实自由的笔墨，用来抒发感情、表现个性、裸露心灵的艺术性散体短文，即谓之散文”。这一散文观反映了90年代散文的一种实际存在状况。事实上描绘人生与自然景态的、浸透着作者性情的“艺术散文”是90年代散文的重要构成部分。\n\n三、“小女人散文”\n\n这是对90年代中期以沪穗两地为主的素素、南妮、黄爱东西、黄茵、张梅等女作家（还有香港女作家王璞也在上海出版散文集《别人的窗口》等等）特有的一种散文创作类型的命名。我们大致可以给出小女人散文的基本关键词即都市女性、时尚生活、闲适情调，作品凸现的是敏感而丰富的女性直觉、琐屑而别致的女性经验。小女人散文与具有某种宏大叙事意味的大散文相异其趣。它一般缺少丰富的现实社会内容和深刻的历史文化内涵，但它体现出了散文文体的某种体性，即通过叙写日常的生活景象和人的心绪情愫，表现特定时代人性的色彩。\n\n四、“新生代散文”\n\n这一种散文指称，着眼的是“新”。新，不仅表示作者出生晚（大多出生于60年代），在散文的园地中亮相迟（大多始见于80年代后期文坛），而且更意指散文的形态与精神有着某种新的气象和元素。新生代散文家，奉行开放大气的、凸现主体独特思想与情感的、表现“高尚的力量与精神品格”的散文观。","keywords":"大散文 艺术散文 小女人散文 新生代散文","note":"90年代散文创作又迎来了一个高潮，这一时期不但诞生了余秋雨这样的散文大家，而且散文创作向多个方向进行了积极探索，种类繁多。这部分涉及的几种散文类型，我们需要有所了解，特别需要注意的是“大散文”，当然这几类散文都有出名词解释的可能。"},{"id":"451","stars":"★★","title":"论述张中行散文创作的特色","body":"张中行是学者散文的代表作家。80年代开始，他陆续写下一批以30年代前期北京大学为中心的旧人旧事的随笔，定名为《负暄琐话》出版。后又陆续出版《负暄续话》《负暄三话》以及《流年碎影》等随笔集，曾被评价为“现代的《世说新语》”。张中行散文创作的特色主要有：\n\n一、以才学为根底的价值判断\n\n题材上，张中行的散文可以分为述学、记人和叙事三大类。其散文大都蕴含浓厚的人文精神和学者情怀，表现为对终极意义的关怀及对文化价值观念的关注，反射出丰富的文化与历史内涵。\n\n二、文体风格含蓄节制\n\n张中行的散文不事枝叶雕琢，情趣所在，物尽极致，智慧满溢。同时，张中行的学者散文没有明显的枯涩生硬和显才露能的弊病。其散文集命名为《负暄琐话》，意为一边晒太阳一边聊天，传达出闲散而又温暖的情调。而里面的作品像《启功》《胡博士》等，以传神的笔法勾勒出名人的魅力，将自己的缅怀之情寓于其中。\n\n三、独特的艺术内涵与品位\n\n张中行兴趣广泛，经史子集、古今中外的知识都乐于涉猎，被人称为“杂家”。体现在他的随笔中，则不仅是对各类人事“掌故”的熟知，一些品评指点，也透出理趣和淡雅的文化品位。总之，张中行的散文平实朴拙、散淡冲荡，具有独特的艺术品位。记人，他勾魂摄魄，写出人物文化内涵与精神品格；状物，他机智洒脱，常发出智慧之音；言理，他冷静超脱，化高深的学理为平实的意识，充满哲学与史学、灵感与理性的宁静邃远之美。张中行的作品风格独特，自成一派，行文流畅，文笔精妙，较好地体现了作者的文学水平与艺术素养。\n\n20世纪80年代始，张中行的学者散文创作受到了海内外的广泛关注。在个人层面，他的作品蕴含着“谦谨内敛”的思维品质；在社会层面，他的文笔折射出自身“于下而仁，于上则慧”的文化人格；在生命层面，作者不断进行反思体悟，最终达到了“顺受天命”的精神旨归。这三层向度层层深入，逐渐升华，不仅是作者创作的思想脉流，更是我们理解其审美世界的关键切口。","keywords":"以才学为根底的价值判断 含蓄节制的文体风格 艺术内涵与品位的独特","note":"张中行和余秋雨一样，都是学者型散文作家的代表，不过需要注意的是，虽然同样是学者型散文，二者散文的艺术特色却有很多不同，相较于余秋雨，张中行的散文显得更加平实、淡泊，这些表现在题材、语言和文体等多个方面，大家可以将二者放在一起比较记忆。另外，负暄系列出名词解释的概率很大，具体内容及特点大家应做额外掌握，具体可见正版群。"},{"id":"452","stars":"★★★","title":"试述余秋雨“文化散文”的主要创作特征（25北京师范大学）","body":"余秋雨散文的美学追求与八九十年代学界推崇平实、淡泊、节制、深沉的散文美学路径迥然不同，在当时引起了很大的轰动。他的散文创作，主要具有如下魅力：\n\n一、理性精神与忧患意识为余秋雨随笔带来了庄严性与震撼力\n\n余秋雨的散文具有鲜明的文化色彩。借助于学者、文化史家的眼光，余秋雨能够从各种历史的遗迹中获得文化的启迪，被沉寂的山水触发沉思和灵感，从敦煌莫高窟、宁波天一阁、承德避暑山庄等名胜古迹中，独具慧眼地发现“一种极端艰难、又极端悲怆的文化奇迹”。中国大地上丰富的山水风物，为他的文化思考提供了坚实的依托，余秋雨将自己的思考集中于“文化良知”的命题上，并且以此贯穿了自己的文化散文写作。余秋雨徜徉于“人文山水”间，以人类历史的价值坐标去对待各种文化现象，关注处于隐蔽状态的文化和群体人格，表现了诚实的理性与深重的忧患。\n\n二、浩大的抒情使余秋雨随笔颇具艺术性\n\n虽然余秋雨作品提出的皆为理性问题，但其对问题的陈述、分析，总是充溢着诗性的激情。面对“人文山水”，余秋雨的感情总是沉浸于赞叹、诘问、忧伤、感喟之中。这种极具个人主观性的评价完全发乎情感，无关历史的、科学的结论。不过，这种情感性并不排斥理性，它以造福于民为标准，是一种基于人性要求的理性。置身于自我情绪抒写中，余秋雨喜用排比，以让自己的感情层层推进。大排比为余秋雨的抒情带来了赋的气势，其文因此而文气畅达，浩浩荡荡。小排比则更为常见地在其作品局部产生一唱三叹、荡气回肠的美学效果。余秋雨的抒情虽属直抒胸臆，但不流于简单和直率，余秋雨通过曲折婉转、逐层渐进的方式表达自己的情绪和感受，表述上具有智性的逻辑与诗性的华美。\n\n三、余秋雨还长于以虚拟的想象做还原历史场景的假想，从而使其随笔富于戏剧性和情节性，因而也使之更具可读性\n\n散文固然是尚真的文体，但并不反对自由想象所呈现的艺术真实。余秋雨随笔中，多有对历史场景及前代人物活动的还原性假想。尽管其假想出的场景、人物都有声有色、活灵活现，但因为作者“不在场”的事实是明确的，因此并不存在欺骗读者的嫌疑，不超出艺术真实允许的范畴。通过虚拟性想象，余秋雨将历史现场化、人情化，呆板的历史资料因他的想象而在瞬间鲜活起来，具有了故事性和形象性。","keywords":"理性精神 忧患意识 庄严性 震撼力 浩大抒情 艺术性 虚拟的想象 还原历史场景 戏剧性和情节性","note":"白先勇这样评价余秋雨的散文创作：余秋雨先生把唐宋八大家所建立的散文尊严又一次唤醒了。或者说，他重铸了唐宋八大家诗化地思索天下的灵魂。所以，余秋雨散文相关特色，在当代文学史考查中十分重要，需要大家有所掌握。余秋雨相关内容，尤其是其代表作品《山居笔记》在名词解释中出现的频率还是比较高的，大家要重视起来。"},{"id":"453","stars":"★★","title":"90年代张承志散文的艺术特色","body":"在80年代，张承志以小说创作著称。进入90年代，则选择散文作为表达方式。这时期他的散文，主要包含以下特色：\n\n一、批判伪学术和学术寄生虫\n\n张承志的一部分散文表达了对伪学术和学术寄生虫的蔑视。在《荒芜英雄路》《杭盖怀李陵》《放浪于幻路》《心灵模式》等篇章中，张承志的批判锋芒有相当一部分指向的是以学术作为谋生手段，写得“纸腐墨臭”的文人。这些人的所谓学术研究与人类的良知、主体的生命体验和心灵律动毫不相干，这就使作者“一翻开资料就觉得有一种嚼英雄粪便的感觉”（《荒芜英雄路》），终于有一天“突然悟出自己的不合理”：“在纸人国中，难道我不也一天天变成一个稻草人么？”从而希望“大火猛烈地烧起来，它扫荡了我寄生的纸人国，也终于烧尽了我一身的烂稻草”（《放浪于路》）。\n\n二、渴望回归大自然\n\n憎恨都会文明对人心的侵蚀，渴望回归大自然，也是张承志散文的一种重要情思。都会的尘嚣常常使张承志窒息，在都会“绿油油的野草”中蹒跚久了，人的心中也长满了野草，心弦也开始锈腐（《芳草野草》），因此读张承志散文，我们常常看到作家在新疆、内蒙、甘肃这几块贫瘠而苍凉的大陆上踽踽独行的身影。唯有在那里，在“西海固”“沙沟”“起辇谷”“北庄”“枯水孟达峡”，在“黑骏马”奔驰的大草原，作家才感到天空的辽阔、心灵的升华与生命的确证。\n\n三、张扬宗教精神\n\n张承志还有相当一部分散文，极力张扬宗教精神。张承志出身回族，在长期的关于本民族历史踪迹的寻绎中，对一种名叫“哲合忍耶”的苏菲主义教理发生了浓厚的兴趣。《神不在异国》《宁肯湮灭》《背影》等篇章，热情赞颂了历经磨难的回族平民对宗教的度诚。\n\n四、强烈的画面感\n\n张承志的散文有着强烈的画面感，主题的传达往往就借助若干画面之间的重叠、对比暗示出来。比如《背影》，一共由三个“背影”组成：少年时代在熙熙攘攘的人流中所“发现”的母亲“单薄又倔强”的“背影”，在兰州“赶尔麦里”-追悼死在清朝统治阶级刀下的亡人的集会上所看到的数万回民的“背影”，这也是一个民族的巨大“背影”，妻女、朋友眼中自己的“背影”。主题并没有直接地点出，而是通过这种无声的排列显现出来，即，为了这个历尽苦难、被迫流亡到边缘地带但仍“坚持着心中沉重的感情直至彼世”的民族，“我”作为这个民族的儿子，有责任肩负起某种使命。与《背影》的主题处理方式相类似的，在张承志的散文中至少还有《荒芜英雄路》《放浪于幻路》等作品。","keywords":"伪学术和学术寄生虫 回归大自然 张扬宗教精神 强烈的画面感","note":"张承志的散文和他的小说一样，都暗含着宗教精神。或者说，小说与散文，不过是张承志用来表达自己思想的两种不同的方式，尤其是二者的主题往往有很多相似之处，所以大家可以将其小说创作特征与散文创作特征联系起来进行记忆。"},{"id":"454","stars":"★★★★","title":"结合具体作品，分析新世纪散文的特征及问题","body":"【答题框架】\n\n与20世纪90年代的散文相比，新世纪散文虽然少了90年代散文创作的喧嚣和热闹，但它在沉静中繁茂地生长着。新世纪散文的特征及问题，主要包括以下内容：\n\n一、新世纪散文特征\n\n（一）散文日益平民化是当代散文发展的一大趋势\n\n进入新世纪以来，散文成为当下最具平民化色彩的一种文体。这表现在散文日益走向民间，走向大众，更加贴近普通人的世俗生活。散文内容大多无关宏旨，谈论美食、品茶、饮酒、垂钓、狩猎、种花等多具有休闲和娱乐功能，从而为处于商品社会激烈竞争中的人们，提供了一片宁静的心灵憩息之地。如“大众散文”“新都市散文”“小女人散文”“怀旧散文音乐散文”等极大满足了大众的阅读需求。\n\n在写亲情和友情的散文中，不乏具有人性和情感深度的作品，如阎纲写丧女之痛的《我吻女儿的前额》，孙犁之女孙晓玲追忆父母四十年深挚不移的恩爱、父亲失伴后不尽哀思的《摇曳秋风遗念长》；一些散文还表现了作者关注普通人尤其是\n\n处于社会底层的民众和弱势群体的生存状态的平民情怀，如周同宾的《饥寒中的事情》、张承志的《与草枯荣》等。\n\n（二）张扬散文的理性精神，在散文中追问历史与文化，思考社会与人生，探索生命的价值与意义等成为一些作家共同的追求\n\n进入新世纪，文化散文的创作热潮并未走向衰落。在《千年一叹》和《行者无疆》中，余秋雨以一个中国文化史学者的身份在异域文化中遨游，对中华文明和阿拉伯文明、欧洲文明进行了多方面的横向比较。王充闾、林非、李国文、卞毓方、梁衡、李存葆、刘长春、夏坚勇、冯伟林、郭保林等作家也发表了大量以历史文化为主题的散文，构成了新世纪散文创作的新景观。思想随笔仍是很多文人、学者及时表达现实关怀、进行社会思想文化批判、思考形而上问题首选的文体样式，如韩少功的《进步的回退》、史铁生的《想念地坛》、张承志的《高贵的精神》、张炜的《方式和内心需要》、周国平的《单纯》等，质疑迷失于科技理性、工具理性的当今人类，探询生命的终极意义，追求生命的永恒和纯净。回忆录的写作、出版和阅读热潮不减。这些回忆录多结合自我的生命体验，展示了中国知识分子的坎坷历程，力求在反思中还原历史真实。2003年，年逾九旬的老作家杨绛先生倾尽心血创作的回忆录《我们仨》静思追忆往事，用心记述了他们家庭63年的风风雨雨、点点滴滴。\n\n（三）散文的抒情性逐渐回归\n\n世纪之交，在评论界开始对散文“说理代替抒情”“知性淹没感性”表示质疑之时，刘亮程带着他的乡土散文集《一个人的村庄》出现了。被誉为“乡村哲学家”的刘亮程以一种满蕴诗意的生命感悟，以细腻精致的美文守望着精神的家园。其散文朴实、单纯、清新、优美的“田园牧歌”式的抒情风格，让读者倍感亲切、真实、自然。\n\n（四）新散文的探索和网络散文的繁荣成为新世纪散文发展中值得关注的现象\n\n新散文写作以其特立独行的文体探索和多向度的精神追求进行了一场散文文体的革命。新散文作家们把散文当作一种创造性的文本经营，而不仅仅是记事、传达思想的工具。在艺术表现上，新散文作家们呈现出自觉的开放姿态。如祝勇的《一个军阀的爱情》采用了多元跳跃的复调方式，对散文的叙述进行了大胆的探索。\n\n以互联网为载体的网络散文进一步走向繁荣。随着电脑网络的普及，越来越多的人通过在网上开博客、写日志等方式来参与散文创作。“中国美文”“新散文”等网站论坛的开设，也促进了网络散文的繁荣。与传统散文的写作相比，网络散文的写作更自由，更丰富，更加生活化、个人化，在写作形式上天马行空，对传统散文的文体规范、阅读方式等提出了强劲的挑战。\n\n二、新世纪散文的问题\n\n（一）理性过强，现代意识匮乏\n\n抒情是散文的本质与天性。在散文的发展中，抒情散文是散文创作的正宗。但近年来，文化散文和思想随笔遍布于各级各类刊物和报纸上，一些散文作家过分追求散文的理性和思辨色彩，淡化了散文的抒情性。而散文理论批评界也形成了一种漠视散文抒情属性进而否定“抒情散文”的倾向。尤其是在新世纪的文化散文中，存在的最突出的问题是，一些作品理性淹没感性，说理代替抒情，作者由于背着太重的历史知识的包袱而难以进入自由、自主的精神状态。另外，现代意识的匮乏使一些作品对历史的诠释仅停留在表层。\n\n（二）消费时代的网络散文具有强烈的游戏性\n\n因为孤独寂寞，才会有狂欢性和游戏性书写，这是网络散文真诚和自由性的表现。关于现代都市生活中人们的孤独和寂寞在前文中或多或少的提到，这种情绪自然会蔓延到网络散文的创作中，“狂欢性”“游戏性”在实际文本上也就随处可见。安昌河发表在榕树下的《租期七十二小时》和也田的《网友有约》分别讲述了作者租妻回家面见父母以及与网友在长春见面的故事，两篇文章在题目上就吸引了众多眼球。“租妻”和网友相见，是现实中时常听到并会引起热切关注的两个话题，而这明显与传统相矛盾或者不应景。换种表述就是这些题材，都或多或少的带有游戏性和狂欢性色彩。","keywords":"特征 日益平民化 理性精神 追问历史与文化 思考社会与人生 探索生命的价值与意义 抒情性逐渐回归 新散文 网络散文 问题 现代意识匮乏 强烈的游戏性","note":"回顾当代文学史上的散文发展脉络，可以看到，90年代的散文创作取得了非常突出的成就，因而在考查中相对而言更加受到关注。不过，其他几个时期的散文创作我们也不能忽视，尤其是如今许多院校将考查重点聚焦于新世纪文学的情况下。新世纪的小说（网络小说、科幻小说）、诗歌（底层写作）等在考查中出现的频率越来越高，相应的，对于新世纪散文的特征，我们也要有所掌握。"},{"id":"455","stars":"★★★★","title":"谈谈你对“80后”文学的认识","body":"【答题框架】\n\n“80后”文学并不直接等同于“80后”本身。\n\n作为中国进入21世纪社会发展阶段的特殊产物，“80后”文学成长有其独特的历史文化背景，“80后”作家也有其独特的成长经历，也因此，“80后”文学形成了自己独特的特征。\n\n“80后”的韩寒、郭敬明们成长于中国社会改革开放的年代，这是一个中西文化剧烈碰撞的时代，除了中国的传统文化之外，西方的各种思潮也涌了进来，结构主义、精神分析学、形式主义、接受美学、解构主义、后现代主义、女性主义令人目不暇接，文化的冲突、观念的碰撞、思想的互相渗透构成了中国历史上少见的多元景观。\n\n“80后”作家有幸面对这样丰富的文化资源，他们无一例外地受到了外来文化和传统文化的熏陶。\n\n一、题材的青春化，都市化（青春书写）\n\n书写青春是“80后”作家们一个最明显的特征。这些“独一代”几乎没有吃过什么苦头，小学、中学、大学，一切按部就班，他们没有经历过人世的磨难和沧桑，因此青春感悟成了他们人生经验中最重要的组成部分。“青春是道明媚的忧伤”。对他们而言，青春物语的主要元素有：成长之痛、青春的迷茫困惑、青春的彷徨痛苦。郭敬明的《左手倒影，右手年华》表现了这一代人的生存状态-与父母关系疏离但又摆脱不了父母的照顾与期待，对学校和考试的过度恐惧，对未来的无法把握；春树的《北京娃娃》是一部半自传体小说，描述了一位另类少女林嘉芙尖锐而疼痛的成长历程；李傻傻在《红》中讲述了一个叫沈生铁的少年的成长故事，他因为过早地熟悉了周围的世界而沦入了对社会的抵抗，抵抗之后的疲惫又让他对这个世界失去了惟一的新鲜感，他对一切的敏感又暴露出了一个年轻人对生命本身的恐惧。\n\n这些年轻人都是生长于城市的一代，在他们身上完全没有前辈作家心中浓重的乡村情结，韩寒的《三重门》、郭敬明的《梦里花落知多少》、春树的《北京娃娃》等都是对都市化青年生存的一种真实描绘，在作品中他们展现的是一代人的焦虑和困惑，传达的是他们对亲情、友情、爱情、人生、苦难、幸福、理想等情感的追问和对人生的迷茫。校园和都市生活的体验成为他们的唯一表达。\n\n二、传播方式的特殊化：以网络传播为主\n\n“80后”文学和此前的所有文学流派、文学群体、文学思潮最大的不同就在于它的网络化，“网络对于＇80后’而言，不仅是孕育的温床、崛起的平台、聚合的空间，更是他们生命的一部分”。网络作为一个交流平台，为“80后”搭建了一座认识世界、走向世界的桥梁。他们在这个虚拟的世界中找到了绽放青春热情、展示文学才艺、实现自己梦想的自由空间，他们拥有了真正属于自己的抒情记事的平台，从而第一次把话语权牢牢地掌握在自己手中。\n\n网络写作具有“零门槛准入”和“交互式共享”的特点。前者使得写作更加自由随意，想象更加丰富真实。在后者的模式下，文学的创作、传播、沟通、阅读、反馈更加迅速，文学的互动性空前增强这些因素引发了新的文学体验，导致了新的文学观念。“80后”文学因此获得较传统纸介文学更大的自由度。文学中一些属于内核的东西也在被稀释、忽略乃至抛弃，文学作品在高速写作的同时，既出现了新质，也同时出现了“一次性消费”的“失重”。（李凡说：从文学理论角度而言，四要素被无限拉近）\n\n三、内容的时尚化：孤独、寂寞、忧伤\n\n生于80年代的独生子女，大多数在祖辈的呵护下成长，没有兄弟姐妹的厮守，决定了他们是时代的孤独者。十七八岁正是活泼、天真烂漫、充满着热情与梦想的年龄，可在“80后”作家那里，却只有孤独、寂寞与感伤。\n\n“80后”们出生于中国经济发展的时期，他们拥有富裕的生活条件，但同时也承受着巨大的精神压力：父辈们“望子成龙”的期望、学习的枯燥乏味、高考的紧张焦虑、就业的残酷竞争......这一切使他们的精神世界充满了颓废、漂泊、空灵和寂寞。这样的情绪在“80后”作家的作品中比比皆是。\n\n郭敬明就是一个典型，在他的小说文本中，孤独、寂寞、绝望和忧伤的情绪是主题。他作品中的青春人物无一例外地都过着一种寂寞的生活，卡索、林岚、立夏、林萧，他们都是生活的佼佼者，有着丰厚的物质生活，处处显现出强者的一面，然而在高度发展的社会中他们却丧失了自由的性情，精神上处于极度寂寞状态。寂寞于他们就像如影附形的罂粟花，在寂寞中主人公常常感到莫名的忧伤，那种对过去美好时光的缅怀和对现实生活的无奈充满了字里行间。春树在《北京娃娃》中也表达了一种无法言说的“撕裂之痛”。\n\n四、写作方式的个性化\n\n“80后”作家在写作方式上追求个性化，几乎所有的“80后”作家都有意识地在创造属于自己的风格。\n\n“叛逆”的韩寒以《三重门》敲响了当代文坛的大门，他用幽默的语言对现实、对现行教育制度进行嘲讽，发泄对学业过重、对单调生活、对道德说教的不满。小说出版后引起中学生的共鸣，产生巨大的轰动效应。其后出版的《光荣日》主题是对道貌岸然的教育制度的调侃与颠覆。这部小说可以说是一部全面颠覆旧有文学观念和审美趣味的文本，延续了韩寒一贯的风格-痛快淋漓、真率自然，至此，韩寒已经成为反叛现行教育制度的青年偶像。\n\n“另类”的春树2002年因发表“残酷青春”小说《北京娃娃》一举成名。这部半自传体小说描述了林嘉芙（春树）从14岁到17岁与李旗、赵平、GT等人坎坷的情感经历和令人心痛的生活历程。春树以早熟而敏感的笔法描写了作为新人类的一代人在思想、情感、社会、家庭等方面的历程。她是一个所谓的“坏孩子”，她身上有着的不仅是反抗的姿态，更是一种明确的反叛行径。\n\n“青春”的张悦然在“80后”众多作家中是最受作家和评论家们称赞支持的一位。张悦然的小说文字细腻，强烈的梦幻色彩使其显得超凡脱俗而又高贵华丽。她的小说既朦胧又明澈，既真切又虚幻，不以故事情节取胜，而是凭借着细腻敏感的心灵体验和感悟去细细密密地串起一串串青春的梦想，她的想象奇特，总能给人带来新鲜感。\n\n“先锋”的李傻傻有“少年沈从文”的称谓，他的作品散发着浓郁的乡土气息。2004年花城出版社出版了他的《红X》，作品叙述了一个叫沈生铁的问题少年的逃学故事，将一个乡村少年到城市求学的生活写得十分真切。在李傻傻身上有着与来自城市的少年写手不同的地方：乡村出身，来自湘西，作品有乡村诡异、灵动、神秘的一面，更多地涉及了死亡、暴力和性。与同龄写手相比，李是“独一无二”的“安静、沉默”的，其才华独特，立场纯粹，他的先锋姿态几乎与余华《在细雨中呼喊》的文学姿态是一样的。\n\n五、鲜明的消费性和欲望性\n\n由于价值观念的“裂变”，依据惯性前行的青少年文学读物已无法满足“80后”一代“精神断层”后的阅读期待，“80后”们开始自己经营自己的精神家园。同时，“80后”作家网上作品受到热捧，网站因此成为热门，反过来激赏作家，并以现代方式进行“偶像包装”，广告推广，进一步刺激生产和消费。在此，“80后”的“青春消费”与市场达成了一种默契一一多边互动，同惠共利，并且成功地融入大众消费文化而名利双收。于是，与20年代新文学初期作家强烈的社会感、历史感和命运感相比，“80后”的青春写作具有两个突出的特点，一是娱乐性，二是商业化。“80后”文学现象的出现，是商业与写作磨合的功利化的产物。\n\n【李凡关键词：青春化 特殊化 时尚化 个性化性 商业化】","keywords":"","note":"①近年来，针对“80”后写作的研究越来越多，虽然在具体考查中出现较少，但其无疑已经是当下文学研究的一个热点，所以我们有必要准备一下。相关内容可以参考孙桂荣《论“80后”文学的写作姿态》，具体资料可以在李凡文学正版群中领取。②“80后”其实已经不再年轻了，最早的“80后”已经在奔五的路上，这个群体其实在后期已经发生了变化，比如韩寒已经很少写作而转战电影，如其2024年电影《飞驰人生2》。③总之，从文学史的层面上谈论“80后”，现在为时尚早。因为他们一直处于变动不居之中，从文学走向、审美取向上看，还在逐步成形的过程之中。他们现在给予文坛的影响，还主要是在文化的层面上。④也许到了本世纪中叶，“80后”写作，会有一个相对公允的评价。"},{"id":"456","stars":"★★★★","title":"请说说你对“底层文学”的认识 【答题框架】","body":"“底层文学”是在新世纪出现的一种新的文艺思潮，它与中国现实的变化，与思想界、文学界的变化紧密相关，是中国文艺在新形势下的发展，也是“人民文艺”在新时代的发展。\n\n一、“底层文学”的内涵\n\n在内容上，“底层文学”主要描写底层生活中的人与事；在形式上，“底层文学”以现实主义为主，但并不排斥艺术上的创新与探索；在写作态度上，“底层文学”是一种严肃认真的艺术创造，对现实持一种反思、批判的态度，对底层有着同情与悲悯之心，但背后可以有不同的思想资源；在传统上，它主要继承了20世纪左翼文学与民主主义、自由主义文学的传统，但又融入了新的思想与新的创造。\n\n二、“底层文学”出现的背景\n\n（一）“底层文学”的出现，首先与中国现实的变化密切相关。30年的改革开放为中国的发展带来了巨大的活力，但也带来了一些新的问题，如贫富分化、贪污腐败等等。因而要加强“改革”的共识，需要凝聚普通人的认同与支持。对这些问题的思考与回答，体现在现实政策的变化与调整中，而这则为“底层文学”的出现与发展提供了重要契机。\n\n（二）从文学自身来说，从八十年代中期开始，“纯文学”就逐渐占据了文学界的主流，这一思潮对反拨此前文学的弊端具有历史性作用，对文学作品整体艺术性的提升具有重要意义，但这一思潮发展到后来也暴露出了一些问题，结果形式探索只成为了一种貌似先锋的姿态，向西方学习也成了一种盲目的崇拜。2001年，文学界开始反思“纯文学”，希望文学能够在注重艺术性的同时，重新建立与现实世界的联系，在中国社会中发挥更大的作用。而“底层文学”的兴起，则是创作界反思“纯文学”的具体表现，也是其合乎逻辑的展开。\n\n三、“底层文学”的意义\n\n（一）“底层文学”能够以文学的方式，参与到社会的思想界的讨论之中。它对底层的主体性的寻找，对他们在社会发展中作用的强调，包括对他们现实生活中苦难生活的描写，都给我们提供了很多可以思考的东西。仅从文学界来说，“底层文学”也是出现的一种新的思潮，它的兴起与整个文学界对“纯文学”的反思是紧密联系在一起的，可以说是用自己的作品来对以前思潮的一种反思。在这个意义上，“底层文学”是一种真正意义上的先锋。\n\n（二）“底层文学”是五四新文学的一种继承者，是一种“新文化”。从1980年代开始，我们逐渐地告别了“五四”&#x4EE5;来的新文学的方向，到九十年代末期，特别是现在，整个文坛的主流已经背离了五四新文学的方向。所以在这个意义上来讲，“底层文学”的出现就显得特别重要。它代表底层人民的利益，把现实的东西写出来让人看，让人重新认识自己与世界，让人认识之后产生精神上的作用，像鲁迅所说的，“引起疗救的注意”，从而改变社会的不合理的不公平的秩序，坚持了“五四”新文化的方向。\n\n（三）“底层文学”还具有重要的社会作用，它可以让人们意识到这个社会不公平的地方，从而引起改变现状的一种可能性。同时，“底层文学”还能起到一种“翻心”的作用，即翻过来之后就不是以前那个“心”了，让人有一种对社会流行意识的批判性的认识，从而创造出一种新的文化，一种新的人与人的关系。","keywords":"内涵 现实变化 反思“纯文学”思想界讨论 五四新文学继承者 批判性认识","note":"“底层文学”是新世纪之后兴起的与“纯文学”“通俗文学”“主旋律文学”都不一样的新的文学思潮，尽管依然有着许多争论，但底层文学的存在是毋庸置疑的，近年来相关的研究也在展开，部分学校也会针对其专门出题，所以对此我们要有所掌握。相关内容可以参考王瑞瑞《“底层文学”批评话语的构建与理论思辨》、李云雷《新世纪文学中的“底层文学”论纲》，具体资料可以在李凡文学正版群中领取。"},{"id":"457","stars":"★★★★","title":"谈谈你对网络文学的认识","body":"所谓网络文学，简单来说，是指在网上写作和传播的文学作品，当下对网络文学的研究，主要以网络小说为重心。\n\n一、网络文学的界定\n\n网络文学首先是一种新媒介文学，从生产、传播、接受等不同角度均体现出新媒介文学的特质。在这种新的媒介形态中，也共时性地融合了旧有的媒介形式。其次，网络空间对网络文学在生产和传播层面具备规定性和制约性的力量，是网络文学的依存之地-网络文学纷繁多变，但网络空间始终都是其最重要的生产和传播渠道之一。最后，“网络文学”这一表述植根于中国特殊的社会历史文化语境中，具有鲜明的中国特色。需要说明的是，这里的“中国”是指以汉语为维系条件而形成的中华文化共同体。“网络文学”这一概念具备新媒介文学的特性、网络空间的属性与中国话语的特殊性。\n\n二、网络文学与传统文学的区别\n\n与传统文学相比，网络文学有其新的特点：\n\n（一）发表和传播的媒介发生了变化，从传统的纸上写作和纸媒传播转换为电脑写作和网络传播。\n\n（二）文本形态的改变，网络文学拓展了传统文学的基本形态，带有泛文学性质，它包括小说、复杂的故事、爽文，以及为影视剧、网游、动漫等产品定制的故事脚本。按照传统文学标准衡量，后三者甚至不属于文学范畴。\n\n（三）网络文学生产具有动态开放性。网络文学的生产和传播几乎处于同一交际场域，作者和读者同时到场和在场，交际性与互动性成为网络文学的突出特征，从即时性的阅读、点赞、评论和打赏，到专门的论坛、贴吧，到线下与粉丝的活动等，构建了全新的作者一读者关系。\n\n（四）网络文学具有产业属性。网络文学对动漫、网游和影视等的强大激活能力使得它常常成为资本聚集最活跃的部分。在IP时代，流量为王，有影响力的网络作品能够迅速转换为纸质书，并进一步扩张到网游影视、动漫领域，大量的衍生品形成网络文学产业链。\n\n（五）评价标准发生变化。传统文学评价以作者、文本和专业读者为中心，网络文学则以资本和普通读者为中心。网络文学中有一部分与传统文学很接近的网络小说可以沿袭传统文学评价标准，其他大量的故事和故事脚本都难以用传统文学标准进行评价。\n\n三、中国当下网络文学的特征\n\n相较于传统文学，网络文学的发表和传播媒介、文本形态、评价标准都发生了变化，并且具有动态开放性和产业属性。也由于这些因素的影响，中国当下的网络文学主要表露出了如下特征：\n\n（一）互动性是网络文学独立于传统书面文学的最主要特征，支撑这种互动的是网络的多媒体界面和共时交流的次生口语环境。互动不仅模糊文学主体身份，重置文学活动次序，也促进差异化的文艺符码交融，从而刷新文学观念，将传统静止、固化的作品转变为动态的交互活动，建构了不同于书面文学的活态的文学观。\n\n当前网络文学的互动是人与人之间的互动，是作者与读者、运营者与管理者、盗猎者与改编者的互动。人际互动影响网络文学的表现形式、风格语体、阅读感受，也决定其传播范围和生命周期。良好的人际互动使网络文学从个体独立的精神产品走向群体思想和情感的交互。它也是不同媒介界面、不同艺术符码的互动。技术赋予网络语言以多元表意系统和跨界语法规则，使文学突破以往的语言文字边界，获得诉诸综合感知的表达效果。文学呈现群体性、社区性特点，突出了文本之外人的活动，也在文本之内呈现联想丰富、意蕴无穷的面貌。\n\n（二）丰沛的想象力是中国网络文学的又一大特色，中华历史、异域文化及媒介经验构成其三个源头。这种想象纵贯古今、囊括中外，同时也极富个人色彩。传统与现代、西方与本土、印刷文化与数字文化的种种冲突，生成了网络文学丰富的想象力。\n\n首先，网络文学渗透了来自中国历史的想象。一方面，网络文学大量借鉴古典文本，从中寻求想象的突破。网络文学从不避讳直接利用经典，如人们一眼就发现《甄嬛传》中“些许认得几个字”的眉庄受黛玉的影响。另一方面，“真实”的文物和史书同样孕育想象在网络上，远距离翻查史料、近距离观赏文物并不困难，文史知识的增长鼓励人们将大胆的猜测加入想象。其次，文学是世界共通的语言，网络小说同样向异域张开怀抱，“西幻”“奇幻”等类型小说是以中国语言讲述的西方故事，而网络“衍生文”则多数来自日本的二次元宅文化。最后，网络文学写作既受惠于伟大作家和不朽作品，也得到新媒体技术、计算机逻辑以及网络开源精神的助力，新媒介使当今网络作者拥有超越以往的想象空间。\n\n（三）作为当代青年的自由创作，网络文学在展现现实生活和青年心态方面，相对传统文学更有优势。网络文学表面看来充满欲望叙事与白日梦，但深层却呈现社会现实。中国网络文学是青年对时代见证、记录与作为的产物。其中的人情冷暖、欲望表述和叙事革新，与我国网络社会的崛起同步，记录着社会结构的变迁以及时代心态的转变。更进一步，网络文学不仅呈现传统意义上的社会现实，也表现虚拟现实，最重要的一点是，它形成了新的社会意识，即虚拟现实并非“现实”之外的“异托邦”，而是内化于生活的存在。在网络社会的生成中，拟象、仿真日益超越实体，网络居民理所当然将虚拟与现实无缝衔接；而网络文学则将抽象的互联网规则转变为具体的经验模式，并在套路重复中使人谙熟甚至接受。这种稳定的重复消弭了虚拟体验的边界，使媒介经验从新奇变成日常，从个体感受成为公众话题，网络世界也得以在文学讲述中日益清晰。","keywords":"新媒介文学 网络空间 规定性和制约性 中国特色 媒介 文本形态 动态开放性 产业属性 评价标准 互动性次生口语环境 丰沛的想象力 中华历史 异域文化 媒介经验 展现现实生活和青年心态 表现虚拟现实","note":"当下，网络文学的发展越来越兴盛，文学界也越来越关注这一重要的文学现象，相关研究也越来越多，所以对这** --- 一部分内容我们还是有必要关注一下。通常情况下，针对网络文学的考查多在文学理论部分出现，马工程版《文学理论》针对网络文学有相当系统的阐述，而当代文学教材中很少有涉及网络文学的内容，所以当代文学考查网络文学的可能性较低，不过井不是完全没有可能，这里放一道题让大家参考，相关内容可以参考许苗苗《网络文学：互动性、想象力与新媒介中国经验》、邵燕君《网络文学的“网络性”与“经典性”》，具体资料可以在李凡文学正版群中领取。"},{"id":"458","stars":"★★★★","title":"试分析中国当代新科幻小说与传统文学的不同","body":"【答题框架】\n\n新科幻文学之“新”，既在于它异于以往任何时期的同类作品，也在于它异于同时期的其他文学类型。具体来看，中国当代新科幻小说与传统主流文学的差异主要表现在与世界、科学、认知和思维逻辑的关系中，中国当代新科幻小说可以表述为“人类文学”“科技文学”“观念文学”和“推演文学”。具体来说，二者的不同主要有以下方面：\n\n一、“人类文学”：叙述视角与文本形象不同\n\n中国当代新科幻小说与传统主流文学最大的差异在于它逐渐取消了“个体的人”的概念，转而从“类”的范围对人进行刻画，思考人与世界的关系。因此，传统人物的典型性、丰富性、阶级性或“大写的人”等批评范畴并不完全适用于科幻文学。“文学是人学”的命题在科幻小说中扩展到对人类整体命运关注与表达的层面。它追求人类叙述的目标，也体现出对新时期以来愈演愈烈的个人叙述的反拨，在新科幻小说中，人类的形象逐渐取代了个体的形象，通常以全“人类”的视角进行叙述，它的世界在空间上扩张到整个宇宙，在时间上扩展到近乎无限。个体性被人类整体性取代，人与人之间的内部矛盾转换成种族与“他者”、人与“非人”之间的外部矛盾。宏细节展示的表现手法，使文本具有惊奇的审美效果，并给读者造成“惊颤”的阅读体验。（李凡说：《三体》世界观可印证此点。）\n\n二、“科技文学”：创作主体与叙述内容不同\n\n毫无疑问，科幻小说是与现代科学距离最近的文学类型。尤为重要的是，科幻小说将自然科学的种种知识、观念、成就、想象纳入了文学叙述的范围。20世纪90年代之后，中国新科幻小说与科学的关系表现出与以往截然不同的性质，即创作者和科学自身都回归了独立的主体性地位，重新开启了严肃思考科学精神的启蒙话语。具体表现在科学家写作与形象的双重崛起、科技成为创作的主导性焦虑以及科技灾难的书写倾向三个方面。自然科学领域的工作者或具有深厚理工科背景的作家组成其主要创作群体，同时将“科学家”形象内化到文本当中，建构了他们作为精神导师的身份认同。科技焦虑是其创作的直接冲动，反映了科幻参与科技活动的特殊方式，并以谨严的技术细节形塑了一处进行思想试验的“仿真空间”，将读者嵌于其中。它一反20世纪90年代之前的“科学万能主义”，转而以对科技灾难的叙述表现了此类文学的反乌托邦倾向。\n\n三、“观念文学”：叙述动机和情节构造不同\n\n“观念”对于科幻小说来说亦是一项不可或缺的因素。这里所言的“观念”是指人们主观见之于客观形成的概念，它更强调主观思维的能动性。因此，将科幻小说称为“观念文学”就是指该类作品通常在遵从客观规律约束的情境中，主观地设计出一系列新的知识、新的价值、新的空间、新的生命等，从而在观念上建构起一个新的世界，这种观念的核心，是新的认\n\n知。新的观念是科幻小说叙述的起点和手段，亦是推动情节发展的动力，并且以展示的形态促进人们的思考。概而言之，作为观念文学的中国当代新科幻小说体现了其叙述动机和情节构造的新变，它提供了一种与日常唯一现实相关又相异的可能性，而这种观念，在建构文本世界、推动情节发展、展示思考过程三个方面，建立了新科幻小说多元开放的思想空间。科幻小说经由观念层面向尚未发生的未来渗透，且不再以阐述“美”“善”的最高理想为唯一宗旨，而成为提醒人们思考未来的敲门砖。\n\n四、“推演文学”：内在思维和文本逻辑不同\n\n就文学的内在思维和逻辑而言，中国当代新科幻小说是一种“推演文学”。它以科学为根据，用思维演绎的方式建构了一个暂时不存在于现实的“替代世界”。它所蕴含的世界观是多元的、逻辑基础是科学自洽的、政治想象是尚未实现的、叙述结果是假定真实的，换言之，它的意识形态是乌托邦式的。这种“推演文学”的构成，具体表现在文学思维范式的转变、“演绎”下的真实以及虚构性的回归三个方面。它有别于传统文学描绘的“上帝”已经创造的唯一世界，其本身就是在虚构那些具有可能性的世界。正因如此，也使它的创作思维发生了转型，即由“归纳法”的思维范式转向了“演绎法”的思维范式，成为“向前看”的文学。其思想渊源不但具有五四文化的精神传统，亦能汇入世界科学与哲学思想发展的进程当中。","keywords":"人类文学 叙述视角 文本形象 科技文学 创作主体 叙述内容 观念文学 叙述动机 情节构造 推演文学 内在思维 文本逻辑","note":"近年来随着以《流浪地球》为代表的科幻作品的火热，文学界对于科幻文学的关注度明显有了提升，反映到考查中就是针对科幻文学的题目开始出现，如24年北京大学和复旦大学不约而同地针对科幻文学出题。所以，对于科幻文学作品，尤其是当下以刘慈欣的作品为代表的中国新科幻文学，我们要关注一下。相关内容可以参考姜韫霞《解读中国科幻：中国科幻的人文精神与科学意识》、任一江《文学新境与审美路标-论中国当代新科幻小说的四副面孔》，具体资料可以在李凡文学正版群中领取。"}];
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function starStr(s){if(!s)return '';const c=(String(s).match(/[★☆]/g)||[]).length;return c?'★'.repeat(Math.min(c,5)):'';}
function isSectionHead(t){return /^[一二三四五六七八九十]+[、．.]/.test(t)||/^[（(][一二三四五六七八九十]+[)）]/.test(t)||/^[（(]d+[)）]/.test(t);}
function renderAnswer(body){if(!body)return '<p class="ans-p">（本题 OCR 未识别到答案，可能为扫描遗漏）</p>';let h='';for(const p of body.split(/\n\n+/)){const t=p.trim();if(!t)continue;if(isSectionHead(t)){h+='<p class="ans-head no-indent">'+escHtml(t)+'</p>';}else{h+='<p class="ans-p">'+escHtml(t.replace(/\n+/g,' '))+'</p>';}}return h;}
function renderKw(kw){return kw?'<div class="kw"><b>李凡关键词：</b>'+escHtml(kw.replace(/\n+/g,' '))+'</div>':'';}
function renderNote(nt){return nt?'<div class="note"><b>李凡说：</b>'+escHtml(nt.replace(/\n+/g,' '))+'</div>':'';}
let curKw='',curStar=0;const list=document.getElementById('list'),stat=document.getElementById('stat');
function render(){const kw=curKw.trim().toLowerCase();const items=DATA.filter(d=>{if(curStar&&(starStr(d.stars).length!==curStar))return false;if(!inEra(d))return false;if(curType&&qType(d)!==curType)return false;if(kw){const hay=(d.id+' '+d.title+' '+d.keywords+' '+d.body).toLowerCase();if(!hay.includes(kw))return false;}return true;});if(!items.length){list.innerHTML='<div class="empty">没有匹配的题目</div>';stat.textContent='匹配 0 题';return;}list.innerHTML=items.map(d=>{const miss=!d.body&&!d.keywords&&!d.note;return '<div class="q"><div class="qhead" onclick="this.parentNode.classList.toggle(\'open\')"><span class="num">'+escHtml(d.id)+'</span><span class="qt">'+(miss?'<span class="missed">':'')+escHtml(d.title)+(miss?'</span>':'')+'</span><span class="st">'+starStr(d.stars)+'</span><span class="arrow">▶</span></div><div class="body"><div class="answer">'+renderAnswer(d.body)+'</div>'+renderKw(d.keywords)+renderNote(d.note)+'</div></div>';}).join('');stat.textContent='匹配 '+items.length+' / '+DATA.length+' 题'+(curEra>=0?(' · '+ERAS[curEra].name+(curType?(' · '+curType):'')):'');}
document.getElementById('search').addEventListener('input',e=>{curKw=e.target.value;render();});

function qType(d){const t=(d.title||'');if(/填空/.test(t))return '填空';if(/名词解释/.test(t))return '名词解释';return '问答题';}
let curEra=-1,curType='';
function inEra(d){if(curEra<0)return true;const e=ERAS[curEra],n=parseInt(d.id,10);return n>=e.start&&n<=e.end;}
const tocPanel=document.getElementById('tocPanel'),tocMask=document.getElementById('tocMask'),tocBtn=document.getElementById('tocBtn');
function openToc(){tocPanel.classList.add('show');tocMask.classList.add('show');}
function closeToc(){tocPanel.classList.remove('show');tocMask.classList.remove('show');}
if(tocBtn){tocBtn.onclick=function(){tocPanel.classList.contains('show')?closeToc():openToc();};}
if(tocMask) tocMask.onclick=closeToc;

function buildToc(){
  const body=document.getElementById('tocBody'); if(!body) return;
  let h='<div class="toc-all" data-all="1">显示全部 '+DATA.length+' 题</div>';
  ERAS.forEach(function(e,i){
    const inR=DATA.filter(function(d){const n=parseInt(d.id,10);return n>=e.start&&n<=e.end;});
    const types={};
    inR.forEach(function(d){const t=qType(d);types[t]=(types[t]||0)+1;});
    let subs='';
    Object.keys(types).forEach(function(t){
      const on=(curEra===i&&curType===t)?' on':'';
      subs+='<span class="toc-sub'+on+'" data-era="'+i+'" data-t="'+t+'">'+t+' '+types[t]+'</span>';
    });
    h+='<div class="toc-item"><div class="toc-era'+(curEra===i?' on':'')+'" data-era="'+i+'">'+
       '<span class="idx">'+(i+1)+'.</span><span class="nm">'+e.name+'</span>'+
       '<span class="cnt">'+inR.length+'</span></div><div class="toc-subs">'+subs+'</div></div>';
  });
  body.innerHTML=h;
  if(tocBtn) tocBtn.classList.toggle('on', curEra>=0);
}
document.getElementById('tocBody').addEventListener('click',function(e){
  const all=e.target.closest('.toc-all');
  if(all){curEra=-1;curType='';buildToc();render();closeToc();return;}
  const sub=e.target.closest('.toc-sub');
  if(sub){curEra=parseInt(sub.getAttribute('data-era'),10);curType=sub.getAttribute('data-t');buildToc();render();closeToc();return;}
  const era=e.target.closest('.toc-era');
  if(era){const i=parseInt(era.getAttribute('data-era'),10);curEra=(curEra===i&&!curType)?-1:i;curType='';buildToc();render();closeToc();return;}
});
buildToc();

render();
</script><script>
/* deep-link support: #era=N 预选时代, #qID 定位题目（自动追加，勿删） */
(function(){
  if(window.__dlPatched) return; window.__dlPatched=1;
  function assignIds(){
    var q=document.querySelectorAll('.q');
    for(var i=0;i<q.length;i++){
      var n=q[i].querySelector('.num');
      if(n && !q[i].id) q[i].id='q'+n.textContent.trim();
    }
  }
  var _render=window.render;
  if(typeof _render==='function'){
    window.render=function(){
      _render();
      assignIds();
      var m=(location.hash||'').match(/q(\d+)/);
      if(m){
        var el=document.getElementById('q'+m[1]);
        if(el){ el.classList.add('open');
          setTimeout(function(){ el.scrollIntoView({block:'start'}); },60); }
      }
    };
  }
  var em=(location.hash||'').match(/era=(\d+)/);
  if(em && typeof ERAS!=='undefined' && ERAS && ERAS.length){
    try{
      curEra=Math.max(0,Math.min(parseInt(em[1],10),ERAS.length-1));
      curType='';
      if(typeof buildToc==='function') buildToc();
    }catch(e){}
  }
  if(typeof window.render==='function') window.render();
})();
</script>
<!-- deep-link-patch --><script>
/* 深链：支持 页面.html#q<题号>，从《百日冲刺计划》一键跳到当天要背的那道题 */
(function(){
  var tries = 0;
  function jump(){
    var m=(location.hash||'').match(/^#q(\d+)$/); if(!m) return true;
    var id=m[1], nodes=document.querySelectorAll('#list .q .num');
    for(var i=0;i<nodes.length;i++){
      if(nodes[i].textContent.replace(/\s/g,'')===id){
        var card=nodes[i].closest?nodes[i].closest('.q'):null;
        if(!card) return true;
        card.classList.add('open');
        card.style.boxShadow='0 0 0 3px #c8902a';
        if(card.scrollIntoView) card.scrollIntoView({block:'center'});
        setTimeout(function(){ card.style.boxShadow=''; }, 2600);
        return true;
      }
    }
    return false;                       /* 还没渲染出来，稍后重试 */
  }
  // 大页面的 load 事件很慢，改用 DOMContentLoaded + 重试，最多约 8 秒
  function run(){ if(jump()) return; if(++tries > 40) return; setTimeout(run,200); }
  if(document.readyState === 'complete') setTimeout(run,60);
  else document.addEventListener('DOMContentLoaded', function(){ setTimeout(run,60); });
  window.addEventListener('hashchange', function(){ run(); });
})();
</script>
<!-- back-to-plan-patch --><script>
/* 返回计划：从《百日冲刺计划》跳来的页面右下角会出现返回按钮 */
(function(){
  var qs = location.search || '';
  if(!/[?&]from=plan/.test(qs)) return;
  var m = qs.match(/[?&]d=(\d+)/);
  var href = '百日冲刺计划.html' + (m ? '?d=' + m[1] : '');

  function go(){
    if(window.opener && !window.opener.closed){
      try{ window.opener.focus(); }catch(e){}
      try{ window.close(); }catch(e){}
      if(window.closed) return;          /* 关掉了：原来那个标签就停在出发那天 */
    }
    location.href = href;                /* 关不掉就本标签跳回去 */
  }

  function draw(){
    if(document.getElementById('__backPlan')) return;
    var st = document.createElement('style');
    st.textContent =
      '#__backPlan{position:fixed;right:16px;bottom:16px;z-index:99999;font-family:inherit;'+
      'font-size:14px;font-weight:700;line-height:1;color:#fff;cursor:pointer;border:none;'+
      'background:linear-gradient(120deg,#9a3b2e,#c8902a);padding:12px 18px;border-radius:99px;'+
      'box-shadow:0 6px 20px rgba(154,59,46,.34);letter-spacing:1px;'+
      'transition:transform .15s,box-shadow .15s}'+
      '#__backPlan:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(154,59,46,.44)}'+
      '#__backPlan:active{transform:translateY(0)}'+
      '#__backPlan small{font-weight:400;opacity:.86;font-size:12px}'+
      '@media print{#__backPlan{display:none}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.id = '__backPlan'; b.type = 'button';
    b.innerHTML = '\u2190 返回计划' + (m ? ' <small>D-' + m[1] + '</small>' : '');
    b.onclick = go;
    document.body.appendChild(b);
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', draw);
  else draw();
})();
</script>
</body></html>
