标志余华艺术转型最终实现的是发表于1995年的长篇小说《许三观卖血记》。《许三观卖血记》为余华的小说创作增加了新内涵。\n\n（一）“人”与“生活”的复活\n\n《许三观卖血记》中的人物走出了80年代的符号化状态，被注入了生命的血肉，抽象化的世界图景重新拥有了生活的感性力量。许三观是90年代中国文学中比较成功的文学典型之一。作家让许三观平凡的人生、朴实的话语“自动”在小说时空中呈现，并且在这种呈现中许三观的丰富、复杂、深度被无限放大了。\n\n与人的“复活”相一致，生活本身的力量也得到了有力的呈现。作者有意不对具体的时代语境和时代关系作更多的交待，而是直接让它们融入小说的叙述，与人物的生命存在发生直接的关系。小说中虽也有残酷的历史场景，但作者更多时候所努力表达的是对现实的一种理解。借助这种理解，丰满而生动的生活细节和人生情境就成了历史和现实的主体；生活本身也以自在自为的方式复活，并显现出感性的力量。\n\n（二）民间的表现和重塑\n\n《许三观卖血记》重建了一个日常的民间社会。小说中作家对民间温情、民间人性、民间伦理结构、民间生活细节和民间人生世态的展示，构成了小说艺术力量的重要根源。小说没有尖锐的矛盾冲突和情节线索，而是以民间的日常生活画面作为主体，民间的混沌、民间的朴素、民间的粗糙乃至狡猾呈现出了其原始的生机和魅力。\n\n（三）从知识分子叙事向民间叙事的真正转变\n\n从作家主体角度来看，《许三观卖血记》体现了先锋作家从知识分子叙事向民间叙事的真正转变。这是一部贯彻了民间叙事立场的小说，余华有意让民间的人生和民间的场景自主地呈现，而叙述者几乎被“谋杀”了。小说对民间叙事立场的坚持，是它能够具有巨大的民间意蕴和民间魅力的原因。\n\n三、对余华转型的评价\n\n从前期的先锋性探索到后期对生活的理解，余华在小说中完成了叙述上的一系列转变，具体表现在：从暴露叙事向隐藏叙事的转变，从冷漠叙事向温情叙事的转变，从叙述人主体性向人物主体性的转变。不过，表面看来，余华的小说经历了从具有现代感的“先锋小说”到温情的“现实主义”的转型；就实质而言，余华将充满暴力感的生存真相作为小说主要元素的叙事策略并没有显著改变。作家剔除了一切装饰性、技术性的形式因素，比较成功地构建了一种新的形式感，显示出作家艺术心态的成熟。而从形式模仿和时空分裂式的书写，到传统汉语偏向故事情节、人物命运的叙事模式的回归；从对血腥与暴力的隐含、凸显到再度消隐，余华的写作历程再次说明中国作家在20世纪末精神探寻与文学审美探寻的多重困厄。","keywords":"先锋性的探索“冷漠叙述”“文体的颠覆与戏仿”温情的“现实主义”“人”与“生活”的复活 民间的表现和重塑 民间叙事 艺术心态的成熟 多重困厄","note":"余华是中国当代最具有先锋意识的作家之一，可他的作品真正为大众接受的反而是90年代创作转型之后发表的《许三观卖血记》等作品。从80年代到90年代，余华在坚持自己核心叙事策略的同时，艺术心态逐渐成熟，艺术形式也更加完善，因而更容易被读者接受。而余华整体探索的一个过程，也可以作为研究中国当代先锋作家精神探寻与审美探寻的一个典型样本。相关内容可以参考吴义勤《告别“虚伪的形式”-（许三观卖血记）之于余华的意义》，具体资料可以在李凡文学正版群中领取。"},{"id":"384","stars":"★★★★★","title":"试分析余华小说的创作特征（26西南大学）","body":"【答题框架】\n\n余华的小说创作以90年代为界出现了一次明显的转型，但在这变化之中，却有一些因素贯穿了其整个创作历程。总体来看，余华的小说创作，主要表现为以下特征：\n\n一、苦难叙事\n\n以90年代为界期，余华的写作被一分两半：前期创作包括了那些曾经被我们津津乐道的所谓先锋小说，后期创作则以1991年的《在细雨中呼喊》、1992年的《活着》的出现为标志，这一时期余华的创作开始离开那些“先锋”色彩而向“传统”回归。不过，对于人类的苦难遭遇及承受能力的表现是从余华的前期写作一直延续至今而没有中断的核心内容。\n\n在前期创作中，余华提供给我们的世界是一个阴森、恐怖的世界，这里面充斥着“阴谋”“杀戮”“血腥”“暴力”和“荒诞”。换句话来说，环境给予“人”的毫无疑问是苦难，无论对于恶劣者还是善者。而在后期的《呼喊与细雨》《活着》等作品中，虽然温暖与明亮的光线代替了阴森恐怖的气氛，松弛与缓和代替了原来的紧张，但接连不断的苦难仍是福贵、许三观他们必须去面对的问题。\n\n所以，苦难叙事是余华一以贯之的，这其中的变化在于，余华80年代的小说表现的是人对生之苦难的直面、咀嚼甚至回味；而进入90年代，余华和他小说中的主人公面对苦难，更多的是超越之后的宁静、宽容与大度。\n\n二、从先锋性的探索到向“现实主义”复归\n\n（一）余华的小说以90年代为界显示出较为明显的转变。前期固守先锋文学的阵地，对叙事方式、语言试验、生存状态进行了大胆的创新和激进的试验，具体表现在两个方面。\n\n（1）“冷漠叙述”\n\n死亡与暴力是余华早期作品的两大主题，他总是以冷漠、中性、客观的叙述，以精微、绵密的描写，表现罪恶、阴谋、死亡、暴力、血腥及世界的混乱与悖理，深刻揭示人性之恶。\n\n（2）“文体的颠覆与戏仿”\n\n余华这一时期的作品非常富有“元小说”的意味。《鲜血梅花》《河边的错误》《古典爱情》这些通常被看做是对于武侠、侦探、言情小说的戏拟作品，参与了对于“现实秩序”的“共享”经验的颠覆。\n\n（二）余华后期则向现实主义复归，以平民姿态书写平凡人事，显示出一种淡泊而坚毅的力量。\n\n（1）在人物塑造上，后期作品中的人物不再是符号化的状态，而是变得有血有肉．\n\n（2）在表现内容上，这一时期的作品以民间的日常生活画面作为主体，民间的混沌、民间的朴素、民间的粗糙乃至狡猾呈现出了其原始的生机和魅力。\n\n（3）在写作立场上，完成了从知识分子叙事向民间叙事的转变。\n\n三、语言的音乐性\n\n余华在进行文学创作前深受音乐的洗礼，曾在随笔《音乐影响了我的写作》中谈及音乐对自己的深远影响，在《高潮》中如鉴赏乐曲那样细致地分析了霍桑《红字》音乐般的叙述和节奏。他认定了在音乐作品和文学作品中，音符的错落和音调的高低转换正如同人物的对话和情境的描写一样错落有致，婉转流动。可见余华极其重视小说的叙述节奏和音乐美感，他的小说的语言在韵律、节奏和字词重复等方面很有特色。\n\n首先，在词句韵律上，余华充分运用汉语的声响形态的特点，为言语表达增强听觉的美感。其次，余华采用描写性的词语重复和累加性的语段重复，以平缓舒展的叙述语调和富有层次感、节奏感的重复咏叹表达出一种意味深长的情感，给人以音乐的流动感。每一个重复的运用都可以说是作者的独具匠心，不容小觑。","keywords":"苦难叙事 先锋性的探索 向“现实主义”复归 语言的音乐性","note":"余华的小说创作，从前期的先锋性探索一变为“现实主义”，在叙事态度、叙事立场等方面都发生了明显的转变，但在这变化之中，有一些因素却一以贯之，即苦难叙事和语言的音乐性。大家在作答时，第二点内容需要将上一道题中的具体内容给补充进来。相关内容可以参考郜常宝《余华创作中的苦难意识》、齐红《苦难的超越与升华-论余华小说中的“苦难”主题》，具体资料可以在李凡文学正版群中领取。"},{"id":"385","stars":"★★★★","title":"以一部小说为例，说明余华小说的先锋特质","body":"余华是当代中国最具先锋意识的作家之一。他的创作深受川端康成、卡夫卡等人的影响，而他在80年代的小说带有很强的实验性，充满了先锋性的探索。这里试以《鲜血梅花》为例，为大家分析余华小说的先锋特质：\n\n一、“冷漠叙述”\n\n余华的特殊之处在于其笔下对意象的冷静叙述，也正是冷漠的零度叙事状态使小说主题获得锐利的批判锋芒。《鲜血梅花》采用第三人称的客观叙述方式，即“无我的叙述方式”，以冷漠的陌生者姿态，波澜不惊地描述暴力、死亡与血腥，作者所展现的是人的丑恶本性与血腥泛滥的世界，甚至对复仇本身、传统旧社会的吃人现象都剥离了叙述情感，通过黑暗世界的客观呈现让读者触及人性的真实，以丰富的语言与细节描写结构全篇。\n\n死亡与暴力是余华早期作品的两大主题，他总是以冷漠、中性、客观的叙述，以精微、绵密的描写，表现罪恶、阴谋、死亡、暴力、血腥及世界的混乱与悖理，深刻揭示人性之恶。《鲜血梅花》对暴力也有表现，不过较为含蓄隐晦，梅花剑上红色的渲染是对暴力的隐喻，梅花剑上最终没能新添一朵梅花而锈迹斑斑表明对暴力的否定和生存的缺憾，余华将暴力血腥因素转向幕后叙述，隐晦地暴露人性的冷酷。\n\n二、“文体的颠覆与戏仿”\n\n余华小说的先锋性除对暴力和死亡的沉迷和欣赏之外，还体现在对传统小说程式的颠覆性戏仿。源自于对古典武侠小说叙事模式的戏仿，《鲜血梅花》以江湖复仇情节为主题、主人公的江湖游历与武林高手的偶遇贯穿其间，以鲜血浓缩为袖珍梅花的喻示渲染了浓郁的武侠传奇色彩。小说复仇模型与鲁迅的《铸剑》异曲同工，摒弃了传统武侠江湖中快意恩仇、刀光剑影的经典戏剧性模式，当阮海阔若即若离的复仇使命被逐渐模糊化而随波逐流时，反而在帮助胭脂女和黑针大侠途中借由他人之手完成复仇。因此，复仇作为小说叙事动力却伴随着行为主体的缺失，唤醒了对复仇恶行本质的抗拒与人性自由的呼唤，复仇主线由江湖漫游替代，传统武侠小说的经典模式被彻底颠覆。\n\n三、尖锐的否定性\n\n先锋具有尖锐的彻底的文化批判精神，它始终保持着对于主流文化的挑战者姿态，对一切现成的理性逻辑和社会秩序都抱怀疑态度。在暴力形式之外，先锋意识常受虚无主义支配而反叛一切传统文化观念，先锋小说打破传统文学格局，在思想上以“后现代之行”行“现实性之实”，以激进的解构对传统、历史和现实进行否定，披揭存在的荒诞现实和荒诞人生的焦虑与无奈。《鲜血梅花》中有复仇情节却无仇恨的情感，有寻找的目的却失去了复仇的对象主体，只有武侠小说的模式却消解了爱恨情仇的意义，外在形式的存在最终指向的是对自身的否定。小说结局处仇人已死的答案是阮阔海三年后在白雨潇处得知的，复仇的间接实现也使其意义訇然消解，遁入虚无的荒诞境界。\n\n【李凡关键词：“冷漠叙述”第三人称客观叙述方式 含蓄隐晦“文体的颠覆与戏仿”戏仿古典武侠小说叙事模式 尖锐的否定性】","keywords":"","note":"余华是中国当代最具先锋意识的作家之一，其80年代的创作展示出了鲜明的先锋性特质，而《鲜血梅花》是余华先锋小说的代表作品之一，集中将余华的先锋性特质体现了出来。此外，有可能将《鲜血梅花》与《铸剑》进行对比，进而将鲁迅与余华这两位极富先锋意识的作家进行对比，大家也要注意一下。相关内容可以参考倪伟《鲜血梅花：余华小说中的暴力叙事》、彭宏《先锋与武侠：歧路交叉的双重可能-重读余华的＜鲜血梅花）》，具体资料可以在李凡文学正版群中领取。"},{"id":"386","stars":"★★★★★","title":"谈谈你对余华《活着》这部作品的认识","body":"《活着》是余华转型后的首部长篇小说，小说从叙述者“我”在夏日阳光下听福贵老人讲他的人生故事开始，回顾了福贵40年的生活，标志着余华从先锋立场回到现实主义立场。\n\n一、思想内容\n\n（一）“反写”当代历史，揭示被权威历史叙事遮蔽和妖魔化的人的命运\n\n《活着》以极致的笔法讲述了一个关于死亡的故事。主人公福贵从一个游手好闲的赌徒，家财万贯的恶少，到输光家产，变成一个一文不名的可怜虫。其间他承受了家道败落的打击和沦落人下的屈辱，其“人性”也在这种惩罚中得以慢慢地恢复。然而，命运对他的惩罚还刚刚开始，在新中国成立后的生活中，他陷入了厄运的深渊，七位亲人先后因为天灾或人祸而离去。最后，年迈的福贵只剩下了一头与他相依为命的老牛，在田间艰难耕作，苟延残喘。显然，《活着》是一部当代历史的“反写”，革命叙事讲述的是穷人的翻身，它讲述的是富人的败落。在这个意义上，《活着》揭示了历史背面那些被掩埋的人和事，见证了被权威历史叙事所遮蔽和所妖魔化了的人的命运。\n\n（二）表现对于承担苦难能力的肯定，对于保持“活着”的生命信念的肯定\n\n《活着》具有一种超越现实的力量，它并不局限于对某一具体的社会时代的批判，而力图抵达对人类命运的理解。余华曾说，《活着》“讲述了人是为了活着本身而活着的，而不是为了活着之外的任何事物而活着”。《活着》其实试图回答的是这样一个问题：如果活着意味着苦难，如果苦难并不来自社会的不公，如果苦难并不能获得彼岸的救赎，那么，人是否还有必要活着？显然《活着》的回答是肯定的：人应该活着，并且，对这个人生存其间的世界心存善意。苦难叙述不是目的，承担能力才是余华《活着》这部作品执着的表达。余华的小说《活着》上演的其实是一出由死亡连缀的生命悲剧，直接将主人公安置在生与死的搏斗和抉择中，以此来考量人保持“活着”的生命信念和生命的基本品质。\n\n二、艺术特征\n\n（一）采风人和老人双重声调的叙事结构\n\n《活着》采用了采风人和老人双重声调的叙述结构，采风人在文本中起串场的作用，将故事的真正讲述者引出，之后他便退居幕后，成为故事的聆听者。同时，采风人还会在叙述的最关键时刻，跳出来暂时中断老人的讲述，使叙述在高潮到来后自然地降落，节奏得到以缓冲。而叙述的中断恰恰是对叙述的强调，高潮的降落是为了迎接下一个高潮。在波荡起伏的段落之后，短暂的停顿和安详的气氛带来更加有力的震撼，同时留下时间和空间让读者自己去品味和体验人物内心巨大的悲痛之声。\n\n（二）重复叙事\n\n福贵身边亲友的几种死亡存在着这样一种程式：死亡的程式。七个亲人虽然名字身份不同，但对情节发展而言，七个亲人皆属于一个行动元-命运不幸的承担者，其内在身份是一致的。无论七个亲人死的历程是如何干变万化，都具有相同的所指功能-遭受死亡。死亡的重复在由死活构成的二元对立中起到了对活着的强调作用，使活着自身的存在突兀出来。\n\n《活着》之所以感动人，就是因为作家将一件件死亡事件写为死亡的音符，有轻重，有长短，有步骤，有规律地构成一个个死亡的旋律，谱写成了一曲复调的死亡悲歌，触动了读者对死亡的记忆和宣泄。\n\n（三）平实舒缓的叙事语调\n\n《活着》采用了最单纯最朴素的叙述声调，平实的语言，单纯的句式带来扑面而来的温情和熟悉的亲切感，引起读者情感声调的激荡和共鸣：叙述声调的安详平静与人生苦难的沉重形成了巨大的情感张力，作者从容不迫，举重若轻的声调承载了生命沉着结实的重量和苦难。浩瀚无边的空旷，使文本具有了巨大的艺术感染力。如福贵老人用平稳朴素的声调讲述了一次次接踵而至的生命苦难，朴实的叙述对每一次灾祸过后任何可能的激烈的内在情感都进行了有力地克制，内在的心理活动被哭泣等外部动作无声地置换，为读者的情感地进入留下了空间，引领读者不知不觉间将它填满。\n\n（四）采用民间叙事立场，注重对民间的表现和重塑\n\n在《活着》之中，余华有意摒弃宏大叙事，通过琐碎的庸常生活描写，展示民间世界不无苦涩然而恬淡自在的面貌。小说的主人公福贵是为人们所熟悉和感到亲近的、生活在社会底层的农民，他的生活始终围绕着生计打转。在作品中，庙堂文化与民间文化和谐地共处一室，历史对于个体的苦难在民间的自在生活中被淡化。\n\n在《活着》中，我们可以强烈感受到民间特有的文化气息。家庭生活的平庸与琐碎人物语言的个性与平实，民间生活的丑陋与高尚，为我们展示了民间这个生活大舞台的本真面貌：嬉笑怒骂皆形于表，没什么好掩饰的。余华让民间的一切都在\n\n这里自然地展现，没任何主观臧否。他所做的仅仅是叙述，其余的则留待读者咀嚼。\n\n三、福贵的形象\n\n福贵的一生可以说是人类生存状况的普遍写照，他的生存可以上升为一部生存寓言，这一形象，主要具备以下特征：\n\n（一）坚韧的生存意志\n\n小说的结尾，与福贵相依为伴的老牛，具有一种象征意义。那是一头正待宰杀濒临死亡的老牛，因为不愿看着老牛再哭，早已经没有眼泪的福贵买下了它，给它取了个名字也叫“福贵”。福贵赶着老牛去犁田，在吆喝福贵的时候，嘴里也喊着所有死去的亲人的名字，好像他们也都是些埋头犁田的牛。在中国人的眼里，终日劳作的牛，象征着忍耐、坚韧和持久，这头默默耕作的老牛，何尝不是小说中福贵他们忍受苦难的象征呢？\n\n因为无力主宰自己的命运，福贵是弱者中的弱者，因为生命坚韧的顽强张力，福贵又是强者中的强者。他被无常的命运颠来簸去，不由自主，但命运终究还是奈何不了他。福贵，虽然不是一个命运激烈的反抗者，却是一个命运的承受者，他在这种承受中走向了达观和超脱，领悟了人生无常的宿命。他在承受与忍耐中获得了生命自身的某种快乐，在抗争外部侵犯的过程中获得了生命的自身价值。\n\n（二）乐观的生活态度\n\n福贵作为《活着》的主人公，是以歌声出场的，他的出场让人丝毫联想不到曾经在他身上发生过那么多不幸的事情。因为他的快乐感染着我们每一个人。福贵牵着一头老牛，在阳光正浓的树阴下向我们讲述着他的一生，在亲人纷纷离去的孤寂中，老人用自己诙谐的方式演绎着生命的韧性和力量。没有悲伤，没有痛苦，只有怀念，在爽朗的笑声中，老人流露出仁厚亲切的高远情怀，溢出了一种昂扬乐观的精神内核。\n\n福贵爽朗的笑声是发自内心的，并不是从饱经风霜的老脸上挤出的一丝勉强的笑容，而是在经历了人世沧桑变化后一种释怀的微笑，他的笑声串联起了他的“悲惨世界”。从福贵的身上，我们看到了中国这一古老民族的某种精神原型：于苦难的生命中抗争不止，在生命的宣泄中又保持节制，于命运的静态承受中包孕着对生命的执着，在执着外化的同时又包含了历经沧桑的人生体验。","keywords":"思想内容“反写”当代历史 揭示人的命运 对承担苦难能力的肯定 对生命信念的肯定 艺术特征 双重声调 重复叙事 平实舒缓的语调 民间叙事立场 对民间表现和重塑 福贵形象 坚韧的生存意志 乐观的生活态度","note":"余华被讨论最多是《活着》和《许三观卖血记》两部作品，后者在艺术上受到了更多的肯定，但前者无论是改编的电影还是小说本身的流传度似乎都更广一些，同时在考查中出现也更多，无论是名词解释还是论述题，故此我们重点关注的是《活着》这部作品。对于这部作品的思想内容，从现实主义的角度考察，是“反写”历史，具有揭露意义；从现代主义的角度考察，则是体现出了对承受苦难能力的肯定和对生命信念的肯定。在艺术上，《活着》使用采风人与福贵双重声调、重复叙事手法，用平实舒缓的语调坚持了民间叙事立场。在人物塑造上，《活着》塑造了福贵这样一个坚韧、乐观的形象。相关内容可以参考李娜《笑着活下去-余华＜活着＞中主人公福贵的生存启示》、逯红梅《论＜活着》的叙事美学风格》，具体资料可以在李凡文学正版群中领取。"},{"id":"387","stars":"★★★★","title":"结合作品情节，探析余华小说《活着》中的徐福贵与鲁迅笔下的阿Q形象之异同，并探析一下主要原因（24北京师范大学）【答题框架】","body":"在中国现当代文学的人物长廊中，福贵和阿Q无疑是两个极具代表性的悲剧性形象。他们同样深陷生存困境，却以截然不同的方式面对苦难，最终走向不同的精神归宿。这两个形象的异同及其背后的深层原因，主要表现在以下方面：\n\n一、福贵与阿Q形象的异同\n\n（一）都陷入了生存困境，但具体生存状况不同，与现实的关系也不同\n\n阿Q的生存状态就是当时中国普通人民的生存状态，这主要有两个特点：一是苟延残喘的贫困，二是朝不保夕的不安稳。可以说，阿Q生存的时代是一个黑暗腐朽的时代，是一个残酷、无人性的时代，一个愚昧无知的时代。从阶级属性而言，他是一个流浪雇农，是受压迫、受剥削的广大劳动群众的一员。\n\n同样，福贵的一生是苦难的一生，是悲剧的一生。他从早期的地主家庭坠入到了贫困的雇农家庭，亲身参演和见证了自己家庭的败落。他先后经历了解放战争、大跃进、人民公社化运动、“文革”等重大历史变迁。在近四十年里，他从死人堆里死里逃生，见证了一家四代所有亲人的死亡。他曾经有过一个完整的家庭，但是最终被苦难、命运和社会剥夺得一无所有。\n\n不过，从两人的生存状况看，福贵除了在战场上碰到的特殊例外，基本上有房住，有饭吃，而阿Q则既没有房住，也没有可靠的食物来源。阿Q没有父母，甚至不知道自己真正的姓氏，他不识字，害得叙述者也不知道他的名字该怎样写，只好无中生有，用外来文字拼成Quei，略作阿Q。福贵则不但有名有姓，渊源有自，而且含义明确：“我爹指望我光耀祖宗。”福贵曾经有儿有女有外孙，而阿Q就悲惨多了，终身孤家寡人，对异性的最深的认识是曾经摸过小尼姑的脸。\n\n由于生存状况的不同，福贵与阿Q两人与现实的关系便有很大区别：一直到死，阿Q始终与现实处于一种紧张与冲突之中，他无力改变现实，便转而在内心里取得虚幻的胜利，这种“胜利”凸显了他的虚弱；而福贵的后半生虽然遭遇越来越沉重的打击，他却与现实和解了，心中非常坦然，显得坚强无比。\n\n（二）都寻求方法来超脱苦难，但具体方式不同\n\n对阿Q来说，生活意味着一系列的挫折，对福贵则是不断的死亡。两者面对的灾祸和苦难都有加重的趋势，绝不是简单的重复。面对这些越来越深重的苦难，阿Q和福贵都寻找属于自己的方式去度过，这表现在《阿Q正传》里是“精神胜利法”，而在《活着》里则是“忍受”-当然作家有时候会使用其他字眼，如“忍耐”“熬”等，意思一样。\n\n为了摆脱困境，阿Q常常在想象中把自己抬到高于别人的地位，而这种空洞的想象很快被人破坏，于是他便陷入自轻自贱之中。在封建社会森严的等级制度中，阿Q不愿承认自己卑下的社会地位，不愿承认别人的歧视和嘲弄，可自身的弱小又导致被人欺辱是不可避免的。阿Q只能一方面承受欺辱，另一方面希翼通过欺辱别人来证明自己。由此，阿Q处于总是受人欺侮，而本能上又不愿承认这种受欺侮的社会地位，于是，“精神胜利法”便成了他唯一的思想武器。\n\n而相反，福贵的精神和意志之所以如此坚强和坦然，那秘密就是把自己的需要降到最低，只以活着为目的。对命运的压迫，不反抗，连喊叫也没有，忍受一切不公，就是最大限度地降低生命的精神和物质需求来达到延长生命的目的。衡量人生价值的唯一尺度就是生命的长短了，由于福贵有比别人多得多的死去的理由，可是他却活着，因此在余华看来，他就成了“这个世界上对生命最尊重的一个人”。\n\n二、福贵与阿Q形象产生如上异同的原因\n\n（一）时代的差异\n\n阿Q与福贵的差异，我们可以理解为这是时代的差别，时代的精神渗透到作家的心灵中，表征为这两个“典型”的人物形象。作为一个启蒙者，鲁迅的悲观主义源于对生命的伟大的期待，阿Q死后，留下的是一连串的不满；《活着》的结尾，田野趋向了宁静，那种祥和的描述，反映的是精神的“犬儒”：“做牛耕田，做狗看家，做和尚化缘，做鸡报晓，做女人织布”甚至“皇帝招我做女婿，路远迢迢我不去”这样的自鸣得意也成了自我安慰。其中原因，可能在于余华的人物正好诞生于1980年代末1990年代初这一特殊历史时期，所谓“新启蒙”被知识分子抛弃了。\n\n（二）作家文艺观的巨大不同\n\n除了时代精神状态的变化，两位作家的文艺观的巨大不同可能也有作用，他们对自己的叙述与其人物的关系作了相当不同的理解。鲁迅曾在《我怎么做起小说来》中，特别强调自己翻译介绍外国文学作品主要搜求倾向“叫喊和反抗”的，自己做小说也因此是要“改良这人生”，“所以我的取材，多采自病态社会的不幸的人们中，意思是在揭出病苦，引起疗救的注意”，作为启蒙者，他是高于生活和人物的，他是医生，而社会和人物是病人。而曾经做过牙医的余华不这样理解文学，在《永存的威廉·福克纳》中，他借纪念福克纳的机会表示，“他就是这样一位作家，写下的精彩篇章让我们着迷，让我们感叹，同时也让我们发现这些精彩的篇章并不比生活高明，因为它们就是生活。他是这个世界上为数不多的始终和生活平起平坐的作家，也是为数不多的能够证明文学不可能高于生活的作家”。这里变化的，与其说是作家对于文学力量信心的下降，不如说是主体精神力量的下降。","keywords":"形象的异同 生存困境 具体生存状况 与现实的关系 阿Q 紧张与冲突 福贵 和解 超脱苦难 具体方式不同** --- # 精神胜利法 忍受 原因 时代的差异 文艺观的巨大不同","note":"在许多院校的考查之中，鲁迅和余华往往会放在一起进行对比，而这种对比又是多层次的，既有作家层面的对比，又有作品层面的对比。而在作品层面的对比之中，二人题材近似的一些作品往往会被放在一起，比如《活着》和《阿Q正传》、《狂人日记》和《四月三日事件》等。大家在作答类似的题目时，既要注意到作品层面的异同，又要注意到作家文艺观等方面的异同，更要注意到时代的区别。"},{"id":"388","stars":"★★★★★","title":"试比较鲁迅与余华创作的异同","body":"余华的《四月三日事件》发表之后，就有人将其与鲁迅的《狂人日记》联系起来。而实际上，余华与鲁迅的相似，是整体性的，并不局限于某个作品。但毕竟两位作家处于不同的时代语境下，写作习惯、创作风格各有不同，所以二者的作品也有差异。具体来说，二者创作的异同，主要表现在以下方面：\n\n一、都关注人性的阴暗残忍，但具体态度不同\n\n余华写出了人性的邪恶、凶残，写出了相互敌视、相互残害的人与人之间的关系。鲁迅在许多小说中，也同样关注了人性的阴暗残忍，也同样展示了人与人之间的冷漠敌对。鲁迅也同样看到了余华所看到的人世风景。这是两位小说家之间的相同之处。\n\n不过，鲁迅虽然也致力于写人性之恶，但鲁迅从不溢恶，这一点鲁迅与陀斯妥耶夫斯基相同而与余华相异。余华在对人的现存状况感到不满的同时，也放弃了对人能以更好的方式存在的希望。他之所以热衷于溢恶，之所以那样冷静、从容、客观地描写着人类之恶，是因为已经把恶当做不可改变的既存事实接受下来了，是因为已经认可了恶的合理性和永久性。而鲁迅则不同。鲁迅在思想上曾深受尼采影响。在对人的认识上，鲁迅也曾与尼采相通。尼采是对人的现存状况极为不满的，但是，尼采又从未对人失去希望，或者，从未允许自己对人失去希望。鲁迅虽然认为尼采的超人太渺茫，但却也对人不肯绝望。在坚定地否认了人的现存状况的同时，始终怀有对人类变得更加高尚更加美好的希望。\n\n二、都具备先锋性的因素，但有无意识和自发的不同\n\n余华是中国当代最具有先锋意识的作家之一，这一点已经毋庸置疑。余华80年代的小说创作充满了实验性，体现出了余华对先锋性的探索。90年代之后，余华的创作虽然发生了转型，但其核心叙事策略没有发生改变。而把鲁迅的小说放到今天的后现代语境中，我们发现它先锋而前卫。我们在先锋作家作品中看到的所谓“叙事实验”“语言狂欢”等等，在鲁迅那里就有。比如《狂人日记》体现出了元小说技法，《祝福》显露出了多视点与重复性叙事的叙事实验等等。\n\n不过，在鲁迅创作小说时，海德格尔、雅斯贝斯尚未成名，而萨特、加缪还是涉世未深的小青年。鲁迅的这些小说创作呈现出某种超前性、先锋性，并未受到这些作家影响。而余华等先锋小说作家的创作，是受到了西方现代主义文学思潮影响的。换句话说，鲁迅这先锋性的探索是无意识的，而余华的先锋性探索是有意识的。\n\n三、都关注暴力书写，但具体尺度不同\n\n鲁迅与余华的创作都未脱离暴力母题，但在暴力行为过程的书写方式与暴力本质的阐述上，看似相近的同时却又大相径庭。\n\n鲁迅书写暴力，是充斥着恶却不将恶的暴力表征放大异化，不断理性观照着现实世界，只为传情达意，点到即止。其暴力叙写注重的是丑恶事物背后潜藏的精神杀戮，是以表象的暴力反映人的意识活动，从而挖掘社会与人性的可悲与可怖。他将观照邪恶势力的毁灭行径如何造成人的无力与绝望置于优势地位，而不认为放大肉体暴力、令其更加直观就能使读者产生思考。\n\n余华对鲜血淋漓的肉体则是近乎痴迷了，他将肢体暴力作为一种典型的叙事对象。余华的暴力叙写脱离了丑恶行为与恶人表征挂钩的表现方式，转而“成为一种普遍意义上的生存景观，是几乎所有人都或明或显存在的一种普遍人性”。他相信精雕细刻、具象而直白的撕裂与毁灭，将进射更磅礴的言语力量，使人能够正视自身嗜血的本能，警醒历史的暴力性带来的恒久损伤。\n\n四、都诞生了疯子形象，但象征意义不同\n\n在身体、精神暴力关注的基础上，二者的创作中诞生了一批暴力形象-疯子。不过，在鲁迅文学创作中，“疯子”往往象征着先觉个体，并且他们是肉体和精神暴力的被施暴者。鲁迅的疯人，强调的是旧文化对先觉者实施的暴行，因而呈现出悲壮的英雄色彩，暗含着无尽的苦闷无力。\n\n而余华笔下的疯子是“彻底改写人的欲望、精神、历史和文化的内在结构”的，更加接近我们常规认知中的疯人。他笔下的疯子往往携有怀疑文明世界、怀疑理性的力量。余华笔下的疯人，一方面揭示了理性外的真实的“恶”，一方面成为一种历史观照-是历史暴力的残杀促成人的异化，使这种本性之恶歇斯底里地爆发出来。\n\n五、都塑造“看客”形象，但具体特征不同\n\n有暴力，有被施暴者，就必然产生对此残酷场面的围观，因而诞生一批“看客”。“看客”这一形象，在20世纪中国文坛以无名状态彰显着时代精袖征候，在不同时期反复出现，也在鲁迅与余华的作品中得到了集中表达。\n\n不过，在参与方式上，鲁迅笔下的看客更加倾向于观望，将肉体残害的任务交予“行刑者”；余华笔下的“看客”则是部分加入驻足的人群当中，部分要更进一步，成为虐杀的主角。而在窥视范围上，余华将“看客”“看”的范围由直观所见拓展到了隐晦、私密的个人生活与精神领域最后，在精神面貌上，鲁迅笔下的“看客群体”无知无觉，余华则更多道出了个性鲜明的人性之恶。","keywords":"关注人性 具体态度不同 先锋性 无意识 自发 暴力书写 具体尺度不同 疯子形象 象征意义不同“看客”形象具体特征不同","note":"余华和鲁迅无论是在创作理念，还是在艺术特征上，都有很多相似之处，所以很多学者会将这二位放在一起进行对比，在考查中也有可能出现类似的题目，大家要关注一下。同时，大家要注意的是，将二人进行对比时可能会从具体的作品出发，如将《狂人日记》和《四月三日事件》、《铸剑》和《鲜血梅花》放在一起对比，大家对于这些相似的作品也要了解，在作答时注意结合作品。相关内容可以参考王彬彬《残雪、余华：真的恶声？-残雪、余华与鲁迅的一种比较》、徐葭思《辨析余华对鲁迅暴力叙写与国民性批判的继承与发展》。"},{"id":"389","stars":"★★★","title":"残雪小说创作的特征","body":"一、通过构筑变异、荒诞的世界，表现出了人本质性的丑陋特点\n\n残雪的小说是“文革”后文学创作中非常独特的存在。她用变异的感觉展示了一个荒诞、变形、梦魇般的世界，阴郁、晦涩、恐惧、焦虑、窥探和变态的人物心理及人性丑恶的相互仇视与倾轧，在她的作品中纠缠在一起，不仅写出了人类生存的悲剧，而且写出了人的某种本质性的丑陋特点。残雪小说的这一特点与西方现代荒诞小说似乎很接近，但其传达出的生命本体的苦痛，涌动出来的对生存的深刻绝望和绝望边缘的呐喊和挣扎，绝不仅仅是对西方现代荒诞小说的简单模拟，而是与她所生存的现实、所经历的历史有着密切的关系，她所叙述的场景常常使我们想到文化大革命期间人人都可能被窥视与告密，人与人之间互不信任，为了保存自己而不惜出卖别人，就是家庭亲人之间也互相设防，自私、无情的情形。\n\n二、强烈的现实战斗精神\n\n当残雪把生存的荒诞体验和绝望感受落实于具体的时空背景下时，她对于人性丑恶与残酷的揭示就具有了一种强烈的现实战斗精神，就有了试图改变这种处境的社会性使命。“心中有光明，黑暗才成其为黑暗”，由此，一种抗争现实残酷、人性丑陋的生命之光就燃烧于她的作品中，于绝望中保持生命的存在，于虚无悲观中渴望天堂的美丽。\n\n三、总体上给人一种噩梦般的印象\n\n残雪的小说总体上给人一种噩梦般的印象，像《山上的小屋》《黄泥街》《苍老的浮云》《我在那个世界里的事情》等，每一篇作品都充满了变异错乱的感觉，故事环境无一例外使人感到恐怖和恶心，人物居于其中总有宿命般的恐惧感，或者也可以说，他们已蜕化为某种恐惧心理的象征物。\n\n短篇小说《山上的小屋》是残雪的代表作之一，它记录了一种对于现实生存的特殊把握，写出了生存中的噩梦般的恶与丑陋的景象，也刻画出了人们找不到救赎与解脱的焦虑体验，但同时这描写包含了否定的向度，它将生存揭示得如此令人厌恶，也即是表明了它的无意义。这篇小说引人注目的地方还在于，它开拓了一种非常态的语言和审美空间，语意上的含混和不合逻辑、审美上的恶感与虚幻性，都是借以表达那种噩梦感受的不可分割的形式，与此同时，这也就造成了作品独特的审美效果：仿佛有一道超现实的光亮撕裂了生存的景象，而把它背后那种种晦暗的所在都呈现了出来。","keywords":"本质性的丑陋特点 荒诞体验和绝望感受 现实战斗精神 噩梦般的印象","note":"残雪小说整体呈现出荒诞、绝望的气氛，和西方现代荒诞派小说类似，但其中却蕴含着强烈的现实战斗精神。大家在作答时，要记得把握住这些根本性的特征，结合作品具体分析。近年来残雪的小说明显受到了更多的关注，更是诺奖的热门人选，所以对于这部分内容我们也要重视起来。"},{"id":"390","stars":"★★★★","title":"试述新写实小说的主要特点及其局限性","body":"新写实小说产生于20世纪80年代中期，以池莉、刘震云为代表作家，在当时文坛上产生了不小的影响。其主要特点有：\n\n一、以写实为主要特征的创作方法\n\n新写实小说正是对含有强烈政治权力色彩的创作原则的拒绝和背弃，它最基本的创作特征是还原生活本相，或者说是在作品中表现出生活的“纯态事实”。无论是还原生活本相，还是纯态事实，其实都只能看作是作家故意选择的一种相对“客观”的创作态度，但其意图所在却明显是要清除观念形态（尤其是政治权力意识）对现实生活的遮蔽，消解强加在生活现象之上的所谓“本质”，以求复原出一个未经权力观念解释、加工、处理过的生活的本来面貌。\n\n为达到这一的效果，新写实小说在创作方式上有意瓦解了文学的典型性，以近似冷漠的叙述态度来掩藏作者的主观倾向性。可以说新写实小说的革新意义，首先就在于使生活现象本身成为写作的对象，作品不再去刻意追问生活究竟有什么意义，而关注于人的生存处境和生存方式，及生存中感性和生理层次上更为基本的人性内容，其中强烈体现出一种中国文学过去少有的生存意识。\n\n二、“零度叙事”\n\n新写实小说采用“零度状态”的情感模式，隐匿式的缺席式的叙述，客观冷静地呈现人类生存本相，对含有强烈政治权力色彩的创作原则给予拒绝和背弃，力求复原出一个未经权力观念解释、加工、处理过的生活的本来面貌。相对于传统的现实主义，这种叙事方式在主体性方面显得比较冷漠暗淡，即所谓“消解激情”的写作，也就是评论界所归纳的，新写实小说取消了作家的情感介入，以一种“零度情感”来反映现实。\n\n它主要表现为叙述者的功能弱化倾向，即新写实小说的叙述者往往是比较单纯的旁观者，他不像传统小说的叙述者那样能随意进入到被叙述人物的心理中去做洋洋洒洒的分析，也不会经常进行深入的自我阐释，即便偶尔发表几句意见，多半还是采用自由间接语体的形式，将其含混在人物意识之中，并不显示出明确的判断倾向。这样一来，作家的主体观念与情感态度都没有直接的机会呈现在文本层面，当然，根本上依旧不可能取消主体对文本的支配力，只是这种支配力相对变弱了。\n\n三、消解人物性格\n\n与凡俗性的叙述内容密切相关的，是新写实小说在叙事方式上也必然具有一些新的特点，在很大程度上，它们消解了传统意义上的情节构成与典型人物塑造，以往小说必不可少的戏剧性情节转换为琐碎的生活流过程，使小说中的事件以看似未经加工的偶然无序的状态呈现出来，人物的思想行为也随生活状态不同而随机变化。既然取消了典型性格，也就自然削弱了存在于人物背后的意识形态内容。人物内心的精神力量被消解殆尽，他们生活在机械的生活潮流中，随波逐流是其主要的生活状态。\n\n四、强调心理化的“真实”\n\n新写实小说作品强调心理化的“真实”，叙述细节上带有更多个性特征的感情色彩。例如在方方的《风景》中，“我”作为一个亡灵的叙述，能够知道家中每个人的真实心理活动，而《暗示》中患精神病的妹妹总是在强调的“暗示”，则是一个重大的细节揭示。\n\n五、消极色彩与逃避现实生活的倾向\n\n新写实小说“零度叙事”的这种倾向的价值仍在于突现出生存本身，以及相应的对于知识分子主体精神的存疑态度，但不难看出其中明显存在着某种消极效果。这就是作品中对所描绘的那种平庸无奈的现实生存状况逐渐丧失了批判的能力，所有改变现实的理想因素都被消解，最后存留下来的潜在态度无非就是迁就、认同于这种本来极需改变的现状。新写实小说愈加呈现出低落的灰冷色调，以及随后延伸出某些明显逃避现实生活的倾向。","keywords":"还原生活本身 零度状态 消解人物性格 心理化真实 消极色彩","note":"80年代中期我国文坛的“新写实”小说是一个拥有众多作家的复杂创作现象，是现当代文学考查的一个重点，它的具体特征，我们需要仔细掌握。新写实小说是以描写现实生活中平常琐事为题材的小说，笔墨淡雅，缺少激动人心的故事。新写实小说“零度叙事”的倾向在突出生存本身价值的同时，也会削弱甚至丧失批判能力，具有一定的消极效果。"},{"id":"391","stars":"★★★★","title":"试分析新写实小说与现实主义的区别","body":"新写实主义是在新的历史条件下形成的一种新的创作原则，它和现实主义有着众多相似之处，但它在实际上既偏离了积极参与现实的现实主义精神，也放弃了塑造典型环境中典型人物等一系列现实主义传统的创作手法，它和现实主义已是貌合神离。下面我们将在展开的论述中，仔细分析比较一下新写实主义和现实主义的不同审美特征。\n\n一、文学观念：反映与体验\n\n现实主义文学和新写实主义文学都是关注现实的文学，但它们两者关注现实的方式并不同，现实主义文学强调要反映生活，而新写实主义则强调要体验生活。\n\n现实主义一方面强调要如实地再现客观现实，而另一方面则又强调要反映生活的本质，一方面强调要做革命的镜子和历史的书记，另一方面又宣称要做人类的灵魂工程师。现实主义大师们都自觉地以强大的理性力量来解剖社会并取得了成功。\n\n新写实主义作家不致力于通过小说来揭示社会生活的本质，因而往往不重视意义的深刻程度。新写实主义更重视的是生活，是生活体验的审美化；注重对现实生活的感性体验，在对现实生活作原生化描绘中表现各种生存状态下的人的行为、感觉、情绪，对世俗社会进行重新观照，使读者在细细品味中达到作者和读者的融合。\n\n二、人物塑造：典型与普通人\n\n现实主义最杰出的成就就在于典型环境中典型人物的塑造。只有塑造了典型人物的现实主义作品才能被称为是成功的现实主义作品。现实主义大师为我们塑造了一个个光彩照人的人物形象。这些典型人物以其鲜明独特的个性，复杂多重的性格和蕴藏着的深广的社会历史内容给读者以极其鲜明的印象，有着丰富的内涵和难以尽言的美学蕴含。\n\n新写实主义作家放弃了典型人物的塑造。新写实主义崇拜的是生活，相信的是生活真实，他们认为典型人物是作家拔高生活的产物，处处透出人工的匠迹，且常常树起虚假的典型。所以新写实主义作家致力于写芸芸众生，写普通人的生老病死、柴米油盐。从琐细而平庸的生活中咀嚼人生的酸甜苦辣，生活平平淡淡，没有大波大折，大喜大悲。性格也善恶难分，既非奸恶之徒，也非英雄烈士，恪守着做人的本分，就和生活在我们周围的人一样普普通通。\n\n三、主题与题材：集中与消解\n\n现实主义与新写实主义都是写现实的，表面上看它们是相同的，但其实它们两者在写什么和怎么写这两方面都存在着很大的差别，这也反映了两种不同的认识世界的方法和角度。\n\n现实主义把主题视为一部作品的灵魂，所有素材都不是孤立的，而是由主题将它们联结在一起。作品中每一个事件也不是分散的，它们都由因果律支配，一个事件的发生带动着另一个事件的产生，一个个事件的不断推进导致主题的逐渐显露。\n\n相比之下，新写实主义小说的一个明显的特征就是主题的模糊乃至消解，作品常常没有明确的意义指向。作品的内部结构就相对显得松散。题材不再是为主题服务，而是为自己服务。作品中的事件也不再围绕着一个问题展开或事件与事件之间有着密切的因果联系，而是按照生活的模样，把事件组装成一个松散的联盟。相关但不相连，这是新写实主义作品内部结构的显著特征。\n\n四、语言叙事：严谨与空白\n\n现实主义文学是严谨的文学，它遵守的是因果律和必然律。从叙事上看，现实主义多采用第三人称的全知视角，作者是整部小说中发生的事件的总导演，因此小说在布局上有条不素，在情节推进上因果相承，前后呼应，结构严谨，是一个自足的封团型故事体系。从语言上看，现实主义认为语言是传达自已思想感情的工具，因而追求语言的描写性，以能准确传神地再现现实和内心世界为最高目标。这两个方面构成了现实主义文学严谨的风貌。\n\n新写实主义强调的不是严谨而是自然，常常采用一种非人格化的叙述方式，叙述人所知道的虽然比人物所知道的要多得多，但又不是全知的，叙述人在叙述过程中有意加以省略，造成局部的空白和空间，而且这叙述空白我们常常难以填补。新写实主义小说的语言是通俗化的语言，但同时又是审美化的语言，因为新写实主义把叙事和语言都当成了小说审美意蕴的重要组成部分，是“有意味的形式”。散文化的结构方式，口语化的叙事语言，使作品异常亲切感人。","keywords":"文学观念 反映与体验 人物塑造 典型与普通人 主题与题材 集中与消解 语言叙事 严谨与空白","note":"新写实小说与现实主义文学虽然都追求写实，但在具体的审美特征上有很大的不同。新写实小说并不是现实主义的发展，而是受现代主义文学思潮影响诞生的一股独立的文学创作思潮。将现实主义与新写实小说进行辨析，明确二者的独立地位，有助于我们更好地认识与研究它们，相关内容，我们要掌握。相关内容可以参考丁永强《现实主义与新写实主义》，具体资料可以在李凡文学正版群中领取。"},{"id":"392","stars":"★★★★","title":"简要概括刘震云八十年代小说创作的突出特点","body":"一、利用民间意识进行反讽\n\n“以史讽今”是刘震云的记史之作充满很强现实批判力度的原因之一，刘震云以几乎癫狂的反讽手段，揉捻着手中的各种历史元素，将其渗进小说之中，从而考验着已经有着固定阅读思维的读者。这一外显的叙事特征成为刘震云区别于当代其他作家的重要标志。如在《故乡相处流传》开头中就讲述了“我”给曹丞相捏搓脚，一家人因此鸡犬升天，乡里人无不过来送礼进而进行巴结的故事。这一小小的故事就含有巨大的反讽效果，表现了中国传统世俗中对权力膜拜的丑陋心态。\n\n二、对“哲理深度”有更明显的追求\n\n在80年代，相比起另外的“新写实”小说来，刘震云对琐屑生活的讲述，有对“哲理深度”更明显的追求，也就是对发生于日常生活中的，无处不在的“荒诞”和人的异化的持续揭发。\n\n《新兵连》就体现出了他对严峻人生的关注。小说以“批林批孔”为历史背景，刻画了在政治斗争中思想被戕害的农村子弟。刘震云复原了那些来自农村的年轻人为了“进步”而你争我斗的荒谬实景，使被政治文化钳制的人生显得更触目惊心。他对生活的细枝末节都毫发毕露地展现，剥开虚伪的外衣，还原人性本相，往往能够而以小见大。\n\n三、注意表现人性的种种弱点和严密的社会权力机制\n\n人性的种种弱点和严密的社会权力机制，在刘震云所创造的普通人生活世界中，构成难以挣脱的网。生活于其间的人物难以自主地陷入原先拒绝陷入的“泥潭”，在适应这一生存环境的过程中，经历了个人精神、性格的扭曲。这样的作品，以《一地鸡毛》《单位》为典型代表。\n\n四、关注人与环境的关系\n\n刘震云的小说注意对个体生存困顿、理想坍塌以及确定性追求丧失的生存现象进行还原。刘震云侧重关注人与环境的关系，即社会结构中人的悲剧性处境，这些内容被他的小说采用不露声色、却异常冷峻的批判立场，以喜剧、反讽的方式有力表达。如在代表作品《一地鸡毛》中，刘震云以非常冷峻而又略带微讽的笔触，叙出了极其平庸琐碎的当代生活景况，揭示出生存本相：生活就是种种无聊小事的任意集合，它使每个人挣脱不得，丧失了精神上的自觉。","keywords":"反讽手法“荒诞”和人的异化 人性弱点 严密的社会权力机制 人与环境的关系 生存现象的还原","note":"在新写实小说作家之中，刘震云可以说是成就最高的一位，同时也是在当下知名度最高的一位，尤其是近年来更是与余华、莫言等频繁在荧幕上互动。也正因此，刘震云相关内容在考查中出现的频率也跟高一些。刘震云的以上创作特征都在刘震云的小说创作中体现了出来，大家可以结合其具体作品进行分析。"},{"id":"393","stars":"★★★","title":"试分析刘震云《一地鸡毛》的创作特征","body":"一、表现严峻的生活对人的精神的磨损\n\n“一地鸡毛”，这个标题所具有的象征意义在小说结尾处通过小林的一个梦境直接表述出来：小林“梦见自己睡觉，上边盖着一堆鸡毛，下边铺着许多人掉下的皮屑，柔软舒服，度日如年。又梦见黑压压的人群一齐向前涌动：又变成一队队祈雨的蚂蚁。”\n\n这显然不是那种追求深刻性的象征，而是以十分表浅的意义述说揭示出作者所理解的生存本相：生活就是种种无聊小事的任意集合，它以无休无止的纠缠使每个现实中人都挣脱不得，并以巨大的销蚀性磨损掉他们个性中的一切棱角，使他们在昏昏若睡的状态中丧失了精神上的自觉。考察小林这个人物的精神发展轨迹，即可具体看出这种生活的严峻性及其对个人精神磨损的效用。\n\n二、冷静客观的写实风格\n\n在《一地鸡毛》中，刘震云始终以不动声色的平静口吻叙述小林遭遇的林林总总，这叙述看来如同现实生活本身，把创作主体的感受与判断几乎完全排挤干净，只有按照日常经验逻辑，依次地呈现出的各种琐碎事件。其中极少有观念意义的直接添加，并将主体情感的传达弱化到一笔带过的程度（如小说中常出现“辛酸”这个词，应是主体的感受，但却又总是被继之以“不把它放在心上”，于是这种辛酸的情感体验就被有意放过了），叙述者的声音最大限度地被掩盖起来，或者以程式化的语气和句式叙述，或者稍有感想也都被混同于人物的意识，并不显示出独立判断的倾向。\n\n三、尖锐的讽刺精神\n\n《一地鸡毛》的叙述中除了冷静客观的写实风格之外，比较一般新写实小说而言，还隐约闪烁着一种尖锐的讽刺精神：\n\n文本叙述的所有这些都是真实存在的，但所有这些都被揭露为无价值，正是这无价值本身构成了人生的沉重，而这种沉重看起来则是极不合理无比荒谬的。这种讽刺精神的存在其实还是由文本内含的知识分子人文传统所支配的，它是“来自一个有社会责任感的知识分子对自己所赖以安身立命的人生原则的绝望”，在根本上是社会人生的大悲哀。\n\n尽管《一地鸡毛》的叙写是这样的低调和平淡，但绝望的情绪还是曲折地传达出来，由此也就意味着这篇小说对于知识分子立场艰难的保持，它活生生地勾画出人对现实无可抗争的处境，揭示出这处境的荒谬，这便是体现出了通常认为新写实小说所缺失的现实批判立场。","keywords":"生活对人的精神的磨损 冷静客观的写实风格 尖锐的讽刺精神 社会人生的大悲哀","note":"《一地鸡毛》叙写的是当代生活中一个小职员极其平庸琐碎且窘困的生存状态，是刘震云十分有代表性的一部作品，其在艺术上体现出了典型的新写实小说创作特色，在思想上则表现出了尖锐的讽刺与批判精神。作为新写实小说代表作家的代表作品，《一地鸡毛》在名词解释中出现的可能性不低，大家要注意一下。"},{"id":"394","stars":"★★","title":"结合具体作品，分析池莉小说的艺术特点（25湖南师范大学）","body":"一、世俗化创作倾向\n\n池莉敏锐觉察到了时代氛围的悄悄转换-这种转换就是从崇尚精神生活、高扬理想主义、为改革开放进行思想动员和情感激发的80年代，向市场化、世俗化、城市化和物质利益化的90年代的巨大转型-并且自觉地追踪和描述那些底层市民的生活变迁。池莉的作品，开了一种直面现实、揭示人生平常状态的文学的先河，顺应了中国社会转型期的世俗化、商业化和利益化的总体趋势，始终保持了一种世俗化的姿态。如她的代表作品《烦恼人生》就具有鲜明的“世俗化”写作特点。这在一方面可以看做是对这一时期先锋小说实验倾向的反动，同时也可以视为是时代精神的另一种体现形式。\n\n二、“零度叙事”\n\n池莉叙事能力强，语言干净利落，处理题材和人物时比较冷静客观。她主张面对琐碎的生活现实，摒弃虚幻的生命抽象，坦然地呈现朴实、率真的生命本质。在叙述上，池莉把原属于作者交代的内容，转化为人物的内心感受，并通过人物行为予以传达，从而实现了作者与叙事者分离的“零度式叙事”。作者的零度情感介入、纯客观的冷静叙述，小说中人物的精神理想的缺席以及作者批判精神的退场等，形成了池莉小说独特的艺术特征\n\n三、小说缺乏思想力量\n\n池莉的小说因适合市民大众的口味而迅速走俏，被频频改编为影视剧，成为市民阶层的精神文化食粮。然而，仅仅以市民的标准、世俗的判断作为文学的标准，只能导致文学精神的退化。池莉90年代的创作虽然有了一些变化，但总体而言，她的创作是在同一个层面上重复。有论者指出她的小说的精神缺陷：“作为一个作家，轻视和排斥知识分子，轻视和放弃思想的力量，作品缺乏深刻的灵魂拷问，缺少情感的力度和震撼力，缺少激起人们追寻生存意义和提升审美理想的强大动力，也缺少对于妨碍社会发展、妨碍人性完善的真正障碍的严肃思考和犀利批判。价值观的单向性，难以覆盖生活的丰富性；作品的可读性，也不能遮掩作品的单薄感。”","keywords":"世俗化的姿态“零度叙事”价值观的单向性","note":"池莉的小说创作除了具备新写实主义小说共有的特色外，还有其独特的地方，就是保持世俗化的姿态，对生存的原生状态进行展示。但是我们也应该注意到，池莉小说也有其不足，在论说池莉小说的特色时，也不应该忽视这部分内容。"},{"id":"395","stars":"★★★","title":"如何看待“归来者”诗人的创作","body":"被当代诗歌批评界称为“归来的诗群”，其命名可能缘于艾青《归来的歌》。这本诗集的出版不仅意味着诗人艾青的“归来”，也象征着与艾青同时和比艾青更早“消失”的诸多现代诗人的“归来”。他们主要包括两部分诗人：一是因思想和艺术趣味不能适应“新的人民的文艺”而先后放弃诗歌写作的诗人，如辛笛、陈敬容等；二是因政治与思想运动受迫害而丧失写作权利的诗人，如“七月诗派”诗人绿原、牛汉等，以及50年代“反右”运动扩大化中因作品和言论被打成“右派”的诗人，如艾青、公刘等。“归来的”诗人创作，普遍具有以下特征：\n\n一、接续与恢复诗歌现实主义传统\n\n“归来”的诗人的主要特点，是从“诗人必须说真话”出发，重新续接了“五四”以来抒情与批判，在不同层面上恢复着诗歌的现实主义传统。因为说真话，诗便回到了有话要说的前提，回到了真情实感，回到了个人的想象风格；因为说真话，\n\n诗歌便能作为敏感的触须伸入一个个“禁区”，“唱人民的爱，革命的恩仇”；因为说真话，诗才疏离了“假、大、空”的意识形态，重新走进了读者的心灵，引起人们的共鸣。\n\n二、从切身经验出发进行历史省思\n\n“归来”的诗人们从自己的切身体验出发，对历史进行理性的反思。如在《关于·（摩西十诫）》里，诗人公刘对刚刚过去的历史进行着大胆的反思，直率地揭示了特殊年代价值和自我迷失之后人的异化：当盲目的崇拜蜕变为迷信的时候，人也就不可避免地被异化为愚昧的“教徒”。\n\n三、表达个体情志与人性之思\n\n在50-70年代的阶级和政治斗争风暴中，“归来”的诗人大都曾身陷囹圄，在人生处于低谷的困厄时期，他们一方面表现出了坚强不屈的生存意志，另一方面，对人性亦进行着深刻的省思。比如曾卓的《悬崖边的树》就描写了一棵被奇异之风从平原吹到悬崖边的树，以托物言志的抒情方式，表达了自己在困境中倔强而坚强的生命意志。\n\n四、关注社会现实\n\n在省思历史、探究人性的同时，“归来”诗人们对社会现实也保持着一定的热情和关注。如白桦的《阳光，谁也不能垄断》、骆耕野的《不满》、张学梦的《现代化和我们自己》、李发模的《呼声》、刘祖慈的《为高举的和不举的手臂歌唱》、熊召政的《请举起森林般的手，制止！》等，均表现出了这些诗人对社会现实的积极介入意识。","keywords":"抒情与批判 现实主义传统 对历史理性反思 个体情志 人性之思 对社会现实保持热情和关注","note":"“归来”是一种诗人现象，同时也一个重要的诗歌主题。主要包括右派诗人、胡风集团诗人、消失的诗人等。压抑许久的创作欲望与愤懑突然喷薄而出，致使这一时期归来诗人的创作达到一个新高度。“归来”的诗人回归了“五四”抒情与批判的传统，对历史反思，表达个人情志，关注社会现实，使诗歌重归现实主义传统。这里需要提醒大家的是，“归来”的诗人群是当代诗歌史上比较重要的一个概念，在考查与诗歌相关的名词解释时很可能出现。"},{"id":"396","stars":"★★★","title":"简述艾青“归来”后的诗歌的艺术特色","body":"艾青归来后的诗歌，与他过去的诗歌有着明显的连贯性和延续性。他的诗歌贯穿着一个基本的主题，即关注民族和人民的命运，歌唱人类的理想和光明。比起50年代前期来，他的创作取得显著进展。他这时期的诗歌，主要具备以下艺术特色：\n\n一、抒写历史进程与生命感悟\n\n艾青善于将自己对于现实政治、个人及民族命运的观察和思考，放在人类发展历史的背景上来展开，在繁复的议论和争辩中表达自己的世界观、人生观和美学观。他不满足于写个人经历，概括激荡的时代，对历史给予评说，一直是他难以忘怀的抱负。“复出”后，艾青贯注精力于《在浪尖上》《光的赞歌》《古罗马的大斗技场》《面向海洋》《四海之内皆兄弟》等长诗的写作，期望从纵深、开阔的时空基座上，来把握民族、以至人类的历史过程，提出由生命过程所感悟的历史哲学。\n\n二、象征手法的广泛运用\n\n为了避免说理的抽象性，艾青常借助于形象来传达自己对事理的理解，其诗作中的形象多有象征含义，如“斗技场”和“光”。艾青的一些短诗如《盆景》《仙人掌》《鱼化石》等，立意深远，构思精巧，借助日常事物、景物来揭示人生和生活的某些哲理。《盆景》里写到的“花木”，“都有铁丝的缠绕和刀剪的折磨”，象征了一种扭曲的人格。当然，这一时期艾青在象征手法的运用上并不都是十分成功的，某些诗歌意象指向具体的哲理，故而显得单薄乏味，缺少整体象征的感性和蕴藉。\n\n三、追求一种朴素、单纯、集中、明快的风格\n\n艾青归来后的诗歌扬弃了早年多少有些朦胧和晦涩的诗风，而追求一种更为朴素、单纯、集中、明快的风格。这个时期的不少短诗，都有着平易、质朴的诗歌方式，从中透露了对坎坷的人生经历的感悟，有一种豁达，但也有沉痛。《鱼化石》中鱼在遇难之前富于朝气和活力，“动作多么活泼”“精力多么旺盛”；它又是那样的无拘无束，自由自在，“在浪花里跳跃”“在大海里浮沉”。鱼的这种健康、快乐和无所不能的生命情态，不禁让人联想到风华正茂的青年，这也是诗人追求朴素、单纯、明快诗歌风格的体现。\n\n四、坚持自由写作\n\n在四五十年代，艾青一再坚持“写作自由”“独立创作”，并因此在延安文艺整风和反右运动中，受到严重打击。在“文革”后的写作中，他继续了对这一诗歌立场的坚持。但是，当这种独立写作的想象得以某种程度的实现之后，诗人的创造力，\n\n他的精神强度，他与世界所建立的联系的独特程度，他对于生命力和语言的敏感......这一切便构成更严峻的考验。因此他取得了成就，但也留下了深刻的遗憾。","keywords":"历史进程 生命感悟 象征手法 朴素、单纯、集中、明快 自由写作","note":"解答这一题时，我们首先要明确的是艾青归来后的诗歌创作主要还是对先前创作的一种延续，主题思想没有发生太大改变，但诗歌风格、艺术手法上有所精进。其中，自由写作、对历史进程与生命感悟的书写是其一贯的追求，而其象征手法、明快的风格等则是新时期的新发展。"},{"id":"397","stars":"★★","title":"试分析郑敏诗歌的创作特色","body":"一、安静、宽宏的“女儿心”\n\n郑敏的相当一部分诗作昭示了一颗安静、宽宏的“女儿心”。她寂寞地诉说着对自然、土地、祖国的爱恋，披肝沥胆却不事张扬。她的诗歌超越了一般女性主义写作之于“女性个性”的理解，而把女性提升到人类“众德之德”的“母爱”这一层次。郑敏认为“母爱”实际上是人类博爱思想之源头，是和平、平等、互助、扶弱济贫、仁爱、慈爱、宽恕等人类一切高尚理想和美德的原型与基础。“母爱”的基点赋予郑敏诗歌一种“柔软的力量”，诗人的“爱”发散到她观察到的每一件事物上，时不时引起灵动的诗情，于是有了飞扬的意绪。\n\n二、以细致、宁静的哲思表现自然与生活\n\n郑敏恢复写作初期，诗作尚缺特色，不过其中她对青年时代的记忆很值得称道。在这一时期，她寻找到了与“年轻”时期艺术的衔接点，逐渐修复了自身艺术个性中的两大支柱：一是与自然、与人的生活所建立的默契，一种身心参预的亲切感，用心去捕捉自然呼吸的气息和脉搏的跳动，借感觉的尖锐和细腻达到灵智上的呼应相通。二是战胜观察、思考上的狭窄视角，挣脱在“当代”形成的观念束缚，从纷纭的现象中体会到平凡，又从平凡中探寻深奥，在事物面前保持虚心、坦率的探寻的态度。在此基础上，郑敏建立起了与细致、宁静的哲思的联系。\n\n三、主要表现形而上的终极人生体验\n\n20世纪80年代中期以后，郑敏诗歌的主题开始深化，主要集中在形而上的终极人生体验上，如生命、等待、时间、死亡等命题。在此后的诗作中，有对历史运动（同时也是个体生命）的“太强的生是死的亲吻”的体认。有对“不再存在的存在”诗歌音乐、宗教中力量的踪迹的探寻。有对预置的逻辑程序偏离，而接受无意识的暗示和指引。\n\n四、组诗形式\n\n组诗是郑敏常用的写作方式。这是因为郑敏有许多思绪和哲理，需要有一种阻断，但又连绵延续的形式加以表达。组诗在郑敏的诗中，总能达到较高的水准，如《诗的交响》《裸露》《心象组诗》《不再存在的存在》《蓝色的诗》《秋的组曲》《生命之赐》等。","keywords":"“女儿心”宁静的哲思 形而上的终极人生体验 组诗","note":"郑敏是“归来的”九叶派诗人中最活跃也是风格最多变的一位诗人，有些学校可能会专门针对他进行出题，相关内容我们要有所掌握。郑敏的诗歌创作特色从恢复写作开始一直到后期明显经历了一个发展的过程，作为一位女性诗人，其诗歌创作也很可能与舒婷放在一起进行对比，这些我们都要注意一下。"},{"id":"398","stars":"★★★","title":"简述朦胧诗发展过程（25湖南师范大学）","body":"【答题框架】\n\n朦胧诗的产生与发展大致经历了三个阶段：\n\n一、酝酿探索阶段（60年代末-1975年）\n\n“朦胧诗”的酝酿与探索可追溯到“文革”时期某些“老红卫兵”的地下诗歌创作。但真正具有现代主义特征的诗作则是60年代末郭路生创作的《相信未来》。它的出现，唤醒了一代青年诗群，郭路生也因此被誉为“文革”中新诗歌运动的第一人。继郭路生之后，新诗歌运动中崛起的又一知名诗人依群，把诗歌形式向前作了大胆的一跃，其最有影响的诗作是《纪念巴黎公社一百周年》。如果把郭路生、依群的诗歌革新看成是尝试的话，那么到了1972年左右出现的“童话诗”（顾城《迷途》《梦之鸟》等）与“白洋淀诗派”（芒克、根子、多多等），就基本上奠定了后来的“朦胧诗”的基础。不少朦胧诗人，如严力、杨炼、林莽等，在当时都曾受到“地下诗坛”的雨露滋润。\n\n二、发展争鸣阶段（1976年-1983年）\n\n“天安门诗歌运动”给“朦胧诗”由“地下”走向“地上”提供了契机，这种诗歌迅速地在年轻人中传播开。1978年12月，这帮勇于探索的青年人作了一次整体集合，他们自办的刊物《今天》终于印发了出来。这样，长期处于孤军备战状态的年轻诗人们终于凝聚成一股力量，作为一个完整流派的“朦胧诗”从此诞生了。“朦胧诗”获得正统刊物的公开承认是在思想解放运动进一步深入的1979年。是年3月，《诗刊》率先发表了北岛的《回答》，接着是舒婷的《致橡树》《祖国啊，我亲爱的祖国》，顾城的《一代人》等，很快，他们的诗作纷呈于《星星》《福建文学》《上海文学》《人民文学》《青春》等诸多具有全国影响的诗歌和文学刊物上，“朦胧诗”作为一种全新的诗体得到了某些方面的承认。\n\n“朦胧诗”影响的进一步扩大，是在理论界的介入之后。自1980年始，中国诗歌理论界围绕“朦胧诗”问题展开过三次理论探讨：第一次是在1980年。谢冕的《在新的起面前》引起理论界的不同反响。同年9月全国诗歌理论座谈会和1981年中国当代文学研究会年会把讨论推向高潮。第二次1981年孙绍振发表《新的美学原则在崛起》，程代熙、洁泯、敏泽等撰文发表不同意见。第三次，徐敬亚发表《崛起的诗群》，程代熙等进行公开的批评；1983年召开的“重庆诗歌讨论会”，对“崛起派”进行批评。三次讨论的论题超出了对“朦胧诗”本身的评价，关于新诗的发展基础、继承与借鉴、民族化问题，对“十七年”诗歌的评价，关于表现自我以及诗的审美特性等课题，都得到认真的讨论。虽然双方各有偏颇，未能达成一致的认识，但使“朦胧诗”得到了社会的全面认可。\n\n三、深化成熟阶段（1983年-1986年）\n\n这一时期，一批朦胧诗的始作俑者开始进入冷静反思与系统借鉴的创新时期。他们的创作走出了痛苦的历史和人性、主观和客观、个人与社会的冲突困扰，努力在超越现实社会又超越个人命运的尽量客观的境界中获取一种全方位意识，以探寻民族文化心理结构及本源，走向人类自我空旷、孤独的内心，把对现实的强烈关注转化为对生命本体存在的体悟和感知。这种转化的杰出代表就是杨炼和江河。","keywords":"酝酿探索 郭路生 依群 发展争鸣《今天》北岛 舒婷 顾城 理论界的介入 深化成熟 民族文化心理结构及本源 杨炼江河","note":"“朦胧诗”从酝酿到崛起明显是经历了一个过程，其最早可以追溯到“文革”时期的地下诗歌创作。而在“朦胧诗”得到广泛认可的路途上，“三个崛起”的出现可以说是起到了非常重要的推动作用。理解这一部分内容，对于我们理解“朦胧诗”的思想内容和艺术特色有着非常重要的帮助，大家可以结合各个时期的代表诗人以及他们的作品进行理解和记忆。"},{"id":"399","stars":"★★★★","title":"试分析朦胧诗的内容和艺术特点（25南京师范大学、陕西师范大学）","body":"所谓“朦胧诗”，以内在精神世界为主要表现对象，采用整体形象象征、逐步意象感发的艺术策略和方式来隐示情思，从而使诗歌文本处在表现自己和隐藏自己之间，诗境模糊朦胧、主题多义莫明。其中，主体意识和现代主义品格是其诗学的核心。具体来说，“朦胧诗”主要表现出了如下特征：\n\n一、肯定自我和张扬人的价值与尊严，表达对人的权利与自由的向往\n\n“朦胧诗”作为一种新诗潮，一开始便呈现出与中国新诗传统不同的美学原则，其核心精神就是在“文革”专制主义下迷失、绝望而痛苦的一代对人的反思，对人的自我价值的现代确认，对人性复归的呼唤，对人的心灵自由与解放的追求。由于放弃了阶级人的观念，朦胧诗人坚定地举起了人道主义和人本主义的大旗，渴望“在没有英雄的年代里，我只想做一个人”。这一新的人学观念使得他们的诗歌在关注人性、人情的同时，格外注重肯定自我和张扬人的价值与尊严，表达对人的权利与自由的向往。\n\n二、具有介入社会生活，为民族立言的抒情积极性\n\n从历史“废墟”里走出来的朦胧诗人，用充满否定和批判的姿态对刚刚过去的历史进行了大胆的质询和拷问，用诗歌揭露了“文革”的荒诞。他们由于都有“文革”十年的社会动荡经历和上山下乡的个人遭际，因此总是倾向于把自己的命运和民族的劫难结合起来审视生活。从根本上说，“朦胧诗”是一种介入和承担的诗歌，很多诗篇在对于“个体”经验的抒发中，渗透着强烈的民族、现实忧患感和参与意识。这种小“我”与大“我”，即个人与民族、时代的同构性，是“朦胧诗”的一个基本特质。\n\n三、表现被抛弃的一代内心的忧伤、迷惘和失落\n\n以一种坚实的“自我”为基点，朦胧诗人们展开了对于历史、时代、社会、现实的全面批判与反思，不仅如此，他们还把批判的锋芒指向“自我”本身，表现了被抛弃的一代内心的忧伤、迷惘和失落。北岛的《回答》、顾城的《一代人》和梁小斌的《中国，我的钥匙丢了》均是这一思想情感的表达，其中又以《中国，我的钥匙丢了》最具代表性，这首诗塑造了一个从狂热轻率到失落迷惘到艰苦寻找再到反思超越的抒情主人公形象，他在追求中失落，在失落中寻找，体现了那一代人共同的心路历程和生活方式。\n\n四、艺术上具有个人化倾向，较多地借鉴西方现代主义诗歌技巧\n\n“朦胧诗”在艺术上表现出强烈的个人化倾向，侧重于自我内心情感的表达，并在创作中较多地借鉴西方现代主义诗歌技巧，大量使用象征、隐喻、通感、变形甚至蒙太奇的手法来拆解现实时空秩序，同时注重对潜意识、瞬间感受等主体内向性情绪的捕捉，拓展了诗歌的容量与内涵。蒙太奇隐喻、反讽等手法为知识分子的集体经验提供了个人化、风格化的聚焦点；令人耳目一新的意象和意象的审美张力则构成意识冲突戏剧性的对象化；通过时空颠倒意象叠加和式的大幅度跳跃等方式让读者产生多重意蕴和不确定的印象。这些都给“朦胧诗”增添了一层朦胧色调。\n\n五、多样化的艺术探索\n\n“朦胧诗”是以一种整体的潮流引起关注，但这并不意味着诗人们保持着整齐划一的风格，其中的几位代表诗人在用词习惯与气质风格中表现出各不相同的特点。比如，北岛的诗偏于理性的怀疑和批判主题，舒婷的诗偏于温婉的人性探询，江河的诗偏于浑重的民族主题，顾城的诗编织了一个梦幻般的童话世界，杨炼的诗以激越的语句构筑着宏大的文化史诗，梁小斌的诗注重日常性场景的展现等。\n\n总之，“朦胧诗”是人之觉醒的体现，许多年轻人认同了这个追求人性价值的抒情体系，并争相仿效，形成一股有相当规模和广泛影响的创作力，同时它对传统诗学观念的挑战也获得更多人的关注。","keywords":"自我价值 人性复归 心灵自由与解放 介入社会生活 为民族立言 忧伤、迷惘和失落 个人化倾向 现代主义诗歌技巧 多样化的艺术探索","note":"“朦胧诗”可以说是中国当代文学史上诗歌部分最重要的一个考点，许多学校都会专门针对它出题，所以相关内容我们一定要重点掌握。“朦胧诗”的核心是主体意识和现代主义品格，因而表现出了比较强烈的个性色彩与个人化倾向；但是，“朦胧诗”又诞生于中国的土壤上，所以无法摆脱中国诗歌传统，因此显露出了干预现实的色彩。“朦胧诗”的相关** --- 名词解释，除了“朦胧诗”本身外，还需要注意“三个崛起”这一比较重要的文学事件，以及其主要阵地《今天》，当然还有其代表诗人如北岛、舒婷，代表作品如《致橡树》等，整体内容较多。"},{"id":"400","stars":"★★★★","title":"试论述“朦胧诗”的文学史意义","body":"作为20世纪70年代末80年代前期一个最重要的诗歌流派，“朦胧诗”为中国现代诗歌的发展提供了迥异于传统规范的美学原则和艺术动力。各具艺术才情和个性的青年诗人以丰富多样的诗艺探索为诗歌的深度抒情带来了诸多新鲜的元素。总体来看，“朦胧诗”的思想意义和诗学贡献是多方面的。\n\n一、对“个体”精神价值的强调\n\n“朦胧诗”派在背离“文革”诗歌和十七年现实主义诗歌艺术的同时，与九叶诗派接轨，与象征诗派、现代主义诗派贯通，从而接续了曾经中断的中国现代主义诗统。“朦胧诗”对封建思想和国民性的批判，正是“五四”新文学未完成的主题，它在启蒙主义的人文精神和艺术探索的创新精神两个方面，实现了当代文学与“五四”新文学的对接。《今天》和“朦胧诗”的“启蒙主义”激情，历史承担的崇高、但也有些自恋的姿态，突破“当代”诗歌语言、想象模式的变革，对当时的诗界形成强烈冲击，也给后继者提供了前行的动力和经验。\n\n二、表达历史创伤对个人、民族所造成的伤痛\n\n从诗歌的主题与内涵上看，朦胧诗人大多注重挖掘人的内心世界，注重深层次的灵魂探险，从现实外物转向了心灵世界的揭示。带着呻吟、反思和对痛苦的超越，“朦胧诗”与其他文学体裁一起表达了历史创伤对个人、民族所造成的伤痛。“朦胧诗”就如运行不息的地火终于喷出地表一样，为新时期沉寂的诗坛燃烧了第一把火，为经过“文革”战争的新时期文学重塑了新的高度。\n\n三、当代（新时期）文学走向现代主义的最初发韧\n\n从艺术技巧来看，现代派诗歌技巧大量出现在“朦胧诗”的作品中，象征、意象、蒙太奇、意识流等手段随处可见，构成了非常成熟的现代主义诗美的奇异景观。同时，“朦胧诗”的现代主义倾向是一种“中国式的现代主义”，它是融汇中国本土特征的现代主义。它表现为既吸收了古典诗歌传统中的简约、含蓄、婉约、曲折为美的审美方法，以及中国传统文化中的忧患意识、现实参与感，又并未完全忘情于现实世界，在理性中跳跃着感性，在绝望与颓废中隐藏着对现实人生的提升与希望，对历史质疑的同时也包含着民族未来和自由精神的寄望。可以说“朦胧诗”并不是纯粹西方式的现代主义诗歌，而是当代（新时期）文学走向现代主义的最初发韧，是带着中国现实特色的现代主义诗歌。\n\n四、一代人的崛起\n\n“朦胧诗”群实际是一个青年诗人群，伴随着“三个崛起”的浪潮，大批青年诗人涌上诗坛，使该诗群成为一个青年诗人的集合。可以说，“朦胧诗”是“同时代人”的大会师，汇聚在它旗下的是一个“青春方阵”的。推动了这场新诗潮诗歌革命（运动）的主力，仍然是青年一代，它体现了鲜明的“青年文化”的特色。","keywords":"“个体”精神价值 现代主义诗统 历史创伤 中国现实特色的现代主义诗歌一代人的崛起","note":"“朦胧诗”可以说是中国当代文学史上最重要的一个诗歌流派，其对中国诗歌创作以及中国当代文学的影响是多方面、多层次的，从思想内容到艺术手法，从创作题材到诗人群体，处处可见“朦胧诗”的影响。这部分内容可能会和“朦胧诗”的特征结合到一起进行考查，比如25年北京大学就靠查到了“请结合具体作家作品，论述朦胧诗的艺术风格和文学史意义”这道题目。相关内容可以参考李润霞《朦胧诗：一代人与一代诗的崛起》，具体资料可以在李凡文学正版群中领取。"},{"id":"401","stars":"★★★","title":"北岛诗歌的艺术特质","body":"北岛是随着朦胧诗的崛起而崛起的。作为朦胧诗的代表性诗人，北岛80年代的诗歌创作呈现出以下特征：\n\n一、鲜明的怀疑、批判精神和否定意识\n\n在“文革”中成长的北岛，对这场浩劫进行批判性反思，将政治带给个体的心理创伤深刻地揭示出来。在主题上，北岛的诗综合了批判现实主义和存在主义芜杂的思想倾向。他善于从个体处境出发，发现人的社会存在的荒诞感和悲剧感，并以“绝望的反抗”来抗争现实对个人命运的安排。同时，这种否定和批判精神在北岛的诗歌中同时还体现为对个体尊严的热情呼唤、对善良人性被践踏或毁灭的愤慨以及对弱者的悲悯与同情。\n\n二、浓重的英雄主义情结和悲壮感\n\n面对混乱而黑暗的历史，北岛悲愤满怀，但其并没有因此对未来失去信心，他和食指一样用诗歌传达出“相信未来”的\n\n心理强音，但和食指不同的是，北岛的诗歌在相信未来时更具英雄主义色彩和悲壮感。北岛的诗歌中一直未中断过斗士情绪，常形成抗争阵列，有强烈的对立结构。所有诗歌，几乎都有抗诉和战斗的紧张感，有文化反思痕迹。有时它们是以破坏力的面目出现，有时则是以卸甲的悲哀进入诗歌而拥有表层的悲剧感。\n\n三、理性思辨色彩和冷峻风格\n\n由于鲜明的批判精神和深沉的历史反思意识的渗入，北岛的诗歌在艺术风格上呈现出强烈的理性思辨色彩和冷峻风格。&#x5728;情感处理上，北岛比较注意内敛、含蓄，体现为一种在严峻之中的庄严感和自持感。他是借助语言的内在的张力，而不是依赖外在夸张的表达，来形成这种集冷峻、硬朗、奇诡、丰富和复杂于一体的艺术风格的。\n\n四、普遍使用西方现代诗的技巧\n\n由于受到西方现代主义诗歌艺术的影响，暗示、通感、瞬间感觉、蒙太奇手法等西方现代诗的技巧，在北岛诗中被普遍地运用。除个别的诗以“宣告”姿态表露真实态度外，在创作中，他多采用隐蔽的手段，曲折多姿地向读者传达诗中的思想信息。\n\n总之，作为诗人，北岛将诗歌胜利的辉煌写于一瞬，而将诗歌溃败和救赎的悲壮写于一生；他以诗作和文学行动在伪崇高的围困中为崇高正名，在审美休克的年代，为丑陋的文学现实树立了冷硬的美学照壁。","keywords":"怀疑、批判精神 否定意识 英雄主义情结 悲壮感 理性思辨色彩 冷峻风格 现代诗技巧","note":"北岛是朦胧派诗人的一个代表，在记忆北岛的诗歌特色的时候，我们可以联系朦胧诗共有的特色，结合北岛的作品，从共性中提取出个性。同时，北岛和食指经常会放在一起进行比较，大家对二者作品的差异也要有所了解。"},{"id":"402","stars":"★★★","title":"简述顾城诗歌的特点","body":"顾城被誉为当代诗坛的“童话诗人”，他一生都将自己置于童话般的幻境之中，不太愿意直面冷酷、复杂而多变的世界。由于不愿直面现实，诗歌就成了顾城的宗教，在诗歌中他用忧郁、纯净而敏锐的眼神，去寻找属于自己的童话世界。顾城的诗歌创作，主要具备如下特征：\n\n一、对儿童世界的钟爱与眷恋\n\n在顾城的诗歌里有相当多的作品是在抒写童年或者以儿童视角观照外面的世界。当顾城用孩子的眼光打量成人世界的时候，外面世界的冷漠和陌生感就油然而生，与儿童世界的舒适和自在截然相反，这更是加深了顾城对儿童世界的留恋。而这对儿童世界的留恋，也使得顾城对寓言故事诗的创作格外感兴趣，他一生创作了大量此类诗作。\n\n二、对自然的热爱和关注\n\n顾城是喜欢走极端的梦幻型诗人。他排斥都市文明，与乡村、自然有着天然的亲近感。现实生活中，顾城只有在自然中才能安顿自己的灵魂一隅。据说顾城曾视法布尔的《昆虫记》为自己的“圣经”，而在诗歌中他也毫不掩饰对自然的钟情。在顾城的诗作中，经常能见到星星、月亮、飞鸟、云、花朵、蝈蝈等撷取于自然的意象，在这些意象里寄寓着诗人与自然和谐相处、人性健康的理想。\n\n三、将感性情绪书写到极致\n\n顾城的诗歌在艺术格调上自然、纯净，同时又注重意象的营构。尤其是在意象建构上，顾城善用奇异的意象传达自己对生命、对世界以及对人与人之间关系的直觉体验。顾城非常重视感觉、通感、联想对诗句构造的作用。他从不刻意追求深刻，但喜欢空灵、神秘的表象世界和情绪之美，将感性情绪书写到极致。诗中抒情者情绪没有遵循某种既定的法则，而是处于连续跳跃状态。顾城在日常情绪中捕捉空灵的人生体悟，形成冥想式的想象伸展，完成对怯懦、单纯、偏执的自我的放逐。\n\n四、钟情于“死亡”意象\n\n顾城对死亡有种近乎癖好的玩味，他对死亡的悲伤体悟与沉醉浸淫混合在一起。诗人往往在把玩中散发出颓废气息，流于情绪的诗语和接近幽深的生命体悟相辅相成，形成顾城诗歌的独特美学风貌。在顾城诗中，死亡被描述为一件让人惬意的事情，他在追逐死亡中享受到醇厚的生命美感，而尘世被过滤成无足轻重的“悲哀”。顾城小心试探着来自死亡的诱惑和召唤，并以幻化的死亡之美推动诗歌前行。","keywords":"儿童世界 自然 感性情绪 “死亡”意象","note":"许多人都因为《一代人》的“黑夜给了我黑色的眼睛，我却用它来寻找光明”而认识了顾城，而这句诗在当下仍广泛传播。与之一起流传的，还有顾城颇为不幸的结局。不过由顾城的结局，我们可以一窥顾城的精神世界，然后由此出发去理解顾城的诗歌特征。"},{"id":"403","stars":"★★★","title":"结合作品，谈谈舒婷诗歌的主要内容","body":"在朦胧诗人中，舒婷的诗歌较少理性的介入，更多的是自我意识的感性呈现和内心情感的自然抒发，浪漫中透露着典雅，忧伤中承载着理想的光辉。而在诗歌情感内容上，舒婷也在当时的朦胧诗人中表现出了独特性：\n\n一、表现个体意识的觉醒，追求人的尊严和价值和鲜明的女性意识\n\n舒婷的成名作《致橡树》首先是一曲爱情的新语，诗人带着反叛传统观念和男权社会的女性意识，渴望在爱情的位置中寻求两性的平等。其次，这渴求各取所长、互相尊重的爱情观背后，也是对人的尊严和人的价值的肯定。\n\n舒婷的诗歌中有对自我价值的确认与歌颂，也有对理想、理性和未来的期许，还有对自由人格的坚定追求，对传统道德理性的反叛。《船》是对自由生命的向往，一只与大海咫尺相望的小船却无法属于自由的大海，于是留下了永久的叹息。《流水线》一诗是对人的生存价值的一种现代性思考，表达了在沉重的秩序中对于人性失落的担忧。\n\n二、表达对祖国和人民深沉的挚爱\n\n曾经的政治浩劫，并未消泯朦胧诗人对国家未来的美好期待，也没有消减他们对民族的挚爱。舒婷也是如此，她在风暴与沉落中，没有丧失对信念与价值的坚守，从未对历史的正义性和自我的价值表示过怀疑，闪烁着传统的社会理想精神。在这方面，她的《祖国啊，我亲爱的祖国》可谓代表，这篇作品将个人命运同民族命运紧紧地联系在一起，唱出了忧伤和沉重中的希翼，充满了献身的理想精神。\n\n三、关注女性内心世界的曲折与复杂\n\n舒婷的诗作《赠》准确而传神地道出了复杂、微妙的情感心理，这种细腻、复杂的情爱心理描写，在舒婷的《船》《四月的黄昏》《雨别》等诗作中也有着较好的传达。舒婷诗歌对于女性命运与处境的关注和书写，主要沿着两条线索展开：一是如《自画像》《往事二三》这样以自我情感的抒发展示女性纤细柔和的一面；二是像《惠安女子》这样抒发的对女性命运的忧思和慨叹。当然，这种忧思并不显得激烈。\n\n四、对人道主义、人的价值的呼唤与肯定\n\n对人道主义、人的价值的呼唤与肯定，着意表现对于人与人之间的理解、友爱、信任、关心、支持、尊重、爱护的渴望，将人性美理想化和诗化，并以此反思现实和历史，也是舒婷的主题之一。《风暴过去之后》《一代人的呼声》以及一些赠答诗都属这类作品。","keywords":"个体意识的觉醒 人的尊严和价值 女性意识 对祖国和人民深沉的挚爱** 女性内心世界 人道主义","note":"在朦胧诗人中，舒婷是比较特殊的一个，她在诗歌情感内容上与当时的北岛等诗人显露出很大的区别，相较而言更偏重于感性情绪的抒发，所以对于这部分内容我们还是要注意一下，大家可以结合舒婷的具体作品进行分析。"},{"id":"404","stars":"★★★★","title":"请谈谈你对舒婷诗歌创作特征的认识","body":"一、注重对思想倾向的追求\n\n舒婷作为“朦胧诗”的主将之一，受到了同时期北岛、芒克、多多等“今天”诗人的影响，注重对思想倾向的追求，表现在作品中便是有意识地突出了人道主义与个性主义的精神，以及表达对祖国和人民的深沉的挚爱。她的诗多用第一人称写成，信念、理想、社会的正义性都通过“我”这一抒情形象表现出来，诗行中充满了对人的自我价值的思考。比起北岛、顾城而言，舒婷更偏重于爱情题材的写作，在对真诚爱情的呼唤中融入理想，展露一种强烈的女性独立的意识。\n\n二、独特的女性气质、柔美和感伤的风格\n\n舒婷的作品充分表现了女性情感的细腻与柔和，体现了其作为女诗人的温柔典雅，表现出女性心理的曲折与复杂：既迷惘，又坚韧；既忧伤，又欢乐；既欲打开倾诉的闸门，又常常犹豫不决，充满了理智与情感的矛盾。这就使得她的诗歌在总体上“忧伤而不绝望，沉郁而不悲观”，“是软弱的又是坚强的”“忍受着失望，又怀着胜利的信念”。\n\n三、浪漫气息与现代主义手法交融\n\n舒婷的诗在整个“朦胧诗”中最富于浪漫气息，她是一个典型的抒情诗人，情感细腻典雅，追求崇高和优美的风格，特别是在其创作的早期曾受到许多浪漫主义诗人的深刻影响；但同时她又是一个用现代主义，尤其是象征主义手法写作的诗人，运用感觉、意象、暗示，而较少直白的表露。这具体表现在：第一，超现实的梦幻与直觉意味。舒婷的许多作品对事件和情景不作具体和直观的交代与叙述，而只是用片段的联想和感觉来表现。第二，通过感觉的转换结构的跳跃与多变，产生扑朔迷离的色彩和意义的扩张与辐射，第三，舒婷创造了一套属于她自己的象征符号系统，推动了当代诗歌语言的变革。与北岛\n\n不同，她的意象式修辞更注重温和和优美的色调，如“船”“帆”“树”“花朵”“黄昏”“大海”“星星”等，都展示了朦胧诗语言形象丰富、优美与抒情的一面。\n\n四、将思考、情感寄寓在贴切而自然的意象之中\n\n在舒婷的诗中，各种主观性的象征俯拾皆是，意象之间的组合由主体感觉的变化而任意多样，这不仅仅使诗的语言空间得到了拓展，而且也是突现出了舒婷心灵中强烈的自我色彩。比如，她多用大海、土地等意象表达对某类社会性问题的思考，用橡树、木棉、神女峰等意象表达对女性命运的独特思考，用礁石与灯标、船与海、船与岸之间的关系意象表达对人生或两性关系的哲思等。","keywords":"思想倾向 女性气质 柔美、感伤风格 浪漫气息 现代主义手法 贴切而自然的意象","note":"在“朦胧派”诗人中，舒婷是十分特殊的一位，这不仅仅是因为其诗歌感情上的独特性和女性诗人身份，更因为在当下，舒婷在“朦胧派”诗人中名气最高，影响最大，因而针对舒婷的考查也相对更多。比如说在25年的考查中，东北师范大学就考查到了“舒婷诗歌的主题和艺术特色”这道题目，大家结合这道题以及前面一道题综合应对就可以了。当然，作为一位女性诗人，舒婷很可能会和“女性诗歌”联系起来，大家可以对相关内容进行拓展，具体内容可以在李凡文学正版群中领取。"},{"id":"405","stars":"★★★★","title":"请谈谈你对新生代诗歌的认识","body":"新生代诗歌是指继“朦胧诗”之后，新崛起的更年轻一代诗人的创作，当代西方后现代主义思潮中的颠覆与解构理念，对他们艺术观念的形成及创作实践产生了鲜明的影响。他们在诗坛上的最初亮相就是以反叛“朦胧诗”为标志的。新生代诗歌尽管派别林立，诗歌的观念也不完全相同，但是仍然表现出了一些共同特征：\n\n一、反叛性\n\n作为朦胧诗之后最具创新意识的一代，“第三代”诗人高调张扬的就是他们的反叛意识，他们首先反叛的就是传统文化，另一个重要的反叛目标，就是还未正式完结的朦胧诗。新生代诗歌的反叛性，主要表现在以下方面：\n\n（一）在价值观念上，新生代诗歌具有鲜明的反崇高、反文化和平民化的特征。跟此前朦胧诗所具有的忧患意识、责任感和英雄情结不同的是，这批更加年轻的诗人试图通过对理性的反叛、对文化意识的解构来完成自已的诗歌表达，同时他们也不再追求崇高和优美，转而对世俗生活和平凡人生产生了浓烈的艺术趣味。“文化”是一个民族长期以来的价值积淀，“崇高”是直接评价人类行为的道德准则。“反崇高”“反文化”实际也就是反传统意义上的“善”与“美”。换句话说，就是将审美的视点从“善”与“美”的传统向度，转向与其相反的背面。\n\n（二）在艺术价值取向上，新生代诗歌变朦胧诗的抒情化为叙述化，变朦胧诗的意象结构为事态结构，变朦胧诗象征、隐喻的表现手法为戏谑性的反讽手法，变朦胧诗的深度语言为浅近的口语。\n\n新生代诗歌往往运用揶揄、调侃的言说方式进行冷调抒情，并以此表现不满自身处境及对世俗陋习的抗争情绪。就艺术形态风貌而言，“新生代”诗歌在言说方式的语象、语态和语式上均具有反讽的文体特征。新生代诗人不再追求诗歌意象的暗示性和隐喻性，主张通过不动声色的冷抒情，让诗歌直接面对世界，表现最原始的真实。与感觉还原的诗歌艺术追求相一致，新生代诗歌在语言上崇尚自然且不加修饰的口语。新生代诗人大量汲取生活语言，把书面语变成鲜活的口语并进行结构变革，打破固有诗歌模式，强调诗的感觉性，反对硬性阐释，以前卫的姿态冲击着文坛。\n\n二、开放性\n\n相较于“朦胧诗”，“新生代”诗歌表现出了一种更加多元和开放的接纳姿态，他们警惕写作的单一格局，而尽可能地去超越各种理论俗见，正视各种流派的写作，即使有争鸣与探讨，也是在守护诗歌的尊严。正是这一点，让“第三代”诗歌的开放性特征，显得异常突出。\n\n这一开放性首先体现在诗歌题材上，“新生代”诗歌拥有丰富的文本，并在日后形成了经典；而在诗歌最为重要的语言创新上，“新生代”诗歌就显得更为开放，以各种各样的语言实验，容纳了很多类型的诗歌写作风格，比如“莽汉”的夸张式、“非非”的简洁式、“他们”的表达精确式、“整体主义”和“新历史主义”的粗犷式......这些复杂而丰富的语言实践，真正体现了诗歌艺术的开放性，是新时期先锋诗歌不可低估的收获。\n\n三、民间性\n\n“新生代”诗歌的民间性，主要体现在如下几方面：\n\n（一）主要诗歌流派都是由高校文学社团发展而来\n\n80年代的高校文学社团大都属于具有志同道合倾向的学生们自发组织，带有“非主流”和民间性质，而后来兴起的各种诗歌流派，其最早的雏形也就是这些零散在各高校里的文学组织与社团。\n\n（二）自觉的民间立场\n\n“第三代”诗人们开始自觉地疏离政治意识形态与主流话语中心，而回归并专注于诗歌艺术本身；西方现代主义乃至后现代主义文学思潮的传播，也从一定程度上影响了“第三代”诗人的写作思维与技艺。这些因素导致他们的艺术立场都是以“民间”作为出发点的。\n\n（三）诗歌的平民化姿态\n\n在“第三代”诗人这里，诗歌从朦胧诗人辛苦经营的“贵族”化形象框架里滑脱下来，成为了一种运动的载体，与风靡一时的流行歌曲以及所谓“在野”艺术家的莫名所以的个人画展并列在一起，显露出了典型的平民化姿态。","keywords":"反叛性 反崇高 反文化 平民化 叙述化 戏谑性的反讽手法 浅近的口语 开放性 丰富的文本 语言创新 民间性高校文学社团发展而来 民间立场 平民化姿态","note":"新生代诗歌表现出了鲜明的对“朦胧诗”的反叛，这具体表现在价值观念与艺术价值取向这两个方面，大家可以把这两个诗歌创作思潮放在一起，通过对比加深记忆。“新生代诗歌”以及其代表作家作品如于坚、韩东、《有关大雁塔》等都可能在名词解释中出现，大家对此要有所准备。"},{"id":"406","stars":"★★★","title":"试分析于坚的诗歌创作特色","body":"于坚是“他们”诗群的主要成员之一，他善写偶然的感触和永不重复的生活细节，常用真实的丰富的生命状态形成独一无二的诗歌境界。于坚的诗歌创作，主要具备以下特征：\n\n一、“拒绝隐喻”，重现语言原初的命名意义和创造能力\n\n于坚的诗学观以回归原初世界和自然生存境态为旨归，主张诗歌写作应当“拒绝隐喻”。他所谓的“拒绝隐喻”也就是要求诗歌重现语言原初的命名意义和创造能力，反对诗歌沉陷于脱落存在之根的虚浮想象力，力图通过诗歌改变文明化语言的抽象性、间接性和内指性，终结文明化语言画地为牢、自说自话、相互阐释、彼此缠绕的隐喻性运作方式，重回语言原初阶段目击道存的“元隐喻”状态。于坚的诗论还频繁地谈论着“口语”和“语感”，而他所谈论的“口语”和“语感”实际上还是他“拒绝隐喻”这一根本诗学思想的具体注脚。\n\n二、强烈的语言自觉意识\n\n于坚的诗歌写作具有强烈的语言自觉意识，这种对语言的自觉实际上也就是对存在的自觉。他试图从书面语写作返回到口语化写作，试图从知识化的写作返回到民间写作，试图摆脱西方诗歌的殖民化影响而展开真正的汉诗母语写作。除了这些宏大的理论突围构想之外，于坚的写作实践无时无刻不在注重对语言的清理，尽一切可能去检视语言已经命名之物，尽一切可能摧毁既有的命名对物之真在与人之真在的遮蔽，尽一切可能通过重新命名使存在重新敞开。\n\n三、“手记”特色\n\n于坚常用作品xx号与便条xx的方式标记他的诗歌。这些“手记”更贴近于一种“生活流”的诗性，但它们的诗歌意义或许更多在于一种脱离历史时间的对生活的狎昵，一种非时间意义的“连续性”。阿拉伯数字的无名特性和序列特征，并非强化了于坚诗歌的连续性，而是借助断片对生活流的无限重新开始和审视，来强调重复和反复对于诗歌的重大意义。\n\n四、新鲜的诗歌意象和生存经验\n\n于坚的诗提供了较新鲜的诗歌意象和生存经验，比如《爵士乐》。在诗中，中西地理的漂移，今昔的时光闪回，人与物的非情节性的切换，都节奏急促。于坚只把握书写的某种状态，而对这种状态的诗歌能动性却充分放任自流。在云南、纽约、贝斯、吉他、阿姆斯特朗、毛主席、我、冬天、秋天这些语词之间，于坚丧失了必要的经验，在梦呓一样的陈说中让它们平等。在于坚的诗歌王国里，生命是诗的，有机的、无机的，历史的、现实的，人、物，实词、虚词，都有平等存活的权利。","keywords":"“拒绝隐喻”语言自觉意识“手记”特色 新鲜的诗歌意象 生存经验","note":"于坚诗歌创作最重要的一个特征就是他“拒绝隐喻”的诗歌创作理念，这是理解于坚诗歌创作特征的基础，而他的其他特色如语言自觉、“手记”特色等都是从这一理念延伸出来的。大家除了要关注于坚的创作特征之外，还要注意一下其《尚义街六号》这一代表作品，很可能会让大家结合这部作品论述其创作特征。当然，也会针对《尚义街六号》出一些名词解释。"},{"id":"407","stars":"★★★","title":"谈谈你对韩东诗歌创作的认识","body":"韩东的主要贡献是标举了与朦胧诗的精神高度与唯美倾向迥然不同的平民美学，并且提出了“诗到语言为止”的主张。韩东诗歌创作的数量并不多，但影响很大。其创作特征主要表现在一下方面：\n\n一、诗歌内容主要分为三类\n\n在诗歌内容上，韩东的创作大概可以分为三类：其第一类作品明显体现了“新生代诗”非文化、反崇高的诗学观念。如《有关大雁塔》是反杨炼《大雁塔》之意而用之，它对后者附加在大雁塔上的历史文化含义进行了非常尖刻的反讽。韩东的第二类诗作，是发掘日常生活中的“诗意”，这些作品与于坚的作品有异曲同工之处。韩东的第三类诗歌，是那些成功地将小说笔法挪用到诗歌叙事中的作品。特别是20世纪90年代以来，韩东诗歌的叙事成分大大增强，抒情者几乎变成了一个客观冷静的观察者。\n\n二、艺术特质：冷静与超脱\n\n韩东诗歌的艺术品质可以概括为一个“冷”字，即冷静与超脱。韩东的诗歌大多句式单纯、语词简洁，采用符合其消解意旨的日常口语，在克制冷峻的叙述语气中透出某种讥诮。这种“冷”既包含着平民化的立场，更主要是指其诗歌表达方式上的口语与浅易特征。比较典型的如《有关大雁塔》《你见过大海》，都刻意采用了口语和刻意平淡的叙述语调。\n\n三、“诗到语言为止”\n\n“诗到语言为止”是韩东及“他们”诗人提出的诗学命题，这一命题以口语对文化传统进行“悬置”，转而关注语言，对“第三代”诗人产生了较大的影响。韩东和“第三代”诗人诗歌的语调都较沉着，具有对白特征与日常生活情境。他不刻意表现对诗语的概括力和名言警句的追求，自始至终都尽可能用自己的语言来书写个体情绪，探索新的话语体系。韩东希望触及汉语的诗语本质，恢复真正属于汉语的表意功能或诗歌功能。他以崭新的不同于外倾的抒情方式，沉默、隐忍喜怒不形于色，专注抵达细节，建立与世界的新关系。\n\n四、善于在生活细节上发现诗意\n\n韩东在日常生活中引领类型化的抒情走出窠臼，用沉静的、沉默的语调让喧嚣的空间沉寂下来。韩东的创作，直接、具体地触及人的生活情状，通过与日常生活保持审美诗意的敏感来探索诗与真理的关系，重视清晰、朴素、简洁的语言。对“自我膨胀”的“破坏性”能量的警觉，使韩东设法在生活“本质”的破解、发现，与对已知经验自我的虚妄干预的控制上，建立必要的平衡。","keywords":"诗歌内容 冷静与超脱 “诗到语言为止”生活细节上发现诗意","note":"在新生代诗人之中，除了海子之外，以于坚和韩东考查频率最高，而对韩东的考查，又多围绕其《有关大雁塔》等作品进行，会出现一些名词解释和赏析题。不过，也会针对韩东出一些论述题，故此我们要有所准备。"},{"id":"408","stars":"★★★★","title":"海子诗歌创作的艺术特色","body":"海子的诗歌正如他自己所说，可以分为两类：纯诗（小诗）和唯一的真诗（大诗）。这两类诗歌尽管在艺术追求上有所不同，却显示出一些共同的特征。\n\n一、核心意象：土地和太阳\n\n海子出身于农村，对土地有着深厚的情感和眷恋，这也使得他后来时常将自己的理想以及对爱与美的追寻寄寓在没有被现代城市文明所浸染的乡村。也正因如此，土地就成了海子诗歌中独特而又多次重现的意象。在海子的诗歌中，另一个核心意象-太阳复现的频率也相当高。如果说，对土地的挚爱是诗人对生命和文化根性的坚守的话，那么对太阳的吟诵则是海子对理想和超越性精神的追求。\n\n二、善于运用朴素甚至口语化语言表达真实、自然的情感\n\n海子的诗歌风格独特，它浪漫、敏感、纤细，甚至能让人产生怜惜的痛感。海子在诗歌语言方面与新生代诗人有着相似的特征，善于运用朴素甚至口语化语言表达真实、自然的情感。就比如海子的短诗，单纯、简洁、流畅、想象力充沛，语词在浪漫、梦幻中飞翔。少年的乡村生活经验，在诗中构成一个质朴、诗化的幻象世界：麦子、村庄、月亮、天空少女、桃花等带有“原型”意味的意象是基本元素。在短促的诗歌生命当中，他以自由的写作状态最大程度地完善了他的诗歌王国。\n\n三、认同死亡的情感\n\n海子与顾城是80年代诗人当中较早对生死等哲学问题进行思考的诗人，在他们这里，死亡不再被当成诗歌观念，而是形成了鲜明的诗歌意象。海子诗歌中就汇集了诸多关于死亡、黑暗等神秘、不可知的宗教意象，充满着一种绝望的、执著地认同死亡的情感，但这种绝望并不显得颓废，而是显得异常壮美，这与他的内心气质和后来的命运有关。海子去世以后，诗人的死亡成为解读诗歌的注脚，在一个阶段内影响较为深远。“倾心死亡”是海子对艺术和生命的一种终极式的哲学理解，是使他的作品焕发出神性与不朽力量的原因之一。\n\n四、史诗性的诗歌理想与追求\n\n海子有着高远的诗歌理想，他试图建立一种“不是感性的诗歌，也不是抒情的诗歌，不是原始材料的片段流动，而是主体人类在某一瞬间突入自身的宏伟-是主体人类在原始力量中的一次性诗歌行动”的大诗，并且也身体力行地在长诗方面作了尝试。海子借鉴了西方史诗的结构经验，以太阳、盲诗人、祭司、豹子、马、鹰、石头、血等意象为元素，为他的史诗“自创”出一套神话象征体系。不过，就目前所提供的文本看，海子远远没有实现他的理想与诺言。","keywords":"土地和太阳 核心意象 风格独特 朴素、口语化语言 认同死亡 诗歌理想","note":"在新生代诗人之中，海子可以说是名气最大的一位，像是“面朝大海，春暖花开”这样的句子，直至如今仍广为流传。故此，在考查中很可能会针对海子进行考查，尤其是今年正值诗人海子诞生六十周年、逝世三十五周年，大家更是要重点准备。相关内容可以参考董迎春《“大诗写作”：普世性写作-论海子的诗歌写作》、但向婕《海子抒情诗歌语言韵律风格研究》，具体资料可以在李凡文学正版群中领取。"},{"id":"409","stars":"★★","title":"西川诗歌创作的特色","body":"一、基于西方文化观念的美学风貌\n\n西川写得较好的诗歌大多是以西方诗人、作家或艺术品为书写对象的诗作，这些诗歌因其书写内容与语言风格巧妙的和谐状态，而给人以一种审美的安适之感。不过也正因此，西川诗的诗很像是一个有中国经验的外国诗人，对汉语有连续的借用，读来像译诗。\n\n这是因为西川的审美观是移植的，不能呈现汉语语言的特异性和中国经验。他富有想象力，但并没有对他所立足的文化土壤和生活保持敏锐的感触力。在《寻找海洋》《十二只天鹅》《暮色》等诗中，他一遍又一遍绘就的图景，大多是以想象的、非现实的西方文化结构作为支架。在他的诗歌中，很难发现细致、明确的东方生活。在西化的本体和个性化的喻体之间，完成一个想象的过程、一个修辞诗语堆积的过程，这成为西川诗歌写作的主要方式。\n\n在90年代，西川的这种诗歌美学曾被作为诗歌美学追求的方向，后来逐渐被崛起的更具有本土意识、更契合汉语美学的诗歌潮流替代。\n\n二、具有意象美的特征，但有较多的敬畏感\n\n西川的诗风受到海子潜移默化的影响，诗中有海子意象美的特征。他的断行、断句较为整齐，对于某一具体诗境有细化、铺陈的耐心，诗歌也体现出较为严密的思路，富有逻辑性。西川的诗歌中，取材于宗教因素的意象非常多见，如羊群等，由此表现出了一种宗教氛围。不过，西川没有用自己的诗歌意象建立一个相对独立的诗歌王国，所以这种宗教氛围也就没有了独立性。因而，与海子诗歌的奔突冲撞较为不同，在西川的诗歌中，有较多的敬畏感，他并没有狂放奔突。\n\n三、抒情程式化\n\n西川的诗歌也探求韵律，但大多是对十四行诗的模仿，如《秋天》《月光》《大雪》都是十四行诗。他讲述日常的气象，启用一些在西方诗歌中较为常见的诗语，如风铃、天堂、葡萄园、海妖、马厩、金星等。因此，读他的一首或两首诗歌，能够感觉到他诗歌的独特性，它们确实构筑了他诗歌的独特美学，但对他诗歌的连续阅读中，会发现抒情程式化的痕迹。这些诗歌井没有贴近汉语所对应的事物与生活。","keywords":"西方文化观念 意象美 敬畏感 抒情程式化","note":"西川受到了海子的影响，不过其最明显的特色是西方文化观念色彩浓厚。这种写作方式，在让西川的诗歌显示出独特的色彩的同时，但却不契合汉语美学的需要，最终被替代淘汰。相关的内容，我们需要有所了解。"},{"id":"410","stars":"★★★","title":"80年代散文创作的整体特征","body":"一、创作主体众多\n\n80年代老中青三代散文家相承共耕，散文的园圃逐渐恢复了生机。老一辈作家由生活酿造的情思被新的时代所激活，散\n\n文写作成为他们反思历史、观照现实、探寻人生与社会意义的一种得心应手的方式。中青年作家成为80年代散文创作的主力，在继承和超越中实现着散文审美的调整。一批50年代出生的青年作家，思维趋变，创作活跃，以独特的风格成为80年代散文中引人注目的新星。女性作家的散文创作在80年代显示出卓然可观的集团优势，以其各具姿色的创作，演绎着女性散文亮丽的风景线，以作者对社会、对人生独特的观察与对生命本体的独特感悟，呈现出独具风情的女性世界。\n\n二、对散文本体意识的自觉\n\n80年代散文创作的特色与价值，显现于创作主体对散文本体意识的自觉。在现当代散文发展史上，政治话语曾经直接而大量地进入散文创作。散文的审美创造的品性被忽视与弱化了，它所表现的艺术空间因被挤压而十分逼仄。80年代，散文作家开始注意按照散文本体的规律进行审美性的写作，创作的视域得到了拓展。散文作者既关注重要的人物事件，又更多地叙写日常生活场景或私人化的故事；既观照外在的人事物象，又表现主体丰富复杂的心灵世界。这一时期优秀的散文作家善于将自我与外在沟通，将琐事与时代串联，发挥散文文体的优势。\n\n三、找回了久已失落的文体精神\n\n80年代散文的新思路，在于找回了久已失落的文体精神。散文研究者林非说：“一个散文创作的新时期已经来到了，它最为突出的标志就是追求尽量地达到‘真”。”真实与真诚，是散文文体的基本精神与品格。新时期实事求是思想路线的重新确立，促使散文作家解放思想，更新观念。拥有更多精神自主性的散文作家，开始根据自己的亲历经验和体悟思省，真实地反映历史与现实、人事与物景。新时期发韧时的哀祭反思类散文，追忆流年岁月，悼念患难故人，反思荒诞历史，作品情真意切，读来启思动人。\n\n四、积极探索文体新质和新的表达方式\n\n80年代散文作家本体意识的自觉，表现为对文体新质和新的表达方式的探索。这一时期的散文，已经开始打破传统“形散神不散”的旧有范式，随物赋形，摇曳生姿。80年代后期，散文变革潮起。刘烨园、赵玫等主张散文文体革命，将主体潜意识与现代哲思引进散文本体，影响及于创作，散文的精神品格与文体形态都发生了变化。","keywords":"老中青三代散文家 散文本体意识的自觉 文体精神 文体新质 新的表达方式","note":"80年代的散文创作整体呈现出复苏的趋势，得益于三代散文作家的积极探索，散文逐渐摆脱了政治话语的束缚，开始转向对景物的描摹和对情感的表达，显示出了许多新的特质。大家把握住80年代的整体趋势，结合80年代散文内容具体分析即可。80年代散文创作相关的名词解释，我们需要注意巴金的《随想录》和杨绛的《干校六记》这两部作品。"},{"id":"411","stars":"★★★","title":"汪曾祺80年代的散文特色","body":"汪曾祺的文字鲜活清灵，言志多于载道，氤氲着特有的温馨与静美。他80年代的散文，主要具备以下特色：\n\n一、淡入淡出\n\n本着“把散文写得平淡一点，自然一点，‘家常”一点”的观念，无论涉及何人何事，汪曾祺都几乎不做道德评价，也很少流露热烈的感情，而总是保持着宽厚、平实、幽默的态度，疾徐有致、娓娓而谈。\n\n二、以情致为基点\n\n所谓情致，即趣味与格调相统一的另一种表达。汪曾祺出身于书香之家，文章出众的祖父与多才多艺的父亲无疑给了汪曾祺以最直接的传统文化熏陶。尤其从父亲那里，汪曾祺继承了旧式文人的浪漫、风雅的情致。虽然新中国成立后的政治运动基本摧毁了旧时文人风雅的生活方式，但文化精神本身的生命力还是被延续下来。一系列氤氲着风雅之气的作品，既体现了汪曾祺皈依传统的古典文人情怀，又体现了其艺术追求。\n\n三、选材上保持平民立场\n\n汪曾祺散文的选材始终立足于日常生活，关注着竹篱茅舍、小桥流水，以清淡之笔写平常人事。在汪曾祺看来，风俗是一个民族集体创作的抒情诗，它反映着一个民族对生活的挚爱以及对“活着”的欢悦。为此，他对民间生活持有发乎内心的热爱和欣赏。在他笔下，无论城市的还是乡村的生活，无论普通人还是名学者，都无本质的差别。因为他所关注的是生活本身的“生趣”以及人生内在的欢乐和人性的美好。因此，他的作品才能生出亲切感，并常有童心和幽默。无论记人事、写风景、谈文化、述掌故，汪曾祺的作品都不以主题的宏大、意旨的深刻见长，而以对平常人事的平常心态显示出一种从容自在。\n\n四、笔调清淡，文风亲切\n\n在叙述上，汪曾祺建构了自己的平民话语。他使用的是一种毫无修饰、平淡至极的笔调。如果在写作中需使用生僻词语或家乡土语，汪曾祺总要解释清楚。这种不厌其烦的解释使其本不艰涩的文字变得更为通俗，文风更为亲切。需要说明的是，\n\n文笔的清淡与文风的亲切并不与字句的讲究构成矛盾。清淡的笔调指的是汪曾祺散文不过分放肆情感与笔墨，并尽量避免使用生僻字句所形成的平易性。字句的讲究却是其文求雅洁的刻意追求，是点到为止的简约、纯净与朴素。雅俗的自然转换使汪曾祺散文虽淡而有味，可雅俗共赏，沟通了古典文人趣味和当下平民话语。","keywords":"淡入淡出 情致 平民立场 笔调清淡 文风亲切","note":"汪曾祺师从沈从文，他的散文创作和沈从文的散文创作一脉相承，无论是整体的风格还是叙述时的笔法，都有许多相似的地方，大家可以将二者放在一起进行记忆。相较于汪曾祺的小说，汪曾祺的散文整体考查较少，但部分学校会针对汪曾祺的散文创作出一些赏析题，因此这部分内容我们还是很有必要了解的。"},{"id":"412","stars":"★★★","title":"孙犁晚年散文的艺术特征","body":"晚年的孙犁选择散文来回顾过往、倾吐积愫。孙犁的文字不似巴金那样饱含热情，虽同样以取信后世、教育后代为目的，但孙犁忆旧说史时感情内敛，尽量不动声色。孙犁这一时期的散文，主要具有如下特征：\n\n一、颇具温情的个人历史\n\n孙犁散文取材广泛，童年趣事、乡里旧闻、求学感怀、行伍生活、书中之趣、学中所得、昔人之忆、今朝之慨等无所不包，几乎囊括了其生命的全部过程。当然这部个人的历史也从侧面反映了时代的变迁。但因为“汰除恩怨”的自律，他对关乎时代变迁的个人历史的叙述是有选择性的。孙犁忆写的多是个人历史中暖阳清风的日子，即便写到阴霾满空的岁月，也会选取那些能在阴霾中略见微光的往事，而很少涉及阴霾后的电闪雷鸣。偶尔涉笔“文革”，他也刻意回避对苦难往事的再现和对某些恶行的批评，而仅着意于对丑恶与艰难中尚存的美好人性的赞叹。这种发现美、赞扬美的人生态度及写作立场，使孙犁的忆旧散文成为了对往事的温情怀想。\n\n二、中和之美\n\n情感的自我节制为孙犁散文带来了中和之美，孙犁作品多客观呈现，少主观议论。他似乎欲以“零度情感”远观往事，尽量超然于世态人情之外，不着褒贬。这种情感的自我节制既让喜悦和幸福所带来的喧闹变得沉静，也淡化了世间灾祸和意外可能产生的创痛。读孙犁之作，整体感受到的是其文风的自然平淡、不急不缓、不温不火，以及文境的含蓄蕴藉。孙犁在对个人历史的叙述中，有意避开了大喜大悲之事，同时绝不放任自己的感情。正是这种自我节制为孙犁散文带来了情深而不流于形色、言有尽而意无穷的美学效果。\n\n三、大量融进小说的笔法\n\n孙犁的小说写得像散文，而散文写得又像小说。大量融进小说的笔法，构成了他晚年散文的一大特色。并且，唯其所写的是真人真事，而又无意识地以小说笔法出之，因而其散文所呈现的那些小说化特征才尤为值得称道。以凝练、简洁的“白描”传达出复杂的人生况味，是孙型晚年散文的另一艺术特征。\n\n所谓“冷暖阴晴随日过，此生只待化尘埃”，孙犁这一时期的散文创作，正是孙犁历经世事、看透世情后只求平静度日、安享余生的心愿表达。","keywords":"个人历史 中和之美 融进小说的笔法","note":"经历了一场浩劫之后，孙犁虽然对人性、对“美”仍是一以贯之的认同和追求，但明显有了更多的体会与感悟，因而他的散文也表现出了许多新的特征，大家可以通过将他前后散文风格进行对比，把握孙犁晚年散文的具体特征。"},{"id":"413","stars":"★★★★","title":"试分析巴金《随想录》的思想内涵","body":"《随想录》在新时期文学中开风气之先，率先表达了对灾难中“我”的愚昧、胆怯行为的忏悔，并以一个知识分子的良知和道义，反思了自己理应承担的角色和坚守的岗位。作品因而表现出强健、刚直的主体人格精神和责任意识，具体表现在以下三方面：\n\n一、自我解剖与拷问的勇气\n\n《随想录》最为可贵之处就在于作者以强烈的自省意识对“自我”所进行的无情解剖。它使新中国散文第一次返观了主体的内心，并且既不美饰亦不讳言。在《小狗包弟》《＜家）的删改》《深刻的教育》《解剖自己》《怀念老舍同志》等文章中，巴金对自己灵魂的拷问不留情面、不留余地。新时期之初，对“文革”罪恶的讨伐、对个人厄难的回顾，乃文学创作的焦点题材，而巴金率先超越了对非人年代里个人苦难遭遇的控诉，转向了对自身弱点的反省和批判，显示出了过人的勇气与坦荡的人格精神。\n\n二、干预历史的姿态\n\n面对历史的悲剧，巴金坚持再现历史真相、挖掘悲剧根源，以达到警醒后世的目的。他坚信人的理性力量能避免悲剧的再度发生，因而在《随想录》中多次呼吁建立一个“文革”博物馆。为此，他从“我”做起，将自己在历史浩劫中亲见的人、亲历的事和自己对于人、事的看法、感受-诉诸笔端，从而为“用真话建立起来的揭露‘“文革”＇的博物馆”尽一份绵薄之力。从某种意义上说，与其说《随想录》是文学作品，不如说它是精神旗帜。正是在这面旗帜的引领下，“文革”才成为诸多作家“刺世”与“自省”的双重凭借。\n\n三、倡导“真话”精神\n\n《随想录》被称为“说真话的大书”，一方面因为它是巴金“把心交给读者”的书，另一方面则因为它反复呼唤着“真话”精神。《随想录》中，巴金坚持“讲自己心里的话，讲自己相信的话，讲自己思考过的话”，写真人真事，抒发真情。无论是尽量保持平静叙述的忆念散文，还是针砭时弊的社会批判文字，皆以真话、真情打动人心。除自己身体力行外，巴金还不断论证“假话”的危害性和“真话”的可贵性。散文本是最崇尚真实的文体，然而，不正常的、非逻辑的历史使新中国文学走了一大段歧路。在拨乱反正的新时期之初，巴金提倡的“真话”精神既是对历史谬误的匡正，也是对现实空白的填补。\n\n自我解剖与拷问的勇气、干预历史的姿态、倡导“真话”精神，使《随想录》成为字字泣血的知识分子的忏悔录和启示录，具有一种非凡的思想启示力量。","keywords":"自我解剖与拷问 干预历史“真话”精神","note":"《随想录》不仅仅是一部文学作品，更是一面精神旗帜，在新时期文学之中有开风气之先的作用，是一个有良知的知识分子的大胆自我解剖，显露出了知识分子的勇气与担当。相较于其艺术成就，其思想方面的影响明显更加重要，因而往往也是围绕这一方面进行考查。这部分内容，我们要重点掌握。"},{"id":"414","stars":"★★","title":"试分析杨绛散文创作的特征","body":"杨绛的散文大多为回忆性作品，以写人记事为主。她的散文数量虽不多，却是每经发表即有影响。她的散文创作，主要具备如下特征：\n\n一、平淡与机智、柔美与刚毅的有机结合\n\n杨绛的散文冷静、客观，不事雕琢，语言极其简练，却总有一种让读者荡气回肠的意味，那就是平易之中所蕴含的智慧。她的文字看似平淡，却时常会闪现出意想不到的讽刺与幽默。她文中的警句，常常自然流露于不温不火的叙述之中。杨绛属于那种“喜怒不形于色”的人，永远是一副平静的面孔，不露声色却耐人寻味。这也表现在她的散文中，有时在她那极其客观冷静的描摹中，读者会感受到她无声的愤怒与控诉。\n\n二、学者型散文\n\n杨绛是学者兼散文家的代表，学术研究的经历在她的散文创作里留下了深刻的印记。比如她写“林奶奶”，形容她说话的无次序，居然联想到爱“从半中间儿起”的古希腊悲剧。这种带有职业特点的联想，既让人忍俊不禁，又让人感叹作者知性思维的灵活。这使她的散文不光生动传神，而且显得颇为智慧。学者的身份与经历，为她的散文创作平添了许多雅致的情趣，同时，还培养了她对事物敏锐的洞察力，因而时时表现出与众不同的思维路向。作为学者型的散文家杨绛的思想相对比较“解放”，是一种“自治”的人生哲学和“自在”的人格哲学。\n\n三、注重作品的艺术经营\n\n与当时许多有意识地凸显某种具体的、功利性的意图而忽视艺术传达的文本相比，杨绛更多地注重了作品的艺术经营，可以说她的《干校六记》是本时期描写“文化大革命”的同类散文中艺术性极为显著的作品之一。\n\n这种艺术性主要体现在以“正常”出“反常”，即在个人所遭逢的某种反常的生存处境中努力营造出一种正常的氛围，或将一切反常的遭际努力理解成正常的命运，而悲剧性就在这种变反常为正常的过程中隐隐地流渗出来。同时，杨绛意在“以小见大”，即通过自己以及与自己相关的一群人的遭际反映整个国家、民族的命运。她采取的方式是，从广阔的时代社会背景上截取其中的某一小角，一方面实写这一小角，另一方面则虚虚实实地写整个广阔的时代社会背景，从而使具体所写的人事虽“小”而“少”，但作品的艺术空间却显得广阔、深远。\n\n杨绛的文字简约含蓄，语气温婉，对历史事件多少保持适度距离，作平静审视的态度。她将笔触专注于大时代事件中的小插曲，在对个人的见闻、感受的记述中，也能见到时代的光影。","keywords":"“不事张扬”学者兼散文家 艺术经营 以“正常”出“反常”“以小见大”","note":"杨绛的散文创作虽然数量不多，但艺术成就很高，影响很大。无论是“不事张扬”还是语气温婉，杨绛的散文创作显示出了明显的女性特征，这与同一时期巴金、汪曾祺的散文都有不同。杨绛的散文创作特征主要体现在《干校六记》这部散文集中，这部作品在名词解释中出现频率也比较高。"},{"id":"415","stars":"★★","title":"80年代报告文学有何特征","body":"80年代是中国报告文学最为轰动的时期。感应着变革时代潮涌的社会生活，报告文学充分发挥真实快捷反映现实生活的文体优势，赢得了文坛和社会的极大关注，报告文学因此成为新时期文学的主潮之一。此时期的报告文学，主要表现出以下特征：\n\n一、题材、报告视角和结构多元化\n\n发表于1978年第1期《人民文学》上的《哥德巴赫猜想》是新时期报告文学崛起的标志性作品。以此为先导，形成了知识分子题材的报告文学热。进入80年代，报告文学的题材更加广泛。报告文学作家广泛地摄取社会生活，既叙写改革开放时代发生的重大事件、涌现的各式人物，也披露现实生活中各种令人关注的社会问题；既注重对国内题材的报告，也能放眼世界，以域外人事为题材。报告文学的报告视角也发生了新变。作家不仅从文学、新闻的视角去反映生活，而且也从哲学、社会学、生态学、文化学等角度去观照对象。作品的结构也有了相应的变化。如《走出神农架》采用卡片式结构，全篇共100节，犹如100张卡片的组合。作者在宏大的时空背景上自由地择取表现内容，使作品负载密集的信息量、博大的生活容量和强劲的思想力度。\n\n二、就主题取向的不同，可以分为前后两个时段\n\n报告文学的新闻性决定了这一文体应以现实报告为要务。对现实中存在的问题与令人深思的现象作思考性的报告，是报告文学作家义不容辞的责任。80年代的报告文学就主题取向的不同，可以分为前后两个时段。1984年前的作品注重对先进人物的再现，主旋律色彩鲜明，作品的表达更见精致情采。但前期作品精致有余而信息量不足，主旋律强劲而题材不够广泛。1985年起，报告文学创作发生了明显的变化，批判性主题得以回归。这既归因于社会文化生态，也导源于报告文学作家主体意识和文体意识的自觉。\n\n三、问题报告文学兴盛\n\n问题报告文学是80年代报告文学格局中重要的部分。所谓问题报告文学，“不再以某一个单一事件或人物为中心，而是环绕着一个具有广泛社会性的、人们普遍关注的社会问题、社会现象为中心，进行选材和采访报告”。此类作品涉及社会生活的各个方面。问题报告文学的主要价值在于，这一类作品以一种规模化的强势，警示我们民族应该怀有一种问题意识、忧患意识、危机意识。它具有警世省人的思想意义。有些问题报告文学也存在着一些不足，比如只作问题的铺陈，材料失实，评论也时有偏颇。80年代后期报告文学作品，主要是问题报告文学，以宏观观察为主，信息量大，但其中的一些作品说理过滥，情事见少，文学色彩弱化。\n\n四、报告文学作者职业化、专业化\n\n80年代，一大批作家以报告文学蜚声于文坛。这些报告文学作者多数原先是小说家、诗人或新闻记者，一旦沉潜于报告文学的创作，则原有的角色淡出，报告文学成为他们介入社会、展示才情的重要载体。80年代报告文学作者群体的职业化，确保了创作在较高水准上的持续繁荣，不少报告文学作家经过一段时间的创作积累与探索，逐渐形成自己独特的创作风格。这也从一个侧面标志着此间报告文学文体的成熟。","keywords":"题材、报告视角、结构多元化 前后两个时段 主旋律色彩 批判性 问题报告文学 职业化、专业化","note":"80年代报告文学成为文学创作的主潮之一，这一时期报告文学成就斐然，优秀作家作品不断涌现。相较于之前的报告文学，这一时期的报告文学出现了许多新的特征，整体体现出了创作者主体意识的觉醒。相关内容，我们需要仔细掌握。"},{"id":"416","stars":"★★","title":"徐迟的报告文学创作有何特色","body":"“文革”结束之后，徐迟相继发表了《地质之光》《哥德巴赫猜想》《在湍流的旋涡中》《生命之树常绿》《结晶》《刑天舞干戚》等大量的作品。其中，《哥德巴赫想》是徐迟报告文学的代表作，也是当代报告文学发展史上具有里程碑意义的作品。徐迟的报告文学创作，主要具备以下特色：\n\n一、倾向于知识分子题材\n\n徐迟报告文学中的许多人物，如陈景润、李四光、周培源等都是在各自的专业领域中卓有建树的科学家。徐迟为知识分\n\n子立传，弘扬科学精神，这在题材拓展与主题开掘上有着显著的意义。《哥德巴赫猜想》以报告文学的形式拨乱反正，第一次对当时尚有争议的科学工作者-知识分子-作了热情洋溢的讴歌，为中国知识分子正名。这使《哥德巴赫猜想》在当时产生了非常震撼的力量，陈景润也成为新时期文学人物画廊中一个重要的典型人物。作者写陈景润，从外在的怪异表现中，发现人物对于科学执著追求的精神；写李四光，并没有对人物作全程式的铺写，而是精心截取人生历程中的典型断面，挖掘人物闪光的美质。\n\n二、作品可读性强\n\n徐迟是一位诗人，他的作品中有诗人的激情、灵性与想象，有诗语的清新、凝练和文采。他善于将枯燥变为生动，将抽象化成具体，将专业演绎为通俗，增强科技题材作品的可读性。《哥德巴赫猜想》写到陈景润的研究所具有的价值时，作者运用比喻说：“这些是人类思维的花朵。这些是空谷幽兰、高寒杜鹃、老林中的人参、冰山上的雪莲、绝顶上的灵芝、抽象思维的牡丹。”\n\n三、讲究艺术构思\n\n徐迟的报告文学善于调动生活材料进行有机的组合。《在湍流的旋涡中》叙写科学家周培源的业绩与品质，作品的标题就显示了作者构思的匠心独运：它既巧妙地契合了湍流理论家周培源的学术贡献，同时又暗示了作品叙写的1976年的政治背景。有人对报告文学中细节的虚构提出不同看法，徐迟认为，报告文学“也允许略有虚构，不离真实的虚构”，并且承认《哥德巴赫猜想》中有细节的虚构。","keywords":"知识分子题材 可读性 艺术构思","note":"徐迟是80年代报告文学热潮中的一位代表作家，也是对新时期报告文学发展作出突出贡献的作家，他的《哥德巴赫猜想》在报告文学发展史上具有里程碑的意义，所以在考查报告文学部分时可能会涉及相关知识，大家要有所掌握。"},{"id":"417","stars":"★★★★","title":"试析高行健“探索戏剧”的主要艺术特征","body":"高行健在对东西方戏剧观念考察的基础上，提出参照“西方当代戏剧家们的探索”，“从东方传统的戏剧观念出发”探索“一种现代戏剧”。高行健的现代戏剧在艺术上的创新主要体现在以下方面：\n\n一、推倒第四堵墙，强化剧场性。\n\n高行健强调“戏剧是剧场里的艺术”，认为戏剧是发生在剧场中的、具有即兴性质、观演交流特色的艺术现象，主张回到光光的舞台上，把布景降到最低限度。一切新鲜的形式和观念都会过时，唯有演员面对观众活生生的表演才给戏剧这门艺术经久不衰的魅力。他追求的是戏剧情境或演变的过程，认定情境演变的过程较之人物和个性的冲突更富有戏剧性。《绝对信号》《车站》等都是这方面的例子。\n\n二、多声部复调戏剧\n\n多声部复调戏剧，这是高行健针对戏剧的外在形式与内在主题提出的。形式上的多声部与主题的多义性即其所追求的多层次的复调。同时，高行健很看重在戏剧过程中展示差异与形成对比。《野人》《车站》《彼岸》就是多声部复调戏剧的试验。《野人》被作者称为“多声部现代史诗剧”。时间上下几千年，戏中有四条平行的线：生态问题、寻找野人、现代人的悲剧、《黑暗传》的发现，这些不同内容的线索交织在一起，构成一种复调。\n\n三、具有综合性\n\n高行健融合传统和现代，引入叙述，综合中西戏剧理念，融合古今之所长。一方面，高行健的探索戏剧回归传统戏剧本体。他看重戏剧原始的功能，坚持运用传统戏曲中最古老、原生态的戏剧样式。高行健认为戏剧不应只是西方戏剧的说话形式，而应该是东方戏剧集歌、舞、说、唱于一体，甚至包括“武打、面具、魔术、木偶、杂技”等中国传统元素的形式，现代戏剧要“捡回了这些失去了的手段”。另一方面，高行健的戏剧中西合璧，尤其吸收了布莱希特的戏剧观念与手法。\n\n四、想象性\n\n“探索戏剧”的想象性是对观众的期望。高行健提倡写意的、破除生活幻觉的布景，并自由地调度剧情中的时空，为的是调动观众的想象力。《绝对信号》为唤起观众的想象力，达到理想的观演交流状态，在舞台布景上尽量简洁，在演员表演上则格外强调动作的层次感。其中守车空间的这种写意性假定，需要依靠观众的想象力来落实。而剧作第二重空间-心理空间的展示则更需调动观众的想象才能完成。","keywords":"剧场性 多声部复调戏剧 综合性 想象性","note":"20世纪80年代，戏剧工作者借鉴西方现代派话剧，进行了大胆的探索、革新，留下了一批探索戏剧。探索剧可分为两类：一类是在现实主义原则之下合理地借鉴现代派话剧的手法，丰富现实主义的表现手法，推动现实主义戏剧的发展；一类是在主流话剧类型之外，充分借鉴现代主义的戏剧探索。高行健属于后一种。此题可以从剧场性、复调、综合性和想象性四个方面进行记忆。这里需要注意的是，高行健的代表作品《车站》《绝对信号》，以及“探索戏剧”这一概念，是名词解释中经常出现的内容。"},{"id":"418","stars":"★★★","title":"谈谈沙叶新戏剧创作的艺术特征","body":"贴近生活、追踪时代的脚步，是沙叶新剧作的显著特色。他的剧作，既有直面人生的一面，表现出强烈的参与意识与敏锐的政治嗅觉，又兼有对人生的反思与探索，并有强烈的时代精神。具体来说，沙叶新的话剧创作具有如下特征：\n\n一、鲜明的世俗色彩\n\n沙叶新话剧的世俗性首先表现在对上海这个东方大都市存在的社会问题的关切，并由此把握市民社会的心理动向，或喜其所喜，怨其所怨；或解剖普遍的病态心理。因而，这种世俗性具有现实感、时代感和切近都市市民感性生活的特征。其次，这种世俗性表现为剧作中浓重的喜剧色彩，沙叶新将喜剧与崇高的美统一起来，追求一种较高层次的审美意向，重点揭示剧中人物的喜剧性格，使人在笑声中悟出了深刻的道理。他的喜怒哀乐，他的褒贬，往往通过通俗、轻松而机智的喜剧性台词和荒诞不经的喜剧性单元得以传达，从而与观众产生广泛的共鸣。\n\n二、在写实中结合了现代主义、荒诞手法\n\n沙叶新的话剧结构新颖灵活多变，语言机智幽默，轻松的表面蕴涵着深刻的内涵，有很好的舞台效果。沙叶新的的剧作主要是运用现实主义创造方法，但也借鉴和吸收了各种艺术交流，如象征、夸张、荒诞等手法，增强了作品的艺术效果。同时，他的剧作极其注重观众因素，为了缩短演员与观众的距离，他把舞台空间扩大到整个剧场，使演员与观众融为一体，从而产生出一种强烈的戏剧感受。在这一点沙叶新与高行健有一定的共通之处。\n\n三、哲理品位大于艺术品位\n\n沙叶新话剧总体美学风格是哲理品位大于艺术品位，他的剧作组合成了一个形象体系，令人赏心悦目，又令人为之深长思之，其理性积深在观众（读者）之中，其理性之光烛照人类灵魂。沙叶新在创造中有一种优患意识，他的作品的美学价值是建立在真、善基础之上，他的现实主义手法和浪漫格调的艺术手段有机结合，这种方式更能使沙叶新剧作具有浓烈美学中的现实主义氛围。沙叶新善于把感觉和思想融合起来，他能由表及里由此及彼，去粗取精，去伪存真，深切地揭示生活的本质。\n\n90年代及新世纪文学","keywords":"世俗色彩 写实 现代主义 荒诞手法 哲理大于艺术","note":"相较于高行健话剧的先锋性探索，沙叶新话剧具有更明显的世俗色彩，显示出了与高行健截然不同的创作方向，反而更加靠近传统话剧创作一些。也正因为这二者有着如此明显的差异，所以他们有可能放在一起进行对比，大家要注意一下。"},{"id":"419","stars":"★★★","title":"试分析1990年代中国文学的特征","body":"一、文学潮流淡化\n\n文学潮流的淡化是90年代的文学现象之一。在“新写实”小说之后，文学界又出现过一些潮流性的命名。但由于概念的理论阐释与具体创作之间存在的差异，作家对潮流的形成和推动也已失去热情，它们只是在批评中作为提示文本特征和文体演化征象的概念被使用，而没有得到广泛认可。已不存在类似于80年代那样的以潮流方式推进的那种痕迹。\n\n二、诗歌边缘化，出现“长篇小说热”和“散文热”\n\n在文类状况上，90年代诗歌的边缘化最为突出，诗人的处境、诗集的出版都相当窘困。90年代表现突出的是长篇小说和散文，因而批评界有“长篇小说热”和“散文热”的说法。长篇小说成为陈述这个时期文学成就和特征的主要引例对象，数量大为增加自不必说，活跃的小说家几乎都有一部或多部长篇小说问世，并出现了若干值得重视的作品。\n\n三、批评理论化，文化研究兴起\n\n这一时期，传统的作家、文本批评自然还大量存在，但一些重要的批评成果，其注意力已不完全，或主要不在是作品的评价上，寻求理论自身的完整性和理论的“繁殖”，即在文本阐释基础上的理论“创作”，成为更具吸引力的目标。叙事学、后现代主义、后殖民主义、女性主义等诸种理论在90年代的文学批评中表现颇为活跃。文化研究的兴起，是90代文学批评的另一重要现象。由于意识到面对变化的社会文学事实，文学批评需要做出有效的调整，文化研究逐渐在批评中占有重要地位。\n\n四、“先锋”探索式微\n\n进入90年代，作为潮流，形式探索相对地处于“边缘”位置。80年代中后期的“先锋小说”没有得到延续。不过，从另一角度上说，也可以看做“先锋小说”以及“先锋”诗人在叙事和语言自觉意识上的探索，已成为一种文学“常识”被接受，融入普遍写作实践之中。\n\n五、取材重点集中于日常生活、人的欲望和“历史”\n\n在90年代文化意识和文学内容中，上个十年的那种进化论式的乐观情绪有很大的削弱，犹豫、困惑、冷静、反省、颓废等基调分别得到凸现。世俗化现象，都市日常生活、人的欲望，代替重要社会问题，成为取材的关注点。消费时代的人的生存欲望的书写，开始在“日常生活写作”“个人写作”的命题中获得其合法性。但是，“历史”对这个时期的作家来说，仍是挥之不去的或苦涩、或沉重、或惊惧的记忆，也仍然是90年代文学写作的主题。但是，“历史”的指向，历史反思的立场、方式已发生了改变。历史往往被处理为一系列的暴力事件，个人总难以把握自己的命运，成为历史暴行中的牺牲品。\n\n六、关注生存的精神性问题\n\n八九十年代之交的社会、文化“转型”，商业社会的消费取向，使一部分作家更急切地关注生存的精神性问题。他们在80年代就已确立自己的艺术个性和文学地位，大多有“知青”生活的背景。他们这一时期的作品在剥离80年代理想主义的政治含义的同时，试图从历史传统、民间文化、宗教中，寻找维护精神“纯洁性”的资源。在他们的作品中，人的生存意义与价值的“形而上”主题得到强化。\n\n七、个人化写作兴起\n\n作为对特定的政治、物质威权社会的疏离，在90年代一些诗人、小说家的写作中，“个人”经验获得特别的含义。所谓“特别含义”，指的是脱离了事实上已经解体的用以整合社会矛盾的意识形态，将未被“同质化”的个体经验作为观察表达的主要依据；也指一些作家质疑整体化的“历史”“现实”而将“历史”个人化。在诗歌写作中，遂有“历史个人化”命题，以及“只为个人写作”的提出。小说方面，以个人经历和体验，以及个人的“片断”式感受来组织小说，为被不少作家所采用。\n\n八、用“现实主义”理论和方法重新整合文学作品\n\n在90年代，文学（主要是小说）对现实社会问题，对现代都市物化生活和农村的现实景况的表现，也出现新的特点。由于写作与社会的行进保持着“同步”，并在不同程度上呼应消遣性阅读的需求，这些作品往往重新被“现实主义”理论和方法整合。它们的取材和内涵，表现为两个不同的方向。一是继续维持某种整体性的意识形态经验，来表现现实政治、经济、社会的错综复杂矛盾，虚构性地弥合“发展主义”的现代化目标与传统社会主义政治遗产之间的裂痕。另一是着力表现都市层出不穷的“新”现象，都市的消费性生活，市民的生活趣味等，也涉及“体制”外的人与事。","keywords":"文学潮流淡化 诗歌边缘化 长篇小说热 散文热 批评理论化 文化研究“先锋”探索式微 取材重点 生存的精神性问题 个人化写作 现实主义","note":"当下考查之中，对于某一时期文学整体特征这样的宏观题目考查得越来越多，大家要注意一下。相较于十七年时期与80年代文学的差异，90年代文学与80年代文学的差异并没有那么明显，但还是显露出了明显的不同，因而会单独作为一个文学时期进行考查。90年代之后出现了一系列比较重要的文学事件和文学现象，如“人文精神”大讨论、底层写作、“打工文学”等等，都可能在名词解释中出现。"},{"id":"420","stars":"★★","title":"90年代对中国文学产生影响的环境因素有哪些","body":"90年代，尤其是1993年以后，市场经济全面展开，中国加速融入全球经济“一体化”，导致社会结构重组、资本重新分配、新意识形态建立、文化地形图改写的“社会转型”的出现。与之相关，90年代的文学环境也发生了很大的变化，具体表现在以下方面：\n\n一、“文化经济”出现\n\n文化（文学）体制的改革，在90年代初作为国家文化政策提出。各级作家协会提供稳定生活保障的“专业作家”的人数减少，国家对文学刊物、出版社的经济资助也不同程度削减，甚至要求它们进入市场自负盈亏。版税制度开始全面实施，出版社、报刊虽仍由国家控制、管理，但某种程度的文化产业化，也出现了社会、个人资本对书刊出版的注入：出版、发行在国家“主渠道”之外有了另外的补充方式。由国家推动的“文化经济”的形成和文化产业的运作方式重组，拓展了社会文化空间。文学与政治权力，与市场之间，建立了一种既抵御、又同谋的复杂依存关系。“文化经济”的出现，使文化与政治相对疏离成为可能，改变了原先的权力政治与精英文化构成的文化格局，使社会文化空间的裂隙加大，社会文化空间中的诸种成分、力量之间的关系，也更加复杂化。\n\n二、通过经济集团活动的方式来影响、规范文学取向\n\n在90年代，意识形态权力经典的监管方式仍然继续发挥，不过，明显的趋势是，这一时期很少采用强制性的开展群众运动的文学（文化）干预方式，而是更多运用更具弹性的经济集团活动的方式，来影响、规范文学的取向。提倡“主旋律”是国家一项反复强调的文化战略措施，但也允许、甚至推动一个消闲、流行文化空间的形成。在这复杂的社会语境中，80年代享有“公用空间”的文学界，其分化不可避免，作家创作的定位，价值取向的选择，“灵感”的来源，对“产品”预期的市场效应等，有了更多选择的可能性，也面临更多的制约。\n\n三、“大众文化”崛起\n\n“大众文化”的通俗、流行文化，借助大众传媒的迅速“崛起”，“大众文化”的各类产品大量出现，占据文化市场主要领域，其制作、生产的运作、传播程序也日益“成熟”，它在社会文化中占据的地位和影响也有一定的提升。90年代，通俗、流行文化在中国大陆基本发展成型，成为主要的文化需求对象，并基本上形成一套产业化的生产、运作方式。它广泛渗透在人们的日常生活中，并逐渐成为“主流文化”中的重要组成部分。在文学的领域，主要为了满足窥秘、猎奇、感官刺激、时尚需求等欲望的作品（主要是小说、通俗故事、纪实文学等类型）大批涌现。\n\n更值得注意的是，大众文化不仅生产了具有自身典型特征的产品，而且在挪用、招募、颠覆、消融其他文化、精神产品上释放着巨大的能量。90年代发生的种种文学（文化）现象都体现了这一“转化”。","keywords":"文化经济 经济集团活动 大众文化","note":"文学创作与社会环境密切相关，90年代，伴随着中国市场经济的全面展开，中国社会也在多个方面进行转型，与此相关，中国的文学环境也发生了翻天覆地的变化，由此对90年代作家定位以及创作选择产生了很大的影响，对此我们要注意一下。"},{"id":"421","stars":"★★★","title":"与80年代文学相比，90年代文学有何新变","body":"中国文学进入90年代以后，理论界有所谓后新时期之说，虽然至今对于后新时期的内涵还是众说纷纭，但其所标示的90年代和80年代文学的巨大差异是有目共睹的。\n\n一、纯文学在雅俗的沟通中消淡\n\n随着市场经济中心的确立，人们的价值观念、行为方式和文化态度都发生了转变。传统的文化理念面临挑战与嬗变，以卡拉OK、肯德基为标志的文化世俗化广泛渗透于当今社会生活，人们最具日常性的行为也被烙上了商业文化的烙印。从前赋予文化的那种神圣的精神内涵正在面临消解，文化成为一种普通的商品。这使得人们对作为文化组成之一的文学的期望值也日趋降低。文学不仅离开了中心，不再具有轰动效应，而且当它完全脱离了政府的“供奶”与监控，要依靠自己独立“谋生”之时，其生存方式本身也面临着巨大的挑战。随着大众世俗文化的娱乐性、消闲性、现世性因素渗入精英文学和主流文学，纯文学正在雅俗的沟通中消淡。主流意识形态文学、知识分子精英文学和大众通俗文学相对独立而又彼此渗透。新写实、新状态、新体验、新现实主义等文学都体现出对世俗生活的文化意义和审美价值的关注，以及对形而下与形而上、审美与娱乐、现实关注和终极关怀之间契合点的寻找。\n\n二、人文主义精神价值被淡化，具有泛商品化倾向\n\n在市场化的商业社会中，由于大众传媒的发达和人们生活节奏的加快，当代社会的读者已开始不耐烦阅读文字，而以影视画面来愉悦放松自身，再加上意识形态对于文学有一定程度上的放松，在边缘化的过程中，文学面临着商业法则对自身的侵袭和大众传媒的冲击、震荡。在此过程中，作家的身份、作品的生产与传播、作家和作品的评价都发生着变化，文学体制进行着自身的调适、裂变和异化。\n\n商业化与大众传媒以其自身的规则对文学产生着影响。它使文学和文学批评对现实保持应有的敏锐反应，同时在商业化\n\n与大众传媒的刺激下，那种富于刺激性和冲击力的语言方式和对新异奇特的无尽嗜好受到了极大的鼓励，注重学理规范的批评受到排斥，对文学事件的关注超过了对文学本身的理解，批评为了凸现自身而被改写与误写着，对大众传媒的新闻时效性与新鲜性原则的顺应，使文学与评论成为新闻与时评，而放弃对人类精神价值的关注与探求，造成美学趣味的粗劣与低俗。\n\n90年代文学在从泛政治化向泛商品化的转型过程中，与商业操作之间的关系变得越来越暧昧。作家或与出版社合作，通过选题、创作、包装、炒作使自我形象品牌化，或下海经商，或投入影视创作。在直接的经济利益刺激下，作家在寻求自我意志与经济效益的最佳契合点，甚至被商业运作规则所左右，成为雇佣写作者和泡沫制作者。有时，媚俗性的操作反而成了文学得以表面繁荣的一个动因。\n\n一个奇特的现象是，进入90年代以后，文学一方面被迫退到边缘，一方面又频频制造热点以吸引读者注意，1994年以来各种新口号的频频亮相就是一例。但在这种热闹背后，我们看到的是文学的无奈和悲壮。也正是在这种背景下，我们看到短篇小说中篇化，中篇小说长篇化，长篇小说超长化，以及作品粗陋、芜杂，审美蕴涵贫乏，审美格调低下，显示出泛商品化的文学对利润最大化的追逐。\n\n三、非意识形态化特征得到了强化\n\n90年代文学的边缘化和泛商品化使得文学的非意识形态化特征也得到了强化。文学开始摆脱“国家意识形态工程”的局限，对各种题材内容、风格样式、艺术手法兼收并蓄，体现出极大的包容性。有研究者将这种众声喧哗、多元共生的局面概括为如下几点：题材上的杂多，无所不包；价值立场、审美意识的深刻分化；告别史诗，告别突发性和戏剧化，诉诸生活流和原生态的日常性叙事；消解优患意识，关注平民悲欢的世俗化倾向。以塑造典型为中心，以启蒙主义、人道主义为支撑的经典现实主义失却了其主导地位，但以写实为基本风格，表现乡土中国现代化进程的曲折艰难和个体生存体验的作品，在90年代还是一种坚韧存在的类型。注重文体实验和形式探索的新潮小说在90年代重现辉煌，新潮作家在继续形式实验的同时，对现实、生活进行个人化的体验和深刻挖掘。武侠、言情、侦探、历史演义等通俗文学及以网络和电子传媒为载体和生存空间的网络文学也正式进入文学殿堂。在90年代文学时空中，雅俗沟通互补，现实主义、现代主义、后现代主义并存共生，各种文学样式和艺术手法都以其自身价值获得了合法存在，呈现出松弛自由的风格特征。","keywords":"纯文学消淡 人文主义精神价值淡化 泛商品化倾向 非意识形态化特征强化","note":"90年代，随着商品经济不断发展，文学逐渐脱离了文化中心地位，面临着边缘化的窘境。受此影响，在积极探索自身生存方式的过程中，文学商业化的趋势越来越明显，进而表现出人文主义精神淡化和非意识形态化加强的特点，这也是90年代文学创作与80年代文学创作的重要不同之处。这些内容，需要我们有所了解。"},{"id":"422","stars":"★★★","title":"90年代文学创作为什么会显示出后现代特征","body":"从90年代中国文学实践来看，决定中国文学后现代特征的主要因素有三个方面：\n\n一、“人”的观念的变化\n\n如果说，新时期之初中国文学重构了一个大写的人的神话的话，那么，从先锋小说开始，对人的神圣性的解构、对人的形而下欲望和人性之恶的挖掘，就成了一个重要的母题，也因此，主体的破碎、人的精神品格的降低、生物性本能的放大就成了这阶段中国文学最基本的对于人的阐释。与此同时，文学对人的书写方式上的零度情感以及符号化、冷漠化的处理，也显然与作家的人学观有关。可以说，这种“人”的观念上的变化正是后现代主义的原则在90代中国文学得以实现的前提。\n\n二、存在主义思潮的影响\n\n存在主义哲学反映了西方现代人普遍存在的生存危机和精神危机。存在主义文学是对荒诞、焦虑、孤独、恶心、自我选择、超越、反抗等等问题的思考与表现。从80年代中后期开始，随着启蒙主义文化的日趋式微，以及个人生存问题的日益峻切和现代性焦虑的蔓延，存在主义在中国得到了广泛的传播。以刘震云、池莉为代表的新写实对形而下存在的关注，以韩东、朱文为代表的新生代对欲望的书写等，都可以看到存在主义的影响。这种影响主要是一种新的世界观和人学观的确立，这与后现代主义有着精神上的契合。\n\n三、解构主义思维的影响\n\n解构主义作为后现代主义的一个重要分支，是20世纪60年代中期开始逐渐形成和发展起来的一种哲学文学思潮。解构主义最初是一种立足现实、反对传统形而上学的哲学思潮，这一理论的魅力在于哲学上的破坏性。在撒播过程中，它对文学理论和文学批评产生了巨大的影响和穿透力。德里达当初为消除和拆解“结构”而提出的延宕、游戏、踪迹、撒播等策略性词语，成为解构批评家们的实践指南。解构主义可以说决定了后现代主义的思维基础与认识基础，对90年代的中国文学界\n\n和批评界产生了重大影响，在余华、韩少功、孙甘露、格非、苏童、叶兆言、马原、洪峰、王安忆等众多作家的小说文本中都能找到解构主义留下的痕迹，它们为文学评论界试用解构主义批评理论与方法提供了场地和实践机会。\n\n中国的后现代主义思潮主要沿着人的解构和存在的解构这两个维度展开，而这两个维度其实也正是整个90年代中国文学的基本维度，它使得90年代的几乎所有的文学思潮都或多或少地具有了后现代的特征。","keywords":"“人”的观念的变化 存在主义思潮 解构主义","note":"90年代中国文学的后现代化特征，主要归因于后现代相关思潮的影响，比如存在主义、解构主义等，这些思潮影响到波及90年代中国的作家创作和文学评论，大家在记忆时，可以结合具体作家作品来理解这些以后现代思潮对中国文学的影响。"},{"id":"423","stars":"★★★","title":"谈谈你对20世纪90年代“人文精神”大讨论的认识","body":"一、“人文精神”大讨论的背景与起因\n\n90年代，随着市场经济体制的建立，思想文化也处在转型中，有关人文精神的话题正是在此背景下浮出水面的。1993年年初，王蒙在《读书》杂志上发表《躲避崇高》一文，肯定王朔小说的亵渎神圣和崇高，由此引发出一场关于当代生活和文化中的价值危机和精神迷失问题的广泛讨论。王晓明等人在《上海文学》该年第6期发表题为《旷野上的废墟-文学和人文精神的危机》的对话，一场冠名为“人文精神”的争论由此展开。\n\n三、“人文精神”大讨论的内容\n\n人文学者的共识是，人文精神是一切人文学术的内在基础和根基，正是由于人文精神意识的逐渐淡薄乃至消失，使得智慧与真理的追求失去了内在的支撑和动力，使得终极关怀远不如现金关怀那么激动人心。如果把终极关怀理解为对终极价值的内心需要，以及由此去把握终极价值的不懈努力，所谓的人文精神就正是由这关怀所体现，和实践不可分割，人文精神应该成为知识分子日常生活的一种规范。\n\n而对人文精神讨论持怀疑和异见的，以王蒙的《人文精神问题偶感》和张颐武的《人文精神：最后的神话》为代表。他们分别从世俗诉求、后殖民主义和后现代主义的立场出发，怀疑鼓吹人文精神的现实性和必要性。\n\n三、“人文精神”大讨论的结果\n\n对“人文主义”话题的关注一直持续到90年代末。但这场讨论没有能很好地深入下去，最后不了了之。究其原因，一方面是对人文精神的概念阐释本来就歧义颇多，另一方面是因为讨论双方对人文精神在转型期的复杂性、悖论性认识不足。\n\n四、对“人文精神”大讨论的评价\n\n（一）发生于90年代初的“人文精神”讨论，涉及80年代知识分子启蒙理想挫败失落之后的“精神危机”，和面对“大众文化”“入侵”上的反应，其核心也围绕知识分子的精神价值和社会功能问题展开。现实中国主要的文化差异、矛盾，所谓“国家意识形态文化”（“官方文化”）、“精英知识分子文化”（“高雅文化”）和“大众文化”（通俗、流行文化）的虽然有迹可寻，但也互相渗透混杂的情况，在论争中得到了展示。\n\n（二）在经济市场化的时代却展开“人文精神”大讨论，这无疑有着发人深省的意义。在趋向物化的时代里，“人”的抵抗、坚守和自我救赎的努力本身就已经弥足珍贵。在边缘化的社会境遇中，人文知识分子勉力发出属于自己的声音，这至少要比随波逐流、自甘沉沦的态度更值得赞赏。但“人文精神”论争也暴露了一些深层的问题。概念的抽象空疏以及明显的道德批判色彩，说明90年代以来的知识分子对社会文化语境缺乏具体的认识，也很少能给予准确的现状分析与历史评估。","keywords":"王蒙《躲避崇高》王晓明《旷野上的废墟-文学和人文精神的危机》规范 后殖民主义 后现代主义 精神价值 社会功能 发人深省 深层问题","note":"“人文精神”大讨论是20世纪90年代中国文学界十分具有影响力的事件之一，其出现主要是受到市场经济体制建立，思想转型的需要。多数情况下，这道题目会以名词解释的形式进行考查，但也有部分学校会以简答题乃至论述题的方式针对这些内容进行考查，所以对此我们要有所掌握。"},{"id":"424","stars":"★★★","title":"结合下述作品（至少三部）具体的思想内容、艺术手法，简述中国20世纪八九十年代女性写作的嬗变（26南京大学）","body":"谌容《人到中年》（1980）、张洁《方舟》（1982）、铁凝《玫瑰门》（1988）、林白《一个人的战争》（1994）、陈\n\n染《私人生活》（1996）\n\n新时期以来的女性写作，是随着思想的解放复萌和发展的，并且呈现出了比较明显的阶段性特征，经历了一个自发到自觉的过程。八九十年代女性写作的嬗变，主要表现为以下几个阶段：\n\n一、80年代初期：女性意识刚刚开始萌芽，较为朦胧，往往被视为主流叙事话语的一部分\n\n80年代初期的文学中，女性存在分量的加重和基于女性视角的社会、历史反思具有同步性。并且“在80年代一系列迅猛的中心突破中，女性写作与话语进而被有效地阐释、吸纳为主流叙事及话语的一部分”。在这一时期以女性为主人公的社会问题反思文本中，与婚恋相关的女性叙写主题逐步得到了强化。在最初的婚恋主题的书写中，女性意识依然是传统的，只是文学题材主题与女性对象的变化。\n\n这一时期的女性写作，以谌容的《人到中年》为典型代表。小说中的陆文婷是个好医生，但她还想努力做个好妻子、好母亲。生活的困顿、多种角色的重负，终于使她身心交瘁而倒下。但是，陆文婷不是作为一个深陷性别生存困境的女性形象，而是作为一个忍辱负重、无私奉献的知识分子形象被塑造和接受。由此可以看出，女作家的性别关怀此时还相当朦胧、并不自觉，几乎淹没在对更具有普遍性社会问题的关注中。\n\n二、80年代中后期：性别意识与女性意识开始走向自觉\n\n稍晚于张洁等人，一批年轻的女性作家逐渐登上了80年代的文坛。受到思想解放运动的进一步影响，也因其自身旺盛的生命活力，张抗抗、王安忆、铁凝等人的创作，在女性意识的自觉方面表现出了前所未有的敏感。这批作家的特点是：以鲜明的女性立场，通过书写两性情感题材，表现女性在灵肉两个方面的性别自觉，传达其对男权社会与文化的反叛、对女性历史命运的思考、对拯救与解放途径的找寻。\n\n铁凝《玫瑰门》中司猗纹在命运戏弄、人生挫折、精神流浪中形成自虐与虐他的变态生活方式，她在家庭生活中虐待公公、窥探他人隐私和耗费自己的过程就是生命“如同浸润毒汁的罂粟花”，成为恶之花光影的过程。而外孙女苏眉预示着新的女性生长。小说对女人在文化环境中的命运的揭示蕴含在“玫瑰门”中。“玫瑰门”实际上是作为女性生殖产道的叙事意象（它与“垛”的意象相呼应），既意味着女性强大的生命力，又表明其遭遇的无穷灾难，是对女性荣耀和苦难的深刻象征。这一切构成丰繁深厚的女性人文意蕴，标示了《玫瑰门》女性主义叙事的意义深度。\n\n三、90年代：从性别自觉走向话语自觉\n\n如果说，20世纪80年代的女性写作逐步完成了其在“性别”意义上的自觉的话，90年代的女作家们，随着西方女性主义理论的进一步传播，则开始自觉地构建女性的话语系统，从而使当代中国的女性写作进入了一个“话语自觉”的新阶段。\n\n陈染的《私人生活》就讲述了一个女性成长的故事。作家借助现代主义的某些表现手法，通过对倪拗拗“病态”语言所进行的详细描述，透露了女性幽闭的精神世界以及她们不被人理解的思维方式，表现了女性内心由于极度的孤独所导致的痛苦和迷乱。小说中，幽闭情境下私人空间的幻觉、脆想、独白、自恋、自闭、白日梦式的纯粹的精神历险，构成了一种巫女般怪诞与迷乱的总体氛围，同时再加上那种“躯体语言”的弥漫及其隐语式的传达，所有这些，和西方女性主义者“妇女必须写妇女自己”、必须“将身体嵌入历史”的口号式的倡导是完全一致的。这正体现了90年代的女性创作已经步入了话语自觉。\n\n当代女性文学留下了一条从女权到女性、再到女人的写作轨迹。从张洁、谌容到林白、陈染，女性意识不断被具体化。形成了一道令人瞩目的文化景观。","keywords":"80年代初期 开始萌芽 主流叙事话语的一部分 80年代中后期 走向自觉 90年代 话语自觉","note":"新时期以来的女性写作，呈现出了明显的阶段性特征，这种状况，与这一时期社会思潮的变动是密切相关的。大家在进行梳理时，也是主要抓住“从自发到自觉”这一核心脉络，结合各个时期的代表作品去进行分析。要注意题目要求，对作品的分析要透彻、到位。"},{"id":"425","stars":"★★★★","title":"试分析新历史小说的创作特征（25广西大学）","body":"新历史小说是后现代主义思潮影响之下一种消解正史、重构个人小史的小说创作思潮。新历史意味着一种新的历史观念、历史意识开始走进文学的领域。新历史小说的创作特征，主要表现在以下方面：\n\n一、叙事立场的民间化\n\n首先，新历史小说在叙事时采取中立的立场，着意模糊、涂改、忽略作品人物之间的阶级界限，从民间视角观照国民的精神生存状态。其次，新历史小说在叙事时将目光从传统历史题材小说的宏大叙事转向对历史的局部与细部的描摹，着力表现“家族村落的兴衰荣枯以及平民百姓的小小悲欢”，完成了从宏观向微观的叙事转变。\n\n家族、村落的兴衰荣枯与普通百姓的悲欢离合成了新历史小说关注的重点，作家们津津乐道于历史局部与细部的描摹而将宏大、正统的历史叙事的意识淡化、消解，以日益坚定的中和的、非功利化的民间化叙事立场表达对人本身的精心观照，表现出对正史的反叛。\n\n二、历史视角的个人化\n\n新历史小说的创作多从个人化、主体化的历史视角切入，对于历史事件的讲述不是不作参与、不作判断的附和，而是力图消解历史客观性，在历史的讲述过程中显露自己的声音，从而建立自己个人化、主体化的历史视角。\n\n新历史小说的个人化历史叙事视角的选取首先表现在作家喜欢以第一人称来叙述历史，以“我”的个人观点来讲述事件的发生，在故事的讲述中夹杂着大量的心理独白，让人在不知不觉中进入了作家在文本中所设置的叙述情境。而有的作家还迫不及待地频频亮相于故事之中，常常运用“我想”“我以为”等语汇对历史故事加以自己的评论，甚至插入一些不相干的讲述，使作品个人化的历史意识愈发显得浓烈。\n\n三、历史进程的偶然化\n\n新历史小说热衷于以偶然性作为作品关键性情节或人物性格发展的决定因素与推动力量，往往将人物的命运遭际、历史的风云转换都置于偶然性的控制之下，以一个偶然的因素或事件的发生来改变人物的命运或历史的方向，由此表达出对人生的无常与历史的不确定性的难以掌控的慨叹，作品由此而多出了几分捉摸不定、难以把握的飘忽感与无常感。新历史主义作家们在对历史进程偶然性的频繁使用中获得了一种颠覆正史、消解崇高、否定历史必然性、嘲弄历史本质的叙事快感，但也由此削减了作品对历史观照与反思的深度与力度。\n\n四、解读历史欲望化\n\n新历史小说侧重于表现人性与文化范畴中的历史，因而在探究人物性格发展与历史前进方向的动因时多从人性本源与传统文化的角度来展开分析。新历史小说往往将人的欲望作为人物命运与历史发展的动因，在深入挖掘人性与传统文化中的生存欲、情欲、权力欲、嫉妒、家族意识等在人物性格发展与历史前进方向中的推动作用与决定性地位的同时，更表达了对人的本身与民族文化的观照与反思。\n\n五、理想追求的隐寓化\n\n新历史主义作家们在运用文学这一武器对现实、历史、人性等进行批判与反思的同时，也有意无意地流露出对于理想人性与生存状态等的期待与憧憬。作家们往往将自已的理想隐寓在作品之中，以不同的形式表现着共同的精神追求。这首先表现在作品中对具有优秀品质的正面人物的塑造上，这些正面人物往往正直、宽容、坚忍，有着宽大的胸襟与顽强的毅力，始终展示着人性中善与光明的一面。这正是作者着力赞颂与宣扬的对象。\n\n同时，新历史主义作家对理想的隐寓还表现在作品中对人性恶的展露与批判。新历史小说大量地触及人性晦暗丑恶的角落，甚至对此作大规模、多视角的展示，通过对人性与文化的反思，在展露令人触目惊心的丑恶人性与历史真实的同时，表达自己的批判、讽刺之意，从而显露出对现实与人性的关怀情愫和对理想价值的追求。\n\n总之，叙事立场的民间化、历史视角的个人化、历史进程的偶然化、解读历史的欲望化和理想追求的隐寓化是新历史小说创作所表现出来的鲜明的特征。时至今日，新历史主义的文学思潮已由90年代初期的汹涌大潮化为如今的涓涓细流，但它以丰厚的创作实绩必然在当代文学史中占有重要的一席之地。","keywords":"民间化 个人化 偶然化 欲望化 隐寓化","note":"新历史小说的“新”，主要是相对于过往的革命历史主义小说创作来说的。相较于革命历史小说的宏大叙事，新历史小说更多地受到后现代主义思潮的影响，显示出了消解历史、重构个人小史的特征，表现出了对传统历史观念的反叛，是以一种崭新的视角来观照历史，在当代文学史上留下了浓墨重彩的一笔。相关内容可以参考李阳春《颠覆与消解的历史言说-新历史小说创作特征论》，具体资料可以在李凡文学正版群中领取。"},{"id":"426","stars":"★★★★","title":"为什么说《白鹿原》是民族魂灵的命运史和心灵史？","body":"《白鹿原》不仅写出了白鹿原上长达半个世纪的家族秘史，而且写出了一部中国的民族秘史、心史和苦难史，从而形象地展现了乡土中国的历史变迁，审视了中华民族的文化命运，探究了个体人在特定历史空间中的生命状态和人性内涵。具体来说，表现在以下方面：\n\n一、把历史事变、历史思潮落实在普通百姓繁衍生存的感性层面上\n\n《白鹿原》以关中平原上的白鹿村为历史舞台，以白、鹿一族两支的人物为主人公，将半个世纪以来重大的历史事变，诸如晚清危机、辛亥革命、军阀混战、抗日战争、解放战争以及关中所经历的霍乱、瘟疫、饥荒、匪患等天灾人祸都投放到这个舞台上，写出了白鹿村人在长达半个世纪的自然和社会事变中的挣扎、奋斗、困惑和苦恼，以及自然本性和社会道德的冲突、文化遗传和现实变革的交战。\n\n二、追求“秘史”品格，全方位地呈现了近代以来民族的生存追求和文化精神\n\n《白鹿原》在处理近代以来中国的历史时，能够超越阶级叙事模式，通过暗示、隐喻的方式，将重大历史事件的潮起潮落和革命力量的此消彼长融入白、鹿两家几代人的政治选择、家族兴衰以及个人命运变迁之中，并且在历史叙事中融入了大量经济、宗教、文化、欲望等复杂因素，显现了丰厚的历史文化内涵。同时，“秘史”品格的追求，使得小说在叙事立场上具有鲜明的民间性。作者将笔墨主要集中在白鹿原村民生活形态和心态的历史性嬗变上，借助关中农村的沧桑变化和隐秘历史足迹的书写，全方位地呈现了近代以来民族的生存追求和文化精神。\n\n三、书写了人们的欲望世界，揭示了宗法农民文化历史原始、本真的形态\n\n《白鹿原》引人注意的是贯穿全篇的欲望的历史叙事，欲望的每次释放都成为情节发展的主要驱动力，作者借此深探民族文化的深层历史脉络。性，是驱动小说“秘史”情节发展的主要缘由，白鹿原陷入了巨大的性的情结萦绕之中，性成了一个巨大的神话。作者还运用类似于拉美魔幻现实主义小说的手法，将“东方文化的神秘感、性禁忌、生死观同西方文化、文学中的象征主义、生命意识、拉美魔幻现实主义相结合”，从而保持了历史的混沌性和丰富性，在人鬼的相通和冲突中既凸显人性深秘，又潜在地表现民族历史前行的方向与动力。\n\n四、体现出了对民族文化精神的理性审视与焦虑思考\n\n以表现传统文化为主要内容的《白鹿原》中，复杂多面的传统文化是以悖论存在的。在白鹿原上，儒家仁义是民间最为实用的生活原则。它建立在悠久厚重的土地上，以儒家的仁爱哲学为基础性文化，是家与国统一在一种道德规范下的文化。而小说在极力张扬宗法制度下的仁义精神时，又往往难以逃离其中非仁义的一面。在白鹿村一场又一场革命和欲望风暴的冲击下，儒家文化所建构的宗法制度和人伦规范一步步走向没落，就连白鹿原的“精魂”朱先生也无法挽回这一文化颓势。于是，《白鹿原》成为一个欲说还休的民族文化符码，一个想象力丰富的话语世界。","keywords":"感性层面“秘史”品格 生存追求 文化精神 原始、本真形态 理性审视 焦虑思考 民族文化符码","note":"这道题的实质是在考查《白鹿原》的思想内涵。《白鹿原》被称为“民族魂灵的命运史和心灵史”，主要是因为它以小见大，通过对白、鹿两家半个世纪秘史的展示，表现了乡土中国的历史变迁，并且通过多种手法的运用，审视了中国传统文化与人性内涵。相关内容可以参考王仲生《＜白鹿原》：民族秘史的叩询和构筑》、李建军《一部令人震撼的民族秘史》，具体资料可以在李凡文学正版群中领取。"},{"id":"427","stars":"★★★★","title":"试分析《白鹿原》的艺术成就","body":"陈忠实的《白鹿原》是90年代以来最有影响的小说之一，同时也是新历史小说创作的重要收获。整部作品复调式地寄寓了家庭和民族的诸多历史内蕴，表现了纵横社会人生的“无常”，给人以强烈的历史沧桑感和虚幻感。小说艺术深沉凝练、酣畅严谨，其艺术描写如金针织，锦细透绵密。总体来看，这部小说的艺术成就主要体现在以下方面：\n\n一、将社会历史变动和政治斗争内置于宗族文化的社会结构之中\n\n《白鹿原》一反传统革命历史小说的艺术策略，将近代以来的社会历史变动和政治斗争内置于宗族文化的社会结构之中，&#x5728;显性的政治风云、宗族矛盾书写和隐性的人情、人心、人性揭示中呈现社会历史的变动，真正实现了作者书写“民族秘史”的艺术构想。再加上小说中嵌入了白嘉轩、田小娥、白孝文以及白灵等人的欲望叙事，更凸现了社会历史背后的人性内容，丰富了小说的心理内涵。\n\n二、揭示人物性格的多重内涵\n\n在人物形象的塑造上，《白鹿原》超越二元对立的艺术模式，实现了对人物性格多重内涵的揭示。在突出人物文化性格的同时，《白鹿原》有意识地淡化了人物的阶级身份在政治倾向和人生道路的选择上所起的作用。小说成功塑造了一批性格饱满、富有历史文化内涵的人物形象，如白嘉轩、鹿子霖、黑娃、田小娥、白孝文等，在这些血肉丰满的形象身上寓含了民族和家族的诸多历史与文化信息。作品注重描写人物的复杂性，不但写出了他们的理性行为，而且探寻了他们包括性、暴力、死亡意识在内的隐秘的潜意识世界。小说着意从文化视角刻画人物，在文化人格的塑造上尤见功力。\n\n三、以现实主义为基本色调，同时注意借鉴和吸收外国文学的艺术技巧\n\n《白鹿原》在表现艺术上也进行了有益的探索，秉持着开放的现实主义原则，作家在总结和借鉴中外以往成功的创作经验的基础上，创造性地将现实情节同原始文化、神话传说、寓言故事融会在一起，将象征、隐喻、魔幻等现代主义、后现代主义艺术技巧融入文本之中，卓有成效地营造出了一种亦真亦幻、深邃神秘、富于象征意味的艺术效果，从而在总体上满足了作品对于史诗性和文化省思的文学诉求。比如小说中的核心意象白鹿的书写、田小娥被杀后变鬼的情节都有魔幻现实主义色彩，推动了小说故事发展，调节着叙事节奏，在深化人性复杂性与多元性方面均发挥着重要的艺术作用。","keywords":"反传统 宗族文化 性格多重内涵 现实主义 借鉴吸收外国文学艺术技巧","note":"《白鹿原》是新历史主义小说创作的代表作品，集中体现了新历史小说的创作特征。而《白鹿原》的“新”，主要体现在它对传统革命历史小说艺术策略的反叛上，大家可以从这一点去切入理解。当然，作为一部取得了杰出成就的经典作品，《白鹿原》的艺术成就也不止于此。在展现广阔画卷的同时，作品也塑造了一系列圆形人物，在现实主义创作道路上做出了有益的探索。总体而言，对于《白鹿原》的考查多围绕其思想内容与艺术特色进行，所以对于其艺术特色我们也要重点掌握。"},{"id":"428","stars":"★★★","title":"试分析白嘉轩这一人物形象","body":"《白鹿原》塑造了丰满鲜明的人物群像，而白嘉轩是这群像的典型人物，一切矛盾的中心焦点。他是土生土长的白鹿村人，敬儒学，重农耕，热心社会事务，掌管家族大权，具有多重人格。在作品中，白嘉轩被塑造为中国农耕文化和宗法文化的人格代表。在他身上，寄托着作家对于儒家文化的现代意义的信念。\n\n一、白嘉轩形象特征\n\n（一）宽厚仁义、刚正不阿，具有几近完美的个人品质，代表了以儒家文化为核心的传统的道德理想\n\n白嘉轩宽厚仁义、刚正不阿，具有着几近完美的个人品质，出众的能力使他成为仁义白鹿村的精神代表，积福积德的宽厚长者。其全部人生理想都在于使白鹿村家族兴旺，人人过上温饱而明礼的太平日子。为此，他修身养性、克已自律、耕读传家，终年劳作于田间；他立乡约、修祠堂、正族风、办学堂、兴仁义。旱年祈雨，为示心诚他甚至可以用钢钎自残；苛政之下，他敢于为民请命，率众抗税。总之，白嘉轩殚精竭虑地维护着小农经济背景下的宗法秩序，代表了以儒家文化为核心的传统的道德理想。\n\n（二）作为卫道者，又具有保守顽固、自私虚伪、专断残酷等负面的品性\n\n作为一个地主和封建宗法制度的卫道者，白嘉轩又有着保守顽固、自私虚伪、专断残酷等负面的品性，他是权威族威的化身，他是封建宗法家法的忠实维护者和严格执行者。人性的冷酷无情如同他的宽厚仁慈一样在他身上并存。他狡黠地换取了鹿家的风水宝地，从而“注定”了鹿家后来的衰败。为了维护自己封建家长的威严，他与长子孝文断绝了父子关系；饥谨之年不理会孝文的求救，致使儿媳妇活活饿死。他带头用“刺刷”惩治自己离经叛道的儿子和田小娥；甚至在小娥死后还要修塔镇邪，要其永世不得翻身。凡此种种，都说明了这一人物的复杂性。\n\n二、白嘉轩形象的意义：现出作家对于传统文化的矛盾心态与忧思\n\n在《白鹿原》中，白嘉轩是仁义文化与乡村政治的紧密结合。小说在极力张扬宗法制度下的仁义精神时，又往往难以逃离其中非仁义的一面。一方面，白嘉轩极力以其仁义文化、乡约制度来维持和统治白鹿原这个乡土世界，另一方面又往往以民间最为原始的非仁义的实用生活智慧，来推进这种仁义文化的实施。小娥惨死后，白嘉轩造塔镇妖，更是暴露了仁义文化的吃人性。白嘉轩这种复杂性反映了中华民族传统文化当中精髓与糟粕相互混融、相生相克的复杂状态，同时也体现出作家对于传统文化的矛盾心态与忧思。","keywords":"宽厚仁义 刚正不阿 保守顽固 自私虚伪 专断残酷 仁义文化与乡村政治的结合 矛盾心态与忧思","note":"白嘉轩可以说是中国传统文化的代表，体现出了陈忠实对中国传统文化的审视与思考。而传统文化精髓与糟粕混杂，所以白嘉轩这一人物形象也就具有两面性，所以我们需要从正反两个方面来认识这一形象，进而认识这一人物形象所体现出来的作者对传统文化的态度。"},{"id":"429","stars":"★★★★","title":"试比较《红旗谱》与《白鹿原》家族叙事的区别","body":"一、叙事方式不同\n\n《红旗谱》与《白鹿原》在小说类型上都可以称为家族小说，二者都是以家族的变迁、争斗来浓缩历史嬗变和民族精神的艺术实践。但《红旗谱》让家族直接参与到具体的历史事件中来叙述，表现出阶级的历史希翼，历史信息更直接出自于历\n\n史的“原生情境”，将家仇族恨演化为阶级对抗，并汇入政治斗争和民族矛盾的漩涡中，通过家族生活历程与革命斗争历程相一致的概括性想象，叙述现代中国农民的成长史，完成了以国共斗争为核心的、以农民为主要同盟军的中国革命史的文学建构。这是一种革命的叙事。\n\n《白鹿原》则倾向于家族结构及其变动和一些历史经典行为的叙事，历史信息更多地来自于家族叙事的隐喻性，表达的是作者对民族历史及其存在的思考和生命感受。《白鹿原》的叙事世界是由家族之间、家族内部、家族与社会诸多错综复杂的关系组成的，着力于揭示历史生活形态后面所隐藏的文化因素，它是将家族作为一条固结民族文化的缆绳或锁链，借白鹿家族的兴败动荡，去探索民族生存发展的文化隐秘。\n\n二、人物塑造不同\n\n《红旗谱》中塑造了朱老忠这样一个集民族性、革命性和时代性为一身的人物，作者借当时的典型化手段，几乎让朱老忠集中了中国农民传统英雄性格的最重要因素，尤其是那燕赵慷慨悲歌之士的气度。朱老忠最终在政治理性的引导下，从民族的豪侠之士走向成熟的革命战士，这个性格的成长发展历程，也就是以无产阶级为领导、以广大农民为同盟军、通过消灭敌对阶级建立共和国的历史进程的一种艺术化叙事。\n\n白嘉轩则不是个成长发展的人物，他始终与固结着那块黄土地的文化以及这块土地的生存方式浑然一体，坚守着并且身体力行着祖宗传下来的宗法文化的全部要义、规范和准则，在乡村社会中充当着一个几近人格神的角色。白嘉轩既继承了正面的仁义精神，以“耕读传家、学为好人”为生活准则，也有中国传统文化负面的影子，有时冷酷无情。这个人物既隐喻着民族的人格理想和文化理性，也暗示着民族文化在历史进程中的悲剧感，在这个人物身上，几乎集结了民族性格的全部丰富性和复杂性，融入了作者对于我们民族深重的思考。\n\n三、美学风格不同\n\n豪迈与苍凉，这构成《红旗谱》与《白鹿原》以家族叙述历史在风格上的美学差异。\n\n《红旗谱》的叙述风格是浑厚而豪放的，作者梁斌经历过革命战争和阶级搏斗的洗礼，抱着对一种事业的忠诚与坚信，革命的经历与革命的教养使他更愿意相信革命现实主义的立场阶级观点和党性原则，相信文学要揭示出革命胜利的前景，当他进入创作时，会很轻易地把革命胜利的喜悦与百年来对民族强悍的迷恋融为一体，造出一种民族历史呼啸前行的艺术形象。高亢嘹亮的调子，豪放热烈的叙事，明确的阶级意识和政治激情，这不是一个作家或一部作品的特殊之处，而是50、60年代在中国形成的一种时代文艺的共同特征。\n\n《白鹿原》的叙事风格是苍凉的，这种苍凉的风格来源于作家对民族文化所抱的希望与历史事实“不可能”的内在矛盾。陈忠实在《白鹿原》中并不把正统儒家思想看作国人乃至民族生命委顿的渊薮所在，而让他笔下的主人公在家族这个自足的宗法世界始终处于优越的地位，由此去开出一条文化拯救的路。但陈忠实也清楚地看到白嘉轩和白嘉轩所代表的文化世界在历史面前的无能为力，作家内心世界显然隐藏着一种对我们民族血缘的沉重忧虑，因此，整部家族的历史叙事，在苍劲的基调上染上了茫茫的哀愁，让人体验到一种文化重建的艰辛和苦痛。\n\n总之，《红旗谱》与《白鹿原》一者慷慨激越地真实再现农民斗争的历史，是一曲燕赵地区奏出慷慨之歌；一者冷静地表现文化心理，以周秦旧地向我们娓娓道出其古老深厚的文化内涵。但都是我国当代文学灿烂成果中的两朵奇葩，是十七年和新时期文学精神差异的体现。","keywords":"叙事方式 革命的叙事 文化因素 人物塑造 民族性、革命性和时代性 丰富性和复杂性 美学风格 浑厚而豪放苍凉","note":"《白鹿原》和《红旗谱》都是家族叙事的典范作品，二者的差异，本质上是十七年时期和新时期文学精神的差异，而这文学精神的差异又是由时代的变迁造就的。对于这两部作品，大家可以从叙事方式、人物塑造和美学风格三个角度进行分析，并且可以适当地与其时代背景以及文学思潮联系起来记忆。相关内容可以参考朱水涌《《红旗谱＞与＜白鹿原）：两个时代的两种历史叙事》，具体资料可以在李凡文学正版群中领取。"},{"id":"430","stars":"★★★","title":"试分析阿来《尘埃落定》的思想艺术特色","body":"《尘埃落定》是对藏族这个未经现代意识和现代经验整合的特定生命群体的历史想象与诗意阐释。具体地说，这个独特的生命群体是指汉藏交界地带的藏族人。这部作品的思想艺术特征，主要表现在以下方面：\n\n一、通过“不可靠的叙事人”方法的使用营造出一种悲凉感\n\n《尘埃落定》采用第一人称叙述方法。麦其土司的傻瓜儿子既是重要人物，也是故事的讲述者，是小说的中心人物，小说通过他的眼睛，展现了这座神秘城堡各个生活层面和诸多人物。这种“不可靠的叙事人”的叙述方法，体现了作者的一种“边缘”的自觉意识。在这一人物身上，表现的是一种游离于“中心”的观察、体验和情感，由于他不正常的意识状态，造成作品时空的倒错、现实的荒诞和离奇，使整个作品笼罩在一种亦真亦幻的阅读感觉之中。这一人物在家族内部受到的排斥和悲剧结局，又寓意了人类某些基本事物、精神的涣散、逝去。小说因此有一种悲凉感。\n\n二、题材的传奇、新异与浓厚的诗意相结合\n\n题材的某种传奇、新异，无疑是《尘埃落定》吸引读者的因素之-这其实也是小说作为一种现代文类的特质。土司制度、文化的兴衰，藏族原始神话，部族传说，民间故事谣谚，神法巫术，音乐舞蹈......在作品中是故事的组成部分。但《尘埃落定》不仅展示了特殊、诡异的风情习俗，它还把历史个人、风俗、边地融入对生命形式和意义的探索当中，并以一种诗化的语言追索存在的本质，进而深层次地扣问、发掘悲剧中的美和永恒。这使一种浓厚的诗意贯穿于小说的始终，使读者的心灵由此而得到了某种升华。\n\n三、对语言有自觉地追求\n\n在《尘埃落定》中，阿来对小说语言有自觉追求。《尘埃落定》的词语句式轻灵，但不浅薄；境界的营造不是靠情绪渲染，而主要由细节刻画来实现-这表现了在激情表达上的控制力。阿城追求语言的诗性效果，善于用充满诗意情调的语言渲染氛围，抒情状物。有时，他甚至能够把诗意转化为画境，他的某些比喻修辞，也显示出颇为不俗的连类取譬的想象力。此外，阿来还是一个能心照神交地对天地万物进行观察和体味的人，这一点我们从这部长篇小说中的大量景物描写中可以看出来。他对气味、声音、颜色等，都有极为灵敏、精微的感受力。\n\n四、寓言模式的使用\n\n抒情化的叙事与民俗风情的描绘，象征、寓意等手法的大量运用，使《尘埃落定》中布满了大大小小的“寓言模式”：傻子出身的奇特及他的大智若愚，象征着汉藏文化的交融所产生的魅力；黄特派员的进入，带来战争毒品和罪恶；土司的汉族夫人吸食大烟，象征着邪恶，等等，最终，幸存的土司余脉在罂粟战争中面临着彻底的毁灭。阿来所忧思的正是河谷川坝藏文化的命运。","keywords":"不可靠的叙事人 悲凉 题材传奇、新异 浓厚的诗意 语言自觉追求 寓言模式","note":"《尘埃落定》之所以受到关注，除了它新异的题材之外，作品的艺术成就也是不可或缺的因素，这一点我们可以从叙事方法、语言等方面进行分析，同时也可以注意到，阿来在受到自己民族传统影响的同时，也接受了西方现代主义手法。这些内容，大家要注意掌握。阿来的《尘埃落定》可以说是90年代比较重要的一部作品，在名词解释中很可能出现。"},{"id":"431","stars":"★★★","title":"试分析王朔小说的艺术特征（25西北大学）","body":"王朔小说作为商业文化和市民文化的代表，其创作特征突出，主要表现在以下方面：\n\n一、顽主形象\n\n顽主形象是王朔小说中最突出的人物特征。一方面，王朔小说中的人物在生活中玩世不恭，不断嘲人与自嘲。他们嘲弄作家、知识分子、思想政治工作者、老干部，甚至是尼采和弗洛伊德，嘲笑严肃、正经，亵渎神圣。他们不因袭传统，不遵循现有的大众生活规范，没有行为准则，也无价值标准。他们放弃了对社会的责任，甚至放弃了对自己的责任，能混就混，能玩就玩，一切都在嘲弄和调侃之中。另一方面，这些人又坚持世俗的物质享受主义价值观。他们在个人经济利益方面，不断通过攫取和损害他人和社会的利益来追求物质享受；在生活方式上，表现为追求一种世俗人生的自由和快乐。这些世俗的人生享乐价值观，以其叛逆的特性迎合了大众的阅读心理。\n\n二、语言的反讽与调侃\n\n王朔小说大量反用、曲用、活用中国社会生活中常见的政治术语、“文革”语言，造成读者阅读感受中的滑稽感和荒诞感。他善于把最严肃的与最不严肃的语言，把高度政治化的语言与北京胡同的俚俗语、痞子语以至黑话组合搭配在一起，构成一种“新京味儿”式的消解。这种调侃不仅仅停留在语言的幽默或反讽上，还化入作品的情节与精神本身，构成一种时代文化精神的消费本体。反讽与调侃在王朔的文本中不仅是插科打诨、油嘴滑舌的调料，更是小说人物的性格特征和生活方式，体现了90年代以来的轻松消解却又缺少价值沉积的文化消费状态。\n\n三、“对话情境”的营造\n\n王朔在小说中想要表现类似美国20世纪中叶“垮掉的一代”和“黑色幽默”式的叛逆思想。他并不擅长故事情节的构造，也无意于表现“现实”，而是专心于构造某种“对话情境”，在不同角色互相的“误读游戏”中来展现人物性格，讥刺处于变动时代的某些价值观、社会心理与现象，从而凸显其具有“另类”特征的人格和世界观。这使他的小说在一定程度上具有了批判性的锋芒，对陈旧的意识形态和知识等级制度具有瓦解作用。同时，从艺术风格上看，他的小说因此产生了强烈的类似“室内情景喜剧”的味道。","keywords":"顽主 反讽与调侃 对话情境","note":"王朔的小说创作受到了商业文化和市民文化的影响，因而显露出了明显的反崇高、反精英色彩，表露出了明显的世俗性与消解性。在理解记忆相关内容时，大家甚至可以联系一下王朔编剧的电影如《甲方乙方》，体会王朔创作的反讽调侃色彩等特征。"},{"id":"432","stars":"★★★","title":"谈谈你对王小波“先锋性”的认识","body":"在马原、余华、孙甘露或沉寂或转向之后，王小波之突然被发现，给单调得有点发困的文坛带来了一阵深刻的惊喜。具体来说，王小波小说创作的先锋性，主要表现在以下方面：\n\n一、性的狂欢式书写\n\n在王小波的很多小说中，性成了解构现实的利器。作品中含有大量的性欲描写，将性关系、性场景写得频繁、直露、自然、生动没有忸怩作态，没有遮遮掩掩。王小波既不是将性美化、神圣化，也没有将性丑化、泛滥化，而是将其中立化。他以健康和浪漫的方式，将一个耻于言说的性而平静地还原于日常生活。王小波对传统的性文化心理进行了彻底解构，在性表现的问题上发展了一种新的写作实践，呈现出新的性价值观。从男女之间荒谬的性关系和性意识来透视一种乌托邦式的荒谬的政治现实，这正是王小波小说中性描写的目的和价值所在。\n\n二、叙事极其自由而富有想象力\n\n王小波善于将不同跨度的时间和空间的事物组接在同一个文本中，自然而然地让共时性的文本替代了历时性的文本，从而实现“文本间的互相指涉”。时间在王小波的小说中是通过记忆和遗忘表现出来的。遗忘、寻找、记忆构成了王小波小说的潜在主题，作者以纵横恣肆嬉笑怒骂的方式，触及到了历史的“私处”。同时，他还让历史故事的叙述无限繁殖，情节随意构建，使文本的增殖度很大。王小波在历史文本和现实文本的互文结构中，载入更多人性的思考和自由式的想象思维。\n\n三、反讽与戏仿\n\n王小波通过对反英雄式的人物的塑造，构造一幕幕狂欢场面，其背后是真实的“历史场景”的酷烈和残忍。他的作品用大量奇思异想的议论，对某个荒谬情境的反复分析直至其荒谬性穷形尽相，无所逃遁。与此同时，他随时引入古今中外经典作品的各种文体、名人名言，作为论理、引喻，或以质疑、反诘造成对比。这些引入，带来多种尺度陪衬或反衬一种情景。另一方面，王小波也显示了感觉的敏锐和表达感觉的独特风格。他将“龟头血肿”“磨屁股”“革命时代的痔疮”“地主老财的屎橛子”这些看似粗鄙的词语引入文中，反讽式地呈现革命时代的荒唐无稽。他还大量描写了性，包括性爱的姿势与器官，这些描写兼有工笔的细致和想象的谐趣，它们新鲜、独特，超越了写实层面，达到一种戏仿的效果。\n\n四、语言戏谑幽默而富有思辨\n\n王小波在汉语写作上带来了一次戏剧性的颠覆，他作品的表层叙述常常是荒谬的，思想的机锋隐含在未说出的大量潜台词中，诉诸读者对幽默感的领受、回味。他的语言敏锐机警而内含诙谐，看似粗俗而富于理趣，自由放达中充满感觉的灵动与理性的聪颖，可读而又可思，从而使语言本身构成了一种表现内容。\n\n总之，王小波以其独特的性价值观、与众不同的叙事方式和幽默戏谑的语言缔造了一个小说的“黄金时代”。","keywords":"性的狂欢式书写 自由 富有想象力 反讽 戏仿 戏谑幽默 富有思辨","note":"王小波由于其个人经历，较多地受到西方文化的影响，并以其先锋性的创作继马原、余华等人之后给沉闷的文坛带来了惊喜，甚至对文学界以外都产生了影响，也正因此，其也较多地受到考查的关注。王小波的先锋性，主要表现在对“性”的态度、叙事特点和语言等方面，这些大家要注意掌握。"},{"id":"433","stars":"★★★","title":"谈谈你对“现实主义冲击波”的认识","body":"“现实主义冲击波”最初指90年代中期刘醒龙、谈歌、何申、关仁山等创作的一批关注现实的作品带来的效应，后来扩大指称90年代后期大量出现的以“现实主义”为方法，表现当时乡镇、工厂、城市中出现的社会矛盾的小说在文学界产生的影响。\n\n“现实主义冲击波”作品主要有刘醒龙《分享艰难》，谈歌《大厂》《车间》《天下荒年》，何申《信访办主任》，关仁山《大雪无乡》《九月还乡》，周梅森《绝对权力》，陆天明《苍天在上》等等。\n\n“现实主义冲击波”的写作特点，主要包括以下内容：\n\n一、强烈的现实感与忧患意识\n\n众多“现实主义冲击波”文本题材重大，矛盾复杂，时代感强烈，给人的冲击力之大和触发的联想之广，都为当时所少见。表现出源自五四问题小说的关注现实、关注底层的精神传统，并以对文化转型期浮躁、功利的现实生活的关注而引起一片好评。\n\n作品直面现实社会最为严峻的一些现象，那就是在经济转型期挣扎在生死线上的国有企业、乡镇工厂、以及被抛入生活最底层的工人群体，其笔触涵盖了下岗、拖欠工资、企业三角债、破产、道德价值与利益关系的尖锐对立等方方面面，真实地揭示以改革中的经济问题和民生问题为核心的社会矛盾，贯注着浓重的优患意识。\n\n二、“个人化”走向“公共化”\n\n“现实主义冲击波”与那时风行的“新写实”有所不同，已不再专注于一个小人物或一个小家庭的生存悲欢，而是着眼于国计民生性的大问题，关注整体性的生活走向。某种意义上说，它们扭转了时尚的“个人化”，走向了“公共化”，使文学的干预力量大大提高。把它们放在一起，就形成了一种阵势，一种共同的把握生活的方式和创作的新取向，是为“现实主义冲击波”。\n\n三、类型化的道德主义思路\n\n过于类型化的表述方式就使“现实主义冲击波”陷入了自设的困境，这表现在人物形象固定和将道德与经济完全对立上。在整体的写作理念上，“现实主义冲击波”遵循的是一种类型化的道德主义思路。在思考如何解决道德与经济力量的对立时，诸多文本不约而同地诉诸道德力量的觉醒，小说在这样处理的时候，实际上恰恰弱化了现实主义的批判力量，回避了社会矛盾的本质，把复杂的社会问题简单化、道德化了。\n\n四、叙事立场的暖昧不明\n\n“现实主义冲击波”不乏直面现实的勇气，但却始终缺乏一个确定的叙事立场，游离在民间话语、主流话语和知识分子话语之间，使“现实主义冲击波”的叙事主体在知识分子、体制人员和个人等多重身份之间不断游移，形成了叙事身份的断裂和混沌不明。面对错综复杂的现实矛盾，它所寻求的只是对“社群”矛盾的调和与妥协，因而，在其文本中并没有出现真正的悲剧精神、悲剧品格。相反，由于叙事立场的不确定，文本常常以虚无主义、存在即合理的哲学来消泯对社会丑恶的文化批判，甚至用调和的态度来取消是非曲直的价值判断，并不约而同地表现出“前途是光明的，道路是曲折的”这种模式化的思考指向，从而杜绝了在一个新的精神高度提升小说思考性的可能。","keywords":"现实感与忧患意识 公共化 类型化 叙事立场的暖昧不明","note":"“现实主义冲击波”相关内容，大家在记忆时，可以从其名字出发。他们的创作秉持现实主义原则，因而注重反映显示矛盾。但由于叙事立场的不确定和叙事意识不足，只是“冲击波”而没有形成长远的影响。不过“现实主义冲击波”仍旧是90年代十分重要的一个文学现象，在名词解释中出现的可能性非常高。"},{"id":"434","stars":"★★","title":"你如何看待《马桥词典》引起的论争","body":"《马桥词典》受到注意，不仅是因为对作品的评价存在巨大的分歧，更因为得到媒体渲染的那种付诸法律诉讼的方式。“马桥事件”这场风波纷纷扰扰的背后，的确给90年代的中国文坛带来了热闹，但也提出了一些有价值的问题让我们去思考。\n\n一、从宏观来看，“马桥事件”是一个复杂的文化转型期现象\n\n20世纪90年代是整个社会的转型期，文化领域是震荡最为剧烈的部分之一。大众传媒的兴起，不可避免地改变了文化领域旧有的势力地图。而大众传媒兴起以后，文化的标准、评价作品的标准，开始变得多元化，作家的分化也是越来越明显。\n\n另外一个，当时整个中国文学的主流话语，也处于一种不在场的状态。从这个角度来看，“马桥事件”为我们提供了一次从文化思潮、文学批评、文人风气、传播方式等不同角度观察20世纪90年代文学生态的机会。\n\n二、从文学批评的角度来看，“马桥事件”揭示了90年代中国文学批评的新面相\n\n九十年代，新媒体批评兴起，这种批评不同于传统的文学批评，溢出文学圈子走向了大众的圈子。“马桥事件”的显著特征是新闻报道在其中占据颇为重要的分量，六个被告中有三家媒体就足见一斑，这体现出了媒体对批评的深度介入。也因此，批评家如何在更显自由的领域中有所作为的命题也在大众媒体对文学批评的形塑作用下再次被提出。“马桥事件”这个“没有前途的事情”，折射的是九十年代文学批评的困顿走向。同时，90年代的中国，媒介批评还很不成熟。因此，媒体介入文学带来的负面后果也就更加不易控制，“马桥事件”某种意义上也是一桩因文学批评而起的“新闻官司”。总之，“马桥事件”既凸显了文学批评面临的新问题，也表明彼时大众传媒界媒介批评的不完善，对媒体批评健全发展的呼吁也暗含其中。\n\n三、从文学自身来看，《马桥词典》的论争提出了有关叙事虚构在当前的“危机”和“可能性”的问题\n\n《马桥词典》是否可以看作是长篇小说？它是长篇探索的“个案”，属于某一作家特定表达需要的选择，还是预示某种前景的征兆？在90年代后期，对“现实主义冲击波”的热烈欢呼的同时，也存在着对“现实主义”传统叙事已陷入疲惫、衰落的估计。“叙事的衰落”和探求出路的意识，已经隐含于《马桥词典》的创作构思中，并在韩少功几年后另一长篇《暗示》中进一步展开。","keywords":"文化转型期 文学批评新面相 叙事虚构","note":"一般情况下，《马桥词典》多以名词解释的形式考查。但“马桥事件”作为90年代比较重要的文学事件之一，也会有学校专门针对这一事件出一道简答题或论述题，比如首都师范大学就曾经针对这一事件进行过考查，对此我们要关注一下。关于“《马桥词典》事件”，大家可以参考宋丹《马桥事件：批评的尴尬》、邬萍萍《从笔墨论战到侵权诉讼-“马桥事件”纪实》进行了解，具体资料可以在李凡文学正版群中领取。"},{"id":"435","stars":"★★","title":"结合《务虚笔记》，谈谈史铁生小说创作的特色","body":"一、作品充满形而上色彩\n\n史铁生80年代的小说概括起来有两大特点：一是遵循写实原则，采用白描手法摹写生活；二是用虚拟的寓言讲述自己领悟到的人生哲理。90年代他的创作趋向于虚幻化，逐渐走向虔诚的基督宗教，作品充满形而上色彩。1990年发表的短篇《钟声》把这种宗教精神外化在一个牧师的故事中；中篇《中篇1或短篇4》呈现玄学的宿命色彩；长篇小说《务虚笔记》则把这种虚无引向抽象、玄妙的境地。\n\n二、东方美学特色\n\n被称做90年代优秀长篇之一的《务虚笔记》，是史铁生创作生涯的一个高峰，这部作品体现了“东方美学特色”。这主要表现在两个方面：\n\n首先是符号的全息性。《务虚笔记》塑造了很多人物，医生F和导演N，教师O和画家Z、诗人L和T，残疾人C和他的恋人X，等等。这些人物里没有一个是典型，每个人物都只是一个符号代码，每个符号都是平等的、全息性的，又不能孤立出来，这样就瓦解了人物符号间的差异。所有的人只剩下两个：男人和女人。人与人之间的差别消失，体现出佛教的平等观，\n\n其次是虚实互变。符号的全息性要求叙事符号简易化，但不排斥符号变异的复杂性、丰富性。这种变异在史铁生的创作中就是一种虚实互变，即化虚为实或化实为虚，表现在作品中就是对欲望和梦想的实与虚的幻化过程。\n\n三、勇敢面对现实，透出乐观的宿命意识\n\n宗教精神使得史铁生勇敢面对现实，正是依托这种精神信仰，命运多舛的史铁生才能经受人生的种种磨难。不论过去还是现在，“残疾”一直是他作品中突出的主题，残疾人常常是他故事中的重要角色，即使《务虚笔记》也缺不了残疾人C。描写残疾人的自卑心理、内心惆怅、宿命意识和精神追求，构成他写作的基本要素。基于模式和主题上的重复性，这种写作不免会遭人诟病。但史铁生本人对生存、痛苦、死亡表现出一种常人难以企及的超越感。他的作品语言朴实真诚，淡雅随意，精致优美且富有哲理，在平静的叙述中透出乐观的宿命意识、耀眼的思辩光辉和无限的包容胸怀，苦涩中带有温情，奇崛中包融着关怀。\n\n【李凡关键&#x8BCD;：形而上色彩 东方美学特色 符号的全息性 虚实互变 勇敢面对现实】","keywords":"","note":"《务虚笔记》是史铁生的首部长篇小说，也是他半自传式的作品。虚者，虚无也，务虚者，思考虚无也，务虚与务实相对，体现出形而上色彩。关于史铁生的创作，可能大家更熟悉其散文，尤其是《我与地坛》，但史铁生在小说创作上也取得了不错的成就，这一点大家不要忽视。"},{"id":"436","stars":"★★★★","title":"试分析90年代女性主义小说的创作特征","body":"20世纪90年代，伴随女性意识的充分凸显，女性写作异军突起。更为关注生活的私密性，而较为疏远生活的公众性，是90年代女性文学创作中的共性现象。具体而言，表现在以下方面：\n\n一、鲜明、深刻的性别经验\n\n90年代女性文学的不少作品，表现了鲜明深刻的性别经验。这一时期的女性作家强调那种在80年代被忽略了的角色差异和性别意识。她们的作品，无论是在对父权制中心意识的批判方面，还是在对女人身体的认识、对母性和爱的新的认同以及对人性的重新审视方面，都立足于女性成长与解放这一价值立场。作品通过对女性经验的开掘来解构父权制的二元对立思维，凸显女性作为独立人格的生存经验和意识。\n\n二、自叙传色彩\n\n关于女性写作的个人化问题，往往指涉女性个体的隐秘体验。因此，一般而言，她们的小说都有自叙传色彩，经常是通过主人公一段奇特的经历，展示一位女性的成长历程，有些也许只是内心的微妙活动，不一定都与现实生活挂钩，但它们经常被叙述成一种充满挫折感的记忆。由于有些作家在写小说之前，还有过一段诗歌创作的历史，所以，语言方式带有小说叙事与诗化抒情相结合的鲜明特征。\n\n三、故事性不强，但笔锋更敏感、尖锐\n\n在小说结构上，女性主义小说作品的故事性都不是很强，在讲故事时，也不像男作家那么理智和冷静，而是较多地带着个人的情绪、心境和趣味，作品结构也不讲究。但是，由于具有“个人化”“身边化”“女性化”等特点，在叙述到内心世界某一角落、某一惊心动魄的经历时其笔锋往往显得比男作家更加敏感、尖锐，有一种刻骨铭心的痛感和自虐感，所以它获得很多读者的青睐。\n\n四、唯美主义倾向\n\n唯美主义倾向是很多女性小说在身体和性爱场景描写方面的主要特征。对人流、堕胎过程的描写，对乳房、怀孕、肌肤相亲的诗意感觉，都落实到细密而感性的叙述中，传达出一种女性世界独有的诗意想象。林白的《守望空心岁月》对罂粟的描写中，罂粟散发的香味被描述为“巨大的花瓣”，是“热烈而辉煌”的，而罂粟花给林白的感觉是既“纯洁”又“邪恶”“神秘”而“叛逆”。这种诗化的叙述，显然是作者“在天堂和地狱都熔炼过”，借助记忆的审美感知作出的诗性想象。","keywords":"性别经验 自叙传色彩 故事性不强 笔锋敏感、尖锐 唯美主义倾向","note":"20世纪90年代的女性写作是当时一个比较重要的文化现象，引起了许多关注。同时，由于当下女性主义成为一个热门话题，许多学校也会专门针对这部分内容出题。90年代女性主义小说之中，我们需要重点关注的是林白和陈染这两位，多数情况下会围绕这两位出题。"},{"id":"437","stars":"★★★","title":"试分析陈染小说创作特征","body":"陈染1962年生于北京，上个世纪90年代以“个人化写作”“边缘写作”成为中国文坛独树一帜的女作家。已出版小说专集《纸片儿》《嘴唇里的阳光》《离异的人》《无处告别》《陈染文集》6卷，长篇小说《私人生活》，散文随笔集《声声断断》《断片残简》《谁掠夺了我们的脸》《流水不回头》，创作谈《不可言说》等多种专著。她的小说创作，主要具备如下特征：\n\n一、明确的性别意识\n\n陈染的个人性写作表现出一种明确的性别意识。她凭着女性特有的敏感细腻的情感体验和对人世的沧桑感受，把展示当代女性深层的心灵空间作为自己的使命，通过对这些女性复杂、神秘而痛苦的情感世界的想象性描述，揭示女性个体觉醒之后的迷茫、失望和痛苦，以及面对艰难的生存困境的挣扎和无奈。这其中，既有“成长的烦恼”，也有叛逆的精神冒险；既有恋父与弑父的情结，也有顾镜自恋和同性间的“姐妹情谊”；此外，还有各种各样的闪烁着梦幻般记忆的心灵碎片等。\n\n二、超性别姿态\n\n在陈染的笔下，无论是黛二还是其他女人，都充满了迷惑、怀疑，有时表现为焦虑与心理困扰。这种焦虑与困扰大多数不是对金钱、名誉等的欲望，有时甚至不是对男性的欲望，而是挖掘与显示自己欲望的可能、欲望的能力，是一种形而上的思考与追问。陈染的小说以女性视角对世界做着一种独特的表达，即“性别情境仅仅是这一超越主题的一个表现或一个方式而已”，只是一直以来“角色鲜明的女性身份淡化了形而上的哲理意味”。陈染的写作已突破了女性之私，到达了个人之私，显示出超性别的姿态。\n\n三、哲理化的生存之思\n\n孤独、矛盾的情绪是陈染小说着力表现的一个主题。在陈染看来，人的孤独是与生俱来的，是生存中不可避免的。“女人是什么？”“我将上哪里去？”这类问题清楚地表明了陈染对女性自身命运的焦虑和关注，从存在主义哲学的高度关注女性个体的精神自由。陈染的小说充满哲理化的生存之思，人生和女性的双重场景纠结于她笔下的主人公身上。事实上，陈染始终以知识者和女性的双重身份面对世界，构筑自我与世界的紧张与对抗，文本感伤而晦暗。\n\n四、理想的诗意与对内心真实性的追求\n\n陈染小说在寓言性的想象中闪动着理想的诗意，充满对神秘自然和神秘人生的想象，在想象中追求着女性自我内心的真实性。作家往往透过纷乱的外在意象场面的描写，走进复杂而不可捉摸的内心世界，让她笔下的人物永远处在自我的审视中，体验着灵魂的颤动和不安。","keywords":"性别意识 超性别 生存之思 理想的诗意 内心真实性","note":"①陈染从八十年代初开始发表诗、散文，以小说《世纪病》在文坛脱颖而出，被视为“纯文学”“先锋小说”“严肃文学”女作家中的最新代表。重要作品集中在90年代以后，代表作有《与往事干杯》《无处告别》《私人生活》等。她以强烈的女性意识，不懈的探索精神，成为中国当代文学史上的一位独特而重要的女性作家代表，可谓独树一帜，曾获首届中国当代女性文学创作奖等。②陈染和林白可以说是90年代女性主义小说的典型代表，因而在针对女性主义小说作考查时往往会围绕她们出题，所以我们对于这部分内容要有所掌握。"},{"id":"438","stars":"★★★","title":"谈谈你对林白小说创作的认识","body":"林白与陈染向来被并提，她们在90年代的女性主义写作中堪称双璧。林白主要作品有长篇小说《一个人的战争》《说吧，房间》《万物花开》《妇女闲聊录》《致一九七五》《北去来辞》《北流》等，中篇小说集《子弹穿过苹果》《回廊之椅》等多部，散文集《前世的黄金》等多部。\n\n林白对女性经验的表述较陈染更为细腻也更极端化，具体来说，表现在以下方面：\n\n一、“女性神话谱系”\n\n林白的小说善于以反常规经验的方式来规避男权文化及其叙事传统，构建出属于她自己的庞大的“女性神话谱系”。作家笔下的女性大都有着古怪的名字，她们像是一些醒目的标记，构成了与男权世界的界限。林白对色彩、温度、气味感觉细腻，特别是对女性的心理有尖锐诡异的敏感。不少作品常通过一个认同感极强的女性叙述人之口，描述孤立于平庸社会生活中的女性形象。这些借助自我想象所构造的完美女性形象，与男性中心的社会处境之间产生悲剧性冲突，营造出强烈的情绪化气氛。同时，她以对她们的自我意识与精神潜质的精致刻画，展示出女性世界丰富而奇异的感受和经验。\n\n二、在“回忆”中“飞翔”\n\n林白的作品往往以回忆的方式，来确认一个女人的成长历程和性别意义，回忆往往成为作品最基本的讲述视角。林白以自己的身体和心灵的绝对敏感，借回忆与想象对纯粹的女性世界做出了远比理论更有质感的传达。作家把个人的想象、超验的欲望，与记忆的经验混合在一起，从而产生了一种扶摇而上的巨大的“飞翔”之感，女性世界全部的欲望与无意识都化作翱翔的姿态和升腾的力量，在其中得以诗化和升华。她借记忆让想象飞翔，又借想象去表达个人体验。\n\n三、文本结构如流水一样的散漫、灵动\n\n林白以她直率、洒脱、凄迷而富于魅力的文字将女性的情感和欲望用一种审美的方式激荡起来，有一种“语言的灵动扩张的美”；林白的小说还追求一种激情的流淌和扩张。她往往从一点开始，逐渐蔓延伸展，一泻干里奔突直下，那种生命的含量和情感的力度给人以极致的叙述快感。\n\n四、文本实验：颠覆和对抗\n\n林白于2021年发表长篇小说《北流》，在这部作品中，林白在结构与语言方式上颇费心思，注、疏、笺、异辞的文本结构方式打乱线性时间叙事线索，颠覆和对抗传统小说结构。“李跃豆词典”的粤地方言、异辞的民间语汇、“植物志”的诗歌表述使得小说语言灵动而极富表现力。\n\n林白通过
