<script>
const DATA=[{"id":"1","stars":"★★★","title":"文学革命是在怎样的条件下发生的（背景）","body":"一、晚清和民国初年的文学变革，为文学革命发生埋下了伏笔（没有晚清，何来五四）\n\n（一）早在19世纪末，在维新运动的直接促进下，就出现了突破传统的文学观念和形式。其中包括提出“我手写我口，古岂能拘牵”的新诗派、倡导“新意境”“新语句”和“古人之风格”的“诗界革命”；将小说的政治宣传与思想教化功能极大提高，企求达到“改良群治”和“新民”目标的“小说界革命”；以及要求打破桐城派古文的藩篱，推广平易畅达的“新文体”的“文界革命”。虽然这些由社会变革的热情所煽起的文学革新的尝试，只开出过炫目的花，未结出实在的果，然而其文学因时而变的信念和关注社会变革的使命感，其向传统文学观念与手法挑战的激进的精神，都为后起的文学革命所直接承袭\n\n（二）晚清已经开始有人提倡白话文，为后来的文学革命大力倡导白话文运动造成一种蓄势。\n\n（三）清末民初域外小说翻译大盛，更是刺激和启迪了新旧时代交接中的中国作家，他们在借鉴与模仿中很自然地将本土的传统文学与世界性的现代文学做比较，从而打破思想封闭状态，开始参与世界文学“对话”，这又势必引起中国文学内部结构的变迁。\n\n二、新文化运动为文学革命提供了动力与契机\n\n文学革命就是在新文化运动的推动下发生的，它凌厉不屈的抗争精神和启蒙救国的期望，与新文化运动如出一辙。\n\n新文化运动本质上是企求中国现代化的思想启蒙运动。在西方现代思潮影响下，先进的知识分子总结了晚清以来历次社会变革的经验教训，意识到中国要向现代社会转变，必须在意识形态尤其是价值观领域彻底反对封建伦理思想，击退在辛亥革命后愈加嚣张的尊孔复古逆流。\n\n三、“五四”文学革命的崛起离不开辛亥革命后建立的中华民国的制度保障\n\n“五四”文学革命的崛起和辛亥革命之间固然有一定的时间差，但是，“五四”文学革命本来就和辛亥革命在文化观念上的基本诉求一致。中华民国的建立，确立了民主和科学等现代话语的合法性。在袁世凯和张勋的复辟过程中，尊孔复古的逆流，使进步的知识分子痛感以现代性思想扫荡封建观念的必要性和迫切性。这正如陈独秀所说的那样，“欲建设西洋式之新国家，组织西洋式之新社会，以求适合今世之生存，则根本问题，不可不首先输入西洋式国家之基础，所谓平等人权之新信仰，对于与此新社会、新国家、新信仰不可相容之孔教，不可不有彻底之觉悟，猛勇之决心。”\n\n四、其他社会条件的变革\n\n（一）知识分子“文学救国”的使命\n\n夏志清在《感时忧国》认为：近代以来，优患成为百年中国文学的母题，忧患与哀愁成为百年中国文学的底色。\n\n甲午海战的全线崩溃，戊戌变法的流血牺牲，中国全面的落后挨打，以及此后种种的残酷压迫，使得中国的现代化道路历经种种挫折，中国文人历经千年洗礼，至晚清，救亡与启蒙成为当时知识分子奋斗的两大主线。\n\n（李凡说：李泽厚《中国现代思想史论》中《启蒙与救亡的双重变奏》之二提出“救亡压倒启蒙”，这个观点争议极大，有其合理之处，但也有很大漏洞。）\n\n当中国知识分子看到了西方先进制度并重燃起希望时，中国文学就获得一个全新的视角。他们从全世界、全人类的角度看到了变革在中国势在必行，他们清醒地意识到变革的重要性，并参与到“尽变西法”的实践中，求“变”与“新”，成为了真正意义上的现代知识分子传统的发端（知识分子角色转换）。\n\n（二）教育制度的变革\n\n晚清始，以京师大学堂的建立为代表，体现出教育制度的改革，尤其1905年清朝废科举后，出现办学热潮，至1909年各级各类新式学堂已达五万多所，京外在校学生160万人。学生作为中国现代文学的接受主体，培养了新的思维模式和现代审美心理机制。同时也造就了大批有现代科学文化知识、有自主开放意识的新型的知识者，他们成为新文化与新文学运动的生力军。\n\n（三）报刊业与印刷技术的兴起\n\n自王韬主笔的《循环日报》宣传“变法自强”始，而后康有为、梁启超1895年创办《中外纪闻》、1896年创办《强学报》、《时务报》等二十多种报刊，影响广泛。\n\n现代印刷工业技术的引入促成了现代出版业的发展，晚清大批报纸副刊与专门文学杂志的出现，推动了现代文学市场的形成，现代稿费制度的规范化，为职业作家的出现提供了经济保证。\n\n（四）各类学会的出现\n\n学会的涌现，给中国近代知识分子提供了公共知识空间，学会兴办学堂、创建图书馆、购置科学仪器、出版学报和书籍等，影响很大。从1895年北京强学会为开端，此后三年间各种学会达六七十个，到1899至1911年间，各结社达六百余个。\n\n（五）新的世界形势\n\n第一次世界大战后帝国主义列强暂时放松了对中国的侵略，中国民族工业乘机发展，新兴的社会力量增长，又为新的文化与文学运动提供了阶级基础。","keywords":"清末民初文学变革突破传统观念 白话文运动 域外小说翻译大盛 新文化运动提供动力 制度保障 其他条件","note":"①文学革命的发生不是一个孤立的事件，它的出现经历了漫长的准备过程，所以我们要注意到近代以来文学变革对它的影响，而新文化运动和文学革命相辅相成，这一点我们也不能忽视（从晚清到民国再到新文化运动，期间是一条时间线的）。** ②王德威在《被压抑的现代性-晚清小说新论》，提出没有晚清何来五四，书中将中国现代文学的起点由“五四”提至晚清。作者一面不断强调现代的多种可能性，一面却又对已经出现的多种文学类型视而不见。作者在对“五四”文学发出责难时，没有站在真实的历史中做出客观的评述，因而存在诸多质疑。当然这些质疑不是意味着对它进行全盘否定，书中很多观点仍值得我们继续研究讨论。具体内容可在李凡文学正版群中领取。 ③此部分涉及一些相关名词解释如诗界革命、小说界革命、文界革命等。 ④新文化运动与文学革命的概念常常有同学混淆，两者确实存在干丝万缕的联系，但又同中有异。 --- ⑤文学革命发动的过程，教材中已有详细论述，在此不再赘述，但几场论争的名词解释大家一定掌握：林译小说、学衡派、甲寅派。"},{"id":"2","stars":"★★★","title":"文学革命的成果及意义","body":"【答题框架】\n\n文学革命是我国历史上前所未有的一次伟大而彻底的文学革新运动，不同于历史上包括近代产生过的文学变革或文学改良，它所带来的是文学观念、内容形式各方面全方位的大革新、大解放，从而揭开了现代文学光辉的第一页，把中国文学推进到一个崭新的阶段。\n\n一、相关成果\n\n（一）白话文的全面推广\n\n“五四”后，各地爱国学生团体纷纷仿效《新青年》《每周评论》，创办白话报刊，仅1919年就出版400多种，到1920年，连那些持重的杂志，如《东方杂志》《小说月报》等，也都采用白话文了。文学革命促成了言文合一的“国语运动”，又为新文学的语体变革拓展了广阔的天地，并迅速扩大了新文学的影响。1924年出版的中学语文课本，已经收有一些新文学作家的作品。\n\n（二）外国文学思潮的广泛涌入和新文学社团的蜂起，呈现出我国历史上空前未有的思想大解放的局面\n\n文学革命的发动者们通过作品翻译来介绍外国文艺思潮，向中国文坛吹来新鲜的现代气息。《新青年》从第一卷开始先后翻译了屠格涅夫、龚古尔、王尔德、契诃夫、易卜生等外国作家作品，现实主义、浪漫主义、象征主义、心理分析、意象派、进化论、马克思主义等都开始有人宣传和信仰；接受不同思潮影响的作家们的创作倾向也不尽相同，相同的作家们各自聚集成社团，形成了“五四”时期文学社团层出不穷的局面。如文学研究会对现实人生的推崇、创造社对浪漫主义的学习，还有新月社、语丝社、浅草一沉钟社等。\n\n（三）文学理论建设取得了初步的成果\n\n理论是创作实践的先锋。胡适发表《文学改良刍议》提出“文章八事”，初步阐明了白话文的主张；随后，陈独秀的《文学革命论》中提出“三大主义”，从内容到形式批判旧文学；周作人在《人的文学》中要求新文学必须以人道主义为本，观察研究社会人生诸问题，尤其是底层人的生活，他的《美文》从理论上确立了文学性散文的地位，将其摆到了与小说、诗歌、戏剧同样的位置。另一些作家也在理论上作出了贡献，如鲁迅、钱玄同、成仿吾等。\n\n（四）创作取得了引人注目的实绩\n\n1918年5月，鲁迅发表了第一篇白话短篇小说《狂人日记》，借“狂人”之口，控诉了封建制度及其伦理道德“吃人”的本质，并采用了现代意味的手法与样式。随后，鲁迅又连续创作了《孔乙己》《药》等小说，都显示了深切的思想和完整的现代小说特色。鲁迅的小说一出现，艺术上就很成熟，使得新文学的创作有了相当高的起点。除鲁迅外，《新青年》《新潮》《学灯》等报刊上陆续推出一些新文学作家及其作品。这些作品大都是1919-1922年间发表的，不够圆熟，却都充溢着个性解放、民族解放的精神，从内容到形式都追求现代性品格，给文坛带来青春气息。\n\n二、深远意义\n\n（一）文学观念更新：摒弃了传统的“文以载道”“游戏消遣”等观念，代之以表现人生、反映时代的积极的文学思想。文学革命先驱者们表现出强烈的历史主动性和批判精神，先集中力量摧毁当时在社会上较有影响的旧文学阵地，把批判“黑幕派”和鸳鸯蝴蝶派以及旧戏曲，作为一场“硬仗”来打，为新文学创作与理论建设扫清了道路。\n\n（二）文学内容创新：体现了现代民主主义、人道主义思想，充满了觉醒的时代精神。\n\n除鲁迅外，1919-1922年间发表的，还有如叶绍钧的《这也是一个人？》、杨振声的《渔家》、冰心的《斯人独憔悴》、许地山的《命命鸟》、王统照的《青雨之夜》、郁达夫的《沉沦》，等等。诗歌方面也有如胡适的《尝试集》、郭沫若的《女神》、汪静之的《蕙的风》等等。\n\n（三）文学语言的更新：在语言和形式上，摒除了文言文和僵化的传统文学格式，用白话写作，使得文学作品更加接近普通民众，易于理解和传播。\n\n（四）建立现代启蒙精神和人文主义文学传统：文学革命不仅是对封建文学的批判，也是对现代启蒙精神和人文主义文学传统的建设。这些精神传统包括了民主、科学、自由的价值观，以及对人权、基本欲望的尊重，对人性和社会的深刻批判和对人文关怀的重视。\n\n（五）打破中国文学孤立封闭的格局，建立了与世界文学的密切联系\n\n文学革命改变了对待外来文化的态度，它以极为开放的胸襟持续不懈地翻译和介绍外国现代文学和文化思想，形成了一场大规模的文化吸收潮流。正是在这种文化引介的潮流中，西方自文艺复兴运动以来的各种思想和学说，在20世纪初的现代中国找到了通行的市场，不仅影响和构建了现代文学创作的风貌，也影响和构造着中国对现代化的追求和憧憬。","keywords":"成果：白话文全面推广 外国思潮涌入 文学社团蜂起 文学理论建设 创作实绩 意义：文学观念 内容 语言精神联系世界","note":"①本部分内容还会遇到诸如“中国文学由古典向现代的转型体现在哪些方面？”“‘五四＇文学革命的成果是什么？”这种提问方式，本质都是考查的文学革命的成果，大家要准确记忆，灵活应对。** ②相关社团的梳理如新月社、语丝社、浅草一沉钟社等，注意积累一下名词解释。 ③关于此题第二段中的“国语运动”是指中国从清末到1949年推行的以官话为基础制定汉语标准语和中国国语的运动。这个运动对于现代汉民族共同语的建立和推行，对于文体改革和文字拼音化，都有一定的贡献。1937年抗日战争爆发，国语的推行陷于停顿。1949年中华人民共和国建立以后，改为推广以现代典范的白话文著作为语法规范的普通话。普通话的标准与国语略有不同，但是运动的性质仍旧一样，是国语运动的继续。 ④此题还有一个小侧面也需要大家注意一下：“在‘五四”文学革命中，新文学先驱者们是如何对待外国思潮的”，这道题目答案大家可去25群中一观。"},{"id":"3","stars":"★★★","title":"胡适为“五四”文学革命做出的贡献","body":"作为“五四”文学革命的先驱者之一，胡适从语言、内容、形式等诸多方面，为新文学的发展做出了突出贡献，主要表现为：\n\n一、白话文学（文学革命中的语言形式问题）\n\n胡适将当时先驱者坚信文学革命体现了历史发展的趋势、白话文必定取替文言文的正宗地位这些“共识”理论化，并形成可以被接受的概念而加以推广。\n\n1917年1月《新青年》发表《文学改良刍议》一文，具体提出从改革旧文学的“八事”入手去实现文学的变革。其关键是从语言形式即“工具”的角度肯定白话文学，以此作为摆脱旧文学，创建新文学的突破口。\n\n他不但认识到白话文的教育价值，而且还是第一个肯定白话文尊严及其文学价值的人。并且他在《白话文学史》《五十年来中国之文学》中不断引用中国诗歌、戏剧、小说的发展史，将白话文学同中国文学传统联系起来，保证传统的继续发展。\n\n二、“国语的文学，文学的国语”\n\n1918年4月，胡适又在《建设的文学革命论》中更明确地标示出要以“国语的文学，文学的国语”作为文学革命的宗旨。白话文运动由文学改革的范围向整个社会全方位推进，这也是文学革命在短时期内大获胜利的原因之一。\n\n三、历史的文学观念论\n\n1917年5月1日，《新青年》全面而深刻地阐释了历史的文学观念论：“一言以蔽之，曰：一时代有一时代之文学。此时代与彼时代之间，虽皆有承前启后之关系......愚惟深信此理，故以为古人已造古人之文学，今人当造今人之文学。”在这一理论的建构中，生物进化论观点被胡适充分运用到了文学领域。新的取代旧的，现代的取代传统的，鲜活的取代僵死的，先进的取代落后的，这是事物发展的趋势，是历史发展的规定性，也成了白话文学取代旧文学的强大的理论基础。\n\n1918年10月发表的《文学进化观念与戏剧改良》，进一步强调了这种时代的演进规律。胡适在这篇文章中详尽阐述了文学进化观念的四层意义和内涵，胡适将进化论植入了变革中国旧文学的“科学实验”，以进化论为支点来建构他的实用主义的文学革命的理论框架，从而形成了他的“历史的文学进化观念”。至此，历史的进化的文学观念已经完全建立，它给文学界带来的震动无疑是巨大且深刻的。这种历史进化的思想内核，已经演变为“五四”时期变革旧文学、建立新传统的思想利刃，新文学运动的阻碍得以清除。\n\n四、个性主义与写实主义\n\n在新文学的思想内容与方法上，胡适重视宣扬个性主义，主张采用写实主义，引发了“问题小说”与“社会问题剧”的创作热潮。\n\n胡适在1918年发表的《易卜生主义》一文中，提出要以西方的“少年血性汤”即充分发展的个性主义，来挽救濒于死亡的中国文学的命运，挽救缺少活力的中国社会；同时，提出要以写实的方法“实写今日社会之情状”。这些主张引发了“五四”后“问题小说”与“社会问题剧”的创作热潮。\n\n五、胡适受实验主义影响，在治学方面，主张“大胆的假设，小心的求证”\n\n胡适所说的“假设”，是指研究中科学的预见性，不是主观预测，是以实验证明作为关键的一环的；“假设”的提出与实验证明是一个推理过程，是由已知事物推到未知事物，其中离不开归纳法与演绎法的交互运用，应当说是有科学性的。\n\n胡适还以清代“朴学”的治学方法来印证和丰富他所理解的实验主义，他自己从事的古代文学考据工作，就明显运用了带有“朴学”实证色彩的实验主义方法。\n\n六、“诗体解放”说\n\n胡适提出“诗体解放”说鼓励了新诗人大胆尝试，在新诗初创期几乎成为新诗人的“金科玉律”。\n\n胡适还在《论新诗》等著述中提出过“诗体解放”说，认为新诗要摆脱旧诗词曲的束缚，不但要用白话，还应不拘格律，向自由诗发展。他还有意输入与借鉴西洋诗体，以蜕变出具有中国特点的新诗体，包括用语体散文来写的完全“解放”的体式。胡适1920年出版的《尝试集》，开白话新诗创作之先河。\n\n七、整理国故\n\n1923年胡适创办《国学季刊》，提出“整理国故”，主张对过去的文化遗产进行认真的清理，吸收精华，弃其糟粕，他把这工作也看作是新文化与文学建设的一部分。\n\n胡适从事“白话文学史”的研究和章回小说的考证，写有《白话文学史》（上卷）和关于《红楼梦》《镜花缘》等小说的考证论著，都是力图做对传统文学现代化阐释的基础性工作。（李凡说：在此过程中，胡适指出《红楼梦》的作者是曹雪芹，这部书只是作者的自叙传。此论一出即引起轰动，为学界接受，并开创“红学”研究的新方向，因而被称为“新红学”。）\n\n八、《中国新文学大系一建设理论集》\n\n《中国新文学大系》是中国最早的大型现代文学选集，共五辑（时间跨度1917-2009，据官方报道其第六辑已于2020年启动），第一辑（1917-1927)，胡适负责建设理论集。\n\n胡适先生从文学革命的重要背景着手，论述了古文覆灭的必然性以及文学革命的目的，即“用活的语言来创作活的文学”。胡适先生认为新文学的中心理论主要有两个，一个是活的文学，侧重于文学工具的革新；一个是人的文学，侧重于文学内容的革新。同时他也注意到了理论的发达与作品的缺乏这一客观的事实。\n\n但是他在文中对于自己理论文章的推崇，也让我们怀疑他在导言当中带有些许个人英雄主义的色彩。","keywords":"白话文学 国语文学 历史的文学观念 写实主义 实验主义 “大胆假设，小心求证”“诗体解放”中国新文学大系","note":"①胡适对五四文化革命的贡献，本质便是在考查胡适的文学主张影响，二者息息相关，需要共同理解记忆。** ②关于胡适的考察以名词解释居多，比如《文学改良刍议》，比如文章“八事”（必背），另，胡适1920年出版的《尝试集》是中国现代文学史上第一部白话诗集，经常考查名词解释。 ③《中国新文学大系》是中国最早的大型现代文学选集，总超100卷，时间跨度一个世纪，整体的体系非常宏大且复杂，其第一辑作为开卷之作，具有很多可取之处。"},{"id":"4","stars":"★★★","title":"周作人在“五四”文学革命中的贡献","body":"【答题框架】\n\n周作人是中国现代文学史上现代散文的集大成者，也是“五四”时期颇有影响力的理论先导者和批评家。他在文学理论上做出了巨大的贡献，具体表现为：\n\n一、人的文学\n\n周作人要求新文学必须以人道主义为本，观察、研究、分析社会“人生诸问题”，尤其是底层人们的“非人的生活”；&#x4F5C;家必须以认真严肃的而并非游戏的态度，去描写“非人的生活”，对改造社会持积极的态度，还要展示“理想的生活”。\n\n在周作人这里，新文学所本的人道主义具体指个人主义的“人间本位主义”，只有作家自己觉悟了，“占得人的位置”，才能“讲人道，做人类”。周作人将新文学的本质界定为“重新发现‘人’的一种手段”，根本目标在助成人性健全发展。\n\n二、平民文学\n\n周作人又提出的“平民文学”概念实际上是“人的文学”的具体化。\n\n周作人将封建传统的旧文学概括为“贵族的文学”，认为“平民的文学”恰是反其道而行之的。其两者间的区别并非说“这种文学是专做给贵族或平民看，专讲贵族或平民的生活，或是贵族或平民自己做的”，而主要是指“文学的精神区别，指它的普遍与否，真挚与否”。\n\n周作人指出平民文学应以通俗的白话语体描写人民大众生活的真实情状，真实地反映“世间普通男女的悲欢成败”，描写大多数人的“真挚的思想与事实”。\n\n三、人生的艺术派（自己的园地）\n\n周作人认为“为什么而什么”的态度是不可取的，因为“人生派”的流弊“容易讲到功利里边去，以文艺为伦理的工具变成坛上的说教”。文学根本不必“为什么”，只是用“艺术的方法”，表现作者对于“人生的情思”。\n\n周作人强调尊重创作个性，抒写表达作者各自的情思，既反对“以个人为艺术工匠”的“为艺术”派，又反对“以艺术为人生的仆役”的“为人生”派，而主张“人生的艺术派”。\n\n四、“即兴言志”\n\n周作人在《中国新文学的源流》等著述中又试图探讨新文学与传统文学的衔接汇通，推崇“即兴言志”的创作心态，强调尊重文学的独立性与维护自由表达思想见解的文学原则。\n\n五、对现代散文文体的理论确认\n\n文学革命以后，文学性散文创作兴起，有必要对文学散文进行文体确认。\n\n1921年6月周作人发表题为《美文》的文章，真正从理论上确认了文学性散文的地位。这篇文章将那种以抒情叙事为主的艺术性的散文视作美文，摆到了与小说、诗歌、戏剧并列的位置，从理论上确认了文学性散文的地位。","keywords":"人的文学 平民文学 人生的艺术 即兴言志 散文文体的理论确认","note":"周作人在“五四”文学革命中的贡献主要体现在新文学的思想建设方面，以及对散文文体的理论确认，而这与他的文学主张密不可分，大家可以将二者相互关联记忆。需要注意的是，周作人“人的文学”“平民文学”这些概念在名词解释中出现的概论非常高，大家要注意一下。"},{"id":"5","stars":"★★","title":"“五四”文学革命中创作的潮流是怎样的","body":"一、服膺于思想启蒙\n\n从《新青年》鼓动“文学革命”开始，新文学的先驱者们就主张文学服膺于思想启蒙，注重将文学作为改造社会人生的工具，强调以现代科学与民主的精神去指导新文学的创造，使第一个十年的现代文学具有了强烈的理性批判的色彩。即使是倾向浪漫主义的创造社作家，他们也往往在表现自我的同时，用批判的眼光审视社会人生。\n\n以这时期创作题材而言，不管哪种流派作家，大量描写的都是婚姻爱情与个性解放。而这种“题材热”的产生，主要也是由于“五四”新思潮唤起了作家们对人的生存价值以及种种人生观问题的思索，表明中国新一代作家开始有了现代意味的自我认识。他们摆脱传统的思维方式，力图借助科学与民主的精神去观察与思考生活。可以说，“重新估定价值”的理性批判精神与由于“人的发现”“文学的发现”引起的理性探索精神，是贯穿于第一个十年的几乎所有的作品中的。\n\n二、感伤情调的流行\n\n在新文学第一个十年，笼罩于整个文坛的空气主要是感伤的。新作家们很少不曾表现苦闷感、孤独感、彷徨感。\n\n感伤成了这时期新文学的一种精神标记，映照着“五四”历史转折时期普遍的社会心理。新思潮唤醒了广大青年，但多数人觉醒之后又一时找不到出路，在十字街头彷徨；现代意识促使他们追求人生价值和美好的理想，而黑暗现实的压迫又往往使他们感到苦闷与失望。这种感伤情调作为一种普遍的文学现象，主要反映着中国知识者艰难地追求新生的精神历程。它与一代人最深刻的焦虑与思索联结在一起，预示着一个新的历史的巨大起步。因此也可以说是现代中国民族和文学进入历史青春期时必有的感情标记和心理气氛。\n\n三、个性化的追求\n\n因为“五四”时期是提倡个性解放，鼓励个性发展的年代，自然为创作的多方面个性化自由发展提供了肥沃的土壤。我国文学史上很少有哪个时期的文学像“五四”时期文学这样，出现那么多“个人”的东西。写个人的生活，个人的情绪，是普遍的现象。“五四”时期文学创作总的给人以活跃、单纯、亲切的感觉，是跟文学个性化的追求有关的。\n\n四、多种创作方法的尝试\n\n在“五四”时期，现实主义与其他思潮、方法多元并存，形成了非常活跃的创作局面。\n\n在“五四”时期，虽然鲁迅成熟的现实主义创作已经出现，但一般作家更加向往浪漫主义，各种文体的创作中都充溢着强烈的主观情绪与抒情色彩。一般青年作者在倾向浪漫主义的同时，还把19世纪末、20世纪初广泛流布于欧洲的新浪漫主义-也就是现代主义，作为最新的先进方法来介绍、尝试和仿效。","keywords":"理性精神 感伤情调 个性化追求 多样创作方法","note":"“五四”时期的文学整体呈现出一种现代化的倾向，首先思想观念的现代性是“五四”文学最突出的转变，主要表现为个性主义、人道主义、平民主义和科学精神，见上述第一点；其次是情感体验的现代性，主要表现为重视个体情感的复杂性、细微性、差异性，见上述二三点；再次是艺术形式的现代性，主要表现为自由化表达原则对程式化表达原则的取代，见上述第四点；最后是语言系统的现代性，总体上是用白话语言系统取代了文言语言系统。"},{"id":"6","stars":"★★","title":"“五四”文学创作潮流中的理性精神体现在哪里","body":"一、文学作品含有强烈的理性批判色彩\n\n从《新青年》鼓动“文学革命”开始，新文学的先驱者们就主张文学服膺于思想启蒙，注重将文学作为改造社会人生的工具，强调以现代科学与民主的精神去指导新文学的创造，使第一个十年的现代文学具有了强烈的理性批判的色彩。\n\n鲁迅的《呐喊》与《彷徨》等作品贯穿着如何疗救社会病苦、改造国民性的思考，重在对封建制度的彻底揭露与批判，以及对农民和知识分子在反封建思想革命中所面临的矛盾与危机的考察，其理性色彩体现为清醒的现实主义批判精神。\n\n倾向浪漫主义的创造社作家，他们也往往在表现自我的同时，用批判的眼光探求人生社会。所以郭沫若的《女神》中有“泛神论”的哲学思考，郁达夫的小说中有对道德及心理范畴的严肃探索。\n\n二、创作题材大量描写的都是婚姻爱情与个性解放\n\n这种“题材热”的产生，主要也是由于“五四”新思潮唤起了作家们对人的生存价值以及种种人生观问题的思索，表明中国新一代作家开始有了现代意味的自我认识。他们摆脱传统的思维方式，力图借助科学与民主的精神去观察与思考生活。可以说，“重新估定价值”的理性批判精神与由于“人的发现”“文学的发现”引起的理性探索精神，是贯穿于第一个十年的几乎所有的作品中的。\n\n三、理性的追求对各种文体的发展都有过直接的影响\n\n“五四”的作家自觉地寻求能够包容更多的社会学、伦理学、历史学、哲学，以至政治学内容的“边缘”性质的文学形式。1921年前后出现的第一个小说创作浪潮，就是带有浓厚理性色彩的“问题小说”热。初期新诗也是“有意为之”的，由于说理和写实的成份太重，诗味往往不足。从《新青年》“随感录”的作者群开始的现代散文，也是重启蒙、重议论、重批评的。这条线一直贯穿下去，在第一个十年以至整个现代文学史上，始终有重议论的、批评人生的杂感式散文。","keywords":"理性批判色彩 创作题材多为婚姻爱情与个性解放 影响各种文体发展","note":"理性精神在“五四”文学中固然重要，但并不是独占鳌头，它是与文人的审美意识一起，共同反映在作品中的。五四文人既继承了儒文化积极入世的实践理性精神，有着视革命、救亡、启蒙为已任的强烈的历史使命感、又兼备了以真实、悲剧、创新为核心的现代审美意识：这种理性精神与审美意识有着内在的本质的和谐统一性，水乳交融于“五四”文学作品中，共同构成了丰富多姿的“五四”文学中的主旋律。"},{"id":"7","stars":"★★★★★","title":"为什么说鲁迅的小说是中国现代小说开端和成熟的标志","body":"【答题框架】\n\n发表于1918年的《狂人日记》是中国现代文学史上第一篇用现代体式创作的白话小说，成为中国现代小说的伟大开端，开辟了我国文学发展的一个新的时代，继《狂人日记》之后，短篇小说集《呐喊》与《彷徨》是中国现代小说的成熟之作。中国现代小说在鲁迅手中开始，又在鲁迅手中成熟。\n\n鲁迅小说中“表现的深切”和“格式的特别”，体现了中国现代小说的成熟，主要表现如下：\n\n一、“表现的深切”：独特的题材、视角与小说模式\n\n（一）独特的题材\n\n鲁迅曾说道：“我的取材，多采自病态社会的不幸的人们中，意思是在揭出病苦，引起疗救的注意。”\n\n从“启蒙主义”的文学观念出发，鲁迅开启了表现农民与知识分子这两大现代文学主要题材的传统。（李凡说：鲁迅笔下的人物形象也是一个很大的考点，这里仅是列出，后面会有人物专题。）\n\n（1）农民题材。鲁迅对中国农民的命运满怀同情，“哀其不幸怒其不争”，通过农民形象，控诉封建罪恶，针砭国民劣根性，把解剖中国农民灵魂和改造“国民性”（李凡说：国民性是一个非常大的议题，最近几年经常出题，不仅鲁迅，像老合、巴金等，都有对此问题进行过讨论。）问题联系起来，通过对农民性格中的愚昧、麻木和落后等特点的揭露，表达对造成这种性格的社会根源的揭露和批判。《阿Q正传》《药》《风波》《故乡》等皆如此。\n\n（2）知识分子\n\n①封建制度的受害者。如《孔乙己》中的孔乙己、《白光》中的陈士成等。他们深受封建科举制度的毒害，最后悲惨地被黑暗社会所吞没。鲁迅虽寄以无限的同情和哀怜，但不得不把他们作为封建科举制的殉葬者而沉痛鞭挞。\n\n②封建制度的维护者。如《肥皂》中的四铭、《高老夫子》中的高干亭等。他们表面衣冠楚楚，背地男盗女娼，实乃不学无术的斯文败类。\n\n③封建制度的反抗者。如《狂人日记》中的狂人、《药》中的夏瑜、《一件小事》中的“我”、《在酒楼上》中的吕纬甫、《孤独者》中的魏连殳、《伤逝》中的子君和涓生，以及《长明灯》中的疯子等。他们具有现代的意识、进步的思想和改革的要求，也曾有过为自己理想而奋斗的辉煌历史，但几乎都以失败而告终。这种失败，既是他们自己缺乏“韧性”精神和斗争策略的结果，同时也和整个社会大环境有关，既是个人悲剧也是时代悲剧。鲁迅侧重描绘他们在改造中国的种种热情失落后的失望、激愤、忏悔、颓废和沉沦，其中包含着现代中国知识分子的许多精神典型，使人们开始思索知识分子道路。\n\n（二）独特的视角\n\n（1）底层写作\n\n鲁迅始终关心劳苦大众，具有崇高的现实主义精神，如他的自述中所说，他始终关注着“病态社会”里人（知识者与农民）的精神“病苦”。鲁迅对此类题材的开掘，也是着眼于揭示他们的精神创伤与危机。\n\n（2）内向性\n\n对人的精神创伤与病态的无止境的开掘，使鲁迅的小说具有一种内向性；它是显示“灵魂的深”的，即对于精神创伤与灵魂病苦层层深入的揭示与拷问。目的正是要打破“瞒和骗”，并最终指向“绝望的反抗”。\n\n（三）“看／被看”与“离去一归来一再离去”两大小说情节结构模式\n\n（1）“看／被看”\n\n“看客文化”也是中华民族一颗毒瘤，事不关己高高挂起，对待周围一切冷眼旁观，自私冷漠，毫无团结可言。“看／被看”的结构模式常常是多层次的，或者说，这种“看客文化”是无处不在、深入中国文化内部肌理的。\n\n①先驱者与群众之间，如《药》\n\n众人皆醉我独醒，悲哀又无奈，“启蒙者”一旦成为“被看”的对象，就会像《药》里描写的那样，成为茶客们闲聊的谈资，启蒙者的一切崇高理想、真实奋斗（如夏瑜怀着“大清的天下是我们的”的信念所做的牺牲）全都成了“表演”，变得毫无意义，空洞、无聊又可笑。\n\n在《药》里，我们甚至看到了这样的场面：人们争先恐后赶去“看”杀夏瑜，“很像久饿的人见了食物一般，眼里闪出一种攫取的光”。这里所出现的“吃人”的意象是惊心动魄的。\n\n“看／被看”的模式进一步发展为“吃／被吃”的模式，整篇《药》的故事-夏瑜的血浸透馒头，被华小栓“吃”进肚里，“却全忘了什么味”，也就具有某种象征意味：“华家”的愚昧的民众，不但自身“被吃”，同时又在“吃人”；而“被吃”者正是“夏家”的启蒙者。\n\n也就是说，启蒙者的结果是被启蒙的对象活活地吃掉；这里，被质疑、批判的对象是双重的：既是那些“吃人”的民众，更是“被吃”的启蒙者，以至启蒙本身。\n\n而如前所说，鲁迅自己即是这启蒙者中的一员；他的小说模式所提出的质疑最终是指向鲁迅自身的。因此在这一类的小说中，人物（描写对象）与作者的距离大大缩小，作品中渗透着较多的鲁迅的生命体验。读者在这些作品里所感到（读出）的悲哀、悲悯（《药》）、孤寂（《孤独者》），以致恐怖（《狂人日记》）、愤激（《头发的故事》）与复仇（《孤独者》），也在一定程度上基于鲁迅自身的刻骨铭心的情绪记忆。\n\n②庸众之间，如《示众》\n\n《示众》这篇小说没有一般小说都会有的情节（故事）、人物刻画和景物描写，也没有主观抒情与议论，只有一个场面：看犯人。小说中所有的人物-无论是叫卖馒头的“十一、二岁的胖孩子”，“赤膊的红鼻子胖大汉”，“挟洋伞的长子”，还是有着发亮的秃头的“老头子”，梳着喜雀尾巴似的“苏州俏”的“老妈子”，“一个猫脸的人”，都只有一个动作：“看”；他们之间只有一种关系：一面“看别人”，一面“被别人看”，由此构成了“看／被看”的二元对立。\n\n（2）“离去一归来-再离去”\n\n“离去一归来一再离去”的模式，也称为“归乡”模式。在这一模式的小说中，叙述者在讲述他人的故事的同时，也在讲述自己的故事，两者互相渗透、影响，构成了一个复调。\n\n二、“格式的特别”：创造新形式的先锋\n\n（一）鲁迅完全自觉地借鉴西方小说形式，通过自己的转化、发挥，以及个人的独立创造，建立起了中国现代小说的新形式\n\n《狂人日记》打破了中国传统小说注重有头有尾、环环相扣的完整故事和依次展开情节的结构方式，《孔乙己》又在小说叙述者的选择上煞费苦心。与此同时，鲁迅一直在探索主体渗入小说的形式。另一面，鲁迅也在追求表达的含蓄、节制，以及简约、凝炼的语言风格。\n\n（二）鲁迅借鉴了诗歌、散文、音乐、美术，以至戏剧的艺术经验来从事小说创作，并且试图将它们熔为一炉\n\n在这种情况下，出现了“诗化小说”“散文体小说”以至“戏剧体小说”等等。鲁迅在实验为中国现代小说寻找自己的小说形式的最初阶段，是自觉地借鉴西方的小说形式的，但在试验过程中，鲁迅自身深厚的传统文化修养逐渐发挥作用，使他由不自觉到自觉地吸取中国文学的养料。","keywords":"表现的深切：题材 视角 二元对立的结构模式 格式的特别：形式先锋 中西结合","note":"把《呐喊》《彷徨》理解为中国现代小说的“开端”，强调的是其不同于传统小说作品的思想发掘和艺术创新；而“成熟标志”，则强调这种思想发掘和艺术创新的深刻性与独到性，及其对于现代小说发展的典范意义。这可从鲁迅小说“表现的深切”和“格式的特别”两方面加以把握。** ①鲁迅是中国现代小说之父，他实现了中国文学从古典性向现代性的转换，揭开了中国现代小说的新纪元。无论从语言、形式、主题、内容、思想等，都对后世有着极为深远的影响。 ②这个题目相当于是对鲁迅相关知识的综合考查，需要大家从多方面、多角度全面作答，非常考验大家对相关知识点整体的把握。回答时要兼顾到每一个方面的每一个细小的点，注意不要遗漏。"},{"id":"8","stars":"★★★★★","title":"简述《狂人日记》的主题思想及其艺术特征","body":"【答题框架】\n\n《狂人日记》作为中国第一篇现代白话小说，以它彻底的反封建精神和现代意识，成为中国新文学的开山之作。\n\n一、主题思想\n\n（一）表现家族制度和封建旧礼教吃人的主题\n\n鲁迅曾说：《狂人日记》“意在暴露家族制度和礼教的弊害”，“偶阅《通鉴》，乃悟中国人尚是食人民族。因成此篇。”也就是说，《狂人日记》表现的是家族制度和封建旧礼教吃人的主题。\n\n狂人生活在一个封建家庭里，因而也被禁锢在封建宗法和礼教的“囚牢”之中，狂人的“狂”，实际上是封建制度迫害的结果。他的大哥作为封建家长时时处处奉行“仁义道德”，实际是迫害“狂人”，甚至策划着吃人——吃掉狂人和他的妹妹。这虽是狂人的疯话，却深刻地揭示了在血缘关系掩盖下，封建宗法制度和礼教的吃人本质。\n\n（二）狂人的形象是鲁迅战斗精神的代表\n\n狂人反省到“自己也曾吃过人的肉”并冒着被吃的危险，“诅咒”和“劝转”“吃人的人”。文章还通过古久先生的陈年流水簿子的形象暗示，将矛头直接指向保守的传统文化，“将来是容不得吃人的人”，是狂人对未来社会的幻想和规划，并为此血战到底。\n\n（三）强烈的现实批判性与忧愤深广的人道主义情怀\n\n《狂人日记》这篇作品具有强烈的现实批判性，直指中国封建主义文化的核心，同时对现实社会中的黑暗又进行了毫不留情的揭露。“我也未必没有吃过妹子的肉”，这是狂人对自我的评价和反思，也是自己对前途的绝望，充满了自我忏悔的精神；小说的结尾“救救孩子”的呼喊是狂人为建立新的社会而进行的实践性的探索。\n\n作者以彻底的“革命民主主义”的立场对中国的文化进行了深刻的反思，同时对中国的甚至是人类的前途表达了深广的优愤。\n\n二、艺术特征\n\n（一）格式上的突破\n\n这是一篇白话日记体小说，包括小序和正文两个部分。小序主要用文言介绍写作的背景和缘起；正文共有13则白话写就的“疯子”的日记。小说的主人公是日记的“作者”-狂人。\n\n《狂人日记》打破了中国传统小说注重有头有尾、环环相扣的完整故事和依次展开情节的结构方式，在艺术表现上，作家不是站在第三者的立场去描述主人公的心理状态，而是通过主人公的自由联想，直接剖露他的心理。\n\n《狂人日记》的“日记本文”采用了白话文体，却又精心设计了一个文言体的“小序”，从而形成了两个对立的叙述者（“我”与“余”），两重叙述，两重视点。这样，小说文本就具有了一种分裂性，对立的因素相互嘲弄与颠覆、消解，形成反讽的结构。\n\n（二）语言特点\n\n（1）中西合壁，古现融合\n\n《狂人日记》一向被认为标志着中国现代小说语言乃至文学语言的确立，它使用的是具有欧化倾向的“五四”文学语言显得复杂而又精密。\n\n山田敬三认为《狂人日记》的小说语言“明显地带有简洁而硬质的文言语感”，认为“这（《狂人日记》）是一种留有文言文因素的白话文”，而且是鲁迅自觉的文体意识的表现。（李几说：成仿吾也有类似意见，详见成仿吾：《＜呐喊＞的评论》《创造季刊》第2卷第2期）\n\n因而《狂人日记》白话文的小说语言具有“内面”意义-含有思想文化深度、高度意识形态化、极端陌生化的特质，被许多研究者界定为全新的文学语言。\n\n（2）现代白话运用圆润娴熟\n\n《狂人日记》精心打造的语言错乱（正面）、口语化描写、白描、犀利的修辞手法等，极具表现力。\n\n比如“早上，我静坐了一会。陈老五送进饭来，一碗菜，一碗蒸鱼，这鱼的眼睛，白而且硬，张着嘴，同那一伙想吃人的人一样。吃了几筷，滑溜溜的不知是鱼是人，便把它兜肚连肠的吐出。”从这短短的几十个字里，就可以看出作者文字功夫，其中有心理、有动作、有细节，用的都是标准的白话，自然朴实，却又处处生动形象，充满意趣。\n\n（三）熔讽刺、虚实、象征、暗示、精神分析等现代主义手段于一炉\n\n（1）极致的讽刺\n\n《狂人日记》注重对狂人变态的心理、混乱的逻辑和虚妄的幻觉作描写和刻画。狂人见到所有的人都是像要吃人，就是一种典型的迫害狂患者的心理状态；狂人由女人骂小孩推导出女人要吃人，由女人的要吃人推导出大哥、母亲和自己都吃了妹子的肉，这是典型的逻辑上的混乱，这混乱的背后，是对整个封建社会的讽刺。\n\n小说选取狂人作为主角是个十分精心的安排。鲁迅有意通过“迫害狂”患者的感受，通过狂人在精神错乱时写下的谵语，从某些“人吃人”的具体事实，进一步揭示了精神领域内更加普遍存在的“人吃人”的本质，从而对封建社会的历史现象作出了惊心动魄的概括和揭露。\n\n（2）借实行虚，以虚证实（现实与象征主义相结合）\n\n《狂人日记》中展现的是写实与象征彼此渗透的艺术世界。狂人形象本就为虚构，可面临的社会现状确是处处现实，小说中孤独的先觉者与昏昧的大多数人的许多言行，有时看似写实，实则象征；或是此时是写实，到了彼时就成了象征。\n\n狂人的行为就写实层面而言具有着“疯子”的特性，但就象征层面而言，这恰恰又是他清醒的表现。\n\n（3）极具现代性与先锋性（荒诞、意识流、精神分析、集体无意识等）\n\n第一节：“我不见他，已是三十多年”-暗示黑暗的长久；第二节“古久先生的陈年流水簿子”-比喻、暗示中国几千年不变的传统文明；而第六节“黑漆漆的，不知是日是夜。赵家的狗又叫起来了”-象征整个封建社会的黑暗与凶险读者通过作品中的这些关键性的词句所包含的象征、比喻、暗示的意义，可以体会到作品的实质内容。作者将一个思想解放了的“狂人”完全当做一个真的“疯狂的人”人来塑造，将象征、暗示、意识流等手法巧妙地融入其中，完美地体现了自己的创作意图，表现出了高超的艺术技巧。\n\n（4）双关与复义\n\n狂人说的“吃人”和鲁迅认识到的“吃人”并不同义，前者指肉体上，后者指精神上（把狂人语境中肉体上“吃人”提升到揭露礼教“吃人”是通过象征主义来实现），但是语言的形式却完全相同，都是说的“吃人”，一语双关。\n\n作品采用复义手法，文章开头的文言小序提及狂人已病愈井去当官，后一段白话文又写狂人的病例，借狂人之手揭示出封建制度“吃人”的本质。这种前后文的看似混乱，实则是对吃人社会的最强控诉与讽刺。\n\n鲁迅凭借其深厚的语言功力，成功将外国小说的形式与中国传统小说的优点结合在一起，创造出“日记体”这样一种中国现代小说的新形式。\n\n《狂人日记》彻底的反封建的战斗内容和新颖的构思，最早地显示了“五四”文学革命的成就；它是向封建社会进军的\n\n第一声号角，正确地体现了“五四”新文学运动的战斗方向，是中国现代文学的奠基石。\n\n【李凡关键词：主题思想 家族制度和封建旧礼教吃人 战斗精神代表 现实批判性 人道主义情怀 艺术特征 格式突破 日记体小说 语言特点 中西合璧 古现融合 现代白话 现代主义手段】\n\n【李凡说：鲁迅的《狂人日记》在思想上和艺术上都呈现出前所未有的崭新面貌。这是鲁迅在经历了沉默与思索之后的第一声呐喊，这一呐喊显示出鲜明的启蒙主义的思想特征，主要表现在对封建礼教的深刻揭露，对麻木愚昧的国民性的批判，及对将来的坚定信念和热烈希望。狂人是作者塑造的一个奇特而复杂的艺术形象，其精神品格具有清醒的启蒙主义者、勇猛的反封建战士的特征，同时还具有反叛意识和自审精神。作者在塑造狂人这个艺术形象时，运用了象征主义等手法，采用日记体裁，构思独特，新颖别致，具有很高的艺术价值。需要注意的是，《狂人日记》可能会单独作为名词解释在考查中出现，大家要注意一下。】","keywords":"","note":""},{"id":"9","stars":"★★★★","title":"试分析《狂人日记》开头文言“小序”的作用和意义（26陕西师范大学）","body":"在分析《狂人日记》时，人们往往会关注小说主体的“日记”，而开头的文言“小序”往往会被忽视。但其实，这一文言“小序”是小说不可分割的一部分，在小说中具有至关重要的作用和意义。\n\n一、“小序”的作用：造成反讽的结构\n\n“小序”不是简单地以故事套故事，它叙述了“日记”是怎样变成为“狂人日记”的，与“日记”部分形成矛盾和对立。\n\n一方面，作品的主体“日记”叙述的是“狂人”的感受，他摆脱了习惯眼光，感觉敏锐，对中国历史传统和社会现实有着惊人的发现：吃人，并且发出了“救救孩子”的呼声。另一方面，“小序”的叙述说明“日记”的作者不过是一个狂人，所以他的话不过是疯话，没有任何价值。\n\n因此，实际上，《狂人日记》包含了两重观点和两重叙述：一种是“日记”的叙述，主要是叙写“狂人”的感受；一种是“小序”的叙述，实对“日记”的否定。《狂人日记》两种观点和两重叙述形成了异常鲜明和强烈的对立，作者为了突出他的构思，甚至有意赋予两种对立的叙述者以两种相反的语言：一种是文言，一种是白话。\n\n很明显，“小序”是“日记”的明显断裂和猛烈颠覆。“小序”具有自己的叙述动机和叙述力量，对“日记”形成强大压力和否定，具有扭转和消解“日记”的叙述的作用。由此可见，“小序”是极为重要的，它具有结构性的意义。“小序”和“日记”的矛盾造成了反讽，《狂人日记》在整体上是一个反讽的结构。\n\n二、“小序”的意义\n\n（一）产生阅读空白，调动读者的阅读积极性\n\n《狂人日记》这篇小说中，作者并不直接出现，也没有成为小说中的一个固定观点。在《狂人日记》的双重叙述之间，作者的观点是游移的，作者不是从一个焦点讲述一个故事，不是从一个立场作出一种独断的评价。它的双重叙述观点构成一种张力，给读者留下一片必须被思考和判断来充实的空间。作者不是使读者消极被动地接受一种观点，而是要求读者从叙述中跑出来，超脱出来，获得一种整体思考。\n\n《狂人日记》的张力结构期待读者的思考，也推动读者的思考，开拓读者的阅读视野，修改读者的思维结构。《狂人日记》的张力结构更新和深化了读者的观点，使读者的眼光通过张力结构的锻炼而充满了洞察能力。读者不应简单认同于“小序”，或单纯如“狂人”，而应该是被两者形成的张力结构的思考空间提高了的一个视点。读者不仅对中国历史具有理性的思考和情绪性的领悟，而且对这种思考和领悟有了更进一步的反思和超越。\n\n（二）丰富和深化主题\n\n《狂人日记》的反讽结构的意义在于使作品由单纯到丰富，由机智而深刻。“小序”和“日记”之间的多重反讽造成了单纯的、直接的叙述无法达到的艺术效果。他不仅已经实现了作品的基本主题，而且还大大丰富和深化了主题。\n\n作品有力地表现了反封建的思想，揭露了封建传统的奥秘，同时，《狂人日记》的反讽结构使作品的认识意义更加丰富、深刻，并产生不同的美学效果。它既可以看作是情绪小说，即“狂人”对中国社会历史的感受；往更深一层看，又是理性的思考的小说，是“狂人”对自己的处境的反思；最后，它可以上升为一种哲理，一种人类的普遍性的困境。\n\n【李凡&#x8BF4;：当下学界对《狂人日记》的研究越来越深入，而这开头小序在结构和主题上的多重作用也越来越被重视，因而在考查相关内容时，很可能针对这一小序出题，故此我们要重点关注。开头的文言“小序”是这部小说不可分割的一部分内容，\n\n它与正文的“日记”形成了鲜明的对比，并且造成了一个反讽的结构。这一反讽的结构使读者在阅读中深入思考，并且丰富和深化了主题。相关论文可以参考旷新年《《狂人日记》反讽的迷宫-“序”在全篇中结构意义的探讨》。】","keywords":"“小序”和“日记”矛盾和对立 两重观点 两重叙述 反讽结构 意义 阅读空白 调动积极阅读 丰富和深化**主题","note":""},{"id":"10","stars":"★★★★★","title":"试分析《狂人日记》中狂人这一形象","body":"《狂人日记》是一篇格式特别的小说，狂人形象是一个特别的艺术形象。鲁迅并不是靠丰富而真实的生活细节来使狂人血肉丰满，栩栩如生，而是从心理层面去透视狂人的精神特征。关于这一狂人形象，我们需要注意以下内容：\n\n一、狂人形象的复义性特征\n\n在鲁迅的文本叙述中，鲁迅没有把狂人看成是单一的形象和代码，而是赋予了狂人内涵的复义性。具体表现在以下几个方面：\n\n（一）鲁迅把人的多种存在状态融于狂人的形象之中\n\n（1）狂人是一个曾经患有“迫害狂”的人，具有普泛性特征\n\n作为文本的表层含义，鲁迅在《狂人日记》的序文中明确告诉读者，狂人是一个“迫害狂”患者，在文本叙述中，也是按照“迫害狂”的心理和精神状态去进行操作的。但是，作者同样在文本的序文中指出，狂人“然已早愈，赴某地候补矣”。这说明作者描写的这个狂人有两种生活状态：生病和病愈。因此，应该称狂人是一个曾经患有“迫害狂”的人。\n\n所以狂人又不是一个完全的狂人，他是狂人又是正常人，具有很大的普泛性，所有的人都会有成为狂人的时候，特别是在专制社会和强权社会的时代，每个人也都有患“迫害狂”的机会，自然也都渴望着病愈，过正常人的生活。狂人形象的普泛性正揭示了专制社会和强权时代压迫的深度和广度，也更好地表达了作者对无所不在的吃人现象的揭示。\n\n（2）狂人是中国知识分子的类的代表\n\n对狂人形象底蕴的构思，也包含了作者对人或者说对知识分子的深刻认识。\n\n就狂人的身份来看，他无疑是个有知识的人。作为一个知识分子，鲁迅对中国知识分子的了解和认识非常深刻。因此，鲁迅的第一篇小说选择了知识分子作为他小说的主人公，通过狂人这个知识分子的眼睛和心灵去透视整个中国社会，暴露中国长期的封建统治的吃人本质，并通过狂人喊出了“你们立刻改了，从真心改起！你们要晓得将来是容不得吃人的人......”和“救救孩子”的呼声。\n\n但鲁迅清楚地知道中国的知识分子从来就没有真正的殉道者和义无返顾的改革家，他们在呐喊的同时有着胆怯、在反叛的同时也会有着顺从、在归隐的同时也想到了出仕、在真诚的同时也暗含了虚假、在利他的同时也想到了利己。这一切都与中国封建社会的强大性和稳固性有着密切的关系。由此，鲁迅笔下的狂人就有了中国知识分子的类的代表。这可以作为我们对狂人形象内涵的另一层认识。\n\n由以上分析，我们看出，鲁迅笔下的狂人至少包含了一般人和特殊类即知识分子群体的特征。\n\n（二）鲁迅把狂人作为一个精神符号来进行塑造\n\n鲁迅希望通过狂人的自觉达到对广大民众的启蒙。在这样的创作思想指导下，狂人不是一个真实的人物形象，而是一个启蒙代码或者标尺，即狂人不仅代表了启蒙的过程，也代表了启蒙的方向。就启蒙过程而言，狂人的精神性特征表现为以下几点。\n\n（1）洞察力和判断力\n\n在文本中，狂人是作为一个智者而叙述的。他能够透过社会的表面现象发现社会的本质，通过对社会的个别分析概括出社会的基本规律。狂人从字缝里看出字来，从表面的仁义道德、从“从来如此”发现了中国吃人的普遍性和反常的合理性。智者同蒙昧者相对，正如启蒙者同被启蒙者相对。洞察力和判断力可以说是智者精神化的体现。\n\n（2）怀疑性和反叛性\n\n狂人对当时的社会秩序产生了怀疑，并在怀疑的基础上表现出大胆的反叛意识。狂人的怀疑不同于一般人的怀疑，他的怀疑是彻底的，他站在人的角度上对一切非人的东西都进行了怀疑。从传统的从来如此的定势思维、几千年来人们一贯遵守的崇高的价值标准到最为亲密的人伦关系、各种名义上的关心热爱，它们都在狂人的人的法庭上受到质疑和审问。不仅如此，狂人对自我也进行了怀疑，他也把自己放在了人的法庭上进行审问。\n\n狂人的这种彻底的怀疑带来了他彻底的反叛，他站在了一切旧的东西的对立面并为旧世界所迫害、所孤立、所打击，他的这种行为并不是被动的，而是主动的，是一种自觉的反叛。\n\n（3）忧患意识和责任感\n\n狂人对吃人社会的反叛必然会导致他向着另一个社会前进，进而对现实世界表现出强烈的优患意识，由这种忧患意识自然延伸出启蒙民众、拯救民众的责任感。他说：“我诅咒吃人的人，先从他起头；要劝转吃人的人，也先从他下手。”对人的存在状况及前途充满了优虑和担心，由此生出的责任感使他向民众大声疾呼：“你们可以改了，从真心改起！要晓得将来容不得吃人的人，活在世上。”\n\n（4）反思意识与完善意识\n\n狂人在“凡事总须研究，才会明白”思想的指导下，不仅研究社会，也在研究自己。在研究自己的过程中发现了自己并非是一个完全真的人，从而对自己的行为产生了深刻的反思和憎恨，意识到要成为一个真的人并不是简单的、一蹴而就的，应该是长期的、终身的。狂人的反思是内在的、精神性的，这种反思必然引向完善，而完善也会促进不断的反思。由于完善是个漫长的过程，而反思也是没有终止的。这种精神性的活动也将伴随人的一生。\n\n（三）鲁迅把狂人当作一种心理存在来进行叙述\n\n在鲁迅这里，狂人代表着一种心理存在。这种心理存在是一种潜意识的，是长期郁积在一个人或者一个民族心中的痛，这种痛具有很大的扭曲性和普遍性。在文本中，作者展示了狂人的多种心理现象。\n\n（1）屈辱感\n\n狂人明显具有屈辱感，总有一种被看、被压抑的感觉，在这种压抑感的扭曲下又表现出强烈的自大倾向。在文本的描述中，我们看到了狂人承受了太多的屈辱。强大的压抑反而激发了狂人的另一种心理，他把自己放在了群体的对立面，在群体威压下他反而表现出十足的强大。狂人的这种自大一方面是为了摆脱压抑感、自卑感的需要，另一方面也是狂人精神人格自信和清醒的表现。\n\n（2）偏执狂\n\n狂人有明显的偏执狂特征。他总是在两极点上进行判断：要么是吃人的世界，要么是真的人的世界。他用真的人的世界观彻底否定吃人的世界观，两者之间不可融通，也不能妥协，更不能亦是亦非。狂人的偏执来自心理的爱与恨的两极化，真爱与真恨共为一体，同一般常人的世故、圆滑、不分原则、是非不辨、中庸等处事方式有着本质的不同。从思想层面，它是对中国古代不偏不倚的中庸思想的反叛。\n\n（3）非常态的敏感多疑\n\n狂人对外界的任何事物、任何声音、任何表情、任何动作甚至任何关系都有强烈的敏感性。他以“吃人”为核心，把一切所见所闻都与“吃人”联系在一起，反复研究，构造了他心中的一张吃人方略图：他把历史与现实、内在与外在、穷人与富人、上级与下级、长者与幼者、社会与个人等等都放在吃人的氛围中去品味，从而让人们感到了吃人的普遍性、残酷性、长久性和恐怖性。他的非常态的敏感促使他广泛的想象，而广泛的想象又使他更加多疑，而多疑又让他更加敏感，这种反复只能使狂人处于极度的紧张和恐惧中。狂人的这种心理同他所受到的压抑和屈辱有着密切的联系。压抑感和屈辱感越强烈，他就越敏感，而越敏感，他的压抑感和屈辱感就更加强烈。\n\n（4）渴求极致，导致自虐心理\n\n狂人对真的人的追求极其强烈，并把它作为自己人生的目标和终极价值。他不仅希望社会每个人都能够成为真的人，而且更希望自己成为真的人。但成为真的人需要一个漫长的过程，这自然会让狂人愤世嫉俗。更可怕的是狂人自身也很难成为真的人。\n\n面对理想和现实之间的巨大差距，狂人对自身也产生了怀疑和愤恨，以致表现出对自己的否定。同时，狂人的敏感性特征让他不能不想到自己同吃人者的关系。他既然生活在吃人者之中，既然生活在吃人者之家，无论如何他也脱不了吃人的干系。而有着吃人历史的人，也没有脸面去见真的人，那样的世界是不能让我们这样的人去生活，那生活也只能属于真的人。过度的自责导致狂人的自虐。\n\n二、狂人形象的原型\n\n（一）真正的疯子\n\n狂人形象是有原型的，最显明的，自然要算鲁迅先生的表弟阮久苏。他“是一个在势利场中快要被别人吞掉的弱者”，是因私事抑郁而致狂。鲁迅还有一个学生，也是病狂患者。这二人，都是真疯子。\n\n（二）在封建势力的迫害下自称为“疯子”的人\n\n在当时的社会生活中，还有另一类“疯子”原型，那就是在封建势力的迫害下自称为“疯子”的人，或在黑暗的社会环境中被视为“疯子”的革命者。如鲁迅在杂文《补白》中提到的自称“疯颠”、有“神经病”的章太炎；在小说《药》中被\n\n人视为“发了疯了”的革命者夏瑜。\n\n可见，鲁迅笔下的狂人形象的生活原型是丰富的，真疯假疯皆有。从艺术反映生活的真实来说，“狂”就是作者在现实生活中所悟到的二者共同的外部表象特征。\n\n三、狂人形象的作用\n\n鲁迅在《狂人日记》中采用狂人写日记这种艺术构思主要是为了发挥这一构思的两种功能，即狂人视点功能和狂人错觉功能。而这两种功能能够充分满足这篇小说的思想表达和艺术追求的需要。\n\n（一）通过狂人视点，充分揭露吃人现象\n\n《狂人日记》除了前面的小序之外，都是从狂人这个视点去审视世界的。而这一狂人视点具有充分揭露吃人现象的功能.\n\n中国的史书上虽然有着大量的吃人记载，现实生活中虽然吃人的事情屡有发生，中国人的头脑中虽然不乏吃人意识，然而或者因为无暇顾及，或者因为司空见惯，或者因为不以为非，一般的正常人是不会十分关注吃人问题的。因而很难通过一个正常人的视点去审视世界而达到充分揭露吃人现象的效果。\n\n但是以狂人为视点情况则有所不同。患着迫害狂的狂人完全陷入了人吃人的意识当中。他日夜担心着周围的人要害他，吃他，还觉得所有的人都是“自己想吃人，又怕被别人吃了，都用着疑心极深的眼光，面面相觑”。也正因如此，他才会联想到历史上那么多的吃人事例，才会从每页上都歪歪斜斜地写着“仁义道德”几个字的史书上看出满本的“吃人”，才会对现实生活中的吃人事件异常敏感，才会潜心揣摩大哥和母亲灵魂里的吃人心思。\n\n因而从狂人这个视点去审视世界就能够让读者看到种种与吃人问题有关的现象，所以说狂人视点具有充分揭露吃人现条的功能。\n\n（二）通过狂人错觉，发人深思，提高阅读兴趣\n\n迫害狂患者思维的一个重要特征就是常常会出现对于现实世界的错觉。因而狂人所写的日记里也就必然常常出现错觉。从错觉和非错觉的角度我们可以将狂人日记里的话语分为三类：\n\n第一类是正常的反映和深刻的见解。日记第十则中所写的“易牙蒸了他儿子，给桀纣吃......”那段话，虽有两处语误，却是难得的对于中国历史和现实的深刻的见解。第二类是由狂人的迫害狂症状所导致的对于现实生活的错觉。如第四则日记中说给他诊病的医生是“刽子手扮的”。第三类是类似错觉的深刻的感受。如第三则日记中所写的从史书的“仁义道德”字缝里看出“吃人”二字的那段话，虽然感觉形式具有错觉性质，但却反映了狂人对吃人现象与封建礼教之间内在联系的透视。\n\n这三类话语在日记里依靠狂人独特的思维方式错杂地交织在一起，会使乍读这篇小说的人如堕五里雾中。读者必须反复辨认、仔细揣摩、深入思考，才可能领会作品的意蕴。但也正因如此，读者才会认真琢磨作品中的话语，才会潜心思考作品中所提出的问题。而且也正因如此，读者才会对作品中具有阻扼性的话语产生一种猜谜般的兴趣，并从而提高对整个作品的阅读兴趣。这就是狂人错觉在作品中所发挥的两种功能-发人深思功能和提高阅读兴趣功能。","keywords":"复义性特征 人的多种存在状态 曾经患有“迫害狂”的人 普泛性特征 中国知识分子的类的代表 精神符号 洞察力和判断力 怀疑性和反叛性 忧患意识和责任感 反思意识与完善意识 心理存在 屈辱感 偏执狂 敏感多疑 自虐心理 原型 真正的疯子 封建势力迫害下自称为“疯子”的人 作用 狂人视点 揭露吃人现象 狂人错觉 发人深思 提高阅读兴趣","note":""},{"id":"11","stars":"★★★★★","title":"试分析《阿Q正传》中阿Q这一形象的特点","body":"《阿Q正传》不朽的思想价值主要在于它高度概括地表现了在数千年封建文化窒息下形成的中国国民性的弱点，阿Q则是这种国民性弱点的集中体现者。这一经典形象，主要具备以下特征：\n\n一、阶级特征：受压迫、受剥削的广大劳动群众的一员\n\n像一切杰出的文学典型一样，阿Q首先是一个鲜明的个性形象。阿Q没有土地，没有家，住在土谷祠里，没有固定的职业，靠打短工、做帮工维持生活，是一个地道的赤贫的乡村劳动者。从阶级属性而言，他是一个“上无片瓦，下无插针之地\n\n的流浪雇农，是受压迫、受剥削的广大劳动群众的一员。\n\n二、基本特征：自我意识严重缺乏\n\n阿Q的基本特征就是自我意识的严重缺乏，所谓缺乏自我意识，就是说他的整个思想观念不是在他自身的生活追求和精神追求的基础之上产生的，而是为传统的、因袭的思想观念所束缚。在这种情况下，他的一切思想观念都与他的本能欲望没有任何的联系，并且常常处于严重对立的状态，当他被本能的欲望所驱使的时候，他从内外两方面都无法找到思想观念的支持，因而他不能从中生长出自己的理性认识，也无法坚持自己的追求；而当他在传统思想观念的支配下行动的时候，又与他的实际生活状态背道而驰，无法实际地满足他的生活要求，实现自己处境的根本转变。\n\n阿Q的思想在整体上是被异化了的，是被传统封建观念所窒息了的，并且他自身已经没有能力走出这种思想意识的怪圈。\n\n三、根本特征：“精神胜利法”\n\n所谓“精神胜利法”，是在一个不平等的强权统治的社会里，一个没有平等意识的人在处于劣败地位时消极承担人生苦难的一种思维方式。它有两层含义：第一层是用自我精神上心理上取胜来掩盖事实上的失败，或者说，在现实失败面前以精神的自我欺骗来成为精神上的压迫者；第二层是当他倚仗在精神或肉体上高过对方时，他就要成为事实上的压迫者。把两者结合起来，“精神胜利法”的实质就&#x662F;：一方面被人吃，一方面还总想不费气力地吃掉别人。这个不费气力，既有精神上的自欺自慰也有向弱者实行报复的意思。\n\n“精神胜利法”之所以成为阿Q的主要特征，是因为它是一个缺乏起码的自我意识的人的整个人生观的产物。《阿Q正传》一开始，鲁迅便以幽默的笔调和夸张的形式描写了阿Q极端卑下的社会地位，但阿Q对自己的这种社会地位没有任何明确的意识，封建的等级观念是不能体现他的自身利益的，而他却因袭着这种观念。于是，他的本能欲望便与他的思想观念发生了严重的对立。\n\n为了摆脱困境，他常常在想象中把自己抬到高于别人的地位，而这种空洞的想象很快被人破坏，于是他便陷入自轻自贱之中。在封建社会森严的等级制度中，阿Q不愿承认自己卑下的社会地位，不愿承认别人的歧视和嘲弄，可自身的弱小又导致被人欺辱是不可避免的。阿Q只能一方面承受欺辱，另一方面希翼通过欺辱别人来证明自己。\n\n由此，阿Q处于总是受人欺侮而本能上又不愿承认这种受欺侮的社会地位，于是，“精神胜利法”便成了他唯一的思想武器。\n\n四、封建观念与小生产者狭隘保守思想结合而成的革命观\n\n缺乏起码的平等意识和个性意识不但构成了阿Q的“精神胜利法”这种精神特征，同时也决定了阿Q的革命观。\n\n阿Q的革命根本不是为了谋求一个自由平等的社会，而是把自己提高到统治别人、压制别人的上等人的地位上去。他对革命的态度的种种转变并不是政治上的真正觉悟。他向往革命不是为了推翻阶级压迫，而是为了“要什么就有什么”，这是以狭隘的原始报复主义的传统观念来理解革命，是传统封建观念和小生产者狭隘保守思想结合的产物。\n\n阿Q的这种革命观念，无法带来中国社会的根本变化，只能做到中国历史上的那种改朝换代。也就是说，不在物质上和精神上铲除造成不平等的种种现象和原因，在“革命”的名义下重复的不过是历史上的“造反”，与中国的前途、人民的幸福、国家的强盛是无关的。\n\n五、封建传统与本能欲望剧烈冲突下的两性观\n\n阿Q的两性观从社会习惯势力中简单承袭过来，盲目地维护着封建的两性观念，而处在另一端的则是他的本能欲望。这时，两者的冲突和矛盾使他显现出极为荒谬可笑的特征。\n\n当阿Q本能的欲望发展起来时，连他自己也觉得这是不道德的，因而他便偷偷地做，被人发现后自觉理屈，不得不屈从于别人的惩罚。而在平时，他又以正人君子的面目出现。这时，这两个极端又在无形中相互加强：他越是压抑自己的本能欲望，便越是增加了对别人的敏感，越是变本加厉地束缚别人，把自己变成一个传统伦理道德的维护者。而这又使他更难以承认自己本能欲望要求的合理性，自己也愈益不敢公开接近女性。在这里，一个“正经”的阿Q和一个极不“正经”的阿Q 统一在了一起。","keywords":"阶级特征 广大劳动群众一员 基本特征 自我意识严重缺乏 根本特征“精神胜利法”封建观念与小生产者狭隘保守思想结合而成的革命观 封建传统与本能欲望剧烈冲突下的两性观","note":"《阿Q正传》在艺术上的成功离不开现实主义文学典型的塑造。鲁迅先生开掘了阿Q这个人物的内部世界，同时也就开掘了中国整个社会及其思想的状况。阿Q的世界中包括了整个封建社会中各色人等的精神因素。阿Q是一个人，同时又是封建时代所有的人。他有上等人的蛮横，也有下等人的卑怯；他有道学家的正经相，也有流氓无赖的流氓相；他是一个** --- 极端的保守派，反对革命，同时又是一个激进分子，拥护造反；他主张中庸和平，同时又是一个惹是生非的武力主义者。封建文化所可能产生的各种精神特征，在阿Q的精神世界中都表现了出来，因而其中也就有各种不同的人的影子。鲁迅成功地塑造了一个人物，同时也就展示了整个现实世界，表现了一种文化弊害和在这种文化室息中形成的国民性的弱点。需要注意的是，《阿Q正传》可能作为名词解释在考查中出现，大家要注意一下。"},{"id":"12","stars":"★★★★","title":"请谈谈如何理解“说不尽的阿Q”","body":"所谓“说不尽的阿Q”，指的是阿Q和一切不朽的文学典型一样，不同时代、不同民族、不同层次的读者从不同的角度、侧面去接近它，有着自己的发现与发挥，从而构成一部阿Q接受史，这个历史过程没有、也不会终结。在不同的时代，阿Q 这一经典形象被赋予了不同的内涵。\n\n一、20年代至40年代：“反省国民性弱点”的一面镜子\n\n鲁迅自己说，他之所以要写《阿Q正传》，是因为要“画出这样沉默的国民的魂灵来”，并且说“我还怕我所看见的（阿Q）并非现代的前身，而是其后，或者竟是二三十年之后”。\n\n最初人们也都是这样去理解阿Q的：小说开始连载时，茅盾就指出，阿Q是“中国人品性的结晶”；直到三四十年代人们也依然强调阿Q是“旧的中国精神文明的化身”。这就是说，无论是20年代的启蒙主义思潮，还是三四十年代的民族救亡思潮，都提出了“民族自我批判”的时代课题，阿Q也就自然成为“反省国民性弱点”的一面镜子。\n\n于是，人们关注“阿Q精神”的核心：“精神胜利法”，并且做了这样的阐释：尽管阿Q处于未庄社会的最底层，在与赵太爷、假洋鬼子，以至王胡、小D的冲突中，他都是永远的失败者，但他却对自己的失败命运与奴隶地位采取了令人难以置信的辩护与粉饰态度。或者“闭眼睛”，根本不承认自己落后与被奴役，沉醉于没有根据的自尊之中；或者“忘却”；或者向更弱者（小尼姑之类）泄愤，在转嫁屈辱中得到满足；或者自轻自贱，甘居落后与被奴役；在这些都失灵以后，就自欺欺人，在自我幻觉中变现实中真实的失败为精神上虚幻的胜利。\n\n人们发现，阿Q的这种“精神胜利法”是中华民族觉醒与振兴的最严重的思想阻力之一，鲁迅的《阿Q正传》正是对我们民族的自我批判。\n\n二、50年代至70年代末：“落后的农民”（或“农民”）的典型\n\n50年代至70年代末，新中国成立以后，人们强调要对文学作品进行阶级分析，于是阿Q就被视为“落后的农民”（或“农民”）的典型，关注重心也发生了转移。\n\n首先强调的是阿Q是未庄第一个“造反者”，一位批评家这样分析阿Q“土谷祠的梦”：“它虽然混杂着农民的原始的报复性，但他终究认识了革命是暴力”，“毫不犹豫地要把地主的私有财产变为农民的私有财产”，并且“破坏了统治了农民几千年的地主阶级的秩序和“尊严’”，这都表现了“本质上是农民的革命思想”。\n\n小说后半部对阿Q与辛亥革命的关系的描写也引起普遍重视。批评家认为鲁迅是“从被压迫的农民的观点”对资产阶级及其领导的辛亥革命进行了深刻的批判。毛泽东也多次提醒人们要吸取假洋鬼子“不许（阿Q）革命”的教训。\n\n三、80年代：“国民性弱点”的典型\n\n80年代初的思想解放运动中，人们又从《呐喊》《彷徨》是“中国反封建的思想革命的一面镜子”的观念出发，重读《阿Q正传》。尽管关注的重点并无变化，人们却给予了完全不同的意义解释：强调的是阿Q造反的负面；辛亥革命的教训也被阐释为“政治革命行动脱离思想革命运动”，忽略了农民（国民）的精神改造。这样，阿Q就再一次地被确认为“国民性弱点”的典型。\n\n四、当下：对人类生存困境的揭示\n\n近年来，在“改革开放”的大背景下，人们开始转向对“阿Q精神（性格）”的人类学内涵的探讨，并做出了另一种分&#x6790;：阿Q作为一个“个体生命”的存在，几乎面临人的一切生存困境：&#x57FA;本生存欲求不能满足的生的困恼（《生计问题》）、无家可归的惶惑（《恋爱的悲剧》）、面对死亡的恐惧（《大团圆》）等等，而他的一切努力挣扎（《从中兴到没落》），包括投奔革命，都不免是一次绝望的轮回。人只能无可奈何地返回自身，如恩格斯所说：“他人既然对物质上的解放感到绝望，就去追寻精神上的解放来代替，就去追寻思想上的安慰，以摆脱完全的绝望处境”，并借以维持自己的正常生存，在这个意义上，“精神胜利法”的选择几乎是无可非议的。\n\n但这种选择又确实丝毫没有改变人的失败的屈辱的生存状态，只会使人因为有了虚幻的“精神胜利”的补偿而心满意足，进而屈服于现实，成为现存环境的奴隶。这样，为摆脱绝望的生存环境而做出的“精神胜利”的选择，却使人坠入了更加绝\n\n望的深渊，于是，人的生存困境就是永远不能摆脱的。\n\n鲁迅正是通过对这一生存状态的正视，而揭示了人类精神现象的一个重要侧面，从而使自己具有了超越时代、民族的意义与价值。","keywords":"20年代至40年代“反省国民性弱点”的一面镜子50年代至70年代末“落后的农民”典型80年代“国民性弱点”典型 当下 对人类生存困境的揭示","note":"让大家理解“说不尽的阿Q”，其实质就是让大家梳理一下阿Q这一形象的接受史。阿Q这一经典形象，在不同的时代，从不同的角度分析，具有不同的内涵。而这些不同的内涵，主要是与当时的文学思潮联系在一起的，从“反省国民性弱点”的一面镜子到对人类生存困境的揭示，正好反映了现当代整体文学思潮的变动。大家可以从这个角度出发去加深**理解。"},{"id":"13","stars":"★★★★","title":"请谈谈你对“精神胜利法”的认识","body":"“精神胜利法”是阿Q的主要特征，与阿Q这一形象紧密联系在一起，是鲁迅“国民性批判”的重要内容之一。\n\n一、“精神胜利法”的内涵\n\n所谓“精神胜利法”，是在一个不平等的强权统治的社会里，一个没有平等意识的人在处于劣败地位时消极承担人生苦难的一种思维方式。\n\n它有两层含义：第一层是用自我精神上心理上取胜来掩盖事实上的失败，或者说，在现实失败面前以精神的自我欺骗来成为精神上的压迫者；第二层是当他倚仗在精神或肉体上高过对方时，他就要成为事实上的压迫者。\n\n把两者结合起来，“精神胜利法”的实质就是：一方面被人吃，一方面还总想不费气力地吃掉别人。这个不费气力，既有精神上的自欺自慰也有向弱者实行报复的意思。\n\n二、“精神胜利法”的形成过程\n\n在《阿Q正传》中，鲁迅清晰地向人们表现了阿Q“精神胜利法”不断升级的过程。\n\n（一）第一阶段：“实力政策”\n\n阿Q的“精神胜利法”是从维护自己空洞的“面子”出发的，他无法对自己做出明确的价值判断，无法从自我的发展中证实自己存在的价值，因而便特别注重维护自己的“面子”。这种对“面子”的重视本身便带有精神胜利的性质。\n\n阿Q在开始维护自己的面子时，“估量了对手，口讷的他便骂，气力小的他便打”。这是他的“精神胜利法”的第一个阶段，其内涵在于：凡是不能正确判断自我价值而单纯地从别人对自己的歌功颂德而获取自我荣誉的“死要面子”的行为，都是“精神胜利法”的一种表现形式。这时，阿Q用的是上等人对待下等人的“实力政策”和蛮横态度。\n\n（二）第二阶段：“怒目主义”\n\n“怒目主义”是用情感的表现去替代实力斗争中的失败，以此来抚慰这种失败给自己造成的心理创伤。这是阿Q“精神胜利法”的第二个阶段，其内涵是：凡是在实力的斗争中遭到失败而仅仅满足于对对手的情感反抗、不再追求实力斗争中的实际胜利者，在本质上都是“精神胜利法”的表现。”\n\n（三）第三阶段：以空洞的言词代替实力斗争中的失败\n\n“怒目主义”失败后，阿Q只好以自欺欺人的自骄来求得心理上的平衡。于是，他在空洞的言词上取得了“胜利”，抚慰了自己心灵中的创伤。\n\n这是他“精神胜利法”的第三个阶段，其内涵是：凡是以空洞的言词代替实力斗争中的失败，不再追求实力较量中的胜利的人，在本质上都是“精神胜利法”的表现。这种空洞言词上的胜利到底还是一种外在的表现。\n\n（四）第四阶段：心理上战胜别人\n\n当空洞言词的胜利这种外在表现也招来实际的压制和摧残的时候，阿Q自我安慰的方式便进一步内化为自己的内部语言-“儿子打老子”-这是他在心理上战胜别人的手段。在这时，他的“精神胜利法”才具有了纯粹“精神”的性质。\n\n这是他的“精神胜利法”的第四个阶段，其内涵是：凡是在实力斗争中失败而仅仅在私下里把敌人骂为“坏人”“贱种”并以此为满足的人，在本质上都是用“精神胜利法”抚慰自己的人。\n\n（五）第五阶段：把“服从”“忍让”“委曲求全”当作骄傲的资本\n\n在心理上战胜别人这种“腹诽”的方式仍然会被人们觉察，并因此受到强权者的欺凌。阿Q又不能不公开承认强权者行为的合理性，承认别人打自己是“人打畜牲”，已经不可能在公开的言词上为自己争到高于别人的借口，于是，他便为这种\n\n能够比别人更加“自轻自贱”而骄傲。\n\n这是阿Q的“精神胜利法”的第五个阶段，其内涵是：凡是受人欺侮而又不得不公开承认别人欺侮自已行为的合理性，并且把“服从”“忍让”“委曲求全”当作骄傲的资本的人，本质上都属于“精神胜利法”的拥有者。\n\n（六）第六阶段：自己打自己嘴巴\n\n在阿Q“精神胜利法”的各个阶段，人们都会感到阿Q在精神人格上已经分裂为二：一个是受欺侮的实际的阿Q；一个是在精神上为这种受欺侮而辩白的阿Q-前者是最低贱的人；后者是虚妄地自居于任何人之上的人。\n\n所以，阿Q的“精神胜利法”的最高表现形式便是这种人格分裂的极端表现-自己打自己的嘴巴。这是阿Q的“精神胜利法”的第六个阶段，其内涵是：凡是在实力斗争失败之后不再谋求实际的胜利而满足于自谴自责自怨自艾的人，都是在用“精神胜利法”抚慰自己的精神创伤。\n\n三、“精神胜利法”成为阿Q主要特征的原因\n\n“精神胜利法”之所以成为阿Q的主要特征，是因为它是一个缺乏起码的自我意识的人的整个人生观的产物。《阿Q正传》一开始，鲁迅便以幽默的笔调和夸张的形式描写了阿Q极端卑下的社会地位，但阿Q对自己的这种社会地位没有任何明确的意识，封建的等级观念是不能体现他的自身利益的，而他却因袭着这种观念。于是，他的本能欲望便与他的思想观念发生了严重的对立。\n\n为了摆脱困境，他常常在想象中把自己抬到高于别人的地位，而这种空洞的想象很快被人破坏，于是他便陷入自轻自贱之中。在封建社会森严的等级制度中，阿Q不愿承认自己卑下的社会地位，不愿承认别人的歧视和嘲弄，可自身的弱小又导致被人欺辱是不可避免的。阿Q只能一方面承受欺辱，另一方面希冀通过欺辱别人来证明自己。\n\n由此，阿Q处于总是受人欺侮而本能上又不愿承认这种受欺侮的社会地位，于是，“精神胜利法”便成了他唯一的思想武器。\n\n四、“精神胜利法”的历史渊源\n\n阿Q的“精神胜利法”是整个封建文化的产物，对在封建等级观念支配下的人的精神面貌具有普遍的概括意义，而其表现为一种国民性的弱点则有着特定的历史背景。\n\n鸦片战争之后，中国在帝国主义的强权侵略面前成了失败者。这时，谋取自强、正视自己的孱弱地位、力争把自己提高到与世界各国平等竞争的强国地位是唯一正确的历史选择。但是，以清政府为代表的整个封建势力不但不敢正视自己的实际处境，反而用“中国精神文明冠于全球”“中国地大物博、人口众多”等吹嘘掩盖自己的虚弱本质，自欺欺人，表现出了“精神胜利法”的劣根性。\n\n这些封建统治者在人民面前一直是以主子自居的，但在更强盛的外国帝国主义面前则暴露出了奴才相。这种历史状况使鲁迅更加清楚地意识到，只要承认人的权利在本质上是不平等的，不论他在弱者面前何等蛮横无理，在更强者面前也一定会暴露出自己的奴才本质。如果说封建等级观念是中国封建文化的一种本质的话，那么，“精神胜利法”就不只是像阿Q这类最弱小的人的本质表现，同时也是包括统治者在内的整个国民性的弱点。","keywords":"内涵 被人吃 总想不费气力地吃掉别人 形成过程 实力政策 怒目主义 空洞的言词 心理上战胜别人 把“服从”“忍让”“委曲求全”当作骄傲的资本 自己打自己嘴巴 成为主要特征的原因 缺乏起码的自我意识的人的整个人生观的产物 历史渊源","note":"“精神胜利法”是《阿Q正传》中十分重要的一部分内容，虽然在考查中出现的频率不是特别高，但历来为人所关注，所以我们也需要注意一下。这些内容中，最重要的一部分内容无疑是“精神胜利法”的内涵，其余“精神胜利法”的形成过程、成为阿Q主要特征的原因以及其表现为国民性弱点的历史背景，我们主要还是以了解为主。相较于论述题，“精神胜利法”在名词解释中出现的频率反而更高一些。"},{"id":"14","stars":"★★★★★","title":"试分析《阿Q正传》的艺术成就","body":"《阿Q正传》在艺术上也取得了杰出的成就，具体表现在以下方面：\n\n一、注重现实主义文学典型的塑造，将文学典型塑造的方法提高到了一个新的高度\n\n《阿Q正传》在艺术上的成功首先在于注重现实主义文学典型的塑造。《阿Q正传》把文学典型塑造的方法提高到了ー个崭新的高度。中国古代的优秀小说也注重塑造典型。但包括《红楼梦》中的典型人物在内，都是中国文化某一个方面的典型。他们以其各自的关系构成矛盾冲突，组成事件，从而构成对整个现实世界的象征。\n\n《阿Q正传》则不同。在《阿Q正传》中，鲁迅开掘了阿Q这个人物的内心世界，同时也就开掘了中国整个社会及其思想的状况。阿Q的世界包括了整个传统封建文化的特征，同时也便包括了整个封建社会中各色人等的精神因素。阿Q是一个人，同时又是封建时代的所有的人。封建文化所可能产生的各种精神特征，在阿Q的精神世界中都表现了出来，因而其中也就有各种不同的人的影子。\n\n鲁迅成功地塑造了一个人物，同时也就展示了整个现实世界，表现了一种文化的弊害和在这种文化窒息中形成的国民性的弱点。《阿Q正传》之所以取得巨大的成功，与鲁迅的这种典型化的方法是息息相关的。\n\n二、外冷内热\n\n鲁迅将一颗火热的心埋藏在心坎里，将思想启蒙者的热情，转化为对阿Q悲剧命运的深切同情，哀其不幸，怒其不争，转化为对辛亥革命中途天折的无比痛惜，转化为对赵太爷、假洋鬼子之流凶残暴虐、横行乡里的憎恶和鄙视，以犀利的解剖刀冷峻地解剖着一切。\n\n三、以讽抒情\n\n鲁迅善用讽刺手法，他运用鲜明强烈的对比手法来刻画阿Q这一典型人物的性格；同时，鲁迅运用离奇的夸张手法进行讽刺，比如，在小说末尾写阿Q在土谷祠被捉的场面尤其夸张，暴露了反动统治的外强中干；此外，文中多处运用反语，寓庄于谐，收到了较好的效果。同时，小说中也使用了议论的手法，虽然并不多，但是恰到好处，同样收到了较好的艺术效果，这是《阿Q正传》讽刺艺术的又一体现。\n\n鲁迅通过高超的讽刺艺术，批判了阿Q的落后、麻木和精神胜利法，鞭挞了赵太爷、假洋鬼子等人的凶残、卑劣，谴责了知县大老爷、把总、民政帮办的反动实质。而其讽刺，又贵在旨微而语婉，虽无一贬词而情伪毕露。\n\n四、将悲剧与喜剧有机结合了起来\n\n《阿Q正传》在艺术上把喜剧与悲剧有机地结合了起来。作品展示了一出出喜剧：阿Q种种可笑的行径，未庄人的种种可笑可鄙，阿Q的衙门受审等。但在这种喜剧性场面背后都隐藏着深刻的悲剧，我们在被这些喜剧场面引得发笑的同时，又总是有一股沉重的力量，把我们的笑变成一种含泪的笑。在《阿Q正传》中，一切可笑的，同时也是可悲的；一切可悲的，都同时又是可笑的。传统的悲剧和喜剧的差别消失了。\n\n这种形喜实悲的悲喜剧色彩，正是作品产生巨大艺术魅力的重要因素之一。这种艺术方法，极好地体现了鲁迅对阿Q、对软弱而又不知进取的国民和对在帝国主义强权侵略威胁下不求自强的整个民族“哀其不幸，怒其不争”的情感态度。\n\n五、语言个性化，并富有幽默感\n\n《阿Q正传》在语言上取得了突出的成就。首先是语言的个性化，这部作品的人物对话，各有特色，能使人“从谈话里推见每个说话的人物”。以最简洁的对话，画龙点睛式地塑造人物形象，这是鲁迅小说语言的重要特色。同时，小说语言饱含幽默，并且好用反语，喜欢夸张，增强了讽刺力度。如使用“谁料博雅如此公”“斯亦不足畏也矣”等古语，言简意赅，富于表现力，而且给作品增添了一种特有的诙谐性与讽刺力。","keywords":"现实主义文学典型 外冷内热 以讽抒情 悲剧与喜剧有机结合 语言个性化 富有幽默感","note":"作品艺术的美，来自于艺术家作为“人”的本质力量在艺术形象中的外射。那就是说，艺术家本身的理想和抱负，他的气质和修养，决定了他的作品的艺术特色。鲁迅的个性特征，他的理想和抱负，都是十分鲜明的。他那爱国主义热情、现实主义精神和启蒙主义理想，都像血液流注在人体中一样流注到他的作品中去，从而形成了他的小说独特的艺术的美，独特的风格和特色。《阿Q正传》是他的代表作，因此，这种风格和特色表现得最为明显。"},{"id":"15","stars":"★★★★","title":"试分析《伤逝》的思想内容","body":"《伤逝》以涓生的手记的形式，通过带有忏悔情调的独白，讲述了涓生与子君的爱情悲剧。而通过这一爱情悲剧，显示出了鲁迅多方面的思索与情感，具体表现在以下方面：\n\n一、对当时社会封建势力依旧强大的表现与批判\n\n从社会等客观原因看，在实现广泛的思想启蒙和社会解放之前，知识分子想要单独实现他们的理想是不可能的。而涓生与子君的追求以失败告终，其根本原因是社会的迫害。\n\n他们这种不由父母之命媒妁之言的自由结合，私自同居，是为当时的社会所不容的。从他们一开始相爱，周围的“老东西”和“小东西”就在用一种异样的神情不断地窥视着他们；他们走在路上，也时时会遇到投射过来的探索、训笑、猥亵和轻蔑的眼光；寻找住所时又往往被托辞拒绝-子君因此而和她的叔父闹翻并为她的父亲所摒弃；涓生也不得不与他的许多\n\n朋友绝交，进而并终于被局里解职。后来，在生活的重压和煎逼之下，他们间的爱情也终于无法维系下去了。所以，他们的追求最终走向失败，其根本原因显然是由于社会对他们的迫害。\n\n二、对个性解放的知识分子历史命运与道路的思素\n\n《伤逝》对造成悲剧主观原因的揭示同样是深刻的：导致二人分手的，不是生活的艰难本身，而是面对爱情的态度。这也是小说精神聚焦所在。\n\n涓生和子君这对“五四”时期勇敢地冲出旧家庭的青年男女，由于他们把争取恋爱自由看作是人生奋斗的终极目标，眼光局限于小家庭的安宁与幸福，缺乏更高远的社会理想来支撑他们的新生活，这使他们无力抵御社会经济的压力，爱情也失去附丽，结果，子君只好又回到顽固的父亲身边，最后凄惨地死去，而涓生则怀着矛盾、悔恨的心情，去寻找新的生活。由此，鲁迅较早地提出了个性解放的知识分子历史命运与道路的主题。\n\n鲁迅对涓生和子君的命运非常关怀，他虽然并没有为他们出谋划策，并没有为他们正面指出一条出路，但通过他的饱含感情的描写，却十分有力地叩动了读者的心弦，引起了人们的痛苦的思索。\n\n三、对“启蒙者”进行反思和除魅，并进而反思启蒙本身\n\n当同时代的“启蒙者”们专注于向“蒙昧”宣战的时候，鲁迅已经开始了对“启蒙者”自身的“解剖”。而《伤逝》，就是鲁迅“除魅”“启蒙者”的一个结果-无疑地它也成为“五四”以来对“启蒙者”自身进行反思的重要文本。\n\n“启蒙”的一个重要理念在于对“理性”的追求和坚守，作为“启蒙”的践行者，“启蒙者”自然也应该具有理性精神，可是我们在《伤逝》中看到的涓生，却是一个缺乏理性精神、每每以冲动的念头指导自己行为的盲动者。这样的“启蒙者”，只能给别人（受启蒙者）和自己带来悲剧。《伤逝》中的涓生和子君的爱情悲剧，无疑内蕴着作者鲁迅的理性思考：当时代和社会迷信于“启蒙者”的崇高和神圣时，鲁迅通过对涓生这一“启蒙者”的形象塑造，对“启蒙者”自身的缺陷进行了深刻的反省，对笼罩在“启蒙者”身上的正义和正确光环进行了去魅，并由此引发人们对启蒙本身的反思。\n\n四、对生命意义的思考\n\n在对生命意义的思考方面，鲁迅同样有其卓越之处，而《伤逝》同样表现了鲁迅对生命意义的思考。\n\n作者对子君这样一个大胆纯情的弱女子，无疑是赞赏和爱惜的，对她“死于无爱的人间”则深感愤慨。他却又严苛地剖析了子君以世俗因袭的幸福为满足人生观狭隘平庸的局限。对涓生，鲁迅从道义上有着深沉的谴责，甚至让他想到了地狱的“孽风”和“毒焰”。但是，对于涓生在追求生命终极意义与珍重子君个体生命之间的二难处境，鲁迅流露出深深的体谅。\n\n在涓生主观方面，与子君的恋爱、同居和离异，都源于他对生命终极意义的追求。涓生一方面深深忏悔，另一方面又感到有苦难言，感到说不出的自我生存的悲哀，并坚忍地违背自己的忏悔，决然前行，这里显然熔铸了鲁迅的自我情感体验和生存感悟。","keywords":"社会封建势力依旧强大 历史命运与道路 对“启蒙者”反思和除魅 对生命意义的思考 自我情感体验 生存感悟","note":"《伤逝》是鲁迅先生唯一一篇探讨爱情的小说。它通过对子君和涓生两个青年知识分子从相爱到分离、从奋斗到幻灭的爱情悲剧的描写，赞扬了他们敢于蔑视传统坚决反对封建势力的精神，揭露了半封建半殖民地社会的狰狞面目和丑恶本质，谴责了封建顽固势力对他们的摧残迫害。同时又揭示了单纯为了解救自己的“个性解放”的局限性，即否定了脱离开社会解放的“个性解放”，批判了子君和涓生的爱情至上主义、狭隘的自我中心意识以及软弱的性格，提出了青年知识分子要从封建桎梏下争取彻底解放究竟应走什么道路这个重大问题。和当年反映同一题材的作品相比，它在内容和形式上都是别开生面的。相关论文可以参考刘俊《对“启蒙者”的反思和除魅-鲁迅＜伤逝＞新论》、宋剑华《＜伤逝》：鲁迅对思想启蒙的困惑与反省》，具体资料可以在李凡文学正版群中领取。"},{"id":"16","stars":"★★★★","title":"试分析《伤逝》的艺术成就","body":"《伤逝》是鲁迅十分重要的一部作品，在文学史上占有重要的地位，这不仅仅是因为其丰富的思想内涵，也得益于其高超的艺术成就，具体表现在以下方面：\n\n一、高超的叙事技巧\n\n（一）沉郁低缓的叙事基调\n\n鲁迅从题目篇名就带出了气氛、情绪、甚至主题，让人预感到一个悲惨的关于人的感情遭难受劫的故事：从“伤逝”和“涓生的手记”，就为我们按定了沉郁低缓的调子，悲悔情绪充盈其中，“伤逝”既是小说的篇名，又是小说的主题；既是\n\n渲染的叙述基调，又是描摹的心理态势......当作家以“伤逝”为标题为我们奏响这首悲情缱绻的悼亡曲时，悲悔的情绪溢于字里行间，锥心的悔恨、刺骨的悲哀，流贯全篇，揪人心肺，叙述基调便如同天造地设般地形成了。\n\n而在故事的叙述过程中，鲁迅又从不同方向对“伤逝”主题进行暗示与阐述。这样，“伤逝”便又成了一个恒定的心理情势。“伤逝”既是叙述的起因，也是叙述的结果，更是叙述的主体与重心......沉郁低缓的叙事基调一步步强化，并影响全篇。\n\n（二）破碎化的叙事策略\n\n《伤逝》中的“记忆片断”总是围绕着“伤逝”主题而展开，浸透了主人公强烈的主观情感，记忆对往事的有意筛选和过滤，不仅规定了叙述基调的特有态势，而且制约了叙述的内容和方式。主观、随意的往事回忆与“悔恨和悲哀”的情绪宣泄，实为间接瓦解了情节的因果必然性，破碎的叙述方式便相伴而生了。\n\n《伤逝》中的破碎叙述具体表现为细节重复、心理闪回及多视角叙述等。作家在一种沉郁、低缓的叙述基调中进行破碎叙述，实际上达到了放慢叙述节奏、吸引读者的目的。于是，人们便在这种低回、缓慢，甚至瞬间停顿的节奏中贴近了主人公复杂难解的情感世界，也由此步入了这种特定叙述节奏所烘就的艺术境界中了。\n\n（三）双层叙述结构下的反讽性质\n\n《伤逝》是作者以第一人称的方式，通过涓生的自我内心独白，展开故事叙述的。《伤逝》在表层上是涓生在向他的读者讲述他与子君的故事，但实际上叙述者涓生的讲述又同时是被隐含作者的讲述。也就是说，叙述者涓生的讲述成了作者整个叙事结构的构成部分。在一个层面上的讲述，在另一个层面上变成了被讲述的内容，正因为是作者在掌控着讲述的声音，它所传达的信息是讲述者涓生所不知的。\n\n洞生讲述的是他自认为的真实，他对自己的言行不一，信念和事实，显意识和潜意识的矛盾，完全无知无觉。隐含作者不动声色地稍加点染，略作铺陈而形成的反讽语境，使涓生的讲述越真诚，越加自我暴露，也越加自我反讽，从而使文本传出两种声音，双重意义。表层是涓生的话语，深层则是隐合作者对其话语的反讽。\n\n二、将抒情与议论完美结合，具有散文化倾向\n\n《伤逝》作于以“杂文的自觉”为标志的鲁迅文学风格的转折期，具有文体混合的特征，具体表现为杂文手法向小说的渗透。《伤逝》以抒情的笔调叙事，在叙事中将抒情与议论完美结合，使小说具有散文化倾向。《伤逝》中虽然拥有相对完整的情节和较为突出的人物形象，但其主要用意并不在于铺叙青年男女的悲欢离合的爱情故事，而是于精心渲染中强化男女主人公于其中的悲哀、悔恨与迷惘的情绪，及对爱情和人生真谛的探求与思考。\n\n三、音乐化的诗语\n\n《伤逝》的语言是一种音乐化的诗语，是典型的情感语言，让我们直接感受到语言之美。\n\n《伤逝》井没有刻意地铺采摛文，它的语言毫不雕琢，相当自然；但又确实给人词采绚丽的华美感，究其原因，在语言的结构方式上。《伤逝》好用排偶、反复、倒装、比喻等修辞手法。修饰性结构的话语，可以说是这篇作品言语的基本方式。修辞手法的运用，是《伤逝》语言美的重要原因；而修饰性语句的普遍采用，则导致这篇作品不但词采绚丽，而且富于音乐旋律感。而《伤逝》对语言的陌生化追求、对语言的形式美的追求，都为着适应抒发深切复杂情绪这一目的。它的流动性、音乐性形式，恰好表现着无尽的情绪。这音乐化的诗语，正是《伤逝》语言成就的体现。","keywords":"高超叙事技巧 沉郁低缓 叙事基调 破碎化 叙事策略 双层叙述结构 反讽性质 抒情议论完美结合 散文化倾向音乐化的诗语","note":"鲁迅先生以现实主义的手法，以同情和批判的态度塑造了男女主人公的形象，从而揭示了恋爱和婚姻问题是整个社会解放的一个组成部分。而其之所以能显示出经久不衰的魅力，不仅在于文章思想之深刻，在艺术手法上也十分高超。《伤逝》是鲁迅作品中考查频率较高的一部，需要大家重点掌握。相关内容可以参考张忆《情无尽，长歌不音绝-＜伤逝＞语言的音乐特质》、李今《析＜伤逝》的反讽性质》、马丽蓉《在空间维度上叙事-＜伤逝＞新解》，具体资料可以在李凡文学正版群中领取。"},{"id":"17","stars":"★★★★","title":"试分析鲁迅《故事新编》是如何进行文化批判的","body":"鲁迅的危机意识和古今同质的哲学理念，决定了《故事新编》最突出的表现手法就是“古今杂糅”，而鲁迅正式采用“古今杂糅”手法进行文化批判，主要表现出以下几个方面的特征：\n\n一、将现代人物、现象直接嫁接在历史语境之中，对现代的丑类予以鞭挞，在古今的对比中得到理性的升华。\n\n《奔月》里“若以老人自居，是思想的堕落”，“即以其人之道，反诸治其人之身”“你打了丧钟”等等现实的高长虹\n\n的话语来置于古代语境中，在开玩笑般的调侃中掩饰不住对此类丑角背叛龌龊行径的愤懑和轻蔑。《起死》中的庄子直接就以一副怪诞的做戏的形象出现在舞台上，不但拥有现代化武器“警笛”，而且拿统治者来为自己壮威。\n\n无论是古人还是今人，一样的言行不符，撒逛造谣，蝇营狗苟，让人怀疑中国几千年的历史不是沿直线上升而是压根就停滞不前，可见在这里鲁迅所嘲讽和鞭挞的不是具体的历史人物、历史现象，而是深层的造成国民心灵弊病、精神扭曲的传统文化，他取消了历史的时间性直指本质。\n\n二、将批判的矛头对准了祖坟里供奉的以“儒”“道”为主的圣贤们，并进行“刨祖坟”式的文化批判，旨在揭示现实丑恶现象的历史文化根源。\n\n没有自我意识和个性意识，爱面子，瞒和骗，折中，保守，少有创新意识都是传统文化的必然结果，是以儒家和道家为主体的传统文化对国人的精神奴役造成的人格的异化的扭曲。《故事新编》将批判的矛头对准了祖坟里供奉的以儒道为主的圣贤们，对传统文化进行重新审视。《出关》里漫画了两位祖师的形象，受人顶礼膜拜的孔圣人只是打着济天下的幌子向往仕途的官迷，而出世无为的老子只会懦弱无能的逃避。《采薇》中伯夷斤斤计较饼子的大小，叔齐则有些瞧不起哥哥。\n\n这些被一代一代叙述语言浪漫化、神圣化了的圣人，在鲁迅犀利笔锋解剖下被剥去涂金的伪装，抹去神圣的光环变得黯淡空无，只剩下平庸滑稽甚至卑劣。揭穿了从古至今上演着的弄权敷衍、偷生、自私、献媚、撒谎、骗人、吹牛、捣鬼的丑剧的根源，鞭挞了现代的提倡“尊孔，崇儒，读经，复古”的虚伪狡诈，同时也将其祖师从神圣的祭坛上拉下来，打碎，使其所代表的思想哲学无所依托，揭示出传统文化哲学的荒诞性及其现实操作的背谬，批判了早已被统治阶级利用而失真的“圣贤”们及其被畸化的思想文化，作为束缚和压制人性的枷锁、残害心灵的工具，造就一群“狮子似的凶心、免子的怯弱、狐狸的狡猾”的丑陋的中国人的历史文化根源。\n\n三、在历史、现实、未来的三位一体把握中，展开“社会批判”与“文明批判”，从中体现出独立的知识分子所具有的崇高的责任感与使命感。\n\n作为立志挽救世道人心的启蒙者，鲁迅在创作历史小说的时候也是自觉地将现实社会的腐败、文明的衰微与历史结合起来剖析其联系、挖掘其本质。“以过去和现在的铁铸一般的事实来测将来，洞若观火”。鲁迅的“社会批判”与“文明批判”就是建立在这种哲理性的文化认识上。《补天》显示出玩弄仁义道德的统治者及其帮闲的道貌岸然和以礼教的节烈来扼杀女性的生命的残忍和虚伪。《理水》的文人与大员则一同演出了一幕现代的新儒林外史和官场现形记。\n\n鲁迅在这里集中批判了侍奉主子的文化，尤其是这种文化驯养的奴才的无特操无独立自主意识，因此也看透了为这文化所熏染的国民-启蒙对象的心理实质。他清醒地意识到面对的社会环境和对象而依然执着于启蒙，揭示现实人生和社会思想文化困境，批判林林总总的奴役者和被奴役者及其文化根源，显示出鲁迅作为一个真正的知识分子对社会对民族的崇高的责任感和使命感。","keywords":"嫁接在历史语境 古今对比“刨祖坟”式文化批判 揭示历史文化根源 三位一体把握 责任感与使命感","note":"作为鲁迅创作的最后一部小说集，《故事新编》颇有意味地选择了“历史事件”作为题材，进行“演义”：在《呐喊》和《彷徨》中，鲁迅给我们展现的都是近现代中国的形形色色，不论人物，还是事件，都取材于身边现实生活；而《故事新编》则不同，虽然考据者们纷纷指出各种细节的现实来处，但无法否认的是，它已从前期的现实题材的描摹变为历史事件的重写。而在这些行为的背后，体现的是重写者对其重写对象的心理态度、情感倾向。小说集从现代人的角度，对人类的理想国进行了批判性思考，这些都表现出鲁迅的精神探寻与人生困惑。相关论文可以参考刘延红《历史的穿透力与感受力一一论（故事新编＞的文化批判和生命体验》，具体资料可以在李凡文学正版群中领取。这里需要提醒大家的是，作为与《呐喊》《彷徨》并列的作品，《故事新编》在名词解释中出现的频率也不低。"},{"id":"18","stars":"★★★★","title":"试分析鲁迅《故事新编》的艺术特色","body":"《故事新编》收录了鲁迅从1922年至1935年所作的8篇历史小说，主要以神话为题材，想象丰富，是一部“神话，传说及史实的演义”的总集。这部作品的艺术特色，主要表现在以下方面：\n\n一、打破时、空界限，采取了“古今杂糅”的“油滑”手法\n\n《故事新编》有意打破时、空界限，采取了“古今杂糅”的手法：小说中除主要人物大都有典籍记载的根据外，还创造了一些次要的喜剧性的穿插人物，他们的言行中，加入了大量的现代语言、情节与细节，如《理水》“文化山”上的许多学者既以古人身份出现，又开口“OK”，闭口“莎士比亚”，显然将古与今熔为一炉。\n\n中国传统戏剧里的“丑角”在插科打诨中，经常突然脱离剧中的身份与剧情，用现代语言作自由发挥，以“油滑”的姿\n\n态对现实进行揭露或嘲讽。鲁迅显然于此有所借鉴，也称自己创造的“古今杂糅”的手法为“油滑”。他的目的是要在古今相通之中，以现代照亮古代，更有力地揭示古代人与事中某些被掩盖了的真相。人们从戏谑化的描写中，看到了鲁迅杂文的锋芒：包括杂文的眼光，思维，手法，以至语言。在这个意义上，《故事新编》又是鲁迅打破文体界限，以杂文入小说的一次有益的尝试。\n\n二、“庄严”与“荒诞”两种色彩与语调（旋律），互相补充、渗透与消解\n\n在《故事新编》许多篇什中，都可以发现或显或隐，或浓或淡地存在着“庄严”与“荒诞”两种色彩与语调（旋律），互相补充、渗透与消解。这里存在着一个小说结构的模式：小说前、后部（或尾端）的对立（对比），以及后部对前部的翻转与颠覆。\n\n如《铸剑》的前半部是一个悲壮、崇高的复仇的故事，小说结尾复仇完成“以后”，也出现了“万民观瞻”的“狂欢节”场面。尽管鲁迅在感情上始终倾心于复仇，但他仍以怀疑的眼光，将在看客面前，复仇必然的无效、无意义揭示给人们看。\n\n三、从容、充裕、幽默与洒脱的风格\n\n《故事新编》8篇中有5篇写于鲁迅生命的最后时期。鲁迅面临死亡的威胁，处于内外交困、身心交瘁之中，《故事新编》的总体风格却显示出从未有过的从容、充裕、幽默与洒脱，尽管骨子里仍藏着鲁迅固有的悲凉，却出之以诙谐的“游戏笔墨”，充满“鲁迅特色”的嬉笑怒骂、鞭辟入里、旁逸斜出的可笑笔触俯拾皆是。比如《理水》中对文化山上的学者们吃饱睡足之后压倒涛声的学说和用以向下民收取榆叶和水苔的所谓精密考据的反讽式描述，实可谓妙趣横生的“自我暴露”。这表明鲁迅的思想与艺术都达到了一个新的境界，具有某种超前性。","keywords":"打破时、空界限 古今杂糅 油滑“庄严”与“荒诞”补充、渗透、消解 从容、充裕、幽默、洒脱","note":""},{"id":"19","stars":"★★★★","title":"试分析《故事新编》的文体模式及其开拓性","body":"《故事新编》作为一种新型的历史小说，在文体史上具有超前性、开拓性的贡献，开创了一种不仅适用于当时，同时也适用于现在和未来的文体模式。\n\n一、《故事新编》的文体模式\n\n关于历史小说的文体模式，按照鲁迅在《故事新编》序中的概括，无非是这样两类：一是“博考文献，言必有据”；-是“只取一点因由，随意点染，铺成一篇”。这两种模式一直源远流长地贯穿于历史小说发展的始终，成为历史小说发展史上两大最主要、最基本的传统经典范式。而《故事新编》则不然，其小说中的本事虽取材于神话、传说、寓言、历史一类典籍，但具体艺术描写则破天荒地采用古今杂糅、幻实交混、喜剧性穿插以及滑稽戏拟等打破陈规的叙事方式。它有意让不合理的节外生枝，打破艺术形象和情节的正常发展，以引起了整体构思逻辑的断裂，显示其与实际生活的失调和不合理。\n\n从艺术接受的角度看，《故事新编》打破读者关于历史真实的阅读幻觉，唤起读者对于作品题材的理性反省，促使人们建立起对于小说主人公的全新审视眼光，而不是仅仅把它们当作普通的历史故事去接受。这无疑是所谓的“陌生化”艺术思维原则最生动的体现，它也是鲁迅之前历史小说创作中从未出现的新现象。\n\n二、《故事新编》文体模式的开拓性\n\n鲁迅是在参考西方历史文学文体模式的同时，根据自己的历史观、思维观、审美观、文体观，将其孵化为一种新的形态，并在这种形态在西方历史文学中还处于尝试阶段时，大胆地把它引入小说创作领域，并在如下方面完成了对历史小说的开拓：\n\n（一）抽象、整体、综合的思维观\n\n从思维观来看，当其他历史小说家还专注于某一段历史事实，包括当时的社会形态、生活事件、历史细节，当他们对历史采取一种段落式、断层式的具体展示时，鲁迅却用一种抽象、整体、综合的眼光来审视中国的历史和文化。这使他的作品有别于现实主义题材真实的再现，也不同于浪漫主义构筑的激情澎湃的理想家园，而总体上呈现出一种理性、立体、充满哲理概括和广义象征的现代风格。\n\n（二）立足于历史、文化批判的历史观\n\n一般的历史小说立足于对历史的认同而展开创作，所以他们的作品呈现出连贯的逻辑性、合理性，读者用固有的思维方式就可以解读。而鲁迅则是立足于对历史、文化的批判来展开创作的，因此他笔下的画面多表现出怪诞、夸张、荒谬、滑稽\n\n的特质。鲁迅以大方无隅、大象无形的艺术气度，巧妙地将直叙与反讽、写实与夸张、严肃与油滑、最纯粹的历史生活与最不可思议的现实幻境融为一体。\n\n（三）幽默、讽刺的叙述风格\n\n就叙述风格来看，《故事新编》弥散着充满“鲁迅特色”的嬉笑怒骂，鞭辟入里、旁逸斜出的可笑笔触俯拾皆是。比如《理水》中对文化山上的学者们吃饱睡足之后压倒涛声的学说和用以向下民收取榆叶和水苔的所谓精密考据的反讽式描述，实可谓妙趣横生的“自我暴露”；而学者和灾民代表向视察大员陈述灾情的一段描写则采用了“直接矛盾式反讽”；在叙述水利局的官员欣赏采集来的民食的情况时，又用了佯装天真无知的笔法。这些亦庄亦谐的描写，不禁使人自然地将其与鲁迅的杂文风格联系在一起。从这个意义上说，“故事新编”是最适合鲁迅的，甚至是独属于鲁迅的，它也是不可模仿的。作为一种文体模式，它既是充分现代性的，又是极具个性化的，是现代性文体模式在具有个性化的作家身上的寄植。","keywords":"文体模式 本事取材于典籍 打破陈规的叙事方式 构思逻辑的断裂“陌生化”艺术思维原则 开拓性 抽象、整体、综合的思维观 立足历史、文化批判 幽默、讽刺","note":"在文体美学的探讨上，《故事新编》历来被研究者称为“新历史小说”。它借由古人古事进行的独异叙述表现，展示了鲁迅小说创作世界中的历史魅力的一面。除了“新历史小说”之外，有研究者还提出了一种“故事新编体”小说的观点，这是将该文本定义为一种独特的文体，对其形式特点进行审美的观照。具体观点可以参考相关文献，代表性的成果有汤哲声的《＜故事新编）与“故事新编体”小说》，朱崇科的《张力的狂欢-论鲁迅及其来者之故事新编小说中的主体介入》等。"},{"id":"20","stars":"★★★★★","title":"试分析鲁迅小说的思想内容","body":"中国现代小说在鲁迅手中开始，又在鲁迅手中成熟。鲁迅的小说创作，不仅取得了极高的艺术成就，而且蕴涵着丰富的思想内容，具体表现在以下方面：\n\n一、揭露和批判封建礼教文化的虚伪与罪恶，表现启蒙民众的重要性和紧迫性\n\n维护封建宗法制度的一整套旧的虐杀人性的伦理道德桎梏了整个民族的生机和活力，致使国家孱弱、民族危亡。所以当时新文化运动的先驱们怀着救国救民的强烈的历史使命感和社会责任感，把批判封建礼教作为当务之急。鲁迅就是率先用小说的形象化方式，“暴露家族制度和礼教的弊害”，批判封建旧文化对人们精神的戕害和虐杀，表现启蒙民众的重要性和紧迫性。如《狂人日记》借鉴俄国作家果戈理同名小说的艺术形式，把自己的医学知识和对历史的思考融于一体，借助一个患“迫害狂”病人表面上疑神疑鬼的不正常心理，揭露封建礼教“吃人”的本质。\n\n二、对落后的国民性的揭露与批判\n\n早在日本弘文学院学习时，鲁迅就已经开始思考关于改造中国人落后的国民性的问题。在他的杂文中对落后的国民性多有剖析和批判，他把不敢正视现实的“瞒和骗”，缺乏恻隐之心的麻木的“看客”心理，不顾本质、只要“面子”的虚荣心理视为必须加以改造的落后的国民性的主要内容。鲁迅也用小说这一形象化的方式对落后的国民性进行揭露与批判。而对落后国民性进行揭露与批判的作品中，又以《阿Q正传》为典型代表。在小说中，鲁迅是怀着“哀其不幸，怒其不争”的悲愤之情塑造了阿Q这个几乎集国民性弱点于一身的艺术典型，写出了“一个现代的我们国人的魂灵”，淋漓尽致地揭示和暴露国人的国民性弱点，从而达到“揭出病苦，引起疗救的注意”的目的。\n\n三、揭露和批判农民性格弱点以及造成这种弱点的社会根源\n\n鲁迅对中国农民的命运是深切同情的，能看到农民所遭遇的苦难，也能洞察他们的弱点与病态，当然也更理解造成他们精神上病弱的社会原因和历史原因。\n\n在创作中，一方面，鲁迅把中国农民放在中国农村社会各种现实关系（经济、政治，尤其是文化心理和意识结构等）中加以再现，从而展现了辛亥革命时期未经彻底变革的农村的落后和闭塞的典型环境；另一方面，鲁迅着力塑造在这样一个典型环境中生存、挣扎的中国农民的典型性格，把解剖灵魂和改造“国民性”问题联系起来，从而通过对农民性格中的愚弱、麻木和落后的批判，导向对造成这种性格的社会根源的揭露和批判。在这方面，《阿Q正传》堪称代表，其他如《药》《风波》《故乡》等也是如此。\n\n四、关注妇女命运\n\n在鲁迅的农民题材小说中，《明天》《祝福》《离婚》等是以反映农村妇女命运为内容的作品，在这些作品中，鲁迅对传统社会中妇女的命运寄予深切的同情，更揭示了造成她们悲剧命运的精神的与制度的原因。《明天》中，单四嫂子的不幸\n\n不仅在寡妇丧子，更重要的是她周围的人对于受苦人的冷漠以及她处在这样的氛围中不得不承受的精神上的孤独和空虚。《祝福》通过祥林嫂的悲剧命运，一方面批判了造成其悲剧的传统宗法与礼教绳索编织成的严密的网，另一方面也把谴责的笔指向了祥林嫂周围的一大群麻木的群众，他们和祥林嫂同属受压迫剥削的劳动者，然而偏偏又是他们维护着三纲五常，并用统治阶级的观念审视、责备、折磨着祥林嫂。\n\n五、揭示知识分子精神悲剧，解剖自我精神危机\n\n鲁迅有大量以知识分子为题材的小说，有以深受封建科举制度毒害的下层知识分子为主人公的《孔乙己》和《白光》，有以封建卫道士为讽刺对象的《高老夫子》和《肥皂》。但鲁迅着力描写，并倾注了更多艺术心血的，是那些在寻找出路，彷徨、苦闷与求索的知识分子，他们是一些具有一定现代意识，首先觉醒，然而又从前进道路上败退下来，带有浓重的悲剧色彩的人物，如《在酒楼上》中的吕纬甫、《孤独者》中的魏连殳、《伤逝》中的子君与涓生，鲁迅着重揭示他们的精神悲剧，也深刻剖析自我的精神危机。\n\n六、对人性美的发掘与礼赞\n\n作为一个启蒙主义作家，鲁迅的小说主要是对封建旧文化的批判，对国民性病根的剖析和对社会问题的思考，此外，鲁迅也有一些作品是对儿时生活的温馨美好的回忆，对亲情人性的发掘与礼赞。《社戏》回忆自己小时候随母亲到外婆家住的温馨快乐的生活，村中的大人都淳朴善良。作品字里行间充溢着诗情画意和浓浓的亲情、友情。《鸭的喜剧》是写俄国盲诗人爱罗先珂的一篇带有纪实性的小说。虽然在作品中由动物的弱肉强食影射了社会的矛盾与竞争，但也表现了爱罗先珂对世界充满爱心的那种博大的爱。\n\n七、用现代人的情思去触摸历史，表现自己独特的人生体验与思考\n\n《故事新编》中的小说多是以现代人的情思去触摸历史，借以表现作者自己独特的人生体验及对社会、人生等问题的认识和思考。如《奔月》就是以“后羿射日”和“嫦娥奔月”的神话传说来构思的一篇小说。这里，鲁迅一反传统的英雄美人式的写法，把传说中的英雄平民化和世俗化。后羿的英雄落寞情状，与“五四”落潮后鲁迅的心态十分接近。在《奔月》中他借英雄无用武之地的后羿来表现自己的生活体验和落寞的心态。同时，小说暗含着作者对自己婚姻问题的思考。","keywords":"封建礼教文化 落后的国民性 农民性格弱点 社会根源 妇女命运 知识分子精神悲剧 自我精神危机 人性美人生体验与思考","note":"鲁迅小说的思想内涵是非常丰富的，其中既有对社会方面问题的思考，也有对精神层面内容的解剖。大家需要注意的是，具体考查中可能会出现“鲁迅小说的思想内容”和“《呐喊》《彷徨》的思想内容”两种提问方式，如果是后者的话，大家只要回答前六点就可以了，要注意灵活应对。"},{"id":"21","stars":"★★★★★","title":"以《呐喊》《彷徨》中的作品为例，谈谈鲁迅小说的形式贡献","body":"【答题框架】\n\n鲁迅的小说在艺术上的贡献与其在思想上的贡献同样伟大。鲁迅完成了从中国古典小说艺术到现代小说艺术的根本转变。他的小说创作，成了中国现代白话小说艺术的第一个伟大的里程碑，开创了中国小说艺术的一个崭新的时代。鲁迅小说对于小说形式的贡献，主要表现在以下方面：\n\n一、对小说结构形式进行了革新与创造\n\n鲁迅小说在摸索中国人的灵魂、表现中国人的精神面貌特征的大前提下首先打破了古典小说的故事性框架，开始根据小说题材的独立需要更自由地选择叙事角度和叙事方式，对中国古典小说的结构形式进行了大胆的革新与创造。\n\n（一）从小说矛盾的性质而言，鲁迅极少将一个人与另一个人的单纯的利害冲突作为小说矛盾的主线，更多的是描写一个人与整个社会环境的特定关系，将个人与社会的矛盾上升为小说的主要矛盾，使故事性的框架被社会状态和人的命运的展现所代替。\n\n（二）从叙述角度而言，鲁迅小说中有第三人称的小说，如《药》《明天》《肥皂》《离婚》等，有第一人称的小说如《狂人日记》《孔乙己》《故乡》《孤独者》《伤逝》等；有把第一人称同第三人称有机地结合在一起的小说，如《祝福》（开头结尾用第一人称，主体部分用的则是第三人称）。在第一人称的小说中，有的只有一个确定的视点，如《孔乙己》《故乡》《伤逝》等；有的则交错使用两个不同的视点，如《狂人日记》《头发的故事》《在酒楼上》《孤独者》等。\n\n（三）从时序安排上来看，鲁迅小说中有以时间先后组织情节的顺叙，如《药》《阿Q正传》《离婚》等，但也常用倒叙的方式改变固有的时序关系，如《头发的故事》《祝福》《伤逝》等。\n\n（四）从时空关系而言，鲁迅小说较之中国古典小说更重视在空间上的横向拓展。横面切割的方式在鲁迅小说中已成为经常运用的主要方式。《示众》只是一个场景的描绘，展示的是现实生活的一个横断面。《风波》也主要是一个生活场景后面仅将后事略作补叙。《药》则是先后几个场景的组合，像戏剧中的几幕。即使像《阿Q正传》这类在时间的纵向推进上较迅速的小说，鲁迅也随时加进一些横断面上的场景描写。\n\n鲁迅小说虽然数量不多，但其文体形式却万象纷呈，各自不同，从而使中国小说从固有的故事框架中彻底解放出来，奠定了中国现代小说多样化发展的基础。\n\n二、表现手法的开拓与创新\n\n鲁迅小说在表现手法上的新的开拓也是极为引人注目的。在鲁迅小说中，古典小说已经具有的心理描写、肖像描写、语言行动描写、景物描写、环境描写等表现手法获得了新的发展，所有这些表现手法都在挖掘人的灵魂的总目的下具有了新的特色，而心理描写则受到了前所未有的重视。《伤逝》几乎全篇都是涓生心理变迁过程的描写，抒情、叙事与人物心理描写融会成了一个统一的整体。除了上述表现手法，鲁迅还广泛运用了象征、意识流、精神分析等纯属现代形式的表现手法。《药》《长明灯》等广泛地运用了象征主义的表现手法，使大量现实的描绘同时具有了象征性的意义。《狂人日记》则带有现代意识流小说的特征，“狂人”非理性的心理变化过程实际上也就是他的意识流动过程。《肥皂》《高老夫子》《弟兄》的表现重心则是揭示主人公的潜意识心理动机。\n\n三、创立了白话小说语言的典范\n\n当新文学初创期的白话文学语言尚处于稚嫩的尝试中，鲁迅的《狂人日记》等小说一出现，就以精确省净的现代白话语言，创立了成熟、完美并具有鲜明个人风格的文学语言世界，为白话小说写作树立了典范。其精确，体现在语法结构上对西方文学语言的借鉴，鲁迅以长期翻译外国小说的语言经验，在语法结构上吸取外语语法的精确性，潜在地改造了中国现代白话文学语言的内在构造；其省净，则吸取了传统文言、日常口语甚至中国传统艺术的某些长处。鲁迅小说塑造人物笔墨省净，又能入木三分，写人状物多用白描与“画眼睛”法，继承了中国艺术重在写意传神的传统，“极省俭的画出一个人的特点”“显示灵魂的深”。","keywords":"小说结构形式 革新与创造 小说矛盾的性质 叙述角度 时序安排 时空关系 表现手法 开拓与创新 白话小说语言的典范","note":"鲁迅小说的形式贡献，某种程度上可以归纳为“格式的特别”，我们完全可以使用相关内容进行作答。不过，钱理群版《中国现代文学三十年》对于这部分的讨论未免有些晦涩，所以这里以北师大版《中国现代文学史》为基准为大家重新总结归纳了一下这部分内容，大家可以将两部分内容结合起来理解记忆。"},{"id":"22","stars":"★★★★★","title":"谈谈你对鲁迅笔下知识分子形象的认识（25湖南大学）","body":"【答题框架】\n\n鲁迅有大量以知识分子为题材的小说，是中国文学史上以巨大悲悯与严正态度描写知识分子的第一人，着重揭示他们的精神悲剧，也深刻剖析自我的精神危机。\n\n一、鲁迅笔下知识分子形象的类型\n\n鲁迅笔下的知识分子形象主要有两种类型。\n\n（一）“无行”“无文”的传统文人\n\n鲁迅笔下的第一类知识分子是作者虽然寄予同情但基本表示否定的孔乙己、陈士成那样被科举制度哄骗一生的“科场鬼”，鲁四老爷和四铭等假道学，方玄卓和高干亭等酸腐的新式文人。这些知识分子严格说来只是传统的文人，多半如鲁迅杂文所讽刺的，不仅“无行”，而且“无文”。孔乙己和陈士成固然是科举制度的牺牲品，但他们又何曾具备真才实学？鲁四老爷书房里的对联是“事理通达心气和平”，案头所陈也皆理学名著，立身行事却难与之相符。高干亭景仰俄国文豪高尔基而改名高尔础，不解中俄姓名之别倒也罢了，即使赴女子学校执教，却只为了“去看看女学生”。\n\n（二）真正现代的知识分子\n\n鲁迅笔下的第二类知识分子是吕纬甫、魏连殳、涓生、夏瑜、N先生那样的“狂人”，他们是“梦醒之后无路可走”的现代中国最痛苦的灵魂，是真正现代的知识分子，接受了现代科学思想和价值观念，关心他人利益，关心社会前途，具有强烈的自我意识，备受困馁，历尽迷惘，仍坚持不懈地追求生存的意义。\n\n鲁迅塑造现代知识分子形象，是想认清自己和同类，以此挣脱往往由知识分子自造的精神牢笼，杀出一条生存的血路来。鲁迅在他们身上往往寄寓着自己的思想感受，不仅写了他们曾经有过的真诚和希望，也写到他们后来的失望、愤激、彷徨、忏悔、落伍、颓败、沉沦，并在极度黯淡和压抑的情绪低谷中积蓄力量，探寻出路。人物与隐含作者，是鲁迅塑造的现代中国知识分子形象不可分割的两面。\n\n二、鲁迅关注知识分子的原因\n\n（一）社会原因\n\n在鲁迅进行小说创作的前前后后，中国社会正经历着巨大的变动。资产阶级领导的旧民主主义革命的发展，导致了清王朝的覆亡。两千多年的封建帝制转眼间成为过去，人们被压抑的沉重心情很自然地感到一时的放松。但是，资产阶级革命由于没有触动旧社会的根基，原有的社会问题并没有解决。孔乙己们的悲剧命运在辛亥革命之后毕竟并未成为过去，相反，还是当时社会生活中较为普遍的现象。吕纬甫和魏连殳的生活就更说明辛亥革命之后的问题。\n\n正因此，知识分子就从一个特殊的角度提出了社会问题，他们的生活状况也成为一面反映社会的镜子，可以照见社会的某些本质。\n\n（二）思想原因\n\n应该指出，鲁迅十分重视知识分子问题，和他当时的思想也是分不开的。他在日本留学时期，就有感于国人的愚昧和麻木，主张用文艺为武器改变国民的精神。他希望有志之士能够奋起，改变中国的落后状况。由于历史的原因，也由于鲁迅当时对劳苦大众力量估计不足，他很自然地对知识分子比较重视，对不同类型的知识分子从各方面加以研究，加以考察，探索他们成为“精神界之战士”的可能性。\n\n通过实际考察，鲁迅感到有些失望，因为他发现知识分子也有各种不同的情况；由于他们有着不同程度的弱点和缺点，希望他们成为精神界之战士井不那样简单。但是他终于更深刻地认识了知识分子的社会地位和历史地位，认识了他们在阶级社会中的处境和可能发生的作用。\n\n三、鲁迅对知识分子的态度\n\n（一）批判作为封建社会制度代表的传统知识分子\n\n毫无疑问，鲁迅对赵太爷、假洋鬼子、赵七爷、丁举人以至鲁四老爷、高老夫子、四铭这些人，是毫不留情地给予揭露和批判的，因为正是他们代表了吃人的社会制度。\n\n（二）同情下层传统知识分子和现代知识分子\n\n对于涓生、子君、吕纬甫、魏连殳以至孔乙己等知识分子，鲁迅以他们作为小说的主人公，正像选中了阿Q、闰土、祥林嫂、七斤等贫苦农民一样，虽然对他们也有批评，但更多的还是同情。即便是对待孔乙己、陈士成这样一类思想毛病比较严重的知识分子，鲁迅在深刻批评他们的同时，也不掩饰自己对他们的遭遇的同情，愤怒地控诉毒害和葬送他们的黑暗制度，替他们大声地喊出了“封建礼教吃人”。\n\n纵观鲁迅写知识分子的作品，他对知识分子的弱点和缺点确有所揭露，批评他们，正是出于同情，是希望他们克服这些弱点和缺点，以便更好地担当起历史赋于他们的使命。正因此，他在小说中写知识分子的缺点，既没有偏袒，也没有夸大，态度上也不是冷嘲热讽，而是把这些弱点和缺点放在适当的位置，本着爱护的精神，分析缺点的影响、危害及其历史根源，并且着重通过表现知识分子的不幸，来解剖他们生活的环境-“病态社会”，使人们对这个罪恶的渊薮有一个清醒的认识。\n\n四、鲁迅笔下知识分子形象的社会意义\n\n鲁迅小说中的知识分子形象都刻画得深刻生动，有相当的典型性。他们都表现了巨大的社会意义。\n\n（一）反映了新旧民主革命交接时期的中国社会\n\n一个人的思想、感情与其生活的环境有着密切的关系：他的遭遇和命运必然反映他所处的社会和时代。鲁迅小说中的知识分子，从孔乙己、吕纬甫、魏连殳到子君、涓生，他们的悲欢离合，他们的喜怒哀乐，都不是无缘无故的，而是深深带着辛亥革命前后到五四运动时期中国社会的印痕。\n\n许许多多的孔乙己们是辛亥革命前后中国社会的产物，从他们可以照见当时社会生活的情形。吕纬甫和魏连殳更是如此，他们思想性格中新与旧的矛盾，反抗与失败的痛苦，正好是当时社会现实的生动写照。毫不夸张地说，读鲁迅的这些作品，可以帮助我们进一步了解近代中国的历史，认识新旧民主革命交接时期的中国社会。\n\n（二）反映了封建专制对知识分子的戕害\n\n鲁迅这些知识分子题材的作品告诉读者，不容知识分子的社会是没落的社会，折磨和摧残知识分子最厉害的是封建专制。\n\n封建社会为了维持其统治，对生产力最活跃的部分-人，特别是知识分子，采取各种各样的压制手段，把他们变成封建阶级的分子或奴才-对大多数知识分子实行严厉的思想统制，在精神上倍加摧残和打击，在生活上把他们逼向绝路。因此，在封建专制统治下知识分子即脑力劳动者几乎不可能有正常的生活。\n\n鲁迅当时写小说，着意刻画知识分子形象，表现他们的不幸遭遇和苦难生活，是否也作过这样的分析，今日不敢断言，但从他当时对封建社会的憎恶和深刻认识，从他反对封建专制的斗争精神看，他是不可能不认识到这一点的。而作为清醒的现实主义作家，他更是通过人物形象真实地反映了这一点。\n\n（三）揭示了当时知识分子的软弱与局限性\n\n魏连殳、涓生、吕纬甫等进行反抗的思想基础是个性主义。魏连殳“亲手造了独头茧，将自己裹在里面了”，涓生和子君以个性解放为思想武器争取爱的权利，以建立爱的小家庭为目标进行斗争，忽视了小家庭以外的广阔天地。\n\n这些觉醒者在强大的旧势力压迫下，表现出自私卑怯、动摇妥协、消沉颓废、改变初衷，这既是小资产阶级的性格弱点，&#x4E5F;和个性主义有关。涓生在爱的小舟遭到社会的黑风恶浪时，认为最重要的是救出自己，视子君为累赘，终于遗弃子君而造成悲剧。吕纬甫由从前的敏捷精悍认真变成现在的“敷敷衍衍，模模糊糊”，由从前的反封建变为现在的讲授“子曰诗云”。\n\n魏连殳以躬行所恶来报复社会、世俗的压迫、冷遇，却陷入更深的精神孤独和痛苦的境地，以自戕式的毁灭宣告了自己的失败。\n\n【李凡关键&#x8BCD;：类型“无行”“无文”的传统文人 现代知识分子 关注原因 社会原因 照见社会本质 思想原因 认识知识分子地位态度批判封建社会制度代表 同情下层传统知识分子和现代知识分子 社会意义 反映社会反映封建专制戕害 揭示软弱与局限性】\n\n【李凡&#x8BF4;：鲁迅可以说是现当代文学史上知识分子题材作品的开创者，并由此形成了一个文学传统，直到当下仍有着重要的影响，许多学校也会专门针对这一题材的发展出题，故此相关内容我们要重点关注。鲁迅塑造的这些知识分子形象，反映了当时的社会状况，揭露了封建专制对知识分子的戕害，同时暴露了知识分子自身的弱点和局限性，具有重要意义。相关内容可以参考张恩和《论鲁迅小说中的知识分子形象》，相关资料可以在李凡文学正版群中领取。】","keywords":"","note":""},{"id":"23","stars":"★★★★★","title":"试分析鲁迅农民题材小说创作","body":"在《呐喊》《彷徨》中，农民题材的小说占有重要的位置。鲁迅对中国农民的命运是深切同情的，能看到农民所遭遇的苦难，也洞察他们的弱点与病态，当然也更理解造成他们精神上病弱的社会原因和历史原因。\n\n一、创作目的\n\n鲁迅曾多处谈到自己最初的创作动机，他称自己的创作是“遵命文学”，他希望以自己的“呐喊”“慰藉那在寂寞里奔驰的勇士，使他不惮于前驱”。\n\n在鲁迅关于农民题材的小说中，虽然并没有像《狂人日记》《长明灯》那样可以称之为“中锋”突破、正面“呐喊”的作品，它们大都以深刻的揭露见长。但揭露是为了认识，为了改造，暴露病根是为了“催人留心，设法加以疗治”。并非为了使人威慑于这黑暗和重压，从而消沉绝望。鲁迅以自己的创作，唤醒了“铁”中昏睡的人群，激起了他们斗争变革的信心。鲁迅所表明的是这样一个思想认识：中国必须有一场深刻而广泛的思想革命，这个革命的主要任务是清除以农民为主体的广大社会群众中根深蒂固的专制势力的影响。\n\n二、创作背景\n\n鲁迅的最初“呐喊”开始在这样的历史条件下：\n\n（一）中国革命进入一个由旧民主主义革命到新民主主义革命的历史性的转折时期。十月革命的胜利，使中国人民看到了“新世纪的光”。\n\n（二）虽然曙光在昭示激励着人们，但古老中国数干年封建专制统治的重压依然存在，风雨如磐，黑暗重重。封建意识的顽固，辛亥革命的失败，广大农民的愚昧麻木......诸多的问题亟待人们去思考去解答，鲁迅便成为文学方面最光辉的代表。\n\n三、创作方法\n\n（一）将农民放在农村社会现实中加以再现\n\n鲁迅把中国农民放在中国农村社会各种现实关系（经济、政治，尤其是文化心理和意识结构等）中加以再现，从而展现了一个辛亥革命时期未经彻底变革的农村的落后和闭塞的典型环境。\n\n（二）着力塑造中国农民典型性格\n\n鲁迅着力塑造在二三十年代农村这样一个典型环境中生存、挣扎的中国农民的典型性格，把解剖灵魂和改造“国民性”问题联系起来，从而通过对农民性格中的愚弱、麻木和落后的批判，导向对造成这种性格的社会根源的揭露和批判。在这方面，《阿Q正传》堪称代表，其他如《药》《风波》《故乡》等也是如此。\n\n（三）白描手法\n\n白描本是指中国绘画中用粗线条勾勒、不着颜色、重在凸显所画对象的特征神韵的一种技法。白描手法移用到文学创作上，则指不事雕饰、不加烘托、抓住描写对象的特征，简洁明了地勾勒出人物、事物与景物的情态面貌。鲁迅的农民题材小说吸纳了白描这一传统文学中常用的写作技巧，简洁精炼地描写人物勾画场景，叙述情节，看似平淡却情味浓厚。\n\n（四）开掘人物的内心世界和个性特征\n\n鲁迅农民题材的小说在塑造人物时特别注意挖掘和表现人物的内心世界与精神状态，写出的形象具有勾魂摄魄的力量。他强调写人物要“画眼睛”，写人物要传神，要达到画龙点晴的效果，要选择人物最典型的言行神态来揭示和表现他的内心世界和精神状态，从而凸显人物的个性特征。\n\n四、创作成就\n\n鲁迅是农民题材小说这一领域的开拓者。他的这种历史地位，是由他自己的创作实践决定的。鲁迅开拓者的地位，大体是由以下两个方面确立的；\n\n（一）较早重视农民题材\n\n在鲁迅之前，虽然已有少数作家，少量的作品反映了农村的苦难生活。然而这样的作品，不仅在作家本人的创作史上不占重要地位，而且在当时以至后来一段时间，都未能形成一种主潮。鲁迅清醒地异乎寻常地把自己的注意力引向为别人所忽视的领域，以最大的兴趣和最深刻的思索关注农民问题。正当大多数新文学工作者“感觉的范围颇为狭窄，不免咀嚼着身边小小的悲欢，而且就看这小悲欢为全世界”的时候，鲁迅一反流俗，把自己笔触伸向农民题材这一领域，不能不显得可贵。\n\n（二）对农民题材开掘至深\n\n鲁迅是以文学家思想家的身份去思索去表现农民问题。他通过对落后农民病态精神的暴露，进而跨向对病态社会的解剖。像中年闰土的迷信麻木，祥林嫂对鬼神、对由于改嫁而死后“分尸”的畏惧，以及阿Q的思想“样样含于圣经贤传”的描写，无不揭示出传统的封建意识对农民精神的虐杀。鲁迅以不凡的手笔，成功地塑造了这被虐杀了精神的苦难的农民的形象，阿Q、祥林嫂、闰土等等。这些形象以它巨大的思想容量，供人们去思索去认识。","keywords":"创作目的 思想革命 清除专制势力影响 创作背景 革命历史转折期 封建专制统治的重压 创作方法 放在现实中再现 农民典型性格 白描手法 内心世界 个性特征 创作成就 较早重视农民题材 对农民题材开掘至深","note":"鲁迅的农民题材小说创作是鲁迅小说创作中非常重要的一部分内容，整体成就非常高，我们要特别重视。大家可以从创作的目的、背景、方法和成就四个方面进行分析。需要注意的是，鲁迅农民题材的小说创作很少会单独考查，而是经常与其他作家尤其是赵树理的农民题材小说作品放在一起进行比较，大家也可以从这四个方面加以分析对比。相关内容可以参考陈继会《新文学史上农村题材的两位开拓者-略论赵树理与鲁迅》，具体资料可以在李凡文学正版群中领取。"},{"id":"24","stars":"★★★★","title":"试分析鲁迅小说中的女性形象","body":"鲁迅先生是塑造女性形象的能手，他的笔下，祥林嫂、子君、爱姑等都栩栩如生，各具风采。纵使近百年过去，他笔下的女性形象，却依然生机勃发，哀宛动人。\n\n一、鲁迅小说中女性形象的特征\n\n（一）女性形象各具特色，从各种角度和层次揭示出了中国妇女的悲惨命运\n\n鲁迅笔下不多的女性形象，却有不同的特色：有少女、有少妇、有寡妇；有农村妇女，有知识分子；有遵守妇道的旧式女子，也有具有民主思想的新女性；有为人民解放而献身的女英雄，也有含冤而死的女鬼魂......各种类型的女性形象，从各个角度组成了一个色彩斑斓的女性世界，也是二十世纪初期旧中国的一个缩影。\n\n这些女性在专制制度下哭泣、流血、呻吟；她们任人出卖、宰割，被吞噬；她们挣扎、斗争、失败、死亡。鲁迅以悲愤的笔触，从各种角度和层次揭示出中国妇女的悲惨命运，为之发出震聋发聩的呐喊，希望彻底推翻吃人的礼教，让女性不再悲叹和呻吟。\n\n（二）多是社会底层的劳动妇女和农村女性\n\n鲁迅更多注意到的是代表着社会底层的劳动妇女和没有丝毫社会地位的农村女性，比如《明天》中的单四嫂子，《离婚中的爱姑，《祝福》中的祥林嫂，《故乡》中的杨二嫂，还有《风波》中七斤的女儿六斤，《药》中夏瑜的母亲和华小栓的母亲；当然还有个别的受过教育的所谓的知识女性，比如《伤逝》中的子君，但这是极少数。\n\n鲁迅从不幸的人群中提取素材，对社会底层生活和农村劳动父女表示深切关心。这些女性是丝毫没有接受过新文化，丝毫没有受到过现代教育影响的无知愚昧的女性。她们把一切生的意义全部寄托到丈夫、家庭和孩子的身上，严守封建伦理纲常，由于深受封建文化传统的负面影响而不知反抗，纵然反抗了，也是盲目的毫无意义的，因为传统力量是根深蒂固的。她们不得不从封建家庭中寻找一点点幸福。\n\n（三）没有独立的经济地位与社会地位\n\n鲁迅笔下的女性多从事家庭料理性质的长短工，不具有公共性，没有独立的经济地位，她们基本不参与公共事务，生产劳作很难得到社会认可。如《祝福》中祥林嫂在鲁四老爷家做短工，所有的生产资料只是一双劳作的手，没有经济权。\n\n鲁迅还塑造了叙事配角性质的纯家庭女性形象系列，她们放弃了参与社会生产与小范围公共事务的机会，完全依附男性。这些女性有三类：\n\n其一是完全不事生产劳作的老年女性，交往活动局限于家庭乡邻，显示了中国老年女性的生活常态，如九斤老太。\n\n其二是一些年轻女性，如七斤嫂子，只做些家务以及照顾孩子、婆婆，不需要承担生产重任，不参加社会公共事务。\n\n其三是可以控制一定的经济权却竭力维护男权中心的老年女性。如祥林嫂的婆婆，她处心积虑将祥林嫂卖给贺老六，只是为了小儿子的婚姻，也就是对男权中心家族的维护。\n\n二、鲁迅小说中女性形象的意义\n\n（一）揭露了封建统治阶级对女性的压迫\n\n鲁迅的小说中充满着对封建宗法制度和礼教观念欺压妇女的罪恶行径的激愤批判，正是封建统治阶级及其意识形态对妇女的压迫和奴役导致中国的女性几千年来一直处在生活的最底层，承受着从肉体到精神的无尽痛苦与磨难。鲁迅以激进的民主主义与深沉的人道主义观点，向封建主义对妇女的诬蔑与残害进行了无情鞭挞，表达了对历尽苦难，心灵蒙受巨创的中国妇女的深切同情。\n\n（二）表现了道德习俗对女性的奴役\n\n在儒家礼教的框架中，上下尊卑等级秩序森严，有贵贱，有大小，有上下。自己被人凌虐，但也可以凌虐别人；自己被人吃，但也可以吃别人。在这种吃人的礼教秩序中，无论是吃人者，还是被吃者，都在自觉维护礼教的秩序。在这样的社会环境中，决定女人命运与境地的是看她是否触犯和违背了大家公认的道德习俗，而整个社会对她违背道德习俗的具体原因和事后的主动救赎行为是置之不理的，不管她违背道德习俗是怎样的迫不得已和具有合理性。\n\n就如《祝福》中，社会在剥夺祥林嫂守寡的权力与自由的同时，却将祥林嫂不守寡的所有“罪责”都推到她身上，不允许她有任何辩驳与“救赎”的机会，一步步的夺走她自食其力的生存权，一步步的将她逼向死亡的境地。这无异于一场道德的谋杀。\n\n（三）反映了女性自身的异化\n\n恶势力的强大和礼教规范的根深蒂固，使旧时代具有反抗精神的妇女不能不陷于悲剧命运。鲁迅通过对小说中女性形象的塑造，不仅揭示了社会环境和意识形态是造成妇女凄苦与不幸、落后与短视的根源，同时又沉痛而优愤地揭出了妇女自身的种种精神弱点与思想局限，从而对妇女悲剧命运的挖掘比同时代人更深入一层。\n\n妇女自身的精神弱点与思想局限，突出地表现在她们大多数人心甘情愿地接受命运的安排，安于既得的奴隶地位。她们的心底里积淀了几千年封建文化传统的奴性意识，在不知不觉中总透露出一种谦卑而恭顺的奴性气质。《明天》中的四嫂，丧夫失子，饱尝了人世的酸辛，在孤苦无靠中苟且偷生，毫无人生欢乐可言，但她却毫无怨言，在对“明天”永远无望的企盼中平静地生活。她们的要求何其低，她们的愿望何等不足道，离“人的觉醒”“女性意识的觉醒”相差得何其太远。","keywords":"特征 各具特色 各种角度和层次 社会底层 劳动妇女 农村女性 没有独立的经济社会地位 意义 封建统治阶级压迫 道德习俗奴役 女性自身异化","note":"鲁迅小说中的女性形象虽然不算特别多，但却塑造得十分出彩。并且，当下对女性形象、女性写作的关注已经成为一种趋势，所以我们需要有所掌握。在考查中，这部分内容单独考查的可能性不高，但很可能和其他作家笔下的女性形象进行对比，大家要注意灵活应对。相关论文可以参考李徽昭《论鲁迅与莫言小说中的女性命运》、吴成年《论鲁迅小说中女性的三种生存困境》，具体资料可在李凡文学正版群中领取。"},{"id":"25","stars":"★★★★","title":"试分析外国文学对鲁迅小说创作的影响","body":"鲁迅小说创作的杰出成就和他对近代世界文学的卓越贡献，是同他长期接受外国文学的影响分不开的。外国文学对鲁迅的影响主要表现在以下方面：\n\n一、外国文学影响鲁迅的创作动机与题材选择\n\n（一）“为人生”的艺术主张\n\n鲁迅进行小说创作，主要是抱着“启蒙主义”，以为必须是“为人生”，而且要改良这人生。显然，他这是受到了外国文学的影响，尤其是果戈理描绘社会人生黑暗的写实主义影响。而正是从“启蒙主义”的文学观念出发，鲁迅的取材，多采自病态社会的不幸的人们中，意思是在揭出病苦，引起疗救的注意。而基于此，鲁迅开始了表现农民与知识分子两大现代文学的主要题材。\n\n（二）通过种种凉薄的世态揭露封建制度、封建观念是罪恶根源的主题\n\n鲁迅的选材，以及鲁迅前期创作中表现人与人之间冷酷淡漠的关系，特别是一些先觉者、改革者不为群众所理解的这一主题，一定程度上是从以暴露、批判为特点的俄国批判现实主义作家那里得到启发和借鉴。\n\n比如从主题、寓意和表现技巧上看，安特莱夫的《齿痛》和屠格涅夫的《工人与白手的人》可能都对《药》起了不同程度的借鉴作用。除《药》外，还有许多篇，如《狂人日记》《阿Q正传》《长明灯》《示众》《孤独者》等。这些作品都是通过种种凉薄的世态，从根本上揭露封建制度、封建观念是导致群众愚昧落后的罪恶根源，这些也可能从某些外国作品中受到启发。\n\n二、外国文学影响了鲁迅的艺术手法\n\n（一）复杂、详细的心理描写\n\n复杂、详细的心理描写在中国传统小说中是被排斥而缺失的，而在鲁迅的小说中则有许多大段、复杂的精彩心理描写，如《白光》中陈士成的变态心理、幻觉，《孤独者》《在酒楼上》中人物自我辩白的矛盾心理的描写等等。而所有这一切都是鲁迅学习、借鉴外国文学典范的结果。\n\n如安特莱夫的小说以心理描写技巧擅长，反映病态人物复杂的内心世界和潜意识活动。像鲁迅《白光》中陈士成的潜意识活动，《弟兄》中张沛君的梦境，都可能受有安特莱夫的某些影响。\n\n（二）象征手法\n\n安特莱夫大量运用象征手法，鲁迅称“其文神秘幽深，自成一家”，这也影响到了鲁迅。例如鲁迅《狂人日记》的“狂人”、《药》中的“人血馒头”所具有的现实和象征的双重含义，《阿Q正传》中“大团圆”结局对“饿狼眼睛”的描写，《免和猫》《鸭的喜剧》象征同类相残、弱肉强食，《长明灯》象征群众的传统观念和封建迷信意识，等等。甚至鲁迅小说的篇名、除前面所举者外，《明天》和《祝福》等篇名，从总体意义上、也同样具有现实和象征的双重含义。\n\n（三）悲喜交融的“含泪的微笑”手法\n\n果戈理作品的“含泪的微笑”的特点，很巧妙地把喜剧因素和悲剧因素融合在一起，用喜剧的形式写出悲剧的内涵。\n\n鲁迅用平常事和平常话深刻描绘“小人物”的“几乎无事的悲剧”；用片断的人物生活概括出整体的社会和人生，如《孔乙己》《药》《风波》《阿Q正传》等，都是将人物深沉的内在悲剧性蕴含在强烈的喜剧性之中，而将矛头直指整个封建社会制度和封建伦理道德观念，都具有和果戈理作品相类似的“含泪的微笑”的特点。\n\n（四）讽刺手法\n\n鲁迅小说中的讽刺手法，一方面是受到了果戈理作品的讽刺形象和反语技巧的运用的启发，另一方面则是受到了夏目漱石这些寓庄于谐，对日本明治维新以来的社会现实进行文明批评和社会批评，文笔“轻快洒脱，富于机智”的创作的影响。\n\n三、鲁迅借鉴西方小说形式，完成了中国现代小说形式的建立\n\n鲁迅完全自觉地借鉴西方小说形式，通过自己的转化、发挥，以及个人的独立创造，以建立起中国现代小说的新形式。\n\n如《狂人日记》在结构上打破了中国传统小说注重有头有尾、环环相扣的完整故事和依次展开情节的结构方式，而以13则“语颇错杂无伦次”，“间亦略具联络者”的不标年月的日记，按照狂人心理活动的流动来组织小说。这其中，日记体的形式受到了果戈里同名作品的影响，而以狂人心理活动的流动来组织小说，则受到了安特莱夫的影响。","keywords":"创作动机 题材选择“为人生”封建制度、封建观念是罪恶根源 艺术手法 心理描写 象征手法 含泪的微笑讽刺手法 现代小说形式建立","note":"鲁迅的小说创作很明显受到了外国文学的影响，这种影响渗透进了创作动机、题材选择、艺术手法和小说形式等多个方面，大家要结合具体作品进行掌握。在外国作家中，对鲁迅影响较大的主要是果戈里、安特莱夫等俄国作家，大家也可以从这些作家的创作特征出发，反过来记忆鲁迅的创作特征。相关内容可以参考温儒敏《外国文学对鲁迅＜狂人日记）的影响》、华忱之《在中外文化交融中的鲁迅创作-简论鲁迅作品对外国文学的借鉴》，具体资料可在李凡文学正版群中领取。"},{"id":"26","stars":"★★★★","title":"结合作品，论述鲁迅小说中的悲剧书写（25湖南师范大学）","body":"【答题框架】\n\n鲁迅以其短篇小说为中国新文学贡献了最初、最深沉的悲剧，其悲剧观念和美学特征都具有强烈的现代意义。可以说，鲁迅小说的悲剧是包涵了艺术、现实、哲学三重内涵的悲剧艺术。\n\n一、在艺术上打破“大团圆”模式\n\n鲁迅以短篇小说的形式写悲剧，首先面对的问题，必然是对“大团圆”形式的打破，而这个问题，也恰恰直接关系到思想与形式两个方面。\n\n正因为要“睁了眼看”，打破“瞒”和“骗”，鲁迅在自己的小说中“真诚地，深入地，大胆地看取人生并且写出他的血和肉来的时候”，非常明确地采用了悲剧的形式。因为显然，“大团圆”模式正是传统文学中的“瞒和骗的文艺”最常见也最有效的手段，它以“当场团圆”的方式解决冲突、消除悬念，表现出一种所谓“善恶皆自有报”的虚假肤浅的喜剧性效果，麻木了读者或观众的感觉，使之平息愤懑，获得安宁和满足。\n\n因此，在《阿Q正传》中，他甚至故意将阿Q被处死的最悲惨的末章取名为“大团圆”，就是为了给“大团圆”模式以一个极大的嘲讽。\n\n可以说，在鲁迅的小说中是决找不到一篇“大团圆”作品的。他以惨淡的甚至鲜血淋漓的事实打碎了一切对虚假肤浅结局的期待。这种手法的运用，决不仅仅是对苦难现实的还原和重现，更寄托了作者清醒冷峻的思想意识，其目的就在于让人们不仅直面、正视，乃至接受现实生活中的悲剧事实，同时更要返诸内心，在精神世界里对悲剧事实给予思考或质疑。因为只有如此，现实中的悲剧事实才能带来人的真正的精神觉醒，而不是无谓的悲戚和感伤。\n\n短篇的体制使得悲剧的出现不可能经过太多的铺陈，因此，作者必然或者直接截取悲剧发生的瞬间进行表现，或者着力于结尾部分的加重和深化，以实现悲剧效果的凸现。因此，鲁迅短篇小说的结尾往往直接体现着他打破“大团圆”的姿态，不仅在结尾处不如人意地让一切“团圆”的期待落空，甚而更在结尾处奏响悲剧的最强音，将全篇的力量积蓄于此，给读者以心灵的震撼。即如《狂人日记》那著名的结尾：\n\n没有吃过人的孩子，或者还有？\n\n枚救孩子······\n\n这是新文化运动中最初也最振聋发聩的一声“呐喊”：短短两行，既包含着颠覆“吃人”社会的强烈愿望，又表达出对于“新人”与“未来”的一点不无迟疑的希望，更以一声似呐喊又似悲叹的“救救孩子......”，发出了新文化历史上第一个清醒的“人”的声音，并由此奏响整个思想启蒙运动的序曲。\n\n二、在社会关怀上揭露“吃人”社会的现实\n\n鲁迅小说的悲剧主题首先来自他对中国历史与现实的清醒观察与深刻认识。在亲历或目睹了大量现实中的贫病、困窘、失败、罪恶甚至死亡之后，鲁迅将一种包含着肉体与精神双重含义的“毁灭”作为其小说最核心的主题，对此，他第一次采用了一个带有象征意味的隐喻：“吃人”。\n\n在鲁迅为数不多的小说中，以主人公的死亡为终结的篇章却有很多：比如《孔乙己》《药》《明天》《阿Q正传》《白光》《祝福》《孤独者》《伤逝》等，占其作品总数的近一半；而以人物精神上的溃败和被绞杀为结局的，就更几乎是其全部了。鲁迅通过朴素凝练的现实主义手法直接呈现了现实生活中悲惨的真实境况。那些辗转在生活重压之下最终不得不走向死灭道路的，不止是虔敬无辜的祥林嫂、挣扎无望的魏连殳、懵懂无知的华小栓......；那些生命的断送，以及他们当中某些在肉体死亡之前已先在精神上先自死灭的事实，无疑带有浓重的悲剧色彩。这种极端性的悲剧事实无需任何艺术的渲染、夸张和虚构，就足以产生令人震撼的艺术效果。\n\n鲁迅更为深刻的地方还在于：在他的认识当中，肉体的死亡并非最大的悲哀。因此，鲁迅小说的悲剧并未停留在死亡主题的描写，他更多关注的是精神世界的毁灭。同时，在创作手法上，他也并不满足于简单地重现客观事实，而是将毁灭的主题赋予精神上的象征意义。\n\n鲁迅曾说：“人生最苦痛的是梦醒了无路可以走。”因此，他笔下的现实悲剧不仅是易于言表的饥饿、病痛，更有难以言说的精神痛苦，其中最突出的，当属梦想在现实中的碰壁与溃败。无论是魏连殳、吕纬甫，还是《白光》中的陈士成、《伤逝》中的子君，甚至包括《端午节》中的方玄绰，显然都应归入这一类悲剧。他们都是无路可走的人，对于这种穷途的痛苦和精神的毁灭，鲁迅给予了高度的关切和理解。他描写这样的痛苦，目的在于让更多的人对此有所警觉和反抗。鲁迅正是要用这些悲剧揭示出这种痛苦，让读者借此祛除思想上的麻木，走向精神上的启蒙。\n\n三、用悲剧的质询与控诉精神带来的灵魂震动与精神革命\n\n鲁迅的悲剧往往带有哲学意味，在鲁迅的笔下，现实悲剧往往会被升华为哲学悲剧。\n\n比如说，在《伤逝》中，子君之死已是极大的悲剧了，但是鲁迅却没有停笔于此，他又用相当的篇幅继续对涓生的内心世界进行了深入的挖掘和剖露。面对子君之死，面对内心的挣扎，涓生陷入了极为复杂的忏悔与不安之中。鲁迅用大段的自白，明白淋漓地表达了涓生内心与灵魂深处的强烈不安。这种不安不仅来自对子君的哀悼和对自我的道德反省，同时更来自于对两人曾经一起抗争与求生的生命过程的深刻反思。\n\n从这个角度来说，《伤逝》决不是子君一个人的悲剧，更深刻的悲剧意味，则来自于涓生对悲剧的承受和领悟。这种对悲剧意味的领悟为涓生带来的是巨大的不安和永无宁日的折磨，并从此彻底中断了他原本貌似平静的生活链条。一个“大团圆”的怪圈被这样彻底地打破，生活从此也没有了按照原样“敷敷衍衍、模模糊糊”下去的可能。由此，悲剧的“意味”终于得到彰显：这不仅意味着发生过一个悲剧性的现实事件，更重要的是它带来了一场精神世界的冲击，是一种精神状态的彻底改变。这个改变也许意味着灭亡，也许意味着觉醒。可以说，这是发生在涓生精神世界内部的一场深刻的革命，只是它井无喜剧性的胜利，而是悲剧性的败落。\n\n这种带有哲学意味的悲剧精神，正是鲁迅本人思想认识和精神气质中非常独特而重要的一个特征。鲁迅的“反抗绝望”本身就是一种深刻的哲学意义上的悲剧精神。因为从哲学的意义上说，苦难并不就是悲剧，更深刻的悲剧是在超越苦难寻求解脱的行动中的溃败，或者是在对抗准则坚持真理的过程中的挣扎。鲁迅的“希望”与“绝望”并不是简单的情绪，而是一种哲学思想的两面。它们不归于沉思默想，而最终演化为行动。通过行动，人才能进入一种哲学意义上的悲剧困境，并展现出人类追求的意志和力量。由此，现实的或艺术上的悲剧就获得了形而上的哲学提升，它表现出强烈的质询、控诉的气质，而不安于承受和悲悼。而这种反抗的力量越强，其悲剧的色彩也必然愈加浓厚。","keywords":"艺术 打破“大团圆”模式 悲剧的形式 结尾处奏响悲剧的最强音 社会关怀 揭露“吃人”社会 清醒观察深刻认识 主人公的死亡 精神世界的毁灭 悲剧的质询与控诉精神 灵魂震动 精神革命 哲学悲剧 反抗绝望","note":"鲁迅的一生都在致力于国民的精神启蒙，而想要变革国民的精神，能够给人以精神震撼的悲剧毫无疑问是最合适的形式，因而，鲁迅的小说普遍表现出了悲剧色彩，悲剧精神贯穿鲁迅创作的始终。在具体讨论时，我们可以由浅入深，从形式到内容再到哲学层面逐步展开探讨，并可以结合鲁迅的具体作品进行理解。相关内容可以参考张洁宇《悲剧的意味-论鲁迅小说悲剧艺术的三重内涵》、林新华《论鲁迅的悲剧观》，具体论文可以在李凡文学正版群领取。"},{"id":"27","stars":"★★★★","title":"谈谈你对王富仁《鲁迅小说的叙事艺术》中这段话的认识和理解（26湖南师范大学）","body":"鲁迅小说在中国文学史上的突出地位，首先表现在它们的强烈鲜明的主体性特征，并且这种主体性是在中国近现代意识变动的过程中建立在理性自觉上的主体性。它不是靠着一时的激动而是在一种极为冷静的心境中创作出了富有个性色彩的小说、表达了自己对社会人生的独立的感受和认识的。\n\n-王富仁《鲁迅小说的叙事艺术》\n\n王富仁这段话的意思是，鲁迅的小说创作开创了一种崭新的叙事模式，显露出了一种鲜明的具有理性自觉的主体性，完成了对传统小说叙事模式的突破，对现代文学的发展产生了重要的影响。具体来说，可以从如下方面去理解：\n\n一、鲁迅小说主体性的内涵\n\n在传统小说中，往往采用第三人称的全知视角，作者的声音虽然也在小说中显露，但所表达的并非作者的思考、感受，而是受到某种社会意识形态所影响，在“一种普遍认同的道德伦理或思想感情”的支配下写作。因而，作品中的声音，并不是作者的声音，反而是某种社会意识形态，或者说是某种社会共名的传声筒，因而是“无主体”的，不具备主体性。如在传\n\n统长篇章回小说如《三国志演义》《水浒传》中，会插入作者对于某一时间、某一人物的判断，但这种判断是受到传统封建道德所规范和支配的，并非作者真正的声音。\n\n相反，鲁迅的小说，则表现出了鲜明的主体性。鲁迅始终不外在于他的创作，他就站在本己生存的现代基点上去展示他的小说世界，鲁迅小说的叙事即是作者怎样走进他的小说世界的过程，呈现为一个多重叙述视角的流动的过程。《狂人日记》取双重的第一人称叙述，既是“我”叙述狂人，也是狂人的自述。“我”的叙述规定了小说的时间境域，然后由狂人的自述去展示“吃人”的生存本质和现代启蒙的艰难，朝向世人呐喊的毫无动静。“我”与狂人既相类似也并不同一。在《明天》《风波》《药》以至《阿Q正传》中揭示虽寓于现代生存但仍深陷古老生存的世人们的生存状况，作者取第三人称的叙述视角，但作者始终关涉着他的人物，对他们的命运予以深刻的思考，不仅寄极度的爱憎于他的人物，而且不时在行文中作直接的抒发。\n\n二、鲁迅小说的主体性是基于理性自觉的\n\n中国知识分子的主体意识在中国语言本身的特征中无法产生，但在某种情感体验的高峰状态中则能够存在，像屈原，像司马迁，像李白，像曹雪芹，在他们的情感体验使他们达到了一种“忘乎所以”的状态的时候，他们的话语也就有了强烈的主体性。但是，这种在强烈情感体验基础之上建立起的主体性是不稳定的，旋生旋灭的。因为人不能永久处在高峰的感情体验状态。而一旦情感上复归于平静，这种靠激情维持的主体性就不存在了。\n\n与之相反，鲁迅小说不仅显示出强烈鲜明的主体性特征，这种主体性还是在近现代意识变动的过程中建立的基于理性自觉的主体特征，更确切地说，这一主体特征是在鲁迅小说的生存时间境域中从其呐喊以至彷徨的生存情态的衍进过程中显示出来的。\n\n三、鲁迅小说主体性的表现\n\n（一）鲁迅小说的主体性特征，首先区别了它与其他所有小说家的作品。鲁迅小说是有自己独立的个性的，这种个性使我们不论在任何情况下、不论以任何的理由都不能把它同其他小说家的作品混淆起来。它不但区别于那些不成功的小说作品，同时也区别于那些同样伟大的、甚至比鲁迅小说有着更广泛、更深入的世界影响的小说作品。\n\n（二）鲁迅在对自己读者的选择上具有主体性。鲁迅作为作者的主体性，不但表现在他对自己作品的主体性的明确意识，同时也表现在他对自己读者的选择的主体性。小说是一种“言语”形式，言语形式永远是有相对确定的对象的。它不是为所有的人写作的，而是为作者意识到的一个特定的读者群写作的。\n\n（三）鲁迅的主体性又赋予了自己假想中的读者以强烈鲜明的主体性。作者是独立的，他的假想中的读者也必然是独立的。读者不可能完全地等同于作者，否则，就不需要言语的沟通。有差异才有沟通。\n\n（四）鲁迅小说的作品文本具有主体性。一旦作者意识到了自己的主体性，一旦作者依靠对自己主体性地位的意识把自己同自己假想中的读者严格区别开来，同时意识到了自己读者的主体性地位，那么，他的小说文本也就同时脱离了作者本人而具有了自己的主体性。小说文本与作者、小说文本与作者假想中的读者都是有距离的。它是一个转播系统，具有自己的独立性，具有自己的主体性地位。\n\n总体看来，鲁迅的小说表现出了自觉的、鲜明的主体性特征，这是对中国小说叙事艺术的一大发展，是鲁迅在中国现代文学史上的一大贡献。","keywords":"内涵 本己生存的现代基点 基于理性自觉 表现 区别其作品 读者选择 读者 文本","note":"这道题就是一道典型的湖南师范大学的题目，其他学校所用的教材很少会涉及鲁迅小说主体性这一概念，但作为拓展知识我们也需要理解。鲁迅小说的主体性，讨论的主要是鲁迅小说的叙事模式，这种主体性，简单理解一下就是作品叙事中体现出了作者的思想、感受、评价，作者对于作品叙事起着支配作用，这一点和传统小说是完全不同的。相关内容可以参考王富仁《鲁迅小说的叙事艺术》。"},{"id":"28","stars":"★★★★","title":"结合鲁迅的小说创作，论述鲁迅的“立人”思想（26南开大学）","body":"鲁迅的小说是从不讳言社会功利性的，他写小说的目的就在于“启蒙”，就是要“辟人荒”，促成人的“自觉至、个性张”，从而萌生个人的主体性，自我决断，自己决定自己的命运。\n\n一、强调个体的、具体的人\n\n鲁迅赞同“神思宗之至新者”的观点，强调人的思想行为必须“以己为中枢，亦以己为终极”，以己为“造物主”。也就是说，他赋予“己”“个”概念以终极性的价值，人自己就是自己存在的根据和原因，不需要去别处寻找根据和原因，自\n\n己有一种自足性。此话非同小可，也就是说不要上帝，也不要上帝的代言人，不要众意。他提出要自己做主，意思是要自己裁判、自立标准、自己执行，同时自己负责。所以鲁迅讲的个性、个体意义不是放纵的，是很有责任感的，自己选择的同时自己负责，自身到自己那里寻找存在的价值和意义。这是鲁迅的第一个非常重要的思想。\n\n二、强调人的自由状态\n\n鲁迅说要“立我性为绝对之自由者也”。这里就提出了“自由”的概念。人的自主性决定了人摆脱了对“他者”的依赖关系，不依附任何其他力量，这就彻底走出了被他者奴役的状态，从而进入了人的生命的自由状态。这是鲁迅讲的“自由”的第一个含义。\n\n鲁迅“个”的观念的第二个含义是常常被人们忽略的。鲁迅讲的“己”“我”，并不是人们常说的利己主义的“己”，不是只看到眼前利益的、目光短浅、心胸狭隘的“己”。鲁迅所讲的“个人”与“己”，是有着非常宽阔的胸襟的大写的“人”，是和万物、他人相通的。鲁迅在小说《兔和猫》中还写道：“夏夜，窗外边，常听到苍蝇悠长的吱吱的叫声，这一定是给蝇虎咬住了，然而我向来无所容心于其间，而别人并且不知道......”。在鲁迅看来，苍蝇的生命也是自有价值的，并且是应该与自己的生命相通的；现在自己对其生命的挣扎竟然听而不闻，对于一个生命的消失麻木不仁，自己的内心就有问题，是应该受到谴责的。这就是说，鲁迅的个体生命自由观，是包含一种博爱精神、一种佛教所说的大慈悲情怀的。他所讲的人的个体精神自由是一个非常大的生命境界，用他自己的话讲就是“天马行空”，是独立地不依他、不受拘束的，同时又可以自由出入于物我之间、人我之间，这是大境界中的自由状态。\n\n三、强调人的精神力量\n\n鲁迅受叔本华、尼采哲学的影响，强调“意力为世界之本体”，“惟有刚毅不挠，虽遇外物而弗为移，始足作社会桢干”。鲁迅强调精神力量的时候，特别看重人的意志力，这可能与他思想中没有上帝有关。宗教徒可以依靠上帝，背后有一个决定者的存在，鲁迅没有上帝，只有依靠自己，依靠内在的意志力。在这一意义上，可以说具有强大意志力的自我成为鲁迅的“上帝”，这可以看成是鲁迅的“宗教”。所以他提倡一种刚毅不挠的人性，从理论上讲，他当然知道应追求“圆满无间”的人性的调和，但具体到个体生命，特别是具体到自己的个体生命，鲁迅选择的是人性的“偏至”：偏向于强悍的生命，在艺术上也偏向于力的美、粗暴的美。\n\n以上三个方面，一是强调个体的、具体的人，二是强调人的自由状态，三是强调人的精神，概括起来就是“个体的精神的自由”。这构成了鲁迅最基本的“立人”观念。可以说他是以“个体精神自由”作为衡量一切问题的基本标准、基本尺度。","keywords":"个体的、具体的人 人的自由状态 人的精神力量","note":"在鲁迅看来，要“立国”，完成社会改革，首先要“立人”，完成人改造。所以，鲁迅提倡启蒙，进行“国民性批判”，其整体的小说艺术，都为“立人”思想所统帅。这种“立人”思想，具体表现为强调个体、具体的人，强调自由，强调人的精神力量这些方面。相关内容可以参考钱理群《以“立人”为中心-鲁迅思想与文学的逻辑起点》。"},{"id":"29","stars":"★★★★","title":"试分析鲁迅“闲话风”散文的艺术特点","body":"鲁迅是“闲话风”散文的开创者，其散文集《朝花夕拾》正是这一“闲话风”散文的杰出代表。鲁迅“闲话风”散文，主要具备如下特征：\n\n一、具有平等、开放的品格和率真之气\n\n“闲话风”散文别具平等、开放的品格，又充溢着一股率真之气。“闲话风”其实就是童年“谈闲天”的追忆与模拟。&#x8FD9;就规定了这类散文的特殊氛围：自然，亲切，和谐，宽松，每个人（作者与读者）既是说话者，又是听话者，彼此处于绝对平等的地位。这正是对“五四”时期盛行的“我（作者）说你（读者）听，我启你蒙”，强制灌输的布道式、演讲风散文的一个历史的否定与超越。“闲话风”散文是作者与读者的精神对话：作者掏出心来，真诚地袒露自己生活与内心的秘密、真实的欢乐与痛苦，希望引起读者（听众）的共鸣、联想、议论与诘难，达到精神的互补，而非趋一。\n\n二、“任心闲谈”，表现出余裕、从容的风姿\n\n“闲话风”的另一面是“闲”，即所谓“任心闲谈”。鲁迅那一代知识分子在精神上充满紧张、沉重、严峻、激烈的同时，也还有洒脱、放纵、雍容、闲适的一面，与魏晋时代知识者集“清峻”与“通脱”于一身，确有相近之处。“闲话风”散文正是“在纷扰中寻出一点闲静来”，鲁迅于中暂时搁置“使命感”而获得闲适心境，悠然地以常人的心态回顾自己的人生经历、生活旧事，从容袒露自身情趣情感，以冷静清醒的目光打量生与死，用幽默的笔触描绘充满爱恨情仇的世界，显示出放达直率之气，处处显出余裕、从容的风姿。\n\n三、结构上兴之所至的随意性\n\n“闲话”也称“漫笔”，表明了一种笔墨趣味：不仅是指题材上“漫”无边际，而且是行文结构上的兴之所至的随意性。如《狗·猫·鼠》这篇，忽而动物王国，忽而人世间；忽而人禽之辨不严的远古，忽而仇猫杀狗的现实；忽而日本传说中的猫婆，忽而中国古代的猫鬼，忽而太平洋彼岸美国小说里的黑狗；忽而猫与虎的斗智，忽而老鼠成亲的仪式。鲁迅思想与艺术天马行空般的自由驰骋，正表现着心灵的开阔与自由。\n\n四、“原生味”的语言趣味\n\n“闲话”还表现了一种追求“原生味”的语言趣味。鲁迅曾经说过，如果把只隔一层薄板壁的邻居的高声的谈话如实记录下来，删除了不必要之点，是可以成为很传神的文学语言的。《朝花夕拾》正是这类“听闲谈而去其散漫”的语言主张的成功实践，它最大限度地保留了生活语言的丰富性、生动性与复杂性，这自然又是从更好地发挥沟通心灵的文学功能的目的出发的。","keywords":"平等、开放 率真之气“任心闲谈”余裕、从容 随意性“漫笔”追求“原生味”","note":"“闲话风”是与“独语体”相对的一种漫谈式的散文。大家要将二者对比记忆，了解它们各自不同的审美特征。“独语”是一种内敛的散文叙述方式，它最大的特点就是封闭性与自我指涉性。独语体散文不顾及与倾听者的交流，而只注重自己孤寂的内心世界，通过强化自己内心的孤独感与荒凉感，表达一种面对世界的生命体验，实现一种带有幻美色彩的审美追求。“闲话风”的散文则是追求一种日常交流的语境，以聊天闲谈的方式结构文章，通常有种开放的格局，风格上也讲求娓娓而谈。同时要注意“闲话风”在名词解释中出现的频率比论述更高一些，要注意灵活应对。"},{"id":"30","stars":"★★★★","title":"试分析《朝花夕拾》的创作成就","body":"《朝花夕拾》反映了鲁迅早期的生活经历和思想演变过程。它们不仅以优美的文笔给人以美的享受，同时也是研究鲁迅生平和思想发展的重要资料。《朝花夕拾》的艺术成就，主要表现在以下方面：\n\n一、给中国的散文创作注入了更丰富的社会内涵和文化内涵\n\n《朝花夕拾》的重点不在山川景物的描绘，而在于社会人情世态的刻画，给人们留下了一幅幅色彩鲜明、浓淡相宜的风俗画和世态画，其中浸透着作者深切的人生感受和对中国社会生活、中国国民精神的解剖。例如，在对“百草园”的描绘中浸透着童年生活的乐趣，在对“三味书屋”生活的描绘中表现了少年活泼的心灵，透露出旧教育制度对少年心灵的禁锢，在对南京水师学堂生活的描绘中反映出新旧文化的交替，在对日本仙台生活的描绘中表现出弱国子民在国外感受到的耻辱。鲁迅的《朝花夕拾》给中国的散文创作注入了更丰富的社会内涵和文化内涵。\n\n二、塑造了许多栩栩如生的人物形象\n\n《朝花夕拾》不仅给人们留下了一幅幅生动鲜明的生活画面，还为我们塑造了许多栩栩如生的人物形象，如《阿长与＜山海经＞》中的长妈妈、《从百草园到三味书屋》中的“先生”、《藤野先生》中的藤野先生、《范爱农》中的范爱农等。长妈妈的淳朴、“先生”的方正、藤野先生的亲切、范爱农的孤傲都写得栩栩如生，给人留下了深刻的印象，\n\n三、开创了“闲话风”散文体式\n\n《朝花夕拾》是回忆性的抒情散文，作者采用闲谈絮语的方式对记忆中的生活碎片娓娓道来，无拘无束，率性而谈，是“闲话风”散文体式的开创者与杰出代表。《朝花夕拾》中，充满了个体生命的童年时代与人类文化发展的童年（原始）时代所特有的天真之气，别具平等、开放的品格。与此同时，《朝花夕拾》“在纷扰中寻出一点闲静来”，处处显出余裕、从容的风姿。不仅如此，《朝花夕拾》在题材上“漫”无边际，行文结构上具有兴之所至的随意性。在语言上则是“听闲谈而去其散漫”的语言主张的成功实践，具备“原生味”的语言趣味。\n\n四、杂文笔法向散文渗透\n\n《朝花夕拾》将大量的议论融于记叙之中，这些议论有的用于讽刺，有的用于针砭时事，有的用于评述生活和人物，但总的目的都在于赋予所记叙的生活现象和人物以新的视点，从而起到了化腐朽为神奇、由平凡见哲理、从特殊到一般的升华作用。这里的批判与嘲讽，可以视为鲁迅的杂文笔法向散文的渗透，不仅使其韵味更为丰厚，而且显示了鲁迅现实关怀的这一面：这也是真实的鲁迅。例如《二十四孝图》记叙了儿时看二十四孝图的情景，正是由于大量议论的插入，才将二十四孝图所宣扬的陈腐思想的荒谬性揭露了出来，为人们提供了一个与二十四孝图完全不同的新视角。","keywords":"社会内涵 文化内涵 栩栩如生的人物形象 开创“闲话风”散文体式 杂文笔法向散文渗透","note":"《朝花夕拾》是鲁迅所写的唯一一部回忆性的散文集。如果说鲁迅在杂文里，更多的是把自己火热的感情熔铸在** --- 冷静的观察和严峻的批判中，那么在《朝花夕拾》里，鲁迅对生活和人民的深沉的爱，则主要是从正面较直接地表现出来的。这与艺术样式的特点以及题材的性质有一定的关系。不过要注意一个作家的艺术个性，总是统一的。正如鲁迅的许多杂文里渗透着热烈的抒情，在《朝花夕拾》这部抒情性较强的散文作品中也交织着尖锐的讽刺和严峻的批判。"},{"id":"31","stars":"★★★★","title":"试分析《野草》的思想内容","body":"《野草》中所收的诗作，隐晦曲折地表现了鲁迅这一启蒙思想先驱在“五四”落潮期孤傲执着而又彷徨无奈的心路历程。具体来说，《野草》大致表现出以下几个方面的思想内涵和情感心态。\n\n一、自我主观感情的象征性表现\n\n《影的告别》《风筝》《好的故事》《死火》《墓碣文》《颓败线的颤动》《腊叶》等都可以归入这一类。其中虽有各种不同的情绪表现，但以作者的苦闷、痛苦以及自剖、自省的意识为主。\n\n《影的告别》表现了鲁迅对自我存在价值的痛苦感受，表现了一个先觉的文化战士的历史悲剧意识。《颓败线的颤动》是一篇以恢弘壮丽之笔写成的一个伟大母亲的悲剧，所表现的便是爱人者的悲剧。《死火》是鲁迅自我感情的象征性表现。《墓碣文》写的是自我内心矛盾之苦以及对这种痛苦的抗争。《腊叶》“是为爱我者的想要保存我而作的”，表现了鲁迅对自己弱小生命的怜惜。\n\n二、对自我存在价值的象征性肯定\n\n《秋夜》《雪》《过客》《这样的战士》可以归入这一类。《秋夜》中的枣树、《雪》中的“朔方的雪”、《过客》中的“过客”、《这样的战士》中的“这样的战士”，都是鲁迅的自我写照。这一类作品更多地表现了鲁迅顽强的战斗精神和对自我存在价值的肯定，虽然其中也流露出一些孤独情绪。\n\n《秋夜》充分体现了鲁迅对自己存在的骄傲，这是一个坚韧的文化战士对自我存在价值的肯定。《雪》中描写了“暖国的雨”“南方的雪”和“朔方的雪”，表达了鲁迅不卑弃自我的存在，在恶劣的社会条件下生存和战斗的决心。《过客》借“过客”这一形象，表现了鲁迅不停地跋涉、坚定地向前走去的信念。《这样的战士》中的“这样的战士”同样是鲁迅的自况，体现了与一般所说的“战士”不同的意义，凸显了鲁迅的战斗意志。\n\n三、对各种庸俗倾向的愤懑揭露和无情鞭挞\n\n《求乞者》《复仇》《复仇（其二）》《狗的驳诘》《立论》《死后》《聪明人和傻子和奴才》等可以归入这一类。\n\n《聪明人和傻子和奴才》勾勒了三种人的精神特征，在其中鲁迅表达了对“傻子”的肯定和对“奴才”“聪明人”的鄙弃。《复仇》表现的是对“看客”们的厌恶和蔑视，它同《呐喊》中的《药》一样，是英雄为群众牺牲而群众并不觉悟的悲剧。《求乞者》表现了鲁迅对以卑屈的态度实现个人私利追求的人的厌恶。《死后》表现的是庸俗势力的无孔不入和鲁迅对庸俗人生的厌倦情绪；《立论》反映了人与人的虚伪关系；《狗的驳诘》辛辣地嘲讽了奴才们的势利态度。\n\n在这类散文诗里，虽然其重心在于鞭挞社会的虚伪和庸俗，但也像上两类散文诗一样，有着鲁迅自我写照式的象征性形象。《聪明人和傻子和奴才》中的“傻子”、《复仇》中的裸立对峙而并不相互搏斗者、《复仇（其二）》中的耶稣、《求乞者》中的“我”、《立论》中的“我”等，都有鲁迅自己的影子。\n\n四、对反动统治者的揭露和控诉\n\n《失掉的好地狱》《淡淡的血痕中》《一觉》可归入这一类。《失掉的好地狱》揭露了政客们的争权夺利，表明了反动的统治制度不变，人民便没有自由平等的民主权利。这样的社会与失去了固有秩序的社会的区别仅仅是好地狱与坏地狱的区别。《淡淡的血痕中》纪念的是“三一八”死难的青年。同《记念刘和珍君》等文一样，它愤激于怯弱者的淡忘与苟活，呼唤于正视淋漓的鲜血的真的猛士，同时也是对屠杀青年的反动政府的愤怒控诉。《一觉》作于“奉天派和直隶派军阀战争的时候”，是对军阀混战的揭露和抗议。\n\n五、对青年中某些思想倾向的批评和讽刺\n\n《希望》和《我的失恋》可以归入这一类。五四新文化运动之后，大量青年涌入新文化界，但他们对旧文化的强大井没有充分的思想准备，所以一遇到人生中的实际困难便很容易消沉，并且极易由消沉走向妥协。其中一部分青年则缩小了反封建的目标，将自己的目光仅仅专注于青年恋爱婚姻问题上，使失恋诗遂成为文坛的一种时髦。鲁迅从整个社会文化的改造出发，对这两种倾向自然是不满意的。\n\n《希望》便是“因为惊异于青年之消沉”而作的，鲁迅在其中抒发了因青年的消沉而感到的孤独和寂寞，但他又决心与绝望抗争，由自己来“肉薄这空虚中的暗夜”；《我的失恋》是对当时盛行的失恋诗的嘲讽。","keywords":"自我主观感情 象征性表现 自我存在价值 象征性肯定 各种庸俗倾向 揭露和鞭挞 反动统治者 揭露和控诉青年中某些思想倾向 批评和讽刺","note":"鲁迅的散文诗集《野草》凝聚着他在“五四”新文化运动退潮以后思想彷徨时期对人生、对人的存在价值、对中国文化的特征和社会发展的深沉思考。黯淡的情绪和痛苦的情愫孕育了《野草》的诞生，这是鲁迅对纠缠于自身的各种矛盾的一次展示和清理。这24篇散文诗，虽然题材各不统属，但却在情感情绪上相互联结，构成一个整体，共同以主观感情抒**发为主，交织着鲁迅严肃的自剖和不懈的战斗精神，是一个伟大的探求者的心声。"},{"id":"32","stars":"★★★★","title":"试分析《野草》中蕴涵的生命哲学","body":"鲁迅作为一个孤军奋战的启蒙思想家，具有丰富深邃的精神世界。而鲁迅也曾经承认过，他的哲学都包括在他的《野草》里面。可以说，透过《野草》，我们可以一窥鲁迅丰富的精神世界。《野草》中蕴涵的生命哲学，主要表现在以下方面：\n\n一、韧性战斗的生命哲学\n\n韧性战斗的生命哲学主要是指对旧社会旧制度和黑暗势力，对于人和人性的摧残压迫，所采取的生命选择和心理姿态。&#x8FD9;种思想的产生，主要基于对改革中国社会那种艰难的深刻了解，对于“五四”以后青年抗争黑暗势力过分乐观和急躁的那种反省观察。鲁迅以一个启蒙者特有的清醒提出了长期作战的韧性这种精神的思考，成为一种哲学的思考。\n\n如《秋夜》用秋天的夜色和氛围，暗示了两种势力的对峙与斗争。两棵枣树意象，与扑灯的最后死掉的小青虫、做着好梦的小粉红花形成一种对比，而后两者是暗示，一种是做着未来的好梦，一种是做着无谓的牺牲，追求光明，最后很快就死了。《秋夜》所传达的思想，主要是要告诫战斗的人们：一方面要战斗，一方面要保护自己的力量。\n\n《过客》中，象征韧性战斗精神的枣树到《过客》里变成了一个倔强跋涉者的动人的形象-过客。这里面包含了鲁迅自辛亥革命以来生命经历所积蓄的最痛苦也最冷峻的人生哲学的思考。《过客》的价值在于告诉你，寻求、探索人生道路的全部过程，这就是人生的价值，这种不倦的追求本身就是生命的光彩。\n\n其它像《野草》里另外的《这样的战士》《淡淡的血痕中》等篇，都表现了那种永不休止的抗争、斗争的精神，都包含了鲁迅这样一种生命哲学的思考。\n\n二、反抗绝望的生命哲学\n\n所谓“反抗绝望”，指的是“明知前路是坟而偏走”的“反抗绝望”的生存意志和生命哲学，明知绝望而决不放弃，自觉悲壮而更加追求，这种属于鲁迅独特拥有的生命哲学给他的作品带来了浓重的悲剧色彩。\n\n反抗绝望的哲学是鲁迅转向自己内心世界进行激烈搏斗时的精神产物，它是坚持进行反叛抗议中感受到的孤独寂寞的灵魂的自我抗争和思考。鲁迅的反抗绝望的哲学，并非来自存在主义的影响或形而上的抽象思辨，而是来自现实体验和生命的感悟。\n\n这种反抗绝望的生命哲学主要体现在那些心灵自剖性的作品之中。如《影的告别》中影宁肯自己全部沉没在黑暗里，也不希望别人再经过这样黑暗的境地。影以自己的沉没向虚无和黑暗做最后的悲壮的抗争，显得更为勇猛，更为悲壮；《求乞者》抒发了在冷漠无情的社会里，对于奴隶式的求乞行为的厌腻、疑心和憎恶；《希望》更是直接用裴多菲的诗句“绝望之为虚妄，正与希望相同”，发出了抗争绝望的声音。\n\n三、复仇的人生哲学\n\n所谓“复仇”，其实是对麻木群众的复仇。鲁迅出于改造国民性思想，对群众的精神麻木抱有一种激愤批判的情绪和思想。为此，他在《野草》里连着写了《复仇》《复仇（其二）》两篇散文诗，把这样一种对于社会精神现象的人生思考，传达到了淋漓尽致的程度。他自己先后曾直接或间接地说明了这两首散文诗的创作意图，前者是“因为憎恶社会上的旁观者之多”，后者则是有感于先觉者与群众麻木之间可悲的隔阂。\n\n鲁迅的血统里或者他的思想里这种复仇的思想是非常深的。这里边讲的两篇主要是对麻木群众的复仇的哲学思考，鲁迅自己说“较永久的悲悯他们的前途，然而仇恨他们的现在”。他甚至认为“暴君治下的臣民，大抵比暴君更暴”。","keywords":"韧性战斗 生命选择 心理姿态 反抗绝望 明知绝望而决不放弃 自觉悲壮而更加追求 复仇 对麻木群众的复仇","note":""},{"id":"33","stars":"★★★★★","title":"试分析《野草》的艺术特色","body":"《野草》中的散文诗是鲁迅的小说、杂文之外的另一座艺术高峰。它们把深刻的人生哲理、独特的人生体验和丰富奇幻的主观想象结合起来，具有极高的思想价值和艺术价值。《野草》的艺术特色，主要表现在以下方面：\n\n一、“独战的战士”形象\n\n独战的战士是《野草》独创的艺术形象，使《野草》的抒情风格为一种悲剧美所浸润。《秋夜》中的枣树，《过客》中的客，《这样的战士》中的高举投枪的战士，《复仇（其二）》中的人之子，《雪》中被赞作“孤独的雪，死掉的雨，雨的精魂”的朔方的雪，都是这样的独战的战士。这些独战的战士有它的社会土壤和社会典型性，同时又都带有尼采思想的明显烙印。《复仇（其二）》中的人之子会使读者想起被尼采用作自传题目的那个警句：“看哪，这人！”它原是彼拉多指着钉上十字架的耶稣说的话。过客也使读者想起作为“过渡者”的查拉斯图特拉。朔方的雪使人想起尼采那体验着“精神惊骇中之快乐”的鹰鹫。这些有着明显尼采气息的独战的战士，是彷徨期的鲁迅独战的产物。从孤独战士到《淡淡的血痕中》“真的猛士”的出现再到“坦然，欣然”地投身于地火中的“我”，可以寻找出鲁迅由彷徨、独战走出的心灵踪迹。\n\n二、象征手法的广泛应用\n\n《野草》中的多数篇章并不是现实生活的直接描绘，而是把作者深刻的人生感受通过主观想象的作用化为具有象征性的艺术形象，从而对现实世界构成了多义性的象征。在《野草》中，鲁迅创造了大量象征性的形象，这些形象是中国文学史上全新的意象创造。《秋夜》中的“枣树”“小粉红花”“瘦的诗人”“小飞虫”，《影的告别》中的“影子”，《求乞者》中的“求乞者”，《复仇》中的裸立者，《复仇（其二）》中的耶稣，《雪》中的“朔方的雪”“南国的雪”“暖国的雨”，《过客》中的“过客”，《死火》中的“死火”，《失掉的好地狱》中的“地狱”，《颓败线的颤动》中的“母亲”，《这样的战士》中的“这样的战士”，《聪明人和傻子和奴才》中的“傻子”“聪明人”“奴才”等，都是中国文学史上的一些全新的意象创造，较之传统的“松”“梅”“菊”“莲”等意象具有更深厚的社会内涵。\n\n三、奇幻壮美的意境创造\n\n《野草》中用象征主义的艺术方法创造的大量意境也都是全新的，奇幻壮美是它们的总体特征。《野草》大多数篇章就是记录“我”的梦境，将不能或不愿直说的现实感触经过心灵的消化、过滤与转换，升华为奇崛怪异、瑰丽浓郁的意象象征。《野草》对现实景象和梦境的交错描写，把一些微妙难言的感觉、直觉、情绪、想象、意识与潜意识准确而生动地表现了出来，营造了奇幻壮美的意境，有着丰富的心理内涵。\n\n四、隐喻手法的大量运用\n\n隐喻手法的大量运用，是《野草》修辞的显著特点，而这是和它思想的深刻、感情的潜沉相表里的。如《墓碣文》以蛇吃自己这个令人惊悚的情节隐喻现代中国知识分子主体处境。在这条正在吃自己、欲知其味的蛇身上，饱含着自我分裂的痛苦、残酷和反抗绝望的精神。因而读者阅读和欣常的兴趣便往往偏重于对《野草》思想、艺术底蕴的探寻，对《野草》的理解也人言人殊，个别篇什尤为隐晦难解，然而一有所悟，便顿觉品尝出人生的真味。\n\n五、集华丽与艰涩为一身的非常个性化的语言\n\n《野草》是鲁迅进行的一次空前的语言实验。一方面，大胆尝试非常态的语言方式：&#x968F;处可见的违反日常思维习惯、修辞习惯和语言规范的表达；不断出现的“然而”“但是”“而”等转折词构成的不断否定的循环；有意违反简洁、通顺等语言要求的重复和繁复。另一方面，鲁迅又自觉吸收西方现代美术和音乐的表现手法，进行具有音乐性与强烈线条感和色彩感的语言实验。\n\n鲁迅通过《野草》，创造了一种集华丽与艰涩为一身的非常个性化的语言，同时也就把汉语的表现力提到了一个空前的高度。","keywords":"独战的战士 象征主义艺术方法 奇幻壮美的意境 隐喻手法 华丽与艰涩为一身 个性化的语言","note":"鲁迅这位文学巨匠不仅对杂文和短篇小说，而且对散文诗都作出了杰出的贡献。鲁迅的散文诗是建筑美、音乐美和绘画美高度统一的典范。虽然“日在变化的时代，已不许这样的文章，甚而至于这样的感想存在”（《二心集·＜野草）英文译本序》），特别是它的含糊措辞和隐晦手法，今天的散文诗作者都不应简单地模拟和照搬。但是，鲁迅在《野草》中运用的“并不算坏”的“技术”，无疑是值得我们认真学习和借鉴的。25年南京师范大学就针对《野草》的思想内容与艺术特色出题，大家结合这部分内容以及前面《野草》的思想内容这道题灵活应对即可。"},{"id":"34","stars":"★★★★★","title":"试分析鲁迅改造国民性思想","body":"【答题框架】\n\n鲁迅的改造国民性的思想，是鲁迅思想的一个重要组成部分。从他开始从事文学活动起，这一思想就占着极重要的位置；以后不仅在许多杂文中多次谈论过这一问题，而且也是包括《阿Q正传》在内的一些小说名篇的中心思想。\n\n一、鲁迅改造国民性思想的内容\n\n鲁迅的改造国民性思想是一贯的，包括前期和后期。所谓改造国民性包括两方面的内容，一方面是揭露和批判国民性的弱点，一方面是肯定和发扬国民性的某些优点，其目的都在促进一种新的向上的和符合时代要求的民族精神的诞生。\n\n虽然鲁迅对国民性问题认识的深度和侧重点前后期有所不同，但这两方面的内容无论前期或后期，都是存在的。为了正见现实和推动改革，他前期着重在批判国民性的弱点，而且问题提得很尖锐，使人不能不惊醒，这是大家都知道的；但他是严肃地考察过历史和现状的，即使是在前期，他也不是对中国的国民性采取全面否定的态度，而是努力发掘一些值得肯定的和宝贵的东西。\n\n二、鲁迅改造国民性思想成因\n\n（一）列强瓜分中国的危机迫在眉睫\n\n19世纪中叶，西方最发达的资本主义国家打开了中国的大门，中国的独立和主权问题非常严峻地摆在每个国民的面前。为了挽救亡国灭种的危机，先进的中国人提出了民族独立和国家主权问题，中国人的国家、民族意识由此形成。19世纪后期，由于民族危机日益加深，资产阶级民主运动空前高涨，推动了中国人的民族觉醒。到20世纪初叶，改造国民性的呼声汇成一股时代强音。人们从不同的认识层面上反思中国的民族特性，中国人的现实命运，传统文化精神的弊病，以及中西方人不司的特性等等。\n\n正是在列强瓜分中国的危机迫在眉睫的历史条件下，鲁迅于20世纪初提出了改造国民性和“立人”两个相关的命题。\n\n（二）鲁迅个人思想转变\n\n鲁迅早年有一个从相信物质文明到相信精神建设，从提倡兴业振兵到提倡文艺救国的思想变化过程，这一转变也是鲁迅国民性思想形成的一个原因。最初他是做着兴业振兵的好梦到南京学采矿学海军，后来又带着“对于维新的信仰”到维新取得成功的日本去学医。学医第二年东京的革命派和改良派大论战促使鲁迅意识到人和人的精神意志的重要性，“幻灯事件”则是鲁迅“改造国民性”思想产生的一个直接契机，鲁迅在现实生活中因为受到群众精神麻木的刺激，才毅然地放弃科学教国的幻想，确立了以改变国民精神为“第一要著”的思想启蒙主张。\n\n（三）对于中国传统文化的痛切反省和刻骨铭心的生命体验\n\n对于中国传统文化的痛切反省和刻骨铭心的生命体验，也是鲁迅坚持实行国民性批判的一个重要内因。鲁迅“少喜披览古说”，旧文化旧道德对其文化性格的形成影响颇大。他在五四新文化运动中对中国封建文明摧残人性的批判可谓透入骨髓。然而他又深知，自己受到旧文化旧道德的深重影响，希望这种消极影响不再见于“后来的青年”。正是为了“后来的青年”的解放，他要砸碎一切精神锁链，唤起世人反抗旧传统，改革国民性。\n\n（四）外国人研究中国国民性的著作的影响\n\n探溯鲁迅国民性批判之“源”，当然不应忽视外国人研究中国国民性的著作对他的影响。外国人讲中国的著作，较早的有法国大革命时代孟德斯鸠的《论法的精神》中《西班牙人和中国人的性格》一章，俄国无政府主义者巴枯宁在其晚年著作《国家制度和无政府状态》中，也述及中国人的性格和习惯。19世纪末，一些来华的美国传教士都曾谈论过中国的国民性问题，其中斯密斯的《支那人气质》，受到鲁迅重视。\n\n斯氏在华传教22年，熟悉中国文化、中国人的习性和中国的风土人情，他对中国人气质的分析确有真知灼见。正因为如此，《支那人气质》这本书对鲁迅的文学创作和国民性批判发生了深刻而持久的影响，直到他逝世前14天还念念不忘。\n\n三、鲁迅改造国民性思想中国民性弱点的表现\n\n（一）国人内心的奴性\n\n国民劣根性最突出的表现就是存在于国人内心深处的奴性，这是鲁迅最为痛心疾首、深恶痛绝的。鲁迅通过自己的亲身经历和对中国历史的深刻反省，尖锐地指出：“中国人向来就没有争到过‘人’的价格，至多不过是奴隶”，中国几千年的历史可以归结为“想做奴隶而不得的时代，和“暂时做稳了奴隶的时代”的循环。鲁迅认为，绵延数千年的封建等级制度是培植奴性的历史土壤，长期的非人的生存境遇，使国人对暴力和强权有着一种与生俱来的敬畏和盲从心理，陷于奴隶的深渊而不能自拔，人们为了保住奴才的地位在自觉或不自觉地维护着这吃人的制度，并随之而形成了驯服、乖巧的特性以及骄和谗相纠结的畸形性格。\n\n（二）精神胜利法\n\n精神胜利法是国民劣根性的又一表现，它集中体现于阿Q这一艺术形象中，在《阿Q正传》中，鲁迅深刻探求阿Q特定的生存方式和哲学归纳出“精神胜利法”，从而揭示了中国人隐蔽的精神世界。他们生活在极端恶劣的环境里，倍尝艰辛与凌辱，身心遭到极大的损害，对现实苦难麻木不仁，只是沉溺于自我虚构的美好境界中追求安慰，借以平衡现实的痛苦与失败，他们或以妄自尊大掩盖失败，或以自欺欺人补偿自尊，或将失败的苦痛转嫁给更卑更弱的人群，人们不敢面对现实，更不敢用积极进取的精神去改变现实，从而构成了我们民族沉重的精神惰性力。\n\n（三）看客心态\n\n看客心态是中国国民性的一大顽症和痼疾，也是鲁迅排遣不去的心病，它推动鲁迅走上文学创作道路。中国的看客们似乎总有用不完的时间、总是饶有兴趣地鉴赏着世间万事万物，把看当作种满足好奇打发无聊的手段，而精神上却日渐冷漠、麻木起来，失去了血性，也泯灭了人性。\n\n更可恶的是，看客们不只是麻木迟钝，同时又表现出对于不幸的兴趣和对痛苦的敏感。他们把自身以外的任何痛苦和灾难，都作为一种赏心悦目的对象和体验，通过鉴赏别人的痛苦，使自己的痛苦得到转移，甚至从中达到自我满足。这样的看客是既凶且怯的，他们想品尝、分享血腥的滋味，就“抽刃向更弱者”，将无以生存、无力抗争的同类推向祭祀的刀俎，以供自己欣赏并打发无聊。\n\n看客与统治者一起在维护并巩固着这吃人的制度，看客的麻木、冷漠和自私，是社会进步、民众觉醒的严重障碍，是中国社会变革屡遭失败的根本原因之一。鲁迅在《阿Q正传》《祝福》《示众》《复仇》《铲共大观》等作品中刻画了形形色色的看客的形象，把冷漠麻木、丑恶卑猥的看客心态当作国民性弱点的一个突出重点来揭露和批判。\n\n四、鲁迅改造国民性思想中国民性弱点产生的原因\n\n对于国民性弱点产生的原因，鲁迅认为主要有以下三个方面：\n\n（一）封建等级制度\n\n鲁迅指出，中国古代封建等级制度森严，“有贵贱，有大小，有上下......一级一级的制驭着，不能动弹，也不想动弹了。因为倘一动弹，虽或有利，然而也有弊。”于是人们在被压迫地位下“所蕴蓄的怨愤”不是“向强者反抗，而反在弱者身上发泄”，到怨愤已消，“天下也就成为太平的盛世。”欺弱怕强之类的奴性思想和苟活心理就是由此产生的。\n\n（二）封建传统思想的毒害\n\n中国的封建思想历史长久，发展得极为完备，它与封建专制主义的政治力量结合在一起，形成了一种强大的思想统治力量。鲁迅认为这一强大的思想统治力量凭借着经书和古文一代代流传，毒害了一代代人，直到当代：“古书......读一点就可以知道，怎样敷衍，偷生，献媚，弄权，自私，然而能够假借大义，窃取美名；再进一步，并可以悟出中国人是健忘的，无论怎样言行不符，名实不副，前后矛盾，撒诳造谣，蝇营狗苟，都不要紧，经过若干时候，自然被忘得干干净净；只要留下一点卫道模样的文字，将来仍不失为‘正人君子’。”\n\n（三）屡受外来侵略\n\n鲁迅把我们民族屡受外来侵略看作是形成国民性弱点的重要原因，他指出中国历史上“历受游牧民族之害”所形成的“满是血痕”的民族心理，是中国和日本国民性差别的原因；并且担心我们这“奉迎过蒙古人、满洲人大驾了的国度”，在帝国主义的新的侵略面前，国民性的弱点很可能蹈过去的覆辙，“反为敌人先驱”。这就说明，鲁迅对国民性弱点的分析既是从中国半殖民地半封建的社会现实出发，同时又是考察了它所形成的历史根源的。他并不是从抽象的概念出发，而是具体考察了这些弱点的实际存在井分析了它所形成的历史原因的。","keywords":"内容 揭露和批判 肯定和发扬 思想成因 历史条件 个人思想转变 对中国传统文化的痛切反省和生命体验 外国人著作 国民性弱点表现 奴性 精神胜利法 看客心态 国民性弱点产生原因 封建等级制度 封建传统思想的毒害 屡受外来侵略","note":"在上世纪之交，梁启超等启蒙先驱提出了中国“国民性”问题，鲁迅接过他们的大旗，对“国民性”问题进行了深刻独到的剖析，形成了他最具“思想史”价值的改造“国民性”思想。这一思想历来为评论家所重视，在考查中出现的频率非常高，如25年四川大学就针对鲁迅“国民性批判”的内容出题。需要注意的是，鲁迅的改造国民性思想可能会与老舍等改造／批判国民性思想放在一起对比，大家要注意灵活应对。相关内容可以参考程致中《鲁迅国民性批判探源》、常纪《鲁迅国民性批判及其当代意义》，具体资料可以在李凡文学正版群中领取。"},{"id":"35","stars":"★★","title":"“五四”小说是如何取得文学正宗地位的","body":"一、随着社会制度与经济环境的变化，已形成小说压倒其他文学品种的文化生存环境\n\n清末民初“新小说”创作运动，成绩虽然不大，却对进一步提高小说在民众心目中的位置，起到推波助澜的作用。另外，因上海等东南沿海城市开埠，印刷、报刊业的长足进步，使小说拥有了前所未有的出版传播手段，形成了新的市民读者群体。而报纸、书局向文学家支付稿酬也自近代小说始，稿费制度遂养成中国第一代以写作为生的职业小说家。\n\n二、“五四”文学革命给小说的现代化带来契机\n\n“五四”文学革命是一次广泛的思想文化启蒙大潮，它对小说的推动力是相当深刻的。《狂人日记》等现代小说以反封建的精神直指人的现代觉醒和国民灵魂改造，又具特别的格式，因而引人注目。新式的教育产生了一代青年学生读者、作者群（包括留学生读者、作者），“五四”文学革命从白话代替文言入手，对叙述语言特别适用白话的小说的推广，起了巨大的作用。\n\n三、西洋小说的引入，形成了中国小说由古典形态向现代形态转型的推动力\n\n古文家林纾用文言意译的西欧小说，造成了世界小说的大量输入，进而引发读者对中国小说正宗位置的首肯。从鲁迅到钱钟书，现代小说家先通过“林译小说”来了解世界，西洋小说的引入为20世纪中国小说的创作准备了作家，准备了读者。从观念到文体，外国翻译小说的影响至深至巨，它们表现在小说的形式、叙事、语言各个方面。\n\n【李凡关键词：文化生存环境“五四”文学革命 西洋小说引入】","keywords":"","note":"小说取得文学正宗地位，既有之前文化运动的积累，也有外国文学的影响，“五四”文学革命则是一个契机，也就是说，既有内部原因，也有外部原因，以及一个最关键的导火索，大家可以从这三个角度去梳理记忆。"},{"id":"36","stars":"★★","title":"谈谈你对问题小说的认识","body":"问题小说是五四时期出现的剖析社会问题的小说总称，代表作家有冰心、叶绍钧、许地山、庐隐、王统照等。代表作品有《倪焕之》《斯人独憔悴》《海滨故人》等。他们以五四新文化作为参照，重新思考社会人生问题，并通过小说的形式加以艺术的表现。题材广泛涉及到婚恋、教育、就业、家庭、妇女、儿童、社会习俗等问题，具有鲜明的时代气息，追求一些哲理色彩，通常是“只问病源、不开药方”。由于急于要表达作者对现实的批判和对人生的思考，社会功利的倾斜使其不免带有观念化与抽象化的陋病，人物形象被社会问题冲淡，削弱了作品的审美价值。\n\n问题小说在“五四”时期的流行，主要反映了大批知识青年的觉醒，它是当时思想启蒙运动的一种需要，又是当时思想启蒙运动的一种结果。\n\n一、问题小说的成因\n\n（一）“五四”文学革命影响\n\n作为思想启蒙运动的“五四”本身，闪出思想解放的理性之光，它造就了“思考的一代”。\n\n“五四”青年的思想渐渐的转移，趋重于哲学方面，人生观方面。在一段时间内，全社会都来探究“人生究竟是什么”这样严肃的问题，相应的文学作品自然应运而生。\n\n（二）欧洲、俄国表现社会人生为主的作品的直接刺激\n\n1918年《新青年》的“易卜生专号”使这位挪威作家的社会问题剧风行一时，这对“问题小说”是一个推动。\n\n1918年周作人在题为《日本近三十年小说之发达》的讲演中，就颇有倾向性地评介了日本近代文学中“问题小说”的地位，并由此肯定“为人生”的文学。次年2月周作人又写了《中国小说里的男女问题》，明确提出“问题小说是近代平民文学的出产物”，“问题小说所提倡的必尚未成立，却不可不有的将来的道德”。\n\n沈雁冰在“五四”时期所写的评论文章《文学与人生》《自然主义与中国现代小说》里面，更借国外的思潮来提倡“为人生”的“问题小说”。这都对此类小说起到促进作用。\n\n（三）知识分子本身觉醒\n\n旧中国四分五裂，民不聊生，新文化运动又启蒙了中华民族，知识分子遂开始审时度势，直面现实人生与社会，并将诸多问题诉诸笔端。\n\n二、问题小说的特征\n\n（一）强烈的写实性\n\n冰心、叶绍钧、许地山、庐隐、王统照等代表作家的代表作品基本都是写实的，他们都主张文学关心社会、注目现实、探究人生，表现出感时忧国的历史使命感与责任心，他们在问题小说中都寄寓着以人道主义为核心的对“爱”与“美”的憧憬，是现代文学史上最早的一个文学潮流，可称之为现实主义新小说的开端。（李凡说：此处可结合详细作家作品再展开，详见下面单独作家的题目。）\n\n（二）涉及题材广泛\n\n“五四”青年的思想渐渐的转移，趋重于哲学方面、人生观方面。在一段时间内，全社会都来探究“人生究竟是什么”这样严肃的问题，读者要求小说能尖锐地提出他们所关注的各类社会问题，在这种思潮影响下，问题小说涉及当时青年关怀的家庭礼教、婚恋家庭、妇女贞操、劳工、战争、知识者等诸多方面的题材。\n\n（三）形象化不足，比较概念化、空泛化\n\n（1）读者要求小说能尖锐地提出他们所关注的各类社会问题，也并不企望文学一定给予多么明确的回答。因问题的尖锐性是第一位的，相应便减少了对小说形象化的要求，造成许多“问题小说”比较概念化，存在着文笔空疏、人物成为作者某种“主义”的传声筒等弊病。\n\n（2）冰心小说文字虽美，但也有绝对化的一面，庐隐虽写过《一封信》《灵魂可以卖么》这种真正的“问题小说”，但她很快就显示出感伤的自叙传的小说作风。许地山以注重“人生问题”而走上文坛，但他的小说充满了宗教哲理和隐喻的气氛，越是早期离写实主义越远。\n\n总之，20世纪20年代的问题小说是一种特殊的文学现象，它正视社会问题，抒发作者情感，暗示深刻哲理。正式提出人们所关心的人生或社会问题，从而引起疗救的注意，在中国文学史上具有极为重要的独特地位，但问题小说并没有为所提出的问题开出良药，因此具有一定的局限性。\n\n【李凡关键&#x8BCD;：成因“五四”文学革命 表现社会人生为主的作品直接刺激 知识分子本身觉醒 特征 写实性 题材广泛 形\n\n象化不足】","keywords":"","note":"①问题小说这一概念在名词解释中出现的频率非常之高，大家要重点关注一下。** ②问题小说的出现具有进步性，但因为其主要是为了满足“提出问题”的需要，以及处于现代小说早期，所以也有不足，大家要从这两方面去辩证思考，既要关注问题小说的成就，也要注意其作为现代小说开始时期的创作潮流所存在的不足。 ③从文学史角度来看，问题小说其实一直在发展，赵树理也将自己的小说定义为“问题小说”，“文革”之后“伤痕文学”“反思文学”“改革文学”“寻根文学”等也有问题小说的影子。90年代中后期的中国文坛，继续涌现一批反映当前现实社会的问题小说。先是有所谓“新现实主义”冲击波，其代表作家是人称“三驾马车”的谈歌、何申、关仁山。98年左右，文坛上又出现了所谓“社会问题文学”或“社会问题小说”的提法，比如受到舆论瞩目的所谓“下
