词\n\n1．“黄皮书”／“灰皮书”\n\n2．手抄本小说\n\n3．白洋淀诗群\n\n第三节 启蒙主题的重构\n\n一、文艺意识形态的重构\n\n（一）“伤痕”文学论争\n\n（二）“朦胧诗”论争\n\n（三）人性、人道主义和异化问题的论争\n\n（四）关于“现代派”的论争\n\n（五）寻根文学论争\n\n（六）关于“文学主体性”的论争\n\n（七）关于“重写文学史”的讨论\n\n二、观念与方法的革新\n\n（一）方法论热\n\n（二）“向内转”\n\n三、文艺解放中的问题与困惑\n\n第四节 市场化时代文学的多元对话格局\n\n一、市场化时代文学的使命\n\n二、文学的市场化趋向\n\n（一）文学消费时代的初显\n\n（二）自由撰稿人的出现\n\n（三）文学出版物的市场化趋向\n\n三、“人文精神”大讨论\n\n四、市场化时代文学格局的多元性与混沌性\n\n（一）精英写作、大众写作、主流写作的鼎立格局\n\n（二）“新”潮的泛起及其市场化操作\n\n（三）无主潮时代的个人化写作\n\n（四）“主旋律”的复兴和底层写作的崛起\n\n十七年文学","keywords":"现实主义 历史记录者 批判眼光 史家叙写的襟怀","note":"吴浊流小说很明显受到了台湾当时环境以及作者自身的经历和思考的影响，具有突出的现实主义色彩和史诗般的风格，对于其这些创作特征，大家可以结合其代表作品如《亚细亚孤儿》等做具体分析。"},{"id":"274","stars":"★★★","title":"试分析十七年文学的创作特点","body":"十七年时期的新中国文学，依然沿袭了战时文艺的指导思想。在政治立场、思想情感、文学想象、表达方式上的“一体化”，成了新中国初期文学思潮的一个重要特征。由于平等协商和对话的过程短时间内不可能充分展开，这个文学“一体化”的过程，主要是通过政治运动的形式实现的。通过思想批判，通过对文学表达和情感方式的限定，将文学纳入到一个单一的意识形态轨道上。这一时期的文学，主要具备如下特征：\n\n一、以国家政治体制下的无产阶级一革命的人学思想与文学话语为主导\n\n50-70年代，中国文学在谨严并不断趋向纯粹的革命文学规范制约之下，以高度的体制化形态呈现出与20世纪上半叶迥然不同的面貌。为贯彻毛泽东《在延安文艺座谈会上的讲话》精神，文学艺术被认为是无产阶级整个革命事业的一部分，是整个革命机器中的“齿轮与螺丝钉”。文艺为无产阶级政治服务，文艺为工农兵服务，成为从解放区到新中国文艺的方向与旗帜。主导50-70年代中国文学的，是国家政治体制下的无产阶级一革命的人学思想与文学话语：视阶级性为人的本质，以阶级取代个人，以阶级分析的方法判别人的身份、地位与性质，并满怀信心地站在无产阶级的革命立场来完成对于人的革命文学想象。\n\n二、片面强调阶级斗争的教条模式\n\n十七年时期，当身带硝烟的人们从事和平建设以后，文化心理上很自然地保留着战争时代的痕迹，种种战争文化心理特征并没有在战后几十年中得到根本性的改变。在这种文化氛围的制约下，文学观念由军事轨道转入政治轨道，两军对阵的思维模式具体地表现为片面强调阶级斗争的教条模式。\n\n从文学创作的方面来看，当时的大多数作家在军事胜利的鼓舞下，确实有投合战争文化心理的积极性。这一时期战争文化规范在文学观念上的表现--诸如自觉强调文学创作的政治目的性和政治功利性，自觉运用战时两军对阵的二元对立思维模式来构思创作（即敌我阵营绝对分明），自觉强调英雄主义和革命乐观主义，等等，都不同程度地在一些主要创作中体现出来。\n\n三、保留着“启蒙”责任和“文人”意识，运用“民间隐形结构”手法\n\n当代文学史发展中仍有一条“五四”新文学的传统若隐若显地存在着，并支配着知识分子对社会责任和文学理想的追求。这个传统对于中国文学来说，是复活“五四”作家的“启蒙”责任和“文人”意识，以及重建那种重视文学自身价值的立场。这一传统有力地支持了作家们用各种艺术手法来表达对社会的批判性看法，以及对文学真实性的追求。\n\n还有一种值得一提的创作现象是，这时期有许多作家，特别是从解放区文学的传统下成长起来的作家，他们对中国农村的社会生活状况以及农民的文化心理有着深刻的理解，对中国民间文化形态的表现相当娴熟，他们在创作时，或自觉或不自觉地运用了“民间隐形结构”的艺术手法，使作品在为主流意识形态服务的同时，曲折地传达出真实的社会信息，体现了富于生命力的艺术特色。\n\n可以说，当代文学史上的两个传统在特定的历史环境下都起过积极的作用。\n\n总之，十七年文学最主要的特征是与政治联系紧密，具有片面强调阶级斗争的教条模式，但在这狂热的主流之下，仍有一条延续着“五四”新文学传统的潜流，这一明一暗两条线索，共同交织成了十七年文学。\n\n【李凡关键词：“一体化”高度的体制化 无产阶级一革命 片面强调阶级斗争“启蒙”责任“文人”意识“民间隐形结构”】","keywords":"","note":"类似这种有关某一时期文学整体发展状况的题目在当下考查中出现得是越来越多了，这与当下考查朝着综合方向发展密切相关，所以对于现当代各个时期文学整体发展状况，我们要做好梳理。十七年时期，主导文学界的仍旧是战争时期的文艺思想，文学的政治属性被放大，导致文学高度体制化，但在此之外仍有“启蒙”等思想传统在延续。在十七年时期的名词解释，我们需要关注一些重点文学事件如“百花文学”以及相关的“双百方针”、第一次文代会等。"},{"id":"275","stars":"★★★","title":"试分析50年代中心作家的特征（26中南财经政法大学）","body":"总体上看，来自解放区的作家（包括进入解放区和在解放区成长的两部分）和四五十年代之交开始写作的青年作家，是这一时期作家的主要构成。50年代的“中心作家”，他们的“文化性格”出现新的特征。\n\n一、出身和表现区域上从东南沿海向西北、中原转移\n\n从出身的地域，以及生活经验、作品取材等的区域而言，五六十年代的“中心作家”，出现了从东南沿海到西北、中原的转移。“地理”上的这一转移与文学方向的选择有密切关系。它表现了当代文学观念从比较重视学识才情、文人传统，到重视政治意识、社会政治生活经验的倾斜，从较多注重市民、知识分子到重视农民生活表现的变化。这提供了关注现代文学中被忽略领域的契机，也有了创造新的审美情调、语言风格的可能性。不过，对这种“转移”的绝对性强调所导致的对另外的生活经验和美学风格的压抑，也给当代文学带来不可低估的负面效果。\n\n二、明确的目标感和乐观精神\n\n这一时期“中心作家”的多数人，认定文学写作与参加左翼革命活动，是同一事情的不同方面。文学被看做是服务于革命事业的一种独特的方式，他们对于文学自主、独立的观念，会保持高度的警觉，不认为可以把政治活动、社会参与跟文学写作加以区分。他们普遍认为，凭借着“先进的世界观”，作家能够正确地认识、把握客观生活和人的生命过程的“本质”和“规律”；他们所实践的革命和文学，正是体现井阐释着这一发展规律的。因而不存在令他们困惑的悖谬情境，也不可能会有神秘、不可知的领域。明确的目标感和乐观精神，必然是他们作品的基调。\n\n三、文学写作上的准备普遍不足，思想和艺术借鉴的范围狭窄\n\n这一时期作家的“文化素养”，与“五四”及以后的现代作家有着不同的侧重。五六十年代的“中心作家”，大多学历不高，在文学写作上的准备普遍不足，思想和艺术借鉴的范围狭窄。农村、战争和革命运动对中国现代作家来说是新的、重要的经验，但对这些经验的开掘、表现，因文学观念和艺术素养的限制而受到严重制约。写作上传统性的那些“难题”（诸如生活经验到文学创造的转化，虚构能力和艺术构型能力等），在许多作家那里，或者没有自觉意识，或者难以寻得克服的途径。既然拒绝写作“资源”的多方面获取，生活素材与情感体验很快消耗之后，写作的持续便成为另一难题。于是，“高潮”便是“终结”的“一本书作家”，在当代成为普遍现象。\n\n四、强调文学创作的纯粹性\n\n在50到70年代，文学被看做是崇高的，与金钱、商业利益无关的“事业”。作家被誉为“人类灵魂的工程师”，作品则是“生活的教科书”。毛泽东的文学主张，与中国的左翼文学，都有维护“精神产品”的纯洁性的强烈欲望。这种理解，又与40年代“解放区文学”在文学写作、传播、阅读上的特殊方式有关。\n\n五、作家政治地位提升\n\n在十七年时期，文学在社会政治生活中位置显要，作家的社会政治地位比起“旧中国”来其实有很大提升。除了来自文学写作的声誉和实际利益外，从政治权力职务获得的利益越来越占重要位置。不是所有作家都能获得这种政治殊荣，但这标示了一种可供依附、攀援的目标。当然，作家的这种政治地位和经济地位并不稳固。如果对于文学方向和路线表现出离异、悖逆，甚至提出挑战，其社会地位和物质待遇也可以一落干丈。","keywords":"地域转移 明确的目标感 乐观精神 文化素养 非利益性 政治地位","note":"五十年代“中心作家”的特征，与现代文学史上作家有很大的区别，具体表现在地域、写作储备、对待写作的态度和政治地位这些方面，这本质上是与时代更迭、政策改变紧密联系在一起的。所以回答这道题目，需要联系相关的政治内容去理解记忆。"},{"id":"276","stars":"★★★","title":"谈谈十七年小说的整体特征","body":"一、多为长篇小说和短篇小说\n\n十七年时期小说的内部发展，呈现出长、中、短篇小说创作成就不平衡的状态，长篇小说和短篇小说的成就显著，中篇小说创作则非常薄弱。长篇小说具有全方位展示社会图景、把握历史发展规律、表现时代精神的史诗品格。这种审美品格使长篇小说很适宜于作为讲述集体革命事业和社会主义建设实践的宏大叙事文体，因而长篇小说在十七年时期小说创作中成为众多作家重点、全身心投入的小说文体，出现了大量的优秀作品。短篇小说篇幅短小，便于及时、迅速地对现实生活中的变化与问题作出回应，现实感、时代感强，有利于发挥社会主义文学为政治服务、教育人民的\n\n任务，因此也受到作家们的广泛青睐。中篇小说创作则没有形成相对稳定的、有影响的创作队伍，而且只产生了少量的名篇佳作。\n\n二、农村题材和革命历史题材的创作成就更为突出\n\n十七年时期小说的题材大致包括工业、农业、军事、革命历史、少数民族生活等领域。农村题材小说创作的数量、质量和影响在当时的文坛都占有突出地位，在短篇小说领域尤其占有绝对的优势。另一个创作集中的领域是革命历史题材，中国共产党领导人民进行革命斗争的漫长岁月，是这一创作题材取之不尽的审美资源，“发扬革命传统，争取更大光荣”的思想教育意图则是创作的思想动力。\n\n三、小说体式以情节小说和性格小说为主\n\n十七年时期的小说体式以情节小说和性格小说为主要类型，表现出几点共性：&#x60C5;节构成以某一事件的发展过程为基本框架，形成故事化的特征；叙事背景具有较大的时间跨度，事件过程被放在较长的历史时段中来表现，采用全知全能的叙事范式，叙述者具有见证人和评判者的角色特征；结构方式追求宏大规模，流行“楔子（历史背景）一叙事主体（按照情节逻辑顺序展开的故事）一尾声（未来走向）”的结构方式，长篇小说由此显示出故事化和史诗化的普遍特征；中短篇小说也普遍集中于这种情节性格类的小说体式，而且大量出现情节模式化、雷同化的倾向。这一时期对于多种小说体式的艺术探索则几乎处于停滞状态，心理小说、抒情小说、写意小说等体式均受到排斥与忽视。\n\n四、十七年时期的长篇小说形成了三种具体叙事形态：\n\n（一）史诗性长篇小说。这类作品力求在重大历史事件与社会变革的整体叙事中把握时代精神和历史本质，具有“全景式”的时空跨度与宏大的叙事规模，叙事内容强调史实与虚构相交融，叙事立场具有体现历史动向的英雄主义基调。\n\n（二）传奇性长篇小说。这类小说的英雄传奇故事直接来源于现实的革命斗争，着重显示孤胆英雄的大智大勇和革命气概，艺术上以性格单一的传奇英雄人物和充满“巧合”的传奇性故事情节取胜。在20世纪五六十年代，这类小说大行其道，代替通俗小说成为文化市场的宠儿。\n\n（三）以人物历史命运为中心的长篇小说。这类作品是以主人公的人生历程为叙事中心，着意于在革命历史进程中展开人物的“思想成长”。存在于人物命运历程中的爱情、家庭、风俗民情等“非革命”范畴的生活内容经常被牵扯进来，作品由此显示出丰富的情感底蕴和生活气息，也隐含着较为复杂的文化内涵。","keywords":"长篇小说和短篇小说的成就显著 农村题材和革命历史题材 情节小说 性格小说 史诗性长篇小说 传奇性长篇小说 以人物历史命运为中心的长篇小说","note":"十七年小说的整体特征与当时的时代特征联系紧密，大家可以联系当时的时代特征去理解小说创作特征。在记忆时，大家可以联系这一时期的代表作品，如《红旗谱》《百合花》等，联系这些作品在题材、结构等方面的特征，梳理总结十七年时期小说创作的整体特征。十七年时期的小说之中，我们需要重点关注的名词解释是这一时期涌现出来的小说类型，主要是革命历史小说和农村题材小说这两类，以及其包含的一些具体作品如“三红一创、青山保林”，作品中的主要角色如朱老忠、梁生宝等。"},{"id":"277","stars":"★★★","title":"试分析“十七年”小说的通俗性（26北京大学）","body":"“十七年”小说的整体风貌是追求史诗性，具有“颂歌”色彩，但我们也应该注意到，“十七年”小说同样遵循《在延安文艺座谈会上的讲话》中所提出的规范，强调“为工农兵服务”，因而必然显露出通俗性特征，这主要体现在以下方面：\n\n一、鲜明的传奇色彩\n\n传奇，是始于唐的一种叙事方法，它传写奇闻和趣事，重故事和情节，追求故事情节的曲折生动。作者在创作时往往能充分发挥想象，大胆地采用夸张和虚构的本领来叙写故事，所塑造的人物也往往因为富有传奇色彩而为大众喜闻乐见。“十七年”的许多小说往往运用传奇的笔法，描写传奇色彩的革命斗争，将一个个人物塑造成传奇英雄。《林海雪原》就是一曲富有传奇色彩的革命英雄颂歌，《铁道游击队》的作者为我们描写了以刘洪为代表的一群具有非凡飞车本领的铁道战士。另外，《红岩》中使用双枪的“双枪老太婆”，《红旗谱》中朱老巩大闹柳树林、朱老明三告冯老兰、朱老忠济南探狱、严知孝只身闯官府、张嘉庆百步穿杨等等情节也极富传奇色彩，令过目难忘，显露出了鲜明的通俗化色彩。\n\n二、富有乡土风情的语言\n\n（一）乡村土语的使用\n\n“十七年”小说对乡村生活的描写异常真实细腻，尤其是乡村土语的使用成为一大特色。\n\n《山乡巨变》中，周立波很注意运用农村方言土语，如“流水”表示常常，“黄竹筒”代指黄鼠狼；《红旗谱》极富冀中地方特色的语言也为文章增色不少。\n\n（二）诙谐、逗趣的人物对话\n\n“十七年”小说中诙谐和逗趣的话语随处可见，如《山乡巨变》中有着外号“婆婆子”的李主席就是个喜欢逗趣的人，对于任何事情，他都能轻松化解，一笑了之。\n\n（三）民歌、民谣的引用\n\n“十七年”小说作者常常巧借民歌、民谣来展现人物的心理活动。例如，《红日》中，杨军的妻子钱阿菊可以用她的江南山歌来表达她对杨军的爱恋，《苦菜花》中的星梅和纪铁功可以借孩子们的歌谣来诉说着对彼此的相思之苦。\n\n三、民间化的叙事模式\n\n“十七年”的小说往往采用章回小说的古典形式，就叙事而言，继承了传统文学的单线发展的写法，使文学作品布局谋篇的结构艺术呈现出民间化色彩。如《红旗谱》《林海雪原》《红岩》《烈火金钢》中，都有着浓重的古典小说叙事艺术的色调，与《水浒传》中的结构与人物描写方式有不少神似之处；甚至在《青春之歌》《三家巷》这类知识分子题材的作品中，也隐含了诸如“才子佳人”“英雄美人”一类传统叙事模型的变体。这些都强化了小说的民族文化特点与民间审美属性，显露出鲜明的通俗性。\n\n总体看来，“十七年”的小说创作，在情节设置、人物塑造、语言运用和叙事模式这方面都体现出贴近底层、贴近群众的倾向，具有鲜明的通俗性。","keywords":"传奇色彩 乡土风情 乡村土语 诙谐、逗趣的对话 民歌、民谣 民间化的叙事模式","note":"文学的雅俗互动是当下比较关注的一个热点，近年来学界对于通俗文学比如网络文学、底层写作的关注，就体现出了这一点。尤其是近两年来，“新大众文艺”这一概念的提出，更是引发了广泛的讨论。因此，研究现当代文学史，一定不能忽略通俗文学，以及各个时期文学的通俗性。“十七年”小说的通俗性，主要体现在这一时期的小说为了贴近底层群众而呈现出来的传奇化、乡土化、民间化的风貌。相关内容可以参考林惠琴《论“十七年”长篇小说的审美特征》。"},{"id":"278","stars":"★★★★","title":"谈谈你对十七年时期革命历史小说的认识","body":"所谓“革命历史小说”，指的是“在既定的意识形态的规限内，讲述既定的历史题材，以达成既定的意识形态目的”；也就是说讲述的是中共发动、领导的“革命”的起源，和这一“革命”经历曲折过程之后最终走向胜利的故事。\n\n一、“革命历史小说”的特征\n\n（一）“革命历史小说”的作者，大都是所讲述的事件情境的“亲历者”。因为一方面，能够使用文字的“亲历者”自然有追忆这段光荣历史的愿望；另一方面，这一写作不仅是个体经验的表达，更是参与了“革命”叙事在当代的“经典化”进程。因而，这种讲述将会在“真实性”、在是否反映“本质”上受到严格的指摘。这就不是任谁都有“资格”和“条件”涉足这一领域的。\n\n（二）以对历史“本质”的规范化叙述，为新的社会、新的政权的真理性作出证明，以具象的方式，推动对历史既定叙述的合法化，也为处于社会转折期中的民众，提供生活、思想的意识形态规范-是这些小说的主要目的。\n\n二、“革命历史小说”的分类\n\n（一）革命历史小说从书写方式上看，主要有两种类型：\n\n（1）以历史容量的广阔性、时代精神的纵深感为主要目标，呈现宏大叙事形态的革命史诗小说，代表性作品有《红旗谱》《红日》等。\n\n（2）较多吸收传统演义小说的叙述方式，通俗活泼，可读性强，以曲折跌宕的故事情节和脸谱化的人物塑造见长的革命传奇小说，代表性作品有《林海雪原》《铁道游击队》《野火春风斗古城》《敌后武工队》《烈火金刚》等。《青春之歌》那样自传色彩鲜明的革命小说，由于作品中青春成长与革命洪流的紧密结合，也可视为革命史诗的一种特殊类型。\n\n（二）就表现对象与无产阶级革命力量的关系来看，革命历史小说又可以大体分为三个方面：\n\n（1）反映党直接领导下的革命斗争历史，包括书写战争史的《保卫延安》《红日》《林海雪原》《敌后武工队》等，表现革命者地下斗争的《红岩》等。\n\n（2）反映革命的主要依靠力量-农民在革命历史中的成长与命运，以《红旗谱》为代表。《李自成》虽说写的是古\n\n代历史，但具有农民革命的“前史”意义，也可归入此类。\n\n★★【李凡说：“革命历史小说”这一概念多数情况下会以名词解释的形式出现，或是直接考查其中的某部作品，但有的院校也可能单独针对“革命历史小说”这一概念出简答或论述题，所以大家需要对相关内容有所了解，大家要重点关注的是革命历史小说的特征及其分类，必要时可以适当结合作品进行分析。】★★","keywords":"“亲历者”规范化叙述 作出证明 革命史诗小说 革命传奇小说 直接领导 农民 知识分子","note":""},{"id":"279","stars":"★★★★","title":"简述当代文学“红色经典”的美学特征（25中国人民大学）","body":"【答题框架】\n\n“红色经典”用来指称20世纪40年代末至70年代末产生的，反映中国共产党领导下的社会革命运动及工农兵生活，典范地实践《在延安文艺座谈会上的讲话》确立的文学规范的一批创作，以“三红一创，青山保林”为主要代表。这些长篇小说肩负着“国家政治生活审美化”的重大时代使命，在主题观念上更加契合国家意识形态的要求，成就了革命历史与现实政治生活的经典性的想象和记录。\n\n一、作者大部分是事件情境的“亲历者”\n\n“红色经典”的作者，大都是所讲述的事件情境的“亲历者”。因为一方面，能够使用文字的“亲历者”自然有追忆这段光荣历史的愿望；另一方面，这一写作不仅是个体经验的表达，更是参与了“革命”叙事在当代的“经典化”进程。因而，这种讲述将会在“真实性”、在是否反映“本质”上受到严格的指摘。这就不是任谁都有“资格”和“条件”涉足这一领域的。\n\n二、以证明中国社会主义道路的正确性为创作目的\n\n以对历史“本质”的规范化叙述，为新的社会、新的政权的真理性作出证明，以具象的方式，推动对历史既定叙述的合法化，也为处于社会转折期中的民众，提供生活、思想的意识形态规范-是这些小说的主要目的。新中国是怎样建立起来的，中国革命是怎样通过党的领导、在曲折艰难中走向胜利的，中国人民如何参与了这样的历史进程，他们身上发生了怎样深刻的历史变化，关于这些问题的文学表达，不仅联系着那些亲历了历史转折的作家们的自我缅怀，同时，也是一种证明和标示：中国走社会主义道路具有无可争议的历史必然性。\n\n三、结构规模宏大，追求史诗性\n\n“红色经典”在结构上往往规模宏大，多数作品有意识地追求“三部曲”“多部曲”结构，如欧阳山的《一代风流》规划了长达五部的规模，周而复的《上海的早晨》是四部，梁斌的《红旗谱》之后也紧跟着《播火记》和《战寇图》，冯德英在《苦菜花》之后又计划写作《山菊花》《迎春花》，杨沫的《青春之歌》之后也有续作《芳菲之歌》《英华之歌》，等等，这些无疑强化了长篇小说的文体概念，扩展了其“史诗”与“画卷”的美学内涵。\n\n四、具有民族文化特点与民间审美属性\n\n由民族化的追求和审美习惯中的“集体记忆”所决定，“红色经典”不同程度地隐含了中国传统与民间叙事中的若干模型，同时也接续了古典小说叙事状物、塑造人物的某些特有的方法与风神。如《红旗谱》《林海雪原》《红岩》《烈火金刚》\n\n中，都有着浓重的古典小说叙事艺术的色调，与《水浒传》中的结构与人物描写方式有不少神似之处；甚至在《青春之歌》《三家巷》这类知识分子题材的作品中，也隐含了诸如“才子佳人”“英雄美人”一类传统叙事模型的变体。这些都强化了小说的民族文化特点与民间审美属性。\n\n五、宏大而壮美的总体风格\n\n这一时期的长篇小说在文体和美学上均达到了比较“成熟”的境地，关于历史和现实的想象方式开始趋向定型化，产生了一套比较完整的结构、叙述和修辞的方法，并且形成了一种中国当代特有的“革命小说美学”。对“史诗性”的追求、主要人物形象的“成长”属性、传奇的故事，以及在胜利或者阶段性胜利处结尾的书写方式，等等，所有这些共同形成了红色叙事所特有的宏大而壮美的总体风格。\n\n“红色经典”在一定程度上客观反映了1949年后一段时期内人们在革命理想主义激励下所焕发出的热情，在中国当代文学史上占据着重要的地位。","keywords":"亲历者 证明中国社会主义道路的正确性 创作目的 规模宏大 史诗性 民族文化特点 民间审美属性 宏大而壮美的总体风格","note":"“红色经典”以“三红一创，青山保林”为主要代表，某种程度上其实可以与“革命历史小说”画上等号。“红色经典”可以说是“十七年”文学的典型代表，在主题观念受到了社会意识形态的强烈影响，在艺术追求上也明显朝着《讲话》的文学规范靠拢。近年来，关于“红色经典”这一称谓的争论还是比较多的，争论的核心主要在“经典”一词的使用是否恰当。但无论如何，作为一个时期文学的集中体现，相关内容我们还是要了解并重视的。"},{"id":"280","stars":"★★","title":"十七年时期战争小说的特征","body":"一、作者绝大多数来自解放区\n\n战争小说的作者绝大多数来自解放区，主要是军队里的随军记者和部队文艺工作者，也有个别作家直接担任过军队的指挥工作。他们既是战争的目击者，也是战争的参与者，特殊的战争经历和特殊的文化背景，影响了他们特殊的文学创作风格。他们的出现不仅充实了新文学以来的作家队伍，同时还改变了新文学的传统格局：他们除了自身的战争生活经验以外，还带来了把他们滋养成作家的战争文化的背景。也就是说，他们在战争文化背景下不仅获得了有关战争的知识，而且获得了认识战争和表现战争的美学观。\n\n二、全心全意地赞美和歌颂革命战争中涌现出来的战斗英雄\n\n作家不再以知识分子的启蒙主义立场和视角去描写战争。在新的历史环境下，启蒙主题被迅速淡化或压缩到很不重要的地位，作家们全心全意地赞美和歌颂革命战争中涌现出来的战斗英雄。虽然战斗英雄不久前也可能是穿上军装的农民，但当他们投入了革命战争后就被认为是无产阶级革命行列中的一员，因而必须用无产阶级革命战士的标准来塑造他们。英雄的成长一般被表现为从不够成熟到成熟，不再表现因为自身带了旧时代遗留下来的沉重精神负担而进行自我灵魂搏斗的过程。\n\n三、“两军对阵”的思维模式\n\n战争形态使作家养成了“两军对阵”的思维模式，因为战争往往使复杂的现象变得简单，整个世界被看作是一个黑白分明正邪对立的两极分化体。这种由战场上养成的思维习惯支配了文学创作，就产生了“二元对立”的艺术模式，具体表现在艺术创作里，就形成了两大语言系统-“我军”系统和“敌军”系统。“我军”系统是用一系列光明的词汇组成，“敌军”系统是用黑暗的词汇组成。这两大语言系统归根结底可以用“好人一切都好”“坏人一切都坏”的模式来概括。在实际的创作中，这两大语言系统是不允许被混淆的。这种“二元对立”艺术模式在当代各类创作中都是存在的，但因为战争题材最符合它的特征，所以表现得最为充分。\n\n四、英雄主义、乐观主义的创作基调\n\n由于战争是以辉煌胜利宣告结束的，战争帮助人们实现了建立新的社会秩序的美好愿望，所以英雄主义、乐观主义的创作基调被作为固定的审美模式，并以此形成了统一的审美风格特征。它表现为强调战争的最终胜利意义，将过程的意义溶解到最后的结果中去，将个体生命的价值溶解到集体的胜利中去。因此，中国当代战争小说重在表现战争中的群体风貌、战争的整体和现实结果。与此相应的是，中国作家对战争中大量存在的暴力、血腥的回避，对英雄之外的大量普通个体命运和生命价值的忽视--这都是现代战争文化规范对作家主体制约的结果。","keywords":"作者绝大多数来自解放区 赞美和歌颂战斗英雄“二元对立”的艺术模式 英雄主义 乐观主义","note":"战争小说是十七年时期革命历史小说中十分重要的一部分，“三红一创，青山保林”八部作品中就有三部是战争小说，可见其重要性。十七年时期的战争小说毫无疑问是受到了作家战争经历的影响，这一影响表现在题材、艺术手法、整体基调等多个方面。大家可以从这些方面去切入，理解十七年时期的战争小说特点。"},{"id":"281","stars":"★★★","title":"试将两部军事题材长篇小说《红日》和《保卫延安》进行比较论述","body":"《红日》和《保卫延安》都是十七年时期涌现出来的经典革命历史小说，二者都是以战争故事为主要题材，在战争叙事上有许多相似之处，但在具体的美学观念上，则表现出了许多不同，细细比较之下，二者之间的异同主要表现在以下方面：\n\n一、相同点\n\n（一）宏大的战争叙事\n\n《保卫延安》第一次在较大规模上全景式地描写了整个战役的全过程。它通过青化砭伏击战、蟠龙镇攻坚战、长城线上的运动战以及沙家店歼灭战等不同类型的战斗场面，很生动地表现出各种类型的战争的特征。作家也没有孤立地写陕北战场，他把这场对中国的政治大决战有着决定性意义的延安保卫战置于全国性战争的大背景中，展现出中国人民解放军由战略防御转入战略进攻的宏大军事画卷。在描写战争的规模和丰富性上，这部作品具有典范意义。\n\n吴强的长篇小说《红日》同样在用艺术形式表现重大战役方面作了较好的探索。它以1947年山东战场的涟水、&#x83B1;芜、孟良崮三个连贯的战役作为情节的发展主线，体现出作者对战争小说的“史诗性”的艺术追求，即努力以宏大的结构和全景式的描写展示出战争的独特魅力。\n\n（二）出色的人物塑造\n\n《保卫延安》从英雄主义的审美原则出发，塑造了周大勇、王老虎等英雄形象，这些近于完美的英雄形象并不是靠空洞的赞美词树立起来的，而是通过战争的惨烈、环境的残酷、生死的考验，用力刻画出英雄人物摧枯拉朽、九死一生的传奇色彩。在当时的创作环境中，这部小说比较完整地体现了战争文化规范下的审美特征。\n\n《红日》同样刻画了从军队高级将领到普通士兵的多层次的丰富的人物群像以及他们的包括爱情生活在内的丰富的内心活动，塑造了一系列经典英雄形象。\n\n二、不同点\n\n《红日》虽然与《保卫延安》有许多相似之处，但在具体文学观念上，《红日》又有了新的发展，具体表现如下：\n\n（一）《红日》以宏大的现代战争场面的描绘替代传统战争小说中的传奇性故事\n\n传奇性故事的叙述一般只适合于讲述较小规模的游击战争，而无法自如地正面展现大规模的现代战争场景。即使像《保卫延安》这样有意识地展现大规模现代战争的作品，还是在相当程度上依赖于传奇性的魅力。\n\n而《红日》则突破了以往传奇小说将着墨重点放在“连队”上的写法，直接以中共一支“常胜英雄军”与国民党的王牌军之间展开的大规模战役为叙述中心，将笔触从军师团一直延伸到连、排、班，从高级将领写到普通战士，从军队写到地方，从前方战场写到后方医院，视野开阔而层次分明，场面宏大而结构紧凑，应该说在叙事上是非常有特色的。\n\n（二）人物塑造更加深入\n\n《保卫延安》虽然也塑造了一系列经典人物，但主要集中于对我军英雄形象的歌颂，对敌人并未做深入刻画，整体还是显得脸谱化。\n\n《红日》对战争环境中人物性格的丰富性有较好的刻画，突破了当时同类创作中存在的局限。这除了指小说刻画了从军队高级将领到普通士兵的多层次的丰富的人物群像、他们的包括爱情生活在内的丰富的内心活动外，还体现在下列两个方面：一是注意对人物的文化背景和历史性的揭示。在刻画我军官兵形象时，作家没有把他们写成十全十美的完人，而是在表现他们的英雄行为时，也十分注意表现他们的七情六欲，挖掘他们自身的性格弱点，以及在战争进程中人物精神上的自我斗争。二是小说对敌对人物形象的刻画并没有采用当时流行的漫画化方式，而是较为真实地写出了他们作为具有不同政治立场的军人的责任感、作战才能甚至作为人的良心。\n\n（三）对战争观念的偏离\n\n《红日》中用大量的篇幅反映非战争的现实场景，以此来衬托现代战争，使对战争的叙述更加丰富生动。这一方面使小说叙述有张有弛，快慢协调，使读者获得一种阅读上的快感；另一方面，这些舒缓明朗的非战争场景和细腻感\n\n人的爱情画面，本身就是对战争暴力的一种对照，它的叙述行为就是对和平生活的向往和美好人性的呼唤，客观上是对当时的战争观念的一种偏离。","keywords":"宏大的战争叙事 英雄主义的审美原则 宏大的现代战争场面 人物性格的丰富性 对战争观念的偏离","note":""},{"id":"282","stars":"★★","title":"谈谈《林海雪原》的艺术特征","body":"《林海雪原》在浪漫传奇的审美趣味上统一了战争小说的一般艺术特点，使原来比较刻板、僵硬的创作模式融化在民间的趣味下。这部作品的艺术特征，主要表现在以下方面：\n\n一、在突出角色英雄特征时借鉴了民间小说传奇手法\n\n对英雄人物的塑造是《林海雪原》的一大特色，但与一般的战争小说相比，虽然作家在表现剿匪小分队战士的英雄特征时也注意到了所谓“阶级本质”等程式，但在人物性格配置上又受到了民间传统小说的“五虎将”模式这一隐形结构的支配。五个主要角色身上各突出一种主要性格，有的是忠，有的是勇，有的是谋，有的是技（才），有的是德，等等，有主有次，互为衬照。英雄个个性格鲜明，传奇经历也不重复，以致读者读罢掩卷，脑子里留下了个个鲜活的印象。因为是明显借鉴了民间小说的传奇手法，所以读者也不会在真实性上过于苛求，完全能够接受这样的艺术处理。\n\n二、“两军对阵”的思维模式\n\n在结构布局上，《林海雪原》也带有比较明显的“两军对阵”的思维模式，而且在传奇的意义上更加夸张了所谓“好人特别的好，坏人特别的坏”的模式，比如小说里漂亮多情的女卫生员白茹与丑陋淫乱的女土匪蝴蝶迷就形成了鲜明的对照。传奇作品本身具有追求情节的曲折生动与故事的浪漫夸张的传统，《林海雪原》中正反两方的强烈对比明显强化了这种艺术效果。\n\n三、英雄主义和乐观主义的基调\n\n《林海雪原》虽然也表现了土匪极其残忍的本性和解放军战士的英勇牺牲精神，但在描写主要英雄人物时始终洋溢着英雄主义和乐观主义的基调。奇袭虎狼窝、智取威虎山、会师百鸡宴、周旋绥芬草甸、大战四方台等，情节惊险神奇、诡异多变。小分队如天兵天将，所到之处战无不胜。具体的情节，如活捉“一撮毛”刘维山、“小炉匠进山”、杨子荣打进威虎山、小分队消灭座山雕等，既表现了人民解放军的神勇，也达到了引人入胜的艺术效果。特别是对杨子荣这个孤胆英雄的塑造，更为作品平添了一股豪迈和侠义之气。","keywords":"“五虎将”模式“两军对阵”的思维模式 英雄主义和乐观主义的基调","note":"《林海雪原》作者曲波本人虽只有小学文化，自称“文字水平很低”，但却写出了一部极畅销的小说，这几乎是一个奇迹。这个“奇迹”除了意识形态的某些规定性的影响之外，主要得益于其叙事上典型的“类传奇性”，也即在战争叙事中吸取民间艺术手法，这也是这部作品最大的特征。"},{"id":"283","stars":"★★","title":"谈谈《红岩》的创作特征","body":"一、充分政治化的“组织生产”\n\n《红岩》约十年的成书过程，是当代文学“组织生产”获得成功的一次实践。《红岩》的创作动机是充分政治化的。作者从权威论著、从更掌握意识形态含义的其他人（通常是政治领导人，或文学界权威作家）那里，获取对原始材料的提炼、加工的依据，放弃“个人”的不适宜的体验，而代之以新的理解和艺术方式。因而，从某种意义上说，《红岩》的作者是一群为着同一意识形态目的而协作的书写者们的组合。\n\n二、极端的二元对立\n\n《红岩》以对“革命”的更具纯洁性的追求，来实现对四五十年代之交这一历史时间的“本质”的讲述。它以更加分明、强烈，更带象征性，也更带“人生哲理”的方式，来处理这一事件和它所赋予的种种含义。在这部小说中，革命者与敌人的关系被安放在两个政治集团、两种人生道路和两种精神力量的较量的格局中。人物思想、性格，他们的言行、心理的刻画，不再存在任何幽深曲折而彻底“透明化”。英雄人物的意志、信仰所焕发的精神力量，在肉体\n\n摧残和心理折磨下的坚定、从容和识见，反面角色的狡诈、残忍、虚张声势然而恐惧、绝望，在作品中都做出对比分明且有层次的，推向“极致”的描述。\n\n三、结构宏伟而严谨，线索纷繁而清晰\n\n《红岩》设计了集中营的狱中斗争、重庆城内的地下工作与学生运动、农民根据地的武装斗争三条线索，把历史背景和生活场景展开得相当广阔；同时，小说又以《挺进报》的斗争将这三条线索联结起来，并且最终汇聚在狱中斗争上。小说的前10章在新中国即将成立、蒋家王朝面临灭亡的背景上描写了重庆市地下斗争和农村武装斗争，反映出时代发展的必然趋势。由甫志高叛变，许云峰、江姐等革命者被捕，作品很自然地转入到后20章的狱中斗争；狱中斗争又以刘思扬的一放一抓，把渣滓洞与白公馆、狱内和狱外的斗争联系在一起。\n\n四、注重人物心理的刻画和环境氛围的烘托\n\n《红岩》中，江姐突遇丈夫被杀的思想活动，成岗被注入“诚实剂”时的思绪，刘思扬遇到“红旗特务”时的心境，小萝卜头的幻想，都得到了准确而细腻的表现。监狱总体上阴森、冷酷的气氛和随斗争干变万化而表现出来的环境氛围，也都被作者巧妙地表现出来。主要英雄人物在最后的搏斗中全部光荣牺牲，更使全书笼罩着悲壮、崇高的精神色彩。","keywords":"“组织生产”“本质”的讲述 宏伟而严谨 纷繁而清晰 心理的刻画 环境氛围的烘托","note":"《红岩》因为江姐而广为流传，为人们所熟知，不过在几部革命历史小说中考查相对较少，但有一些细节我们也需要注意，其中最重要的是其“组织生产”的创作模式，这在几部革命历史小说中是独一份的，“文革”时期的创作模式就明显受到了其影响。同时，这部作品在思想和艺术上的特色，我们也不能忽视。"},{"id":"284","stars":"★★★","title":"《红旗谱》的艺术特色","body":"《红旗谱》的艺术成就是多方面的，它具有浑厚、浓烈而深沉的风格特征。但作品最为人所称道的是对于民族风格、民族气魄的探索与追求。\n\n一、表现了中华民族勤劳勇敢、不甘屈服的民族精神\n\n作者深刻地揭示了共产党和劳动人民的精神血缘谱系，表现了中华民族勤劳勇敢、不甘屈服的民族精神，从朱老忠、严志和到江涛、运涛这一系列人物形象的身上，可以看到民族传统的继承和新时代的影响。锁井镇农民几代人的斗争，无论从内容还是斗争方式上，都带有民族的传统色彩。这是构成小说民族风格的基本因素。\n\n二、善于把激烈的阶级斗争与北方农村的生活习俗、自然风光结合起来描写\n\n《红旗谱》对脯红鸟事件、大贵杀猪的描写，既展现出欢快的生活场面，烘托了人们的生活情趣，又表现了因之引起的激烈斗争，揭示了其中包含的政治内容。正因为“描绘这些斗争是在一系列‘柴门临水稻花香＇的乡土风物的图卷之中，尤其是在继承了“燕赵多慷慨悲歌之士”的民族传统精神下所表现出来的新时代田野英雄的性格”，作品的民族风格就表现得格外鲜明而厚重。\n\n三、结构上多采用短章节，语言为群众语言\n\n《红旗谱》在结构布局上，运用相对集中的短章节来组织故事和安排人物，在充满激烈斗争的大事件中又穿插许多有意义的生活小故事，大小故事环环相扣，使全书故事连贯，主干突出，层次分明。小说在语言运用上，很注意选择精彩的群众语言，语言风格朴实、通俗、生动、浑厚，还常常采用农民的口吻进行描述，这些也都有助于民族风格的形成。\n\n从以上这些方面，我们可以看到《红旗谱》在寻找着阶级斗争观念、主题和乡村风俗、传统文本的联结。这种联结被作者本人和批评家称为小说的“民族气魄”。这包括不同性格人物的对比性设计，主要人物性格中的“慷慨侠义”的“江湖”特征，也包括生活情景和文本构造的地方的、“民族”的色彩。中国古典小说（《水浒传》《红楼梦》等）在《红旗谱》中，提供了表现方法上的借鉴，也参与了人物性格、行为的构成。对这一地区的民间语言的运用，也加强了小说表现的生活的历史连续性，而多少缓和了观念、主题阐释上的坚硬、紧张的程度。\n\n【李凡关键词：精神血缘谱系 民族精神 生活习俗 自然风光 精彩的群众语言 民族气魄】\n\n【李凡&#x8BF4;：《红旗谱》与《红日》《红岩》等作品不同的点在于，这部作品在注重表现革命斗争的同时，也关注民间，包括民间性格、民间环境以及民间习俗--这也是其民族气魄的成因，对于这一点，大家要认真掌握。除以上内容之外，《红旗谱》还显示出“英雄谱系化”，不过这一点在考查中出现较少，大家可以在李凡文学正版群中领取相关内\n\n容进行拓展。】","keywords":"","note":""},{"id":"285","stars":"★★★","title":"谈谈《红旗谱》中朱老忠的形象","body":"朱老忠是作品中塑造得最为成功的典型形象。这是一个横跨新旧两个历史时代的人物，在他身上既有旧时代农民起义英雄的传统性格，又接受了新时代的无产阶级革命精神，他的思想性格深刻地概括了20世纪中国劳动人民的英雄品质和历史命运。\n\n一、核心特征：战斗精神\n\n朱老忠性格的核心特征，是具有强烈的阶级爱憎和有勇有谋、坚忍不拔的战斗精神。朱老忠闯荡关外多年，每当想起血仇未报，心上就“一剜一剜地痛”。但回乡后他并没有逞血性之勇，而是有一个“一文一武”的复仇计划，有“出水才看两腿泥”的韧性和决心，显示出深远的胆识和谋略。这种性格特征在脯红鸟事件、大贵被抓壮丁等故事情节中，得到了充分的表现。\n\n二、急公好义、扶危济困的道德品质\n\n朱老忠又有中国民间所尊崇的急公好义、扶危济困的道德品质，豪爽，讲义气，秉持“为朋友两肋插刀”的生活信条。朱老明同地主打官司气瞎了双眼，孤苦伶仃，他立即掏出10块血汗钱给朱老明治病，他卖牛犊资助江涛上学，帮助严志和主持老奶奶的丧事；运涛被捕，他又徒步到济南探监，表现出对阶级兄弟的义重如山情深似海。对运涛和春兰爱情的关心及运涛入狱后对春兰的开导，又表现出他对青年人的体贴入微，充满了劳动人民的人情味。朱老忠身上的农民传统英雄性格因素，显示出作品在人物性格刻画上的深度和广度。\n\n三、性格经历了成长和发展的过程\n\n朱老忠的性格又是成长和发展的，只有在中国共产党所领导的有组织的集体斗争反割头税和保定二师学潮中，他才实现了思想的飞跃。在反割头税事件中，他获得了“没有共产党的领导，要想打倒冯老兰，是万万不能”的深刻感受；在保定二师学潮失败的时刻，他英勇机智地救出了张嘉庆，劝导了悲观失望的严志和。这时，他那“出水才看两腿泥”的坚韧性格和“为朋友两肋插刀”的侠义精神，转化成了革命战士的斗争信念和英雄气概。\n\n朱老忠是“一个兼具民族性、时代性和革命性的英雄人物的典型”，无论在审美视野还是思想深度上都体现了当代文学艺术创造的新高度。朱老忠的形象全面而历史性地揭示出农民与革命之间的深刻、必然联系，他的人生体现了农民必然走向革命的历史道路，他的“性格发展史”就是中国农民从自发到自觉的革命性的发展史。","keywords":"战斗精神 急公好义 扶危济困 成长和发展 英雄人物的典型","note":"朱老忠性格的发展史就是中国农民思想发展史的缩影，这也是朱老忠被视为典型的原因所在。从具有民族性的急公好义、战斗精神到具有革命性的斗争信念、英雄气概，朱老忠实现了思想上的飞跃，成为了一个典型的革命英雄形象。这部分内容，我们要掌握。"},{"id":"286","stars":"★★★","title":"试分析《青春之歌》中林道静这一形象","body":"一、林道静这一形象表现了一代知识分子的“心路历程”\n\n林道静走向革命的嬗变过程，基本符合生活逻辑和人物的性格发展逻辑，与“五四”新文学中追求个性解放、独立、自由的新女性形象有很多一致的地方。小说一开篇，林道静就是一个出走的娜拉形象。但同时，林道静还具有“超越”娜拉的地方。在“五四”时期，“娜拉”一般都是从“父亲的家”出走到“丈夫的家”，但这只是林道静的起点：她再次从丈夫的家中出走，投入阶级这一更大范畴的家。作为那个时代标准的革命成长叙事中的主人公，林道静完全符合当时的政治体制对知识分子进行改造的种种规定：一个出身剥削阶级的小资产阶级知识分子不仅反抗封建家庭，同时也与个性解放、个人主义的思想决裂，在彻底的自我改造完成后走向革命。因此，林道静的经历被认为是一代知识分子的“心路历程”。\n\n二、林道静这一形象符合革命者成长的规范\n\n林道静成长过程的每一个环节也的确都符合革命者成长的规范--苦大仇深，离家出走，在共产党人引导下追求革命，克服自己的种种局限、不足，被捕入狱，经受严峻的政治考验，最后成为合格的共产党员。因此，《青春之歌》正是“革命历史题材”中的另一种类型，对正统革命历史题材创作构成有效补充。\n\n三、林道静这一形象昭示了现代知识分子应走的正确道路\n\n林道静是一个成长中的人物，她的思想性格是在逐渐走上革命的曲折人生道路和艰难的锻炼改造中成熟起来的。小说通过她与“胡适派”分子余永泽、中国共产党人卢嘉川和江华之间的爱情抉择，来昭示现代知识分子应走的正确道路。\n\n余、卢、江皆为北大学生，余与卢、江之间的分野，寓示“五四”高潮之后中国知识分子的分化，即以胡适为代表的自由知识分子与左翼革命知识分子的不同阵营。余永泽选择的是追随胡适，卢嘉川和江华则走向了马克思主义、走向了共产党。作家把林道静置于历史分流的空间中，通过她的思想与情感变化，通过她的爱情抉择，对新文化方向与知识分子道路又一次作出了革命性判断。","keywords":"新女性形象 革命者成长的规范 正确道路","note":"林道静这一形象与“五四”时期新女性形象有很多相似的地方，但又有许多区别，造成区别的原因主要是社会环境的变化。而这些变化主要表现在林道静进行了更深入地“成长”，她的经历也符合革命者成长的规范。《青春之歌》这部作品正是想通过林道静的成长与选择，揭示现代知识分子应走的道路。"},{"id":"287","stars":"★★★","title":"《青春之歌》的艺术特点","body":"《青春之歌》是我国当代文学史上第一部描写学生运动、反映知识分子成长道路的优秀长篇小说，其艺术特点表现为：\n\n一、“革命＋恋爱”模式\n\n《青春之歌》是通过林道静的青春成长史来展开的，小说接过了久违了的左翼革命文学的“革命＋恋爱”模式，把林道静的情感生活与革命性成长融合在一起，通过她与胡适派分子余永泽、共产党人卢嘉川和江华之间的爱情抉择，形象地昭示了中国现代知识分子应走的正确人生道路。\n\n余、卢、江皆为北大学生，余与卢、江之间的分野，寓示五四高潮之后中国知识分子的分化，即以胡适为代表的自由知识分子与左翼革命知识分子的不同阵营。作家把林道静置于历史分流的空间中，通过她的思想与情感变化，鲜明地标示出中国知识分子应该走哪一条路，同时也对新文化方向与知识分子道路又一次作出了革命性判断。\n\n二、严肃信念与坚定信仰\n\n在《青春之歌》中，早期革命文学中那种带有一定个体色彩的革命罗曼蒂克作风被涤荡得较为干净，取而代之的是站在当代无产阶级革命思想高度上形成的严肃信念与坚定信仰。\n\n小说在否定戴愉、余永泽、白莉萍等的选择的同时，通过林道静的“成长”来指认知识分子唯一的出路：在无产阶级政党的引领下，经历艰苦的思想改造，从个人主义到达集体主义，从个人英雄式的幻想，到参加阶级解放的集体斗争-也即个体生命只有融合、投入以工农大众为主体的革命中去，他的生命的价值才可能得到证明。\n\n三、生活细节真实，心理描写细腻\n\n《青春之歌》的艺术成就主要表现在人物形象的塑造上，小说以作者杨沫自己的生活经历为原型，展示了女性知识青年林道静走上革命道路的全过程。由于作品在很大程度上算得作者的自传，所以生活细节真实，尤其是女主人公林道静纷繁复杂的心理世界，描写得极为细腻，具有很强的艺术感染力。\n\n四、结构严谨完整，语言简洁流畅\n\n小说的结构也严谨而完整，虽然涵盖了广阔的社会生活、人物、事件和场景，但始终以林道静等革命青年的成长作为贯穿的线索，显得主干突出而枝叶丰茂。小说的语言简洁流畅，富于热情。","keywords":"革命＋恋爱模式 严肃信念与坚定信仰 生活细节真实 心理描写细腻 结构严谨完整 语言简洁流畅","note":"《青春之歌》在创作特征上既有“五四”时期某些因素的留存，又受到十七年时期创作规范的强烈影响。“五四”因素的残留主要体现在“革命＋恋爱”这一形式上，而十七年创作规范的影响则主要体现在其情感内涵与价值判断之中。在《青春之歌》相关研究中，有学者对其“潜叙事”也进行了分析，具体内容可以在李凡文学正版群中领取。"},{"id":"288","stars":"★★","title":"《三家巷》的艺术特征","body":"一、社会分析的叙事模式\n\n《三家巷》在整体思路上采用了社会分析的叙事模式，但作家没有正面描写中国现代史上的重大历史事件，而是别出心裁地塑造了一个远离斗争漩涡、并不具备革命者成长要素的“典型环境”三家巷，来作为当时20世纪20年代广州乃至整个\n\n中国社会的缩影。周、陈、何三家关系的破裂，生动地反映出了革命进程中各种阶级力量的消长。作家在这样一个包括血缘、婚姻和社会各种关系的人物关系网中，表现革命对人物的影响和人物对革命的态度，体现革命运动的深化和各种阶级力量的分化，客观上打破了现代历史叙事把阶级关系和阶级矛盾简单化、庸俗化的思维定式。\n\n二、展现了相当广阔的社会生活画卷和各个阶层的人物\n\n围绕周炳的生活道路这条主线，作品展现了相当广阔的社会生活画卷，既有下层人民生活的写照和农村贫苦百姓的痛苦呻吟，更有上层社会的荒淫无耻和反动腐朽。社会各阶层各式各样的人物，也在这生活画卷中得到了生动的表现。无论是正面人物还是反面人物，《三家巷》都刻画得入木三分，尤其是新型买办资产阶级陈文雄的典型形象。他气宇轩昂，才华横溢，凡事都有自己的见解，既反共又不露声色，以“中立”的姿态和“雍容”的风度来达到不可告人的罪恶目的。作品对陈文雄本质和个性的揭示很注意分寸，因此这个人物的性格既真实而又有深度。\n\n三、在叙事方式和语言格调上具有传统“才子佳人”言情小说的色彩\n\n《三家巷》叙述方式和语言格调，流露出传统“才子佳人”言情小说的色彩。与周炳的思想和性格构成直接关系的，是区桃和陈文婷两个女性。区桃是一个寄托着作家审美理想的南国美女形象，她的香消玉殒激发了周炳的斗志。资产阶级小姐陈文婷与铁匠出身的周炳并无思想上的相通之处，她为周炳漂亮的外貌和缠绵的性格所吸引而热烈追求。作者在描写周炳与区桃相恋的过程贯穿了一系列迷人的南国民俗，增强了作品的艺术感染力。\n\n四、新颖独特的民族风格\n\n《三家巷》十分重视对地方生活风貌的精细描画，善于把故事情节和人物性格成功地化进富有地方色彩的生活画面中；也善于采用白描的手法，通过语言、行动展开情节和人物的描写；还有意识地把普通话、广东方言和古人语言熔为一炉，增强了语言的丰富性和表现力，使作品的生活气息和地方色彩显得更加浓烈。","keywords":"社会分析的叙事模式 广阔的社会生活画卷 各个阶层的人物 言情小说的色彩 新颖独特的民族风格","note":"《三家巷》在艺术上与当时的革命历史小说具有相似的美学追求，但却显示出了许多独特的创作个性，从这部作品中，我们可以看到茅盾“社会剖析小说”似的全方面展示、剖析社会的追求，也可以看到鲜明的民族色彩，这也是这部作品令人瞩目的原因。"},{"id":"289","stars":"★★","title":"试分析《百合花》的艺术特征","body":"短篇小说《百合花》给当时文坛带来一股沁人的清香。其成功就在于作家在表现革命战争、军民关系这类庄严主题时，突破了当时流行的条条框框，显现出清新俊逸的风格。这部作品的艺术特征，主要表现在以下方面：\n\n一、整体风格清淡、精致、美丽\n\n《百合花》的清淡、精致、美丽，在五六十年代的战争小说中是绝无仅有的。它以战争为背景，描写了部队一个年轻的通讯员与一个才过门三天的农村新媳妇之间近于圣洁的感情交流。作家的创作目的很明确也很坚定，那就是表现战争中令人难忘的、而且只有战争中才有的崇高纯洁的人际关系，与通过这种关系体现出来的人性美和人情美。因此，作品取材于战争生活而不写战争场面，涉及重大题材而不写重大事件。战争的枪林弹雨只是为了烘托小通讯员与新媳妇之间诗意化的“没有爱情的爱情牧歌”。\n\n二、通过生活的侧面写生活中的普通人\n\n通过生活的侧面写生活中的普通人，写日常生活中的“家务事”“儿女情”，这是茹志鹃一生为数不多的短篇小说的一个重要特点。《百合花》是她早期作品，虽然写的是战争，却已经包含了刻画普通人的感情世界的美学追求-那连名字也没有的小通讯员和农村新媳妇都是这样的普通人。作家有意回避对英雄形象的正面塑造，只是为了坚持自己的美学风格而不受当时流行的创作思潮所左右，这正是茹志鹃的可贵之处。\n\n三、用白描手法对人物和物象进行简洁而准确的描写\n\n白描手法这种由《史记》和《红楼梦》等经典作品传承而来的描写技巧，“有真意，去粉饰，少做作，勿卖弄”，极大地过滤了作者的简单而随意的主观判断，排除了作者的缺乏真实性的消极想象，而是以一种切实客观的方式，来写人物的神态、语言和动作。\n\n在《百合花》中，所有的描写都是朴素、平实的，充满了如其所是的事实感，没有哪一个物象是抽象的、模糊的，没有哪一个对人物的动作和表情的描写是似是而非的，而是一切都宛然如在目前，我们就好像一个参与者和见证者，站在近旁听得见屋子里的“响动”，看得见通讯员“颇不服气”的样子，窥见了新媳妇内心的“尽咬着嘴唇笑”的秘密。\n\n四、通过反衬式的描写突出一个英雄作为普通人的本质\n\n“通讯员”在日常生活状态下，不过是一个年仅19岁的、尚未成熟的毛头小伙儿，他害羞，他不善言辞，他把树枝插在枪口上，他刻意回避着年轻女性，这些都表明他实则是一个有着“成长期”的情感活动的青年。\n\n正是这样一个普通得不能再普通、朴素得不能再朴素的小伙儿，在危急时刻，毫不犹豫地用自己的生命保护了他人的生命。这就是英雄的本质，在日常状态下是普通的人，在关键的时刻方显出非凡本色。他的牺牲不但引起了人们的尊敬，更引起了读者对生命的思考和怜悯，这使小说的意境上升到了美学体验的高度，而不只是一般的革命道德的高度。这是小说的一个最不同寻常之处。\n\n五、复杂的情感内涵\n\n“百合花”是这篇作品中的一个不可缺少的美好意象，一个使小说产生深层心理内涵的绝妙隐喻。它被绣在一床新婚的棉被上，延伸出“一个关于身体的想象”。\n\n最初，新媳妇不肯借出，不但是因为这是“唯一的嫁妆”，更是因为它隐喻着新媳妇“新婚”的情感体验；最后，她又毅然地将这床被子盖在这位牺牲者的身上-他那未曾恋爱过，更未曾近距离地接触过女性的年轻的生命，现在得到了一个充满神圣的献祭意味的亲近和关爱。这是伟大的母性之爱和温婉的女性之爱的复杂集合，是小说在感人至深的同时又令人回味深长的真正原因。","keywords":"清淡、精致、美丽 生活的侧面 白描手法 反衬式的描写 母性之爱和女性之爱的复杂集合","note":"《百合花》在十七年小说创作中是十分独特的一部作品，这部作品的独特性在于，在当时的政治文艺思潮的影响下，作者坚持了自己的独特创作个性，表达了自己的独特思想。总体来看，这部作品表现了崇高纯洁的人际关系，在艺术上，通过细节描写以及独特的叙事技巧，展现了生活中普通人的情感交流，含蓄优美。"},{"id":"290","stars":"★★★★","title":"“十七年”农村题材小说的特点","body":"在五六十年代，以农村生活为题材的创作，无论是作家人数，还是作品数量，在小说创作中都居于首位。不过与以前的农村小说相比，这个时期农村小说的面貌，发生了许多变化：\n\n一、强调表现“现实斗争”\n\n这即要求作家关注那些显示中国社会面貌深刻变化的斗争，而这通常指的是当时开展的政治运动。在农村进行的政治运动和中心事件，如农业合作化、“大跃进”“人民公社”运动等等，成为这一时期农村小说表现的重心。乡村的日常生活、人伦关系等，则在很大程度上退出了作家视野，或仅被作为对“现实斗争”的补充和印证。\n\n二、作家与作品的表现对象（农民）的立场观点相一致\n\n为了达到描写上的“深入核心”，作家在立场、观点、情感上，要与自己的表现对象（农民）相一致。不是在对象之上或之外-高高在上或作旁观者，而是以农民自身的感觉、观点作为描述的基础。作家和表现对象在视点、情感、反应上“同一”的这种设计，是创作上的群众观点，据此人民大众的立场和现实主义的方法才能真正结合起来。\n\n这种要求是为了推动作家迅速进入有关农村的叙述“规范”。但它在艺术效果上，既限制了取材的范围，也窄化了作家体验、描述的观点。\n\n三、作者构成广泛，取材以北方为主\n\n在作者构成上，既有从解放区走来的资深作家，也有一批新中国成立后成长起来的新生力量，此外，来自国统区的沙汀、骆宾基等，也在探索着乡土经验的新表达。从取材的地域分布来看，北方成为这一时期农村小说的主要艺术资源和表现对象。这显然与中国革命斗争的发展、解放区的地理分布等历史因素有着直接的关联。\n\n四、产生了两类艺术倾向不同的影响群体\n\n在当代的农村小说中，存在着两个有影响、艺术倾向却有所不同的创作群体。\n\n一是赵树理等山西作家，赵树理虽也获得一种超越性的眼界和地位，但他更像是乡村的“本地人”。在关注“新人”的出现和伦理关系的调整和重建时，赵树理等更倾向于在农村的传统中发掘那些有生命力的素质。就小说而言，赵树理主要推崇的是话本、说书等“宣讲”“说话”的“本土资源”。\n\n另一是柳青、王汶石等陕西作家。相比之下，柳青等更坚定地实行表现“新的人物，新的世界”的决心，更重视农村中的先进人物的创造，更富于浪漫的理想的色彩，具有更大的概括“时代精神”和“历史本质”的雄心。柳青更像是乡村的“外来者”，虽然他与所描写的土地和生活于其上的劳动者，已建立了密切的关联。但在关注“新人”的\n\n出现和伦理关系的调整和重建时，柳青等更为重视的是新的价值观的灌输。就小说而言，柳青等所借鉴的，是西方和我国新文学中“现实主义小说”的传统。\n\n正是由于艺术观和方法上的这些差异，随着当代不同阶段政治和文学风向的变化，对他们的创作的接受和评价，也大致呈现为此起彼伏的状况。","keywords":"现实斗争 作家与表现对象观点一致 作者构成广泛 取材以北方为主 两个群体","note":"这一时期的农村题材特征主要受到了当时政治环境的影响，农民成为了知识分子学习的对象。同时，这一时期的创作主体分布又受到了中国革命斗争发展和解放区地理分布，这些都影响到了十七年时期农村题材小说创作的整体特征。山西、陕西两大作家群的区别我们要注意一下，虽然基本不作考查，但有助于我们了解这一时期农村题材小说的整体状况。具体内容可以在李凡文学正版群中领取。"},{"id":"291","stars":"★★★","title":"分析柳青《创业史》的艺术特征","body":"一、表现两种思想、两个阶级和两条道路的斗争\n\n《创业史》艺术地呈现出农村中无产阶级与资产阶级两种思想、两个阶级，以及社会主义与资本主义两条道路的斗争。作者把这场斗争的对立面设置为三股力量。《创业史》严格按照阶级分析、两条路线斗争的观念来提炼主题、组织材料、设置人物关系、安排情节发展，这是当年小说取得成功的保证。但柳青没有把阶级分析简单化，他在政治框架中比较充分且自然地融入了浓郁的生活气息、鲜明细腻的人物刻画。\n\n二、《创业史》形象地揭示了农业合作化运动这一社会主义革命的性质和特点\n\n小说通过描写梁生宝互助组“换稻种”“新法育秧”“进山割竹”等一系列生产行为及其所产生的影响，以真实感人的艺术描写表现出梁生宝互助组和灯塔社是真正依靠增产增收及带头人的公道能干、艰苦奋斗和严格执行政策来吸引农民，从而显示社会主义的优越性和生命力的。也就是说，对资本主义自发势力的斗争和引导农民摆脱私有观念的束缚，只能用教育、显示优越性的方法，而不能用斗争、政治强制的手段。从中体现出《创业史》思想主题所包含的深刻的思想意义。\n\n三、作为一部具有史诗特点和规模的长篇小说，《创业史》体现出三个方面的独特优势\n\n（一）在对社会生活的反映和概括上，小说注意把历史的广度和深度有机地结合起来。作品的艺术重心是在挖掘合作化运动的历史深刻性，但作者又给蛤蟆滩的斗争提供了一个十分广阔的背景，注重从全局的联系中看到它的意义。\n\n（二）对人物的描写表现出作者宽广的艺术视野。众多人物形象铺展出宽广的社会生活面，作家又注意揭示每个人物的独特性格、独特命运及其深远的社会历史根源，力图使每个人都有一部生活史。\n\n（三）在结构安排上，小说兼顾历史的广度和深度。作品采用了多卷本的布局，第一部以“题叙”为行将展开的斗争提供背景，以“结局”在第一部和第二部之间承前启后，这就使第一部既是一个独立的艺术整体，又是历史长河中的一个生活阶段，历史的广度和深度在严谨的结构安排上也得到了落实。\n\n四、从审美文化角度看，《创业史》的精神触角是丰富而复杂的\n\n一方面，《创业史》把文学的政治教化作用推向了极致，高度紧张的阶级斗争思维模式，以阶级性为主体的社会主义新人性格，在作品中达到了前所未有的艺术高度。这种审美路径深刻影响了《艳阳天》甚至“文革”文学的写作。另一方面，作品在对改霞、秀兰、素芳等女性形象的描写中，真切地揭示了青春女性丰富多彩的心灵世界和细致曲折的隐秘情感，又表现出知识分子的敏感多情和人道情怀。","keywords":"两条道路的斗争 浓郁的生活气息 性质和特点 广度和深度有机地结合 宽广的艺术视野 严谨的结构安排 政治教化作用 敏感多情和人道情怀","note":"《创业史》是一部很独特的作品，对于它的评价也十分复杂。在当时的环境下，《创业史》无可避免地受到了影响，显示出了为政治服务的特征。但在艺术上，这部作品又取得了多方面的突破，在人物塑造、整体结构等方面都成就不俗。"},{"id":"292","stars":"★★★","title":"谈谈你对梁生宝和梁三老汉这两个形象的认识","body":"《创业史》中，梁生宝无疑是主角，作者柳青也的确是将其作为“党的忠实儿子”来进行塑造的，但是，有评论家指出，“梁三老汉比梁生宝写得好，概括了中国几千年来个体农民的精神负担”，而之所以会这样，是由于作者在创作时受到了当\n\n时的艺术规范影响。由此，我们可以对这两个人物形象有更深入的认识：\n\n一、梁生宝是一个社会主义新人的形象\n\n作为贫农的儿子，梁生宝继承了父辈勤劳俭朴、坚韧不拔、忠诚谨慎的优秀品质。在“老资格”党员退坡时，他勇敢地担负起带领庄稼人走农业互助合作道路的重任，成为一个积极、公道、能干的带头人。\n\n一方面，他仍然谦逊、纯朴、老实、厚道，甚至还有些面嫩口拙，爱情生活上更是缺乏勇气和机智；另一方面，他又具备听中国共产党的话、热爱社会主义、富有牺牲精神的可贵思想品质。\n\n梁生宝这一庄稼人的传统美德和中国共产党党员的特有气质相统一的形象，体现了一种以社会主义思想为核心、作为“党的忠实儿子”的崭新性格，是作家政治思想和美学理想的深刻体现。\n\n二、梁三老汉是一个具有高度典型性的艺术形象\n\n在旧社会，梁三老汉经历了三起三落的创业辛酸史，因而衷心拥护土地改革。但他不能自觉地接受社会主义集体化的创业道路，而是梦想着用新社会分给他的土地，用拼命的劳动真正创立起个人的家业来。\n\n梁三老汉既有肩负私有观念因袭重担的思想保守性，又是一个勤劳、善良、朴实的劳动者。从怀疑、反对互助合作运动到痛痛快快地“走社会主义的路”，从对梁生宝愤愤不平到真正心服，从看新屋架梁时受人嘲弄到排队打油时备受尊敬，再到同“县委书记”亲切交谈，作者植根于深厚的历史与现实生活土壤，完整、细腻、入木三分地写出了梁三老汉艰难、痛苦的内心斗争和思想转变过程，有力地显示了中国农民走社会主义道路的历史必然性。\n\n三、梁三老汉突出了梁生宝的英雄性，但相对而言在艺术上更加丰满\n\n不言而喻，“党的忠实儿子”梁生宝的英雄性是在与他的养父梁三老汉的对比参照中产生的，是通过对自己养父的精神与实践叛逆实现的。文学与文学史的复杂性在于，当“旧农民”鲜活而丰满时，“新的英雄”难免显得黯淡。如果说梁三老汉在艺术上更加丰满，而梁生宝却失之平面的话，其意义关涉则不仅仅在于作品本身，而且在更深的层面上意味着，当特定政治观念被艺术化以后，它将在艺术化的过程中被相当程度地消解甚至颠覆。在小说中，作为新的英雄梁生宝的塑造，是以他的人性的提纯和简化来实现的，相较之下，这个形象远不如梁三老汉来得具体、复杂，这也是有人认为梁三老汉比梁生宝塑造得更好的原因所在。","keywords":"社会主义新人 政治思想和美学理想 高度典型性 历史必然性 对比参照 消解甚至颠覆 提纯和简化","note":"类似的现象不仅在《创业史》中存在，在许多其他作品也存在，比如《三国志演义》中曹操形象塑造得相对经典一些，所以这是一个十分值得探讨的现象。而梁三老汉比梁生宝更具有典型性，说到底还是受到了当时社会思潮的影响。"},{"id":"293","stars":"★★","title":"试分析《山乡巨变》的艺术特征","body":"一、套路化的人物塑造和情节编排\n\n与其他合作化题材的小说相似，《山乡巨变》也无法不按照时事政策来图解生活，在人物塑造和情节编排上落入了既定的套路：这里有农村基层政权的代表邓秀梅、李月辉；有坚定走集体化道路的刘雨生、盛淑君；有立场摇摆不定的中间人物盛佑亭；有暗中破坏的阶级敌人龚子元等。作品同样把人物分成敌我两个阵营，围绕合作化问题，表现这些人物之间的较量。\n\n二、将政治运动放在民间生活舞台上演出\n\n在对合作化运动的态度上，周立波毫无疑问是站在时代共名的立场上，鼓励农民走合作化道路的。《山乡巨变》的基本构思和人物关系包括对农村阶级斗争的设计，都保持了与国家意志下的时代共名的一致性。但是，作家是把一场政治运动放在民间生活舞台上演出，大量的民间传说、乡村风俗、自然风光都恰到好处地穿插在故事情节当中，看似闲笔，却在丰厚的民间文化基础上开阔了小说的意境，使合作化的政治主题不是小说里唯一要表达的东西。小说叙事处处将两副笔墨重叠起来，政治是一景，乡情也是一景，而且是更加美好和本色的景致。小说回避了思想的深刻性，却换得了人情的自然、醇美与和谐；回避了人物矛盾冲突的尖锐表达，却散淡地写出几个活灵活现的农民性格。\n\n三、重点突出农民身上的优秀品质\n\n周立波拥有对自在自然的民间文化形态的尊重，也有善良、宽厚、天真的美好品格。出于这样一种美好的主观愿望，小说主要画面里没有剑拔弩张的阶级冲突，盛佑亭、陈先晋、王菊生等老农民形象都被刻画得栩栩如生活灵活现。\n\n作家从劳动的态度上热烈地赞美了这些农民身上的优秀品质，对于这些农民在面对合作化运动时的精神挣扎，作家没有从精神上人格上丑化他们侮辱他们，反而是从民间的角度写出了他们身上淳朴的人情美，给予他们善良的同情。对于体现在不同阶层农民身上的“道路”分歧、冲突，周立波也愿意将其放在乡村人情、血缘、伦理等关系上处理，而持一种较为宽厚、\n\n同情的态度。因而，作品中有一种略带幽默、风趣的叙述语调。","keywords":"套路化 时代共名 将政治运动放在民间生活舞台 老农民形象 略带幽默、风趣的叙述语调","note":"《山乡巨变》和《创业史》都是表现合作化运动的农村题材小说，所以很可能被放在一起进行比较。不过不同于《创业史》的尖锐性与深刻性，《山乡巨变》虽然在思想上也与时代共名一致，却表现出了一种人情的自然与醇美，整体风格表现出了很大的不同。对于这些内容，我们要注意把握。"},{"id":"294","stars":"★★★","title":"谈谈赵树理及其“山药蛋派”创作的历史贡献和时代局限","body":"“山药蛋派”是以赵树理为代表，由部分艺术风格、审美追求相互接近的山西作家构成的一个以写农村题材小说为主的文学流派。除赵树理外，主要成员还有马烽、西戎、束为、孙谦、胡正等。作为一个跨越两个阶段的文学类流派，“山药蛋派”有其独特的贡献，但也由于各种因素表现出了一定的局限，具体来说，主要为以下方面：\n\n一、历史贡献\n\n以赵树理为代表的“山药蛋派”对中国新文学发展作出了重大贡献，表现为：\n\n（一）重视民间形式与民俗内容\n\n“山药蛋派”重视民俗内容的描写，追求大众化的语言风格，注重民间艺术形式的吸取，因而形成了具有鲜明地方特色的喜剧化和通俗化的艺术风格。同时，这一流派重视故事性和语言的通俗，以便让识字不多的乡村读者能听懂、读懂。艺术借鉴更多来自古典小说、说书民间故事、地方戏曲。也正因为如此，“山药蛋派”的创作贴近农村、农民，展现了当时农民的精神面貌，同时表现出了农民群众喜闻乐见的风格，为当代农村题材小说创作提供了优秀范例。\n\n（二）坚持社会批判精神与问题意识\n\n这一小说流派坚持从生活到创作，强调问题意识，具有一定的社会批判精神。作家在生活中“不作旁观者”的主张，对他们来说不仅是叙事意义上的（即不仅是叙事观点、情感态度上的）；而且更是小说的“社会功能”上的。在赵树理的“问题小说”的观念中，写小说是为了“劝人”，能“产生指导现实的意义”是写作的出发点和落脚点。也因此，他们的创作反映了当时农村存在的问题，表现了农民的愿望，体现了维护农民的立场。\n\n（三）凸显写实精神\n\n“山药蛋派”坚持按照生活的“本来面貌”来写的“写实”风格。作品的思想、形象来自“当前生活的底层”。所谓“本来面貌”，他们解释说是来自于一个有先进思想的农民的所见、所闻、所感。也因此，他们的创作真实地反映了当时农村的问题。\n\n（四）“中间人物”的塑造\n\n“山药蛋派”，尤其是赵树理，塑造了一系列经典的“中间人物”，反映了当时农民思想的复杂，这在十七年时期整体关注英雄人物、塑造正面形象的创作潮流之中是一股清流。\n\n二、时代局限\n\n由于时代和个人等方面的原因，使得他们的作品中存在着一定的局限和不足：\n\n（一）“山药蛋派”作家在艺术上的不足是风格比较单一。\n\n“山药蛋派”的形成主要是受到了赵树理的影响，因而这一流派中的作家在创作时会不由自主地模仿赵树理的创作。同时，又因为这些作家注重“流派风格”的构建，导致其整体风格趋向单一。\n\n（二）“山药蛋派”有时过分停留于“问题意识”，使小说素材的社会广度和作家自己的艺术创造力都受到了制约。\n\n总之，“山药蛋派”无疑是取得了优秀的创作成就，作出了自己突出的贡献，但由于各种因素的影响，他们的创作也表现出了一些无法避免的历史局限，所以我们需要去辩证地看待他们的创作。","keywords":"民间形式与民俗内容 社会批判精神 问题意识 写实精神 中间人物 风格比较单一 社会广度和艺术创造力受到了制约","note":"赵树理作为十七年农村题材小说重要作家，需要重点、全面掌握，不仅要把握其作品艺术特色、对古典小说的继承和创新之处，还要知道赵树理笔下的一些典型人物形象，也要了解一些相关评价和其不足。顺着“山药蛋派”，我们又可以联想到“荷花淀派”，这二者可以说是十七年时期比较重要的两个关键概念了，在名词解释中出现的频率不低。"},{"id":"295","stars":"★★★","title":"《三里湾》的艺术特征","body":"《三里湾》是建国后赵树理最重要的作品之一。作为新中国的第一部反映农业合作化运动的长篇小说，其不仅有首事之功，而且在表现社会变革给农村政治经济和农民思想精神所带来的巨大影响方面具有相当的深度。总体来看，这部作品的艺术特征主要表现在以下方面：\n\n一、错综复杂、互相交叉的人物格局\n\n小说围绕三里湾合作社秋收、扩社、整社、开渠等事件，以几个农民家庭之间交错的社会联系、婚恋纠葛为纽结，通过富有戏剧性的人物、情节和场景，反映出了新农村的新变化。赵树理并没有像后来的一些作家那样把这些矛盾着的人群划为泾渭分明、敌我对立的阶级阵营，而是将其处理成为一种错综复杂、互相交叉的格局。在这个复杂的人物格局中，家庭内部矛盾、党内思想斗争、社会伦理道德斗争，以及情感观念斗争纠结于一起，在不长的篇幅中，展开了一幅色彩丰富的农村生活图景。小说比较细腻地书写了这些力量的彼此消长，试图揭示出中国农村由合作化运动所带来的深刻变化，以及这一历史变化过程的长期性与复杂性。\n\n二、擅长中间人物与落后人物的塑造\n\n《三里湾》尝试塑造了一系列“新人”形象，这些人物身上，寄寓了作家对于新生活的理解和想象。作品通过以王金生为代表的进步力量成功地对落后人物的说服、教育和斗争，最终使他们加入合作社，完成了对农业合作化运动历史必然性的印证。但总体而言，这些人物和赵树理早期作品中的正面人物一样，略显单薄，缺乏深层的性格内涵与美感力量。究其原因，除了如他自己所说，是“对旧人旧事了解得深，对新人新事了解得浅，所以写旧人旧事容易生活化，写新人新事免不了概念化”以外，与逐渐强化的意识形态的概念框定也不无关系。\n\n在人物刻画方面，相比之下，赵树理最擅长的依然是对中间人物和落后人物的塑造。比如一心要走个人发家道路的富裕中农马多寿，其顽固落后、狭隘自私的性格就被作家刻画得非常生动。除了这个人物之外，马多寿的善于胡搅蛮缠、睁眼说谎的老婆“常有理”、精明自私的大儿子“铁算盘”、没人敢惹的大儿媳“惹不起”等，也都各具鲜明的性格特点。这些人物都是从作者熟悉的农村底层生活中提炼概括出来的，因而塑造得血肉丰满，真实可信。\n\n三、以人物描写推进故事情节，但在整体结构上有所不足\n\n从艺术手法上看，《三里湾》延续了赵树理以往擅长以人物描写推进故事情节的写法，在稍显散漫的故事线索中，着力刻画不同的人物形象，在这一点上他是成功的。但从小说的整体结构上看也有不足。由于力图展示人物转变、社会进步主题的需要，小说匆忙设计了几个弱势人物的“革命”和落后形象的转变，像马多寿的“变糊涂为光荣”显然来得突兀，天成的“革命”也显得急促和缺乏深层铺垫。","keywords":"错综复杂、互相交叉的人物格局 中间人物与落后人物 以人物描写推进故事情节 整体结构上有所不足","note":"《三里湾》是新中国第一部反映农村合作化运动的长篇小说。在这部小说中，赵树理尽量保持了自己从40年代以来一贯的创作特色，但受到当时整体文学环境的影响，赵树理也不得不做出了许多调整，这使得这部作品在取得了一定的成就的同时，也表现出了些许不足。"},{"id":"296","stars":"★★★★","title":"《“锻炼锻炼”》在哪些方面体现了“民间立场”","body":"《“锻炼锻炼”》写于1958年，正是“大跃进”的高潮期间，与农民血肉相连的赵树理不会不敏锐地发现中国农村正处于“天聋地哑”的前期。所以《“锻炼锻炼”》也利用了当时一般文学创作惯用的歪曲生活真实的方法，曲折地反映出作家的民间立场。\n\n一、写出了农村出现的真实情况\n\n赵树理作为农民的代言人，他本能地发现，在农村，对农民最大的危害，正是农村“基层干部是混入了党内的坏分子”（周扬语），他的小说的矛盾冲突大都是围绕这样一批农村旧势力和新政权结合的坏人而展开的，这是站在农民的立场上才会发现的问题。他建国之前的创作可以说是相当尖锐地揭示了抗日根据地的农村的新的阶级斗争和农民的愿望。\n\n而在《“锻炼锻炼”》中，作为一个真正的现实主义作家，赵树理实实在在地写出了农村出现的真实情况。虽然受限于当时的环境，从表面上看，这部作品是在批评“小腿疼”“吃不饱”这样的“落后”农业社员，但实际上，小说暴露了这样的现实：干部横行霸道地欺侮农民，农民消极怠工和自私自利，农业社“大跃进”并没有提高农民的劳动积极性，只能用\n\n强制性的手段对付农民......从赵树理的艺术画廊里看，这篇作品分明是与描写农村“有些基层干部是混入了党内的坏分子”的艺术精神一脉相承的，在当时的环境下，隐晦地表现出了赵树理维护农民的立场。\n\n二、艺术上向民间文艺手段靠拢\n\n赵树理已经指明了自己创作的服务对象是文化程度相当低的农村读者，所以在艺术表现手法上不能不迁就传统的民间文艺手法，但他所表现的内容和艺术趣味则完全是新的。\n\n（一）赵树理的作品连叙事语言都是日常口语，他很少刻意追求方言土语以壮声色，而是擅长运用朴素干净的口语来叙述故事，常常把叙述语言与人物语言混成一片，表现出内在的和谐和朴素。\n\n（二）赵树理的小说创作过程是长卷似的平铺展示群体的农民故事，逼真地写出日常生活细节的过程，仿佛是听一个民间说书人在乡场上讲村里的故事，讲得圆熟，琐碎，说到哪个人物，哪个人物就成为故事的中心，每一个细节都很真实地被描述了出来。如《“锻炼锻炼”》这篇以农业合作化为表现对象的小说，读来最吸引人的地方就是它的极具生活气息的喜剧色调，这尤其表现在对两个落后妇女“小腿疼”“吃不饱”的描写中。","keywords":"农民的代言人 农村出现的真实情况 维护农民的立场 民间文艺手法 日常口语 日常生活细节","note":"《“锻炼锻炼”》的民间立场，主要表现在思想和艺术两个方面，大家可以结合作品这两方面的特征仔细分析。可以看到，赵树理《“锻炼锻炼”》这部作品显示出其一贯的风格，可以联系赵树理现代文学史上的创作特征进行记忆。“山药蛋派”除了赵树理之外，马烽和西戎的创作也取得了一定的成就，不过较少对其进行考查，相关拓展内容可以在李凡文学正版群中领取。"},{"id":"297","stars":"★★","title":"谈谈你对“非主流文学”的理解","body":"在50到70年代，文学主张和文学创作的统一性是这个时期文学的总体面貌，但在某个时候、某些作家那里，时或有偏离规范的“异端”现象出现，对本时期的那些偏离，或悖逆主流文学规范的主张和创作，用“非主流”这一用语来表示。这一时期的“非主流文学”，主要表现出以下特征：\n\n一、是一个“历史的”概念\n\n“非主流文学”是相对于不同阶段的那些被接纳、被肯定、被推崇的主张和创作而言，是个“历史的”概念。它的范围、性质，与当时文学“规范”的状况有关。因此，在一个时间里被肯定和推崇的一些作品，在另一时间里，可能会当作异端而受到批判。\n\n二、处于受压制地位\n\n“非主流文学”在一个高度一体化的文学语境里，处于受压制的地位。有的作品，发表后受到批判，有的则没有得到公开发表的机会，而在一定范围的读者间，以各种方式流传。\n\n三、呈“阶段性”状况\n\n“非主流”的“异质”文学的出现，在50到70年代，呈现为“阶段性”的状况。它们或产生于文学“规范”的要求比较松懈，对“规范”发生多样性理解的时候（如1956年-1957年这一被称为“百花时代”的阶段，以及60年代初在政治、经济、文学政策上进行调整的阶段），或产生于文学控制虽十分严厉，却存在某种个人写作、“发表”的空间的时候（如“文革”的后期）。\n\n四、关注“启蒙意识”和人道主义\n\n从40年代末开始，在中国大陆文学界，被称为“自由主义文学”的派别已失去他们的位置，另外，联系着20世纪西方现代文学的“先锋性”探索，也被目为非法。在左翼文学成为唯一文学事实的情况下，文学的“非主流”现象，表现为相当集中的性质。冲突常发生在一些作家坚守的精神态度和文学观念上。对于阐释既定观念的文学写作方向的怀疑，对于保护和重建质疑和批判现实的“启蒙意识”，和在解释、想象世界上的人道主义，是大多数情况下“非主流文学”的思想、艺术特征。这与这些作家对中国的社会现实，对中国人的生存状况和精神状况的理解有关。当然，在“文革”后期，一部分“异端”的文学的性质，开始越过这一范围，表现了对于左翼文学的观念框架的超越的趋势。","keywords":"偏离“历史的”受压制 阶段性“启蒙意识”人道主义","note":"“在一个时间里被肯定和推崇的一些作品，在另一时间里，可能会当作异端而受到批判”，在解释“非主流文学”的内涵时要进行客观评价。“非主流文学”的众多特征中，大家特别需要注意的是它的思想特征。除了“非主** --- # 流文学”这一整体的概念之外，这一概念中包含的作品如《我们夫妇之间》《组织部新来的青年人》这些作品也会以名词解释的形式考查。"},{"id":"298","stars":"★★","title":"为什么说《我们夫妇之间》是“逸出主流意识形态的现实主义小说”","body":"萧也牧（1918-1970）的短篇小说《我们夫妇之间》（发表在《人民文学》1950年第1卷第3期）主要写一对夫妇之间的感情纠葛。\n\n知识分子出身的丈夫李克与工农出身的妻子张同志在艰苦的战争年代结合在一起，一度被认为是知识分子与工农相结合的模范。但是进入城市后，他们感情上却出现了裂痕，丈夫回到北京感到“好像回到故乡一样，对一切都感到亲切又熟悉”，妻子却对城市生活很难适应，对地毯、沙发、舞会都看不惯，并公开干涉丈夫跳舞、吸烟，她想用农村的观念和标准来改造城市。丈夫对妻子的举止虽然看不惯，但作为知识分子却能够时时反省自我，并努力理解对方，于是最终达成谅解，夫妻和好如初。小说发表后一度受到激烈的批判。实际上，它是一篇传递了诸多的创新信息、逸出了主流意识形态的小说。\n\n一、由宏大叙事、国家叙事转向生活叙事、个人叙事\n\n40年代确立的解放区文艺规范即工农兵文艺规范，实际上是服务于政治的宏大叙事规范，这一文艺规范在1949年7月的第一次全国文代会上进一步被确立为指导新中国文艺创作的纲领，阶级斗争、民族斗争、国家命运等等成了小说叙述的重心。而这篇作品在叙写知识分子改造的合法性名义之下，却主要写夫妻矛盾、儿女情长，尤其是大胆地写出了城市生活中的一些非常个人化的情感体验，属于典型的生活叙事、个人叙事，对宏大叙事有所偏离。\n\n二、把知识分子上升到主角\n\n在工农兵文艺规范影响下的一些作品中，工农兵是主角，是歌颂对象，而知识分子则是次要角色，是被改造的对象。但这篇小说却把知识分子上升到主角的地位，并真实大胆地写出了他们的生活趣味，同时也真实地写出了一些工农干部进入城市后暴露出的一些与现代生活不相协调的生活习惯、心理趋向，这对主流意识形态所规定的文艺作品中人物形象的等级设置无疑也是有所偏离的。\n\n三、对主流意识倡导的革命化统一生活方式的质疑\n\n小说通过对家庭故事的叙述提出了一个关系未来社会生活的大问题，即应该按什么样的标准和趣味改造家庭、改造生活、改造城市、改造社会的问题以及在统一的政治生活后面是否允许有个人化的生活空间等问题，而这一切质疑、提问却与当时主流意识形态所倡导的革命化的统一的生活方式是矛盾的。\n\n【李凡关键词：个人叙事 主角转换 知识分子上升到主角 关系未来社会生活的大问题】","keywords":"","note":"萧也牧因为中篇小说《我们夫妇之间》，成为1949年后第一个受大规模批判的作家。萧也牧的小说注重个人情感的细腻描绘，在当时的文艺界不啻一枝独放的奇葩，由此招致猛烈的抨击与批判，作者也因之获罪惨死干校。从1951年至1970年，十九年的指贵、白眼、迫害，直至惨死；所有这一切，只是因为一篇大约14000字的小说。这是中国当代文学史上真实的一页。"},{"id":"299","stars":"★★★","title":"试分析《组织部新来的青年人》的艺术成就","body":"《组织新来的青年人》虽然是针对现实问题而写的，但它在揭示既有问题的同时并未给予问题以解答。这不是一篇一般性的问题小说，而是一部提问题的小说。问而不答的《组织新来的青年人》，呈现出特别的美学蕴藉与思想穿透力。\n\n一、塑造了典型当代官僚形象\n\n小说最引人注目的地方首先在于透过年轻人林震懵懂而单纯的眼光，塑造了刘世吾、韩常新等极具精神深度的当代官僚形象。刘世吾和韩常新都是典型的体制中人，熟透了体制的运作方式和规律，并与之融为一体，消泯了自我，也钝化了体制向前运动的动力，或可称之为“体制病”患者。\n\n二、表现了年轻人的心路历程\n\n《组织部新来的青年人》在揭露现实矛盾的同时，其实更彰显了林震这一年轻人在理想与现实的冲突中的心路历程。林震单纯明朗，富有青春的朝气和理想的激情，希望“按娜斯嘉的方式生活”即“对坏事决不容忍”，然而区委组织部的工作、生活却远非黑白分明，这使他不能不产生困惑。他到组织部报到最先遭遇的两个人-赵慧文、刘世吾-恰恰在相当程度上拓展了他的思考。\n\n三、揭示了一种人生存在的“围城式困局”\n\n从刘世吾到韩常新，再到赵慧文和林震，小说在组织部这个不大不小的世界里，构筑了一个相当复杂的围城式困局。不过，这里没有城外人，人人都在城里，人人都被禁锢，有的人习惯了禁锢，有的人在禁锢中获取成就感，有的人曾经挣扎过却已经无力，还有的人试图改造这围城却处处碰壁。《组织部新来的青年人》这篇“干预生活”的小说所表达的，其实是“生活对人的干预”，一种已经高度僵化的体制生活对人的灵魂、人的个体生命的禁锢、锈蚀和磨杀。在这种意义上，小说的价值就不仅仅在对阴暗面的暴露，而是具有了穿越性的意义，它历史性地揭示了一种人生存在的困局。\n\n四、严肃主题之中蕴涵着韵致与情调\n\n小说也以一定的笔墨书写了林震和赵慧文之间朦胧的情感。这称不上是爱情，只是一种若有若无的感觉，却令小说在严肃的主题之外增添了别样的韵致和情调。二人的遇合应当是单纯的，不过，将他们的关系点破的却是刘世吾。刘世吾恰到好处的欲说还休，引导了读者的眼光，使小说显得蕴藉有味，这实在是一抹神来的笔墨。","keywords":"当代官僚形象 心路历程 围城式困局 别样的韵致和情调","note":"《组织部新来的青年人》是十七年时期干预现实小说的标杆作品，在十七年文学中占有特殊的地位，其反映的问题是多方面的，大家可以从书中几位角色的性格及其关系出发仔细梳理。除了大题，《组织部新来的青年人》在名词解释中出题的频率也非常高。对于这样一部作品，我们要注意重点掌握。"},{"id":"300","stars":"★★★","title":"怎样理解《组织部新来的青年人》中刘世吾形象的多义性与丰富性","body":"一、刘世吾首先是一个成熟的干部，一个颇有深度的官僚典型\n\n刘世吾曾是北大学生自治会主席，有一定的革命经历，又有相当的工作能力，知道如何把握工作重点，只要“一下决心，就可以把工作作得很出色”。\n\n同时，刘世吾又是一个颇有深度的官僚典型，他极擅“领导艺术”，熟谙也麻木、倦怠于自己所从事的组织工作，有业务能力，却毫无热情，对工作有一种职业性的平静，嘴边经常挂着一句口头禅“就那么回事”，以“条件成熟论”为信条游刃于各种复杂的情况中，“纯熟地驾驭那些林震觉得是相当深奥的概念，像拨弄算盘子一样的灵活”。\n\n二、并非毫无生气，有“人”的一面\n\n刘世吾又井非是一个毫无生气的人，他和年轻的林震一样，也是一位爱好文学的人，当他读一本好小说的时候，也“梦想一种单纯的、美妙的、透明的生活”，但现实中“可还是得做什么组织部长”。刘世吾对韩、王这样的干部心里也很反感，而真心欣赏林震，认为“你这个干部好，比韩常新强”。\n\n也正因此，与对“金玉其外”的韩常新、蜕化变质的王清泉的明显反感相比，林震对刘世吾的态度是复杂的：他一方面对刘世吾的处世态度、工作作风有质疑、批判，但在另一方面，也对其经历、工作能力真心钦佩，包括对其现在作风的某种理解。\n\n三、典型的体制中人\n\n刘世吾和韩常新都熟透了体制的运作方式和规律，并与之融为一体，消泯了自我，也钝化了体制向前运动的动力，或可称之为“体制病”患者。\n\n饶有意味的是，刘世吾对于自己的状态相当地清醒，甚至感到倦怠，但倦怠感井不会改变什么，他倦怠得懒得从倦怠的现实中起身，只是偶尔读一点文学书籍，调剂一下自己疲惫、麻木的心灵。曾经热情投身的事业，一点一点地锈蚀他的灵魂，把他磨杀成了生命的空壳。小说表现的不仅是刘世吾的“职业病”，还有由此所引发出来的关于“职业”与“病”之间关系的问题。病象如此，病因何在，这是小说最发人深省的一个提问。\n\n正是通过对刘世吾这样一个具有丰富性和多义性的形象的塑造，《组织部新来的青年人》完成了对“围城”困局的解释，也反映了当时官僚系统中存在的问题，并由此引发了读者更深入的思考。","keywords":"成熟的干部 官僚典型 爱好文学的人 典型的体制中人“体制病”患者","note":"相较于林震，刘世吾的形象明显复杂得多，可以讨论的内容也比较多，其中最主要的就是这一人物形象的丰富性与多义性。刘世吾可以看做是未来的林震，他虽然患上了“体制病”，但仍保留着心中的一份净土，这也造成了其性格的复杂。这部分内容，我们要掌握。"},{"id":"301","stars":"★","title":"试述当代文学初期散文的发展状况","body":"一、当代散文发展趋势\n\n“当代”散文的边界，相比三四十年来有很大扩展。散文有广义与狭义之分。狭义的散文，即所谓“抒情性散文”，其特征相近于“五四”文学革命初期所提出的“美文”。广义的散文概念，除了“美文”之外，还包括“叙事性”的、具有文学意义的通讯，报告（报告文学、特写），也包括以议论为主的文艺性短论，即杂文、杂感。另外，在有的时候，文学性的回忆录、人物传记，写实性的史传文学，也会被列入到散文的范围之内。\n\n20年代散文小品，主要是美文。30年代以议论性的杂文为主。抗战开始后，报告文学成为主流。50年代要求散文对现实生活反映的广阔与迅速，因此以报告为主的叙事写作，便构成了散文的主体。报告文学在1958年“大跃进”期间和1963年“文革”前夕达到两次高潮。当代文学初期的杂文遭遇被冷落的命运，但偶尔也有惊喜。杂文第一次复苏是在1956年，具有突出成绩的是王任叔。第二次复兴是1962年《人民日报》开辟“长短录”专栏以及邓拓的《燕山夜话》和“吴南星”的《三家村札记》。其中《燕山夜话》犀利明快、机智幽默，融思想性、知识性、文学性于一炉。\n\n总的来说，散文的发展是从显示个人性情，记叙日常生活情景，向着议论现实、报告政治、社会公共生活事态的方向发展。\n\n二、当代文学初期散文发展分期\n\n（一）第一阶段（1949-1956)：通讯、报告空前发展。\n\n这一阶段散文以通讯、报告为主，内容主要有两方面：一是反映抗美援朝战争，如巴金《生活在英雄们中间》、魏巍《谁是最可爱的人》等；二是迅速及时的反映社会主义建设，如臧克家《毛主席向着黄河笑》，杨朔《石油城》等。这时候散文也有缺陷，比如题材狭窄，体裁单一，存在较多的概念化倾向。主要是歌颂性的，较少干预生活、沉潜生命人生的作品出现。\n\n（二）第二阶段（1957-1966)：当代散文的活跃时期。\n\n这一时期散文题材更为广泛，思想较为深刻，艺术较为精湛，作品数量多，出现了风格日臻成熟的作家和艺术趋于圆熟的作品，一些老作家也在61、62年发表了一批将自我与时代相结合的作品，如杨朔的《海市》《东风第一枝》，秦牧的《花城》，刘白羽的《红玛瑙集》，巴金的《倾吐不尽的感情》，冰心的《樱花赞》，吴伯箫的《北极星》，峻青的《秋色赋》等。","keywords":"广义与狭义 美文 议论性的杂文 报告文学 通讯、报告 活跃时期 杂文 冷落","note":"论述当代初期散文的发展状况，要明确时间和体裁，大家要注意到当代文学初期散文发展的两个阶段和每个阶段散文发展的状况，同时要注意到此时散文发展是不平衡的。此题的时间限定是当代初期，要是问整个当代散文的发展轨迹，大家可以参考前面的脉络篇。"},{"id":"302","stars":"★★","title":"谈谈刘白羽散文的特点","body":"一、刘白羽善于运用剪辑手法，将历史和现实交织成形象的艺术画面，表达新颖深刻的主题\n\n《红玛瑙》由两句墙头小诗“地球是颗红玛瑙，我爱怎雕就怎雕”引出回忆，把昔日杨家岭窑洞的灯光、宝塔山下开荒的情景与今天延安的新风貌联系起来，通过一系列形象画面的组合，提炼出从延安起步的革命者应永葆革命青春的主旨-“要创造一个红玛瑙一样鲜红、通明的新世界”，就必须“努力把自己锻炼成为永远鲜红、通明的红玛瑙一样的人”。历史与现实画面的交错叠印，产生了强烈的艺术效果。\n\n二、哲理模式\n\n刘白羽的散文属于哲理模式。作为我国当代著名的散文作家，他大量抒情意味极浓的散文篇章中，饱含着深刻的哲理思考。作者的哲理思考，是启发作者心往神驰的思想力量。\n\n如刘白羽的《长江三日》写作家乘“江津”号自重庆顺流而下，在看到一只木船逆流而上的情景时，便顿然悟到这样一个深刻的哲理：不管航道多么复杂艰难，只要人们从汹涌浪涛中掌握一条前进途径，就会战胜大自然。在作者笔下，长江三峡气象万千的壮丽景色，同作家胸中汹涌澎湃的战斗激情，完全交融在一起了，使作品充满着一种时代精神，战斗激情和英雄光彩。\n\n三、气势壮阔，格调高昂\n\n刘白羽的散文诗意更多表现为壮美、明快，气势壮阔，格调高昂。如在《长江三日》中，作者不是为了写景而写景，而\n\n是将景色与我们的时代，我们的生活联系起来了。文章虽然落墨于山河画卷，却处处着眼于哲理的诠释，因此，气势壮阔，格调高昂。读起来扣人心弦，使人精神振奋。\n\n四、以“意”为帅，以抒情为牵引线\n\n刘白羽的散文在结构上，以“意”为帅，以抒情为牵引线，散文中的人、事、景、物、情、理，是随着感情的发展变化而摇曳铺陈的。因此，他的散文结构挥洒自如，波浪起伏，跌宕有致。《长江三日》描写自重庆到武汉之间长江两岸的绮丽风光，作者用“战斗、航进、穿过黑夜走向黎明”的哲理思索贯穿全篇，它浓密而又淡远、简约而又细腻，神情毕肖而又变幻多姿，充分地表达出刘白羽散文的雄健浑厚、优美细腻的风格。\n\n五、语言风格与思想内容统一\n\n刘白羽散文的语言风格与其作品的思想内容是统一的。深刻的哲理、磅礴的壮怀以及灿烂的山川、江河，一旦孕育成散文的意境，优美浓烈的文辞便奔涌于笔端了，《长江三日》中，壮观的景色与刘白羽胸中豪情的一旦交融，汹涌的文辞便涌到了作者的笔尖，壮美的长江美景就这样被刘白羽以淋漓的彩墨描绘了出来，并给人以以强烈、壮观、豪迈之感。\n\n总而言之，刘白羽擅长剪辑手法，语言畅达、热烈、明朗，如滔滔江河，一泻千里。从对闪光事物的捕捉、生活感兴的触发，到严峻深沉地展开哲理思索，是刘白羽散文构思的一般过程；同时，作者的哲理思索、主观理想和被描写的客观形象可以做到完美的统一，这使得散文意境更加深邃。","keywords":"剪辑手法 哲理模式 时代精神 壮美、明快 以“意”为帅统一","note":"刘白羽是我国当代著名的散文作家，属于战士型散文家，他在表达上将革命浪漫主义与政治抒情结合起来，创作的散文富有激情和想象力。刘白羽散文具有丰富特点，可以从结构、语言、意境等多方面分别展开，但需要注意逻辑、条分缕析。"},{"id":"303","stars":"★★","title":"秦牧散文创作的特色","body":"秦牧的散文通常在一个预设的主旨下，将与此主旨相关的知识、传说、趣闻等串联起来，引类取比，通过联想和比喻，最后得出规律性的认识，即哲理结论。大量的知识替代了作家的“自我”，其散文在本质上体现了一种“知识＋政论”的模式。秦牧的散文，主要包括以下特色：\n\n一、知识性\n\n在自己的创作中，秦牧隐藏起现代随笔的个人性，继承了现代随笔重知识和理趣的特征。他指出：“丰富的生活知识材料，对一个散文作者是十分重要的。只有这样，对一个道理，发挥起来，才能够有丰富的联想。”秦牧以说古论今、谈天说地的方式，向读者介绍与作品话题相关的历史记载、见闻和传说，“知识性”是其散文的突出特点。\n\n二、思想性\n\n秦牧散文的成功不仅仅源于其知识的丰富，还得益于他善于从知识中发现哲理。并且，其所发现的哲理永远沐浴着先进的、崇高的思想的光辉。对散文的思想性，秦牧有这样的认识：“思想像一根线串起了生活的珍珠。没有这根线，珍珠只能弃散在地。”基于这样的认识，秦牧散文总会在知识材料的基础上进行分析与说理。比如，在《面包和盐》一文里，秦牧在对各民族风俗礼仪的知识性介绍中，发现这些平凡的东西往往在隆重的场合体现着最崇高的价值，接着由这联想到群众。但秦牧的作品以“知识”和“思想”替代了“自我”，流于对知识、思想的泛泛评价，造成主体情感的隐匿，缺乏感动人心的力量。\n\n三、趣味性\n\n秦牧富有趣味性的艺术创造，一为艺术解谜法，二为“平民化”的言说方式。\n\n（一）艺术解谜法\n\n艺术解谜法是秦牧散文惯用的结构方法。他的作品往往从令人疑惑或惊讶的问题入手，层层深入，而后以问题的圆满解决、疑惑地彻底消除告终。如《天坛幻想录》就天坛寰丘石料的数目都与“九”发生关联说开去，层层设谜，再层层解谜。经过设谜与解谜，秦牧批评了封建皇帝在天坛设计上的故弄玄虚，得出“十分神秘的事物原来出自异常平凡的事物”，“天下本无神秘的事物，神秘只是欺骗或者愚昧无知的代名词而已”等认识，并进一步引申出“有一种东西是真正伟大的，那就是历史发展的规律”的结论。\n\n（二）“平民化”的言说方式\n\n秦牧的作品内核总是与正确的政治思想紧密关联的，但在言说方式上，秦牧采用了“像和老朋友们在林中散步，或者灯下谈心那样的方式”，避免了灌输说教之嫌，使得本来具有学者倾向的知识小品富于“平民化”风格，加之其作品语言的通俗易懂、明白晓畅，选取的知识材料具有趣味性，故此秦牧作品极易为读者所接受。","keywords":"知识＋政论 知识性 思想性 发现哲理 趣味性 艺术解谜法 “平民化”的言说方式","note":"关于秦牧散文创作的特色，我们首先要抓住“知识＋政论”模式这一中心，结合秦牧的作品，条分理析，逐点作答，从知识性、思想性和趣味性三个方面展开分析，必要时可以结合作品，在回答过程中，注意不要出现疏漏。"},{"id":"304","stars":"★★","title":"试述杨朔散文艺术风格","body":"杨朔最著名的散文篇章创作于新中国建立后的50、60年代，以歌颂新的时代新的生活及普通劳动者为主要题材。杨朔的散文创作，取得了一定的突破，但也无法彻底摆脱时代的局限，具体来说，主要表现在以下方面：\n\n一、把散文“当诗一样写”，突显“自我”\n\n杨朔看到了当时散文创作出现的模式化、内容空泛化等趋势，并有意扭转它。杨朔提出了把散文“当诗一样写”的观点。&#x4ED6;强调诗歌源自个人内心与外在事物的强力碰撞，是作者真情实感的喷涌，好的散文正如从内心喷涌而发的诗歌，忌讳种种空泛甚至虚假的抒情。杨朔散文虽然也以“歌颂”为主调，但他强调要从文字突显作者的“自我”。杨朔散文名篇，无一不采用了从“动情的事”升华为“思想的意境”的结构方式。在杨朔散文中，“动情的事”往往是美景或者美好的事物，它们激发了作者内心的几多感慨、几缕情愫。而这些“动情的事”作为伏笔总要引申、升华出“思想的意境”。毫不夸张地说，这成了杨朔散文的一种固定套路。\n\n二、三段论抒情模式\n\n注重情景交融、物我交融的抒情方式，让杨朔散文大大超出了当时一般就事论事、直言其事的“歌颂”文字，形成了精巧的、“以景（物）比兴一写人叙事-激扬指点”三段论抒情模式，造就了所谓的“杨氏散文”。在20世纪60年代至70年代至以后的很长一段时期里，“杨氏散文”的影响力长久存在。\n\n杨朔的成功也隐藏了杨朔的失败。杨朔散文中“三段论”抒情模式比比皆是、有重复之嫌，那必然“升华”的结尾也给人不自然的感觉。这样的构思不仅模式化，还隐藏着这样的文化逻辑，那就是，寻常事物、日常生活本身不具有独立书写价值，只有以此来寄寓、承载宏大的时代主题、政治意义才有书写的价值。这实际上构成了对生活本身的否定，也因此，散文细节失真就在所难免。\n\n三、“光明的尾巴”\n\n作为创作者的杨朔始终难以摆脱时代的限制。“歌颂”是新中国成立后对文学的必然要求，即使杨朔强调“把散文当诗一样写”，强调体现“自我”，也不可能完全抛开大环境。于是，杨朔散文中那个“光明的尾巴”屡屡重现，割舍不掉。在缺乏才气、情感的仿作那里就更是“强作升华”，流于矫揉造作了。","keywords":"突显作者的“自我”情景交融、物我交融的抒情方式 三段论抒情模式 散文细节失真 难以摆脱时代的限制","note":""},{"id":"305","stars":"★★★","title":"杨朔、刘白羽、秦牧散文的风格比较","body":"一、散文题材\n\n在选择题材和开掘主题方面，刘白羽擅长写战争题材，即使在描写其他题材时也同样具有鲜明而重大的政治内容，善于把笔触伸向壮美、纯洁，富有象征意义的事物；杨朔善于从十分普通的平凡事物中向深处开掘，喜欢写普通的生活，细小的事物，然后进行生发引申。秦牧仿佛邀游在知识的天地里，把他的创作触角伸向知识生活的各个领域。\n\n二、结构技巧\n\n在结构技巧方面，杨朔散文的结构非常严谨且富有变化，往往体现出疏密相间、张驰合宜的特点，特别是开头与结尾部分更能别出心裁；刘白羽的散文结构则显得挥洒自如，他善于把抒发革命感情同描写、叙述、议论巧妙地结合在一起；秦牧更善于通过大胆的想象，把许多不相干的事和物巧妙地连缀在一起，妙趣横生，引人入胜。\n\n三、表现方式\n\n在散文的表现方式方面，刘白羽多用日记体或书信体，或者在作品中摘录一段书信，直抒胸臆，强化抒情色彩；杨朔却总爱取生活的片断，借景抒情，善于在客观事物中显示出独特的主观感受；秦牧则习惯于通过谈天说地、漫话随笔来表达思想、阐明道理。\n\n同为写景，刘白羽总是笔墨酣饱浓烈，描绘出五光十色的画面，善借壮景抒发胸怀。杨朔的散文往往在诗的意境的创造以及意境的可感性方面下工夫。秦牧却善于在关键处画龙点睛，寥寥几笔就勾勒出一幅引人遐思的幽美情景。\n\n四、语言风格\n\n在语言风格方面，杨朔的散文语言质朴、生动、清新，语调独特，过渡照应很是严谨；秦牧的散文很注意状物写照的生动传神、亲切自然，一些古语、谚语、比喻的运用，也给作品增添了艺术的情趣；刘白羽的散文，善于运用对比、夸张、排比、比喻等多种修辞手法，产生了一定的艺术魅力。\n\n总的来说，杨朔的散文清新、明丽、深沉而富有诗意；刘白羽的散文广阔、豪迈、华美而饱含激情；秦牧的散文则丰富博达，渗透着知识性与趣味性。","keywords":"选择题材 结构技巧 表现方式 语言风格","note":"秦牧、刘白羽和杨朔这三位是十七年时期最重要，也是成就最高的三位散文大家，在具体了解他们各自的创作特点的同时，我们也需要把他们放在一起，在比较中明确三人创作风格的同与异。具体分析时，可以从题材、结构、表现方式和语言风格这几个角度进行切入。"},{"id":"306","stars":"★★","title":"当代文学初期报告文学创作特色","body":"建国初期大量的通讯报告（建国初期因艺术表现形式的相对粗糙，故称报告文学为通讯报告）应时而生，它们的总体特征，主要表现在以下方面：\n\n一、主题为反映抗美援朝战争和社会主义建设\n\n这一时期报告文学基本主题，主要表现为两个方面。一个方面是反映抗美援朝战争，其作者有作家、记者，更多的是参加战斗的指导员和部队政工干部。这些通讯较真实生动地叙写了中国志愿军英勇抗击敌人的战斗场面，讴歌了无数黄继光、杨根思式的战争英雄及他们的悲壮业绩。魏巍的《谁是最可爱的人》等朝鲜通讯选材严、开掘深，格调激越奔放，有抒情性，在当时产生了重大影响。\n\n这一时期通讯报告基本主题的另一方面是迅速及时地反映社会主义建设。其中有不少篇章，如柳青的《王家斌》、秦兆阳的《王永淮》、沙汀的《卢家秀》，描绘农村经过社会主义变革之后的气象和初期合作化运动中干部群众的精神面貌，在读者中引起广泛反响。华山的《童话的时代》、臧克家的《毛主席向着黄河笑》，以浪漫的诗意笔触表现根治黄河的气魄和征服黄河的理想，有政治鼓动性。杨朔的《石油城》、李若冰的《在柴达木盆地》、萧乾的《万里赶羊》、萧殷的《“孟泰仓库”》等作品则是勾画出了戈壁沙漠、内蒙古草原等祖国各地建设者艰难跋涉的足迹。\n\n二、直接为政治、政策服务的特征\n\n1957年以后出现了《一场挽救生命的战斗》《为了六十一个阶级弟兄》等一批有影响的作品。《文艺报》因势利导，先后发表了题为《充分发挥报告文学的革命威力》的署名文章和《进一步发展报告文学创作》的专论，《人民日报》编辑部和中国作家协会联合召开报告文学座谈会，大力予以倡导。同时，作家们因“反右”斗争扩大化而心有余悸，更是集中于歌颂性报告文学的创作，由此出现了大批影响一时的作品。这些作品反映着各类新事物、新人物、新风尚，着重表现我国人民战胜天灾人祸的勇气、毅力、情操和政治理想，显示出这个时期报告文学创作的共同特点：时代感、新闻性、歌颂性的题材与思想教育的结合。从中可以看出报告文学直接为政治、政策服务的特征。\n\n三、以歌颂为主，单调、简单和模式化\n\n新中国成立之后的报告文学在主流上走的是歌颂的道路，这一时期的主流“特写”都只关注了现实政治和社会生活中外在热烈新鲜的一面，而背后的矛盾、动荡甚至痛苦则被作品中表现出来的欢快所掩盖，社会和时代的共同认知和情感也代替了个体的认知和感受。虽充满热情和真诚，但难免陷入单调、简单和模式化的局限里。只有少数反映朝鲜志愿军战地生活、描写英雄先进人物和农村生活的报告文学作品，虽然也有上述的特点和局限，但相对而言，更多了一些真诚朴实的生活气息，艺术性也更强一些。\n\n【李凡关键词：抗美援朝战争 社会主义建设 为政治、政策服务 以歌颂为主】","keywords":"","note":"当代文学初期报告文学创作数量巨大，注重歌颂性、政治性，这是由当时特殊的政治文化环境所决定的。大家要** --- # 结合当时的社会背景，仔细分析。"},{"id":"307","stars":"★★","title":"以“三家村”杂文为例，谈谈60年代历史题材杂文的创作的变化","body":"一、杂文有所复兴\n\n30年代左翼同周作人等分道扬镳后，鲁迅将社会批评性强的作品与“小摆式”的小品文区别开来，称为“杂文”，如《且介亭杂文》。延安时期作家是从杂文的战斗性和政论性来继承鲁迅的战斗精神与正确的政治立场的，因此，他们不仅继承了“批判的武器”的作风，而且具有鲁迅的独立思考精神和对民族国家的责任感。毛泽东经过整风，没有否定鲁迅式杂文的官方地位，但实际上将它边缘化，将批评同志的作家打入“敌人”一类。50年代初，围绕“是否需要杂文”这一问题，冯雪峰等在《讲话》基础上进行论述，这时杂文已变成畏途并且成为一种不锐利的武器。双百时期，徐懋庸等用杂文批判官僚主义，形成了杂文在当代的第一次复兴，但很快便遭到打击。\n\n60年代初，国民经济进入为期四年的调整时期，文学界在1961、1962年也有相应调整，其中心是调整文学和政治的关系，在题材和风格上倡导有限制的多样化。这一时期，“三家村”杂文出现，杂文迎来了又一次短暂复兴。\n\n二、形式单一性\n\n双百时期刊物多，作家来自不同背景，选择的题材不同，许多内容都具有论争性。六十年代杂文，作者均为在党政和文化机构身居要职、知名的文人学者，立场单一，因而表现形式也相对单一化。\n\n三、风格中庸性\n\n不同于双百时期的尖锐性，这一时期的杂文作家谨慎，而无挑战的勇气，懂得自制，较少谈论现实问题，是建制内的知识分子以一种调理、温和、节制、适度的态度夹缝生存的体现。这一时期杂文作家的思想态度和文体风格主要是：在宽容中庸的形态中，寄托他们对现实生活缺陷的敏感、关切，容纳他们对于现代教条和僵化思想秩序的质疑性批判，从而也塑造叙述者的正直、坚强的思想品格。\n\n四、与政治联系密切\n\n这一时期的杂文作家如邓拓等人，既是学者，同时又是政府机构的高层官员，他们的杂文创作都是为政治所服务的，所以这一时期杂文在专栏设置上较容易引起读者的认同感和注意，期目的在于培养出他们宽容的胸怀和独立思考、判断的能力。又由于这一时期实施的提倡“轻松”的“软性”文化方针，所以他们的杂文呈现出谈心、引导式的叙述风格，和对知识的重视的风貌。\n\n五、与小品融合\n\n以“开阔眼界、丰富知识、振奋精神”为目的，这一时期的杂文积极缝合同小品文的裂缝，二者的体裁有融合的迹象。比如邓拓将周作人和林语堂所代表的人生派和幽默派与被定型化的鲁迅杂文传统进行整合，既具艺术性可读性又具现实意义，使杂文和小品文这两个名称都再次获得了应有的双刃剑的特质。","keywords":"杂文发展 单一性 中庸性 与政治联系密切 与小品融合","note":"六十年代的杂文与之前的杂文整体呈现出不一样的风貌，作家的锋芒大都收敛起来，杂文语言也变得温和。这一变化，和当时的社会环境尤其是政治环境的变动密切相关，大家要有所了解。“三家村”杂文是十七年时期比较重要的一个概念，在名词解释中出现的可能性不低，大家对此要有所准备。"},{"id":"308","stars":"★★","title":"“三家村”杂文的艺术特征","body":"“三家村”是指邓拓、吴晗、廖沫沙三个专栏作者。“三家村”得名源于60年代初他们在中共北京市委机关刊物《前线》上开辟的“三家村札记”杂文专栏。“三家村”杂文，主要是指三位作者在60年代前期创作的杂文。他们的杂文创作，主要具备以下特征：\n\n一、语调温和，文字朴素，呈现出谈心、引导式的叙述风貌\n\n“三家村”的成员邓拓、吴晗、廖沫沙都是知识广博的人，他们在杂文中纵谈读书治学、人生修养、历史文物、民俗人情、草木虫鱼，呈现出一种谈心、引导式的叙述风貌，其态度和语调是温和节制的。但在这些平易、委婉朴素的文字中，仍有不少“不为陈言肤词，不为疏慢之语”的篇章，也不乏匡时教弊、扶正祛邪、捍卫真理、无私无畏的凛然正气和坦荡襟怀。\n\n二、尖锐抨击说假话、大话、空话的行为\n\n“三家村”作者对当时社会上泛滥成灾的说假话、大话、空话的行为予以了尖锐抨击。例如邓拓在《伟大的空话》中，\n\n不仅深刻地揭露了那些不讲实际效果、欺骗和吓唬人的假话、大话、空话、套话、废话对人类社会的危害，而且特别指出那种“伟大的空话”因为有华丽的外衣和动听的词藻的包装，特别容易迷惑天真浪漫的青少年，危害更甚。由此，邓拓告诫人们遇事要采取实事求是的慎重态度，干万不要说大话，吹牛皮，否则将在事实面前碰得头破血流。与此同时，“三家村”作者还即小见大，借古鉴今，在杂文中勾勒出了形形色色的“假、大、空”人物的丑恶嘴脸。这些杂文，在“大跃进”刚过去不久的情况下就出现了，其针对性非常鲜明。\n\n三、批判了当时的“政治流行病”\n\n邓拓写于1957年的《废弃“庸人政治”》从一件“瞎指挥”的事件谈起：某县下了一道将全县的棉花都在同一天“打尖”的命令，结果使许多棉花未到“打尖”时也硬被打了尖。作者明确指出这种“庸人政治”除了让那些真正没有出息的庸人自我陶醉之外，根本毫无用处，奉劝人们遇事要深思熟虑，千万不要罔顾事实，乱作主张，以免害死人。此外，吴晗的《神仙会和百家争鸣》和邓拓的《“批判”止解》两文，还抨击了意识形态领域内出现的“左”倾偏差和形而上学的错误，提倡学术讨论的百家争鸣。他们认为“批判”其实是对各种具体问题进行具体分析，透过现象抓住本质的研究过程，绝非以“打击”或“否定”一切为目的的“武断”行径。这一系列杂文生动形象地为那些官僚主义者画了一幅像，批判了当时的“政治流行病”-官僚主义、主观主义、形式主义和教条主义。\n\n四、积极提倡实事求是\n\n“三家村”杂文在抨击时弊的同时，还积极提倡实事求是的科学精神，主张按照客观规律办事。如廖沫沙的《从一古文看调查研究》就对《战国策》中《邹忌讽齐王纳谏》一文做出了独到新颖的解释，指出这篇古文是说有问题就应“实事求是”，做“调查研究”，从共同中找出差别，从特殊中找到一般，从杂乱无章的客观现象中寻找出它的规律，只有这样，才能与客观实际符合。在《有帐必须算》《且谈收与藏》《从“无数”到“有数”》等一系列杂文中，廖沫沙进一步提醒人们必须按照客观规律办事，努力做到心中有数。\n\n不过，在我们合理地肯定“三家村”杂文的同时，也应该看到这种具有批判锋芒的文章在他们的全部杂文作品中占有较小的比例，更应该意识到，他们这时期之所以热衷于写杂文，仍然是作为高级干部在为“调整”时期的政治服务。","keywords":"叙述风貌 尖锐抨击”政治流行病”实事求是","note":"说到底，“三家村”杂文终归是为政治服务的，其创作特征可以从这一点切入理解。“三家村”杂文整体叙述风貌比较温和，这一点与当时整体杂文创作特征是一致的。但其中的部分文章还是体现出了杂文的批判性，针对当时的社会弊病进行了抨击，并积极提倡实事求是。这些内容，大家要有所了解。"},{"id":"309","stars":"★★★","title":"试分析当代文学初期的诗歌创作","body":"一、部分诗人陷入艺术困境\n\n“五四”以来的新诗诗人，在进入50年代以后，有相当一部分从诗界上“隐失”。这一情况的直接原因，一是对新诗“传统”的选择所导致的“主流”的“窄化”，将一批诗人排除在诗界之外；二是诗人已形成的创作个性、艺术经验与此时确立的写作规范发生了冲突，导致一些诗人陷入创作的困境。\n\n二、强调诗的社会功能\n\n在这一时期，在诗歌理论和实践上，诗歌界最关心的不是诗的“本体”问题，不是诗的语言问题。被反复阐述和强调的，是诗的社会功能，以及诗的写作者的立场和思想情感的性质的规定。诗服务于政治，诗与现实生活、与人民群众相结合，是当代诗歌观念的核心。合乎规格的创作主体（抒情主人公），应该作为阶级的、人民集体的代表出现。\n\n三、以“颂歌”为主\n\n这一时期的诗人主要处于思维调整期，有审美价值的诗歌作品不多，但具有共同的创作题材和主题，即党的光辉革命道路、伟大领袖的历史功勋、新中国社会主义建设的伟大成就；歌颂祖国、党、领袖和社会主义。于是，颂歌大潮就成为50年代持续不断的诗歌现象。1949年何其芳的《我们最伟大的节日》标志着一个颂歌时代的开始。其后郭沫若《新华颂》、胡风《时间开始了》、田间的《祖国颂》、艾青《国旗》、臧克家《有的人》、冯至《我的感谢》都具有代表性。\n\n四、产生了两种基本诗体\n\n诗歌的性质功能的规定，衍生出了诗体的两种基本模式：\n\n（一）强调从对写作主体的经验、情感的表达，转移到对“客观生活”，尤其是“工农兵生活”的反映，而出现“写实性”的诗。\n\n“解放区诗歌”存在着不同的写作路向和不同的诗体样式：活动于晋察冀的诗人，主要接受新诗的自由体诗的影响，重视从诗人情感、心理的反应，来表现时代和革命；生活于陕北、太行山区的一些诗人，更多从民间文化中取得借鉴，在取材上更重视以战争为背景的军队和农民生活的表现，叙事诗成为他们热衷的形式。\n\n在这一时期，以民间形式写作叙事诗的诗人及其创作，被确立为当代诗歌写作的方向。经常列举的“经典”作品有《王贵与李香香》（李季）、《赶车传》（田间）、《圈套》《漳河水》（阮章竞）等。这是要求从知识分子的情感抒发转移到对“新的世界、新的人物”的表现，是要求诗的“民族风格”所导致的结果。\n\n（二）“政治抒情诗”\n\n这一时期，社会主义改造和社会主义建设成为时代的最强音，因此，诗歌作为时代的号角表现出了它的战斗性与政治鼓动性，表现社会主义建设高潮和号召投身于社会主义建设事业的“政治抒情诗”出现热潮。支持这种诗体模式的，是强调感情抒发的浪漫主义诗观。\n\n在政治抒情诗中，诗人会以阶级的代言者的身份出现，来表达对当代重要政治事件、社会思潮的评说和情感反应。这种诗歌在诗体形态上，表现为强烈的情感宣泄和政论式的观念叙说的结合。政治抒情诗一般都是长诗，通常采用大量的排比句式对所要表现的观念和情绪进行渲染、铺陈。讲究节奏分明、声韵铿锵。与这种鼓动性诗歌一起出现的，还有诗歌朗诵的热潮。","keywords":"艺术困境 社会功能 颂歌 实体性的诗 政治抒情诗","note":"当代文学初期，也就是五六十年代的诗歌创作特征与这一时期文学的整体特征是一致的，在当时的政治环境与文学环境下，更多地是强调诗歌的社会功能，总体以“颂歌”为主。需要注意的是，十七年时期的诗歌和新时期的诗歌可能会放在一起对比，大家要关注一下这两个时期诗歌创作的不同。"},{"id":"310","stars":"★★★","title":"结合具体作品，简述五六十年代之交政治抒情诗的艺术特点（25山东大学）","body":"作为一种诗歌类型，“政治抒情诗”主要具备以下特征：\n\n一、受中国新诗浪漫诗风和西方浪漫派、苏联诗人影响\n\n从艺术渊源上说，政治抒情诗接受的影响来自两个方面。一方面是中国新诗中有着浪漫风格的诗风，准确地说，应是其中崇尚力、宏伟的一脉。当然，更直接的承继是30年代的“左联”诗歌，和抗战期间大量出现的鼓动性作品。另一方面是西方19世纪浪漫派诗人、当代苏联-特别是马雅可夫斯基-的诗歌。被称为“当代政治诗的创始人”的马雅可夫斯基，&#x4ECE;“直接参加到事变斗争中去并处于事变的中心”，贴紧现实政治的主题，“和自己的阶级在一切战线上一齐行动”，“像炸弹、像火焰、像洪水、像钢铁般的力量和声音”到“楼梯体”的诗行、节奏处理方式，都为当代中国政治诗的作者提供直接的经验。\n\n二、是当代政治与文学特殊关系的产物\n\n“政治抒情诗”表现了作者关注政治事件、社会运动的热情，和以诗作为“武器”介入现实政治的追求，诗中诗作者以“阶级”（或“人民”）的社会集团的代言人身份出现。因而，在这一诗体中，如何处理个体情感、经验，是引起争议的敏感问题。在艺术形式上，往往表现为观念演绎、展开的结构方式。有关现实政治和社会问题的观点成为统驭诗的各种因素的纲目。\n\n三、大量的排比句式\n\n“政治抒情诗”大都是长诗，通常采用大量的排比句式进行渲染、铺陈。也讲求节奏分明、声韵铿锵，以增强政治动员的感染力量。马雅可夫斯基的“楼梯体”在后来的创作中，不断融入中国古典诗歌的对偶、排比技巧，以增强形式感。\n\n四、某种意义上是一种“广场诗歌”\n\n当代的“政治抒情诗”的写作目标和相应的艺术形式，主要不是为个人阅读，而是诉诸公众场合的朗诵这种集体性的活动。因而，“政治抒情诗”大量出现的时候，也伴随着诗歌朗诵的热潮。\n\n五、热情有余而诗意不足\n\n政治抒情诗大都以充沛的激情贯穿始终，鼓动性极强，且适合朗诵。但其过于外显的政治功利色彩往往使这类作品热情有余而诗意不足。此外，有些诗人也试图在颂歌模式之外进行某些艺术探索，但这些努力均遭到无情的打击。在明白了时代给诗人提供的可能与“极限”后，他们中的有些人便又回到了颂歌的道路上来，如郭小川，此后他放歌歌颂的姿态反而更加明朗、热情。","keywords":"中国新诗 浪漫派诗人 马雅可夫斯基 政治与文学特殊关系 排比句式 广场诗歌 热情有余而诗意不足","note":"“政治抒情诗”可以说是十七年时期最重要的一个诗歌类型，并对之后的中国当代诗歌产生了重要的影响，在文学史上具有重要地位，考查频率非常之高。同时，“政治抒情诗”还可能会和“朦胧诗”做对比，二者的特征以及差异大家一定要注意。此外，“政治抒情诗”这一关键概念在名词解释中出现的可能性非常高。"},{"id":"311","stars":"★★★","title":"谈谈郭小川的艺术贡献","body":"一、集中体现强烈的社会使命感和豪迈的民族气概，鼓动作用和社会影响巨大\n\n1955-1956年间，郭小川“以一个宣传鼓动员的身份”，写下了一批以《致青年公民》为总题的楼梯式诗，这些诗召唤年轻一代为社会主义事业而赴汤蹈火，奉献青春生命，字里行间贯穿着一条为实现政治理想而奋斗的基线：必须与社会主义大建设中形形色色阻挡前进的势力作斗争。这些诗是刚获得解放的一代中国人强烈的社会使命感和豪迈的民族气概集中的体现。这些诗歌对年轻一代人的鼓动作用是大的，发生的社会影响也很大。\n\n二、探求个性主义、人性本位，拓展了政治抒情诗的抒情视野\n\n郭小川在1957-1959年间进入了另一个阶段。这是郭小川一生创作中最复杂也最值得珍视的时期。抒情长诗《致大海》和叙事长诗《白雪的赞歌》《深深的山谷》都是围绕革命人生这个命题展开的。抒情长诗《望星空》，既显出了新生民族革命人生的浪漫豪情，也显出了对宇宙生态的灵性感悟。它拓展了这一诗歌品种的抒情视野。\n\n1962年“千万不要忘记阶级斗争”的口号提出后，郭小川一向怀有的“向困难进军”的斗争哲学这次以更激越、锐利的意绪体现出来，这使他重新走上阐释政治命题，避开个性、人性、宇宙人生的路子。郭小川1962年及以后得诗歌有两个抒情方向：其一是，新中国时时刻刻都有阶级斗争的风风雨雨，而我们时时刻刻都得准备着投入战斗。其二是，每一个人时刻都要提高警惕，坚守岗位，发扬革命传统，保持战士本色。在这些诗里，坚持革命尊严、战士情操、战斗精神的表现，使郭小川重新和第二阶段探求个性主义、人性本位的政治抒情诗接上了轨。\n\n三、积极进行诗歌形式与内容的探索\n\n郭小川是诗歌积极的探求者，懂得内容与形式的辩证关系。郭小川在诗体建设上是有一定贡献的。在《投入火热的斗争》等“致青年公民”的诗中，他成功地采用马雅可夫斯基的楼梯式，并作了多种尝试与探索。这种探求形成了他颇为独特的“郭小川体”。“郭小川体”的节奏因诗体的多样而多姿多彩，或急促明快，或雄浑强劲，或沉着舒徐，或宣谕腔，或吟咏调，或节奏整饬均齐，或旋律大起大伏。特别值得一提的是在组行成节或组节成篇（章）的过程中中，郭小川充分运用了民歌中的复沓回环手法，诗节中各诗行相交、相随的对称，诗篇（章）中各诗节相交、相随的对称，使全诗节奏在复沓回环中层层递进，一唱三叹。","keywords":"鼓动作用 社会影响 个性主义 人性本位 抒情视野 两个抒情方向 内容与形式的辩证关系","note":"郭小川是十七年时期政治抒情诗的杰出代表，集中体现了十七年时期诗歌创作的特色。他的诗歌创作，对诗歌自身内容形式探索和当时的社会都产生了积极的影响，大家要掌握相关知识。郭小川的代表作品如《望星空》同时也是政治抒情诗的代表，其独创的“郭小川体”也影响一时，这些都有可能在名词解释中出现，大家要注意一下。"},{"id":"312","stars":"★★","title":"谈谈十七年时期贺敬之的政治抒情诗创作","body":"一、主要分为大型抒情诗和片断式的抒情短歌两类\n\n贺敬之的政治抒情诗主要有两类，一是以《放声歌唱》《十年颂歌》《雷锋之歌》为代表的大型抒情诗，一是《回延安》《桂林山水歌》《西去列车的窗口》等片断式的抒情短歌。\n\n贺敬之的长诗都基于宏伟的现实向着更光明的未来而放歌，气势磅礴，洒脱豪放，洋溢着革命激情，及时提出并回答社会生活中一些具有重大意义的问题，有较强的政治宣传鼓动作用，代表了诗人在新中国成立后诗歌创作的主要成就，集中显示了他的诗歌艺术风格，并在当代政治抒情诗的发展中产生过重大影响。\n\n贺敬之短篇诗歌常常以缅怀为抒情向度，他的缅怀不带来伤感，因为重返过去所发现的恰恰是奔向未来的依据与动力。这些诗歌大都意境深远，感情细腻，讲究炼字炼意，具有民歌风味和古诗词韵致，具有较好的可读性。\n\n二、将自我自觉融入“大我”中\n\n与郭小川的矛盾和困惑不同，贺敬之始终以确定、明朗的态度处理诗与时代、与政治的关系，将自我自觉融入“大我”&#x4E2D;。高亢豪迈的“放声歌唱”，对于贺敬之来说，既是一种诗的抒情方式，同时也是他基于坚定政治信念而由衷发生的自我\n\n情感状态，这决定了他的诗以紧跟和配合方式同时代政治发生着密切的关联。贺敬之的政治抒情诗代表作《放声歌唱》《雷锋之歌》等，都选取了时代的重大命题，尽力发掘其精神蕴含和审美情致，并且在形象与情感、自我与时代之间取得了一种融合。\n\n三、高度的浓缩性和概括性\n\n在诗体上，贺敬之在马雅可夫斯基的阶梯式基础上，化入中国古典诗歌的典雅和对仗，选语警辟，意象跳脱，具有高度的浓缩和概括性，在对比和铺排中形成一种张力。\n\n贺敬之善于把握和驾驭重大题材，把一些抽象性很强的命题熔铸到宏伟的艺术构想之中，哲理和象征、政治和诗情交织，但是，在时代语境发生大的转换之后，当年的热情洋溢就显得有些浮泛，词句的过分夸张也难以在今天的读者中唤起共鸣。","keywords":"大型抒情诗 片断式的抒情短歌 将自我自觉融入“大我”高度的浓缩和概括性","note":"贺敬之和郭小川可以说是十七年时期政治抒情诗创作的代表诗人，不过相较于郭小川，贺敬之显得更“纯粹”一些，将自己的诗歌与时代、政治紧密地联系了起来。他的诗歌分为大型抒情诗和抒情短歌两类，各自有其特色，我们要注意一下."},{"id":"313","stars":"★★★","title":"谈谈田汉《关汉卿》的艺术特色","body":"一、史料依据与艺术想象相结合\n\n关汉卿虽然是元代的大戏剧家，但可供稽考的史料甚少。田汉只能从关汉卿流传下来的剧作和散曲中去寻找、体察他的性格，挖掘他的人生精神，设想他的生平和为人。但是对关氏在散曲中表现出来的消极情绪，田汉则采取了“六经注我”的办法，将原始材料进行加工改造甚至翻转重铸，以塑造他心目中的关汉卿形象。正是经过这样一番发掘、翻转和重铸，田汉终于将一个史料极少、言行复杂的关汉卿，匠心独运地塑造成了一个形象丰满、具有浩然正气的艺术家形象。\n\n二、“为民请命”的政治主题和铜豌豆精神\n\n田汉认为，为民请命的精神不仅在当时具有进步意义，即使在今天也有一定的积极作用。所以他的《关汉卿》便以为民请命为主题。这个主题是以对关汉卿响当当的铜豌豆精神的描写来体现的。“为民请命”可谓该剧的政治主题，而铜豌豆精神则是关汉卿的性格主题，这两个主题凝聚起来体现在《窦娥冤》的创作及关汉卿的遭遇中。\n\n三、由“情”升华为撞击灵魂的精神力量\n\n田汉从一个初窥剧苑的习作者到中国剧坛的盟主，胸中始终贯穿着一条红线，即“Violin and Rose”情结。这个情结的内核是对自由、民主光明的追求，是“人道主义”之火的燃烧。这个情结在不同的时期有不同的表现内容。在《关汉卿》中，就表现在“那种强烈的正义感，那种不可征服的是非之心，那种为民请命的斗争精神，最后都要在Violin and Rose的情结中被赋予一种‘情”的力量，被升华为撞击灵魂的东西，否则就难以与普通的公案戏区分开来”。这种情的力量体现在关汉卿与朱帘秀为正义而抗争的爱情上，更体现在关汉卿从朱帘秀爱的支持和鼓励中所获得的信心和力量上。田汉并不是把关汉卿作为一个完美无缺、一成不变的英雄来塑造的，他的性格是在朱帘秀的推动下逐步发展的，这体现出情如何升华为一种撞击灵魂的精神力量。\n\n四、戏中戏的戏剧结构\n\n《关汉卿》剧作中穿插了《窦娥冤》一剧的写作、演出和因此而来的不幸，这种艺术构思是新颖而深刻的。关汉卿一生共写了18部戏，其中《窦娥冤》成就最高，是关氏全部创作的灵魂之所在。以《窦娥冤》的写作概括关汉卿的一生和性格精神是十分适当的。戏中戏的巧妙构思，既提高了剧作的思想性，同时也丰富了剧作的艺术性。\n\n五、话剧加唱的表演形式\n\n话剧加唱，是田汉的一贯做法，也是他的拿手好戏。“他从《南归》开始直到《关汉卿》，经常运用诗歌和音乐作为抒情的艺术手段；在话剧创作中，他开辟了颇受观众欢迎的“话剧加唱”的新风气”。《关汉卿》结合剧情安排了不少富有意境的歌唱性曲词，如《蝶双飞》，由朱帘秀吟出。在第十一场里，朱帘秀又唱了支《沉醉东风》。这些曲词不仅是关、朱二人精神世界的剖白，也增强了戏剧的诗意和抒情性。这种话剧加唱的做法，是田汉对传统戏曲的继承，是话剧民族化的一种尝试。\n\n《关汉卿》美中不足之处是把关汉卿过分政治化、革命化了，而关汉卿作为风流才子杂剧班头的一面没有得到充分的表现。但无论如何，《关汉卿》的艺术成就不容泯灭。\n\n【李凡关键&#x8BCD;：发掘、翻转和重铸 为民请命 铜豌豆精神 “Violin and Rose”情结 戏中戏 话剧加唱】","keywords":"","note":"《关汉卿》是十七年时期历史剧创作中比较有代表性的一部作品，围绕关汉卿这样一个艺术形象，田汉做出了许多浪漫处理和艺术加工。同时，《关汉卿》也体现着田汉一直以来的艺术追求，大家要仔细把握。十七年的戏剧创作相关的名词解释，主要会围绕这一时期的代表作品如《关汉卿》《蔡文姬》《茶馆》等出题，尤其以《茶馆》考查频率最高，大家要多注意一下。"},{"id":"314","stars":"★★★","title":"比较《关汉卿》和《蔡文姬》的创作特色","body":"一、相同点\n\n（一）都具有浪漫主义、理想主义特点\n\n田汉和郭沫若都曾是主张浪漫主义的创造社作家，也都是具有浪漫气质的诗人。《关汉卿》和《蔡文姬》都具有浪漫主义特点，并且都又表现为理想主义。\n\n《蔡文姬》歌颂了理想人物，描绘了理想社会：政治家清正廉洁，杰出人物真诚坦白，胸怀宽广，人人识大体，顾大局，有正义感、上进心，都想为民族和睦、建设美好生活尽心尽力。\n\n《关汉卿》塑造了由民间艺术家和下层劳动人民组成的理想主义群像，歌颂了在残酷专制下勇于抗争、团结上进的英雄群体。\n\n（二）都具有浪漫主义诗情\n\n田汉和郭沫若创造了理想世界，也陶醉在理想之中。他们激情澎湃，诗情洋溢，其作品都具有浪漫主义诗情，并且都表现在三方面：\n\n（1）将诗入剧，如《关汉卿》中的《双飞蝶》《沉醉东风》，《蔡文姬》中的《胡笳十八拍》《重睹芳华》，优美的诗篇镶嵌在情节发展和人物命运的重要时刻，增加了浓浓的诗情。\n\n（2）用诗一般的语言表现人物内心世界，如《关汉卿》第八场朱帘秀面对即将来临的死亡时那大段台词，《蔡文姬》在长安郊外父亲墓旁的大段独白，都发自肺腑，如诗如诉。\n\n（3）运用布景、音乐、道具营造诗一般的舞台气氛，如《关汉卿》中的卢沟桥送别，《蔡文姬》中长安郊外夜景，场面如画，语言如诗，人物沉浸其中，发自内心的声音如歌如吟，整个舞台都充满诗情画意。\n\n（三）都重视形象塑造\n\n郭沫若与田汉都喜欢在尖锐的矛盾冲突中刻画人物性格。\n\n田汉设置了写不写、改不改、走不走、降不降、悔不悔的矛盾，让关汉卿在尖锐的矛盾对立中经受考验，多方面刻画人物性格。田汉营造的矛盾冲突主要表现为人物与环境的对立。\n\n郭沫若则将笔触伸向人物内心世界，表现性格冲突。他将人物设置在特定的“情势”之中，人物只能在此进行抉择，而任何抉择都是艰难痛苦。如《蔡文姬》开篇将蔡文姬置于“走”与“留”的两难境地，不能轻易决定，蔡文姬的性格在这残酷的冲突中得到深刻表现。\n\n（四）人物情节并重\n\n田汉和郭沫若都是深解戏剧“艺术三昧”的剧作家。他们与淡化情节、淡化戏剧性的老舍不同：既重视人物，也看重情节结构，且十分讲究。\n\n《蔡文姬》把为曹操翻案的题旨寄托在“文姬归汉”这一载体上，运用直接和间接两种描写手法写曹操，既写了曹操、蔡文姬，也表达了自己二十多年前的情感经历，可谓匠心独具。\n\n比较起来，田汉更重视故事情节，他采用“戏中戏”的结构手法，波澜起伏，一波三折，带有传奇性、戏剧性、神秘性，矛盾冲突有开端、发展、高潮、结局，是一个完整过程，因而《关汉卿》更像“戏”。\n\n（五）都运用了史实与虚构相结合的艺术手法\n\n《关汉卿》与《蔡文姬》都出色地运用了史实与虚构相结合的艺术手法设计矛盾冲突和戏剧情节，完美地实现了剧作主题的个别具体化。\n\n二、不同点\n\n（一）戏剧内容的构思各具匠心\n\n郭沫若的《蔡文姬》在构思内容时，虽然依旧取材于“文姬归汉”，却善于从这旧题材中发现新意，提炼出“个人利益服从国家利益”的崭新主题，强烈地折射出社会主义新中国的时代精神。创作该剧的1959年，新中国已经诞\n\n生10年，人民当家做了主人。而正确处理个人利益和国家利益的关系，以个人利益服从国家利益，便是当时的一大时代精神。作家用此时代精神去烛照历史，发现蔡文姬在归汉过程中内心矛盾的两大内涵，即“喜得生还兮”报效国家，“子母分离兮”痛苦悲伤，究其实质，正是国家利益与个人利益的冲突。由于从题材中发现了这一古今相通点，《蔡文姬》的崭新主题，即反映个人利益与国家利益的冲突，个人利益必须服从国家利益，便在头脑中孕育成功了。\n\n田汉在构思《关汉卿》的内容时，特别注意了选材、立意和形象表现主题的真实性。作家把《关汉卿》的内容，集中在关汉卿创作和上演《窦娥冤》这一点上，一方面彻底揭露了元朝官吏们贪赃枉法、草菅人命的罪行，同时又热情歌颂了以窦娥为代表的劳动人民。\n\n（二）矛盾冲突的处理各得神髓\n\n《关汉卿》用舞台形象表明，在悲剧性冲突中，正面人物坚持的目的是正义的，代表了“历史的必然要求”，反面人物追求的目的是邪恶的，二者形成水火不容的对抗性冲突。这种正义与邪恶的冲突，贯穿全剧。这部剧作同时也体现出悲剧人物不可能自己解决矛盾，最终只能归于失败或毁灭。\n\n《蔡文姬》通过描述蔡文姬、曹操等人所遭遇的喜剧冲突，以及对此冲突的解决方式，完满地回答了喜剧应当怎么处理喜剧性冲突。喜剧冲突中的人物，起初坚持的目的是不正确的，至少也是片面的；但喜剧人物可以自己解决矛盾，通过否定自我或他人的错误，最后成为真理的掌握者。\n\n【李凡关键词：理想世界 浪漫主义诗情 重视形象塑造 看重情节结构 内容 矛盾冲突 悲剧 喜剧】\n\n【李凡&#x8BF4;：类似这种比较两位作家、作品的题目，既要说出相同点，也要说明二者的差异。在作答时可以联系二者的创作特征，从人物塑造、戏剧结构以及语言艺术特色等等角度进行分析。《蔡文姬》与《关汉卿》都是十七年时期比较重要的剧作，二者在题材和艺术手法上也有一定的相似性，因而会被放在一起对比，大家要注意一下。】","keywords":"","note":""},{"id":"315","stars":"★★★★★","title":"论述《茶馆》的艺术特征（25中央民族大学、26南京师范大学）","body":"一、塑造了各种鲜明的人物形象\n\n《茶馆》中人物众多，个性鲜明，在人物塑造上取得了巨大的成功。在人物塑造上，老舍擅长白描手法，他的白描总是漫画式的，其中加入了喜剧的因子，可以于嬉笑怒骂中凸显人物身上的“可爱或可憎之点”。《茶馆》中的七十多个人物的性格特点大都是三言两语勾勒出来的，其中最典型的莫过于马五爷的形象。老舍只用了三句台词，就真切地描绘出其霸道、虚伪、狂傲的洋奴性格。\n\n二、语言朴实凝练，具有浓郁的北京风味\n\n（一）人物语言的个性化\n\n老舍善于根据人物的身份和性格，选取符合他们心理的个性化语言。《茶馆》的众多人物，不管是贯穿全剧的主要人物，还是只有一两句话的过场人物，不管是本性善良、令人同情的市民贫民，还是无良无耻、坏事做尽的流氓、打手等社会渣滓，都因为个性化的语言而给人以栩栩如生的深刻印象。\n\n（二）语言幽默，寓庄于谐\n\n老舍谈《茶馆》时说，作品写了“那些年代的啼笑皆非的形形色色”。他把对黑暗社会的讽刺、批判与强烈的爱国热情和对劳动人民的同情联系起来，在微笑中蕴藏着严肃和悲哀，形成了自己特有的幽默风格。如松二爷看见宋恩子和吴祥子仍穿着灰色大衫，外罩青布马褂，就说：“我看见您二位的灰大褂呀，就想起了前清的事儿！”表现出松二爷的怀旧情绪，也讽刺了辛亥革命的不彻底。这种寓庄于谐的语言更能给读者以回味的思考。\n\n（三）浓郁的北京地方色彩\n\n老舍本人熟悉北京方言，特别是北京市民的语言。恰当地使用地道纯熟的北京方言，使《茶馆》更具地方色彩，也更真实。剧本中“您圣明”“给您请安”等客套话，都是宫廷语言民间化、生活化的表现。这是北京特有的文化氛围所培育的客气、周到的语言表达习惯，极具民族和地域的特色。\n\n三、人像展览式的戏剧结构\n\n《茶馆》在结构上，不追求故事的完整、情节的曲折和集中。剧本大胆地使用无数张人物速写组成的几十幅时代的剪影，形成一个个戏剧片段，再经过作者的巧妙编织，展现了多种多样的戏剧冲突，广泛地反映了时代环境和社会心理，因此被人称为“图卷戏”。三幕戏就像三组风俗画，按照社会发展时序选取重大事变发生后的短暂时期，一幕反映一个时代，时间跨度极大，由此成为了半封建半殖民地社会的一个缩影。\n\n四、话剧民族化的典范\n\n《茶馆》是话剧民族化的典范，它的典范性首先体现在活的老北京浓浓的北京味儿，地道的中国人，深沉的历史感。它突破了西方话剧的一贯写法，也没有走上戏曲化的习惯道路，创造出一种独具中国风与现代性的话剧形式，创造出新的民族化剧诗形态。\n\n五、悲喜交汇的风格\n\n《茶馆》融悲剧与喜剧于一体，形成了悲喜交汇的风格。剧本既写了王利发、常四爷、秦仲义等人追求生存和发展的美好愿望与旧时代之间的矛盾冲突的悲剧，也写出了旧时代的荒谬，社会渣滓、丑恶小人和流氓无赖带有喜剧性的可笑表演。这种“含泪的笑”体现出老舍亦悲亦喜、悲喜难辨、哭不出来、笑不出声的艺术效果。\n\n六、深厚的人性传统\n\n《茶馆》的叙述动机，来自于对建立现代民族国家的强烈渴望，和对一个不公正的社会的强烈憎恶。这部以葬送三个时代为使命的剧作以批评讽刺为基调，矛头指向的是那些社会残渣和那些形形色色的反动势力，对他们进行了无情的揭露与批判，然后作者在对这些腐朽势力锐意批判、讽刺的同时，却也将自己对劳动人民的深深热爱，对没落小人物的同情毫无吝惜的从笔尖汨汨而出，表现出作者坚定的立场。新旧社会对比既是老舍结构作品的方法，也是他的历史观。老舍对于“旧时代”北京社会生活的熟悉，他对普通人的遭际命运的同情，他的温婉和幽默，含泪的笑，使这部作品接续了老舍创作中深厚的人性传统。\n\n七、描写黑暗现实与展现光明前景巧妙结合\n\n老舍在《茶馆》里没有借助于情节的发展将光明的未来直铺在人们面前，而是通过旁敲侧击，台前穿插和幕后渲染的方式让人们自己去体会，自己去感受光明。如剧中提到的常四爷参加义和团抗洋，康大力参加革命，学生发起运动等等，虽所用笔墨不多，但这点滴笔墨就像一粒火种点亮了通向光明的灯盏。","keywords":"形象鲜明 白描 语言幽默 寓庄于谐 京味儿 人像展览式 话剧民族化 悲喜交汇 深厚的人性传统 黑暗现实 光明前景","note":"《茶馆》是老舍在当代文学中的重要作品，大家在记忆时注意联系王利发等人生活的时代背景的变迁，来体会作者各种艺术手法运用的目的，以及一如既往的北京地方色彩。作为十七年时期最重要的一部剧作，《茶馆》在名词解释考查中出现的频率相当之高，大家要注意一下。"},{"id":"316","stars":"★★★","title":"谈谈《茶馆》的思想主题","body":"《茶馆》以断代史的方式，通过描绘“戊戌变法”失败后的清末、军阀混战的民初、抗日战争结束三个时代里活动在裕泰茶馆周围的人物的命运遭际，表达了“葬送三个时代”的政治主题。三幕戏剧，每幕担负“葬送”一个时代的任务。暗示只有投身中国共产党领导的社会主义革命才有前途。《茶馆》在否定与暗示中揭示了历史发展的必然趋势，这个主题是深刻而富有意义的。\n\n一、第一幕：暴露清帝国的黑暗本质\n\n《茶馆》第一幕，作者选取了戊戌政变后这段最反动、最黑暗的时期，通过在茶馆中进出的各色人物，把一幅幅血淋淋的、令人颤栗的画面推到读者和观众面前：太监要买大姑娘当老婆，农民无法生活不得不卖儿女，流氓暗探横行乡里，正直的人因一句话就要坐牢......常四爷不无惜地说出的“大清国完了”那句话，正是作者想说并想告诉观众的话。这一幕通过康六卖女、太监买老婆、常四爷被捕等事件展现了上层社会与底层社会的不可调和，暴露了那个时代的黑暗本质，完成了“葬送”任务。\n\n二、第二幕：表现封建军阀的反动面目\n\n《茶馆》第二幕是选取了20年代初这一军阀混战，民不聊生的时期。王掌柜苦心经营，“改良”裕泰茶馆，令其重新开张，但动荡的社会令王掌柜忧心不已，茶馆的经营越发艰难。暗探宋恩子、吴祥子摇身一变又成了军阀的走狗，敲诈勒索，两个逃兵想合娶一个老婆。茶馆生意清淡，面积缩小，“改良”后还未开张就厄运临头，特务、巡警、兵痞就接二连三来敲诈勒索，而一些企图有所作为的良民百姓却走投无路。人们在被逼无奈中开始觉醒，暗示了这个时代灭亡的必然。\n\n三、第三幕：揭露国民党当局的腐败\n\n《茶馆》第三幕，场面最凄凉，抗日战争结束后，国民党和美帝国主义又使人民陷入了内战的灾难。吉普车横冲直撞，爱国人士惨遭镇压，流氓特务要霸占王掌柜苦心经营了一辈子的茶馆，王利发绝望了。越加黑暗的社会已经逼得老年的王掌柜走投无路，最后在茶馆被人强占的绝望与不甘中自尽而亡。王掌柜的激愤与悲剧表现了旧社会普通民众面对混乱、黑暗世道的无奈、无力与绝望，具有震撼人心的思想和艺术力量，也预示着这样腐败的社会注定是要被埋葬的。","keywords":"中国历史的变迁 葬送三个时代 历史发展的必然趋势 揭露与批判 坚定的立场","note":"《茶馆》思想内容的核心关键词是“葬送三个时代”，重点在于突出和暴露作品中涉及的三个时代灭亡的历史必然性，故此以底层人物为落脚点，描写时代变迁下的茶馆，并由此展现了上层社会与底层社会的不可调和。对于这一思想主题，大家要仔细把握。"},{"id":"317","stars":"★★★★","title":"老舍剧作的艺术特色","body":"一、写北京和北京的变化\n\n老舍先生在北京，熟悉北京，对北京有一种特殊的感情。在老舍的写作生涯中，创作了大量的以北京为背景的作品。新中国成立之后，解放了的北京日新月异，老舍同样写出这些变化，如《方珍珠》《全家福》《茶馆》等这些剧作忠实而多方面的记录下北京社会的历史变迁和革命性变化，抒发了“我爱新北京”的真挚情怀，歌颂了党和人民政府。\n\n二、辩证法的巧妙运用\n\n老舍话剧中的人物都不是那种脸谱式的“好的一切都好，坏的一切都坏”，而是活生生的真人，像是《龙须沟》里的刘巡长，《茶馆》里的秦仲义、松二爷等角色，老舍写出了他们的个性，写出了他们好与坏两方面的思想，赋予了他们艺术生命，所以令人难忘，并且深信不疑。\n\n又如老舍刻画了不少妇女形象，这些形象以不同的出身、经历、性格活跃在舞台上，互不雷同，不会为人们所混淆。像是《女店员》里的齐母和《龙须沟》里的王大妈，都是从旧社会过来的受习惯势力影响很深的家庭妇女，但在对待女儿的问题上，想法和做法却截然不同。\n\n三、戏剧具有民族风味，人物具有民族性格\n\n老舍早年研究过“国民性”的问题，对中国人民的性格，他们的长处与短处，优点与缺点，有着清楚的了解，这一性格在老舍戏剧中的人物身上体现了出来。如从《龙须沟》里的程疯子、赵老头、程娘子，《全家福》里的李珍桂，《茶馆》里的常四爷、王利发、康顺子等人物身上，我们能看到中国人民所特有的那种吃苦耐劳、忠厚善良、不畏暴强、乐于助人、勇于进取的精神和品德。\n\n四、戏剧靠人物取胜而不是靠情节取胜\n\n老舍的剧本在结构上，不追求故事的完整、情节的曲折和集中，而是大胆地使用无数张人物速写组成的几十幅时代的剪影，形成一个个戏剧片段，经过作者的巧妙编织，展现多种多样的戏剧冲突，广泛地反映了时代环境和社会心理。如《龙须沟》《茶馆》等剧，没有完整的故事情节，没有贯穿到底的事件和戏剧冲突，人物也不是一两个，而是十几个、几十个，特别是《茶馆》，有名有姓的人物就有四十多个，很难说谁是主角，但通过这些人物的经历以及所思所想，我们看到了时代的变迁。\n\n五、语言幽默风趣\n\n老舍是卓越的语言艺术大师，老舍的剧作语言幽默、讽刺、诙谐，他善于运用极精炼的笔墨，用经过提炼了的北京话赋予人物以生命。老舍始终把眼睛盯在人物性格与生活上，以期开口就响，闻其声知其人，三言五语就勾出一个人物形象的轮廓来。如《龙须沟》里开头的一段对话，寥寥数语，四嫂那心直口快、善良而急躁的性便格清晰可见，小妞的委曲情绪也跃然纸上。\n\n“文革”文学","keywords":"京味 辩证法 民族风味 人物为主 语言幽默","note":"老舍在建国后创作了大量的戏剧作品，全面地总结一下他的戏剧艺术成就和经验，对于进一步认识老舍在文学史上的地位，是十分必要的。大家可以从题材内容（老北京）、民族风格、人物形象、剧作结构等方面答题，并结合代表剧作《茶馆》《龙须沟》进行分析。"},{"id":"318","stars":"★★","title":"简述“文革”文学的特征","body":"一、“政治”的直接“美学化”\n\n在“文革”时期，政治观念、政治意图直接转化为艺术作品，即“政治”的直接“美学化”。同时，作品的接受行为，也更明确地被赋予政治的意义。文本的生产、发表、阅读、批评，就是一种“政治行为”。\n\n二、观念论证式的结构\n\n在“真实性”问题上，中国当代作家对“感觉怎样”“应该怎样”“实际怎样”之间的矛盾的困惑，在这时已经变成对“应该怎样”（政治意识形态要求）的不容置疑的认定。这种文学观念，导致文学创作出现观念论证式的结构。文学写作的“思维过程”，被规定为这样的公式：“表象（事物的直接映像）一概念（思想）-表象（新创造的形象），即个别一一般一典型。”创作和阅读过程中的形象思维、直觉、体验等，被看成是“神秘主义”的东西而被拒绝和清除。\n\n三、象征手法和“典型化”方法被广泛应用\n\n对“革命浪漫主义”的强调，在修辞方式上，表现为象征方法的广泛运用。意义指向确定的“公共”（而非个人化的体验）象征，取代了对生活细节精确刻画的描述。“比普通的实际生活更高，更强烈，更有集中性，更典型，更理想”的“典型化”的方法，对于表达政治意图，虚构由“革命”所激发的浪漫想象，是一种更有效的手段，在这一时期被广泛应用。\n\n四、题材人物的“三突出”\n\n一方面，所有的作品必须主要表现英雄人物，英雄人物在作品中又必须居于中心的、绝对支配的地位；另一方面，塑造的英雄人物必须高大完美，不允许有思想性格的弱点（“高大全”）。提出“三突出”的创作规则，有力保证了“社会主义文学必须把创造新人形象作为‘中心的＇或‘根本的＇任务”这一根本任务的实现。这种创作规则，在很大程度上是“中世纪式”的，事实上是严格的社会政治等级在文学结构上的体现。\n\n五、文学形式的戏剧化\n\n“文革”期间，戏剧在文艺诸样式中，居于中心地位。戏剧既是被选择用来进行政治斗争的“突破口”，也是用来开创“无产阶级文艺新纪元”的“样板”的主要形式。戏剧，尤其是地方戏曲，与普通民众有着紧密关系，是他们最主要的娱乐方式之一。左翼文艺家如果要发挥文艺的宣传教诲功用，戏剧无疑是首先考虑的样式。\n\n处于“中心”的戏剧对文学其他样式产生重要的影响。主要表现为诗、小说、散文在结构上的“场景化”，即矛盾的若干线索的安排，开端、发展、高潮、结局的方式都按照戏剧冲突进行设置。小说中的人物也大多“角色化”，在冲突中有确定的地位和明确的性格特征，并且人物间安排了许多戏剧台词式的对白。","keywords":"政治美学化 观念论证式 典型化 三突出 戏剧化","note":"“文革”文学，顾名思义，从名字我们就可以明确感受到文学与政治的关系更加紧密了。因此，在总结“文革”文学的特征时，要结合当时时代背景，从文学政治化，政治美学化方面去分析。“文革”文学这一部分内容整体考查偏少，即使考查也基本不会考查论述题，而是主要围绕这一时期的一些关键概念考查名词解释，比如“三突出”“样板戏”“白洋淀诗群”“天安门诗歌”“黑八论””《纪要》”等，所以我们要重点关注这一时期的名词解释。"},{"id":"319","stars":"★","title":"“样板戏”是否具有文学价值","body":"除却消极一面的影响，“样板戏”也做出了某些有益的尝试，它的文学价值，主要体现在以下方面：\n\n一、“样板戏”有助于中国传统戏曲的现代化与西方艺术的中国化\n\n“样板戏”改造了传统京剧形式，并赋予其“现代”意味。“样板戏”在结构安排、台词和唱腔设计、舞台艺术（灯光、舞美、音乐等）设计以及舞台表演等方面，都做了精心安排，并大量运用夸张、变形、隐喻、象征、讽喻等现代艺术手法（“革命浪漫主义”）。“样板戏”一改念白传统，实现了个性化、通俗化、生活化。它是当代人的活的语言，又适应了人物的身份和性格。另外，“样板戏”在唱腔、舞蹈、音乐等方面的精益求精，有益于戏剧本体的建设。\n\n二、传奇性、可观赏性等民间审美趣味在“样板戏”中得到保存\n\n“样板戏”创作文化来源的复杂性，使作品的意义和艺术形态呈现多层、含混的状况，而这正是“样板戏”在政治意识形态发生变化的时空下，尚能获得某种“审美魅力”的原因。同时，文化人在“样板戏”创作中的重要地位，对民间文艺形式的借重，以及从“宣传效果”上考虑的对传奇性、观赏性的追求，都使文艺革命激进派的“纯洁性”&#x7684;企求难以彻底实现。正统叙述之外的话语系统的存在这一事实，“既暗示了另类生活方式”，也承续了激进派所要否定的文化传统，而使某些“革命样板戏”在构成上具有“含混暧昧”的特征。\n\n三、有强烈的戏剧冲突\n\n“样板戏”均取材于革命历史斗争，情节曲折，斗争激烈，悬念丛生，富于传奇性。创作者抓住关键场面，浓墨重彩地表现主人公与敌人面对面的较量，以表现人物的性格。《沙家浜》“智斗”中的阿庆嫂，柔中带刚，巧施手段，牢牢掌握主动权；《红灯记》“赴宴斗鸠山”中的李玉和，先调侃后大义凛然，让鸠山的伎俩一一破产。人物间的性格碰撞构成一个个戏剧冲突，成为戏中戏。\n\n四、作品蕴含深厚的道德思想\n\n道德理想在“样板戏”中表现为爱国主义、国际主义、对领袖和革命事业的忠诚、部分服从全局、个人服从集体等等，满足了广大群众对敌人的憎恨和道德理想。\n\n五、虚实结合\n\n“样板戏”吸收了话剧的写实手法，在布景拟实、道具丰富、时空状态等方面给人以身临其境之感的同时，打破了传统程序，按人物的身份、地位、性格和环境的需求化妆打扮，设计唱段、道白等，形成整体的写实风格。在此基础上，在某些重要场面，“样板戏”又发挥传统京剧的虚拟特长，达到写实和虚拟结合的艺术效果。\n\n可见，“样板戏”在对中国当代生活的想象和审美诸方面仍然是与观众契合的，从而具有一定的文学价值。","keywords":"现代化 中国化 传奇性 可观赏性 强烈冲突 道德思想 虚实结合","note":"“革命样板戏”的产生与政治和阶级斗争有密切联系，但客观而言，也可以从手法、技巧等方面发现一些优点和文学价值，需要我们辩证地进行客观评价。"},{"id":"320","stars":"★","title":"丰子恺《缘缘堂续笔》有何艺术特色","body":"一、流露出人性的生趣与光辉\n\n丰子恺的《缘缘堂续笔》是作家在1971至1973年间利用凌晨时分偷偷写成的。在一个举国狂乱的大浩劫年代，这些散文疏离于时代共名之处而保持了作家平和的风格，在对旧人旧事与生活琐事的满怀兴致的记忆与书写之中，体现了作家的生存智慧，并由此流露出在喧嚣与混乱之中人性的生趣与光辉。在《暂时脱离尘世》中，丰子恺引用夏目漱石的话：“苦痛、愤怒、叫嚣、哭泣，是附着在人世间的。我也在三十年间经历过来，此中况味尝得腻了。腻了还要在戏剧、小说中反复体验同样的刺激，真吃不消。我所喜爱的诗，不是鼓吹世俗人情的东西，是放弃俗念，使心地暂时脱离尘世的诗。”大体说来，这段话可以概括《续笔》的创作特点。\n\n二、关注真正代表了人生的真趣的小人物与小事情\n\n“使心地暂时脱离尘世的诗”并不是意味着否定生命与脱离人生-像一般人对佛教所理解的那样（丰子恺是著名的居士），而是意味着远离时代的喧嚣与疯狂，把目光投向虽然细小却真正代表了人生的真趣的小人物与小事情。所以在《续笔》之中，丰子恺津津乐道的或者是“吃酒”“酒令”“食肉”之类琐屑之事，或者是“牛女”“清明”“酆都”“塘栖”之类的时令风物，或者是“癞六伯”“五爹爹”“王囡囡”“阿庆”之类的市井细民，或者干脆就叫做“琐记”，在这些小人小事之中，他发现了人生的真趣味。在丰子恺的笔下，浸透了一种对人生平和而亲切的真性情，这种真情表面看是一点也不伟大的，可是它却没有丝毫伪饰，在一个充满了虚假与夸张的革命激情的年代，这种平和的声音恰恰代表了人性的声音。\n\n三、追求达观与知命的智慧\n\n丰子恺特别欣赏那些能够“自得其乐”的人，《癞六伯》《阿庆》中的两个人物，就是这样的代表。作家之所以欣赏这些小人物，是因为他们身上那种对自在的生命的欣赏以及自发的对精神生活的追求与作家自己的精神追求和人生智慧有相通之处。这种智慧具体说来就是达观与知命。在明白了人生的“无常”之后，不是陷于绝望、疯狂，而是以平和的心态继续生活于人间，决不像俗人那样执迷，但对人间却仍然保留一种平和的爱恋。这种智慧是典型的东方智慧，所谓“入世出世间，不离世间觉”。由于有这种达观与知命的智慧，作家才能在那个混乱的疯狂的年代既没有混同在时代的喧嚣之中，也没有因连绵而来的批判的冲击而晕头转向，依然能保持头脑冷静、灵台明澈，保持不为物役的独立品格，在自己心灵之中，保持了一块人性的绿洲。\n\n四、蕴涵对疯狂时代的轻蔑与不屑\n\n在《缘缘堂续笔》之中，丰子恺有时也不禁发出对疯狂时代的轻蔑与不屑：“今世许多人外貌是人，而实际很不像人，倒像架机器。这架机器里装满着苦痛、愤怒、叫嚣、哭泣等力量，随时可以应用。即所谓“冰炭满怀抱’也。他们不但不觉得吃不消，并且认为做人应当如此，不，做机器应当如此。”他说：“我觉得这种人可怜，因为他们毕竟不是机器，而是人。他们也喜爱放弃俗念，使心地暂时脱离尘世。不然，他们为什么也喜欢休息说笑呢？苦痛、愤怒、叫嚣、哭泣，是附着在人世间的，人当然不能避免。但请注意‘暂时”这两个字，“暂时”脱离“尘世”是舒服的、营养的。”\n\n在一个煽动人与人之间的仇恨的年代，丰子恺的这种人生哲学与艺术哲学，表面上看来真是“卑之无甚高论”，而且其声音之微弱渺小在时代“高亢”的洋溢着“革命激情”的“战歌”声中几乎被淹没，可是正是这种微弱的声音代表了人性与良心的存在。正是在这方面，《续笔》显示出其深远的意义。","keywords":"人性的生趣与光辉 小人物与小事情 达观与知命的智慧 对疯狂时代的轻蔑与不屑","note":"在那样一个混乱的年代，丰子恺写下《缘缘堂续笔》，难得的是，作者并没有被这个时代所同化，而是在痛苦之中，仍然保持着人性与良心，仍然贯彻着自己的人生理念，这些都在作品中体现了出来。对此，大家要有所了解。"},{"id":"321","stars":"★","title":"谈谈牛汉《半棵树》的艺术特色","body":"一、突出生命意识，高扬抗争精神\n\n牛汉在“文革”期间创作的诗歌更加突出了生命意识，他借助不同的意象，表达了陷于逆境的生命不屈地抗争与坚韧地生存的精神，也高扬了“五四”新文化运动以来知识分子的抗争与现实战斗的传统。\n\n在《半棵树》中，处于全书中心地位的是一个极端变形的意象-“半棵树”，那极端怪异的“半棵树”的形象，使牛\n\n汉对自己的身世与处境产生强烈的触动，在历次运动中的知识分子，不是也被政治权力的雷电，“齐楂楂劈掉了半边”吗？\n\n可是，春天一到，这棵树依旧枝繁叶茂，和正常的树一样高大伟岸。在这里，半棵树的象征意味就更加明显了，它象征着不屈的生命，象征着知识分子不屈的抗争与战斗的传统，这个意象很有些“刑天舞干戚，猛志固常在”的味道，但那个恐怖的时代却使得诗人产生了不一样的预感，在抒写了一种坚韧顽强的意志后，他在诗的结尾又写道：“人们说／雷电还要来劈它／因为它还那么直那么高／雷电从远远的天边就盯住了它。”\n\n二、使用象征手法，体现了“文革”中正直的知识分子的人格形象\n\n牛汉在“文革”期间写的诗，多半吟诵被侮辱与被损害的生命，像被伐倒的枫树、不断地被斫伐的灌木、囚笼里因为反抗甚至抓破了指爪的华南虎、在地下的黑暗中默默生长的根块等等，但这些意象中还是以“半棵树”的意象最为引人注目，那种被斫去了一半身躯却依然坚韧不拔、生命不息的意象，鲜明地体现了“文革”中正直的知识分子的人格形象，而诗歌最后一段的突然转折，则又显示出一种惊人的清醒。《半棵树》代表了战争年代成长起来的知识分子（如七月派作家群）在“文革”中的“潜在写作”，仍然带有反抗的英雄的风格，虽“都不可避免地带着悲凄的理想主义的”。\n\n三、揭示了知识分子在当时中国命途多舛的原因\n\n在《半棵树》中，树已经被雷电劈掉了半边，可是受过摧残后，雷电又盯上了它，还要来劈它，它仍然受着外界力量的威胁。这种极端的意境所产生的张力本身就给人以震撼、冲击以及广阔的联想。“半棵树”极富性格和命运的悲剧性，它是当时知识分子精神人格的写照，它的遭遇触击到当时社会冲突的一个深隐的层面，也就揭示了知识分子在当时中国命途多舛的原因。","keywords":"生命意识 抗争与战斗的传统 知识分子的人格形象 知识分子命途多舛的原因","note":"一般像《半棵树》这样以某种意象为题目的诗歌，多半是使用了象征手法，大家在遇到类似的诗歌赏析类题目时也可以从这一点切入。大家在分析《半棵树》的创作特征时，注意结合牛汉的个人经历。同时，《半棵树》的艺术特色也是“文革”时期牛汉诗歌创作特色的典型体现，这一点大家也要明确。"},{"id":"322","stars":"★","title":"谈谈穆旦《神的变形》的艺术特色","body":"一、繁复的诗艺和苦涩的智慧\n\n穆旦去世前给我们留下的几十首诗，这些诗歌仍然保留了他的繁复的诗艺，在层层转折中表达着对个人身世的慨叹、对时代的乌托邦理想的审视与反讽，基调是冷峻甚至无奈的，有些诗篇如《停电以后》《冬》等仍显示了一种在黑暗之中坚持岗位的精神-不过更多的是表达几十年坎坷之后所获得的苦涩的智慧，《神的变形》无疑也在其中。\n\n《神的变形》是一出小小的诗剧，可是其内涵却包蕴了历史上的各种权力运作的机密，自然，其直接的针对性更让人联想起“文化大革命”时代中国的社会现实。诗剧有四个人物：神、魔、权力、人。诗人通过对人一次又一次落入魔的圈套，陷入历史的循环，以及对这个循环背后的“幽灵”-权力的揭示，展示了一个人类历史悲喜剧的寓言-这同时也是一个酸楚的预言。\n\n二、思想戏剧化，在戏剧的结构中展示思想的全过程\n\n穆旦在40年代就受奥登等人的影响，富于理性的思考，以思想入诗是他的诗歌一贯的特色，《神的变形》也不例外，不过它的特点在于并不是直接的思想演绎，而是把思想戏剧化，在戏剧的结构中展示思想的全过程。《神的变形》至少有三个层次的转折：魔的反抗是个转折，人的觉醒是第二层转折，而人最后仍旧落入魔的圈套是第三层转折，权力的冷冷的插话，使得这三个转折构成一个圆圈，象征着人类历史可悲的循环，思想的层层转折、深入、循环的过程通过戏剧化的结构表现得非常生动，从而有了一种内在的形象性。《神的变形》并不是没有情感，只是这种情感被深深地潜隐在思想的底层，决不作过剩的流溢。这首诗因此获得一种深度与力度，使得有能力触及到这种情感的人获得一种震撼。\n\n三、浓重的现代意识\n\n《神的变形》同时有一个潜在的神话结构，就是从弥尔顿以至浪漫主义思潮以来的“神魔争斗”的神话原型，在这个原型中，“魔”代表争取自由的反抗者。不过穆旦运用这个原型时却对之作了反讽式的处理，没有再遵循“压迫-反抗”的程式，因为穆旦发现“反抗者”也可以成为压迫者，而人的历史仍是循环的怪圈。这其实也展示了一种现代主体的分裂：无论是神、魔还是人自身的理智与感情其实都是这个现代主体的不同侧面，“神的变形”这个循环实际上说明了现代主体在权力的运作秩序之中的分裂、变形、软弱与无力，自然这里也有一种哈姆雷特式的苦涩的智慧。由此看来，处于“文革”的逆境中的穆旦仍然保留了浓重的现代意识。\n\n【李凡关键词：苦涩的智慧 思想戏剧化 浓重的现代意识】","keywords":"","note":"穆旦后期的诗歌创作，虽然依旧保留有四十年代诗歌创作的特色，但无疑有了很大的发展，这都归因于穆旦坎坷的经历和丰富的人生体验。当然，这些经历与体验也都凝结在他这一时期的诗歌创作之中，大家要结合具体作品，仔细分析。"},{"id":"323","stars":"★★","title":"试分析食指的诗歌创作特色","body":"食指的诗以真挚的情感、朴素的风格表达出个体的真实体验，曾在“知青”群体中被广泛传抄，对一代知识青年产生了深刻影响，后来的许多青年诗人在思想、艺术两方面都直接受到其哺育。食指的诗歌创作，主要具备以下特征：\n\n一、确信人的生命意志，具有历史乐观主义色彩\n\n《相信未来》是食指的成名作。诗人以青年人的单纯、乐观写出了在深深的失望中蕴含的坚定希望，两种矛盾情绪不可分离地交织在一起，引起蹉跎岁月中身处无望境地中的青年人的共鸣。在诗中，诗人因为和同一代的知识青年共享那些特殊的人生经验，所以对历史和现实用隐喻笔墨带过，这就是第一节中的“当蜘蛛网无情地查封了我的炉台，／当灰烬的余烟叹息着贫困的悲哀”和第二节中的“当我的紫葡萄化为深秋的露水，／当我的鲜花依偎在别人的情怀”两句诗。他“摇曳着曙光那枝温暖漂亮的笔杆”，用“美丽的雪花”“在凄凉的大地上”写下“相信未来”，是因为相信“未来人们的眼睛”，更是相信“战胜死亡的年轻”。这就是说，诗人在历史乐观主义之外，更有对人的生命意志本身的确信，“相信未来”是和“热爱生命”联系在一起的。\n\n二、情感表达上具有个人化色彩\n\n《这是四点零八分的北京》所表达的情感具有个人化色彩，真切地写出身为知青一员的诗人在告别自己的亲人、熟悉的城市去往陌生的异乡、不可知的未来时，内心真切的疼痛与惶恐。\n\n《这是四点零八分的北京》以母爱暗喻诗人对北京的依恋，实质上是以个体对北京的记忆、感受置换了主流意识形态对其作出的定性，从而也就冲破政治权力制造的话语牢笼。在个人被践踏、心灵遭粗暴蹂躏的时代，食指的诗歌表达了更加日常化的个体经验，避免了诗歌中常见的与现实的尖锐对立和决绝反叛-这也是他的诗歌广为流传的重要原因。\n\n三、后期关注自我存在处境，表达深切感悟\n\n20世纪80年代后，食指已进入了沉郁徘徊的历史回顾期写出了包括《疯狗》《愿望》《诗人的桂冠》《人生舞台》《我的祖国》等佳作。这一时期的诗人开始转向对自我存在处境的关注和深切感悟，许多作品弥漫着人生的失落、无奈和沉痛。青春不再，但食指诗意的处世方式却没有改变，他像一个逝去年代的诗歌贵族，写他的新格律体诗，反复修改，仍全神贯注地吟唱。","keywords":"个体的真实体验 失望中蕴含的坚定希望 疼痛与惶恐 以母爱暗喻 自我存在处境 深切感悟","note":"通过分析《相信未来》和《这是四点零八分的北京》这两首诗的艺术特色，大家也可以了解到食指诗歌创作的整体特色。要注意到食指的诗歌影响到了后来许多诗人的诗歌创作，比如朦胧派诗人北岛，二者常常会被联系起来出题。"},{"id":"324","stars":"★","title":"谈谈你对“天安门诗歌”的认识","body":"一、什么是“天安门诗歌”\n\n1976年1月，50年代以来一直担任政府总理的周恩来逝世，执政党内部各派力量的斗争更加激化。二三月间，在北京、上海、南京、杭州、郑州等城市，发生了有大批民众参与的大规模政治抗议行动。这一浪潮，在4月初的天安门广场发展到高潮。4月初的几天里，到广场追悼周恩来，谴责、批判“四人帮”的民众多达数百万人次。这一政治行动所采取的形式，有发表演说，悬挂、设置花圈和挽联，张贴标语等。其中，诗歌是被广泛运用的方式。\n\n创作或抄录的诗词，张贴在广场的灯柱和纪念碑的护栏上，挂在松柏枝叶间，有的当众朗读。这些诗词，在当时被广泛抄录。这一悼念和抗议的活动，在4月5日清明节达到高潮。不久，天安门广场发生的事件，被当时的掌权者宣布为“反革命政治事件”，在广场张贴、传抄的诗词被指控为“反动诗词”，“是彻头彻尾的反革命煽动”。在此后的几个月里，写作、传抄、保存这些诗词的行为受到追查，一些人为此受到迫害，被定罪、囚禁。\n\n1976年底，在江青等“四人帮”被逮捕之后，童怀周将他们搜集、保存的部分诗词誉录、张贴于天安门广场，并发出征集散失作品的倡议书。倡议得到广泛响应。在征集到的数以万计的诗词中，选出一千五百多篇，编成《天安门诗抄》出版。\n\n二、“天安门诗歌”的特征\n\n（一）体裁上以旧体诗为主\n\n《诗抄》所收录的，有的并不是诗词（如挽联、悼词、祭文等）。诗词中，以并不严格依循格律规则的旧体诗、词、曲居多，新诗只有一小部分-这基本上反映了1976年初“天安门诗歌”中旧体诗与新诗的比例。旧体诗词的现成格式，可被套用或翻新的比喻、典故，甚至现成的句子，是精炼而有所隐晦地表达政治观点和情绪的较佳选择。特别是70年代政治抗争的参与者，可以通过传统形式，找到清浊、忠奸、贤良宵小对立的思想材料，顺利地表达他们的历史观和对现实政治的道德评价。\n\n（二）主要是一种政治表达\n\n“天安门诗歌”主要是一种政治表达。它的形态，它的写作、发表、传播方式，其后的评价方式和搜集、整理活动，《天安门诗抄》的出版，都属于“当代”重大政治事件的组成部分。这是“文革”间美学“日常生活化”和诗歌政治化的另一典型体现。在中国现代诗歌的艺术创造方面，它们并不能提供多少值得重视的经验。不过，在恶劣、严酷的环境中，诗的写作者的真诚态度，独立的思想和写作方式的坚持，对当代诗人应该说具有启示的意义。\n\n80年代文学","keywords":"政治抗议行动《天安门诗抄》旧体诗与新诗的比例 政治表达","note":"“天安门诗歌”的政治色彩明显大于文学色彩，其主要影响也更多地集中在政治领域而非文学领域，这部分内容，大家要有所了解。通常情况下“天安门诗歌”多以名词解释出现，但也有出大题的可能性，故此需要大家有所准备。"},{"id":"325","stars":"★★★","title":"谈谈你对八十年代文学整体特征的认识","body":"一、整体基调沉重、紧张\n\n面临着具体境遇中的“历史”提问，使有关“历史”清算和记忆（群体的和个人的）的书写，几乎成为80年代作家有意无意的选择。作家的意识和题材状况，影响了80年代文学的“结构”的和美感的形态。沉重、紧张是一种可以经常在作品中遭遇的基调。沉重与紧张，既是指情感上的，也指结构形态上的。作品中拥挤着无数问题、观念，有过多的意象、隐喻、象征、寓言也就不难理解。在80年代，能够持较为裕如放松的姿态和笔墨的作家当然也有，但不是很多。\n\n二、探索、创新意识强烈\n\n探索、创新的强烈意识，是80年代文学的另一特征。探索、创新、突破、超越等，是当时文学界使用频率很高的几个词。开放的环境提供的文学比较（与西方现代文学，与本国“五四”到40年代的文学，与当代的台湾文学）使作家产生中国当代文学“滞后”和“边缘”的尖锐感觉。他们普遍期望在不长的时间里，走完他人百年走过的道路，创造一批有思想深度和艺术独创性的作品。不同知识背景和不同年龄段的作家，都努力从各个方面，去获取激活“超越”的创造力，追求“从题材内容到表现手段，从文艺观念到研究方法”的“全方位的跃动”。不同思想艺术基点和不同层面上的文学探索，表现为多种情形：发掘从前列为“禁区”，或未曾涉猎的题材；创造难以用正面、反面的标准划分，在道德判断上暖昧不明的人物；尝试某种美学风格；运用在“当代”也属“禁区”的艺术方法；偏移、颠覆当代文学“正统”的历史叙述，以“欲望”取代“阶级斗争”成为历史动力......接踵而至的频繁新变，既表明由于“文化封闭”积累的有待解决的问题重重叠叠，表明文学界的激情、活力和目标感，也表明因个人和整体面临的压力而过分的焦躁。\n\n三、表现出“潮流化”特征\n\n持续的超越、创新的压力，给80年代文学带来“潮流化”的特征。80年代推动文学“现代化”进程的作家，在这十多年的时间里，经常采取组织运动、掀起潮流、发表宣言的方法，以推动其目标加速实现。批评家和文学报刊编辑，也热衷于归纳、命名文学现象的某些类同点；或者借助某种契机，有意识组织文学派别。这种情形，表现为各种社团式的文学“圈子”大量出现（尤其是诗歌界），和创作上一定阶段取材、主题方法的趋近。批评家因此能方便地对“新时期”的文学做出“潮流”性质的描述。\n\n四、启蒙一人文主义文学话语的重构\n\n实事求是、解放思想路线成为新时期文学复苏与迅速发展的原动力，而新文学革命时期形成的人文主义精神、人道主义思想，以及西方现代主义人学思想，成为新时期中国文学发展的历史与现代理论资源库。文学界急切地呼唤人的自由与平等，张扬人性、人情，推崇人的价值、人的权利、人的尊严。现代人学思想的复归，则是推动中国文学在新时期进发出久被压抑和禁锢的生命活力的内在动因。人道主义潮流、人文精神倡扬，成为新时期中国文学的主潮。\n\n五、积极尝试新的美学原则与创作方法\n\n随着80年代西风东渐的再度吹拂，各种西方现代文学、文化、哲学、艺术等理论和社会思潮纷纷被介绍引进，对长期与外界隔绝的中国文化界和知识界产生了强有力的冲击，国外大量现代派文学作品的涌入，给新时期的作家们提供了多样的艺术参照和启发，成为他们汲取灵感的又一个重要的艺术泉源。在80年代，不同知识背景和不同年龄段的作家，都努力从各个方面，去获取激活“超越”的创造力，不同思想艺术基点和不同层面上的文学探索，表现为多种情形：发掘从前列为“禁区”，或未曾涉猎的题材；创造难以用正面、反面的标准划分，在道德判断上暖昧不明的人物；尝试某种美学风格；运用在“当代”也属“禁区”的艺术方法；偏移、颠覆当代文学“正统”的历史叙述，以“欲望”取代“阶级斗争”成为历史动力......\n\n六、积极对文学历史的审视、反思与改写\n\n十七年时期对新文学的历史描述，在“新时期”受到广泛质疑，文学史研究界开始进行“翻转”式的改写，新的历史图式逐渐浮现：新文学经由“五四”的辉煌和蓬勃生机，而不断下降，到“当代”跌入低谷，只是到了“新时期”才得以复兴。“现代文学”远胜于与“社会主义实践”相联系的“当代文学”。启蒙主义、现代化成为取代阶级论的标准。作为文学潮流，二三十年代的革命文学、左翼文学、40年代“解放区文学”和当代50、70年代文学，逐失去其主导位置，它们的代表性作家、作品的“经典”地位发生动摇。另一方面，出现发掘、提升在“当代”受到忽视、湮没的作家、流派的热潮。","keywords":"沉重、紧张 探索、创新“潮流化”启蒙一人文主义文学话语 新的美学原则与创作方法 对文学历史的审视、反思与改写","note":"①80年代是“新时期”文学的开始，是中国文学的又一大变革时期，由此进入了当代文学史的一个黄金时期，名家名作迭出，其影响一直绵延到当下，故此对于80年代的文学我们要重点关注。** ②80年代文学整体特征是受到当时社会整体转变影响的，在这一时期，一些作家如张爱玲、沈从文被重新发现，现代主义手法在文学创作中被广泛运用，人道主义与人文精神得到了弘扬，中国文学创作因此而显露出了崭新的面貌。 ③这一时期小说、诗歌等体裁的整体特征，以及主要的流派、作家和作品我们已经在之后做出了梳理，大家可以结合相关内容理解记忆。 ④关于80年代文学相关的名词解释，我们需要重点关注一下这一时期的文学事件，包括第四次文代会、“向内转”“方法论热”“重写文学史”等，这些都可能以名词解释的形式进行考查。"},{"id":"326","stars":"★★★★","title":"试比较“五四”时期文学和80年代文学在启蒙层面的共通之处和差异之处（26辽宁大学）","body":"80年代文学是启蒙主题再度崛起的历史产物。它有力反拨了革命古典主义文学思潮，接续“五四”文学传统。当然，80年代文学绝非“五四”文学的简单重复。因为它必须应对新的历史情境和时代要求，所以它也必然产生新的时代特征。二者在启蒙层面的共通之处和差异之处，主要体现在以下方面：\n\n一、相同点\n\n（一）都强调个体主体性\n\n个体主体性的凸现，是启蒙主义文学的首要特征，个体主体性的凸现，是“五四”文学的一大特征。这一特征体现在文学主题、文学体裁、叙事视角、文本结构等各个方面。80年代文学也不例外。80年代文学响应人道主义、自由解放的时代呼声，重新肯定和倡导个体主体性的价值，结束了盘踞中国文坛半个多世纪的革命古典主义文学思潮。\n\n（二）都倡导平民精神\n\n平民精神是“五四”文学的重要特征，主要表现为内容上对平民有限生存的关怀和形式上对白话文、白话诗的采用。“五四”时代，白话的采用无疑具有平民性，因为它打破了士大夫的雅文学，趋近平民的审美情趣。\n\n80年代文学的平民精神有了新的呈现方式。首先，从日常生活中取材，着重表现“小写的人”“个体的人”，关怀普通人的生存境遇和情感体验；其次，启用中短篇小说和朦胧诗，去除篇幅冗长、叙事线索庞杂、政治意味浓厚的长篇小说和长诗。因为中短篇小说篇幅较短，贴近普通民众；最后，打破革命古典主义的形式规范，吻合普通民众的审美情趣。\n\n（三）都强调启蒙的社会功能\n\n80年代文学和“五四”时期文学，突出强调的都是启蒙的社会功能，没有将社会启蒙与人的内在性启蒙完整地熔铸在一起，对“人”的发现和书写是以对社会和历史（尤其是封建主义）的反思与批判为前提的。\n\n（四）主要思想资源都来自18-19世纪的欧洲\n\n“五四”文学和80年代文学都将启蒙思想资源的选择目光集中在18-19世纪的欧洲，而忽略了对中国传统文化中启蒙精神的历史性继承，尤其是明清之际黄宗羲和顾炎武等人的进步思想。这样的结果是西方现代性的“异质思想”在20世纪中国作为“启蒙方案”被实践时便会遭遇到不同程度的挑战，在80年代的文化面相中主要表现为社会主义与资本主义的对峙。\n\n二、不同点\n\n（一）与国家体制和社会意识形态的关系不同\n\n“五四”时期是个政治混乱而文化自由的时代。私人结社、集会、办刊之风盛行，文学社团此起彼伏，各种流派蜂拥而起，同人杂志层出不穷，自由刊物遍地开花，为文学保存了一块难得的自留地。“五四”文学是由知识分子发起的自觉文学运动。它没有被纳入国家意识形态体系中，文化走在政治的前头，是“五四”时代独特的现象。“五四”文学受国家体制和意识形态的影响较小，而受知识分子话语的影响则较大。\n\n新时期，国家意识形态的调整，对80年代文学的发生和生成形态具有至关重要的影响。80年代文学的发展与国家意识形态的走向基本一致，一方面，国家意识形态的调整，也是对未完成的现代性的一次补课，为80年代文学提供有益的外部环境，有助于它的迅速风行；另一方面，80年代文学也基本迎合了国家意识形态的历史调整，推进拨乱反正、现代化建设事业的蓬勃发展。\n\n在国家介入这一点上，80年代文学与“五四”文学存在根本差异。国家的介入对80年代文学产生重大影响。\n\n（二）平民化的程度不同\n\n“五四”时期，普通民众尚未脱离传统文化的影响，形成独立的自我意识。精英知识分子与普通民众之间的深层隔膜，注定了具有知识分子精英意识的启蒙主义文学终难摆脱曲高和寡的命运。“五四”文学试图寻求深入市民群体的途径，以真正发挥文化启蒙的作用，却始终徘徊在知识分子、学生群体中，未能真正深入民众、完成启蒙宏业。\n\n而新时期，普通民众的受教育程度普遍提高，逐渐贴近知识分子的文化层次。同时，长期的政治高压引起反弹，民众的政治热情和参与意识日益高涨。因此，知识分子和民众之间的对话成为可能，彼此共同推进80年代文学。因此80年代文学真正打破了知识分子读者群，唤起民众的普遍共鸣，实现了“五四”文学未能实现的梦想。所以说，80年代文学既是“平民文学”，又是“平民的”文学。\n\n（三）情感基调不同\n\n五四时期，中国经济落后、政治黑暗、战争连绵、人民愚昧，既赶不上世界的现代性潮流，又缺乏现代民族国家的保障力量，前途一片渺茫。故而，“五四”文学濡染感伤主义的时代氛围。\n\n而新时期，中国的境况则截然相反。新中国建立之后，中国的国际地位不断提升，80年代时，国人走出“文革”的心理阴影，迎接新的机遇和挑战，对国家、民族和个体的前途充满信心。80年代文学诞生于这样的时代，自然也会染上乐观昂扬的时代精神。\n\n（四）国民性批判强度不同\n\n“五四”文学具有三大主题：反封建、倡导启蒙理性和批判国民性。其中，批判国民性是个十分重要的书写纬度。鲁迅、叶圣陶、乡土作家群等一大批作家都致力于这一主题的写作。\n\n而到了80年代文学那里，批判国民性主题明显减弱。首先，表现这一主题的文学篇目锐减。除了部分反思文学、寻根文学之外，绝大多数80年代文学不具备批判国民性的文化内涵。它们较多批判极左思潮和封建意识的合谋，而较少探寻人性和国民性的问题。其次，批判力度有所下降。最后，知识分子自我批判意识也有所下降。\n\n综上所述，80年代文学在启蒙层面上明显接续了“五四”文学的传统，在许多方面表现出了一致之处。但二者毕竟发生于不同的时代，处于不同的环境，因而在启蒙的具体表现上出现了一些区别。但无论如何，80年代都是一个“五四”精神再次回响的年代。","keywords":"相同点 个体主体性 平民精神 启蒙的社会功能 思想资源 不同点 与国家体制和社会意识形态的关系 平民化的程度 情感基调 国民性批判强度","note":"80年代是新时期的开始，和“五四”时期一样，也是一个思想解放的年代，是一个呼唤启蒙的年代，因此，有人将80年代的启蒙思潮称为“新启蒙”。但是，和“五四”时期相比，80年代的启蒙所面对的问题不同、所在的环境不同，这必然会导致二者之间出现差异，具体表现在与社会意识形态的关系、平民化程度、情感基调和批判色彩这些方面。相关内** --- 容可以参考林朝霞《现代性与中国启蒙主义文学思潮》、李耀鹏《八十年代“五四话语”的征用与重构》。"},{"id":"327","stars":"★★★","title":"谈谈新时期以来小说创作蓬勃发展的原因","body":"一、文学的复苏随着思想解放运动的展开\n\n作为拨乱反正之初的70年代末期，尽管小说创作仍然面临着诸多禁忌，但文学的复苏随着思想解放运动的展开，已经呈现出不可阻挡的势头。1978年关于真理标准问题的大讨论；1979年第四次全国文代会的召开；关于现实主义问题、关于文学创作中的人道主义、人性、人情和异化等问题的论争；以及稍后进行的关于西方现代派文学的探讨等都在很大程度上渐次为小说创作的发展扫除了思想障碍。而80年代中后期开始的关于先锋文学、新写实小说的论争，90年代相继展开的“人文精神大讨论”，关于“现实主义冲击波”的讨论，20世纪末的关于“私人写作”“美女作家”“个人化写作”等问题的讨论，以及进入21世纪以来备受瞩目的关于“80后”写作现象的探讨等，则推动了新时期小说的进一步发展，在使之在日益走向成熟和繁荣的同时，也走向了丰富和繁复。\n\n二、外来影响为小说的发展提供了多样的艺术理念和创作经验\n\n在一种日渐宽松的大的社会思想文化背景之下，随着80年代西风东渐的再度吹拂，各种西方现代文学、文化、哲学、艺术等理论和社会思潮纷纷被介绍引进，对长期与外界隔绝的中国文化界和知识界产生了强有力的冲击，国外大量现代派文学作品的涌入，给新时期的作家们提供了多样的艺术参照和启发，成为他们汲取灵感的又一个重要的艺术泉源。可以说，新时期以来作家们普遍表现出来的“现代”情结和此起彼伏的现代小说文体实验，都与这些外来文学的启示与激发有关。\n\n三、作家群体新人辈出\n\n30年来，构成新时期小说主要创作力量的有：\n\n（一）50年代因政治或艺术原因而蒙受灾难，直到“文革”结束后才再度走上文坛的作家群，这部分作家被称为“复出作家”或“归来作家”，代表了新时期初期的文学实绩。\n\n（二）知青作家群，这些知青作家在“伤痕”文学、“反思”文学和“寻根”文学等小说潮流的更迭演变中扮演着重要的角色，在90年代的文坛仍有重要的影响。\n\n（三）80年代中后期崛起的一批新锐作家。\n\n（四）一批从事“女性写作”的女作家。\n\n（五）90年代后，更年轻的“新生代”和“70后”小说家的出现，使20世纪末的文学图景愈加丰富多姿。\n\n（六）进入21世纪以来，文学创作持续低龄化，“80后”写作现象成为文坛关注的热点。\n\n由于上述作家的共同努力，形成了一个具有历史意义的真正多元化的小说创作景观。","keywords":"思想解放运动 外来影响 作家新人辈出","note":"新时期以来的小说创作蓬勃发展，一方面得益于思想解放运动为小说创作和艺术探索扫清了障碍，另一方面得益于外来文化的影响，而为小说创作发展提供有力支持的则是不断涌现出来的作家创作队伍。这里要提醒大家的是，“新时期以来”可以说是文学考研中比较常出的一个时间概念，像是“新时期以来的诗歌”“新时期以来的农民形象”，主要就是考查大家对改革开放以来文学发展的整体掌握情况。"},{"id":"328","stars":"★★★","title":"试阐述新时期的小说流派的发展变迁","body":"新时期以来，小说的发展呈现着从单一走向多元的态势，并最终形成了一种多元美学形态并存的格局。\n\n一、1977年到1978年，刘心武的短篇小说《班主任》与卢新华短篇小说《伤痕》接连发表，此后，这类对“文革”以及“四人帮”的罪行进行揭露、控诉和批判的小说大量涌现。以这两篇小说的出现为标志，新时期文学迎来了第一个大规模的小说创作潮流--“伤痕小说”。“伤痕小说”在客观上推动了现实主义的回归，但是这种“回归”已经不再是简单的回复，而是在回复的同时酝酿着自身的突破。\n\n二、1979年，茹志鹃的短篇小说《剪辑错了的故事》通过几十年间党群关系的演变，发掘了现实灾难的历史原因，对历史进行了个人化的理性思考，反思文学由此起步。进入80年代以后，这类作品开始明显增多，先后出现了谌容的《人到中年》、王蒙的《蝴蝶》和《春之声》、宗璞的《三生石》、张洁的《爱，是不能忘记的》、张贤亮的《灵与肉》等。\n\n三、1978年12月，十一届三中全会召开，中共中央把工作的重心转移到社会主义现代化建设上来。为了适应这种时代要求，一大批表现改革内容的小说应运而生。代表性作品有蒋子龙的《乔厂长上任记》、张洁的《沉重的翅膀》、水运宪的《祸起萧墙》、张贤亮的《男人的风格》、李国文的《花园街五号》、陆文夫的《围墙》、柯云路的《新星》等。\n\n四、1985年被称为文学的“方法年”，也是新时期小说发展史上重要的一年。这一年“寻根”小说、“现代派”&#x5C0F;说和新潮小说相继登场，小说艺术开始进入了一个大规模的实验探索时期。\n\n（一）1985年4月，韩少功的《文学的“根”》发表，正式打出了“寻根”的旗号，主张向民族传统文化的“根”&#x8FDB;军，以图民族文化的更新与重塑。从理论和创作上呼应这一主张的作家还有阿城、李杭育、郑义、郑万隆、贾平凹、扎西达娃、莫言等人，他们共同掀起了一股文化寻根热潮。\n\n（二）1985年的中国文坛上，引人注目的还有刘索拉的《你别无选择》、徐星的《无主题变奏》等“现代派”小说；残雪的《山上的小屋》、莫言的《透明的红萝卜》等充满潜意识与超感官色彩的探索小说；马原的《冈底斯的诱惑》和扎西达娃的多篇魔幻小说。这些作品在内容与表现方法上与传统小说不同，在主题或意绪上又与西方现代派小说有别，呈现出东方传统与西方现代艺术相结合的“中国式的现代派”的基本特征。\n\n五、1987年，由格非、余华、苏童、孙甘露、叶兆言、洪峰等为代表的一批作家，将小说的先锋艺术实验继续向前推进。先锋小说的出现，得益于80年代后期日益开放的文学环境，同时也与外来文学艺术的影响和刺激直接相关。几乎每一个先锋小说家的背后，都会站立着一个或几个外国作家。他们对中国先锋文学的叙事变革具有着广泛而深刻的影响，直到进入90年代后，先锋作家在叙事方式上的探索才出现了停歇和平缓的趋势。\n\n六、在先锋小说的创作中，“新历史小说”是一个重要的艺术走向。这些作品多假托历史的背景，探讨的却是民族和人类某些共同的命运和主题，在艺术上则多采取以“历史的元素”为基础进行大胆虚构的方式。在历史观上，新历史小说与传统的历史题材小说不同，它并不需要依据特定的历史题材，也不遵循历史题材传统的创作方法，历史对他们而言，在很大程度上，其实只是一件外衣。\n\n七、20世纪80年代后期，与先锋小说发展同时，以池莉、刘震云、刘恒等为代表的“新写实小说”也在悄然兴起。新写实小说从艺术上看，首先是对传统现实主义的突破，它多以日常生活的琐细叙事来替代传统现实主义的宏大叙事，以貌似冷静、客观的“零度情感”来取代传统叙事中的主体倾向性；其次，它也是对先锋小说趋于极端的文体实验的某种纠偏。\n\n八、新生代小说的创作\n\n进入90年代，一批六七十年代出生的作家创作了大量的作品。他们在边缘处写作和叙述，最大限度地发挥自己的想象力，以一种平和、同情、超越的心态来观照生活。他们承继了先锋小说对于叙事的重视，同时也开始修复先锋小说那种与生活分离的状态，避免了凌空高蹈的空洞叙述。代表作品有毕飞宇的《青衣》、陈染的《私人生活》、林白的《一个人的战争》等。","keywords":"伤痕小说 反思小说 改革小说 寻根小说 先锋小说 新历史小说 新写实小说 新生代小说","note":"本题偏重记忆类基础题，主要考查大家对于新时期不同阶段小说创作主流和其基本特征的认识，大家注意把握反思小说、伤痕文学、寻根文学、先锋文学、新写实小说、新生代小说等流派基本特点和代表作即可。新时期这些涌现出来的小说流派都十分重要，除了考查论述题之外，以名词解释形式考查的频率更高一些，所以我们都要做好储备。"},{"id":"329","stars":"★★★","title":"“伤痕小说”的特征与局限性","body":"“伤痕文学”因其对“文革”的揭露和批判，反映了时代要求与民众心声，同时也附和并推动了十一届三中全会以来思想解放运动的大潮，因此引起了强烈的社会反响。其创作特征与自身局限性，主要表现在以下方面：\n\n一、“伤痕文学”的特征\n\n（一）体现出干预现实的精神，多采用现实主义手法\n\n“伤痕文学”对“文革”创伤记忆的集体言说，促成了新时期文学现实主义品格的回归。“伤痕文学”继承了“问题小说”的传统，体现出干预现实的精神，在艺术上采用了能明确剖析社会问题的现实主义手法。如《伤痕》写少女王晓华受到“文革”思潮的蒙蔽，与被打倒的母亲决裂，最终才发现永远也无法再抹去被戳在心上的“伤痕”；又如《枫》真实再现了\n\n“文革”中血腥的武斗场面，但更为撼人心的还在于其中通过卢丹枫、李红钢这对青年恋人由于派系不同而不得不置对方于死地的近于怪诞的悲剧，揭示出了时代本身残忍的欺骗性。\n\n（二）主要内容为对“文革”的批判及揭露“文革”给人们造成的精神戕害\n\n“伤痕文学”共同主题首先体现在对“文革”的批判及揭露“文革”给人们造成的精神戕害上，根据“伤痕”作品的主要内容，可以大致区分为两个方面。一是写知识分子、国家官员受到的迫害，他们的受辱和抗争。如冯骥才的中篇小说《啊！》中的历史学家吴仲义就因为误以为一封信的遗失而陷入惶惶不可终日的状态，体现出“文革”对知识分子的压迫。\n\n二是写“知青”的命运：以高昂的热情和献身的决心投入这场革命，却成为这场革命的“牺牲品”。如孔捷生的《在小河那边》写“文革”期间一对由相知到相爱的知青，竟是失散多年的姐弟。通过这种命运的悲剧性的偶然巧合，控诉了政治运动对人命运的捉弄和对正常生活的破坏。\n\n（三）“归来”的作家和知青作家两大创作主体\n\n“伤痕文学”的创作主体主要由两部分作家构成，一是“归来”的作家，如王蒙、从维熙、张贤亮、高晓声、刘绍棠、&#x674E;国文、陆文夫等，其中以王蒙的影响最大。另外一个创作主体是知青作家群，主要作品有朱晓平的《桑树坪纪事》、陈建功的《飘逝的花头巾》和《轱辘把胡同9号》、孔捷生的《南方的岸》、张承志的《绿夜》等。此外还有一些有着“文革”经历的作家，如冯骥才、周克芹等，在对“文革”的揭露和控诉上，都很独到深刻，取得了较高艺术成就。\n\n二、“伤痕文学”的局限性\n\n（一）强调的仍然是“文艺为政治服务”，艺术上显得直白和粗糙\n\n“伤痕文学”的局限性在于，仅仅从“问题”意识出发，仍是对“歌颂”与“暴露”对立的简单化思维的延续，实际强调的仍然是“文艺为政治服务”。这就不但使之仅限于关注历史与现实的表象，而且使作家在关注“写什么”的同时对“怎么写”的问题一直缺少应有的认识，这也就势必会忽略小说本体上的艺术建构。相当多的“伤痕”文学，艺术上显得直白和粗糙。\n\n（二）人物形象贫弱\n\n“伤痕文学”塑造的人物形象，如罗群、许灵均等内涵较为贫弱，我们无法从中体会到是什么造成了这一出人间悲剧，更没有从小说中看到作者对体制、传统积习等等更为深邃的思考。因为这些形象毕竟与当时的“现实”距离太近，而且，作家井没有完全把他们当作有血有肉的形象去描写-至少没有认真地通过对他们形象的塑造去思索、去拷问。\n\n（三）“问题叙述”的单一创作模式\n\n“伤痕文学”大部分都是采用“问题模式”进行创作，如刘心武，在《班主任》中，当代青年被简单分为“好孩子”和“坏孩子”两种类型，他们一个在精神上受了外伤，一个在精神上受了内伤，在这里，社会“问题”是压倒了人物形象的。这样的“问题叙述”，在“伤痕文学”作家中普遍存在，而且几乎是大同小异的。这种单一创作模式无法适应环境的变化，随着社会问题的解决或社会矛盾中心的转移，他们就很难再写出引人注目的作品了-这一点已经被事实证明了。","keywords":"干预现实的精神 现实主义手法 对“文革”的批判 揭露精神戕害 知识分子、国家官员受到的迫害“知青”的命运“归来”的作家 知青作家群 “文艺为政治服务”直白和粗糙 人物形象贫弱 单一创作模式","note":"“伤痕文学”是新时期以来兴起的第一个文学潮流，但也正因如此，它在创作观念上仍坚持文学为政治服务，因而在艺术上成就有限。但其意义在于对“文革”的揭露和批判，反映了群众的呼声，因而非常值得重视。在“伤痕文学”之中，我们要注意其代表作品如《班主任》《伤痕》，以及与之相关的大墙文学，这些都有可能考查名词解释。"},{"id":"330","stars":"★★","title":"简论刘心武小说创作的成就和影响","body":"刘心武的小说创作在中国当代文坛上有着重要的地位，取得了很大的成就和影响，具体表现为：\n\n一、“伤痕文学”的开端\n\n1977年，小说《班主任》的发表反响巨大，被誉为“伤痕文学”的开端。小说以一个班主任的眼光，忧虑地审视那些年少的学生在那个文化荒芜、思想被钳制的“文革”年代，因深受毒害所发生的思想变异。他所刻画的宋宝琦和谢惠敏两个少年的形象是深有意味的，相当尖锐地揭露了“四人帮”的倒行逆施，不仅造成了经济的崩溃，社会的混乱，而且严重毒害、摧残下一代的精神，使民族精神失去创造活力与生机。小说最后发出“救救孩子”的呼声，表明关注人的精神解放是中国文学的一个世纪性的课题。\n\n二、京味都市小说\n\n在80年代，刘心武以知识分子的忧患意识和人道主义的精神立场，来关注作为社会个体的普通人的生活状况和处境。80年代后期，刘心武以“纪实小说”形式发表的《王府井万花筒》《公共汽车咏叹调》，写出了北京市民的生活和文化心态。80年代的这些创作都明确地在作品中提出一个社会问题，并呼吁一种社会解决方式。当那种单一的问题意识稍有消褪的时候，刘心武以较裕如的视角和方法，来描述具有特定的风情、习俗、世态的北京市民社会的图景，这体现在《如意》《立体交叉桥》《钟鼓楼》中。这些小说，被称为“京味都市小说”。\n\n三、注重心灵探索，走出“问题小说”模式\n\n20世纪80年代中后期，围绕着对传统观念的反思和重建，刘心武的小说开始走出早期的“问题小说”模式，注重人物心灵的开掘与探索。这一阶段，刘心武的小说更注重写人物的命运和遭遇，写人与人的关系，写人的心灵、人性和人情。《如意》是这一阶段的代表作，通过普通工人与前清贵族小姐的爱情悲剧书写了人性中的美，同时对有情人未能成眷属的原因进行追问，一定程度上表达了对时代和社会心理扭曲的批判。\n\n四、呈现“市民化”趋向以引领大众\n\n进入90年代，刘心武提出“大众文学精致化，精致文学大众化”的构想，沟通两者，并以通俗小说形式，写作了在通俗刊物上连载的中篇《一窗灯火》。他在文化讨论中所表达的观点和他的写作实践本身，显示了一部分在80年代呼唤“救救孩子”，持精英“启蒙”立场的作家的市民化趋向。不过，正如作家自己所表述的，这种“市民化”有一定的限度。这里反映了在“社会转型”过程中对自身位置的某种“设计”：以主流文化身份去表现和引领“大众”，又以想象性的“大众”心态来阐释和认同“转型”的现实。","keywords":"伤痕文学 京味都市小说 心灵探索 市民化","note":"刘心武的小说成就与贡献，虽然以80年代“伤痕小说”创作最为突出，但80年代之后，他为小说和创作做出的探索和努力，如注重心灵探索、呈现出“市民化”的趋向等也不应该被忽视，大家在作答时，需要全面作答。"},{"id":"331","stars":"★★★","title":"谈谈你对《班主任》和《伤痕》这两部作品的认识","body":"一、两部作品分别是“伤痕小说”兴起的标志与名称的由来\n\n1977年11月，刘心武的短篇小说《班主任》在《人民文学》发表。这是“伤痕小
