整，这种结构方式是更适合于长篇小说的。从鲁迅到茅盾，可以看到我国现代小说结构艺术的发展。\n\n二、早期小说结构较简单\n\n茅盾的第一部创作《蚀》采取了“三部曲”的形式：各部的结构自行独立，而章法各异，连贯起来，反映一段时期的生活，这在现代文学史上是一个新的开创。“三部曲”的每一部结构也各不相同：\n\n《幻灭》所取的就是一种单线结构，以静的经历为主线，人物和事件都随着静的故事或出现，或消失。第二部《动摇》则是以胡国光和方罗兰为中心形成两条并行线索，虽时有交叉，但并未纠缠为一体。第三部《追求》又是以王仲昭、张曼青、章秋柳对生活的两种不同追求为主体，形成虽有联系却又独立的三条平行发展线索。以后的《虹》则是按女主人公梅行素“成都-泸州-上海”三大段生活，以时间、空间的转移为发展线索。\n\n以上的结构形式都比较简单，是中国早期现代小说，特别是长篇小说共同采用的结构方式。作家在总结《蚀》的创作经验时，明确地指出：“这结构上的缺点，我是深切地自觉到的。即在一篇之中，我的结构的松懈也是很显然。”\n\n三、完成了结构形式与具体内容的一致性\n\n从《子夜》开始，茅盾把小说结构的精心构制作为艺术构思中的重要一环，追求与纷繁复杂的生活更加适应的蛛网式的密集结构：“把好几个线索的头，同时提出然后来交错地发展下去......在结构技巧上要竭力避免平淡。”小说情节安排有张有弛，很有节奏，多种矛盾的同时出现、互相纠缠，既有利于多侧面地展开主人公的多重性格，又便于揭示生活中各种矛盾的内在联系和相互影响，使小说的结构形式与所要反映的纷繁复杂的内容取得了某种一致性。\n\n在《子夜》之后，茅盾对结构艺术的创新始终保持着热情，他的部分短篇小说就采取了一种开放性结构，即作者并不交代出事件的最后结果，留下更多的空白让读者进行艺术的再创造。","keywords":"宏大严谨的布局 艺术构思的一环 结构形式与内容一致性","note":"茅盾的小说结构，经历了一个发展的过程，早期小说结构和后来的小说结构有明显的不同；同时，茅盾的小说结构与鲁迅的小说结构也有很大的不同，二者很可能被拿来放在一起比较，大家要特别注意。"},{"id":"97","stars":"★★","title":"茅盾在文学批评上的贡献","body":"茅盾首先是以杰出的文艺理论家与文艺批评家的身份出现在“五四”新文坛上的；在他成为第一流的长篇小说艺术家以后，仍然没有放弃文艺批评的武器，仍然关注于现代文艺理论的建设。茅盾在文艺批评上的贡献，主要有以下几点：\n\n一、是中国现代批评的开创者之一\n\n茅盾是中国现代批评的开创者之一，他主持的《小说月报》首先把文艺批评与文艺创作置于同样重要的地位，强调“必先有批评家，然后有真文学家”。茅盾发表于《小说月报》上的《春季创作坛漫评》《评四、五、六月的创作》，是最早对\n\n一个时期的创作潮流、倾向进行综合批评的文章，不仅对当时的创作起了直接指导作用，而且在现代文艺批评的建立上具有开拓的意义。\n\n茅盾的文学批评是用历史唯物主义观点进行作家作品评论和文学史研究的最早的成功尝试，为中国马克思主义文艺批评的建立以及扩大马克思主义批评的影响做出了杰出的贡献。茅盾是最早认识鲁迅的意义并给予正确评价的批评家之一，茅盾对现代文学中“鲁迅的方向”的确立，起过积极的作用。\n\n茅盾充分地发挥自己理论批评家兼作家的特殊优越地位，以强大的思想穿透力、艺术感受力和对文学新创造的特殊敏感及时发现文学新人，从理论上总结经验，指明方向，对建立和培养现代文学队伍尽到了先驱者的责任。\n\n二、始终坚持革命现实主义的文艺应与中国的革命取同一步调\n\n茅盾的理论主张，主要集中在对19世纪以来我国现实主义文学理论体系的积极建设方面。从“五四”时期提出“为人生”的现实主义，到1925年之后将现实主义向前推进，演变为革命现实主义，茅盾都是核心人物之一。茅盾始终坚持革的现实主义的文艺应与中国的革命取同一步调，可以说他为我国现代文学中革命现实主义主导地位的形成，是起了重要的推动作用的。\n\n三、坚持反对公式化、概念化的倾向\n\n茅盾长期坚持反对公式化、概念化的倾向，注重艺术形式与艺术技巧的探索，积累了关于选材构思、谋篇布局、提炼情节、塑造人物、运用语言等一系列艺术手法的成熟经验。茅盾一贯主张学习世界文学中对我们有益的东西，在革命文学领域内重视艺术规律，促进现代文学内容与形式的不断进步，对中国文学的现代化做出贡献。","keywords":"现代评论开创者 革命现实主义与中国革命统一步调 反对公式化、概念化","note":"茅盾既是小说作家，也是文学评论家，在关注茅盾为现代小说做出的巨大贡献的同时，我们也不应该忽视茅盾为中国现代文学批评做出的贡献。在考试中，不排除出现相关题目的可能性。"},{"id":"98","stars":"★★★","title":"茅盾散文的特点","body":"茅盾的散文具有“鲁迅风”，他的散文杂感，都是反映时代，同时也是超越时代的。茅盾是内蕴丰厚的语言大师，其字精微，形象天成，不见圭角，他的语言看似平淡不惊，却独具辞风意雄的独特韵味，文炳雕龙，是中国现代散文宝山中不可多得的连城之珍。他的散文主要有以下特点：\n\n一、早期散文抒情性强\n\n茅盾在流亡日本期间所写的散文都是抒情性的，表现出了他敏感、细腻的内心世界和运用情感型文字的才能。《卖豆宸的哨子》《雾》《虹》中的哨音、浓雾、泥雨、彩虹为象征性投诸感情的对象，表达他大革命失败之后的苦闷、孤寂和不甘沉溺的个人心态，风格是沉潜、惆怅的。\n\n二、理与情、议论与具象互相融和\n\n茅盾左联时期的散文，以《雷雨前》为代表，这是一篇类似高尔基《海燕》式的文字，通过寓意表达出迎接革命风景到来的昂扬情绪。茅盾最为成熟的散文作品产生于抗战时期，著名的《白杨礼赞》《风景谈》都是精心结构而成，象征体式依然，心境却大大开阔，风格变为明朗、雄壮、激越。茅盾散文的精致蕴藉，理与情、议论与具象互相融和的特色到这个时候基本形成。这类散文大都属于叙事类的社会生活速写，如《故乡杂记》《交易所速写》《兰州杂碎》《苏联见闻录》等，实际上这些记述留下许多三四十年代国内外社会图景，有些散文近乎他的小说素材以与小说参照阅读。《苏联见闻录》里《梯俾利斯的“地下印刷所”》《“耐克拉索夫博物馆”》各篇显示出他作为小说家的观察精细，记述的时空感，明晰的笔力，也同他的总体文学特征相一致。\n\n三、语言精致而摇曳多姿\n\n茅盾的散文语言与小说语言是在“五四”后偏于欧化的白话基础上形成的，三四十年代后更趋精致而摇曳多姿，是文人书面语的典范，茅盾描写环境、服饰、体态的语言，本来就留在中国古典白话小说的优秀成分，到了《霜叶红似二月花》发表，人们更感受到他文字的民族特色：典丽，细密，活用成语和诗词，显得从容委婉。","keywords":"抒情性强 理与情 议论与具象 语言精致而摇曳多姿","note":"茅盾的散文成就虽然比不上他的小说成就，但也别具一格，产生了一定的影响，不排除会出现相关题目的可能性，与茅盾的小说相比，茅盾的散文抒情性更强一些，语言也比较精致。"},{"id":"99","stars":"★★★★","title":"试分析茅盾中长篇小说的史诗性特征","body":"茅盾的小说创作，特别是卷帙浩繁的中长篇小说，展现了时代精神风貌，刻绘了宏大驳杂的社会生活画面，清晰地显示出中国社会的历史变动和人民解放运动的起落消长，汇成了一部现代中国革命的宏伟史诗，不仅显著地提高了中国现代小说的艺术容括力，并为“五四”新文学树立了反映时代、推动时代前进的优良风范。茅盾小说的史诗性，主要表现在以下方面：\n\n一、反映社会历史生活的整体性和客观性\n\n（一）茅盾小说反映社会历史生活的整体性主要表现&#x5728;：\n\n（1）人物调度。基于反映社会历史“全般”的需要，茅盾中长篇小说大多具有庞杂的人物构成。但作家对他们的调度无不体现着“整体性”特征，直接间接、或显或隐地关联着小说的史诗世界，影响着史诗过程的展开。\n\n（2）景物描写。在茅盾那里，场景不是单纯的布景、孤立静止的画面，而是密切联系着人物命运的史诗世界的有机构成。茅盾小说中的“物”总是具有说明人的生活的功能。它们在完成这个使命时，就进入了典型环境，具有了艺术的内容，因而成为参与小说史诗世界构筑的艺术形象。\n\n（3）情节穿插。茅盾中长篇小说史诗式地反映社会历史生活，势必要在情节主脉之外，衍生出相对独立的穿插性情节。但它们不只是对史诗世界单纯的“量”的贡献，往往是影响史诗进程的重要机缘。\n\n（4）视角选择。茅盾中长篇小说几乎全部以第三人称的“全知视角”为主导视角，作家在时代制高点上，纵览历史风云，社会人生。这种全知视角在描绘生活的生动性、揭示灵魂的深刻性以及实现同读者的直接交流方面，或许不及其它视角，但无疑有力地促成了小说史诗世界的整体性。\n\n（二）茅盾小说反映社会历史生活的客观性体现在作品的形象结构中\n\n（1）茅盾小说的人物有鲜明独特的个性，他笔下的英雄人物可以有超乎常人的智慧和胆略，却没有逢凶化吉、遇难呈祥的法力。他揭示出反动派的丑恶灵魂和无耻情状，但也不将他们简单化脸谱化。唯其如此，这些形象才成为活的艺术典型，而不是某种概念的演绎和化身。\n\n（2）茅盾小说的故事情节富有艺术魅力，却不是世人罕见的惊险场面或奇闻轶事。它们蕴蓄着丰厚的社会历史内容，虽然比实际生活更高更典型，但仍然同生活本身那样朴素实在。情节的展开常常紧张有力，但总是以客观的方式，循着自身的内在逻辑发展衍进，很少富于戏剧性的“突变”。\n\n二、茅盾中长篇小说更为突出的史诗性特征，还在于它们具有强烈的时代性和社会性，这具体地表现在以下几个方面：\n\n（一）从现实生活中择取富有时代意义的重大题材，深入开掘作品的思想主题。茅盾从他的文学功利观和作家使命感出发，特别注重题材的现实性和重大性。但茅盾的特点不仅在于擅长选取具有伟大时代意义的题材，更在于能够深入地开掘题材，揭示出其中独特的思想意蕴。\n\n（二）追踪时代步伐，深广地展现特定历史阶段的时代风貌。茅盾小说的创作实践，显示了迅速反映时代生活的特点。&#x51E0;乎茅盾的每一部中长篇小说，都是在人们对重大事变的激动尚未平息、对那段生活的印象非常鲜活时，就创作问世的。同时，在茅盾不只追求速度，他更追求广度和深度，“在横的方面”展现“社会生活的各个环节”，“在纵的方面”透视“社会发展的方向”，在纵横交错中，反映时代社会的整体风貌和总体情势。\n\n（三）把握时代主脉，表现推动历史前进的主导力量。茅盾小说反映社会历史生活的大波大浪，必然表现历史的创造者-人民及其主体工农大众推动时代社会前进的伟大力量，热情歌颂人民力量和革命政党。同时，茅盾还清醒地审察了工农群众的思想局限和革命政党内部的消极因素，展示出群众运动中的狭隘复仇情绪、盲动心理和党内机会主义路线对革命的严重危害，显示了无产阶级作家鲜明的倾向性和坚定的原则立场。\n\n（四）着力展示艺术形象的时代特征和社会历史内容。茅盾的小说写了重大历史变故，社会经济关系，党内路线斗争，但始终以具体的感性艺术形象表现时代社会，用强烈的艺术力量感动读者，占据艺术中心的始终是人，是人的性格和命运。","keywords":"整体性 人物调度 景物描写 情节穿插 视角选择 客观性 鲜明独特的个性 故事情节 时代性 社会性 思想主题时代风貌 主导力量 艺术形象","note":"茅盾的小说注重题材与主题的时代性与重大性，能反映时代全貌及其发展的史诗性。我们可以结合具体的作品来体会，如《子夜》出于“史”的功能深入解释了1930年代国内经济斗争、阶级斗争的现实；同时又兼顾“诗”的功能，将个人化、感性化的历史经验编织在对具体人物的塑造中，展示了人性的变异与人情的恶化，让我们看到了人与人之间的真实形态。相关内容可以参考钱诚-《茅盾中长篇小说的史诗特征》，具体资料可以在李凡文学正版群中领取。"},{"id":"100","stars":"★★★","title":"试论民族资本家吴荪甫形象及其典型意义","body":"吴荪甫是《子夜》中一切人物、事件的联结点和矛盾斗争的契合点。茅盾把吴荪甫置于政治、经济、伦理等多方面错综复杂的社会关系中，真实地描写了他经营民族工业由发展兴盛到失败衰落的过程，成功地塑造了一个性格鲜明而又矛盾复杂的民族资本家的典型。\n\n一、吴荪甫形象特征\n\n（一）吴荪甫兼具资本家和封建家长的双重身份\n\n吴荪甫曾经游历过欧美，学会了一整套现代资本主义的管理方法，在精神上是西方资产阶级的兄弟。他有着发展中国独立的民族工业的雄才大略，也具备现代科学管理的经营之才，有着活跃的生命力、铁腕与魄力，想要摆脱帝国主义及买办阶级的束缚，最终在中国实现资本主义，开办有近万名工人的裕华丝厂。但在社会中，吴荪甫依靠剥削农民作为资本积累的手段；在家庭中，他对妻子、弟妹专横冷漠；在工作中，他镇压工农反抗。此上种种均体现出吴荪甫作为资本家的残酷剥削及作为封建家长的专断性质，从而导致其在与周围人的关系中处于孤立地位。\n\n（二）吴荪甫具有民族资产阶级的两面性\n\n在吴荪甫的身上，既有资产阶级剥削者的一面，也存在着一定的革命性，他既表现出了民族意识，又体现出了资本家的阶级属性，二者相互交融在一起的。首先，在吴荪甫的性格中，具有自私贪婪、专断残酷的一面。他对工人群众步步紧逼，作者在小说中对这种资产阶级的贪欲，给予了揭露和鞭挞。同时，在吴荪甫的性格中，又有悲壮的一面，他渴望发展中国民族国家工业，有着雄才大略，吴荪甫对外资的侵袭是抵制的，对买办金融资本家赵伯韬的要挟也充满了同仇敌忾、乃至困兽犹斗之势，他那强悍的生命力正是我们柔弱的民族性格中所缺乏的。因此，吴荪甫最终的失败，给读者带来复杂的心情。\n\n（三）吴荪甫的性格具有矛盾性\n\n吴荪甫的性格是一个鲜明的矛盾统一体，他有时果决专断，有时狐疑惶惑，有时满怀信心，有时垂头丧气，表面上好像是遇事成竹在胸，实质上却是举措乖张。作为大家长，在家里虽然颐指气使，但却不能弥合家庭成员中的裂痕。因此，他在与有帝国主义做后盾的买办阶级搏斗时，不能不感到政治上和经济上的软弱无力。这种软弱性投影在他性格上就造成了他在顽强、冷静、果断背后的空虚惶惑、悲观失望，最后导致精神上的崩溃。\n\n二、吴荪甫形象的意义\n\n（一）揭示了当时中国现实社会性质，概括了中国民族资产阶级必然命运\n\n吴荪甫的悲剧不仅仅是个人的悲剧，更是时代、民族的哀歌。这一形象的典型意义是：艺术地揭示了20世纪30年代中国现实社会性质，精确地概括出了中国民族资产阶级必然的历史命运，形象地表现了“中国并没有走上资本主义道路，而是更加殖民地化了”的深刻思想内涵，这恰恰是《子夜》的主旨所在。《子夜》通过民族工业资本家吴荪甫的故事深刻地揭露出这样一条真理：在帝国主义的侵略统治下，中国民族工业是永远得不到发展的，半封建半殖民地的中国不可能走上资本主义的道路。\n\n（二）作为民族资本家的典型具有独特的历史、美学价值\n\n中国民族资本家是颇能显示中国现代社会特定历史新阶段的人，本应当成为中国现代文学的重要角色，但由于种种原因，在现代文学的人物画廊里，民族资本家形象始终是一个薄弱的环节。茅盾对于吴荪甫的独特创造在一定程度上弥补了这一缺陷，具有特殊的历史的、美学的价值。","keywords":"民族工业资本家 失败了的英雄 矛盾统一体 中国现实社会性质 历史、美学价值","note":"吴荪甫是一个性格矛盾复杂，血肉丰满的艺术形象。中国民族资产阶级的两重性，在吴荪甫身上表现得十分鲜明。这一形象不仅会以论述题形式出现，而且在名词解释中出现的频率更高。"},{"id":"101","stars":"★★★★","title":"简析茅盾《子夜》的艺术特点（25武汉大学）","body":"长篇小说《子夜》的问世，标志着茅盾创作的一个高峰，奠定了他在现代文学史上举足轻重的地位，同时也标志着现代长篇小说的成熟。这部小说的艺术特点，主要体现在如下方面：\n\n一、具有史诗性内涵的题材选择\n\n《子夜》描写了20世纪初上海各种经济、政治、军事光怪陆离的现象，讲述了民族资本在半殖民地半封建的中国兴业无望的悲哀，塑造了民族资本家、官僚买办、洋场知识分子、交际花、工人等形形色色的人物，具有史诗性的结构和气魄。\n\n清晰的时代风云的展现，纷纭复杂的矛盾冲突的揭示，深广的社会生活的概括和细致的习俗风情的刻画，可以说，《子夜》不仅标志着“五四”以来的现实主义的创作已达到一个新的历史水平，成为革命现实主义的里程碑式作品，而且是中国现代都市文学中最早的具有宏阔体制和史诗性风范的作品。\n\n二、恢宏严谨的艺术结构\n\n《子夜》是“五四”以来第一部真正具有宏大而复杂的现代结构的长篇小说。结构严谨宏大，全景性、大规模、多视角地反映时代社会，同时又主线突出，主次分明，纵横交错，有张有弛。茅盾对小说的结构艺术进行了大胆创新与精心构制，突破了传统长篇小说线索单一、结构单调的线性结构局限。作品以吴荪甫为核心和矛盾冲突的焦点，把各种人物、事件在时空中交织组合起来。而各条线索合成一个庞大而复杂的蛛网式的艺术构架，层次清晰完整，线索分明又舒张有致，情节波澜起伏而又有条不紊，表现了茅盾对广阔复杂的生活的高度组织能力。\n\n三、在复杂的人物关系和矛盾冲突中塑造形象\n\n茅盾善于在广阔的社会背景下，通过复杂的人物关系和尖锐的矛盾冲突来塑造人物形象、刻画人物性格、表现人物命运。在这个意义上说，他“剖析”的仍是人-“人学”的“人”。如吴荪甫的形象，便是在人与历史的复杂关系中加以塑造的。一方面，作品将吴荪甫置于广阔的历史背景和错综复杂的社会关系之中，通过他在政治斗争经济活动以及家庭生活各个方面的纠葛，突出了吴荪甫“色厉内荏”的性格。另一方面小说为吴荪甫设置了众多的矛盾，并将他推至各种矛盾的焦点上，以充分表现其四面楚歌的逆境和对立统一的性格。同时，作者还通过对他与周围人物关系的描绘，对比、映衬吴荪甫的性格特征。这样就使得吴荪蒲的形象血肉丰满，富有立体感与典型性。\n\n四、细腻真切的心理描写\n\n茅盾是一位擅长于心理描写的作家。在《子夜》中，茅盾一方面注重吸收外国文学中静态的心理剖析的方法，有意识地运用托尔斯泰的“心灵辩证法”，细腻地刻画人物心理，揭示人物的内心和性格，深刻挖掘人物的灵魂世界。另一方面，他又运用古典小说中侧面写人物心理的方法，在动态中进行心理描绘，从而把人物的言语、行动、肖像、环境气氛和静态心理剖析糅合在一起。此外，《子夜》还通过对人物的潜意识和幻觉的描写，增强了整个作品心理分析的色彩，而且这种心理描写明显地运用了象征主义的手法。茅盾细腻的心理刻画，达到了社会历史的剖析与人物心理的剖析的统一，提高了心理刻画在我国现代长篇小说艺术中的地位。\n\n五、注重环境描写\n\n《子夜》中典型环境的设置和浓郁氛围的烘托都有匠心的表现。富有象征意味的色彩和声音的描写，与人物心理的刻画交相辉映。如《子夜》第七章在描写吴荪甫内外交困的心境时，作者巧妙地利用自然景象进行烘托，如灰色的云块、闪电、雷鸣、浓雾、金黄色的太阳、绿色的树林等，不同层次的音响效果和不同基调的色彩构成了吴荪甫内心世界的情绪起伏。全书中的自然景物都与人物塑造、情节发展有所联系，没有为写景而写景的闲笔虚文。\n\n六、精细明快、富有表现力的语言\n\n茅盾侧重于以精细的雕刻来展现生活，他把细密的描述与深切的剖解融合起来，在丰富的词语间，显露出艺术的可感性。其叙述语言恢宏细密，刚劲明快，且蕴含着作者的褒贬态度，极富于表现力；人物语言则生动简练且富于个性化，充分体现了各自的性格特点。人物语言和叙述语言，都能随故事和人物的性格发展变化而具有不同特色，使读者能如闻其声，如见其人，如临其境。《子夜》的语言是文学家与理论家语言的融合，是在民族语言的基础上吸收外来语形成独特风格的典范。\n\n总之，《子夜》是茅盾创作发展道路上的里程碑，就小说显示出的社会概括的广度和深度、艺术结构的宏大与繁复、人物创造的多姿与传神、文学语言的华赡与劲健而言，它都足以使茅盾和一般作家拉开一大段距离。","keywords":"史诗性内涵 恢宏严谨 人物关系 矛盾冲突 细腻真切 心理描写 精细明快 富有表现力","note":"《子夜》的艺术成就，我们主要从题材、结构、人物塑造、心理描写、语言这五个方面进行分析。需要注意的是，《子夜》的艺术成就从某种意义上来说也就是茅盾的艺术成就，大家可以将二者结合起来，共同记忆。同时，《子夜》作为茅盾最重要的一部作品，是在名词解释中考查频率非常高的内容，大家要注意重点把握，相关内容大家要注意一下。"},{"id":"102","stars":"★★★","title":"茅盾的《腐蚀》在心理描写方面有何独到之处","body":"与《子夜》主要从社会经济的视角“大规模地描写中国社会现象”的“社会剖析”风格不同，茅盾的日记体长篇小说《腐蚀》则体现了另一风格-细腻生动的心理刻画，这成为这部小说最重要的艺术特色。\n\n一、采用了“日记体”的第一人称的叙事方法\n\n《腐蚀》作为一部日记体小说，和茅盾的其他作品相比，更具特色。茅盾其他作品的心理描写，是作者以叙述者的身份描写人物的内心世界，作家充当了“无所不知的叙述者”“像神一样”任意进入作品中每个人的内心世界。《腐蚀》则不同它是主人公以第一人称来披露自己的内心活动的，避开了叙述者的身份，这样的心理描写就显得更加自然真切。\n\n作品采用日记体的形式，除了能增强作品的真实感外，更能贴切地表达主题。因为，作者所要描写的主人公是个失足之后不甘堕落的小特务，她可以在日记中直接披露心灵的矛盾和痛苦，可以冷嘲热讽，嘻笑怒骂，无所顾忌。这样，作者就既巧妙地谴责了国民党特务组织的残酷、卑劣与无耻，又暴露了国民党特务组织中不少青年如何受骗失足的内幕，从而能起到分化、瓦解胁从者的作用。\n\n二、大量采用内心独白的方式，富有层次感地揭示人物内心世界的变化\n\n小说描写了赵惠明由一个追求享乐与刺激的利己主义者最终堕落为国民党女特务，以及由堕落到悔过、自新的过程，非常富有层次感和分寸感，整个过程充满了内在的紧张性，不仅努力挖掘与揭示人物心理活动的深刻的社会历史的内容，而且注意把人物置于广阔的社会历史运动中，展现人物心理发展的历史。\n\n三、浓烈的议论性和抒情性\n\n《腐蚀》中的心理描写有着浓烈的议论性和抒情性，这主要表现在主人公的内心独白中。如小说一开始，主人公一段抒情性的独白，就把内心的痛苦，把憎恨旧我、渴望新生、希图重新做人的复杂心情，揭示得淋漓尽致。再如十一月三日记叙他们奉命加紧特务活动，以配合反共阴谋时，赵惠明的一段发泄牢骚的议论，对肮脏丑恶的特务组织讽刺得入木三分。心理描写中包含的这种议论和抒情，大大增强了作品的战斗性。\n\n四、外貌描写和整体叙事极为含蓄\n\n《腐蚀》因侧重揭示人物的心灵世界，所以对人物外在形象的描述给人以更多想象的余地。例如主人公赵惠明，是个颇有姿色而且风流的女人，但在作品中并没有正面去描写，她的仪容是从她的一些片断的自我解剖中含蓄地表露出来的，同时也表现了她在勾心斗角、杀机四伏的鬼蜮世界中被腐蚀、被欺骗、被侮辱的境况。再从叙事来看，也是含蓄的。比如大特务希强对赵惠明的引诱和欺骗，赵惠明在自白中并没有去追述这一具体过程，她只是简要地交代了希强曾用“种种的逼胁诱惑手段，迫使她受骗离开了小昭而沦为特务的事实。\n\n五、心理描写有着更多的艺术功能\n\n（一）《腐蚀》中的心理描写往往起到一箭双雕的作用。小说中不少地方的内心自白，都是既表现了主人公对人对事的思想性格，又巧妙地显露了作者的观点和态度。例如一月十一日的日记中，主人公的一段自白既形象地反映了当时鬼蜮横行的黑暗现实，又表现了主人公对所处环境的厌恶情绪，也巧妙地显露了作者对现实的抨击。\n\n（二）作品中不少地方的心理描写，不仅表现了人物的内心世界，而且起到了激化矛盾、推动情节发展的作用。小说的基本情节是写赵惠明被拉下水当特务，在特务组织中又不甘堕落，不断挣扎，终于走向了自新之路。全书由五十二则日记组成，其间时断时续，表面看来，似乎散漫而零碎，实际上却通过主人公的自叙自白交代了事件，展开了矛盾，推动了情节的发展，从首至尾，形成了一个完整的故事结构。\n\n六、结合具体情景进行心理描写\n\n《腐蚀》虽然通篇都用心理描写，但并无单调、枯燥之感。因为作者并不是静止地孤立地运用这种方式。由于主人公是在特定的环境中行动的，所以作者描写她的心理状态也是在规定的情景中进行。例如当时的重庆，敌机经常空袭，弄得人心惶惶，作者就结合这种情境多次剖露了赵惠明特有的心理状态。在这种恐惧的环境中，她产生了这样的心情：“要是这时候一个炸弹下来，马上完蛋，倒也痛快！”这种心理状态反映了她鬼混在勾心斗角的特务组织中，既憎恨自己的环境，又无法摆脱这罪恶的深渊，企图以死来解脱自己痛苦的悲观厌世情绪。\n\n七、用梦境的形式来刻画人物的心理状态，\n\n作者多次用梦境的形式来刻画人物的心理状态，增添了浪漫主义色彩。如作品描写了二月三日赵惠明的一个迷乱又荒唐的梦境，那正是她冒险帮助失足青年N逃出魔窟的行动的反映，而她采取这个行动又恰是小昭革命精神对她的鼓舞，以及K 的来信对她的希望在梦境中的幻象化。","keywords":"日记体 内心独白 议论性和抒情性 含蓄 一箭双雕 推动情节 具体情景 梦境","note":"《腐蚀》这部小说采用“日记体”的第一人称叙事方法，采用了大段的心理描写，和茅盾以《子夜》为代表的社会剖析小说显示出了很大的区别，所以整理出这道题目大家参考。同时需要注意的是，《腐蚀》这部作品也有可能以名词解释的形式考查，除此之外，还有茅盾的“农村三部曲”这一概念，也有可能出名词解释，大家要多多准备。"},{"id":"103","stars":"★★★","title":"简述老舍的创作成就（26北京大学）","body":"老舍是20世纪中国杰出的文学大师、“人民艺术家”，在多个领域中都取得过重要成就。老舍对中国现代文学的贡献是多方面的，主要表现为：\n\n一、对文化批判与民族性问题的格外关注\n\n老舍在中国现代文学史上的独特地位与价值在于他对文化批判与民族性问题的格外关注，他的作品承受着对转型期中国文化尤其是俗文化的冷静的审视，其中既有批判，又有眷恋，而这一切又都是通过对北京市民日常生活全景式的风俗描写来达到的。他第一个把“乡土”中国社会现代性变革过程中小市民阶层的命运、思想与心理通过文学表现出来并获得了巨大成功。老舍的作品注重文化，铺写世态，是那么真实而又有世俗的品位，加上其表现形式又适应并能提高市民阶层的欣赏趣味，所以能为现代文学赢得知识分子之外的众多读者。北京文化孕育了老舍的创作，而老舍笔下的市民世界又是最能体现北京文化的人文景观，甚至成为一种文化史的象征，一说到北京文化，就不能不联想到老舍的文学世界。\n\n二、具备独特的文体风格，标志着我国现代小说在民族化与个性化上取得突破\n\n老舍的作品在中国现代小说艺术发展中有十分突出的地位，与茅盾、巴金的长篇创作一起，构成现代长篇小说艺术的三大高峰。老舍的贡献不在于长篇小说的结构方面，而在于其独特的文体风格。老舍远离二三十年代的“新文艺腔”，他的作品的“北京味儿”“幽默风，以及以北京话为基础的俗白、凝练、纯净的语言，在现代作家中独具一格。老舍是“京味小说”的源头。老舍创作的成功，标志着我国现代小说（主要是长篇小说）在民族化与个性化的追求中已经取得重要的突破。\n\n三、话剧创作成就最高代表者\n\n老舍是建国后我国话剧创作成就的最高代表者。老舍一生创作了数量众多的话剧，如《残雾》《面子问题》《大地龙蛇》《归去来兮》，建国后的《方珍珠》《龙须沟》《春华秋实》《西望长安》《茶馆》《女店员》《全家福》等。特别是《茶馆》充分展示了老舍作品所独有的“京味”风格，成为老舍话剧创作的顶峰，也是我国当代话剧最杰出的代表，在思想性和艺术性方面都取得了极高的成就。同时老舍还是中国现代曲艺的提倡者和改革者，和“五四”以后的绝大多数作家不同，老舍利用多种传统艺术形式，写下了体裁各异的通俗作品，为我国民族艺术的发展作出了贡献。","keywords":"文化批判 民族性问题 独特的文体风格 民族化与个性化 话剧创作成就","note":"老舍的艺术贡献，一方面在小说创作上面，一方面在话剧创作方面。在小说创作上，他是可以和巴金、茅盾并肩的长篇小说创作三大高峰之一；在话剧创作上，他是建国后话剧创作成就的最高代表，大家要仔细掌握。老舍的作品中，像是《骆驼祥子》《四世同堂》《茶馆》这些比较具有代表性的作品，是名词解释中的常客，大家要做好相关准备。"},{"id":"104","stars":"★★★★","title":"老舍笔下的市民形象类型是怎样的","body":"在老舍的市民世界中，活跃着老派市民、新派市民以及正派市民等几种不同的人物系列，各式人物的性格构成往往都在阐释着某种文化内涵，老舍写“人”的关节点是写“文化”。\n\n一、守旧的老派市民形象\n\n老舍写得最好的是老派市民形象，他们虽然是城里人，但仍是“乡土”中国的子民。身上负载着沉重的封建宗法思想的包袱，他们的人生态度与生活方式都是很“旧派”，很保守、闭塞的。老舍常常通过戏剧性的夸张，揭示这些人物的精神病态，从而实践他对北京文化乃至传统文化中消极落后方面的批判。\n\n二、对“新派市民”形象的漫画式描写\n\n许多同时代的作家不同的是，老舍在批判传统文明落后面的同时，对外来的西方资本主义文明持非常谨慎以至排拒的态度。这种态度表现在他对“新派市民”形象的漫画式描写上。老舍对老派市民是既批判又同情的，较能揭示老派市民形象的性格心理矛盾，有的带着悲剧意味；而在给新派市民画粗俗的漫画时，鄙夷不屑之情便溢于言表。就小说所描写的道德失范、价值混乱而言，老舍的批判是有其现实针对性的，然而这种比较肤浅的嘲讽或批评里头，又包含着对于西方资本主义文明的反思。批判传统文明时的失落感和对“新潮”的愤激之情常常交织在一起，并贯穿在老舍的小说中。\n\n三、理想的市民形象\n\n与老派的和新派的市民形象系列相比照，老舍的笔下又出现了正派的或理想的市民形象。显然，老舍在描绘城市资本主义化过程所产生的文化变异与分裂的图景时，还没有放弃对理想的追求，况且老舍的创作很注重社会的教化功能，他写理想的市民是为了探索文化转型的出路，使作品变得更有思想启蒙意义。\n\n在老舍看来，为神圣的民族解放战争所唤起的这种坚韧不屈、勇于自我牺牲的民族精神是可以成为建设新民族、新国家的精神力量的。这瞩望未来的眼光，标志着老舍的创作随着时代的发展达到了一个新的高度。","keywords":"守旧的老派市民 传统文化消极落后的批判 新派市民 排拒西方资本主义文明 理想的市民形象 探索文化转型的出路","note":"老舍是中国现代文学史上的一个极其独特的存在，他一直致力于对市民文化的思考，并以此为出发点建构了笔下的市民世界。所谓文化，老舍认为这是一个人群单位，即一个国家民族古往今来的精神与物质的生活方式。在展现市民世界时，老舍采用了与20世纪二三十年代主流文学所选取的政治、革命不同的视角，选择从文化的角度来区别各个阶层的世界。其作品的中心是既定文化背景下的人民的不同命运以及在文化中蕴藏的人情和世态。老舍擅于通过文化伦理的视角对风俗、道德进行国民性的思辨，其小说中的市民世界和人文景观始终是我国文化史的里程碑。本题还可以换种方式提问，如“如何理解‘老舍写人的关节点是写文化””，我们还是从作家塑造的市民世界入手就好。"},{"id":"105","stars":"★★★★","title":"试分析老舍社会价值判断的二元性","body":"老舍是中国现、当代文学总体格局中一个丰富复杂的个体，为我们展现了一幅幅独特的现代文化景观，即传统文明批判和现代文明批判：既在现代意识层次上对传统文明加以重新审视，又站在传统文明中符合理性或人性的一面，对现代文明进行批判。\n\n一、价值判断二元性的表现\n\n（一）对传统文明的审视\n\n在传统文明批评方面，老舍对“老国民”进行批判。他总是把几千年古文化结构渗透到市民社会心理中，去加以表现和批判，在传统文明与现代文明的对比中，去透视国民劣根性。老舍写得最好的是老派市民形象，他们虽然是城里人，但仍是“乡土”中国的子民，身上负载着沉重的封建宗法思想的包袱，他们的人生态度与生活方式都是很“旧派”，很保守、闭塞的。老舍常常通过戏剧性的夸张，揭示这些人物的精神病态，从而实践他对北京文化乃至传统文化中消极落后方面的批判。\n\n（二）对现代文明的批判\n\n老舍是中国现代文学史上少有的几个深感现代文明重压者之一。在对传统文明进行批判的同时，又敏锐地感受到现代文明空气的窒息-也正是在这个意义上，他不能不对传统文明的式微表现出担忧。老舍在现代社会的发展中，关注伴随而生的人的异化现象，关注现代文化与传统文化的断裂。他力图从传统文明中寻出人性、人与人的和谐、人与自然的和谐，来补救现代社会和现代文明的危机。因此，老舍在道德情感层次上，展开了他对现代文明批判的主题。老舍通过一批青年恶少形象，批判了二十世纪“现代文明”，并贡献给中国现代文学人物画廊一种“社会典型”。\n\n二、老舍社会价值判断二元性的成因\n\n老舍在社会价值判断上的二元性，他的情感与理性的矛盾冲突，是出于个人的性格与环境两方面的影响。\n\n（一）个人性格\n\n老舍是个重感情的人，同时，他又管束着自己的感情，不完全以自己的爱憎去判断事物，他认识到文学需要感情，但“感情不会给人以远见”，他并没有完全以情感代替理性，堕入传统主义的温情脉脉之中。问题的另一面是，“人情是往往能战胜理智的”，它也时时左右着艺术家的社会价值判断。老舍的一生，就是对自身传统文化性格不断突破的过程。所以，一方面，老舍从理性上认同现代文化，但从情感上，他又不由得追思文化传统，这影响了他价值判断的二元性。\n\n（二）环境因素\n\n充满传统文化氛围的北平，既是老舍批判的对象-他把古老、淡雅、凝固，滞重的北平，放在现代历史的天平上加以重新审判。但也正是这同一个北平成了他的生命，他的“根”，北平对老舍已经成为一种深层意识，并不是现代风暴的冲击所能轻易洗刷的。虽然老舍接受了西方现代文明，接受了“五四”思潮的冲刷，但北平这座城市作为老舍的“根”，仍旧深深影响着他，这也使得他的社会价值判断出现二元性。","keywords":"传统文明审视 现代文明批判 重感情 管束感情 批判对象 深层意识","note":"中国现代知名作家中，对待现代化主要有两种态度，一种是鲁迅这种，希望通过现代化来唤醒国民，破除封建主义制度；另一种是沈从文这种，受文化守成主义影响，更多地表现出对现代化的忧虑。在这之中，老舍是比较特殊的，受限于其个人性格与生活环境，其既接受现代文明，又保留着对传统文化的怀念，并同时对这二者进行审视和批判，所以很难将其归入以上两类之一。这三位作家的不同态度十分具有代表性，大家要注意一下。"},{"id":"106","stars":"★★★★★","title":"老舍小说创作的主要特征","body":"老舍被称为“人民艺术家”，主要以长篇小说和剧作著称于世。其作品大都取材于市民生活，为中国现代文学开拓了重要的题材领域。老舍小说创作的主要特点有：\n\n一、始终用“文化”来分割人的世界\n\n老舍始终用“文化”来分割人的世界，他关注特定“文化”背景下“人”的命运，以及在“文化”制约中的世态人情、作为“城”的生活方式与精神因素的“文化”的蜕变。对老舍来说，市民社会中阶级的划分或者上流下层的划分都不是最重要的，重要的是“文化”对于人性以及人伦关系的影响。其对中国传统文化的反思以及对国民性的探讨也是独特的，在他的那些最优秀的作品中，还格外注重为现代文明探索病源，那更是发人深省的。\n\n在老舍的市民世界中，活跃着老派市民、新派市民以及正派市民等几种不同的人物系列，各式人物的性格构成往往都在闸释着某种文化内涵，老舍写“人”的关节点是写“文化”。\n\n二、风格上“京味”十足\n\n老舍作品中最引人注目的是“京味”。“京味”作为一种风格现象，包括作家对北京特有风韵、特具的人文景观的展示及展示中所注入的文化趣味。\n\n“京味”首先表现为取材的特色。老舍聚集其北京的生活经验写大小杂院、四合院和胡同，写市民凡俗生活中所呈现的场景风致，写已经斑驳破败仍不失雍容气度的文化情趣，还有那构成古城景观的各种职业活动和寻常世相，为读者提供了丰富多彩的北京风俗画卷。\n\n“京味”作为小说的风格氛围，又体现在作家描写北京市民庸常人生时对北京文化心理结构的揭示。北京长期作为皇都，形成了帝辇之下特有的传统生活方式和文化心理、习惯，以及与之相应的审美追求，迥异于有更浓厚的商业气息的“上海文化”。（详细内容可参考下一道题）\n\n三、追求幽默\n\n老舍堪称是中国现代的幽默大师，在中国现代喜剧文学中占有举足轻重的地位，尤其贡献了长篇幽默小说的类型。\n\n老舍的早期作品多少受到了英国幽默文学的影响，表现出幽默风趣和机智冷峭的特点。他善于从新旧杂陈的现实中挖掘笑料，尤其在所谓新派人物的不伦不类的行为举止和思想观念中提炼出诙谐的因素。其后老舍经历了对幽默艺术的自我反思过程，之后，老舍更习惯从常规的生活形态中发现非常态的地方，更倾向于从生活与人性现象中洞察喜剧意味。这一时期的老舍表现出了节制的艺术，渗透在幽默之中的，是力透纸背的对人物的怜悯和同情。老舍的幽默还表现出平民化的特征，他的幽默，他的文字间的机趣大半是源自民间的。\n\n四、叙事上对说书艺术自觉借鉴\n\n老舍也是一个叙事大师，有出色的讲故事的本领。在叙事艺术上，老舍自觉地借鉴了说书艺术，拟说书人的叙事者的选择，奠定了老舍别具一格的叙事风格，表现出鲜明的“讲述口吻”，有一种源自民间的平民化特征。这种讲述式的语态，既平易又生动，有助于缩短与读者间的情感距离，使读者迅速认同作者意图，彰显了老舍平民化的叙事姿态。说书技艺在老舍小说中的表现形式之一，是叙事者大量评论性干预的运用。同时，老舍还发明了一种反讽性评论，这种评论就很明显地暴露主体各部分间的分歧，使主体的分化变成主体的分裂。由此，体现着小说价值立场的隐含作者与讲故事的叙事者之间就产生了较大的距离。","keywords":"“文化”分割人的世界“京味”十足 追求幽默 说书艺术","note":"老舍的小说善于从很细微的方面写城市市民的生活、处所等等，如果要用一个词来加以概括，最宽泛、最恰当的恐怕就是“文化”-老舍就是这样一种“文化型”作家。老舍的个性气质、情感体验特征、认知方式及其文学表现方式等主体特性，是时代的产物。我们在分析老舍小说的创作特征时，可以从作家的生活环境和经历方面进行考虑。同时注意有些院校可能要求结合具体作品，进行论述，这就考验大家的阅读量了。"},{"id":"107","stars":"★★★★★","title":"结合作品谈谈老舍的“京味”特征（25华中科技大学、26北京师范大学）","body":"老舍作品中最引人注目的是“京味”。何谓“京味”？“京味”就是“北京味”。“京味”作为一种风格现象与文化现象，包括作家对北京特有风韵、特具的人文景观的展示及展示中所注入的文化趣味。老舍作品中的“京味”，主要表现在以下方面：\n\n一、独特取材“酿”京味\n\n老舍作品仿佛就是地域风情的京味风格展示长廊。京城社会底层好面子、讲排场的胡同文化，发生在破败四合院的各式故事，如同一幅幅充满地域风情的民俗画卷，在老舍笔下徐徐展开。\n\n老舍在其文学作品中，注入了真实的北京地理环境，大街、小巷，大小杂院，店铺、茶馆，胡同、庙会、集市，山水景点，在老舍的笔下，错落有致，活灵活现，仿佛把读者领入了北京城，让人们尽情地欣赏北京的美丽风景，咀嚼北京的风土人情，其间，具有很高的民俗学价值，如《骆驼祥子》中，从开篇对北平洋车夫“门派”的引言，到虎妞筹办婚礼民俗的交代，以及通过描写祥子拉车经过的地方，描绘出北平的景物，都透露出北平特有的地方色彩。\n\n二、文化心理结构“藏”京味\n\n“京味”作为小说的风格氛围，又体现在作家描写北京市民庸常人生时对北京文化心理结构的揭示。北京长期作为皇都形成了特有的传统生活方式和文化心理习惯，以及与之相应的审美追求，迥异于有更浓厚的商业气息的“上海文化”。老舍用“官样”一语来概括北京文化特征，包括讲究体面、排场、气派，追求精巧的“生活艺术”；讲究礼仪，固守养老抚幼的老“规矩”；性格的懒散、苟安、谦和、温厚与懦弱等等。\n\n老舍的作品处处写到礼仪，礼仪既是北京人的风习，亦是北京人的气质，“连走卒小贩全另有风度”。《二马》中老马赔本送礼，《离婚》中老李的家眷从乡下来同事们要送礼，张大哥儿子从监狱里放出来也得送礼，《骆驼祥子》中虎妞要祥子讨好刘四爷更需送礼，《四世同堂》则直接详尽描写祁老人“自幼长在北京，耳习目染的向旗人学习了许多规矩礼路”。这不仅是一种习俗，更表现了一种“文化”“性格”。\n\n《四世同堂》第一章就写到：无论战事如何紧张，祁家人也不能不为祁老人祝寿，“别管天下怎么乱，咱们北平人绝不能忘了礼节”。就连没有一点文化的车夫小崔也熏染了这种北京“礼节”：他敢于打一个不给车钱的日本兵，可是在女流氓大赤包打了他一记耳光时，却不敢还手，因为他不能违反“好男不与女斗”的“礼”。\n\n老舍对“北京文化”的描写是颇为复杂的，既充满了对“北京文化”所蕴含的特有的高雅舒展、含蓄精致的欣赏陶醉，同时也时时为“文化过熟”导致的柔弱无用而叹惋不已。对北京文化的沉痛批判和由其现代命运引发的挽歌情调交织在一起，使老舍作品呈现出比同时代许多主流派创作更复杂的审美特征。老舍作品中的“京味”正是这种主观情愫与对北京市民社会文化心理结构的客观描绘的统一。\n\n（李凡说：李泽厚说：“所谓“文化心理结构＇，归根究底，本就是指在文化传统长期塑造下的人们心理中情理结构的特定状态，它主要表现为自然情欲和社会理性的不同比例、配置和关系的组合。”通俗的说，文化心理结构是指人在社会实践中由家庭环境、社会环境和文化教育环境相互作用而形成的心理素质、情感态度、价值取向以及思维方式的总和。文化心理结构是人的精神形体的骨架，是民族心理的一种稳定的模式。）\n\n三、北京方言写京味\n\n老舍的“京味”文学使用的是京味十足的北京方言，这种语言是“京味”文学的外在特征，也是“京味”文学最鲜明的标志。\n\n老舍的语言不见旧式文人的气息，也没有“新文艺腔”，他有意用北京市民俗白浅易的口语来传达市井生活的韵味，满带着“京腔京调”，同时又在俗白中追求讲究、精致的美，写出“简单的、有力的、可读的而且美好的文章”。老舍成功地将语言的通俗性与文学性统一起来，做到干净利落，鲜活纯熟，平易而不粗俗，精致而不雕琢。小说中的语词、句式、语气以至神态气韵，都有独特的体味和创造，又隐约渗透着北京文化。如以“挺脱”描写祥子的身体，既取自北平人唇舌，也符合人物的身份。再如《骆驼祥子》中对祥子的肖像描写：“头不很大，圆眼，肉鼻子，两条眉很短很粗，头上永远剃得发亮......”所有的语言，完全是口语里的大白话，但又是经过提炼、控制的大白话，符合普通话口语的习惯，使具有小学水平的人都可以毫不费力地阅读。\n\n其作品的叙述语言也多采用精确流畅的北京口语，既不夹杂文言词汇，也不采用欧化文法，通过精心配置长短句，增加了语言的音乐感，显示出老舍致力于语言民族化和大众化的努力。\n\n（李凡说：但老仓小说中的“京白”，有时也过于铺张油腔滑调，特别是人物的对话，如《离婚》中二妹妹回答张大嫂的问题时“耍贫嘴”过于腻味。）\n\n（李凡说：此处也帮大家整理几处明显具有京味色彩的语言：\n\n①“铁杆庄稼”，也称“吃皇粮”，老北京的方言用语，指的是清代旗人当兵代代世袭，按时领体禄。“铁杆庄稼”，用现代人的话来说，即“狭饭碗”之意。\n\n②“灰色大褂”，代指封建复辟。\n\n③“拉晚儿”，指人力车工人晚上出车，在天亮之前的那段时间干活。\n\n④“车份儿”，这是老北京人力车行的俗语，指每天都需要给别人交租金。\n\n⑤“喻谷”，也是北京口语用词，特指口粮，生活费。）\n\n四、幽默趣味增京味\n\n老舍的幽默，深深地打上“北京市民文化”的烙印，形成了更内蕴的“京味”。作为现代幽默大师，他的剧作带有北京市民特有的“打哈哈”的性质，既是对现实不满的一种以笑代愤的发泄，又是对自身不满的一种自我解嘲，使喜剧与悲剧、讽刺与抒情渗透、结合，获得了一种丰厚的内在艺术力量。他善于从常规的生活形态中发现“非常态”的地方，更倾向于从生活与人性现象中洞察喜剧意味。在他的幽默中，体现出力透纸背的对人物的怜悯和同情，将幽默节制住，体现一种“浸润在亲切体贴中的心理距离”。他的幽默还有平民化的特征。他的幽默是来自北京市民特有的智慧形态，以幽默与语言的才能，解脱历史、生活的沉重感。\n\n从《离婚》开始，老舍为“京味”的幽默找到了健康的发展方向：追求更加生活化，在庸常的人性矛盾中领略喜剧意味，谑而不虐，使幽默“出自事实本身的可笑，可不是从文字里硬挤出来的”；追求更高的视点，更深厚的思想底蕴，使幽默成为含有温情的自我批判；追求艺术表现上的节制与分寸感，逐渐克服了原有的单纯性质，产生了喜剧与悲剧、讽刺与抒情的渗透、结合，获得了一种丰厚的内在艺术力量。如《柳家大院》中他把小王媳妇的黄毛脑袋比喻成“像搁了陈了的窝窝头”。《正红旗下》中描写大姐婆婆生气是“鸣炮一百零八响”！这些夸张手法的运用，增强了幽默效果。\n\n五、异化文明添京味\n\n北京人养成了讲礼仪习惯的同时，也养成了谦和、温厚的性格，甚至是懒散、苟安、懦弱的性格。这种城市文明病增添了“京味”文学的味道。\n\n《骆驼祥子》中的祥子，从开始拉车的热情，为人的要强和做事的体面，到后来的自私，苟安，使坏，突出了祥子的“入乡随俗”的过程，渲染了祥子“随波逐流”的状态。表明了祥子的悲剧里有城市文明病对北京文化的侵袭，对人们性格的影响和改变。还有《我这一辈子》中的“臭脚巡”与祥子同命相怜，好不容易干上了个“巡警”，从争气，讲体面，讲排场和讲气派一直到懦弱，苟安，得过且过，最后消沉、堕落，混完了一辈子。\n\n又如《老张的哲学》中，关于文明结婚的描写，重在揭示传统文化规范下人性的异化，国民灵魂的扭曲：北京所谓的“文明结婚”，虽然用马车代替了花轿，其实质仍是“女性被男性奴役”的野蛮结婚，在男权社会体系中，身处受蹂躏的奴隶地位，却毫不觉醒，还自觉不自觉地充当着帮凶。作者以此表达了“哀其不幸，怒其不争”的愤激之情。这部长篇小说最主要是揭露了老张这个所谓靠“办教育”发家的京城恶棍，思想和行动尊奉的是“钱本位哲学”。（李凡说：此部分可以参考老含改造国民性的题目。）\n\n不同的人文地理环境，孕育不同的地域文化，也造就了不同的民族群体。北京，一座古老而又现代的城市，历经千年风雨，现如今的北京，不仅是一个地名称谓，更是一种文化符号的象征。老舍笔下的老北京，既是他对北京民间生活的一种把握和感知，也是对现实与人文的一种构建。很显然，北京已成为老舍的精神文化追忆，当然，这也成为了千千万万北京人的精神文化追忆。\n\n【李凡关键&#x8BCD;：&#x72EC;特取材“酿”京味 文化心理结构“藏”京味 北京方言写京味 幽默趣味增京味 异化文明添京味】\n\n【李凡说：“京味”是老舍作品风格最重要的表现，因此这道题目还是有必要弄的详细一些的，以本题为切入点，可以上升到一个更加宏大的话题，文学风格与地域文化，南北方不同的文学创作论等，大家一定要多思考。】","keywords":"","note":""},{"id":"108","stars":"★★★★","title":"试分析老舍的“改造国民性”思想","body":"一、老舍“改造国民性”思想的特征\n\n在中国现代文坛上，老舍是继鲁迅之后坚持改造国民性主题的文学大家之一，但与鲁迅不同的是，老舍更多地是从风俗文化的角度切入“改造国民性”这一启蒙主题的。他是从大量逼真细腻的风土人情、社会习俗出发，对文化的具体表现形态给予了生动细致的剖析，凭借自己丰富细腻的感受和语言表现才能，条分缕析着一个个看似微不足道的“毛细血管”，具体地描绘他所熟悉的一个个“老中国的儿女们”的本真生态与心态。\n\n总体来说，老舍没有像鲁迅那样以精英的姿态，站在启蒙思想的高度，运用丰赡的学养思考国民性问题，而是以一个普通市民的角度和见识，从真实的底层生活经验出发，来观察它的种种表现。\n\n二、影响老舍国民性思考的因素\n\n（一）对“国民性”的理解不同影响了老舍对国民性的思考，老舍认为，“国民性”就是“民族性”，这两个概念完全通用，同时，通过对满人的观察，老舍还认为中国的国民性不仅有缺点，还有优点，二者是一体的两面，无法截然分开。虽然，他也同意国民性是文化的产物，但对于将病根归于传统文化的看法却持保留意见。他发现这种文化虽然导致了怯懦、柔\n\n顺等民族弱点，但也培养了坚韧、义气等非常可贵的民族精神。也就是说，许多由它所造成的可笑之处，从另一角度看却恰恰正是可爱之处。\n\n（二）市民出身也深刻地影响了老舍对国民性的思考。与那些知识精英不同，老舍虽然也会跳出来“俯视”底层市民，客观地观察他们，但所持的却不是高高在上的启蒙姿态，而是更为平等的、体贴的姿态。因而，相比之下，老舍对底层市民的把握和洞察就更加精细到位，带有人间烟火气。\n\n（三）满族身份影响了老舍的国民性思考。经过辛亥革命，满族的统治被推翻，身为满族遗民的老舍，对汉族的统治有很深的疏离感，甚至是恐惧感。一个底层的满人在异族的统治下，他最关心的大概不会是有关政治改革一类的宏大话题，而是能否过上安安稳稳的生活。更何况，当老舍目睹了满人被歧视、侮辱甚至是残害的现实后，他对这各种社会运动和改革就更加失望，提不起兴趣。对他而言，无论国家发生怎样的变革，恐怕都远不及有个稳定的国家秩序更重要。\n\n三、老舍“国民性改造”思想的意义\n\n老舍从风俗文化的角度切入“改造国民性”的主题，在现代文坛上具有不可替代的独特意义。因为一个民族的风俗习惯与其民族性格有着直接而密切的关系。那些几千年积淀下来，又时时更新变异的形形色色的民俗民风，构成了这个民族最为直观和丰富的精神面貌。\n\n而一个民族的风俗习惯作为其传统文化的外壳与表现形态，相较而言更加复杂宽广。老舍的人生体验尤其是他的底层经历和独特的创作个性，使他在表现民风民俗方面具有着特殊的优势。因此，当老舍从“食”“色”这类普通人最基本的生活方式和行为模式的角度，由对北京市民社会民风民俗的表现来揭示中国国民性的病态时，就显得特别得心应手。可以说，老舍为中国新文学的“国民性”书写开辟了另一种路径。","keywords":"风俗文化角度切入 对“国民性”理解不同 市民出身 满族身份 开辟路径","note":"纵观近现代中国历史，在对国民文化进行批判方面，鲁迅开启了深刻的国民性研究。老舍上承鲁迅余绪，在新文学运动的感召下进行创作，也成为现代文学史上坚持以改造国民性为主题的作家。不过与鲁迅不同，他是从风俗文化的角度来切入去批判国民性，而且老舍的作品没有力图冲破一切的个性解放之状，而是由群体的自觉呈现出国家观念和自觉自信的民族意识。老舍在批判上采取笑骂的态度，并不赶尽杀绝，而是含有一丝丝温情。老舍的视角更多集中于民间，写市井小民的悲欢离合、嬉笑怒骂，营造了北平独特的文化氛围。相关内容可以参考迟蕊《老舍对“国民性”书写的思考及与鲁迅的差异》，具体资料可以在李凡文学正版群中领取。"},{"id":"109","stars":"★★★★","title":"试分析《骆驼祥子》中祥子的形象","body":"《骆驼祥子》的成就，主要体现在祥子这一悲剧典型的塑造上。祥子的形象是我国现代文学史上第一个血肉丰满的都市个体劳动者的典型形象，这一形象的塑造，是老舍对现代文学的重大贡献。\n\n一、祥子形象的特征\n\n小说刚开始时，祥子诚实、质朴、善良，身体强壮，有力气，拉车本领高超，刻苦耐劳如骆驼，有决心和毅力。善良正直的本性，决定了祥子的生活态度，他年轻壮实，却也懂得相濡以沫，体恤着比他更困苦的老弱病残。当然作家在表现祥子身上的优点的同时揭示和批判了祥子自身的固有的缺陷。他不合群，别扭，自私，死命要赚钱，这就决定了他的孤独、脆弱，最终完全向命运屈服，一步步走向堕落深渊。\n\n小说最后，祥子完全变了个人，他变得懒惰、贪婪、麻木、缺德，他打架，使坏，逛窑子，他吃喝嫖赌、出卖朋友，沦落为丧失任何信念和理想的流氓无产者。“为个人努力的也知道怎么毁灭个人”，他真正成了“个人主义的末路鬼”。\n\n二、样子悲剧的原因\n\n（一）社会原因\n\n从社会层面来讲，祥子生不逢时。20世纪20年代后期的中国，兵燹肆虐、民不聊生、经济凋敝、国乱民穷。为了争取有限的生活资源，整个社会陷入弱肉强食的丛林法则之中。在这种情况下，一个无权无势的人，想靠自己诚实的劳动发家致富，已经变得没有可能，祥子正落在这种境遇里。\n\n（二）个人原因\n\n祥子的几番起落，与他的保守心理和所走的个人奋斗的道路是分不开的。他曾经是农民，农村分散的狭小的生产方式和生活方式已铸就了他的基本性格和思维方式。他有着个体劳动者的种种局限，他的思想较为保守。视野和思想的局限，使他只看到自己，只相信自己的力量，最终走向了悲剧。\n\n二、祥子这一形象的意义\n\n通过祥子的悲剧性命运，作者不仅将批判的锋芒指向了黑暗与腐败的社会现实，也对都市文化和人性、命运进行了多层次的省思。\n\n（一）作者通过祥子的悲剧将批判与反思的触角指向了当时中国的社会现实和奋斗中的底层人物自身的局限性。祥子买车的愿望朴素而切实，根据其自身条件和品格，实现这一愿望并不是很难的事情，但这一切近的理想却由于社会的动荡和黑暗而变得遥不可及。然而，作者在批判现实社会的动荡、窳败与黑暗的同时，也指出了祥子个人奋斗的局限性。在祥子为理想的奋斗过程中，他始终是一个孤独者，他不合群，没有任何朋友。也正因如此，老舍在小说的结尾较鲜明地批评了祥子不仅是“自私的，不幸的，社会病态里的产儿”，同时更是“个人主义的末路鬼”。\n\n（二）老舍通过样子“堕落”的叙述对都市文明病也进行了独特的批判。小说中，祥子生命的旅程，从一定程度上来说是不断走向“堕落”的过程，且这精神与肉体的双重堕落是在城市空间里发生和完成的。生命在城市畸形文明里逐渐委顿，体面的、要强的、好梦想的、健壮的、伟大的祥子变成了堕落的、自私的、无耻的游手好闲之徒。很显然这其中寄寓着作者对城市文明病的批判与反思。\n\n（三）在祥子的悲剧性生命旅程中，也寓含着作者对人性和命运的省思。“小说写祥子的一个个不幸遭遇，蕴涵着一个不断向自我的和人类的内心探究的旅程结构”。在这一心灵探寻的旅程结构中，小说为我们揭示了美与善的毁灭和人蜕变为成“兽”的悲剧。而在对祥子一再拼力活下去而不能的叙述中，作者表现出对命运的思考和探寻。祥子不断堕落的过程，在某种程度上来说也是他抗争命运而不断失败的过程。","keywords":"诚实、质朴、善良 固有缺陷 社会原因 个人原因 社会现实 底层人物局限性 都市文明病 对人性和命运省思","note":""},{"id":"110","stars":"★★★★★","title":"分析《骆驼祥子》的思想特征和艺术特色","body":"《骆驼祥子》是写城市贫民悲剧命运的代表作，在老舍全部创作中是一座高峰。这部小说的思想主题与艺术成就，主要表现在以下方面：\n\n一、思想主题\n\n通过祥子的悲剧性命运，作者不仅将批判的锋芒指向了黑暗与腐败的社会现实，也对都市文化和人性、命运进行了多层次的省思。\n\n（一）作者通过祥子的悲剧将批判与反思的触角指向了当时中国的社会现实和奋斗中的底层人物自身的局限性。祥子买车的愿望朴素而切实，根据其自身条件和品格，实现这一愿望并不是很难的事情，但这一切近的理想却由于社会的动荡和黑暗而变得遥不可及。然而，作者在批判现实社会的动荡、窳败与黑暗的同时，也指出了祥子个人奋斗的局限性。在祥子为理想的奋斗过程中，他始终是一个孤独者，他不合群，没有任何朋友。也正因如此，老舍在小说的结尾较鲜明地批评了祥子不仅是“自私的，不幸的，社会病态里的产儿”，同时更是“个人主义的末路鬼”。\n\n（二）老舍通过祥子“堕落”的叙述对都市文明病也进行了独特的批判。小说中，祥子生命的旅程，从一定程度上来说是不断走向“堕落”的过程，且这精神与肉体的双重堕落是在城市空间里发生和完成的。生命在城市畸形文明里逐渐委顿，体面的、要强的、好梦想的、健壮的、伟大的祥子变成了堕落的、自私的、无耻的游手好闲之徒。很显然这其中寄寓着作者对城市文明病的批判与反思。\n\n（三）在祥子的悲剧性生命旅程中，也寓含着作者对人性和命运的省思。“小说写祥子的一个个不幸遭遇，蕴涵着一个不断向自我的和人类的内心探究的旅程结构”。在这一心灵探寻的旅程结构中，小说为我们揭示了美与善的毁灭和人蜕变为成“兽”的悲剧。而在对祥子一再拼力活下去而不能的叙述中，作者表现出对命运的思考和探寻。祥子不断堕落的过程，在某种程度上来说也是他抗争命运而不断失败的过程。\n\n二、艺术成就\n\n（一）情节集中、紧凑\n\n《骆驼祥子》的情节集中、紧凑。作品的构思以祥子为中心，以写他拉车为主，写他租哪一个车主的车，拉过什么样的人，这样，就把其他阶层的人物和车厂、公馆、小茶馆、大杂院、白房子等各种生活场景组织成一个有机的整体。\n\n（二）人物刻画细致、深刻，重视细节和心理描写\n\n《骆驼祥子》对人物的刻画也颇为细致、深刻。作者写祥子，很重视细节描写和心理描写，例如，祥子买车的细节描写，他的积蓄被特务抢走以后以及他离开曹家去寻找小福子前后的心理变化的描写，都是很精彩的。\n\n（三）整体严峻，并融幽默于悲哀、辛酸之中\n\n在艺术风格上，作者极力避免以幽默去冲淡悲剧的严峻性，当然，《骆驼祥子》也不完全是只有严峻没有幽默，例如，对杨宅家庭生活的描写就不乏幽默；但这种幽默“是出自事实本身的可笑，而不是由文字里硬挤出来的”。而且在某些段落的幽默叙述中，仍透露着严峻。\n\n（四）语言平易活泼，极富生活气息，并有北京地方色彩\n\n《骆驼祥子》的语言，是经过提炼的口语，平易活泼，极富生活气息和北京地方色彩。作者自称是“调动口语，给平易的文字添上些亲切，新鲜，恰当，活泼的味儿”。从“五四”时期提倡文学革命以来，尽管新作家都在写语体文，但像老舍那样把口语写得这样纯粹、亲切、活泼、琅琅上口的则并不多见，在推进我国文学语言革新方面，老舍是有贡献的，他无愧于语言大师的称号。","keywords":"社会现实 底层人物局限性 都市文明病 对人性和命运省思 情节集中、紧凑 人物刻画细致、深刻 细节、心理描写 严峻 融幽默于悲哀、辛酸 平易活泼 生活气息 北京地方色彩","note":"《骆驼祥子》是老舍的代表作，也是老舍关注度最高的一部作品，以其鲜明的思想艺术特色，当之无愧地步入了现代经典作品之林，在作家作品中是常常被考查到的内容。《骆驼祥子》严谨独特的艺术结构，鲜明生动的人物形象，幽默风趣的语言艺术，京味浓郁的地方色彩，这些全面显示了老舍小说创作独特的艺术风格。除此之外，作品深邃的主题以及作者蕴含在作品中的思考，也是我们需要掌握的内容。"},{"id":"111","stars":"★★★","title":"试分析老舍《四世同堂》的思想内容","body":"《四世同堂》具有深刻的思想内涵和现实意蕴，体现出作家在面对深重的民族灾难时对于传统文化的剖析、对于民族性格潜在力量的挖掘和民族振兴之路的执著探寻。《四世同堂》的思想内容，具体表现在以下方面：\n\n一、对侵略者本质的别具一格而又颇有深度的揭露\n\n《四世同堂》的现实主义成就，引人注目地表现在它对侵略者本质的别具一格而又颇有深度的揭露上。作家是为了真切地写出北平人民的亡国之痛而去突出占领者的残暴。但他显然不是着重叙述和描绘侵略者的暴行事件：作家的触角，伸向了侵略者的神经末梢，用一种主观抒情色彩很浓的笔墨，去鞭挞那些由于疯狂、贪婪和傲慢而使自己变成了色盲的战争狂人。\n\n小说通过八年之间北平人民每日每时都经历着的、充满痛苦和屈辱的生活情景，有力地控诉了侵略战争的制造者。老舍笔下的日本侵略者的形象是精细而诡诈的，他们以为只要贿赂了北平的一两条狗，便能偷到大宅子中值钱的东西，妄图以极小的损失换取极大的收益。他们没有想到平津陷落后，中国竟开始了全面的抗战。他们一面杀人放火，一面又想用纸把血迹与火场盖上，其结果是武士变成了小丑，武士道精神变成了自欺欺人的把戏。\n\n二、《四世同堂》以现实主义的手法，反映了抗战复杂环境下的世态与人心\n\n《四世同堂》为我们讲述的是八年抗战期间，发生在北京普通市民身边的不同故事，作者将各色人等置于国族沦陷、家破人亡的大背景之下，审视他们对待抗战的不同态度和人心变动。\n\n这其中，小羊圈胡同中的大多数人都经历了从惶惑、偷生到最后觉醒、反抗的历史和心理过程。小说中，祁老人就是经历这一过程的典型形象。此外，作者还为我们塑造了在民族大义面前，能够坚持民族气节、懂得民族大事上的是与非、逐渐觉醒起来的人物群像。与这些能够坚守民族大义的市民相对照，作者也为我们呈现了复杂背景下所孕育和产生的民族败类一一汉奸形象。冠晓荷、祁瑞丰就是其中的代表。通过对这些不同人物群像的塑造，《四世同堂》反映了抗战复杂环境下的世态与人心。\n\n三、《四世同堂》以冷静的笔触，对中国传统文化中的国民劣根性进行了批判性的反思\n\n《四世同堂》的创作背景是抗战相持阶段，正当国家、民族面临生死存亡的严峻关头，“救亡图存”成为时代的主旋律，时代呼唤民族的觉醒和奋起。而人们也在老舍的解剖镜下剥离种种华丽的外壳，暴露性格中的弱点和不足。老舍把造成国人性格懦弱、敷衍、苟且偷安的思想根源指向以家族文化为基础的传统的北平文化，而北平文化又是作为中国传统文化的缩影。\n\n小说在抗战大的时代背景下，对中国传统文化中的国民劣根性进行了批判性的反思。","keywords":"揭露侵略者本质 复杂环境下的世态与人心 审视北京市民文化","note":"《四世同堂》是老舍规模最大、写作时间最长的作品，也是抗战文学乃至中国现代文学的丰碑，一座民族主义文学的丰碑，是唯一正面描写抗战时期普通民众生活的长篇抗战小说，还是老舍生前自认最好最满意的作品。作品在揭露了侵略者的本质的基础上，进一步审视了北京市民文化，既鞭挞了国民性的弱点，又挖掘出了民众内心深处的坚韧与不屈，对此我们要有所掌握。"},{"id":"112","stars":"★★★★","title":"试分析老舍《四世同堂》的主要艺术特色及其文学成就（25北京师范大学）","body":"《四世同堂》是老舍现实主义艺术进一步成熟的一部史诗般的重要作品，三部曲组成的壮阔史诗有着丰富的内涵。战争时的众生面貌、沦亡中的北平古都，-得以在这部作品中鲜活地重现。这部作品的艺术成就，主要表现在以下方面：\n\n一、优秀的人物塑造艺术\n\n（一）塑造了几个人物形象系列，丰富了我国现代人物形象画廊\n\n《四世同堂》塑造了几个系列-每个系列又有众多的人物群像，尤其难能可贵的是，那几十个三教九流的人物形象，不只是使人感到应接不暇，而且其中的大多数形象能以各自的典型意义，以自己的社会内容和美学价值，为我国现代文学人物形象画廊增添了光彩。\n\n以祁家这个“四世同堂”的家族来说：祁老者是一个从封建礼教堡垒的维护者，到民族尊严的捍卫人的典型形象；诚实正派的布店掌柜祁天佑的典型意义在于揭示了亡国就是北平市民最大的罪；中学教员祁瑞宣在刻骨的亡国之痛中，经过惶惑、偷生，终于找到了自己在民族革命战争中的地位；祁瑞全则是个摆脱了一切传统和世路的羁绊走新路的觉醒的青年。一部小说容纳了如此众多的人物形象，其中的多数又都是生活里的人，是活生生的人，这不仅是老舍个人创作的一个重大突破，而且也是现代文学发展到四十年代的一个重要收获。\n\n（二）同一类型人物既有个性又有共性\n\n《四世同堂》在同一类型人物中创造了互不重复、鲜明逼真、性格各异的人物形象，并使其中的大部分人既有个性又有共性。老舍把读者直接带进小羊圈胡同的大杂院，或大赤包的客厅，给你展示三教九流的人物。那些人物并不一定是主次关系，更多的倒是平行的；人物命运似无关连，实则密切相关。这么多平行的人物，没有一个成为附庸。老舍不但能从小说主题思想的提炼和情节结构安排的全局着眼，统筹兼顾，精心安排，而且，努力使小说中的正面人物不概念化，反面人物不脸谱化，占篇幅少的人物不影子化。\n\n二、辛辣俏皮的幽默\n\n幽默是老舍语言的一贯风格。《四世同堂》的语言也是幽默的，但并不是他早期如《老张的哲学》和《赵子曰》那种令人捧腹的笑骂式的幽默，也不是他后期如《龙须沟》和《茶馆》那种隽永、机智、艺术的幽默，而是辛辣俏皮的幽默。这是由小说的内容和作者的艺术功力决定的。这种幽默往往和讽刺结合在一起，喷射出作者的烈焰，火辣辣的，如匕首，似投枪，直刺日寇、汉奸。这种幽默，又是经过艺术加工的，时时闪射着智慧的光芒，巧妙地揭露了生活中违反情理的乖谬。\n\n《四世同堂》的幽默语言也是干姿百态、多种多样的。既通过正话反说，褒词贬用，用讥诮的反语讽刺日寇的丑恶，又通过词语变异的手段，讽刺汉奸的卑劣，在这之中，还掺杂着词语活用的手段、诙谐的警句和夸张的手法......凡此种种，共同构成了《四世同堂》独特的辛辣俏皮的幽默。\n\n三、地道的“京味”\n\n在《四世同堂》中，老舍再一次回到了自己熟悉的北平市民社会。小说中十七八户人家134人，含纳了车夫、教师、和尚、传教士等北京市民社会中的三教九流、各色人等。而且小说在展示上述人物的行动轨迹和日常生活时，也将北平建筑街巷和风土人情融入其中，构成了一幅具有浓郁北平地域色彩的风俗画。\n\n同时，在语言上，老舍善用地道的北京口语。这主要表现在人物的语言上，如尤桐芳向高弟推心置腹的一段剖白，全是口语，没有刻意雕琢的书面语言，而且北京味儿十足，给人以形象、生动、新鲜的强烈感受，表现力也很强，实地写出了旧社会北平的鼓书女艺人内心的辛酸苦痛和善良眞诚的秉性。\n\n四、具有史诗品格\n\n《四世同堂》以祁、钱两家为中心，描写抗战八年沦陷区北平人民的生活状况与思想面貌，作品真实地展现了在日本侵略者铁蹄下北平人民的灾难和他们可贵的民族气节。作家的笔几乎触及了抗战的全过程。\n\n就时间跨度而言，从卢沟桥事变日帝侵华，到侵略者无条件投降，它都有直接或间接的反映；就空间范围来说，它可以说是一幅沦陷了的北平社会的全景图，其笔触遍布北平各处，从胡同杂院到日伪机关、大使馆，小说全景式、多线索的广阔场景，突破老舍以往作品中的单一主线格局，于深广度及气势表现出史诗般的气魄。像《四世同堂》这样以古都北平广大市民的亡国之痛为题材，饱含怒、愤、傲、烈之情抒写而成的被征服者的愤史，在我国现代文学作品中，可说是第一部。","keywords":"人物塑造 人物形象系列 既有个性又有共性 辛辣俏皮的幽默 地道的“京味”史诗品格","note":"《四世同堂》是老舍现实主义创作艺术成熟后的一部力作，可以说是老舍在《骆驼祥子》之外最重要的一部小说，故此大家要重视起来。在这部小说中，可以看到老舍一贯的创作特征，如幽默与“京味”；与此同时，也可以看到老舍创作技艺进一步的发展，如史诗般的气魄和对人物群像的塑造。相关论文可以参考吴小美《一部优秀的现实主义作品-评老舍的（四世同堂）》、宁义辉《《四世同堂）的语言特色》，具体资料可以在李凡文学正版群中领取。"},{"id":"113","stars":"★★★★","title":"试分析老舍的悲剧意识","body":"老舍的悲剧审美意识主要体现为感知社会人生，感知传统文化的负面对于现代文明的阻拒，探究人的价值的毁灭以及民族生存困境缘由，是一种既具个体色彩更具群体乃至时代色彩的悲剧情思。浓厚的文化悲剧意识和生命悲剧意识，构成了老舍悲剧意识的精魂。\n\n一、老舍悲剧意识的生成\n\n（一）老舍在大杂院里度过艰难的幼年和少年时代。大杂院的日常生活，也使他从小就熟悉车夫手工业工人、小商贩、下等艺人、娼妓等挣扎在社会底层的城市贫民，深知他们的喜怒哀乐。综观老舍的早年生活，他的经历多坎坷、辛酸，凄苦是他的朋友，优伤与他常在。生活的艰辛更使他深深体味到生命之悲。由此，老舍个人及周围人的苦痛的生存状态不可避免地在老舍的审美观中打上“悲”的烙印，而个人生活境遇中经历的困窘则是老舍悲剧意识形成的重要因素之一。\n\n（二）真正美学意义上的悲剧，总是与历史时代紧密联系在一起。老舍的悲剧意识更来自于对20世纪前半叶黑暗中国的深刻体察和认知：当时中华民族屡遭外侵，政府黑暗腐败，人民穷困潦倒，种种悲惨景象不能不使老舍这个爱国青年不断探索救国救民之路。老舍对社会人生充满了热切关怀，自觉调整了文艺观念，将创作视为“时代的产儿”，把城市底层暗无天日的生活引进现代文学的艺术世界，写就了一部又一部日常生活中司空见惯的活生生的悲剧。\n\n二、老舍悲剧意识的表现\n\n（一）生命悲剧：生命抗争者的悲剧呼唤\n\n在老舍的小说世界里，不难发现一种经常出现的死亡模式-自杀。作为一种极富历史内涵和人格魅力的精神现象，老舍笔下人物的自杀或殉难，具有鲜明的老舍个人的生死观念，即个人的荣辱生死，与国家、民族的荣辱兴衰紧密相依，血肉相连。它是作家忠贞爱国、洁身自好、宁折不弯、崇高壮美的伟大人格的写真。正是这种壮烈激昂而毅然决然慷慨赴死的气节与风骨，给老舍笔下的人物形象赋予了一种悲郁苍凉、慷慨悲歌的壮烈色彩，其本质则是对于无出路的环境的超越，是另一种生命价值的实现。因而“自杀”具有了形而上的更高层次的意义，也因此表现出崇高的悲剧美。\n\n（二）文化悲剧：构建新文化的清醒意识\n\n老舍在为我们展示以悲剧为底色的风俗画卷中，常常在种种矛盾对立中，既表现个体苦苦挣扎的无望，更表现出民族固守传统的同时又失守传统的悲哀。老舍抒写的，往往不是单纯的苦难生活的悲剧，更多的是精神悲剧，包括个体的精神毁灭和民族的精神沦丧。因此，老舍将浓厚的悲剧意识贯注笔端，集中笔力抒写传统道德的失落，表现民族精神的幻灭。他的基本着眼点是文化道德，从传统道德文化的角度析滤复杂的社会，从而对人物作出文化的和道德的评判，总是清醒地执著于挖掘个体人生悲剧的复杂根源，将小人物的悲剧提升到社会文化的高度进行严肃的审问。在他的笔下，人的命运与文化的命运纠缠在一起，灵魂的灭亡与文化的灭亡相伴相随。","keywords":"生存状态 个人境遇 对黑暗中国的体察和认知 生命悲剧 文化悲剧","note":"在现代文学史上，不少作家面对黑暗的现实，无可奈何地流露出悲剧意识，只不过由于各个作家关注和表现的内容各有不同，这些悲剧意识也表现出了不同的特征。而分析老舍的悲剧意识，则要联系老舍的思想与经历，包括其对现代文明的忧虑，对传统文化的接受以及对下层市民的关注，这些都影响了老舍悲剧意识的生成。相关内容可以参考马晖《生命悲剧意识和文化悲剧意识的交织-老舍悲剧意识的精魂》，具体资料可以在李凡文学正版群中领取。"},{"id":"114","stars":"★★★★","title":"巴金前期小说创作有什么特点","body":"一、题材上多为描写青年反抗者、革命者\n\n巴金前期小说创作非常丰富，题材也比较广泛，有写工人、农民、城市贫民悲苦生活与抗争的，但更多更集中的是那些描写青年反抗者、革命者的作品。巴金前期小说又大体上分为两类：一类是正面描写青年、革命者所从事的社会斗争的，如长篇《灭亡》《新生》和《爱情三部曲》等；另一类是揭示封建旧家庭残害青年的罪恶及其走向崩溃的命运的，以《激流三部曲》中的《家》为其代表。\n\n巴金以一种充满浪漫激情甚至有点浮夸的笔调来写他的青年革命者，不加节制地将自己的观念、情感和心理体验灌注到这些人物身上。如在《灭亡》中，巴金赞美而又惋惜殉道者杜大心。1931年之后数年间，巴金进入了创作高峰期。他把写作当成一种宣泄痛苦的方式，以求从信仰失落的困境中超拔出来，《爱情三部曲》便是其中的主要产品。巴金在《爱情三部曲》中写到了各种不同类型的青年，使当时的青年读者从中读出他们同一代人的种种心境，思考不同的生活道路。\n\n二、注重展示二三十年代青年复杂变幻的思想情绪\n\n20年代末30年代初，文坛上“革命文学”刚刚勃兴，正经历着一个不成熟的阶段，许多作品都脱不了“革命＋恋爱”的幼稚的公式。受这种时尚的影响，巴金的这类题材也多以革命和恋爱为题材，但相比之下，巴金不像一股作者那样满足于凭某种概念构思披着革命外衣的浪漫故事，而比较注重展示二三十年代青年复杂变幻的思想情绪，充满了渴望变革的亢奋焦灼的激情。虽然所构思的故事不那么实在，有模仿外国革命党人传奇的痕迹，但其如火一般的艺术情境很容易为当时的进步青年引为同调，给他们激励的力量。\n\n三、充满青春激情\n\n在风格和感情基调上，巴金的前期创作充满青春激情。巴金前期的小说是一曲曲激魂荡魄的青春乐章，充满了激情，洋溢着叛逆和躁动情绪，单纯，热情，坦率，酣畅，感情真挚、热烈，直抒胸臆，一泻无余，具有强烈的主观抒情色彩，赞颂青春的美丽和成长，诅咒那些摧残生命的势力，蔑视一切权威和约束，热切表达了作家对不合理的社会的恨和对理想的追求，充满了青春的力量和青春的气息。","keywords":"青年反抗者 复杂变幻的思想情绪 革命和恋爱 青春激情","note":"巴金早期小说创作被称为“青春的赞歌”，着重于表现当时青年的心境，塑造了很多经典的青年形象，其目的主要是揭露批判封建主义和表现青年的斗争，大家可以从这一点去切入理解记忆。巴金相关的名词解释，除了对单独的作品如《寒夜》《家》出题之外，像是“青春三部曲”“爱情三部曲”这些也会在考查中出现，大家要注意掌握。"},{"id":"115","stars":"★★★","title":"分析《家》的主题","body":"《家》以爱情故事为情节发展的主干，写了觉慧与鸣凤，觉新与钱梅芬、李瑞珏，觉民与琴等几对青年爱情上的不同遭遇，以及他们所选择的不同人生道路。小说聚焦于“家”，在最能触动年轻人敏感神经的爱情、自由、出路等“穴位”上做文章，满足了1930年代不满现实与渴望变革的社会心理需求，产生了巨大的精神效应。《家》在三四十年代之所以能产生积极而巨大的影响，与它的批判性的激进的主题是分不开的。作品主题包含以下几个方面：\n\n一、展现封建大家庭由盛而衰的历史过程\n\n《家》以“五四”运动高潮后二十年代初期的四川成都为背景，展现了一个封建大家庭由盛而衰的过程。作品中的高家是中国封建社会和家族制度的缩影。从表面看，高家“一家人读书知礼”，家庭内部尊卑有序，礼法森严；但实际上，在这个大家族中处处都充满着激烈的尔虞我诈和勾心斗角。除此而外，这个封建大家庭挥霍奢侈的寄生生活，还造就了一代整日只会挥霍无度，过着穷奢极欲糜烂生活的“败家子”，这在高家“克”字辈人物身上显得尤为突出。\n\n二、描绘封建大家庭下女子的悲哀，揭露封建社会吃人的社会本质\n\n作品在揭露这个封建家庭罪恶的同时，还侧重表现了封建制度、封建礼教对青年一代的摧残和迫害。觉新和梅本是青梅竹马、真诚相爱的一对恋人，只是因为双方母亲在牌桌上有了磨擦，就儿戏般地拆散了这对情侣，使梅在痛苦的折磨中悲哀寂寞地离开了人间、瑞珏是在陈姨太之流闹“血光之灾”的邪说中丧命的，她和梅一样，也是封建礼教的牺牲品。此外还有丫头鸣凤、婉儿等。鸣凤只有17岁，就被高老太爷当做一件礼物送给了年已花甲的老恶棍冯乐山做小，这位少女只得投湖自尽。然而，丫头婉儿又很快被高家用来替代鸣凤，继续着人生的悲剧。作品通过对这几位女性悲剧遭际的描写，进一步控诉了封建礼教以及封建道德对弱小、无辜、善良的人们的迫害，强化了全书主旨。\n\n三、展现新旧社会模式的对立，赞颂年轻一代民主主义的觉醒及其反封建斗争\n\n《家》中所呈现的传统文化主要包括对封建礼教制度的维护、对家族家长权威的体现、对享乐主义的宣泄等。而现代文化则是对自由恋爱的追求与向往、国家内忧外患的爱国情怀、对旧道德观和家族的反抗。新旧文化的冲突，主要集中体现在高家父辈一代和年轻一代身上。这一矛盾以觉慧出走为结局，这也象征着新青年逐渐摆脱了封建思想的枷锁，新思想在人民心中不断传播，社会不断进步，人民向着自由迈进。","keywords":"由盛而衰 吃人本质 女子悲哀 新旧对立 年轻一代民主主义的觉醒","note":"巴金的小说《家》以“家”作为封建专制王国的缩影，无情地暴露了封建大家庭的罪恶和腐朽，表现了封建大家庭中道德沦丧、勾心斗角、争权夺利、奢侈堕落等丑陋现象，有力地控诉了封建专制制度对年轻人的压制和摧残，同时热情地描写了封建家庭中年轻一代的觉醒和反抗，歌颂了他们向封建家庭及封建制度做斗争的叛逆精神。作品通过上述描写，从根本上揭示了封建家庭、封建制度必然走向崩溃的历史发展趋势。回答时，我们可以从新旧两代人以及斗争结果几方面来考虑。"},{"id":"116","stars":"★★★","title":"《家》中觉慧是怎样一个形象","body":"巴金在觉慧身上寄托着对青春的赞美和生活的信念，他是《家》的主角，是最能打动青年的心的形象。总的说来，觉慧是“一个幼稚而大胆的叛徒”，这主要表现为两个层次：\n\n一、“五四”思潮冲击下反抗、叛逆的激进青年\n\n觉慧是高公馆中最早于“五四”思潮冲击下的觉醒者，他清醒认识到高家这一封建旧式家庭是一个“狭小的笼”，“是埋葬青年理想和幸福的坟墓”，下决心不去做高老太爷们所期望的“绅士”，也不愿像大哥觉新那样忍受下去，他要做“自己的主人”。他敢于对抗高老太爷的旨意，以极大的热情投入社会革命活动，编进步刊物，撰写讨伐封建主义的檄文；他蔑视封建等级制度和旧礼教，支持和帮助觉民逃婚，大胆向婢女鸣凤表示纯洁的爱情；他不怕冒犯尊长，公然揭穿他们“捉鬼”行孝的丑剧；最后，他又毅然地从这罪恶的家庭出走。小说突出了觉慧热情、叛逆和追求的精神，这正是“五四”时期受新思潮冲击的激进青年的特征，也是觉慧这个形象所以能给人巨大鼓舞的主要原因。\n\n二、带有封建思想的痕迹，具有历史局限性\n\n觉慧虽大胆但毕竟还是幼稚单纯的“叛徒”，既有热情、叛逆、追求的“五四”精神，又有“五四”青年难免的偏激的弱点。他从封建中蜕化而出，不免仍旧带有封建思想影响的痕迹。小说并不回避他的缺点，在部分章节中细致刻画出其思想的复杂性。如他与鸣凤的恋爱，是真诚的，但他潜意识中仍旧未能脱离少爷与丫头身份上的藩篱，抱怨她只是一个丫头，但当得知鸣凤要被送给冯乐山做小老婆后，决定放弃鸣凤，反映出觉慧思想和行为上的矛盾性及软弱性。这个形象深刻地反映出“五四”新思潮所唤醒的年轻一代青年的历史性特点。\n\n总之，觉慧被视为高家的第一个掘墓人，是高公馆内部涌动的原动力，乃至在《春》《秋》中仍对高家产生深远影响。此形象亦传达出一个观念：只有革命才是唯一出路，而个性解放只是第一步。正因其所反映出特定时代的人物典型，引起读者极大共鸣，产生了巨大鼓舞作用，觉慧民主、平等、自由的思想观念和“五四”时期的彻底的反封建的精神面貌，表现了“五四”新思潮的威力和新一代民主青年的成长。作者通过他的思想发展过程，展示了近百年来中国先进知识分子所共同经历的思想历程。\n\n【李凡关键词：幼稚而大胆的叛徒 两个层次 叛逆激进 历史局限性】","keywords":"","note":"作为《家》中的主角，觉慧的人物形象是常常被考查到的内容。这一形象有巴金的影子，表现出了“五四”影响下年轻一代的历史性特点，显示出了进步思想与封建思想两方面的痕迹，十分具有代表性，大家可以结合作品具体内容仔细分析。"},{"id":"117","stars":"★★★","title":"《家》中觉新是怎样一个形象","body":"觉新是一个能清醒认识到自己的悲剧命运却又怯于行动的“多余的人”，他的一只脚已经迈入了新时代的潮流之中，但是由于自己懦弱的性格以及在家庭结构中独特的位置，他的另一脚却依然滞留在旧门槛之内，自觉不自觉地维护着旧封建家庭的统治。他是封建家庭和旧礼教毒害下人格分裂的悲剧典型。\n\n一、觉新的性格，主要表现出如下特征：\n\n（一）封建礼教侵蚀下委曲求全、懦弱顺从的性格\n\n觉新既是封建制度的继承者，同时又是封建制度的受害者。觉新作为封建大家庭的长房长孙，担负着兴旺家族的责任，封建教育及封建礼教教导的道义责任要求并强迫他必须维护行将崩溃的家族。同时他在感情上、行动上又的确留恋旧家庭。为缓和家庭冲突及崩溃命运，他不得不在专制和压迫面前妥协屈从，每一次向恶势力退让都以牺牲别人为代价。故而他一面维护封建制度，一面为之付出惨痛代价。其悲剧命运一定程度上说明了在封建制度中“作揖主义”和“不抵抗主义”行不通。\n\n（二）“五四”熏陶下的忏悔与自责\n\n在“五四”新文学及各种新思潮冲击下，觉新清楚地意识到旧家庭和旧礼教扼杀青春的罪恶和封建家庭必然崩溃的命运。然而他又是封建制度的产物，深受封建主义伦理道德特别是所谓“孝”的毒害，以及受长房长孙特殊身份的约束，他的生命活力和棱角被消磨殆尽。这种理智与感情的背反、思想与行动的分离，给他造成了极大的痛苦，使他常常陷于深深的自我谴贵与忏悔之中。这在一定程度上写出了思想新旧参半的知识分子的心境，即明白自身悲剧命运却抱有一丝幻想，希望其来得慢一些，于悲凉中更含绝望乃至崩溃的心态。\n\n二、觉新这一形象的意义\n\n觉新这一形象较为真实地反映了在现代中国和社会文化转型期，那些既受到新思想影响，对封建家庭专制的罪恶有较清醒的认识，但又无力抗拒，只能顺从苟安的人的复杂存在状态。觉新的悲剧说明对于封建恶势力只能奋起抗争，争得人格的自由和独立，争得爱情的幸福，妥协和退让是没有出路的。存在于觉新身上的那种软弱动摇的性格完全是封建专制主义和封建家族制度造成的，他的悲剧集中反映了这种制度对健康人性的戕害。如果说觉慧是引导青年“应当这样走”的形象，觉新就是“不该那么做”的典型。作者有意将觉慧与觉新两种不同的思想性格和人生道路做鲜明对照，从而更完满地表达了《家》的思想主题。\n\n总之，觉新的悲剧既是性格的悲剧，更是社会的悲剧，是封建末世一部分知识分子的普遍悲剧，概括了封建末世整整一代知识分子的生活命运，具有悲剧的深刻性和典型性，因而作者对觉新的描写既充满同情又不无批判。\n\n【李凡关键词：人格分裂 委曲求全 继承者 受害者 忏悔与自贵 社会的悲剧】","keywords":"","note":"觉新是《家》中塑造的一个非常经典的形象，是封建末世一部分知识分子的悲剧，是封建制度的继承者，同时是封建制度的受害者，他的存在，让《家》的主题表达更加完整，值得我们去仔细分析。在这里，我们要注意到这一人物形象的双重性格，同时也要注意到这一形象的内涵，即表现觉新这类“多余人”的生存状态和控诉腐朽的社会、家庭。相关内容可以参考何辉兰《浅析巴金＜家＞中高觉新的形象》，具体资料可在李凡文学正版群中领取。"},{"id":"118","stars":"★★★★★","title":"《家》的艺术表现手法上有什么特点","body":"从艺术手法上看，《家》不如后期作品圆熟，但它的可读性很强，情节生动感人，属“青春型”创作。它的艺术表现手法，主要有以下特点：\n\n一、表现强烈的现实批判精神\n\n《家》通过描写高家这一封建家庭的崩溃过程，尤其是钱梅芬、鸣凤等年轻的生命被无辜摧残，深刻揭示了封建旧礼教“吃人”的本质。再者，文中对冯乐山、高克定等人荒淫无耻生活的描写，既表达了作者对封建专制制度的愤恨，也揭露出封建旧家庭乃至封建专制制度必然灭亡的历史命运。同时，小说通过批判觉新的“作揖主义”和“无抵抗主义”，歌颂以觉慧为代表的青年一代勇于反抗的精神，展示了新生革命力量的成长过程。\n\n二、塑造独具特色的人物形象\n\n《家》中着重塑造了高老太爷、觉新、觉慧三个典型形象，表现出各种思想影响下不同的人物，显示出人物的复杂性。如觉慧是高公馆中最早于“五四”思潮冲击下的觉醒者，他敢于对抗高老太爷的旨意，以极大的热情投入社会革命活动，编进步刊物，撰写讨伐封建主义的檄文；他蔑视封建等级制度和旧礼教，支持和帮助觉民逃婚，大胆向婢女鸣凤表示纯洁的爱情；他不怕冒犯尊长，公然揭穿他们“捉鬼”行孝的丑剧；最后，他又毅然地从这罪恶的家庭出走。此外也有不少生动而富于特征的人物，如腐化堕落的高克定，敢于以死表示反抗的鸣风，此类形象亦具一定审美价值。\n\n三、主线突出的结构安排\n\n《家》在结构艺术上借鉴《红楼梦》的写法，以觉慧和鸣凤的恋爱以及觉新与瑞珏、梅芬之间的纠葛作为情节发展主线，全面交织，从而展示了高公馆的衰亡过程。全书人物众多，事件繁复，但始终围绕基本线索展开描写，有条不紊，紧凑周密，波澜起伏，跌宕有致，显示了作者精于构思的能力。作品围绕主题思想，采用单纯明快地讲故事的结构方式，以事件为线索，以场面串连故事，巧妙地把高家内外的各种人物、各种矛盾纠葛，同祖孙两代矛盾冲突这条主线交织成一体，并有条不紊地分别展开。\n\n四、生动细腻的心理刻画\n\n《家》中塑造的人物，都各有其独特的思想性格特征。巴金重视对人物内心世界的刻画，善于抓住人物斯时斯地复杂的心境来写，给读者留下深刻的印象，如鸣凤投湖前的痛苦、悲愤的内心独白，梅芬与瑞珏谈心时彼此灵魂的剥露，觉新婚后遇见梅芬时的无限追悔与怜爱。此外，作者在对这些人物的心理进行剖析时，采用了对比、烘托等多种手法，将同一人物不同时间、同一时间不同人物的心理相互比较，突出了人物心理和形象的复杂性。\n\n五、浓厚的主观情感色彩\n\n（一）《家》是一部具有浓厚的主观情感色彩的现实主义作品。作者极端憎恨旧制度旧家庭，热情歌颂敢于反抗旧势力的新生力量，强烈的爱憎感情渗透于《家》中，使《家》具有很浓的抒情色彩。它再现了“五四”时期四川这一封建势力浓重但五四时代浪潮已冲击而来的典型环境，塑造了高老太爷、觉新等典型环境中的典型性格，作品中的祖孙的矛盾冲突也正是当时典型的社会矛盾冲突，许多生活细节也具有现实主义的真实性。\n\n（二）《家》基本上仍然属于“青春型”的创作，是由真诚热烈的心唱出的青春之歌，带有强烈的主观性、抒情性，特别能唤起青年人共鸣。《家》很能代表巴金前期创作的风格：只求与青年读者情绪沟通，不求深刻隽永，倾向单纯、热情、坦率，以情动人，情感汪洋恣肆，语言流水行云，虽然有时少锤炼，不耐咀嚼，整体上却有一种冲击力，能渗透读者的内心。这种风格与巴金激情化的写作状态有关。巴金写作时通常是非常冲动，全副身心投入，忘情地参与他所构设的文学世界，他的作品总是能煽起大悲大喜的恣肆的感情。\n\n六、抒情语言流畅自然\n\n在创作这部作品时，巴金努力倾诉其内心的爱和恨，常用热情洋溢、诗一样的笔调，对其所赞美的人物倾注了热情，对其所抨击的人物融入了憎恶的情绪，并常常通过人物甚至作家自己作激情洋溢的抒情，使作品的语言充满了抒情色彩。小说中所运用的词汇是非常丰富多样的，各种运动词汇、新生词汇、代表封建等级的词汇彰显出鲜明的时代色彩；日常生活词汇和方言的使用又体现出典型的地域色彩与口语色彩；同时比喻、排比等修辞手法的巧妙运用更是使其语言显得生动形象，具有形象美与音乐美的艺术魅力。","keywords":"现实批判 人物形象 主线突出 心理刻画 主观情感色彩 抒情 青春型 语言流畅","note":"《家》的艺术表现手法很能代表巴金前期的创作风格，就像《寒夜》可以代表巴金后期创作特征一样。对《家》和《寒夜》这两部作品创作特征的分析，有助于我们去理解巴金前后期创作的风格以及其差异。同时，作为巴金最具有代表性的一部作品，《家》在文学史上的地位很高，往往也会单独出题，故此大家要重点关注这部作品。"},{"id":"119","stars":"★★★★","title":"巴金后期创作风格是怎样的","body":"一、现实主义笔触更加细腻\n\n巴金后期的创作风格变了，他开始写没有英雄色彩的小人小事，写社会重压下人们司空见惯的“委顿生命”，写“血和痰”，调子也变得悲哀、优郁，由热情奔放的抒情咏叹，转向深刻冷静的人生世相揭示。他这时期的翻译也由俄国虚无主义者的英雄故事转向斯托姆的爱情小说与王尔德的童话。巴金风格的衍变固然跟当时令人窒息的现实社会气氛和作者在战时生活中所经历的磨难有关，更是由于作者摆脱青春时期的浪漫而趋向中年人的沉稳\n\n巴金后期创作虽仍采用家庭生活题材，但不再写轰轰烈烈的大家庭的重大变故，而反映小人物的悲欢离合，但折射出的是一个令人窒息的社会。《寒夜》中汪家的悲剧不是简单的家庭或爱情悲剧，而是时代和社会的悲剧在一个家庭的集中表现。汪家比《家》里面的高家更普遍更有代表性，其悲剧感染力也更大。\n\n二、塑造英雄形象的热情逐渐转向塑造平凡的小人物\n\n巴金后期的小说创作，从题材上分为两大类：一类是继续顺着《家》的路子写旧家庭没落的；另一类是反映抗战时期现实生活的。英雄是早期小说中作者理想的艺术形象。他们热情、勇敢、富有反抗精神，比如《家》中的觉慧。但巴金笔下的小人物正与之相反，他们平庸、懦弱，但心灵中也有美好的成分，性格是复杂的，比如《寒夜》中的汪文宣。\n\n三、注重深入挖掘人的内心世界\n\n《寒夜》以人物的感情、心理变化为情节线索，注重深入挖掘人物的内心世界，展示人物的感情起伏。就人物内心的复杂性而言，汪文宣甚于觉新，曾树生又是巴金笔下女性中内涵最丰富、感情最复杂的一个。\n\n四、深沉的批判和冷静的剖析\n\n巴金不再是一味正面抨击封建阶级的角色，他意识到人性与人世变迁的复杂性。在现实批评的同时，他又夹带着对人性弱点的理解与同情。如《憩园》的主角杨老三使人厌恶，同时也容易让人产生怜悯，这跟作品着力表现他怀旧与追悔的情绪有关。这种描写有其真实性，客观上也是对封建“长宜子孙”观点的批判。作者立意把这样一个已经彻底堕落的浪子当成一个悲剧形象处理，笔墨处处透露着悲天悯人的感情。","keywords":"现实主义 平凡小人物 人的内心世界 深沉的批判","note":"巴金后期的创作风格和前期有很大的不同，这与巴金逐渐成熟，对社会和人性的思考更加深入有关，考查时会让大家将巴金前后两种创作风格进行对比。现当代文学史上，像巴金这样前后创作风格发生明显转变的作家也很多，比如戴望舒、余华等，有些学校可能会将类似的作家组成一个系列出题，大家要注意一下。"},{"id":"120","stars":"★★★","title":"《憩园》的思想内容有什么特点","body":"《憩园》写的是一个封建大家庭崩溃后，那些纨绔子弟的结局。小说通过一位作家重归故土，寄居憩园时的所见、所闻、所感，展示了一所大公馆新旧两代主人共同的悲剧命运。所以其在主题与《激流三部曲》仍有连续性，即揭露封建地主阶级的寄生生活对人的腐蚀，批判福荫后代、长宜子孙的封建思想。既有批判性，又充溢着人道主义的温情，作家所寄植于作品中的感情是复杂的，主要表现为以下方面：\n\n一、集中揭示封建阶级本身所经历的人格的堕落及人性的扭曲的过程\n\n如果说《激流三部曲》在反映青年反抗的同时，着重揭露的是封建制度对年轻一代青春、爱情和身心的残害，《憩园》则集中揭示封建阶级本身所经历的人格的堕落及人性的扭曲过程。姚家虽然是“新式”家庭，但那种腐朽的寄生生活以及长宜子孙的封建意识，和“憩园”旧主人是没有什么两样的。作者把姚家小虎作为杨老三的对应人物来写，让读者思考他们的共同命运和造成这种命运的罪恶根源。因此，《憩园》的构思是企图更全面地揭示封建制度及其伦理观念的罪恶本质，补充并拓展《激流三部曲》（特别是《秋》）原有的主题。从《家》到《憩园》，可以看到本世纪以来中国旧家庭变迁的较为完整的图景。\n\n二、夹带着对人性弱点的理解与同情\n\n在《憩园》中，巴金不再是一味正面抨击封建阶级的角色，他意识到人性与人世变迁的复杂性。在现实批评的同时，他又夹带着对人性弱点的理解与同情，这使得《憩园》形象也比较复杂。如主角杨老三使人厌恶，同时也容易让人产生怜悯，这跟作品着力表现他怀旧与追悔的情绪有关。这种描写有其真实性，客观上也是对封建长宜子孙观点的批判。作者立意把这样一个已经彻底堕落的浪子当成一个悲剧形象处理，笔墨处处透露着悲天悯人的感情。《憩园》不再像巴金早期作品那样地鲜明痛快，但是有一种悲凉的挽歌的调子，有一种追怀旧梦的遥深感慨。","keywords":"人格的堕落 批判封建制度 人道主义 理解与同情","note":"《憩园》预示着巴金创作的思想主题开始了转变和深化，其思想内容与《激流三部曲》一脉相承，又有所发展，其中体现的是巴金对人性、对社会更加深入的思考，而这种思索到《寒夜》最终走向了成熟，对此大家要有所掌握。"},{"id":"121","stars":"★★★★","title":"《憩园》的艺术手法有什么特点","body":"一、有浓厚抒情气氛又带象征意味的结构形式\n\n《憩园》在艺术上很有特色。作者大胆吸收了外国文学的某些构思手法（受契诃夫《樱桃园》及《未婚夫》影响很明显），又借鉴了我国古典文学（特别是古典诗词艺术）构设意境的美学追求，形成了有浓厚抒情气氛又带象征意味的结构形式。\n\n二、诗化的语言风格\n\n《憩园》新旧两代主人和他们家庭的遭遇变迁颇带传奇色彩，故事曲折有致，引人入胜，却采用哀怨婉约的文字和舒缓自如的笔调，别有一种诗的韵味。\n\n三、独特的叙述角度\n\n《憩园》由几个人物追述的历史片断组接而成，每种追述都有各自的道德评判，彼此斑驳井呈，形成复调的关系。作品描写了封建大家庭衰败之后的情形。以一个花园为中介，将姚、杨两个家庭的变迁联系起来进行叙述，一个家的悲剧刚刚结束，另一个家的悲剧又开始了。交叉在对杨家历史的叙述的过程中，融入了对憩园现在主人姚国栋一家的描写。\n\n而故事的总叙述者“我”是客居杨家的局外人，一方面，叙述者“我”走入了文本的艺术世界，成为了其中一员，另一方面，“我”也在“被叙述”着。这样叙事者与艺术世界之间距离改变了，从高高在上到深入其中，这就大大增强了小说的“真实性”。同时，“我”之于姚杨两家只是一个局外人，“我”对两家的遭遇有强烈的同情，同时又有急欲“逃离”的情绪，“我”身在故事中却又不一味沉浸于故事，而是“取一种‘感情间隔”的思考”，这就强化了小说的悲剧主题与沧桑之感。\n\n四、人道主义色彩\n\n就主题而言，作品揭露了封建地主阶级的寄生生活对人的腐蚀，批判福荫后代、长宜子孙的思想，揭示封建阶级人格堕落及人性扭曲的过程。于批判中不乏同情，显示出对人性弱点的理解，具有一定的人道主义色彩，也较为完整地展示了中国旧家庭变迁的图景。\n\n总之，《憩园》标志巴金以往那种“青春型”的热情倾泻的创作风格开始朝较为深蕴细腻的方向，到《寒夜》这种风格达到圆熟的艺术境界。","keywords":"抒情气氛 象征意味 诗的韵味 复调的关系 沧桑感 人道主义色彩","note":"从《家》到《寒夜》，巴金的创作发生了巨大的转变。如果说《寒夜》是这一转折完成的标志，而《憩园》则是这一转变开始的标志，对此我们要有所了解。分析《憩园》的艺术手法，要结合作品，具体分析。而从中，我们也看到巴金创作手法的变化，这种变化表现在结构形式、语言和叙述角度三个方面，显示了巴金小说创作艺术的发展，大家要仔细把握。"},{"id":"122","stars":"★★★","title":"《寒夜》如何表现人性深度","body":"一、揭露黑暗的社会现实状况对人性的压迫\n\n当时作为陪都的重庆，伴随着战争的深入，出于避难等多方面原因，城市人口大量增长，人民的生活质量一时无法跟上。汪文宣一家四口人被迫只能挤在一幢老旧大楼的三层小房子里，成为社会资源分配不均与匮乏的一个侧面展现口。同时，物价的飞涨与收入的微薄也体现着社会的不公平。也正是生活在这样一个承载着黑暗的社会中，一次次的抗争失败一点点蚕食着汪文宣对美好生活的念想，使其承受的精神压力被一点点放大，最终使汪文宣对现世产生了绝望的态度，并逐渐淡忘了“对于死亡的恐惧”。可以说，腐败黑暗的社会现状与汪文宣精神世界的破损有着直接的联系，而精神世界的破损进一步表现为汪文宣性格上的矛盾，这让他成为一个有着抗争念想和畏怯思想的矛盾综合体。\n\n二、“肺病”作为一种隐喻的内涵来表现人性的压抑\n\n从现实性的方面进行思考，汪文宣身患肺病所产生的经济负担无疑给这个本就不富裕的小家庭带来了又一重担。曾树生也放下了自己原本心高气傲的心性继续着自己“花瓶”的工作，但她内心对光鲜艳丽的资产阶级享乐生活的向往与窘迫的现实生活对她欲望的压抑时刻刺激着她敏感的神经，这也为曾树生日后抛家弃子的出走埋下了伏笔。\n\n同时，长期的肺病不仅压垮了汪文宣的身体，也使他的心理防线一次次决堤。肺病意象的叠加无疑是苦难的层层深化，这不仅是把汪文宣这个小家庭拖入深重苦难的一个重要原因，更重要的是，“咳出血痰”这一事件的循环还有着反映出人物内在性格缺陷的影子。因为在文本中，汪文宣一而再再而三地忍住使自己不咳出血痰，但压抑的力量愈积蓄，到最后宣泄的洪水也就愈发强烈。忍耐的破灭带不来生活问题的解决，带来的只是人生的毁灭和自我精神意志的消亡，而小说末尾汪文宣的病逝也可以理解为他的忍耐性格造成的苦难的极致。\n\n三、通过夫妻间生命轨道的分歧控诉旧社会旧制度\n\n在汪文宣这个小家庭中，曾树生与汪文宣实则代表着两种截然相反的生命状态。曾树生作为一个生命力丰盈的个体，在早期，她有着为祖国的教育事业献身的伟大理想，勇于蔑视传统的封建礼教，顶着社会舆论的重压，为了坚守自己的爱情与汪文宣生活在一起；在婚后，出于对资产阶级自由生活的向往，她不甘于传统妇道的束缚，而热衷于花枝招展的打扮，并时常出入一些交际公关的场所，这些举动无疑都体现着一个小资产阶级女性丰盈的生命状态。\n\n而反观汪文宣这边，其生命状态是经历了从充实到萎谢的过程。从大学时期携手曾树生，怀揣着报效祖国教育事业的远大抱负，到后来顶着母亲及周遭人的压力和曾树生生活在了一起，实现了汪文宜早期对于封建传统婚姻制度反叛的目的，这充分体现着汪文宣作为一个充实生命个体的姿态。而当汪文宣与曾树生结合之后，险恶的社会现实状况，周遭人尤其是办公室同事与领导的恶意相向，母亲与妻子的不和等多方面因素一点点蚕食着汪文宣的心灵空间，让其性格愈发显得唯唯诺诺。\n\n四、以平民化的立场表现了人性的复杂性和矛盾性\n\n在表层意义上，小说描写了抗战期间一个小公务员家庭破裂的辛酸故事，揭露了病态社会的黑暗腐败，为那些在黑暗中挣扎的小人物喊出了痛苦的呼声，再现了那个时代的下层知识分子的悲惨遭遇，以及毫无希望、毫无光明和温暖的“寒夜”般的生活；在其深层，小说表现了作者对社会底层小人物生存命运的深切关注和对人性复杂性的深入思考，以及对社会、文化、人性的反思和诘问。《寒夜》是中国现代文学史上最具有悲剧感和悲悯情怀的作品之一。","keywords":"黑暗社会 压迫 肺病 压抑 夫妻分歧 旧社会旧制度 平民化立场 复杂性和矛盾性","note":"《寒夜》是巴金新中国成立前所作的最后一部长篇小说，标志着巴金在现实主义艺术探索中所达到的最高成就。小说通过这个平凡小家庭的不幸遭遇，无情的撕开了国民党统治的表皮，使人们看到了一幅冷酷的、血淋淋的、百姓生于水深火热之中的现实画面，表现了高度的现实主义精神。而小说的最高明之处便在于作者是从多个角度，通过或直接或间接描述人性的扭曲来控诉黑暗社会现实，从而达到警醒世人的效果的。"},{"id":"123","stars":"★★★★","title":"《寒夜》的艺术特色是怎样的（26哈尔滨师范大学）","body":"一、日常生活的细致描摹\n\n《寒夜》虽以抗战时期为背景，却没有重大的社会事件，而是写普通小人物及其日常生活，是平民的史诗，是战争年代普通知识分子苦难生活的实录，是发自小人物内心的带血的愤慨。其中最主要的内容是写三个人在日常家庭生活中的矛盾冲突，这就决定了作品缜密细致的叙述方式。而小说通过以小见大，又使读者由一个下层知识分子家庭的狭小生活窗口，看到了当时的整个时代、整个社会的面貌，赋予了这个以“小人小事”为题材的小说以深广的历史内容。\n\n二、人物心理的深度开掘\n\n《寒夜》主要是靠细节和心理开掘的深度来写人物的，用笔也更为冷静。作品往往进入人物的内心世界，把人物的复杂心理揭示出来。小说注意发掘曾树生的潜意识，如写她虽然想努力唤起对儿子小宣的亲近感，但又很难控制内心的冷漠。小宣那未老先衰的病态模样总引起她对丈夫潜在的烦恼与恐惧，生理和心理上的压抑使她在儿子面前也表现出排他和自恋的深层人格特征。此外，在作品中，人物的心理描写不是静态的，孤立的，作者透彻地揭示了那些隐蔽的心理过程，并且揭示出人物的心理活动在对立的情势下的运动。比如，曾树生决定离家去兰州，这个决定是在各方面影响下做出的，然而这些影响却常常使她的心理朝着相反的方向运动。当她回家征求丈夫意见时，出乎意料的是丈夫同意她走，这反倒使她犹豫了，违心地说出“我不走”这句话来。巴金不是按既定性格心理类型去拼接他的人物，而是忠于自己对生活的感受和体验，包括非逻辑性的审美感受，对人物性格心理的不同层面做整体的随机性的跟踪表现，使曾树生这样的人物形象具有很丰厚的审美内涵。\n\n三、匠心独运的小说构思\n\n整部作品都围绕“寒夜”这一象征性的氛围做文章，意境凄凉，增加了悲剧感染力，并且结构上也首尾呼应，以汪文宣在寒夜中寻找尚未归家的曾树生起笔，以曾树生寒夜归来寻找汪文宣结尾，增强了悲剧效果，使“寒夜”这一氛围的象征意味得以凸显，又使人自然联想到作品所要暴露的那个黑暗冷酷的社会，联想到一些人性困境的话题，颇具匠心，却又自然天成。","keywords":"悲剧性 病态社会 社会的悲剧 平民的史诗","note":"与巴金的《家》等前期作品相比，《寒夜》在艺术上的一个明显的、巨大的变化是由“热”而“冷”。《家》中对封建专制制度发出的剑拔弩张的“我控诉”和激情抒发的表达方式，在《寒夜》中开始变为对黑暗社会现实的更为冷静客观同时也更为深刻的剖析。作品的笔调是冷峻的，气氛是肃杀的，就像作品的标题一样，给读者的感受是逼人的冬夜的寒气。这一变化，表明了作家艺术功力的深化。"},{"id":"124","stars":"★★★","title":"曾树生的人物形象是怎样的","body":"曾树生是小说《寒夜》中刻画得最有深度的人物，是巴金笔下女性形象中最为丰满的一个。这一女性形象的特征，主要表现在以下方面：\n\n一、性格充满矛盾的知识女性\n\n曾树生健康而漂亮，有充沛的活力，思想开放，追求幸福与自由，然而内心藏着孤独与苦闷。这苦闷除了社会环境的压迫，和她的身心要求得不到满足也有关。她爱自己的丈夫，也曾经想遵循传统道德的规范，做安分守己的妻子，但一回到家面对病入膏肓的丈夫，内心便控制不住恐惧和压抑。她的根本矛盾，就是一方面要追求自由与幸福，一方面又不知道自由与幸福如何才能获得。\n\n二、旺盛的生命力\n\n曾树生与汪文宣的性格不同，表现出了更为旺盛的生命力，她宣称“我爱动，爱热闹，我需要过热情的生活”。在苦难的命运面前，她挣扎、反抗，要求自由与幸福。曾树生对丈夫极度失望，更受不了性格偏执、思想守旧的婆婆的侮辱。她那深受新思潮影响的个性越来越感受到家庭牢笼的束缚，她那年轻而骚动的心灵更期待一种火热的激情。但在那个死寂的家庭里，却“永远是灰黄的灯光”，永远是“单调而无生气的闲谈”以及丈夫那“带病的面容”，她痛切地感到“这样的生活她实在受不了。她不能让她的青春最后的时刻这样白白地耗尽”。尤其是她那病弱的、毫无生气的丈夫永远是那么固执、懦弱瞻前顾后，她越来越感觉到他们之间已有太多的陌生与隔膜，甚至根本无法沟通。“他不听她的话，不肯认真治病。她只有等待奇迹。或者......或者她先救出自己”。几经犹豫之后，曾树生终于答应了追求她的年轻而健壮的上司陈主任的要求，与他一起随公司迁到兰州，离开了家庭，并与丈夫离婚。\n\n三、排他与自恋\n\n巴金注意发掘曾树生的潜意识，如写她虽然想努力唤起对儿子小宣的亲近感，但又很难控制内心的冷漠。这是由于小宣那未老先衰的病态模样总引起曾树生对丈夫潜在的烦恼与恐惧，生理和心理上的压抑感使她在儿子面前也表现出排他和自恋的深层人格特征。\n\n巴金显然不是按既定性格心理类型去拼接他的人物，而是忠于自己对生活的感受和体验，包括非逻辑性的审美感受，对人物性格心理的不同层面做整体的随机性的跟踪表现，使曾树生这样的人物形象具有很丰厚的审美内涵。","keywords":"性格充满矛盾 旺盛的生命力 排他与自恋","note":"曾树生是一个深受“五四”时期个性解放思潮影响的女性。她曾经有为教育事业献身的理想，但在生活的重压下，她却逐渐走向了“沉沦”，将以前的理想完全抛弃了。对曾树生这样一个复杂人物的探析，有利于我们更好的把握小说“控诉旧社会，控诉旧制度”这一最基本的主题。考查时，很多院校会让考生将曾树生与觉新、觉慧等形象进行对比，大家要好好把握。"},{"id":"125","stars":"★★★★★","title":"沈从文构筑的“湘西文学世界”是怎样的","body":"沈从文的小说并非湘西人民真实生活的反映，而是他着意经营的、与处于话语中心的现代文明进行对照的某种文化图式.是超越现实的理想画卷。经过作者审美选择的过滤，略去了现实生活的沉重与苦难，呈现在读者面前的自然环境、社会习惯、民风民俗、人物性格、人际关系等等，都展示出一个和谐美好的、未经现代文明污染的人间乐园。沈从文构筑的“湘西文学世界”，主要具有如下特征：\n\n一、政治背景弱化\n\n无论是这些沈从文亲历的事件，还是湘西的军阀、土匪为患，在他的小说中基本上都没有反映。相反，沈从文向读者介绍的是一种“一切莫不极有秩序，人民也莫不安分乐生”的桃源形象。这种和平宁静、知足安乐的民间生活，是沈从文笔下基本的湘西社会生活图式。与这种“桃源”般的生活图式相对应，沈从文还故意对作品的时间作了模糊处理，有的作品干脆就连一个含混的时间概念都没有提供。\n\n沈从文之所以刻意弱化具体的时代政治背景，将湘西世界的生活形态推移到社会现实之外，目的是要在纯粹抽象的背景下，凸现富有象征意味的健康优美的生命形式，写出更历久，而具永恒意义的理想人性，这也是创作他的文化寓言的必然选择。\n\n二、生活方式原始化\n\n沈从文有很深的原始主义情结，他推崇原始、自然、简单、朴素的生活方式，在他的小说世界里，几乎看不到国家机器的活动。地方的社会组织结构极为松散，正常社会生活全赖地方传统习俗来维系，但却人事关系和谐，安宁平静。这里大多数人物的身份都极为单纯，并且以极为简单，甚至是以原始的方式生活。沈从文在这里提供的是与高度组织化、社会化的现代社会截然相反的社会组织模式，是原始而古老的、令人神往的“黄金时代”。\n\n沈从文的原始主义情结还表现在他对湘西原始宗教的态度上。在他看来，“神”的作用是无可替代的，湘西世界的信天委命的人生态度也颇有可取之处，而对一切全无敬畏之心的现代人容易变得狂妄和浅薄，在一定程度上保留宗教情绪。\n\n三、人物形象理想化\n\n湘西世界不仅社会生活和谐有序，其中的人物形象也超乎寻常地美好，是沈从文将湘西世界理想化的最动人的部分。这首先表现为人物外型的美丽。沈从文笔下的湘西男子，不仅勇敢、强健而且相貌美丽，性格中还有极其温柔的一面，而他笔下的女性形象都是柔美如水的，恬静、温柔、纯净、忠贞。\n\n其次，从性格来看，这些人物几乎全都是淳朴、善良、忠诚、重义轻利、互助互爱的。沈从文极力突出边地的风俗淳朴，人性善良淳厚，甚至将妓女也描述为“浑厚”的，很明显地能看出作者将道德的原始、自然、未经现代文明道德观念教化的状态加以理想化的倾向。\n\n总的来说，沈从文的湘西所代表的文化形态的核心价值观念是诗意的、非功利的、率真自然的生活态度，保留着朴素单纯的原始信仰，尊重自然，人与自然的关系和谐，与现代文明的观念-效率与利益至上、人的高度组织化与社会化以及追求人对自然的掌控和改造恰好相反。\n\n【李凡关键词：政治背景弱化 生活方式原始化 人物形象理想化】","keywords":"","note":"沈从文构筑了一个“湘西文学世界”，这个文学世界的特点，和沈从文的出身、个人经历有着密切的关系，需要注意的是，这一文学世界并不是真实存在的，而是为了与都市文明对照而被沈从文以故乡为蓝本塑造出来的，是理想化了的，大家可以结合沈从文的生平去进行分析。总体来看，沈从文“湘西文学世界”的构建是以诗意的、非功利的生活态度为核心的，具体表现为政治背景弱化、生活方式原始化和任务形象理想化。相关内容可以参考赵园《沈从文构筑的“湘西世界”》、艾艳红《论沈从文笔下的“湘西世界”》，具体资料可以在李凡文学正版群中领取。"},{"id":"126","stars":"★★★★★","title":"沈从文小说创作的艺术特征【答题框架】","body":"一、抨击现代异化的人性，讴歌古朴美好的人性\n\n沈从文潜心于表现“于历史似乎毫无关系”的人性之“常”，他的创作主要不是从政治经济的角度，而是从伦理道德与审美的角度去审视和剖析人生。他在创作中正是高扬着这种人性观念去抨击现代异化的人性，讴歌古朴美好的人性的。\n\n他的小说题材可分为两类：第一类是写城市与知识阶级的，第二类是写乡村与抹布阶级的。尤其是在第二类题材的创作中，他更多地投注了自己的热情，正面表现了自己的人性取向和情感评价。这显然缘自其强烈的乡村（湘西）情结。\n\n展现都市病态世界的，可以《绅士的太太》《都市一妇人》《八骏图》《某夫妇》《大小阮》《有学问的人》等为代表。在这类小说中，他从一个乡下人的眼光出发，用这面镜子首先映照出了上流社会道德沦丧的种种面影，以自然人性的道德尺度鞭挞了衣冠社会人性的堕落和扭曲。在沈从文的都市题材作品中，都市文明导致的要么是人欲的泛滥，要么是人性的扭曲。因此，既要恢复生命的活力，又不要堕落为行尸走肉，这是沈从文这类小说从反面呈现出的人性道德价值取向。\n\n在表现乡村与抹布阶级时，沈从文正面提取了未被现代文明浸润、扭曲的人生形式。作为对这种人生形式表现的极致，便是对所谓“神性”的赞美。在沈从文的美学观中，神性就是爱与美的结合，这是一种具有泛神论色彩的美学观念。既然爱与美就是“神性”，因此可以说在沈从文作品中神性就是人性的最高表现。在这类作品中，洋溢着化外民族青年男女真挚、热烈、活泼的生命活力，作者借此讴歌了浪漫的野性的原始生命形态。这显然是与《八骏图》中所状写的都市侍宦病相对立的。在这些小说中，沈从文借助于传说、故事的素材，用浪漫的手法表现了自己对人性真谛的思考，借神性宜扬了自己的生命哲学，讴歌了健全的生命形态和原始的生命强力。\n\n二、温柔淡远的牧歌情调\n\n从整体上看，沈从文的小说呈现出了一种温柔淡远的牧歌情调。在题材的选择上，他喜欢用微笑来表现人类痛苦。他最擅长描写的是本身就富有牧歌因素的爱情，在描写这类题材时，他又从人与自然的契合的泛神论思想出发，故意淡化情节，以清淡的散文笔调去抒写自然美。加上作者在描写时又喜欢用一种温柔的笔调，这就创造出了独特的审美意境，酿就了他的小说的清新、淡远的牧歌情调。同时，沈从文深知理想的人生形式只能存在于理想之中，现实中这种朴素的人性美正在日渐泯灭，因此在歌唱这些牧歌的同时，他又渗进了一丝沉郁，一缕隐痛，致使其温柔平和的牧歌中又混合着一层淡淡的悲愁。\n\n三、追求小说的抒情性\n\n创作主体情感的投入，追求小说的抒情性，是沈从文小说的特色。他常常直接把主体情绪投注到人象和物象之中，使之带上鲜明的情绪色彩；或者借助于记梦和象征曲折地表达主体的情感评价，酿造浓郁的抒情性。从总体上看，沈从文小说有很强的写实性，但沈从文小说为了追求理想的人生形式又掺入了梦的成分，因而又具有鲜明的浪漫主义特征。\n\n四、“文体作家”\n\n沈从文是中国现代文学史上独具风格的大家，不仅创造了独特的“湘西世界”，且于小说文体创作方面都有贡献，被誉为“文体作家”。（详见：沈从文为什么被称为“文体作家”）\n\n五、丰富多样的结构体式，古朴简约的语言风格\n\n丰富多样的结构体式，古朴简约的语言风格，是沈从文小说的又一个特征。沈从文的文体不拘常例，故事也不拘常格。他的小说在结构上追求自由，随物赋形，采用过对话体、书信体、日记体、童话、神话等多种体式。与结构上刻意求新相表里的，是讲究“文字组织的美丽”。他的小说语言具有独立的风貌，“格调古朴，句式简峭，主干凸出，少夸饰，不铺张，单纯而又厚实，朴讷却又传神”。他的小说很少用“的”“了”等虚词，既有浅近文言的简约凝练，又有口语的生动活泼。","keywords":"底层人民的本性 牧歌情调 抒情性 文体作家 丰富多样 古朴简约","note":"沈从文的《边城》《湘西》《从文自传》等，在国内外有重大的影响。他的作品被译成四十多个国家的文字出版，并被美国、日本、韩国、英国等十多个国家或地区选进大学课本，两度被提名为诺贝尔文学奖评选候选人。新时期以来，学界对于沈从文的关注度越来越高，因而在考查中也频繁出现，大家要重点关注。沈从文相关的名词解释整体还是以作品为主，主要是《边城》，大家要多注意一下。"},{"id":"127","stars":"★★★","title":"沈从文小说中的人物形象有什么特点","body":"一、隐忍坚韧的底层人民\n\n沈从文对故乡的农民、兵士、终生飘泊的水手船工、吊脚楼的下等娼妓，以及童养媳、小店伙计等等，都一律怀有不可言说的同情和关注。这里自然有血有泪，但更多的是追求琐屑生活的企望的破灭，是人格习以为常的被践踏。他们的隐忍态度，促成作者对其坚韧生活能力的赞美，和人的命运不可知的深重哀叹，如《石子船》里那个偶然被河石“啃”住手的年轻人，生死只在一发之间。这里没有尖锐的阶级斗争的图画，沈从文不具有那样的政治意识，他只用看似轻淡的笔墨，点出令人心灵颤抖的故事，他的目标仅仅专注于那些历经磨难而又能倔强地生存下去的底层人民的本性。\n\n二、女性形象柔美如水\n\n沈从文的女性形象柔美如水，这种生命形式可以用“恬淡自守”来加以概括。翠翠，和沈从文其他小说中所写的小女人如《三三》里的三三、《长河》里的天天，都是作者美的理想化身：恬静、温柔、纯净、忠贞，从外表到内心皆姣好无比。围绕翠翠描述的宁静自足的生活，淳厚的人情美、人性美，人心向善，正直、朴素、信仰简单而执著的地方民族性格，加上乡村风俗自然美的渲染，由此，托出了作者心向往之的那块人类童年期的湘西神土。\n\n三、男性形象表现了原始的蛮性力量\n\n沈从文故乡的男性教会他神往于“雄强进取”，教会他如十万大山般矗立，表现了原始的蛮性力量。所以在他的湘西人物序列里，男性军人往往是诚实、勇武、不驯服、有血性的。《会明》《灯》写军队里三十年的伙夫老兵，外表皆雄壮、固执，实际天真、憨痴如儿童一般，几乎是将雄强和柔顺集于一身了。关于此种湘西精神的表现，早就有人提出作者是“想借文字的力量，把野蛮人的血液注射到老态龙钟、颓废腐败的中华民族身体里去，使他兴奋起来，年青起来，好在20世纪舞台上与别个民族争生存权利”。","keywords":"隐忍坚韧 女性柔美如水 蛮性力量","note":"沈从文对于人物的塑造与他的自身经历是分不开的。他关注底层人民，从故乡的人民中提取原型，形成了他笔下特有的男性和女性形象，而且偏重于表现这些人物形象“美”的一面，大家在记忆时，可以结合翠翠、三三、天夭等典型人物去分析。"},{"id":"128","stars":"★★★★","title":"《边城》的艺术特色","body":"《边城》是沈从文诗化抒情小说的成功典范，也是沈从文对中国现代文学的独特贡献。具体来说，《边城》的鲜明独特的艺术个性主要表现在以下几个方面。\n\n一、人物形象描写写意传神，人物高度意象化和类型化\n\n《边城》对人物的处理，不像现实主义创作以人物性格的塑造为中心，而是采用中国传统艺术的写意传神笔法，在小说中营造某种意境，让人物成为意境中的一部分，人物形象具有东方式的恬静之美，呈现出水墨山水画的效果。\n\n所谓人物的意象化，主要是指人物描写与风俗描写、景物描写相结合，达到人物与生活环境的和谐一致。如小说对翠翠形象的描写，与她生活的茶峒边城美好迷人的自然风光与风俗纯朴的社会景象、人际关系互相映衬、浑然交融。而人物的类型化，主要指让人物成为某一种人性的体现。沈从文的创作从人性的角度去寻求重造民族品德的门径，表现原始、古朴的人生理想。《边城》中的人物都是类型化的，作者往往是通过人物表达某种意念的，即通过人物传达一种对爱和美的追求。\n\n二、小说结构寓严谨于疏放，呈现出散文化倾向\n\n《边城》虽是一部小说，但更像一首二十一个断章组成的长诗。从艺术特质角度来说，《边城》打破了传统小说情节结构模式的惯性，摒弃了悬念照应、时空倒错之类的机心匠意，它把故事情节以外“情调”的渲染作为整篇小说的结构中心，人与景、情与境、人物的情绪与作者的情绪水乳交融，这就使得《边城》的叙事结构既衔接自如、浑然一体，具有诗化的特点，又自然流畅如行云流水，呈现出鲜明的散文化倾向。\n\n整部作品看似疏放但实则严谨，小说以翠翠与天保、傩送间的爱情纠葛为明线，以王团总欲傩送作自己女婿而生的事端为暗线，以天保、傩送钟情于翠翠为经线，以老船夫关心、撮合孙女婚事为纬线，从而明暗结合，经纬交织，生出波澜起伏的情节，推动故事向前发展，将情节的单纯性与复杂性完美结合，显示出作者高超的构思能力。\n\n三、现实与梦幻相交织，具有浓厚的诗情画意和象征意味\n\n在《边城》中，沈从文在现实的基础上，为了追求理想的人生形式自觉地掺入了“梦”的成分。可以说，作者对《边城》中的环境和人物都作了理想化的处理，突出了小说的抒情性。它既表现在作家对湘西边地秀丽景物的醉心描绘，也表现在作家对湘西边地纯朴民俗的诗意书写。二者的交相辉映，不仅传达和渲染出一种独特的地理与人文环境，而且构成了小说中人物活动的背景，显示出人物与故事对当时社会真实的超越，从而使作品充满了浓郁的诗情画意。此外，作者的目的似乎是从人性道德的视角，去透视一个民族可能的生存状态及未来走向。所以，作者在创造诗一样的意境的同时，还赋予了作品中人物与景物以深厚的象征意味。\n\n四、语言古朴清丽、简约自然，追求纯和真的“天籁”之美\n\n《边城》的语言显然杂糅了古典文学的句式，同时又提炼了湘西边地鲜活的方言、口语，有真意，去伪饰，长句精确、曲折而富韧性，短句重感兴，活泛有灵气，追求一种纯和真的“天籁”之美。叙述语言单纯简朴流动飘逸，如山泉汩汩，小\n\n溪潺潺，呈现出明显的诗化、散文化倾向；人物语言多用湘西人惯用的口语、比喻和巧妙的对比，含蓄生动，很少用“的”“了”等虚词，既有文言的简约，又有口语的自然，充满了浓郁的生活气息和湘西人特有的灵性。","keywords":"写意传神 意象化 类型化 寓严谨于疏放 现实与梦幻交织 诗情画意 象征意味 古朴清丽 简约自然","note":"《边城》是沈从文的代表作，是沈从文创作理念与艺术手法的重要体现，用看似平淡的笔墨，写出令人颤抖的故事，在文学史上具有很重要的地位和影响，是我们考查中常常会遇到的一个重点。分析《边城》的艺术特征时，我们主要从人物塑造、结构、整体风格和语官四个角度进行分析，要注意把握沈从文的作品与其他作家现实题材作品的区分。"},{"id":"129","stars":"★★★★★","title":"试分析《边城》的牧歌情调","body":"牧歌的实质，是在与复杂、败坏的城市生活对比中，表现淳朴、自然的乡村生活。牧歌在中国现代文学史上出现，与中国被动现代化的现实密切相关。\n\n中国被动现代化的过程，激起了相反的文化守成主义思潮。文化守成主义思潮追求在文学上的表现，而牧歌为这种表现提供了经典的样式和意绪。牧歌以张显、提炼乡土诗情为特色，反映了后进民族对家园的守望，对根的追寻，对自我的确认。沈从文的长篇小说《边城》是体现牧歌这一抒情特质的典范之作。《边城》的牧歌情调，主要是通过以下方式构筑的：\n\n一、乐园图式\n\n牧歌将乡土生活理想化，因此，构筑乐园图式就成为必然的选择。《边城》的乐园图式，主要是通过以下方式构筑的：\n\n（一）空间和时间的陌生化\n\n牧歌的非写实性使它必须在空间和时间上离开“此地”和“当前”，才能驰骋对乐土的想象，并对现实起到反衬效果。\n\n沈从文将《边城》中那一方乐土安置在湘西这中国大陆的西南一隅，在时间处理上，虽然《边城》初版时，写明了具体时间，但再版时，沈从文把具体的年代抹去了，代之以“到如今”这模糊的字样。沈从文的空间和时间处理策略，有意或无意中确实达到了《边城》所追求的艺术效果：将背景置于当代读者无法经验的“过去”或“异域”，离开“当前”和“此地”的序列，将空间和时间陌生化，提供了阻隔和示范的效果。\n\n（二）突出边城人和社会善的一面\n\n沈从文声称，他要在《边城》中表现“优美，健康，自然而又不悖人性的人生形式”。他的乐园构想，建立在人性善的基础之上，投射到人物性格、人际关系、茶峒社会与习俗、甚至自然环境等各个层面。例如渡船老人，他勤劳、善良、本分敦厚，凡一切传统美德，他都不缺少。\n\n当然，沈从文并不满足于在主人公身上堆砌美德，而且突出这种美德是本地风尚习俗使然，并为“安辑保守”的地方当局勉力维持着。边城民风纯朴，沈从文为了强调这一点，甚至将妓女接客这种极端的事例也理想化了。\n\n（三）强调边城人的诗性品格\n\n沈从文还处处展示边城人诗性的品格。诗性（超功利性，非社会化，自然性）与世俗、功利、务实相对，代表了人生的两个方面，也代表了社会的两种价值取向。渡船老人便是这诗性品格的集中体现：年轻时爱唱山歌、会吹笛子；在小小边城，老人还是著名人物，他做人极其认真、迂阔，甚至到不尽情理的地步，物质财富的极度匮乏且需求低下，但本色平和，享受份内生活。\n\n《边城》中人物的诗性品格，在对话中更有集中体现。例如小说第九节，渡船老人和二老互相称许的对话就堪称抒情的典范。\n\n二、挽歌情调\n\n牧歌并不限于表现乡土喜乐，它本身也含有悲剧成分。牧歌不仅不拒绝衰败和忧伤，并且牧歌的美感和诗意在很大程度上依赖这种格局和情绪。同时，在中国被动现代化的进程中，挽歌也最能明示本土文化所遭遇的挫折，并切合展现这种文化之魅力和潜在希望的努力。\n\n《边城》中弥漫着忧伤和凄婉的气氛。优伤和凄婉无处不在，却也是可以分析的，它来自三个层面：现实的层面，命运的层面和象征的层面。\n\n（一）现实层面\n\n现实因素对田园景观的渗透，在《边城》中表现为碾坊所代表的金钱交换关系对纯洁爱情的破坏。翠翠与二老相识两年后，碾坊介入了他们的关系，给二人本来纯洁的爱情抹上一层阴影。小说第十节，老人去看龙舟，却被媒人拿碾坊施压；那一边在吊脚楼上，顺顺以家长的权威，在两个候选儿媳之间排出座次。在第十九节，碾坊和渡船再度交锋。沈从文在此处将\n\n中寨团总女儿与二老婚事还原成赤裸裸的金钱关系，这次，老人被中寨人的暗示震憾了。老人最后死去，意味着金钱交换原则在现实关系中的胜利，乡土诗情严重受挫。\n\n（二）命运层面\n\n命运感是《边城》忧伤与悲情的另一个来源，从《边城》当事人的性格和行动看，金钱关系对翠翠二老爱情的破坏是有限的。悲剧发生的最显见的原因是一连串误会，首先在爷爷与大老之间，其次是和二老之间，再次是与顺顺之间。\n\n把翠翠护送到幸福彼岸，是渡船老人活动的中心，他尽自己最大的力量，四处穿针引线，急切地想完成这一任务，但误会时时发生，最终导致不幸的结局。为了凸显误会的存在和作用，沈从文甚至有意使人物的心智幼稚化，并断绝人物之间通过言语交流或释疑的可能，借以维持误会的局面。因为误会的频繁发生和非合理性，它成为“天意”“造化”的显现形式。渡船老人的行动是悲剧性的，每到关键时，他的努力就被造物主化解得干干净净：他越是急迫，情势向那预设的结局发展得越快。人与命运的冲突，产生了震撼人心的力量。\n\n（三）象征层面\n\n《边城》的挽歌也在象征的层面展开。从沈从文的背景和创作道路来看，他在三十年代已经获得了西方现代主义文学中惯用的象征手法，加之沈从文对《圣经》稔熟于心，以及湘西和陶渊明《桃花源记》的关系，他套用中国古典文学中桃花源的意象，并借用《圣经》中大洪水意象，从而构筑起《边城》象征层面的悲剧，是完全可以理解的。\n\n东晋诗人陶渊明的《桃花源记》是中国最早详尽描述乐园图景的文学作品，它将《诗经》中“适彼乐土”的理想具体化了。《边城》在时间和空间上的处理，以及乐园一失乐园的结构，都与《桃花源记》相映成趣。《圣经》中的创世纪，同样描述了一个乐园一失乐园的图式，其中，那场大洪水扮演了关键角色。《边城》中也有一场洪水。暴雨之夜，爷爷死了，渡船跑了，白塔坍塌了。这意味着诗性人格在现实面前所遭受的重创，边城所象征的乐园的倾颓。就像《圣经》中有诺亚方舟以拯救上帝的选民一样，《边城》也提示了新生的可能性：翠翠虔诚地等待，二老“也许明天回来”，白塔的重建都暗含了希冀。\n\n沈从文竭力追求概括性，桃花源图式与大洪水图式，使《边城》的挽歌超出了“此时此地”的范畴，具有了整体和普遍的意义。\n\n三、物景化与古典化\n\n从乐园到挽歌，标示出牧歌的基本框架结构和走向，而乡土和传统的有机融入，为牧歌增添了文化背景和纵深。前为骨骼，后为血肉，作为牧歌的《边城》因此成活并丰满起来。《边城》以其乡土地方色彩著称，这除了沈从文热衷于表现地方风俗，还包括对人事、行动、情节等所作的物景化处理。物景化和古典化，实在是将《边城》牧歌效果最大化的有力手段。\n\n（一）物景化\n\n物量化涉及对叙事时间的调整。沈从文正是通过对叙事频率的创造性应用完成了对人事、行为、情节的物景化处理。《边城》是沈从文广泛使用反复叙事的作品之一，其前三章普遍用反复叙事，反复叙事由句型延伸开去，扩展成段落，单数的场景仅成了点缀。他通过反复叙事，把个体还原到类从现象发现规律，把特殊提升到普遍，经验与人事通过这样的抽象，从流动时间的冲刷侵蚀中解脱出来，演化成习惯、风俗文化，达到永恒。反复叙事的应用使边城人的每一个动作、行为都被提炼成习惯和普遍现象，“制造出”相对静态的“环境”和“风物”。牧歌情调就滋生在这样的土壤里，\n\n（二）古典化\n\n《边城》有丰富的传统文化内涵，这突出反映在和道家、儒家文化的密切关系上。《边城》的意境和风致流泻着典雅、&#x6E05;丽、圆润的古典美。\n\n沈从文声称要建供奉人性的希腊小庙，这人性在《边城》中其实深深地打着儒家伦理道德观念的烙印。此前沈从文的大部分湘西作品，着重凸现湘西世界蛮荒状态和原始初民的强力、元气和野性，但《边城》中人物，如前文所述，都堪称道德楷模，教化的风范。而在伦理道德的层面上塑人物，从现实关系的层面上评价他们，正体现了传统儒家的伦理道德意识。《边城》也有道家思想影响的痕迹。作者所看重的边城人的诗性品格，如渡船老人的迂阔，顺顺的放达和洒脱，二老的浪漫等都承继了道家思想的衣钵。儒道相济，构成《边城》人物性格的内在支撑。\n\n传统文化，尤其是儒家思想促使《边城》审美情趣发生了变化。如对性爱的态度。沈从文写于上海时期的作品，热烈地赞美无拘无束的原始性爱，到青岛后的作品中，情欲开始接受考验和约束。《边城》处理的是爱情，不是情欲，一切深合传统道德，深合“发乎情，止乎礼仪”的古训。沈从文的创作风格也因此发生了变化，上海时期的作品张扬、驳杂、雄迈，《边城》转向精巧、雅致、敦厚。如此，浸润着古典文化的意象纷至沓来：白塔、林、小溪、渡船等，构成一幅绝妙的山水画卷。","keywords":"乐园图式 空间时间陌生化 突出善的一面 强调诗性品格 挽歌情调 现实层面** 命运层面 **象征层面 物景化反复叙事 古典化 儒道相济","note":"分析《边城》的牧歌情调，首先需要我们对牧歌情调有所了解。所谓牧歌情调，实质是通过与城市丑恶的对比，突出乡村的美好。而牧歌情调之所以在现代文学史上出现，是因为中国被动现代化的现实激发了文化守成主义思潮，牧歌情调则是这一思潮文学表现的需要，此处可以联系后面沈从文“反现代性”的题目进行理解。牧歌情调的构成，包括乐园图式、挽歌情调、物景化和古典化三个层面，这些都在《边城》中有所体现，所以《边城》才被称为体现牧歌这一抒情特质的典范之作。这部分内容再联系沈从文的其他创作，我们就可以归纳出沈从文的牧歌情调了，这里就不再给大家详细展开了。相关内容可以参考刘洪涛《（边城）：牧歌与中国形象》《＜边城＞与牧歌情调》，具体资料可以在李凡文学正版群中领取。"},{"id":"130","stars":"★★★","title":"沈从文小说创作的思想主题是怎样的","body":"与左属文坛注目于社会政治之“变”不同，沈从文潜心于表现“于历史似乎毫无关系”的人性之“常”。这种表现人性之常的创作宗旨，决定了他的创作主要是从伦理道德与审美的角度去审视和剖析人生。他在创作中正是高扬着这种人性观念去抨击现代异化的人性，讴歌古朴美好的人性的。他的小说题材可分为两类：第一类是写城市与知识阶级的，第二类是写乡村与抹布阶级的。尤其是在第二类题材的创作中，他更多地投注了自己的热情，正面表现了自己的人性取向和情感评价。\n\n一、展现都市的病态世界\n\n沈从文展现都市病态世界的小说，可以《绅士的太太》《都市一妇人》《八骏图》《某夫妇》《大小阮》《有学问的人》等为代表。在这类小说中，他从一个乡下人的眼光出发，映照出了上流社会道德沦丧的种种面影，以自然人性的道德尺度鞭挞了衣冠社会人性的堕落和扭曲，以毫不留情的犀利之笔，撕下了城里人的道德面纱，揭示出都市人生的荒唐与可笑。沈从文对都市人生的讽刺、暴露，不是从社会历史角度来暴露上流社会的腐朽、庸俗、自私，而是从人性道德的角度切人都市人生，以“乡下人”的眼光观察上流社会的种种病态，反映上流社会人的本质的失落与人性的扭曲。在沈从文的都市题材作品中，都市文明导致的要么是人欲的泛滥，要么是人性的扭曲。因此，既要恢复生命的活力，又不要堕落为行尸走肉，这是沈从文这类小说从反面呈现出的人性道德价值取向。\n\n二、讴歌健全的生命形态与原始的生命力\n\n出于对现实人生形式的不满与厌倦，沈从文创造出了自已理想的人生形式。他一方面在回忆中构造着牧歌式的“边城”世界，一方面通过民间传说敷演成的故事为其理想的人生形式寻找历史的根据。在这类由乡村和抹布阶级构筑起来的湘西世界中，沈从文正面提取了未被现代文明浸润、扭曲的人生形式。作为对这种人生形式表现的极致，便是对所谓“神性”的赞美，在这类作品中，洋溢着化外民族青年男女真挚、热烈、活泼的生命活力，作者借此讴歌用浪漫的手法表现了自己对人性真谛的思考，借神性宣扬了自己的生命哲学，讴歌了健全的生命形态和原始的生命强力。\n\n【李凡关键词：都市的病态世界 健全的生命形态 原始的生命力】","keywords":"","note":"沈从文小说的思想内容，可以联系其小说的牧歌情调与“反现代性”特征进行理解。沈从文的小说创作很明显受到了文化守成主义思潮的影响，对被动现代化带来的城市文明保持警惕，因而沈从文小说创作的思想主题主要分为两个部分，一个是展现都市的病态世界，暴露上流社会的腐朽、自私；第二个是讴歌健全的生命形态和原始的生命力，创造理想的生命形式。"},{"id":"131","stars":"★★★★","title":"试分析沈从文国民性改造思想的独特性","body":"沈从文对国民人格进行批判的着眼点在于生命力的匮乏-也即“阉寺性”人格，因此对国民内在的生理、心理本体的重建必然会成为他的“国民品德重建”的核心内容，具体来说，表现在以下方面：\n\n一、坚持推进“文学革命”，激发青年的意志\n\n针对普遍存在于都市的“阉寺性”人格，沈从文主张为青年输入一个健康雄强的人生观，使他们的情感做到能燃烧、能疯狂、能彻底地皈依。为了激发青年的意志，使他们获得信心和力量，沈从文选择了“文学革命”。他以乡下人的执拗死死守住了“文学革命”，并以“看远景而不求近功”“为而不有”的态度，将这项工程往前推进。这一方面是由于沈从文的文学理想、价值观念因建基于实践而更有定力，另一方面，沈从文从头到尾都相信人性，这种信仰使他自始至终都将文学作为“重造人类关系”的唯一手段，这使他对“文学革命”也充满信心。\n\n二、高举“爱与美”的旗帜，主张用文学和艺术净化思想\n\n沈从文高举“爱与美”的旗帜，致力于理想人性的重建和民族国家的重建，这是“文学革命”思想在抽象领域的延伸和发展。\n\n在沈从文看来，宗教和政治在“庄严背后都包含了一种私心，无补于过去而利于当前”，使人只知在“实在”“意义”“名分”上讨生活，缺乏对美、对生命的深度和完整性的感受与理解。而只有用超越习惯的心与眼，丢开一切功利性的目的，保持对“美”的敏感，才能真正见出世界之全，体会到人的真正含义，在真正意义上产生一种“崇高庄严感情”。此外，宗教和现代政治将“战争”“强迫”“统制”“专横”“阴狠”等不良观念与情绪输入给青年，只有用文学和艺术、用“爱与美”的抽象原则才能对这些观念和情绪净化廓清，使人重获身心的健康。\n\n三、将“生命”作为衡量价值的唯一标准\n\n针对不同的文化语境，沈从文主张要对舶来的文化／文学思想进行修正，使之符合国情，这样才能达到预期的效果。为此，沈从文主张贴近社会，贴近“人事”，贴近血肉生命，将“生命”作为衡量价值的唯一标准，反对制度、规则、惯例以旧的或新的形式对“生命”的裁定和宰制。这些观点源于他对传统文化与现代理念的双重失望。一方面，传统文化所能提供的“道德哲学”并不健全，并且已经成为个体生命和文化发展的负累；另一方面，现代理念源自西方，是属于另外一个文化体系的异己存在，所以输入前要先进行修正，但中国却缺乏能对舶来理念进行修正、进行系统性说明的文艺理论家和思想家，以至于出现新的条条框框对“生命”的再次扭曲。\n\n【李凡关键词：文学革命 激发意志 爱与美 净化思想 生命 唯一标准】","keywords":"","note":"沈从文以城乡两个经验世界的互参中为人性的理想形态塑形，主张人与自然的契合，弘扬人的原始强力，批判无光无热的生命形态，并在现实环境的重压之下，力图为人的个体存在和民族的生存建构一个形而上的参照系，这些主张与“五四”新文学所开启的“国民性改造”是一脉相承的。而他国民性改造思想的独特性，主要表现在他是以国民生理、心理健康的重建为核心内容的，坚持推进“文学革命”，推崇“爱与美”，以“生命”为评判标准。这部分内容，大家要注意掌握。相关内容可以参考马新亚《“文学革命”·“爱与美”·“生命”-论沈从文国民性改造思想的独特性》，具体资料可以在李凡文学正版群中领取。"},{"id":"132","stars":"★★★★★","title":"沈从文为什么被称为“文体作家”","body":"一、沈从文被人称为“文体作家”，首先是因他创造性地运用和发展了一种特殊的小说体式，可叫做文化小说、诗小说或抒情小说。这是指小说的显著文化历史指向、深厚的文化意蕴以及具有独特人情风俗的乡土内容。这种小说，主要有以下特点：\n\n（一）强调叙述主体的感觉、情绪在创作中的重要作用。\n\n这种小说，不重情节与人物，强调叙述主体的感觉、情绪在创作中的重要作用。沈从文简洁地将其归纳为“情绪的体操”“情绪的散步”，便是这个意思。同时，沈从文说自己在运用文字叙事时，“习惯于应用一切官觉”，“必需懂得五官井用＇不是一句空话”，使直觉得以印入物象，做到灵动而富生气。\n\n（二）重视营造气氛。\n\n沈从文的抒情小说除了注意人生体验的感情投射，还有抒情主人公的确立、纯情人物的设置、自然景物描绘与人事的调和等等。对于抒情体式来说，营造气氛和描述人事几乎同等重要。它把环境认作是人物的外化，人物的衍生物，在一定程度上，景物即人。所以沈从文许多小说从交代环境开始，如《边城》由描写“茶峒”始，自河（酉水）、河街、吊脚楼、妓女，写了长长的几节，作为翠翠的出场背景；《柏子》从写如何泊船，如何爬桅杆入题。\n\n（三）意境优美。\n\n抒情小说的主要手段既然不一定是刻画人事，“造境”的成功与否就成了最高的目标。沈从文就是用水一般流动的抒情笔致，通过描摹、暗示、象征甚至穿插议论，来开拓叙事作品的情念、意念，加深小说文化内涵的纵深度，制造现实与梦幻水乳交融的意境的。他有的小说结构散漫，如《渔》，但情境美不胜收，弥补了不足，这种讲究诗的意境的小说特别地具有民族的韵味。\n\n二、有真意，去伪饰，具个性，追求纯和真的美文效果\n\n沈从文的文字语言较为奇特，有真意，去伪饰，具个性，追求纯和真的美文效果。他在生机勃勃的湘西口语基础上，吸取了书面语、文言语的特长，使得他的小说长句精确、曲折而富韧性，短句重感兴，活泛有灵气。他反对文字的意气浮露，\n\n行文不依仗附加的词藻，但不等于不锻造琢磨，所谓“扭屈文字试验它的韧性，重摔文字试验它的硬性”，务必拷问出语言的本色方才罢休。\n\n沈从文的文笔任意识的流动纵情写去，多暗示，富情感美、色彩美，不过早期的语言有些拗曲，到了写《边城》，明净澄澈，完全成熟了。\n\n三、多样的小说形式和语言\n\n沈从文曾经长期在大学里讲授习作课程，又有意试用不同的叙述方式进行练习，这使他拥有了多样的小说形式和语言。其中以诗、散文融入写实的乡土小说，质朴自然蕴藉；描写都市的讽喻小说便琐细，文字从容、幽默，有时嫌技巧略过；以苗族传说和佛经故事铺叙的浪漫小说，又较华丽、夸张，体制不拘常例，有的如《记一大学生》全无人物对话，纯用分析性的讲述来代替；有的通篇对话到底，如《某夫妇》；有的是采用日记、书信的穿插；有的是寓言、传奇或民间故事体。他的惯有的写法是在自然素朴的叙述中，注入诗的节奏，实现物我浑一的形象的流动。","keywords":"叙述主题的感觉、情绪 营造气氛“造境”美文效果 情感美、色彩美 多样的小说形式和语言","note":"沈从文被称为“文体作家”，主要是用来总结沈从文在小说文体上做出的发展与贡献，具体表现在小说体式，追求美文效果和多样的形式、语言这些方面。沈从文在小说文体上，上承废名，下启汪曾祺，形成了一条与鲁迅开创的小说文体截然不同的脉络，并在新时期被重新发现，受到越来越多的关注，大家要注意一下。"},{"id":"133","stars":"★★★★","title":"沈从文的散文创作特点","body":"沈从文的散文成就不低，他也有理论阐释的文字，用的也是散文笔法。尤其是抗战时期在大后方的西南联大，他的文论结集为《烛虚》《云南看云集》等，里面所收的《水云》《绿魇》《潜渊》各篇，简直就是一篇篇散文诗，谈的都是美学、哲学。沈从文的散文，主要具备以下特征：\n\n一、将湘西的人生方式，通过景物印象与人事哀乐-传诉，比小说更集中\n\n沈从文的散文比起他的小说来，更能表现他这“乡下人”自闯入文坛以来执拗走过的个人道路以及所遭遇的孤独感。如写常德的船，实写湘西的人情、物产、风习。对沅陵的描写穿插了神话传说，对凤凰女子的放蛊、行巫、落洞的风俗加以现代的解释。同时作者又有意无意地将散文的描写，和他的小说相关联，点出了他的人物在湘西活生生地存在着。\n\n正如沈从文经常说的，人物和地方都美丽得使人悲伤，“我心中似乎毫无渣滓，透明烛照，对万汇百物，对拉船人与小小船只，一切都那么爱着，十分温暖的爱着”！他写作小说时的感情，在散文里找得到实实在在的线索。\n\n二、有更多的感慨和议论\n\n散文比小说有更直接的历史感受，因此有更多的感慨和议论。沈从文在散文里说过：“＇时间”这个东西十分古怪。-切人一切事都会在时间下被改革。”而他实际在重返湘西时所看到的，往往与此相反，时间仿佛凝滞了，不动了。这就是沈从文关于历史的变数和常数的观点。对于湘西，似乎这种“常数”，这种历史的循环形态，更具典型意义。这是“落后”，然而是谁使得他们“落后”？这是美，又是谁使得他们长久保持如此美的生命形式？这是沈从文在散文中常常思考的内容。\n\n三、对湘西的批评更加尖锐\n\n基于自己重返湘西的见闻，沈从文的散文进而提出了两种历史-统治阶级的书面历史和人民的无言历史的观念。尤其是湘西人被排除在正统的历史之外，几千年过着原始自足的生活。关于衰败、保守的一面，散文中对湘西的批评又要比小说触目得多。他批评“湘西人负气与自弃”，甚至发问：“浦市地方屠户也那么瘦小，是谁的责任？”因湘西的屠户历来都胖子，民族败落、人种萎缩到如此程度，作者要问个究竟。\n\n【李凡关键词：更集中 更多感慨和议论 批评更加尖锐】","keywords":"","note":"沈从文的小说和散文一脉相承，因此二者常常被拿来一起做比较；同时，沈从文的散文特点集中表现在《湘行散记》和《湘西》二书中，所以这也是这两本散文集的特点，需要大家根据具体题目具体应对。这里要提醒大家的是，与沈从文密切相关的还有“沈从文的寂寞”这一概念，会针对这一概念进行出题，具体内容可在李凡文学正版群中领取。"},{"id":"134","stars":"★★★★★","title":"试分析沈从文的“反现代性”特征","body":"沈从文整体创作所体现出来的精神特质，是一个比“乡土”“抒情”“田园”等更深邃的世界，是个与他魂牵梦萦的湘西一样神秘，美丽，强悍，而难以常态规范的世界。沈从文的精神世界，是不属于，或者说，主要是不属于五四开创的现代思想文化的，具有一种“反现代性”的特征。\n\n一、沈从文“反现代性”的内涵\n\n中国的现代性，在工具理性的支配下，有两个特征：一是确立了以“进步”为指向的社会文化发展图式；二是将西方现代文明神圣化和理想化。“五四”以对中国传统文化的全面否定而建构起具体的西方化的现代性指标，使晚清开始的现代性追求趋于“定型”，现代性成为中国现代文化思想的主流。\n\n20世纪以来的新文学，其主流基本上就是在以西方为参照的现代性概念中致力于对中国现代性的探索和想象。但很明显，在这种以“西方”和“进步”为指南的现代性思潮中，沈从文的姿态是另类的。沈从文始终以“乡下人”的态度，对都市文明进行审视，以受老子哲学影响的“自然”来观照人性，抗拒现代性的“新”与“变”。\n\n需要注意的是，沈从文的“反现代性”，并不是抗拒现代性，如施蛰存所言，沈从文不是政治上的反革命，而是思想上的不革命。他不相信任何主义的革命能解决中国的问题。所以，与其说他是“反”现代性，不如说他是“非”现代性。沈从文存在的意义，除了审美以外，他选择中国传统文化另种资源（老子）而建立的与欧洲浪漫主义暗合的自然哲学精神，对以工具理性为特征的中国的现代性选择，应当是一种补充和丰富。也就是说，沈从文的“反现代性”，实际上是选择了另一种现代性。\n\n二、沈从文“反现代性”的表现\n\n（一）“乡下人”的观照姿态\n\n沈从文与都市的绅士自然格格不入，而与他的朋友，那些“生长在上海”的“农民文学家同革命文学家”，也不能融洽。在这种苦恼中，沈从文的自我苏醒了，他用一个特殊的概念“乡下人”-完成了自我想象\n\n“城市”与“乡下”这一对立的范畴，在沈从文的话语中，就是“文明”与“自然”的代称。“城市”所体现的现代文明，显然是中国晚清以来所追求的现代性，是以西方工业化、科学技术为标志的都市文化。都市文化讲求规范，追求效率；都市生活声色光电，车水马龙，喧嚣纷攘，富丽堂皇。城市的一切关系，都建立在以利益功利为原则的组织结构中，秩序井然，实际而冷。\n\n相反，“乡下”是原始的，自然的，未经规范的；一切生命，在此都遵循一种法则-自然的律令-生长，繁衍，淘汰。自然的律令，在沈从文的观念中，既是大自然中一切生物存在之“天命”，也包括人群发自本性的争斗，甚至残杀-人类的历史族群的繁衍、变迁。沈从文以“乡下人”自居，自然就是对以城市文明为代表的现代化的排拒。\n\n（二）以“自然”为尺度观照人性\n\n我们注意到，沈从文对待人性所秉持的尺度，不是现代的（也即以人道主义为核心的批判精神），也不是传统的正统（以仁、礼等儒家伦理规范的善），而是“自然”。沈从文崇拜狮子式的强悍，而强悍者，往往是自然淘汰中的优胜者。他写过很多兵和匪，或者有着兵匪般蛮悍性情的山民、水手。\n\n沈从文曾经自诩，他的创作，是建“希腊小庙”，“这神庙里供奉的是‘人性’”。然而沈从文所醉心的人性，并非启蒙主义强调的理性的人性，而是自然状态的人性。他“崇拜朝气，喜欢自由，赞美胆量大的，精力强的”，而对都市人雄性的“雌性化”，异化的道德，萎缩的生命力无情地嘲弄。\n\n都市人性的委琐，意味着现代文明对人性的异化。而“都市”所承载的民族现代化的使命，遂使沈从文对现代性深感忧惧了-“民族衰老了，为本能推动而做成的野蛮事，也不会再发生了”。\n\n（三）受到老子哲学影响的自然观\n\n沈从文对自然的追求，很容易使人联想到五四的浪漫主义思潮。然而，沈从文不曾受过卢梭的影响潮，但他对自然的崇拜与欧洲浪漫主义一样，有着理想主义的共同根源。不同的是，卢梭等欧洲浪漫主义，是由城市“返回”自然，是理性地寻找自然，而沈从文的生命本来就与自然是一体的。他的返归自然是出自直觉的。\n\n沈从文的返归自然，更多吸收了老子的社会哲学理念-“绝圣弃智”，随顺自然。虽然从现有的材料中，找不出多少对沈从文接受道家思想的可资佐证的依据。但是，沈从文作品所体现出的自然社会观，却与老子的思想有惊人相合的地方。他在叙述湘西苗民历史，对历代统治者粗暴“征蛮”，使湘西苗民惨遭杀戮的事实时，充满无奈的悲怆。而在《七个野人与最后一个迎春节》《长河》《湘行散记》中，也曾认为“官”和政府的“新生活运动”，给原本宁静和谐的湘西带去的，只有莫名其妙的扰攘、焦虑。\n\n（四）对变革抗拒，具有“保守”心态\n\n以自然观照生命，生命的存在就更多体现在“空间”而非“时间”中。自由浪漫的湘楚精神，也就跨越了千年岁月，像流淌不息的河水，永不枯竭，滋育着、长养着这块土地上一代又一代的人，文化，生命，与自然一道，获得了超越时间的永\n\n恒，所以，沈从文的文化思想与20世纪中国的主流思想显得很不一样，他不轻言“变”，对现代社会寄希望于“变”的普遍心态他不认同，向来态度偏于“保守”。\n\n沈从文对中国现代性话语中的“新”“旧”概念历来不接受，对现代性变革的真正意义也是怀疑的。这既源于道家的哲学思想，也源于他对“新”“变”空虚本质的洞察。\n\n［李凡说：沈从文的创作与“五四”时期以来的现代文学主流显得格格不入，具有一种“反现代性”的特征，这也是近年来高频考查的一个热点，需要注意的是，沈从文的“反现代性”，不是反抗现代性，而是对“五四”以来的“现代性”追求持怀疑态度的“非现代性”。这主要体现在沈从文的“乡下人”姿态、人性观、自然观和对待变革的态度这些方面。沈从文的“反现代性”体现出了对“五四”以来现代性追求的思考与反思，可以说是对中国现代性选择的丰富和补充。相关内容可以参考杨联芬《沈从文的“反现代性”-沈从文研究》，具体资料可以在李凡文学正版群中领取。】","keywords":"内涵“非”现代性 补充和丰富 表现“乡下人”的观照姿态以“自然”为尺度观照人性 受到老子哲学影响的自然观“保守”心态","note":""},{"id":"135","stars":"★★","title":"蒋光慈小说创作特点","body":"一、具有了强烈的宣传鼓动性\n\n蒋光慈上海工人武装起义后不到半个月，就完成了《短裤党》，较早地描写了工人运动中的共产党员与先进工人；大革命失败后，又写了《野祭》《冲出云围的月亮》，迅速反映了青年知识分子的分化，企图指出他们应走的道路。其中《冲出云围的月亮》中的王曼英作为大革命失败后的“时代女性”形象，是可以与茅盾、丁玲笔下的同类形象相比较的。由于强调对重大历史事件做及时反映，蒋光慈的作品就具有了强烈的宣传鼓动性，并特具一种历史沸腾时期昂扬的激情与艺术追求力。\n\n二、客观细致的描写手法\n\n由于缺乏对生活从容的观察思索与充分的形象化，蒋光慈的小说创作有些流于浮面。他在把笔伸向工农题材的同时，也在逐渐克服着自身的标语口号式倾向。最后写成的长篇《咆哮了的土地》。\n\n这里面的人物李杰，在同地主家庭展开激战、与张进德发生工作关系以及爱情纠葛之中，都能深一层地显示出他内心世界的复杂矛盾。青年知识分子在群众斗争中不断完善自身的线索，贯穿这个人物的始终，残酷境遇下的感情发展也入情入理。这对蒋光慈过去作品中常见的概念化是有力的校正，爱情的穿插，及结尾的光明处理，也并非牵强附会。艺术上，由过去主观、空洞的感情宣泄，一变为客观细致的描写手法，生活实感大大加强，长篇结构也略具匠心。应当说，这是一部有一定深度的、开创了农村革命题材与新人形象的作品。\n\n三、题材上表现革命风云，赞颂觉醒后的工农领袖\n\n如果把蒋光慈、洪灵菲等作家的创作道路，与稍后的“左联”五烈士中的小说家柔石、胡也频相对照，便会发现他们无一例外地都是转换中的初期无产阶级革命文学家：由早期的知识分子革命与恋爱的故事，转换成直接表现革命风云的题材；由塑造小资产阶级革命家的形象，到赞颂觉醒后的工农领袖。\n\n【李凡关键词：宣传鼓动性 客观细致的描写手法 表现革命风云】","keywords":"","note":"“左联”准备期间的小说，主要是以蒋光慈为代表的。这一时期的作品自觉地运用文学来为革命呐喊，在急剧的变革年代里，以特殊的热情，写出“思想大于艺术”的具有重大社会效果的作品，是他们共同的特点，而这也是现实斗争的需要，对此我们要有所了解。"},{"id":"136","stars":"★★★","title":"丁玲小说创作有什么特点","body":"丁玲是“五四”以后第二代善写女性并始终持女性立场的作家。她以第一个革命女作家的姿态，打破了冰心、庐隐等因思想创作上的某种停滞所带来的沉寂，丁玲的小说创作，主要具备以下特色：\n\n一、细腻、大胆而又富有饱满感情地刻画人物复杂心理，\n\n丁玲一步入文坛，便带来一种细腻、大胆而又富有饱满感情地刻画人物复杂心理的特色，她受到一些法国现实主义作家的影响，在某些地方又不禁使人想到刚写出《沉沦》时的郁达夫，一定意义上可以说丁玲的《莎菲女士的日记》是郁达夫所开创的描写知识分子“时代病”的自我伤感小说的总结与结束，对莎菲的心理描写，也代表了丁玲的主要艺术成就。\n\n二、捕捉到过渡时代的过渡性历史人物的特殊矛盾，使作品具有了深刻的认识价值。\n\n在进入“左联”时期以前，丁玲的创作思想已经开始发生变化。中篇小说《韦护》在流行的“革命加恋爱”的公式中，表现了作家独特的观察与发现：中国士大夫家庭出身的觉醒了的新知识分子，一面为时代潮流所推动，成为新兴无产阶级运动的先驱，一面却在灵魂深处保留着充满浓重的士大夫气息的“旧我”的一角。丁玲敏锐捕捉到这一过渡时代的过渡性历史人物的特殊矛盾，使作品具有了深刻的认识价值。\n\n三、具有女性敏锐观察力和思想穿透力。\n\n丁玲参加了“左联”之后，努力脱出主要描写知识阶层的老路，开始试写表现工农大众的作品。但即便是转向农村题材，也依然显示出丁玲的特色，她以其特有的女性敏锐观察力和思想穿透力，“写出平常人所着眼不到处”。作者一贯独立思考女性的生活遭遇，一支善于描写女性的笔，又回到了她能够触摸得到的人物身上，她这方面的才能，到了抗战根据地时期，得到进一步的发挥，并与新的生活、新的人物结合在一起。\n\n四、强烈的叛逆意识\n\n丁玲小说创作中具有一以贯之的特色，那就是强烈的叛逆意识。在她的小说中，叙述话语带有强烈的个性色彩，内容是心灵世界的流动，而目标则往往指向社会批判，它们是个人叙事与社会批判的紧密结合。作家常常喜欢采用的“我”这一叙事角度和日记的文体又加强了这一特征。\n\n五、鲜明的女性主义色彩\n\n作为一个女性作家，丁玲一直对女性命运给予极大的关注，表现出了鲜明的女性主义色彩。她是20世纪中国文学史上最早有着成熟的女性话语与独特的女性风格的作家。她独创性地刻画出了梦珂、莎菲、伊萨、阿毛、丽嘉、曼贞贞贞、陆萍等女性形象，组成了独特的女性形象系列，具有丰富的历史、文化内涵，使她们成为中国现代文学女性形象画廊中一组不可忽略的风景。","keywords":"刻画人物复杂心理 历史人物的特殊矛盾 敏锐的观察力 思想穿透力 叛逆意识 女性主义","note":"“左联”青年作家的涌现，标志着现代文学在创作上真正结束了“革命文学”的时代而向前迈进了。而在这些左翼作家之中，丁玲十分特殊，她不但是第一个革命女作家，还以《莎菲女士的日记》开女性主义文学先河，因而在当下更受关注。因此，对于丁玲相关内容，我们要重点掌握。"},{"id":"137","stars":"★★★","title":"从20年代到80年代，看丁玲不同时期创作特征的流变（26陕西师范大学）","body":"丁玲是现代文学史上卓有成就的作家，其小说创作不但忠实地记录了一个青年知识女性的心灵历程和追随时代的踪迹，而且还典型地反映了20年代、30年代之交中国现代文学从文学革命到革命文学的转型以及稍后革命文学自身的发展。丁玲不同时期创作特征的流变，主要有以下方面：\n\n一、早期个性解放时期\n\n丁玲以《莎菲女士的日记》为代表的早期作品，以书写女性命运为中心，重视心理描写和情感抒发，显然受到了法国现实主义文学（尤其是福楼拜的《包法利夫人》、莫泊桑的《一生》等作品）对现代社会虚伪文明的批判、对女性命运的深切关注、对爱玛式女子的描写以及心理剖析技巧的启发，也受到了歌德的《少年维特之烦恼》感伤型浪漫主义抒情风格的影响。从中国现代文学自身的源流上来看，这些作品也是郁达夫所开创的以《沉沦》为代表的新文学中浪漫感伤小说的余绪。\n\n二、30年代左翼文学时期\n\n1929年，丁玲的思想发生了变化，其早期小说中的个性主义主题开始为集体主义的革命主题所替代，代表性地体现了20年代、30年代之交中国现代文学从文学革命到革命文学的转型。此期丁玲处在转换途中，其思想急剧“左转”，其创作在强化社会性和革命性的同时，却在相当大的程度上忽略了艺术的独创性。这也显示了早期普罗小说、左翼文学提倡唯物辩证法创作方法的特点和问题。\n\n丁玲力图拓宽视野，突破自身情绪宣泄的局限，创作了以革命者为主人公的长篇小说《韦护》。《水》这部作品标志着丁玲创作的明显转变，也显示了30年代左翼文学的发展。之后，丁玲沿着《水》的道路，写出了一系列表现工农生活的作品，如《消息》《法网》《奔》《夜会》等，但这些作品显然已失去了丁玲令人瞩目的创作个性与特色。\n\n三、延安时期\n\n丁玲在延安时期的小说一方面保留了丁玲小说长于人物心理透视的艺术手法，另一方面又加强了对现实的批判力量。既从社会革命的角度关注时代变迁和阶级斗争，又从思想革命的角度继续关注反封建意义。《母亲》以作家自己的母亲为原型，展示了母亲曼贞那一代放开小脚的女性寻求自立、追求真理的坎坷历程，以封建大家庭的一个侧面透露出了整个时代变迁的\n\n信息。《我在霞村的时候》则表现了“我”对年轻的贞贞的同情，揭示了在民族矛盾上升为时代主要矛盾的背景下反封建的艰巨性，丁玲的这种创作路向延续到40年代后期，在《太阳照在桑干河上》中有着集中、突出的呈示。\n\n四、新中国成立到80年代\n\n建国之后，由于政治方面的原因，丁玲一直到80年代才重返文坛，她这一时期的创作特征，也主要体现在《杜晚香》《牛棚小品》和《在严寒的日子里》这些晚期作品之中。\n\n一方面，她以一个党员作家对社会的高度责任感，强调歌颂光明，服务社会主义建设，并努力通过小说创作来实践这一主张；另一方面，她创作了以《牛棚小品》为代表的一类作品，真实生动地记录了她对人生的哲学思考和智慧探索，从人性出发凸显了老而弥坚的主体精神和自由意志，唱出了逆境中求生存的凯歌。尤其是她的后一类作品突出表现了她的创作个性，那“武将军”的豪迈洒脱和“文小姐”的细腻才思都是她晚年创作个性的典型体现。\n\n总体看下来，丁玲是一个艺术个性非常鲜明的作家。她的创作个性跟随时代的前进而前进，跟随革命文学的发展而发展。","keywords":"个性解放时期 女性命运 心理描写 情感抒发 左翼文学时期 集体主义 革命主题 延安时期 人物心理透视 对现实的批判力量 新中国成立到80年代 强调歌颂光明 服务社会主义建设 主体精神自由意志","note":"对于丁玲的了解，大部分同学都集中于《莎菲女士日记》《太阳照在桑干河上》这两部作品上，而很少说对于丁玲的人生轨迹有一个全面的了解。其实，丁玲的生活和创作轨迹很能代表现代进步知识分子的思想转变，是一个非常重要的样本，因而，在当下的考查中，对于丁玲的关注度也是比较高的。这道题，我们主要是结合丁玲各个时期的作品，去分析丁玲创作的转变。相关内容可以参考李美皆《“晚年丁玲”研究》、罗守让《丁玲在新文学史上的意义和地位。》"},{"id":"138","stars":"★★★","title":"《莎菲女士的日记》的艺术成就","body":"《莎菲女士的日记》对现代女性的人生困境和情欲心理作了深刻开掘，它也因此成为早期同类作品的代表作，给丁玲带来更大的声名。这部作品的艺术成就，主要表现在以下方面：\n\n一、塑造了莎菲女性这一典型形象\n\n（一）莎菲女士形象特征\n\n（1）对封建礼教的背叛，对追求“真的爱情”、个性解放的无限憧憬。\n\n莎菲的形象是丁玲早期作品所塑造的叛逆、苦闷的青年知识女性形象系列中最成功、突出的典型。莎菲在个性主义浪潮的冲击下背叛旧礼教，大胆走出家门，她渴望爱与欲的满足，要求“享有我生的一切”。\n\n（2）重感情更爱幻想、狂想，在爱情与欲望追求上具有矛盾性\n\n一方面，莎菲欣赏苇弟的善良、忠厚，又不满于他性格的平庸、怯懦；另一方面，她倾慕南洋阔少凌吉士的漂亮仪表和高雅风度，又鄙视他市侩主义的卑劣灵魂。大革命失败后的特殊环境，小资产阶级在追求幻灭后的内心骚乱，这些，决定了莎菲执拗地寻见人生的意义而又无出路，鄙视世俗又不时感到有沉入纵情声色中的危险，重感情更爱幻想、狂想，在爱情与欲望的追求上显露出复杂、矛盾的特征。\n\n（二）莎菲女士这一形象的意义\n\n（1）觉醒青年彷徨状态的真实写照\n\n“莎菲女士是‘五四＇以后解放的青年女子在性爱上的矛盾心理的代表者”。作品着重刻画的是莎菲在性爱上的矛盾心理，但这一心理反映出了时代投射在一部分知识女性身上的阴影。莎菲的矛盾和苦闷，是经历过个性主义思想洗礼的觉醒青年在时代低压下陷入彷徨状态的真实写照，因而折射出了社会历史内容；其对爱情追求的失落流露出来的是对整个社会的绝望的情绪。\n\n（2）包含着深刻的历史批判性，带有强烈的女权主义色彩\n\n当莎菲最后“决计搭车南下，在无人认识的地方，浪费我生命的余剩”的时候，她的个人追求已经无法逃脱失败的命运。莎菲的“病态的性格”是个性主义者的悲剧，包含着深刻的历史批判性。莎菲的形象带有强烈的女权主义色彩，在一定意义上开了中国女性主义文学的先河。\n\n二、出色的心理描写\n\n《莎菲女士的日记》以第一人称日记体的形式，饱含感情地对女主人公的内心世界作了深入、细腻的揭示，显示出了作者擅长心理描写的出色才能。主人公在叙事、回忆时，时而思索、感慨，时而想象、幻想，时而又出现闪念、欲望等，于是，这位年轻的知识女性细腻、敏感、多愁善感又任性孤傲的复杂个性就被表现得十分真切自然。小说对人物心灵的大胆剖露，\n\n产生了惊世骇俗的阅读震撼，被看做是“女性的《沉沦》”。一定意义上可以说丁玲的《莎菲女士的日记》是郁达夫所开创的描写知识分子“时代病”的自我伤感小说的总结与结束。\n\n三、日记体的形式\n\n在《莎菲女士的日记》中，丁玲为了深入地、直接地展开女主角的内心矛盾，选择了日记体这一形式，采用内聚焦型限制视角，聚焦于人物的心声，向内探究莎菲个人的情绪，抒诉女主角内心深处灵与肉的冲突，情欲与思想的冲突，以及最后灵怎样战胜肉，尊严怎样战胜欲望，真实怎样战胜虚假。小说深入和细致地描写了女主角在情欲面前所受的诱惑，并抒诉了自己的忏悔。\n\n四、女性主义立场\n\n《莎菲女士的日记》中，莎菲女士对爱情的大胆的追求就是这个时代女性意识的一种大胆表达，在莎菲女士追求爱情的过程中，体现了女性对独立人格的追求和对自身社会平等地位的捍卫。\n\n不过，虽然莎菲女士对爱的追求是大胆而执著的，但是在爱情来临的时刻又开始退缩。小说正是通过对莎菲女士在对爱的追求和拒绝中矛盾心态的表达，呈现出一个追求个性独立的女性主义者在这个压抑时代的尴尬与痛苦。\n\n五、以小见大\n\n《莎菲女士的日记》通过一个叛逆女性矛盾心理的自我倾诉，真实地反映了“五四”以后到大革命失败前后，部分青年悲观彷徨而又努力寻找真理、寻找光明的精神面貌，记录了他们在走向集体主义之前的痛苦的足迹，从一个侧面映照出社会的状况。作品披露了残酷的斗争在青年的心灵上造成的深切的创伤，客观上是对于黑暗社会的暴露，同时也极其激愤地透露出对于反动势力和卑俗世道的诅咒和挑战。","keywords":"对封建礼教的背叛 矛盾性 意义 真实写照 女性主义文学先河 心理描写 日记体的形式 女性主义立场 以小见大","note":"《莎菲女士的日记》是丁玲前期的代表作，很能体现丁玲的创作特点，同时也是一代人的写照，更是自我伤感小说的总结与结束，其塑造的莎菲女士这一形象更是具有开女性主义先河的意义，其艺术成就也更多地体现在对莎菲女士形象的塑造上，大家要有所了解。正因为《莎菲女士的日记》具有如此独特的地位，因而在名词解释中出现的频率也不低，大家要注意一下。"},{"id":"139","stars":"★★★","title":"张天翼小说创作有什么特点","body":"张天翼是“左联”优秀的讽刺小说家，这一时期少有的文体家。他尤其熟悉都市的中流社会和下层市民的生活，具有敏锐的感受力。张天翼在现代文学史上几次率先打破左翼创作的僵化局面，其功绩不可低估。\n\n一、致力于革命文学创作，更具有当代性\n\n早期张天翼的小说，较快地摆脱了短篇集《从空虚到充实》中的感伤情绪，致力于初期的革命文学创作。底层人民的挣扎和抗争，呻吟着，号叫着，跃入了他的作品。对于当时的读者来说，一接触到这种硬朗的血泪画面，顿觉耳目一新，也被张天翼那种新鲜流动的口语描写所折服。与同时代一些作家相比，他更了解城镇市民的生活，他的小说更具当代性。\n\n二、鲜明的讽刺艺术\n\n从1934年到抗战前，张天翼的大批讽刺小说的产生，标志着他的创作的大转机，即讽刺艺术个性的形成。他由此提出了反虚伪、反庸俗、反彷徨的基本讽刺主题，以及三类讽刺性人物：虚伪、狡诈的地主官僚形象，动摇、庸俗的小知识分子、小公务员、小市民形象，愚昧不幸的城乡底层人民形象。\n\n三、实验多种小说体式和语言\n\n除了还未及提出如华威先生这样重大的典型外，张天翼创作的独特价值这时已大体具备。他是一个极有创造活力的作家，不仅致力于作品题材多方面的开拓，而且进行短篇小说体式的多种试验，以及糅合各类方言创造新鲜流动的口语化文学语言的尝试。\n\n四、抓住人物的细小特点写出大的性格\n\n张天翼的小说注重写人，在人生一瞬中透视出丰厚的人物性格史，勾勒人物的线条明净而不驳杂，善于狄更斯式地提炼习惯动作与用语，抓住人物的灵魂，廓大其细小特点，写出大的性格。\n\n五、重视叙述角度的灵活多变\n\n张天翼的短篇小说，重视叙述角度的灵活多变，以动作、情绪作为叙述结构的内在依据，淡化故事情节，在有所省略中传达出叙述的节奏、动势和力度，形成横向结构的片断性、速写性很强的，富有戏剧张力的小说形式。","keywords":"革命文学 讽刺艺术 多种小说体式 细小特点写大性格 叙述角度灵活多变","note":"张天翼是“左联”优秀的讽刺小说家，也是这一时期少有的文体家。他的文学价值受到了鲁迅等人的肯定，在艺术手法和叙述方式上都取得了很高的成就，张天翼在三十年代就已成名，而四十年代更是凭借《华威先生》取得了进一步的成就，之后也会涉及相关题目，需要大家对此有所了解。"},{"id":"140","stars":"★★","title":"沙汀早期小说创作有什么特点","body":"沙汀与张天翼一样，作为“左联”新人而登上文坛，鲁迅说的“选材要严，开掘要深”，成为沙汀创作的座右铭，他这时期的小说，反映了左翼文学的深化过程，他的早期小说创作，主要包括以下特征：\n\n一、刻写旧中国农村黑暗生活，有着农民幽默气质\n\n沙汀接受了茅盾的建议，放弃了“印象式的写法”，采用接近茅盾的叙述体式，把笔锋转到极为熟悉的四川农村社会上去，且展露出讽刺光彩，虽然沙汀更大的创作成就是在下一个文学时期，但这阶段写出的《丁跛公》等，已经表现出沙汀是一个最能刻写旧中国农村黑暗生活，有着农民幽默气质的小说家。\n\n二、具有时代、阶级烙印的黑色基调\n\n沙汀的小说作品散发出泥土的气味，沉闷、闭塞、阴暗，不是一抹轻淡凄婉的田园颜色，而是从四川农民饱受军阀中世纪式的暴政里浓缩出来的，具有时代、阶级烙印的黑色基调。每一篇小说都是骇人听闻的，由四川特殊的黑暗返照了旧中国普遍的黑暗。\n\n三、具有诗的韵味\n\n与抗战时期沙汀最富喜剧色彩、讽刺最泼辣的小说相比，沙汀这时的暴露小说的特色之一是颇有诗意。这是指那种不露声色的文韵，感情内涵凝重，以及精选艺术细节，擅长于气氛、场景的渲染等等。\n\n四、刻画人物功力深厚\n\n沙汀的小说，在这时期已经显出他刻画人物的深厚功力。他特别能写出一批四川农村基层政权中的反动角色，用的是白描手法，抓住反面人物充满丑与恶的性格要害，如伪善、凶狠、颟顸而又不自知等，精选细节，从深处挖掘人物带有心理内容的谈吐与动作细节，重复地深化人物，加上一点点适量的人物历史回叙，结尾又添一笔余味深长的点染，这便是沙汀式的刻写人物的技法。\n\n五、浓厚的地方色彩\n\n沙汀小说又以浓厚的地方色彩闻名，出奇的是他主要不靠画出川西北风俗图卷的办法，而是从人物、环境的复杂关联中，处处描摹四川的世态人情。应当说，他的讽刺艺术与鲜明的民族风格，到40年代则更为成熟了。","keywords":"幽默气质 黑色基调 诗的韵味 刻画人物 地方色彩","note":"沙汀在三十年代和四十年代都取得了不俗的文学成就，所以他这两个时期的创作的变化可能会让大家分析，大家要特别注意，沙汀这一时期的小说主要刻画中国旧农村的黑暗生活，具有浓厚的地方色彩，这一时期的创作，也为其四十年代讽刺小说创作做好了铺垫。"},{"id":"141","stars":"★★","title":"叶紫小说创作特点","body":"最能掺和着自己的血泪，从正面表现农民的苦难、觉醒与对生活的期翼，叙事风格也近似茅盾的，是“左联”后期的青年作家叶紫，他的作品，主要有以下特点：\n\n一、真实表现农民生活和斗争\n\n叶紫的大部分小说都是真实表现大革命失败前后洞庭湖畔农民的生活和斗争的。在“左联”和30年代众多的农村小说中，叶紫以能揭露农村阶级压迫的尖锐性著称，他写的是火和血的事实。以土地革命风暴、工农红军的反“围剿”为重大背景，描写几代农民的性格及其成长，这在现代文学史上还属少见。\n\n《丰收》和茅盾的《春蚕》、叶圣陶的《多收了三五斗》，同样是写“丰收成灾”，但画面何等严酷、逼真。云普叔这个勤劳、守旧的老农，在无情的现实面前，终于清算了自己在抗租前后的糊涂思想。类似这种觉醒的老一代农民，还有《电网外》里的王伯伯、《向导》中的刘妈等。他们都是在中国一场场波澜壮阔的农民运动里挺立起来的。\n\n二、全力描写站在时代潮流内外的新旧农民\n\n全力描写站在时代潮流内外的新旧农民，是叶紫创作的一大贡献。其中包括在父子两代的思想矛盾中突现出来的青年农民形象，如《丰收》与它的续篇《火》中的立秋、《杨七公公过年》中的福生。《星》里的梅春姐由一个饱受摧残的普通青年妇女，成长为农民运动的中坚力量。这里写的妇女解放，比起“五四”时期的文学来有了新的现实作为生活基础。\n\n三、“两分法”的人物设置、结构方式\n\n叶紫的小说提供给人们的是“黑白分明的铅画”：他的故事总是描写地主与农民之间不可调和的阶级对立，他的人物也只是具有两种感情的强烈的爱与憎，他把生活强化了，也简化了，这种“两分法”的人物设置、结构方式，对以后的农村题材小说有重要影响。\n\n四、洋溢着理想的光辉\n\n叶紫小说同时洋溢着理想的光辉，充满昂扬的音调，又不回避斗争的残酷，自有一种悲壮的美。笔触阔大，有时不免粗疏，但却是在那个时代的风雨中孕育成。“这就是作者已经尽了当前的任务，也是对于压迫者的答复：文学是战斗的！”","keywords":"真实表现 新旧农民“两分法”理想的光辉","note":"叶紫不仅仅是左麗作家，还亲身参与革命运动，他的父亲和姐姐也是因农民运动而牺牲，因而他对农民的斗争与生活有十分深刻的认识，故此他的小说多表现时代潮流下农民的真实生活。而在创作上，他受左麗作家影响很深，叙事风格和茅盾很是接近，整体洋溢着理想的光辉，大家可以从这些角度切入，去了解叶紫的整体创作特色。"},{"id":"142","stars":"★★★","title":"萧红小说创作风格是怎样的","body":"萧红是一个文学创造力特出的天才的女作家，她的小说创作，主要具备如下特征：\n\n一、文化形态本真、原始\n\n萧红小说的文化形态因为本真，因为原始，所以在表现传统的落后文化对人的戕害，及对中国社会滞后发展的作用上，在展现并于生与死、关于空间的永存、时间的永动等生命体验方面，提供了一部形象的文学样品。\n\n二、独特的女性书写\n\n萧红具有一个女作家所特有的细致和敏感，常在人们不留意处切入，常在人们自以为熟知的事物上往复滑动，努力从中觅得一点光和色，一点真谛，一点只属于她自己的感知。她虽然也写野蛮和愚昧，但她审视的是淳朴的人类天性；虽然也写缺陷和丑陋，但她挚爱着乡村生活内蕴的美质。她甚至以纤细的笔触细腻地描写了农民对家畜的感情。小说对人物心态、风土习俗都写得细腻感人，特别是对妇女悲剧命运的描写方面，更显得敏锐和大胆。可以说，萧红在文学创作中把女性特有的感知方式推向了一个不易逾越的高度。\n\n三、清丽空灵的儿童视角\n\n在萧红的作品中，还具有一种清丽空灵的儿童视角，在柔婉中蕴涵着优郁悲凉。在生命的最后余光里，萧红怀恋着已逝的童年光阴和遥远的故土，心灵充满了一种不能拂去的寂寞之感。因此，她在《呼兰河传》中以儿童视角描述故乡，表达了作者历尽人生坎坷后对童年生活的皈依，饱尝漂泊流离之后对故土家园的思念。她以儿童视角描写小团圆媳妇、冯歪嘴等各个人物，用含泪的微笑描述呼兰河这个北方小城。萧红独特的女性书写才华，使她的作品拥有了难以抗拒的艺术魅力。\n\n四、散文化的抒情小说体式\n\n萧红打破了小说与散文的界限，创造出了有特色的散文化的抒情小说体式。她在内容取向上喜用怀旧题材，在叙述方式上多用限制叙事，在情感评价上擅用心理视角，这种表现方法上的创新，导致了叙事成分的削弱和抒情成分的增加。与此相关，小说在结构上也呈现出非情节化、非戏剧化的散文化的特征，统领作品的线索不再是线性的时间关系和因果关系，而是作者的心理情感逻辑，这使其小说在放任之中获得了结构性和统一感。","keywords":"文化形态 女性书写 儿童视角 散文化抒情小说体式","note":"萧红在小说主题表达和形式探索上都做出了卓越的努力，虽然创作时间不长，但她诗化的小说对后世的影响越来越大，不排除会进行考查的可能性，大家要特别注意。萧红的小说创作特征，我们需要重点关注的是其女性书写、儿童视角和散文化小说体式，此外，小说中本真、原始的文化形态我们也要留意一下。"},{"id":"143","stars":"★★★","title":"试分析萧红《呼兰河传》的思想主题及艺术特色（26东北师范大学）","body":"《呼兰河传》是萧红的代表性长篇自传体小说，用回忆性的散文笔法描写了寂寞的呼兰小城以及生活在那里的人们。这\n\n部作品的思想艺术特色，主要表现在以下方面：\n\n一、思想内容\n\n（一）对故乡的眷恋\n\n《呼兰河传》虽然是在香港写就，但1937年底，萧红在武汉就已写出了《呼兰河传》很有气魄的头两章，表现了铺展鸿篇的雄心，其中描绘的画面和抒发的情感，在她1937年8月写的散文《失眠之夜》中已经初见轮廓：她彻夜思念着家乡那极高的蓝天和银子一样的白云，后园的茄子花、黄瓜和“带着露珠一齐来了”的朝阳。\n\n因此，《呼兰河传》是作者梦回呼兰河的产物，在思乡念土情感的驱动下，她以细腻抒情的笔触回忆了自己寂寞的童年生活，描写了家乡敬畏鬼神的风俗画面，叙述了祖父、小团圆媳妇、有二伯和冯歪嘴子等人的平凡的人生悲喜剧。\n\n（二）对封建思想和礼教习俗毒害的暴露，对民族劣根性的批判\n\n《呼兰河传》以呼兰城的公众生活和环境为中心，辐射出生活的种种方面。在表达对故乡的眷恋的同时，也揭示了我国农村在封建统治下的种种弊病及黑暗，尤其是充分暴露和批判了传统的封建思想和封建礼教习俗对人们的毒害；在对故乡人物执着、坚韧性格的挖掘和赞美的同时，对附着在他们身上的愚昧、麻木的民族劣根性也进行了的深刻批判。“房子都要搬场了，为什么睡在里边的人还不起来，他是不起来的，他翻了个身又睡了”。这一惊心动魄的细节对他们极度轻视生命价值的动物股的生存方式作出了极其深刻的概括。在这样的风土人情中，小团圆媳妇被虐杀的悲剧是必然会发生的。\n\n二、艺术特征\n\n（一）独特的儿童视角\n\n《呼兰河传》比萧红早期的乡土小说更丰富之处，在于其中处处有抒情主人公“我”的直接叙述。萧红将种种感受通过童稚活泼的口语，时而天真讲述，时而惊呼低叹，有时含着泪花微笑，有时悲悯地谐谑，并经常穿插机敏的议论，不论是写火烧云还是写后花园，写日常生活还是写习俗传说，都反映了作者对乡土人情的感受，并且将“我”的感受和呼兰河苦难同胞们的感情融为一体，生发出感人肺腑的悲歌。这样既能直抒作者的情怀，又能描述人物的感情。第二章写各种风俗，第四章写院中穷人生活场景都是这样。如写跳大神，在“满天星光、满屋月亮”里，静听送神鼓声，浮想联翩、悲歌激越，“我”与不幸人们的心声汇成一片。\n\n（二）散文化的结构\n\n《呼兰河传》在结构上呈现出非情节化、非戏剧化的散文化的特征，统领作品的线索不再是线性的时间关系和因果关系，而是作者的心理情感逻辑，这使其小说在放任之中获得了结构性和统一感。\n\n这部长篇没有单一的主人公，没有贯穿始终的情节，开头一章专写东二道街和街上的大泥坑，接下来也是以东西二道街、十字街和小胡同为线索，并写不同职业、不同家庭的人们的生存状态，以及民风民俗。第三章写对祖父的回忆，第四章写“我”家的院子，第五章写小团圆媳妇的悲剧命运，第六章写有二伯，第七章写冯歪嘴子。虽然结构上看起来有些散漫，不同的场景和人物、故事却被一种共同的感伤情绪笼罩，共同映射出作者的寂寞和乡愁，形成一种如诗如画的氛围。\n\n（三）口语化、自然美的语言\n\n为了适应小说的儿童视角，《呼兰河传》的语言呈现出感性、稚拙的特点，显得非常“孩子气”，具有口语化、自然美的特征。如她这样来写河面之大和河水之清的：“那河太大了，等我走到河边上，抓了一把沙子抛下去，那河水简直没有因此而脏了一点点，”萧红实用反复、通感等艺术手法，用感性、稚拙的语言对那些与感性经验相关的具体视觉形象的不加修饰的、原生态的呈现，具有很强的抒情功能。","keywords":"思想内容 对故乡的眷恋 民族劣根性 艺术特征 儿童视角 散文化结构 口语化、自然美","note":"萧红的小说创作最具代表性的便是《生死场》和《呼兰河传》这两部作品，相较于前者，后者的名气似乎更广一些，在考查中出现得也更多一些。萧红女性作家的身份，以及《呼兰河传》中独特的儿童视角，都让这部作品和可能和林海音的《城南旧事》联系起来进行考查，大家要注意这一点。相关论文可以参考秦林芳《童年视角与（呼兰河传）的文体构成》。张宇凌《论萧红（呼兰河传）中的儿童视角》、张国祯《民族忧痛和乡土人生的抒情交响诗-评（呼兰河传）》，具体资料可以在李凡文学正版群中领取。"},{"id":"144","stars":"★★","title":"萧军小说创作特点","body":"一、具有刚猛的反抗精神\n\n萧军青年时当过士兵、下级军官，长期长活在社会底层，具有刚猛的反抗精神。与萧红从侧面表现帝国主义侵略下的人民的缓慢觉醒不同，萧军的小说写得尖锐、雄浑、遒劲。《八月的乡村》正面刻画了陈柱司令、铁鹰队长、游击队员李三弟、崔长胜等新的农民形象。画面少修饰，结构是短篇连缀式的，更接近生活的原型。全书响彻着英雄主义的音调。\n\n二、展现了本世纪初东北人民由农村自发反抗到城市有组织斗争的历史道路\n\n除了代表作《八月的乡村》外，萧军还有《羊》《江上》等短篇集，塑造了东北下层人民质朴而坚韧的灵魂。以后又用近二十年之力，写出宏大的《过去的年代》，展现了本世纪初东北人民由农村自发反抗到城市有组织斗争的历史道路。其中，《八月的乡村》就叙述了一支共产党领导下的抗日游击队在极其艰苦的条件下同日寇、伪满军进行血与火的斗争，以及在抗战的血腥中艰难成长的历程。小说生动地描写了“作者的心血和失去的天空、土地、受难的人民，以至失去的茂草、高梁、蝈蝈、蚊子，搅成一团，鲜红的在读者眼前展开，显示着中国的一份和全部，现在和未来，死路和活路”，表现了东北人民誓死保卫家园的坚定决心，具有重要的认识价值和思想意义。\n\n三、对东北地区的“民魂”做历史深度、广度的开掘\n\n《八月的乡村》中，萧军在编织小说故事情节，塑造人物形象的过程中，加入了许多实实在在环境描写的元素，使读者在阅读小说的时候能够品味到小说浓浓的东北乡土气息。小说中蕴涵了许多东北特有的环境意象。不管是莽莽的森林，崎岖的山径，流淌的河流等自然景观，还是顽强的抗战决心，坚定的必胜信念，质朴的乡土情思等情感体会，在作者的笔下都变得形象具体，有血有肉了。\n\n同时，萧军在作品中对在东北特异环境中形成的“胡子”的特异性格做了精心的刻画，并展开了对各种类型的农民、妇女、知识分子不同性格的广阔描绘，企图对东北地区的“民魂”做历史深度、广度的开掘，小说以题材的独创性、地方色彩的浓郁、生活画面的广阔、人物性格刻画的历史深度，对现代长篇小说艺术发展做出贡献，理应受到更多的重视。","keywords":"反抗精神 历史道路 东北地区“民魂”","note":"在中国现代作家之中，萧军是少有的几位当过兵的作家，在军阀军队从军的经历既养成了他的性格，又让他认清了现实的黑暗，这些都影响了其创作特征，无论是反抗精神，还是其对东北人民抗争经历的展示，都受到了他从军经历的影响，大家要注意一下。"},{"id":"145","stars":"★★★★","title":"京派小说的创作特点是什么（26南京信息工程大学、厦门大学）","body":"一、显现的是乡村中国的文学形态\n\n京派小说所显现的是乡村中国的文学形态。在工业文明缓慢侵入长江以北广袤的、衰颓的宗法农业社会，近代的激进政治急剧地冲刷着传统文化堤岸的时候，京派小说作家从中国相对沉落的地区，由“常”观“变”，提出了他们的乡村叙述总体。\n\n这些小说家虽然不乏学院派的文化精英，却热衷于发现各自的平民世界：除了沈从文的湘西世界，还有废名的黄梅故乡和京西城郊世界、芦焚的河南果园城世界、萧乾的北京城根的篱下世界等等。而城市的描写，则作为与乡村世界对立的人生，被纳入到京派宏大的叙述总体之中。\n\n二、统一的审美感情是诚实、从容、宽厚的\n\n京派小说统一的审美感情是诚实、从容、宽厚的。林徽因在《大公报文艺丛刊小说选》的《题记》中，归纳这一派别的创作特征，认为他们“趋向农村或少受教育分子或劳力者的生活描写”，而“诚实的重要还在题材的新鲜，结构的完整，文字的流丽之上”。\n\n这种态度使他们善于发掘普通人生命的庄重和坚忍，特别能写出女性包括少女的纯良。在新旧变革的潮流里，由追寻逝去的美，而表现出一种积极的怀旧气息。文化的保守主义使其避开当年激烈政治斗争和直接的文学功利目的，以间离现实斗争为代价，取得某种文化批评的自由立场。它是主张个人的、充分个性化的文学，不是感情的狂放宣泄，而是情绪的内敛，理性的节制。\n\n三、比较成熟的抒情体和讽刺体样式\n\n京派为现代小说提供了比较成熟的抒情体和讽刺体样式。小说的抒情性表现为作家主观体验的融入、纯情主人公的塑造、自然背景及象征的运用、散文化的笔调等等，京派小说注意自然生命之流注，注意气氛之营造。虽然讽刺体一般认为不是京派的特长，但实际上，沈从文的《八骏图》《顾问官》，废名的《莫须有先生传》，芦焚的《百顺街》，均在政治讽刺之外，开辟出一条哀伤的、寓意的世态讽刺和风俗讽刺的路子来。\n\n四、意蕴深厚的文化小说\n\n京派小说还是一种意蕴深厚的文化小说。京派针对现代社会的道德沦丧，在作品里加强了对民族性格心理的探求深度，&#x6301;久地将“民族品德的消失与重造”这样严肃的“五四”国民性主题继承下来，不断对传统文化和民间文化发出呼唤，寻求回应。小说注重“回忆”及逝去的美和眼前的现实进行对照，对平凡的人生命运投入极大的兴趣和审美的眼光，使得美由绚烂归于平静无奇，归于自然调和的形式。这样，使京派小说经由稳重开放的学院文化，整合了传统与现代、雅与俗等各种因素，成为特具中国文化风貌的文学。","keywords":"乡村中国 诚实、从容、宽厚 抒情体和讽刺体样式 意蕴深厚","note":"京派小说是三十年代一个非常重要的小说流派，在内容、审美、体式等方面为中国小说增添了许多新的内容，对中国小说发展产生了非常深远的影响，是我们考查的重中之重，大家一定要仔细全面掌握。同样，“京派小说”这一概念世是名词解释中经常出现的一部分内容，大家要注意重点关注。"},{"id":"146","stars":"★★★★","title":"废名后期小说创作特点","body":"一、对人生丑陋一面的有意规避\n\n理解废名，首先要读懂他所虚构的世界。读懂废名虚构的世界，可以从《桥》切入。与一般的乡土小说相比，《桥》不仅反映乡村风景、风俗之美、人情之美，更透露出一种独有的人生态度和体悟生命的方式。在这里，废名早先对乡村小人物不幸的同情，已让位于对人间的“真”与“梦”的编织。小说构筑了一个化外的牧歌世界，宁静、谐和，波澜不兴。并非是乡村式的社会就没有冲突，单举书中的史家奶奶和长工三哑叔来说，他们都是饱经沧桑的人，但作者写来却只突出其自重、自爱，自然适意，返朴归真的性情和生活的形态。而茂林修竹仿佛也懂得这种纯真的境界，天人合一，物理和人理达到完美的和谐。这种对人生丑陋一面的有意规避，正反映了作者对人间纯美的向往，于乱世中有意采取执拗的童心视点，\n\n从人生困窘到乐天知命，所谓冲淡为衣，悲哀其内，已经不是纯粹的童心，却很容易与主张虚静的任机随缘的禅宗观念合拍，更何况废名是真正读经参禅打坐的。\n\n二、“作为抒情诗的散文化小说”\n\n相对来说，废名的小说样式恐怕要比他提供的对于人生的文学性阐释更为重要。他的“作为抒情诗的散文化小说”总是尽量地淡化戏剧型的故事，重在以简僻的留有涩味的词句来托出诗境。废名说：“旧诗的内容是散文的，其文字则是诗的”，“新诗要别于旧诗而成立，一定要这个内容是诗的，其文字则要是散文的”。这里谈的虽是诗歌，实质也是他把小说的灵魂理解成“诗”，而将小说的文字写成散文的夫子自道。所以废名的小说同散文可以互换，无严格界限。\n\n三、在情绪上、炼句的讲究上、结构的片断性与留空白上，都与传统文学有千丝万缕的联系\n\n废名的小说在情绪上、炼句的讲究上、结构的片断性与留空白上，都与传统文学有千丝万缕的联系。这就是废名一再申明的用唐绝句的方法写小说的意思，它一方面造成了对小说成规的部分颠覆，另一方面却创造了那种随叙述者的意识流动转换视角，插入心理性的跳跃词语，分解情节却扩散出多方面的含义的文化味浓厚的小说样式。它还极富理趣，能将西方的现代哲学思想与东方的禅宗思想两相调和，反映了京派对中国文化的特殊立场。","keywords":"规避人生丑陋 散文化 与传统文学联系","note":"废名是京派小说中的一位代表作家，主要特点便是他小说散文化特征，在考查时，可能会结合废名的具体作品比如《桥》来让大家分析，大家要特别注意。同时，从废名到沈从文再到汪曾祺，形成了一条完整的乡土抒情小说发展脉络，贯穿了整个中国现当代文学史，有些学校会针对这一点出题，大家也要注意一下。"},{"id":"147","stars":"★","title":"萧乾小说创作特点","body":"一、“忧郁者的自白”\n\n萧乾早期的小说，都包含着“城中两个世界”的结构。虽然他没有沈从文、废名那种乡村经历，但他的第一步确实是从“京派”的文化氛围中走出来的。他是凭着一个城市中的“乡下人”的独特身份，从“童年视角”出发，写下了《篱下》《矮檐》等一系列短篇。单以这些中国语汇里人们熟知的“寄人篱下”“在人屋檐下，怎敢不低头”所能暗示的意象和主题，就可以理解作者所要抒发的人间炎凉、冷热和不平等的遭遇了。而小说中无一例外的坚忍的“妈妈”形象（寡母或者弃妇），自然包含作者对自己母亲的追忆。萧乾此类自传色彩很强的小说，都是“优郁者的自白”。自白，是主观感受很浓的文体，\n\n但经过作者的过滤、陶冶、设计了独立的叙述人，好像是在讲述与己有关的别人的故事。忧郁者的感伤是强烈的，但又是健朗的、充满生气的。这样就加深了他小说的诗味。\n\n二、批判性很强，并具备反宗教倾向\n\n一组宗教题材小说的出现，标志了萧乾批判社会的笔力的加强，这是指《皈依》《昙》《鹏程》《参商》各篇。他在北新书局当小伙计时读过的社会科学书籍，当时左翼的存在，固然是他的文化批判的锋芒偏离纯京派的一个原因，但究竟他自小屈辱地接受基督教“恩惠”的具体经验是决定性的。而萧乾的“反宗教”的姿态，并不涉及宗教本身，只是他的贫富世界的形象化的延长罢了：暴露中外“吃教者”的伪目善面，替和自己一样的“遭侮辱者”大鸣不平。此外的介入社会斗争的小说，还有表现“一二·九”运动中青年思想变化的《栗子》，以东北救亡运动为背景的《邮票》。这些作品离京派的味道最远，不过仍留下了作者思想动荡不拘的自叙的面影。\n\n三、对爱情的体验，构成小说的感情基础\n\n萧乾的爱情小说，从处女作《蚕》到他唯一的长篇《梦之谷》，显然都是他经历的写照。他对爱情的体验，几乎构成他一切小说的感情基础，绝不仅仅是对爱情题材起作用。萧乾表明了京派发展本身拥有的多样性。晚出的京派作家，承接了京派传统和时代新意这样两个方面的促进力，京派的松散和宽大，也允许每个作家独立地向前。","keywords":"“忧郁者的独白”反宗教倾向 爱情的体验","note":"萧乾的小说显示出了京派小说的多样性，在创作上坚持了京派审美感情和抒情体式的同时，也有自己的个性，比如有一定的反宗教倾向，出题时可能从这一点出发，将萧乾与沈从文他们作对比，大家要特别注意。"},{"id":"148","stars":"★","title":"芦焚小说的创作特点","body":"一、突出自己的乡村文化背景\n\n芦焚与沈从文、废名一样，突出自己的乡村文化背景。他也以“乡下人”“土人”自居，说：“我是从乡下来的人，说来可怜，除却一点泥土气息，带到身边的真亦可谓空空如也。”当然，这不过是一个滞留城市却未能忘情于乡村出身的“叙述人”的自认而已。这叙述人看到一片北方的“废园”世界，为我们创造出“大野上的村落，和大野后面的荒烟”这些特定的中原文学意象。\n\n对于芦焚，“知识者的还乡”就不仅是《春梦》里的青年尤楚和《掠影记》里的大学老师西方楚，这些人物真有一次回乡的过程，实际上，他的全部作品都有这样一种潜在的“精神还乡”的结构。\n\n二、擅长印象式的素描\n\n芦焚的小说与沈从文、废名一样，擅长印象式的素描。不过芦焚在写风景和写人时，自然界的荒凉与人事的辛酸是紧密交织的，在他的身上已闻不到纯粹的牧歌气味了。芦焚的小说中有一种中国箫笛的绵长的悲音，充满诗意，“诗意是他的第一个特征”。由此，他的小说同散文也大都无截然的区分，可自然汇入京派的乡土抒情体而毫无愧色。\n\n三、人物阶级分明\n\n芦焚在京派中是有他的艺术个性的。他笔下的农村人物贫富的清晰度很明显。上人就是上人，下人就是下人，下人里面贫苦的、愚昧的、朴素的、狡黠的，各占据自己的位置。《人下人》所写的叉头老叔，是一个忠于主人却被全村人嘲弄仇视的农村长工形象，作者仔细描写了他的痛苦的心理。这部小说在芦焚小说里是最像小说的一篇。\n\n四、讽刺更加犀利\n\n芦焚的讽刺更加犀利。由于芦焚的抒情性与讽刺的掺合，就增添了奇幻、神秘的气氛。经作者点染的荒村、弃园、废宅，都是极具寓意的。他的某种程度的寓言化、象征暗示性、对现实的荒诞感受，正是他的世态讽刺的特色。\n\n五、叙述风格独特\n\n芦焚小说的叙述更讲究。这里包括总体的“回叙”的品格、风俗的旁观叙述人的确立，以及多样的叙述角度的熟练运用。&#x82A6;焚的沉思默想的叙事风格，是他作为京派小说家审美风格的具体体现，这风格到40年代更有进一步的展示。","keywords":"乡村文化背景 印象式素描 阶级分明 讽刺加重 叙述风格","note":"芦焚还有一个笔名为师陀，他以这一笔名在四十年代创作了《果园城记》，并由此在四十年代文学史上占有一席之地，大家要特别注意。芦焚身上有京派作家的共性，也有自己的个性，所以很适合来和其他作家对比出题，大家留意类似的题目。"},{"id":"149","stars":"★★","title":"初期海派小说的特点","body":"最初的具有“现代质”的海派小说是由操新文学体而向市民读者倾斜的作家来写的。从接近市民这点来看，它们是接续着鸳鸯蝴蝶派的文学商业性传统再来突围。白话小说度过了它的先锋时期，开始向通俗层面回落，于是，原先的纯文学作家如张资平、叶灵凤等，嗅闻到这种气息，便脱离社会小说的轨道，带头“下海”，成为新海派作家。初期海派小说，主要有以下特点：\n\n一、是新文学的世俗化和商业化\n\n中国现代消费文化环境的形成，集中表现在30年代的上海。在这之前，上海外滩的改造，工商经贸的世界化、现代化带动了以南京路为代表的四大公司百货业、游乐业、大光明电影院、百乐门舞厅的消费方式，四马路口现代书报业、出版业的发达，现代印刷厂的滚筒飞转给海派文学带来新的契机。初期海派小说受市民审美趣味的牵动，与政治性、社会性强烈的主流文学拉开距离。它表现市民的衣食住行、人际关系，相当地生活化。小说注重可读性，迎合大众口味，是一种“轻文学”。\n\n二、过渡性地描写都市\n\n海派后来的发展，能在城市罪恶之中发现美，但初期对城市的认识是肤浅的，一支笔虽然已经伸进了新式饭店、赌窟、跑狗场等消费场所，可现代文明的体验不足，显露狂放颓荡有余，这样，沉醉于物质享乐又感到负罪，心理上是扭曲变态的。\n\n三、首次提出“都市男女”这一海派常写常新的主题\n\n性爱小说成为海派表现现代人性的试验场，也是归宿。由于西方唯美主义的影响，海派小说作家在作品中增添了当时理解的“性自由”的色泽，遂造成一种“新式的肉欲小说”。\n\n四、重视小说形式的创新\n\n因为要表现的上海业已是一派洋气，因为上海的追新猎奇的风貌，在较快较早地输入20世纪各种外国文学新潮（尤其是唯美派和象征主义）的过程中，改变叙事切入的角度，尝试心理的、象征的、新鲜大胆的小说用语和多种多样的表达方式，便成为这批作家的时尚。这当然就为以后的“新感觉派”的登场，准备好了条件。","keywords":"世俗化 商业化 描写都市“都市男女”小说形式的创新","note":"初期海派小说还比较稚嫩，与后期“新感觉”派小说还有很大的区别，但已经显露出了自己的特色，是白话小说向通俗层面的回落，显示出了关注都市生活的通俗化特点，大家对此要有所了解。作为与“京派”并称的“海派”小说也是名词解释中的常客，十分重要，大家要关注一下。"},
