说”创作潮流兴起的标志。小说围绕着一位忠诚于党的教育事业的班主任张俊石的工作，塑造了谢惠敏和宋宝琦两个品质不同的青少年形象，揭示了“文化大革命”的愚民政策给青年一代造成的思想窒息和心灵扭曲，谢惠敏式的革命“好孩子”形象下潜藏着的愚昧无知，尤其令人震惊。因此，小说在最后发出了“五四”时期鲁迅曾经喊过的“救救孩子”的呼声。\n\n1978年8月，卢新华的短篇小说《伤痕》发表。小说以动情的笔墨描写了母女两代人的生离死别，揭示了极“左”思潮“血统论”的荒谬本质，以及对人们精神和肉体戕害。这篇作品虽然在情节设计和人物心理刻画上不无幼稚矫情之处，但它的模式比较典型，对极“左”政治对人的摧残伤害的揭露非常符合当时的政治环境，也非常适合同类叙事的需要。“伤痕小说”便得名于这部作品。\n\n二、两部作品都是以经历过动乱岁月的青少年为主人公，表现动乱时代对他们的心灵戕害。\n\n《班主任》对深受文化专制主义、愚民政策毒害的女中学生谢惠敏，做了犀利透彻的剖析；《伤痕》讲述了“血统论”盛行给少女王晓华造成的人生和心灵悲剧。愚民政策和“血统论”，在“文革”中甚嚣尘上，危害甚广，而且都贴着将革命“纯洁化”的标签，迫使人们不由自主地接受之服从之。这两篇作品，直指“文革”和极左思潮的要害，揭露“文革”给干家万户造成的伤害，牵动了广大读者的心灵，唤醒人们被压抑已久的感情和思考。\n\n三、《班主任》和《伤痕》都是针对刚刚结束的“文革”进行揭露和批判\n\n在这两部作品发表的当时，如何评价“文化大革命”还是一个非常棘手的问题。一方面，“两个凡是”遭到冲击，“实是检验真理的唯一标准”的大讨论方兴未艾；另一方面，“文革”仍然被描述为“伟大的胜利”，对其进行质疑和否定仍然是阻力重重。因此，《班主任》和《伤痕》问世具有冲击思想禁区，呼唤重新评价“文革”的巨大意义。","keywords":"“救救孩子”荒谬本质 心灵戕害 揭露和批判 冲击思想禁区","note":"在艺术上，《班主任》与《伤痕》这两部作品可能较之后出现的其他作品略逊一筹，但其意义却是十分重大的，在当时那样一个特殊的时期，这两部作品冲击思想禁区、呼唤重评“文革”，具有开风气之先的意义。同时，在思想上，这两部作品也表现了“文革”对人们的戕害，引发了人们的思考，对此我们要有所了解。"},{"id":"332","stars":"★★★","title":"谈谈你对“知青小说”的认识","body":"关于“知青文学”的定义，较普遍的说法是，第一，作者曾是“文革”中“上山下乡”的“知识青年”；第二，作品的内容，主要有关“知青”在“文革”中的遭遇，但也包括他们后来的生活道路。与“伤痕文学”等一样，这个概念专指叙事体裁（小说，或纪实性叙事作品）的创作。\n\n一、“知青文学”的特征\n\n（一）与50年代罹难的“复出”作家相似，“知青文学”也常带有明显的自传色彩。他们与“复出”作家有相似的意识，即书写与国家社会政治紧密关联的个人经历，有超出表现个人命运的重要价值。\n\n（二）与“复出”作家不同的是，“知青小说”在小说形态上和内在情绪上，并不热衷于以个体的活动来联结重大历史事件，也较少那种自以为已洞察历史和人生真谛的圆满和自得，“知青文学”的代表作品中，有更多的惶惑，和产生于寻求的不安和焦虑。\n\n二、知青文学的发展经历了三个阶段\n\n（一）第一阶段是指1977年至1979年间的一批知青“伤痕”小说，这在一定程度上也是整个新时期文学的先声。它们通过对“文革”苦难的集体言说，促进了当代文学和社会意识的变革。\n\n知青“伤痕”小说也有其自身的缺陷，一是艺术上的幼稚粗糙，难以经得起时间的检验；二是缺少对作为历史主体的自我的审视，而无力触及“伤痕”背后的社会、历史与人性根源，这决定了它的存在不可能持久。\n\n（二）随着反思文学的逐渐展开，1979年后的知青文学也进入了其整个发展过程当中的第二个阶段。知青“反思小说”&#x5728;思想和艺术上开始走向冷静深沉，感情倾诉的成分减少，理性思辨的色彩增浓。就表现内容而言，这一阶段的知青小说不再局限于对““文革”伤痕”的简单展示，在表现生活的深度和广度上有了较大拓展；在艺术审美上，小说文体意识开始觉醒。\n\n（三）从《棋王》开始，知青小说进入到其第三个阶段，一个多样化的时期。或者也可以这样说，虽然知青生活题材仍然大量存在，但探求的主题则完全超出了这一特殊人群的命运本身。从体裁上看，之后的知青小说创作主要以长篇为主。长篇小说的出现，体现出知青写作在反映生活的深度和厚度上，都有明显增强。","keywords":"“知识青年”“文革”中的遭遇 自传色彩 惶惑 不安和焦虑 知青“伤痕”小说 知青“反思小说”多样化的时期","note":"“知青文学”和“伤痕文学”“反思文学”在概念上有些许不同之处，后二者体现的是一种创作潮流，而前者更多地是从创作主体与主要内容去界定。也正因此，“知青文学”经历了知青“伤痕”小说、知青“反思”小说和多样化时期三个阶段，这其实是与整体创作思潮变化有关的。同时，“知青文学”具有自传性色彩，表现了一代“知识青年”的惶惑不安，这些特征我们也要注意一下。除了论述题之外，“知青文学”也有很大的可能以名词解释的形式进行考查。"},{"id":"333","stars":"★★★★","title":"谈谈你对“反思文学”的认识","body":"“反思文学”是继“伤痕文学”之后的第二个创作潮流。1979年2月《人民文学》发表茹志鹃《剪辑错了的故事》，是反思文学的起步标志。比之“伤痕小说”的局限，这部作品对极“左”历史进行了上溯，挖掘了50年代农村“大跃进”运动的灾难根源，检讨了近40年来党群关系的演变，并提出了现实警告：如果再一次发生战争，老百姓还会像过去那样支持军队吗？以这部小说的出现为标志，新时期小说进入了“反思小说”阶段。相较于“伤痕小说”，“反思小说”在思想和艺术上都有很大的不同，具体表现在以下方面：\n\n一、较为深邃的历史纵深感和较大的思想容量\n\n与“伤痕文学”相比，“反思文学”具有较为深邃的历史纵深感和较大的思想容量，揭露和批判极左路线、反对官僚主义，揭示社会和历史悲剧，呈现和剖析悲剧人物的命运遭际，刻画悲剧人物性格是它们共同具有的鲜明特色，不过“反思文学”更加理性。但也因为“反思文学”作家的理性主义色彩，他们相应地失去了“伤痕文学”那种刻骨铭心的忏悔与绝望，在某种程度上回避了揭露“文化大革命”的灾难性实质，他们“反思”的历史范围也局限在一定的政策之下，而且大多数是以苦尽甘来的“大团圆”为结局。\n\n二、突现故事的政治背景和故事情节\n\n“反思文学”将几十年历史真相昭示于人，整合出一部政治运动迫害知识分子的历史，传递出前所未有的关于社会主义\n\n社会的复杂信息，加强了对历史与现实的尖锐的批判意义。\n\n三、中篇小说为主，对小说艺术手法进行了探索\n\n由于要在每一篇作品中浓缩几十年的故事，使“反思”小说大多倾向于篇幅的拉长，约定俗成的短篇小说的容量无法展开情节，而结构长篇小说还没有充裕的时间和心态，于是作家们都不约而同地采取了中篇小说的形式。另一方面，“反思”小说又与七八十年代之交的对小说艺术手法的探索相呼应，这一时期的许多“反思”作品，都开始尝试采用以人物的意识活动为叙事线索的结构和表现方式，这给中国当代小说的叙事传统带来了令人耳目一新的变化。\n\n四、两种不尽相同的叙事立场\n\n“反思文学”的叙事立场主要有两种，较为普遍的是将个人的苦难与民族的苦难联系起来，从而使个人的苦难具备了超越个人的普遍的启蒙意义。另一种叙事方式是有意无意地从民间的视角和立场反思中国民主革命和历次政治运动中存在的悖谬与悲剧现象。","keywords":"第二个创作潮流 历史纵深感 较大的思想容量 突现政治背景和故事情节 中篇小说为主 艺术探索 两种叙事立场","note":"这部分内容我们首先需要明确一下的是“反思小说”的概念，需要注意一些关键时间节点与关键作品。相较于“伤痕文学”，“反思文学”在思想深度与艺术探索上都更进一步，因而也涌现出了更多地代表作家和代表作品。大家在记忆时，可以结合相关作家作品加深理解。"},{"id":"334","stars":"★★★","title":"试阐述张贤亮小说创作的特色","body":"一、关注农村农民与知识分子，注意表现历史给人的创伤和新时期人的遭际\n\n张贤亮的叙事领域大致可分为两个向度：一是20世纪六七十年代荒谬的历史留给人的创伤；二是走出六七十年代历史创痛的人们在新的时代肉体和精神的种种遭际。前一向度的书写按叙事对象又可分为两类：一是农村和农民，二是指向知识分子。\n\n张贤亮的主要创作成就体现在以知识分子为反思主体的“反思”小说上，他的反思小说细致、“逼真”地展示了生活情境和人物复杂心理活动，动人的爱情故事成为他作品的重要结构因素；而知识者的懦弱、委琐，与底层女性的无私、热烈，形成鲜明对比。\n\n不同于其他作家倾力于总结历史经验教训，张贤亮集中于知识分子自我灵魂的内省与拷问，即从历史、哲学、道德的高度反思中国当代知识分子的苦难历程，让主人公在灵与肉的搏斗中经受熬炼和洗礼而达至新的人生境界。\n\n二、雄辩的气势，充满力度和诗情的笔触，专注于人物心理刻画剖析，为小说创作提供了新鲜经验\n\n张贤亮的小说对西北风俗画的表现、对荒蛮而贫瘠的物质环境的描绘，笔触充满力度和诗情；在人物心理的刻画和剖析中，采用多种艺术手法，深入人物的潜意识领域进行分析，展示出立体的、富有层次感的心理世界；以大段的富有哲理性的议论和色彩强烈的主观印象的铺展，形成富于雄辩的气势，富有感染力地表达人生的经验，强化小说的主题，这些都对小说创作提供了新鲜的经验。\n\n三、多极化的主题\n\n张贤亮小说中的情欲书写值得关注。民间情怀、生命欲望，唯物论的哲学探索，构成了张贤亮小说主题指向的多极。在小说《男人的一半是女人》中，有大胆的情欲描写。虽然唯物论者的探询是精神主线，但小说展示的女性肉体的生命美感、劳动热情、生存欲望让人印象深刻，在中国当代文学的美学探索中，具有先声夺人的效果。在80年代中后期，出现了大量描写性爱场景、反映肉体醒觉的小说。与这些小说相比，张贤亮小说中的情欲不再作为精神极度简陋下的低等生命元素，而是精神探索的前奏，也是思想的基础。\n\n四、具有模式化与概念化的缺憾\n\n张贤亮小说有两个明显的缺憾：一是模式化倾向，多以“才子落难，佳人搭救”的模式结构小说；二是由于作者追求作品的思辨色彩，所以小说创作在具有思想深度的同时，未免失之于理性说教和概念化。","keywords":"两个向度 主要创作成就 新鲜的经验 情欲书写 模式化倾向 理性说教和概念化","note":"张贤亮的“反思”，不是反思历史的教训，更多地像是在反躬自省，拷问的是作为知识分子的自己，这在“反思小说”创作之中十分具有独特性，大家可以从这一点去切入理解张贤亮小说创作的思想内容。而张贤亮在艺术上表现出雄辩的气势，擅长情欲书写，也体现出了“反思文学”艺术探索的一个方向。"},{"id":"335","stars":"★★★★","title":"王蒙在现当代文学史上的地位","body":"一、思想敏锐、犀利，对百年现代中国中的人作出了自己的思考\n\n80年代末90年代初，王蒙继续在“季节”系列长篇小说中延续着对知识分子灵魂审视和批判的主题，记录建国以来王蒙这一代知识分子的心路历程，审视和批判的对象从“父亲”一代过渡到作家自己这一代。由“审父”而“自审”标志着王蒙在这一主题上所达到的新的高度。其中《恋爱的季节》写50年代初期，《失态的季节》写50年代后期，《踌躇的季节》写60年代中后期，《狂欢的季节》写70年代初期，加上2003年发表的写70年代到90年代的《青狐》，王蒙的这一系列小说既是他的“精神自传”，同时也是他对20世纪中国知识分子心灵史的探索。作为一个充满历史责任感和忧患意识的作家，王蒙从政治和现代普通人、政治和现代知识分子的复杂关系的角度对百年现代中国中的人作出了自己的思考。\n\n二、将西方意识流的创作技巧引入到小说创作中，形成了独具魅力的东方意识流\n\n不仅思想敏锐、犀利，王蒙也是中国当代小说艺术的“探险家”。早在写作《夜的眼》时，他便尝试将西方意识流的创作技巧引入到小说创作中，并通过随后的《春之声》《风筝飘带》《海的梦》《布礼》等一系列小说，形成了独具魅力的东方意识流。在这些小说中，王蒙有意中断小说的情节链，避开对小说人物过多的外部描写，以文本时间的变化为纲要，通过人物心理的闪回、停顿、放大、延长、对比、重复、独白、对话，将写作的焦点对准人物的“内宇宙”，展示人丰富、复杂的内心世界，以人的内心世界折射时代和社会的变迁。\n\n和西方意识流小说相比，王蒙小说的人物意识的流动明显经过了理性的梳理，同时也不排除情节和叙述者的介入。在借鉴西方意识流创作技巧的同时，王蒙善于运用隐喻和象征的结构，通过对富有文化内涵的故事的叙述，使小说在现实性的基础上获得丰富的文化哲学意味。《杂色》和《坚硬的稀粥》是其中具有代表性的作品。\n\n三、80年代最重要的幽默作家\n\n对西方黑色幽默的“黑色的喜剧性”和“浓缩的荒诞性”以及中国传统相声“包袱”技巧的吸纳，使王蒙小说在辛辣的幽默中间蕴含着一种诙谐的抒情，戏谑性的智巧中洋溢着深谙世故人情的智慧之美。\n\n王蒙是20世纪80年代最重要的幽默作家，他80年代创作的小说几乎有一半可以归于幽默的名下，而且他的幽默风格有多种多样，既有《买买提处长轶事》这样的戏谑式的幽默，也有《葡萄的精灵》这样的智性感悟式的幽默；既有《沙拉爆炸》这样自娱性的幽默，也有《来劲》这样自嘲性的幽默。因此，有评论者认为王蒙“把中国当代小说中的幽默，大大地推进一步，完成了从狭义的古典幽默向广义的现代幽默的飞跃”。\n\n四、高超的语言文体成就\n\n王蒙善于创造新词、新的句法来适应新的创作技巧。自由活泼的联想，词、词组、句子的并列和对比，跳跃的句式结构和长短句相间，使王蒙的叙述语流能够及时捕捉小说关注焦点“向内转”后人物的意识流动和心理转换。王蒙小说的语言特征还体现在“多声部的说话艺术”上，“每个人都在小说里滔滔不绝的独白，谁也压不倒谁的声音”。他力求把“诗、戏剧、散文、杂文、相声、政论”等要素融合进小说里去，形成了一种杂语喧哗的独特文体景观。\n\n王蒙是同代人中最有艺术探索精神的作家之一，他对当代小说艺术的探索和实践是多方面而且卓有成效的。他的创新影响了中国当代小说艺术的创新。","keywords":"知识分子心灵史 东方意识流 最重要的幽默作家 高超的语言文体成就","note":"这道题的实质与“王蒙的文学史成就”是一样的，都是在考查王蒙为中国文学史发展做出的贡献。所以大家在分析时，要注意结合王蒙小说的特征，紧扣他的开拓创新意义。王蒙在十七年时期就已经开始了创作，而在新时期更是取得了更加瞩目的文学成就，并且对当代文学史产生了重要影响，因而针对王蒙出题的可能性非常高，大家要重点关注。王蒙相关的名词解释中，我们首先要注意一下其代表作品如《蝴蝶》《春之声》等，但最为重要的还是其“东方意识流”这一个关键概念。"},{"id":"336","stars":"★★★★","title":"试分析王蒙的小说创作特征","body":"一、理性思辨色彩\n\n王蒙的小说淡化历史创伤记忆，更多地关注历史灾难过程中人物的心灵现实，展示人物在特定境遇中的内心情感。对人的精神世界的解剖拷问，使他没有把历史灾难的责任简单地归结为某个人或某场政治运动，而是从历史的主客体双方寻找原☒因，找到彼此可以谅解的地方。这种宽容的态度，使他对历史不进行简单的道德评断，而是着意于揭示历史灾难背后所蕴涵的深刻哲理和教训。所有这些，形成了王蒙反思小说的特有的理性思辨色彩。同时，其自身人生磨难的经历，也使他的作品呈现出强烈的历史感和沧桑感。\n\n二、“东方意识流”\n\n在艺术上，王蒙采用了类似西方“意识流小说”的表现手法，这是其作品令人瞩目并引起争论的原因所在。不过，有所不同的是，西方“意识流”受到精神分析学和其他非理性主义哲学思潮的影响，重在表现人物潜意识世界的活动，常通过人物的内心独白、自由联想、意识跳跃来展示人物的内心世界，以意识的自然流动来结构全篇。而王蒙对西方“意识流”的借鉴，只是基于方法、技巧层面上的接受，对于小说的结构起了很大的作用，但其表现的内容还是“社会历史场景”而非“潜意识场景”，因为这种区别，所以王蒙的小说又被称为“东方意识流”小说。\n\n三、情节纪实性和自传色彩浓郁\n\n王蒙作品中少有引人入胜的故事，多有平直的情节线索和人物的人生轨迹，常将一个颇有经历的文化人的社会历史感悟直接填充在叙事之中。王蒙小说的话语特征体现为小说中大段的议论文字，这种旁叙语言汪洋恣肆，塑造了性格鲜明的叙事人形象，而王蒙小说的艺术变化集中体现在旁叙话语的变化中。\n\n☒四、关注不同时期的政策反思者\n\n王蒙笔下出现了很多政策反思者，在政治问题与文化问题的困扰中，这些人物遭遇坎坷，但仍然怀有政治理想。从林震到钱文，王蒙耐心地按时代讲述文化人的共和国记忆。在讲述中，问题的焦点逐渐深化，前期的政策问题经由80年代初期知识分子的苦难记忆，演变为对知识分子身份归属的关注。王蒙具有更清醒的政策透析能力，在政策范围内最大限度呈现了话语狂欢与颠覆，也对知识分子的身份疑虑作了初步呈现。\n\n五、善于运用隐喻与象征\n\n在借鉴西方意识流创作技巧的同时，王蒙善于运用隐喻和象征的结构，通过对富有文化内涵的故事的叙述，使小说在现实性的基础上获得丰富的文化哲学意味。\n\n六、幽默、诙谐\n\n对西方黑色幽默的“黑色的喜剧性和“浓缩的荒诞性”以及中国传统相声“包袱”技巧的吸纳，使王蒙小说在辛辣的幽默中间蕴含着一种诙谐的抒情，戏谑性的智巧中洋溢着深谙世故人情的智慧之美。王蒙是20世纪80年代最重要的幽默作家，他80年代作的小说几乎有一半可以归于幽默的名下。\n\n七、娴熟运用现代汉语\n\n王蒙在小说语言上，对现代汉语的娴熟运用同样引人注目。他善于创造新词、新的句法来适应新的创作技巧。自由活泼的联想，词、词组、句子的并列和对比，跳跃的句式结构和长短句相间，使王蒙的叙述语流能够及时捕捉小说关注焦点“向内转”后人物的意识流动和心理转换。\n\n八、“多声部的说话艺术”\n\n王蒙小说的语言特征还体现在“多声部的说话艺术”上，“每个人都在小说里滔滔不绝的独白，谁也压不倒谁的声音”。&#x738B;蒙力求把“诗、戏剧、散文、杂文、相声、政论”等要素融合进小说里去，形成了一种杂语喧哗的独特文体景观。","keywords":"理性思辨色彩 历史感和沧桑感 东方意识流 纪实性和自传色彩 政策反思者 隐喻和象征 对现代汉语的娴熟运用 多声部的说话艺术","note":"王蒙可以说是80年代初期最重要的作家之一，同时他也在这一时期的小说创作艺术探索中做出了突出的贡献，因而在考查中出现的频率非常之高，我们要重点关注一下。其中，思辨色彩、“东方意识流”等更是在考查中频繁出现，尤其是“东方意识流”，我们要重点关注。"},{"id":"337","stars":"★★★★★","title":"谈谈你对王蒙的“东方意识流”小说的认识","body":"在艺术上，王蒙借鉴了西方“意识流”手法，创作了一系列“意识流”作品，如《布礼》《夜的眼》《风筝飘带》《蝴蝶》《春之声》等。但王蒙对于西方“意识流”的借鉴只是基于方法、技巧层面，其表现内容与西方“意识流”小说还有很大的区别，故被称为“东方意识流”。具体来说，王蒙的“东方意识流”小说主要具有以下特点：\n\n一、在表现技法上，王蒙极着力于写人的感觉印象。\n\n西方意识流小说写的感觉印象，往往记录纯粹的五官感觉与印象，而王蒙对“感觉”有自己的独特理解，他写的感觉印象不是杂乱无章、远离理性的，而是既真实贴切，又往往蕴含着理性的永恒的力量。同时，王蒙亦采用内部分析与内心独白手法，其内部分析手法运用纯熟，内心独白样式独特而多样-他的内部分析往往与外部描写相交融，有时与传统小说写心理的手法极为近似。\n\n二、在结构方面，王蒙写的意识流小说有许多也有东方美学的烙印。\n\n西方意识流小说大多是心理结构，情节相当淡化，几近无情节。而王蒙的意识流小说是在心理结构中巧置情节，情节并未消失。如《布礼》与《蝴蝶》写的均是主人公历次磨难的内伤。前者是忽前忽后的时序可逆型结构，后者是忽此忽彼的空间放射型结构。两者都呈现出相当典型的意识流小说的结构形态。然而两者也都有情节与人物性格的发展，它们在许多小节中或明或暗、或强或弱地存在着。\n\n三、王蒙的意识流小说大多写常态的人或人的常态，这与西方意识流小说往往写变态的人或人的变态明显不同。\n\n西方意识流小说产生于第一次世界大战之后。当时西方世界非常态的生活条件造就了大量的非常态-变态的人。孕育于此种社会环境的西方意识流文学，自然地也就把这种人作为自己作品的主人公。王蒙写的大部分意识流小说笔下的人物虽大多遭受重压却从未被压扁、变形。他们亦有消沉的瞬间，却从不弃绝整个人类与社会。他们追求爱情，却没有一个是色情狂。他们虽然是普普通通的常人，但也都是健康的人，因而支撑起来的也是一个健康的社会。\n\n四、王蒙小说人物意识流动的态势也与西方意识流小说不同。\n\n西方意识流小说的人物一般是变态的、病态的、乃至狂态的，其意识流动有如汪洋大海，航道不清，莫测深浅，虽有主导主题的控制，但也时或偏离，四方飘荡。王蒙小说中人物的意识流动，或如潺浸小溪，清澈澄明，或如人工运河，多加整直，而较少曲折。不论人物的思绪如何上天下地，穷尽两间，也不管其幻象如何怪异，均没有离开明晰的理性意识的统摄。\n\n五、王蒙的意识流小说并未抛却、甚至可以说相当重视描写外界的物质环境和人物的外部行为。\n\n王蒙的小说都是既面向主观世界，亦朝向客观世界，既探寻人的内心世界的奥秘，也描绘现实生活的图景，为我们提供了一个空前广袤、巨大的艺术空间，任我们神游、陶醉。事实上，王蒙的意识流小说是有意识地、自觉地把对社会现实反映的焦点，凝聚于人物的内心世界，并消融了内、外面之差。它是扎根于现实主义的沃土之上的意识流文学之花-东方意识流。","keywords":"感觉印象 东方美学烙印 常态的人 人的常态 意识流动态势 外界物质环境 人物外部行为","note":"王蒙“东方意识流”的特征，是在与西方意识流文学的对比中体现出来的。具体来说，则表现在王蒙关注感觉印象，注重情节，多写常态的人等方面。这一方面是受到了中国文学传统的影响，另一方面也是归因于当时的社会环境。这部分内容，我们要掌握。相关内容可以参考李春林《王蒙与意识流文学东方化》、叶玉芳《东方意识流》等，具体资料可以在李凡文学正版群中领取。"},{"id":"338","stars":"★★★","title":"谈谈茹志鹃《剪辑错了的故事》的艺术风格","body":"茹志鹃《剪辑错了的故事》是反思小说的开山之作，它的艺术特征，主要包括以下内容：\n\n一、立足现实，选取宏大题材\n\n《剪辑错了的故事》一改往日讴歌的风格，以现实为基础，以一个历史亲历者的角色与角度，对历史与现实进行了深刻的反映与反思，对当时给国家与人民带来严重影响的“大跃进”时期的所作所为进行了深刻的展现。在这里，作者摆脱了以往选题上的“小”，转变为后期题材上的“大”，揭露出一个自古以来一直存在的社会问题-如何处理“官”与“民”的互动关系，如何保持新中国成立前，党与人民群众血肉相连的密切关系。小说中，作者以深沉、凝重的语言表达出了这一重大历史事件，以愤懑的沉重心情对以甘书记为代表的官僚主义进行了猛烈的抨击与谴责。\n\n二、关注普通的“小人物”\n\n在《剪辑错了的故事》中，作者继承和发扬了《百合花》的创作风格，作品中的人物仍然是普普通通的“小人物”。但在这篇作品中，她塑造了一个弄虚作假，欺上瞒下，丢弃了党的光荣传统的基层干部甘书记的形象。作者以激愤的心情谴责了甘书记亵渎党的优良作风的卑劣行径，有力地揭示了虚假浮夸和瞎指挥等极左思潮给党和国家带来的巨大损失。\n\n三、用意识流方法结构小说\n\n《剪辑错了故事》开拓了新的叙述方式，摒弃了传统小说的结构方式，采用意识流方法来安排小说情节结构，打破了正常的时空顺序，跳跃式地把过去和现在、现实和梦幻组接为一体，从而对建国以来左倾思潮和路线危害我国农村社会主义建设正常健康发展的历史做了深刻的反思。作者一反现实主义小说注重描绘环境、编排故事的老传统，深入表现主人公老寿瞬息万变，处于流动状态中的意识活动，由此再现主人公心理现实的演变过程。这种意识流方法的采用对表现生活、塑造人物和深化主题都起到了很好的作用。\n\n四、侧重心理描写\n\n《剪辑错了的故事》没有采取人物塑造的传统表现手法，而是着重描绘人物的内心活动，展现人物丰富的内心世界。如作者采用意识流动的方法，对老寿的内心进行直接的剖示披露。通过老寿的浮想联翩和思绪流动，展现了他丰富的内心世界，揭示出他对患难与共的干群关系的由衷向往，对某些干部践踏党的优良传统的极大愤慨。\n\n五、诙谐讽喻，笑中带刺的文字\n\n《剪辑错了的故事》以忧愤深广的沉重心情对甘书记冷漠寡情的官僚主义进行了强烈谴责。因此，作者就必然恰当地选择凝重、讽喻的语言以表达这一重大的题材，深刻的内容，批判的格调。如“老甘不一定就是甘书记，也不一定就不是甘书记，不过老寿还是这个老寿，”用语巧妙，寓意深刻。“也不知是老寿背了‘时”，还是‘时＇背了老寿”，引人深思，耐人寻味，诙谐中见冷峻。这种诙谐讽喻，笑中带刺的文字如警世言，使作品更加忧愤深广。","keywords":"立足现实 宏大题材 关注普通的“小人物”用意识流方法结构小说 心理描写 诙谐讽喻 笑中带刺","note":"反思小说是以总结建国后27年间的历史经验教训为特点的、带有鲜明的回顾和反思性质的作品。茹志鹃《剪辑错了的故事》是这一系列反思小说的开山之作，在艺术特色上，和茹志鹃“十七年”时期的小说有很大的区别，大家要特别注意。同样，作为反思文学的开山之作，《剪辑错了的故事》以名词解释进行考查的可能性也很高，大家要关注一下。"},{"id":"339","stars":"★★","title":"陆文夫小说创作的艺术特征","body":"一、从对历史和现实的反思掘进到更深厚的民族文化纵深\n\n在一个社会转型的时代，陆文夫自觉地选择作为一个思考者而存在，这就使得他对织入历史进程的个人生活史的审视和检讨不仅仅停留在半个世纪以来中国社会发展的经验和教训之上，更从对历史和现实的反思掘进到更深厚的民族文化纵深，不仅对人物命运和生活事件作开掘，而且注重在纵横开阖的历史维度上对现实作出认识和评价。\n\n二、将反思融入了对苏州地域文化的挖掘\n\n陆文夫的探索从富有历史感的现实反思逐渐深入到对民族传统文化的反思。在这种深入中，最能体现陆文夫独特性的是他将这种反思融入了对苏州地域文化的挖掘。这使陆文夫在80年代中国文坛的文化寻根思潮中引人注目。山清水秀、物阜民丰孕育了清隽秀逸的苏州文化和自娱自在、追求闲适的市民心态，吴侬软语、苏州评弹、苏绣、苏菜、苏州园林乃至清末民初的鸳鸯蝴蝶小说都体现着这种文化特征和文化心理。从渊源上看，陆文夫五六十年代的写新人新事的小说，常常在富有地域文化色彩的苏州闾巷间展开。苏州地域文化含蕴幽深，浸润到小说人物的日常生活和内心世界。\n\n三、创作风格受到苏州文化环境影响\n\n陆文夫的创作特色是与他所处的文化环境和受到的文化黑陶分不开的。苏州小巷的市井生活气息和生活情趣，轻松幽默的苏州评弹艺术、滑稽戏，这些地域文化和民间艺术资源使陆文夫既善于从普通人喜剧色彩的日常生活中挖掘出深层的悲剧\n\n因素，又能使因对生活敏锐体察而觉醒的悲剧意识涵容在他的喜剧兴趣中；陆文夫戏称这种出入于悲剧、喜剧之间，富有人生哲理的幽默为“糖醋现实主义”。\n\n陆文夫的写作是和苏州紧密联系着的，“陆文夫是文学上的苏州”。作家高晓声称陆文夫的创作“秀逸清朗，布局得体，浓淡相宜”，建构了当代中国文学史上的“苏州园林”。陆文夫自认为创作“总体应该像建造苏州园林，今天挖一个池塘，明天造一座颇具规模的厅堂，后天造点儿小桥、小亭，再后天垒起一座假山，中有奇峰......若干年后形成了一座园林，亭台楼阁，花木竹石，小桥流水，丰富多彩而又统一，把一个无限的大千世界，纳入一个有限的园林，这就是我们常说的，一个人的作品，应该是他那个时代的缩影”。","keywords":"民族文化纵深 对苏州地域文化的挖掘 苏州文化环境影响","note":"①陆文夫的小说创作特征在江南一带的院校还是有一定出题概率的，其余院校，暂时命题概率不大。②糖醋现实主义有可能出名词解释。③另外，从此题中我们可以抽离出一个概念，也即地域对作家的影响，地域位置与文学风格，比如老舍的京味，沈从文的湘西，大家可以形成这种具有宏观意义的“专题”，以加强自己多对现当代文学的理解，当然，这类类似专题李老师也会帮大家总结，完成后都会发在咱们群里。"},{"id":"340","stars":"★★","title":"谈谈古华《芙蓉镇》的艺术特色","body":"古华的《芙蓉镇》寓政治风云于风俗民情图画，借人物命运演乡镇生活变迁并采用新颖独特的艺术结构，贯之以凝练清新的语言、浓郁的乡土气息和地方色彩，演奏了一曲哀婉而又严酷的山乡民歌。《芙蓉镇》的艺术特色，主要表现在以下方面：\n\n一、揭露了极左思潮的谬误危害\n\n《芙蓉镇》在十五六万字的篇幅中向人们展示了解放以后特别是1960年代以来湘南地区芙蓉镇的巨大变迁和人生聚散。小说截取了1963、1964、1969、1979四个重要年份，涉及“反右”运动、“大跃进”三年灾害后的经济复苏、“四清”运动、“文革”粉碎“四人帮”以至党的十一届三中全会后的拨乱反正等事件。作品在风云多变的大动荡岁月里，以“芙蓉姐”胡玉音的悲欢遭际为主线，让生旦净丑、红脸白脸、花头黑头在历史舞台上-亮相，演出了一幕幕催人泪下的人间悲喜剧，再现了特定历史时期人民生活的升迁沉浮，深刻地揭露了极左思潮的谬误危害。\n\n二、思考了乱世中的人生尊严问题\n\n小说刻画了胡玉音的人生历程，展示了在一个特定时期把人生价值诉诸民间存在的合理性，思考了乱世中的人生尊严问题。小说充满政治和民俗的双重旨趣，题记中的“严峻的乡村牧歌”，即含有乡村历史学与乡村社会学的双重指向。因此也有人将其小说风格归结为“风俗政治化，政治风俗化”。\n\n三、以人物塑造统帅故事情节\n\n《芙蓉镇》选取一些具有历史意义的年景作为舞台布局，以青石板街作为中心场地，将俏丽善良的“芙蓉姐”胡玉音的故事穿插进一组人物当中去。书中的人物被塑造得血肉饱满各具特色，其命运相互关联旋转交错，组成一个不断变迁的小社会，在其中隐现了千家万户的聚散沉浮。这种以人物塑造统帅故事情节的构思方式，被誉为是“土的生活，洋的写法”。\n\n四、将人物命运单线或复线交替写来，既突出重点又疏密有致\n\n小说结构精湛独到，其情节只是围绕人物性格展开，表现在叙述的内在线索上，并不具体交代某一事件的始末，各个场景在时间顺序上也并不紧密相衔。作者将胡玉音及与之相关的一组人物作为主体骨架，以其间发生的社会事件为实际材料构筑小说，并在整体的顺叙中间以少许补叙，将人物命运单线或复线交替写来，剪裁配置既突出重点又疏密有致。","keywords":"巨大变迁和人生聚散 人生尊严问题 伦理问题 土的生活，洋的写法 突出重点 疏密有致","note":"①1981年，古华《芙蓉镇》发表，并于1982年获首届茅盾文学奖，之后改编成电影，从而拥有了更为广泛的社会影响。②1980年代早期的文学，受政治影响颇深，一方面，政治在积极影响文学；另一方面，文学也在努力介入政治。《芙蓉镇》几乎集合了当时所有的文学类型，比如“伤痕”“反思”“改革”，等等。重新阅读这部小说，有可能进入1980年代早期的某种社会无意识，这是由那个特殊的时代所决定的。③古华的《芙蓉镇》成就毋庸置疑，但它在艺术上仍不够完美。它的影响被历史放大了，许多欧美读者在了解“文革”时首先便会提到《芙蓉镇》，这也导致其具体艺术成就与其影响力不成正比。"},{"id":"341","stars":"★★★","title":"谈谈新时期“改革文学”的特征和局限性","body":"一、“改革文学”的特征\n\n“改革文学”是改革开放时期特有的文学现象，其特征主要包括：\n\n（一）强烈的社会责任感\n\n“改革文学”作家们关注社会问题，如农村改革、城市化进程、民生问题等。作家们以真实的视角刻画人物形象，深入分析社会现象，引起广大读者强烈共鸣。作品中表现出强烈的社会责任感，以鲜明的参与意识呼吁改革，反映社会政治经济变革，揭示旧体制的弊端，强调改革的历史必然性。\n\n（二）反对封建文化\n\n“改革文学”的代表作品通常呈现出鲜明的现实主义风格，反映社会生活的真实情况，揭露封建文化的黑暗面，呼吁民主、自由和进步。\n\n（三）批判意识强烈\n\n“改革文学”作品常常批判社会现实，表现封建文化的不良影响，呼吁改变旧有的社会制度以推动中国社会的进步和发展。随着改革的深化，“改革文学”的视野更加阔大，眼光日益深入，作品更注重剖析在改革中日益显露出来的国民身上的落后的文化因袭，表现改革对人的传统价值尺度的冲击。\n\n（四）语言简练生动\n\n“改革文学”作品的语言风格通常清新简练，生动形象。作家们通过各种手法，如对话、描写、比喻，使作品更具感染力和表现力。\n\n（五）农村题材\n\n“改革文学”中的农村题材作品最具典型性。“改革文学”紧扣拥有土地支配权后农民的新状态进行了大量的创作，揭示了农村改革中所受阻力并剖析了其产生的原因，表现了在改革中发生变异的中国农民的传统文化心理。\n\n（六）人物塑造\n\n“改革文学”注重人物塑造，特别是改革者的塑造，通过塑造改革家、开拓者的人物形象，记录社会改革艰难和其导致的人\n\n的观念、人与人关系的变化。\n\n（七）二元对立\n\n在情节设置上，“改革文学”往往描写改革与保守两种力量的二元对立较量（但也较为僵化和单一），这种模式化概念化倾\n\n向体现了对时代特征的捕捉。\n\n（八）乐观基调\n\n“改革文学”的作品基调大都是乐观的，反映了作家对改革进程的积极态度和对未来充满希望的展望。\n\n综上所述，“改革文学”不仅是对当时社会政治经济变革的反映，也是对人性、社会关系和文化心理的深入剖析，体现了作家们强烈的社会责任感和对改革的乐观态度。\n\n（李凡说：此处特征只是一带而过，因宇数限制，此部分没有详细展开，大家可以结合下面高晓声和蒋子龙的具体作品未把这道题目丰富起来，此处再提一点，当涉及具体时期或者流派之时，一定要结合具体作家作品论述，先宏观概括，再微观展开，所谓细节处见风神，应是如此。）\n\n二、“改革文学”的局限性\n\n（一）在反映现实的基本精神上，“改革文学”不同程度地存在着将现实简单化、表面化、观念化的倾向。\n\n改革与反改革的斗争总是被处理成剑拔弩张的态势，双方的较量被过分地传奇化、戏剧化。对现实简单化的认识必然带来艺术形式上的模式化，即人物设置上通常是改革派（正面人物）为一方，反改革派（反面人物）为另一方，形成阵线分明的二元对立，有时再加上动摇于二者之间的中间派，这是“十七年文学”及“文化大革命”后期文学中典型的人物组合方式。叙事的流程大都是改革派历尽艰辛终于取得胜利，以正剧鼓舞人心（如《乔厂长上任记》），确有其僵化的地方。\n\n（二）在对改革进程的认知上，创作主体通常把改革的成功系于个别具有雄强魄力的铁腕人物身上。\n\n积重难返的现实固然需要雷厉风行、说一不二的工作作风，但在改革者的形象塑造上，“改革文学”却不同程度地存在着崇拜铁腕、强化个人极权的倾向。而与个人强权意识相关的是“清官意识”“青天意识”和“钦差意识”。\n\n（三）铁腕崇拜还带来人物性格的单向性与雷同化。改革者们除了改革，没有其他任何的精神向度。性格内涵基本上都是大刀阔斧、披荆斩棘，“虽有弱点但绝无原则错误，虽有失败但绝非错误所致”。由于社会层面对改革的强烈渴望，这些“理想化”的人物形象大都能引起一阵轰动。\n\n但随着现实的日趋复杂，“改革文学”的可信度开始日益降低，亦缺乏丰富的美感基质给人们的精神生活提供更多的内容，因此，这一文学潮流日渐被时间所淡忘几乎是一种必然。\n\n【李凡关键词：特征 社会责任感 反对封建文化 批判意识 语言简练生动 农村题材 人物塑造 二元对立 乐观基调 局限性简单化、表面化、观念化 铁腕人物 单向性与雷同化】","keywords":"","note":"①“改革文学”，顾名思义，可以理解为改革开放时期特有的文学。中国自1978年底十一届三中全会之后，便开始了自上而下的全国性经济体制改革。** ②1979年蒋子龙的小说《乔厂长上任记》是“改革文学”的发端，1983至1984年间，描写社会改革的作品大量涌现，形成了一个创作高峰，在社会上颇为轰动。之后的改革小说中，出现了类似“乔厂长”的“开拓者系列”，如《改革者》（张锲）、《跋涉者》（焦祖尧）、《祸起萧墙》（水运宪）、《三干万》（柯云路）等等。还有一些作家对种种社会弊端予以批判和揭露，剧作家沙叶新与李守成、姚明德合作的戏剧《假如我是真的》就是这一类的代表。高晓声的视角比较独特，他一直关注着普通农民在新时代的变化。他笔下的李顺大、陈奂生都是农村的小人物，作者为他们生活上的改善而欣慰，也对他们思想上因袭的落后的东西给予温情的嘲讽。 ③1981年底张洁的长篇小说《沉重的翅膀》问世，标志着“改革文学”进入第二阶段。这一阶段主要关注改革对整个社会尤其是人的思想、道德、伦理观念带来的变化。影响较大的有长篇小说《故土》（苏叔阳）、《花园街五号》（李国文）、《男人的风格》（张贤亮）、《新星》（柯云路）及中篇小说《老人仓》（矫健）、《鲁班的子孙》（王润滋）、《秋天的愤怒》（张炜）、《腊月·正月》（贾平凹）等。路遥的中篇小说《人生》以农村青年高加林的悲剧，深刻地写出了商品经济对传统农村文化的冲击。 ④1985年以后，“改革文学”在题材、视角上更加多元化，初期的理想主义色彩逐渐淡化，作为一种新思潮、新现象的“改革文学”已经结束。我们不妨称其为纪念碑，是因为就文学创作而言，它已成为历史-使命达成，意义归于历史。但是，以改革开放为主题的文学作品仍层出不穷。"},{"id":"342","stars":"★★★","title":"结合“陈奂生系列”，谈谈高晓声小说的特色","body":"一、刻画富于典型意义的中国农民形象\n\n作者积二十多年的农村生活经验和观察，对中国农民的性格有着深刻而清醒的认识，而刻画富于典型意义的中国农民形象，正是高晓声小说的一个重要特点。\n\n高晓声的小说创作坚持了现实主义的美学原则，以深刻的“探求者”的眼光，塑造了一大批被称为“中国农民的灵魂”的人物形象。他们有着中国农民善良、朴实、忠厚的传统美德，也有数千年的历史传统所积淀下来的民族“劣根性”。这其中，“陈奂生”这一形象十分具有典型性。\n\n陈奂生的精神，典型地表现了中国广大的农民阶层身上存在的复杂的精神现象。他的形象是一幅处于软弱地位的没有自主权的小生产者的画像，包容着丰富的内容，具有现实感和历史感，是历史传统和现实变革相交融的社会现象的文学典型。\n\n二、具备批判“国民性”的精神传统\n\n高晓声的小说相当真实地反映了新中国成立以来中国农民的生活历程，深刻揭示了造成他们辛酸命运的政治、经济、历史及民族性格和民族心理等深层根源，形象地显示了极“左”路线给人民造成的苦难。同时，新时期的社会变革所带来的农民性格和心理方面的变化在其小说中也有着大量细致逼真的描绘。\n\n尤其深刻的是，高晓声通过陈奂生这个典型形象的塑造，深入探讨了“左”倾错误和封建残余得以蔓延的温床（即民族的“劣根性”）。这样，他便继续了“五四”以来中国现代文学对于“国民性”问题的探讨。从鲁迅、赵树理而至高晓声，他们所塑造的农民形象，恰好构成了中国农民从民主革命到80年代的命运变迁和灵魂的演进史。这不仅是其现实主义成就的一个重要方面，同时，也是其小说在思想主题方面的深刻之处。\n\n三、传统与现代相结合的叙事风格\n\n《陈奂生上城》体现了典型的高晓声式的叙事风格。高晓声惯于运用第三人称的叙述方式，以叙述为主，尤其擅长概括\n\n性叙述，很少采用让人物直接说话和行动的直接呈现方式，作品的语言基本上都出自叙述人之口。其语言简练明快，幽默犀利，意蕴含蓄，富有情绪感和节奏感。所以，他虽然采用传统的讲故事的语气，但又不是讲故事，既不围绕一个具体的事件结构故事，也不组织矛盾冲突步步发展的戏剧情节，而是将人物几十年的普通生活压缩进某一个生活焦点上反映出来，通过对人物心理的深入开掘，揭示人物性格和作品的题蕴，这又很有现代小说的味道，在这个意义上，他的小说叙述方式是传统与现代的结合。","keywords":"富于典型意义的中国农民形象 批判“国民性”传统与现代相结合","note":"高晓声的小说创作，是通过刻画典型的农民形象，揭露改革时期农民阶层精神层面的两面性，达到一种与鲁迅、赵树理一脉相承的批判“国民性”的精神传统。也正因此，高晓声以及他笔下的农民形象也往往会和鲁迅、赵树理的小说创作联系起来进行考查，大家要结合具体作品，好好体会。这里要注意的是，高晓声的“陈奂生系列”以及其中陈奂生这一形象，很有可能以名词解释的形式考查，大家要注意一下。"},{"id":"343","stars":"★★★","title":"谈谈“陈奂生系列”中的陈奂生形象","body":"“陈奂生系列”包括《漏斗户主》《陈奂生上城》《陈奂生转业》《陈奂生包产》《陈奂生出国》。陈奂生是高晓声着力塑造的一个处于社会变革时期的老一代农民的典型形象，在他身上，既凝聚着农民的传统美德，还承受着因袭的心灵重负，体现了作者对社会人生、国民性的深深忧虑和严肃思考。\n\n一、陈奂生形象特征\n\n（一）本性勤劳、憨实、质朴\n\n要说明陈奂生的性格，最好是把“陈奂生系列”作为一个整体。陈奂生是一个勤劳、憨实、质朴的农民，在《漏斗户主》中，他长期被饥饿所纠缠着，并不懒惰却无法摆脱困境，对现实失望却又并不放弃努力。\n\n（二）性格心理两个侧面并存交错\n\n《陈奂生上城》对陈奂生的行为和心理进行了放大式的集中描写，突出地表现了陈奂生作为一个农民的典型的性格特征，以其独特性展示了七八十年代之交改革开放初期中国农民所共有的心理倾向，即作为小农生产者性格心理的两个侧面的并存交错：善良与软弱、纯朴与无知、憨直与愚昧、诚实与轻信、追求生活的韧性和容易满足的浅薄、讲究实际和狭隘自私等等。\n\n二、陈奂生形象的意义\n\n（一）典型地表现了中国广大的农民阶层身上存在的复杂的精神现象\n\n陈奂生的形象是一幅处于软弱地位的没有自主权的小生产者的画像，包容着丰富的内容，具有现实感和历史感，是历史传统和现实变革相交融的社会现象的文学典型。作者对陈奂生既抱有同情，又对他的精神重荷予以善意的嘲讽，发出沉重的慨叹，这种对农民性格心理的辩证态度，颇具鲁迅对中国“国民性”的“哀其不幸，怒其不争”的精神传统。\n\n（二）体现了作者对中国农民的深沉思考\n\n作者以轻松的笔调，幽默的语言，悲喜交集地写出处于改革时代的中国农民终于迈出改革的第一步，又由于传统的精神重负使这一步走得极为艰难，体现了作者对中国农民的深沉思考。陈奂生这个形象塑造得极为成功，陈奂生性格已成为国民性格中美德和弱点的一面镜子，越来越显示出普遍的社会意义。\n\n总之，高晓声对陈奂生性格的塑造是通过“陈奂生系列”小说实现的，因此其性格随着时代社会的变化而不断发展。陈奂生性格中既有老一辈农民的传统美德，又有根深蒂固的落后性，高晓声对国民性这一主题做出了深刻思考。","keywords":"农民的传统美德 承受着因袭的心灵重负 小农生产者 复杂的精神现象 深沉思考","note":"“陈奂生系列”中陈奂生这一个人物的性格及其发展变化，充分体现了改革时期中国农民的思想精神内容，体现出了中国农民阶层性格中的两面性，反映了高晓生对国民性这一主题做出的深刻思考。陈奂生这一形象作为改革时期农民形象的代表，很有可能和其他农民形象如阿Q等联系起来考查，大家也要注意一下。"},{"id":"344","stars":"★★★","title":"简述蒋子龙的《乔厂长上任记》的特色","body":"一、强烈的时代意识和社会关注\n\n《乔厂长上任记》作为“改革文学”的标志性作品，反映的社会生活面十分宽广，提出的问题十分有深度，较深刻地揭示了改革所面临的困境，对改革开放大环境下新旧价值观念的交迭、嬗变历程进行了较好的阐述。\n\n蒋子龙工业改革题材小说最突出的特色是其强烈的时代意识和现实关注，蒋子龙对现实工业改革具有强烈的敏感性，能够深切把握到改革的意义及其对社会生产全方位的促动。在《乔厂长上任记》中，他将工业改革置于当代中国乃至国际社会的客观宏大背景中予以考察，既凸现出他的现实忧患感和对现实改革的迫切渴盼，又展示出现实社会发展的律动和人们生活文化变迁的纵深图画。深广的现实视野和对现实的热烈关切，使蒋子龙的创作充满理想和激情，表现出强烈的感染力。\n\n二、典型改革人物形象的塑造\n\n典型改革人物形象的着力塑造是蒋子龙工业改革小说第二个突出的特点。1979年蒋子龙发表《乔厂长上任记》，塑造出了乔光朴这个具有典型性的工业改革家形象。乔光朴表现出了高度的责任感和不屈不挠的工作精神，采取了一系列大刀阔斧、雷厉风行的改革措施，对阻挠势力进行了坚决有力的斗争，使工厂在短时期内改变了面貌，并充满了发展的生机。乔光朴在工作上敢于开拓，在生活与爱情上也表现出了相应的性格。在作品多角度的展示下，乔光朴的正直高尚、坚韧不拔的人格精神，果敢善断、不畏艰险的性格特征和杰出的企业管理才能等都得到了充分的表现，其光彩照人的形象跃然纸上。这个形象是新时期工业改革题材中较早出现的改革者形象，因其人格魅力而博得了广泛的赞誉，成为当代工业改革家的代名词，也成为后来同类形象难以超越的一个范本。\n\n三、“改革＋恋爱”的模式\n\n《乔厂长上任记》中还设计了主人公与一位女工程师童贞之间的爱情线索。乔光朴顶着世俗舆论的压力与童贞大胆公开多年的感情，同顶着政治压力大刀阔斧进行企业改革这一政治任务之间，具有彼此呼应的关系。由此暗示出，改革不但需要从制度上迈步前进，在情感与生活观念上也同样需要变革。这一设计显然丰富了小说的内涵，但也在不期然之间构造出了一个“改革加恋爱”的套路，同过去年代的“革命加恋爱”如出一辙。","keywords":"时代意识 社会关注 典型改革人物形象 乔光朴 “改革＋恋爱”","note":"《乔厂长上任记》是蒋子龙创作的短篇小说，小说塑造了改革家乔光朴坚毅的英雄形象，应和了变革时代的人们渴望雷厉风行的“英雄”的社会心理，成为“改革文学”的开山之作。这也是这部作品的最大特色。"},{"id":"345","stars":"★★","title":"分析蒋子龙小说创作的特色","body":"一、现实的针砭性\n\n蒋子龙的工业改革题材小说，关注改革中出现的现实问题，具有现实的针砭性。如中篇小说《开拓者》，就提出了经济体制的改革和干部制度的改革问题。《拜年》也对现存干部体制的弊端有所揭示和抨击，从作品中可以明显看出，对权力的追求与维护已经异化了不少领导干部的心灵。《赤橙黄绿青蓝紫》则关注工厂青年的思想和生活，展现当代青年工人的新的风貌和思想现状，要求社会予以理解和关怀。蒋子龙的这些作品，表明蒋子龙对改革的思考具有相当的深度，也显示了他在强烈激情之下蕴含的内在理性。\n\n二、后期脱离改革小说轨迹\n\n1984年前后，蒋子龙的创作有所变异和发展。在创作题材上，他将描画改革的笔触深入到乡村改革上来。《燕赵悲歌》就表现了改革大潮中的乡村新貌，并塑造了武耕新这个具有现代农民气质的当代农民企业家形象。\n\n工业改革题材小说中，1985年发表的《阴差阳错》和1986年发表的《收审记》也呈现了新的面貌。与蒋子龙以往改革小说的理想主义和着重描写改革先行者不同，这两部作品重点展示了改革中的困境，并借对造成困境原因的挖掘，进而对民族文化、民族社会心理等问题进行了深入思考。显然，这两部作品意味着蒋子龙的自我拓展，也使他的工业改革小说显得更加凝重，更富有真实性。\n\n三、粗犷的阳刚美\n\n从美学风格上来讲，蒋子龙所体现的主要是阳刚之美。他的艺术风格粗犷刚健，充满激情。\n\n（一）谋篇布局上，蒋子龙善于高屋建瓴，俯览全局，使作品具有宏大气势和辽远视野。\n\n（二）叙述方法上，蒋子龙一般少作细描和心理活动刻画，而是营设波澜壮阔的剧烈矛盾冲突，将人物置身于旋涡中，着重从人物行为和语言上表现人物。\n\n（三）语言上，蒋子龙崇尚气势的雄浑和雄辩力，与工厂生活语言也较为切近。这使他的作品具有较强的艺术感染力和强烈的生活气息，但也存在着较为粗疏匆促的缺失，并且议论过多，人物类型化也是他许多作品的弊病。\n\n【李凡关键词：现实的针砭性 后期脱离改革小说轨迹 粗犷的阳刚美】","keywords":"","note":"蒋子龙的小说创作明显也经历了一个发展的过程，前期创作是典型的改革小说，后期则逐渐脱离改革小说的范畴，现实性更强。不过一以贯之的，是蒋子龙粗犷的阳刚美。从这些特征可以看出来，虽然同为改革作家，但无论是在思想上还是艺术上，蒋子龙都表现出了较高的追求，也难怪被视为改革小说代表作家。"},{"id":"346","stars":"★★","title":"请分析高加林的人物形象","body":"高加林是路遥的改革小说《人生》中的主人公。《人生》以改革时期陕北高原的城乡生活为时空背景，描写了高中毕业生高加林回到土地又离开土地，再回到土地这样人生的变化过程，构成了其故事构架。高加林同农村姑娘刘巧珍、城市姑娘黄亚萍之间的感情纠葛构成了故事发展的矛盾，也是体现农村青年人生道路艰难选择的悲剧。\n\n一、复杂的性格特征\n\n高加林一方面留恋乡村的淳朴，更留恋与巧珍的感情；另一方面又厌倦农村传统落后的生活方式，向往城市文明，希望能在那里实现自己新的更大的人生价值。高加林是作者着力塑造的复杂的人物。他身上既体现了现代青年那种不断向命运挑战，自信坚毅的品质，又同时具有辛勤、朴实的传统美德。他热爱生活，心性极高，有着远大的理想和抱负。关心国际问题，爱好打篮球，融入时代的潮流。他不像他的父亲那样忍气吞声、安守本分，而是有更高的精神追求，但是现实与他心中的理想总是相差极远，正是这样的反差构成了他的复杂的性格特征。\n\n二、平等民主的生存观念\n\n高加林渴望离开贫穷落后的农村，到更广阔的城市天地去生活。期盼从乡村走出去，走进城市，由简单的劳作走向层次较高的精神价值创造。实际上体现了一种平等、民主的生存观念。任何人不管其家庭出身、社会地位和人生起点如何，都应该同等地具有人生追求和实现自身价值的权力。\n\n三、富于理想，锐意进取\n\n高加林身上有一股强烈的力量，那就是富于理想，锐意进取，向往现代文明生活。当高加林从黄土高原上那个闭塞的村子里考进县城高中以后，新的现实、新的生活、新的知识诱惑着他，使他不满父辈们的那种为生活而生活的简单生活方式，他抛弃了农民固有的那种传统的狭隘观念，开始了对自身和社会的重新认知。在眼花缭乱的社会生活面前憧憬着自己无数美好的梦想。他积极进取，不断地探索与付出，也获得了些许成功。农村中像高加林这种类型的人物尽管有时带有好胜虚荣的个人动机，并不是一种完人，但他们却是特定时代对农村落后惰性的一种冲击力量，是能推动这个时代变革的一个因子。正是都市文明和乡村的落后、愚昧对立产生的矛盾才造就了高加林这样的边缘人物。","keywords":"农村青年人生道路 复杂性格 平等民主 富于理想 边缘人物","note":"高加林富于理想，但理想与现实是有差距的，这样的差距造就了他复杂的性格，也造就了他人生选择的悲剧。大家在分析这个角色时，注意结合当时的时代背景和作家想要表达的主旨。"},{"id":"347","stars":"★★★","title":"路遥《人生》的思想价值","body":"路遥的中篇小说《人生》在一个爱情故事的框架里，凝聚了丰富的人生内容和社会生活变动的诸多信息。\n\n路遥说过，他始终关注的焦点是“城乡交叉地带”。其实，他所说的“乡”固然是名副其实，“城”却并非“城市”而只是“城镇”，但与乡村相比，两者的文化落差还是十分明显的。社会文明的发展变迁，总是先“城市”“城镇”而后波及乡村，所以，关注城乡交叉地带变化，即便从反映80年代农村变革的角度，也是具有普遍意义的。小说《人生》就是通过城乡交叉地带的青年人的爱情故事的描写，开掘了现实生活中饱含的富于诗意的美好内容，也尖锐地揭露出生活中的丑恶与庸俗，强烈体现出变革时期的农村青年在人生道路的选择中所面临的矛盾、痛苦心理。\n\n小说的主人公高加林是一个颇具新意和深度的人物形象，他那由社会和性格的综合作用而形成的命运际遇，折射了丰富斑驳的社会生活内容。借助这一人物形象，小说触及了城乡交叉地带的社会的、道德的、心理的各种矛盾，实现了作者“力求真实和本质地反映出作品所涉及的那部分生活内容”的目的。在高加林的性格中，错综复杂地交织着自尊、自卑、自信等方面的性格因素，好像有“无数互相交错的力量，有无数个力的四边形”在互相冲突、互相牵制，从而在一次次骚动和斗争中决定着他的选择，最终产生一个总的结果。这个结果似乎不以旁人的意志为转移，也是与高加林的本意相对立的。\n\n小说通过高加林和刘巧珍的爱情悲剧，多层次地展现了高加林这种悲剧性格的形成过程。高加林与传统道德观念有着千丝万缕的联系，他对爱情是相当严肃的，他对巧珍也有着真实的感情。但在变动着的现实中，在他对城乡生活的差异有了强烈的感受之后，他被实现个人愿望的可能而引起的骚动所折磨：一方面他留恋乡村的淳朴，更留恋与巧珍的感情，另一方面\n\n又厌倦农村传统落后的生活方式，向往城市文明，希望能在那里实现自己新的更大的人生价值。对他来说，这一开始就是一个甜蜜而痛苦的矛盾。由于偶然的机会，他的命运出现了转机，他对生活、对自己作了重新的估量。最后，他与刘巧珍的爱情终于被与黄亚萍的世俗爱情所替代。他与刘巧珍的分手标志着与土地和它象征着的传统乡村生活的决裂，他在坎坷不平的人生道路上终于迈出了重要的一步，这一步合法却似乎不尽合理和合情，特别是它对巧珍所带来的伤害更令人遗憾，就是他自己也难免内疚和不安，自我谴责背后是一种痛苦搏斗后的自我肯定。最终他把来自内心的良心发现和来自外部的贵难全部否定，“为了远大的前程必须作出牺牲！有时对自己也要残酷一些”。这里个人主义的排他性得到了最大限度的表现，在这一两难选择中，人生的含义终于被他误解，社会变成了一座动物化了的竞技场。\n\n但作者并没有回避高加林选择的合理因素，高加林的悲剧同样给读者这样的启示：倘若古老而淳朴的乡村文化不能产生更高的物质和精神的要求，倘若刘巧珍诚挚又深沉的爱情始终不能满足高加林个人愿望中的合理部分，那么，传统生活哲学如何说服他、束缚他呢？这里，作者显然已经超越了早期“改革文学”中对人物及其处境作二元对立的简单化处理方式，而是深入到社会变化所引起的道德和心理层面，以城乡交叉地带为瞭望社会人生的窗口，从一个年轻人的视角切入社会，既敏锐地捕捉着嬗递着的时代脉搏，真切地感受生活中朴素深沉的美，又把对社会变迁的观察融入个人人生选择中的矛盾和思考当中，在把矛盾和困惑交给读者的同时，也把启示给予了读者。","keywords":"矛盾、痛苦心理 城乡交叉地带 悲剧性格的形成过程 个人主义的排他性 对社会变迁的观察","note":"路遥《平凡的世界》名气更大，但《人生》的开拓意义则更强，因而在考查路遥相关内容时主要是以《人生》为主。在《人生》中，路遥超越了早期“改革文学”中对人物及其处境作二元对立的简单化处理方式，通过对高加林人生悲剧和爱情悲剧的描写，展现了城乡交叉地带的社会的、道德的、心理的各种矛盾，这便是它的价值所在。同时，正因为《人生》的开拓意义强烈，其本身与其主人公高加林也会在名词解释中出现，大家要关注一下。"},{"id":"348","stars":"★★★★★","title":"说说20世纪中国乡土文学的发展","body":"乡土文学与乡土中国密切相关，20世纪以来的中国文学，乡村中国一直是最重要的叙述对象。从20世纪二三十年代的乡土小说到40年代的解放区文艺、五六十年代的农村题材创作，再到80年代以来的“新乡土文学”，是中国现当代文学史的一条重要脉络。不同阶段的乡土文学既有断裂也有联系，在文学与现实的关系、价值判断、审美方式等方面出现持续变化的情况下，乡土文学也在不断地向前发展。\n\n一、20世纪二三十年代的乡土小说：启蒙主义下的矛盾叙述\n\n在现代作家那里，乡土主要指向两个意义层面：一是附属于整个系统性的启蒙工程，对乡土加以再现的目的在于“揭出病苦，引起疗救的注意”，这是在价值判断上对“乡土性”的一种否定；二是以诗化形式实现作家浪漫主义、个人主义的自我确证诉求，乡愁便是对逐渐消失了的“乡土性”及其风物的一种回望和怀恋。\n\n正是由于这两个意义层面的存在，这一时期的乡土小说对乡村的叙事是分裂的：一方面，乡土被视为亟待离去的空间，封闭静止的乡村是愚昧和贫弱的，贫困的农民因愚昧、麻木甚至病态而被当作启蒙或拯救对象，他们是阿Q、华老栓、祥林嫂；另一方面，乡村平静的田园又是一个诗意的所在，呈现出一种道德理想主义色彩，它是《故乡》《边城》《一个多情水手与一个多情妇人》。因此，那个时代对乡村的想象和叙述是矛盾的。\n\n二、从40年代解放区文艺到五六十年代农村题材创作：宣传鼓动与深度介入\n\n真正引起乡土文学转变的是解放区的文艺实践。随着解放区文艺实践的展开，乡土在一定程度上沥干了主观性的个人抒情成分，转变为“翻身道情”。写作主体的革命化、阶级化，也重构了文学与乡土的关系。\n\n新中国成立后，解放区文艺经验迅速推广到全国，实现了乡土小说叙述视角的转变，乡土也从怀恋的对象、批判的慕本转变为洋溢着巨大历史动能的实践性、革命性的全新空间。乡土文学作家的创作观念和方式也发生了较大改变，他们不再居于乡村之外，而是直接投入到乡村现实之中，希望通过自己的作品对现实运动进行宣传和鼓动，从而深度介入乡村变革。在这一时期，民粹主义或民众崇拜，是“农村题材”最重要的思想特征。与此相关的是，在“阶级”划分业已完成的时代，“-个阶级消灭一个阶级”的革命冲动和激情，形成了“农村题材”最鲜明的美学特征，这就是“暴力美学”。从内容上来看，这一时期的小说突出表现了新中国农村生活中的社会主义力量，小说中的主要人物都有鲜明的社会主义新人特征。\n\n三、80年代以来的“新乡土文学”：重述历史与关注现实\n\n所谓“新乡土文学”指的是从70年代末到90年代初“伤痕文学”“反思文学”“改革文学”“寻根文学”“先锋文学”与“新写实小说”这一序列中蕴涵的一条乡土小说脉络，《许茂和他的女儿们》《芙蓉镇》《商州初录》《浮躁》《李顺大\n\n造屋》《剪辑错了的故事》等等都可以归入其中。值得注意的是，“伤痕”“反思”“改革”“寻根”“先锋”“新写实”的特点或多或少也都体现在这一时期的乡土文学中，乡土文学的价值判断和创作方法都发生了深刻变化，具体表现在以下方面：\n\n（一）重述历史\n\n历史交替之际，文学创作通常以重新表现和书写历史的方式来衔接历史。重述乡土中国的历史，构成了“新乡土文学”的重要内容，与此同时，“新乡土文学”的价值判断和创作方法也发生了重大变化，无论是对当代历史事件的反思，还是对土地与人的命运的思考，都带有鲜明的或潜在的启蒙主义立场。\n\n在重述乡村历史时，现实主义仍是“新乡土文学”的创作方法，但和20世纪五六十年代的社会主义现实主义已经不同。经历了现代主义冲击之后，“新乡土文学”采用的创作方法更为丰富多样。由于创作方法的敞开，“新乡土文学”有了重述乡村的更多可能，文学观念、文学思潮和创作方法的多样性，在相当程度上既是现代性影响的结果，也是反思现代性的收获。\n\n（二）关注现实\n\n“新乡土文学”在重述历史的同时，以巨大的热情关注乡土现实，现代化进程中乡土中国的新变成为作家书写的重点。现代文学时期乡土文学中隐含的城、乡结构，在20世纪80年代以后因为现代化进程的加速更为凸显，农村人进城（镇）的故事，成为“新乡土文学”的一种主要书写模式。\n\n在以巨大的热情表现乡村发展进步的同时，“新乡土文学”也以深刻的忧患意识面对乡村工业化、城镇化中的困境。在对现代化弊端的思考中，乡土及其“乡土性”的文化意义被重新发现。在时代急剧变革中，具象的乡土又被赋予了抽象的文化意义，以重释传统回应西方现代性，以激活传统抵抗现代化弊端，这是20世纪80年代以来“新乡土文学”的一个重要特征。","keywords":"启蒙主义 矛盾叙述 自我确证 分裂 宣传鼓动 深度介入 解放区文艺实践 叙述视角的转变 重述历史 现实主义 关注现实 新变 困境","note":"无论是过去还是现在，“乡土”都是中国文化绕不开的一个因素，而“乡土文学”的发展也贯穿了整个中国现当代文学史，直至当下。许多高校也会针对这一专题进行考查，所以对于这部分内容我们要重点关注。从具体发展状况来看，中国乡土文学的发展阶段可以更进一步细分，比如20年代是鲁迅为先驱的乡土小说创作，30年代则是以沈从文为代表的乡土小说创作，40年代则是以解放区文学中赵树理、丁玲等为代表的等等。不过，这样的划分还有许多不足之处，比如20年代以鲁迅为代表的乡土小说和以废名为代表的乡土小说就分别指向了两个不同的方向。因此，从当下对于乡土小说的研究情况来看，比较普遍得到认可的还是题目中这种划分方式，即二三十年代启蒙主义立场的乡土小说，解放区文艺和“十七年”时期的农村题材小说，以及新时期以来的“新乡土小说”。随着中国整体社会的发展变化，大家对待乡土的态度、立场也在不断地变化，加之西方现代思潮的影响，所以乡土文学的价值判断和创作方法都在不断地发展变化之中。同时，大家需要注意的是，乡土文学的具体作家与流派可能会分别拿出来考查。比如，二三十年代的两种乡村叙事的代表-沈从文和鲁迅可能会被放在一起对比，解放区文艺代表赵树理也可能会和鲁迅、沈从文作对比，新时期以来的乡土文学代表，如高晓声也可能与上述作家对比。对于相关的题目，我们要注意积累。相关内容可以参考孟繁华《百年中国的主流文学-乡土文学／农村题材／新乡土文学的历史演变》、贺仲明《乡土文学与乡村现代变迁》，具体资料可以在李凡文学正版群中领取。"},{"id":"349","stars":"★★★★","title":"汪曾祺新时期小说的艺术成就（26江苏师范大学）","body":"汪曾祺是乡土文化小说的集大成者，其创作横跨40年代和80年代，以80年代为盛。汪曾祺的小说创作以短篇为主，上追“京派”作家“散文化”小说创作趋向，下开寻根文学之先声，在80年代小说作家中产生了重要影响。\n\n一、淡化功利色彩\n\n汪曾祺80年代创作的小说大多是“文化小说”，描绘了一幅幅乡土风情画。与当时许多寻根小说作家一样，他偏爱写风俗，但风俗于他却不只是点缀，他不再承担额外的社会寄托，而是使之上升到小说本体的位置，具有独立的审美内涵。风俗对于汪曾祺而言是一种特定的生活内容，描写它是为了张扬生命情调与审美精神。他的作品也折射着他的哲学思想，流露出道家主张的随缘自适、自足自保的悠然任化的意趣。因此，汪曾祺的乡土文化写作摆脱了功利色彩，呈现为自然、自足的艺术存在。\n\n二、多义的主题内涵\n\n汪曾祺的文化小说，往往在浓郁的乡土风俗画的描写之中渗透着作者传统的哲学意识和审美态度。他笔下的人物总是暗含传统的真善美，并在与假恶丑的对立中获得美的升华。同时，老庄的那种超凡脱俗、回归自然的哲学意念又成为他笔下人物无力反抗黑暗现实，在痛苦中寻求精神解脱的思想手段。这成为汪曾祺的基本审美态度和道德尺度。作者既重视小说创作的潜移默化的认识作用，同时又欣赏和玩味顺乎自然、超脱功利的人生境界。这种入世和出世的相辅相成的审美态度，使他的小说蒙上了一层朦胧的雾霭，释放出一种多义的主题内涵。\n\n三、尽量不露结构痕迹\n\n在小说的结构上，汪曾祺主张“随便”，尽量不露结构的痕迹，这是汪曾祺在结构上的追求。因为更注重日常风俗描写和生活场景的撷取，汪曾祺的小说不讲求故事情节的完整，更少运用伏笔、悬念等叙述技巧，而是按照生活的“本来的原貌”，使小说呈现出如日常生活一般的自然形态，在“散文化”笔法中创造一种生活的“诗意”，在浑朴自然、含蓄委婉中表现和谐的意趣。\n\n四、诗化的小说语言\n\n汪曾祺的小说语言也别具一格，简洁明快，纤徐平淡，绝不拖泥带水，是一种诗化的小说语言。汪曾祺有很深的传统文化功底，他无意于“炼”出那种奇崛的字句，他字字句句都是简易的白话，但一句一句读下来，却感到一句都不能少。当然汪曾祺作品中也有特别值得玩味的句子，但这类特别有味道的句子并不具有“奇”的特性，也不能脱离作品整体而存在，如果把它们从前后文中抽出，仍然是挂单的大白话。具有新鲜而单纯的口语美，这是汪曾祺作品的最大特色。","keywords":"淡化功利色彩 多义的主题内涵 尽量不露结构痕迹 诗化的小说语言","note":"在近年来的考查中，汪曾祺越来越受到重视，不单单是在现当代文学相关题目之中，在文论甚至语言学部分的题目中都会引用汪曾祺的言论或观点，可见这是一个十分重要的考点，大家要重点关注。汪曾祺的小说创作特征，与沈从文一脉相承，二者也往往会放在一起进行对比，大家也要注意一下。"},{"id":"350","stars":"★★★","title":"汪曾祺80年代小说创作具有怎样的价值","body":"作为中国乡土文化小说的集大成者，汪曾祺的小说创作向上呼应了冯至、沈从文等人，接续了一度中断的“散文化小说”传统，向下被推为“寻根文学”的先声，更新了当时小说创作观念，启发了当代作家的文体自觉意识，对新文学发展产生的深远的影响。具体来说，汪曾祺的价值，表现在以下方面。\n\n一、完成了对“十七年”以来小说创作原则的反叛，是新时期小说的滥觞\n\n以刘心武《班主任》代表的“伤痕小说”被视为新时期文学的肇端，但这些小说的“新”主要表现在其主题指向的批判性，就其创作观念来说，仍未摆脱“十七年”文学的约束，其内在叙述动机、叙述结构和叙述范式仍旧是“十七年”文学那一套。而汪曾祺1980年创作的《受戒》则是对“十七年”时期创作的功利性，题材的重大性，人物的典型性，格调的时代性这些创作原则和规范的一次彻底地叛逆，向创作者们展示了小说创作的另一种可能，有力地号召了创作者回归小说美学规律探索，促进了小说自身审美功能的回归，具有开创文风和启蒙性的双重价值。\n\n二、为新时期小说提供了一个独具审美品格的范例\n\n汪曾祺偏爱写风俗，但风俗于他却不只是点缀，他不再承担额外的社会寄托，而是使之上升到小说本体的位置，具有独立的审美内涵，表现一种淡泊的意趣。在小说结构上，汪曾祺采用散漫的叙述风度，尽量不露结构痕迹，与情节一人物为中心的叙事模式保持距离。在语言上，汪曾祺使用诗化语言，新鲜而单纯，消解了以往小说语言图解一教育的功利色彩。这些都使他与主流文学保持一定的距离，而突出其小说的审美品格，以其鲜明的艺术个性赢得了广泛关注，并由此产生了强烈的影响，形成了持久的精神辐射。\n\n三、承接和延续了“散文化小说”传统\n\n在很长一段实践中，废名、沈从文这两位作家都处于“被忽视”的状态，这意味着他们所共同崇尚和实现的“散文化小说”的中缀和断裂，这使得中国当代小说史出现了“空白”。进入新时期以后，汪曾祺以其创作和实绩，与废名、汪曾祺形成了呼应，传承和延续了“散文化小说”，向下影响到了阿城、贾平凹等作家，使一个曾被中断的文学风格流派在新时期小说格局复苏，并占据了显眼的位置。不仅如此，汪曾祺还诱发了其他文学流派的诞生，如寻根文学。\n\n可以说，汪曾祺以其独特的创作和实绩，促进了小说审美意识的回归，为新时期小说提供了一个优秀的审美范例，\n\n并延续了“散文化小说”传统，影响了一代小说作家，有力地促进了新时期小说创作的繁荣与多极化，这是汪曾祺的价值所在。\n\n【李凡关键&#x8BCD;：审美功能的回归 开创文风 启蒙性 独具审美品格的范例 承接和延续】","keywords":"","note":"讨论汪曾祺小说创作的价值，不应只局限于其小说自身，而应将其放入中国当代文学史之中，以一种历史的、宏观的角度进行分析。从总体上看，汪曾祺的价值主要在于促进当代作家审美规律探索，延续了以废名、沈从文为代表的“散文化小说”传统，并以其创作实绩为当代作家提供了优秀的范例。这部分内容，我们要掌握。"},{"id":"351","stars":"★★★★","title":"汪曾祺小说和中国传统文化的关系（25江西师范大学）","body":"【答题框架】\n\n作为沈从文忠实弟子的汪曾祺，继承了沈从文乡土抒情小说的传统，都从传统文化角度再现了乡土文化和民族心理。不过，沈从文小说更多受了楚巫文化的影响，汪曾祺作品主要浸淫着中原文化的传统。纵观汪曾祺的小说创作，我们可以清晰地寻觅到渗透其内心漫于作品中以儒家为主、庄禅为辅的中国传统文化意识。\n\n一、中正平和的审美追求\n\n汪曾祺有着独特的审美方式，渗透了中国传统文化色彩的审美追求。儒家主张在礼的节制下达到个体与社会的和谐，庄禅立意在超脱和自由中追求个体与自然的和谐，这构成了以中国传统文化中和主义为根本精神、以和谐美为主要特征的审美境界，形成了以伦理型审美型为内核的中国文化传统的温柔敦厚的风格。\n\n深受中国传统文化濡染的汪曾祺，执意追求的正是熔铸了中和主义审美观的和谐的审美境界。在汪曾祺不注重在剧烈的矛盾冲突中展开曲折跌宕的故事情节，而是在舒缓平和的抒情笔调中深情地重温旧梦，含蓄自然地流露他对生活的思考与追求。在汪曾祺的小说世界里，虽然有一些恶人，但更多的是一些质朴宽厚、平和仁爱的下层百姓，一些挑夫小贩等引车卖浆者流。在古朴的乡镇社会里，人与人的交往率直真诚，人和人的关系融洽和睦。\n\n二、平民意识的理性张扬\n\n儒学是中国古代文化传统的主导倾向，作为其中最重要的哲学范畴的“仁”既可集中在“克己复礼”上，又可确定在“仁者爱人”之中，后者是具有恒久意义的人道主义精神。五四时期，人道主义、平民意识成为五四先行者强有力的思想武器。这种古代文化传统和五四新文化都给汪曾祺以极大的思想启示。同时，他的生命历程又使他坚信其现实的人生意义，民主的家庭环境、农民的宽厚、市民的朴质无不使他感受爱的博大，以后编辑民间文学刊物，逆境中与农民的朝夕相处更使他体味到平民意识的温爱与深厚。\n\n平民意识在汪曾祺的笔下呈现出两种表现形态：对普通劳动者人性美的赞颂和对人性异化的批判。汪曾祺笔下的人物大都是普通劳动者，这些农民与市民的生存境况构成了现代中国农村与小镇的风俗画，他们的身上闪现着人性的亮光。但汪曾祺并没有停留在这个层次上，他始终意识到平民意识中的负面意义，深刻地揭示了小市民的庸俗、保守和虚伪。不仅如此，汪曾祺对下层劳动者人性的异化进行了无情的拷问，卖艺人彼此的冷漠、摆摊老太婆相互的仇视、老板与师傅间的倾轧等等\n\n无不深藏着作家对人性的忧患。这是一种理性的自觉，毫无疑问汪曾祺的眼光具有现代理性的洞彻力，使他笔下的平民意识蕴含着深邃的文化批判精神。\n\n三、主情的小说创作主张\n\n中国古代文学自《诗经》和《离骚》便形成了抒情传统，汪曾祺无疑承继了主情的传统，晚明小品尤其是归有光的散文以其“轻淡”“亲切而凄惋”的文风又给了他艺术滋养。汪曾祺在青年时代就力主小说应该更“像诗、像散文、像戏剧”，时隔几十年之后他在许多场合都强调在文体上诗与散文对小说创作借鉴的意义。\n\n汪曾祺早期的许多小说都有浓郁的抒情性，且不说《复仇》《猎猎》《小学校的钟声》等小说盎然的诗意，就是其他有一定叙事色彩的小说也无不洋溢着抒情的氛围，《艺术家》《鸡鸭名家》《老鲁》中的许多章节都是精致的抒情美文。更为重要的是汪曾祺把现代小说的抒情传统带入了新时期文坛，他的《大淖记事》《受戒》形成了持久的冲击力。这种清新的抒情风格突破了几十年来的“性格-情节”小说模式，使之成为当代文学中相当重要的脉流。\n\n四、浓郁的庄禅意识\n\n汪曾祺认为他接受道家禅宗想心的影响很少，其实他的内心深处却积淀着较浓郁的庄禅意识。在汪曾祺的小说天地里，虽然也描述了坎坷人生的磨难、世俗生活的烦恼，但他着力将质朴敦厚人们的身影融汇于清丽恬淡的自然风光里，交织于古朴宁静的乡镇风土中，并时常在人物身上寄寓对宁静超脱的生活境界的向往。《钓鱼的医生》中的王淡人追求着给人看病、河边垂钓、一庭春雨、满架秋风的清苦闲适的生活。《异秉》里的陈相公沉溺于登高四望的绿树白帆、风筝鸽子、七色云彩的心旷神怡的景色。\n\n不仅如此，汪曾祺常从孩童稚气的心理和视角去展现山光水色，他将稚朴的童真和美丽的自然融为一体，创造出诗意盎然的境界，比如在《受戒》中，作者就将纯洁无瑕的处子之爱，和清丽恬静的乡村风光融为一体，在极富诗意的生活场景的描写中，道出了一个少男少女的初恋故事，情和景相生，人和境相融，沁出一种浓郁的庄禅色彩。","keywords":"中正平和 审美追求 平民意识 理性张扬 主情 小说创作主张 庄禅意识","note":"汪曾祺在新时期以《受戒》等为代表的乡土小说创作，某种意义上可以说是寻根文学思潮的先声，也正因此，汪曾祺的小说与寻根小说一样，浸润着中国传统文化，这具体表现在其审美追求、创作主张等诸多方面。大家在答题时，结合汪曾祺的小说具体分析即可。相关论文可以参考杨剑龙《论汪曾祺小说中的传统文化意识》、杨志勇《传统的自觉-汪曾祺创作论》，具体资料可以在李凡文学正版群中领取。"},{"id":"352","stars":"★★★","title":"如何理解汪曾祺笔下“民间世界”及其审美理想的关系（26江南大学）","body":"传统浓郁的家乡氛围、士大夫的家庭环境以及文弱善良的个性气质。这些因素都促进汪曾祺融汇传统儒家与道家的影响，形成了一种“和谐”的审美理想：平易恬淡、随遇而安。在和谐艺术观指导下，汪曾祺一直在追求人格理想与审美理想的互融，并将这种理念结合自己的创作实践，形成独有的艺术风格。而这，也影响了汪曾祺笔下“民间世界”的建构，在这种“和谐”审美理想的影响下，汪曾祺的“民间世界”表现出了以下特征：\n\n一、“平民化”的选材取向\n\n从题材上看，汪曾祺的小说可分为六个方面：以故乡高邮为背景，主要是描写旧生活的小说；以抗战时期的昆明为背景的小说；以塞外的农场果园为背景的小说；以北京世俗生活为背景的小说；以“文革”为背景的小说以及改编的古代小说。对于现实生活中的题材，汪曾祺总是选择那些与平常百姓息息相关的内容，因为“那些挑夫不是穿长衫念子曰的人，他们的是非标准、伦理道德观念跟我周围的人不一样，他们是更高尚的人，虽然他们比较粗野”。他一边歌颂传统美德的继承者，一边同情百姓的悲剧命运，一边描述着百姓的平淡生活。即使是对古代文本的改编，他也力求还原生活中普通人的生活状态。这种平民化的题材使得他的作品“缺乏崇高的、悲壮的美”却体现出汪曾祺和谐的人生观。\n\n二、“世俗化”的审美标准\n\n“平民化”的选材取向似乎就决定了汪曾祺审美标准的“世俗化”。尽管作家一再强调要“写美，写健康的人性”，但处于这样一个时代中，作家不由自主地去面对一个个被扭曲的心灵，一个个落魄异乡的商人和失意小民，他无法回避弥漫于各个角落的时代阴霾。当物质匮乏给人们的精神和肉体带来的双重威胁时，同情读书人斯文扫地，想方设法来解决生计问题的举措也就无可指责。作家几十年的文学创作都着力于表现普通劳动者的真善美，力求其作品引人向上，增加人对于生活的信心，执著于对世俗生活的审美化表现，体现出拒绝理性分析的特点。《大淖记事》中的大淖女人们可以自己找男人，也可以未婚生子，在丈夫之外还再“靠”一个，甚至敢在叔公面前脱光衣服。作者对她们自由自在的生活方式持肯定的态度。\n\n三、“净除火气”的处理方式\n\n汪曾祺的叙事观点是纯粹个人化的，他称之为“净除火气”，他讥讽不适当表现地情感的人。就人物与环境来说，汪曾祺的许多小说都潜伏着各种矛盾和冲突。而在大多情况下，作者都以息事宁人之心，化解这些矛盾，以维持他所追求的和谐与平淡。他笔下的那些卑微的小人物所追求的只是能平平安安地生活，然而外在的环境却时时在限制、压迫和摧残着他们。汪曾祺就善于设置在这种困境下人的精神境界，让他笔下的人物展示不寻常的一面。《仁慧》中的仁慧尼姑在工作组的压力下断然拒绝还俗，情愿四方漂泊。在汪曾祺的大多数作品里，尤其是前期作品，对立因素之间即便有冲突，汪曾祺也能用平和冲淡的叙述予以化解。人物即便被环境迫害致死，也平静地死去，而又被作家平静地叙述于作品中。如《大淖记事》中巧云被刘号长强奸，十一子被打成重伤，这本来是相当激烈的矛盾冲突，而作者只是让锡匠们以顶香请愿的古老的和平方式来解决。在《受戒》中写明子与小英子将船划进芦苇深处时没有生命的冲动，而是化灿烂于平淡。\n\n综上所述，汪曾祺笔下的民间世界，是由其“和谐”的审美理想所统御的，而这具体表现在题材选择的平民化、审美标准的世俗化和处理方式的平和化上。这种“和谐”的民间世界，在80年代那样一个激荡的时代无疑是别开生面的，因而具有十分重要的意义。","keywords":"“平民化”“世俗化”“净除火气”","note":"汪曾祺接受了传统儒家和道家思想，并将其融汇，形成了独特的“和谐”的审美理想：平易恬淡、随遇而安。这种审美理想同样渗透在他的作品中，影响了他笔下民间世界的建构，所以我们看到，他的民间世界具有平民化的题材、世俗化的审美和平淡的矛盾处理。相关内容可以参考王宏根《和谐-汪曾祺小说的美学追求》。"},{"id":"353","stars":"★★★★★","title":"谈谈废名、沈从文和汪曾祺乡土抒情小说的联系与区别","body":"在中国现当代文学史上，从废名、沈从文一直到汪曾祺，构成了一道清晰的脉络。以他们为代表的一派“乡土抒情小说”或者说“散文化小说”，游离于“主旋律”之外，但却是中国现当代文学毋庸置疑的一部分，并在当下越来越受到批评家的重视。这三位作家一脉相承，有着相似的艺术追求，但具体来说，又有一些细节上的区别，主要表现在以下方面。\n\n一、自觉的民间文化立场，与“主流”疏离\n\n无论是废名、沈从文还是汪曾祺，都自觉站在民间文化的立场上，以一种“乡下人”的态度去构筑了一个美好的乡下世界。而相较于当时主流的以批判、否定为主的乡土写实小说，他们的民间文化立场是审“美”的，展示的是古老悠久与淳朴美好的“民间”生活。同时，在对待传统文化的态度上，他们也与当时主流对待传统文化的批判态度不同，他们在认识到传统文化中的糟粕的同时，也肯定了传统文化的价值，积极从中汲取艺术资源。这使得他们与“主流”相背离。\n\n不同的是，三人所要达到的目的不同。废名构筑美好的乡村世界，是希望沉入“梦”里，逃避现实的苦难，驱逐现实生活中的丑恶和悲哀，以冲淡平和的格调消除心中的悲恸，从而摆脱现实生活中的精神困惑。而沈从文则是希望通过对美好“湘西世界”的构筑，把“野蛮人的血液”注入“中华民族老态龙钟的身体里”，也就是说，沈从文的审“美”包含着“入世”的文化改造理想。而汪曾祺追寻民间传统，是为其小说现代性服务的，而他所追求的，正是一种朴素的人道精神和理想人格的追寻。\n\n二、对人性美的歌颂和超脱隐逸的倾向\n\n与主流乡土文学着眼于现实不同，废名、沈从文和汪曾祺他们主要着眼于自然层面，体现出的是中国人在纯朴宁静乡村生活中孕育的生命哲学，在对诗意乡土画卷的描画中寄托自己深沉的情感，表现了一种“返归自然”的哲学与审美潜流。\n\n废名、沈从文和汪曾祺，其返归自然的人生观念与审美倾向，主要来自中国传统思想文化的熏陶，不过，由于三位作家的人生经历、个人体味各不相同，所以他们对待“自然”具体的态度又有不同。废名信仰佛教，崇尚老庄，深受佛禅和道家思想影响，其更接近古代隐逸派士大夫；沈从文虽未受过系统教育，但其对自然的态度，源于生命体验，与老子哲学暗合；汪曾祺结合了废、沈，却又不同于二者，融合了庄禅与儒家，清高但不孤傲，朴素而仁蔼。\n\n三、散文化的结构与诗化的语言\n\n废名、沈从文和汪曾祺的小说创作都有一系列明显的特征，小说体式上不重情节与人物，强调叙述主体的感觉、情绪在创作中的作用，往往具有独特的人情风俗的乡土内容；在语言上则追求纯真的美文效果，以诗、散文融入小说。\n\n这种“诗化”抒情倾向由废名开创，经由沈从文发展，并由汪曾祺所传承。废名是“诗化”小说的开创者，但他的作品语言隐晦，题材狭窄，意境优美却并不开阔；沈从文在小说“诗化”的“探险”中克服了废名语言隐晦的毛病，并且拓宽了创作的题材，将诗化小说带入到了诗意化写实的境界；在他们的基础上，汪曾祺继承了沈从文写意与现实有机统一的观念，\n\n在小说文体上也是不注重故事情节的构建，也不求人物形象的精雕细刻，极力“淡化”人物和情节，力求营造诗歌般的意境。在语言和表现力上，汪曾祺又有所超越。他的语言脱离了隐晦，采用的是明白如话的口语，显得爽朗而有韵味。其作品对风俗风土人情的描写极具特色，散发着一种浓郁的文化韵味，成为了正宗的文化小说。","keywords":"民间文化立场与“主流”疏离 对人性美的歌颂 超脱隐逸的倾向 散文化的结构诗化的语言","note":"废名、沈从文和汪曾祺作为一脉相承的三位作家，常常会被放在一起进行比较，所以对于这三位作家的联系与区别我们要注意一下。这三位作家除了一同出现之外，还可能两两出现，大家也要注意一下。此外，我们还需要注意的是这三位作家的乡土抒情小说与主流的乡土现实小说的区别，可能会放在一起进行对比。相关内容可以参考田晓箐《承续与变异一一沈从文和汪曾祺抒情小说比较论》、周顺利《新文学史上独特的美的使者-废名、沈从文、汪曾祺小说创作综论》，具体资料可在李凡文学正版群中领取。"},{"id":"354","stars":"★★","title":"冯骥才小说创作风格","body":"一、关注风土人情、世事变迁，基于事件营造传奇效果\n\n冯骥才是一个善于讲故事的作家。他关注风土人情、世事变迁，基于事件营造传奇效果，写了以天津为背景的《神鞭》《俗世奇人》《阴阳八卦》等世情小说。他对民间文化和风俗图景具有强烈的好奇心，小说中常见俗事奇人，并善于从中窥见人间的悲欢离合、跌宕起伏的命运。在《神鞭》中，傻二的一条由老祖宗留下的鞭子，变成了可以惩恶扬善、伸张国威的利器；当义和团风潮来临，傻二不得不剪掉他的“神鞭”，成为一名神枪手，并以此重新安身立命。在小说的最后作者也托傻二之口表达了他对于传统精神负荷的看法：“祖宗的东西再好，该割的时候就得割。我把‘鞭”剪了，‘神”却留着。这便是，不论怎么变，也难不死我们；不论嘛新玩意儿，都能玩到家，决不尿给别人。”也有人认为冯骥才的《神鞭》不是普通的一部通俗小说，而是“新寓言小说”。\n\n二、具有浓郁的民俗文化色彩\n\n《阴阳八卦》是冯骥才“怪世奇谈”小说中较有特色的一部。小说以味道纯正的天津方言活灵活现地叙写了活动于天津卫的各路奇人，对惹惹等人物的白描更是出神入化。他写奇人异秉，神异而又不失其可信度，并附着民间众生相。驳杂的民间文化，奇特的市井风情，传奇的生存经验构成了风味浓郁的民俗万花筒。\n\n三、文化价值判断缺席、趣味有余而批判不足\n\n在《啊！》《铺花的歧路》《高女人和她的矮丈夫》中，冯骥才所发掘的人间真情与《炮打双灯》所摹写的人间恩义，都没有成为他美学追求的目标，倒是丰富驳杂的民俗文化成为他的精神家园。随着民族叙事的推演，“寻根文化”依附于民俗文化的叙事，多有明确的价值判断，但冯骥才却堕入民俗书写的趣味之中。这让他的《三寸金莲》惹起对他文化价值判断缺席、趣味有余而批判不足的非议。这在一定程度上也促使他后来终止了小说创作，进而专注于对民俗的保护，成为民俗文化身体力行的捍卫者。","keywords":"风土人情、世事变迁 营造传奇效果 民俗文化色彩 批判不足","note":"已过古稀之年的冯骥才已经渐渐远离作家的光环，一年中有多半时间都在中国那些濒临消失的古村落间奔走，出现在媒体和公众面前谈论的也都是古村落保护。从这一点，我们可以看出冯骥才对民俗文化的关注，大家可以从这一点出发去认识冯骥才的创作特征。不过，冯骥才着重于文化的展现而缺少价值判断，因而受到了批评。这些内容，我们要了解一下。"},{"id":"355","stars":"★★★","title":"简述“寻根文学”产生的原因","body":"1985年文化寻根意识的崛起，在政治和文化的多重关系下直接带动了文学上的实验，唤起作家艺术家对艺术本体的自觉关注。这种意识体现在文学艺术领域，便是“寻根文学”的出现。具体来说，“寻根文学”产生的原因主要包括以下方面：\n\n一、现代化经济建设发展推动\n\n文化寻根思潮在当时与社会背景有密切关系，随着现代化经济建设的发展，西方现代文化思想也就相应地进入中国，打破了过去意识形态方面闭关自守的愚昧状态。中国在经济起飞之际应该如何把自身的文化传统作为接受场，来检验、吸收西方现代文化以求发展自己的现代化？这个问题在当时人文知识分子中间逐渐引起关注，具体表现在对传统文化的价值作出多元的考察，于是，重新研究、认识、评价中国传统文化成为一种既是客观的需要，也是主观上的要求，到了1985年前后，文化领域兴起了一股规模不小的文化热。“文化寻根”是这股文化热在文学艺术领域的反映，它与弘扬民族文化的国家意志和引进西方现代主义的文学思潮巧妙地结合在一起，所以得以较顺利地发展。\n\n二、新时期文学艺术内部变革的结果\n\n从文学自身来看，文化寻根小说是新时期文学艺术内部变革的必然结果。受80年代上半期文学艺术领域“现代派热”的影响，作家们试图为自己找到一块合适的实验场，同时也使“现代派”受到质疑的文学观念合法化，因此，西方的表现手法加上本土文化内涵应该是一个最好的途径。所以，文化寻根小说不是像汪曾祺等民俗作家那样向民族传统文化的回归，而是通过对民族文化的挖掘与审视，以便更有利地接受西方现代主义文化。\n\n三、外来文学影响\n\n文化寻根意识的确立与外来文学的影响也不无关系。前苏联一些民族作家（如艾特玛托夫、阿斯塔菲耶夫等）对异族民风的描写、拉美魔幻现实主义作家（如马尔克斯、阿斯图里亚斯等）关于印第安古老文化的阐扬以及日本川端康成的具有东方风味的现代小说，对中国年轻一代作家是深有启发的。这些外国作家的作品在表现出浓厚的民族文化特征和民族审美方式的同时，又渗透了现代意识的精神，既富有民族文化独特性，又融合了现代感的创作倾向，为主张“文化寻根”的中国作家提供了现成的经验和有效的鼓励。","keywords":"现代化经济建设 内部变革 外来文学 经验和鼓励","note":"“寻根文学”的出现，有其多方面的原因，它既是现代化经济建设催发的文化热在文学领域的反映，又是文学自身内部变革的需要，还受到了西方文学的影响。寻根文学出现的原因单独考查的频率不高，但这部分内容十分有助于我们理解寻根文学的整体特征，所以大家要注意一下。"},{"id":"356","stars":"★★★★","title":"谈谈寻根文学的特征","body":"一、关注世俗日常生活\n\n“寻根”的主张，推动了这个时期已经开始的文学表现领域的转移，出现偏离强烈政治意识形态性，偏离现实批判、政治历史反思的现象。这种情况的表现之一，是小说对于世俗日常生活及与其相关的风俗、地域文化的浓厚兴趣。不少作家认识到，特定地域的民情风俗和人的日常生活，是艺术美感滋生的丰厚土壤，并有可能使对个体命运与对社会、对民族历史的深刻表现融为一体，加强对传统生活方式的了解，表现这一生活方式在现代的变迁，为不少小说家所重视。\n\n二、历史、美学观复杂多元，关注民间文化\n\n“寻根”倾向的小说在历史、美学观上，不管是整体面貌，还是个别文本，都显得较为复杂暖昧。其中有一些作家，倾向于从民族文化和大自然中寻求精神力量，以求达到对当代生存困境的解脱和超越，另一些作家则更多地表现为对人类生命本体和生存方式的关怀。需要注意的是，由于传统文化的原初精神多已散失在民间，所以对民族文化之根的探询过程实际上也就是对民间的发现过程，寻根作家们在追求新的文学价值时，其实多半是把目光投向了未被意识形态内容遮蔽的民间文化，认为只有在这种非正统文化中才最大程度保留着民族自身的蓬勃生命力。\n\n三、以现代意识审视中国传统，开发传统小说艺术要素\n\n在小说艺术的探索上，一些作家受到诸如福克纳、加西亚·马尔克斯的启发，把对于生活情景、细节的真实描述，与幻想、象征、寓言的因素合一，创造一种独特的艺术情境。叙事变换的技巧也在一些作品中得到模仿性的运用。\n\n不过，以现代意识来审察中国传统审美思维、表达方法，开发传统小说的艺术要素，成为“寻根”文学艺术创造更主要的追求。这首先表现为小说整体情调、氛围营造的重现。其次，小说语言或者向着平淡、节制、简洁的方向倾斜，或者直接融进文言词汇、句式，以丰富语言的内涵、表现力，增强小说语言的“柔韧性”。另外，小说的章法、结构、叙事方式，也都可以看到向古代小说取法的情况。\n\n四、鲜明的地域色彩\n\n“寻根”文学作家们更倾向于探询自己家乡独特的文化地理风貌，并将其作为故事讲述的环境。独特的地域文化性格在“寻根”文学中成为一种富有个性的人文景观，如阿城就长期将自己家乡风物作为主要叙事场景，写出了地域文化中的“这一处”。不止如此，阿城成功将地域文化的信息植入到人物性格甚至精神层面，与小说的叙事风格融会贯通，提升了小说的意境和韵味。\n\n五、含蓄的“国民性”思考和启蒙意识\n\n“寻根文学”体现出了“优患意识”和使命感，体现出了对“国民性”的思考，这与鲁迅的“国民性”批判和启蒙意识一脉相承。不过，它不是激烈地批判现实的不合理性，唤起人们的反抗意识，而是带领人们走进中国文化的深处，认识到现实与历史文化的密切联系，从而对传统的中国文化引起警觉与批判。因此，“寻根文学”是从反面帮助人认识了人的有限性、\n\n劣根性或中国人的“国民性”，是为了让人能够更真实地了解把握自身，从而实现人的真正解放。","keywords":"世俗日常生活 复杂多元 民间文化 现代意识 传统小说艺术要素 地域色彩“国民性”思考 启蒙意识","note":"寻根文学的特征大家可以结合其诞生背景来理解，由于其诞生于80年代的“文化热”，所以其表现出对传统主流意识形态的叛逆，关注日常生活、民间文化，取法传统小说；同时寻根文学又受到西方现代文学影响，所以又学习西方现代文学的技巧、思维。这两方面的内容，我们都要体现出来。"},{"id":"357","stars":"★★★","title":"简述文学“寻根”的提出，对文学创作，尤其是小说创作产生的多方面影响","body":"1985年文化寻根意识的崛起，在政治和文化的多重关系下直接带动了文学上的实验，唤起作家艺术家对艺术本体的自觉关注。“文化寻根”是这股文化热在文学艺术领域的反映，它与弘扬民族文化的国家意志和引进西方现代主义的文学思潮巧妙地结合在一起，所以得以较顺利地发展。\n\n所谓“文化寻根”意识，大致包括了以下三个方面：\n\n一是在文学美学意义上对民族文化资料的重新认识与阐释，发掘其积极向上的文化内核（如阿城的《棋王》等）；二是以现代人感受世界的方式去领略古代文化遗风，寻找激发生命能量的源泉（如张承志的《北方的河》）；三是对当代社会生活中所存在的丑陋的文化因素的继续批判，如对民族文化心理的深层结构的深入挖掘。这虽然还是启蒙主义的话题，但也渗透了现代意识的某些特征（如韩少功的《爸爸爸》）。而这种“文化寻根”意识，对作家们的创作产生了以下影响：\n\n一、对一种人格境界的美感塑造\n\n由“寻根文学”作家创造出的审美形态是多种多样的，大都生发于作家主体的独特感受和各自文化背景下不同的审美理想。其中有一些作家倾向于从民族文化和大自然中寻求精神力量，以求达到对当代生存困境的解脱和超越，这在作品中往往表现在对人物的刻画上，通过具有生命活力的人格形象表达出文化魅力，并以此完成了对一种人格境界的美感塑造。\n\n二、对人类生命本体和生存方式的关怀\n\n除了这类对人格境界的审美塑造，“寻根文学”也体现出了另一种新的文学思维，即对人类生命本体和生存方式的关怀。韩少功的《爸爸爸》《归去来》《女女女》等小说都带有这方面的探索意义。在《爸爸爸》中，作者以现代意识来审视一个原始部落的生存方式，用象征的方法描绘出个体生命、种族生命以至人类整体的生命存在之间的关系，以及生存的艰难过程。\n\n三、开启了民间在当代文学中的还原过程\n\n需要注意的是，由于传统文化的原初精神多已散失在民间，所以对民族文化之根的探询过程实际上也就是对民间的发现过程。寻根作家们在追求新的文学价值时，其实多半是把目光投向了未被意识形态内容遮蔽的民间文化，认为只有在这种非正统文化中才最大程度保留着民族自身的蓬勃生命力。因而不仅仅是在专事描写民间风情的《商州初录》等作品中明确体现出了民间的价值取向，即便是张承志等对文化人格的塑造，或王安忆、李锐等对生存意义的探询，也都必然表现出了对民间天地的不同程度的发掘。尽管寻根派作家们还是深受“五四”知识分子精英传统的熏陶，他们在对民间的亲近中仍保持着极强的主体精神，也就造成了他们对文化之根的追寻中有着较多的主体幻想，因而很难说是已经达到了对民间的真正认同，但毫无疑义的是，在“文化寻根”的倡导和发展中，已经开启了民间在当代文学中的还原过程。","keywords":"“文化寻根”人格境界的美感塑造 人类生命本体和生存方式的关怀 民间在当代文学中的还原","note":"文学“寻根”的提出，对于作家的创作意识和创作态度有了很大的影响。总的来说，这些影响包括两方面的内容，一方面是使作家关注“人”，包括对人格境界塑造和对人类生命本体和生存方式的关怀，另一方面是使作家向民间文化靠拢，体现出了一种对传统的复归。"},{"id":"358","stars":"★★★★","title":"结合具体作家作品，分析文化寻根小说的民族性和现代性追求（25北京师范大学）","body":"【答题框架】\n\n“寻根小说”是中国20世纪80年代中期兴起的一种文学思潮，这一思潮的作家试图通过挖掘传统文化、地域特色和民族心理的根源，探索中国文化的本质和现代性转型的可能。这一思潮既是对“文革”后文化断裂的反思，也是对西方现代主义冲击的本土化回应。其民族性与现代性追求，主要表现在以下方面：\n\n一、寻根小说的民族性\n\n（一）在创作实践上，寻根小说作家们试国以注重表现的东方艺术精神来建构审美逻辑关系\n\n阿城的《棋王》《孩子王》等小说，以超然舒缓的叙事态度来表现创作主体的内心体验，那大巧若拙的描写，朴素简洁的语言，平淡冲和、旷达淡泊的艺术人格，都浸润着传统的艺术精神。韩少功由于对楚地神话巫术文化和屈骚浪漫传统的推崇，在他以强烈的孤愤和忧患意识审视着民族劣根性的同时，也以寓言、象征等艺术手段，重新复活了楚文化中光怪陆离、神秘瑰奇的神话系统，而涂抹上浪漫的色彩。张承志不仅从神话传说、古老的民歌和寓言中来结构自己的作品，而且也墨酣意畅地抒写出那感怀千古的澎湃激情和心游八极的浪漫情怀。\n\n总体来看，寻根小说中的这种崇尚直觉、情感体验、妙悟和表现的艺术观念，是潜在的历史审美意识在当代小说创作中的复苏，在审美领域中拓宽了艺术思维的空间，使作家的个性才情得以更加充分的发挥。\n\n（二）庄子美学情致的浸润\n\n寻根作家对中国艺术精神源头之一的庄子的美学情致，表现出浓厚的兴趣，尤其是庄子自由独立的艺术人格，超脱世俗功利的审美的人生态度，自然无为、返璞归真的审美理想，“万物与我为一”的审美境界，都成为开启寻根作家艺术灵感的钥匙。\n\n阿城《棋王》中的王一生，在动乱的岁月里知足常乐，随遇而安，在访棋友悟棋道中悠然自得，寄情于楚河汉界之中，来躲避纷纷扰扰的外部世界，以求心灵的宁静和自由。郑万隆的“异乡异闻”系列小说对那些山野汉子们粗犷强悍、质朴自然的感性力量的张扬，莫言对祖辈们视人间礼法的无拘无束、自由自在的生命形态的认同，也无不同庄子的富有情感而独立自由的人格理想密切相关。\n\n寻根作家不仅从独立自由的艺术人格上认同了庄子，而且在人与自然、宇宙的精神联系中寻求美的追求上，也同庄子“身与物化”的审美境界相契合。他们对嘈杂喧嚣的都市文明有着一种排拒心理，而对那朴实天然的自然状态却有着一种亲近感。莫言的《红蝗》对现代都市文明的厌恶，使他对故乡农村那天然合理的素朴状态进行了热情的礼赞。张承志的主人公也告别了城市，到茫茫草原、条条江河中去寻找精神的慰藉和理想的归宿。\n\n（三）屈骚浪漫精神的濡染\n\n寻根作家对屈骚浪漫主义精神也充满了欣羡之情。屈原的作品很少受儒家实践理性的束缚，洋溢着自由不拘的个性精神。这正是寻根作家们心向往之的重要原因，他们也以神话传说、巫术活动，狂放的想象，寓言象征等来建构自己的作品，并贯注于澎湃的激情，以此来反叛理性的压抑，使文学回归到艺术生命的本质属性上。\n\n在寻根作家笔下的艺术世界中，也充满了原始的活力，浪漫的激情，弥漫着神秘的氛围。韩少功在《爸爸爸》《女女女》《归去来》《蓝盖子》《史遗三录》等小说中，给我们展示了一个神秘怪诞、充满了巫术文化的艺术世界。贾平凹在表现陕南山区文化风貌的时候，也把巫术文化引进小说创作之中。《西北口》中那声势浩大的祭神活动，表现出村民们在旱魃的淫威面前无可奈何的情感。\n\n二、寻根小说的现代性\n\n（一）自觉地民间价值立场\n\n寻根小说的出现除了以往所说的政治环境的影响之外，还有“文化热”的有力推动。1982年，《百年孤独》荣获诺贝\n\n尔文学奖，这样的事实无疑给盘旋在文学低空的中国作家们相当大的文化自信，启发了中国作家可以用本土的文学艺术之根来表达现代性的观念。由此，文化尤其是远离城市主流文化的“民间文化”成为作家们塑造人物性格过程中必不可少的盐分。寻根作家所寻找到的文化之根和繁华的都市没有关系，它们或存在于村庄田头、胡同里弄、海边江上和森林草原里，或见于俚语、野史、传说、笑料、民歌和风俗中。贾平凹在商州的山川、人物和习俗中找到了它，乌热尔图在大兴安岭森林中鄂温克人的身上找到了它，扎西达娃在藏族的神秘文化和异域风情中找到了它，李杭育则在葛川江上“最后”的渔佬儿那粗犷、豪放、硬朗、洒脱的个性中找到了它......比之以工业化和城市化为代表的现代文明，他们情感的天平明显偏向以天人和谐为生存准则的农业文明。他们在写作中开始自觉地把目光投向日常和民间，叙写那存在于民间的乡风民俗，礼赞那种朴素和谐的人与人、人与自然之间的关系，表达民间文化的富有活力、自由自在和生机勃勃。\n\n（二）反思启蒙现代性，张扬审美现代性\n\n寻根小说主张以价值理性对抗工具理性，反思启蒙现代性造成的人性的疏离和异化，因而倡导审美现代性的制衡。寻根小说当然有对传统文化和民族心理的启蒙主义式的批判，但与此同时，对重建一种极富感性、诗性、神性的“人文魅性”文化的要求则更为迫切，期望以此对现代性的科学主义弊端予以补充与校正。\n\n在寻根作家眼中，以城市文明为代表的“现代”文化模式，到处充满了功利、算计，“唯实唯利”是崇，对人性造成了极大伤害和扭曲，而且，它的各种负面影响也开始逐渐蔓延于广大的乡村，对传统乡土伦理和文明造成冲击。痛感于现代文明的这种片面性，意识到原始生命力被抑制与阉割的深层危机，作家们开始满怀忧患地对城市文明带来的这种人际关系异化、人格人性扭曲、社会道德失范现象进行揭示，表达“对于拜金主义的批判，对于人格上委琐、蒙昧、造作、虚伪的厌恶，对于工业文明的异化以及城市综合征的警觉”。\n\n同时，作为弥补和制约，作家们着力于对乡村原始文明和自然的生命状态进行礼赞，呼唤元气淋漓的野性与强力，缅怀和谐、淳朴的人伦关系，力图以这种本真、素朴的人性以及明显理想化了的、保留在自然山水和乡土田园中的人与人之间的真挚感情来对抗工业文明、商品经济中唯利是图的庸俗市侩哲学，挽救当下人性的堕落。郑义、郑万隆、王安忆、李杭育、韩少功、贾平凹等作家的作品里对此有形象的表达。\n\n（三）对人与自然和谐关系的思考与追求\n\n在工具理性的价值观念下，人们对待自然万物采取的是一种功利的、算计式的态度，一种“一切为我所用”的无限制的索取态度，却缺少目的性的关怀，这不仅造成了严重的生态危机，同时也招致了同样严重的精神危机，如道德滑坡、信仰沦丧、精神萎缩等。寻根作家较早就觉察到了这一点，他们不光描绘人与自然之间神秘的联系以及和谐共生的关系，更敏锐地意识到自然生态与人类文化之间有着内在而潜隐的联系，所以他们的创作更注重从文化的角度反思和批判现代文化对自然生态的破坏，强调“回归自然”，维持文化和生态的多样性，达到自然生态和精神生态的双重和谐。这些作品包括贾平凹的“商州系列”、李杭育的《最后一个渔佬儿》以及阿城的《树王》等。","keywords":"民族性 创作实践 东方艺术精神 庄子美学 屈骚浪漫精神 现代性 自觉地民间价值立场 反思启蒙现代性张扬审美现代性 人与自然和谐关系 思考与追求","note":"文化寻根思潮是80年代出现的一个创作思潮，它的民族性其实是比较好理解的，因为是寻找民族的“根”，那必然就会从民族传统之中汲取营养，显示出民族性。但同时我们也要注意到，寻根文学思潮的出现，是受到了当时西方文学传入的影响的，而之所以倡导寻根，正是由于对现代化发展下中国传统文化丧失的反思，而这种对启蒙的反思、对现代性的反思，某种程度上也是现代性的表现。相关内容可以参考张旭东《“文化守成”与多元现代性追索：寻根小说再审视》、李晶《“审美现代性”视野下的寻根小说》、张学军《寻根小说的美学追求》，具体论文可以在李凡文学正版群领取。"},{"id":"359","stars":"★★★","title":"试分析阿城的小说创作特征","body":"一、浓郁的短篇小说意识\n\n阿城没有写过长篇小说，他的创作以中短篇小说为主。他和汪曾祺都有浓郁的短篇小说的文体意识。“短”不仅体现在阿城小说的篇幅上，同时也体现在其句子极为短小凝练。因此阿城的语言平中见奇，短而隽永，身怀绝技却惜墨如金。丰厚的文化积淀和良好的语言感觉，使他比同代作家呈现出对“文革”历史经验更好的叙事能力。\n\n二、重视文学民族传统的继承\n\n阿城的小说采用的是略带幽默的白描的叙述方式，语言自然、素朴，但不浅俗；重视人物、事件直接呈现，避免情感的过分外露，也抑制叙述人的过分干预。这些，都可以见出对明清白话小说语言和叙事方式的借鉴。老到简练又有韵味的语言、\n\n广博的文化素养、高亮的眼界，使得阿城的小说富有文学美感和思想深度。他的每篇小说都简约传神，平白晓畅，富有诗意。依靠故事情节的吸引力和语言自身的美感来吸引读者，在这一点上阿城开文学风气之先。\n\n三、新的视角与历史的“批判性”\n\n阿城提供了另一种视角，即从基本的生存活动上表现“芸芸众生”的“文革”生活。阿城小说的选材对象大多以“文革”&#x4E2D;具体的人、事为主。“三王”（《棋王》《树王》《孩子王》）以及《遍地风流》中的多数篇章是以知青或“文革”中的“人”为主要描写对象，但作者并没有因为怀旧而宽容了这个时代的荒谬，也没有因为亲身经历的磨难而消沉。在各种反思、痛斥“文革”的潮流中，他显得更沉着，以至于有宽宥的意味。\n\n然而他的立意远不止于这个特定的年代，而是要把时代经验向更宽广的方向上延伸和渗透。阿城受父亲钟惦棐的影响很大，通晓儒释道等哲学。他的每篇小说都呈现他对人的灵魂细节的某种顿悟，而所有细节都与时代经验相关涉。他无限的悲哀也在叙事中慢慢消融为沉稳的力量。“寻根”在阿城的作品中，主要表现为从传统文化中寻找理想的精神，作为人对世俗生活超越的凭借。作品中流露出对朴素、本源推重的生命意识，以及推重直觉体验的感知方式。而作品对这种“超脱哲学”的精神境界的渲染，本身便具有历史的“批判性”。","keywords":"短篇小说意识 文学民族传统 新的视角 历史的“批判性”","note":"阿城的小说独具特色，短小精悍而不失思想的深度，语句简洁明快，短句刚健，用多个剪辑的小镜头来建构小说的背景图画。文言书面语和单音节词的大量使用，使得语言富有跌宕起伏的节奏感，在文白相杂的审美实践中表现出小说语言原始的感染力。他的作品，就句式而言，整散结合、文言句式和口语句式相结合，形成了一种雅俗共赏、收放自如的特点。阿城的小说创作特征集中体现在《棋王》这部作品之中，二者可以联系在一起进行记忆。这部分内容，我们都要掌握。"},{"id":"360","stars":"★★★","title":"试分析《棋王》的思想艺术成就","body":"一、思想价值\n\n在《棋王》中，阿城脱离社会历史的自足性，探寻人在荒谬时代的另一种精神根据。他在小说中融入了自己关于古典文人及精神道统的理解，希望在文化贫瘠和思想孱弱的无根时代，能够起到一些救赎的功用；在审美价值和高贵灵魂旁落的时代，他希冀通过展示王一生的生存境界，来隐喻卑贱的生命境况也可以实现灵魂的升华。\n\n阿城呈现了在犹如文化沙漠的特定年代，传统文化仍坚韧存在的力量。小说非常形象地说明，在经过彻头彻尾的文化洗劫之后，唯一能够存留并给予精神滋养的恰恰是与文字无关的东西，那就是植根于民间、生生不息的传统文化。\n\n二、人物塑造\n\n《棋王》的主要魅力来自于主人公王一生。这是一个在历史旋涡中具有独立生活方式和生命力的人物形象，他的整个人格中投射着久远的、富有无限生机的文化精神，这使他一已的单薄存在显现出了无可比拟的顽强精神和文化魅力。\n\n小说中写王一生天性柔弱，在“文化大革命”这样的浩劫中，像他这种小人物好比狂风中的沙粒，要在不能自主的命运中获得意义和价值，唯一的力量只能来自于内心，寻求自身精神的平衡和充实。\n\n阿城在塑造王一生这个人物形象、写出他的无为的人生态度与有为的创造力时，力图表现古代道家文化思想。贯穿在小说里的是有为与无为、阴柔和阳刚的相互转化，生命归于自然、得宇宙之大而获得无限自由的所谓“道理”，并进而把这种传统文化精神与当代人生联系起来，赋予其进取的现代意义。但作家没有直接讲述这些“道理”，而是将其隐没于饶有风趣的故事和生动的艺术描写里而不彰。这正是《棋王》作为“寻根文学”作品的独特的价值取向。\n\n三、叙事笔法\n\n在小说中，阿城调动了传统小说的诸多叙事笔法，将棋王的一生虚实相生地表现出来。小说中不仅有家族门楣、边城荒壤等江湖气息，还安插了隐于山中坐观兴衰的世外高人，其中对棋道出神入化的描述，更是出人意表，引人入胜。在描写上，阿城则多用传统小说的白描手法。白描即不渲染，不夸张，是怎样就怎样。作品不少场面都描写得活灵活现，如对王一生吃相的刻画，几乎没有一个形容词，但把人物心态完全表现出来了。","keywords":"精神根据 传统文化坚韧存在 顽强精神 文化魅力 道家文化思想 传统小说叙事笔法 白描","note":"在思想上，《棋王》表现出了与《爸爸爸》不同的倾向，主要表现为对传统文化的认同；在艺术上，《棋王》抛弃了20世纪80年代惯有的语言逻辑转而回归宋明小说的语境之中，多白描手法，朴实而飘逸俊美。作为阿城的代表作，也是寻根文学的代表作，《棋王》在名词解释中出现的频率不低，大家要注意。"},{"id":"361","stars":"★★★","title":"试析韩少功《爸爸爸》的思想内涵","body":"韩少功的《爸爸爸》是审视文化劣根性寻根文学的代表，所谓审视文化劣根性，是指高扬现代理性精神，严肃地反省民族自我，批判落后的文化心理，表现出批判国民劣根性的倾向。韩少功的《爸爸爸》集中批判了民族根性中那种永远长不大的、带有原始蒙昧色彩的丙患式种族侏儒特征，其思想特征，主要表现在以下方面：\n\n一、强烈的文化批判色彩\n\n韩少功的中篇小说《爸爸爸》以一种富于想象力的魔幻现实主义手法，通过描写在湘山鄂水之间一个原始部落的历史变迁，把祭祀打冤、迷信掌故、乡规土语糅合在一起，刻画出了一幅具有象征色彩的民俗画，其中隐喻着封闭、凝滞、愚昧落后的民族文化形态。\n\n鸡头寨人种种看似荒诞不经的行为心理，可能是巫性思维方式的遗风。但遗憾的是，鸡头寨已经完全没有楚文化飞扬灵动的风采了，所谓的“巫性一神话思维”在这里也已失去了超验的浪漫想象，变质为消灾避祸的迷信，因而显得非常愚昧、可笑。在鸡头寨这样封闭僵化的环境里，人几乎不可能有任何发展，不发展，就会退化，就会产生丙崽这样的痴呆儿。但是，愚昧的不仅是丙崽，整个寨子的人都处于蒙昧之中。而丙崽最后服剧毒不死，正说明这种文化的根深蒂固，甚至一直影响到今天。小说体现出强烈的主体理性批判精神，对这种文化状态的各种劣根性内容给予深刻的揭露。\n\n二、对生命起源、生存艰难及生命存在方式和意义的探索\n\n韩少功在小说中把笔触探向了生命的本体存在，探索着生命的起源、生存的艰难及生命存在的方式和意义。比如丙崽的那两句谶语般的口头禅，包括了人类生命创造和延续的最原始最基本的形态，这也正是他受到村民礼拜的原因所在；又如丙崽的母亲用“剪鞋样、剪酸菜、剪指甲”的剪刀去为人接生，剪出了山寨里的整整一代人，这无疑也是隐喻着生命延续的顽强和无理性；还有那个裁缝仲满，因为不满世风日下，深感愧对先人，便熬了毒药与村民一起面向东方而坐饮，祖先是从那里来的，他们也要回到那里去，这殉死的场景显然与原始部落的某种风俗有关，但在今天的读者看来，却似乎含有个体生命和种族生命之间息息相通的神秘意味。这样的描写打破了小说情节所依赖的因果关系，出现了以意象为主体、以感应为联系环节的新的审美思维形态。","keywords":"审视文化劣根性 文化批判色彩 生命起源 生存艰难 生命存在方式和意义 新的审美思维形态","note":"《爸爸爸》既体现出了文化批判色彩，又表现出了对生命起源、存在的探索。相较而言，前者更加重要一些，“国民性批判”无疑是当下考查中的热门话题，从现代文学史上的鲁迅、老舍到当代的高晓声等人，“国民性批判”始终存在于中国现当代文学史之中。所以在讨论相关话题时，也可以将《爸爸爸》作为补充。韩少功相关的名词解释中，以其前后期两部作品《爸爸爸》和《马桥词典》考查最多，有时还会涉及丙崽的形象，这些我们都要注意一下。"},{"id":"362","stars":"★★★","title":"试析韩少功《爸爸爸》中丙崽的形象及其意义","body":"《爸爸爸》中的丙崽是一个苍老的、无法正常生长的病态婴孩形象，身上包含着愚昧、顽固、孱弱、痴呆、丑陋的生命状态。韩少功试图从丙崽身上找到这个时代话语之所以单调、愚昧、冥顽不化的原因。他仅会的几句简单的“爸爸爸”成为与时代精神对峙的话语，除了表达一种本能的语言喜好以外，他基本上处于一种失语状态。而在这个人物身上，承载着作家想要表达的思想，主要是以下方面：\n\n一、对民族文化劣根性内容的批判\n\n《爸爸爸》体现出强烈的主体理性批判精神，对封闭、凝滞、愚昧落后的民族文化形态的各种劣根性内容给予深刻的揭露，而这个文化批判的主题是通过对“丙崽”这一形象的描绘完成的。\n\n丙崽是个只会嘟哝“爸爸爸”和“x妈妈”这两句话的白痴小孩，他的存在无疑是象征了人类生存中的丑恶、顽固和浑浑噩噩的一面。但就是这样一个令人厌恶的人物竟然得到了鸡头寨全体村民的顶礼膜拜。在此，缺少正常理性的丙崽恰好也揭示出其他人的精神病态：理性迷失之后的愚昧与残忍。让人惊奇的是部落里经过一次生死劫难之后，唯独丙崽不死，依然顽固地生存下去。丙崽作为一个象征性的形象，显然还意味着传统与当代现实之间的某种联系，丙崽死不了，也就表明了那些古老文化的丑陋之处是难以根除掉的。\n\n二、反映了寻根小说家的困境\n\n《爸爸爸》以寓言化的叙述，通过湘西村落鸡头寨的历史变迁，力图再现一种原始生存的景象，并在其中找寻浪漫的文化源泉、生命的信仰和精神的力量，借以印证作家所理解的“灿烂的湘西文化”遗存。然而，在实际的叙事中，作家的这一\n\n意图并未实现，相反他倒陷入了一个深刻的文化悖论中：作品核心丙崽的存在象征了民族文化中原始、畸形丑陋和愚顽的一面，但就是这样一个发育畸形的怪胎，由于天上偶然打了一个雷，而被误认为神而受到大家的顶礼膜拜，成为指点胜负的神灵。而故事的最后，丙崽没有被毒死，似乎在暗示着传统丑陋文化的顽固和难以根除。\n\n显而易见，在丙崽这个人物的身上，反映着寻根小说家普遍的困境：作家们试图为当代文化的重建寻找源头活水，但到头来却只是找到了一个充满着悖论性的载体。试想，像丙崽这样的人物能够为现代的我们提供什么有价值的参照呢？","keywords":"主体理性批判精神 精神病态 寻根小说家的困境","note":"毫无疑问的是，丙崽这一形象象征着人类中丑恶的一面，韩少功通过对这一形象的批判完成了自己对民族劣根性的批判，体现出了主体理性批判精神，这也是韩少功希望通过这一形象展现出来的主要内容。但丙崽最后的结局，又在客观上反映了韩少功的困惑，这种困惑同时也是寻根作家的普遍困惑。前者是容易被发现的，而后者则是容易被忽视的，大家要注意一下。"},{"id":"363","stars":"★★★","title":"试比较《棋王》和《爸爸爸》的区别","body":"《棋王》与《爸爸爸》都是寻根文学的代表，在一定程度上体现了寻根文学的整体特征，但由于作家对民族传统文化的理解不同，自身经历不同，这两部作品在思想内涵与艺术特色上既有联系，又有差异，具体表现为以下方面：\n\n一、体现出了文学寻根意识，但对待传统文化的态度不同\n\n无论是《棋王》还是《爸爸爸》，都体现出了对民族传统文化的回顾与思考，无论是《棋王》中道家思想融入王一生的人生追求和生存态度，还是《爸爸爸》中鸡尾寨日常生活中楚地巫族风俗的表现，都体现出了对传统文化存在的确认与思考，体现出了寻根意识。\n\n不过，《棋王》对传统文化持肯定态度，呈现了在犹如文化沙漠的特定年代，传统文化仍坚韧存在的力量，以对传统文化精神的自觉认同而呈现出一种文化的人格魅力；《爸爸爸》则站在现代意识的角度，对民族文化形态表达了一种理性批判，探询了在这种文化形态下的生命本体意识。而最后丙崽没被毒死，更体现出了韩少功对传统陋习根深蒂固的隐忧。\n\n二、审美形态不同\n\n阿城的《棋王》直指中国传统文化的内核，棋是中国文化中人格的象征，小说里的王一生在与传统文化的相融之中，实现了一种超越世俗的人生追求。阿城倾向于从民族文化和大自然中寻求精神力量，以求达到对当代生存困境的解脱和超越，通过具有生命活力的人格形象表达出文化魅力，并以此完成了对一种人格境界的美感塑造。\n\n而在《爸爸爸》中，韩少功以现代意识来审视一个原始部落的生存方式，用象征的方法描绘出个体生命、种族生命以至人类整体的生命存在之间的关系，以及生存的艰难过程。这些神秘的描写中显然都含有对生命奥秘的窥探，表现出了对人类生命本体和生存方式的关怀。\n\n三、艺术手法不同\n\n在《棋王》中，阿城调动了传统小说的诸多叙事笔法，在描写上则多用传统小说的白描手法。作品不少场面都描写得活灵活现，如对王一生吃相的刻画，几乎没有一个形容词，但把人物心态完全表现出来了。\n\n韩少功在《爸爸爸》则多用象征，从作品对时空的模糊处理和对形象尤其对丙崽这个形象的大幅度夸张变形看，作者显然是把它当作一个寓言或者象征来写的，在这个意义上，作品可以看作一个民族的寓言。\n\n总之，寻根文学既是对历史的反思在新的历史阶段的再次呈现和发展，更是在更为广大的空间和更为长久的时间之流中探寻民族生存命运的文化奥秘。而也因为寻根文学不同作家思考方向不同，呈现出来的结果也不同，这从《棋王》和《爸爸爸》的对比中可见一斑。","keywords":"对待传统文化的态度 审美形态 艺术手法","note":"寻根文学作为一个创作潮流，虽然持续时间不算特别长，但涌现出来的作家却特别多，而不同的作家在作品中表现出来的思想与艺术特征必然也不相同。《棋王》和《爸爸爸》既是寻根文学的代表，又体现着寻根文学不同的创作方向，很可能被拿来放在一起进行对比，大家要注意一下。"},{"id":"364","stars":"★★★","title":"试述贾平凹的创作历程","body":"迄今为止，贾平凹的创作大致可以分为三个阶段：\n\n一、第一阶段，从70年代末到80年代末。这一阶段的小说由于大多取材于商州，而被人们称为商州系列。\n\n在这些小说中，贾平凹充分表现了乡村社会里人性美好和纯洁的一面，将对社会政治经济变革的关注和思考融入自己所熟悉的商州人事风情之中，不仅具有商州地域色彩，而且还具有较强烈的时代感和理想主义色彩。\n\n《浮躁》是这一时期贾平凹的代表性作品。小说多角度、多层面地揭示了转型期乡村中国那种既躁动不安又充满生命追求和活力的时代情绪。正是从《浮躁》这个过渡性的文本开始，贾平凹对乡土的书写由赞歌变成了哀歌，他向商州文化遗物作最后的灵魂靠近，类似士大夫对传统文化的嗜好，不停地言说当下的商州与历史的商州，探索它命运的可能出路。\n\n二、第二阶段，从90年代开始到2002年前后，贾平凹的文学视点从乡村转向城市，对物质文明所造成的人文精神失落、生命力委顿进行深刻省思。主要作品有《废都》《白夜》《土门》《高老庄》《怀念狼》《病相报告》等。\n\n20世纪90年代，商品化大潮既为文学创作带来了激情与动力，也带来了价值、精神层面的危机。贾平凹以《废都》传达了他对当时知识分子心态和整个社会的文化形态的理解和认识。这是一部对城市文明病反思的力作，小说以西京为叙事空间，通过对以庄之蝶为代表的四大文化名人的颓废生存状态的描写，一方面揭示了商品经济社会里知识分子精神颓废和价值迷失，另一方面真实地展示了人们在物欲中挣扎沉沦的社会世相。\n\n三、第三阶段，2003年之后，以《秦腔》为标志，贾平凹的创作走向了对乡土的更高层次回归。贾平凹通过《秦腔》《高兴》和《古炉》等传达了乡村中国在土地和文化上的双重衰落。\n\n《秦腔》是目前为止贾平凹最为成熟的艺术作品，也是一部乡土中国叙事的杰作，具有不可替代的思想与艺术价值，是一首乡村中国文化颓败的悲凉挽歌。小说以清风街夏家的人、事变迁为故事核心，呈现了在改革开放的冲击之下，乡村价值观念、人际关系的深刻变化，表达了作者对社会转型期中国乡村文化没落的忧思。","keywords":"三个阶段 商州系列 人文精神失落 生命力委顿 更高层次回归","note":"贾平凹的创作明显经历了三个时期，每个时期都有其代表作品，大家可以从这些代表作品的特征出发去分析贾平凹创作的发展变化。在作答时，要注意各个阶段具体的时间段。最后，像贾平凹这样创作特征发生过明显变化的作家还有很多，如戴望舒、王安忆等，可能会联系起来考查，大家要注意一下。贾平凹相关名词解释，主要还是围绕贾平凹的代表作品如《商州初录》《废都》进行考查，大家要注意一下。"},{"id":"365","stars":"★★★","title":"简述《废都》的思想艺术特征","body":"《废都》是一部对城市文明病加以反思的力作。小说以庄之蝶与几位女性的欲望纠葛为主线，以周敏的一篇文章引发的文案官司为辅线，穿插阮知非等诸名士的生活状态，通过对以庄之蝶为代表的四大文化名人的颓废生存状态的描写，展现了西京城无处不在的“废都”文化景观。一方面，揭示了商品经济社会里知识分子的精神颓废和价值迷失；另一方面，真实地呈现了人们在物欲中挣扎、沉沦的社会世相。\n\n一、折射了社会转型期中国社会的众生相\n\n在对以庄之蝶为中心的文化精英堕落为文化闲人进行反省的同时，《废都》通过诸多细节展示了物质主义控制之下人性沉沦挣扎的社会生态图景。从表现的主题来看，小说包含文人与官场、文人与商海、文人与女人等众多生活圈子的日常行为，还通过捡破烂老头口中的一些讥讽民谣，整体上反映了西京城的社会世相，也可以说是20世纪90年代初期中国的“浮世绘”，折射了社会转型期中国社会的众生相。可以说，《废都》把那个时代知识分子的精神堕落、人的精神迷失展示得淋漓尽致。\n\n二、表现了当代文人的尴尬处境和颓废心境\n\n弥漫全书的废都文化，构成了一个巨大的文化隐喻。从外部看，谈玄说道，巫医星象，赏古玩，品女人的小脚，构成了笼罩西京上空的一种深厚、颓废的传统人文氛围。从内在看，被传统文化浸透了骨髓的人们，无法摆脱因袭的重担，无力应对剧变的现实，是一种在困窘中挣扎的文化心态的体现。这是一种在传统与现实的夹缝中的心灵挣扎，真切表现了当代文人在传统与现代、理想与现实的纠葛与冲撞中的尴尬处境和颓废心境。\n\n三、继承中国古典小说形式\n\n从叙述形态上看，贾平凹继承了中国古典小说的形式，不难看出其中有《金瓶梅》《红楼梦》《九尾龟》等明清小说的影子。从文化上看，《废都》是贾平凹对当代城市社会各种官场文化、社会黑幕、民间流传的趣闻轶事（包括讽喻调侃式的顺口溜）、世态民情的风貌、收藏古玩的品味、巫医星象的神秘等的融合，这些共同营造了一种废都文化的氛围。露骨的性描写，对女性的狎妓心理的表现，又与《金瓶梅》等小说分不开。","keywords":"城市文明病 中国社会的众生相 尴尬处境 颓废心境 中国古典小说形式","note":"《废都》在思想主题上主要体现出了对城市文明病的反思，而在艺术上，则与古典小说艺术形式一脉相承。贾平** --- 凹的《废都》，也可以看做是“城市书写”的作品之一，可以和茅盾、老舍、张爱玲、王安忆等人的城市书写联系起来考查，也可能单独做考查，大家对此要有所准备。"},{"id":"366","stars":"★","title":"谈谈王安忆小说的创作过程","body":"在女作家群中，王安忆是一位才华横溢、视野开阔、创作变化多端、能驾驭多种题材的高产作家。她的每一次创作转型都自觉或不自觉地呼应和体现了新时期的不同时段的文学思潮，而且在每一思潮中她均占有不可或缺的位置。王安忆的小说可以划分四个主要阶段：\n\n一、“青春吟哦”期（1978~1981年）\n\n这个时期的作品被合称为“雯雯系列”。“雯雯系列”主要细腻地表现青春女性的情绪天地。一个叫雯雯的女孩的痛苦和希望，理想的憧憬、爱情的渴盼，通过作者优雅的抒情笔调，-真切、细致地得以表现，而且在雯雯身上不难发现作家自身的经历，故这个时期称为作家的“青春吟哦”期。\n\n二、“现实透视”期（1981~1984年）\n\n1981年以后，王安忆走出青春对影自怜的狭小艺术天地，开始关注广阔的社会现实、人生。《本次列车的终点》通过描写知识青年从农村返回上海后的一系列遭遇，表现一代知识青年的理想失落之后的痛苦、迷茫与觉醒。《尾声》写剧团内部因改革引起的冲突。《归去来兮》《流逝》描写了普通人在社会动荡变迁的背景下，因命运的起落沉浮获得的不同的人生体验和心态。\n\n三、“文化反思”期（1984年到20世纪90年代初）\n\n1983~1984年的美国之旅在文化体验上给了王安忆极大的震动，她的小说创作进入一个新的境界，开始以深邃的历史眼光和以西方文化为参照坐标，观照人的命运与情感的变迁，思考民族文化的历史命运。王安忆这一时期的作品以《大刘庄》《小鲍庄》等民族文化反思小说和《小城之恋》《荒山之恋》《锦绣谷之恋》等性爱文化小说为代表，前者是寻根文学典型作品，后者则是从“性”的角度来表现男女之间的微妙关系。\n\n四、“新海派”期（1990年至今）\n\n20世纪90年代之后，王安忆又发表了《叔叔的故事》《长恨歌》等产生较大反响的长篇小说，这些作品标志着王安忆的创作取得了新的突破。此时的王安忆在创作上坚持明确的“新海派意识”，艺术上不断探索，日渐形成自身独具特色的心灵追求与艺术风格。\n\n第一，作者在叙事形式上有了质的革新和飞跃：在90年代，王安忆在叙事形式上有了质的革新和飞跃：将叙述人进行角色化塑造，“我”开始成为大部分作品的叙事人，使得叙述人”我”的叙事行为成为小说表达的有机构成；小说制作由背景走到了前台，这样一种“元”小说的写作方式，强调小说的人工特征和陌生化性质，使得故事发展的线索不再是唯一的，而是包含了大量的自我解构、自我颠覆的叙述单位；在叙事语调与叙述体式上引入了“议论”与考辨，颠覆了传统小说的图式。\n\n第二，在语言上，作者更显精练老到，绵密饱满，从容不迫，以铺张、繁复的长句式构成了一种独特的叙述语调，体现出作者对所书写的“上海”之城市性格的渗透了解。","keywords":"“青春吟哦”期“现实透视”期“文化反思”期“新海派”期","note":"在当代文学史上，王安忆是比较特殊的一个作家，随着文学思潮的变化，她的创作也在不断转型，并取得了不俗的成就，这个现象很是瞩目，所以很多学校就会针对她这一点进行考查。大家在梳理时，主要注意王安忆转型的关键时间、事件与代表作品。王安忆相关的名词解释，多数情况下是围绕其代表作品进行出题，主要是《长恨歌》和《小鲍庄》这两部比较重要的作品，对此大家要留意。"},{"id":"367","stars":"★★★★★","title":"试分析王安忆小说创作特征","body":"王安忆是一个有才华的小说家，她不断地转型可以解释为，她意识到自己的局限性，并具有危机感，以持久的写作与自身的局限性作抗争。20世纪90年代之后，王安忆在创作上坚持明确的“新海派意识”，艺术上不断探索，日渐形成自身独具特色的心灵追求与艺术风格。具体来说，主要表现在以下方面：\n\n一、两种书写的线索\n\n王安忆小说中隐含着两种书写的线索：一是以“文革”这一历史事件为背景，书写了在这段特殊岁月中的情欲挣扎、生\n\n命甦醒以及文化反思等内容，以“三恋”、《岗上的世纪》《叔叔的故事》《启蒙时代》等小说为代表；二是以老上海为中心，以城市化时期的文化动荡为背景，书写了城乡变迁中各色人物的命运沉浮，如《纪实与虚构》《长恨歌》《我爱比尔》《妹头》《米尼》《富萍》《遍地枭雄》。这两种线索并不是截然分离的，多有交集。\n\n二、女性意识\n\n王安忆曾多次宣称她不是女权主义者，但并不否认自己作品中的女性意识，她实现美学转型的契机是女性意识，对女性命运的关注贯穿她写作的始终，“雯雯系列”、《流逝》《妹头》《我爱比尔》《富萍》《长恨歌》，这些小说都集中关注了女性在中国20世纪后半叶的命运沉浮。\n\n三、崭新的叙事形式\n\n在90年代，王安忆在叙事形式上有了质的革新和飞跃：将叙述人进行角色化塑造，“我”开始成为大部分作品的叙事人，使得叙述人”我”的叙事行为成为小说表达的有机构成；小说制作由背景走到了前台，这样一种“元”小说的写作方式，强调小说的人工特征和陌生化性质，使得故事发展的线索不再是唯一的，而是包含了大量的自我解构、自我颠覆的叙述单位；在叙事语调与叙述体式上引入了“议论”与考辨，颠覆了传统小说的图式。\n\n四、独特的叙述语调\n\n在语言上，王王安忆显精练老到，绵密饱满，从容不迫，以铺张、繁复的长句式构成了一种独特的叙述语调，体现出作者对所书写的“上海”之城市性格的渗透了解。例如，《长恨歌》就以细致绵密、浓墨重彩、繁复曲折的语言叙述了闪避时代大潮而沉迷于日常生活的上海女性王琦瑶跌宕起伏的一生，对上海的洋场、市井及上海市民的日常化生活方式作出了精细描摹，对上海文化的基本精神亦作出了准确的把握。","keywords":"两种书写线索 女性意识 叙事形式 叙述语调","note":"王安忆的小说创作发生了多次转型，这实质上是她不断与自身局限性进行抗争的表现。而到90年代，王安忆的创作特色最终形成，具体表现为隐含两种书写线索，女性意识的表现，独特的叙事形式与叙述语调，而王安忆的创作特色，又集中表现在《长恨歌》这部作品中，大家可以把二者联系起来分析记忆。"},{"id":"368","stars":"★★★★★","title":"试分析王安忆小说中的女性意识与女性叙事","body":"王安忆曾多次宣称她不是女权主义者，但并不否认自己作品中的女性意识，她实现美学转型的契机是女性意识，对女性命运的关注贯穿她写作的始终，“雯雯系列”、《流逝》《妹头》《我爱比尔》《富萍》《长恨歌》，这些小说都集中关注了女性在中国20世纪后半叶的命运沉浮。\n\n一、王安忆的“女性意识”与女性叙事的特征\n\n（一）王安忆的“女性意识”\n\n王安忆小说中的“女性意识”，表现在对两性微妙的支配关系、男女在欲望本能和社会权力之间的挣扎，以及人的自然属性、欲望对人的命运有何种制约力量的探询和揭示。在对女性自主的问题上，她的视点和处理方式是冷静而旁观的。与《方舟》（张洁）一样，《弟兄们》也写三位女性靠女性间的友谊、互助，试图摆脱男性中心社会的控制，但王安忆没有为她们的苦斗留下“光明的尾巴”，她无情地让她们在本能的母性、妻性的“夹击”下溃败。\n\n（二）王安忆的女性叙事\n\n王安忆的女性叙事是源于中国女性的现实生存体验和中国特定的历史文化环境的，是一种本土化的、并且带有某种超性别写作色彩的女性叙事。这种叙事与那些观念化的女性写作相比，不仅更耐人咀嚼、更具民族魅力，而且有着更大的发展空间。在她的作品中，女性人物常遭受两种胁迫。胁迫之一来自“文革”，即政治对女性命运和尊严的剥夺，及女性出于本能对这一压迫的反抗；胁迫之二是物质主义时代对女性生存环境的再度围困。她笔下的男性人物，“叔叔”（《叔叔的故事》），“他”（《荒山之恋》）和杨绪国（《岗上的世纪》）都是其女性叙事的介质，面目比较模糊。\n\n二、王安忆“女性意识”和女性叙事的表现\n\n（一）“写女性的历史”／“历史地写女性”\n\n《长恨歌》对白居易《长恨歌》标题的套用，从一开始即已表明了作品的女性内蕴、历史情怀和悲剧意味。通过一个女人的命运来演绎一座城市的变迁，同时又通过一座城市的变迁来演绎一个女人的命运，是这部作品最为基本的写作思路。作者以女性特有的细致绵密的叙事方式，以琐碎零散的都市女性生活图景，演绎出王琦瑶平常而又传奇的一生，同时也以精细之笔勾画出了上海这座城市的历史沧桑以及远离政治喧嚣的庸常的另一面。\n\n“写女性的历史”或“历史地写女性”，是王安忆不同于同时期其他女性作家的一个最明显的特征。王琦瑶的一生，并没有什么现代意义上的性别自觉，构成她意识核心的不过是小市民的价值观。正是这样的观念，使她保有了一颗“上海心”，她本人也得以存留在历史的“芯子”里。她的悲剧源于此，既不能逾越自身的局限，也无法对抗历史的限定，在滚滚红尘之中，她“发迹”于“上海三小姐”的称号，最后又终因这个昔日的名号而丧命。\n\n（二）思考第三世界女性的情爱与性爱上的不平等处境\n\n《富萍》通过富萍（“浮萍”）的婚事，描写了移民与上海城市文化之间的深层关系，并且着意探寻了在这样一种生存关系中女性的处境与命运问题。此外，在《我爱比尔》《香港的情与爱》《妙妙》等作品中，王安忆也深入探讨了现代城市女性的情爱观。这些小说中的女性，都企图以身体为代价跨入西方的文化世界，这使王安忆对女性世界的探求跨越了不同种族与文化的视界，对身处第三世界的女性在情爱与性爱上的不平等处境，作了严肃的思考。","keywords":"支配关系 欲望本能 社会权力 人的自然属性、欲望 现实生存体验 历史文化环境 超性别写作色彩 女性内蕴历史情怀悲剧意味“写女性的历史”“历史地写女性”不平等处境","note":"在当代作家之中，王安忆因其女性作家身份而显得特殊；而在女性作家之中，王安忆又因其独特的女性意识而显得与众不同，因而常在考查中出现，并且常与其他女性作家联系在一起进行考查，所以对于相关内容我们要重点掌握。"},{"id":"369","stars":"★★★★","title":"谈谈《长恨歌》的思想艺术特征","body":"《长恨歌》对白居易《长恨歌》标题的套用，从一开始即已表明了作品的女性内蕴、历史情怀和悲剧意味。通过一个女人的命运来演绎一座城市的变迁，同时又通过一座城市的变迁来演绎一个女人的命运，是这部作品最为基本的写作思路。它在艺术上所取得的重要成就显然与此有着直接的关联。\n\n一、以精致而日常化的笔法书写了上海小姐王琦瑶平静的怀旧人生\n\n《长恨歌》中，王安忆以女性特有的细致绵密的叙事方式，以琐碎零散的都市女性生活图景，演绎出王琦瑶平常而又传奇的一生。王琦瑶美丽雅致却又通情达理，亲切而又矜持。她不高尚也不低俗，顺从现实也追求情调，平时的吃穿住行都流露出特有的情致。既有真实的实用人生态度，又有充满怀旧气息的生活知趣。\n\n二、亲近人性的上海文化书写\n\n王琦瑶不仅是一个上海女人，而且成了一种文化符号，她既是精神方式和生活方式的象征，又是上海和历史的某种象征。《长恨歌》的成功在于写活了王琦瑶这个人的同时，也写活了一座城市，一个时代，一段历史。小说没有从大处写上海的繁华，而是从细微处写上海的肌理，写上海的血液。而作者对上海形象的把握与描绘极尽其详，又直入骨髓，体现了作家对上海这座城市骨子里的文化精神的一种寻找与探求。这种温婉的笔调、散漫的细节、些小的感觉，构成了《长很歌》的城市书写的韵味。\n\n三、以分析性描写为主的叙述风格\n\n面对已发生的平淡至极的人物和故事，要想将其小说化，就不能不依靠“逻辑推动的力量”，依靠作家所理解的生活本身的逻辑。于是，以分析性描写为主成为《长恨歌》的叙述风格。这种分析，又是建立在作家对生活的深刻而独特的理解上的。也可以说，《长恨歌》的故事不是描述出来的，而是靠作家的聪明颖悟分析出来的：对人物心理的分析，对生活哲理的\n\n分析对人生真谛的分析，对上海的精神气质的分析。\n\n四、男权社会中的女性悲剧\n\n“写女性的历史”或“历史地写女性”，是王安忆不同于同时期其他女性作家的一个最明显的特征。构成王琦瑶意识核心的不过是小市民的价值观。这样的观念使她保有了一颗“上海心”，她本人也得以存留在历史的“芯子”里。这根深蒂固的“城市民间”的生活观念，虽然支持她在红色风暴的上海能够幸存下来，但也导致了她的悲剧。王琦瑶虽然赶上了上海复活的时代，可是这个时代却早已不属于她。她既不能逾越自身的局限，也无法对抗历史的限定，她“发迹”于“上海三小姐”的称号，最后又终因这个昔日的名号而丧命。\n\n这是一出“个人与历史错位”式的悲剧，又是男权社会中的女性悲剧，《长恨歌》的意义就在于它深刻而传神地揭示了历史中的女性命运，并由此将女性境遇与生存的思考上升到了一个更高的层面。","keywords":"精致而日常化的笔法 平静的怀旧人生 上海文化书写 分析性描写 女性悲剧","note":"在艺术上，王安忆的《长恨歌》是通过一个女人的命运来演绎城市的变迁，又通过城市的变迁来演绎女人的命运，所以作品对于王琦瑶这位女性和上海城市文化都有表现。而对这一个女人命运的展现和对城市变迁的描写，又是以逻辑推动的，因而多采用分析性描写。在这之后，王安忆终于发现了这一个个人与历史错位的悲剧，因而整部作品弥漫着浓郁的悲剧色彩。这部分内容，我们要掌握。"},{"id":"370","stars":"★★★★★","title":"试分析张爱玲与王安忆小说创作的异同","body":"张爱玲与王安忆同是生活在上海的女性作家。共同的女性意识，独特的地域文化，上海深厚的历史文化积淀与都市人的心理积淀，使得二人在创作中有很多相似点。然而，她们毕竟身处不同的时代，有着不同的身份意识与创作姿态，这使她们在内容与风格上出现了审美的差异性。二者的小说创作可以说是同中有异，异中有同，具体来说，主要包括以下方面：\n\n一、都关注日常生活，但感情基调不同\n\n张爱玲、王安忆的上海小说都立足于上海普通人的日常生活的描写，以琐细的日常生活和普遍的人生处境为载体，透视上海这个现代化国际大都市中居民的人性和人性形态的不同式样，其中蕴藏着人性的复杂性和丰富性，并由此指向人的生存困境等普遍性内容。\n\n不同的是，张爱玲是上海这座城市的书写者，而王安忆是上海这座城市的寻找者和阐释者。张爱玲与她笔下市民的价值观、人生观和世界观是没有距离的，因而把诗情和浪漫都消解了，整体较为消极，得不到精神升腾的力量。而王安忆的作品中笼罩着一种温馨的人性希望之光，形成作品温情的情感基调。从王安忆对上海的理性描述和小说叙事中，她对上海和上海人的“懂得”比张爱玲更具有历史的纵深感和生命形而上的哲学意味，因而更为大气。\n\n二、关注小人物的爱情悲剧，但具体塑造不同\n\n张爱玲与王安忆都关注平凡的小人物，多从婚姻爱情入手展开上海故事，而这些故事往往都是以悲剧结尾。\n\n不同的是，张爱玲小说中没有人对命运的胜利，她笔下的人物都是时代的广大负荷者，她的恋情故事不是起于物欲就是情欲，是撇开精神因素的。张爱玲把人生最美好的东西给颠覆了，这是乱世给她的黯淡破败的苍凉、悲世感，张爱玲是反英雄的、反浪漫的。而王安忆笔下庸常之辈并不平庸，骨子里是有着一颗英雄心的，有一种生活的理想和实现的执着；她笔下的女性也往往是爱情至上的，对爱情都有执着追求的，虽然这些女性往往也是以悲剧收场，但这些女性是有英雄心的，有对命运不妥协、不服输的心劲。\n\n三、都以悲剧主题为主，但悲剧形成原因与对悲剧的态度却不相同\n\n张爱玲和王安忆的小说都以悲剧主题为主，但二者形成的原因与具体表现却不相同。\n\n张爱玲自觉地以情欲、以非理性来解释悲剧，解释人的行为动机，解释人性，认为人性是盲目的，人生因而也是虚无而残酷的。张爱玲对人世的悲观和虚无是与她的身世和她所处的乱世两者共生的结果。张爱玲是一个彻底的悲观主义者。于是，及时行乐、个人至上的世纪末情绪，古老家族的衰败导致的传统价值观念对人的命运的悲剧性影响，传统道德价值在乱世中的没落，成为张爱玲小说的悲剧主题\n\n王安忆小说的悲剧意识却并不仅仅与时代有关，社会变化和个人生活的偶然事件确实对她笔下人物命运发生了重要影响，但个人命运的最后形成则更多的是他们自身的性格和世界观决定的，无论是乱世还是盛世都是必然发生的。王安忆的小说的悲剧感来自她对人的命运的关注，有很强的宿命感。还与张爱玲不一样的是，王安忆一方面流露出了人的命运的受控性和未知性，同时也让我们看到了把握命运的可能性，使我们面对命运充满希望。","keywords":"关注日常生活 感情基调 小人物的爱情悲剧 悲剧主题 原因态度","note":"张爱玲与王安忆同为居住在上海的女性作家，并且自从《长恨歌》等作品发表之后，王安忆就常常和张爱玲联系起来。二者在创作上的确有许多相似之处，但二人毕竟身处不同时代，人生经历也有很大的不同，所以二者在创作上也有许多区别。总的来说，二人是同中有异，大家要注意掌握。相关内容可以参考张海兰《张爱玲王安忆都市小说创作比较》，具体资料可以在李凡文学正版群中领取。"},{"id":"371","stars":"★★★","title":"试分析张炜《古船》的思想艺术特征","body":"《古船》反映的是农村改革，是一部内容丰盈而且具有历史厚重感的作品，是80年代中期最重要的长篇作品之一。它不但是“寻根”文学的深化和总结，而且还标志着长篇小说写作在文体上的深刻变化。\n\n一、批判性地审视封建传统、当代历史及农民、农业文化的历史惰性\n\n小说通过对洼狸镇上赵、隋、李三个家族的兴衰厮斗的描写，浓缩了当代中国乡村近40年的政治动荡，书写了在财、权、性这三大欲望控制下的农业社会中的人性黑暗，批判性地审视了封建传统、当代历史及农民、农业文化的历史惰性。这种宗法血缘文化浸润之下的人性黑暗，不但是过去年代悲剧的根源，是以阶级斗争名义进行残杀的真正动机，也是当下中国乡村变革的现实障碍。那艘沉埋在那个干涸码头的河道中的“古船”之所以会沉没，也是这种落后文化所导致的结果。\n\n二、“史诗性”追求和忠于历史与心理真实的艺术立场\n\n《古船》具有一种“史诗性”追求的意图。情节展开的时间跨度、作品的布局、历史过程重要“关节”与故事、人物间确立的关系，涉及的思想、性格命题，象征性对写实的融入等，都可以见出作家的“史诗性”意图。同时，张炜在这部作品中对土地改革、“大跃进”、“文化大革命”等诸多重大历史事件的书写采用了忠于历史、忠于自己的心理真实的艺术立场，而不是意识形态立场。\n\n三、以现实主义为主，融汇象征和魔幻现实主义的表现手法\n\n《古船》情节错综复杂又井井有条，历史和现实不断交替叙述，人物场景转换自如。作者的叙述透着几分含蓄和幽默，使那些悖谬的历史事件显示出令人发笑的沉重感。《古船》有许多象征，如种种障碍迷阵，令人扑朔迷离，体现出叙述者对人生、自然、现实、历史的疑问、不解、痛苦、矛盾。象征和魔幻手法的运用，不仅扩展了作品的思想意蕴和容量，而且提高了作品的美学价值和品格。\n\n《古船》对民族历史文化和人性的开掘达到了相当的深度，写出了国民的种种封闭、落后、愚昧、保守及人们恶劣的贪欲和权势对当代历史和现实变革造成的破坏，尽管小说表现出来的史诗气魄有些空泛与夸饰，同时有些问题的处理偏于意识形态化，但这部作品在20世纪80年代还是具有不可多得的开创性意义。","keywords":"批判性地审视“史诗性”追求 艺术立场 现实主义 象征 魔幻现实主义","note":"张炜的《古船》写于张炜三十岁之前，很能代表张炜前期创作特征，因而在考查中出现的频率非常高。而这部作品之所以在八十年代引起轰动，主要归因于其开创性作用，这种开创性表现在两个方面，一方面是艺术上的史诗气魄和开放性的现实主义手法，另一方面则是其对历史和人性的开掘。这部分内容，我们要有所掌握。"},{"id":"372","stars":"★★★","title":"谈谈张炜《九月寓言》的思想艺术特征","body":"《九月寓言》具有浓重的寓言色彩，采用了具有浓厚的抒情色彩和哲理内涵的“诗化”叙述方式，是张炜创作历程的一次重大发展。这部作品的思想艺术特征，主要表现在以下方面：\n\n一、对人类文明的多重思考和多元观照\n\n《九月寓言》采用了一种近乎于“人类学”的特殊视角和寓言化的笔法，以一个海滨小村庄为案例，表达了作者对于人类两种生存样态的深入思考。作品反映出张炜创作的着眼点已由《古船》时期的对于乡村苦难的社会道德文化批判升华为对于人类文明的多重思考和多元观照。在《九月寓言》中，现代工业文明似乎被指认为一种具有不可回复性质的掠夺性、侵犯性和破坏性的文明，而传统的自然自为的农耕文明则被赋予了一种诗意的乌托邦色彩，被描写为一种自由自在的、生机盎然的、和谐美好的文明。作家通过两种文明的对立和对比，所表达出来的对于当下现代化进程中负面因素的批判性思考和悲悯的情怀，足以让世人警醒和深思。\n\n二、“寓言”的笔法\n\n《九月寓言》没有统一的故事情节，也没有贯穿作品的人物形象，而是以一种“散点”透视的手法，表现沿海一个渔村与世隔绝的自然生态与文化生态。小说中有许多摆脱了历史参照系的现实性事件，就好像一般寓言作品中经常使用的“很久以前”“古时候”“从前.....”等等不确定的时间概念，使故事本身与时代背景如同分离一样，从中可以体会到小说的叙事特色：作家采取了“寓言”的笔法，一次又一次地在现实故事中插入无特指时间性的叙事，把故事从具体历史背景下扯拉开去，扯拉得远远的，小村的历史游离开人们通常所认识的历史轨迹，便展示出无拘无束的自身的魅力。\n\n三、灵动的叙事时间\n\n《九月寓言》全书共七章，第一章采用了肥夫妇俩的视角来回忆往事，但自第二章始，作家作为一个独立的叙事者，正式插入故事场景，由回忆带来的真实感逐渐为寓言的虚拟性所取代。小说的结尾处，作家不再回到叙述的起点，而是结束于小村历史的终点，由回忆始，由寓言终，当事人的回忆在缠绵语句中变得又细腻又动听，仿佛是老年人讲古，往昔、今日、未来都成混沌一片，时间在其中失去了作用。\n\n小说在思想和艺术上都取得了重要的成就。无论是对人类文明的多元思考，还是寓言式的写作、回环绵密的结构等，都使它成为作家本人和这一时期小说创作的标志性成果。","keywords":"多重思考 多元观照“寓言”的笔法 叙事时间","note":"《九月寓言》体现出了张炜在小说创作思想与艺术上的一次重大发展，是作家本人和中国当代文学史的一次重大收获，与《古船》相比，这部作品无论是在思想主题上，还是在艺术表现上，都展露出了许多新的因素，对此我们要有所掌握。张炜的《九月寓言》和《古船》作为具有代表性的两部作品，可能会在名词解释中出现，大家要关注一下。"},{"id":"373","stars":"★★★","title":"简析张承志小说创作特征","body":"一、自我意识与走向信仰的交融\n\n张承志依托某种生命哲学、自然信仰及对伊斯兰教本能的亲近，以历史回溯的方式进行精神拷问。一方面，他走向信仰，结合自身的历史经验，呈现出孤绝的气质；另一方面，他又有强大的自我意识，在抨击文化现象和反抗历史理性的时候，自我意识又常常压倒信仰，或对信仰有所利用。因此，张承志本身就具备难以研究透彻的复杂性。\n\n张承志的精神因素包含三个方面：一是毛泽东话语时代形成的红卫兵情结，表现为嗜好抗争、坚持强烈的精神信仰的心理；二是来自自然生命本身的庄重雄伟；三是对于历史的浓厚兴趣，这决定了在他的小说中，有大量指向历史的叙事。与此相应，小说也大致包含两部分内容：一是关于自然和生命的叙事；另一类则是以伊斯兰教史与相关精神探询为核心的叙事，有的则融合两者。\n\n二、壮美的风格\n\n诗歌精神与悲剧性生命情绪的融入，形成了张承志小说的特有的壮美风格。在他而言，小说的真正使命就是“切开了自己的血管”任激情喷涌，最终指向生命对信念的践行、艺术与人生的互为见证。他运用大量的象征意象和抒情画面来代替故事情节的叙述，使其小说洋溢着充沛的激情和深邃的哲理。“太阳”“残月”“黑骏马”“北方的河”“黄泥小屋”“金牧场”等，都是其理想与精神所寄托的对象，是作家心灵情感的外化、意味深远的象征。\n\n三、散文化倾向和“浪漫主义”格调\n\n张承志的小说有散文化的倾向和“浪漫主义”的格调。这指的是作品中不懈的对于理想的坚守和追求，和那种抒情、宣泄的表达方式。张承志几乎所有的重要作品，都与对理想的无条件的捍卫追求、牺牲的主旨相关；其高扬的精神资源发掘地，也主要以生活于内蒙草原，特别是西北黄土高原的蒙古族、回族的历史和现实为对象。张承志80年代末以后的创作，更为执著地歌颂生活于贫瘠的甘、宁、青沙漠边缘的回族农牧民，歌颂他们面对苦难对信念的忠贞不渝。前期创作中已经多少存在的宗教意绪，得到展开和凸现，并成为对抗现代金钱社会的理想、道德衰败的根据。他因此创造了真挚情感铺陈，语言之流倾泄的整体叙述形态。","keywords":"自我意识 走向信仰 壮美的风格 散文化倾向 “浪漫主义”格调","note":"张承志一方面走向信仰，但有时候自我意识又压倒信仰，同时又有着红卫兵情结，这使得他本身以及其作品表现得都十分复杂，难以透彻研究。而在艺术上，张承志具有一种壮美的风格、散文化的创作倾向和一种“浪漫主义”的格调，这部分我们要明确。此外，张承志的小说创作常常会和张炜的放在一起进行考查，大家要注意一下。相关内容可以参考陈国恩《张承志的文学和宗教》，具体资料可以在李凡文学正版群中领取。"},{"id":"374","stars":"★★","title":"简要论述张承志《心灵史》的思想艺术特色","body":"《心灵史》记述聚居甘肃、宁夏等地回族的哲合忍耶为着“心灵的纯净”，而艰苦卓绝，忍辱负重，而赴汤蹈火的故事。小说中大量引述“秘史”等历史资料，将虚构与“纪实”的方式结合在一起，“以最极端真实的材料去描写最极端虚无的东西”，去实现“心灵最彻底的表达”；不论在表达的思想情感上还是叙事方式上，都是张承志最主要的作品。这部小说的思想内容与艺术特色，主要表现在以下方面：\n\n一、思想主题\n\n《心灵史》叙述了哲合忍耶在200年间以牺牲至少50万人的生命代价来捍卫自己的教派和教义的苦难史和牺牲史。作者写哲合忍耶这部悲壮的历史，至少有以下几个层面的意义：\n\n（一）对一种伟大信仰精神的呼唤。\n\n由于不满于20世纪90年代道德滑坡、理想失落的精神文化景观，作者从哲合忍耶的殉教中看到了信仰的力量和捍卫信仰所付出的牺牲。\n\n（二）国民性更新的参照。\n\n作者从中国的边疆文明中找到了自由的精神和民众对所有生命的珍惜及承受苦难的坚忍，欲以此作为国民精神的参照，点燃国民精神新的火光。在作家眼中，信仰者的坚忍、自律、忠诚、勇敢等可贵品质像一面镜子映射着当代人萎靡不振的精神品格。\n\n（三）对汉文化传统的批判与补充。\n\n《心灵史》中大量的个人宗教体验昭示着对人生价值、生命意义的终极追问，这样的追问恰恰是汉文化传统所欠缺的。事实上，《心灵史》在对拘于俗世理性的儒家文明激烈抨击的同时，又引入儒家文明的许多价值准则，而在张扬哲合忍耶精神的同时，又淡化了其强烈的异质性。\n\n二、艺术特征\n\n《心灵史》是用文学形式写就的一部宗教史。全书叙述哲合忍耶教从清代乾隆年间至今200多年来创教、传教、爱教、护教的历史，由于这段历史是和哲合忍耶的七代宗教领袖的事迹紧密联系在一起的，所以全书按照七领袖的生平事迹，分为七大部分，每一部分称为一门，而不是按章、卷、部等小说体例。作家大量地对比引用了各种史料，尤其是回族民间秘藏、史料、文献，现代叙事和历史叙事交织一起，互相阐发、互相印证，是这部小说文体上的一个基本特点。在作家的历史叙述中，总是伴随着强烈的个人体验和对现代社会的批判。他把宗教、历史、考证、传说、诗歌、散文等“非小说”成分全部融化在灵动的现代叙事中，诗性的表达和美文的笔调在小说中相得益彰。","keywords":"伟大信仰精神的呼唤 国民性更新的参照 汉文化传统的批判与补充 文学形式写就的宗教史","note":"《心灵史》是一部宗教色彩非常浓郁的小说，从中可以看出张承志希冀通过张扬宗教思想而批判国民性与汉文化传统的野心；而在艺术上，这又是一部用文学形式写就的宗教史，许多“非小说”成分融汇其中，这些特点我们都要掌握。如果针对张承志出名词解释的话，很可能围绕他的两部代表作品《心灵史》和《残月》出题，所以对于这两部作品我们要多做准备。"},{"id":"375","stars":"★★★★★","title":"谈谈莫言小说的美学贡献","body":"莫言的小说在中国新文学中提供的主要美学贡献有以下几个方面：\n\n一、促成了汉语小说叙事人感官向文化景观、人性景观与自然景观的全面开放\n\n在莫言的小说中，色彩、形状和性状全部在想象力的作用下变得奇诡多姿，变化无穷。他的小说中往往有一个姿态较低的叙事人，对外界事物有一种革命性的感受和观赏，他开启了大陆小说叙事者被长期压制的感性世界。“大地”和“母亲”是莫言小说的基本主题，丰富的想象、历史、世俗生活、性爱场面、感性体验等是作品的多种“合成”因素。在开放的文体中，作者的主观感觉天马行空、多面辐射，形成了一个具有鲜明心理特征的感觉世界。\n\n二、汪洋恣肆的语言\n\n与他小说的“感官世界”相对应，莫言汪洋恣肆的语言十分有特色：一方面，它们表意准确传神，有效传达出故事讲述人的口吻和神态，造成了独特的效果；另一方面，它们又有浓郁的抒情功能，情感饱满并富有诗意。莫言热衷汉语表述的语言实验，历史图景和现实生活、官方脸谱和民间原型，也都一起驳杂地涌入莫言笔下，成为他泛滥语言的试验品，并以絮语\n\n形式弥漫铺张。同时，莫言诸多小说在叙事人语言的个性化方面有其独到的建树。他将一些生动鲜活的口语驾轻就熟地运用于叙事之中，使小说中的人物话语和叙事人话语都富有特色。\n\n三、富有张力的故事情节\n\n莫言是一个会讲故事的人，他的小说都在故事情节上富有张力，寓意于故事是莫言重要的叙事策略。就比如《红高粱》中，莫言把最朴实最常见的一种农作物张扬为一种“红高梁精神”，又从中发掘出“种的退化”的命题。萝卜和高梁，这最富有乡土气息的蔬菜和粮食作物，由此皴染出奇幻狂烈的色彩。\n\n四、文化视点下沉\n\n莫言是一位文化视点下沉的作家，他的乡村处世哲学和基于故事的小说观，让他成为一个中国经验的传达者-无论对于中国读者还是西方读者，他们看到的莫言的文学世界都是奇异的世俗故事和生存景观。\n\n莫言的小说美学受益于拉美魔幻现实主义的启发，其肆意的超验感知产生了类似于马尔克斯《百年孤独》中所出现的奇幻图景，充满着反美学与审丑的美学动机。这些特质给80年代末的文坛带来了一场审美革命。","keywords":"全面开放 汪洋恣肆的语言 故事情节富有张力 文化视点下沉","note":"莫言可以说是中国当代文学史考查中最重要的作家之一，相关知识需要我们仔细去记忆。莫言对中国新文学做出的贡献是多方面、全方位的，除了在文体形式上做出的开拓之外，莫言还促进了小说叙述视角与审美观念的变化，这些都在莫言的作品中体现了出来。在莫言相关的名词解释中，我们主要需要注意的是莫言的作品，如“红高粱家族”、《丰乳肥臀》等。"},{"id":"376","stars":"★★★★★","title":"试论述莫言小说创作的艺术特征","body":"一、鲜明的先锋意识\n\n莫盲在小说叙事艺术和观念上都显示出鲜明的先锋意识，对当代的文学写作和文学阅读产生了强大的冲击力。他成功地借鉴了美国作家福克纳对美国南方生活的艺术表现，受到哥伦比亚作家加西亚·马尔克斯以《百年孤独》为代表的魔幻现实主义的启发，采用了一种天马行空、不受拘束的叙述方式。在莫言的小说中，心理的流动、跳跃、联想是叙述的角度和驱动力，与之相伴的是大量奔涌而来的感官意象，莫言由此创造了一个色彩斑斓的感觉世界。莫言肆意的超验感知产生了类似于马尔克斯《百年孤独》中所出现的奇幻图景，充满着反美学与审丑的美学动机。这些特质给80年代末的文坛带来了一场审美革命。\n\n二、民族特色\n\n莫言没有因为对域外文学营养的自觉吸收而忽略对本土的资源开掘，他的小说从来没有离开他生长的土地，从题材到语言，从实际生活到鬼狐仙怪的故事，都从根本上决定了他的小说的民族特色。《透明的红萝卜》《红高梁家族》《红蝗》等小说中，莫言以浓墨重笔书写乡土生存图景，透射出超拔于历史、国族的宏大意旨，将记忆中的故乡作为写作的背景，淋漓尽致地上演了红高粱地上的情爱纠葛、民族气节，也充分展示了一个个性格鲜明的乡土精魂。\n\n三、清醒的文体意识\n\n莫言的叙事风格大致为：一是整体风貌体现为传统叙事框架，章法上遵循章回体小说的叙事方式；另一类则对西方的叙事小说文体进行结构模仿。莫言诸多小说在叙事人语言的个性化方面有其独到的建树。他将一些生动鲜活的口语驾轻就熟地运用于叙事之中，使小说中的人物话语和叙事人话语都富有特色。在叙事话语与叙事视角相融合之后，小说叙事的景观就更加扑朔迷离、富有可读性。\n\n四、热衷于语言实验，具有卓越的语言驾驭能力\n\n莫言热衷汉语表述的语言实验热情，显示出了驾驭汉语言的卓越才能，历史图景和现实生活、官方脸谱和民间原型，都一起驳杂地涌入莫言笔下，成为他泛滥语言的试验品，并以絮语形式弥漫铺张。莫言汪洋恣肆的语言十分有特色：一方面，它们表意准确传神，有效传达出故事讲述人的口吻和神态，造成了独特的书场效果；另一方面，它们又有浓郁的抒情功能，情感饱满并富有诗意。他运用了大量充满了想象力并且总是违背常规的比喻与通感等修辞手法，在语言的层面上就形成了一种瑰丽神奇的特点，以此造就出了异于寻常的民间之美的感性依托。","keywords":"先锋意识 民族特色 清醒的文体意识 驾驭汉语言的卓越才能","note":"莫言的小说艺术特征我们主要从世界性和民族性（也即先锋意识和民族特色）、叙事、语言这几个角度去分析，其中先锋意识主要是体现在魔幻现实主义手法上面，而民族特色主要体现在以故乡为背景，对本土资源的开拓，这一部分内** --- 容也可以联系后续题目中提到的莫言创作的美学精髓-乡土精魂和语言文体实验热情进行理解，前者对应莫言作品的民族特色，后者对应莫言的先锋意识。相关内容可以参考白杨《民族性·世界性·人类性-莫盲小说的核心质素与诗学启示》，具体资料可以在李凡文学正版群中领取。"},{"id":"377","stars":"★★★★","title":"试析莫言《红高粱》的思想艺术特征","body":"一、民间主题\n\n《红高粱》在情节构成上是依照了民间自身的主题模式，其中所突现出来的主要都是民间世界中强悍生动的暴力与性爱内容。它传达了一种“酒神精神”与生命意志，一扫既往的理性、克制、道德和礼仪，而尽情释放出生命的本能与欲望的活力，纵情舒展奔放的健康人性，以此对民族血性奔放的精神进行了溯源、发现和礼赞；并且以历史为鉴，检讨了今天民族文化与精神结构的衰败和蜕变。\n\n二、人物塑造\n\n《红高粱》在人物形象塑造上，除去了传统意识形态二元对立式的正反人物概念，比如把作为“我爷爷”出场的余占鳌写成身兼土匪头子和抗日英雄的两重身份，并在他的性格中极力渲染出了一种粗野、狂暴而富有原始正义感和生命激情的民间色彩。这些特点也同样体现在对于“我奶奶”戴凤莲和罗汉大爷等人物的刻画中。由于叙述者把这些人物都作为自己的家族长辈来写，就又在他们身上体现出了以前革命历史故事中少有的任性与平易之感。这就使得这部小说在人物形象塑造和情感亲合方面，都非常鲜明地表达出了一种真正向民间价值尺度认同的倾向。\n\n三、在艺术上，《红高粱》的叙事策略和语言方式追求着强烈的陌生化效果\n\n（一）小说的展开由感觉引导、由情绪推动\n\n《红高粱》的故事是以非故事的方式呈现出来的，即小说的展开并非依循事件的逻辑来建构，而是由感觉引导、由情绪推动。它通过叙述者“我”在现实与过去的追忆之间的自由穿梭，将完整、连续的事件链条彻底打碎和肢解，竭尽打乱时空顺序之能事。于是，情节的逻辑联系最大限度地被淡化，叙述显得自由散漫、了无拘束且生气勃勃。这种无所羁糜的结构方式，是《红高梁》的有意味的形式构成的一个重要方面，它与小说叙事意欲展示和张扬的精神非常和谐。\n\n（二）在叙述人称上将第一人称与第三人称叠合\n\n小说在叙述人称的使用上也有特色，主要以“我奶奶”“我爷爷”来展开叙述，第一人称与第三人称叠合在一起，叙述者和被叙述者紧密地结合在一起。这种方式一方面使叙述的强烈主观性得以凸显，另一方面，也因为这种凸显而显示出一种距离，隐含着一种对比。在这样的叙述人称的运用中，最逼真的细节也带有了虚幻的色彩，幻想和理想的成分于是可以名正言顺地进入叙事，同时理想和想象与现实的冲突也强烈地表现出来，从而获得了所谓“喧哗自嘲”的反讽效果。\n\n（三）语言上追求富有力度的表达\n\n《红高粱》中，最逼真的细节也带有了虚幻，一切语言都服从主体的自由创造和审美快感，而不惜偏离常规的标准，不管是政治、文化的约束，还是美学、道德的框限。其具体表现为：\n\n（1）小说蝎尽笔力描述暴力、偷情、野合、酷刑，借这些逾越常规的生命活动形诸令人惊悚的语言表达，产生极富感性的强力刺激。\n\n（2）重视感觉的呈现，大胆运用丰富的比喻、夸张、通感，色彩鲜明、丰富，诡谲奇伟，努力表现意识的流动和心理的跳跃状态，意象纷呈且奔涌而来。\n\n（3）注重对语言色泽的选择和气势的营造。\n\n也由于上述语言的特征，莫言小说在叙述上有时候显得缺乏节制，给阅读带来了某些不适。","keywords":"民间主题 人物塑造 陌生化 感觉引导 叙述人称 富有力度的表达","note":"作为莫言具有代表性的作品之一，《红高粱》在考查中出现的频率非常高，往往会让大家结合这部作品探讨莫言的创作特征，或直接回答这部作品的特征，因此我们必须要重视这部作品。《红高粱》这部作品可以说是切实体现了莫言的美学精髓，即乡土精髓和语言文体创新热情，前者表现为《红高粱》的民间主题，后者则主要表现在《红高粱》叙事和语言上的陌生化效果上。"},{"id":"378","stars":"","title":"与80年代“红高粱家族”相比，90年代以后莫言在创作主题、风格和叙事策略上有何变化（26江","body":"南大学）★★★\n\n90年代以后，莫言的创作更趋于自觉。从题材到语言，从实际生活到传奇故事，从艺术观念到创作手法，他的小说都表现出民族特色与新锐的现代艺术的融合。\n\n一、莫言的小说站立当下，植根农村，在叙述人的追述中以奇异的想象空间来展示生动的生命图景\n\n在莫言这里，乡村生活是与生俱来、物我同在、血肉相连的东西，而不是作家以猎奇者的身份在一个异己的空间里寻见的珍奇。莫言在不同的场合都强调过，他的写作立场不是“为老百姓的写作”，而是“作为老百姓写作”，其基本的含义就在于他的写作植根于农村生活。莫言小说中的人物总是与土地有割舍不断的联系，从自然中获取精神的支撑，艰难而坚强地活着。\n\n莫言处理乡村生活题材所采取的基本策略是叙述者的回忆。在莫言这里，回忆作为一个充满了主体选择和情感态度的叙述，意味着对“现在”的生命状态的失望驱使他在过去寻找生命的辉煌，显露出叙述主体对精神匮乏和生命委顿的现实的强烈感应。这一包含着现在与过去对应或对立关系的叙述姿态，在《丰乳肥臀》中体现为上官金童的视角对大半故事的呈现，在《蛙》中是身为作家的“我”（笔名“蝌蚪”）在对日常生活的描述中不断溯及过去，围绕着姑姑的经历展开的叙事。\n\n二、莫言的小说创作致力于叙事艺术的探索，实现了充满现实感的奇幻想象与充满现代感的传统叙事的巧妙融合\n\n莫言的红高粱家族显示了他对单一的线性故事叙述方式的放弃，狂放不羁的语言，放纵无拘的想象，四通八达的感觉，无不表现出对传统叙事方式的颠覆，对更为自由、更为强烈的艺术表现力的追求。而到了90年代，莫言的先锋探索依旧没有停歇，反而是进一步深化，致力于民族特色与现代小说的打通与融合。如《檀香刑》中，传统章回小说与民间说唱艺术成为小说最直接的外观形态。但是，进入故事的叙述层面，其多视角的描述，形成了叙事声音的多声部，夸张变形而又精确的语言，洋溢着拥抱并融化惨烈人生的喜剧精神和狂欢气息，是莫言式的酒神欢乐又一次地爆炸。而这种打通与融合在《生死疲劳》中达到了出神入化的境地。可以说，《生死疲劳》中传统的故事形式与强烈的现代叙事意识，高度统一于对人的存在的重新审视与发现这一富有现代感的主题之中。\n\n三、莫言的小说开掘了人性深处尖锐的戏剧冲突，揭示人性的复杂，展现人性的光辉，并以此构筑起对人的存在的深层隐喻\n\n在莫言的小说中，历史往往不过是一道虚拟的背景，乡土社会也不过是为操演各种人生搭建的舞台，它们关注的主题只有一个，那就是人性的真相。如果说，莫言在80年代所有乡村题材的小说叙述中，以一种酒神精神赋予他的故事主人公们浪漫的气息、原始的生命力，从而发出人性深处的歌哭与呼喊，那么，在90年代以后的小说叙事里，莫言则对人性的全部复杂性进行了不倦的勘探。在这种探索中，一个值得注意的问题是，莫言的叙事表层可以直观到的故事，往往构成对不可思议、超出经验把握的人性存在的隐喻。譬如他的中篇小说《怀抱鲜花的女人》采取了通俗小说中艳情的路数，不乏荒诞、传奇的色彩，但它揭示的是人在欲望驱使下的追求和被这种欲望占据与控制，人的理性和社会规范与人的自然、淳朴的本能和欲望之间尖锐的冲突。莫言很多小说的叙事都具有这种象征性和隐喻色彩，超越故事的表层，构成透视人性存在的窗口。","keywords":"站立当下 植根农村 奇异的想象空间 生动的生命图景 叙事艺术 现实感的奇幻想象 现代感的传统叙事 揭示人性的复杂 深层隐喻","note":"莫言在90年代之后的创作，相较于红高粱家族，表面上看似乎减弱了先锋色彩，但从深层次看，其创作艺术反** --- 而得到了进一步发展，达到了新锐的现代艺术与民间特色的完美融合。这主要体现在小说的题材选择、叙事艺术和对人性的开掘上，大家可以结合其后期的作品去具体展开分析。"},{"id":"379","stars":"★★★★","title":"谈谈莫言小说的民族性与世界性","body":"莫言小说的民族性与世界性表现在他的创作既吸收了中国传统小说创作的技巧，又借鉴了外国小说创作的新方法，呈现出独特的艺术特征。具体表现为：\n\n一、魔幻现实主义影响下的先锋意识\n\n莫言的小说在叙事艺术和小说观念上都显示出鲜明的先锋意识，对当代的文学写作和文学阅读产生了强大的冲击力。他成功地借鉴了美国作家福克纳对美国南方生活的艺术表现，受到哥伦比亚作家加西亚·马尔克斯以《百年孤独》为代表的魔幻现实主义的启发。他如他们一样，喜欢写故乡那片邮票大小的土地，表现故乡的历史、现实和人民，如福克纳的“约克纳帕塔法县”和加西亚·马尔克斯的“马孔多镇”。自此，“高密东北乡”进入了莫言写作中的“自由王国”。同时，在艺术上，莫言的小说也变得想象瑰丽、语言狂放，重视感觉的呈现，大胆运用比喻、夸张、通感的手法，色彩丰富、诡谲，给当代小说创作带来了一种新鲜的审美气息。\n\n二、民族特色与乡土精魂\n\n莫言没有因为对域外文学营养的自觉吸收而忽略对本土的资源开掘，他的小说从来没有离开他生长的土地，从题材到语言，从实际生活到鬼狐仙怪的故事，都从根本上决定了他的小说的民族特色。贯穿莫言创作始终的重要因素之一，是《透明的红萝卜》《红高梁家族》《红蝗》等小说中所描绘的各种乡土精魂，它是莫言灵动的审美想象力与乡土根性、种性的黏合物。《透明的红萝卜》将黑孩这个乡村精灵的形象浓缩于还带有动乱时代信息的乡土社会场景里。在《高粱酒》《高梁殡》《狗道》《奇死》《红高梁》这五个部分组成的《红高梁家族》中，莫言以浓墨重笔书写乡土生存图景，透射出超拔于历史、国族的宏大意旨，将记忆中的故乡作为写作的背景，淋漓尽致地上演了红高粱地上的情爱纠葛、民族气节。\n\n三、人类性意识下民族性与世界性的融合\n\n莫言小说中表现出的对人的自由精神的渴望、对强有力的生命形态的呼唤，则更是既植根于当代中国的现实土壤，又超越了现实的局限，为表现人这一永恒的主题提供丰富的艺术形式和内容。在很大程度上可以说，莫言前后期作品中一以贯之的核心质素便是人类性意识。他书写历史，重要的不是人物事件，而是书写涌动其中的人性与人心。他是民间心灵史和情感史的记录者。民间大地上的人性活力和舒展精神，成为莫言创作的不竭源泉，他对美的洞察，他的巨大才华和纯艺术禀赋，于此获得了民族性与世界性的有机融合。","keywords":"先锋意识 民族特色 乡土精魂 人类性意识","note":"莫言小说创作的民族性主要体现在对民族本体资源的开掘，具有鲜明的民族特色；而其世界性主要表现在魔幻现实主义等西方文学思潮影响下诞生的先锋意识，也即主要表现在艺术特征上。而莫言小说中一以贯之的人类性意识，让他做到了民族性与世界性的融合。类似的题目，在课本中很难找到答案，需要大家在掌握课本知识以及作家作品的同时，阅读相关资料进行延伸，而一些学校还特别针对这些内容出题，故此大家要有所准备。"},{"id":"380","stars":"★★★★★","title":"简述拉美魔幻现实主义对中国当代文学的影响","body":"【答题框架】\n\n魔幻现实主义对20世纪后期中国文学的强烈刺激与深刻影响，已成为文学史上一个不争的事实。这种影响并不仅仅局限于某位作家或某个流派，而是深深地影响了整整一代作家的创作追求与创作风格，在这里可以列举出一系列受到魔幻现实主义影响而又耳熟能详的作家：莫言、贾平凹、韩少功.....那么，拉美魔幻现实主义缘何能对中国当代文学产生如此深远的影响？而这种影响又表现在哪些方面呢？这里试为大家进行分析：\n\n一、拉美魔幻现实主义对中国当代文学产生重大影响的原因\n\n（一）二十世纪后期以来以马尔克斯为代表的拉美魔幻现实主义在世界范围内的“爆炸性”影响，尤其是马尔克斯获诺贝尔文学奖，给予了中国文学界巨大刺激，创作界开始积极关注马尔克斯，并出现了一股势头强劲的模仿、借鉴其魔幻现实主义的文学热潮。\n\n（二）作为接受主体的中国文学与拉美魔幻现实主义文学有着极为相似的历史文化语境和现实文化境遇。而这历史文化语境的相似性集中体现在中国、拉美这两块地域辽阔大陆共同拥有的神奇、丰富的自然遗产和文化遗产上面。\n\n（1）为马尔克斯魔幻现实主义文学提供丰厚精神资源的拉丁美洲神奇的自然景观、神秘的神话传说和悠久的文化传统同样存在于中国大地，扎西达娃、马原、阿来等笔下的西藏就是一个典型例证。这块神秘的雪域高原不仅留存有令人惊叹的自然奇观，还蕴藏着丰厚且鲜为人知的神话传说和宗教信仰。因此，当扎西达娃们一接触到马尔克斯，就天然地产生了顿悟与共鸣，并进而找到了表现这种自然和文化的手段。\n\n（2）从《离骚》、魏晋志怪、唐传奇到《西游记》《红楼梦》，中国传统文学中从来就不乏“神秘性”的因子。这种神秘文学传统使20世纪后期的许多中国作家在接触马尔克斯的魔幻现实主义文学时，似曾相识之感油然而生，并自信也能创造出中国式的魔幻现实主义文学。\n\n二、拉美魔幻现实主义文学对中国当代文学影响的发展\n\n在外来艺术思维的启示下，中国作家触发了沉浸在心中的艺术种子，唤醒了自身所具有的乡土根性的艺术灵感。20世纪后期中国文学对魔幻现实主义表现手法的借鉴，尤其是对民间神秘文化资源的开掘，突破了传统现实主义机械反映现实的局限，使文学向着其审美本质靠近，呈现出浪漫与神秘相交织的独特美学意蕴。从这一意义上说，魔幻小说为本时期文学完成了一次文化观念与审美风格的变革。当然，中国文学这一变化成为一次真正意义上的现代性变革，前后经历了一个从形似到形神结合的过程。\n\n（一）接受的高潮-追求形似\n\n1982年，马尔克斯获奖的爆炸效应迅速将中国翻译界、理论界和创作界的视线拉向了拉丁美洲这块神秘的大陆，三界同\n\n仁的热情认同、相互呼应、合力并进，将马尔克斯在中国的传播与接受持续推向高潮。这种状况一直持续到20世纪90年代。\n\n（1）翻译界率先掀起了译介加西亚·马尔克斯的热潮。这一时期，马尔克斯的所有小说作品包括一系列对话，几乎都被翻译成中文。\n\n（2）理论界的研究日渐广泛深入。这一时期我国的研究者开始超越以往一般性介绍马尔克斯的局限，在借助国外成果的基础上表现出对马尔克斯的独特思考，发表和出版了一批学术含量较高的论著。\n\n（3）创作界开始积极关注马尔克斯，并出现了一股势头强劲的模仿、借鉴其魔幻现实主义的文学热潮。\n\n中国文学对《百年孤独》的借鉴最早表现为寻根文学和一些地域小说普遍显现出一种“神秘化”的创作倾向。民风乡俗、历史神话和民间传说被大量挖掘与呈现，一个个充满鲜丽浓郁的地域品格和民族特色的“神秘中国”在作家笔下得以构建。\n\n不过在这一时期，韩少功的“东方神秘思维”，贾平凹的“商州魔幻世界”，以及莫言的“红高梁”......看上去“魔幻”味十足，但“形似”的成份更多一些，他们与魔幻现实主义相通的更多是在表层：变幻莫测的神秘气氛、引人入胜的神话与传说、匪夷所思的“魔幻与现实”......这些地域文化的展现最初固然可以给读者带来阅读上的新奇感和震撼感，但却未能准确把握民族文化特征，故而并未触及魔幻现实主义写作的精髓。\n\n（二）接受的深化-形神结合\n\n20世纪90年代中期以后，随着拉美魔幻现实主义文学高潮的消退，马尔克斯在中国的传播与接受也逐渐由热烈归于平静。此时，中国学者和作家开始冷静地回顾与反思马尔克斯在中国传播与接受的过往，反省自身简单盲从和机械模仿的失误，试图走出影响的重围，重构自己的研究视角和本土化文本，这无疑是接受走向深化、接受主体成熟的表现。由此，对马尔克斯的接受步入了一个更为深刻、更为丰富的层面。\n\n（1）从研究方面来说，接受的深化主要体现为多元开放接受视角和视阈的引入与运用。此时中国学界不再将视阈集聚于马尔克斯及作品的概念、源流、主题和人物的一般性分析，而是引入存在主义、叙事学、后殖民主义等多样化视角探讨其丰厚意蕴与艺术价值。\n\n（2）就创作而言，接受的深化则表现为一些作家对马尔克斯魔幻现实主义文学的主动疏离与有意“撤退”。90年代中期，莫言、余华、阎连科等作家为摆脱影响的焦虑，对马尔克斯的魔幻现实主义显露出愈来愈强烈的疏离与抗拒意向。从这里，我们看到了中国作家主体的自觉和艺术的成熟。\n\n不过，小说的神秘叙事在中国文学中井未退场。90年代文坛《白鹿原》《马桥词典》《尘埃落定》等作品接连推出，闪烁着令人瞩目的神秘色彩。《白鹿原》对中华传统文化隐秘性和神秘性的现代审视，韩少功借助马桥语言对民间神秘叙事的文化观照，以及《尘埃落定》中智者和愚者双重历史身份的“二少爷”独一无二的视角下的民族寓言，不难看出对80年代中国魔幻现实主义创作的反思-这些作品都表现出由横向移植逐渐转向立足民族本位、注重本土体验的特征。中国文学对《百年孤独》的“变现实为神奇而又不失其真”的真谛的理解和接受在逐步深入。“魔幻写作”中国化进入第二阶段：走向神似。\n\n从80年代的刻意模仿、追求形似到90年代的追求形神兼备，伴随着对魔幻手法创作真谛与文学创作本质的领悟渐渐深入，中国作家开始悟出：魔幻写作手法本身或许并不重要，重要的是对“如何写”的观念的改变与突破。一个更重要的启示是魔幻效果背后的文学创作因子：摆脱成规，不拘传统的想象与虚构，自由地探索现实真实。\n\n三、拉美魔幻现实主义对中国当代文学影响的表现\n\n（一）文学流派\n\n（1）寻根文学\n\n①拉美魔幻现实主义文学推动了寻根文学的产生\n\n寻根文学的缘起与寻根理念的产生有内外因素的影响。从内因来看，寻根文学的缘起与寻根理念的产生可说是中国文学自身运行轨迹的必然。从外因来看，寻根文学的缘起与寻根理念的明朗化，是拉丁美洲魔幻现实主义文学的影响与刺激。面向世界的窗口打开以后，中国作家产生了热切的“走向世界”的渴望和梦想，而魔幻现实主义代表作家马尔克斯的获得诺贝尔文学奖及其《百年孤独》的风靡世界，则使中国作家明白了中国文学走向世界所应选择的路径，那就是以民族文化为依托，去创造崭新的文学世界。“寻根文学”的兴起，正体现了中国文学对拉美文学成功经验的借鉴性冲动，体现了对本民族自身文化传统和审美表达方式的呼唤。\n\n②拉美魔幻现实主义文学为寻根文学的发展提供了经验\n\n拉美魔幻现实主义作家都不是西方典型的现代主义作家，而是“土著”，但在表现他们所生活于其间的民族文化特征与民族审美方式时，又分明是渗透了现代意识的精神，这为主张文化寻根的中国作家们提供了现成的经验。也就是说，一方面要找寻“民族传统文化”这个“根”，另一方面又要以现代意识来烛照“根”，甄别“根”的优劣。\n\n③拉美魔幻现实主义文学影响了寻根文学作家的创作实践\n\n魔幻现实主义对寻根文学的影响不仅体现在“寻根”理论主张的提出和相关创作热潮的兴起上，也充分体现在寻根作家的创作文本中。\n\n首先，寻根文学在通过村寨史、家族史来找寻民族的根、文化的根方面与魔幻现实主义有相似之处。其次，寻根文学不仅以拉美魔幻现实主义文学为精神参照，也以拉美魔幻现实主义文学为艺术取法对象，寻根作家对国外优秀文学如魔幻现实主义文学的技法大多有着自觉的学习愿望，不少寻根小说作品对魔幻现实主义手法进行了成功借鉴。最后，魔幻现实主义作家对“神奇现实”的描写极大地刺激了中国作家的想象力，为中国寻根作家带来了新的灵感和冲动。\n\n（2）西藏魔幻小说\n\n魔幻现实主义进入中国后所开出的最艳丽的花朵，就是西藏魔幻小说。西藏在自然地理，山川物态等方面很像南美洲。和南美大陆一样，这里拥有产生魔幻小说的最佳土壤与条件。而拉美魔幻现实主义文学也的确是让西藏魔幻小说创作蓬勃发展。西藏作家之中，扎西达娃主要取法于马尔克斯，他所创作的魔幻小说曾经名噪一时。在某种程度上可以说，西藏新小说之所以在新时期骤然走向全国，甚至走向世界，与西藏的魔幻小说创作有很大的关系。\n\n（3）新笔记小说\n\n新时期以来，在中国小说园地出现了为数不少的有着传统笔记体小说神韵的小说作品，时人称之为“新笔记小说”。新笔记小说之所以成为一种有生命力的小说样式，除了它对传统养料的充分吸纳与转化外，还因为它承接了外来文学的营养，以此获得了新的质素和发展革新小说表现手段的可能。80年代风靡中国的魔幻现实主义就曾给它以影响，这种影响不是出于想像与揣测，而是有着事实依据和文本实例的。\n\n①拉美魔幻现实主义文学启发了新笔记小说的写作\n\n新时期作家写作新笔记小说并不单单是受传统审美趣味的驱使，有的还受到魔幻现实主义的启发和影响。比如，老作家汪曾祺之所以通过改写古人作品的方式来写作新笔记小说，就与拉美魔幻现实主义的启发有关。\n\n②在新笔记小说中，也不乏魔幻现实主义手法的运用，这在贾平凹的新笔记小说中表现尤其突出\n\n首先，“魔幻现实主义”手法的一大特点便是打破现实与虚幻的界限，将种种神奇、怪诞不经之事当作真实来写，由此来曲折反映现实。贾平凹的《莽岭一条沟》《太白山记》也用“以实写虚”的类似手法叙写了种种神奇而又怪诞不经的事。\n\n其次，魔幻现实主义也常常打破生与死的界限来进行“神奇现实”的写作，类似的写法在贾平凹的新笔记小说中也可以见到。\n\n最后，贾平凹曾坦言他推崇马尔克斯，贾平凹小说中的神奇之事，无疑和马尔克斯笔下的人随床单飞升上天，人死后血会流到亲人的身边去报信之类的神奇事件一样，不仅是对现实状态的抽象、夸张，更是对现实的一种特殊表现和别具匠心的揭示。\n\n（二）作家创作实践\n\n（1）莫言\n\n①拉美魔幻现实主义文学影响了莫言感觉魔幻的营造\n\n莫言拥有超常的感官感觉能力，创作时非常重视感觉，所着重表达的也是感觉经验，通感之类手法的使用也随处可见。莫言的魔幻般的感觉描写主要取法的是拉美魔幻现实主义的文学经验。读着他小说中的句子，我们会想起《百年孤独》中所写的人嗅到“魔鬼有股硫磺味”，莫言和马尔克斯、阿斯图里亚斯等拉美作家一样，把感觉写得神奇无比，把有生命和无生命的东西都写得灵性十足，正如那些门窗、大街小巷、树木房屋、道路、石子一样，莫言笔下的花、草、红高梁等都有了情感反应和动作。\n\n②拉美魔幻现实主义文学影响了莫言“高密东北乡”这一艺术世界的建构\n\n马尔克斯对莫言的影响不仅仅体现在感觉魔幻的营造、素材的化用、构思的启发、手法的借鉴等方面，还体现在“高密东北乡”这一艺术世界的建构上。莫言曾自述，他的“高密东北乡”是受马尔克斯的“马孔多”小镇和福克纳的“约克纳帕塔法县”的启示而创造出来的，而且在建构它时比马尔克斯、福克纳显得更为大胆”。莫言不断用眼睛、耳朵甚至头脑捕捉\n\n外面的信息，并将这些信息变成一种宝贵的资源，源源不断地补充到“故乡”的资源中去。“高密东北乡”的艺术世界显然比“马孔多”和“约克纳帕塔法县”更充满了变化的动感，以至于成为一个具有乌托邦式的虚幻色彩的乡村。\n\n（2）拉美魔幻现实主义文学影响了贾平凹“神秘主义”风格的形成\n\n贾平凹80年代以后的创作，具有广泛的神秘意识，表现了众多神秘现象，评论家注意到了贾平凹的这种“对神秘文化的深入体验与传神表现”，称他的创作具有一种“神秘主义”。而这种“神秘主义”风格的形成脱不开魔幻现实主义的影响，对此，贾平凹也坦然承认：“拉丁美洲文学中有魔幻现实主义一说，......我受过他们的启示。”\n\n（3）拉美现实主义文学影响了韩少功对民族文化基因的探寻与呈现\n\n作为寻根者的韩少功所写的带有魔幻色彩的小说如《爸爸爸》等作富有浓烈的文化人类学的意味。阿斯图里亚斯和卡彭铁尔等魔幻现实主义作家之于世界的意义不仅在于他们首创了称之为“魔幻现实主义”的创作方法，而且在于挖掘和发现了拉美印第安文化和加勒比黑人文化的基因，韩少功和这些拉美前辈同行相像的地方在于，他通过自己的创作对潜藏于楚文化中的民族文化基因进行了探寻和如魔似幻的呈现。\n\n四、中国魔幻现实主义文学与拉美魔幻现实主义文学的区别\n\n（一）用意象来营造魔幻\n\n如何既学习拉美魔幻现实主义又能以不同于拉美的方式来表达魔幻？这是那些倾心于拉美文学而又试图有所创新的中国作家一直在追问的问题。在追问与思索中，他们发现了意象，于是作家们尝试用意象来制造魔幻。\n\n在受魔幻现实主义影响的作家中，相对而言，贾平凹、莫言比较偏爱使用诡奇的意象来制造魔幻。这些意象有动植物意象，如马、牛、鹿、狼、花、萝卜、高梁等，有的则是昆虫如蝴蝶、蝗虫等，也有日月星辰等，它们或常见于传统的文学作品中，或来自于作者所熟悉的生活世界。在作品中，它们不仅仅是自然物，也是给作品带来新颖、奇幻之感的重要因素。\n\n（二）用中国特色的鬼魂描写来达成魔幻\n\n表面上看，打破阴阳界限的鬼魂描写在拉美魔幻现实主义作品中和中国当代作家的小说中都同样存在，而且都同样造成了“魔幻”的效果，但实际上二者所依托的文化背景是不同的，对鬼魂的观念认识和具体写法也就不尽相同。\n\n马尔克斯、鲁尔福小说中的鬼魂情节是按照拉美印第安人对人与鬼、生与死的传统观念来安排的。而贾平凹、莫言等中国作家在写鬼魂时，则是以中国人的鬼神信仰、观念认识为基础的，其种种描写常常和中国自古以来对鬼魂的观念认识联系在一起。\n\n再者，从鬼魂的行为表现来看，中、拉作品中的鬼魂也有所不同。在魔幻现实主义作品中，鬼魂从不作恶，而在古今中国作家有关鬼魂的魔幻描写中，鬼有善恶之分。\n\n（三）用变形的手法来获得魔幻的效果\n\n中国作家还用变形的手法来获得魔幻的效果，这在拉美魔幻现实主义作品中虽然也可见到，但其关联的文化背景和具体的意义指向是有所不同的。\n\n拉美魔幻现实主义作家的变形描写是与拉美印第安人与黑人的观念信仰紧密联系的，意在表明，美洲的“神奇现实”在很大程度上体现为人的思想意识和观念信仰的神奇。\n\n莫言、贾平凹等新时期中国作家虽然叹服拉美作品的魔幻神奇，但却决心走民族化的路，利用自己的文化资源来创作像魔幻现实主义那样的作品。其小说中的变形描写经验就更多地来自于自己的传统，往往很少拉美的特征，而带有更多的传统印记。","keywords":"拉美文学爆炸 历史文化语境 追求形似 形神结合 寻根文学 西藏魔幻小说 新笔记小说 莫言贾平凹韩少功用意象来营造魔幻 中国特色的鬼魂描写 变形手法","note":"毫无疑问，拉美魔幻现实主义文学对中国新时期以来的文学发展产生了重大影响，而且这种影响体现在多个方面。但中国对于拉美魔幻现实主义文学的接受同时也经历了一个发展的过程，从刚开始的追求艺术上的形似到最后思想与艺术完美结合，中国当代作家在真正认识和接受了拉美魔幻现实主义文学之后最终形成了具有中国特色的魔幻主义文学。这里从影响发生的原因、接受过程、影响的具体表现以及中国与拉美魔幻现实主义文学的差异四个方面给大家作了一下梳理。此外，针对当下拉美魔幻现实主义文学的研究，有学者从另一个角度给出了自己的思考，认为拉美魔幻现实主义文学虽然流行世界，但却被欧美权威进行了“改写”，抹消了拉美魔幻现实主义文学的政治属性，而将其纯文学化；而80年代中国文学界在接受拉美魔幻现实主义文学史，也有意无意地忽视了拉美魔幻现实主义同政治的联系。这无疑给我们认识拉美魔幻现实主义文学，以及认识中国对拉美魔幻现实主义的接受提供了新的视角。大家可以参考一下滕威《从政治书写到形式先锋的移译-** --- # 拉美“魔幻现实主义”与中国文学》这篇论文，具体资料可以在李凡文学正版群中领取。"},{"id":"381","stars":"★★★★","title":"试述80到90年代“先锋小说”的思想和艺术特征（26武汉大学）","body":"“先锋小说”不仅在语言形式、叙述技巧方面，而且在思想观念、文学精神上，都表现出对西方现代文学尤其是第二次世界大战以后西方文学思潮和创作方法的接收和吸纳，在当时极具冲击力，对后来也产生了深刻的影响。具体来说，“先锋小说”的特征，表现在以下方面：\n\n一、重视叙述，关心故事的“形式”\n\n重视叙述，是“先锋小说”开始引人注目的共通点。他们关心的是故事的“形式”，把叙事本身看做审美对象。像法国新小说和博尔赫斯一样，他们把叙事看做创作的目的，看做小说的本体意义，认为衡量好的、一流的小说家作品的“标准”，就看他“讲”故事的能力。为此，他们不惜运用虚构、夸张、编造的手段，拼接、剪贴现实生活中可能没有，而小说艺术中却可能存在的各种稀奇古怪的故事、情节甚至细节，以此来转移、改造读者的阅读经验。比如孙甘露把自已小说的标题确定为《访问梦境》，表现出露骨的反真实、反小说的意图。\n\n二、“元小说”手法\n\n先锋小说普遍运用“元小说”的手法，消弭了传统小说的真实与虚构的界限，颠覆了传统小说的真实观，使小说成为开放的文本，充满不确定性。“虚构”与“真实”在作品中有意混淆拼接，构思、写作过程被直接写进作品，参与文本的构成。比如马原就明白交代创作就是一种编造。“我就是那个叫马原的汉人”是经常出现在他的小说中的句子。“虚构”是他的一篇小说的题目，里面交代小说材料的几种来源，和多种不同的处理和选择。\n\n三、淡化、消解小说意义传达\n\n先锋小说都淡化乃至取消了小说在文化和意识形态上的意义传达，而让位于话语欲望的尽情释放和叙述技巧的炫目演示。&#x4E0D;少“先锋小说”的叙述，大多只是平面化地触及感官印象而强制性地拆除事件、细节与现实世界的意义关联。这些小说放弃了对现实的真实反映，将人物、时间、空间等因素都加以抽象化，使之成为作者手中随意操纵的符号，以致文本只具有自我指涉的功能。读者将难以得到通常小说有关因果、本质的暗示，和有关政治、社会、道德、人性之类的“意义”提升。\n\n四、注意开掘死亡、性、暴力等潜意识主题\n\n由于先锋小说主张与社会现实脱节，所以，他们在创作中更倾向于开掘与“梦境”“幻觉”等相联系的死亡、性、暴力等潜意识主题。如果说寻根小说阶段的作家，如韩少功、阿城等人的历史记忆还经常涉及到“文革”知青生活的话，先锋小说则更愿意选择象征、寓言、隐喻作为叙述的对象，他们对现实生活的理解与前者已经明显不同。\n\n先锋小说对文学传统的反叛，影响着整个80年代的思想文化背景。正是在这种意义上，先锋小说形式的实验并不仅仅表现为形式本身，而是时代精神的某种象征。","keywords":"重视叙述 消弭真实与虚构的界限 淡化文化和意识形态意义传达 潜意识主题","note":"先锋小说的出现一是由于当时中国整体社会文化环境的变化，二是由于西方现代派思潮和创作方法的涌入，因而，先锋小说显示出了与现代派相似的特征以及对文学传统的反叛，具体来说，主要表现在重视叙述，真实与虚构混淆，淡化意识形态和发掘潜意识主题这些方面，大家对此要重点掌握。相关内容可以参考程光炜《如何理解“先锋小说”》、贺桂梅《先锋小说的知识谱系与意识形态》，具体资料可以在李凡文学正版群中领取。"},{"id":"382","stars":"★★★","title":"简述马原小说叙事特色","body":"马原的小说以其在叙述上的先锋实验性质引领了80年代小说叙事的革命，唤起了小说写作对形式和语言的自觉，他所采取的叙述技巧以及其中蕴涵的小说观念，对80年代后期的小说写作产生了很大影响。具体来说，马原小说的创作特征，主要表现在以下方面：\n\n一、“马原式”叙事圈套\n\n马原深受法国“新小说”陌生化风格与“元叙事”结构技巧的启示，借鉴拉美作家博尔赫斯“迷宫叙事”的策略，制造出了一种所谓“马原式”的特有的“叙述圈套”。其特点主要体现在：一是作者本人作为讲述者常常介入到小说故事之中，故意模糊叙述者与被叙述者之间的界限；二是故意把两个以上的故事切碎，以杂糅方式交叉讲述，增加阅读的障碍；三是故意在小说叙事的时间和空间上做手脚，使故事发展与讲述本身最终无法被证实也无法被证伪，或者在证实的同时又予以证伪；\n\n四是大量的叙事“留白”，故意不交代情节的背景与前后因果逻辑，使故事处于悬疑状态。这一切使得他的叙事具有了很大的挑战性和阅读难度，使阅读变成了一种“破解”或“猜谜”式的智性活动。\n\n二、“元小说”叙事方法\n\n马原惯用的手法是“元小说”叙事，在马原的小说中，这种方式被反复运用。如他的《虚构》从题目上就意在打破读者的“似真幻觉”，强调小说是虚构的。在《冈底斯的诱惑》第15节中，小说的第一级叙述者更是直接讨论小说叙述上的问题。\n\n马原的小说采用“元叙事”的手法，带来了所谓“裸露的叙述”。在这种叙述姿态和叙述策略之下，小说写作的神秘性被消解，虚构性得到强调，传统文学观念中的真实观被摒弃。对读者而言，这种叙述表现出一种开放性，它呼唤读者将眼光转向叙述本身，而不是寻找文本背后预设的“真实”和意义，从而调动自身的经验参与文本的创造。\n\n三、不追求时间逻辑，不追求情感、情绪联系\n\n马原小说所叙述的故事不追求事件的逻辑联系，也没有情感和情绪的联系，是若干个兀自独立的片断，它们往往被叙述者“强行”组合在一起。这种叙述方式打破了时间的连续性和空间的统一性，取消了事物之间的各种逻辑的、因果的联系。如此一来，这些故事虽然保留了局部的真实感或者说“似真幻觉”，但是由于逻辑的、因果的联系被解除，便拒绝了读者对之做深度追究的企图，也就使叙事变成了漂浮在语言之流中的经验的碎片。在这样的叙述面前，传统的阅读期待受到无情的戏弄，作者（或者说叙事文本）与读者之间的关系也由此被导入一个新的状态，那就是没有任何先在目的的纯粹“讲／听”的关系。\n\n拆解文学虚构与生活真实的界限，用语言创造一种现实；质疑人们的理性思考和逻辑把握能力，中断或者重述、重建事物之间的因果关系......马原成功的文学探索，为后来者提供了启示和路径，也规定了“先锋文学”的发展方向。","keywords":"“马原式”叙事圈套“元小说”叙事方法 不追求时间逻辑、情感和情绪联系","note":"马原中国当代“先锋派”小说的代表作家之一，在当代文学史中占有重要地位。其著名的“叙述圈套”开创了中国小说界“以形式为内容”的风气，对中国当代文学的发展起到了重要影响，所以对于马原的小说叙事特色，我们需要有所掌握。"},{"id":"383","stars":"★★★★","title":"试述余华的创作历程，并分析其创作转型的得失","body":"一、前期：先锋性的探索\n\n余华是当代中国最具先锋意识的作家之一。他的创作深受川端康成、卡夫卡等人的影响，而他在80年代的小说带有很强的实验性，充满了先锋性的探索。这一时期，余华的先锋性体现在两个方面：\n\n（一）“冷漠叙述”\n\n死亡与暴力是余华早期作品的两大主题，他总是以冷漠、中性、客观的叙述，以精微、绵密的描写，表现罪恶、阴谋、死亡、暴力、血腥及世界的混乱与悖理，深刻揭示人性之恶。在他笔下，人性的丑陋与阴暗被淋漓尽致地展现，生命间兽性的对抗和攻击被客观冷漠的语言平静地揭示出来。阴郁、冷酷的气息，血腥、冰冷的场面，恐怖、跌宕的情节，显示出余华小说的暴力美学特征。\n\n通过暴力的展示，余华的小说穿透了现实历史文化的层层铠甲，对人类存在的荒谬性和悲剧性进行了深层的探察，作者平静冷漠的叙述语调和对荒谬、悲剧的轻描淡写，使其小说世界仿佛是一个没有丝毫光亮的绝望的地狱。人物的血肉和情感也被冷漠叙述、暴力美学和形式实验交织而成的力量剥落殆尽，成为一个供写作者随意操纵的符号。\n\n（二）“文体的颠覆与戏仿”\n\n余华小说的先锋性除了体现在对暴力和死亡的沉迷和欣赏之外，还体现在对传统小说程式的颠覆性戏仿上。在叙事方法上，余华这一时期的作品非常富有“元小说”的意味。《鲜血梅花》《河边的错误》《古典爱情》这些通常被看做是对于武侠、侦探、言情小说的戏拟作品，参与了对于“现实秩序”的“共享”经验的颠覆。\n\n二、后期：温情的“现实主义”\n\n90年代以后，余华在对自我和艺术的双重否定中已悄然开始转型，从以前的残酷、血腥、暴力、宿命主题转移到了生存苦难的主题上来，对人性和世界的感受从冷酷到悲哀到充满人间温情，他从追求一种极致的精神感受的内在真实变成了对平民日常生活常态的理解和超然。
