岗文学”、“打工文学”等等。"},{"id":"37","stars":"★★★","title":"冰心的小说具有怎样的特点","body":"冰心（1900-1999）是五四时期的重要女作家，这位擅长小诗和散文的作家，最早却以“问题小说”而闻名，冰心于“五四”时期开始文学创作，一生笔耕不辍，在诗歌、散文、小说等领域均有不俗的成就。她的小说创作，主要具备如下特征：\n\n一、明显的批判意识\n\n1919年冰心发表了第一篇小说《两个家庭》，以对照的方法否定了封建官僚家庭培养出来的游手好闲的女子，肯定了受资产阶级教育的贤妻良母，从而提出了自己对家庭、教育乃至人生诸问题的看法。接着，又发表了《斯人独憔悴》《秋风秋雨愁煞人》《去国》等小说，提出了父子冲突、妇女解放、使用人才等一系列人们所关注的社会问题。\n\n（李凡说：冰心此类作品，在小说的结构上，大多采用双向型的结构框架，地常以两个家庭、两个人物、两个事件、大洋两岸为主线，平衡展开，结局却是大相径庭。通过鲜明的对比，给人们以启迪，发人深思。在小说的描写手法上，地常采用白描的手法，以简练的笔墨，不加烘托，勾勒出鲜明的形象，表现她特有的诗的情性。）\n\n二、表现“爱的哲学”\n\n1921年发表的《超人》标志着冰心对种种社会问题开出了她的药方-这就是爱的哲学。\n\n《超人》《烦闷》《悟》构成了冰心“爱的三部曲”，《超人》就提出了“人生究竟是什么？支配人生的，是‘爱”呢，还是“憎”？”这样一个使许多青年感奋的命题。主人公何彬，原是个超然人生、仇恨人类社会的超人，后却为儿童与慈母的爱所感化，认识到世界上的人“都是相牵连，不是互相遗弃的”。1922年发表的《烦闷》则展示了时代青年的内心矛盾、心理波折和精神危机，最终以母爱驱逐了烦恼。《悟》则更进一步把“爱的哲学”宣扬到神圣无边的程度，推向极致。\n\n“爱的哲学”，既传达了全人类普遍相通的高尚情感，也表现了生活在虚伪奸诈的现实生活中的人们对纯真美好感情的渴望。缺憾在于冰心把“爱的哲学”过于绝对化。\n\n三、后期开始注意社会上人的矛盾，关切儿童世界\n\n30年代，随着时代发展的变迁和自身经历的影响，冰心已与“问题小说”的时代告别，而开始注意社会上人的矛盾。《分》这篇童话体小说，发挥了她关切儿童世界、想象丰富新的文学创造力，用两个初生婴儿的拟“对话”来显示人与人之间如何的不同。\n\n四、文字清新，情感婉约\n\n冰心文字清新、细腻，没有强烈的叛逆色彩和震撼人的艺术力量，但探索有度，一切娓娓道来，似涓涓细流，可称女性作家中的“婉约派”。\n\n冰心的小说，较少宏篇巨著，多是清新隽永的珍品，她的许多作品看起来情节单纯，却寓意深远，留给人无穷的回味。她撷取现实生活中的一个片段，人生旅途中的一段机缘，展示出错综复杂的社会生活的一个侧面。没有离奇曲折的故事，没有金戈铁马的壮举，却具有一种哲理的追求。她常常用机敏的目光，去观察社会，审视人生；从人际关系撞击中，爆发出火花，捕捉生活中蕴藏的哲理寄托自己的情思，富有清新的哲理和诗意。\n\n五、不设曲折的情节，不着力塑造人物\n\n虽是小说，但冰心作品往往着力于揭示人物的内心理路，或侧重抒发作者对生活的主观感受。这同注重故事的传统小说相去较远，含蓄蕴藉，形成独特的“冰心体”。\n\n她的小说不以曲折的情节见长，也不着力塑造人物，多写生活中的片断和场景，结构单纯，抒情气息浓厚，融叙事、抒情和哲理表达于一炉。","keywords":"批判意识 爱的哲学 儿童文学 婉约派 情节与人物","note":"冰心的作品以其深刻隽永、意味深长的特点吸引了众多读者，从她的作品中，我们可以感受到生命的意义与价值，以及她从生活中所体味到的人生哲学。从另一方面来讲，她的作品是自身生活经历的体现，也是时代变化、历史变革的再现，作品取材于生活，又回归于生活，为众多的祖国人民带来视觉以及心灵上的享受。“五四”时期是冰心进行文学创作的第一个时期，这一时期的社会和国家发展是冰心艺术创作的基础，对其艺术特色也起到了巨大的影响。大家要结合社会背景以及作家经历进行把握，做到知人论世。"},{"id":"38","stars":"★★","title":"王统照小说创作的特点","body":"王统照是“问题小说”的代表作家。此外，他还曾经以翻译泰戈尔以及叶芝的作品知名，叶芝的小说也影响了这一时期王统照的创作。他的小说创作，主要表现出以下特征：\n\n一、早期创作关注“爱”与“美”，主观抒情较强而现实力度感较弱\n\n王统照的“问题小说”更突出“爱”与“美”的观点，把“爱”与“美”作为人生的理想目标，探讨人生的“烦闷与混扰”。不过，这位来自山东乡镇的作家，接触的更多是下层人民的愁苦生活，因此，这“爱”与“美”，常常以被毁掉的悲剧形式出现在他的笔下。夸大“爱”是“美”的力量，一方面是“五四”前后流行的“美育”思想的艺术放大，一方面也是他个人感情世界真切体验的尽情泄露。主观抒情性较强而现实力度感较弱是王统照初期小说创作的主要特点。此时作者的人生体验还比较单薄，加之又深受爱尔兰象征主义诗人叶芝的影响，所以“重在写意”、喜欢“从空想中设境或安排人物”。\n\n二、后期创作以写实方式反映被损害者的生活，风格转向忧愤粗犷\n\n在后期创作中，王统照逐渐放弃了早期作品中的对于“爱”与“美”的理想的“写意”性抒写，而转向对被侮辱被损害者的生活的写实性描绘。作者在此之后的小说，基本都是沿袭这一倾向而呈现出来的旧中国现实生活图景。活跃在作者这一时期作品中的主要人物，已然不再是早期作品中那些因“爱”与“美”的幻灭而痛苦的儿童、少女和青年知识分子，而是连最基本的生存要求都受到威胁的、挣扎于北方大地上的农民。苦难、贫困、死亡成为他这一时期作品的总主题，艺术风格也由前期的诗意朦胧而转向忧愤粗犷。\n\n三、擅长象征手法，擅长控制小说气氛，是早期长篇小说实践者\n\n王统照擅长运用象征手法，与故事的写实性掺杂并存，他受中国古典诗歌影响，在一开始写作白话小说时就坚持这种写法，是特色，也是初期现代小说不够纯正而留下的过渡痕迹。\n\n王统照还是中国现代中长篇小说的最初的实践者，他的长篇并不成熟，在揭露封建家族丑恶的同时流露感伤的意绪，写实笔调照样地不够纯正，几个人物组成的单线条结构也显得简单，但他控制小说气氛的笔力是充足的，展露了现代长篇草创期的一般特色。","keywords":"关注“爱”与“美”主观抒情较强 被损害者生活 忧愤粗犷 象征手法 控制小说气氛","note":"王统照自己对他的“问题小说”的看法是，“只是用不结实、不生动的文字写青年、恋爱、虚浮的幻想”，结构上“多从空想中设境或安排人物”。这自然有作家的自谦之辞，但也多少可见他创作的一种倾向。不过王统照没有过久地停留在理想的境界，他很快就回到正视现实人生的方面来。当他还没有完全认识现实人生的时候，留下的必然是一连串的问号；而当他树立起了“前路定有明光，阴影终将退去”的信念后，他便迅速地从“问题小说”的创作，走向了现实主义的宽广大道。"},{"id":"39","stars":"★★★","title":"叶圣陶小说创作的艺术特点","body":"叶圣陶的作品以“冷静地谛视人生客观的、写实的，描写着灰色的卑琐人生”为题材取向和艺术特征，是最具典型意义的文学研究会作家。他的作品，主要具有如下特征：\n\n一、早期作品主题为追寻爱与美，关注人与人之间的“隔膜”\n\n叶绍钧早期的创作属于问题小说的范畴，跟冰心、王统照有些相似，在作品中追寻着的爱与美，讨伐着现实生活的种种恶劣现象。他把关注的“问题”，更集中于封建宗法制度下人与人之间关系的“隔膜”。\n\n二、后期关注学校知识分子和市镇小市民精神历程\n\n“问题小说”潮流过去之后，叶圣陶在专心地刻写学校知识分子和市镇小市民的精神历程方面，显出与众不同。他笔下的知识分子形象与郁达夫相比有着明显的区别，郁达夫自叙传小说中的知识分子主人公有过多的孤芳自赏和自我怜悯，而叶圣陶则以一种鲁迅般的冷静的批判态度，着重揭示知识分子的精神病态以及“灰色的卑琐人生”，风格也呈现出细腻冷峻的特征。而描写城镇小市民生活的作品，也不属于小知识分子的自我表现，是采取了冷静批判的立场，着重于揭示小市民的精神病态。\n\n三、坚持现实主义原则，对中国教育状况深入思考\n\n叶绍钧是一位严谨的现实主义作家，他的几乎所有的创作都植根于对现实生活的深入观察和思考。他长年的基础教育生涯为他创作教育小说提供了丰富的素材，而他对中国教育状况的深入思考，使其作品具有了一定的思想深度。他洞察到教育的各方面，精湛地解剖着教育界人物的心理，同时还注意到学生的生理状态及其环境。教育题材小说在叶圣陶一生的文学创作中占有极其重要的地位，它们不仅是最充分地体现作者创作风格的重要作品，而且也是身兼文学家与教育家双重身份的叶圣陶在中国现代文学题材领域的独特贡献。\n\n四、语言简洁，结构严谨\n\n叶绍钧的小说从不大段地铺张华丽的语言，也极少长段的抒情、独白，而是多采用干净、简洁的语言，富有表现力。作为一位语文教育家，他其实在有意识地践行语言的规范化，这使他的作品成为现代白话文的典范文本之一。叶绍钧的小说结构严谨，前后回环呼应，结尾发人深省，是典型的短篇小说结构。","keywords":"追寻爱与美 隔膜 学校知识分子 市镇小市民 现实主义原则 中国教育状况 语言简洁 结构严谨","note":"“问题小说”代表作家中，叶圣陶是比较特殊的一位。他从“问题小说”起步，又成为“五四”人生派小说的代表作家，创作取向有一个明显的转变。同时，叶圣陶既是一位文学家，又是一位教育家，所以他的作品中关注学校知识分子，关注教育状况。这部分内容，我们都要掌握。这里需要提醒大家的是，王统照和叶圣陶同样作为问题小说创作的代表作家，可能会放在一起进行对比，不过整体考查的频率较低，大家可以在李凡文学正版群中查阅相关内容。"},{"id":"40","stars":"★★★","title":"为什么说《潘先生在难中》标志着叶圣陶小说风格走向成熟","body":"在叶圣陶的教育题材作品中，短篇小说《潘先生在难中》是标志作家个性趋于成熟的力作，也是中国现代小说史上最优秀的短篇小说之一。从艺术上说，这部小说显示着叶圣陶小说创作艺术的成熟，这主要表现在以下方面：\n\n一、现实主义风格成熟\n\n从小说的整个布局来看，开头写逃难，中间写逃难中的周折，末尾写逃难的结束，首尾一贯，富于变化，故事完整，章法严谨，是叶圣陶许多小说的典型写法。而潘先生这些经历，无不按照现实主义的原则进行创作，几乎每一细节甚至一言一行都符合人物性格发展的轨迹，都给人以“真切见到”的印象。同时，小说还关注细节的刻画，小说中的细节描写看似琐碎，却又是组成作品的重要部分。这些看似与我们不搭边的细节，却又都似曾发生在我们身边，不仅合情而且合理。这些都体现出了叶圣陶现实主义风格的成熟。\n\n二、人物塑造手法成熟\n\n其主人公潘先生是典型的灰色人物。作者把主人公江南某镇小学教员潘先生置于军阀混战的动荡背景中，在单纯的叙事线索中不动声色地展开曲折的描写，将变幻莫测的时局与主人公复杂难定的内心波动融合起来，无一句议论，而主人公表里不一、苟安自私、随波逐流的卑琐性格全都被暴露于读者面前。在一个短篇之中，能这样塑造出一个自私、疑惧、投机、苟安、卑琐，具有多侧面而又统一的小市民性格典型的，在当时是要比一般小说高出一筹的。\n\n三、讽刺艺术逐渐成熟\n\n对小人物以及知识分子形象的熟悉和关注是《潘先生在难中》取得成功的重要原因，在此前后，叶圣陶于暴露色彩中内蕴的讽刺喜剧手法，也渐渐趋于成熟。叶圣陶的讽刺属于鲁迅一派，辛辣而平静，暗暗发出冷光。他融合同情，朴素纪实，运用事实的对照进行“不动声色”的讽刺，在平实的叙述中让笔下人物在自己的所作所为中显露性格，暴露弱点，而作者的声音却深藏不露。能经过社会心理来透视具体人物的心理，能写出讽刺性人物性格（只是对话平板些），确实不凡。\n\n【李凡关键词：现实主义风格 人物塑造 讽刺艺术】","keywords":"","note":"《潘先生在难中》是叶圣陶先生早期创作中具有代表性的一篇。小说从现实主义创作原则出发，真实地反映了军阀战争所制造的骚乱和灾祸，揭露了战争制造者的罪行。创作上，作家刻苦追求艺术上的“真切见到”；善于通过精细而冷峻的细节描写传达小说的主旨。作品意蕴丰富，讽刺意味明显。"},{"id":"41","stars":"★★★","title":"请简析叶圣陶《倪焕之》","body":"叶圣陶教育题材长篇小说《倪焕之》是叶圣陶以反映新式知识分子的奋斗生活为主要内容的作品中最具代表性的一部。该作是叶圣陶唯一的一部长篇小说，也是中国现代文学史早期长篇小说创作中较为成熟的一部。\n\n一、《倪焕之》的思想内容\n\n小说把主人公倪焕之安放在急剧动荡的时代变迁中，通过他革新教育、改造家庭和社会的努力最终归于失败的生活经历的描写，展现了自辛亥革命、五四运动、“五卅”运动至大革命期间中国进步知识分子追求理想的艰难过程。通过主人公倪焕之从个人奋斗到投身于群众运动这一人生道路上的探索过程，形象地批判了改良主义的“教育救国论”，着重展示了一个不断追求进步的小资产阶级知识分子的复杂心态。\n\n二、《倪焕之》的艺术特征\n\n（一）史诗般的结构\n\n《倪焕之》具有史诗般的结构，小说时间跨度长，纵贯十几年的社会历史，涉及了辛亥革命、五四运动、五卅运动等重大历史事件，绵密、扎实地写出了小资产阶级知识分子从教育救国转向社会革命的思想过程，横连诸多重大政治事件，气势宏伟，张弛有度。后半部虽嫌粗疏，实属美玉微瑕。\n\n（二）心理描写真实可信\n\n作者对人物复杂微妙心理的展示，细针密缕、真实可信。如写倪焕之在寻求实现抱负的出路时的急切和苦闷，遇到志同道合的蒋冰如时的欣喜和兴奋，教育改革失败后的懊丧和孤独，参加群众运动时的激昂和振奋，特别是对他临死前弥留之际的幻觉和呓语的描述，都是十分真切动人的。\n\n三、《倪焕之》的历史地位\n\n（一）标志着叶圣陶现实主义创作方法的成熟\n\n三十年代，叶圣陶的小说不仅在题材、主题方面有较大的突破，艺术追求也有新的发展。他勤于探索，不断创新，更在结构的多样化、讲求意韵和锤字炼句、刻意追求语言的纯净与精粹等方面显示出圆熟的技巧和深厚的功力。被誉为“扛鼎”之作的《倪焕之》，是叶圣陶唯一的长篇小说，也是我国现代文学史上最早出现的优秀长篇之一。它的问世，标志着作者现实主义创作方法的成熟。\n\n（二）刻画了知识分子群像，推动了中国现代小说发展\n\n从个人奋斗到投身革命，从不断追求、不断幻灭到最终觉悟，这是倪焕之的心路历程，具有时代性，也具有典型性。小说中出现的围绕着主人公的金佩璋、蒋冰如、王乐山、金树柏等知识分子群像，也较早地走入了中国现代小说的人物画廊。《倪焕之》对中国现代小说的发展，具有不可低估的意义。","keywords":"批判了改良主义 小资产阶级知识分子 史诗般的结构 复杂微妙心理 现实主义创作方法 知识分子群像","note":"德国学者顾彬在《德国的忧郁和中国的彷徨：叶圣陶的小说》一文中，认为“小说承担了描写现代英雄的困境的任务”。他在“现代性”的角度下，解读了倪焕之面对中国社会向现代性转换中所不能解脱的“彷徨”。这同样指出了《倪焕之》在描写“人心”上的独特价值，提示我们从新的角度深入发掘这部作品的价值，因而对于这部分内容我们要重点关注。"},{"id":"42","stars":"★★★","title":"试分析“五四”时期乡土小说的思想内容","body":"乡土小说的主体作家，是“五四”运动直接熏陶出来的鲁迅这一代之后的第二代新文学作家，他们大部分出生于世纪之交，生活在边远地区，有乡土童年的生活背景，他们受“五四”的感召离开故土进入都市，一方面接受了现代文明的影响，另一方面也与乡土保持着观照距离，再回过头来以现代意识反观乡土，就有了终老乡土不曾有的感受和发现。\n\n一、对反人性的习俗的批判\n\n乡土小说家首先发现的是故乡原始习俗的落后愚昧以及反人性的野蛮残酷。对反人性的习俗的批判构成了乡土小说的重要主题。他们以文学之笔形象生动地描绘出一幅幅乡村生活的真实图景，如水葬、冥婚、典妻、鬼节、械斗等等，在那些偏远的乡村存在的这些野蛮、冷酷而又呆滞的民风民俗中所体现出的不仅是农村的衰败，更多的还是封建传统文化对中国农民精神上的侵蚀。受鲁迅“改造国民性”思想的影响，“五四”乡土小说作家们致力于广大乡村群落集体的国民性的探讨，从长期以来的精神蒙昧的角度寻求农民思想落后、人性麻木的根源。这成为“五四”乡土小说文化批判的最基本的主题。\n\n二、对国民劣根性的批判\n\n乡土写实小说继承了鲁迅乡土小说的启蒙主义传统，揭示闭塞的乡村世界里农民的愚昧与麻木、世故与巧滑、冷漠与势利，以及由此带来的种种人生悲剧。承载着中国传统文化，最能体现中国国民性的主要的群体莫过于占人口绝大多数的农民，而农民及他们的生活又是“五四”乡土作家们所最为熟悉的，当他们回望自己曾经生活过，而今自己的父母亲人们正在生活的乡村社会时，那些时时体现着中国国民的国民性的父老乡亲们就成为了他们作品中的人物，“五四”乡土小说作家们在这些熟悉的人物身上发掘着国民的劣根性，并把它们揭示给世人看，以期能引起注意并最终改变这些劣根性。\n\n三、对乡土传统美的追怀\n\n乡土小说家在发掘乡土世界种种龌龊与罪恶的同时，也往往难以掩饰内心对故乡的怀恋与思念，这使某些作品带上了苦涩的乡愁。作家们在都市中接受了现代文明的同时，因感受到中国社会生活的半殖民地化、商品化和城市化带来的道德问题，意识到中国人为了工业化和现代化必须付出心理和道德代价，于是便有了普遍的道德困惑。在困惑中再回头反观农村，又发现了乡土生活中固有的特殊的美。对乡土之美的重新发现也体现出小说家对传统道德和农业文明中正日渐消逝的田园牧歌诗情的向往。","keywords":"反人性习俗 国民劣根性 乡土追怀 传统美失落","note":"所谓“乡土文学”，往往让人联想到某种奇趣盎然、野气扑人的田园诗意，月下小景、水乡夜色或空灵雨景常常成为乡土文学恬静怡人的意境，黄泥的墙、乌黑的瓦、老人、女孩和黄狗更是时常作为一种乡土文学的典型背景，昭示着乡土文学所可能具备的某种超然的美学特征。不过，乡土文学中也亦时常出现粗犷的民俗，剽悍的民风，甚至是野蛮的陋俗、愚昧的乡规和残酷的阶级压迫，所以，如果认为乡土文学只是叙述心灵的净土或只描写诗意的田园风光，显然不够全面，大家对上述一二点也要做到全面把握。"},{"id":"43","stars":"★★","title":"王鲁彦对乡土小说发展做出的贡献","body":"王鲁彦是新文学第一个十年重要的乡土小说作家，小说创作以短篇居多，代表性的有短篇小说集《柚子》《黄金》和长篇小说《野火》（又名《愤怒的乡村》）等。王鲁彦深受鲁迅影响，并继承了鲁迅小说的批判国民性的特点，以一种质朴和真切的面貌反映浙东农村的民俗环境和乡土生活方式，为当时的乡土小说创作提供了不可多得的文本样式。\n\n一、提供了小说典型环境描写的新的范式，也使早期乡土小说获得了民俗学的价值\n\n王鲁彦早期的小说并非是纯写实的。他以《柚子》为代表的作品，于暴露社会黑暗之中充满了呼之欲出的荒诞感和沉重的幽默情绪。后来，王鲁彦开始用家乡宁波镇海一带的农民生活，讲述他的注重地方风物、经济生活，对浙东民俗环境和乡土生活方式进行真实观照的故事。以往的烧毁一切的热情，让位给现实的感伤的语调，细密的场面和人物描写，显示了古老中国农业社会落后于时代的蹒跚步伐，而这种奇特的封建陋习叙述得越是具体可见，就越发使人对这落后性深感震惊。\n\n《菊英的出嫁》则侧重描写浙东农村的“冥婚”陋俗，作者以略带诙谐嘲讽的笔调，叙写菊英的母亲为这场毫无价值的婚礼所耗费的精神、体力和金钱，描写人物对这种毫无意义之事所倾注的饱满热情。细密的场面和人物描写反衬出人物精神的空虚与麻木，使读者为当时的中国社会和广大农村的封建落后深感震惊。\n\n王鲁彦此类作品提供了小说典型环境描写的新的范式，也使早期乡土小说获得了民俗学的价值。\n\n二、始终坚持对乡民的批判态度，审美上偏重于对恶的、丑陋的事物的深入体验，使乡土小说免于流入肤浅\n\n王鲁彦创作出了许多讽刺作品，讽刺没落乡绅的有《自立》《阿卓呆子》，讽刺农村痞子的有《阿长贼骨头》，讽刺官僚的有《宴会》。《宴会》里的邹金山，是他刻写复杂人物性格的可贵尝试。此后到30年代，王鲁彦出版有《黄金》《童年的悲哀》《屋顶下》等集子，仍存浓浓的乡情，却是顺着《许是不至于罢》的路子，开掘浙东沿海乡镇子民们在农业经济衰败的社会动荡中的心理，王鲁彦始终坚持对乡民的批判态度，审美上偏重于对恶的、丑陋的事物的深入体验，使乡土小说免于流入肤浅。\n\n三、表现农村小有产者的命运和乡村社会的世态人情\n\n王鲁彦的《黄金》讲述了浙东小镇的世态炎凉。主人公如史伯伯家境殷实，儿子在外工作并每月按时寄钱回家，因此，如史伯伯在陈四桥一带素有威望，邻里关系融洽。而陈四桥表面上也是个民风淳朴的田园世界。可是如史伯伯儿子的汇款一直没有奇来，于是，如史伯伯一家的处境马上发生了戏剧性改变，关于他破产的各种流言迅速蔓延，他和家人也遭到别人的羞辱、歧视、冷落。作者写出了浙东小镇丑陋的世态和人们势利的心态。","keywords":"典型环境描写范式 民俗学价值 批判态度 免于流入肤浅","note":"王鲁彦对乡土小说的贡献，实质上是王鲁彦的个人创作特色对乡土小说这一类型的影响。所以，这部分内容也可** --- 以用于回答王鲁彦的乡土小说艺术特征。大家要根据所学知识，灵活应对题目。"},{"id":"44","stars":"★★","title":"彭家煌乡土小说的艺术特征","body":"彭家煌创作时间不长，却留下不少表现湖南闭塞农村士绅与乡民之间所发生的各种活剧的作品，这些作品体现了他如下艺术特征：\n\n一、彭家煌的小说叙述是冷静、机智的，具有农民式的风趣，有强烈的地方性\n\n彭家煌的《怂恿》比较圆熟，写土豪恶霸讼师相互倾轧，拨弄挑唆老实的农民夫妇出面受侮，而他们自己也大出洋相。这是一种讽刺性的小说，喜剧人物的线条准确，动作紧张，场面调度有方，运用活泼的方言土语，以加强地方色彩，同时加强对话的可笑性。茅盾称这篇《怂恿》为“那时期最好的农民小说之一”。\n\n同样喜剧味道十足的，还有《活鬼》，对财主家庭内部为了人丁兴旺而纵容媳妇偷汉、给小孩子提早娶媳，以致家中不断“闹鬼”的现象，大加嘲弄。\n\n二、彭家煌擅长将悲剧性的故事渗入喜剧色彩。\n\n彭家煌的小说将本是悲剧性的故事渗入喜剧色彩，尤为杰出，如《隔壁人家》《我们的犯罪》等，或者是表现贫困者的窘境，或者是让无辜被捕者来从容地叙述自己如何成为“罪人”，产生暴露的意味，使悲愤的情绪转化为旁敲侧击式的反讽。鼓家煌将乡村讽刺体小说这样早地提到较高的水平，为沙汀等积累了很有价值的艺术经验。\n\n他还有一类小说是写知识分子和小市民的，如《莫校长》和中篇《皮克的情书》，中间也包含了嘲讽的成分。\n\n三、讲究中国画般的结构技巧\n\n彭家煌小说的结构技巧，是从中国画中得到启发的，中国画要求传神达意，讲究意境美，最重要的经验就是寻找“黄金分割点”，中国画里常常把要描画的主要对象放在画面的这个点上。这样能使画面伸缩回旋有致，显得舒放自如，切忌把描画对象置于画面正中央，否则易使画面形成迫塞之感。彭家煌小说在构图上亦表现出这种特色，大都遵循了黄金分割定律，截取生活中平凡的一角来反映深邃的思想，又把这种欲表达的内容置于画面的一点，几笔涂抹，显得从容自如，左右逢源，使得“画面”伸缩有致，绝无迫塞。\n\n总之，彭家煌的乡土小说比20年代一般乡土作家的更为活泼风趣，也更加深刻成熟。","keywords":"冷静、机智 强烈的地方性 悲剧故事渗入喜剧色彩","note":"彭家煌的乡土小说在艺术上极具特色。他常以平凡日常生活为题材表现深刻的社会内容，通过俗语俚语的运用和生动的人物刻画，淋漓展现异地风情和人道主义情怀，从而显示出上述三点特征。除此之外，大家也要注意和其他乡土作家相比彭家煌小说的独特性。"},{"id":"45","stars":"★★","title":"台静农乡土小说创作的艺术特征","body":"一、民间性特别强\n\n台静农的作品，民间性特别强，十之八九以他的安徽故乡的人事为材料，着重于描写宗法制度对乡村底层的精神统治，生生死死尤为突出。《烛焰》写出了农村“冲喜”恶俗，《蝗蚓们》《负伤者》表现农村“卖妻”“典妻”的现象，这些都是乡俗中异常惨烈的事件，经由作者沉郁的笔致，加以渲染，最终栩栩如生地呈现到读者面前。因此，鲁迅曾评价他“能将乡间的死生，泥土的气息，移在纸上”。\n\n二、擅长写的多是悲剧型的乡镇传奇\n\n《天二哥》里面的酒徒之死，写出了他天神般的身坯之中却只有麻木不仁的意志；《新坟》中遭兵祸家破人亡的四太太发疯，终于在儿子的棺材边自焚身死；《拜堂》的汪二，半夜子时像见不得人似的与寡嫂结亲：这些一律是阴沉沉的故事，都是乡镇间的一场场悲剧。而在这些作品中，又有一种莫名的传奇色彩，发人深思。\n\n三、十分注重剪裁和布局方法\n\n台静农的短篇小说是十分注重剪裁和布局方法的。他以精炼的笔法，构成了紧凑简练的小说结构。没有铺叙兜转，直接将悲剧的高潮推向读者，避免了因文章的冗长而产生的断续感。一气呵成，将感情喷涌而出，达到了震撼心灵的强大效果。\n\n四、给人一种“浑厚”之感\n\n正如王鲁彦学习了鲁迅对国民性的批判，彭家煌有鲁迅的含泪微笑，而出身未名社、与鲁迅关系密切的台静农，似乎专注地师承了鲁迅所推崇的“安特莱夫式的阴冷”，像鲁迅的《药》一样，着力于渲染阴冷的气氛和鬼神迷信色彩，把中国乡间的恐怖和盘托出，呈现在读者面前，渗入读者的内心。这样，就带来台静农的浑厚。\n\n台静农在继承鲁迅小说的现实主义传统的基础上，又创造性地融入了个人的体验与思考，形成了独特的个性与风格，他对病态的乡村社会的真实描绘，在读者面前展示出乡村民众的生活状态与内心世界，暴露了封建文化与封建制度对乡村这一闭塞落后环境的毒害。难怪一位香港文学家称赞道：“二十年代，中国小说家能够将旧社会的病态这样深刻地描绘出来，鲁迅之外，台静农是最成功的一位。”","keywords":"民间性 悲剧型乡镇传奇 注重剪裁和布局方法“浑厚”之感","note":"分析台静农乡土小说的特点，首先要关注作家内心的乡土情结，台静农的小说为我们提供了一个乡土世界，有些篇章直接取材于皖西地区广泛流行的乡风、乡情、民俗。乡土展现了人间的酸辛和凄楚，民俗是乡土社会的一个层面，具有文化批判意义。此外，还要关注作家的审美风格及其渊源。台静农是在鲁迅的直接关怀帮助下成长起来的乡土作家。他坚持艺术内容的真实性，描写的客观性，环境的典型性，创作风格总体是现实主义的。在审美风格上，他的作品带有浓郁的乡土文化气息，体现出强烈的悲剧色彩。可以通过联想鲁迅《药》这样的作品的特点，加深记忆。"},{"id":"46","stars":"★★★","title":"试分析乡土小说在现代小说史上的地位","body":"乡土作家都是崭露头角的年轻人，他们把握农村复杂社会关系和阶级关系的眼光，还未能像鲁迅那样的深邃，往往单纯地描绘落后愚昧的农村生活图景，总体的艺术质量尚属稚拙阶段。但作为一个潮流，一个流派，乡土小说对于现代小说的确立是有不小贡献的。纵观整个乡土小说，其意义集中反映在如下几点：\n\n一、拓宽了新文学的题材，为文坛带入泥土的气息\n\n乡土小说从20年代中期便形成一股持久的创作潮流，乡土小说作者是一批真正扎根乡土生活，真切地了解乡土农人的辛酸和痛苦的小说家，他们的创作更真实深入，真正记录了乡土生活细节以及农人的情感、思维方式。在“五四”的感伤主义的时代氛围中，他们的创作为文坛带入了一股泥土的气息，突破了“五四”新文学诞生以来主要写知识青年的相对狭小天地，拓宽了新文学的反封建题材，影响和吸引了一大批新作家将关注的目光更多地转向社会，转到民众（主要是农民）的身上，而使得新文学和社会生活土壤的联结更加紧密。台静农与其他乡土小说家笔下的农村生活，由此开辟了一个更新鲜刚健和广阔的视域，泥土气息从此一直蔓延着整个现代文坛。\n\n二、具有鲜明的地域性特征，为中国现代地域小说的成熟打下基础\n\n乡土小说家们普遍注重对地方风物民俗的描写，作品中体现了鲜明的地域性特征，着意突出风土人情的地方色彩，试图在小说中统一“国民性、地方性和个性”，为后来以沈从文为代表的中国现代地域小说的成熟打下坚实的基础。\n\n三、促进了小说思想与艺术的革新，推动了现实主义文学发展\n\n乡土小说对20世纪中国现实主义文学的发展，作用巨大。乡土小说注重对人物性格和社会环境的描写，开始向“典型环境下的典型性格”靠拢，标志着客观写实风格的出现。乡土小说反映了“五四”从启蒙主义的个性解放发展为社会解放的思潮，打破了“五四”的“自我”的形象，从浪漫主义的天空回到了坚实的大地，回到了社会现实。大部分乡土作家从关心个人的感伤情绪、个人的回忆，到关注社会和民众，从浪漫理想转向对现实的探索。在风格上，也由主观抒情走向客观叙事，从情绪走向性格，并纠正旧小说遗留的简括式叙述方式，加强实地描写，加强场面、人物的细节描写，小说的重心由情绪、情节的展示转向以人物为中心的刻画。许多乡土作家从早期的主观抒情，越到后来就越归向客观写实，甚至讽刺，让现实主义在新文学中的主流地位得以加强和巩固。","keywords":"拓宽了题材 泥土气息 地域性特征 地域小说成熟 思想艺术革新 现实主义文学","note":"正因为乡土文学表现了乡土民俗风情，表现了作家对故乡、对人民的深厚感情，所以受到广大人民的喜爱，成为雅俗共赏的文学读物，具有悠长的艺术生命力。我们看到，浮光掠影地反映生活，空洞抽象地图解生活或凭空想象粉饰生活的不少作品，早已被历史淘汰，而真实地反映民俗风情的乡土文学作品却常看常新，具有无穷的艺术魅力，推动了现实主义文学的发展。"},{"id":"47","stars":"★★★★","title":"郁达夫“自叙传”小说的特点","body":"郁达夫的小说虽然有着各种不同的趋向，前后期也有一些变化，但却有着鲜明的特征。这主要表现在以下方面：\n\n一、自叙传性质\n\n从“文学作品，都是作家的自叙传”的观念出发，郁达夫散文小说作品大都具有自我表现和自我暴露的性质，有着强烈的主观抒情色彩。郁达夫的作品总是用第一人称写“我”，即叙述者自己，或者虽然采用第三人称，写的仍是自己的化身。他的大部分小说都直接取材于他本人的经历、遭遇、心情。把郁达夫的小说连起来读，基本上同他的生活轨迹相合。小说以自我的个人经验、情感生活为单纯的线索，宣泄着一己的情怀。他的小说中，既有卢梭式的自白，也有维特式的自怜，自惭、自卑与自尊、自傲相纠结，结构成了时代的零余者的情感史，在当时中国文坛上展现出独特的风采。\n\n二、独特的感伤情调\n\n郁达夫小说情调偏于低沉，泛滥着颓伤的情感和失意心情的诉述。他通常不去经营情节的曲折紧张，而是注重抒发主人公抑郁寡欢、孤独凄清的情怀，坦诚率真地暴露和宣泄人物感伤的甚至厌世颓废的心境，以其自我的真情抒写而感染读者。作者竭力抒发他主人公的苦闷情怀，及由此而生的颓废和变态的心理言行，从中揭示出一种“时代病”。他一方面紧紧扣住了青年知识者本身的生理的、心理的病态，一方面指出青年病态的制造者是黑暗的病态社会。\n\n三、对性心理的直率大胆的描写\n\n郁达夫注意人的情欲在表达人的内在世界的重要性，试图用一种新的眼光，去剖析人的生命和性格中包孕的情欲问题。郁达夫接受了西方浪漫主义小说和日本私小说的影响，开始创作时又正值青年时期，适应“五四”后青年个性解放的要求，就大胆地以自身为对象，在作品中通过直接写“性”包括“性病态”和“同性恋”的生活，来阐释爱恋生死的主题。这也是对虚伪的传统道德以及国人矫饰习气的一种挑战。\n\n四、小说结构散文化\n\n郁达夫写小说常常自由挥洒，少考虑小说的结构和章法，也极少采用复杂的叙事形式。人物的心理变化就是情节的发展过程，人物被压抑后的哀鸣就是情节发展的高潮，这就将散文化提到了最高的程度，使其很多小说与散文几乎没有了明显的界限。其中最常用的手法是直抒胸臆，即在表现自我主人公所经历的日常生活情景时，以充满激烈情绪的笔调去描写，于事件的叙述中做坦率的自我解剖，甚至是用长篇独白的形式去直接拨动读者的心弦。\n\n五、文笔优美，具有诗意特征\n\n郁达夫有着很好的中国古典诗词的修养，因而他的小说文笔优美，流丽、清新，浸透着浓郁的感情色彩，富有节奏，一如春水行云，流动感强，笔触所到，都显出清、细、真的特色，富有诗意特征。","keywords":"自叙传性质 感伤情调 性心理 结构散文化 文笔优美 诗意特征","note":"郁达夫的小说创作因为对传统道德观念提出了挑战，并且首创了自传体小说这种抒情浪漫的形式，对当时一批青年作家产生了深刻的影响，形成了二三十年代中国文坛一股浪漫派的壮观潮流。这部分内容中，郁达夫小说的感伤美和病态美这一侧面可能会单独考查，但重要性较低，相关内容可以在李凡文学正版群中查阅。除了论述题以外，郁达夫的“自叙传”小说在名词解释中出现的频率也比较高。"},{"id":"48","stars":"★★★★","title":"谈谈你对郁达夫笔下“零余者”形象的认识（26上海外国语大学）","body":"郁达夫用抒情的方式塑造出了真实感人的抒情主人公形象。这些抒情主人公大都是所谓的“零余者”，即“五四”时期一部分歧路彷徨的知识青年，他们是遭社会挤压而无力把握自己命运的小人物，是被压迫被损害的弱者。\n\n一、“零余者”形象的渊源：“多余人”形象\n\n十九世纪俄国文学史上有一种很突出的知识分子典型-多余人。他们生活在贵族阶级趋向没落的时期，在反动的沙皇专制政体和农奴制下感到窒息，不愿与上流社会同流合污，但又无法摆脱贵族立场，缺乏生活目的，因而自暴自弃，在游戏人生中浪抛生命，成为社会的“多余人”。尽管十九世纪的俄国“多余人”与“五四”时代中国的小资产阶级知识分子在历史观念和阶级本质上都不同，但却有许多相似之处。所以郁达夫会从俄国“多余人”身上找到自己和一代青年的影子，塑造中国“零余者”的形象。\n\n二、“零余者”形象的特征\n\n（一）大多是下层知识分子，是排挤出社会的小人物\n\n郁达夫小说所塑造的“零余者”，大都是下层的小资产阶级知识分子，他们是被挤出社会的小人物。郁达夫在小说中揭示了他们政治上经济上所处的低下的地位，显示了他们与社会的尖锐对立。这些人有才能，但在腐败的社会里找不到实现他\n\n们理想的地方。如《茑萝行》中的主人公从外国留学回国，找不到工作，就在黄浦江边流浪，或上公园坐冷板凳，甚至几次到江边想自杀。\n\n（二）具有反抗的性格和桀骜不驯的叛逆姿态\n\n郁达夫在反映小资产阶级知识分子被压迫的社会地位时，还写出了他们反抗的性格，表现了作为时代“零余者”叛逆的一面。许多“零余者”在自暴自弃、自哀自惭的外表之内，蕴含着一颗正直坦诚的心。如《杨梅烧酒》中失业的留学生，认清了社会的丑恶后，就痛骂世道浇离。除了直接抗议，郁达夫的小说中的“零余者”还常用变态的行为来表示反抗。如《离散之前》中于质夫要把自己写的许多文章“付之一炬”，“免得他年后被不学无术的暴君来蹂躏”。\n\n可以说，这种反抗性，贯穿于郁达夫几乎每一时期的多数小说中，他笔下的“零余者”总是宁肯穷困自戕，也不愿意和黑暗势力同流合污，他们同现实社会势不两立，表现出桀骜不驯的姿态。\n\n（三）并不甘心沉沦，希望找到出路\n\n郁达夫所写的“零余者”并不甘心沉论，希望能找到新路。如在《十一月初三》中，郁达夫就把“零余者”想反抗而不知道出路的精神状态，比作是“中间的那一个莲花瓣没有的半把剪刀”，宣称若是能知道其它半把在何处，“那么我就是赴汤蹈火，也愿意去寻着它们来，和他们结合在一起。”\n\n（四）表现出“名士派”的姿态和意识\n\n郁达夫笔下的“零余者”，又往往表现出一种“名士派”的姿态和意识。这在早期的小说中就有所表现。如《沉沦》《茫茫夜》等篇中主人公放浪形骸，就是采取了古代文人反抗统治者的传统方式。一九二二年底写的《采石矶》，更是突出了所谓“名士”的风度。\n\n三、“零余者”形象的内涵\n\n（一）表现了“五四”知识分子的精神世界\n\n郁达夫的“零余者”形象，实际上是对自己精神困境的一种自述，并经过拷问自己来探索“五四”知识分子的精神世界。这一形象极其真实地记录了从“五四”到三十年代初，一部分没有找到出路的小资产阶级知识分子所走过的曲折的道路，“他”可以使我们清楚地观察认识到小资产阶级知识分子没有找到出路时，痛苦生活和精神风貌的一个侧面。郁达夫揭示了他们的处境，暴露了他们的弱点，可以使他们从小说中看到自己的脸色和环境，启发他们去反抗现实，寻找出路。\n\n（二）反映出时代气息\n\n郁达夫小说中的“零余者”形象是富有时代精神的。郁达夫小说中的“零余者”，是一个在中国这块半殖民地半封建社会的土壤中产生出来的，开始苏醒，而又软弱的几乎无力反抗的个人主义者。在“他”身上，我们可以捕捉到旧社会的残渣污迹，也可以嗅到大动荡大变革时期的时代气息。\n\n【李凡关键词：“多余人”形象 下层知识分子 反抗性格 叛逆姿态 不甘心沉沦“名士派”的姿态和意识 知识分子精神世界时代精神】","keywords":"","note":"综观“五四”以来新文学的创作，郁达夫的小说极其真实地记录了从“五四”到三十年代初“新旧蜕变时代一部分小资产阶级知识分子精神剧变的历程”。他所塑造的“零余者”这一特定历史条件下的小资产阶级形象，丰富了中国现代文学的人物画廊。郁达夫揭示了他们的处境，启发他们去反抗现实，寻找出路。这不仅给新文学提供了认识价值和审美价值，也使新文学向现代转变达到了一个新的层次。相关论文可以参考温儒敏《论郁达夫的小说创作》，具体资料可以在李凡文学正版群中领取。“零余者”和与之类似的“多余人”这两个形象都是名词解释中要重点关注的内容。"},{"id":"49","stars":"★★","title":"庐隐小说的艺术特点","body":"庐隐以自己和周围朋友的生活为素材，写出了“五四”一代知识青年共同面临的不幸，真实而深刻地表现了他们复杂的精神世界，显示了她们共同的精神特质，在当时广大青年读者中产生了强烈共鸣。庐隐的小说，主要具备如下特征：\n\n一、用哀伤的笔调叙写“五四”一代青年复杂的感情世界，尤其表现一代青年女性追求民主解放和爱情幸福最后却只能尝到苦果的实际情景\n\n庐隐本人便是新的职业女性，童年备感人间冷漠，养成孤傲的叛逆性格，进入青年后，又有惨痛的个人婚姻史与曲折的心灵历程，所以，用自己或近于自己的女性命运、心态、历史，作为创作的依据，始终成为她关切的中心。\n\n庐隐笔下的女性大多有个性解放、人生自由的时代要求，却又无法摆脱封建礼教和传统道德观念的束缚，内心充满感伤，往往愤世嫉俗、追求个性解放进而发展到消极厌世甚至自杀。从她们身上，我们可以看到当时“五四”青年的影子。比如从\n\n露莎等五位女大学生的身上，可以看到新旧交替时期毅然走出傀儡之家的“娜拉”们的面影，看到那个时代的青年们的强烈的精神饥渴。\n\n二、具备主观浪漫的“庐隐风格”\n\n庐隐个人身世的不幸，爱情婚姻的坎坷使她在面对“人生究竟是什么”的问题时，习惯用哀怨的声音表达当时青年的苦闷、焦灼、彷徨，反复吟唱人生的苦闷和爱情的幻灭，展示了一幅幅充满苦恼的人生图景。《海滨故人》标示庐隐转向郁达夫式的自叙传体的写作，加上女性作家纤微细腻的心理笔致，个人气质上的感伤色调，便很快形成了主观浪漫的“庐隐风格”。\n\n三、作品依托于“五四”这个特殊时代，时代性较强\n\n庐隐的抒情性叙述不事雕饰，激切直露，同时也嫌单调，少含蓄。在庐隐创作的小说中，叹句的大量运用增强了叙事的情感容量，相对削弱了小说语言的雕塑功能。她喜穿插日记、书信，重视哀切动人的环境气氛烘托，甚于对人物性格的刻镂，结构上往往失于散漫拖沓。她的作品离开了产生的历史环境，就失去了一部分光彩。庐隐比任何人都更具有“五四”性质，她的小说是纯“五四”式的。","keywords":"青年女性“庐隐风格”“五四”性质","note":"庐隐是“五四”新文学拓荒时期的重要女作家。她用她的创作实绩昭示了女性在中国现代文学史上的突出地位。她与冰心、冯沅君、凌淑华、苏雪林等一同为中国现代小说的发展推波助澜，形成了现代文学史上女性文学的第一道亮丽风景。她的作品，多数是通过爱情生活的描绘，揭露封建伦理的荒诞和社会生活的弊端。作品中的女主人公多是负荷着几千年的封建重压，在“五四”怒潮中觉醒的知识女性。我们通过庐隐所创造的人物形象，可以感受到作者那激动不安、充满生气的心灵，可以呼吸到当时鲜明的时代气息。"},{"id":"50","stars":"★★★","title":"冯文炳（废名）早期小说的艺术特点","body":"沈从文和更晚的汪曾祺等人都一再地提到冯文炳20年代的作品对他们的作用。在现代抒情小说体式的发展史上，从郁达夫到沈从文，废名是中间一个不可缺少的环节。废名早期的小说创作，主要具备如下特征：\n\n一、笔调冲淡、质朴\n\n废名小说的故事多发生在乡村，他常常以自己的故乡-中国中部乡村为背景，讲述具有浓郁乡土气息的风俗民情，在徐缓的抒情旋律中展示乡民村姑、学童老妪的平凡故事。这里没有波澜壮阔的场面，没有惊心动魄的斗争，也没有你死我活的矛盾。小说的叙述者是一个超然的心平气和的观察者，当然，这并不是说作者没有自己的爱憎与忧虑，只不过是他把过滤了的喜怒哀乐轻轻溶入了景物风习和人物的命运之中。如《竹林的故事》《浣衣母》《桃园》等，用冲淡、质朴的笔调表现尚未被现代社会污染的宗法制农村世界，表现带有古民风采的人物的纯朴美德。\n\n废名小说的故事就是平淡，他总是在静观中展示农村的种种迷人与愚昧、古道与积弊，他引导你去思考，而不是去反抗，他的态度是含蓄的，而不是直露的，他的创作是体验的结果，而不是图解的产物。\n\n二、散文化小说形式\n\n冯文炳在叙述乡间儿女翁妪之事的时候，还会采用散文化的小说形式，从古典诗词中汲取营养，流露出一种寂静的美。&#x5982;《竹林的故事》的人物和清新的乡村自然景物构成对应的关系，河边竹林仿佛是有意设置的富于诗情的象征境界，为主人公三姑娘纯净美好的性格作衬托。这种描述人美、景美的牧歌般意境，正是作者借鉴古典诗词的简练、含蓄、留空白等经验，转化成情节简单的散文化小说形式所特具的功能。\n\n三、诗的境界\n\n废名的身上，有一种超然和达观的名士风度，并且有陶渊明式的隐逸倾向。他的小说刻意追求一种意境，赋予平凡的人、事、景以“意味”，构成诗的境界，更流露出一种禅宗式的宁静淡远和任机随缘的哲理内蕴。废名自己曾经说过，他“写小说同唐人写绝句一样”，既不讲故事，也不刻画人物，而是表现人的某种永恒的情致。\n\n【李凡关键词：笔调冲淡、质朴 散文化 诗的境界】","keywords":"","note":"废名小说颇有中国古代山水画和田园诗的风味。这是因为他当初是一位诗人，并深受中国古典诗词的浸润；同时他还是一个大乘佛教徒，对佛教禅学有一定研究。废名的小说思维与禅学、古典律诗绝句有密切关系，这才使其小说充满着幽静和平之美学风格。"},{"id":"51","stars":"★★★","title":"许地山小说的特点","body":"东南亚异域的神秘背景与人物故事，宗教研究家的信仰与对宗教内在感情的体验，造成了许地山的与郁达夫、与乡土回忆者皆存在区别的浪漫传奇小说。他的小说创作，主要具备如下特征：\n\n一、独特的东方文化哲学\n\n许地山的主导倾向是以出世的精神入世，以弱者的外表蕴涵强者的内核，这构成了他特有的东方文化哲学精神，显示了印度文化与中国文化的融合。他在总体上强调的是种普泛的东方文化精神，并在与西方文化的对比中，直觉捕捉和呈现东方文化的整体性特征。对东南亚各地的文化，他传达的是相同点而不是相异处，因此几乎无法辨别小说中人物的国籍，马来人、印度人与缅甸人在个性上很难区分。作为东方人的共通性覆盖了差异性，因此，必须从总体上把握许地山所塑造的以佛教为核心的东方精神特征。\n\n二、由浪漫主义转向写实\n\n许地山是文学研究会的一个另类作家，他不像王统照、叶绍钧等人一样，以写实主义为创作基调，而是“扛着浪漫传奇的艺术旗帜，行进在人生派的行列之中”。他的早期小说明显地倾向于浪漫主义，如《命命鸟》《缀网劳蛛》《商人妇》等作品，情节曲折，富于想象，注重用情感人，而对情的含蓄之美异常倾心，叙述中常以新颖的象征和隐喻来表达，在当时也曾获得许多读者的喜爱。但随着时代的发展和社会形势的变化，许地山最终回归到写实主义的道路上来。所以，从传奇到写实，是许地山文学创作经历的两个阶段，前者独树一帜，后者进入文坛主流，丰富和壮大了写实主义文学的阵容。\n\n三、鲜明的宗教色彩\n\n许地山的小说中有着鲜明的宗教色彩。他对基督教、佛教都有深入研究和领悟，但很难说他皈依了哪一种宗教，他不是严格的宗教信徒，而是一个宗教学者。“五四”时期他也关注“人间问题”，不过他是在佛教和基督教哲学中寻找人生解答，带有浓厚的宗教哲学的思辨色彩。如短篇《春桃》中，当春桃面对两个男人，要在是否收留残废的丈夫、敢不敢采取一女二男的生活方式上抉择时，民间的仁义和宗教的慈爱混合在一起，在一个拾破烂的女子身上表现出来。在后期作品中，主人公自身的宗教属性有所减弱，但他们的一举一动都合乎教义，“宗教由外在的宣扬变为内在的感情体验，并通过行动自发地表现出来”。可以说，宗教传奇色彩始终不离许地山的小说，他的创作生命来自“五四”时期，并构成中国主观型小说的一支奇葩。","keywords":"东方文化哲学 浪漫转向写实 宗教色彩","note":"关于许地山创作中的宗教色彩，是可以找到出处的。首先许地山的父母都是虔诚的佛教徒，妻子也是信佛之人。而且他曾“居广州和梅宿舍（辟六格寺内官房数间名为和梅宿舍，为兄弟学塾）...”，后又赴佛教圣地缅甸仰光任教，耳濡目染。同时还有时代因素，从民国初年到五四运动之后的数年内，是二十世纪中国最为苦难的一段时期。理想和现实的矛盾冲突，灵与肉的强烈碰撞，把富有时代感和民族精神的中国知识分子牢牢地钉在精神痛苦的十字架上。这些因素都会促使许地山较容易地投入宗教的怀抱。“五四”时期，很多知识分子之所以对佛教倍受青睐，也是由于知识分子的文化心理和佛教义理在认知上的同构。"},{"id":"52","stars":"★★★","title":"如何理解“五四”小说的总体特点","body":"一、各种小说开放性发展\n\n客观现实和主观抒情，是“五四”小说两大流脉，在多元的发展中又相互渗透。这之中，在外国属于前后三个阶段的浪漫主义、写实主义、现代主义等创作方法，几乎“共时”地被吸收进来。这种吸收，就更显示出了“五四”小说的多样性。比如抒情体小说的作者们，就不仅吸收国外浪漫派文学，也从抒发感情的角度来吸收现代派文学。郭沫若的《残春》，就是中国最早的“意识流”小说之一。创造社、浅草一沉钟社的青年作家不避西方的象征主义、印象主义、唯美主义，并同中国传统的诗化情绪两相结合。\n\n二、短篇小说现代文体的形成\n\n从小说的体制看，这一时期长篇尚十分幼嫩，但短篇由外国移植而扎根于中国土壤却取得较大成功。可以说，短篇小说现代文体的形成是中国小说现代化的标志。这主要表现为以下几个方面：\n\n（一）脱离了传统的史传文学的束缚，不再一味采用“纵剖”的由头到尾的叙述结构，而是引进并逐渐普及了“横截面”的结构方式。\n\n（二）重视人物和环境的关联，以人物为中心，表现社会中的人，摆脱人物简单化、类型化的弊病。\n\n（三）认识到小说作者与小说叙述人的区别，消除叙述“说书”的痕迹，既发展了一种叙述人隐藏较深的客观叙事，也不忽视叙述人介入的多样的主观叙事，而作为新型技巧的限制性叙事，在突破固有的全知叙事方面，显示了现代的姿态。当然，“说书”式的小说叙述并非不能进入现代序列而深化，到三四十年代老舍、赵树理的出现，便在较高层次上回答了这个问题。\n\n三、心理描写在小说中作为新的技巧开始广泛流行\n\n女性作家凌叔华的《酒后》《绣枕》，就是当时心理小说的名篇。与“五四”时期青年个性解放的要求一致，张资平专写性爱小说，写实性中包含浪漫抒情与肉欲描写的因素。以及这个时期以郁达夫为代表的“自叙传”抒情小说中大量的心理描写，都可以体现出心理描写作为新的技巧的流行。","keywords":"开放性发展 现代文体形成 心理描写流行","note":"在考查第一个十年小说作品的时候，除了考查作家作品，还可能对第一个十年小说的整体特点进行宏观考查，大家要有所了解。可以结合前面的问题小说、乡土小说等人生写实小说和叶绍钧、许地山等作家创作的浪漫抒情小说尽情分析概括，总结出第一个十年小说创作的特征与趋势。"},{"id":"53","stars":"★","title":"谈谈你对通俗文学和市民通俗小说的认识","body":"一、通俗文学的定义\n\n通俗文学的概念一向比较模糊，是因它的文学地位的不确定性。长时期以来人们强调它属于“旧文学”或“封建文学残余”的一面，而来不及认识它由旧文学向现代性的新文学缓慢过渡的一面。只是中国新旧文学的决裂十分“戏剧化”，事后的复杂融合过程往往遭到历史的各种掩盖，所以反而看不清楚了。实际上它已经融入了新文学之中，成为新文学内部的一部分，近年来，学术界大致将其厘定为：\n\n中国近现代通俗文学是指以清末民初大都市工商经济发展为基础得以滋长繁荣的，在内容上以传统心理机制为核心的，在形式上继承中国古代小说传统模式的文人创作或经文人加工再创造的作品；在功能上侧重于趣味性、娱乐性、知识性和可读性，但也顾及“寓教于乐”的惩恶劝善效应；基于符合民族欣赏习惯的优势，形成了以广大市民阶层为主的读者群，是一种被他们视为精神消费品的，也必然会反映他们的社会价值观的商品性文学。\n\n二、通俗文学的特征\n\n通俗文学虽然以经济市场为基础，但它的观念仍是传统的，体现出了一种传统与现代杂糅的特点。\n\n考察“五四”前后的通俗文学，可以发现它是如何站到了传统与现代的交界线上的。尽管它背靠着大都会的经济市场、印刷出版业，带头将文学变为商品，进行文学复制式的批量生产，但在道德和文学的观念上，在文学形式的承传上，通俗文学因其永远存在的滞后性，使它只能逐渐从旧传统的轨道脱出。\n\n三、市民通俗小说：通俗文学的主体\n\n市民通俗小说是通俗文学的主体，小说是“小道”，是“闲书”，到了近代开始向文学的中心地位移动。所以在晚清小说的基础上，利用了民国之后“五四”前的一段“真空”时间，旧派通俗小说曾经一度独占文坛。到“五四”新文化运动兴起，它成了新文学的对立物受到批判，同时也就给自己带来重新调整的时机。","keywords":"以工商业发展为基础 继承古代传统 侧重娱乐性","note":"市民通俗小说是很少会考查到的内容，但也不排除会出现冷门题目，大家对此应该有所了解。"},{"id":"54","stars":"★★★★","title":"试分析《女神》在现代诗歌史上的地位","body":"《女神》是中国现代诗歌史上最重要的诗集之一。它受到“五四”狂飙突进的时代精神的感召，同时又真正反映了狂飙突进的“五四”时代。这使《女神》成为一个新的波澜壮阔的大时代的史诗般的作品，也成为创生期的中国现代诗歌的奠基之作。《女神》的诗歌史地位，主要表现在以下方面：\n\n一、提供了一种新的抒情机制，推动了对新诗认知的深化\n\n20世纪20年代，《女神》产生了广泛的社会影响和重要的诗学效应，一个主要的缘由在于《女神》为发生期的新诗提供了一种新的抒情机制。“抒情”是郭沫若诗歌观念的核心，而“自然流露”的浪漫诗学则构成其观念上的支撑，这标示着一种新的诗学认知：“抒情”是诗的本质所在。这种浪漫的诗学认知迎合了20世纪20年代发生期的新诗对某种普遍的“诗\n\n本质”的知识诉求，并由此带来对新诗的另一种体认：“今人用我们的言辞表示我们的生趣，便是新诗”。这是对新诗认知的一种深化，更重要的是，在这种诗学认知中，《女神》的创作以新的抒情表达机制确立了抒情的本体地位，使新诗的表达从形式层面突入至诗的情感内核。\n\n二、完成了一种新的时代精神的想象性塑造\n\n《女神》充满了对社会黑暗的深恶痛绝，势不两立，还充溢着一种热情的创造精神和更新意识，同时还歌颂各个领域旧传统的叛逆者。舞动的精神、反抗的精神和创造的精神构成了《女神》的主旋律。这一方面是由诗人个性所致，另一方面又是“五四”时代的要求。《女神》中的诗歌，都是感受着时代气息而创作的。个人、民族郁积的契合，使《女神》的创作承载了一份厚重的时代意蕴，《女神》的诗学魅力某种程度上正来源于此，《女神》也由此进入了“五四”时代精神的整体性历史想象之中，并在新诗的发展历程中占据了奠基性的文学史地位。\n\n三、开创了一种自由诗的形式\n\n《女神》重要的文学史地位一方面来自其丰厚的时代意蕴，另一方面来自其自由诗的形式创造。在新诗的形式方面，郭沫若主张“绝端的自由，绝端的自主”，押韵、平仄、对仗等外在诗形被视为内在情绪的束缚而予以抛弃，这是对传统诗形的一种整体性突破。这种诗学认知体现于《女神》创作中，即是自由奔放的诗形创造。\n\n《女神》中一部分诗作受惠特曼浪漫主义诗风影响，在雄浑、粗暴的激情呼吁中，一种自由奔放的诗形得以生成，突破了传统诗形的拘囿。另一批诗风含蓄的诗作则主要是受泰戈尔的影响而创作的，属于“冲淡”“秀丽”类型，含蓄悠远，形式也自由而精巧。而无论是“惠特曼”式的狂放，还是“泰戈尔”体的冲淡，《女神》的创作突破了传统诗词的格调，并在艺术的营造中，开创了一种自由诗的形式。","keywords":"抒情机制 认知深化 时代精神 自由诗的形式","note":"1921年出版的《女神》是郭沫若的第一部诗集，也是中国现代文学史上第一部真正在思想内容和艺术形式上全面显示出现代意识和时代精神的新诗集。（最早出版的白话诗集是胡适的《尝试集》，但尚未完全摆脱旧诗的束缚。）同时，作为郭沫若最为重要的一部诗集，《女神》在名词解释中出现的可能性很大，大家也要重点关注一下。"},{"id":"55","stars":"★★★★","title":"谈谈你对《女神》自我抒情主人公的认识（26沈阳师范大学）","body":"《女神》一问世，便以其情感的大解放、诗体的大解放，宣告真正的现代自由体新诗时代的到来。与中国传统诗歌和早期白话新诗相比，它最突出的成就是创造了一个体现新的时代精神的自我抒情形象。\n\n一、《女神》自我抒情主人公的内涵\n\n（一）《女神》的自我抒情主人公是“五四”时期觉醒的中华民族的自我形象\n\n《女神》的自我抒情主人公首先是“开辟洪荒的大我”，“五四”时期觉醒的中华民族的自我形象。郭沫若对于时代发展的信息，有着海燕般的特殊敏感，他最先感受到了在20世纪初，伟大的“五四”运动中，祖国的新生，中华民族的觉醒。\n\n（二）《女神》的自我抒情主人公是大时代中诗人自我灵魂、个性的真实袒露\n\n“大我”与“我”是统一的。《女神》中的“我”不仅表现了崭新的民族魂，也袒露着诗人自己的灵魂。在许多方面，二者是合而为一的。比如，《女神》中“我”对于理想的热烈追求，面向世界的眼光，都真实地反映了郭沫若热情奔放、胸襟开阔乐观的个性；“我”彻底的破坏与创造精神，不仅表现了郭沫若的反抗性格，生命力的无比旺盛，创造力的无比丰富，而且表现了郭沫若一切彻底、易走极端的个性。\n\n二、《女神》自我抒情主人公的特征\n\n（一）具有彻底破坏和大胆创造精神的新人，具有彻底的、不妥协的、战斗的、雄强的民族精神\n\n这个新生的巨人崇拜自己的本质，把自己的本质神化，热烈地追求精神自由与个性解放。这在中国历史上是第一次：人的自我价值得到肯定，人的尊严得到尊重，人的创造力得到承认。对于长期处于“不把人当作人”的封建统治下，已经习惯于将个人价值泯灭在封建伦理原则之下的中华民族，这无疑是伟大的解放与觉醒。不仅如此，这个新时代的巨人目光不局限于中国一隅，而是面对整个世界与人类。\n\n（二）具有复杂性与丰富性，是“五四”时代心理、情绪与情感的立体化反映\n\n不加掩饰地赤裸裸地袒露自己，这是“五四”时代精神的一个重要方面，也是“五四”时期浪漫主义文学的一大特色。郁达夫的小说、郭沫若的诗歌都是如此。在《女神》里，常常可以听到一些不和谐的声音，展现了一个骚动着的、充满矛盾的内心世界。诗人充分地肯定着“自己”，又否定着“自己”，这互不协调的声音，矛盾对立而又统一，显示了抒情主人公\n\n形象的复杂性与丰富性，达到了对“五四”时代心理、情绪与情感的立体化的真实反映。","keywords":"中华民族自我形象 自我灵魂、个性 彻底破坏 大胆创造 复杂性与丰富性","note":"《女神》以饱满的热情、酣畅淋漓的笔墨、丰富的想象，大胆地创造了自我抒情主人公的形象。这一抒情主人公形象，是“五四”时期觉醒了的中华民族的自我形象，是一个具有大胆破坏与创造性格和热烈追求精神自由、个性解放的自我形象，具有双重内涵。"},{"id":"56","stars":"★★★★","title":"试分析《女神》的思想内容","body":"一、对旧制度旧世界的强烈批判\n\n《女神》以其饱满激昂的情绪充分传达出了五四时代高扬科学民主、反对封建专制、主张个性解放的时代特质，集中强烈地体现出狂飙突进、焚旧铸新、无所畏惧的时代精神，整部诗集充满了对社会黑暗的深恶痛绝，势不两立，无情揭露了世间的不平、污浊与腐朽，表达了诗人向旧制度旧世界勇敢挑战的气概。诗人对旧事物的批判并不只是针对某些个别的社会现象，而是一切阻碍人类社会进步的旧事物，是整个旧的宇宙，包括旧中国，这其中还特别包括诗人的“旧我”。这种彻底否定旧事物、与旧世界抗争到底的精神和气概，是五四时代精神的最强音。\n\n二、热情的创造精神和更新意识\n\n在批判旧世界的同时，《女神》还充溢着一种热情的创造精神和更新意识。在《凤凰涅槃》《女神之再生》《晨安》和《匪徒颂》等一系列诗篇中，诗人以无比开阔的胸怀表达了对新的理想社会和新生活的热切向往和追求。\n\n三、歌颂了富有叛逆精神的自我形象\n\n《女神》在思想个性方面最具特色的内涵，是它竭力歌颂了富有叛逆精神的自我形象，表现了与宇宙万物相结合的自我力量，这一点既是诗人受泛神论思想影响的突出体现，又集中道出了五四时代个性解放的鲜明要求。在《女神》中，郭沫若特别张扬神就是自然、就是宇宙万物、就是人类自己这个泛神论的核心主题，彻底打破古往今来、天上地下包括上帝和神在内的一切偶像，而把个性解放了的自我当作神和上帝来赞美。这个自我不仅是诗人个人感怀忧伤，苦闷孤独的“小我”，也是体现着时代要求和民族解放要求的“大我”。这个自我是诗人自己，同时又是千千万万要求冲出陈旧腐朽牢笼，摆脱民族屈辱，要求不断毁坏、不断创造、不断努力的时代青年的代表和象征。\n\n四、对“五四”时代、情绪与情感进行立体化反映\n\n不加掩饰地赤裸裸地袒露自己，这是“五四”时代精神的一个重要方面，也是“五四”时期浪漫主义文学的一大特色。郁达夫的小说、郭沫若的诗歌都是如此。在《女神》里，常常可以听到一些不和谐的声音，展现了一个骚动着的、充满矛盾的内心世界。诗人充分地肯定着“自己”，又否定着“自己”，这互不协调的声音，矛盾对立而又统一，显示了抒情主人公形象的复杂性与丰富性，达到了对“五四”时代心理、情绪与情感的立体化的真实反映。","keywords":"强烈批判 创造精神 更新意识 自我形象 立体化反映","note":"《女神》初版虽然略迟于胡适的《尝试集》，但他却以全新的精神和形式为“五四”时期的白话新诗取得了强力突破，从而成为中国现代白话新诗的奠基作。《女神》是“五四”狂飙突进精神的典型体现。它体现着对一切旧秩序、旧传统、旧礼教的大胆否定和无情诅咒，海啸般的呼喊着创造与光明，民主与进步，因而激动鼓舞了整整一代人。如果说鲁迅是用他的小说冷静地解剖着旧社会，那么，郭沫若便是用他的诗歌热烈地呼唤着新社会。"},{"id":"57","stars":"★★★★","title":"谈谈你对郭沫若泛神论思想的认识","body":"一、郭沫若选择泛神论的原因\n\n郭沫若选择泛神论是他人生道路和心理期待的必然结果。郭沫若是“文学救世救国”的坚决拥护者，按郭沫若的理解，“泛神就是无神”，其目的是借泛神来否定人格神的世界，把神的世界变成人的世界，使人成为宇宙的最高主宰，“泛神”从根底上是要冲破束缚人的传统势力，打破祖宗陈法，推倒被视为神圣不可侵犯的东西。泛神论不但与审美的本质紧密相关，而且“神即我，我即神”的观念具有反抗压抑、张扬人的感性欲望和主体意志的意义。\n\n二、郭沫若泛神论思想的来源\n\n郭沫若的泛神论思想有三方面的来源：一是由王阳明导引的中国儒家、道家文化思想，尤其是孔子、庄子给予他的深刻影响，使他“本来是有些泛神论倾向”；二是通过歌德认识了斯宾诺莎，对西方泛神论有独特的理解；三是由泰戈尔导引接\n\n触到古印度的《乌邦尼塞德》（后译为《奥义书》）梵我同一说，和中世纪印度教虔诚派代表人物伽毕尔的思想。郭沫若对这三方面的来源加以熔铸，形成了自已独特的泛神论思想。\n\n三、郭沫若泛神论思想的特点\n\n郭沫若以其独有的方式去理解和把握泛神论，他吸收了孔门哲学的良知、老庄哲学中的道、《奥义书》中梵的思想真髓，突破了斯宾诺莎泛神论学说的范畴，所以他的泛神论便有独特的思想内涵。\n\n（一）突出了人，人的自我在宇宙本体中的中心位置\n\n郭沫若式的泛神论突出了人，人的自我在宇宙本体中的中心位置，使神具有人的主观知觉，揭示出神化育万物实际上就是宇宙本体自我表现、自我扩张的过程的真义。\n\n（二）指明本体运动的特质和运动的基本方向\n\n郭沫若用进化的眼光看待泛神论，处于动态中的本体，不是来回重复循环，而是遵循新陈代谢的规律，由低级向高级的演化发展。\n\n（三）揭示了本体运行的基本特征：破坏与创造\n\n郭沫若认为，宇宙本体虽超绝一切，但一切自然现象、物质本体的外相或表相现象和具体事物是变灭无常的，处于破坏与创造的状态中。同时他又受印度教伽皮尔反对崇拜偶像思想的影响，不仅与创造精神有关的物相他崇拜，而且与破坏相联系的物相他也崇拜，甚至还崇拜自己，因为自己“又是个偶像破坏者”，从而把创造与破坏这宇宙万事万物对立统一的辩证关系揭示出来。在郭沫若看来，破坏和创造是永恒的，而且正是有了破坏和创造，宇宙万汇的变化才免于简单的重复、不尽的轮回和永远的循环，而是不断丰富、不断朝着新的、更高的层级发展。","keywords":"人生道路和心理期待 审美的本质 儒家、道家文化思想 斯宾诺莎 泰戈尔 中心位置 基本方向 基本特征","note":"泛神论对郭沫若影响十分巨大，而郭沫若之所以选择泛神论，是由当时的社会环境和审美的本质与泛神论联系紧密这两方面决定的。而郭沫若泛神论思想来源复杂，这也导致其泛神论形成了自己的特征。这部分内容，我们要掌握，相关内容可以参考王小平《泛神论与“天人合一”-郭沫若诗学的美学阐释》、吴定宁《论郭沫若与泛神论》，具体资料可以在李凡文学正版群中领取。"},{"id":"58","stars":"★★★★","title":"试分析《女神》的艺术特色是怎样的（26山西大学）","body":"与《女神》的破旧立新、追求光明自由、创造理想的高昂精神相适应，在艺术风格上，它表现出了浓烈醇厚的浪漫主义抒情特色。\n\n一、火山爆发式的激情和狂飙突进般的气概\n\n《女神》整个诗集贯通着蔑视一切、荡涤一切、创造一切的磅礴气势和力度。应该说，若论诗歌的艺术技法，或是诗风的精巧细腻，《女神》在当时并不是最出色的，但它那锐不可当的气势却是当时任何一位新诗人及其诗作都无法相比、望尘莫及的。人们通常最称道的是诗人奇特的想象和夸张，其实，在这里更重要的并不只是想象和夸张本身，而是诗人敢于这样想象和夸张的胆魄。这种胆魄使诗人总是能够站在时代和历史的高处，从大处着眼，直接与时代历史对话，与人类社会对话，与大自然对话，与整个宇宙对话。因此，郭沫若的诗作特别是《女神》，具有一种统摄一切的开阔视野和排山倒海的气度。\n\n二、丰富奇特的想象和绚丽浓厚的色彩\n\n《女神》中的诗篇很少按部就班地运用那种恰如其分的比喻，而是任凭想象力的无限发挥。郭沫若的想象力往往是大幅度跳跃式的。《女神》纵横万里，上下千年，宇宙万物皆在诗人自由驰骋的想象天地里，而且这些想象又与象征主义的表现手法融合在一起，使“凤凰”“天狗”“炉中煤”等形象不仅具有想象带来的新颖感和独特感，更具有高度浓缩的象征主义的内涵和蕴味。想象力的超常发挥使《女神》给读者留下了极为广阔的思考空间。\n\n《女神》中很多色泽绚丽的词语和浓墨重彩的描写，交织成一幅幅华美的锦绣，更增添了诗歌的浪漫主义抒情气氛。特别是《女神》还充满了浓郁的英雄主义基调和传奇色彩，多用神话传说和历史故事作题材，借其中的古代英雄抒发现实理想，慷慨悲歌，情深意长。这又使整部诗集情感深沉浑厚带有悲壮、雄浑的历史感。\n\n显然，《女神》的艺术风格既吸取了西方浪漫主义豪放激越的特点，又继承了中国古典诗歌悠然飘逸的格调。\n\n三、在诗歌的外在形式上真正实现了“诗体大解放”，实践了诗人要求“绝对的自由”的艺术主张\n\n《女神》中的诗篇完全不受诗歌外在形式的约束，有的诗长达数百行，如《凤凰涅槃》，也有的诗短短三两句，如《鸣蝉》；有的诗铿锵咆哮气势粗犷，有的诗则缠绵低语，情感细腻，有的采用了诗剧的形式，具有较为完整的情节，有的则任凭情绪的发泄，没有任何章法。\n\n在打破传统旧诗格律的同时，《女神》中有些诗篇仍然保留了较为严谨的格律形式，对传统诗歌的韵律进行了创造性的运用。即使是创新，也不被某一种新的形式固定，这是《女神》的可贵之处。","keywords":"火山爆发式的激情 狂飙突进般的气概 丰富奇特的想象 绚丽浓厚的色彩 诗体大解放","note":"郭沫若是典型的主观诗人，对现实的激烈反抗，对未来的热情向往，雄浑壮丽的风格，丰富奇特的想象，直抒心灵的抒情是《女神》浪漫主义的最主要艺术特色。这些特色的形成，泛神论，特别是时代起了主要作用。《女神》的出现与这样一位诗人的诞生，首先应归功于那个狂飚突进的时代。"},{"id":"59","stars":"★★★","title":"郭沫若诗歌与“五四”的关系","body":"一、《女神》的出现顺应了“五四”的时代要求\n\n狂飙突进的“五四”时代需要用高昂热情的浪漫主义来表现，而诗人郭沫若正是“偏于主观的人”，艺术想象力胜于观察力。个人的郁结，民族的郁结，在浪漫主义这里找到了喷火口。郭沫若对诗的抒情本质的强调，以及诗歌个性化的问题的提出，标志着对诗歌艺术认识的深化；自我抒情主人公形象的创造，成为《女神》思想艺术的主要追求。\n\n《女神》的自我抒情主人公首先是“开辟鸿荒的大我”-“五四”时期觉醒的中华民族的自我形象。这个为时代再造的中华民族的崭新形象在《女神》中第一次得到充分的艺术表现。\n\n二、“五四”精神影响了郭沫若的浪漫主义表现手法\n\n不加掩饰地赤裸裸地袒露自己，这是“五四”时代精神的一个重要方面，也是“五四”时期浪漫主义文学的一大特色。郁达夫的小说、郭沫若的诗歌都是如此。郭沫若诗歌中互不协调的声音，矛盾对立而又统一，显示了抒情主人公形象的复杂性与丰富性，达到了对“五四”时代心理、情绪与情感的立体化的真实反映。\n\n三、《女神》创造了自由诗的形式与“五四”狂飙突进的时代精神及雄奇风格相适应\n\n和《女神》所表现的“五四”狂飙突进的时代精神及雄奇风格相适应，《女神》创造了自由诗的形式。郭沫若一方面强调“形式方面我主张绝端的自由，绝端的自主”，同时又认为“情绪的世界便是一个波动的世界，节奏的世界”。\n\n就《女神》总体看，她的形式是自由的。每首诗的节数，诗节的行数，每一诗行的字数都不固定，押韵没有统一的规律，但在每一首诗中，却要求格律的某种统一，这种统一基本上有两种类型：一类外在格律相对严谨，押韵、诗节、诗行大体整齐；另一类（占《女神》的大多数）则是情绪自然消涨的内在韵律与某种程度的外在韵律（或不规则押韵，或用排比、复沓、对偶）相结合，使得诗在自由变动中取得某种程度的整齐与和韵。这种自由诗的形式，正是与“五四”时代精神相呼应的。","keywords":"“五四”时代要求 抒情主人公创造 自由诗的形式","note":"《女神》应“五四”精神的激发和感召而生，是时代的产物。它体现出浓浓的时代精神，具体说来，诗中的“抒情主人公”，是一位充满生机、热血澎湃、追求个性解放、向往世界和谐的青年形象，这表明了人的“自我意识”真正觉醒；二是诗中涌动着诗人“要把一切的腐败的存在扫荡尽，烧葬尽”的激情，表现出摧毁旧世界、创造新世界的大无畏精神与气概。"},{"id":"60","stars":"★★★★","title":"试分析郭沫若的诗歌创作理念","body":"郭沫若从强调“写什么”入手来解决现代新诗的观念问题，提出了“内在律”的诗学理论，确立了现代情绪诗学观念，解决了“写什么”与“如何写”的问题，使诗歌的内容与形式达到一致，在此基础上对诗歌的本质、诗歌的文体形式等问题提出新的阐释，为现代诗学理论开拓了新的增长点。具体来说，郭沫若的诗学理念，主要包括以下内容：\n\n一、“抒情”是诗歌本质\n\n“抒情”是郭沫若诗学观念的核心，他以“抒情”为出发点来建构其诗歌理论框架，并以“抒情”作为诗歌创作的追求。郭沫若在认识到诗的本质在抒情之后，对这一问题做了进一步的思考，在此基础上提出了“情绪”理论。在郭沫若看来，情绪是音乐、诗歌、舞蹈的本质与本源，只是其呈现的方式不同而已。\n\n在郭沫若那儿，“情感”“情绪”等概念的运用处于混乱之中。从心理学的角度来看，“情感”、“情绪”都是人的主观体验，但情绪是情感的初级存在形式，与情感相比，它更率真、质朴更接近裸体状态。正是由于“情绪”与“情感”、“志”与“情”之间的复杂关系和模糊界限，使得郭沫若在不同的时空中可根据自己的需要对它们加以灵活的理解与运用。相比之下，早期的郭沫若更加强调“情绪”（个人、小我的情绪，具有生理性的特征），而后来则更强调情感（集体、大我的情感，具有社会性特征）。\n\n二、“内在的韵律”\n\n在郭沫若看来，“歌”是可以唱的，“诗”则可以脱离外在的韵律而存在，诗的本质是“情绪”，但这种“情绪”必须有消有涨，是一种有规律的变化，由此而形成“内在的韵律”。郭沫若认为，只有具备一定节奏的“情绪”才能成为诗，节奏化、韵律化的“情绪”既是诗的存在形式，又是诗的内在本质，诗由此达到了内容与形式的有机合一。\n\n郭沫若所强调的“内在的韵律”是一种自然的情绪变化状态，而不是靠人工雕琢而形成的节奏。他借用西方心理学理论将“感情”与“情绪”区别开来，将情绪分为七种不同的类型，并明确地阐明了什么样的“情绪”才能成为诗歌。郭沫若解构了外在韵律在现代自由诗中的作用，强调情绪自身的起伏变化，由此出发，他将“散文诗”与“自由诗”等同起来，导致现代自由诗愈来愈散文化。\n\n三、追求诗歌形式自然天成\n\n郭沫若追求语言文字的自然天成，反对语言文字的做作雕琢，正因为他追求不假修饰、自然天成的诗歌风格，所以他主张诗歌是“写”出来的而不是“做”出来的，主张用今天的语言来表现诗人的情绪世界。\n\n同时，郭沫若追求自然天成的诗歌风格，他将押韵、平仄、对仗等外在形式视作情绪的枷锁束缚而予以抛弃，深入地分析了脚韵与诗歌、诗歌与散文之间的辩证关系，得出了“诗不必定有韵”的结论，这是对传统诗歌观念的颠覆，也是对现代自由诗观念的捍卫。\n\n综上所述，郭沫若在胡适现代自由诗理论的基础上提出了“抒情”是诗的本质的观点，进而以情绪为核心来建构自己的诗学观念，确立了“内在律”的诗学观念，并试图建构与“情绪”相适应的语言形式，这都是郭沫若对现代诗学所进行的大胆探索，也是他对现代新诗发展所做出的突出贡献。","keywords":"“抒情”本质 内在的韵律 形式自然天成","note":"郭沫若的诗歌创作理念是在胡适新诗创作理念之上发展而来的，可以说是解决了新诗“写什么”和“怎么写”的问题，为推动新诗向前发展起到了重要的作用。郭沫若诗论的内容是互相联系的，观点是前后一贯的，可以作为一个整体来看待。但就其每一方面的内容而论，也只是涉及这一内容的某一个侧面；就其总体看，当然更不足称为诗歌艺术完整而严密的理论。但它为建设这一理论体系提供了一些有价值的见解，对今天的诗歌创作，也仍然提供了很好的参考，并对了解郭沫若的诗歌创作更具有重要的意义。"},{"id":"61","stars":"★★★","title":"简要分析一下《凤凰涅槃》这部作品","body":"《凤凰涅槃》是郭沫若的第一部新诗集《女神》中最长的一首诗，也是最能体现《女神》创作风格与郭沫若思维方式的代表作，这首诗可谓整部《女神》的“诗眼”，也是联结郭沫若几乎全部文学创作与学术研究的关键词。\n\n一、思想内容\n\n《凤凰涅槃》结合了古代天方国的神鸟“菲尼克司”和中国的凤凰的神话传说，把诗人个体的小我以及民族的大我比喻成凤凰的形象，借助于对“满五百岁后，集香木自焚，再从死灰中更生”的凤凰传说的改造与复述，诗人宣告民族在“死灰中更生”的新时代已经到来。\n\n“火中凤凰”的传说给予诗人以现实的启迪，使诗歌的革命精神与历史乐观主义态度紧密结合。诗人以汪洋恣肆的笔调和重叠反复的诗句，着意地渲染了大和谐、大欢乐的景象。这是经过斗争冶炼后的真正的创造和新生，它表达了诗人对五四新时代的歌颂，也是祖国和诗人自己开始觉醒的象征，洋溢着炽烈的向往光明、追求理想的热情。\n\n二、艺术特征\n\n（一）诗剧的形式\n\n《凤凰涅槃》这首诗采取了诗剧的形式，由“序曲”“凤歌”“凰歌”“群鸟歌”“凤凰更生歌”五个部分组成，充分表现了诗人在总体构思上对诗歌的调子和节奏的控制，类似于交响乐的几个乐章，从快板、柔板、小步舞曲到进行曲的几种调子的转换和交织，使整首诗舒缓跌宕、起伏有致，并把诗剧最终推向了凤凰更生的最高潮。\n\n（二）豪迈、奔放、激越、雄浑的风格\n\n郭沫若的《女神》向来以豪迈、奔放、激越、雄浑的艺术风格著称，《凤凰涅槃》尤其鲜明地体现了这一特点。这主要是指诗篇所表现出来的火山爆发式的、白热化的激情，奋发昂扬、积极向上的革命精神，以及宏伟、博大，纵横恣肆，问天问地、问海，驰骋东、南、西、北四方，一泻千里的磅礴气势。\n\n（三）韵律节奏自然、优美\n\n《凤凰涅槃》不仅具有独特、新颖的格式，而且韵律节奏自然、优美。从韵律来看，这首长诗注意了诗歌外在的有形律讲究了平仄、对仗的运用，音步的自然和谐，并在每个诗节中，押相同或大致相同的音节明亮的脚韵。\n\n三、历史地位\n\n《凤凰涅槃》是《女神》中的代表作，也是现代诗歌史上具有重要历史地位的诗篇，集中强烈地体现出《女神》的人类性审美意识。它借助神话传说和拟人手法，以象征意象，塑造了充实丰满的人类英雄形象，展示出富有浓郁诗意的人类本身及其世界革故更新的客观规律、动力机制以及人类更生后无限欢唱、无限和美的幸福感和获得感。","keywords":"对五四新时代的歌颂 觉醒象征 诗剧形式 豪迈、奔放、激越、雄浑 韵律节奏自然、优美人类性审美意识］【李凡说：《凤凰涅槃》是《女神》中十分具有代表性的一首长诗，也可以说是郭沫若最重要的一首诗歌，是我们分析郭沫若诗歌创作时经常会遇到的一首诗，所以对于这首诗的思想艺术特征以及其地位，我们有必要掌握一下。相关内容我们可以参考爵蓉《浅谈＜凤凰涅槃》的艺术特色》，具体资料可以在李凡文学正版群中领取。","note":""},{"id":"62","stars":"★★★","title":"郭沫若历史剧的基本特点和艺术特色（25兰州大学）","body":"一、选材与剪裁：“失事求似”\n\n在历史剧的选材和剪裁方面，郭沫若具有独到深刻而富有创造性的见解。郭沫若生动而准确地把历史研究和历史剧创作的根本区别概括为“实事求是”和“失事求似”。郭沫若不仅把握了历史与现实的关联，更把握住了历史与创造的契机。沫若从不机械被动地描写历史事件和历史人物，即使为反映现实所作，也没有被所反映的现实限制住，他总是完全地自我投入，能动地挖掘和创造历史，并以一种整体的全局性的眼光来进行创造。郭沫若创作历史剧特别注重选取与现实社会密切相关的历史题材，使读者和观众从历史当中很自然地联想到身边发生的重大现实问题。正因为如此，郭沫若的历史剧既有作者独立人格和独特感受的创造力，又有鲜明的现实启发性和强烈的时代战斗性。\n\n二、人物塑造：以人物性格和命运的塑造为剧本核心\n\n在历史人物的重塑方面，郭沫若突破了现代话剧以剧情发展（特别是历史剧的历史史实的发展）为主要线索的基本格局以刻画人物性格为本，以人物命运来构造中心冲突，通过人物强烈的自我表现来揭示主题，带动全剧。\n\n在郭沫若的历史剧当中，剧情的发展已经完全退居到很不重要的位置上，而作家自身主观情感的起伏变化和人物性格的“合理”发展才是最重要的。一切情节线索都是为人物性格和命运的塑造而设置的，而且，郭沫若总是把剧中人物放在重大的矛盾冲突中展现其思想性格的基本点，从不纠缠于细枝末节。因此，郭沫若历史剧中的每个人物形象性格都很鲜明，都有很强的独立性和分量很重的思想内涵。\n\n三、整体风格：强烈的抒情色彩与沉郁的悲剧气氛\n\n郭沫若的历史剧始终洋溢着浓烈的抒情色彩并贯穿着一种沉郁的悲剧气氛。郭沫若是个感情激越的浪漫主义诗人，他的历史剧和他的诗一样，具有浓烈的诗意与优美的抒情，他的戏剧也是悲壮、激越、优美的抒情诗，富有浪漫主义色彩。郭沫若善于在历史剧当中自然地穿插大量的民歌和抒情诗，这些抒情的诗和歌不仅渲染了氛围，突出了人物性格，强化了剧本的主题，而且其本身已经融化为整个剧本的一个不可分割的有机组成部分。郭沫若还善于在历史剧中大量运用富有韵味的长篇独白，而且人物的对白以及作者的叙述语言也充满了音乐的节奏和诗的激情，这种诗化的语言显示了郭沫若所独有的诗剧合一的特色。\n\n郭沫若的历史剧几乎都是悲剧，以壮烈惨痛的历史映现严峻悲愤的现实是郭沫若历史剧的基本色调。这种悲剧美的气是郭沫若历史剧艺术感染力的重要因素。郭沫若的历史剧创作标志着中国现代悲剧艺术走向新的境地。","keywords":"失事求似 人物性格和命运 抒情色彩 悲剧气氛","note":"郭沫若以学者、剧作家、诗人这三者的和谐统一，构成了他历史剧创作别具一格的艺术特点。当他创作历史剧的时候，他是以科学家、历史学家在做渊博的筹备，而以革命诗人在进行丰富的构思，最后再以戏剧家的绚丽风格去落笔。所以，他的作品才是这样的旁征博引、才气纵横、想象大胆、联想奇胜。"},{"id":"63","stars":"★★★","title":"简述《屈原》的艺术特色","body":"五幕剧《屈原》是郭沫若个人历史剧的代表作，也是抗战时期历史剧创作中成就最高、影响最大的一部作品。作品以楚怀王对秦外交两条路线的斗争作为全剧情节线索，成功地塑造了屈原这一伟大的爱国主义诗人的悲剧典型。作者通过屈原形象，用借古讽今的方法，深刻地表达了为祖国和人民不畏暴虐、坚持斗争的主题，抨击了国民党政权的黑暗统治。《屈原》集中体现了郭沫若的浪漫主义历史剧创作的原则和诗剧的美学特征。\n\n一、“失事求似”的历史剧创作原则\n\n根据剧情和表达主题的需要，郭沫若遵循“失事求似”的历史剧创作原则，往往适当改动历史事实，虚构人物和事件。《史记·屈原贾生列传》中写屈原被疏的原因是上官大夫与之争宠，心害其能，进谗言，屈原被疏。而《屈原》则改为“淫乱宫廷”被疏，这样进一步揭露了投降派的阴险、卑劣、狠毒。\n\n二、抒情色彩浓郁，戏剧冲突张弛有度\n\n郭沫若在《屈原》中采用抒情性的结构，通过展现屈原精神世界一天之内（由清晨到夜半）的大起大落，概括其一生的理想追求及其悲剧性。作者在把握历史基本精神的前提下，展开了大胆的想象，对具体史事的运用极为灵活，抒情色彩浓郁，戏剧冲突有张有驰。剧中，昏庸的楚怀王不听劝诫走上了投降道路，并下令将屈原囚禁起来。在政治理想难以实现并失去自由的情况下，他满腔的愤怒和爱国的激情借助雷电颂作了尽情的喷发，郭沫若与屈原合体，尽情抒发着个人的情感。这段情感的倾泻不仅是全剧的主题寓意所在，更是全剧发展的必然结果。\n\n三、致力于塑造和展现人物的精神特征\n\n郭沫若主要致力于塑造和展现人物的精神特征，他舍弃人物的生活细节，不拘泥历史人物的真实，不着意追求人物的多面性复杂性，而是放大人物性格的某一侧面，将人物高度理想化。剧中，郭沫若大胆地赋予了屈原雷电的性格，强化了他刚正不阿、疾恶如仇、勇于和黑暗势力斗争的历史精神。根据主要人物性格来虚构次要人物，以烘托主要人物，这是郭沫若浪漫主义历史剧创作的一个特点。婵娟的形象是屈原形象的补充和烘托，也是高度理想化的形象。她品行端庄，灵魂高洁，有正义感和爱国心。她的高尚品质是对屈原精神的继承。此外，对其他人物如南后和宋玉的性格刻画也比较成功，且带有作家明显的浪漫主义色彩。","keywords":"失事求似 抒情色彩 张弛有度 精神特征","note":"《屈原》这部历史剧可以说是郭沫若历史剧创作的典型代表，可以说集中表现了郭沫若历史剧创作的美学特征，大家可以根据郭沫若历史剧创作特点，结合《屈原》这部作品的内容进行具体分析。郭沫若对于屈原这一形象的理解，经历了一个发展的过程，或者说，郭沫若的屈原言说具有时代性，但相关内容被考查的可能性不大，大家可以作为一个拓展内容进行了解，相关资料详见李凡文学正版群。"},{"id":"64","stars":"★★★","title":"郭沫若历史剧阶段性特征及其变化原因","body":"郭沫若一生创作了17部历史剧，并且其创作周期相当漫长，从“五四”时期到抗战时期，再到建国之后，郭沫若的历史剧创作大致可以分为三个阶段，而由于社会环境与其本人文学思想变化的影响，其每个阶段的特征都有不同。\n\n一、“五四”时期：将“五四”精神吹入历史人物的“骸骨”\n\n这一时期郭沫若的历史剧以《三个叛逆的女性》（《卓文君》《王昭君》《聂嫈》）为代表，他在中国古代那些具有戏剧性和浪漫色彩的女性人物身上发现了可以注入现代思想的构架，融入了先觉者带有启蒙意识和批评意图的创造激情。这些诗剧，应该说是时代孕育、催生的，它们洋溢着以破坏、创造为中心内容的“五四”精神。诗剧里的历史人物，实际都是作者的同时代人，他们身上只有一些历史的影子，戴着历史的帽子，是“五四”时期具备“五四”精神的青年典型。\n\n郭沫若这一时期历史剧呈现出如上特征的原因主要有二，一是当时正值“五四”时期，思想解放与反抗封建压迫是当时社会思潮的主流；二是此时郭沫若初涉文坛，主要受到个性主义思潮的影响，注意弘扬人的个性意识。\n\n二、“抗战”时期：反对侵略、投降和专制，颂赞爱国、团结\n\n这一时期的代表作品是《棠棣之花》《屈原》《虎符》《高渐离》《孔雀胆》《南冠草》六部历史剧，它们标志着中国现代历史剧创作高峰的到来。这六部历史剧取材历史的角度不同，从不同侧面反映了现实社会，但与黑暗反动势力进行顽强不妥协的斗争，坚决维护民族和祖国的根本利益则是贯穿于这些剧本中的共同精神实质。六个剧本都突出反映了这样一个鲜明的主题：反对侵略，反对卖国投降，反对专制暴政，反对屈从变节，颂赞爱国爱民，主张团结御侮，高扬坚守气节。在艺\n\n术风格上，以《屈原》为代表的郭沫若后期历史剧更加气势浩瀚，构思新奇，在历史与现实的融合方面均达到了出神入化的境地。\n\n之所以会有以上变化，一方面是由于皖南事变以后，抗战前期蓬勃发展的救亡戏剧受到挫折。特定的国际国内环境使得这时期作家们通过这种相对隐蔽的方式，以古喻今，呼应现实的时代主旋律，鼓舞人民的抗日斗志。同时，许多戏剧工作者也力图通过历史剧的创作在回顾与研究历史的同时，探讨中国社会的发展方向问题。另一方面则是因为郭沫若自身文学观念的发展，民族主义文学观逐渐成熟，戏剧创作理念也逐渐完善，期望通过这些历史剧创作达到批判国民党黑暗统治，号召广大国民团结起来，共同抗战的目的。\n\n三、“十七年”时期：呼应“时代精神”的历史人物“翻案”剧\n\n这一时期的作品主要是《蔡文姬》《武则天》，这两个剧本的写作动机与为历史人物“翻案”有关。武则天这个有争议的人物，在郭沫若的剧中，以具有雄才大略，志于强国富民，而又从谏如流，知人善任，富于人情味的君主面目出现。《蔡文姬》则是对传统戏曲、小说曹操形象的“改写”。代替那个“白脸奸臣”的曹操的是伟大政治家、军事家、诗人的形象。作者充分理解这个时代推崇的是开辟历史“新纪元”的“风流人物”，他的充溢着浪漫激情的“改写”，是对于“当代的这-“时代精神”的呼应。\n\n出现这一现象的原因与当时的整体社会环境息息相关，这一时期文学包括戏剧与政治联系紧密，这一时期的剧作家也不是被动的，甚至是主动地、满怀热情地与政治相配合，因此才有以上与时代精神相呼应的“历史翻案剧”的出现。","keywords":"“五四”精神 反对侵略、投降和专制 颂赞爱国、团结 时代精神 历史翻案剧","note":"郭沫若的历史剧创作大致可以划分为三个阶段，每个阶段都有其不同的特色，产生这些变化的原因主要是从社会环境变化与诗人自身戏剧理念与文学观念发展这两个方面去分析，必要时可以联系郭沫若的具体作品。"},{"id":"65","stars":"★★","title":"早期白话诗的艺术特征是怎样的","body":"在集体的努力中，早期白话诗逐渐形成了自己的特色，实际也是中国现代新诗的最初形态，主要表现为以下几个方面：\n\n一、追求“具体的做法”，手法上多使用白描、比喻、象征\n\n胡适所说“诗须要用具体的做法，不可用抽象的说法”是这一时期诗人在艺术上的共同追求。所谓“具体的做法”，一是“白描”，二是“比喻”“象征”。这样，早期白话诗就自然分为两类：\n\n（一）用白描手法如实慕写具体生活场景或自然景物，显示出客观写实的倾向。如刘半农的《相隔一层纸》，胡适的《人力车夫》。朱自清的《小舱里的现代》，康白情的《草儿在前》，都是对民间疾苦、社会人生的实写，可以看到古乐府的影响；俞平伯《冬夜之公园》、康白情《江南》、傅斯年《深秋永定门上晚景》等都是纯粹的写景诗。\n\n（二）通过托物寄兴，表现诗人对社会人生的感悟与思索。如胡适的《鸽子》《老鸨》。也有的是直接表现某个抽象意念，如鲁迅的《梦》《人与时》，胡适《一念》，玄庐《偶像》，刘大白《淘汰来了》等，正是在这些新诗里，虚化意象与寓言意象大量出现，并且表现了强烈的主观意志，这都是中国传统诗歌里并不多见的。\n\n在早期白话诗里，无论是白描，还是比喻、象征，都无不具有明白而平凡的特点；从另一面说，则是缺乏飞腾的艺术想象力。茅盾说早期白话诗大都“具有＇历史文件’的性质”：其历史价值与局限都在于此。\n\n二、在诗的形式上，早期白话诗主要表现出散文化的倾向\n\n早期白话诗基本不用韵，不顾及平仄，随情感的起伏变换长短句式，如水般缓缓地流过，自然形成了舒缓自如的内在节奏；同时，大量运用虚词，采取白话散文的句式与章法，以清晰的语义逻辑联结诗的意象：这都根本有别于传统诗歌。\n\n三、热衷于吸取与借鉴民间歌谣传统\n\n1920年成立的北京大学歌谣研究会，它的发起人与参与者大都是早期白话诗人，如周作人、刘半农、沈尹默等，由此而开始了现代新诗“歌谣化”的努力。刘半农在从故乡江阴采风的同时，还用江阴方言写作“四句头山歌”20余首，编成《瓦釜集》，在随后写作的《扬鞭集》里也有现代山歌的创作。刘大白《卖布谣》《田主来》等诗也直接借鉴了民间歌谣的体式。这自然也是对传统诗歌的文人化、贵族化倾向的一种反拨，与“五四”文学“平民化”的思潮是相一致的，如俞平伯所说，诗应当“还淳返朴”，“把诗底本来面目，从脂粉堆里显露出来”，以“推翻诗底王国，恢复诗底共和国”。这样的努力也是开拓了新诗的一个方面传统的。","keywords":"白描、比喻、象征 散文化倾向 吸收借鉴传统歌谣","note":"早期白话诗的考查虽然多集中于作家作品，但也不排除考查早期白话诗整体特点的可能性。同时，掌握一个时期** --- 整体的诗歌创作风格，对我们去分析具体的作家作品也有很大的帮助，这一点需要大家去了解。"},{"id":"66","stars":"★★★","title":"冯至早期诗歌的艺术特色是怎样的","body":"冯至自称是在郭沫若的《女神》影响下从事现代抒情诗的创作，但他也有自己的独立创造与贡献。鲁迅曾经把冯至誉为“中国最为杰出的抒情诗人”，因为冯至的诗歌艺术特色符合鲁迅关于“感情正烈的时候，不宜做诗，否则锋芒太露，能将“诗美”杀掉”的观点。具体来说，冯至这一时期的诗歌创作，主要包括以下特征：\n\n一、处处表现出艺术的节制\n\n冯至抒情诗的最大特色正是处处表现出艺术的节制。《女神》式的繁复的、使人眼花缭乱的形象纯化为明净的形象；内心的激情不采取直接倾泻的方式，或外化为客观的形象，或蕴涵于简单情节的娓娓叙述中。前者如《蛇》，通过奇特的想象，把炽烈、真挚的情思寄寓在“蛇”的冰冷而寂寞的形象中；后者如《雨夜》，深情而又简洁地叙述了一个行人怎样在林中迷路井与幽灵相逢，故事显然带有异域情调，所要披露的却是诗人自己在现实中迷失方向的凄苦心境。\n\n二、追求诗情的哲理化\n\n冯至着意追求诗情的哲理化，使他的抒情诗具有一种沉思的调子。如《我是一条小河》就是一首优美含蓄的爱情诗，但它的内涵又超越了爱情的范围。诗歌的开头就表现了一种充满哲理的情感波动，无心与有情，真挚与随意，都像小河流水，来得那样自然而又不容置疑。\n\n三、追求整饬、有节度的美\n\n冯至的诗歌在形式上采取了半格律体，诗行大体整齐，大致押韵，追求整饬、有节度的美。这样，冯至的诗，不仅情调充满感伤苦闷，而且诗的节奏舒缓，音韵柔美，形成了“五四”新诗中独具一格的幽婉的风格。\n\n四、擅长叙事\n\n冯至对新诗的另一个重要贡献，是他“堪称独步”的叙事诗。冯至的叙事诗从德国谣曲中直接获取养分，又采取中国民间传统与古代神话故事，虽别有一种不可解脱的神秘气氛，含蓄着中古罗曼的风味，但所表现的对于封建婚姻制度的憎恨与对爱情理想的追求，仍然是“五四”时代的。抒情与叙事融为一体，艺术表现十分精致，把现代叙事诗的创作，提高到了新的水平。","keywords":"艺术的节制 诗情的哲理化 有节度的美 擅长叙事","note":"冯至是一位重要的抒情诗人，但我们应当注意到冯至在叙事诗上为新诗做出的重要贡献，而这些贡献主要体现在他的诗歌艺术追求上面，具体表现在内容、形式、手法等多个方面，大家要仔细把握。"},{"id":"67","stars":"★★★★","title":"谈谈你对前期新月派诗歌的认识","body":"“新月诗派”源于胡适、徐志摩、闻一多、陈西滢等人在北京发起成立的“新月社”。早期的新月社是一个带有文化倾向的社交团体，1926年4月，闻一多、徐志摩在北京《晨报》副刊上创办《诗镌》，才明确提出了现代新格律诗的理论主张，并集结了一批诗人，积极尝试新格律诗的创作。于是，以《诗镌》的创办为标志，新格律诗派即“新月诗派”开始形成。《诗镌》时期的活动，一般被认作前期“新月诗派”。\n\n一、美学原则：“理智节制情感”\n\n新月派诗人反对感伤主义和滥情主义，反对毫无节制的情感宣泄。他们在诗艺上实践着使主观情感客观化的原则，在诗中大量铺排意象。为了实现他们的“理性节制情感”的理论原则，新月派诗人在诗歌艺术上做了有益的尝试。\n\n（一）客观抒情诗的创造，即变“直抒胸臆”的抒情方式为主观情愫的客观对象化。新月派诗人在诗的艺术表现里，不铺写触发这些情感的具体事件，也没有赤裸裸地倾泻情感，而是经过艺术的想象，幻化为具体可触的客观形象。这种主观情感的客观化，使情感的表现蕴藉而含蓄，具有鲜明的形象性，并且能够激起读者更丰富的联想，积极参加审美再创造过程。这在新诗抒情艺术上是一个发展。\n\n（二）加强诗歌中的叙事成分。新月派诗人进行了现代叙事诗的试验，同时还做了“新诗戏剧化、小说化”的努力。不过在这叙事诗的实验中，诗人仍然把自己的主观僧恨与同情深藏在人物的自白里，尽可能地表现不露声色的客观态度。\n\n以上两个方面努力的结果，减弱了早期白话诗里开始显露、在郭沫若《女神》等诗作里充分展现的诗人主体形象与主观意志，并显示出非个人化的倾向。\n\n二、审美特征：“和谐”与“均齐”\n\n新月派系统地阐述了新诗格律化的理论，强调新诗最主要的审美特征应该是“和谐”与“均齐”，这突出体现在闻一多提出的诗歌“三美”（即“建筑美”“音乐美”“绘画美”）主张上。“音乐美”强调“有音尺，有平仄，有韵脚”，“建筑美”强调“有节的匀称，有句的均齐”，“绘画美”的强调是考虑了中国诗画相通的传统，体现为“词藻”的运用，给人以视觉鲜明的色彩感。新格律诗派的“新”，破除了文言和旧韵以及旧体格律诗的种种规范，着重强调诗歌内在的音节和韵律，它继承了古典诗词的精髓而又有所创新。\n\n三、艺术探索：诗体形式的探索\n\n新月诗派在艺术上深受英美诗歌和中国古典诗歌影响。英美诗歌音节凝练、绵密、婉约，为新月诗人格律诗实验提供了有力的参照和借鉴。新月诗人大量阅读、翻译英美诗歌，特别是英国诗歌，尝试用英诗形式如十四行诗和英诗格式如五步抑扬格创作新诗。同时，他们还自觉地吸收中国古典诗歌的格律艺术，使中西诗艺相融合，创造出新的诗体。尽管不完全成功，但开阔了试验新诗诗体形式的思路。\n\n四、主要贡献：巩固了新诗的地位\n\n总的说来，新诗格律化的倡导，体现了一种诗学意识的觉醒，纠正了早期新诗创作过于散漫自由、创作态度不严肃造成的一定程度的混乱局面，使新诗趋于精练与集中，具有了相对规范的形式，巩固了新诗的地位，对中国现代新诗的健康发展做出了特有的贡献。此后格律体的新诗与自由体的新诗一直成为新诗两种主要诗体，互相竞争，又互相渗透，对新诗的发展起了重要的推动作用。","keywords":"理智节制情感 客观抒情诗 叙事成分“和谐”与“均齐”诗体形式 新诗地位","note":"新月派是新诗发展过程中十分重要的一个流派，也是现代文学考查的一个重点。新月派的新格律诗主张的提出是新诗发展的一个必然结果，对早期新诗创作有一个纠偏作用。作为第一个十年中最重要的一个诗歌流派，新月派以及与之相关的“三美”、《诗镌》等关键词在名词解释中出现的频率也非常高，大家也要重点关注。"},{"id":"68","stars":"★★★","title":"闻一多诗歌的艺术特色是怎样的","body":"闻一多是前期新月派“领导文学潮流”的代表诗人，也是“三美”主张的提出者，他的诗歌创作，主要表现出如下特征\n\n一、诗歌中充满着矛盾与张力，表现出“沉郁”的风格\n\n一方面，闻一多具有“东方主义”文化观，向和谐、均齐的传统美学理想靠拢；另一方面，闻一多又是一个具有敏锐的现代感受的诗人，一个深受西方文化影响、具有强烈的生命意志力与个性自觉的现代知识分子，不能不对“物我两忘”的传统美学境界产生怀疑与拒斥，他的诗歌里充满了矛盾的张力。闻一多诗中独特的美感在于，巨大而深刻的思想矛盾时时刻刻有如汹涌海涛不断撞击着闻一多的心，内心的“火山”几欲冲决而出；然而他又自觉追求传统的感情的克制，要把过量的“火”压缩在凝定的形式中。闻一多是以整饬的形式和格律的规范收束着他那火山喷发一般的激情，因而，这种激烈的个性在艺术上经过了冷处理，使火山化为凝聚的岩浆，尽管热度仍然极高，却呈现为液态的形式。这就形成了闻一多诗歌的一种不可多得的沉郁的美，也奠定了他在中国现代诗歌史上无法替代的地位。\n\n二、“三美”的理论主张\n\n闻一多的新格律诗理论是建立在对中外诗歌艺术广泛借鉴的基础上的，他的诗歌大都体现了他的新格律诗主张，具有绘画美、建筑美与音乐美。“音乐美”强调“有音尺，有平仄，有韵脚”，“绘画美”讲究诗的视觉形象和直观性，“建筑美强调“有节的匀称，有句的均齐”。\n\n闻一多诗节匀称，诗句均齐，韵律工整而富于节奏感，将绘画美的色彩和诗的感情色彩融为一体，以精密的构思凸现诗的神韵，用鲜明的对比加强诗的力度。然而，对格律化的过分追求，也不同程度地影响了闻一多某些诗篇的灵动和激情。从总体上说，闻一多的诗作较为出色地体现了传统文化与现代文化的结合，代表了“新月诗派”典丽、凝重的诗风。\n\n三、有着无羁的自由精神与想象力\n\n闻一多与郭沫若一样，有着无羁的自由精神与想象力，他们共同使新诗真正冲出早期白话诗平实、冲淡的狭窄境界，飞腾起想象的翅膀，获得浓烈、繁富的诗的形象；而闻一多又以更大的艺术力量将解放了的新诗诗神收回到诗的规范之中，正是这一“放”一“收”，显示了闻一多的诗在新诗发展第一个十年其他诗人所不能替代的独特作用与贡献。","keywords":"矛盾与张力“沉郁”风格“三美”主张 自由精神与想象力","note":"在中国的新诗美学史上，闻一多作出的贡献无疑是多方面的，他的诗歌在二三十年代的诗人中，成就“不是最高”，也没有像其他诗人如徐志摩那样受当代青年人的喜爱，但“社会性、时代性和民族性是最突出的”。而且为中国新诗理论的** --- 建设奠定了极其富有启示性的基础。我们在分析其艺术特色时，可以结合其具体创作如《死水》《红烛》等进行作答。"},{"id":"69","stars":"★★★","title":"试简要分析闻一多“三美”的诗歌理论主张","body":"为了创立“中国式”的新诗，闻一多提出了“新诗格律化”的主张，鼓吹诗的“三美”，即“音乐美，绘画美，建筑美”。闻一多强调“格律是艺术必须的条件，实在艺术自身便是格律”。“音乐美”强调“有音尺，有平仄，有韵脚”，“建筑美”强调“有节的匀称，有句的均齐”，“绘画美”的强调也是考虑了中国诗画相通的传统。闻一多的新格律诗理论是建立在对中外诗歌艺术广泛借鉴的基础上的，他的诗歌大都体现了他的新格律诗主张。\n\n一、“音乐美”\n\n“音乐美”强调“有音尺，有平仄，有韵脚”，指的是诗歌借助于音尺、平仄、韵脚等获取某种节奏，在听觉上给人一种音乐感，闻一多认为这是首要的。闻一多借鉴外国诗歌经验并依据汉语特点，认为对于诗歌来说，节的匀称和句的均齐是外在形式，节奏是内在血脉。而节奏的经营必须注意：一行诗有几个音尺，其中有几个三字尺、二字尺，音尺的排列可以不固定，但每行的三字尺、二字尺数目应该相等。闻一多诗歌的押韵方式也是多种多样的，变化中有规律，使诗歌获取了一种内在的生命节奏。\n\n二、“绘画美”\n\n“绘画美”是对中国传统文化的继承，主要是指诗的词藻的选用，即诗歌语言要求美丽，富有色彩，讲究诗的视觉形象和直观性。闻一多曾专攻美术，对色彩非常敏感，特别擅长以富丽的“词藻”勾勒线条，描绘形象，创造意境，使诗中有画，呈现出绘画美。如《什么梦？》涂抹了一层阴暗、沉重的色彩；《一个观念》色彩美丽、亲切；《死水》则以多种色彩描画出一幅“恶之花”。他总是对词藻反复推敲而又不露痕迹，如“鸦背驮着夕阳”中的“驮着”，“热情开出泪花”中的“开出”，“家乡是个贼，他能偷去你的心”中的“偷去”，等等，一词干金，给诗以生命。这些美的词藻、画面传达的是诗人对于社会和人生的某种理解、认识与情感形式。\n\n三、“建筑美”\n\n“建筑美”强调“有节的匀称，有句的均齐”，指的是诗歌因“节的匀称和句的均齐”而在视觉上给人一种建筑的立体美感。闻一多强调是因为“我们的文字是象形的，我们中国人鉴赏文艺的时候，至少是有一半的印象是要靠眼睛来传达的”，所以在新诗创作中应追求格式的整齐和谐。闻一多诗歌的建筑美并不以某一种诗形样式为最佳，而是根据情感抒写的需要而变化。大体而言，其诗的形体约有十几种，如《你莫怨我》每节5行，各行字数为4、7、7、7、4；《一句话》每节8行，各行字数为9、9、9、9、9、9、3、5，等等，每节行数和每行字数各不相同，以对应、承载不同的内容。不过，闻一多诗歌的建筑美总体来说过于整齐，有如豆腐干，给人局促、呆滞感。","keywords":"音乐美 音尺 平仄 韵脚 建筑美 富有色彩 视觉形象 直观性 绘画美 匀称 均齐","note":"考察闻一多先生所提倡的“三美”理论，不难发现，这一理论有其深刻的一面，但也有较多欠缺。警如，这一艺术规范更多强调的是诗歌创作的形式要求，对于诗歌创作的意蕴方面的要求未及考虑。我们要辩证考虑。在解答这类题目时，除了要求大家对相关知识掌握扎实，还需要大家了解相关作品，这就十分考验大家的阅读量。"},{"id":"70","stars":"★★★","title":"徐志摩诗歌的艺术特色是怎样的（26北京语言大学）","body":"一、爱情、自由和美的思想主题\n\n徐志摩诗歌主要表现的就是自己对爱情、自由、美的理解、向往与赞美。在徐志摩看来，理想的爱情、婚姻意味着“良心之安顿”“人格之自由”“灵魂之救度”，他的大部分诗歌抒写了自己对于爱情的渴望、想象与多种体验。在徐志摩的诗歌中，爱情与自由、美往往又是同义的，对爱的歌咏就是对自由、美的向往与赞美。在徐志摩的诗歌中，爱与美、自由相互渗透、生成，成为诗歌内在的情感、思想结构，诗化地表现了诗人的灵敏的爱心、性灵。徐志摩热烈追求“爱”“自由”与“美”，追求“人”与“自然”的“和谐”，这与他那活泼好动、潇洒空灵的个性及不受羁绊的才华和谐地统一，形成了徐志摩诗特有的飞动飘逸的艺术风格。因此，有人说他的人与诗都是“古典理想的现代重构”。\n\n二、“三美”的艺术实践\n\n作为新月派的代表诗人，徐志摩的诗歌具有绘画美、建筑美、音乐美。诗中之画主要靠辞藻来描画，徐志摩诗歌的辞藻大都明丽而富有色彩感。徐志摩以富有色彩感的语词，描绘经验中或想象中的某种情景，并将之化为形象的画面，明丽或暗淡，灵动或静止，传达出诗人某种独特的情感。在建筑美方面，与闻一多诗歌形体过于整伤、缺少变化不同，“他（徐志摩）\n\n至少运用和创造了十几种类型的诗形”。其中虽也有闻一多那种豆腐块式的，但绝大多数诗体是在变化中求整饬，整饬中求变化，富有现代自由感，呈现出参差错落之美。音乐美也是徐志摩诗歌艺术的最重要特点。大体而论，徐志摩诗歌的节奏轻柔舒缓，旋律和谐悠扬，生动地表现了诗人情感与精神的自由。\n\n三、追求主、客体内在神韵及外在形态之间的契合\n\n徐志摩执著地追寻“从性灵深处来的诗句”，在诗里真诚地表现内心深处真实的情感与独特的个性，并外射于客观物象，追求主、客体内在神韵及外在形态之间的契合。而徐志摩总是在毫不经意之中，在灵感袭来的刹那间就抓住了其中的契合点，并且总有新鲜的发现，既在人感觉、想象之外，又十分贴切、自然。\n\n四、意象选取独特\n\n徐志摩诗中经常出现令人惊叹的神来之笔，飞跃出除他之外，别人不能创造的、只能称作“徐志摩的意象”的独特意象。例如那支“像是春光，火焰，像是热情”的黄鹂，那匹“冲进黑茫茫的荒野”的“拐腿的瞎马”，那“恼着我的梦魂”的落叶，那刚“显现”却又“不见了”的虹影，那“半夜深巷”的琵琶。徐志摩正是用这些显示了活跃的创造力与想象力的新的意象，丰富了新诗的艺术世界。","keywords":"爱情、自由和美“三美”内在神韵 外在形态 意象选取独特","note":"徐志摩是新月派最重要的诗人之一，他的诗歌内容、手法体现了新月派诗人的整体追求，是新月派诗歌创作理念的践行者，也是最能代表新月派诗歌创作风格的诗人，大家一定要重点关注。"},{"id":"71","stars":"★★★","title":"谈谈你对中国早期象征派诗歌的认识","body":"20世纪20年代中后期，在新月诗派致力于新诗规范化的同时，涌现出了另一个重要的新诗流派，即早期象征诗派，代表诗人是李金发，重要诗人有王独清、穆木天、冯乃超、蓬子、胡也频、林松青、石民等。\n\n一、早期象征派出现的原因\n\n初期象征诗派在中国新诗坛的出现也有其深刻的历史原因，并符合文学自身发展的逻辑。\n\n（一）历史原因\n\n20世纪20年代中期，中国社会正处在一个新的历史过渡阶段，黑暗势力的反扑、反动统治的加强与民众的抗争、革命时机的成熟交织在一起，深刻、严峻的社会矛盾给一些知识青年带来了新的苦闷和感伤。他们追求、幻灭、颓废、徘徊.....这种情绪不仅是初期象征派诗歌产生的思想基础，而且也是这一诗派创作的思想基调。\n\n（二）诗歌内在动因和发展逻辑\n\n就象征诗派产生的内在动因和自身发展的逻辑来看，象征派出现的原因主要有两点：\n\n首先是现代中国新诗的发展。无论是早期白话新诗的过于浅切直露，还是“新月诗派”的过于艳丽，都表明需要新的探索和突破。\n\n其次是外国象征主义思潮在中国的兴起。当时，波特莱尔、马拉美等人的诗作及其理论被大量译介到中国，促使部分诗人的诗歌观念发生变化。\n\n二、早期象征派诗歌创作特征\n\n（一）个人化、贵族化\n\n早期象征诗派受西方现代哲学思想与艺术熏染，当时称为新浪漫主义，对时代落潮后的中国和自我命运深感迷茫，对启蒙理性失去信心。在他们心中，人不再是强有力的历史创造者、主宰者，不再是理性的崇拜者、言说者，而是迷惘、悲观的失望者，对世界、他人及自我充满怀疑与虚无情绪。所以，他们不再热衷于向大众启蒙而醉心于自我独语，沉溺于个人感觉世界，进行一种完全个人化、贵族化的创作。早期象征派诗人所提出了“纯诗”的概念，这意味着一种诗歌观念的变化：从强调诗歌的抒情表意的“表达、沟通”功能转向“自我感觉的表现”功能。\n\n（二）诗的组织上常用省略法\n\n象征派诗人在诗的组织上常用省略法，即将诗人在构思过程中由一个形象到另一个形象之间的联想过程全部省略，只将最鲜明的感官形象推到最突出的地位，让读者运用自己的想象搭起桥来。\n\n（三）强调表现人的内心感受\n\n象征派诗歌强调表现人的内心感觉，在远距离的事物中发现诗的联系，突出“暗示”在诗歌艺术中的地位，重视读者在欣赏过程中的能动作用，这些都提高了诗的艺术表现力。\n\n【李凡关键词：历史原因 新诗发展 象征主义思潮 个人化、贵族化 省略法 内心感受】\n\n【李凡&#x8BF4;：早期象征派诗人理论成就大于实践，所以是较少被考查到的内容，但我们也应该对此有一定的了解。作为第一个十年中十分重要的诗歌流派，象征派与新月派一样，都是名词解释中的常客，大家要记得关注。】","keywords":"","note":""},{"id":"72","stars":"★★","title":"李金发诗歌创作的艺术特色","body":"一、中心意象：生与死的忧伤、现实与梦幻的迷惘\n\n李金发的诗歌创作从题材上看，大致有三类。一类是歌唱爱情，表达理想与现实的冲突；另一类是描摹异国风情，反映诗人内心的惆怅；再一类以描写自然景物为主。但从思想内涵上看，其整个诗作的中心意象只有一个，就是生与死的忧伤、现实与梦幻的迷惘。诗人在创作中捕捉着灵魂的悸动，试图表达与现象世界不同的内在真实，这样，在手法的离奇与意象的新奇的背后，诗人展现的是一种情感的颓废性以及一个颓唐的世界。丑恶、梦幻、颓败、死亡等主题都进入了诗歌的表现领域。这是在思想内涵上对新诗的冲击。\n\n二、诗的组织上常用省略法，追求“暗示”效果\n\n象征派诗歌强调表现人的内心感觉，在远距离的事物中发现诗的联系，突出“暗示”在诗歌艺术中的地位，重视读者在欣赏过程中的能动作用，这些都提高了诗的艺术表现力。而作为象征派诗歌的代表，李金发的诗作，不直吐胸臆地抒情，而追求暗示的艺术效应，尤其注重将主观感受和内在感情的波动以富于象征意义的意象烘托出来，讲究意象的新奇、跳跃，因而整体上诗境朦胧、晦涩。一些诗作甚至追求意象叠加、意象跳跃的“通感”诗学效果。在诗的组织上常用省略法，即将诗人在构思过程中由一个形象到另一个形象之间的联想过程全部省略，只将最鲜明的感官形象推到最突出的地位，让读者运用自己的想象搭起桥来。这些都提高了诗的艺术表现力。\n\n三、大量地、自觉地选用了文言词语\n\n尤其值得注意的是，李金发的诗歌里，大量地，而且可以说是自觉地选用了文言词语，尽管仍给人以生硬的感觉，但影响却是深远的。正如当年文言诗词成为一种滥调时，白话词语的运用让厌倦了的读者耳目一新；现在当白话也被滥用，文言词语的适当引入，也会造成陌生化的效果，增加无形的神秘的感觉。早已被抛弃了的“学衡”派的主张在这里似乎又获得了某种历史的回应；但这仍是有不同意义的，如周作人所说，这是在白话文已经占据了主导地位以后，主动“把古文请进国语文学里来”，使其成为现代文学语言的有机组成部分。同时期的小说家、散文家（如废名、俞平伯）也在试验采用文言词语以增加文章的“涩味”，与李金发等在新诗语言上的努力表现了同一趋向。","keywords":"忧伤 迷惘 省略法 “暗示”效果 人的内心感觉 文言词语","note":"李金发在诗歌艺术的创作上并没有走得太远。这是因为李金发在新诗草创期向法国象征主义借鉴经验，创作诗歌表达个人对生命的感悟，其诗看起来意象丰富、形式新颖，抒情主体与审美趣味却是古典的。中西两种文化具有的异质性、新诗在抛弃旧诗经验后陷入持续的困境，都决定李金发融合中西的尝试很难成功。而且李金发坚持诗歌的贵族文学地位，这一观念与时代、文坛、个人际遇之间的矛盾导致他始终无法在诗艺上实现自我突破，后半生的流徙促使他最终搁笔。"},{"id":"73","stars":"★★","title":"“五四”时期散文格外丰富的原因（26中国矿业大学）","body":"“五四”时期散文的革故鼎新，如同其他文学形式一样，是相当自觉和彻底的。散文自此成为一种独立的艺术形式，实现了从古代形态向现代形态的转变。“五四”时期散文创作数量之大，文体品种之丰，风格之绚烂多彩，名家之多，都是异常触目的。散文创作的个性特征与时代特征扩张，以及由此产生的散文内容、形式风格的独创性，无疑是新文学的重要收获。而这一时期散文创作形成热潮的原因，主要有以下几点：\n\n一、文体比较自由\n\n“五四”时期散文格外发达，甚至成绩超出其他文体，原因在于这种文体比较自由。因为相对容易掌握，写的人也就比较多，现代文学的第一代作家几乎全都涉足过这个领域，在这方面显过身手，也由于散文一般较简短，一有感触，即可成篇，适合于“五四”时期思想启蒙的需要，也有利于开展社会批评和文明批评。尤其是杂文，更成为战斗的“阜利通”。\n\n二、向传统文学示威\n\n由于古代文学中散文较发达，新文学若要站住脚，务必打破用白话不能作美文的迷信，因此诸多作家往散文方面努力，也是为了向传统文学示威。\n\n三、继承了传统散文的优秀传统\n\n新文学的小说、诗歌、戏剧形式上较多舶来品，借鉴外国从头做起，自然难一些，而散文小品则与传统保留更多的联系，虽然也取法英国的随笔和其他外国散文的笔调体式，但比起其他文学形式来，散文作家创作时往往更便于也更自觉地从传统散文中寻找创新的根基。“化传统”不是照搬传统，如同朱自清所言，散文的“体制”可能承用了旧的，然而“精神面目”又颇不相同。特别是那些偏重个人性情的小品文，显然从明人小品中得到过许多借鉴。“化传统”化得好，比较适合民族审美的心理习惯，自然也有利于自身的发展。","keywords":"文体自由 向传统文学示威 继承传统散文的优秀传统","note":"“五四”时期，散文创作的个性特征与时代特征扩张，以及由此产生的散文内容、形式风格的独创性，无疑是新文学的重要收获，对此我们要有所关注。在考查散文作家作品时，也可能会考到这种转变如此彻底的原因，需要我们有所了解。虽然在考查中整体对散文考查较少，但散文相关的一些重要内容，如语丝派、语丝体等重点内容很可能以名词解释的形式进行考查，大家要关注一下。"},{"id":"74","stars":"★★★","title":"周作人早期散文创作的艺术风格是怎样的","body":"周作人形成了一整套的散文理论，中心是强调以自我为中心，提倡“言志”的小品文，认为这种小品文是“个人的文学的尖端”，“他集合叙事说理抒情的分子，都浸在自己的性情里，用了适宜的手法调理起来，所以是近代文学的一个潮头”。\n\n一、平和冲淡、舒徐自如的叙谈风格\n\n周作人的小品常将口语、文言和欧化句式杂糅调和，产生一种涩味与简单味，很耐人咀嚼。他的闲话体散文有些类似明人小品，又有外国随笔那种坦诚自然的笔调，有时还有日本徘句的笔墨情味，周作人显然对这些都有所借鉴，又融入自己的性情加以创造，形成平和冲淡、舒徐自如的叙谈风格。\n\n人们也常用“闲适”来概括周作人的散文风格，其间蕴涵着丰富的审美内容，一方面是淡而且深的寂寞之苦，另一方面又别有一种淡淡的喜悦，可以说是“苦中作乐”，忧患中的洒脱，也就是周作人所说的“凡人的悲哀”。\n\n二、“闲谈体”：富有艺术意味的闲谈\n\n周作人的散文多做“闲谈体”，似乎是在随意闲聊，所追求的是自然而诚恳，就像拉家常一样，看似散漫，却写出了浓郁的生活韵味。《苦雨》一文就是在漫不经心的散谈中写出了一场苦雨的甜味，以一种轻松、风趣而又超然的心绪告慰远方的友人。\n\n周作人常常在旁征博引之中自然而然地传授出丰富有趣的知识，或是抓住生活中一鳞半爪的现象，结合自己的所见所闻，旁敲侧击、左右逢源，充分显示了学者式散文的特色。《苍蝇》《菱角》《两株树》等篇，都是围绕一件很小的事物，古今中外、上下左右，写出种种有关知识，使读者开卷时已感受益，掩卷后尚有所思。\n\n三、选材平凡琐碎，但蕴含着深刻的哲理\n\n周作人的小品散文在那些看似平凡琐细的人生点滴描述之中蕴涵着一种对人性本质的揭示，对整个人类命运的深切关注。周作人笔下的“苍蝇”“野菜”“苦雨”“乌篷船”之类的叙述中，折射着人性、人生、社会乃至宇宙的“大关怀”。如他的《故乡的野菜》写的是自己家乡的那几种野菜以及童年的生活，但人们读了之后，从中能品味和领悟到一种与自己相关的东西：故乡是一个人永远也割不断的情思。这种蕴涵，在作者的行文中刻意加以冲淡之后，来得尤其醇厚、浓郁，令人回味不尽、感念再三。\n\n四、短小精悍、简洁老练，是真正的散文艺术\n\n短小精悍、简洁老练是周作人小品散文的一般特征。他的小品散文大都几百字到千余字，遣词用字恰到好处，体现了一种朴实、古雅、含蓄、凝重的文风。周作人的散文在结构上真正追求“散”的艺术，真正打破一般散文的写作格式，在彻底粉碎散文结构的固定模式之后，显出一种洒脱和大气，可以说，周作人散文在结构上最大的特点就是没有结构。这是一个真正的大手笔应有的内涵与气度。","keywords":"平和冲淡 舒徐自如 富有艺术意味的闲谈 选材平凡琐碎 深刻的哲理 短小精悍 简洁老练 真正的散文艺术","note":""},{"id":"75","stars":"★★","title":"冰心散文的创作风格是怎样的","body":"冰心散文的影响不在周作人之下，不过他们的创作路数与所拥有的读者并不相同。冰心那“小诗”味的“冰心体”散文\n\n更容易引起未涉世事的青年读者的共鸣与模仿。冰心的散文，主要有以下特点：\n\n一、独特的“冰心体”散文，提倡“爱”的哲学\n\n所谓“冰心体”的散文，是以行云流水似的文字，说心中要说的话，倾诉自己的真情，满蕴着温柔，微带着忧愁，显示出清丽的风致。所谓冰心“心中要说的话”，简言之即是“爱的哲学”，即宣扬自然爱、母爱、儿童爱。其中有对下层人民的同情，人生的惆怅，对祖国、故乡、家人、大海的眷念，也有基督教义和泰戈尔哲学等内容。冰心散文的思想核心，大致可归纳为“爱的哲学”。\n\n二、抒写自己刹时间涌现的感触与自然风景\n\n在冰心散文中，“爱”往往源于刹那间涌现的感触，冰心的作品也多抒写自己刹时间涌现的感触与自然风景，传达的是一段挚情，或一缕幽思，空灵而缠绵，纤细而澄澈。体现了女性作者细腻多情的一面，有着温柔缠绵感人至深的特征。然而冰心散文有时过于感性，未免给人造成情感堆积的印象。\n\n三、散文的词汇句式既保留了文言文的典雅、凝练，又适当地“欧化”。\n\n冰心的语言仍浸有旧文学的汁水，不过经过她的处理，已经完全没有陈腐气息，而别具一种清新的韵味。冰心散文之所以有魅力，在于文中有诗。她不仅在文中引用、化用古典诗词，她自己的语言也追求诗情画意，富丽精工。冰心最擅长调动各种句式：对偶、排比、错综、反复、层递、顶真、跳脱、倒装......冰心散文的词汇句式既保留了某些文言文的典雅、凝练，又适当地“欧化”，使句子更能灵活、婉转、流动，有自然跳荡的韵律感。她像一个耽于“组织”积木的乐趣的孩童，在现代散文的乐谱中反复进行着对位和声实验。在开展白话文运动刚刚几年时间，冰心能将文言文、白话文与西文调和得如此完美，难怪能引起普遍的欢迎。\n\n冰心对建立与发展现代文学语言是卓有贡献的，不过她的作品读多了也会感到格调偏旧，因为她究竟是属于以旧文学为根基的早期新文学作家。","keywords":"“冰心体”“爱的哲学”感触与自然风景 文言文的典雅 适当地“欧化”","note":"冰心散文最重要的特点就是她那独特的“冰心体”，所以，这道题目还会以“冰心的“冰心体’散文有什么特点”这样的形式出现，大家要特别注意。在作答时，大家可以从思想主题和语言形式两个角度分别分析。此外，还要注意“冰心体”这一名词解释。"},{"id":"76","stars":"★★","title":"朱自清散文创作风格是怎样的","body":"朱自清是极少数能用白话写出脍炙人口名篇（可与古典散文名著媲美）的散文家，他的重要性为很多评论家所公认，只要学校选讲范文，或编文学史，谈到现代散文的语言、文体之完美，朱自清必被提及。他的散文创作风格，主要有以下特点：\n\n一、擅长写一种漂亮精致的抒情散文，具备浓郁的抒情色彩\n\n无论是朴素动人如《背影》，或者明净淡雅如《荷塘月色》，委婉真挚如《儿女》，从中都能感到他的诚挚和正直。他既不满意陶醉于抒写琐屑小事的“言志派”，也不满意后来的所谓幽默派，写作态度严肃不苟，始终执著地表现人生。《桨声灯影里的秦淮河》《温州的踪迹·绿》《荷塘月色》是他写景抒情的名篇，都体现出作者对自然景物的精确观察，对声音、色彩的敏锐感觉，通过干姿百态、或动或静的鲜明形象，巧妙的比喻、联想，融入自己的感情色彩，构成细密、幽远、浑圆的意境。\n\n二、结构缜密，脉络清晰\n\n朱自清的散文结构缜密，脉络清晰，婉转曲折的思绪中保持一种温柔敦厚的气氛。朱自清尤其善用“文眼”，使之成为构思的核心，也成为了将作品思想与艺术辩证统一起来的“聚光点”。在《冬天》一文中，作者娓娓地描写了发生在冬天里的三个场景，本身并没有什么内在联系，但作者在文末这样写道：“无论怎么冷，大风大雪，想到这些，我心上总是温暖的。”“温暖”是作者结构全文的“文眼”，父子的亲情，朋友的友谊，夫妻的眷爱，最后都凝聚到“温暖”二字上来，使三个不相关的生活片段成为一个天衣无缝的整体。\n\n三、清秀、朴素而又精到\n\n朱自清的散文文字几乎全用口语，清秀、朴素而又精到，在20年代就被看作是娴熟使用白话文字的典范。《背影》只是质朴地叙说父亲送别儿子的一段场景，可他捕捉到一二不可言说的典型细节，注入了一股对劳碌奔波的老父的至亲深情，表现出小资产者在旧世界一生颠簸挣扎的可悲命运。这样，就很容易打动无数身受飘零之苦的人，不难解释为什么此篇能那样长久地激起读者的心潮了。","keywords":"抒情色彩 结构缜密 清秀、朴素、精到","note":"朱自清是我们课本中经常出现的散文家，我们应抓住朱自清散文“脍炙人口”的特点，体会他高超的散文创作技巧，然后由此去引申分析，理解记忆。"},{"id":"77","stars":"★★","title":"郁达夫散文创作风格是怎样的","body":"郁达夫能写出率真、坦诚、热情呼号的自剖式文字，无所隐饰地暴露赤裸裸的自己，称得上是个独树一帜的散文家。他的散文创作，主要具备以下特色：\n\n一、“自叙传”色彩浓烈\n\n郁达夫声称比起小说来，“现代的散文，却更带有自叙传的色彩了”。他的散文都在直接倾诉自身的遭遇，发出对现代文明带来的龃龉和官僚社会腐败的切齿诅咒，又带有“时代病”的感伤。他早期散文以恣肆的文字喷发激愤，只是被自己小说的文名所掩。\n\n如他以“自传”为标题的九篇散文，以时间先后为序记叙了他从童年到留学日本时的生活经历，或记叙自己的见闻或回忆自己的初恋，或怀念自己的亲友，都写得情真意切，颇有韵味，在现代作家的回忆性散文中也属上品。《还乡记》与《还乡后记》写作者回乡旅途及抵家后所见所感，表达一个穷困潦倒的知识分子对贫富不均社会的强烈不平，也有消极遁世的思想渗透着。\n\n二、写法率真自然\n\n郁达夫写散文大都在畅述自己的生活遭遇，直接抒发感伤情怀，常常像跟亲友诉苦或聊天那样，不拘形式的倾诉使你感动。读他的散文，就如同走进了他的生活。《海上通信》向友人诉说他对侵略者、资本家的恨，对人民苦难的同情，以及他的自哀自怜的伤感之情。《病闲日记》从容、坦率地记叙了他在广州的一段生活。作家恣笔写来，喜怒哀乐乃至个人隐私者兴会淋漓。这样真率自然的写法，不但在传统散文中少见，在新文学中也很独特。\n\n三、消极感较强，质量上不平衡\n\n郁达夫自哀自伶过甚，是消极的一面，也是当时一部分知识青年的共同心境。文中夹杂的一些色情描写，是他发泄悲抑、郁闷的特殊方式，自然也含有对女性的变态心理。他的散文有时支离散漫，缺少节制，不讲究章法，质量上不平衡。但郁达夫的影响长期存在，说明一种十足个性化的文学，也是能有充沛的时代性的。\n\n【李凡关键词：“自叙传”风格 率真自然 消极感 质量上不平衡】","keywords":"","note":"我们可以把郁达夫与其他作家进行对比记忆。如郁达夫写作散文常常出于愤激，并有所抗争，这是他能与鲁迅沟通的一面，但他却不似鲁迅那样抗争到底，而更多地是发泄满腹牢骚。再如郁达夫与徐志摩都以情感的宣泄见长，但郁达夫明显地不像徐志摩那样自我感觉良好，而是惆怅满怀。如《归航》《还乡记》等，在这些既纪行又抒怀的篇章里，观感见闻及随想都颇多郁闷。"},{"id":"78","stars":"★★★","title":"田汉早期剧作的特点","body":"作为中国现代话剧的奠基者之一，田汉有着极其丰沛的创造活力：他既是多产的剧作家，仅20年代就创作了20多部话剧，为“现代话剧文学”的建立做出了开拓性的贡献；同时，他又是新文化运动与话剧运动的积极参与者与组织者。田汉早期戏剧创作特征，主要包括以下内容：\n\n一、对“真艺术”“真爱情”的追求以及“美的幻灭与毁灭”两大主题\n\n（一）献身于对“真艺术”与“真爱情”的追求，正是这一时期年轻的田汉的人生选择与艺术思想，同时也可以视为他早期创作的一个总的主题。田汉早期戏剧中艺术家们在面临灵与肉、精神与物质的冲突时，都毫不犹豫地选择了前者，具有浓重的“精神至上”“艺术神圣”的色彩。不仅他们自身都是具有献身精神的“殉道者”，剧作者还特意在一些男性艺术家周围，设置女性形象，这些女性甘愿为他们，也为他们所从事的艺术献出一切。\n\n这样的情节安排或许有过于离奇之处，但剧作者所要表达的“以牺牲一己肉体的生命，成全艺术（精神）生命的完美”的生命命题，却自有其动人的力量。\n\n（二）田汉早期剧作的另一个主题是“美（爱情、艺术）的幻灭与毁灭（摧残，扭曲）”，这是因为田汉追逐“五四”思想解放、个性解放的节拍，不断加强对社会问题的关注与表现，着力表现了这一时期青年人因为现实黑暗而产生的苦闷、彷徨，以及对理想与光明的执着追求。这一部分作品更具有社会批判性，而且是越来越强烈的。\n\n二、“诗人写剧”，抒情色彩强烈\n\n田汉的早期剧作“诗人写剧”的特色是十分鲜明的。本时期的田汉本质上是浪漫主义的抒情诗人，受唯美主义影响，田汉的戏剧注重表现内心情绪与生命意识。田汉娴熟地运用直觉、暗示、象征等手法，在浓郁的抒情和神秘的气氛中显示出象征主义的深刻影响。人物常有长篇的独白，或叙事，或抒情，以此作为推动戏剧发展的要素，整体语言风格又是偏于华丽的，这样的语言追求显然有唯美主义的影响，这大大增强了田汉剧作的文学性。所以田汉此时的戏剧艺术风格表现出浓烈的诗化倾向和与之相应的音乐美、浪漫主义的传奇性，是诗与剧的统一，但也由此出现了一些结构上的粗疏和席勒式的长篇台词。\n\n三、艺术家与孤独的漂泊者形象系列\n\n在感伤情调的笼罩下，田汉早期剧作出现了两组有所交错的形象系&#x5217;：&#x4E00;组是艺术家形象。田汉早期剧作里的主人公大多是歌女、乐师、诗人、作家，或者学文学的大学生、编辑、画家、京剧演员，田汉在这些艺术家身上倾注了自己的理想，由此组成了具有田汉色彩的艺术家形象系列。另一组形象系列是孤独的漂泊者的形象。漂泊既是感伤的载体，也为感伤增加力度，也因此，感伤的漂泊者具有特定的历史内容和浪漫主义的美学价值。","keywords":"艺术与爱情 美的幻灭与毁灭 内心情绪 生命意识 “诗人写剧”抒情色彩强烈 艺术家 孤独的漂泊者","note":"相对于田汉解放后创作的戏剧作品而言，田汉早期的戏剧突出体现了“五四”时期特有的时代精神，为当时传统的戏剧舞台吹进了一股现代化的新风。同时，他善于吸收中西方戏剧创作的成功经验，并将其中的精华融入到个人的戏剧创作之中，使其戏剧作品在具有深刻思想性的同时兼具了极高的艺术性。他独树一帜地亮起了“新浪漫主义”的大旗，充分地显示出了这位具有浪漫气质的青年艺术家在戏剧艺术道路上勇敢探索的锐气和魄力。此外，虽然戏剧相关内容整体在考查中并不受重视，但初期一些比较重要的戏剧团体如南国社、比较重要的创作思潮如爱美剧等我们却要关注一下，在名词解释中很可能出现。"},{"id":"79","stars":"★★★","title":"丁西林喜剧的艺术特色","body":"丁西林是为数不多的喜剧家之一。中国现代话剧的主要代表作大多是多幕剧，而他却执著于独幕剧创作的艺术实验，并且创作了堪称典范的作品。他出现在中国现代话剧的“初期”，可是从起笔就达到了高水准，无论是戏剧的构思、人物、结构，还是语言、风格，都表现出一种艺术上的成熟，主要表现在以下方面。\n\n一、以一个喜剧家的直觉，去发掘生活中的喜剧因素\n\n不同于同时期的大多数剧作家，丁西林的创作的出发点不是社会、历史、现实中的“问题”，他不是以“惩恶扬善”的伦理道德家的眼光，而是以一个喜剧家的直觉，去发掘生活中的喜剧因素，结构成为具有“喜剧趣味”的戏剧。“欺骗”是他的戏剧（喜剧）观念、艺术上的一个关键词。研究者注意到他终身都对含有欺骗、伪装、戏仿内核的母题、故事、模式感兴趣。\n\n二、通常采用“二元三人”模式，追求和谐、互补和相对的合理性\n\n作为一个独幕剧艺术家，丁西林特别讲究戏剧的结构：他的喜剧通常采用“二元三人”模式，即将剧中人物压缩到最大限度，通常由三人构成，但不是三足鼎立，而是二元对衬对峙格局，第三者则起着结构性的作用，或引发矛盾，或提供解决。\n\n丁西林的戏剧大多“无事”，也就是说，构成戏剧冲突的双方，并不存在“正反好坏、高下优劣”的价值等级，而仅仅是观念、态度，对事物认识角度的不同所形成的差异，是二元对比、映照，而非二元对立，双方皆有可爱之处，也都有可笑之点，既是笑者，也是被笑者。这其实都是反映了剧作家的哲学与美学观的：他追求和谐，互补，相对的合理性。\n\n三、戏剧结构上特别注重“结尾”的艺术\n\n在戏剧结构上，丁西林特别注重结尾的艺术，常有出乎意料的惊人之笔。在丁西林喜剧的结尾，我们看到的是真正意义上的“皆大欢喜”。这里不论显在、潜在都不存在任何二元对立等级模式，所有愿望都完满实现，所有射线都完整闭合。丁西林喜剧结尾的巧妙之处还在于，如意结果的到来并非处心积虑、精心设置的“在情理中”，反而是水到渠成，歪打正着的“出意料外”。而这种结果，往往是剧中主要人物一手造成。\n\n四、语言幽默，喜剧感强\n\n丁西林的喜剧艺术更以语言著称。他的剧本里常有充满机智、幽默感的警句，以语言自身的喜剧性直接获取效果。在丁西林的观念中，喜剧艺术归根到底是一种语言的艺术，他也因此为现代戏剧文学语言的创立，做出了重要的贡献。\n\n【李凡关键词：挖掘喜剧因素“二元三人”模式“结尾”的艺术 语言幽默】\n\n【李凡&#x8BF4;：“机智，幽默，优雅”是丁西林喜剧留给读者的印象。他的作品人物不多，情节简单，但是戏剧构造新颖独到，\n\n语言机智幽默。作为为数不多的喜剧作家之一，他在喜剧的结构、语言和题材上都做出了不小的探索，对中国现代话剧初期有着很重要的影响，是我们考查时常常会遇到的重点。】\n\n第二个十年","keywords":"","note":""},{"id":"80","stars":"★★","title":"30年代文学创作的特点","body":"一、文学题材和表现角度的新开拓\n\n在这一文学新时期的最初阶段，出现了一大批表现个人走向社会历程的作品，茅盾的《蚀》《虹》，叶圣陶的《倪焕之》，丁玲的《一九三六年春在上海》等作品，着重反映这一过程的艰难和痛苦；殷夫的《一九二九年五月一日》等诗歌则充满激情地抒发了“个人”融合在“集体”之中的幸福、自豪和充实。正像茅盾早已注意到的那样，这时期“甚至写恋爱时也从教与恋爱的冲突到革命与恋爱的冲突了”。在文学随之“从家庭到十字街头”以后，“中国社会半殖民地化”成为作家关注的焦点。围绕这一中心，展开了多方面的题材与主题，其中，最重要的是关于中国城乡资本主义化的过程中社会各个阶层的历史命运及心理、道德、情感变迁的题材与主题。\n\n二、从抒情为主到偏重叙事\n\n文学内容的变化必然引起文学形式的变化，如果说注重个性解放与思想解放的“五四”是抒情的时代，注重社会解放的现代文学第二个十年就是叙事的时代。30年代，能够容纳较为广阔的社会历史内容的小说，特别是中长篇小说成为最有成就的文学样式，与中长篇小说具有类似的功能的多幕戏剧也获得了引人注目的成就。这一时期涌现出来的最具有文学才华的作家，如茅盾、巴金、老舍、沈从文、曹禺，所产生的最杰出的代表作品，例如《子夜》《家》《骆驼祥子》《边城》《雷雨》《日出》都集中于这两个领域。\n\n三、对时代、环境与个人性格的关系有了辩证的把握\n\n一方面，个人命运，特别是个人性格的描写受到作家的重视；另一方面，从“人是社会关系的总和”的历史唯物主义观点出发，注意从时代、环境、社会关系的影响上去把握与描写人的个性的形成与发展，描写“典型环境”的“典型性格”，成为第二个十年中后期左翼作家创作的普遍追求，成为这一时期左翼作家革命现实主义艺术水平的重要标志。\n\n四、心理刻画艺术得到了特别重视与发展\n\n这一时期叙事体作品中，心理刻画艺术得到了特别重视与发展。这自然是与作家对社会大动荡过程中各阶级的心态的特殊关注联系在一起的。因此，社会结构剖析与心理结构剖析的统一，成为这一时期心理刻画的重要特色。作家明确地揭示了心理活动的历史背景与社会阶级基础，同时注意从社会历史的运动中去把握和显示人的心理活动的发展动势，避免了静止的心理描写，并达到了一定的历史深度。\n\n五、作家独特艺术世界形成\n\n具有无限丰富性、复杂性与生动性的现实生活尽收作家眼底，题材不断扩大，作家个人艺术创作就有了更多的选择与发挥的余地。这一时期的许多作家的创作都经历了一个“不断寻找自己”的过程，在找到了“自己”以后就形成了自己独有的艺术世界，如茅盾的“都市生活世界”、老舍的“北京小市民世界”、巴金的“热情忧郁的青年世界”、沈从文的“湘西边城世界”等等。\n\n六、追求具有壮阔、厚实的力的美\n\n和前一个十年相比，这一时期继承传统、批判地吸收传统文学的影响以发展新文学的自觉程度有了很大的提高。作家对民族生活、民族性格与民族心理的把握日益准确，对民族语言的运用日益娴熟，加上对民族传统表现手段的有意识借鉴，开始出现了一批具有鲜明的民族风格与个人风格，同时又有现代品格的代表性作品，这表明中国现代文学正趋于成熟。\n\n个人风格、民族风格与时代审美特征的形成几乎是同时的。在“风沙扑面、狼虎成群”、社会矛盾空前尖锐的30年代，时代所要求的是“耸立于风沙中的大建筑，要坚固而伟大”“锋利而切实”，正是一种壮阔、厚实的力的美，而这正是三十年代文学作品普遍追求的艺术品格。","keywords":"题材开拓 叙事为主 时代、环境与个人性格的关系 辩证把握 心理刻画 独特艺术世界形成 壮阔、厚实的力的美","note":"解答这种题目，需要我们对三十年代文学创作整体都有所把握。我们可以从中国现代文学在题材、艺术手法、风** --- 格等方面走向成熟这个角度去切入分析。同时，也要注意在具体题目中可能会结合作品让大家去分析，需要大家对这一时期的代表作品有一定的了解。"},{"id":"81","stars":"★★","title":"三十年代文学形式上的变化体现在哪里","body":"文学内容的变化必然引起文学形式的变化，如果说注重个性解放与思想解放的“五四”是抒情的时代，注重社会解放的现代文学第二个十年就是叙事的时代。\n\n在30年代，能够容纳较为广阔的社会历史内容的小说，特别是中长篇小说成为最有成就的文学样式，与中长篇小说具有类似的功能的多幕戏剧也获得了引人注目的成就。这一时期涌现出来的最具有文学才华的作家，如茅盾、巴金、老舍、沈从文、曹禺，所产生的最杰出的代表作品，例如《子夜》《家》《骆驼祥子》《边城》《雷雨》《日出》，都集中于这两个领域，绝不是偶然的。\n\n而每个文学样式的内部结构变化，主要表现为以下几个方面：\n\n一、杂文和叙事体的报告文学取得成功\n\n30年代散文领域得到最充分发展的是着重于社会批评的杂文和叙事体的报告文学，抒情散文小品的成就则逊于“五四”时期。\n\n二、散文体戏剧受到追捧\n\n“五四”时期曾拥有众多读者的郭沫若、田汉创造的诗体戏剧，此时已不占据主导地位，以曹禺、夏衍为代表的，通过时代性戏剧冲突，表现具有重大意义的社会主题的散文体戏剧，代表着这一时期戏剧的最高成就。\n\n三、诗歌领域出现从抒情到叙事、从短到长的新的倾向\n\n这一时期诗歌领域着重于表现时代社会内容的革命现实主义创作，出现了从抒情到叙事、从短到长的新的倾向。茅盾解释说：“这是新诗人们和现实密切拥抱之必然结果；主观的生活的体验和客观的社会的要求，都迫使新诗人们觉得抒情的短章不够适应时代的节奏，不能不把新诗从‘书房’和‘客厅’扩展到十字街头和田野了。”\n\n四、长篇小说发展壮大，其他文体向小说渗透\n\n在小说领域，尽管短篇小说的进步也是惊人的，但作为这一时期小说艺术的代表和标志的，仍然是长篇小说。其他文体向小说的渗透仍在发展：“五四”时期由鲁迅开创的诗体小说、散文体小说，这一时期在沈从文、艾芜、萧红等作家那里得到了发展；而小说的戏剧化也是这一时期新的文学现象，许多作家都在追求把尖锐的戏剧性冲突集中在同一场景中，通过富于动作性的对话描写来展示人物性格。","keywords":"杂文 报告文学 散文体戏剧 革命现实主义 长篇小说 其他文体向小说渗透","note":"三十年代文学内容题材的变化引起了文学形式的发展变化，主要是为了适应当时的时代需求，有时会结合作品让大家进行分析，大家对此要有所了解。"},{"id":"82","stars":"★★","title":"三十年代革命文学论争有什么意义","body":"由于“左”的思想加上宗派情绪，革命文学倡导者们向“五四”时期已成名的作家开刀，重点批判清算了鲁迅、茅盾、叶圣陶、郁达夫等。他们全盘否定“五四”新文学的传统，认为鲁迅写作的那个“阿Q时代早已死去”，鲁迅创作大都没有现代意味，只能代表清末及庚子义和团时代的思想。\n\n革命文学论争经历了近两年的时间，所涉及的很多理论问题并未解决，但绝非毫无意义，主要体现在以下方面：\n\n一、促进了文学恢复和继续革命使命\n\n论争促进了鲁迅对文学理论的思考。他认为当时中国并没有“革命文学”。在他看来，文学毕竟是“余裕的产物”，不应当夸大其革命的伟力。然而当“革命文学”成为一股潮流并受到国民党政权压迫时，鲁迅从现实的角度又肯定了“革命文学”作为一种反抗性思潮的存在理由，认为这是“势所必至，平平常常，空嚷力禁，两皆无用”。作为一种应时出现的思潮，用行政和武力来禁是禁不了的。鲁迅同时批评创造社、太阳社不敢正视残酷的现实，光凭纸上写下的“打打”“杀杀”，只不过是“空嚷”而已。鲁迅对创造社诸人片面宣扬文学工具论也表示反感，特别不赞同所谓“组织生活论”“工具论”，在他看来，如果将文艺等同于政治，那就“踏着＇文学是宣传”的梯子而爬进唯心的城堡里去了”。\n\n论争的实质是，在历史的突然逆转中感到困惑与迷茫的作家和知识分子，想通过“理论斗争”来整理、思考和寻找自己，他们对“五四”时期建立起来的文学观念的颠覆或反颠覆，都是一种“重新寻找”，希望能在文学与革命之间建立某种新的\n\n联系，以便在文学上恢复和继续他们受挫的革命使命。\n\n二、促进了马克思主义传播\n\n论争还“挤”着论争双方翻译与研究马克思主义文艺论著，促进了马克思主义传播。鲁迅译介过苏联卢那察尔斯基的《艺术论》和普列汉诺夫的《艺术论》，所看重的仍是把文艺作为一种特殊的社会现象，并强调文艺揭示与认识生活的现实主义观点。茅盾比鲁迅更明确赞成革命文学的倡导，但同样也反对文学的工具论。他批评创造社、太阳社某些作者“仅仅根据了一点耳食的社会科学常识或是辩证法，便自负不凡地写他们所谓富于革命情绪的＇即兴小说’”，因为忽略文艺本质而不可避免地走上了标语口号化的路。\n\n三、推动了“左联”的成立\n\n革命文学论争引起了国共两党的注意。1929年9月，国民党召开“全国宣传会议”，提出以“三民主义的文艺政策”来清理统一文坛，扼杀“革命文学”“无产阶级文学”。共产党则指示创造社、太阳社停止攻击鲁迅，让他们同鲁迅以及其他革命的“同路人”联合起来，成立统一的革命文学组织，对抗国民党的文化围剿。这样，历时近两年的论争便停止了。参与论争的各方冷静下来，寻求共识，组成了一个组织，即从1929年底开始筹备并于1930年3月2日在上海成立的“中国左翼作家联盟”，简称“左联”。","keywords":"文学革命使命 马克思主义传播“左联”成立","note":"三十年代革命文学论争主要有三方面的意义，一是文化批判的意义，对“五四”以来的文化进行重新估价，为文化及文学思想划了一个新的时代，见上述第一点。二是理论建设的意义，把马克思主义文艺理论中国化，见上述第二点。三是队伍建设的意义，促进了左翼文学队伍的团结，为“左联”的成立作了思想上和组织上的准备，见上述第三点。此外，革命文学论争是考查频率较高的一个名词解释，大家要注意积累。"},{"id":"83","stars":"★★★","title":"“左联”对中国现代文学产生了怎样的影响","body":"一、促进了马克思主义的传播\n\n“左联”成立后的第一项重要工作，就是成立马克思主义文艺理论研究会，加强对马克思主义文艺理论的翻译、介绍和研究工作。马克思主义经典文艺论著早在20年代中期就介绍到中国，无产阶级革命文学论争更推动了马克思主义文艺理论的翻译与传播。\n\n30年代马克思主义理论深入到中国社会科学的各个领域，建立起马克思主义的新哲学、新史学、新经济学、新教育学，等等，成为强大的历史潮流。用马克思主义的批评方法去观照现存文学的一切，建立马克思主义文艺批评的历史任务正是在这一历史时期提上了日程，并取得了最初的成果。\n\n二、加强了与世界文学的，特别是世界无产阶级文学运动的联系\n\n“左联”自觉地加强了与世界文学的，特别是世界无产阶级文学运动的联系。首先，以极大的努力输入苏联及其他国家的文学作品。鲁迅也先后与郁达夫、茅盾等主编过《奔流》与《译文》杂志，主要译介了易卜生、惠特曼、托尔斯泰、莱蒙托夫、密支凯维支、裴多菲、契诃夫、果戈理等作家的作品。1935年郑振铎主持编辑的《世界文库》，规模宏大，轰动一时。各种西方名著如《死魂灵》《浮士德》《十日谈》《吉诃德先生》《忏悔录》《简爱》《贵族之家》等等，大都于本时期介绍到中国；与此同时，也有一部分中国现代作家的作品翻译介绍到国外，获得世界的读者。\n\n三、积极推进文艺大众化运动\n\n“左联”还积极推动文艺大众化运动。“左联”成立后，即设立文艺大众化研究会，并于1931年11月在题为《中国无产阶级革命文学的新任务》的“左联”执委会决议中，明确规定“文学的大众化”是建设无产阶级革命文学的“第一个重大的问题”。此后一年多的时间里，《北斗》《文艺新闻》《文学导报》等刊物发表了许多参与大众化问题讨论的文章，大众化问题成为左翼文学理论的焦点之一。\n\n四、推动了现实主义创作手法在中国发展\n\n以“左联”为核心的无产阶级文学运动非常重视创作方法的革新，积极推行富于革命意味的新的现实主义，从新写实主义到“唯物辩证法”再到“社会现实主义”，虽然“左联”对现实主义的理解和把握有一个曲折的历程，但其对现实主义手法的推广明显起到了推动作用。","keywords":"马克思主义传播 世界文学联系 文艺大众化 现实主义","note":"“左联”在中国现代文学史上产生了深远的影响，是三十年代中国文坛上一个举足轻重的作家组织，对中国革命** --- 和文学创作都产生了很大的影响，是历年考查的重点之一，大家一定要认真把握。同时，“左联”在名词解释中也是高频考查内容，大家要注意积累。"},{"id":"84","stars":"★★","title":"“左联”在现实主义创作方法的探索是怎样的","body":"以“左联”为核心的无产阶级文学运动非常重视创作方法的革新，积极推行富于革命意味的新的现实主义，然而其对现实主义的理解和把握却经过曲折的历程。\n\n一、“唯物辩证法的创作方法”\n\n革命文学倡导初期，曾经在“五四”文坛上极力张扬浪漫主义的创造社成员，此时却激烈地宣布告别浪漫主义。他们将创作方法与政治立场等同起来，独尊现实主义而排斥其他的创作方法。\n\n1932年4月，瞿秋白、茅盾等为华汉的小说《地泉》三部曲重版作序，对“革命的罗曼蒂克”进行了清算，否定将人物描写变成“时代精神号筒”的简单化写法，以及概念化、公式化的弊病，提出新兴文学应当唾弃这样的创作方法，坚决地走向“唯物辩证法创作方法”。\n\n所谓“唯物辩证法”的创作方法，强调的是世界观对创作直线式的决定作用。但由于“唯物辩证法”的创作方法将世界观等同于创作方法，在批判“革命的罗曼蒂克”的创作思想情调时，连作为基本创作方法之一的浪漫主义也给否定了，创作上的主体性也不容表现了，这也使得当时众多作家都错误地以为不能再写自我的情感心理，只能写群像，写“我们”，公式化、概念化的弊病还是很普遍。\n\n“唯物辩证法创作方法”的推行也受到了一些作家的抵制，而这些作家也遭受到了批判。这种批判从政治上看是有其历史缘由的，不过这样一来本来的理论探讨就上升为政治论争，结果在强化创作中的政治性和世界观的重要性的同时，也强化了“唯物辩证法创作方法”的消极影响。\n\n二、“社会现实主义”\n\n以“左联”为核心的无产阶级文学运动，在其后期又从苏联引入了“社会主义现实主义”的口号，作为一种新的创作方法，其影响比以往其他方法更加深远，甚至一直延续到当代。\n\n“社会主义现实主义”要求文艺家从现实的革命出发，真实地、历史地、具体地描写现实，这种艺术描写的真实性与历史具体性还必须与用社会主义精神从思想上改造和教育劳动人民的任务相结合。\n\n这个口号的提出，是为了清算“拉普”机械论的文学思想以及“唯物辩证法创作方法”的偏误，所以有强调“写真实”的一面。但周扬介绍这一创作方法时，仍然强调文学的政治性、教育性，强调作家的立场、世界观，不太重视现实主义问题。\n\n不过，文章还是批评和反省了左翼文学长期存在的一种偏向，即“忽略了艺术的特殊性，把艺术对于政治、对于意识形态的复杂而曲折的关系看成直线的、单纯的”。\n\n最后，经过以上两次创作手法的推广，左翼文坛对创作方法的探索表现为：既吸收了“社会主义现实主义”中有利于现实主义恢复与发展的因素，又不能从根本上摆脱”左倾”机械论的束缚。","keywords":"“唯物辩证法”“社会现实主义”","note":"“左联”对现实主义在中国的推广起到了很重要的作用，但也要注意到，受限于当时的时代环境，这种推广也不是一帆风顺的，大家要结合具体内容，辩证地去分析。"},{"id":"85","stars":"★★★","title":"试分析左翼小说的“大众化”倾向","body":"【答题框架】\n\n通过三次文艺大众化讨论，左翼作家们在理论上已经认识到文艺大众化的重大意义，并在创作实践中力图解决文艺脱离群众这一问题，显示了左翼作家的可贵努力。左翼小说的“大众化”倾向，主要表现在以下方面：\n\n一、左翼小说在题材上具有吸引力\n\n左翼作家主张文学要贴近劳苦大众，因为劳苦大众在当时的文化水准决定了他们消费的不是充满革命的生硬的堆砌词藻的作品，他们所接受和消费的作品应该是能抓住大众情感的通俗的文学作品。因此左翼小说绝大多数是有故事的，这些故事不像五四小说那样是经过提炼选择的，也不像其那样喜欢在普普通通的事件中挖掘意义，而是保持着故事“本事”的原生态叙述者仿佛有满肚子的故事要告诉读者，告诉世人，并且由于视野的开阔，其故事内容有许多不是一般读者所能亲身经历的如革命、战争、充满激情的恋爱、都市里的各种秘密，读者在这里满足了他们的求知欲和历险欲。左翼小说因而具有比较强烈的可读性，但这种可读性只是它的手段而不是目的，它的目的是要通过精彩的故事改造读者的精神世界，题材的吸引力进而又影响到许多读者对于生活道路的选择。可读性一直是新文学小说的一个软肋，左翼小说在先进性与可读性的协调上所进行的探索，对于30年代以后的小说创作是不无启迪意义的。\n\n二、在人物形象塑造上，左翼作家在阶级分析的同时注重对大众灵魂的开掘\n\n30年代中后期，作家们纷纷从自己最为熟悉的生活领域去挖掘创作的题材较好地化解了真实性和倾向性之间的矛盾。一方面，作家充分调动起自己的生活经验，利用生动的语言和真实的细节塑造出原汁原味的人物形象，避免了单调沉闷的概念化倾向，作家对劳苦大众的真实人性的开掘往往成为作品强大艺术感染力的根本所在；另一方面，在严峻而残酷的现实生活面前，先前那种革命乐观主义情绪已逐渐为深刻的思考所替代，大众身上的落后性和阴暗面在左翼现实主义创作中得到了正视。\n\n左翼作家自觉地运用阶级分析的方法来进行创作，人物的阶级特征与作品的政治思想意义仍是他们最为关注的主题。家们驱遣一支审时代之悲之笔，活画出一幕幕人间悲剧，他们所力求做到的，是凭借对正确世界观的把握，使读者在落后的事件和人物上获得明确的时代的概念和展望，作品的革命主题由此得到含蓄而有力的表达。不过，单单从经济层面、政治层面刻画大众形象的方法也有所突破，大众在精神上的沉重负担得到了表现。在艺术上，看不见作家明显的外部激动，对大众形象的描写具有充分的客观性。对大众灵魂的开掘使作品获得了内在的生命力；阶级分析的方法使作品超越了宣传层次，有了更广阔的延展空间。\n\n三、在叙述技巧上，三十年代后期，左翼作家普遍加强了叙述技巧\n\n左翼小说的节奏一般比较快，有时还采用电影的叙述手段，甚至把真实的文件、新闻报道、流行歌曲都直接列入文本，因此，左翼小说既是流行的，又是大众的。把本来就富于吸引力的题材叙述得引人入胜，这是一种对读者的尊重，是在写态度上的走入民间，使读者在阅读时产生平等的亲切感。左翼文学也因此从通俗文学那里争取了大量的读者，扩大了左翼文学的影响。左翼小说在叙述学方面的探索大大丰富了新文学的表现能力，使新文学小说本已淡漠的叙述力又得到了恢复。比之五四小说，左翼小说更为全面地吸收了西方19世纪以来小说的叙述技巧。","keywords":"上具有吸引力 故事“本事”的原生态 强烈的可读性 人物形象塑造 阶级分析 对大众灵魂的开掘 生活经验落后性和阴暗面 叙述技巧 普遍加强","note":"左翼小说的大众化倾向，从本质上来说，是与左翼作家的创作理念联系在一起的。他们认识到了文艺大众化的意义，并在创作实践上解决文艺脱离群众这一问题。这种倾向，具体表现在左翼小说的题材、人物塑造和叙述技巧这些方面。大家在答题时，分别从这三个角度入手进行分析即可。"},{"id":"86","stars":"★★★","title":"结合具体作品，论述1930年代左翼文学的艺术成就","body":"【答题框架】\n\n左翼文学以高亢激越的旋律奋力呐喊，创造了“红色的三十年代”，成为当时中国最富有战斗力和号召力的文学思潮和文学实践，使文学以前所未有的激进姿态，加入了历史的进程。总体来看，左翼文学的艺术成就，主要表现在以下方面：\n\n一、强化社会小说文体，并做出多方面探索\n\n左翼小说继承“五四”传统将社会小说文体加以强化，以其阶级性、民族性的活力、吸引了当时激进文学青年中的英才。不仅有表现农村破产的乡土小说出现，也产生了将城市作为政治斗争舞台来看的都市小说，茅盾的《子夜》就是在此过程中产生的重要的成果之一。\n\n左翼小说家对30年代中国小说的文体，也做了多方面的探索。社会剖析小说之所以成为当时现实主义小说中的“正格”的大势之下，左翼文学在深化中又发生变异，主导性的小说人物、环境的典型论，创作方法论，并没有束缚萧红、张天翼、丁玲、端木蕻良等一大批有才情的作家，在小说的抒情性质、讽刺性质和心理性质方面做出细微而大胆的试验。萧红的《呼兰河传》把诗体小说甚至推向“象征”层面。张天翼尝试过各种小说叙述“话语”，模拟纯客观叙述，可以用更多的对话，直视人物心理的可以采用独白，述事话语与表意话语有各种搭配，口语叙述和文人语叙述也各有其长处。因此，左翼小说的各种“正格”的变体，也经常出现。\n\n二、文学题材扩大，新的题材不断涌现\n\n左翼十年，取材的天地也扩大了。可以毫不夸张地说，十年中，现实生活的各个领域都在文学中得到了表现。这首先是农村题材的显著突出，抗日题材的大量涌现；知识分子仍然是革命文学的描写对象。茅盾的《蚀》三部曲，反映大革命前后知识分子的生活和思想状态，消极成分多了一些。同样是知识分子题材，而在寓意上却有本质的变化；这种变化，是受革命深入时期的时代特点所制约的结果。张天翼的《包氏父子》、蒋牧良的《集成四公》等小说，写小市民的灰色人生，讽刺中流社会的无聊生活，为革命文学的取材开辟了多方面的领域。此外，工业生产、工人生活方面的题材也随着初期无产阶级革命文学进入左翼文学领域。有郭沫若的《一只手》、冯乃超的《抚恤》、龚冰庐的《炭矿夫》、华汉的《马桶间》、刘一梦的《失业以后》、冯铿的《突变》等都是典型的代表。\n\n三、艺术水平提升，情节生动丰富，人物典型化方法成熟\n\n在创作实践中，左翼文学作家逐步克服初期文学作品中标语口号、公式化概念化的缺点，注意了艺术构思，以情节的生动和丰富吸引读者。因此很多作品以波澜起伏的矛盾代替了干巴巴的议论，生动的描写代替了平铺直叙。萧红的《手》，写一个染的女儿因为一双手被蓝靛浸蚀成了黑色，而在学校里处处受歧视，连哭泣都没有地方，最后在风雪交加之中，不得不离开学校回到家里。小说写得回肠荡气，悲切动人，作者没有发一句议论，而人物的阶级关系、对资产阶级学校的批判自然地流露出来。\n\n除了情节上的精进之外，这一时期左翼文学的典型化手法也逐渐成熟，留下了许多不朽的艺术形象，如《子夜》里就有不少呼之欲出的典型，书中的吴苏甫，尤其是不可多得的典型。\n\n四、具有崇高美和悲壮美，带给读者全新的审美愉悦\n\n在三十年代社会转型期，左翼作家进行最根本的价值观、善恶观、美丑观的颠覆后，他们的作品洋溢出浮躁凌厉之气，表现出崇高美和悲壮美的特征。他们在与专制暴政的斗争中，表现出宁折不屈、刚烈骁勇的精神品格，作品具有强烈激越的反抗性，显示出雄浑力度的壮美属性，如丁玲“左转”之后的代表作品《水》，描写农民与洪水的惊心搏斗，以及比那洪水还有威力的革命洪流，显示出了一种雄浑悲壮的美。\n\n左翼小说的审美特征明显地带有革命年代的特点，因而使中国新文学有了新的美学风格和特色。那就是一种力的美，一\n\n种昂扬斗志、勇往直前的崇高美和悲壮美。这种粗暴却充满着力量的声音打破了悲观、彷徨、苦闷的时代氛围，起到了革命号角的作用。这带给读者全新的审美愉悦，使三十年代文学格局焕然一新，使左翼文学取得繁荣局面。","keywords":"社会小说文体 多方面探索 题材扩大 艺术水平提升 情节生动丰富 人物典型化 崇高美悲壮美","note":"三十年代的中国文学，有两大文学思潮尤其引人注目，一个是左翼文学思潮，另一个便是自由主义文学思潮。我们在对这两个思潮中的代表作家有一定的认识的同时，也要从宏观上对这两个思潮的艺术成就有所把握。相较于“五四”时期的小说创作，三十年代的左翼小说无论是从内容上还是从艺术上都表现得更加成熟，这无疑为中国现代文学增添了新的内容，大家可以从文体、题材、情节和人物、艺术风格这几个角度展开讨论。"},{"id":"87","stars":"★★★","title":"如何评价新月派在三十年代的理论","body":"自由主义与马克思主义两种文艺思潮的论争贯穿30年代，比较重要的是左翼作家与“新月派”的论争。关于新月派的理论，我们主要有以下认识：\n\n一、抹杀文学的社会阶级基础\n\n新月派的目的在根本否定无产阶级文学存在的理论基础，他们首先打出“人性”的旗帜，抹杀左翼文学家所看重的文学的社会阶级基础，以“永恒的人性的文学”否定“无产阶级的阶级的文学”。新月派争论的焦点，不在于肯定或否定“人性”的存在，在于梁实秋等人以人性的普遍存在论来反对阶级论。\n\n在《文学是有阶级性的吗？》一文中，梁实秋就竭力说明资本家和工人尽管有不同之处，然而在人性方面并没有两样，例如，生老病死的无常、爱的要求、企求身心的愉快，而文学就应当表现这基本共通的“人性”。他认为，“人生有许多方面都是超阶级的”，文学创作不应受“阶级的约束”，才能成就伟大的作品。显然，梁实秋讲“人性”的普遍性和共通性是针对当时已在主导文坛空气的“阶级论”，否定无产阶级文学。\n\n二、文艺思想具有保守倾向与贵族色彩\n\n新月派第二面理论旗帜是“天才论”。梁实秋认为：“一切的文明，都是极少数天才的创造”。他进而把文明与资本主义制度联系在一起，宣称攻击资本主义制度即是反抗文明，优胜劣败的定律注定“反文明”的无产阶级势力“早晚要被（资产者的）文明的势力所征服”。在梁实秋的心目中，革命文学也好，左翼文学也好，都不过是“五四”时期浪漫主义文学的延续和发展，所以他有时称左翼文学为“伤感的革命主义”或“浅薄的人道主义”。梁实秋的“天才论”典型地表现了新月派自由主义作家及其文艺思想的保守倾向和贵族色彩。\n\n不过梁实秋也看到了主流派文学存在的公式化、概念化等弊病，看到了革命文学倡导者尽管宣称要割弃“五四”文学的历史联系，宣布突变，其实他们仍是变形了的浪漫主义。从文学思潮的流脉看，梁实秋的这种批评和判断还是有眼光的，后来左翼文学也反省过“革命的罗曼蒂克”倾向。","keywords":"社会阶级基础 保守倾向 贵族色彩","note":"作为自由主义的代表，新月派与左翼文学作家的争论很能代表自由主义与马克思主义的争论，二者很可能会作为对比出现，需要我们有所了解。"},{"id":"88","stars":"★★","title":"谈谈你对三十年代两大思潮的论争中自由主义作家文艺观的认识","body":"一、两大思潮的论争\n\n30年代文艺思想领域呈现出极为活跃的状态：第一个十年里纷纷传入中国的各种文艺思潮，经过历史的筛选，与本国文艺实践运动相结合，形成了马克思主义与自由主义两大文艺思想相对立的局面。两大思潮之间论争频繁展开，其激烈程度远远超过第一个十年。这是与这一时期政治斗争尖锐化程度相适应并由其所决定、制约的。这一时期两大思潮论争的主要有以下特点：\n\n论争始终集中在文学艺术发展的外部关系-诸如文艺与阶级的关系，文艺与政治革命的关系，文艺与生活、时代的关系，文艺与人民的关系上，而文学艺术内部关系问题、美学范畴问题，却未能得到全面的探讨；每一个提上日程的争论问题，都未能充分展开，问题的讨论显得浮光掠影。马克思主义文艺思想在与自由主义文艺思想论争的过程中，在不断克服自身的左倾幼稚病的过程中，不仅成为无产阶级文学运动的指导思想，而且对众多追求革命的文学家产生巨大的吸引力，构成30年代文学的主潮；而自由主义文艺思潮在理论和创作实践上也有不可忽视的实绩，并在文学史发展的大的背景下对主流派文\n\n学起某种补充的作用。\n\n二、对自由主义作家文艺观的认识\n\n（一）反对“为文艺而文艺”，以自己的方式思考社会，具备一定的积极作用\n\n这一时期自由主义作家在理论上的主要代表人物梁实秋、朱光潜、沈从文等，在他们的理论宣言中，都公开地表示反对“为艺术而艺术”。这反映了半封建半殖民地落后国家的自由主义作家不可能完全无视民族、国家的呼唤，他们也是以自己的不同于革命的作家的方式，通过也许是更为曲折的道路，与自己的民族、人民以及社会现实生活保持着一定程度的联系。他们也在以自己的方式思考社会人生，探求民族复兴的道路。在动荡变幻的30年代，尽管自由主义知识分子处于严重的精神危机之中，但这一时期他们的文学主张却很少受到西方世纪末文学的消极影响，较少颓废、享乐的色彩，而显示出某种严肃性：严肃地自我内省，严肃地表现、思考社会人生。\n\n（二）夸大思想启蒙作用，与社会制度根本改造对立，与当时的主潮相对立，具有消极影响\n\n自由主义作家重视与强调文学“洗刷人心”、再造民族灵魂的作用，在这一点上，与“五四”时期的文学启蒙思想是有某些继承关系的。“五四”时期“改造国民性”的文学主题在这一时期某些自由主义作家的文学作品里，得到继承与发展，并不是偶然的。\n\n但是，如果说“五四”思想革命运动中夸大思想启蒙作用还只是一种理论偏差，在以根本改变社会制度为目标的政治革命已经成为时代中心的30年代，把社会问题的症结归之于“人心太坏”，并与社会制度根本改造对立起来，就显得不合时宜。这些自由主义作家既不满意国民党政权，更对日益发展的工农力量心怀疑惧，他们尽管保留着反封建的思想革命要求，在一定程度上可以承认文学的思想启蒙、道德进化作用，但对政治斗争（特别是作为政治斗争集中体现的党派斗争）却采取贵族式的不介入的清高态度（事实上却不可能不介入），绝对不能容忍文艺成为政治斗争的一翼。他们一再申说文艺的超功利性与独立性，正是这种抗拒心理的反映。自由主义文艺理论家们反复强调的“超脱现实”的原则，即所谓“艺术和实际人生的距离”，在美学上自有一定的积极意义，反映了艺术创作的某些规律；但作为一种强调独立的文艺观，又是与当时强调现实批判和社会功利性的文学主潮相对立的。","keywords":"政治斗争尖锐化 马克思主义文艺思想 文学的主潮 自由主义文艺思潮 补充作用严肃性 抗拒心理","note":"三十年代两种文艺思潮对立论争，马克思主义文艺思想为主潮，但自由主义文艺思潮的补充作用我们也应该关注到。自由主义文艺思潮有其积极的一面，但这一时期自由主义作家是在承认国民党政权的前提下，提出有限度的批评和反对意见，与“五四”时期启蒙文学家完全站在反对封建军阀政权的对立面不同。因此也有一定的消极影响，我们要辩证看待。"},{"id":"89","stars":"★★★★","title":"试分析30年代的都市书写","body":"30年代的作家们都曾用不同的方式叙说和想象着中国的都市生活，表达他们特有的都市感觉和体验，以不同的文学状貌呈现出现代化进程中都市的不同侧面，这具体可以从以下角度进行讨论：\n\n一、茅盾的都市书写\n\n（一）叙事模式：史诗性现实主义写实与普遍的人性关怀相结合\n\n（1）茅盾的都市书写具有一种史诗性的现实主义写实，这是他叙事模式的一个重要层面。茅盾始终将“大规模的描写中国社会”当作自己一生的艺术追求，始终遵循着社会发展的历史逻辑，把发生在各个不同历史时段的重大历史事件连缀成一个时间序列，揭示出社会发展规律。因此，从小说空间意识来看，他的作品被紧张的时代氛围笼罩着，存活于其间的人物、时间、场景和各种意象都跳动着时代的脉搏。在《子夜》这部集大成的作品中，他把目光聚焦于资本主义文明较为发达的具有现代性特征的上海，这座都市的方方面面，都由他独具匠心地熔于一炉。\n\n（2）茅盾都市叙事模式的另一个重要层面即是内容为骨架，情感为血肉，包含着对普遍人性的关怀，潜藏着作家深沉的情感。他对普遍人性的关注，显然是西方人文主义与“五四”个性解放思潮合理作用的结果，尤其是托尔斯泰式的人道主义与周作人的“人的文学”观念对其有直接影响。从《蚀》《虹》《野蔷薇》，到《子夜》《水藻行》，再到《霜叶红似二月花》《腐蚀》，他的作品中都包含着各种层面的对人性的关怀与追求：一是塑造人性“向善的焦灼”。他笔下的时代女性虽然性格各异，但都有一种向善的本能冲动；二是母性的流露。母性可以说是人性的重要基础，具有本源性的特点。茅盾笔下的梅行素、婉卿和王诗陶等的身上都有浓厚的母性意识；三是对性爱的自然追求。性爱是人类的自然追求，是人的本能之一。对此，茅盾同样给予了充分的肯定。\n\n（二）人物塑造：关注社会的“人”，在激烈的时代矛盾中刻画人物\n\n（1）茅盾侧重于关注群体的“人”，社会的“人”，他习惯于在写出人物的阶级特性以后，再关注他们“个人的特有的个性”。所以，茅盾笔下的人物总是打上阶级的烙印。通过他笔下的人物，我们不仅可以看到他们所代表的政治的、意识形态的倾向性，而且也认识了他们所属的时代。\n\n（2）茅盾擅长在激烈的时代矛盾中刻画人物。在小说《子夜》中，吴荪甫性格中的精明能干、刚愎自用、凶狠冷酷无不是在矛盾之中展现的。他与买办资本家赵伯韬之间、与工农群众之间、与其他资本家之间的矛盾冲突既是情节发展的推动力，更是读者窥测人们内心世界的“入口”。同样地，在小说《虹》中人物性格同样是在深刻的矛盾与张力之中得以丰满化。从梅女士身上，我们既看到旧家庭伦理观念对她的束缚，又鲜明地感受到新思潮对她心灵的唤醒。\n\n（三）叙事语言：华丽铺陈，细腻生动，擅长场面描写\n\n茅盾有着丰富的外国文学素养，这使得他的叙事语言既融会了西方叙述语言，又没有过度的欧化色彩；同时，他又有着深厚的古典文学素养，这也使得他的小说语言华丽铺陈、细腻生动，人物语言与叙述语言都能随故事和人物的性格发展而具有不同的特色。此外，茅盾还擅长场面描写，他笔下的场面，往往境界开阔，人物众多，层次明晰。在叙事语言上，茅盾所体现出来的特征与他一贯的理性倾向和严谨的创作态度有着密切关系，更与他对传统文学和俄法文学的吸收有关。\n\n（四）叙事态度：以政治眼光观察都市，更多表现都市“恶”的一面\n\n尽管茅盾将笔墨伸入到了上海的各个角落，展现了大上海的丰富多彩和各阶层人士的生活以及各种矛盾，其都市生活的丰富性和复杂性在左翼都市小说中是首屈一指的。但这种丰富性和复杂性大多处在政治意识的支配之下，茅盾更多的是用政治眼光来观察都市，这便影响了他对大上海进行更深入的体验，都市生活在他的笔下被处理为对立的两极：一面是都市上流社会的尔虞我诈，勾心斗角，荒淫、奢侈、空虚、无聊的生活，另一面则是都市下层工人的贫困和反抗。小说仅从政治层面来表达对都市现状的批判，更多的是展现都市“恶”的一面。\n\n二、老舍的都市书写\n\n（一）叙事视角：采用平民视角，从文化角度解剖社会\n\n老舍作为土生土长的老北京人，自幼生活在大杂院中，对社会底层的市民生活非常熟悉。因此在写作时，老舍往往采用他那种来自平民的视角和观察方式，指出小市民人性的缺失，将批判的笔锋指向造成小市民人性扭曲和缺失的都市文明。\n\n而在创作中，老舍创作的支撑点更多的是在文化方面。相比于二三十年代主流文学对现实社会作阶级剖析，老舍始终用“文化”来分割人的世界，他关注特定“文化”背景下“人”的命运。因此，老舍的都市小说，无论是都市景观、风土人情，还是人物的举止语言都明显地充满了一种“京味儿”。这种“京味儿”不仅充溢着浓郁的地域文化特色，如北京四合院和胡同，各种职业活动等，还表现了天子脚下传统的生活方式和文化心理，讲究“官样”，讲究体面、排场、气派，讲究礼节，固守成规，性格懒散、苟安、懦弱等。可以说老舍不仅为我们精心勾画了北京的自然风光，全面展示了北京市井巷里间的民\n\n风民俗，更是深刻地揭示了市民群众的内在心态。\n\n（二）人物塑造：关注个体的人，从文化视角解剖人\n\n（1）老舍塑造人物，关注的是个体的“人”，关注的是个体的性格、命运、精神状态和癖好等。他的笔触往往直指人物的灵魂深处，挖掘出他们身上的性格弱点，揭示他们深层次的精神悲剧。老舍不像茅盾以阶级划分方法来确定人物的三六九等，而是以文化为标准将他们分为老派市民、新派市民和正派市民。在剖析这些市民阶层性格特征的同时，老舍将重点放在对老派市民性格中的文化痼疾的批判上。如老马、张大哥、祁老太爷等，他们身上所流露出来的精神弱点都是几千年的儒家传统文化所遇留下来的。\n\n（2）老舍都市小说在人物心理刻画上更为冷静，更为不动声色，他以“含泪的微笑”从文化的视角解剖着北平市民阶层的庸人性格和庸人哲学。如《离婚》用幽默的笔调描绘了市民社会的凡庸空气和“好人”性格：张大哥的好脾气、好人缘和他的敷衍庸碌、苟且因循的人生哲学让我们领略了老舍对国民精神弱点的批判和嘲讽。\n\n（三）叙事语言：采用俗白浅易的口语，构建以京味语言为基础的特殊的语言体系和语言风格\n\n老舍曾被人称作语言艺术大师、幽默大师、“京味小说”的源头。他追求生活化的幽默，追求艺术表现上的节制和分寸感，使其作品产生喜剧感与悲剧感、讽刺性与抒情性的渗透和结合，从而获得一种丰厚的内在的艺术力量。而这种独特的文体风格自然与其叙事语言特征分不开。老舍大量加工和运用北京市民俗白浅易的口语进行创作，构建以京味语言为基础的特殊的语言体系和语言风格。据一项语言学者所做的统计，在《骆驼祥子》中，总字数为107360个，老舍只选用了2413个不同的单字，大大少于常见小说的单字用字数量。而其中又有621个极常用的单字因被频繁使用，已经涵盖了作品总字数的90%。\n\n（四）叙事态度：以一种温和的态度，表现自己对北京复杂的迷恋\n\n旗人出身的老舍与北京的关系是血肉相连的，作为一位来自北京社会底层的作家，老舍不仅看到北京市民的苦难生活，而且亲身经历了那苦难，但他对造成他诸多痛苦的北京城不是深恶痛绝，而是笑骂。这种生活态度源于他传统的宗法观念，代表的是城市贫民心理：随波逐流，安分守己。因此，当京派那些“侨寓”都市的乡土作家用一种反感和仇视的眼光去发现北京的肮脏、卑劣、丑陋，并加以嘲讽的时候，老舍赋予北京都市的却是一种温情。老舍深切地爱恋着北京，执迷于这座在他文学想象中占据重要地位的城市，更是将对北京这种无法言说的爱比作是对母亲的爱，这份爱只有当“独自微笑或落泪”时“才足以把内心揭露在外面一些来”。老舍的都市作品中不缺乏对北京小市民劣根性、北京都市生活的批判，不过这种批判正是源于老舍对北京无以复加的爱。感时忧国的文人传统、艺术家的良知这些特质使老舍小说中的北京想象并没有只是单纯地表现北京令人迷恋的一面，而是带着一种复杂的情感潜心探索、深刻挖掘城与人的灵魂。\n\n三、新感觉派的都市书写\n\n（一）叙事模式：吸纳西方现代派表现形式与文体，表现中国人特有的都市感受和情绪\n\n新感觉派以“感觉”为媒介，刻意颠覆故事情节的连贯性和人物性格的完整性，大量运用通感手法，明显借鉴电影蒙太奇手段，对人的直指欲望的心理和感受的异乎寻常的关注等等，既造成“陌生化”的艺术效果，又完全打破了中国传统小说全知全能、首尾贯通的叙事模式，还与完成了叙事模式现代转变的“五四”小说大异其趣，比起郁达夫、郭沫若带有现代主义色彩的心理分析小说，新感觉派对现代主义的理解更加深入、开阔和大胆。他们吸纳西方现代派的表现形式和小说文体，传达的是现代中国人特有的复杂的都市感受和情绪：这种交织了困惑、狂躁、迷恋甚至还有憎恶的意绪才是最真实的历史感兴-这毕竟是一个前所未有的历史进程。\n\n（二）人物塑造：表现被都市生活异化了的“都市人”和他们的精神困境\n\n新感觉派还表现了消费娱乐的都市生活造就的纸醉金迷的都市人和他们身上满是“市气”的精神特征。这突出表现在他们对待情爱的态度上：《风景》《被当作消遣品的男子》《白金的女体塑像》《礼仪和卫生》《两个时间的不感症者》等许多作品里，爱情的神圣和崇高荡然无存，取而代之的是不加掩饰的情欲。无论男性还是女性都以一种令人吃惊的胆量和速度追逐、攫取片刻的刺激和快感，不是生命力，而是动物性的兽欲在泛滥。这里，我们看到的是传统的伦理道德、价值观念在崩溃，物欲在横流，都市生活以惊人的速度异化和挤压着人的灵魂。但传统价值系统被剥离和物化后，无所依归的疏离感和无法摆脱的荒诞感、空虚感也就在这些都市人身上如影随形。\n\n这些无不在表现，新感觉派已经在思考物质与灵魂、欲望与道德、狂欢与堕落、空虚与及时行乐等人类存在的矛盾命题和城市的阶级分化等现实问题，即他们已经意识到都市文明与身处其中的人的文化冲突和精神困境的悖逆存在。\n\n（三）叙事态度：缺乏思考的深度，对都市有好感和认同，但无法完全摆脱农业文明意识\n\n虽然从整体来看，新感觉派反映了现代都市人全新的生活方式、全新的行为方式和新旧交织着的价值观念和道德观念，但较之京派，他们对现代都市的叙述和想象还只停留在对喧哗浮躁的都市表层生活的感觉和体验当中，缺乏对文明与文化进程中人类所面临的共同难题的深度追问，更没有挖掘到社会历史的根源，好多问题难免流于空洞的慨叹，而过分执迷于表达对都市的印象和感觉又使他们的文字普遍缺乏分析的力度和理性的思辨。\n\n但从另一个角度看，他们创作的得失却也透露出新感觉派面对现代化都会时内心深处的困惑和彷徨。这首先是缘于其分裂的文化身份，新感觉派显然对都市有好感和认同，也持激进又先锋的写作姿态，但乡村中国的道德标准和价值体系是不可能随着社会的急剧转型而立刻消失的，残留的农业文明意识牵绊了他们对都市的留恋和认同。另外这困惑还因为，仅凭“感觉”是无法解释并存于都市中的“天堂”和“地狱”的社会现实的。\n\n（四）审美取向：全方位展示感觉与印象中的现代都市，并使之成为独立的审美对象\n\n新感觉派作家全方位地、富于创造力地表达出一个感觉和印象中的现代都市。不断变换着的娱乐消费场所，无处不在的“妓女掮客，阴谋诡计”，汽车、香烟、霓虹灯等杂然纷呈的都市意象和“红的街、绿的街”“张着蓝嘴”“又有了红嘴”等突兀震撼的视觉感受真实地烘托出都市生活的骄奢淫逸和疯狂多变。这样，新感觉派就不仅考察了都市的器物层面，而且深入到了都市生活和都市文化的某些独特的方面。\n\n像新感觉派那样将都市纳入艺术视野并使之成为创作主体独立的审美对象于此前的文学中还不多见。他们是真正站在现代物质层面上体验都市，以全新的价值观念打量都市。都市不仅是他们生活的居地，更是与其展开对话的场所，只有都市，才能引发他们诸多的感慨和思考。对于乡土中国的大多数子民而言，新感觉派观照都市的文化心态和文本透露出的审美取向、表达方式是前所未有的。","keywords":"茅盾 史诗性现实主义写实 普遍的人性关怀 社会的“人”激烈的时代矛盾 华丽铺陈 细腻生动 表现都市“恶”老舍 平民视角 文化角度 个体的人 俗白浅易的口语 京味语 温和的态度 复杂的迷恋 新感觉派 西方现代派表现形式与文体 异化了的“都市人”精神困境 缺乏思考的深度 好感和认同 无法完全摆脱农业文明意识 展示感觉与印象中的现代都市 独立的审美对象","note":"近年来，城市／都市书写相关的讨论越来越多，在考查中出现的频率越来越高，这正与当下文化研究盛行的状况有着密切的联系。而在对都市书写的相关考查中，30年代的都市书写最受关注，因为这一时期左翼文学思潮与自由主义文学思潮并行，都市书写呈现出了多样化的色彩。本题选取的三位作家（流派）中，茅盾为左翼文学思潮代表，新感觉派为自由主义文学思潮代表，而老舍则是处于两大思潮之间的作家的代表。在考查中，可能会将这些作家的都市书写两两对比，大家要注意灵活应对。相关内容可以参考刘姗姗《论茅盾的上海都市书写》、戴永课《茅盾和老舍都市小说叙事模式之比较》、舒欣《三十年代茅盾都市小说的现代性及其影响》、丁金诺《老舍小说的城市书写研究》、傅晓燕《论老舍与张爱玲的城市书写》、赵学勇《20世纪30年代中国的都市叙事与想象》，具体论文可以在李凡文学正版群内领取。"},{"id":"90","stars":"★★★★","title":"试分析茅盾对现代小说发展的贡献","body":"一、创造了都市文学新模式\n\n在小说领域内茅盾将“五四”时期文学研究会“人生派”的现实主义精神接过来，加以发展，建立起在当时来说属于全新的革命现实主义文学模式。\n\n茅盾创造的文学范式有两大特点：一是重视题材的社会性、主题的重大性，创作与历史尽量同步，反映时代的全貌及其发展的史诗性，追求巨大的思想深度与广阔的历史内容；二是着重从经济生活的变动反映都市社会的演变，用阶级及阶级斗争的观念来观察、分析、表现处于复杂的社会关系中的人物典型，并且表现出鲜明的政治倾向性。\n\n由于这种依靠理性分析来开拓形象思维的创作方法，从典型环境来解释并塑造典型人物，在戏剧性强的情节中突显人物性格及其成长史的写法，逐渐成为“左翼”文学公认的主流，因而影响深远。以茅盾为首的这一类小说，被称为“社会剖析小说”。\n\n二、改变“五四”中长篇小说的幼稚状态，使之走向完善\n\n茅盾在运用思想对社会现象不懈的理解和分析中，构思长篇巨制。他是彻底改变“五四”中长篇小说的幼稚状态，使之走向完善的最突出小说家。\n\n当中国在东南沿海一带的社会经济结构逐渐为现代化生产、商业所代替，巨大而复杂的生活内容，也提供了文学形式相应改变的可能性。茅盾的贡献之一便是适应了30年代生活内容的变化，对鲁迅所开创的中国现代短篇小说文体作了新的拓\n\n展，向中长篇延伸，大大提高了中国现代小说反映生活和人的心灵深广度的可能性。\n\n三、具备世界性眼光，促进了中国小说与世界文学的联系\n\n茅盾是由“五四”育成的一代具有世界眼光的作家。他借鉴、译介外国文学的范围十分广泛，希腊、罗马、文艺复兴时代各大师，19世纪的批判现实主义文学是他尤为喜欢的。\n\n一直到写出《霜叶红似二月花》，他虽然注意减弱自己小说的欧化成分，但也只是更将法国、俄国的小说形式与中国固有的世态伦理小说相结合而已。\n\n茅盾就是这样以自觉创造革命文学的理论和实践来建立、发展、完善中国现代小说，而且绝不割断它与世界文学的联系，从而显示出他的独特的文学史地位和作用。\n\n【李凡关键词：都市文学新模式 社会剖析小说 中长篇小说 世界性眼光】","keywords":"","note":"茅盾作为一位出色的学者，在文学理论、文学实践包括小说、散文等诸多领域都有着卓越贡献。茅盾的理论主张，主要集中在对20世纪以来我国现实主义文学理论体系的积极建设方面。从“五四”时期提出“为人生”的现实主义，到1925年之后向前推进，演变为革命现实主义，他都是核心人物之一。小说方面的贡献不用再说。散文方面，其作品在抗战时期也趋于成熟，形成了精致蕴藉、理与情、“议论”与“具象”互相融合的特色。此外，他还是编辑家、翻译家。因此，大家一定要对这位文学大家重点掌握。"},{"id":"91","stars":"★★★★","title":"论述社会剖析派小说的总体特征","body":"茅盾创造的社会剖析派文学范式有两大特点：一是重视题材的社会性、主题的重大性，创作与历史尽量同步，反映时代的全貌及其发展的史诗性，追求巨大的思想深度与广阔的历史内容；二是着重从经济生活的变动反映都市社会的演变，用阶级及阶级斗争的观念来观察、分析、表现处于复杂社会关系中的人物典型，并表现出鲜明的政治倾向性。这种小说的特征主要表现为以下几个方面：\n\n一、社会性强，并注重对社会现象背后动因的剖析\n\n社会剖析派小说作家立足于社会生活，在观察的基础上，用科学的态度剖析中国社会的性质，力图对社会生活做出总体的再现和全景式的描绘，因此小说的社会性很强，有助于读者对当时社会现状的了解，典型地体现在《子夜》《春蚕》与《林家铺子》等作品中。如《子夜》通过以吴荪甫为中心的人物群的活动，显示了三十年代上海这种大都市的半封建半殖民地性质，理性和剖析性很强，具有说服力。此外，小说也注重从经济角度再现社会生活，揭示社会现象背后的经济动因，如经商、开矿、办实业、搞投机、放高利贷、同行吞并等等，社会剖析派的作家自觉的从经济入手来剖析社会，发现社会现象背后的经济动因，从而深刻地揭示出某些规律，以完成自己的社会使命和艺术使命，这是社会剖析小说的独特性。\n\n二、横断面的结构与客观化的描写\n\n社会剖析派作家经常采用截取横断面的方法来解剖社会，以散点透视的方式，全景式的展现当代社会现实宏观的社会视野，广阔的社会图景。如《子夜》通过民族资本家吴荪甫的悲剧命运，准确把握了社会各阶层人物的思想、性格、心理、命\n\n运及其历史纠葛和流动，力求完整反映出整个时代社会生活的丰富性、复杂性。\n\n而客观的描写，则是作家在描写社会生活时，往往不表现出作家的爱憎等主观情感态度，使作品呈现出客观、逼真、冷静的特征。作家们通过精细观察，运用社会科学理论分析现实，舍取情节而客观叙事，揭示出现实社会生活的“本质”，具有社会科学家的气质。如沙汀《在其香居茶馆里》对兵役问题的矛盾冲突进行了客观化描述。\n\n三、复杂化性格与悲剧性的命运\n\n社会剖析派小说作品大多采用多声部叙述的方法，展现人物性格的多方面，如吴荪甫，其性格是丰富和复杂的：他有进步的一面，发展民族工商业；也有反动的一面，剥削工农群众；更具有矛盾性的一面，外表坚强内心软弱。社会剖析派深刻揭示典型环境的典型人物，具有浓重的悲剧性。\n\n☒四、细腻的心理刻画\n\n社会剖析派小说特别注重于细腻的心理刻画，追求社会历史的剖析与人物心理剖析的统一。在他的艺术创造中，不仅努力挖掘与揭示人物心理活动深刻的社会历史的内容，而且注意把人物置于广阔的社会历史运动中，展现人物心理发展的历史。同时，他又十分注意调动一切心理描写的手段，加以综合地运用，以表现人物心理活动的丰富性与复杂性。茅盾的创作实践提高了心理刻画在我国现代长篇小说艺术中的地位，具有重要意义。","keywords":"题材社会性 阶级斗争观念 政治倾向性 社会性强 背后动因剖析 横断面的结构 客观化的描写 复杂化性格悲剧性命运 细腻的心理刻画","note":"社会剖析派小说和茅盾是我们考查的一个重点，大家可以抓住“剖析”这个关键字眼引申开来，谁在剖析，剖析什么，有什么成果，从这些方向去思考去理解记忆剖析派小说的特点。除了会考查论述题外，“社会剖析小说”在名词解释中出现的频率也很高，大家要注意重点关注一下。"},{"id":"92","stars":"★★★★★","title":"茅盾小说的艺术探索表现在哪些方面","body":"一、注重题材与主题的时代性与重大性\n\n茅盾要求创作与历史事变尽量地同步，自觉地追求“巨大的思想深度”与“广阔的历史内容”，能反映时代全貌及其发展的史诗性。如果把茅盾的作品按其反映的历史时代先后排列起来看，“五四”运动前后到40年代末近半个世纪内现代中国社会风貌及其变化、各个阶层的生活动向及彼此间的冲突，都得到了充分的艺术反映。\n\n二、注重表现人物性格的多面性与复杂性\n\n为适应以长篇小说为主的小说艺术发展的需要，在小说人物形象的塑造上，茅盾有着与鲁迅不同的艺术追求。不同于鲁迅抓住人物性格主要特征予以传神勾勒的白描手法，茅盾更注重表现人物性格的多面性与复杂性，将人物的行为、情感、心理、个性诸点加以展开，追求“立体化”的油画效果。他总是从多方面的错综复杂的社会关系及其变化中来突出人物性格及其发展，在错综复杂的社会关系中又特别注重人物的经济关系及经济地位的变化。\n\n三、追求宏大而严谨的布局\n\n作为一个自觉的长篇小说艺术家，茅盾对小说结构的极大注意，也是他的显著特点。他追求宏大而严谨的布局，他的作品总是人物众多，情节复杂，线索纷繁交错而又严密完整。这种结构方式是更适合于长篇小说的。\n\n从《子夜》开始，茅盾把小说结构的精心构制作为艺术构思中的重要一环，追求与纷繁复杂的生活更加适应的蛛网式的密集结构。小说情节安排有张有弛，很有节奏，多种矛盾的同时出现、互相纠缠，既有利于多侧面地展开主人公的多重性格，又便于揭示生活中各种矛盾的内在联系和相互影响，使小说的结构形式与所要反映的纷繁复杂的内容取得了某种一致性。\n\n四、追求着社会历史的剖析与人物的心理剖析的统一\n\n在小说艺术表现上，茅盾特别注重于细腻的心理刻画，他追求着社会历史的剖析与社会人的心理剖析的统一。在他的艺术创造中，不仅努力挖掘与揭示人物心理活动的深刻的社会历史的内容，而且注意把人物置于广阔的社会历史运动中，展现人物心理发展的历史。同时，他又十分注意调动一切心理描写的手段，加以综合地运用，以表现人物心理活动的丰富性与复杂性。茅盾的创作实践提高了心理刻画在我国现代长篇小说艺术中的地位，具有重要意义。","keywords":"时代性与重大性 人物性格多面复杂 宏大严谨布局 社会历史的剖析与人物心理的心理剖析的统一","note":"茅盾对中国中长篇小说的发展起到了很重要的影响，其在长篇小说创作艺术上的探索某种程度上具有典范意义，因而我们需要特别关注一下。在考查中，除了直接提问，也可能会让大家结合《子夜》等作品分析茅盾的创作特点，可以结合后续《子夜》艺术特征部分的内容进行作答。"},{"id":"93","stars":"★★★★","title":"茅盾小说在题材选择上有怎样的特点","body":"茅盾独特的小说艺术探索，首先表现在题材的选择与主题的开掘上。茅盾的小说题材，主要具备如下特征：\n\n一、注重题材与主题的时代性与重大性\n\n茅盾的小说注重题材与主题的时代性与重大性，要求创作与历史事变尽量地同步，自觉地追求“巨大的思想深度”与“广阔的历史内容”，能反映时代全貌及其发展的史诗性。\n\n这种意图在《子夜》中虽没有得到完全的体现，但从他创作的整体进行考察，却是基本上实现了的。如果把茅盾的作品按其反映的历史时代先后排列起来看，“五四”运动前后到40年代末近半个世纪内现代中国社会风貌及其变化、各个阶层的生活动向及彼此间的冲突，都得到了充分的艺术反映。如《霜叶红于二月花》揭开了本世纪初、“五四”运动前夕中国社会的一角，《子夜》通过民族资本家吴荪甫的悲剧命运，准确地把握了30年代社会各阶级、各阶层的人的思想、性格、心理、命运及其历史纠葛和流动，完整地反映出整个大时代的全部丰富性与复杂性。可以说，茅盾为我们提供了一部20世纪上半时段中国社会的编年史。\n\n二、强烈的政治性\n\n茅盾小说以社会斗争为故事的轴心，必然显示出题材的强烈政治性。他的爱情描写，也是从属于青年知识分子阶层的表现，是作为社会生活的一个方面。小说叙述者的身份，与“五四”时期大部分的叙事作品以个人立场的叙述不同，所持的是社会化的、集体化的立脚点。这样，茅盾的小说叙述人，显出个人化体验的缺乏，更多以历史代言者的面目亮相了。\n\n三、率先大规模表现都市生活\n\n茅盾在现代文学史上率先突破了“五四”和20年代文学局限于反映古老乡村生活的题材的状态，开始了大规模地表现在西方资本主义工业文明冲击下处于急剧变动中的半封建半殖民地的都市生活。如《子夜》表现了在帝国主义侵略下30年代经济大崩溃中的买办资产阶级、民族资产阶级之间的生死搏斗，市民阶层的破产，塑造了吴荪甫这样一个民族资本家的形象。","keywords":"时代性与重大性 强烈的政治性 大规模表现都市生活","note":"我们要注意，茅盾小说虽然显示强烈的政治性，但他并不是把政治宣传放在小说创作的首位：在创作目的方面，他既追求科学剖析社会关系，揭破人生真相，又能真实表现生命体验；在思想情感基调上，茅盾小说也不像其他政治宣传小说那样强求乐观明朗，而是体现出阴沉暗淡的色彩；在创作原则与创作对象方面，茅盾不把题材局限于工农兵的阶级斗争、致力于塑造理想的革命英雄形象，他只是写自己熟悉的小资产阶级知识分子或民族资本家，并且把他们当作活生生的人，细腻地展示、剖析其灵魂，同情地表现其苦闷与追求。"},{"id":"94","stars":"★★★","title":"茅盾小说在人物塑造上有什么特点","body":"适应以长篇小说为主的小说艺术发展的需要，在小说人物形象的塑造上，茅盾也有着与鲁迅不同的艺术追求，主要表现在以下几个方面：\n\n一、注重表现人物性格的多面性与复杂性\n\n不同于鲁迅抓住人物性格主要特征予以传神的勾勒白描手法，茅盾更注重表现人物性格的多面性与复杂性，将人物的行为、情感、心理、个性诸点，加以展开，追求“立体化”的油画效果。\n\n对于茅盾来说，人物是小说的中心，而人是一切社会关系的总和，所以，他总是从多方面的错综复杂的社会关系及其变化中来突出人物性格及其发展。在这其中又特别注重人物的经济关系及经济地位的变化，这也有别于鲁迅往往着重从人物精神状态去展现人物性格、命运。而这种注重点的转移，与第一个十年强调文学与思想革命的关系、第二个十年更强调文学与无产阶级政治、经济革命的关系的文学思潮演变，有着内在的联系。在这个意义上，茅盾的性格塑造是更能显示现代文学第二个十年的文学时代特征的。而最能体现茅盾上述艺术追求，并最能代表其艺术成就的，无疑是《子夜》中吴荪甫形象的塑造。\n\n二、进行了“人物形象系列”的自觉创造\n\n作为一个有着鲜明的艺术个性的长篇小说艺术家，茅盾创造了自己的艺术世界，对进入他的艺术视野的人物的性格与命运保持着持久的热情与关注，这些人物在他的写于不同历史时期的小说中不断出现，形成了形象系列，各自构成了某一类型人物思想性格的发展历史。\n\n三、完成了对民族资本家和时代新女性形象的塑造\n\n在茅盾的作品中，主要创造了民族资本家与时代新女性两个形象系列。\n\n（一）中国民族资本家是颇能显示中国现代社会特定历史新阶段的人，本应当成为中国现代文学的重要角色，但由于种种原因，在现代文学的人物画廊里，民族资本家形象始终是一个薄弱的环节。茅盾的独特创造在一定程度上弥补了这一缺陷，具有特殊的历史的、美学的价值。\n\n（二）茅盾笔下的时代新女性形象系列较之民族资本家形象系列更少理念化的痕迹，取得了更大的成功。这显然与作家对时代新女性更为熟悉，并倾注了更多的主观情感有关。","keywords":"多面性与复杂性“人物形象系列”民族资本家 时代新女性","note":"茅盾的人物塑造手法和鲁迅的人物塑造手法有很大的差别，这里可能会将茅盾与鲁迅的作品进行对比，让大家分析两者的异同，这要求大家对这两位作家都非常熟悉才可以。"},{"id":"95","stars":"★★★★","title":"试分析茅盾笔下的时代女性形象","body":"茅盾笔下的时代新女性形象系列比之民族资本家形象系列较少理念化的痕迹，取得了更大的成功。这显然与作家对时代新女性更为熟悉，并倾注了更多的主观情感有关。\n\n一、茅盾笔下时代女性的类型\n\n总体来看，茅盾笔下的时代女性，主要有如下两种类型。\n\n（一）“静女士型”：这种时代女性代表和谐、匀称，娴静怯懦，时刻思有所动，“动则裹足不前”，与传统的东方女性有更多的精神联系。\n\n（二）“慧女士型”：这种时代女性代表热烈、狂欢，从生活追求到性格气质都迥异于传统东方女性，是受着欧风美雨的新思潮直接影响而产生的西方型女性，是中国现代社会出现的“新人”。\n\n二、茅盾对时代女性态度的发展\n\n在茅盾二三十年代的作品里，显然对于“慧女士型”现代女性有所偏爱，作家对她们的趋于极端、易于动摇虽有所批评，&#x4F46;主要着力点却在肯定她们思想、性格的反封建的方面，真实地写出了她们尽管有动摇，却最终走上了革命道路的前后变化。但在《子夜》林佩瑶的身上，已经透露出了这些时代新女性的悲剧性结局，作者的笔调中批判性因素逐渐加浓。\n\n对于西方型时代新女性的政治、道德、审美评价的上述转变，与对东方型女性的传统美德的再发掘、再肯定的文学潮流是同时发生的，它深刻地反映了40年代民族解放运动热潮中，社会文化心理、观念的变化。\n\n二、茅盾笔下时代女性的特征\n\n概括起来，茅盾笔下的“时代女性”有以下几个特色。\n\n（一）浓郁的时代性特征\n\n时代性是“时代女性”系列形象艺术生命的症结所在。如果说在茅盾以前作家们所塑造的“时代女性”是反映了新女性在个性解放、婚姻自由以及在探索人生的道路上的呼喊，那么，茅盾笔下的“时代女性”则将她们个人的命运和时代的命运紧紧地联系在一起。我们从茅盾系列的“时代女性”群像里，看到了“时代女性”在时代浪潮中气势雄伟的历史画面，反映出从“五四”运动、大革命时代及抗日战争期间中国女性和时代社会共命运同呼吸的时代精神，从而揭示了时代生活的本质，克服了以往作品中反映新女性的生活社会性不充分的缺点，使人物行动有着深刻的社会背景。\n\n（二）热烈的革命情绪\n\n茅盾笔下的“时代女性”的又一特色，是具有“愤愤然要革命的热情”。她们对革命抱着浓烈的幻想，是大革命时代的浪潮使她们冲出家庭，走出学校，奔向社会。她们不像娜拉那样，冲出家庭后无路可走，也不像子君那样奔向生活后，去演了一出爱情至上主义的悲剧。她们已经摆脱了女性的依赖思想，相信自己并执着地追求她们既定的目标。在她们身上有着一个共同的特色：那就是在任何情况下，都有“向善的焦灼”的心，用作者的话来说，就是有“天生热烈的革命情绪”。\n\n（三）彻底摆脱了传统的封建礼教和道德观念\n\n茅盾笔下的“时代女性”们蔑视封建统治阶级几千年来套在妇女身上的一切精神枷锁。她们已摆脱了“五四”青年在爱情追求上的爱情至上主义的色彩。她们主张爱情自由，但她们不把爱情作为自己生活中追求的唯一目的，即使在最苦闷的时刻，她们也没有忘却社会和人生，仍去作新的追求。她们“并非为了恋爱而苦闷，而是为了苦闷而去找恋爱”的新女性。她们不把恋爱当作“神秘的圣殿”，也不是将恋爱作为“消忧遣愁的法宝”，她们是把爱情和理想中的追求溶为一体。\n\n（四）不甘于苦闷却无法摆脱\n\n“时代女性”的第四个特色，是她们都有“幻灭的悲哀”“颓废的冲动”。这表现在她们一方面不甘于寂寞和苦闷，另一方面又无法摆脱寂寞和苦闷；她们一方面在追求光明，要和自己的浪漫颓废生活告别，可是另一方面却又贪图舒服，喜欢物质的享受，甚至是肉欲的狂欢。她们在思想上常常处在复杂矛盾的交战之中，在心灵上常常感到自己有着难言的苦衷，这就使她们在性格和气质上，都有着畸形变态的心理，在思想和行动上，充满了颓废、浪漫的气息。其实，她们的苦闷就是二十世纪二十年代末中国式的“世纪末”的苦闷，也就是人们说的“时代病”的苦闷。","keywords":"“静女士型”“慧女士型”态度发展 时代性 革命情绪 摆脱封建礼教、道德观念 不甘苦闷却无法摆脱","note":""},{"id":"96","stars":"★★★★","title":"茅盾的小说结构有什么特点","body":"作为一个自觉的长篇小说艺术家，茅盾对小说结构倾注极大精力，也是他的显著特点。这主要表现在以下几个方面：\n\n一、追求宏大而严谨的布局\n\n不同于鲁迅短篇小说单纯而严正的布局追求，茅盾的作品总是人物众多，情节复杂，线索纷繁交错而又严密完
