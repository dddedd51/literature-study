即使咏梅花，也写得劲气凛然。晁词中抒发归田理想、表达敝屣功名、表现落拓不羁、回顾少年意气等内容的词作，比较集中地展现了这种与苏词近似的艺术趣尚。","keywords":"全面公允评论词人词作 肯定苏词革新意义 题材开拓面大、开拓性强 继承了苏轼豪放词风","note":"从创作实践上来看，晁补之的词作成就不如秦观，但他在苏轼变革词风受到批判的同时，从理论和实践上给予了苏轼最重要的支持，推进了词体词风的革新。整体来看，这部分内容考查频率不高，主要还是作为拓展知识进行了解。"},{"id":"269","stars":"★★★","title":"晏几道词的艺术特征","body":"晏几道按照乃父晏殊所承传的“花间”传统，固守着小令的阵地，写那些令人回肠荡气的男女悲欢离合之情。然而，晏几道的词，并非重复“花间”的境界，而是创造了新的艺术世界。\n\n一、内容上多表现生死不渝的苦恋\n\n在词作内容上，晏几道虽然未离恋情相思和别恨离愁的范围，但与五代和宋初词人写没有具体思恋对象的泛化的恋情不同，晏几道《小山词》所写的恋情，有着明确而具体的思恋对象，主要是表现他与友人沈廉叔、陈君龙家的莲、鸿、蘋、云四位歌女之间的悲欢离合。他在词中也常常直接写出他所思恋的这几位歌女的芳名，如《临江仙》中的那一句“记得小蘋初见”。\n\n小山词里既有确指的思恋对象，情感也非常真挚。晏几道为人执着痴情，即使是四位歌女流转人间，明知不能重见，他仍然一往情深地苦恋着对方。不是表现拥有爱情的欢乐，而是追忆已失落的往日爱情和表现刻骨铭心的相思，并把爱情当作一种纯精神性的追求，这成为晏几道恋情词的一大特色。\n\n二、将身世之感的渗入对爱情的追求中\n\n对爱情的生死不渝的追求，几乎是晏几道人生主要的精神寄托。他一方面借着对爱情的追求来建立一个与现实生活截然不同的审美的情感世界，以消解现实人生中无法摆脱的孤独苦闷；另一方面，把自己辛酸不平的身世之感曲折地寄托在男女间的悲欢离合和女性的失意苦闷之中，既能一吐为快，又能不获罪于人。如《采桑子》里的“倦客”和《浣溪沙》中“不将心嫁冶游郎”的孤傲而又凄凉的歌女，未尝不是词人的自我写照。他在男女相思情爱的追忆中，融入了自己的身世之感，抒发了人世无常、欢娱难再的忧患与哀愁，这就为小山词带来了能引起共鸣的普泛化情感。\n\n三、如梦如幻的艺术境界\n\n缤纷多姿的如梦如幻的艺术境界，是小山词的显著特点，由于与热恋的莲、鸿、蘋、云四位歌女生离死别，相见无缘，晏几道常常建构梦境以重温往日爱情的甜蜜。他的260首词作，有52首59句写到“梦”。他或在梦中追寻：“梦魂惯得无拘检，又踏杨花过谢桥。”或在梦中相逢：“梦里时时得见伊。”或与对方同梦：“几回魂梦与君同。”他的梦，有“春梦”“秋梦”“归梦”“前日梦”“今宵梦”等等。\n\n四、语淡情深的风格\n\n语淡情深，是小山词的风格特色。他善于用平淡的语言、常见的景物，表现不同寻常的深情。淡语能表深情，常常是得力于“字外盘旋，句中含吐”的透过一层的句法。语短情长，情意层层深入。\n\n晏几道的词艳而不俗，浅处皆深，从语言的精度和情感的深度这两个层面上把《花间集》以来的艳词小令艺术推展到了极致。他在宗柳学苏之外，独树一帜，给北宋后期词坛增添了异样的风采。","keywords":"生死不渝的苦恋 身世之感 如梦如幻的艺术境界 语淡情深","note":"晏几道继承了他父亲晏殊的花间传统，却在此基础上做出了革新，在宗柳学苏之外，独树一帜，把《花间集》以来的艳词小令艺术推展到了极致，成为一时胜景。大家可以将晏几道的词作与“花间词”对比，进而体会晏几道词作中的深情与新变。"},{"id":"270","stars":"★★★","title":"试分析秦观词的思想艺术特色","body":"秦观在词史上具有独特的地位。其词卓然一家，和婉醇正，典型地体现出婉约词的艺术特征。秦观词的思想艺术特色，主要表现在以下方面。\n\n一、男女恋情、离情别绪、伤春悲秋和羁旅行役之词两大题材\n\n秦观词最擅长、最带有惆怅伤感个性色彩的题材是那些“悲愁凄婉郁塞无聊之言也”。具体而言，尤以下列两方面最为突出：\n\n（一）表现男女恋情、离情别绪、伤春悲秋之作。这些词虽未跳出传统内容，但终有一些新倾向。\n\n首先是继苏轼之后更重抒情，对女性赋予更多的同情与尊重；少写艳情，而多写细致的心理；少写轻佻浮薄，而多写对真挚爱情的向往，所以“虽作艳语，终有品格”。这类词一般都充满哀怨幽凄的色彩，只有极个别的开朗明快之作。\n\n其次将自己政治上的失意之情糅进这类情词中，把深沉的辛酸苦闷融注在类型化的离情别恨之中，从而给传统的艳情词注入了新的情感内涵，因而使这些酒边花下之作也都带有他固有的一往情深的感伤色彩。这种将身世之感融入艳情的特点，是秦观对传统情词的开拓，如贬往郴州途经衡阳所作的《阮郎归》。\n\n（二）直接抒发自己贬谪之苦的羁旅行役之词。这些词出自这位伤感人之口，显得感情极为缠绵深挚，淡语也显得有味，浅语也显得有致，确乎如心田中流出，如《如梦令》（遥夜沉沉如水）。\n\n二、情韵兼胜\n\n在北宋词坛上，秦观被认为是最能体现当行本色的“词手”。秦观词的内容并没有摆脱别恨离愁的藩篱，其妙处在于情韵兼胜，即情感真挚，语言优雅，意境深婉，音律谐美，符合词体的本色和当时文人士大夫的审美趣味。\n\n秦观以小令作法的长处弥补慢词创作中存在的不足，从而达到情韵兼胜的审美效果。而他的小令也是辞情兼称。这种悠远隽永的艺术境界是依托以下艺术手段才得以实现的：\n\n（一）秦词极善于将外在幽迷之景与内在感伤之情作微妙的出神入化的结合，以加强词的凄婉意境，深得含蓄之妙，如《踏莎行》（雾失楼台）全词只有“砌成此恨无重数”一句正面点出了怨恨之情，其余的描写全是通过凄迷的“有我之境”的景色来传达哀幽的心情，特别是后两句“痴语”，更传达出他难以排遣的苦闷之情。\n\n（二）秦词还极善于捕捉细节，对心绪物象作微妙而细腻的刻画，并通过这种细节刻画传达自己深悠的哀伤。\n\n（三）秦词还擅长使用各种修辞手段来表达自己触景生情时的敏锐感受和丰富联想，使写景抒情更形象生动，因而锤炼出很多耐人寻味的名句、警句，如写愁或恨曰：“倚危亭，恨如芳草，萋萋刬尽还生”。\n\n（四）秦词还善于运用精美而平易的语言。他选词造句以典雅凝炼为主，但决不流于生涩；时而嵌入一些贴切生新的平常语，甚或俚语，但又决不失于俗滑。两者结合，显得格外传神。再加上他很少使用费解的典故，而喜用最能表现轻约柔曼、凄婉幽怨心情的词汇，因而更增加了辞情相称的感发力量。如《满庭芳》（山抹微云）、《浣溪沙》（漠漠轻寒上小楼）。\n\n（五）秦词还善于“曼声以合律”，不但能辞情相称，而且能声情相谐，这也是深受时人喜爱的原因之一。","keywords":"男女恋情 离情别绪 伤春悲秋 更重抒情 将身世之感融入艳情 羁旅行役 情韵兼胜 情景结合 捕捉细节 擅长修辞 精美平易的语言 曼声以合律","note":"秦观虽然是苏轼的地位，但他的却词典型地体现了婉约词的特征。秦观的主要成就，不是在词作内容的开拓上，而是在于对婉约词技巧的发展上面，这其中，将身世之感融入艳情和以小令法作慢词这两个特征我们要重点关注。就婉约词的发展而言，秦观对另外两位婉约词的代表作家周邦彦和李清照都有直接影响。秦词语言清丽淡雅。周邦彦得其丽，而发展为精雕细琢的典雅富丽；李清照则得其清，而朝更加本色自然的方向发展。"},{"id":"271","stars":"★★★★","title":"试分析周邦彦词的思想内容和艺术特征","body":"作为前后相继的词坛领袖，周邦彦与苏轼有着不同的艺术贡献和追求。周邦彦词的思想内容和艺术特征，主要表现在以下方面：\n\n一、羁旅行役之感和咏物两大主题\n\n（一）周邦彦一生虽然没有遭受苏门词人那样沉重的打击迫害，但仕途并不得意，几度浮沉奔波于地方州县，深切地感受到漂泊流落的辛酸。“冷落词赋客，萧索水云乡”，正是他生活处境和心境的自白，而“漂零不偶”的羁旅行役之感也成为他词作的重要主题，《满庭芳·夏日溧水无想山作》所表现的漂泊的孤独疲倦和憔悴失意，是周邦彦词的情感基调。即使是重返汴京在朝中为官时，他的心情也一直是压抑苦闷的，潜在地反映出北宋亡国前夕士大夫悲观失望的心理。\n\n（二）咏物也是周词的主要题材。周邦彦所作咏物词既多如咏新月、春雨、梅花、梨花、杨柳等，又将身世飘零之感、仕途沦落之悲、情场失意之苦与所咏之物融为一体，为南宋咏物词的重寄托开启了门径。\n\n二、在艺术上追求词作的艺术规范性\n\n周邦彦创作时精心结撰，追求词作的艺术规范性。周词的法度、规范，主要体现在章法、句法、炼字和音律等方面。\n\n（一）周词的章法结构，主要是从柳永词变化而来，周词也长于铺叙，但他变直叙为曲叙，往往将顺叙、倒叙和插叙错综结合，时空结构上体现为跳跃性的回环往复式结构，过去、现在、未来和我方、他方的时空场景交错叠映，章法严密而结构繁复多变。\n\n周词的铺叙，还善于增加并变换角度、层次。他能够把一丝感触、情绪向四面八方展开，又层层深入地烘托刻画，使情思毫发毕现。\n\n（二）周邦彦能自铸伟辞，但更善于融化前人诗句入词，浑然天成，如从己出。周词往往是一首词中数句化用，不仅从字面上化用前人诗句，变成新的语言，更从意境上点化前人诗句而创造出新的意境，从而把它发展为一种完备的语言技巧。这种写作方法一可显示博学，所谓“无一字无来历”，二又化用得贴切自然，不露痕迹，体现出工巧的构句能力，三则援引已经成名的前人句子，会在审美效果上为自己的词作提供与经典的“互文性”，艺术境界上更容易达到“醇雅”境地。\n\n（三）调美，律严，字工，是周词在音律方面的特点\n\n（1）周邦彦与柳永一样，也长于自度曲。他新创、自度的曲调共五十多调，虽然创调之多不及柳永，但他所创之调，如《瑞龙吟》《兰陵王》和《六丑》等，声腔圆美，用字高雅，较之柳永所创的部分俗词俗调，更符合南宋雅士尤其是知音识律者的审美趣味，因而受到更广泛的遵从和效法。\n\n（2）周词音律和谐，注重词调的声情与宫调的音色协调一致。宫调不同，声情各异。如商调凄怆怨慕，黄钟宫则富贵缠绵。为使音律和谐，周词审音用字，也非常严格精密。他用字不仅分平仄，而且严分仄字中的上、去、入三声，使语言字音的高低与曲调旋律的变化密切配合。\n\n（3）周词与杜诗一样，还特别擅长用拗句，在拗怒中追求音律的和谐统一。这一方面使字声的错综使用能更恰当地表达喜怒哀乐的不同情感，另一方面也是为加强声情顿挫的美感，而且适应歌唱者的自然声腔和乐曲旋律的需要。音律上做到怒与和的矛盾的统一，是清真词的独创。","keywords":"羁旅行役之感 咏物 艺术规范性 长于铺叙 融化前人诗句入词 调美，律严，字工 自度曲 声情与音色协调 擅长用拗句","note":"周邦彦词在内容上主要有羁旅行役和咏物两大主题，需要我们重点关注的，主要是其在艺术上的特征。和苏轼不同，周邦彦追求艺术的规范性，讲究用词的法度、规范，和杜甫诗歌一样具有示范作用，因而往往会以“为什么周邦彦被称为“词中老杜’”这样的方式进行考查，这里我们要知道需结合其艺术特征进行解答。"},{"id":"272","stars":"★★★★","title":"试分析周邦彦的词学成就（26山东大学）","body":"周邦彦以其卓越的艺术成就结束了北宋词，并打开南宋词的新风，在词史上具有承前启后的重要地位。周邦彦的贡献，主要表现在以下方面：\n\n一、正宗婉约集大成者\n\n周邦彦词吸取了温庭筠的秾艳，韦庄的清丽，冯延已的缠绵，李后主的深婉，晏殊的蕴藉，欧阳修的秀逸，特别是柳永的绵密和冶艳，最终形成了“富艳精工”的一家之风。周氏确实广泛吸取了前辈词家的创作经验，把词的艺术提到一个新的高度。他虽不能被尊为奄有众长、前无古人、后无来者的词中之圣，但把他奉为正宗婉约之集大成者亦当之无愧。\n\n二、将身世之感融入所咏之物，为南宋咏物词重寄托开启了门径\n\n咏物是周词的主要题材。柳永等宋初词人的咏物词，主要是描摹物态图形写貌。苏轼的咏物词，开始将状物态与抒人情合而为一，但数量较少。周邦彦所作咏物词数量既多，如咏新月、春雨、梅花、梨花、杨柳等，又将身世飘零之感、仕途沦落之悲、情场失意之苦与所咏之物融为一体，为南宋咏物词的重寄托开启了门径。\n\n三、在词作法度上做出了规范，具有示范作用\n\n作为与苏轼前后相继的词坛领袖，周邦彦具有与苏轼不同的艺术追求和贡献。苏轼如唐诗中的李白，追求创作的自由，强调性情的自然流露，力图打破词作原有的创作规范；周邦彦则如杜甫，创作时精心结撰，追求词作的艺术规范性，有种法度上的井然，门径上的体制，所谓“下字运意，皆有法度”。周词的法度、规范，主要体现在章法、句法、炼字和音律等方面。因法度井然，使人有门径可依，这就有老杜诗歌的那种示范作用，故“作词者多效其体制”。\n\n（一）周词的章法结构，主要是从柳永词变化而来。周词也长于铺叙，但他变直叙为曲叙，往往将顺叙、倒叙和插叙错综结合，时空结构上体现为跳跃性的回环往复式结构。周词的铺叙，还善于增加并变换角度、层次。\n\n（二）周邦彦能自铸伟辞，但更善于融化前人诗句入词。周词往往是一首词中数句化用，不仅从字面上化用前人诗句变成新的语言，更从意境上点化前人诗句而创造出新的意境，从而把它发展为一种完备的语言技巧。\n\n（三）调美，律严，字工，是周词在音律方面的特点\n\n（1）周邦彦与柳永一样，也长于自度曲。他新创、自度的曲调共五十多调，他所创之调，声腔圆美用字高雅，更符合南宋雅士尤其是知音识律者的审美趣味，因而受到更广泛的遵从和效法。\n\n（2）周词音律和谐，注重词调的声情与宫调的音色情调协调一致。后来吴文英等作词严分四声，即是以周词为典范；宋末方千里、杨泽民两家的《和清真词》和陈允平的《西麓继周集》，几乎遍和清真的所有词调，而且谨守其句读字声。这既反映出周词的影响之大，也可以看出周邦彦规范词律之功。\n\n（3）周词与杜诗一样，还特别擅长用拗句，在拗怒中追求音律的和谐统一。音律上做到怒与和的矛盾的统一，是清真词的独创。","keywords":"正宗婉约集大成 重寄托开启门径 法度上规范 示范作用","note":"周邦彦在词史发展上主要起到了一个承上启下的作用，所谓“承上”，主要指的是周邦彦“婉约词集大成”的地位，要注意“婉约词”这一限定；而启下，则主要是指在词的法度上做出规范，具有示范作用，对后世词人尤其是南宋词人有重要影响，这也是我们需要重点注意的内容。可以注意这部分内容与前一道题有很多重合之处，未避免过于繁琐，所以本题略有简化，大家要注意根据前一道题的内容适当补充。"},{"id":"273","stars":"★★★","title":"谈谈你对李清照词“别是一家”观点的认识","body":"李清照有《词论》一篇，全面而深刻地表述了恪守传统词派的观点，在文学史上有很深远的影响。其中十分重要的一个观点便是“别是一家”说。在李清照之前，李之仪曾从创作论的角度，提出过词“自有一种风格”的看法。李清照进而从本体论的角度提出了词“别是一家”的理论。\n\n一、“别是一家”说的内涵\n\n所谓“别是一家”，意指词是与诗不同的一种独立的抒情文体，词对音乐性和节奏感有更独特的要求，它不仅像诗那样要分平仄，而且还要“分五音，又分五声，又分六律，又分清浊轻重”，以便“协律”“可歌”。否则，词就成了“句读不葺之诗”，而失却了词作自身的文体特性。\n\n对于五音、五声、清浊轻重等，李清照没有解释，五音可能指发音部位而言，如唇、齿、舌、喉、鼻等，五声当是指宫、商、角、徵、羽，六律指阳六律和阴六吕，即十二律，清轻为阳，重浊为阴。关于押韵，谓本平声则可通侧声，而不拘上去入；若本侧声，则上去入不可通。可见李清照认为词的声律要求是非常严格的，比诗的声律要复杂得多。因此她是很不赞成以写诗的方法来作词的。\n\n二、“别是一家”说的影响\n\n（一）从词的本体论出发进一步确立了词体独立的文学地位\n\n词作只有保持自身独立的文体特性，才能不被诗所替代，在文学之林中占有独立的地位。李清照列出五音、五声、六律、清浊轻重等诸多音律标准，重点从音乐的角度建立了词体的独特价值和地位，她通过强调词在声律方面的特殊要求，从格律化的角度加速了词体文人化的进程，为词最终走向一种可以与诗并列的文学样式在体制上率先垂范，为诗词之别立下界石，在形式上推尊了词体。如果说苏轼是从诗词同源的渊源论角度提高词体的地位，那么，李清照则是从词的本体论出发进一步确立了词体独立的文学地位。\n\n（二）从另一个方面促成了词对歌的背离，使之趋于案头化和书斋化\n\n李清照词“别是一家”说从另一个方面促成了词对歌的背离，使之趋于案头化和书斋化。李清照虽然并没有忽略词的可歌性特征，但她对于声律的极度强调，实际上已超出了可歌性的需要，显示出向格律化发展的趋势。恰如苏轼的某些词作、辛弃疾的大部分词作都具有可歌性一样，李清照以及其之后的姜夔、吴文英的词作与其说是写出来供演唱，不如说是供吟诵的；与其说是诉诸听觉的，不如说是诉诸视觉的。在骚雅派词人笔下，早期词所具有的那种明白如话、清新自然的特征已丧失殆尽，乐曲不再是词的必备要素，而成为可有可无的点缀。与之相伴而来的，是歌的失落。","keywords":"本体论 独立抒情文体 确立了独立的文学地位 促成了词对歌的背离","note":"对于“别是一家”的具体内涵，学界仍有争论，部分学者认为其除了在音乐上要求诗与词区分外，还包括李清照要求词文雅、“故实”等内容。不过马工程版和袁行霈版两本教材都认为“别是一家”只强调诗词在音乐上的区分，故我们以课本为准。不过大家可以参阅一下目标院校老师的相关论文。李清照“别是一家”的思想，从本体论出发确立词体独立文学地位的同时，也促成了词对歌的背离，使其进一步案头化和书斋化，这一点我们也要注意。“别是一家”作为一个关键概念可能在名词解释中出现，大家要注意一下。"},{"id":"274","stars":"★★★","title":"试分析苏轼“词自是一家”说和李清照“词别是一家”各自的含义及其关系（26西南大学）-","body":"苏轼的“自是一家”说与李清照“别是一家”的词论可谓词学批评史上的两个理论高潮，对词的理论贡献尤为突出，影响也极为深远。二者各自的内涵及其关系，可以从以下角度进行认识。\n\n一、“自是一家”与“别是一家”的内涵\n\n（一）“自是一家”\n\n苏轼的“自是一家”之说，是苏轼词学观的集中体现，苏轼认为词应展示作者的个性情怀，突出词体抒情的个性化特征，其内涵包括：追求壮美的风格和阔大的意境，词品应与人品相一致，作词应像写诗一样抒发自我的真实性情和独特的人生感受。只有这样才能“其文如其为人”，在词的创作上自成一家。\n\n（二）“别是一家”\n\n李清照从本体论的角度提出了词“别是一家”的理论。所谓“别是一家”，意指词是与诗不同的一种独立的抒情文体，词对音乐性和节奏感有着独特的要求，它不仅像诗那样要分平仄，而且还要“分五音，又分五声，又分六律，又分清浊轻重”，以便“协律”“可歌”。否则，词就成了“句读不葺之诗”，而失却了词作自身的文体特性。词作只有保持自身独立的文体特性，才能不被诗替代，在文学之林中占有独立的地位。\n\n二、“自是一家”与“别是一家”的关系\n\n（一）联系：都是为了提升词的地位，“尊词体”\n\n由于晚唐五代词功能的娱乐性，风格绮艳柔媚，出现了“诗庄词媚”“诗尊词卑”的观念，词是“诗余”，地位低下。苏轼是从诗词同源的渊源论角度提高词体的地位，他认为“词为诗商”，处处站在诗歌的角度评词，认为词应有诗歌的品格，词也能达到与诗歌一样的审美效果。李清照则是从词的本体论出发进一步确立了词体独立的文学地位，强调词体的独立性，词就是词不是诗，它有不同于诗的特质，二者不能混为一谈。不管“自是一家”的提出还是“别是一家”的强调，从本质上都是推尊词体的手段。\n\n（二）区别\n\n（1）出发点不同\n\n苏轼是以文学为本位，认识诗词的共同之处和渊源关系，主张“自是一家”“以诗为词”；易安则从词的艺术体性出发，以词应合律为立场，强调词与音乐不可分割的联系，以此维护词的独立性，指出诗词有别，反对“以诗为词”，认为词“别是一家”。简言之，东坡重视词的文学性，主要在题材、内容、风格上“以诗为词”“自是一家”；而易安强调词的艺术性，从音律上反对“以诗为词”。这是两人词学观的基本倾向。\n\n（2）针对的现象不同\n\n“自是一家”是诗词合流的产物，在题材、情感、语言、风格等层面打破诗词壁垒，改变词的娱乐。“自是一家”理论所针对的是五代、北宋以来词作嗜艳绮媚之风，追求以高妙诗笔，来扭转词风，达到词体创作的新境界。\n\n“别是一家”是诗词分流的需要，是对词体审美特征的重构，针对的是苏轼等人诗词合流、消解诗词的界限，导致词体的独立性受到威胁的状况，目的是重新强调词的独立性。\n\n（3）强调的内容不同\n\n苏轼“自是一家”更注重词的情感、风格的自成一体，尤其是豪放情怀的展示，见词如见人。李清照“别是一家”更强调的是音律、语言及深婉词境的追求，目的是刻意拉开诗、词的距离，要人们遵循诗、词二体各有的规定。\n\n总体看下来，“自是一家”“别是一家”是词学理论的兴盛与词学观点的碰撞，是宋词发展繁盛的结果，标志着宋代词学批评的繁荣，在词学发展史上具有重要的意义。\n\n【李凡说：“自是一家”和“别是一家”是宋代词论中非常重要的内容，经常会被拿出来讨论。这里我们首先需要明确的是，无论是“自是一家”，还是“别是一家”，其目的都是为了尊词体，推动词的发展。但苏轼当时面对的是词为“艳科”“诗余”的状况，所以需要将词提到与诗相同的地位，才能更好地推动词的发展；而在李清照的年代，词的地位已经有了明显的提升，但必须强调词的独立性，才能不让诗词之间的界限混淆，才能更好地推动词的发展。大家可以从这一点出发去思考，然后展开分析。相关内容可以参考罗莹《论“自是一家”与“别是一家”的词史意义》、王永豪《“别是一家”与“自是一\n\n家”-唐宋词论之“本色论”辨析》。】","keywords":"内涵 关系 提升词的地位“尊词体”区别 出发点 针对的现象 强调的内容","note":""},{"id":"275","stars":"★★★","title":"试分析李清照词的创作特征","body":"李清照是中国古代文学史上创造力最强、艺术成就最高的女性作家。她的词作，主要具备如下特征：\n\n一、词作内容生动地展现了她的生命历程和情感历程\n\n李清照的一生，既享受过幸福，也饱经苦难。如果把李清照前期词作中所表现的情感世界分为两半，可以说一半是对丈夫的钟情，另一半则是对自然景物的热爱，以及对禽鸟花草的眷顾。苦涩的离愁中含有夫妻双方心心相印和彼此眷恋的幸福感，是李清照爱情词的一大特点。同时，作为杰出的女词人，李清照并没有把自己完全封闭在闺房之内，而是常常走向大自然，去感受大自然的和谐美丽，以拓展胸襟，陶冶情操。\n\n靖康之难后，李清照家破夫亡，受尽劫难和折磨。人生命运的剧变，也引起心境和词境的变化，从前轻盈妙丽的望夫词如今变成了沉重哀伤的生死恋歌，词境由明亮轻快变成了灰冷凝重。这是词人情感历程的真实写照，也是时代苦难的象征。\n\n二、李清照的词在艺术上也自成一家，被后人誉为“易安体”“婉约正宗”，主要表现在以下方面：\n\n（一）善于选取自己日常生活中的起居环境、行动细节来展现自我的内心世界\n\n李清照的情感世界是独特的，她的艺术表现方式也是独特的。她善于选取自己日常生活中的起居环境、行动细节来展现自我的内心世界。如《添字丑奴儿》（窗前谁种芭蕉树）中“愁损北人不惯起来听”的动作描写，传神地表现出初到南方时不习惯夜雨霖霪的烦躁心理。\n\n（二）清新素雅的语言\n\n李清照词的语言独具特色：\n\n（1）无论是口语，还是书面语，经李清照提炼熔铸，就别开生面，精妙清亮，风韵天然。如《声声慢》开头连用14个叠字，从动作、环境到心理感受多层次地表现出寡居老人闷坐无聊、茫然若失而四顾寻觅的恍惚悲凉的心态，更是千古创格。\n\n（2）李清照善于用最平常、最简练的生活化的语言，精确地表现复杂微妙的心理和多变的情感流程。如“只恐双溪舴艋舟，载不动，许多愁”短短三句，将内心的犹豫和不堪负载的愁苦量化和具体化，既曲折生动又巧妙自然。\n\n（三）淡雅清疏的审美境界\n\n语言的清新素雅，很适合表现淡雅清疏的审美境界。李清照曾赞美桂花是“暗淡轻黄体性柔，情疏迹远只香留。何须浅碧轻红色，自是花中第一流”。这既是李清照的审美理想，也可视作其审美境界的艺术写照。无论是写情绘景还是咏物，如《醉花阴》《怨王孙》（湖上风来波浩渺）和《孤雁儿》等，都不用华丽的色彩、富艳的词藻来装饰，而用白描手法，创造出水墨画般的清婉秀逸的意境。","keywords":"生命历程 情感历程 女性主体意识 选取日常环境、细节来展现内心世界 清新素雅的语言 淡雅清疏的审美境界","note":"李清照可以说是中国古代最重要的女性词作家，因而在考查中出现的频率也比较高。一般情况下，对于李清照的考查多集中于其“别是一家”的观点，但也会针对其词作特征进行考查。总体来看，李清照的词作在艺术上实践了她“别是一家”的主张，所以大家可以其词作的艺术特征和创作主张结合起来理解记忆。"},{"id":"276","stars":"★★★","title":"试分析朱敦儒词的特征","body":"朱敦儒进一步发挥了词体抒情言志的功能，不仅用词来抒发自我的人生感受，而且以词表现社会现实，诗词的功能初步合一，从而给后来的辛派词人以更直接的启迪和影响。朱敦儒的词作，主要具备如下特征：\n\n一、朱敦儒的词，继承和发展了苏轼抒情自我化的词风，具有鲜明的自传性特点\n\n朱敦儒虽总喜以疏荡不羁、独得全真的风流才子自许，其作品的主要内容和主要风格虽以表现超脱尘世和放旷胸襟为主，但终有一些变化。要而言之，早年多秾妍，中年多沉咽，晚年多闲淡。\n\n所谓早年多秾妍，指靖康之难以前，多写表现批风抹月的名士浪子生活，如《鹧鸪天》（我是清都山水郎）；中年多沉咽，指靖康之难后，特别是最初的几年内，结合自己的身世遭遇，写下了一些忧国伤世之作，境界开始变大，感情更为真挚饱满。但不同于张元幹等人的是，缺少高亢激昂，苍劲深沉的格调，而多低沉伤感的情绪。如《相见欢》（金陵城上西楼）、《采桑子》（扁舟去作江南客）等；但随着时光的流逝，宋金出现暂时对峙的局面，他的忧国之情又渐趋淡漠，多写些闲情\n\n野趣，因而又表现出晚年多闲淡的情况，这也是他泛舟吹笛、琴筑自娱生活的真实写照，如寓居嘉禾时所作的《好事近》即如是。\n\n朱词的风格也随着他人生历程的变化而变化。早年以婉丽明快为主；中年以悲壮慷慨为特色；晚年以清疏晓畅见长，语言通俗，明白如话。\n\n二、风格上以学苏轼的旷达为主，放任疏狂\n\n从风格看，朱词虽有秾妍、沉咽、闲淡之别，但总的词风是以学苏轼的旷达为主，其佳者确有空阔疏放的情趣，“天资旷逸，有神仙风致”。但由于才气稍欠缺，经历较平淡，感情较冷漠，所以多得其形而不得其神，很多词终缺乏苏词那种内在的飘逸清旷、通脱畅达的格调与气质，多停留在外露的放任疏狂上。如：“先生筇杖是生涯，挑月更担花。把住都无憎爱，放行总是烟霞。飘然携去，旗亭问酒，萧寺寻茶。恰似黄鹏无定，不知飞到谁家。”\n\n三、以口语、俚语或散文化句式入词\n\n朱敦儒亦喜以口语、俚语或散文化句式入词，尤其是晚期词。比起柳永，显得更明朗，不涉淫艳；比起黄庭坚，显得更清新，不涉穿凿。如他的《感皇恩》：“一个小园儿，两三亩地，花竹随宜旋装缀。”","keywords":"抒情自我化 鲜明的自传性 放任疏狂 口语、俚语、散文化句式入词","note":"朱敦儒的词有鲜明的自传性特点，随着自己人生境遇的变化，朱敦儒的词风也不断地变化。这种变化，正是他发挥词体抒情言志功能的外在表现，而这也就是他的主要成就。朱敦儒的词作，向上学习苏轼，向下启发辛派词人，整体起到了一个承上启下的作用。"},{"id":"277","stars":"★★","title":"试分析南渡词人创作的变化","body":"南渡后，由于时代的巨变，南渡词人改变了词的创作观念，强化了主体意识，创作上转向“东坡范式”的自我化、个性化，并取得突破性成就。\n\n一、扩大了词的情感容量\n\n从词的情感层次看，南渡词人扩大了词的情感容量。“花间范式”词表现的是单向一维的情思，东坡词表现的多是双向二维的矛盾心态，而南渡词人则将多维多向的、瞬息变化的情志浓缩于一词，扩大了词的情感容量。南渡词人步武东坡，破“艳科”之藩篱，接诗骚之统绪，词不再是侑觞以佐清欢的“余事”“小道”，而是可以言志、书愤、写怀的庄重之体。“诗庄词媚”的界限一经打破，脂粉香泽之气便为之一扫，流宕无聊之风也荡然无存，词才开始和诗、文一样跻入文学正宗之堂庑，题材随之拓展。所以南渡词中，大凡家国之痛、偏安之恨、报国之情、灭虏之慨，无不流露于笔端，痛愤彻骨，正气凛然，感情真挚。\n\n二、具有崇高美\n\n在艺术境界上，南渡词拓展了词的审美空间，“花间范式”词的艺术世界主要局限于人造建筑空间内外，而南渡词则在东坡词的基础上进一步延伸向寥阔旷远的自然山水空间，具有崇高美。如张元幹目睹民族的灾难，扼腕痛愤，词风自觉转向东坡一路，而变得慷慨悲凉。题材取向上则直面山河残破的惨痛现实，写下了《石州慢·己酉秋吴兴舟中作》这样的名作。\n\n三、与时代联系紧密\n\n就词与现实生活的关系而言，南渡词与火热的现实生活、激烈的时代变化息息相关，及时地表现出时事的动向、民族的心声和社会的苦难，具有鲜明、强烈的时代感和现实感。靖康之难后，金兵的铁蹄改变了南渡词人后半生的生活和创作倾向。民族的屈辱、山河的残破和民众的苦难，促使他们自觉接受苏轼的词风，为救亡图存而呐喊呼号，并日益贴近社会现实生活，用词去表现战乱时代民族、社会的苦难忧患和个体理想失落的压抑苦闷。\n\n四、注重表现人生经历和日常生活\n\n在词的叙事层次，南渡词注重表现自我的人生经历和日常生活，具有自传性和日常性特点。南渡词的主体就是词人本身，所表现的是词人的心态历程，词作成为“私人日记”，不再是娱宾遣兴的工具，也不再是超越时代和个体的普泛化情绪的外现，而是词人宣泄内心情感，表达个我意志的载体。因此，南渡词在主题基本一致的基础上，呈现出非常富有个性的色彩。无论是在表现主体的内心世界方面，还是在表现客观的自然山水空间和外部社会现实生活方面，南渡词都有深广的拓展。","keywords":"扩大情感容量 崇高美 与时代联系紧密 注重表现人生经历和日常生活","note":"两宋之交南渡词人群的创作，使词风又产生了新变，这一时期社会现实翻天覆地的变化，导致这些词人的词作远离了“花间范式”而朝着“东坡范式”发生了重大的转变，这主要表现在词作的内容上，整体情感更加丰富，与时代联系也更加密切。"},{"id":"278","stars":"★★★★","title":"试述陆游的诗学主张","body":"陆游被认为是“中兴四大诗人”之首。他学诗从江西诗派入手，而又能够摆脱江西诗派的束缚。他强调诗歌从生活中取材，讲究诗歌表达的技巧、方法，注重转益多师，兼收并蓄。具体来看，陆游的诗歌主张，主要表现为以下方面：\n\n一、重视诗句锤炼，讲究表达技巧和方法\n\n陆游虽然晚年对江西诗派持否定态度，但并没有完全否定江西诗派主张艺术锤炼、讲究诗法的艺术取向。他有诗句“诗家忌草草，得句未须成”，又有“我得茶山一转语，文章切忌参死句”，强调作诗应从“活法”入手而重视作诗的“句法”。他强调“律令合时方帖妥，工夫深处却平夷”，主张作诗重视韵律的妥帖而以自然面目呈现。这种由锤炼而归于自然的诗歌创作主张，正是黄庭坚强调的“平淡而山高水深”的老成诗歌创作境界。\n\n二、强调诗歌从社会现实生活中取材\n\n陆游在继承学习江西诗派的同时，受到时代政治、文化思潮等影响，重视诗歌从社会现实生活中取材，这就与片面强调诗法“圆活”的吕本中、曾几等人，以及重视“师法自然”的杨万里等诗人，拉开了距离。\n\n陆游将这一命题并入十字之中：“汝果欲学诗，工夫在诗外。”认为文学创作不能只在因袭点化前人的作品中讨生活，而要向丰富的现实生活索取，这就摆正了流与源的关系。陆游讲“纸上得来终觉浅，绝知此事要躬行”，又讲“君诗妙处吾能识，正在山程水驿中”，表明了其重视诗歌创作向现实生活取材。\n\n陆游还针对北宋末年以来某些脱离现实的不良倾向，提倡李、杜、欧、苏等人的优良传统，重新倡导注重现实的诗歌理论，强调文学创作应该重内容、重感情、重人品、重气节，认为“谁能养气塞天地，吐出自足成虹霓”！\n\n三、提倡平淡自然，清新古朴的文风\n\n陆游提倡平淡自然，清新古朴的文风。特别是到晚年，他更倡导此风，并身体力行。这种风格和他家居赋闲的生活背景分不开，这说明诗人已达到将生活、主张、创作完全谐为一体的境界。这种主张也是对江西诗派过于追求雕琢藻饰的一种纠正。陆游认为诗虽然应求工致，但这并非诗之最高境界。只为求工而求工，过分地锻炼斫削，过分地讲究字字有来历，反失诗之本旨，伤诗之正气，为诗家之大病。他认为“大巧谢雕琢”，最美的诗应如“太羹玄酒”，以平淡为最高原则。为了达到这一审美理想，诗人就不能“有意”地去创作，而应忘掉工拙，全凭从胸臆中自然流出，这就是他所谓的“诗凭写兴忘工拙”“无意诗方近平淡”。从这一点看，他受梅、欧的影响较深。","keywords":"诗句锤炼 表达技巧和方法 从社会现实生活中取材 平淡自然 清新古朴","note":"陆游师事曾几，又私淑吕本中，受到了江西诗派很大的影响，但很快便超越了江西诗派。他在学习江西诗派的诗歌技巧的同时，向上学习唐代李白、杜甫和宋代梅尧臣、欧阳修和苏轼等诗人，贴近现实，自然平淡，显示出了与江西诗派迥异的追求，这也是他成为“中兴四大诗人”之首的关键所在。"},{"id":"279","stars":"★★★★★","title":"试述陆游诗歌的创作特征","body":"陆游一生主张抗金恢复故土而不得，其练达恢弘之才，激愤忠贞之气，一发之于诗文，奠定了陆游在南宋诗坛的重要地位。陆游的诗歌创作，主要具备如下特征：\n\n一、诗歌内容丰富，以爱国主题和日常生活情景的吟咏成就最高\n\n陆游一生勤奋创作，流传至今的诗就有九千四百多首。诗歌的内容也极为丰富，几乎涵盖了当时社会生活的各个方面，其中最重要的是对爱国主题和日常生活情景的吟咏。\n\n爱国的主题在中国古代诗歌中源远流长，每当国家面临危亡时，这种主题总会在诗坛上大放异彩。陆游继承了这种传统，并把它高扬到前无古人的高度。爱国主题不但贯穿了陆游长达60年的创作历程，而且融入了他的整个生命，成为陆诗的精华和灵魂。如从数量来看，陆诗中爱国主题的作品不足十分之三，但这些诗代表着陆诗的主要思想倾向。陆游写出了沦陷区人民对故国之师的期待：“遗民泪尽胡尘里，南望王师又一年！”也写出了南宋军民不甘屈服的气概：“楚虽三户能亡秦，岂有堂堂中国空无人！”\n\n陆游热爱生活，善于从各种生活情景中发现诗材。无论是高山大川还是草木虫鱼，无论是农村的平凡生活还是书斋的闲情逸趣，他都有细致入微的描绘，如《游山西村》和《临安春雨初霁》，前一首赞美宁静的村景和淳朴的民风，后一首抒写对京华红尘的厌倦，但对江南春雨和书斋闲适生活的描写却优美动人。这又反映出时时梦见铁马冰河的志士陆游，也同样热爱和平的日常生活。\n\n陆游的爱情诗虽然数量很少，但却是古代爱情诗中不可多得的精品，在爱情主题已基本上从诗歌转移到词中的宋代，它们尤其值得重视。由于陆游有如此哀艳动人的爱情挫折，所以他的爱情诗、忆内诗就远比一般人，如潘岳、梅尧臣等感人得多，成为中国古典爱情诗宝库中难得的佳制，如《沈园二首》，缠绵悱恻，哀感顽艳。\n\n二、气势奔放、境界壮阔的诗风\n\n陆游性格豪放，胸怀壮志，在诗歌风格上追求雄浑豪健而鄙弃纤巧细弱。他不满“翡翠兰苕”般的纤巧，而赞美屈、宋赋和李、杜诗的“雄浑”。正是在这种风格论的指导下，陆游形成了气势奔放、境界壮阔的诗风。\n\n陆游热情奔放，神采飞扬，把在现实生活中无法实现的壮志豪情都倾泻在诗中，常常凭借幻境、梦境来一吐胸中的壮怀英气，如“夜阑卧听风吹雨，铁马冰河入梦来”。丰富多彩的纪梦诗，构成了陆诗飘逸奔放的特点，而神似李白。然而严酷的现实环境毕竟给诗人心灵压上了无法摆脱的重负，梦中的幻境终究是要消逝的，所以陆游的诗风又有近于杜甫的沉郁悲凉的一面，如“破驿梦回灯欲死，打窗风雨正三更”。\n\n兼融李白的飘逸奔放与杜甫的沉郁顿挫于一炉，构成了陆游的独特诗风。但陆诗又不像李、杜诗那样雄奇莫测，陆诗的语言平易晓畅，章法整饰谨严，即使是七言古体也不例外。\n\n三、擅长七言诗\n\n陆游擅长的诗体是七言诗，他的七古、七律和七绝的成就都很高。陆游的七律尤以对仗工整而著称。陆诗的对仗常常能做到工整而不落纤巧，新奇而不至雕琢，同样体现出平易近人的倾向。这就与他深为不满的晚唐诗风拉开了距离，而与苏、黄以来的宋诗的倾向一脉相承。\n\n陆游的七绝笔致流转，情韵深永，《剑门道中遇微雨》是其代表作，悲愤的情绪出之以清丽流转的字句，情致深婉，颇有向唐人绝句意境回归的迹象。\n\n四、讲究工力与锤炼\n\n讲究工力，注重锤炼，是陆游诗歌的又一特征。除了善于锤炼名对外，还有诸多表现：\n\n（一）善于使事用典\n\n陆游善于将使事与表情有机地结合在一起。为此他虽有万卷之富，但从不以数典为能事，更少掉书袋式地为用典而用典；一旦用典，则驱使如意，妥贴通畅，无斧凿痕，无生涩感，甚至使人不觉其用典。从《陇头水》《金错刀行》《书愤》诸诗中，都能看出这一特点。\n\n（二）有高度的语言技巧\n\n陆游诗的语言风格与陆游诗的题材内容和思想感情极为谐合。鼓唱北伐，讴歌光复则多用豪丽语、雄壮语，慷慨悲壮，磅礴激越，极具感染力；描写自然风光，吟咏农村生活，则多用平淡语、通俗语，自然清新，平和粹美，与他倡导的妙语天成风格十分统一；描写闲适生活，表现恬静心情，则多用工致语、精美语，温润圆美，考究精致，具有丰富细致的表现力。这些语言的使用，看来都像信手拈来，毫不费力，但实际上都是经过炉锤锻炼的。","keywords":"内容丰富 爱国主题 日常生活情景 气势奔放 境界壮阔 擅长七言诗 七律对仗工整 七绝笔致流转，情韵深永工力与锤炼 使事用典 高度的语言技巧","note":"在南宋诗人中，陆游是成就最高的一位，也是在考查中出现最多的一位，大家要注意重点关注。在陆游的诗歌创作特征之中，可以看到陆游创作主张的影响，比如讲究锤炼、兼融李杜诗风、表现日常生活，大家可以把这二者结合起来理解记忆。不过，在文学史上影响最深远的，也是值得我们注意的，还是陆游的爱国诗歌。"},{"id":"280","stars":"★★★★","title":"试分析陆游爱国诗的特征","body":"陆游的爱国诗内容博大，思想精深，感情真挚，多层次、广角度、深入全面地反映了他的爱国思想，深刻形象地揭示了他所处的不幸时代，具有强烈的时代性与个性。\n\n一、思想的明确性\n\n陆游始终是以一个爱国志士的身份来写爱国诗的，因而以诗明志、以诗报国的目的非常明确自觉。陆游所遭之世，外有强虏，内有奸佞，小人得势，志士蒙怨，他自己平生志向、满腹经纶总不得施展，因此才将其忠君爱国之心，愤郁不平之气，恢复宇宙之志，一并借助于诗而发之。在陆游以前，已出现过不少爱国诗人及爱国诗作，但有些人只借此表达对国事的忧愤或关切，并未完全自觉地把自己当作这一事业中的一员以亲身参与者的口吻来写爱国诗，因此比起“修我戈矛，与子同仇”的陆游来就不免逊色了，\n\n陆游的爱国诗，有的主张抗战，讴歌北伐，志在收复故土。如“君不见昔时东都宗大尹，义感百万虎与狼。疾危尚念起击贼，大呼过河身已僵”褒扬抗战名将宗泽。有的谴责金人的野蛮统治，满含对沦落故土人民的思念，如“中原昔丧乱，豺虎厌人肉。辇金输虏庭，耳目久习熟。不知贪残性，搏噬何日足”，强烈抨击金人的贪残凶暴。如“三万里河东入海，五千仞岳上摩天。遗民泪尽胡尘里，南望王师又一年”，刻画沦落故土人民渴盼光复的心情。有的谴责南宋统治集团苟安妥协的政略，如“诸公尚守和亲策，志士虚捐少壮年”“战马死槽枥，公卿守和约”，表达出作者对英才见弃、恢复故土主张无从实现的无奈与愤慨。\n\n三、信念的坚定性，一贯性\n\n在敌强我弱，主降嚣张的形势下，陆游始终不屈不挠地坚持爱国立场，“未敢随人说弭兵”，并把这一信念坚持到生命的最后一刻。他从来不因自己的进退顺逆、衰老病废而改变初衷，其坚定性与一贯性弥足可贵。他明确地认识到，在当时的形势下，作为一个爱国志士只有一种选择，这就是抗战：“故国吾宗庙，群胡我寇雠。但应坚此念，宁假用他谋？”为此，他二十岁时就立下了“上马击狂胡，下马草军书”的报国大志。随着年华的不断流逝，他豪迈地唱道：“壮心未与年俱老，死去犹能作鬼雄。”他八十一岁高龄时仍然慷慨高歌：“一闻战鼓意气生，犹能为国平燕赵。”直到弥留之际，仍只以国事为念，留下了千古感人的《示儿》篇。\n\n四、表现的自觉性\n\n陆游的爱国思想决非只在特定的爱国题目中才有所表现，它渗透到各种题材之中，如投赠、忆昔、行役、登览、饮酒、读书、记梦，以至看画题字、歌咏时令等，可谓无处不在，无时不在，随心所欲，任意挥洒。几朵鲜花，一声雁唳，数行草书，都能勾起他高昂的爱国激情。正像《唐宋诗醇》所评不但那些“酒酣耳热，跌荡淋漓”的作品能表现其爱国思想，即使是“渔舟樵径，茶碗炉熏，或雨或晴，一草一木，莫不著为歌咏，以寄其意”。可以说他已将这种激情化入他全部的生活和创作中去了。\n\n五、塑造出伟岸高大、胸怀磊落而见识不凡、干练进取的爱国主人公形象\n\n陆游的爱国诗，塑造出伟岸高大、胸怀磊落而见识不凡、干练进取的爱国主人公形象。诗中的主人公形象往往是多元的、丰富的，有的诗句着重突出的主人公形象表现为孤愤难言、壮志难申，如《夜泊水村》在慨叹报国无门的同时又夹杂有雄心仍在的热血抱负。有的诗句着重突出的主人公形象表现为信念坚定，必偿所愿，如《纵笔》，诗句主题集中，表达出不与敌人妥协而宜善自绸缪的政治主张。陆游诗歌中，爱国思想已经成为诗中主人公形象的重要组成部分。","keywords":"思想的明确性 题材的广泛性 信念坚定性、一贯性 表现的自觉性 爱国主人公形象","note":"陆游的爱国诗可以说是他所有诗作里面最重要的一部分内容，也是影响最深的一部分内容。这些诗篇思想明确，题材广泛，表露出了陆游坚定的信念和自觉的爱国热情，并成功塑造了一个爱国主人公形象。有宋一代，爱国诗人中，陆游的情绪最为饱满，信念也最为坚定。"},{"id":"281","stars":"★★★","title":"试分析陆游诗歌的地位与影响","body":"陆游在文学史上占有举足轻重的地位，尤其是在诗歌史上影响更为深远。陆游的诗歌，产生了很重要的影响：\n\n一、在诗歌领域集前人之大成，受到当时及后世的推崇\n\n陆游在各个领域都能广泛地吸取前人的成果，尤其在诗歌领域中更能集前人之大成。他对前代《诗经》及杜甫、梅尧臣等人的现实主义，屈原、李白、苏轼等人的浪漫主义，陶渊明、王维等人的田园诗派，岑参、高适等人的边塞诗派都有所继承，并能注入新的时代色彩。因而他的文学创作，特别是诗歌创作，在当时即享有盛誉，并不断地受到后人的推崇。人们称赞他“四海诗名老放翁”“四海文章陆放翁”，更有人称赞他为南宋、甚至是两宋第一诗人。如刘克庄《题放翁像二首》即称其为“过江后一人”，赵翼《瓯北诗话》即称“宋诗以苏陆为两大家，......而不知陆实胜苏也”。\n\n二、重振南宋诗风\n\n陆游在南宋诗坛上占有非常重要的地位。南宋初年，虽然局势危急，但士气尚盛，诗坛风气颇为振作。但随着南宋小朝廷偏安局面的形成，士大夫渐趋消极，诗坛风气变得萎靡不振，吟风弄月的题材走向和琐细卑弱的风格倾向日益明显。陆游对这种情形痛心疾首，有诗说：“尔来士气日靡靡，文章光焰伏不起。”\n\n陆游高举起前代屈、贾、李、杜和本朝欧、苏及南渡诸公（吕本中、曾几等）的旗帜与之对抗，以高扬爱国主题的黄钟大吕承担起振作诗风的历史使命，并对南宋后期诗歌产生了积极的影响。江湖诗派中的戴复古和刘克庄都师承陆游，戴曾登门受教，刘则为私淑弟子，他们在主题倾向和艺术风格上都受到陆游的深刻启迪。\n\n三、以其爱国精神对后世产生深远影响\n\n宋末之时，国破家亡的时代背景更使陆游的爱国精神深入人心，林景熙在宋亡之后作《书陆放翁诗卷后》，对陆游继承杜甫的传统予以高度评价：“天宝诗人诗有史，杜鹃再拜泪如水，龟堂一老旗鼓雄，劲气往往摩其垒。”并沉痛地追悼陆游：“来孙却见九州同，家祭如何告乃翁！”陆游的爱国诗歌在后代也有深远的影响。特别是清末以来，每当国势倾危时，陆诗往往成为鼓舞人民反抗外来侵略者的精神力量。如梁启超《读陆放翁集》云：“诗界千年靡靡风，兵魂销尽国魂空。集中什九从军乐，亘古男儿一放翁。”","keywords":"集前人之大成 振作诗风 爱国精神","note":"陆游的地位与影响，首先表现在诗歌上。作为“中兴四大诗人”之一，他上承前人诗歌传统，下启南宋一代诗风。同时，陆游的影响不仅仅局限在诗歌领域，他的爱国精神，无论在后世哪个时代都有回响。可以说，无论是从文学史意义上还是从社会意义上，陆游都是一位十分重要的诗人。"},{"id":"282","stars":"★★","title":"试分析杨万里“诚斋体”的艺术特色","body":"杨万里是一个极具创造性和个性的作家。他的诗具有独特的艺术风格，被后人称为“诚斋体”。“诚斋体”可以用一个“活”字来概括，在创作上纯以活法取胜并取得巨大成就的，还要推杨万里。具体讲，“诚斋体”的活法主要体现在以下几方面：\n\n一、细腻小巧，机智敏锐\n\n“诚斋体”细腻小巧，机智敏锐，善于捕捉瞬间的景物、动作、心情、感受，于他人忽略或难见处提炼诗情，且能使之富有情趣。在杨万里眼中，自然界的万事万物都充满了活泼意趣与灵动生机，“草根未响渠先觉，不待黄鹂第一声”，正可视为这种敏感的自道。比之于散文、戏剧，它们就像一篇篇或一出出生动活泼的小品。\n\n二、想象奇特，立意新巧\n\n在处理常见题材时，杨万里特别善于别出手眼，在别人意想不到处落笔。这一特点在写景诗中表现得尤为突出，达到了他自我标榜的“别眼看天工”的境地。这使他笔下的山川景物既不同于缺乏浑然境界的谢灵运，又不同于专写静美、充满禅悦的王维，充满了诚斋体的个性特色。为了和这一特色相适应，杨万里极善于使用生动活泼的拟人手法把自己与自然景物息息相通的感情表达得十分深刻。\n\n三、层次曲折，深婉多致，变化无穷\n\n杨万里有着融合苏、黄的自觉诗学追求，其要在于引苏入黄。他不仅继承了苏轼诗的流畅节奏和连贯气势，更加注重表现转瞬即逝和不断变换的景象，从而形成了自己独特的“活法”特色。“大抵浅意深一层说，直意曲一层说，正意反一层、侧一层说”。通过这种手段，往往能于同样题材上比别人多翻出一两层曲折，避免了陈俗平庸和直露。如《雪晓舟中生火》将点火生烟、烟雾氤、炭火吐红、火冷雾灭的过程写得波澜迭起、兴味盎然。\n\n四、善于调侃谐谑\n\n杨万里善于调侃谐谑，使作品充满幽默风趣。这类作品往往写得俏皮轻松，有的使“见者无不大笑”，但正像《宋诗钞》所评，“不笑，不足以为诚斋之诗”。这正是他的特色。值得指出的是，这类作品虽颇多滑稽，但很少给人油滑之感，相反，能在似不经意中隐约体现出一定的理趣，有些诗还充满了禅悦或深刻的讽刺性，为哲理诗的幽默化作出了贡献，如《宿灵鹫禅寺》。\n\n五、诗风清新自然，语言平易通俗\n\n为与“活法”相谐，杨万里的诗风清新自然，语言平易通俗。杨万里的诗风，以自然美取胜。即使再尖巧，再曲折的构思，他都能举重若轻地流畅表达，给人一种流转如弹丸、清澈如泉水的感觉。他的语言很接近口语，有时索性直用俚俗之语，其佳作的巧处，往往即是其俚处，这更增加了其诗的幽默与活泼，如《插秧歌》。","keywords":"细腻小巧 机智敏锐 想象奇特 立意新巧 层次曲折 深婉多致 变化无穷 调侃谐谑 清新自然 平易通俗","note":"杨万里是作诗纯以活法取胜并取得巨大成就的第一人，而这又以其“诚斋体”诗歌为典型代表。一般情况下，“诚斋体”这一概念多以名词解释的形式进行考查，但也有出简答题或论述题的可能性，所以我们也有必要准备一下相关内容。"},{"id":"283","stars":"★★","title":"试分析范成大田园诗的思想艺术特色","body":"范成大诗内容充实，尤其值得称述者是那些反映民生及爱国思想的作品。范成大诗能从多方面深入而生动地反映人民生活。在这一主题上他可谓中国诗歌史上成就最高的作家之一。范成大的田园诗，主要具有如下特征：\n\n一、以乐府诗写田园生活\n\n范成大的田园诗，注重以乐府诗写田园生活。乐府诗是古老的诗歌体式，但以乐府写田园题材到唐代才逐渐兴起，尤以中唐以后的张籍、王建乐府值得重视。自杜甫开创新题乐府以来，经元稹、白居易新乐府运动的发扬，张籍、王建也往往以新题写时事，这从诗歌体式到表现方式都启发了范成大，他的《乐神曲》《催租行》等便标明是“效王建”而作。如其《缫丝行》写农妇煮茧缫丝的忙碌景象，揭示出农民即使得到丰收，也仅是在租税的盘剥之下勉强解决温饱而已。范成大也有直接描写农民在租税重压下的悲苦生活的作品，如《催租行》《后催租行》等，作者敏锐地抓住“催租”这一重要的社会问题，集中地加以表现。\n\n二、富有生活气息\n\n田园诗往往是从文人隐士的视角入手，在恬静美好的田园风光的描写中，寄托他们离尘绝俗的隐居之意。范成大的田园诗也体现了这种文人雅意，他笔下的田园风光同样是恬静美好的，但更多的是直接对田家劳作与苦乐生活的描写，“田家”成为其田园诗的主角。范成大不仅继承前人传统，以悲悯的情怀写出田家之苦，而且全面反映田家生活，表现田家之乐与风俗民情。这种田家之乐不同于王孟笔下寄托着隐居情怀的雅士之乐，而与范成大所描绘的田园风光一样，充满了真实、质朴的泥土气息。\n\n范成大能把中唐以来表现农民悲惨生活的新乐府诗的精神移植到田园诗中，全面而深刻地反映农家的景物、岁时、风俗、劳作、苦难、煎迫、奋斗等各种内容，尤其能写出上上下下各层统治者对人民的压迫，因而相对提高了田园诗的价值。\n\n三、具有通俗化取向\n\n在诗歌的内容上，范成大的田园诗体现出取材上的鲜明倾向性，表现为对自然万物、农村风光、山水田园、人情物态的普遍兴趣。尽管这些题材内容大体来说并不新颖，甚至为诗中所常见，但范成大的田园诗往往表现出一种更为日常化生活化、琐细化的特质。如同是描写田园风光，王孟之诗充满高雅闲逸的牧歌情调，范诗却体现平淡质朴的泥土气息；同是描写田夫渔父，王孟之诗刻画得如同世外桃源的隐逸之士，范诗却写出他们作为底层劳动者的平凡而真实的苦乐生活。","keywords":"以乐府诗写田园生活 生活气息 通俗化取向","note":"范成大的诗歌反映的内容十分广阔，其中以爱国题材和田园诗成就最高。范成大的田园诗成功地对这一传统题材进行改造，在内容上显露出了与以往田园诗完全不同的风貌，拓展了田园诗的内容，因而取得了十分突出的成就。"},{"id":"284","stars":"★★★★","title":"试述辛弃疾词的主要类型","body":"辛弃疾词集有四卷本《稼轩词》及十二卷本《稼轩长短句》两种，存词六百二十馀首，数量为两宋词人之冠。他的词作题材广泛、内容丰富，大致可以分为以下几类：\n\n一、英雄词\n\n辛弃疾天生孔武高大，目光炯炯，平生也“以气节自负、以功业自许”。所以辛弃疾更愿意被人看作是一位具有谋猷远略的英雄人物，而不是一位词人。他词中很多内容是描述他虎啸生风、叱咤风云的英雄情怀，特别是早年从军时的情境，常常会一再显现，如“少年握槊，气凭陵、酒圣诗豪馀事”“壮岁旌旗拥万夫，锦襜突骑渡江初。燕兵夜娖银胡，汉箭朝飞金仆姑”。这种以英雄自许的雄心壮志，也随处流露在与僚属、友人交往的词中。他曾赋写壮词寄赠好友陈亮；即便是登临古迹之时，抒发的仍是英雄老矣，但尚可驱驰的豪情，如晚年知镇江任上的《永遇乐·京口北固亭怀古》，词中尽是对往古英雄的追慕，同时又有自我的“英雄感怆”。\n\n二、失意词\n\n受制于以投降苟安为基本国策的南宋小朝廷，任何爱国志士的愿望肯定都要落空，志向越大，失望也越大，陆游和辛弃疾的悲剧都在这里。辛弃疾南归的四十多年间，大半时间皆被朝廷弃而不用。南归之初，辛弃疾壮志勃勃地上表，因“持论劲直，不为迎合”，于乾道三年心绪寥落地返回金陵。后来的二三十年间，他历遍宦海浮沉，失意的情绪更为浓重。因此表现自己壮志难酬、报国无门的失意又成了辛弃疾爱国词的重要内容。如写于乾道三年的名作《水龙吟·登建康赏心亭》沉郁顿挫、慷慨悲凉，最能体现辛词的风格。而辛弃疾的那首《清平乐》，被认为是对他晚年心境的最好概括。\n\n三、闲居词\n\n辛弃疾曾在庄园中赋闲近二十年，无奈的辛弃疾便在乡村山水中安顿心灵，写下很多诗酒自娱、风流自赏的闲居词。其中，辛弃疾直接或间接描写农村的词约有三四十首，这是对苏轼农村词的继承和发展。\n\n在词史上，苏轼也有二十多首农村词，但多浩怀逸情，其中活跃的是一种浪漫热烈的士大夫情调，而辛弃疾却以沉稳的笔法刻画真切的生活画卷，为我们呈现一道清新自然的乡村风景线。虽和苏轼一样，辛弃疾对农民的痛苦生活缺乏描写，但\n\n对农村的劳动生活、自然景色有更为广泛的表现。在他的词中，有客来即掀老坛、拨新醅的敦厚老者；有趁着蚕生的空闲，匆匆回娘家的小媳妇；有北陇之上踏水的劳动者，竹边村头的卖瓜人。乡村的平凡人物，生气勃勃地走进词世界。还有东家娶妇，西家女等充满乐趣的农村生活。\n\n由以上内容来看，辛词的思想内容比苏词更为广阔，真正达到“无意不可入，无事不可言”“如诗如文”的地步。\n\n【李凡关键词：英雄词 失意词 闲居词】","keywords":"","note":"辛弃疾词题材广泛，内容丰富，总体来说，可以分为英雄词、失意词和闲居词三类。从这三种词作类型就可以看出，辛弃疾词的思想内容比苏轼词更为广阔，因此可以说辛弃疾是在苏轼之后，对词作表现内容又进行了一次拓展，推动了词体的进一步发展，这一点我们会在之后进行详细论述。"},{"id":"285","stars":"★★★★","title":"试分析辛弃疾词运用典故有何特征","body":"辛弃疾用典繁多，是其才气使然、遭际使然，虽有雕琢堆砌之嫌，但胜在辛氏真情至性，写典圆熟自然，且博采前人之长，创一家之语，为后人用典树立了很多范例。辛弃疾用典，主要具备如下特征：\n\n一、用典广泛、庞杂\n\n辛词用典的杂而广，已到了举凡《论语》《孟子》《庄子》《诗经》《左传》《离骚》《史记》《汉书》《世说》《文选》、李杜诗，无不尽用，且运用得极为自然。这和他“驰骋百家，搜罗万象”的博学多闻有关。据统计，629首稼轩词合计共用典故1648余处，也就是说平均每首词都要用2到3个出于经史子集或与之相关的典故。由此可以清楚地发现辛弃疾用典的规模与数量是相当惊人的。\n\n二、根据个人诉求需要来运用典故\n\n就稼轩词中的常用典故来看，辛弃疾用典讲求个人的诉求需要，他用典时喜欢信手取用与自己当下心境相合的典故，以推进自己的情感。辛弃疾大多数作品的用典，均能与词人所表现的当下景致或感受相契合，因此词在整体上往往带有一重比字面意义更深切的意蕴。如为了配合借古喻今、表现爱国思想及个人的不幸遭遇，辛弃疾特别喜欢用历史上英雄人物和悲剧人物的典故，如诸葛亮、刘裕、谢安等。\n\n三、用典形式多样，花样翻新\n\n（一）辛弃疾善于连用典故，在《永遇乐·京口北固亭怀古》中，一气连用了孙权、刘裕、刘义隆、佛狸、廉颇等人之典，而这些人除廉颇外，都与作词的地点京口有关，所以用在词中并不觉得丝毫牵强。辛弃疾在连用典故时还能层层深入，与言志抒情有机地融为一体。如《水龙吟·登建康赏心亭》下阕连用三典，浑然一体，表达了复杂的感情，且演进得极有层次。\n\n（二）辛词有时还反用典故，如“休说鲈鱼堪脍，尽西风、季鹰归未”反借张翰见秋风起则思归隐的典故，表现归隐不是词人这样立志恢复中原的人的真正心志。\n\n（三）辛弃疾也会将同类性质的典故组合使用，令人有目不暇接之感。\n\n四、重复用典\n\n稼轩词用典还有一个特点，就是用典重复的多。据大致统计，稼轩词中重复用的典故超过了200个。如张翰思故乡鲈鱼莼羹而辞官南归的典故在辛弃疾词中出现过11次，谢安中年伤别的典故出现过9次，另外诸如冯谖弹铗、伯牙子期高山流水觅知音等事典在稼轩词中的出现次数都在3次以上。由于辛弃疾用典与自己情感结合，故这些重复的典故侧面反映的也正是辛弃疾心中的症结。\n\n辛弃疾用灵活多变的手法，赋予了古事、古人、古语新鲜的血液，使其爆发出更蓬勃的力量。“用典”这种修辞手段本身，就是稼轩词修辞的一大艺术特色。","keywords":"用典广泛、庞杂 个人诉求需要 形式多样 连用典故 反用典故 同类性质典故组合使用 重复用典","note":"在宋代词人之中，辛弃疾可以说是用典最多最广的一位，但由于其有真情至性，所用典故都是根据辛弃疾个人诉求需要来使用的，从中可以看出辛弃疾的情感。所以用典虽多，却圆熟自然，给后人树立了典范。相关内容可以参考朱安义《辛弃疾词用典艺术浅探》，具体资料可以在李凡文学正版群内领取。"},{"id":"286","stars":"★★★★★","title":"辛弃疾对词境的开拓体现在哪些方面","body":"一、抒情主人公形象的开拓\n\n唐五代以来，词中先后出现了三种主要类型的抒情主人公，即唐五代时的红粉佳人、北宋时的失意文士和南宋初年的苦闷志士。辛弃疾横刀跃马登上词坛，又拓展出一类虎啸风生、气势豪迈的英雄形象。\n\n（一）使命感强烈而执着\n\n辛弃疾平生以英雄自许，渴望成就英雄的伟业，成为曹操、刘备那样的英雄，英雄的历史使命，是为民族的事业而奋斗终生。在唐宋词史上，没有谁像辛弃疾这样钟情、崇拜英雄，书写英雄的精神个性。辛弃疾的使命感异常强烈而执着，“道男儿、到死心如铁，看试手，补天裂”。即使是仕途失意，落魄闲居，也难忘他的历史使命，时刻思念着故国江山；虽华发苍颜，但壮心不已。\n\n（二）豪情激扬的心态\n\n作为英雄壮士，辛弃疾的心态，既不同于晏、欧诸人的从容平和，苏轼的超然旷达，秦、周等人的悲戚哀怨，也不同于南渡志士悲愤渐平之后的失望消沉，而常常是豪情激扬，“气吞万里如虎”。激烈难平的幽愤，高度深沉的压抑，飞动跳荡的生命激情，构成了辛弃疾独特的生命情怀。\n\n（三）具有阶段性特征\n\n辛词有意“要写行藏入笑林”，注重从人物的行为活动中展现抒情人物的心态情感和个性形象。因此其词中的抒情人物形象不仅丰满鲜活，富有立体感，而且具有变异性、阶段性特征。\n\n少年的辛弃疾，是沙场点兵的将帅，执戈横槊的英雄，气势豪迈，虎啸风生：“少年握槊，气凭陵，酒圣诗豪馀事。”进入中年后，经历了人世的危机和宦海浮沉，他已无法点兵沙场，当年叱咤风云的少年将帅变成了“和泪看旌旗”“试弹幽愤泪空垂”的失路英雄。被迫退隐以后，又变为手不离杯的醉翁、抱瓮灌园的村叟。到了暮年晚景，辛弃疾已是“不知筋力衰多少，但觉新来懒上楼”的衰翁。虽然他仍执著于功名事业，但已逐渐失去了往日的狂傲与乐观，而常常陷入失望之中。\n\n稼轩词所展示的自我形象，是唐、宋词史上独一无二的个性鲜明丰满的英雄形象。\n\n二、对心灵世界的开拓\n\n辛弃疾对词的心灵世界也有深广的拓展。南渡词人的情感世界已由个体的人生苦闷延伸向民族社会的忧患，辛弃疾继承并弘扬了这一创作精神，表现出更深广的社会忧患和个体人生的苦闷，如《水龙吟·登建康赏心亭》充分表现出英雄心灵世界的丰富性和曲折性，深度开掘出词体长于表现复杂心态的潜在功能。\n\n辛弃疾对民族苦难忧患的社会根源有着清醒深刻的认识，《美芹十论》和《九议》就透彻地分析了南宋王朝的社会弊端。在词中，他也往往用英雄特有的理性精神来反思、探寻民族悲剧的根源，因而他的词作比南渡词人有着更为深刻强烈的批判性和战斗性，如在名篇《摸鱼儿》词中对排挤妒忌自己的群奸小人进行了辛辣的嘲讽和抨击。\n\n辛词系统地批判了当时社会的腐朽黑暗，不仅拓展了词境，也强化了词的现实批判功能，对南宋后期刘克庄、陈人杰等辛派词人以词为抗争社会的武器有着直接的影响。\n\n三、对农村田园生活和隐逸情趣的表现\n\n辛弃疾拓展词境的另一个层面是对农村田园生活和隐逸情趣的表现。辛弃疾在江西上饶、铅山的农村先后住过二十多年，他熟悉也热爱这片土地，并对当地的村民和山水景致作了多角度的素描，给词世界增添了极富生活气息的一道清新自然的乡村风景线。虽和苏轼一样，辛弃疾对农民的痛苦生活缺乏描写，但对农村的劳动生活、自然景色有更为广泛的表现。\n\n在他的词中，有客来即掀老坛、拨新醅的敦厚老者；有趁着蚕生的空闲，匆匆回娘家的小媳妇；有北陇之上踏水的劳动者，竹边村头的卖瓜人。乡村的平凡人物，生气勃勃地走进词世界。还有东家娶妇，西家女等充满乐趣的农村生活。\n\n傲然独立的英雄竟如此亲切地关注那些乡村的父老儿童，体现出辛弃疾平等博大的胸怀和多元的艺术视野。在唐宋词史上，也惟有辛弃疾展现过如此丰富多彩的乡村图景和平凡质朴的乡村人物。","keywords":"气势豪迈的英雄形象 心灵世界 批判性和战斗性 田园生活和隐逸情趣","note":"辛弃疾对词境的开拓是多方面、多层次的。同样是对于词境的开拓，相较于苏轼，辛弃疾明显更加深入，无论是崭新的抒情主人公形象，还是心灵世界与田园生活，都是苏轼词中所没有的。不过，我们也要明确一点，正是有了苏轼的开拓，才有了辛弃疾对词境的进一步开拓-辛弃疾对词境的开拓，是站在前人肩膀上的。"},{"id":"287","stars":"★★★★★","title":"试分析辛弃疾词作的艺术成就（25东北师范大学、浙江大学、渤海大学）","body":"在两宋词史上，辛弃疾的作品数量最多，成就、地位也最高。就内容境界、表现方法和语言的丰富性、深刻性、创造性和开拓性而言，辛词都可以说是空前绝后的。辛弃疾词作的艺术成就，主要表现在以下方面：\n\n一、转换了词的意象群\n\n鲜明独特的意象往往体现出诗人的个性风格，而意象群的流变又从一个侧面反映出诗歌史的变迁。稼轩词所创造的战争和军事活动的意象，又使词的意象群出现了一次大的转换。\n\n（一）军事意象大规模出现，形成密集的军事意象群\n\n本是行伍出身的辛弃疾，有着在战场上横戈杀敌的战斗体验。他既熟悉军事生活，又时刻期待着重上沙场，再建武功。因此，他词中军事意象频繁出现，刀、枪、剑、弓、钩、铁马、旌旗、将军、士兵等，大规模地现身词的世界，构成了词史上罕见的军事景观。\n\n如《破阵子·为陈同甫赋壮词以寄之》这类词作，密集的军事意象群，连结成雄豪壮阔的审美境界，更能体现辛词的个性特色，也反映出两宋词史的又一重大变化，即男子汉气概的激扬，词中女性柔婉美最终让位于血性男子的力度美和崇高美。\n\n（二）抒情意象的军事化\n\n情感寻找具象来传达，也就是文学主体情感的客观化与对象化。这种写作手法，让山水风物都和词人一样，充满了雄壮激扬的英雄之气。辛弃疾以其特有的眼光观物，让任何普通的景物都能幻化创造成军事意象。在他军人的意念中，静止的青山能变成奔腾飞驰的战马，林间的松树也幻化成等待检阅的勇武士兵。检校山川的词人，更显现出了睥睨六合、指点江山的伟岸形象。抒情意象的军事化，是稼轩词所独具的艺术特色。\n\n二、以文为词\n\n稼轩词不仅转换了意象群，而且更新了表现方法，在苏轼“以诗为词”的基础上，进而“以文为词”，将古文辞赋中常用的章法和议论、对话等手法移植于词。\n\n（一）以文为词，既是方法的革新，也是语言的变革。前人作词，除从现实生活中提炼语言外，主要从前代诗赋中吸取语汇，而稼轩则独创性地用经史子等散文中的语汇入词，不仅赋予古代语言以新的生命活力，而且空前地扩大和丰富了词的语汇。辛词里大量使用“矣”“哉”“者”“也”“乎”这些散文中常见的语助词，一些散文的句子也经常被辛弃疾挪用在词中，如“甚矣吾衰矣。怅平生、交游零落”。经史散文中的语言，他信手拈来，皆如己出。\n\n（二）就语句层次而言，很多辛词句读虽断，然文气未断，如“东风夜放花千树。更吹落、星如雨”，这就使本来音韵和谐的词句呈现出散文化的流畅与腾挪跌宕。他用散文化的句法，并不违反词的格律规范，仍协律可歌。\n\n（三）对话模式的大量出现也是辛词散文化的另一个重要表现，例如《西江月·遣兴》的下阕：“问松：＇我醉何如？’”“以手推松曰：“去！’”这就是很明显的叙述模式。\n\n在词史上，辛弃疾创造和使用的语言最为丰富多彩：雅俗并收，古今融合，骈散兼行，随意挥洒，而精当巧妙。稼轩词真正达到了无意不可入，无语不可用，合乎规范而又极尽自由的艺术境界。\n\n三、风格多样，刚柔并济，亦庄亦谐\n\n内容的博大精深，表现方式的千变万化，语言的不主故常，构成了稼轩词多样化的艺术风格。雄深雅健，悲壮沉郁，俊爽流利，飘逸闲适，秾纤婉丽，都兼收并蓄，其中最能体现辛弃疾个性风格的是刚柔相济和亦庄亦谐两种词风。\n\n（一）辛弃疾有着宽阔的艺术掌控能力，写豪气，而以深婉之笔出之；抒柔情，而渗透着英雄的豪气。悲壮中有婉转，豪气中有缠绵，柔情中有刚劲，是稼轩词风的独特处，也是辛派后劲不可企及之处。如他的《摸鱼儿》就是摧刚为柔，表面是伤春惜春的柔情，实则深含不屈不挠的刚健豪气，艺术上“姿态飞动，极沉郁顿挫之致”。\n\n（二）辛词风格的多样化，还表现在嘻笑怒骂，皆成佳篇，亦庄亦谐，俱臻妙境。稼轩本富有幽默感，利用一度流行的谐谑词并加以改造，来宣泄人生的苦闷和对社会种种丑行的不满，从此谐谑词具有了严肃的主题和深刻的思想内蕴。冷嘲热讽，痛快淋漓，诙谐而不失庄重，严峻而不乏幽默，是辛词的又一风格特色。","keywords":"转换意象群 密集的军事意象群 抒情意象军事化 以文为词 语言的变革 句读虽断，文气未断 对话模式大量出现 风格多样 刚柔并济 亦庄亦谐","note":"辛弃疾是两宋词史成就最高的一位诗人，就词体本身来说，其成就甚至在苏轼之上，因而在考查中也经常出现。在前人的基础上，辛弃疾对于词境和词作艺术都作了进一步的拓展，如他将苏轼的“以诗为词”进一步发展为“以文为词”，这无疑提升了词作的表现力。"},{"id":"288","stars":"★★★★","title":"试分析辛弃疾田园词的艺术成就","body":"辛弃疾对前人田园词超越、突破之处甚多，而后人田园词的创作也难以为继。因此，辛弃疾的田园词是当之无愧的田园词的高峰。辛弃疾的田园词，主要取得了如下艺术成就：\n\n一、数量远远超过前人，对农村生活的反映广泛而深入\n\n在辛弃疾六百余首词中，有二十五首可以确定为农村词，这在辛弃疾的词作中所占比例虽然并不大，但与苏轼的五首《浣溪沙》相比，已是苏词的五倍之多。同时，和前辈词家相比，有二十年农村生活经历的辛弃疾，对农村生活显然也更为熟悉。辛弃疾的农村词时间不同、地点不同，对农村生活的反映更广泛，更深入，在他的词中，有客来即掀老坛、拨新醅的敦厚老者；有趁着蚕生的空闲，匆匆回娘家的小媳妇；有北陇之上踏水的劳动者，竹边村头的卖瓜人。乡村的平凡人物，生气勃勃地走进词世界。\n\n二、对田园词传统的突破和丰富\n\n辛弃疾的田园词，不仅拓宽了田园词的内容，而且突破了自我写照的传统，一些优秀农村词，不仅表现农家的劳动生活，真切地表达他们的悲欢离合，而且通过对田园风光的描绘，抒发了一些颇具哲理的情思，表达了对农村生活的热爱之情。如《清平乐·村居》《清平乐·检校山园书所见》这类完全以农村人物为中心，描写田园生活之乐的作品，在其他作家笔下绝无仅有，即使在田园诗中，也只有范成大或许可与之媲美。这类词的创作，无疑是辛弃疾对田园词的一大创造。\n\n另外，辛弃疾还创作了一些描写乡间景物、寄寓人生哲思的词，对田园词也形成一种突破和超越，如《鹧鸪天代人赋》。\n\n三、丰富了田园词的表现手法，扩大了田园词的表现能力\n\n（一）辛弃疾对田园词表现技巧最大的贡献是将叙事手法运用于小令之中，在生动曲折的情节中描写田园风光。他脍炙人口的《西江月·夜行黄沙道中》即是这样一首词，叙事手法的运用，生动曲折的情节描写，使这首词的抒情内容丰富、复杂而又富于层次。\n\n（二）辛弃疾对田园词艺术手法的另一贡献，是在对农村生活熟悉的基础上，选取典型的生活场景，运用白描的手法加以描绘，使人物形象更鲜明生动。《清平乐·博山道中即事》只用“笑背行人归去”六个字，就将少妇遇见行人时羞怯的心情和神态刻画出来了。","keywords":"数量远超前人 反映广泛而深入 突破和丰富 表现手法 叙事用于小令 典型生活场景 白描手法","note":"辛弃疾的田园词是当之无愧的田园词高峰，不仅在数量上远超前人，在内容和艺术上更是都较前人更进一步，并且后无来者。可以说，辛弃疾的田园词与英雄词具有迥然不同的风味，二者是辛弃疾词作风格的多样性的重要体现，同时也是辛弃疾高超的词作艺术的重要体现。"},{"id":"289","stars":"★★★★★","title":"试分析苏轼、辛弃疾豪放词风的差异及其原因","body":"苏、辛词作，均以其不受声律束缚、题材广阔宏富、笔势纵放、气象恢弘，而在两宋词坛上独树一帜，形成了词史上的“豪放”一派。但是，豪放只是他们词风的一个基本特征，而在感情色彩、思想格调等许多方面，二者又有着不容忽视的差别：苏词的旋律更为高逸旷达，而辛词的基调却颇多悲愤沉郁，这应当说是苏辛词风最重要的差异之一。\n\n一、苏、辛词风的差异\n\n苏、辛的一生，都经历了极其坎坷的道路，这对他们的文学创作必然产生极其深刻的影响。苏辛词中，都不可避免地反映出理想破灭、壮志难酬的特点。然而不同的是，东坡词倾向于从痛苦中求超拔、求解脱，从而表现出一种旷达的人生态度；而稼轩词则更多地表现了对于现实的挣扎奋斗，表现了悲愤的呼喊和火一样燃烧的激情。苏轼虽开创过豪放风格，但其基调仍是旷达，即使豪放词，也多是豪中带旷；而辛词则将豪放发挥到极致，而在豪放之中，更多悲壮之气。\n\n如东坡的《念奴娇·赤壁怀古》与稼轩的《水龙吟·登建康赏心亭》，同是写登临怀古，同是他们豪放风格的代表作，但前者的怀古，是追慕前人风流千古的丰功伟业，胸襟十分开阔；后者的怀古，则是设事用典，抒写自己的胸中块垒，悲愤不能自抑。\n\n二、苏、辛词风不同的原因\n\n（一）对现实生活中的痛苦抱着不同的态度\n\n苏轼生活在北宋相对承平的时代，作为一个封建知识分子，他与现实的矛盾不可能、也不允许过于激烈。他“学际天人”的知识修养，促使他成为一个超然旷达的、理想型的诗人。在人生的艰难历程中，他既能坚持操守，又能随遇而安，面对险风恶浪，始终处之泰然。这应当说是他的词不轻言痛苦的主要原因。\n\n而辛弃疾则生活在外族入侵、国家危亡的时代，他与现实的矛盾，本质上说是爱国与投降之间的矛盾，因此是不可调和的，所以他的词具有强烈的时代精神。山河破碎、民族危难，激发了他火一样的情怀；报国无门、壮志难伸，又使他洒下英雄热泪。这种对于现实的苦恨执着，使得他的词具有更鲜明、更强烈的战斗性，他的词风，也较苏词更为慷慨、悲愤和深沉。\n\n（二）二者都学习老庄，追慕陶、李，但辛弃疾还崇拜屈原\n\n稼轩虽然和东坡一样，也学习老庄、追慕陶（渊明）李（白），但在稼轩心中，却还有一个崇拜的对象，那就是屈原。他对屈原充满了敬意。他的许多词句，即是从屈原的作品中脱化而来，如“余既滋兰九畹，又树蕙之百亩，秋菊更餐英”化用《离骚》；此外，他的《木兰花慢》（可怜今夕月），则是用“天问体”写成等等。在稼轩词中，像这样直接称引、化用、甚至摹仿屈原作品的，竟达二三十篇，这在东坡词中是不曾见到的。\n\n稼轩仰慕屈原的根本原因，在于他的理想、他的激情、他对现实的苦恨执著、他的“知其不可而为之”的悲剧性格，甚至他的痛苦和悲愤，都与屈原有着惊人的相通之处。他的心灵、他的思想，在屈原那里找到了更多的寄托，得到了更多的共鸣。在这一点上，他与东坡确实有很大的不同。这种不同直接导致了他们词风的差异，其中最重要的差异，即我们所指出的-东坡旷达，而稼轩悲愤。","keywords":"苏词 高逸旷达 辛词 悲愤沉郁 对痛苦抱不同态度 学习老庄 追慕陶、李 崇拜屈原","note":"苏轼、辛弃疾都可谓是豪放派的代表人物，二者词作都具有“豪放”这一特征，但苏轼豪放中透露着旷达，辛弃疾的豪放则多悲愤和沉郁。究其原因，是二者生活的时代不同，取法的前人也有差异，归根结底是二人性格的差异。相关内容可以参考陈景云《论苏轼和辛弃疾豪放词风格的异同》，具体资料可以在李凡文学正版群内领取。"},{"id":"290","stars":"★★★★","title":"试述辛弃疾的词史地位","body":"辛弃疾在南宋前中期的词坛上领袖一代。他在词史上的贡献，奠定了他在词史上崇高的地位。\n\n一、完成了豪放词到豪放派的转变\n\n辛弃疾在前人探索的基础上，特别是在苏轼探索的基础上，终于完成了词史上影响深远的词派-豪放派。应该说只有到了辛弃疾的手里，豪放派的艺术风格才完全成熟。辛弃疾以其“横绝六合，扫空万古”的气魄把豪放派词的创作发展到了一个顶峰，前人固无可企及，后人亦无可复达。\n\n在辛弃疾周围先后有张孝祥、陆游、陈亮、刘过、刘克庄、刘辰翁等人，他们将民族矛盾的烽烟血泪，壮志未酬的沉痛苍凉，熔铸于词中，以一种神驰千载、奇想联翩的艺术手法，新鲜特殊的艺术语言加以表现，于是乎，词的面貌全变了，词坛的面貌也全变了-以往没有过的词作出现了，以往没有过的流派出现了。\n\n可以说苏轼和苏轼前后，只有豪放词而没有豪放词派，豪放只是“流”，而到了辛弃疾才构成派。辛弃疾完成了词史上这个影响深远的艺术流派，是他在词史上的伟大贡献。\n\n二、开拓词境，提高了词的地位\n\n从苏词与苏诗的创作实际看，词在苏轼手里还不足与诗并驾齐驱，还基本上停留在“诗余”的地位。真正使豪放词达到“无意不可入，无事不可言”的境界，还是辛弃疾。\n\n辛弃疾在词中大量写国家事、民族恨，抒发自己爱国豪情，这是辛词在题材扩大上的杰出贡献。只有到了辛弃疾才大量地把时事、政事、国事、军事等等题材，直如万斛源泉般涌入词中，和前人相较简直是开辟了一个无比广阔的新世界。\n\n辛弃疾在词的创作中，大量写前人未涉的题材，把词的表现范围扩大到无所不能的境界。词至此方彻底摆脱“诗余”的地位，彻底冲破词别是一家的藩篱，成为与诗并驾齐驱的文学体裁。辛弃疾开拓词境范围的功绩，可在文学史上光照千古。\n\n三、在词的艺术手法和语言上进行创新，解放了词这一艺术体裁\n\n（一）广泛用典，打破了诗、词分野的藩篱\n\n如果说李商隐是诗坛上圆熟用典的诗人，那么，辛弃疾则是词史上用典最成功、最多的词人。\n\n苏轼的诗是以用典博洽知名的，但苏轼在词中却忌于用典，可见苏轼仍然受诗词有别的束缚，未敢太过于违背时代风尚。而辛弃疾则完全置“词别是一家”论而不顾，把用典的艺术手法引进词的创作之中，从经史百家、汉唐故事、诗书楚辞之中广泛采撷典故，丰富了词的艺术表现，完全打破了诗、词分野的藩篱。\n\n（二）将词的语言革新继续推进，对词的语言给予了彻底改造\n\n辛弃疾不仅在艺术手法上完全打破了诗词分野，而且在艺术语言上也进行了创新，使词出现了一副全新的语言。他在苏轼起步的基础上，以更卓越的胆识，更豪迈的气魄，将词的语言革新继续推进，对词的语言给予了彻底改造。如果说苏轼是诗的语言入词的话，那么，辛弃疾除了以诗的语言入词之外，还以散文入词，以俗语入词，以口语入词，并将自己的英挺豪气、磊落襟怀融贯其中，形成了具有独特风格的一副全新的词的艺术语言。\n\n艺术手法和语言的创新，也是辛弃疾对词的发展的贡献，它在艺术形式上完全打破了诗词区分的壁垒，解放了词这种艺术体裁。\n\n【李凡关键词：完成豪放词派 开拓词境 广泛用典 继续推进语言革新】","keywords":"","note":"苏轼与辛弃疾可以说是宋词尤其是豪放词发展史上两位最为关键人物。苏轼对于词的开拓意义表现在他在许多方面敢为人先，开启了诸多传统。而辛弃疾则是在苏轼的基础上，将其所开创的传统进一步向前推进，直至达到顶峰，比如豪放派，又比如从“以诗为词”到“以文为词”。"},{"id":"291","stars":"★★","title":"试分析“辛派词人”的创作特征","body":"所谓“辛派词人”，就是以辛弃疾为核心，团结与影响了一大批词人。他们以辛词为榜样，有意识地学习苏轼，其词作具有共同的爱国思想倾向，作风慷慨豪放，因此形成南宋词坛上最大的爱国词创作流派。“辛派词人”的词作，主要具备如下特征：\n\n一、狂放个性的词风\n\n“辛派词人”大多是爱国志士。面对“汉家宫殿劫灰中”之现实，他们有共同的政治主张，要求积极抗金、收复中原。然而，南宋少有认真备战、奋发图强的局面，南宋皇帝绝大多数不思进取，只图偏安一隅，“辛派词人”的政治抱负始终难得施展机会。由于他们的政治主张与偏安现实相冲突，生平备受打击。但是，他们性格刚毅，无论遭受怎样的挫折打击，政治主张不变，爱国之情不已，雄心不灭。\n\n忧心如焚的精神状态和狂放自任的性格与行为特征必然渗透到歌词的创作之中。“辛派词人”自负“向来谋国，万事尽出汝书生”，落笔填词，指点江山，笔力劲健，气势飞舞，酣畅淋漓。这与他们的志向、胸怀相关，同时也是他们狂放个性的文学表现。\n\n二、“以文为词”，议论纵横\n\n辛弃疾词好发议论，喜用经史子集故事，时而不避口语、俗语，句式自由流畅，有时整首词纯用议论，将词的内在气质都改变了，形成了“以文为词”的文学特征。辛弃疾不遗余力地使用一切手段来表述自己的政治主张，歌词也成为阐述政见的一种主要手段。\n\n辛派词人团结在辛弃疾的周围，主要是因为政见相同、意气相通。所以，“以文为词”，议论纵横也成为他们的一种必然创作选择，成为他们共同的文学特征。\n\n三、题材广阔，具有深厚的现实基础和思想内容\n\n辛派词人对词的内容与题材的突破主要表现在以下几个方面：\n\n（一）歌颂抗金事业和正义战争\n\n面对强敌的威胁，辛派词人渴望收复故土，保家卫国，因而在创作中涌现了大量歌颂抗金事业与正义战争的作品。如陆游的“铁骑无声望似水。想关河，雁门西，青海际”（《夜游宫·记梦寄师伯浑》）。\n\n（二）渴望、呼唤英雄人物，以英雄许人或自许\n\n“辛派词人”常常通过登高怀古、重临历史遗址引发对往昔英雄人物的回忆，表达对国事的期待和焦虑、对现实的不满与遗憾。如刘克庄《沁园春·梦孚若》：“天下英雄，使君与操，余子谁堪共酒杯。车千辆，载南赵北，剑客奇才。”\n\n（三）抒发壮志难酬、国难日深的悲愤\n\n“辛派词人”多为性情中人，他们的志向与才华在那个时代不得施展，于是多用词来浇心中块垒，抒发壮怀难伸的悲愤与救国救民的焦虑。如韩元吉《霜天晓角》“天际两蛾凝黛，愁与恨、几时极！”\n\n（四）对统治者投降误国政策的批评及对国事的忧患\n\n南宋的最终覆亡，是统治者不思进取、奸臣当道、朝政腐败的必然结果“辛派词人”在无力挽救国势的情形之下，只好借词来抒发心中的悲哀与激愤。如刘过《六州歌头·题岳鄂王庙》云“狡兔依然在，良犬先烹。”\n\n（五）以旷达之作表现对朝廷的不满\n\n面对时局的动荡，社会的黑暗与个人的无奈，“辛派词人”也常以貌似超脱的旷达之语表示对现实的不满，在词中或明或暗地展示着孤高脱俗、清苦自任的自我形象。如陆游的《鹧鸪天》：“家住苍烟落照间。丝毫尘事不相关。斟残玉瀣行穿竹，卷罢黄庭卧看山。”","keywords":"狂放个性 以文为词 议论纵横 题材广阔 深厚现实基础和思想内容","note":"“辛派词人”的创作特征受辛弃疾的影响很大，在思想和艺术两个方面都向着辛弃疾靠拢，这尤其表现在整体词风和“以文为词”手法上，因而大家在作分析时可以与辛弃疾的创作特征结合起来记忆。相关内容可以参考单芳《南宋辛派词人研究》，具体资料可以在李凡文学正版群内领取。"},{"id":"292","stars":"★★","title":"试分析陆游词作的艺术成就","body":"作为一个才气大，工力深的全才作家，陆游作词虽“流于既溢之余，而发于持满之末”，也有不可忽视的成就。\n\n一、题材内容广泛，对词的内容进一步开拓\n\n陆游词的成就首先表现在思想内容上。他继北宋苏轼和南渡初一些爱国词人之后，对词的内容作了进一步开拓，使其取得了充实的社会内容，现实性之强几可和辛弃疾词相比，抒情性之强几可和自己的诗相比。最具意义的是那些回忆军中战斗生活，抒发建功立业理想，感慨壮志难遂的作品。其次是那些描写渔歌菱唱，啸傲江湖，抒发自己旷达胸怀，又不失爱国本色的作品。其他如《钗头凤·红酥手》之写爱情，《卜算子·驿外断桥边》之咏物，《鹊桥仙·夜闻杜鹃》之写羁旅，都是传世之作，说明陆游词涉猎的题材内容相当广泛。\n\n二、对词作艺术风格的多方探寻和开拓\n\n陆游词的成就还表现在对艺术风格的多方探寻和开拓上。陆词和陆诗有相仿之处，即风格多样，其中尤以纤丽婉约、清雄旷达、超爽豪放三种更为著称。\n\n（一）超爽豪放风格常出现在爱国词中，也是陆词中最突出的风格。陆游的爱国词感情强烈，跨度极大，尤善在结尾处作大跳跃、大议论，但表达起来又举重若轻，从不给人以号呼叫嚣之感，如《诉衷情》（当年万里觅封侯）将感慨今日之不遇暗藏于追念昔日之英烈，更见含蓄之功。\n\n（二）清雄旷达之作如《卜算子·咏梅》，直堪与苏轼《卜算子》咏鸿相比，深得清旷之美。\n\n（三）纤丽婉约之作如描写与唐婉爱情的千古名作《钗头凤》，和陆游的爱情诗一样，都是以绝等伤心之怀写绝等伤心之事，纤丽而情深，婉约而意沉。\n\n三、在词作表现艺术上取得了突出成就\n\n陆词持久的艺术生命力不仅在于其间所荡出的感发情思，还应得力其多样的艺术表现技巧，这主要表现在以下方面：\n\n（一）陆词具有“屏除纤艳”的特点，这与他词作中多选取的典雅庄重之典有密切联系。陆词中恰到好处的“适时”而非“时时”用典更显其词作的含蓄蕴藉、典雅精致。\n\n（二）陆游在词的起、换、结处乃至全篇，都讲究声情并茂的艺术效果，更为追求艺术的美境。全局多顿挫回旋、摇荡生姿，以此来宣泄其心中盘结之郁闷和久抑的愤懑。\n\n（三）陆游词中的意象繁复而含蓄，大致可分为雄伟阔大之象、萧索凄清之象、馨逸恬淡之象三类。词人又综合运用多种技巧来营筑这些意象，最终含蓄透显出抒情主体在特定时空下的思想情感。","keywords":"题材内容广泛 艺术风格多方开拓 纤丽婉约 清雄旷达 超爽豪放 表现艺术","note":"陆游文才突出，虽无心写词，但其词不乏受人激赏的优秀之作，他常常借词表达自我独特的人生体验，抒发自我的人生感怀，揭示自我的心路历程，显现出鲜明的艺术性和 独特的艺术风格，其词不愧为宋词园地中流光溢彩的奇葩异卉。"},{"id":"293","stars":"★★★★","title":"试述姜夔词的艺术特征","body":"姜夔彻底反俗为雅，下字运意，都力求醇雅，在辛弃疾之外别立一宗，自成一派。姜夔的词作，主要具备如下艺术特征：\n\n一、对婉约词表现艺术进行改造，建立新的审美规范\n\n姜夔词在题材上并没有什么拓展，仍是沿着周邦彦的路子写恋情和咏物。他的贡献主要在于对传统婉约词的表现艺术进行改造，建立起新的审美规范。\n\n（一）语言的雅化和刚化\n\n苏轼首开以诗为词的风气后，经由辛弃疾的发展，词与诗在表现手法和抒情功能上已基本合流，只是词仍然保持着其入乐可歌的特性。姜夔接受辛弃疾的影响，也移诗法入词。但姜夔移诗法入词，不是要进一步扩大词的表现功能，而是使词的语言风格雅化和刚化。他秉承周邦彦字炼句琢的创作态度，借鉴江西诗派清劲瘦硬的语言特色来改造传统婉约词华丽柔软的语言基调，而创造出一种清刚醇雅的审美风格。\n\n（二）恋情词的雅化\n\n北宋以来的恋情词，情调软媚或失于轻浮，虽经周邦彦雅化却仍然不够。姜夔的恋情词，则往往过滤省略掉缠绵温馨的爱恋细节，只表现离别后的苦恋相思，并用一种独特的冷色调来处理炽热的柔情，从而将恋情雅化，赋予柔思艳情以高雅的情趣和超尘脱俗的韵味，如《踏莎行·自沔东来丁未元日至金陵江上感梦而作》。\n\n（三）咏物词别有寄托\n\n姜夔的咏物词，往往别有寄托。他常常将自我的人生失意和对国事的感慨与咏物融为一体，写得空灵蕴藉，寄托遥深，如《齐天乐》咏蟋蟀的鸣声，全词充溢着“一声声更苦”的“哀音”，渗透着词人自我凄凉身世的感受，但又很难坐实说哪一句是写他自己。其寄托在若有若无若即若离之间，其妙处是含意丰富深广，给读者留下极大的想象空间，但词旨飘忽不定，有时流于晦涩难解，则是其短处。\n\n二、幽冷悲凉的词境\n\n姜夔的时代是一个令人灰心失望的时代。作为江湖游士，他的前途命运更是渺茫黯淡。加上他一生贫病交加，对凄凉寒苦有着深刻的感受，所以他总是以一种忧郁凄凉的眼光来看待世界。就像中唐诗人贾岛爱静、爱瘦、爱冷，也爱这些情调的象征一样，姜夔也偏爱冷香、冷红、冷云、冷月、冷枫、暗柳、暗雨等衰落、枯败、阴冷的意象群，以此来营构幽冷悲凉的词境。\n\n三、虚处传神的手法\n\n姜夔的词境独创一格，艺术思维方式和表现手法也别出心裁。他善于用联觉思维，利用艺术的通感将不同的生理感受连缀在一起，表现某种特定的心理感受；又善于侧向思维，写情状物，不是正面直接刻画，而是侧面着笔，虚处传神。\n\n四、长于自度曲，因词制曲，音节谐婉\n\n与周邦彦一样，姜夔也长于自度曲。姜夔精于乐律，能自制曲。自谓作词“初率意为长短句，然后协以律”，这种写作方式，便和那些拘谱自填者有很大的不同。他的17首词自注有工尺谱，是今存惟一的宋代词乐文献，在我国音乐史上具有重大价值。\n\n与柳永、周邦彦的因声制词，即先曲后词不同，姜夔有的自度曲是先作词后谱曲。先作词，即不受固定格律的限制，可以舒卷自如地抒发情感，这比谨守格律、依调填词的方式要自由得多，因而将姜夔视为“格律派”词人，并不恰当。而且因词制曲，音乐的节奏更能体现词人情感的律动，所以他的自度曲都音节谐婉。\n\n五、词作往往配有小序\n\n姜词在形式上还有一个显著的特色，就是词作往往配有精心结撰的小序。宋词来说，是张先首创词中题序，随后苏轼将之发扬光大；虽然《稼轩词》中的小序最多，却属姜夔词小序的文学质量最高。姜夔的词序除了具有引言、纪实、标举词式等传统功能之外，又具有小品文一般的审美特质，可以作为单独的文学作品给予鉴赏，与歌词珠联璧合，相映成趣，在词序发展史上是浓墨重彩的一笔。从《暗香》《疏影》《扬州慢》的词序可见，姜夔的词序往往言简意赅，但笔下的景致却如画似绘，情调上又传递的是魏晋文人清虚舒缓之美，悲情与凄景完美地融合渲染，且凄丽哀感的情绪会随着字句不断流转。","keywords":"审美规范 语言雅化和刚化 恋情词雅化 咏物词别有寄托 幽冷悲凉 虚处传神 因词制曲 音节谐婉 词作往往配有小序","note":"①姜夔词作的创作特征，受到了纵横两个方面的影响。从横向来说，他的词作受到了同时期的辛弃疾的影响，这主要表现在词作语言上；从纵向来看，他主要受到了柳永、苏轼、周邦彦的影响。可以说，正是在积极吸收他人经验，姜夔才可以别立一宗，与辛弃疾争锋。②此外，大家还要注意，“白石词”是在考查中出现频率比较高的一个名词解释，大家要注意一下。"},{"id":"294","stars":"★★★","title":"试述吴文英词作的艺术特征","body":"吴文英一生的心力都倾注在词的创作上。他力求自成一家，但辛弃疾和姜夔这两座艺术高峰横亘眼前，而他胸襟气魄远逊稼轩，才情天赋不及白石，要在情思内容上有所超越突破已不可能，于是专在艺术技巧上争奇斗胜。吴文英的词作，主要具备如下特征：\n\n一、亦梦亦幻的境界\n\n在艺术思维方式上，吴文英彻底改变正常的思维习惯，将常人眼中的实景化为虚幻，将常人心中的虚无化为实有，通过奇特的艺术想象和联想，创造出如梦如幻的艺术境界。如怀念亡姬的名作《风入松》，词境似真似梦。尤其是“黄蜂”二句，亦真亦幻。类似于这种跨越时空、化虚为有的写作手法，在梦窗词中随处可见。\n\n二、突变性的章法结构\n\n在章法结构上，吴文英继清真词后进一步打破时空变化的通常次序，把不同时空的情事、场景浓缩统摄于同一画面内；或者将实有的情事与虚幻的情境错综叠映，使意境扑朔迷离。\n\n吴文英作词师承周邦彦。清真词的结构也具跳跃性，但起承转合，或用虚字转折，或用实词提示，尚有线索可寻。而梦窗词的结构往往是突变性的，时空场景的跳跃变化不受理性和逻辑次序的约束，且缺乏必要的过渡与照应，情思脉络隐约闪烁而无迹可求。这强化了词境的模糊性、多义性，但也增加了读者理解的难度。他长达240字的自度曲，也是词史上最长的词调《莺啼序》，便典型地体现出这种结构的特色。\n\n三、密丽深邃的语言风格\n\n梦窗词的语言生新奇异，具体表现在以下方面：\n\n（一）吴文英词语言的搭配、字句的组合，往往打破正常的语序和逻辑惯例，与其章法结构一样，完全凭主观的心理感受随意组合。将主观情绪与客观物象直接组合，无理而奇妙。如“彩扇咽寒蝉，倦梦不知蛮素。”把今日实有的与昔日记忆的寒蝉彩扇、倦梦佳人硬连属在一起。\n\n（二）吴文英词语言富有强烈的色彩感、装饰性和象征性。他描摹物态、体貌、动作，很少单独使用名词、动词或形容词，而总是使用一些情绪化、修饰性、色彩感极强的偏正词组。\n\n梦窗词字面华丽，意象密集，含意曲折，形成了密丽深幽的语言风格。但雕绘过甚，时有堆砌之病、晦涩之失，故不免为后人所诟病。","keywords":"超常的想象力 幻化的手段 打破时空变化 生新奇异 打破正常的语序和逻辑惯例 色彩感、装饰性和象征性","note":""},{"id":"295","stars":"★","title":"宋元之交的词坛有何特点","body":"南宋末期，政治黑暗，时局动荡，社会环境的变化让这一时期的词坛表现出了与之前词坛迥然有别的特征，具体表现在以下方面：\n\n一、创作活动的群体性\n\n宋元之交的词人喜欢结社唱和，尤其是杨绩、张枢、周密、陈允平、李彭老、李莱老、王沂孙、施岳、仇远和张炎等浙江籍的词人群，以临安为活动中心，常常结为吟社，分题定韵赋词，词成后相互审音改字，品评得失。周密、王沂孙、张炎、唐珏、陈恕可、仇远等14人曾五次聚会，分咏龙涎香、白莲、莼、蝉、蟹等物，后结集为词史上第一部咏物词专集《乐府补题》。词社中的唱和词，艺术上精雕细刻，音律精严，字句高雅，但有时是在缺乏创作激情的情况下应社所作，因而情感深度不足。故清人周济说：“北宋有无谓之词以应歌，南宋有无谓之词以应社。”\n\n二、题材、风格的趋同性\n\n周密、王沂孙、张炎等人都是贵介公子、江湖雅人，生活条件优裕，不像前期江湖词人那样要为衣食生计而奔波。宋亡之前，他们因对黑暗腐败的社会政治灰心失望，而啸傲山川。由于吟赏湖山风物是他们主要的生活内容，又常常同题唱和，因而咏物和咏节序，就成为他们一致的题材取向，其名篇佳作也大多是咏物词。宋亡之后，作为故国遗民，他们不敢像南渡词人那样直接倾诉亡国之痛，而只能暗中饮泣悲伤，所谓“寸肠万恨，何人共说，十年暗洒铜仙泪”，以曲折委婉的方式、比兴象征的手法表达深沉的亡国痛楚。于是通过咏节序和咏物来寄托亡国的悲恨，就成为他们熟悉和便利的创作方式，也是遗民词最突出的特点。词法取径的一致，审美趣味的相同，又使他们的艺术风格大体相近其中只有周密、王沂孙、张炎和蒋捷词的艺术个性比较突出。\n\n三、隐逸之风盛行\n\n宋末皇帝，大多昏庸无道，任用小人。宋朝末期，世风日下，权相专政、小人得志，正直士人受到排挤，当时正直的士大夫或遭受政治迫害，或不满现实，或避祸远害，或仕进无门，或兼而有之，成了宋末隐逸之风盛行的重要原因。\n\n宋亡，一群亡国词人，出于民族自尊而拒绝仕元。这些词人隐居在山林云水，成了遗民。这些南宋遗民词人或放浪山水、啸傲田园；或寄身佛寺、栖隐道观；或聚众授徒、闭门著述，隐士是他们共同的社会角色，隐居生活是他们共同的行为方式。同时，宋王朝优待文人的政策，与元蒙统治下南方文人低下的社会地位，形成强烈鲜明的对比与反差，促使归隐、羡隐成为当时士人的主要行为方式和心理特征。","keywords":"创作活动的群体性 题材、风格的趋同性 隐逸之风盛行","note":"南宋末期，“国之将亡，音声遂变”，其时社会经济、政治状况，词人心态、创作意旨和风格趋向与此前相比有了明显的不同。宋元易代，更是给这些词人造成了更加深刻的影响。这部分内容，我们需要了解一下。宋元之交的词人中，蒋捷较为重要，具体题目可以在李凡文学正版群中查看。"},{"id":"296","stars":"★","title":"试分析理学诗派的诗歌创作特征","body":"“理学诗派”以审美方式而沟通自然界与价值界的探索，以及在诗境构建等方面的努力，除了具有哲学层面上的独特贡献之外，也为诗歌发展注入了新的因子。\n\n一、内容上以抒写理学思理和命题为旨归\n\n北宋“五子”是理学诗派的重要代表，其诗歌奠定了理学诗派的主要范型。其中，奠定理学诗派诗歌范型的邵雍、周敦颐、程颢等人的影响比较大。他们的诗歌很大程度上代表了理学诗派诗歌的内容与主题特征。其理学诗都是以抒写理学思理和命题为旨归，“理学”的诸多命题和范畴都成为其诗学的命题与范畴，举凡天地万物一体主题、“仁”为天地万物之本的主题等，都是理学命题和范畴的诗化表达。这一诗歌创作主题为中国古典诗歌带来了独特的诗境和审美意蕴，也为中国古典诗歌提供了道、艺并进的发展可能性。\n\n二、审美上表现出独有的哲思意趣\n\n理学诗派构筑诗境时主要是以理学命题中的理、意、趣为旨归。理学诗派的诗歌审美意蕴基于这种诗境建构方式，表现为独有的哲思意趣。\n\n（一）崇高与优美的诗歌境界\n\n理学诗派的诗歌因为着意抒写理学命题而具有崇高道德之美，由此就带来了这一类诗歌审美意蕴的重要特征：无论是周敦颐诗歌抒发理学的“慎几”“慎动”主题，强调“自掩”以为功的《题门扉》，强调“仁”为天地之本的《题春晚》；还是邵雍抒发自己安贫乐道、不以外物干扰内心的《秋日偶成》，这种情怀往往给人一种脱俗、无尘的道德审美体验，从而外显为一种崇高优美境界。\n\n（二）与万物为一体的自然意趣\n\n抒发万物一体的自然意趣，在宋代以前已经存在。如陶渊明“采菊东篱下，悠然见南山”，韦应物的“春潮带雨晚来急，野渡无人舟自横”等，主体与客体已然混为一体。不过，在理学诗之前，以天地万物为一体作为诗境的建构类型，尚不多见。即使陶、韦等人的诗歌，也与朱熹等理学家的推扬紧密相关。理学诗所抒发的“自然万物一体”的诗境，其中透露出强烈的主体意识，是之前的诗歌所不太重视的。\n\n理学诗派诗歌丰富了中国古代诗歌的表现形式和审美类型，拓展了中国古代诗歌的哲思深度，从而具有了独特的文学史地位。","keywords":"抒写理学思理和命题 哲思意趣 崇高与优美 与万物为一体","note":"理学诗派的诗歌创作主要是为了阐发理学思想，表现理学主题，从艺术上来说总体成就并不高，但在客观上，理学诗派为诗歌带来的新的内容，如追求崇高、万物一体，这在之前的诗歌中是比较少见的，客观上推动了诗歌的丰富与发展。"},{"id":"297","stars":"★★★","title":"试述“永嘉四灵”的诗歌创作特征","body":"“永嘉四灵”是指永嘉地区的四位诗人：徐照、徐玑、赵师秀和翁卷。这四人都出于叶适之门，每个人的字中都带有一个“灵”字，所以叶适把他们合称为“四灵”，曾编选《四灵诗选》，为之揄扬。“永嘉四灵”以贾岛、姚合为宗，其诗歌创作特征，主要表现在以下方面：\n\n一、生活面狭小，诗歌内容单薄\n\n“四灵”或为布衣，或任微职，都是命运落拓的贫寒之士。他们的生活面狭小，诗歌内容也比较单薄，只有少数诗写到民生疾苦或时事，多数作品的内容是题咏景物，唱酬赠答。“四灵”强调“敛情约性”，相信“心夷语自秀”，强调不要故意放大自己的情感，不唱高调，不挦扯古人，他们所关心的是与自己生活相关的种种事物。正如他们的诗集名称所显示的，他们的创作局限于书斋之中。“四灵”的诗集都是薄薄的一册，每人存诗只有一二百首，他们是一群格局较小的诗人。\n\n二、以五律为主要诗体，注重格律\n\n在体裁上，“永嘉四灵”更注重能体现工巧特征的律诗，尤其是五律，很少使用古体。今存的“四灵”诗集中，五律皆占一半以上。四灵主张的律诗平仄和谐，纠正了江西诗派的拗折，也反对了理学诗派的不重声律。“四灵”注重格律，尤其注重律诗中间两联的对仗，并以此出奇取胜。\n\n四灵的五律，往往写得简练生动，通俗晓畅，其中常有真切浑朴的诗句，如“不来相送处，愁有独归时”（《送徐玑》），善写人情，又不露痕迹。在五律上，尤其是赵师秀的五律，享有极高的声誉，如“野水多于地，春山半是云”（《薛氏瓜庐》）极为有神。\n\n三、讲究苦吟，尤其讲究句法\n\n“永嘉四灵”讲究苦吟，尤其讲究句法、字法的“日锻月炼”，提倡“一字不苟下”。如翁卷云：“传来五字好，吟了半年余。”徐玑云：“磨砻双鬓改，收拾一编成。”徐照云：“君爱苦吟吾喜听，世人谁更重清才？”至于他们反复修改、锤炼字句，苦吟过于郊岛的例子更是多不胜数。四灵的苦吟并没有白费，他们给南宋后期诗坛带来了清新之风，理学诗派和江西诗派都受到了挑战。\n\n四、追求野逸清瘦、玲珑幽渺的境界\n\n“四灵”有避世的情怀，在诗作中常常选野逸之题材，用寒瘦之字词，写野水幽芳之态，造幽僻冷清之境，表现超逸出世之情。四灵诗中，有很多野水、野径、野芳等充满野味的词语，给我们营造出一种野逸之感。如赵师秀《桐柏观》，诗篇意境野逸清雅、清淡幽静。","keywords":"内容单薄 五律为主要诗体 注重格律 讲究苦吟 野逸清瘦 冰清玉洁 玲珑幽渺","note":"“四灵”以贾岛、姚合为宗，因而在诗歌创作上也与贾、姚二人有相似之处，包括诗体以五律为主，讲究格律，讲究苦吟等等。大家可以将他们与贾、姚等人的诗歌创作特征联系起来记忆。“永嘉四灵”是在名词解释中经常出现的内容，大家要重点关注，大家要注意一下。"},{"id":"298","stars":"★★","title":"试述江湖诗派的诗歌创作风格","body":"江湖诗派因《江湖集》得名，是一个江湖谒客为主的诗歌流派。由于这些诗人身份各异，又没有公认的诗学宗主，所以江湖诗派是一个十分松散的作家群体，他们只是具有大致相似的创作倾向而已。江湖诗派的诗歌创作风格，大致表现为以下方面：\n\n一、追求风韵\n\n江湖诗派推崇“韵”，这种“韵”偏重于风韵、幽韵、清韵、韵致、韵度，与江西诗派的神韵、气韵颇为不同。富有情韵、风姿绰约的晚唐“异味”受到江湖诗人的赏爱，韵度飘逸成了不少江湖诗人的追求。江湖诗人对“风韵”的追求，使他们的诗比江西诗派等宋调平添了一些风致，不过，江湖诗派重韵轻气的文学观念及其诗歌创作，在当时及后世都受到了指责。\n\n二、追求高雅脱俗，但更标举清雅\n\n同所有的诗人一样，江湖诗人也追求高雅脱俗。与江西诗派相比，江湖诗派更加标举清雅。江湖诗人的诗，强调惧俗、避俗、去俗。为了高雅脱俗，江湖诗人不与“俗人”结交，不使“尘土”玷污心灵，要高标出尘，选择“不俗”的环境以保持“无俗意”，选择优雅的事物如梅以便诗句清雅。\n\n三、重视“工巧”“巧对”，强调“工致”“思致”\n\n江湖诗人特别重视“工巧”“巧对”，强调诗歌艺术表达要做到“工致”“思致”。如刘克庄《后村诗话》言：“诗以体物验工巧，骆宾王《咏挑灯杖》......语简而味长。每欲仿此作数题，未暇也。”从所举的诗例看，工巧、巧对、工致主要是指构思、以及对偶、用词造句的新颖巧妙。\n\n四、提倡诗歌语言流利连贯，诗风以流利浅易为主\n\n江湖诗派还提倡诗歌语言的流利与连贯，要求创作要“意连句圆”，这正是对江西诗派为代表的宋诗典型特征“以文为诗”的创作方式的发展。江西诗派为了增强诗歌语言的张力，除了用散语外，致力于造硬语，用反逻辑的语序、意脉以及散文式的起承转合建构诗歌主线，表达诗歌主旨。江湖诗人的大多数诗歌是这种创作方法和审美追求指导下的产物，所以诗风以流利浅易为主。宋诗自南渡以来日益向流利浅易方向发展，杨万里的“诚斋体”、范成大的田园诗，都有这种倾向。江湖诗派诗人则顺应了这一发展趋势。\n\n从总体上看，江湖诗派的风格倾向是不满江西诗风而仿效“四灵”，学习晚唐，但取径比“四灵”更宽阔一些，这基本上代表着南宋后期诗坛的风尚。","keywords":"追求风韵 高雅脱俗 标举清雅“工巧”“巧对”“工致”“思致”流利浅易","note":"江湖诗派和“永嘉四灵”可以说是南宋后期诗坛风尚的典型代表，但相较于“永嘉四灵”，江湖诗派整体考查较少，所以相关内容我们还是以拓展了解为主，尤其需要注意江湖诗派、“永嘉四灵”和江西诗派的区别与联系。江湖诗派中，比较重要的诗人是刘克庄，相关题目可以在李凡文学正版群中查看。"},{"id":"299","stars":"★","title":"金代诗歌经历了怎样一个演变过程","body":"金代女真族统治者积极吸收汉文化要素来推动金朝封建化发展，金代的诗歌也在积极吸收辽、宋诗歌的基础上形成了自己的特色，其发展过程大致可分为三个阶段。\n\n一、第一阶段：“借才异代”\n\n第一个阶段是从金国初建到海陵朝。由于战争频繁、文明落后，金初文学并不发达，此期的主要作家都是由辽、宋入金的文士。这种情形，后人称为“借才异代”。其中比较重要的诗人有宇文虚中、吴激、蔡松年等。他们以宋人而仕金，内心颇多矛盾，作品中常流露出故国之思。但他们在客观上充当了文化传播的使者，其创作为日后金诗的发展奠定了基础。\n\n二、第二阶段：“国朝文派”\n\n第二个阶段是金世宗、金章宗统治时期。随着金朝对汉文化的主动接受，生活在金国的各族人民在文化上互相吸收、融合，金诗也逐渐走向成熟，初步形成了自己的特色。\n\n此期的主要诗人有蔡珪、王庭筠、党怀英、周昂等。他们被金末的元好问称为“国朝文派”。他们的诗作与金初“借才异代”的诗人有较大的差异。由于他们大多为金朝的文学侍从之臣，作品中已不再有对异族政权的拒斥倾向；艺术上虽然没有完全摆脱宋诗的影响，例如王庭筠的诗风就颇有仿效苏、黄之处，但从总体上看他们的诗篇已初步形成了雄豪粗犷的北方文学的特质。\n\n三、第三阶段：不事雕琢，重在达意\n\n第三个阶段是金朝在蒙古的进逼下被迫南渡直到金亡前后。在这期间，金朝的国势逐渐衰微，但诗歌创作却相当活跃，不事雕琢、重在达意的文学思想占据了主导地位，产生了一批关心国计民生的好作品。\n\n此时诗坛由赵秉文、李纯甫主盟，他们各有自己的诗学主张，形成了两个不同的诗歌流派。\n\n（一）赵秉文主张师法古人，强调多样化的风格，但对个人的独创性有所忽略。他本人的诗作也不拘一格，五古、七绝显得清远冲和，有蕴藉之致。其七古则气势奔放，雄丽高朗。王若虚的文学思想与赵秉文相近，他著有《滹南诗话》，论诗崇尚真淳而反对奇诡。\n\n（二）李纯甫则另立一派，他论诗力主自成一家，诗风奇险雄肆，其《雪后》等诗，意象奇崛，光怪陆离，近于韩愈诗☒风。雷希颜、李经、李汾等人的诗都有类似的风格特征。\n\n此期诗坛更值得注意的新气象是，随着金国国势的日益衰微社会动荡不安，人民饱受战乱之苦，忧时伤乱的题材走向渐趋加强。不少诗人写出了反映动乱现实的诗篇，如赵元的《修城去》写金国人民在蒙古侵扰下的灾难。最能代表这种新气象的诗人首推元好问，他的创作使金诗的成就飞跃到一个崭新的境界。","keywords":"借才异代 奠定基础 国朝文派 雄豪粗犷 不事雕琢 重在达意 忧时伤乱","note":"金代文学经历了明显的三个阶段，这与金代的政治文化发展是密切相关的。三个阶段各有其特色，由“借才异代”到形成自己的独特性，从金代诗歌的发展中也可以窥见金代社会的变化。这部分内容基本不作考查，大家了解一下就好。"},{"id":"300","stars":"★★","title":"试分析元好问纪乱诗的艺术成就","body":"元好问生逢金代后期的动乱时代，亲身经历了亡国的惨痛，他个人的遭遇与民族、国家的命运息息相关，他的诗歌生动地展示了金元易代之际的历史画卷。在国破家亡、身为敌囚这些重大变故的刺激下，诗人以他那“挟幽并之气，高视一世”的艺术禀赋，写出了一系列雄浑悲壮的纪乱诗。元好问的纪乱诗，主要具备如下特征：\n\n一、将悲壮慷慨的感情表现于苍莽雄阔的意境之中，情感悲凉而骨力苍劲\n\n元好问“纪乱诗”的特点之一，是他对国家灭亡、人民遭难的现实不是一味地哀叹悲泣，而是把悲壮慷慨的感情表现于苍莽雄阔的意境之中。如在蒙古围攻汴京城时所写的《壬辰十二月车驾东狩后即事五首》之二就是最好的例子，对于战争所带来的巨大灾难和国家的危急形势，诗人深为悲怆沉痛，但字里行间仍充溢着一股慷慨壮烈之气。这类作品在元好问诗中相当常见。情感悲凉而骨力苍劲，是元好问的独特诗风。\n\n二、深刻的历史洞察力和理性省思，具有“诗史”性质\n\n他往往把对现实的悲怆情怀与对历史的批判意识融合在一起，从而增加了诗的思想深度，如天兴二年诗人被蒙古兵押解出京时所作的《癸巳四月二十九日出京》。当年金人破宋，俘宋徽、钦二帝，在青城受宋人之降；如今蒙古军破金，也在青城受金人之降，历史的悲剧在同一个地方重演。诗人在国家沦亡的悲愤中，对国家武备松弛而招致败亡的历史教训作了深刻的省察。其他如《出都》《壬辰十二月车驾东狩后即事五首》《岐阳三首》等，也都鲜明地表现出这个特点。与杜甫一样元好问的诗歌也具有“诗史”的性质。\n\n三、记录了元好问的真切体验\n\n生当乱世，颠沛流离，心忧家国兴亡，胸怀报国宏愿，元好问置身于动荡的时局里，眼中所见、耳中所闻、心中所思，往往充满着悲凉的氛围、悲惨的景象。其诗歌作品记录了在此乱世之中的深切体验。\n\n在金朝将亡未亡之际，蒙古军向南扩张，元好问离开山西，避地河南，曾出任内乡、南阳县令，而忧虑与愁闷无法排遣，写下了《秋怀》等作品；蒙古军攻占的地方越来越多，局面对金朝越来越不利，时时从不同的方向传来极坏的消息，令人闻之痛心疾首、悲愤不已，这时元好问写下了《岐阳三首》。\n\n元好问的纪乱诗继承了杜甫的写实精神，坚守着人道立场，着眼苍生忧怀家国，既是诗人特定心境的呈现，又是金朝末年“乱世”的写照。\n\n元代文学史","keywords":"情感悲凉 骨力苍劲 “诗史”性质 真切体验","note":"元好问的文学成就是多方面、多层次的，包括诗、词、诗论和文献多个方面，集中体现了金代的文学成就，而这些文学创作之中，又以其纪乱诗整体成就最高。元好问的纪乱诗深得杜甫的诗歌“诗史”神韵，写实性强，但风格略有不同，这一点我们要特别注意。"},{"id":"301","stars":"★★★","title":"试分析促进元代文学发展的社会因素","body":"元代虽然持续时间不算太长，但也取得了灿烂的文化成就，尤其是在戏曲文学方面。而元代文学的发展，主要归功于以下因素：\n\n一、文化融合\n\n元代的最高统治者要求继承蒙古族的祖宗成法，采取中原王朝的文化制度，力图把两者融合起来。此外，人口的迁移、交通的发达、民族的杂居，也导致各民族文化进一步融合。民族杂处，加深了彼此的友谊和交流，对促进社会的发展起了重大作用。\n\n文化的融合，大大提高了少数民族的文明程度。有些人接受了汉族文化熏陶，还擅长以汉语进行文学创作。这一批来自不同民族，具有不同生活背景的作家，笔端流露出各式各样的风情格调。西北游牧民族特有的质朴粗犷、豪放率直的性格，注入作品的形象中，使元代的文坛更加多姿多彩。\n\n民族杂居，也给汉族文化在固有基础上注入了新的成分。在文艺创作方面，杂剧作家们更是大量吸取少数民族的乐曲，以丰富作品的表现力，像〔唐歹合〕、〔拙音速〕、〔风流体〕、〔六国朝〕、〔阿忽合〕等曲牌，已为汉族群众喜闻乐见。蒙古族、女真族的乐曲流入中原，为民间接受，也开拓了人们的视野胸襟。\n\n二、都市繁荣，市民阶层壮大\n\n元朝完成了南北的大一统，结束了唐末以来断续纷争的局面，也为经济的恢复和发展创造了条件。特别是忽必烈施行一系列农业措施，对促进生产起了积极的作用。在农业逐渐恢复，社会逐步安定的基础上，宋末以来我国城乡的手工业、商业，经过了一段时期的停滞以后，又走上繁荣的道路。由于国土统一，交通畅顺，形成了空前规模的市场；也由于朝廷重视商业经营，采取不同于传统的重农抑商的政策，商人的地位大大提高。因此，“元代的商业从某种意义上来说，其发展程度是超越于前代的”。\n\n与此相关，许多城市的规模日益扩大。当时的大都，杭州，北方的真定、大同、汴梁、平阳；南方的扬州、镇江、上海、温州、广州等地，均颇具规模。随着大中城市的涌现，市民阶层也不断壮大。他们的思想意识，影响到包括戏剧创作在内的各个方面，其作用不能低估。\n\n三、思想活跃\n\n在元代，思想领域也呈现出活跃松动的态势。元朝立国，虽然程朱理学的统治地位得到确认，但元朝统治集团的上层来自不同的民族，他们在利用正统的儒家学说巩固统治的同时，也尊崇各族固有的宗教信仰。因此，佛教、道教，乃至伊斯兰教、基督教，在中原地区同样得到发展。信仰的多元化，削弱了儒家思想在群众中的影响。程朱理学独尊的局面发生了变化，思想领域呈现出各种观点和流派争雄斗胜的特色。\n\n程朱理学影响下降，长期以来压在人们心头的封建礼教的磐石随之松动，下层人民和青年男女，蔑视礼教、违反封建伦理的举动越来越多，元代文学作品出现众多违背封建礼教的人物，正是当时社会生活的反映。\n\n四、儒生的不幸遭际，激发了他们的创作情绪\n\n元代科举考试时行时辍，儒生失去仕进机会，地位下降。世传“九儒、十丐”的说法虽不准确，但儒生被忽视，则是事实。其中相当一部分人不再依附政权，或隐逸于泉林，或流连于市井，人格相对独立，思想意识随即异动。特别是一些“书会才人”，和市民阶层联系密切，价值取向、审美情趣更异于儒生。\n\n仕途失落的知识分子，或为生计，或为抒愤，大量涌向勾栏瓦肆，文坛便掀起波澜。儒生不幸文坛幸，换言之，知识分子地位的下降，激发了他们的创作情绪，这一点，也是促成杂剧发展的重要因素。\n\n【李凡关键词：文化融合 都市繁荣 市民阶层壮大 思想活跃 儒生不幸遭际】","keywords":"","note":"元代文学的发展必然是与元代社会现实联系在一起的。不过相较于唐宋等朝代，元代的社会发生了比较重大的变化，其中一个突出特点便是“杂糅”，民族杂糅，思想杂糅。同时，相较于之前的朝代，儒生地位直线下降，市民阶层却稳步壮大，这些因素客观上都推动了文学的发展，同时也推动元代文学朝着新的领域不断开拓。"},{"id":"302","stars":"★★★","title":"试分析元代戏曲繁荣的原因","body":"在元代，我国戏剧艺术走向成熟。戏剧包括杂剧和南戏，其剧本创作代表了当时文学的最高水平。元代戏曲繁荣，主要归因于以下方面：\n\n一、金元时期动荡激越的现实生活的需要\n\n元代戏曲之所以能在很短的时间里崛起、兴盛，进而风靡全国，其原因是多方面的。而最根本的原因，则是金元时代动荡激越的现实生活。在宋词已经走向颓靡的形势下，社会生活本身需要有新的文学样式以反映人民大众的喜怒哀乐，表现他们的爱和追求。已有的文艺形式，如宋杂剧、金院本以及其他说唱技艺如诸宫调，已不足以承担这个巨大的使命，于是，在这些技艺的融汇发展中，出现了元杂剧。\n\n二、元代统治者的喜好\n\n作为蒙古族统治者，其对戏曲文学的喜好和关注，无疑体现了官方的“文艺政策”，这也促进了元代戏曲的繁荣。当时，向宫廷“献剧”已成时尚，统治者不仅自身喜爱杂剧，而且向社会提倡，宫中还设有御戏监，流传下来的杂剧剧本，有的就是“录之御戏监”的。另外，元朝的皇帝，对杂剧的扮演还时时有所训示，如至元十八年，就有“圣旨”对“十六天魔”“四大天王”的装扮作了规定。\n\n三、元代文人参与戏曲创作和演出\n\n元代文人，地位卑贱，特别是长期停止科举，更使他们进仕无门。在这种情况下，有些文人就转而创作杂剧，结果提高了杂剧的品位，产生了大量的优秀作品。\n\n这些文人，不仅个人参与杂剧创作，而且还组织起来，以“书会”的形式开展多方面的活动。在大都著名的玉京书会、元贞书会，都拥有一批优秀的杂剧作家。即使在元中叶以后，杂剧创作已不如前期那样繁荣，在杭州的剧作家还有武林书会这样的组织。书会促进了剧作家与勾栏瓦舍下层演员的联系，对提高剧本和演出的水平，起了重大的作用。\n\n四、元代社会经济发展\n\n戏曲毕竟是一种娱乐和消费活动。因此，必有赖于社会经济的发展。金元时期，社会战乱频仍，但有些地区，如大都、山西平阳、江南杭州等地，或遭受战乱之灾较少，或战乱之后的恢复较快，杂剧恰恰在这些地方迅速繁荣起来。另外，元杂剧最繁荣兴盛的时期，是至元至大德年间，而这一时期，元代社会经济正处于稳定发展阶段。社会经济繁荣，这是戏曲文学得以兴盛的基础。","keywords":"现实生活需要 统治者喜好 文人参与戏曲创作 社会经济发展","note":"与宋词的繁荣一样，元代戏曲的繁荣也得益于内外两方面的因素。从文学自身来看，既往形式无法满足人民的需要，所以出现了新的文学形式。不过相较而言，元代戏曲的繁荣受外部因素的影响较大，像统治者喜好、社会经济发展这些外部因素明显对戏曲文学发展有更直接的促进作用。"},{"id":"303","stars":"★★★","title":"元代杂剧和南戏有何异同","body":"定型以后的南戏和当时的北杂剧同属我国最早流行的古典戏曲。它们相同之处很多，但由于南北社会的发展不同，文化背景、方言风俗各异，艺术传统也各有其特殊性。因此，南北戏曲就形成了不同的体制和不同的艺术风格。二者在体制特征上的异同，主要表现在以下方面：\n\n一、相同点\n\n（一）都包括曲词、宾白、科（介）三个部分\n\n元代的戏剧，有杂剧和南戏两种类型。这两个剧种的剧本都包括曲词、宾白、科（介）三个部分。曲词，是剧中人物的唱词；宾白，是剧中人物的说白；科介，是剧中关于动作、表情和音响效果的舞台指示。\n\n（二）都在戏剧冲突中刻画人物\n\n杂剧和南戏的剧本，都有完整的故事情节，在戏剧冲突中刻画人物形象。剧本的唱词，则更多用以表现人物在特定场景中的思想情绪，甚至直接透露作者的心声，具有强烈的抒情性。\n\n（三）都受到了诸宫调的影响\n\n宋金时期的诸宫调在“唱赚”等形式基础上形成了多宫调联缀的套曲结构，其曲牌联套的体式更为杂剧的形成提供了重要的借鉴。南戏作为戏剧样式，是多种民间技艺综合而成的。从现存的作品看，南戏结合了民间流行的诸般技艺，比如说诨\n\n话（逗笑的段子）、莲花落（宋元以来流行的一种民间曲艺）、陶真（南宋以来流行的一种说唱形式）以及诸宫调等。其中，诸宫调的影响更为重要。\n\n二、区别\n\n杂剧与南戏在体制特征上的区别，主要表现在以下方面：\n\n（一）篇幅不同\n\n杂剧的基本体制是四折一楔子，篇幅紧凑，情节集中。南戏则无固定限制，一般采取分场形式，以人物上下场为界线，根据内容需要，灵活安排场次。早期南戏篇幅长短比较自由。南戏定型以后开始趋于整齐。\n\n（二）唱法不同\n\n杂剧严格限制为一人主唱，或正末唱，或正旦唱。南戏则登场脚色不论生旦净丑都可以唱，唱法灵活多变，有独唱、对唱、接唱、合唱等多种形式。而且，南戏唱腔每出不限于一个宫调，也不限于一韵。南戏每出的联套方式也与北戏比较固定的情况不同，它灵活自由，一般可分为引子、过曲及尾声三个部分。\n\n（三）曲词不同\n\n北戏主要用北曲，特点是七声音阶，即宫、商、角、徵、羽、变宫、变徵，节奏比较急促，风格粗犷朴实。南戏主要用南曲，特点主要是五声音阶，无变宫、变徵二音，节奏比较舒缓。由于南北方言的不同，南方语音中平、上、去、入四声俱备，北方语音中平、上、去三声，无入声。北曲用弦乐伴奏，以琵琶为主；南曲则以管乐伴奏，配以鼓板。故北曲声调遒劲朴实，南曲则柔缓婉转。\n\n（四）结构不同\n\n南戏定例第一出为“副末开场”，不唱曲，念词二阕，以表明作者主旨及戏文大意；接着，生、旦分别登场。结构多为双线并进，生、旦各领一线。至最后一出，照例为全剧人物一同登场欢聚，生旦团圆。著名杂剧不少是悲剧，南戏则多为喜剧或先离后合、始困终亨的正剧或悲喜剧。\n\n（五）宾白不同\n\n就宾白而言。杂剧较俚俗，而南戏在进入上层社会以后则比较文雅，明以后更有用四六骈文者。人物出场，杂剧先白后曲，南戏则大都先曲后白。\n\n（六）脚色体制不同\n\n南戏的脚色体制已趋于完备，一本戏中，有生、旦、净、末、丑、贴、外等七个脚色，每种脚色都有特定的分工，并且凡上场脚色皆可唱。南戏脚色体制的确立，不仅作家可以根据不同的脚色来设置情节，而且演员也可以按照自己所扮演的脚色来发挥各自的特色。在北曲杂剧的脚色中，只有正末、正旦、净这三类脚色是确定的，有许多脚色只是以其在剧中的特征相称，有的则直称其名。\n\n总之，南戏定型后的戏剧形式，较杂剧有明显的改进，运用戏剧手段反映生活、塑造形象的能力有很大的增强，故在明清两代，南戏以传奇的形式，在剧坛上显示出蓬勃的艺术活力。","keywords":"相同 曲词、宾白、科（介）戏剧冲突 诸宫调影响 区别 篇幅 唱法 曲词 结构 宾白 脚色体制","note":"杂剧和南戏都是元代戏曲的重要组成部分，所以经常会被放在一起进行对比。二者一在南方流行，一在北方流行。而在元代之前，南北已经经历了数百年的对立，这种对立必然会导致两地文风、曲风在对立中逐渐交融。在这基础上发展出来的杂剧和南戏，也必然同中有异，异中有同。"},{"id":"304","stars":"★★","title":"试分析元代诗歌成就不及唐宋的原因","body":"元代诗歌，无论其思想深度或艺术成就，都远逊于唐宋，其原因是多方面的：\n\n一、杂剧、散曲勃兴，诗歌作者减少\n\n中国传统的诗歌，自先秦以来，千年熔铸，万人揣摩，至唐宋名家辈出，从内容到形式，都达到了难以逾越的高度，元代诗歌的难乎为继，自然在所难免。而元代，作为一个仅有百年历史的朝代，当其诗歌的发展还来不及培育出自己的大家的时候，杂剧、散曲这一新兴文学艺术的勃兴，却吸引了众多有才学的作家，这对传统诗歌来说，无疑是一种抑制。于是，杂剧散曲便取代了传统诗歌的地位，成为堪与唐诗宋词相并列的一代文学的代表。\n\n二、元代文人地位卑贱，缺少豪迈的情怀\n\n诗歌艺术的发展，有赖于文人的贡献，而元代科举考试时行时辍，儒生失去仕进机会，地位下降。与此同时，在政治上，元朝统治者始终奉行民族压迫政策，他们把国民分为蒙古、色目、汉人、南人四个等级。蒙古人最尊，南人最贱。政府中军\n\n政大权，由蒙古人独揽。元代社会的文人，特别是广大汉族文人，地位卑贱，“沉抑下僚，志不获展”。从事诗歌创作的人，既感受不到时代的光明，又缺少豪迈的情怀，自然写不出伟大的作品。\n\n三、理学思想影响\n\n元朝统治者注重和提倡理学，元朝立国，程朱理学的统治地位得到确认。朝廷设立官学，以儒家的四书五经为教科书。与此同时，元朝统治者重用理学家，这对元诗歌的发展大有影响。当时，很多诗歌作者如姚燧、刘因等本身就是理学家，一些著名作家，如虞集、袁桷等，也都深受理学影响。理学的影响，正是元代诗歌平平的原因之一。\n\n四、注重追求“唐音”却只得其形\n\n从总体看，元代诗歌的作者比较注重追求“唐音”，萨都刺诗云：“乡情犹越分，诗句尽唐音。”以为如此即为“风雅之正声”。元代许多诗人在创作上提倡“宗唐得古”，以唐诗和魏晋古诗为皈依，这是由于他们不满意宋代以文为诗、以理入诗的倾向，要求注重诗歌的形象性。但是，元代诗人对唐诗的追求，实际上只能停留在形式上的模仿，而没有唐人的精神实质。因此，这种宗唐的结果，反而使元诗缺少创新，与唐诗形成鲜明的反差。元后期的诗歌，更为纤秾，绝少奇伟之作，这与其学习晚唐之诗，倒有密切关系。","keywords":"作者减少 缺少豪迈情怀 理学思想影响 追求“唐音”却只得其形","note":"相较于元代戏曲的繁荣，元代诗文整体成就较低，这一方面是由于文学发展的自身规律，但更大程度上是由于元代特殊的政治文化环境。在元代，文人地位极为低下，理学思想影响广泛，这些都是不利于诗歌健康发展的重要因素。可以说，和戏曲的繁荣一样，元代诗歌成就较低也主要是受文学外部因素的影响。"},{"id":"305","stars":"★★★","title":"谈谈你对话本的认识","body":"宋元时期，“说话”艺术流行，由此，“话本”也大量出现，取得了十分突出的文学成就。\n\n一、话本的内涵\n\n话本的产生与说话艺术息息相关。“说话”的本义是口传故事。后来人们以“话”代指口传的“故事”。唐代宫中已有“说话”活动，它是取悦皇帝的一种方式。宋代的“说话”，上承唐代“说话”而来。又因城市经济的繁荣、瓦舍勾栏的设立、说话艺人的增多、市井听众的捧场，民间说话呈现出职业化与商业化的特点。随着说话活动的日益兴盛，在书场中流传的故事越来越多，而以口传故事为蓝本的文字记录本，以及受说话体式影响而衍生的其他故事文本等，也日见其多。后世统称之为“话本”。\n\n二、话本的特征\n\n话本因说话技艺产生、成长，所以与传统叙事文学相比，它的体制结构具有鲜明的“说话”特征。\n\n（一）结构特征\n\n话本在主体故事前有个引子，有些是一首或几首诗词，有些是相关的小故事，这相当于“说话”中的定场诗及“得胜头回”。在主故事结束后，以总结全篇、深化主旨的诗句为结尾，呼应篇首。\n\n（二）叙事手法\n\n话本多使用第三人称全知全能视角，叙述者对故事人物的动机和行为了若指掌。在叙事过程中，叙述者时不时跳出来和观众交流，如“说话的”“今日为甚说这段话”“今日说一个......”“你道”之类的措辞，这是说话人现场调动听众情绪的一种方式。\n\n三、宋元话本的分类\n\n虽说话本都因“说话”而生，然而有的结撰在“说话”之前，如宋代书会组织底层文人专门创作的话本；有的话本是“说话”内容的记录，说话艺人为了技艺的传承和发展，会自己动手或雇人负责记录“说话”内容。根据话本产生方式的不同，大体而言，传世宋元话本可分为三类：\n\n（一）提纲式的叙事粗略、文字粗糙的说话艺人的底本，如《三国志平话》等。\n\n（二）以说话艺人之口述故事为主要内容的记录整理本，文字通顺，描写细致叙事周详，可能出自当时的读书人或书会先生之手，如《错斩崔宁》《碾玉观音》等。\n\n（三）文人依据史书、野史笔记、文言小说等改编而成的通俗读本，兼有一定的故事性，如《宣和遗事》等。\n\n【李凡关键词：内涵 文字记录本 衍生故事文本 特征 结构 引子 结尾 叙事 第三人称全知全能视角 分类 提纲式 记录整理本改编通俗读本】","keywords":"","note":"所谓“话本”，指的就是“说话人的底本”，由此可见话本与说话艺术之间的联系。而“说话”，归根结底就是讲故事，是一种商业性的文化活动，所以在结构和手法上都向着有利于吸引读者、调动情绪的方向靠拢。“话本”这一概念多以名词解释的形式出现，大家要注意一下。"},{"id":"306","stars":"★★★","title":"试分析宋元小说话本的特征","body":"“小说”是说话伎艺的重要家数之一，宋元小说话本在具备话本的共有特征之外，也有自己的独特性，具体表现在以下方面：\n\n一、体制上分为题目、篇首、入话、头回、正话和篇尾六个部分\n\n小说话本篇幅不大，故事紧凑，其体制较为固定。\n\n（一）篇首即开头，常常是一首或数首诗词，点明主题、总领全篇。\n\n（二）入话和头回是由篇首过渡到正话的部分，入话长短不一，形式自由，点明篇首和正话的关联之处，作用是承上启下、穿针引线。\n\n（三）头回，又称“得胜头回”，是正话开始前与之相关的故事。在“说话”技艺中二者能起到定场作用。\n\n（四）正话，是故事的主体部分。\n\n（五）篇尾部分，有时以一首诗概括全篇、重申主旨，后或再附上“话本说彻、权作散场”类的结语。\n\n不过，并非所有小说话本都严格地分为六部分。有的小说话本将入话和头回合二为一，如《闹樊楼多情周胜仙》。有的或是文本中略去了某个部分，如《宿香亭张浩遇莺莺》。\n\n二、题材多样，但以爱情故事和公案故事为兴奋点\n\n小说话本的题材多样，《醉翁谈录·小说开辟》按内容将其分为灵怪、烟粉、传奇、公案、朴刀、捍棒、妖术、神仙。但若就旨趣而论，不管是何种题材，都往往以爱情或公案作为叙事的“兴奋点”。生动传神地讲说爱情故事，是说话艺人的必备技能。\n\n（一）爱情故事。话本小说中的爱情，有未婚青年的怦然心动，也有已婚男女的婚外私情。前者如《闹樊楼多情周胜仙》中范二郎和周胜仙金明池初遇，后者如《刎颈鸳鸯会》中蒋淑珍嫁作商人妻后别恋邻居朱秉中。小说话本赞扬青年男女，尤其是女性，勇敢追求爱情的举动，却又生出种种阻隔彰显私定终身的高风险。\n\n（二）公案故事。宋元时代，官府昏庸、吏治腐败现象的日趋严重，是导致大量公案故事产生的主要原因。它反映出民众对不公平、不合理现象的关注，以及对生存权利和社会治安的深重忧虑。像《错斩崔宁》，讲述由一起命案引发的一段冤情，就颇有典型意义。\n\n三、小说话本的叙事特征\n\n早期小说话本脱胎于说话人的口述，因而其形制上具有鲜明的职业化叙事特点。\n\n（一）文本中运用大量套语，评论、描述语言程式化，次要人物符号化。如引入评论或描述多用“但见”“却是”等标志性词语，小说中次要人物称号固定，如丫鬟多为“梅香”等，这方便听众快速了解书中次要人物所扮演角色。\n\n（二）叙述者常介入叙事过程，或加入评论和警示，或为调节叙事节奏，转换话头。如《错斩崔宁》预示刘贵遭遇不测，插入“若是说话的同时生、并肩长......”之句。\n\n（三）小说话本以人物行为和事件发展为叙事中心，疏于刻画人物性格和内心，人物行为和性格往往只为故事情节服务，如《错斩崔宁》中王大姐的行为。这类行为完全出于情节需要，而不大符合伦理常情。小说话本多为口述体故事，要遵从听众的兴趣，过多关注人物心理势必造成情节散漫。这是话本小说区别于其他案头小说的一个重要特点。\n\n（四）小说话本的语言具有口语化、个性化的特点，贴近市井生活，切合人物身份。如《闹樊楼多情周胜仙》中周胜仙“死”而复生去见范二郎，范二郎吓得连叫“灭，灭”，生动写出了他以为白日见鬼时极度的恐惧和慌乱。","keywords":"体制 题目、篇首、入话、头回、正话和篇尾 题材多样 爱情故事 公案故事 叙事特征 运用大量套语 叙述者介入叙事过程 人物为情节服务 语言口语化、个性化","note":"宋元小说话本在题材和叙事特征上都显露出了商业化、模式化的特点，总体还是为了吸引读者，扩大受众群体。这里需要注意的是小说话本的体制，马工程版教材分为六个部分，而袁行霈版教材则分为入话（头回）、正话、结尾三个部分，大家要根据自己报考学校参考书目识记。"},{"id":"307","stars":"★★★","title":"试分析诸宫调的创作特征","body":"诸宫调是一种说唱文学，主要流行于宋金时期。诸宫调是以一人且说且唱、以唱为主的表演形式。因唱的部分用多种宫调的曲子联套演唱，故名。诸宫调的特征，主要表现在以下方面：\n\n一、篇幅较大，以情节单元划分为若干卷，一卷内可使用不同宫调\n\n诸宫调作品，由于篇幅较大，一般都分为若干卷，大致以情节单元来划分；其同一卷内可以使用不同的宫调，如分属于〔商调〕、〔正宫〕、〔仙吕调〕、〔南吕宫〕、〔般涉调〕、〔黄钟宫〕、〔中吕调〕等的曲子（这一宫调连缀方式，见《刘知远诸宫调》第一卷），可以在同一卷里串联起来，其演唱曲式的丰富性与多变性由此可见一斑，较能适时地配合着故事情节与人物情绪的动态变化。诸宫调的构成方式与鼓子词的说唱方式形成明显的对照。\n\n二、故事题材为唐代传奇故事和历史题材故事\n\n从一些相关资料可知，宋、金时期诸宫调作品的故事题材不少是取自唐代传奇或唐代笔记，比如，《崔韬逢雌虎诸宫调》的本事见唐薛用弱的《集异记》，《崔护谒浆诸宫调》的本事见唐孟棨的《本事诗》，《郑子遇妖狐诸宫调》的本事见唐沈既济的《任氏传》，《倩女离魂诸宫调》的本事出自唐陈玄佑的《离魂记》，《柳毅传书诸宫调》的本事出自唐李朝威的《柳毅传书》，等等。这一类作品的故事性强，有足够的吸引力，能引起听众的欣赏热情，成功的机会也较大。同时这类故事比较曲折多变，篇幅较长，当用多种宫调来说唱，这也是产生诸宫调说唱形式的内在契机之一。\n\n除唐代传奇等故事外，诸宫调也演述历史题材的故事。历史故事颇多风云激荡、金戈铁马、皇家秘史等内容，绝非短小的篇幅可以容纳，故此，用诸宫调的形式亦颇为合适。\n\n三、与小说话本有密切关系\n\n诸宫调又称“话儿”或“话本”，像《西厢记诸宫调》卷一以“这本话儿”代指将要说唱的故事；这说明诸宫调与民间说话是孪生的艺术种类。诸宫调作品中出现的代言体叙事，与小说话本对人物声口的模拟，有着密切的关系。","keywords":"篇幅较大 以情节单元划分 唐代传奇故事 历史题材故事 与小说话本有密切关系","note":"诸宫调主要流行于宋金时期，虽然保留下来的作品不多，但却有着十分重要的影响。像是元代的杂剧和南戏受到了诸宫调的影响，《西厢记诸宫调》这部代表作品更是为人所关注。所以，诸宫调这一概念经常在名词解释中出现，大家要关注一下，大家要注意一下。"},{"id":"308","stars":"★★★","title":"试分析《西厢记诸宫调》（《董西厢》）的创作成就","body":"《西厢记诸宫调》是现存唯一完整的诸宫调作品，作者董解元，故又被称为《董西厢》。其本事源于唐代元稹的《莺莺传》（《会真记》），不过在思想和艺术上都更进一步，具体表现在以下方面：\n\n一、向讴歌爱情的主题更进一步，呈现全新思想高度\n\n《董西厢》以“趁了文君深愿，酬了相如素志”为旨趣，写男女双方均有真情，深爱对方，坚贞不渝，终于得偿所愿，结为连理，“美满团圆”。这就显然改变了《莺莺传》“始乱终弃”的故事格局，更大胆变动了原作所蕴含的张生抛弃莺莺是“善于补过”的题旨，显示出与原作大为不同的伦理判断，表达了长期受到精神压抑的年轻人自择配偶的意愿以及对自主婚恋的追求。《董西厢》向着讴歌爱情的主题大大跨进了一步，使原本止于哀艳的传奇故事登上了全新的思想高度，这是《董西厢》最突出的成就。\n\n二、人物形象更加丰满典型\n\n《董西厢》所塑造的人物形象远比《莺莺传》丰满典型。除了将莺莺与张生赋予全新的形象外，又加强了对其他人物的塑造。老夫人在《莺莺传》中原是个无足轻重的人物，在《董西厢》中却成为冷酷和反复无常的封建势力的代表。红娘在《莺莺传》中原是个普通丫鬟，在《董西厢》中却成为勇敢、正义和智慧的化身。在具体描写时，《董西厢》还通过神色表情、举止行动、内心独白等多种手法，刻画出人物的内心世界。\n\n三、活用“说唱”体，重新配置人物关系\n\n董解元的艺术感觉相当敏锐，他活用“说唱”体，在“说唱”的框架内，适当地重新配置人物关系，为自己的艺术创造预留更大的空间。如新增的法聪形象，犹如一枚“活棋”，故事格局随之富于变化。同时，作者赋予红娘更大的“戏份”，她不仅穿针引线，来往于崔、张之间，促成了两人的好事，而且，在事情“显露”之后，淡定应对老夫人的责问，使老夫人改变态度。这也是渗透着戏剧性的场面，在“西厢故事”的流变史上具有重要的文学价值。\n\n四、情节曲折，结构宏伟\n\n在情节的安排上，《董西厢》也有很高的成就。它情节曲折，结构宏伟，以老夫人在兵乱中许亲，事后悔婚，莺莺与张生真诚相恋，红娘义责老夫人，老夫人再度许亲与再度悔婚为线索，设计了一系列情节，使矛盾冲突不断尖锐，颇具吸引力。\n\n五、语言亦俗亦雅\n\n《董西厢》的语言，亦俗亦雅，素朴与典雅合为一体。其散文部分，受到原作《莺莺传》的影响，大体用浅易而不失书卷气的文言，在整个故事的演述中起着承上启下的作用。而韵文部分，则以口语为主，描摹心理，叙述情节，均能妥帖逼真。其后，王实甫的《西厢记》在语言创造方面也受到它的影响。","keywords":"全新思想高度 人物更加丰满 活用“说唱”体 情节曲折 结构宏伟 亦俗亦雅","note":"①《西厢记诸宫调》虽然取材于《莺莺传》，但其整体基调和主题已经与原文有了很大的不同，这种变化主要是受到了社会思潮变动的影响。作为“西厢故事”中承上启下的一部重要作品，《西厢记诸宫调》在对《莺莺传》进一步丰富发展的同时，也在多个方面启发了王实甫的《西厢记》创作，在考查中出现的频率不低。②“西厢故事”传承及演变大家也要掌握。"},{"id":"309","stars":"★★★★","title":"试述关汉卿的创作成就","body":"关汉卿成为元杂剧辉煌成就中最为突出的一个个案，其戏剧创作的成就主要体现以下几个方面：\n\n一、元杂剧作为诸戏曲因素融合混一而成的完全意义上的戏剧，其艺术体制是成熟的。关汉卿以此创作了大量的戏剧作品，为元杂剧体制进一步丰富做出了极大贡献。\n\n从现存元杂剧剧本中唱词所使用的曲牌和“套数”上看，北曲杂剧所用的“套”共有九个。关汉卿现存的杂剧剧本中除〔大石·六国朝〕套曲没有用过，其他八种都使用过。他的杂剧中，可以总结一些使用“套数”的规律，一般是第一折唱〔仙目·点绛唇〕套，第四折唱〔双调·水新令〕套，〔中吕·粉蝶儿〕套、〔正宫·端正好〕套和〔南吕一枝花〕套则分别用于第二折和第三折。关汉卿是较早运用元杂剧这种体制进行戏剧创作的。同时及以后的元杂剧作家也效仿炮制，使元杂剧的体制形成，并创造了辉煌的戏剧艺术种类。\n\n二、关汉卿作为元杂剧创作第一人，通过戏剧艺术作品塑造了一大批“典型”人物形象，绘制了一幅展现元代社会“诸色人等”风景图。\n\n关汉卿创作的杂剧大约可考的人物约有130多个，剧中人物有主有次，有圆型有扁型，层次分明，个性突出。其中尤以“英雄”和“妇女”最为典型。透过这些剧中的人物，关汉卿反映了各个历史时期的社会生活，尤其是真实反映了元代的社会生活，反映了元代社会各个阶层人们的生活状态和社会关系，尽显人生百态。可以说关汉卿是描绘“人物”的圣手，在中国文学史上创造了许许多多“这一个”的人物，丰富了中国文学的“人物形象”。通过这些“人物形象”，我们可以了解元代社会“人生百态”、市民生活等，具有“史料”价值。\n\n三、关汉卿是元杂剧特定体制的创建者，也是实践者，但他不拘泥于体制的限制，在元杂剧体制之内，自由灵活地将“人物”放置在“冲突与矛盾”当中，顺理成章，决不牵强，并通过鲜活、生动的语言表现出来，既达到“叙事”的目的，又收到刻画了人物形象之功。\n\n关汉卿的杂剧虽然也同大多数元杂剧一样一本四折，但却有所突破，如《单刀会》《救风尘》等作品中，都把最精彩的“冲突”放在了第四折，与其他元杂剧第三折高潮、第四折结局不同，于结局处显高潮，高潮处即结局，一波三折后，始出结果，这种出人意外的描写，既丰富了作品的戏剧性，又增强了“戏”对受众的吸引力。可见，关汉卿在创作上是进行了一番缜密的思考和独具匠心的设计。","keywords":"丰富元杂剧体制 塑造典型人物形象 展现元代社会 不拘泥于体制","note":"关汉卿在杂剧方面取得了突出成就，不但创作了《单刀会》《窦娥冤》等一系列作品，更是对于杂剧体制的发展、内容的丰富、艺术的进步起到了重要的推动作用，可以说是元代杂剧成就的典型代表。所以在考查中不仅会针对关汉卿的代表作品出题，还会针对关汉卿自身创作成就出题。"},{"id":"310","stars":"★★★","title":"试分析《单刀会》的艺术成就","body":"在关汉卿杂剧中，有相当数量的作品是以历史事件、历史人物为题材的历史剧，如《单刀会》《西蜀梦》等，其中以《单刀会》的成就最高，影响最大。\n\n一、剧情安排先声夺人，出人意料\n\n《单刀会》在构思上很有特色。关羽是第三折才出场的。剧本第一折，先由东吴的亲贵乔公主唱，表示反对鲁肃裹挟关羽的计策，并追述了关羽的英勇业绩。第二折，则由隐士司马徽再一次介绍关羽的勇武威猛。这两折戏，主人公关羽尚未出场，但反复渲染、铺垫，产生了让关羽形象先声夺人的艺术效果。\n\n与此同时，《单刀会》把最精彩的“冲突”放在了第四折，正面表现发生在筵席上的尖锐冲突，于结局处显高潮，高潮处即结局，一波三折后，始出结果，这种出人意料的描写，既丰富了作品的戏剧性，又增强了“戏”对受众的吸引力。\n\n二、成功塑造了关羽这一典型形象\n\n（一）为了表现关羽的英勇气概，《单刀会》首先运用侧面描写的方法，在第一、二折里，通过乔公与司马徽之口，历数关羽非凡的经历，使关羽在剧中尚未出场，便已先声夺人，得到了充分的渲染与“烘托”。\n\n（二）为了表现关羽不仅勇不可当，而且有非凡的气度和豪迈的情怀，作品为他安排了一定数量的唱段，使之直抒胸臆，以展示其精神世界，如第四折中的〔新水令〕、〔驻马听〕、〔胡十八〕等。\n\n（三）《单刀会》发挥舞台艺术的功能，以动静结合、形神合一的手法，塑造了一座座雕像式的造型，如乔公所唱：“他上阵处赤力力三绺美髯飘，雄赳赳一丈虎躯摇，恰便似六丁神簇捧定一个活神道。”这种造型式的手法，无疑使关羽的英雄气概得到更充分的表现。\n\n三、突破了历史情境的制约，将信誉之争改变为“正统”之辩，提升了思想境界\n\n在《单刀会》里，关汉卿突破了历史情境的制约，不仅通过艺术虚构把关羽塑造成孤胆英雄，而且将信誉之争改变为“正统”之辩。这一变动，境界全出。剧中关羽的一举一动，无非是捍卫“汉家”基业。在“汉家皇统”这一前提下，鲁肃“讨还”荆州的行为，显然是无理取闹，在民族斗争激化的特定背景下，这也多少反映出人们思想的向背。","keywords":"先声夺人 出人意料 关羽形象 侧面描写 直抒胸臆 雕像式造型 提升思想境界","note":"《单刀会》是关汉卿历史剧创作成就的代表，这部历史剧虽然仍旧保持着杂剧的体制，但关汉卿在这种框架下做出了积极的创新，如侧面描写、先声夺人，以及大胆的虚构艺术手法等，都融汇着关汉卿的巧思。这部历史剧在思想上的内涵，更是不容忽视。"},{"id":"311","stars":"★★★","title":"试述关汉卿《救风尘》的创作成就","body":"《救风尘》全名《赵盼儿风月救风尘》，是关汉卿喜剧创作的突出代表。这部作品的创作成就，主要表现在以下方面：\n\n一、成功塑造了赵盼儿这样一个光彩照人的形象\n\n赵盼儿光彩照人的舞台形象，富有强烈的艺术感染力。风尘女子的经历，使她对纨绔子弟的品性有深刻的了解。这个风尘女子，正是一个有头脑、有思想，洞达世情的女性。正因如此，她才能规劝、提醒宋引章，而且在宋引章终于陷入困境时又能勇敢地出来搭救这个落难的姊妹。\n\n搭救宋引章的行动，则表现了赵盼儿这个社会底层的女子的正义感和机智勇敢的性格。作品通过赵盼儿自己的话，深刻揭示了她内心深处的想法，她搭救宋引章的行动，熔铸着对自身命运的感慨和抗争。因此，在行动中她全力以赴，表现出可贵的机智和勇敢。\n\n二、喜剧性的“布置结构”\n\n一无所有的赵盼儿，凭着一副侠肝义胆和机智勇敢，终于使恶者受惩，弱者获救，使全剧充满了喜剧色彩。《救风尘》矛盾双方的冲突是一个美与丑，善与恶相互斗争较量过程中，美的力量从困厄走向自由，从痛苦走向欢乐，恶的势力从嚣张走向失败，从狂欢走向痛苦的动态逆反结构，在这个动态逆反结构中，美的生命力不断发展壮大终至取得胜利是这场戏剧冲突的主旋律。而喜剧性的“布置结构”使全剧引人入胜，正是本剧最突出的艺术成就。\n\n三、广泛反映当时社会生活\n\n《救风尘》不仅表现手法复杂多样，在反映社会生活（世态）的广度和深度上也超过了关氏以前的任何一部喜剧。就反映的社会生活面而言，此剧虽然没有脱离妓院的具体背景，但却以此为轴心，展示了它周围的社会大环境。\n\n例如从周舍骗娶宋引章的前后过程可以看出当时“宦家子弟”及其家庭生活情况和当时的婚姻制度；从安秀实身上可以看出当时下层落魄文人的窘境。不仅如此，剧中周舍对店小二的态度反映了当时一些客栈的内幕。通过剧情我们还可以看到市井中的帮闲。此外，从剧末“清官”断案时还须看周舍“父亲面上”，看到了当时“清官”审案时所谓“执法严明”的真实状况。\n\n【李凡关键词：赵盼儿形象 喜剧性的“布置结构”广泛反映社会生活】","keywords":"","note":"如果说《单刀会》是关汉卿历史剧的代表，那么《救风尘》就是关汉卿喜剧创作的代表。和《单刀会》关注于历史与民族斗争不同，这部喜剧将目光聚焦于底层女性，反映了真实的底层社会生活，在喜剧手法上也取得了不俗的成就。在论述关汉卿喜剧创作相关内容时，可以将这部分内容作为补充。"},{"id":"312","stars":"★★★","title":"试分析关汉卿喜剧作品的创作特征","body":"关汉卿的喜剧作品充满着不畏强权的斗争精神和敢于胜利的乐观态度，是古代喜剧作品的经典之作。这些作品，主要有以下特征：\n\n一、善于展现底层小人物尤其是女性的智慧\n\n关汉卿的喜剧作品，善于展现底层小人物的智慧，尤其是女性的智慧。写她们有情有义，斗智斗勇，无所畏惧，为了自身和别人的安危，挺身而出，与强权周旋，与邪恶势力抗争，从而维护了自身和别人的生存权利，增强了弱小群体在险恶的社会环境中生活下去、抗争到底的勇气和信心。剧作家在舞台上呈现出一幕幕以弱胜强的动人情景，让观众在弱小者的胜利中感受到自身力量的可贵，领悟到只要敢于抗争，命运可以掌握在自己的手里。\n\n二、巧设圈套和细节重复两种喜剧技巧\n\n喜剧创作最讲究运用技巧。关汉卿喜剧中常用的喜剧技巧有以下两种：\n\n（一）巧设圈套，使人物受骗上当、以假当真，一意孤行，产生喜剧效果。如《救风尘》中，赵盼儿为搭救落入虎口的宋引章，用计谋使流氓周舍落入圈套。\n\n（二）细节的重复推动情节、情绪的进展，以此点染喜剧气氛。如《金线池》每一折都是以韩辅臣参见同窗故友、现任济南府尹石好问开始的。并且后三折参见的内容是“告状”，言语几乎都一样。然而每一次参见都把剧情向前推进一步。\n\n三、在次要人物尤其是反面人物身上挖掘喜剧性\n\n-\n\n关汉卿重在次要人物尤其是反面人物身上挖掘喜剧性，以形成一种喜剧情调，让主要人物在这种喜剧氛围中或悲或喜，或忧或乐，款款行动，表现自我。这主要表现为以下两种方式：\n\n（一）主人公与其他正面人物之间发生带有喜剧性的冲突，如《金线池》中韩辅臣与杜蕊娘的冲突。\n\n（二）通过科诨、独白等手段，突出表现反面人物性格中的喜剧因素，极尽讽刺、嘲弄之能事，如《救风尘》第二折中周舍的那一段独白。这是关剧渲染喜剧情调、构造喜剧氛围的重要方法。\n\n四、悲喜交融在一种精心铺排的喜剧情调中\n\n关汉卿喜剧最突出的美学特征是悲喜交融在一种精心铺排的喜剧情调中，揭示主人公深刻的思想矛盾和精神痛苦，深化了戏剧主题，使喜剧达到一种深邃、凝重的境界，给人似喜还悲的真切感受。从整个戏剧故事的框架看是喜剧，从剧中某一折或某一片断来看又是悲剧，悲喜交融，互相渗透。\n\n五、结构上多为三段式结构，场面第接张弛有致，多大团圆结局\n\n（一）抑扬顿挫节奏的三段式结构。关氏喜剧囿于一本四折的杂剧体例，线索比较单纯，情节比较简单，运用时间延展型结构，按时间顺序展开故事。故事情节呈顺一逆一顺的发展态势，人物情绪则表现为喜一悲一喜的趋向，转折变化，起伏强烈，形成一种有着明显抑扬顿挫节奏的三段式结构。\n\n（二）场面的第接张弛有致。关汉卿的喜剧讲究场面冷热兼有，参差错落，逐渐把剧情推向高潮。\n\n（三）第四折的大团圆结局。关汉卿的喜剧都是凭靠清廉官吏或公道官府的威势构成完满结局的。这表现了挣扎在黑暗社会的人们一种美好的幻想，一种渴求世道公平、官府清正的愿望，也是关汉卿不可能突破的时代、思想局限。","keywords":"小人物、女性的智慧 巧设圈套 细节重复 次要人物、反面人物身上挖掘喜剧性 悲喜交融 三段式结构 张弛有致 大团圆结局","note":"关汉卿的杂剧创作之中，虽然以《窦娥冤》这部悲剧成就最高、影响最大，但在喜剧艺术上，关汉卿也成就不俗。一些典型喜剧手法，如设置圈套、细节重复等，关汉卿都可以自如灵活地运用。不过，关汉卿的喜剧虽然也表现了真实的社会生活，但也无法脱离时代、思想局限，多大团圆结局，对官府抱有幻想，对此大家要辩证看待。"},{"id":"313","stars":"★★★★","title":"试分析《窦娥冤》的艺术成就","body":"关汉卿对社会现实有清醒的认识，他的悲剧创作，酣畅淋漓地揭示出元代惊心动魄的人间惨象，这其中，又以《窦娥冤》艺术成就最高，这主要表现在以下方面：\n\n一、“悲戚”“悲壮”的审美效果\n\n《窦娥冤》的艺术成就，首先表现在它的悲剧的审美价值。中国古代戏剧理论中，几乎没有悲、喜剧的概念。王国维在《宋元戏曲考》里讲到了悲剧，认为元杂剧中“有悲剧在其中”，并进而指出关汉卿之《窦娥冤》是“最有悲剧性质”的元杂剧之一。\n\n《窦娥冤》的悲剧价值，不仅在于它写出了一个善良的弱女子惨遭刑罚，最终屈死的命运，而且更在于它写出了这个弱女子终于以自己的悲惨遭遇回击了威严、强大的封建制度，并由此而引发了读者或观众的深刻而严肃的思考，激起了他们对凶残丑恶的封建社会的憎恶乃至反抗。因此，其审美效果，既是“悲戚”的，也是“悲壮”的，二者融合，感人肺腑。\n\n二、语言直白而有意蕴\n\n《窦娥冤》的语言，无论唱词和道白，都是元杂剧中的上乘。优秀的元杂剧作品，大多具有“雅俗兼收、串合无痕”的特点，而《窦娥冤》的语言，更为直白而有意蕴。王国维在论述元杂剧语言“自然”而“有意境”时，专举《窦娥冤》第二折〔斗虾蟆〕为例，认为“此一曲直是宾白，令人忘其为曲”。\n\n当然，王国维没有举到的其他很多曲词宾白，也都在自然本色之中而有意境，例如第三折的“〔正官·端正好〕没来由犯王法””〔滚绣球〕有日月朝暮悬””〔要孩儿〕不是我窦娥罚下这等无头愿”“〔一煞〕你道是暑气暄”“〔一煞〕你道是天公不可期”诸曲。\n\n三、令人信服地写出了窦娥性格的发展变化过程\n\n在人物性格刻画方面，《窦娥冤》令人信服地写出了窦娥性格的发展变化过程，既有连续性，又有阶段性，取得了很高的艺术成就。\n\n窦娥形象，是元代弱小者典型化的产物。遭受童养媳和青年寡妇的命运，窦娥本来安于现状，别无所求。但蔡氏应承了张氏父子横蛮无理的“入赘”要求时，窦娥选择了激烈反抗。为了婆婆不致受刑，窦娥不得不屈招；但屈招并非屈服。刑前“三誓”，正是她觉醒之后的最后抗争。随着一系列不幸遭遇的逐层出现，窦娥的性格，呈现出明显的阶段性发展过程，从一个严守妇道的普通妇女，发展成为具有强烈反抗精神，敢于痛斥官府、控诉天地的女性。深刻的悲剧性，使这形象蕴涵着丰富的审美价值。","keywords":"悲戚 悲壮 审美效果 语言直白有意蕴 性格发展变化过程","note":"在关汉卿的诸多悲剧创作中，《窦娥冤》的艺术成就最高，是中国古代悲剧成熟的标志和中国古代悲剧的典范作品。王国维《宋元戏曲考》更是直接称赞《窦娥冤》：“即列之于世界大悲剧中，亦无愧色也。”这部作品影响更是十分深远，很多地方戏曲如徽剧、秦腔、晋剧、河北梆子都曾改编过这部作品。"},{"id":"314","stars":"★★★★★","title":"试分析关汉卿悲剧的创作特征","body":"关汉卿以民众痛苦不堪的遭遇为杂剧题材，其作品具有震撼人心的悲情力度，成为古代悲剧作品的经典之作。这些作品，主要具备以下特征：\n\n一、在揭露人间罪恶的同时，高扬正义的旗帜是其悲剧创作的共同主旨\n\n在关汉卿的笔下，悲剧主人公大多具有顽强、坚定的意志，敢于与邪恶势力作不妥协的较量，在较量中充分显示出善良的人们捍卫世间正义的壮烈情怀与崇高精神。\n\n在关汉卿的悲剧创作中，每每贯穿着这样的脉络：情绪从悲愤走向悲壮，剧情亦从恶势力的暂时得逞，转为人间正义的最终胜利。这其中最令人难忘的依然是他战胜邪恶势力的信念，是悲剧主人公敢于抗争的刚烈品性。\n\n二、悲剧的主角多是凡人、普通人\n\n中国的悲剧从一开始就注意塑造一系列普通人特别是受压迫妇女的悲剧形象。关汉卿以丰富的社会阅历和多方面的艺术才能，在中国戏曲史上，率先推出一批具有典范意义的悲剧作品，如《窦娥冤》《蝴蝶梦》等，并在其中以他的“凡人的经历”和“凡人的情感”，在中国戏曲史上，首先刻画了一批凡人出身和代表凡人思想感情的悲剧典型，在中国悲剧发展史上，这种“普通人”的悲剧命运，影响是深远的。\n\n三、以悲为主，以喜衬悲\n\n从情节建构的角度看，中国悲剧往往是“以悲为主，以喜衬悲”，关汉卿的悲剧风格正是如此。这主要是通过以下手法达成的：\n\n（一）以插科打诨加重悲剧情调。如《窦娥冤》第一折赛卢医的上场语，不仅逗人一笑，还点化悲剧缘由。观众从赛卢医的自我表白中，不仅认识其为非作歹的本质，而且加深对窦娥悲剧命运的社会根源的认识。\n\n（二）以喜庆氛围强化悲剧气氛。关汉卿《西蜀梦》把张飞关羽魂还西蜀，托梦刘备报仇之时，安排在重阳佳节刘备寿辰的大喜之日。作者以“喜”背景去写“悲”的现实，产生凄然幽泣的效果。\n\n（三）以团圆之趣深化悲剧效果。如《窦娥冤》写冤魂于阴间苦苦抗争，终遂大愿，产生深化悲剧效果的作用。\n\n四、多为大团圆结局\n\n从情节发展的最终走向看，中国古代悲剧大都出现“善有善报，恶有恶报”的“团圆之趣”，关汉卿的悲剧也不例外。由于关汉卿向往法正民安的社会环境，因此，其悲剧作品的末尾，往往出现执法严明的“清官”。如其著名悲剧《窦娥冤》的“团圆”之设堪称中国古典悲剧的典型，“团圆”结局对人物形象塑造和悲剧冲突的展开具有重要作用。关汉卿不损伤悲剧基调的前提下，使结局显出某种亮色，这是符合中华民族传统的审美习惯的。","keywords":"揭露人间罪恶 高扬正义旗帜 主角多是普通人 以悲为主 以喜衬悲 大团圆结局","note":"关汉卿以《窦娥冤》为代表的悲剧创作，推动了中国悲剧艺术的长足发展，后世中国悲剧之中的许多特征，如大团圆结局、以喜衬悲等，都可以在关汉卿的悲剧之中看到。可以说，关汉卿推动了中国悲剧范式的构建。相关内容可以参考周国雄《论关汉卿对中国悲剧艺术范式的构建》，具体资料可以在李凡文学正版群内领取。"},{"id":"315","stars":"★★★★★","title":"试分析关汉卿杂剧创作的主要特征","body":"关汉卿杂剧采取“民间本位”的立场，其鲜明的剧场性以及本色当行的戏剧语言，都在中国戏剧史上具有不容忽视的经典意义。\n\n一、“民间本位”立场\n\n关汉卿的杂剧创作充分体现出“民间本位”的立场，没有儒生的酸腐气息，更无粉饰时政的阿谀笔调，笔力千钧、直言不讳地写出民众的苦难与伤痛；酣畅淋漓、激情澎湃地抒发民众的愤怒与悲怨；机灵巧妙、风趣生动地表现民众的智慧与勇敢；笔墨辛辣、语含鄙夷地讥刺权豪势要、宵小无赖的愚妄与卑劣。一洗“温良恭俭让”不痛不痒的文士做派，确立了刚健的杂剧风格。\n\n杂剧文体的民间性风格终于得到民众的广泛认同，而开创并且代表这种民间性风格的正是关汉卿的杂剧，关汉卿酣畅淋漓的激情以及意态纵横的气度，正是民间戏剧不同于正统诗文创作的具体表现。\n\n二、鲜明的剧场性\n\n关汉卿是一位熟悉剧场、演员与观众的戏剧家，是梨园中的行家里手；他有“躬践排场，面傅粉墨，以为我家生活，偶倡优而不辞”的实际演出经验。因此，他的杂剧创作具有鲜明的剧场性，是名副其实的“场上之曲”。\n\n（一）注意尽快“入戏”\n\n关汉卿在创作剧本时，注意尽快“入戏”。他以洗练的笔触交代戏剧情境与人物关系，把观众的目光“聚焦”到主要的戏剧矛盾上，从而迅速引起观众看戏的兴趣。关汉卿很懂得戏剧的特性和观众的心理，他十分重视戏剧演出的舞台效果，不让观众分散对戏剧矛盾的注意力。他努力在有限的演出时间内，赋予戏剧以更为充实的内容，让强烈的戏剧冲突把观众牢牢地吸引在剧场上。\n\n（二）注意处理戏剧冲突的节奏\n\n关汉卿很注意处理戏剧冲突的节奏，注意场面的冷热调剂，张弛交替。如《蝴蝶梦》中，当公人押送王氏兄弟到了开封府，戏剧冲突进入炽热阶段时，关汉卿插入包拯做梦这一个颇有神异色彩的细节，使紧张的情节稍稍松弛。它展示了包拯心灵的一角，让观众饶有兴味地静观他在得到梦境的启示后，怎样处理上述棘手的案件。冷热场面的交替使剧情的推进显得跌宕多姿，产生深深吸引观众的情节张力。\n\n（三）善于设置悬念\n\n关汉卿的剧作，具有引人入胜的魅力。他解决悬念的方式，往往出人意料之外，又在情理之中。在望江亭上，谭记儿与杨衙内的较量，没有刀光剑影，而于眼去眉来、应对戏耍之间处处暗伏机彀，外松而内紧；观众在看场上热闹的同时，又为女主人公捏一把汗，犹如身历其境一般。\n\n三、本色当行的戏剧语言\n\n关汉卿的戏剧语言，向以本色当行著称，即王国维所称道的“曲尽人情，字字本色”。他所写的人物的唱词，在抒情中蕴含着鲜明的动作性，切合特定的戏剧情境。\n\n（一）对语言有着敏锐和精细的辨析能力\n\n关汉卿对语言有着敏锐和精细的辨析能力。他注意到，在不同的环境中，同一个人物的语气、措辞，会随情势心态的变化而变化。如在《谢天香》中，关汉卿让谢天香在不同语境中出现言语风格的差异，正好表现出她是个既精通多种文艺，又熟识三教九流，善于察言观色的官妓。对于不同的人物，关汉卿根据其身份教养、地位等，让其语言当俗则俗，宜雅则雅，完全体现不同人物的气质和个性。关汉卿剧作所表现出的纯熟的语言艺术，是杂剧作为代言体的叙事文学臻于成熟的重要标志。\n\n（二）博采现实生活中的种种语言素材\n\n关汉卿既立足于戏剧语言性格化，又博采现实生活中的种种语言素材，包括谚语、俚语、成语、口头禅等等，运用自如，点铁成金，融合于作品之中，形成一个自然真切、色彩斑斓的语言世界。这也是关汉卿对元代剧坛的一个突出贡献。","keywords":"民间本位 剧场性 尽快“入戏”注意处理戏剧冲突节奏 善于设置悬念 本色当行 敏锐和精细的辨析能力 博采种种语言素材","note":"关汉卿杂剧的创作特征是关汉卿相关内容中最核心的重点，在考查中出现的频率非常之高。对于这部分内容有多种设问的方式，具体考查的内容都不完全相同。如果考查的是关汉卿杂剧的艺术特征，则重点回答其剧场性和本色当行的语言。当然，关汉卿杂剧的剧场性和语言特色也可能会单独出题，大家要灵活应对。"},{"id":"316","stars":"★★★★","title":"试分析西厢故事艺术形式与思想内容的流变","body":"《西厢记》本事源于唐代元稹的传奇《莺莺传》，从《莺莺传》到《西厢记》，故事的形式不断地变化，其思想内容也随着社会的变动不断发展。\n\n一、唐传奇《莺莺传》\n\n西厢故事的源头，可以追溯到唐代元稹的《莺莺传》。《莺莺传》亦名《会真记》，作品中的张生和崔莺莺，是作者在自己生活经历的基础上塑造的两个文学形象。作品描写了他们的真挚爱情以及张生最终背弃崔莺莺的过程，虽有很多局限，但仍不失为一篇优秀的唐人小说。\n\n在思想内容上，《莺莺传》结尾张生终与莺莺决绝，并在与友朋谈及此事时斥莺莺为“必妖于人”的“尤物”，自诩为“善补过者”，实质上体现出的是封建士大夫的立场。\n\n二、宋词《商调蝶恋花》与宋代说话艺术\n\n词在宋代得到了空前的发展，北宋赵德麟制作了《商调蝶恋花》鼓子词12首，以歌咏崔张恋爱故事，“句句言情，篇篇见意”。另外，秦观和毛滂，又各有《调笑转踏》，歌咏八个故事，其中都有崔莺莺的故事。此外，南宋罗烨《醉翁谈录》记载的当时的“说话”已有《莺莺传》名目，其故事梗概与《莺莺传》大体一致。\n\n宋代词人们所咏所赋依然不超脱元稹的本传，秦观、毛滂与元稹同为士大夫文人，他们无法超越元稹的立场。对于他们而言，崔莺莺只是文学创作的一个素材，是文人的一个“尤物”，与功名仕途相比是微不足道的。而赵德麟的创作目的是“惜乎不被之以音律”，只是将《莺莺传》故事以鼓子词的形式进行表现，最终未改变其主旨。\n\n三、董解元《西厢记诸宫调》\n\n金章宗时产生了以诸宫调形式叙述崔、张恋爱故事的长篇作品-董解元的《西厢记诸宫调》，它虽然采用了《莺莺传》的故事题材，但在主题思想、情节安排、人物性格等方面都作了脱胎换骨的“改造”，使这一故事以新的艺术面貌表现了崭新的思想，成为西厢记故事世代传承的里程碑。\n\n《莺莺传》的矛盾冲突，主要在莺莺与张生之间，而《董西厢》的矛盾冲突，则是以张生、莺莺、红娘为一方，以老夫人、郑恒为另一方。同时，《董西厢》中的人物形象，无一不突破了《莺莺传》中的原型，而富有崭新的个性特征。通过这些方面的改造，《董西厢》热情地歌颂了爱情，颂扬青年男女对礼教的反抗。\n\n四、元杂剧《西厢记》\n\n王实甫的《西厢记》在继承《董西厢》的基础上，将故事改造成多角色扮演和演唱的戏剧，建立了一个立体化的舞台表演体系，五本二十一折连演，多角色同台演唱，打破了元杂剧传统的四折一楔子、一人主唱的结构模式，使《王西厢》在元代就是一部鸿篇巨制和演出特例。\n\n在西厢记故事演变史上，《王西厢》通过对《董西厢》的改写，把西厢记故事推到了巅峰。《王西厢》在情节上进行了完善，心理刻画更加细腻，人物形象也更加丰满，故事发展更富有逻辑性。最重要的是，王实甫充分肯定真挚的爱情，认为它纯洁无邪，不必涂上“合礼”“报恩”之类保护色。他认为爱情是婚姻的基础，只要男女间彼此“有情”，就应让他们同偕白首；而一切阻挠有情人成为眷属的行为、制度，都应受到鞭挞。\n\n五、南戏《南调西厢记》\n\n明朝建立，南方的文化北上，使原本盛行于南方的南戏也移居北方，成为戏剧舞台的新盟主。戏剧形式的变革促成了西厢记故事的又一次重生-《南调西厢记》诞生。《南西厢》在一定程度上删改了《北西厢》中不符合中原传统审美的内容，同时向儒家传统文化回归。","keywords":"唐传奇《莺莺传》宋词《商调蝶恋花》董解元《西厢记诸宫调》元杂剧《西厢记》南戏《南调西厢记》","note":""},{"id":"317","stars":"★★★★★","title":"试分析王实甫《西厢记》对董解元《西厢记诸宫调》的创新","body":"王实甫的《西厢记》，其本事源于唐代元稹的《莺莺传》，同时受到了其他《莺莺传》故事尤其是董解元《西厢记诸宫调》的影响，并在此作品的基础上做出了创新，成为元杂剧“压卷之作”，具体表现在以下方面：\n\n一、对故事题旨进行了改造，充分肯定真挚的爱情\n\n为了适合戏剧的演出，王实甫把董解元所改编的莺莺故事重新调整。其中最重要的，是对故事的题旨作了新的改造。\n\n董解元的《西厢记诸宫调》，把唐传奇《莺莺传》改写为青年男女为了争取婚姻自由大胆地和封建家长展开斗争的作品。董解元尽管歌颂年轻人对爱情的追求，但又竭力表明他们的越轨行为有其合理的一面。他所塑造的莺莺是深受封建思想束缚，而又羞羞答答追求爱情的大家闺秀。\n\n在王实甫笔下，张生、莺莺固然是才子佳人，但才与貌并非是他们结合的唯一纽带。王实甫强调，这一对青年一见钟情，“情一发难收”，受到封建家长的阻梗，他们便做出冲破礼教樊篱的举动。对真挚的爱情，王实甫给予充分的肯定，认为它纯洁无邪，不必涂上“合礼”“报恩”之类保护色。他认为爱情是婚姻的基础，只要男女间彼此“有情”，就应让他们同偕白首；而一切阻挠有情人成为眷属的行为、制度，则应受到鞭挞。\n\n王实甫对“情”的关注，比关汉卿、白朴更进一步。他希望所有恋人能够如愿以偿，等于不把“父母之命，媒妁之言”放在眼内，这是对封建礼教和封建婚姻制度的大胆挑战。\n\n二、强化人物互动，刻画人物性格多个侧面，在艺术上进行创新\n\n王实甫的《西厢记》在《董西厢》的基础上成功地将说唱转化为戏剧，既吸收了《董西厢》的创作经验，又在具体艺术上进行了创新：\n\n（一）重构戏剧情景，强化人物互动关系\n\n在《王西厢》之前，《董西厢》已经注意借鉴古代风情故事的构成方式，适度改变《莺莺传》原有的故事形态。如《莺莺传》在“孙飞虎事件”之前没有写到男女主人公的正式相遇，而《董西厢》在此事件发生前就增入张生在不经意间“瞥然一见”崔莺莺的情节；增入“佳人见生，羞惋而入”的场景。《董西厢》一系列故事元素的增补和变动，借鉴和吸收了在民间广为流传的“倚翠偷期话”，即古代风情故事。\n\n王实甫在配置新的故事元素的同时，重构戏剧情景，强化了人物的互动关系。以男女主人公的“初遇”为例，《王西厢》重新构拟出男女双方在毫无心理准备的情形下四目相遇时的微妙细节：一是张生的一句“我死也”失声而出，一是崔莺莺“回顾觑末下”的特殊举止，极为敏锐地捕捉到男方刹那间的心灵震颤，同时描摹出女方在陌生人面前虽有矜持之态却又忍不住好奇的少女心理，比《董西厢》的“羞惋而人”更能揭示人物内心活动的丰富性与层次感。更为重要的是，莺莺的这一回眸的细节颇具戏剧性地激发了张生内心对这一位妙龄少女的爱慕与期待，使得一次偶然的相遇富有戏剧性地变为整个故事的重要起点。\n\n（二）刻画人物性格的多个侧面，深化作品的意蕴\n\n《王西厢》既注意到舞台演出的节奏感和层次感，又照应了人物性格的多侧面展现，随着剧情的推进，人物刻画的立体感得以强化，作品的意蕴也随之得以深化。比如，“长亭送别”是重头戏，是全剧的情感高潮，《董西厢》与《王西厢》都着力经营这一场面，但后者对原有场景的戏剧化处理更为引人注目。\n\n《董西厢》是说唱文学，偏重于叙述；《王西厢》则有所不同，先写夫人与长老上场，营造凝重的气氛，再让张生、莺莺登场，为接下来男女主人公的情感交流营造出饱满的戏剧空间。再加上对此时季节、情景的渲染，营造出伤感的氛围。在\n\n浓重的伤感氛围里，着眼于揭示莺莺内心深处对爱情的眷恋与不舍，对日渐远去的张生的体贴与担心，以及对孤独生活的忧愁，对未来不可预测的日子的惶恐等多侧面的情感。","keywords":"故事题旨改造 肯定真挚爱情 重构戏剧情景 强化人物互动 人物性格多个侧面 深化作品意蕴","note":"《西厢记》相关内容中，比较重要的一部分是《莺莺传》故事的流传，从唐代元稹的《莺莺传》开始，到北宋赵德麟的《商调蝶恋花》，再到董解元的《西厢记诸宫调》，最后到元代王实甫的《西厢记》，形成了一条完整的脉络，并在明代出现了《南西厢》，同时影响到了《牡丹亭》《红楼梦》等作品。其中，董解元的《西厢记诸宫调》和王实甫的《西厢记》往往会联系在一起进行比较，大家可以从题旨和艺术手法展开比较，大家要特别注意。"},{"id":"318","stars":"★★★★★","title":"为什么《西厢记》被称为元杂剧的“压卷之作”","body":"《西厢记》不仅是元代文学的杰出代表，而且在思想和艺术上取得了极高的成就，深远地影响了后世，因此有的学者将其视为元杂剧的压卷之作。\n\n一、充分肯定真挚的爱情，大胆挑战封建礼教和封建婚姻制度\n\n为了适合戏剧的演出，王实甫把董解元所改编的莺莺故事重新调整。其中最重要的，是对故事的题旨作了新的改造。\n\n在王实甫笔下，张生、莺莺固然是才子佳人，但才与貌并非是他们结合的唯一纽带。王实甫强调，这一对青年一见钟情，“情一发难收”，受到封建家长的阻梗，他们便做出冲破礼教樊篱的举动。对真挚的爱情，王实甫给予充分的肯定，认为它纯洁无邪，不必涂上“合礼”“报恩”之类保护色。他认为爱情是婚姻的基础，只要男女间彼此“有情”，就应让他们同偕白首；而一切阻挠有情人成为眷属的行为、制度，则应受到鞭挞。\n\n王实甫对“情”的关注，比关汉卿、白朴更进一步。因为关、白的良好祝愿，还是针对已婚的夫妇而言，而王实甫所祝的“有情人”，则包括那些未经家长认可自行恋爱私订婚姻的青年。他希望所有恋人能够如愿以偿，等于不把“父母之命，媒妁之言”放在眼内，这是对封建礼教和封建婚姻制度的大胆挑战。\n\n二、体制创新，结构宏伟\n\n相对于当时的杂剧，《西厢记》堪称结构宏伟，元人杂剧一般以四折来表现一个完整的故事，而王实甫的《西厢记》则有五本二十折，竟像是由几个杂剧连接起来演出一个故事的连台本。有些折段，王实甫吸取和借鉴院本、南戏的演出形式，突破了元杂剧一人主唱的通例。\n\n体制上的创新，丰富了艺术表现能力，为更细腻地塑造人物性格，更完美地安排戏剧冲突，提供了有利的条件。比起它以前的元杂剧，至少有了以下四个方面的进展。\n\n（一）在人物思想感情的刻画方面比较细腻深入\n\n以往元杂剧限于篇幅，对剧中人物的思想感情的描写一般来说是粗线条的，即使是优秀作品，也只能对主要人物在某种情境下的思想感情作相对深入的开掘，而对其余的场合就只能作粗略的交代。而《西厢记》则因结构宏伟，得以充分展开。试以张生初见莺莺为例，整个第一本由他主唱，基本上都是刻画他见到莺莺后的疯魔情态，而这些饱含激情的唱词充分显示了他那又惊又喜的心理活动。《西厢记》正因打破了原先的体例，才能如此放笔挥洒。\n\n（二）写出了人物情感发展过程\n\n由于能较细致地刻画人物思想感情，也就能在一定程度上写出其发展过程。而以前的元杂剧因受体例限制，这也是无法做到的。\n\n以张生来说，他初见莺莺时只是惊喜于她的美貌，因而萌生了要获得她的强烈欲望。但等到偷看她晚间烧香，张生以诗相挑，莺莺和韵以后，他就进而为自己不能和她共处而深感凄凉了。后来他救了莺莺一家，而崔夫人反悔了以前所作的允婚的诺言，加上崔莺莺虽以诗约他相会，却又临时变卦，把他抢白了一顿，这使他更为痛苦。他也想过就此断情，但对莺莺的爱情已深入心底，再也无法摆脱，所以他忍辱苦挨，盼望莺莺有一日能回心转意。到最后，张生对莺莺的爱就已生死以之了。\n\n（三）在作品中出现了多个丰满的人物形象\n\n《西厢记》打破了以前的元杂剧一般只有一个丰满的人物形象（其余均是陪衬）的惯例。在其之前的杂剧都只一本，而且只能由末或旦主唱；所以，即使是男女爱情剧，也只能以一人为主，另一人只能是无足轻重的陪衬。《西厢记》则不但张生、莺莺都写得很丰满，红娘也有血有肉，连惠明都给人颇深的印象。\n\n（四）戏剧冲突的展开比较充分\n\n《西厢记》的故事情节并不复杂曲折，但因人物写得较为具体细致，丰满的人物形象又较多，人物的感情、活动及其相互之间的矛盾得以较充分地展开。\n\n全剧明显的戏剧冲突有两条线索：一是以莺莺、张生、红娘为一方同以崔夫人为一方之间的矛盾主线。另一条是莺莺与张生、红娘的矛盾线，它在剧中处于次要地位，但也起了重要作用。《西厢记》的戏剧情节，环绕着这两条相互缠绕的线索展开，涌现了多次矛盾激化的场面。它一环扣着一环，一波接着一波，有起有伏，有开有阖，扣人心弦，引人入胜。作者以高超的写作技巧，让观众得到了完美的艺术享受。然而，倘若不是全剧的规模宏大，这两条矛盾线的充分展开是不可能的。\n\n总之，以上四项重要成就的取得，都以打破元杂剧的原有体制为先决条件。\n\n三、语言华美，堪称戏曲语言的最高峰\n\n戏剧是语言的艺术。王实甫在《西厢记》中驾驭语言的技巧，历来为人们称道。如王骥德、徐复祚都把《西厢记》视为戏曲语言艺术的最高峰。\n\n（一）语言符合戏剧特点，具有丰富的动作性\n\n《西厢记》的语言符合戏剧特点，能和表演结合，具有丰富的动作性，像第三本第二折的一段曲文，莺莺起初着意打扮，后来看到简帖，便胡乱挽起头发，急忙按下妆盒，仔细品味来简，跟着疑虑踌躇发作。这一段唱词，动作性很强。王实甫让唱词规定了演员的形体动作，使人物动起来，适合于舞台表演和人物性格的刻画。\n\n（二）鲜明的个性化\n\n《西厢记》的语言具有非常鲜明的个性化特点。即使是唱词，作者也考虑到人物身份、地位、性格的不同，使之呈现不同的风格。同为男性角色，张生的语言显得文雅，郑恒则鄙俗，惠明则粗豪。同为女性角色，莺莺的语言显得婉媚，红娘的语言则显得鲜活泼辣。\n\n（三）善于吸取前代名作佳句，典雅清丽\n\n《西厢记》善于吸取前代名作佳句，再加点染而成妙曲，如“碧云天，黄花地”云云，显然来自宋人范仲淹的《苏幕遮》词；“花落水流红，闲愁万种，无语怨东风”的境界，则与“流水落花春去也，天上人间”“无可奈何花落去”息息相通。正是这样大胆的兼收并蓄，遂使《西厢记》的艺术语言更典雅清丽。","keywords":"肯定真挚爱情 挑战封建礼教 体制创新 结构宏伟 思想感情刻画细腻深入 情感发展过程 多个丰满人物形象戏剧冲突展开充分 语言华美 戏曲语言最高峰 丰富的动作性 鲜明的个性化 善于吸取前代名作佳句","note":"①这道题实质上问的是《西厢记》的创作成就，大家对此主要从题旨、体制和语言三个角度进行展开。在这三个方面，《西厢记》都完成了对之前元杂剧的超越。需要注意的是，在考查中，这三个方面的内容可能会分别单独考查，大家要注意灵活应对。②这道题目和上道题目有些类似，但是也有不同的地方，之所以放在一起，是想要大家体会一下这类灵活题目，我们要怎么样去及时调整思路，而不是死记硬背。"},{"id":"319","stars":"★★★","title":"试分析《西厢记》中红娘的作用","body":"《西厢记》中，就情节方面来说，红娘体现了人物之间的联系、矛盾、同情、反感和一般的相互关系，就结构方面讲，红娘对于凝聚全剧的动作，对于结构的系统性，起着磁石的作用，她作为“戏胆”是当之无愧的。\n\n一、纠合主要矛盾冲突，推进情节发展\n\n《西厢记》的矛盾冲突，以莺莺、张生和红娘等为一方，以老夫人等为另一方。红娘一直处于两种势力对立冲突的核心，在纠合主要矛盾冲突，推进情节发展方面发挥了重要作用。\n\n红娘与三个主要人物组成了三组性质不同的矛盾。先是红娘与张生，这组矛盾昭示了故事起因，铺开了情节端绪。红娘与莺莺，主婢之间组成了第二组矛盾。老夫人和红娘间的矛盾则是带有根本性的，随着红娘由忠顺到叛逆，这组矛盾从无到有，逐渐激化，“拷红”是这个矛盾冲突的总爆发。这三组矛盾使得张、莺二人同老夫人的斗争通过红娘得到了最尖锐的表现。\n\n二、造成剧情起伏跌宕，加强主要场面感染力\n\n红娘在造成剧情起伏跌宕，加强主要场面感染力这一点上也发挥了显而易见的作用。全剧由“惊艳”开始，经“酬韵”“闹斋”“请宴”中的红娘逐步染浓喜剧色彩，为老夫人“赖婚”这一“陡转”蓄势。“琴心”“闹简”“前候”情节层层递进，又是红娘造成莺莺“赖简”，剧情波澜横生。“酬简”中的红娘自不必说，到了“拷红”中与老夫人对阵的高潮和戏尾的面斥郑恒，纠结全剧的主要线索，情节的大开大阖、大起大落，到处都有红娘的影子。\n\n三、对比烘托\n\n红娘以下层女子特有的泼辣爽朗，烘托了莺莺作为大家闺秀而非小家碧玉的特殊气质。如“闹简”一折，红娘将简帖拿给莺莺看，但莺莺的身份地位怎么能允许她随便地做出越礼背俗之事？于是佯怒，说要告诉老夫人。老练的红娘可镇定自若，\n\n说把简帖拿给老夫人看。这以攻为守的一招颇有效，小姐只得告饶：“我逗你耍来。”尊卑有別、性格各异的主婢和二人关系，惟妙惟肖，跃然纸上，声态并俱，情趣盎然。\n\n四、结撰《西厢记》主要故事情节\n\n纵观全剧关目，红娘“布关串目”的关键性作用的确不容忽视。红娘结撰了《西厢记》的主要故事情节，是一条贯穿全剧始终的明线。这个人物最少受到各方面条件的限制，她的活动能力最强，能最大限度地同其他人物打交道。\n\n红娘单独和张生同场的折子有，单独和莺莺同场的也有，这绝非偶合。红娘既胶合着张、莺二人，在张、莺活动的前前后后每一个关键场次起作用，又较直接地联系着老夫人。有老夫人的场次，没有张生、莺莺都可以，也独少不了红娘。红娘还在郑桓这条开场时预伏的暗线在剧末的起爆中起了几乎是独当一面的作用。全剧的“密针线”，密就密在红娘这个次要人物的神通广大。","keywords":"纠合主要矛盾冲突 推进情节发展 加强感染力 烘托莺莺特殊气质 结撰主要故事情节","note":"《西厢记》中的红娘虽然是个次要人物，但在剧情和结构上都起着至关重要的作用，可以说，《西厢记》之所以取得如此高的成就，红娘这一形象功不可没。也正因此，后世许多作者在改编《西厢记》时，干脆以红娘为主角，如京剧《红娘》。"},{"id":"320","stars":"★★★★","title":"《梧桐雨》有何艺术特色","body":"历代以来，表现李、杨爱情的作品层出不穷，《梧桐雨》则在这一故事流变中起着承上启下的作用，其后的《惊鸿记》《长生殿》等作品均深受其影响。总体来看，《梧桐雨》的艺术成就主要表现在以下方面：\n\n一、对比手法的成功运用\n\n《梧桐雨》成功地运用了对比的手法，写出剧中主人公在安史之乱前后的不同处境和心境，形成强烈的反差，揭示了作品的主题。\n\n就全剧基调而论，这是一部悲剧性的抒情诗剧。它的故事情节和抒情线索都是围绕李杨爱情和安史之乱而展开，但其最大的特点，则是强烈的盛衰对比。在安史之乱前，唐明皇沉溺于享乐之中，此剧的第一折和第二折的前半，极写其爱情的美满和生活的欢乐，“自从得了杨贵妃，真所谓朝朝寒食，夜夜元宵。”安史之乱后，唐明皇独处西宫，凄凉的处境，正与往日的欢娱形成对比，往日的欢乐情景，此时只能重现梦中，而阵阵秋雨又惊醒了他的美梦。这雨声紧一阵慢一阵，淅淅沥沥，“一点点滴人心碎”，淋漓尽致地烘托出李隆基凄楚悲凉的心境。\n\n二、情景交融，突出人物性格、处境和心理\n\n《梧桐雨》写景写情融为一体，以情景交汇的艺术效果表现人物的性格、处境特别是心理状态。如在第四折中唐明皇周围的景物是“秋虫”“西风”“落叶”“秋雨”和“梧桐”，而梧桐又正是当年他与贵妃“并肩斜靠”之处，如今在秋雨之中更显出人亡物在的凄楚。这一切都与此时唐明皇的处境与心境融汇在一起。全剧以一曲〔黄钟煞〕结尾，写尽了“雨和人紧厮熬”“雨更多泪不少”的情和景。\n\n三、意境深沉含蓄，具有浓重的抒情性和醇厚的诗意\n\n在《梧桐雨》里，白朴把梧桐与杨、李的悲欢离合联系起来。在我国的诗文中，梧桐的形象，本身即包含着伤悼、孤独、寂寞的意蕴。白朴让梧桐作为世事变幻的见证，让雨湿寒梢、敲愁助恨的景象，搅动了沉淀在人们意识中的凄怨感受，从而使剧本获得了独特的艺术效果。加上作者以十多支曲子，细致地描绘李隆基哀伤的心境；沉痛伤悲的语言，也使人荡气回肠，更能透过人物的遭遇感受到江山满眼、人事已非的怆痛。\n\n可以说，《梧桐雨》的戏剧冲突生动跌宕，笔墨酣畅优美，而构筑的意境则深沉含蓄。浓重的抒情性以及醇厚的诗味，使这部历史剧成为元代文坛的一树奇花。\n\n【李凡关键词：对比手法 情景交融 意境深沉含蓄 浓重的抒情性 醇厚的诗意】","keywords":"","note":"①在李、杨故事发展之中，《梧桐雨》起着承上启下的重要作用，而其艺术成就也不容忽视。需要注意的是，《梧桐雨》深沉意境的塑造，很大程度上受到了白朴生平经历的影响。白朴生逢金元交替之时，与母亲在战乱纷争中走失，可以说是饱经离乱之苦。他正是从自身经历出发，依据自己对唐明皇和杨贵妃的爱情悲剧的独到理解，创作出杂剧《唐明皇秋夜梧桐雨》。②文学史上，以李、杨爱情为主题的文学作品很多，关于此题的脉络梳理，我们会在今年的提升版中，为大家呈现。"},{"id":"321","stars":"★★★","title":"试分析《墙头马上》的艺术成就","body":"白朴的杂剧《墙头马上》，是元代的四大爱情喜剧之一，是我国古典戏曲的优秀作品：它在思想上和艺术上，都以其出色的成就，在我国戏剧发展史上占有重要地位。这部作品的艺术成就，主要表现在以下方面：\n\n一、成功塑造了李干金这一典型叛逆女性形象\n\n《墙头马上》的主要成就是成功地塑造了一组鲜明而典型的人物形象，而尤为突出的是女主角李千金。这是一个光彩照人的反对封建礼教的叛逆形象：她对爱情主动、大胆、果断；对扼杀她们自主婚姻、幸福家庭的封建势力，无比痛恨，坚决斗争，倔强不屈。这样光辉，讨人喜爱的叛逆形象，与同时代爱情剧中出身于大家闺秀的崔莺莺、王瑞兰、张倩女等形象相比，似具有更强烈的反抗精神，在我国古典的爱情戏曲中是不多见的。\n\n二、冲突尖锐，结构严密，波澜起伏\n\n精心构思戏剧冲突，刻画人物性格，这本是优秀剧本的共同要求，而《墙头马上》以裴李爱情为线索，以李千金为中心，巧妙地安排了花园定情、月夜私奔、父逼休妻、寻亲团圆四折戏，冲突尖锐、结构严密、波澜起伏、折折有戏，取得了很好的成就。在这短短的四折戏中，作者都把李千金放在激烈的冲突旋涡之中，以浓墨重笔描写她和李嬷嬷和裴氏父子的斗争，所以才给我们塑造了这样一个令人喜爱的叛逆形象。\n\n三、善于细节描写和心理描写\n\n《墙头马上》善于细节描写和心理描写。比如，当千金被逐时，作者安排了少俊悄悄送千金回家的细节。这说明少俊对干金还是有感情的，他所以写休书，并不是恩义绝，而是迫于无奈。这表明他还不是始乱终弃的负心汉，这为后来夫妻团聚的喜剧结局埋下伏线。\n\n剧中有些心理描写也是很成功的，对于丰富人物性格，增强艺术魅力都起着良好的作用。比如，当千金夜晚将要依约幽会的时候，既期盼天黑月出，但又不希望月亮“明如镜”，这就把一个大家闺秀的少女的既喜悦又恐惧的细腻心理描绘了出来。\n\n四、语言自然、优美、富于个性\n\n《墙头马上》的语言自然朴素，优美清新，少有雕琢，本色是其基本的风格。它的曲文是优美动人的，但又通俗易懂，无论是写景、叙事，还是抒发感情，都能从剧情和人物的性格出发。同时，《墙头马上》的宾白也写得通俗易懂、生动活泼，往往是三言两语，人物形象便神态活现。剧中许多人物形象的塑造，像裴少俊、裴行俭、老院公、梅香及两个儿童，都是借助于宾白的。特别是老院公的形象，剧中用了不多的几段对话、独白，就把一个善良、纯朴、忠厚、风趣的形象塑造得栩栩如生，跃然纸上，闻其声如见其人。","keywords":"典型叛逆女性 冲突尖锐 结构严密 波澜起伏 细节描写 心理描写 语言自然、优美、富于个性","note":"从追求婚姻自主，追求个性解放的角度来看，《墙头马上》与《西厢记》的思想倾向答题是一致的。在艺术上，《墙头马上》成就也颇为不俗，像是明代戏曲家孟称舜就在自己的《柳枝集》中称赞道：“《墙头马上》说佳人求偶处，亦自奕奕神动，真大家手笔也。”"},{"id":"322","stars":"★★★","title":"试分析马致远《汉宫秋》的创作成就","body":"《汉宫秋》是马致远的代表作。此剧以昭君出塞故事为题材，但有新的诠释，后世亦有不少以“昭君出塞”故事为题材的作品，如明代的《和戎记》《昭君出塞》，清代的《吊琵琶》《青塚记》等，都在不同程度上受到《汉宫秋》的影响。这部作品的创作成就，主要表现在以下方面：\n\n一、借“昭君出塞”寄托深沉而复杂的历史追忆与时代体验\n\n马致远的《汉宫秋》是一个颇有特色的历史剧。它依托于历史故事，又不囿于历史事件，借家喻户晓的“昭君出塞”寄托了深沉而复杂的历史追忆与时代体验。\n\n当时的历史形势是汉强胡弱，《汉宫秋》却改变了胡汉之间的力量对比，把汉朝写成软弱无力、任由异族欺压的政权。作者虽然写到君臣、民族之间的矛盾，但着重抒写的却是家国衰败之痛。环绕着汉元帝、王昭君的形象，马致远向人们揭示的主要是对历史、对人生的体悟，是在乱世中失去美好生活而生发的那种困惑、悲凉的人生感受，是乱世中的个体无法主宰命运只能任由播弄的哀痛。就此而言，《汉官秋》与白朴的《梧桐雨》有异曲同工之妙。\n\n二、成功塑造了王昭君与汉元帝这两个典型形象\n\n在《汉宫秋》里，王昭君的形象虽然着墨不多，但依然写得哀婉动人。她与汉元帝一样，受到命运的拨弄。她容貌美丽，多才多艺。更重要的是她志趣高尚，大义凛然，以一个不幸的妃子身份，承担了社稷安危的重任，使那些君王臣子，黯然失色。她是乱臣贼子横行天下时代的牺牲品。\n\n剧中的汉元帝，一方面是一个典型的无能天子，另一方面又是一个承受了巨大的内心痛苦，蒙受屈辱的可悲的帝王。作为一个精神世界较为“丰富”，心理活动较为复杂的舞台形象，也是很成功的。\n\n三、语言抒情艺术成就突出\n\n《汉宫秋》在语言艺术方面有独特的成就，语言抒情艺术尤为突出。第三折中汉元帝送别昭君后的几首曲子，特别是〔梅花酒〕，幽深的宫苑，与汉元帝落寞的心情互相映衬，一连串“顶针续麻”的句式抒写出一个空有尊贵名分却又无法支配自己命运的人内心的悲凉与哀伤，不仅写出了生离死别的痛苦，而且表现了内心的焦躁、自责和怨愤。第四折汉元帝听到雁叫时的唱词，如〔十二月〕、〔尧民歌〕、〔随煞〕等，也抒发了他思念昭君的深沉的痛苦，都有很强的艺术感染力。","keywords":"历史追忆 时代体验 王昭君 汉元帝 典型形象 语言抒情艺术","note":"马致远的《汉宫秋》表面上写汉，实际上是在叙说他所处的时代。作者在敷衍故事的时候，对“昭君出塞”进行大胆的改造，使其承载自己面对现实的寂寞、迷惘，以及对现实的批判，这和《梧桐雨》有相似之处，大家可以将二者结合起来记忆。"},{"id":"323","stars":"★★","title":"为什么说马致远的神仙道化剧是一种以宗教为题材的社会剧","body":"马致远的神仙道化剧是当时特定社会现实、社会矛盾的产物，不同程度地反映了当时的社会现实，具有较大的现实内容。这主要表现在以下方面：\n\n一、马致远的神仙道化剧中的神仙大多具有失意文人怀才不遇，不满现实的思想感情\n\n马致远的神仙道化剧中的神仙大多具有失意文人怀才不遇，不满现实的思想感情。他们或者对摧残知识分子的黑暗现实作沉痛的控诉如《岳阳楼》中的吕洞宾、《陈抟高卧》中的陈抟；或者通过梦幻手法展示身在官场的知识分子的人生悲剧，抨击官场中的争名夺利、险恶无常。可见，马致远是一个从失意文人的角度观察社会、反映现实的。马致远的“善为遁世之词”是“因失望于功名而起”，所以马致远写神仙度世、山林隐逸的剧本，像《吕洞宾三醉岳阳楼》《太华山陈抟高卧》《马丹阳三度任风子》等等，似乎都是不得志的聊且以孤高为快意的写法。\n\n二、马致远神仙道化剧中的神仙有着强烈的遗民气质\n\n马致远笔下的神仙大多不愿与统治者合作，有着十分强烈的遗民气质。如《岳阳楼》中的吕洞宾对天下兴亡那种发兴无端、滔滔而来的感慨，《陈抟高卧》中陈抟的“山中犹避秦”，都是作者在黑暗社会里，对异族残酷统治愤怒难平的感喟与寄托。\n\n三、马致远神仙道化剧中的神仙仍留意尘世，关心民生疾苦\n\n马致远的神仙道化剧尽管不可避免地宣扬了一些宗教思想，但他笔下的神仙并不是一些不食人间烟火的宗教徒，他们仍留意尘世，关心民生疾苦，如《陈抟高卧》中的陈抟。马致远笔下的仙境实际上是远离乱世界的高山深林，其中的神仙不过是一些隐逸文人，他们或者在离乱之世，怀才不遇，洁身自好，不愿与统治者合作；或者身历宦海沉浮，目睹官场倾轧，意欲苟全性命。自然，在这些形象的塑造上倾注了马致远对理想世界的向往，对理想人格的倾慕。\n\n总之，马致远的神仙道化剧深刻曲折地反映了元前期动荡、黑暗的社会现实，抒发了元初文人对异族统治，对造成他们怀才不遇的社会现实的一腔怨愤，从而揭示了元前期文人依附全真教的社会原因及其不满现实的精神状态。因此，从这个意义上讲，马致远的神仙道化剧是一种以宗教为题材的社会剧。","keywords":"怀才不遇 不满现实 强烈的遗民气质 留意尘世 关心民生疾苦","note":"马致远的神仙道化剧虽然也宣扬了全真教的道家思想，但由于受到了马致远个人怀才不遇经历的影响，这些神仙化剧同样拥有较深刻的现实内容。这样来看，马致远的神仙道化剧其实与他的《汉宫秋》一样，都是时代的产物，都承载着丰厚的时代内涵。"},{"id":"324","stars":"★★","title":"试分析《赵氏孤儿》的创作特征","body":"《赵氏孤儿》在元明清三代影响颇大，同时是第一部被介绍到欧洲去的中国戏曲。这部作品，主要具备如下创作特征：\n\n一、歌颂牺牲精神，构成悲壮的基调\n\n《赵氏孤儿》之所以能成为大悲剧，不仅在于它敷演了一个冤冤相报的悲剧性的历史故事，还在于通过这个悲剧性的历史故事歌颂了英雄人物为正义而前仆后继的牺牲精神，构成全剧悲壮的基调。《赵氏孤儿》选取的题材是传统的复仇主题，剧中贯穿着强烈的复仇思想。\n\n这个复仇思想是由赵朔-公主一韩厥-公孙杵臼一程婴一赵武传下来的，复仇思想的每一次传递都伴随着牺牲，也增添了一份嘱托和希望，更增加了复仇的内容。这个充满强烈复仇思想的历史故事的焦点即是存赵与灭赵、救孤与灭孤。围绕着这一焦点，纪君祥抒发了对善、忠、正义的歌颂，也表达了对恶、奸、非正义的谴责。\n\n二、在矛盾冲突中塑造角色\n\n《赵氏孤儿》的人物形象塑造也颇具特色。剧中的一批正面人物形象，作者赋予他们不畏强权，见义勇为，视死如归的崇高品格。但他们性格的完成，并不是标签式的抽象道德观念的外化，而是在剧情的展示和尖锐的矛盾冲突中加以凸显的，因而显得真实感人。例如程婴，由单纯的报恩到之后拯救全城的孩子，他的思想境界有一个明显升华的过程。而之后在亲手拷打共谋者、杀死自己孩子这些严峻的考验面前，他强忍悲痛，始终不露破绽。正是在这种尖锐激烈的矛盾冲突中，程婴忍辱负重、沉着坚毅、视死如归的思想性格特点得到了充分的表现。\n\n三、结构严谨完整，情节曲折紧凑\n\n从整体看来，纪君祥展示给我们的是典型的悲剧结构，即由逆境转入顺境，最后以顺境作结。杂剧在有限的篇幅里描绘了两代人、长达20年的斗争历程，表现了广阔的社会生活，也成功地塑造了鲜明的人物形象。纪君祥是驾驭戏剧结构的巨手，他从纵和横两方面精心安排结构，使《赵氏孤儿》成为一部出色的悲剧。\n\n围绕“赵氏孤儿”“复仇”这样一个突出清晰的纵的脉络，纪君祥从横的方面根据剧情的需要，巧妙地安排情节，使得可以在有限的篇幅内，集中刻画人物、充分地描绘斗争的横断面，使剧本在表现深度和广度上都达到了相当的高度。","keywords":"牺牲精神 悲壮基调 矛盾冲突中塑造角色 结构严谨完整 情节曲折紧凑","note":"纪君祥的杂剧《赵氏孤儿》是元代四大悲剧之一，被认为是“列之于世界大悲剧中，亦无愧色”的杰作。《赵氏孤儿》曾经被伏尔泰改编为《中国孤儿》，在欧洲产生了很大影响，因而很可能在考查中出现，大家要注意。相关内容可以参考黄卉《论悲剧历史剧＜赵氏孤儿》》，具体资料可以在李凡文学正版群内领取。"},{"id":"325","stars":"★★","title":"试分析《倩女离魂》的创作成就","body":"《倩女离魂》是郑光祖的代表作。本事出于唐代陈玄祐的传奇小说《离魂记》，是一个富有浪漫色彩的爱情故事，取得了突出的艺术成就，并在某种程度上给予《牡丹亭》启发。这部作品的成就，主要表现在以下方面：\n\n一、反映了女子在礼教抑制下精神的痛苦\n\n郑光祖以优美的文笔从两个方面叙写了女子在礼教抑制下精神的痛苦。一方面，倩女的魂魄，代表了女性对爱情婚姻的渴望与追求。另一方面，现实中倩女的躯体，则只能承受离愁别恨的熬煎，显然，既渴求爱情婚姻，又面对礼教禁锢，这便是封建时代女性的真实处境。她们唯有在非正常的情况下，才能挣脱束缚，实现自己的理想。而一旦“灵魂出窍”精神获得自由，她们便表现得热情似火，敢作敢为。在这里，离开躯体的倩女之魂，寄寓着挣脱礼教枷锁的女性的心态；至于倩女在家中的病躯，那种幽怨悱恻，凄凄楚楚，正体现出礼教禁锢下广大女性的百般无奈。\n\n二、成功塑造了大胆追求爱情幸福、自主婚姻的少女形象\n\n作品通过《倩女离魂》这个富有浪漫色彩的爱情故事，成功地塑造了大胆追求爱情幸福、自主婚姻的少女形象。倩女之魂，大胆地追赶上王文举，她“觑这万水千山，都只在一时半霎”。当王文举看到她而惟恐“有玷风化”时，她坚定地表示“常言道做着不怕”，表现了一种敢作敢当的气度。\n\n倩女之魂追赶王文举的原因，一是她的热烈的爱情使她难忍别离之苦，二是她作为一个封建社会的女子，担心王文举会另觅新欢。“始乱终弃”的阴影，笼罩着整个封建时代妇女的心灵，倩女不允许重演那古老的悲剧，因此，魂追王文举正是勇敢的自卫，即保卫自己应得到的幸福。她终于是胜利者。\n\n三、词藻俊美，刻画人物细致入微\n\n《倩女离魂》中的不少曲词，写得哀婉动人，色泽艳丽。如第三折的〔迎客仙〕，把男女离别之情，表现得淋漓尽致，难怪戏曲研究家王国维赞叹不绝，说此种词像“弹丸脱手，后人无能为役”。至于惟妙惟肖地描摹了人物内心感情的曲子，更俯拾即是。如第二折中的〔小桃红〕，将倩女神情急切又带忐忑不安的微妙心绪被和盘托出。\n\n【李凡关键词：礼教抑制下的精神痛苦 追求爱情幸福 自主婚姻 少女形象 词藻俊美 刻画人物细致入微】","keywords":"","note":"郑光祖《倩女离魂》与《西厢记》《墙头马上》并称为三大爱情杂剧，这三者的思想倾向大体是一致的，总体表现出了对婚姻爱情自由的追求。不过相较而言，《倩女离魂》很少单独出题，这部内容大家还是以了解为主。这一时期比较重要的杂剧还有秦简夫的《东堂老》，具体题目可以在李凡文学正版群内查看。"},{"id":"326","stars":"★★★","title":"试分析南戏兴起的原因","body":"元代不仅是杂剧的鼎盛时期，也是南戏的繁荣时期。而南戏这一文学体裁之所以兴起，主要还是得益于以下因素：\n\n一、宋代城市繁荣，经济发展，市民阶层兴起\n\n宋代城市繁荣，经济发展，市民阶层兴起，勾栏瓦舍遍布，为众多民间技艺的发展提供了有利条件。宋室自南渡之后，定都临安，宗室勋戚、文武百官纷纷南迁。温州是南宋除杭州以外最繁华富庶的商业都市，城市消费人口与日俱增，进一步推动了温州商业经济的发展。同时，诸色艺人也纷至沓来，各种民间技艺云集于此，相互影响，也相互促进。一种新的艺术样式-南曲戏文，就在这样的土壤中孕育、萌发。\n\n二、叙事性说唱文学高度成熟\n\n南戏是在宋杂剧角色体系完备之后，在叙事性说唱文学高度成熟的基础上出现的。它是民间艺人“以宋人词而益以里巷歌谣”，构成曲牌连缀体制，用代言体的形式搬演长篇故事，从而创造出的一种新兴艺术样式。就形式而言，它综合了宋代众多的技艺，如宋杂剧、影戏、傀儡戏、歌舞大曲，以及唱赚、缠令等在表演上的优点，与诸宫调的关系则更为密切。所有宋代存在的民间伎艺都是南戏综合吸收的对象，说唱文学则是其叙事方式的主要来源。由于它是在其他伎艺成熟发展的基础上出现的，又能兼采众长，所以能后来居上；另外，由于其他伎艺在表演上有许多地方可以与南戏沟通，使得伎艺演员也能熟练地掌握新兴的南戏，当南戏受到观众的欢迎时，他们便改弦易辙成为南戏演员。而演出队伍迅速扩大，也促进了南戏在东南各地的繁衍。\n\n三、南戏自身艺术水平提高\n\n元灭南宋之后，杂剧南下，由于南北两个剧种的汇聚，促进了相互的交流。杂剧作家如萧德祥等开始关注和涉足南戏的创作，沈和甫则创造了“南北合套”的方式，使北曲的刚劲与南曲的柔媚能兼容并济，丰富了音乐的表现力。贯云石、杨梓等人则参与了南戏唱腔的改进工作。另外，南戏形式上比较灵活自由，不像北曲受一人主唱和一本只能四折的限制，因而易于改编移植杂剧作品，借鉴杂剧的文学手法。随着南戏在艺术上得到提高，分唱形式的优越性逐渐显露，人们的兴趣也从杂剧转移到南戏。","keywords":"城市繁荣 市民阶层兴起 叙事性说唱文学高度成熟 兼采众长 灵活自由","note":"南戏在宋代开始萌芽，而在元代走向了繁荣，它的诞生是在杂剧之后，但却后来居上，在明代成功占据了统治地位（明代南戏被称为明传奇）。而它之所以能做到后来居上，主要就是因为其吸收了杂剧等剧种的优点，兼采众长。而南戏之所以能做到兼采众长，与社会现实变动的影响是分不开的。大家可以分别从这两个方面去展开分析。"},{"id":"327","stars":"★★★","title":"试分析《琵琶记》的思想成就与局
