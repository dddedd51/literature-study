物活动时空的有限性将作品割成片断，却开放了写作的空间，所有这些细小时空片断的叠加，使这部五十五回的小说容纳了惊人的人物量和时空量。\n\n二、史料性（掌故性）\n\n吴敬梓在撰写《儒林外史》时，往往杂取时人古事，大多信手拈来，了无痕迹。如第七回《范学道视学报师恩，王员外立朝敦友谊》中写王惠、荀玫同中进士并授工部主事，后又一起转了员外，两人力求高官，扶乩卜卦，坐立不安的片断就是化用了唐代张文成《朝野金载》卷二中的故事，两者目的手段极为相似，就连结局也一模一样。\n\n《儒林外史》的史料性，还体现在其关注“里巷闲谈，词章细故”的方面，从掌故意味流露出历史性的品格。如娄公子坐船游嘉兴，对其所行路过众多景物变化的描写；鲁翰林招蘧公孙为婿，对其送亲、迎亲到庆宴的描写，无不着力表现地域特色、地域民俗。\n\n另外，《儒林外史》还将历史作为情节组成部分注入小说中，如第四十九回秦中书宴请万中书、施御史，高翰林点了四出戏助兴，用《西厢》中张生赴宴景象，比喻四人的聚欢散悲。这些内容的摄入，实际上是《儒林外史》保留着笔记小说对史料关注的热情体现，说明了其继承了笔记小说重视史料、掌故的精髓。\n\n三、意象性\n\n《儒林外史》的意象性写作首先表现在场面与细节的形象生动的描写上。意象性写作缺乏广阔的活动时空，没有完整故事和情节，人物性格主要依靠场面和细节进行刻画，以达到写意性的审美追求。如通过范进中举前后的细节描写道出穷儒范进的悲喜形象。可以说“以其形写神”是《儒林外史》基本特征，其审美理想是追求以貌取神，以达到“不写之写”的目的。\n\n《儒林外史》没有贯穿全书始终的主要行动角色，小说的每一回集中于一个或数个主要人物并牵引出一些次要人物，各个自成单元故事的主要角色在完成自己的故事之后，把“接力棒”传给下一个故事的主要角色，如周进传给范进，范进传给张静斋，张静斋传给严贡生、严监生，严贡生再传给周进、范进，范进再传给荀玫、王惠......这样一路下去，各个自成单元的故事虽然颇类似短篇小说，但它们却齐心协力地承载着主题。在《儒林外史》每一回的结尾时，人物隐退至叙述的外缘或全然从场景中消失，因此读者只有在读完全书后才能透视这一大幅儒林全图，总观其全局。","keywords":"编年和纪传相结合 片断性 史料性 意象性","note":"《儒林外史》把若干个完全可以独立的单元连接在一起，从整体上来看，它是一部完整的长篇，分开来看，又是若干个独立完整的短篇，正如鲁迅所说：“虽云长篇，颇同短制。”这种结构形式，使作品兼具短篇与长篇的特点。每一个独立单元里，人物不多，故事发展也明快、简洁，充分显示着短篇小说的优越性；而连接起来，作为一部长篇，又以众多的人物形象，广泛反映了社会面貌，发挥了长篇小说的艺术功能。从中国古代小说艺术发展上来说，《儒林外史》的结构，既继承了话本、传奇的传统，又反映了文人独立完整的构思，是长篇小说结构的一大创新，需要大家重点掌握。"},{"id":"431","stars":"★★★★","title":"试分析《儒林外史》的叙事艺术（26浙江大学）","body":"《儒林外史》把知识分子的厄运放在长达百年的历史背景中展开描写，以心理的流动串联人物生活经历，隐晦地对社会的现象进行揭露。分析《儒林外史》的叙事艺术，可围绕叙事结构、叙事时空、叙事情境来展开。\n\n一、叙事结构\n\n（一）表层结构\n\n《儒林外史》是由一个个人物故事串联而成的，并没有贯穿于全篇的人和事件，没有起因、经过、结果所构建的整体的情节脉络。基于这一特点，这部小说的表层结构具有明显的碎片性，这也是《儒林外史》独特的叙事特征。从表层的联系看，《儒林外史》分章节，整体的框架比较清晰，可以将整体划分为不同的故事单元。大故事中隐藏着小故事，故事之间具有环环相扣的紧密关系。\n\n（二）深层结构\n\n深层结构在表层结构的基础上，追加了本质的价值意义，看上去零碎的故事和观点实际上蕴含了丰富的人物关系，具有内在联系。深入分析《儒林外史》的结构可以发现，故事都是以时态发展为重点。《儒林外史》讲述了一个时代的背景，对各阶层的人物进行了描绘，对人物的亲缘关系也进行了分析，这些形成了一个网络体系。此外，《儒林外史》中含有大量的伏笔叙事技巧，在前文的叙述中会设置伏笔，并与后文的内容建立联系，形成前后贯通的状态。\n\n二、叙事时空\n\n（一）叙事时间\n\n在《儒林外史》的命名中，就含有“史”这一文字，这也看出历史叙事对它的影响，“史”这一字也意味着它具有连贯性和历时性。在时间上看，文本具有严格的时间观念，它采用古代史书的编年体进行纪事，多处显示了编年的标志。表达时间的表述能作为串联人物情节的线索，突出交代时间的变化，形成一条线索。将各个单元的线索进行联系后，就能起到前后关联的作用。\n\n（二）叙事空间\n\n《儒林外史》中的空间转换往往伴随人物的行踪被作者自由地进行调度，进一步呈现叙事发展的方向。小说中人物始终在一个地域的情况比较少，几乎每个人物都有或远或近的外出，随着故事单元的不断变化，社会的整体景象也逐渐呈现出来。\n\n《儒林外史》的空间结构大体由北京和南京这两个空间组成，虽然北京作为空间背景整体出现相对较少，但作为南京对立面还是有着重要的意义-二者构成了对立关系。由此看来，《儒林外史》构建了多元化的叙事空间，将一个个空间联系起来，进一步突出了整体的空间结构效果。\n\n三、叙事情境\n\n（一）叙事角度\n\n在《儒林外史》文本中，叙述者主要站在宏观的角度进行叙事，对事件的来龙去脉进行分析，对事件的前因后果展开探讨。比如说，在第三十六回对虞育德的描述中，作者用叙述者的视角叙述虞育德本人，并对他的出身、家世、生平等方面展开介绍，塑造了一位圣贤之徒。这里主要运用的就是宏观的叙述视角。\n\n此外，作者已经能够把叙事角度从叙述者转换为小说中的人物，通过不同人物的不同视角和心理感受，写出他们对客观世界的看法，大大丰富了小说的叙事角度。如西湖边假名士的聚会，主要通过匡超人这个“外来者”的新鲜感受，“看到”这些斗方名士的名利之心和冒充风雅的丑态。\n\n（二）叙事人称\n\n《儒林外史》改变了传统小说中说书人的评述模式，采取了第三人称隐身人的客观观察的叙事方式，让读者直接与生活见面，大大缩短了小说形象与读者之间的距离。作者尽量不对人物作评论，而是给读者提供了一个观察的角度，让人物形象自己呈现在读者面前。例如在薛家集观音庵，让读者亲见亲闻申祥甫、夏总甲的颐指气使，较少对人物作内心剖白，只是客观地提供人物的言谈举止，让读者自己去想象和体味。\n\n（三）叙事技巧\n\n（1）摆脱小说传奇性，尊重客观再现\n\n《儒林外史》中既没有惊心动魄的传奇色彩，也没有情意绵绵的动人故事，主要内容是当时随处可见的日常生活和人的精神世界。全书写了二百七十多人，除士林中各色人物外，还把高人隐士、医卜星相，娼妓狎客、吏役里胥等三教九流的人物推上舞台，从而展示了一幅幅社会风俗画。全书不靠激烈的矛盾冲突来刻画人物，而是淡化故事情节，尊重客观再现，用寻常细事，通过精细的白描来再现生活，塑造人物。如马二先生游西湖，没有惊奇的情节，没有矛盾冲突，只是按照马二先生游西湖的路线，所见所闻，淡淡地写去，却把这个八股选家愚昧、迂腐的性格写活了。\n\n（2）人物刻画真实\n\n①《儒林外史》所写的人物切近人的真实面貌，通过平凡的生活写出了平凡人的真实性格。像鲍文卿对潦倒的倪霜峰的照顾和对他儿子倪廷玺的收养，甘露寺老僧对旅居无依的牛布衣的照料以及为他料理后事的情谊，都是通过日常极平凡细小甚至近于琐碎的描写进行描绘和表现的。作品由此塑造了普通百姓真诚朴实的性格，感人至深。\n\n②人物性格摆脱了类型化，而有丰富的个性。严监生是个有十多万银子的财主，临死前却因为灯盏里点着两根灯草而不肯断气。然而他并不是吝啬这个概念的化身，而是一个活生生的人。他虽然吝啬成性，但又有“礼”有“节”，既要处处保护自己的利益，又要时时维护自己的面子。一毛不拔与挥金如土，贪婪之欲与人间之情，就这样既矛盾又统一地表现了出来。\n\n③作者不但写出了人物性格的丰富性，而且写出了人物内心世界的复杂性。如作者对王玉辉劝女殉节的内心波澜的描写，从笑到哭，从理到情，层层宕开，表现出了王玉辉内心观念与情感的不断搏斗，礼教和良心的激烈冲突。\n\n④《儒林外史》中每个人物活动的过程并不长，但能在有限的情节里，体现出人物性格的非固定性，即性格的发展变化。如匡超人从朴实的青年到人品堕落，作者写出了他随着环境、地位、人物之间关系而改变的性格，而他的性格变化又体现着深刻的社会生活的变动。\n\n⑤《儒林外史》摆脱了古代小说人物肖像描写的脸谱化，代之以真实的细致的描写，进而揭示出人物的性格。如夏总甲“两只红眼边，一副锅铁脸，几根黄胡子，歪戴着瓦楞帽，身上青布衣服就如油篓一般，手里拿着一根赶驴子的鞭子，走进门来，和众人一拱手，一屁股就坐在上席”。通过这一简洁的白描，夏总甲的身份、教养、性格跃然纸上。\n\n（3）景物描写自然真切\n\n吴敬梓对自然景物的描写舍弃了章回小说长期沿袭的程式化、骈俪化的韵语，运用口语化的散文，对客观景物作精确的、不落俗套的描写。如第三十三回，杜少卿和几位好友在江边亭中烹茶闲话，凭窗看江，“太阳落了下去，返照着几千根桅杆半截通红”。随手拈来，自然真切，富有艺术美。\n\n（4）讽刺手法\n\n《儒林外史》中讽刺手法的运用是对中国小说发展的一大杰出贡献，吴敬梓通过辛辣含蓄的讽刺对儒林群丑以及黑暗社会进行了真实有力的抨击，具有写实性、夸张性、含蓄性、多样性、矛盾性、悲剧性。（详见“试论述《儒林外史》的讽刺艺术特色”）","keywords":"叙事结构 表层结构 深层结构 叙事时空 时间 空间 叙事情境 角度 人称 叙事技巧 客观再现 白描 人物刻画 景物描写 讽刺手法","note":"除叙事结构、叙事时空、叙事情境之外，《儒林外史》的叙事话语、叙事接受等方面都可以进行深入研究。如在叙事话语方面，《儒林外史》在产生初期是没有标点的，标点都是后加上去的。不同的句读会给文本带来不同的阅读感受。而在这样一部主要由人物对话组成的文本中，不同的人物转述语，如直接引语、自由直接引语、间接引语、自由间接引语等的运用，更是隐藏了巨大的叙事谋略。这其中《儒林外史》独具特色的人物话语和叙述者话语重合现象，是文本叙述调控的有效表现，相关内容可参考伍丹《《儒林外史＞叙事艺术》，陈正元《情系一代幽怀，抒写半生行迹-（儒林外史）的叙事艺术》，资料可在李凡文学正版群中领取。"},{"id":"432","stars":"★★★★★","title":"试论《聊斋志异》与《儒林外史》对科举制度批判的异同","body":"在清代小说史上，蒲松龄的《聊斋志异》和吴敬梓的《儒林外史》相隔了大约有半个世纪，它们都对科举制度进行了激烈的批判和猛烈的冲击，它们之间既有相同的地方，也存在差异。\n\n一、相同点\n\n（一）婉曲的手法\n\n在《聊斋志异》中，作者用妖狐灵鬼，生动形象地揭露出科举制度的腐朽黑暗，刻画出那些官吏的贪婪、无耻和虚伪，而《儒林外史》则通过明代中叶文人那可笑、可恨又可悲的行径，辛辣地指出科举制只会荒芜学业，败坏社会道德，这种婉曲的手法虽没有直接对科举进行批判，但却使作者有了更大的创作空间，使小说的讽刺效果得到增强，使得小说对科举的批判更加彻底和深刻。\n\n（二）批判科举弊端\n\n二者都揭露了当时的官吏和士子们的行径，使我们看到：封建未世的统治阶级标榜的“唯才是举”，只不过是要造成一个“在考试面前人人平等”的假象，在它背后，实际上进行着严格的阶级选择。在貌似庄严的科举制度下，滋生着无耻和腐败，它扼杀了一代又一代文人，同时也使科举一步步走向灭亡。\n\n（三）揭露科举制度对文人精神的摧残\n\n《聊斋志异》中《王子安》中的王子安就是一个典型的被科举制度摧残的角色。除此之外，《聊斋志异》中还塑造了许多被科举折磨致死的鬼魂的形象，例如《于去恶》中于去恶，《三生》中的兴于唐，《司文郎》中的宋生，《叶生》中的叶生等，他们都是怀才不遇，郁郁而死。《儒林外史》中也通过塑造周进和范进两个形象，生动形象地表现了科举是如何把文人弄得发疯发痴，神魂颠倒。\n\n二、不同点\n\n（一）占比不同\n\n《儒林外史》将抨击八股取士作为中心。在作者看来，正是因为朝廷推行了八股取士制度，才使许许多多读书人为了课求功名利禄做出啼笑皆非的事，于是他把八股取士作为主要的揭露、讽刺与批判的对象，强调它是导致士林轻视文行出处的根源。\n\n在《聊斋志异》中也有一些讽刺科举及有关士人的作品，大约占全书的十分之一，但作者没有认为科举制度是士林诸恶的根源，相反，还对这一制度抱着希望。他的讽刺所向是某些科举机关和主考官员，书中那些讽刺一般士人的作品，也不把过错或罪责归到科举制度本身上，而是归到人物自身的道德修养之上。在题材的广度与深度以及所带来的社会意义而言，《聊斋志异》比之《儒林外史》还是有所不及的。\n\n（二）对科举的态度不同\n\n吴敬梓在《儒林外史》中“穷极士人情态”，通过他所塑造的一个个鲜明的人物形象，触及士人灵魂的深处，揭示封建科举制度的罪恶，深刻反映了处于封建统治下的人们的生活和精神面貌，详细地描述了一个时代的知识分子的命运，描绘出了封建社会的种种腐败和黑暗世相，对封建礼教和传统文化进行了赤裸裸的批判，讽刺了儒林阶层道德堕落和精神空虚的现实，从根本上否定了科举制度。\n\n而蒲松龄的《聊斋志异》虽然广泛而深刻地揭露了科举的弊端，但并没有从理论到实际的根本地否定科举制度，作者的不满和愤慨主要针对科举的流弊，他认为科举制度本身没有错，之所以选不出真正的人才，是因为考官的选取和考试形式。\n\n大而言之，蒲松龄是以“个中人”的心态，控诉着科举的不公，热腔骂世，冀望改良；吴敬梓则以“过来人”的心态，暴露着科举的腐败，冷板敲人，与之决绝。\n\n（三）表现手法不同\n\n《儒林外史》通过对形形色色的读书人的描写，指出了科举的虚伪性、残酷性。作者虽把故事假托在明代，但还是有着非常浓厚的时代痕迹，虽非常夸张地讽刺了热衷科举的读书人的虚伪和无耻，但于夸张中也透着写实，书中的人物在现实生活中都有原型。这种批判现实主义手法的运用使得作品对科举的批判更为深刻彻底，在现实和夸张之间把科举制度的种种伪装统统撕破，把它的虚伪、无耻、腐败赤裸裸地暴露在读者的视野之中。\n\n《聊斋志异》则通过许多被科举制折磨而死的鬼魂形象，曲折地反映现实，对科举摧残人才的不合理发出悲愤的控诉，这类故事往往人鬼混杂，阴阳交错。作者大量借用民间故事，写鬼写狐，想象奇特，以神怪幻异的手法写出了大量的讽喻现实的作品。这类故事使得整个作品有着浓郁的浪漫主义色彩，同时于写鬼写神之间对社会弊端进行了批判，很有寓言的特点。","keywords":"相同点 婉曲 科举弊端 精神的摧残 不同点 占比 态度 表现手法","note":"《聊斋志异》与《儒林外史》对科举制度批判的异同是考查重点，相关资料可参考王昊《热腔骂世与冷板敲人一一＜聊斋志异＞与《儒林外史＞对八股科举态度之比较》，苏雪菲《论＜儒林外史＞与《聊斋志异）对科举制度批判的不同》。此外，二者在题材与内容、结构情节和人物塑造、艺术技巧等方面也各有侧重，详细内容参考王延《《儒林外史＞与《聊斋志异＞的艺术比较》，上述资料均可在李凡文学一千题正版群中领取。"},{"id":"433","stars":"★★★★","title":"试论述《儒林外史》两组对立人物及其意义","body":"总体来看，《儒林外史》主要设置了两组对照的人物，一组表现作者对现实的批判，一组寄寓作者的理想，这两组人物具体如下：\n\n一、讽刺与揭露儒林群丑\n\n《儒林外史》所写内容，假托明季，实即清朝的现实。在封建社会里，科举是读书人走上仕途的唯一通道，具有极大的诱惑力，广大读书人都挣扎在这条道路上，从而产生了无数可悯而又可悲的人生悲剧。由此，诞生了以下类型的人物：\n\n（一）迂腐而呆的类型\n\n这一类型之人可笑可厌，而又可悲可悯，以周进、范进为代表。周进年过花甲，却屡试不第，受尽屈辱，而致精神失常，当他进省城参观贡院时，大半生没有取得功名所郁积的辛酸悲苦，所忍受的侮辱欺凌，一下子倾泻出来，“一头撞在号板上，直僵僵不省人事”，苏醒后满地打滚，放声大哭。对周进来说，“贡院”“号板”，寄托着他的希望，凝聚着他的心血，也给予他一次次毁灭性的打击。因此，当他身处其中之时，就会百感交集，完全失去了自我控制的能力。其愚拙，既可叹；其凄楚，复可悯。\n\n另一个与周进有相似命运的范进在科举的道路上，以生命为赌注，从二十岁一直考到五十四岁才中举。几十年间的打击、折磨，已使他的心灵完全陷于痛苦的木然状态。因此，当一个完全相反的信息出现时，尽管这是他孜孜追求的希望，他却反而没有“力量”接受了，他的心理完全失去了平衡，因而陷入疯魔。这也可以说是富有喜剧性的悲剧。\n\n（二）迂腐而悖的类型\n\n这一类型的代表人物可以以王玉辉为例。王玉辉是个老秀才，其人不仅深中八股之毒，而且深受理学之害。他在宋儒“饿死事小，失节事大”一类教条的熏陶下，居然鼓励和赞美自己的女儿自杀殉节，直到“制主入祠，门首建坊”，众人祭奠时，王玉辉才“转觉心伤，辞了不肯来”。封建礼教，毒害着腐儒，残杀着无辜；但是，它毕竟是虚伪的，三女儿被残杀了，而王玉辉却终于流露出掩埋在内心深处的人性，他前前后后的言行，深刻地反映了“良心与礼教之冲突”。正是这个“冲突”，使他变态，反常。\n\n（三）卑鄙可憎的官僚缙绅\n\n如果说《儒林外史》里周进、范进、王玉辉的故事，还只是使读者感到迂腐可笑，那么，由科举制度“制造”出来的又一种类型，即官僚和缙绅，他们的行为，则会令人感到卑鄙可憎。例如南昌太守王惠，做了官以后，唯一的信念就是“三年清知府，十万雪花银”。他下车伊始，就了解“地方人情”和“出产”，先作吸膏吮血的打算。而恰是这样的败类，受到上级的嘉奖，号为“能员”，并得升官。\n\n官吏之残虐是如此，地方缙绅也同样卑劣无耻。例如劣绅严致中，是个“忝列衣冠”的贡生，他在乡里强买强卖，巧取豪夺。他的一口小猪跑到王家，便以八钱银子强行卖与王家，待王家把猪养到百多斤时，他又把猪关在自己家里，并说这猪本来就是他的。其卑劣可耻的行为，既令人鄙夷不屑，也令人愤懑不已。\n\n（四）假名士\n\n这一类人物，最初都是热衷科举的名利之徒，在碰壁之后才清高起来。其实，这些全都是一些毫无真才实学，甚至连八股文也写不好的庸才。作品中写的娄三、娄四公子，就是这批群丑的核心，他们一个是举人，一个是监生，却都“不得早年\n\n中鼎甲，入翰林”，于是，一变而为“礼贤下士”的名士。在他们周围，聚集了一批附庸风雅的无聊墨客，如杨执中、权勿用、景兰江、支剑峰以及假侠客张铁臂等等。他们在莺湖、西湖、莫愁湖的几次聚会，集中表现了他们的空虚、做作、不学无识。假名士明明是利欲熏心之辈，却故作不计名利；明明是趋炎附势之徒，却伪装不叩权门；明明是不学无术之人，却故弄风雅。因此，闹出无数愚蠢的笑话，使人发笑，也使人憎恶。\n\n二、理想和希望的化身\n\n《儒林外史》在对腐败的科举和无耻的士风进行深刻揭露和辛辣讽刺的同时，又描写了作者心中的理想人物，主要包括以下类型。\n\n（一）淡泊名利的真名士\n\n在作者看来，儒林中的种种丑恶，均源于对功名利禄的追逐。因此，书中第一个出场的人物王冕，作为正面人物，恰恰是重操守、轻名利的形象。王冕是元末明初的真实人物，而作为一个文学形象，吴敬梓主要描写了他不追求功名富贵，安心以放牛卖画为生，一心孝敬母亲的事迹。而这样的恬淡平和的人生态度，恰与书中所描写的那些追名逐利，道德沦丧的人物，形成了鲜明的对照。\n\n此外，作品中还刻画了庄绍光、迟衡山以及杜少卿等几个正面人物，其中以杜少卿尤为突出，是作者殷情称扬的理想人物。他淡泊功名，讲究“文行出处”；傲视权贵，却扶困济贫；尊重女性，反对对妇女的歧视与摧残；既讲求传统的美德，又敢于向封建权威和封建礼俗挑战。杜少卿的行为，体现了一定程度的离经叛道、尊重个性的精神。\n\n（二）市井平民\n\n《儒林外史》里所描绘的上述寄寓作者理想的人物，最后也都风流云散了。作者既看到社会改造理想的难以实现，又不忍放弃对社会理想和完美人格的追求。于是他把目光投向社会的底层，写出一群远离科举名利场，不受功名富贵污染的市井平民的形象，他们朴实善良，古风犹存，充满人间真情的温馨。作者特别描写了其中的“奇人”，于是书中出现了“四客”：季遐年，既以写字为生，又以写字自娱；王太是围棋高手，又是安于卖火纸筒子的小贩；开茶馆的盖宽，画一手好画，但不攀附权贵；做裁缝的荆元，弹一手好琴，以此自遣。他们自食其力，多才多艺，安贫乐道，高雅脱俗，过着“又不贪图人的富贵，又不伺候人的颜色，天不收，地不管”的自由自在的日子。这“四大奇人”，是知识分子高雅生活“琴棋书画”的化身，是作者心造的幻影，是文人化的市井平民，是作者为新一代读书士子设计的人生道路，体现作者对完美人格的追求。","keywords":"讽刺与揭露儒林群丑 迂腐而呆 迂腐而悖 官僚缙绅 假名士 理想和希望 淡泊名利 市井平民","note":"《儒林外史》的两组对立人物分别是利禄之徒与潇洒人士，前者的意义是为了抨击科举制度，后者的意义则是为了展现出作者的理想，不过要注意，后者因缺乏真实生活基础，而略显单调空洞，尤其是他笔下的“小民”，又被抹上了文人、儒者的色彩，被赋予琴棋书画的雅兴，这表明吴敬梓终于没有跳出儒林的局限。当然，对于一个十八世纪中叶的作家来说，他能够使自己的眼光转向儒林之外的市井，应该予以充分肯定。"},{"id":"434","stars":"★★★★","title":"试论述《儒林外史》的讽刺艺术特色","body":"吴敬梓《儒林外史》讽刺手法的运用是对中国小说发展的一大杰出贡献，其讽刺艺术的特色主要有：\n\n一、写实性\n\n鲁迅说“讽刺的生命是真实”，“非写实决不能成为所谓讽刺”。《儒林外史》的讽刺艺术正是体现了这个精神，最真实地描绘了一代儒林的真相，在冷静、如实的叙述中，使人物自身的言行构成了讽刺。作品中的很多人物，都是史有原型的，如马二先生的原型即冯粹中，迟衡山的原型是樊南仲，庄征君的原型是程绵庄，这就更增加了这些文学形象的真实感。而作为文学形象，这些人物又以巨大的概括性，反映了时代的真实。许多人情世态也都是当时社会上司空见惯的。作者抓住了这些材料，加以典型的概括，而不作主观的说明，使读者从客观事物本身得到启发。\n\n二、夸张性\n\n艺术的真实并不排斥夸张，在真实基础上的夸张，是讽刺所必要的。周进撞号板；范进中举发疯；范母一喜而死；严监生临死因点了两根灯草而迟迟不肯断气；严贡生发病闹船家等精彩描写，都因合理的夸张，而取得强烈的讽刺艺术效果，从而更真实地暴露了问题的本质，起着深刻的批判作用。\n\n三、含蓄性\n\n鲁迅说，《儒林外史》“秉持公心，指摘时弊”，这就是说，它的讽刺不是对某个人的针砭，而是对整个科举制度的揭露。而在科举毒害下的儒林士子，既有卑劣、猥琐、虚伪、变态的一面，也有值得同情，令人悲悯的另一面。因此，《儒林\n\n外史》的讽刺风格，不是剑拔弩张的“犀利”，而是娓娓道来的深沉，即如鲁迅所说的“戚而能谐，婉而多讽”。具体的写法，就是以含蓄、委婉的笔调来叙述故事，描写人物。\n\n四、多样性\n\n由于作者态度的严肃和爱憎的分明，他还能针对不同人物作不同程度、不同方式的讽刺。他对王惠、汤知县、严氏兄弟这批贪官劣绅，是无情地揭露和严厉地鞭挞；他对具有诚笃善良性格，能急人之难，而又庸俗、迂腐，迷信科举的马二先生、王玉辉等人，是既同情，又讽刺。\n\n作者的讽刺有时还随着人物的社会地位和思想品质的变化而分别采取不同的态度。如范进未中举以前，境遇相当可怜，作者虽对他有一定讽刺，但主要是同情他；后来他中了举做了官，变得很恶劣，作者的态度也随之改变，就对他采取了辛辣的嘲讽。总之，吴敬梓的讽刺艺术不仅分寸掌握恰当，而且能将矛头直接指向诸多社会问题，而不是人身攻击。它体现了讽刺艺术的高度成就。\n\n五、矛盾性\n\n把相互矛盾的事物放在一起，突出它的不合理，这是《儒林外史》经常运用的讽刺手法。如小说第四回写居丧的范进去汤知县处打秋风，先是“退前缩后”地坚决不肯用银镶杯箸，直到换了一双白颜色竹箸来，“方才罢了”。汤知县见他居丧如此尽礼，正着急“倘或不用荤酒，却是不曾备办”，忽然看见“他在燕窝碗里拣了一个大虾元子送在嘴里”，心才安下来。真是“无一贬词，而情伪毕露”，把他居丧“尽礼”的虚伪性揭露无余。\n\n六、悲剧性\n\n吴敬梓能够真实地展示出讽刺对象中戚谐组合、悲喜交织的二重结构，显示出滑稽的现实背后隐藏着的悲剧性内蕴，从而给读者以双重的审美感受。周进撞号板，范进中举发疯，王玉辉劝女殉夫的大笑......这瞬间的行为是以他们的全部生命为潜台词的，所以这瞬间的可笑又蕴含着深沉的悲哀，这最惹人发笑的片刻恰恰是内在悲剧性最强烈的地方。作者敏锐地捕捉人物瞬间行为，把对百年知识分子命运的反思和他们瞬间的行为巧妙地结合在一起，使讽刺具有巨大的文化容量和社会意义。","keywords":"写实性 夸张性 含蓄性 多样性 矛盾性 悲剧性","note":"《儒林外史》的题目也可进一步分析。“儒林”一词出自《史记》的“儒林列传”，是“儒者之林”，指学术界等。国史列传属于“正史”，而作者用“外史”为名以作区别，正如吴敬梓的挚友程晋芳在《怀人诗》中所揭示的：“外史记儒林，刻画何工妍。”作者本意是要写一部正史之外的儒林的传记，故而有意把书中故事背景假拟为明代，以类“正史”，而实际上反映的是作者同时代的文人在科举制度毒害下的厄运。在科举制度的大染缸里，这些人也许可悲可笑，但也无奈、心酸。作者笔下的他们各具面目、粉墨登场，讽刺的艺术在作品中得到了淋漓尽致的发挥。"},{"id":"435","stars":"★★★","title":"试论述《儒林外史》与晚清谴责小说的讽刺艺术的异同","body":"《儒林外史》和晚清谴责小说在讽刺的叙述起点上进入了两种同源异向的叙述流程。它们的异同具体表现如下：\n\n一、两者讽刺艺术的相同之处：\n\n（一）《儒林外史》所写人物，大都实有其人。吴敬梓取材于现实士林，人物原型多为周围的亲友、相识相知者。同样，晚清谴责小说也大多取材于现实，如《官场现形记》是一部专门暴露官场黑暗的力作，对于中国封建社会崩溃时期的官僚政治进行了总体解剖，而且书中人物故事多以真人真事为蓝本。\n\n（二）《儒林外史》中的杜少卿是作者的自况，他的主要事迹与吴敬梓基本相同，而且是按照生活中原有的时间顺序安排的，作者在生活原型的基础上撷取适当的素材，通过想象虚构加以典型化。而《二十年目睹之怪现状》也是一部带有自传色彩的作品。\n\n（三）表现手法大致相同。《儒林外史》通过精确的白描，写出“常见”“公然”“不以为奇”的人事的矛盾、不和谐，显示其蕴含的意义。在晚清谴责小说中，白描传神，是《官场现形记》所长，作家尤擅长于渲染细节，运以颊上添毫之笔，有入木三分之妙。小说还充分运用了夸张、漫画化的闹剧手法，尤喜撕破人生的假面。\n\n二、两者讽刺艺术的不同之处：\n\n（一）作者与叙述者不同\n\n（1）边缘化的文人理想和精英化的文人政治的对立\n\n吴敬梓生于名门望族，有深刻的功名渊源，从“探花”（吴曾祖父）到“监生”（吴祖父）再到“拔贡”（吴父），到了吴敬梓，只成为“秀才”，与此同时，吴氏家族也由盛转衰，这是一个极其被动的边缘化过程。人到中年的吴敬梓感喟“回思年少日，流浪太无凭”，这种错过功名的失悔心态掺和着对功名的深恶痛疾，构成他思想的两重性，这种无法克服的矛盾\n\n心理在《儒林外史》中都原样传给了叙述者。吴敬梓隐含着叛逆与趋归相悖的症结在独特的人生经验中从中心沦为边缘，从而升华出独特的文人理想。这使《儒林外史》在文人写作的风景线上异军突起，体现出古典小说中罕见的人性透彻与深刻。\n\n晚清谴责小说作者在相似的功名境遇中欣逢特殊的时代关节点，趋从了异己的文人政治。晚清整个政治社会道德沦丧，吏治腐败，民不聊生。这一切都坚定了晚清谴责小说家与当下政权的决裂，文人们已经从心理上摆脱了对当时政治体制的过度依赖，而且他们大都是主动远离这种皇权政治体制的。从这一点上，我们不难看出谴责小说作家群体已经向新型知识分子转变的趋势。与知识分子本位上的文人理想的深刻性不同，文人自发的政治热情更倾向于在政治家本位上产生文学怪胎。在政治言论变为小说文本的过程中，晚清文人并未随之进入文学安身立命的边缘地带。因而，尽管晚清谴责小说对官场的谴责与《儒林外史》对士林的讽刺都有衍入民间的趋向，二者的不同也昭然若揭：前者是从士林到官场的庸俗物化，后者则从士林渗透为探究人性的心灵之游。这是文人写作出发点上的反向逆行。\n\n（2）盛世悲戚与衰世意气的对立\n\n吴敬梓历经康、雍、乾三代，正为清室气盛之时；而晚清谴责小说作者却身处满清岌岌可危之际。《儒林外史》和晚清谴责小说讽世的表面共性掩盖了二者在不同时代背景中迥然各异的呈现形态。\n\n《儒林外史》的悲哀呈现为隐身作者的悲哀。叙述者平静叙述着一个个可笑的人物，让一场场闹剧上演，叙述接受者能深切感受到来自隐身作者悲情的强烈穿透力。文本中突显的“老人意象”就是这种悲情的载体，在为悲戚之情所浸润的老人视角中，文本的笑闹蕴涵着悲凉，如叙写王玉辉以笑葬女，虽不言其失悔，却也毫不吝啬地描写他的泪水，王玉辉因而由可憎转为可悲。类似的悲悯情怀使叙述者的讽刺能够穿透世相，有所深指，从而构成《儒林外史》独特的悲剧形式-哀戚的叙述主体下沉所导致的“几乎无事的悲剧”。\n\n转观晚清谴责小说诸多文本，创作主体挺身而出，直接体现为大段评说对叙述流程的粗暴切断，隐身叙述者的消亡使能够负载深意的潜层文本不复存在，文本中更多出现了“悲愤”“哭”“泪”等字眼，它们与近程式化的说话人评论结合在一起，成为披在闹剧上的透明纱衣。\n\n（二）叙述角度不同\n\n作为两种截然不同的叙述试验，《儒林外史》和晚清谴责小说都创造了自己独特的叙述角度，都选择了一种单元连缀结构作为主要叙述框架。不同的是，《儒林外史》改造了第三人称全知叙述，赋予不同叙述单元的互相颠覆功能，使所谓的全知趋于片面甚至谬误，从而创造了表层真实与潜层真实之间的叙述分层，这种不可靠叙述使其从讽刺走向初步反讽。\n\n晚清谴责小说则在叙述主体的不断抬升中由铺陈的第三人称全知式的客观叙述向主观叙述靠拢，平面罗列的叙述方式使晚清谴责小说丧失了《儒林外史》的叙述魅力，走进了不断重复自己的怪圈。在此情形下的各种叙述试验都成为作茧自缚的徒劳冒险，叙写远离了心灵，省察变为耳目之游。\n\n（三）讽刺内容不同\n\n《儒林外史》侧重于讽刺科举，刻画了一幅儒林群丑图。封建社会末期，科举制度像鸦片一样侵蚀着封建文人的灵魂，使他们逐渐沉迷于名望和财富，不能自拔，逐渐失去他们的人格和道德标准，他们在这个过程中表现出了一连串的滑稽动作，这些在吴敬梓的作品中都得到了充分地表现。\n\n晚清谴责小说的讽刺则集中在官场，他们以讽刺的谩骂揭露官僚封建社会贪婪丑陋的面孔以及他们人格、道德的丧失。比较典型的几类如下：一类是对妓女与官的讽谕；另一类是盗贼与官的关联；还有一类是独特的洋人视角。文中试图通过官员们的表演，暴露整个封建社会官僚的腐败，这与《儒林外史》的讽刺科举制度具有明显的差异。","keywords":"相同 真人真事 自传色彩 白描 不同 作者与叙述者 边缘化的文人理想 精英化的文人政治 盛世悲戚衰世意气 叙述角度 讽刺内容","note":"《儒林外史》与晚清谴责小说的讽刺艺术各有侧重，但都是为讽刺社会、针砭时弊而生，只是《儒林外史》偏向于深沉反讽，而晚清谴责小说偏向于激情谴责。可以参考傅元峰《讽刺的跨度：从反讽到谴责》，杨蓓蕾《＜儒林外史＞与晚清谴责小说》，相关资料可以在李凡文学正版群中获取。"},{"id":"436","stars":"★★★","title":"试述《红楼梦》的版本系统","body":"《红楼梦》的版本，大致可分为两个系统，分别是抄本系统和印本系统，具体如下：\n\n一、抄本系统\n\n《红楼梦》最初以80回抄本的形式在社会上流传，多题名《石头记》。这些传抄本大都有署名脂砚斋、畸笏叟等人的评语，因此习惯上称之为“脂评本”或“脂本”。\n\n（一）曹雪芹逝世前的抄本\n\n曹雪芹逝世前的抄本，已发现的有三种，即“脂砚斋甲戌本”（1754）、“己卯本”（1759）、“庚辰本”（1760)，都是残本。其中“庚辰本”较完整，只缺两回。这些抄本因为离曹雪芹写作年代较近，所以比较接近原稿。\n\n（1）甲戌本，即1927年胡适发现的抄本《石头记》。由于在第一回里有“甲戌（乾隆十九年，1754）抄阅再评”，故以“甲戌”本相称。甲戌本是只有十六回书的残抄本，书中保留了大量的朱墨两色的批语，批语下较多的署名为“脂砚斋”。正文与印本有很多不同，特别是第一回，比印本多出很多文字。\n\n（2）己卯本，“己卯（乾隆二十四年，1759）冬月定本”，亦为残本。合两次发现，共四十一回又两个半回。抄文中有两代怡亲王允祥、弘晓之讳，知系怡亲王府抄本。\n\n（3）庚辰本，“庚辰（乾隆二十五年1760）秋月定本”。共七十八回（缺六十四、六十七两回），第十七、十八回未分，第十九回无回目。在抄本系统中，此本保留原文及脂批较多，较完整。\n\n（二）曹雪芹逝世后的抄本\n\n（1）戚序本（有正本）\n\n戚序本，因原抄本前有乾隆三十四年进士戚蓼生之序文，故有此称。1912年，上海有正书局据此抄本石印，而原抄本又于1927年毁于火，所以现在看到的戚序本，实为有正书局之石印本，故亦称“有正本”。此本为完整的八十回，脂评亦保留，但删去了评语的署名。虽为石印本，但仍属抄本体系，并以其正文完备而受到学界重视。\n\n（2）列藏本\n\n列藏本又称脂亚本，因藏于原苏联东方学研究所列宁格勒分所，故名。此本无题签，无回目，原书约在乾嘉间抄成，在嘉道间已破损，当时藏家修补装订时，反折清高宗《御制诗集》第四、第五册的书页作为页间衬纸。题“石头记”。\n\n二、印本系统\n\n（一）程本\n\n与抄本相较，程本为完整的一百二十回，书中完全删去了抄本上的评语，书名不再是《石头记》，而是《红楼梦》（抄本中亦有书名为《红楼梦》者）。程本是它以后多种一百二十回印本《红楼梦》的祖本。\n\n（1）程甲本\n\n乾隆五十六年（1791)，高鹗和程伟元将《红楼梦》前80回与后40回合成一个完整的故事，以木活字排印出来，书名为《红楼梦》，通称“程甲本”。\n\n（2）程乙本\n\n乾隆五十七年（1792)，高鹗、程伟元将程甲本“补遗定讹”，“略为修辑”，重新排印，简称“程乙本”。\n\n（二）其他印本\n\n在清代，较著名的印本，有王希廉的《新评绣像红楼梦全传》，张新之的《妙复轩评石头记》、姚燮的《增评补图石头记》等等。","keywords":"抄本系统 曹雪芹逝世前 甲戌本 己卯本 庚辰本 曹雪芹逝世后 戚序本（有正本）列藏本印本系统程本程甲本程乙本","note":"《水浒传》有繁本、简本之分，《红楼梦》也有抄本、印本之别。不同的是，《红楼梦》这两大版本系统的出现，很大程度上是因为曹雪芹生前未能完成这部巨著的遗憾。这部分涉及的一些比较重要的版本，如甲戌本、己卯本、庚辰本、程甲本等我们都要注意一下，有可能在名词解释中出现，大家要注意一下。"},{"id":"437","stars":"★★★","title":"试评价《红楼梦》后四十回的功过","body":"高鹗和程伟元增补的《红楼梦》后四十回，有功有过，功大于过。具体表现在以下方面：\n\n一、《红楼梦》后四十回的成就\n\n（一）使《红楼梦》结构完整，故事首尾齐全\n\n《红楼梦》后四十回根据原书线索，把宝、黛爱情写成悲剧结局，使小说成了一部结构完整、故事首尾齐全的文学巨著，从此在社会上产生了巨大的影响。\n\n（二）主要人物结局悲惨，保持原有矛盾的发展\n\n《红楼梦》八十回本第五回的《红楼梦》曲词及《金陵十二钗》册子的判词中，本已对贾府及主要人物的结局有所暗示，\n\n脂砚斋评语中也有好些处提到贾府在最后是“落了片白茫茫大地真干净”（第五回《红楼梦》曲第十四支），书中主要人物的结局都很悲惨，贾宝玉则出了家。而《红楼梦》后四十回写出了全书中心事件、主要人物的悲剧结局，如黛玉之死、贾家之败、宝玉出家等，从而保持原有矛盾的发展，基本上符合前八十回的倾向。\n\n（三）部分情节生动精彩\n\n《红楼梦》后四十回有的情节描写生动精彩，尤其是“泄机关颦儿迷本性”“林黛玉焚稿断痴情”“薛宝钗出闺成大礼”等情节，写出了黛玉悲惨而壮烈的结局，相当深切感人地完成了对林黛玉悲剧人生的续写，将《红楼梦》的悲剧情境推到了文学审美极致的高度和强度。王国维的《红楼梦评论》甚至将黛玉与宝玉最后相见的一段赞为全书一百二十回中“最壮美者之一例”。\n\n二、《红楼梦》后四十回的不足\n\n（一）削弱了作品的批判力度\n\n《红楼梦》后四十回安排了贾府“兰桂齐芳，家道复初”的“大团圆”结局，违背了原作“好一似食尽鸟投林，落了片白茫茫大地真干净”的预判，削弱了作品的批判力度；前八十回中，具有叛逆思想的贾宝玉、林黛玉的形象，在后四十回里也有所变化，他们居然认为作八股、取功名，是清贵的事业。这无疑与前八十回中反映出来的思想是完全相悖的。\n\n（二）艺术性稍显不足\n\n就艺术性而论，《红楼梦》后四十回的艺术描写上较前八十回逊色不少，远不如前八十回那样富有神采韵味。大部分篇章叙事简略，整体缺少一种艺术生命，缺少贯注的生气，独到的发现，奇妙的细节，别致的处理，缺少艺术激情、艺术才能、艺术想象的喷薄。后四十回中的种种缺点和不足，也证明了这些文字并非曹雪芹所作。","keywords":"成就 结构完整 首尾齐全 结局悲惨 保持原有矛盾发展 部分情节生动精彩 不足 削弱批判力度 艺术性稍显不足","note":"关于《红楼梦》的后四十回，还存在着许多争论，尤其是其作者具体是谁，学界一直有不同的观点。不过比较公认的是，后四十回井非曹雪芹所作，这也使得人们往往会将这本书的前后两部分进行对比，所以对于《红楼梦》后四十回的成就与不足，我们也要了解一下。"},{"id":"438","stars":"★★★★","title":"试分析《红楼梦》的悲剧意蕴（25南昌大学、26东南大学）","body":"【答题框架】\n\n《红楼梦》是一部内涵丰厚的作品，展示了一个多重层次、又互相融合的悲剧世界，具体表现在以下方面：\n\n一、封建家族必然衰落的悲剧命运\n\n《红楼梦》叙写贾府由兴到衰，多角度地展示出这种家庭自身存在的问题。贾府衰败的必然性，表现在很多方面。\n\n（一）后继无人\n\n这个“赫赫扬扬已历百年”的旺族，“现在”已后继无人了，在《红楼梦》写到的贾府“主子”之中，没有一个人可以支撑这个贾府大厦。后继无人，是贾府必然衰败的直接原因。\n\n（二）道德沦丧，无法维系\n\n贾府号称“钟鸣鼎食”之家，“诗礼簪缨”之族，但实际上敲诈勒索、仗势欺人、图财害命、高利盘剥、荒淫乱伦，无所不有。赖以维系这个家族的封建传统道德，已被贾府的“主子”们彻底毁败，已完全失去了维系家族的力量。这个道德沦丧的贾府，只能一步步走向最后的崩溃。\n\n（三）矛盾尖锐\n\n贾府上下，矛盾重重，从主子到奴婢，几乎都生活在利害冲突之中。主子之间，勾心斗角，尔虞我诈，演出了无数的闹剧、丑剧。此外，主子与奴婢、奴才的冲突，也十分尖锐，焦大的“白刀子进去，红刀子出来”的威胁，就是明证。而奴仆下人之间，也同样存在着明争暗斗。贾府上下的重重矛盾，正加速了它的分崩离析。\n\n（四）经济的日渐拮据\n\n作品曾以元妃省亲、秦可卿之丧等情节，极写贾府的豪富，表现这个家族的主人在以种种手段聚敛财富的同时，又穷奢极欲，大肆挥霍。到后来，这样一个曾经显赫一时的贾府，在配药时居然找不到二两可用的人参。这非常生动地表现了贾府经济上的拮据与困难程度。\n\n二、女性青春生命和美的被毁灭的悲剧\n\n在《红楼梦》中，女儿被看作是天地间的灵气所钟，是生命的精华；而男人是与女儿相对立的“渣浊沫”，是与女儿悲剧相对立的悲剧制造者。这是以贾宝玉独特的观察为分界线的，也是曹雪芹对人生和生命的独特理解。因此，他将贾宝玉和一群身份、地位不同的少女放在这个既是诗化的、又是真实的小说世界里，来展示她们的青春生命和美的被毁灭的悲剧。\n\n在贾府这个富贵家族中，男主子随心所欲地纳妾，占有丫鬟，私通妇女，都是无可厚非的事情。女人则要恪守闺范妇德，女孩子不能动半点情思。青年丧夫的李纨只能寡言少语地守寡，消耗青春岁月。主子姑娘们的婚姻只能听从家长功利主义的专断。贾府的元、迎、探、惜四“春”，隐含“原应叹息”四字的意思，表达的是贵族小姐的人生不幸。凸显女子的不幸，正是中国封建末世哲人忧思的一个避不开的话题。\n\n三、婚姻爱情的悲剧\n\n《红楼梦》对贾宝玉和林黛玉的爱情悲剧的描写最细腻，深切动人，与之相对照的是薛宝钗的婚姻悲剧。在贾府日益衰败的条件下，贾薛两家希望宝玉和宝钗结成“金玉良缘”，以“德貌工言俱全”的宝钗来做宝玉的贤内助，主持家政，继承祖业。在关系着家族兴衰的问题上，封建家长决不会让步，他们只能不顾宝玉、黛玉的愿望而扼杀了他们的爱情，造成宝黛的爱情悲剧。象征着知己知心的“木石前盟”被象征着富与贵结合的“金玉良缘”取代了。可薛宝钗又何尝幸福，她听从家长之命，也遂了心愿，与贾宝玉结为夫妇，但面对的是心里只有一个林黛玉的丈夫，陷入了十分尴尬的境遇，又何尝不是另一种不幸-没有爱情的婚姻悲剧！\n\n四、真实痛苦的人生体验\n\n从整部作品看，《红楼梦》笼罩着一层由好到了，由色到空的感伤色彩。《好了歌》及其注解就是人生悲剧的主题歌。贯穿在《好了歌》里的中心思想是“变”，荣与辱、升与沉、生与死都在急剧的变化中。由于对一切传统的现存的思想信念和社会秩序提出了大胆的怀疑和挑战，同时，又因为新的出路、新的社会理想又那么朦胧，作者倍觉感伤。带着“色空”、梦幻的情绪热爱生活又有梦幻之感，入世又出世，这是曹雪芹在探索人生方面的矛盾。他正是以一种深挚的感情，以自己亲身的体验，写出入世的耽溺和出世的向往，写出痛苦的人生真相和希求解脱的共同向往，写出矛盾的感情世界和真实的人生体验。","keywords":"封建家族必然衰落 后继无人 道德沦丧 矛盾尖锐 日渐拮据 女性青春生命和美的被毁灭 婚姻爱情悲剧 真实痛苦的人生体验","note":"分析《红楼梦》的悲剧意蕴，其实就是在分析《红楼梦》的思想内容。《红楼梦》虽非曹雪芹的自传，但其中必然融汇着曹雪芹真实的人生体验。曹雪芹的一生，是由盛而衰的悲剧的一生，是以《红楼梦》中必然也弥漫着强烈的悲剧色彩。而曹雪芹作《红楼梦》的目的之一是“闺阁昭传”，因而其中必然涉及女性的悲剧，涉及婚姻爱情的悲剧。除了南昌大学考查到了这部分内容之外，华南师范大学在25年的考查中同样考查到了“举例说明《红楼梦》的悲剧意蕴和艺术成就”这道题目，大家结合这部分内容以及之后《红楼梦》的人物塑造成就和叙事成就这些题目进行作答就可以了。"},{"id":"439","stars":"★★★","title":"试分析《红楼梦》中贾宝玉这一形象","body":"《红楼梦》的主人公贾宝玉是一个具有叛逆性格的贵族公子，他的叛逆性格，主要表现在以下方面：\n\n一、反叛封建道德和封建家庭、封建婚姻\n\n贾宝玉是贾府的继承人，是贾家兴旺的希望所在，他应该走一条科举荣身之路，以便立身扬名，光宗耀祖。他也应该有一个“德言工貌”俱全的女子做妻子，主持家政，继续家业。可是他却力图挣脱家庭强加于他的名缰利锁，做了个无拘无束、自由自在的“富贵闲人”。他“最不喜务正”，“不肯念书”，不愿走仕途经济的人生道路。这样，他就违背了封建家庭给他规定的生活道路，成了“不肖子孙”。在婚姻问题上，他既不考虑家族的利益，门当户对；也不按照传统道德的要求，去选择封建淑女，他追求的是心灵契合的感情。\n\n二、反对世俗礼仪\n\n和《红楼梦》中的普通大众相比，宝玉实为别一世界之人，与这世俗的荣华，毫无关涉。当贾府的重要亲戚王子腾过生日时，贾母命宝玉前去拜寿，他却私下里极不耐烦地抱怨。这种“贺吊往返”，在封建社会，特别在上层社会，是关系到家族的荣辱休戚的大事。对此，贾宝玉却毫无热情。元春晋封为凤藻宫尚书加封贤德妃时，贾宝玉也“视有如无，毫不曾介意”。\n\n三、追求自由\n\n宝玉在贾府，过着“安富尊荣”的优裕的物质生活，但是他却深感痛苦，特别是无自由的痛苦。他没有读书的自由，没有行动的自由，没有用钱的自由，没有交朋友的自由，更没有爱情的自由。父亲的严教与祖母的宠爱，共同构成对他的束缚，使他既是贾府的宠儿，又是贾府的囚徒。因此，他总是背着人们在尝试着自由，例如他偷读杂书，暗交蒋玉菡，私祭金钏，探望晴雯，等等，虽然事后往往受责，他却不悔恨，充分表现出对自由的追求。\n\n四、追求平等，反对等级制度和男尊女卑\n\n宝玉从不以“主子”自居，有时甚至甘心为丫鬟“充役”。怡红院是很多丫鬟向往的地方，这并不完全因为宝玉的多情，主要是那里的平等气氛强烈地吸引着她们。自由、平等的思想，作为贾宝玉的性格特点，使他与贾府的习俗格格不入，受到种种“痴”“呆”的指责，而其实质，正是对传统的封建等级制度的否定。\n\n贾宝玉在反对等级制度的同时，对男尊女卑的传统偏见，更予以彻底的否定。他见了女儿便“清爽”，见了男人“便觉浊臭逼人”，把男人都看成是“混沌浊物，可有可无”。宝玉的这些思想言论，看似“矫枉过正”，但正表现出反对男尊女卑传统观念的彻底性。\n\n五、具有孤独感和破灭感，充满矛盾与痛苦\n\n贾宝玉是个半现实半意象化的人物。作者把他对社会和人生的思考、怨恨、企盼都熔铸到贾宝玉的形象里。贾宝玉不愿走封建家庭给他规定的人生道路，但又对自己“一技无成”“半生潦倒”感到悔恨；他是“富贵闲人”，希望自由自在，任性逍遥，但又“爱博而心劳”，“无事忙”。他“痴情”，这不仅表现在对黛玉的钟情，还表现在他对一切少女美丽与聪慧的欣赏，对她们不幸命运的深切同情。在大观园里，宝玉对女儿们关怀备至，对遭受欺凌的女儿也更为体贴，一有机会便以自己的一腔柔情去抚慰那些受伤的心。\n\n可他所珍视的女儿像花朵一样，无可挽回地枯萎下去，甚至被摧残而零；他所厌恶甚至憎恨的恶势力，仍疯狂地维持着统治地位。他满怀着希望但找不到出路，因为他所反对的，正是他所依赖的。他绝望又找不到出路，一种孤独感和人生转瞬即逝的破灭感萦绕着他，使他透着诗人气质，散发出感伤的气息。但是宝玉又不愿意孤独，不愿意离开生活，离开他钟爱的黛玉和众多的女子，因而更加深了他的痛苦。宝玉悟破人生，对生命价值的认识与作品中所写的家庭的衰败结合在一起的时候，作品就产生了更加动人的艺术魅力。","keywords":"反叛封建道德 封建家庭 封建婚姻 反对世俗礼仪 追求自由 追求平等 孤独感 破灭感 矛盾与痛苦","note":"贾宝玉是《红楼梦》整个故事的中心，这个角色身上，首先体现出来的就是叛逆性，包括对封建道德、封建制度、封建婚姻、封建家庭的多方面的叛逆。但贾宝玉本身又生活在这样一个封建社会之中，是封建社会的一份子，虽然厌恶这一切，却无法摆脱，因而内心充满矛盾和痛苦。"},{"id":"440","stars":"★★★","title":"试分析《红楼梦》中林黛玉的形象","body":"林黛玉早年父母双亡，家道中落，孤苦伶仃，到贾府过着寄人篱下的生活。但是她任情率性，保持了自然的性情，保存了较多的自我。这一形象，主要具有如下特征：\n\n一、脆弱敏感，自尊自强\n\n贾府上下，莫不认为黛玉心胸狭隘，“行动爱恼人”，即所谓“小性儿”，这确实是林黛玉性格的特点，比如当别人给她送来宫花时，她首先想到的是，这是别人挑剩下的，她有时确实有些过敏，有些脆弱和多疑。这种性格的形成原因，正是她的处境。贾府，是一个典型的“势利场”，黛玉以寄食者的身份，身处其间，使她时时处于防范地位，以维护自己的尊严。林黛玉作为一个弱女子，她的“小性儿”所蕴涵的自尊和自强，正是对封建礼教的挑战。\n\n二、纯洁、真诚\n\n林黛玉是一个纯洁、脱俗的富有诗人气质的青年女子，“质本洁来还洁去”，正是她的人格追求。她没有丝毫的趋炎附势，讨好卖乖，搬弄是非，奸诈虚伪等恶性。她对这一切深恶痛绝，时时予以嘲讽，因而被认为“尖刻”“见一个打趣一个”。薛宝钗、花袭人，都曾被她奚落过。但是，“尖刻”并不是她的本性，她实际上还是很宽厚、坦荡的。在《红楼梦》所写的小姐、奶奶当中，没有一个像黛玉那样与自己的丫鬟情同姐妹，生死与共。这不仅由于紫鹃的善良，主要还是黛玉的真诚相待。即使如薛宝钗，黛玉也终于真诚地相信了她是一个好人，待之如亲姐妹。还有对香菱学诗，黛玉也诚恳地给她讲解、修改。这一切都表现了黛玉纯洁、真诚的品格。\n\n三、具有叛逆性格\n\n黛玉从不看重功名富贵，也从不劝说宝玉求取功名。她不仅无保留地支持贾宝玉反对仕途经济的思想、言行，而且把封建礼教的叛逆者贾宝玉引为知己，并为爱情献出了生命。这本身就足以说明林黛玉也是一个封建礼教的叛逆者。林黛玉才华横溢，而且从不信奉“女子无才便是德”，她在诗社中，以她特有的方式，一再展现自己的诗才，绝不示弱。这显然也是一个叛逆女性特有的性格。\n\n四、坚贞不渝\n\n黛玉与宝玉的爱情，一方面显得无比坚贞、执着，另一方面，从一开始就已注定了悲剧命运。“金玉良缘”的存在，构成了巨大的威胁，给他们的爱情带来无法摆脱的痛苦。对这一切，林黛玉有着清醒的认识，这使她承受了最深沉的悲伤与痛苦。但是，林黛玉却始终坚贞不渝，她虽然无数次挫伤了宝玉，但她自身却从不曾动摇，正因如此，当她最终处于回天无力的时候，则唯有以生命殉“痴情”。","keywords":"脆弱敏感 自尊自强 纯洁、真诚 具有叛逆性格 坚贞不渝","note":"林黛玉是一个“病态美人”的形象，而她之所以与宝玉情投意合，是因为二者的性格之中有相似之处，她的多愁善感、我行我素的勇敢是对封建丑恶现象的反抗。而林黛玉这样一个富有才华的少女的生命的消逝，正体现了封建社会的黑暗与罪恶，她的悲剧，是一个社会的悲剧。"},{"id":"441","stars":"★★★","title":"试分析《红楼梦》中薛宝钗的形象","body":"薛宝钗是书中和林黛玉相对立的形象，在她身上体现了封建主义的理想和人生道路。这一形象，主要具备如下特征：\n\n一、宽厚豁达，从容大度\n\n薛宝钗宽厚豁达，从容大度，言谈举止从礼合节。对长辈，她奉行“悦亲”之道，事事让长辈高兴，但不盲从，当长辈们犯糊涂的时候，她也要规劝。林黛玉把对宝玉的爱情视为生命，因而特别敏感，把宝钗作为自己的“对手”，常常对她旁敲侧击，但宝钗仍以宽容处之，采取了似浑然不觉的退避的态度，经过一段时间的真诚相待，终于“兰言解疑癖”，化解了敌意。对赵姨娘、贾环这样人品不佳的人物，她采取了不冷不热的态度，既不过于亲近，也不排斥歧视，显出她的心胸气度。\n\n二、自觉认同传统道德秩序\n\n对于传统的伦理原则、现实社会的秩序，以及现存的人际关系，薛宝钗都不是一个被动的接受者，而是一个积极主动的认同者。她信奉传统道德，认为“女子无才便是德”；她认为男人们应该“读书明理，辅国安民”，所以规劝宝玉注重“仕途经济”；她有封建等级观念，对金钏的投井对尤三姐、湘莲的悲剧，都采取了冷漠的态度，成为符合封建标准的“冷美人”。\n\n薛宝钗律己甚严，自觉地用“礼”约束自己。在爱情上，她分明对宝玉情有所钟，却将这种感情封闭到庄而不露的地步；在才学上，她是大观园中唯一可以与林黛玉抗衡的才女；在生活上，她也有爱美的天性和很高的审美能力，可她却常常自觉不自觉地去压抑自身的爱好和情趣。她信从封建道德，使自己失去了许多童心，许多自由，逐渐被封建规范磨去了应有的个性锋芒：对自己所爱的人与物不敢有太强烈的追求，而对自己不喜爱的人与事也不敢断然决裂，她的生命处在一种扭曲抑制的状态。\n\n三、深谙世故，藏露得宜\n\n在人事关系复杂、彼此钩心斗角的贾府里，宝钗藏起了种种不该表露不便表露不能表露的心理情感、情绪态度甚至才华\n\n能力。她常以“不关己事不开口，一问摇头三不知”的态度，成功地以笑而藏，躲避嫌疑，掩饰欲望，化解尴尬，难得地保持了属于自己的人际和谐。但聪明的宝钗并不只是一味地藏，她同时也是个善于露、善于自我表现的姑娘。她有意无意地让众人见识了她的学识，同时不吝于彰显自己的精明能干和温柔大方，也因此赢得贾府上下众口一词的称赞。","keywords":"宽厚豁达从容大度 自觉认同传统道德秩序深谙世故 藏露得宜","note":"林黛玉和薛宝钗这一形象形成了鲜明的对比，如果说黛玉身上更多地表现出对封建制度的叛逆的话，宝钗身上则更多体现的是对封建制度的自觉认同。不过，她的本性并不坏，这更显露出悲剧色彩-她的生命已经被封建礼教给彻底扭曲了。对薛宝钗来说，伦理原则永远比真实的生命更为重要，而这正是宝钗一生的悲剧根源。"},{"id":"442","stars":"★★★★","title":"王熙凤性格的多面性（河南大学）","body":"【答题框架】\n\n王熙凤是《红楼梦》中塑造最为复杂的女性形象之一，其性格兼具“脂粉英雄”的刚强与“机关算尽”的阴鸷，既展现了封建家族管理者的精明才干，又暴露了权力异化下的人性扭曲。这一形象的复杂性与多面性，主要表现在以下几个方面：\n\n一、八面玲珑人情练达\n\n王熙凤是荣国府里年轻美貌的掌权的女主子，与上下各类人物都要打交道。她对老祖宗贾母刻意地逢迎邀宠，对主内政的王夫人非常敬顺，受命必行，虽然不无虚与委蛇、假情周旋的因素，那谐谑的谈吐、逢场做戏的机敏也着实讨得贾母的欢心、王夫人的信赖，不失为能干孝顺的好媳妇。她对荣宁二府的姊妹、妯娌们，远近亲疏各异，虽然以利害关系为转移，那豪爽泼辣的气势，却也赢得了大家的信服，从来未伤和气。对府中的各等级的奴仆、婢女，恩威并施，采取了笼络和压制、怀柔和虐待并用的统治术，成了奴仆们最惧怕的主子。\n\n二、精明强干以一顶十\n\n王熙凤是治家的能手，驾驭着这繁杂的大家庭，连宁国府大办秦可卿丧事还要请她总理一切。\n\n面对当时“里头着实不成个体统”的局面，凤姐首先是“理出个头绪来”，一下子就瞅准了存在的弊端“头一件就是人口混杂，遗失东西；二件，事无专管，临期推诿；三件，需用过费，滥支冒领；四件，任无大小，苦乐不均；五件，家人豪纵，有脸者不能服约束，无脸者不能上进。-这就是宁府的风俗。”此时凤姐虽尚未理事，已能看出她的厉害了。\n\n针对宁府的五种弊端，王熙凤采取了“承包责任制”做到事有人办，物有人管，活有人干，各司其职，忙而不乱；加之他软硬兼施，“打一儆百”，各色人等愈加谨慎小心，不敢怠慢，把那本是乱糟糟的宁府，治理得十分整肃，宁府中人也知道凤姐厉害，合族上下无不称叹。\n\n三、痴迷权势贪得无厌\n\n王熙凤一方面是治家的能手，另一方面却是营私的里手，克扣、拖延发放各房的月例银，拿出去放债，还依恃家族权势，勾结官府，包办官司，借铁槛寺案敛财三干两，操控贾琏婚姻以巩固地位，蛀蚀和败坏着她依赖的这个家族。其行为被脂砚斋批为“五辣俱全”，暴露其对权势的病态迷恋。\n\n四、心狠手辣残忍无情\n\n极度的贪权与好利，必然与残酷的心机相结合。王熙凤毒设相思局害死贾瑞；弄权铁槛寺，三千两银子逼死两条人命；折磨死尤二姐，尤见其阴险狠毒使人不寒而栗。她当然是站在维护封建制度的立场上的，但她和贾政、王夫人、薛宝钗辈不同，她的行为可以完全不受封建道德，甚至“阴司地狱报应”的约束。她是荣国府的掌权者，也是这个家庭贪污盗窃的罪魁。\n\n她辛辛苦苦地支撑贾府，目的在于利用这个家族的存在以供自己支配和剥削。\n\n王熙凤是封建时代大家庭中精明强干、泼辣狠毒的主妇典型。她狡诈凶残，飞扬跋扈，但又才貌双全，长袖善舞。正如兴儿所说的：“嘴甜心苦，两面三刀；上头笑，脚底下使绊子；明是一盆火，暗是一把刀；她都占全了。”这一形象的复杂、丰富，完全可以与安娜·卡列尼娜这样的经典女性形象井肩。","keywords":"八面玲珑 精明强干 痴迷权势 心狠手辣 主妇典型","note":"谈起《红楼梦》中的典型，人们更多地会将目光聚焦于贾宝玉、林黛玉和薛宝钗这三个人身上，但王熙凤明显也是不能忽视的。与前三者相比，王熙凤的形象无疑是更加复杂的，一方面是当权的奶奶，治家的干才，似乎是支撑这个钟鼎之家的顶梁柱；另一方面又是舞弊的班头，营私的里手，是从内部蚀空贾府的大蛀虫，治家与败家构成了她性格中的一对矛盾。她要求尽情享受，为了金钱、权威而玩弄权术，置人死地，阴险毒辣；同时，也要求在精神上满足优越感，她那灵巧的机智、诙谐的谈吐、快活的笑声，确实令人叹服。"},{"id":"443","stars":"★★★★★","title":"论述《红楼梦》在人物塑造上的艺术成就","body":"《红楼梦》文学创作上的新境界和巨大成功，突出地表现在塑造出了成群的性格鲜明而又富有社会内蕴的人物形象。总体来看，《红楼梦》在人物塑造上的艺术成就，主要表现在以下方面：\n\n一、注重真实性\n\n《红楼梦》写人物“打破了历来小说窠臼”，书中的人物都是曹雪芹就自己对现实世界的感受、体验而塑造出来的真实的人物，现实怎样就写作怎样，不美化也不丑化。即便是占据着小说情节的中心地位、体现着他观照世界的心灵的贾宝玉，虽带有浓重的意象化的特点，也没有成为完全理想化的人物，他也还没脱尽富家公子的习性。书中的人物都是现实世界中某种人物的真实的写照，反映那种人物的真实面貌。\n\n二、注重表现人物个性\n\n由于《红楼梦》中的人物是“真的人物”，所以人各一面，不仅不同身份、境遇的人物性格不同，即便身份、境遇相同相近的人物，也各有其自己的性情，行事中表现出不同的价值取向和人生态度。如同是怡红院的丫鬟，袭人的温顺老诚，博得主子的信任；晴雯的任性而为，无所顾忌，招致了谤毁，重病被逐。她们各自的性情也有着真实的社会内涵，显现出不同类型女性的不同遭遇，因而具有不同的典型意义。\n\n三、注重人物形象多面性\n\n《红楼梦》打破了以前小说类型化、概念化的写法，人物不再是或善或恶的某种单一素质的载体和道德观念的传声筒，而是如同现实社会中的真实的人，保持了社会中人的个体的鲜活性和多面性。一些主要人物性格有着多个侧面的，乃至是美丑互渗的表现，成为小说中的“圆型人物”，真实鲜活的人物。如小说从生活的多个侧面，写出了王熙凤这样一个美丽聪明的时善时恶、时而爽朗时而阴险、时而温良时而狠毒的贵族管家女人的形象，写出了一个罕见的，复杂得令读者难以简单地判定其美丑的人物。\n\n四、巧妙运用对比手法\n\n《红楼梦》中众多的人物是处在贾府内外的偌大的关系网中的，也自然形成了不同性质的系列，而作者更为突出的优点是着意于人物之间的相互映照，互为补充，生发出更为丰富、深刻的意思。读者最容易看出林黛玉和薛宝钗的比照，小说正是通过两种背景、两样性情的两位聪明美丽的女子的两种结局，显示出封建婚姻的荒谬。除了从整体上形成对比，如黛玉与宝钗，晴雯与袭人，王熙凤与李纨，在细节描写中亦以比较手法突出各个人物的个性。\n\n五、注重人物出场艺术，先声夺人\n\n《红楼梦》以精彩的人物出场艺术，给读者最强烈的第一印象，一些重要人物的出场，大都集中在第三回里，除薛宝钗、史湘云，余下的几乎都是在这一回里出场的，而且人物一出场，就被赋予鲜明的个性，如贾宝玉一出场，通过他为黛玉取字“颦颦”、问黛玉是否也有玉，以及由此引发的第一次“摔玉”等一系列“似傻如狂”“偏颇乖张”的语言行动，表现了他与众不同的性格特点。\n\n六、在激烈矛盾中塑造人物\n\n《红楼梦》为表现人物性格特点，往往把人物置于重大矛盾冲突之中或重大事件的发展过程之中。例如写王熙凤，首先写她在秦可卿丧事中协理宁国府，以此表现她的“杀伐决断”“威重令行”的才干和逞强好胜的心理；继而以她在铁槛寺害死守备之子和张金哥两个年轻人，坐享三千两银子，构成她一生中骇人听闻的恶迹之一，进一步表现她“我说要行就行”的狂傲和贪婪。此外，晴雯和鸳鸯的反抗，尤三姐的刚烈等等性格特点，都是在激烈尖锐的矛盾冲突中刻画成功的。\n\n七、反复皴染，强化性格\n\n《红楼梦》为强调人物的某种重要性格特点，又往往采用有如中国绘画中的“皴”法，即在不同的条件下，以不同的形式“重复”表现某种性格特点。例如宝玉认为“女儿是水做的骨肉”，毫不客气地对待劝他进取功名的人，以及摔玉、砸玉等等行动，都在作品中“重复”出现过。就是王熙凤以银子的话题与贾母开玩笑，也写过不止一次。这样“重复”的结果，就是使某一性格特点得到加深、加厚、加重。\n\n八、通过多种形式的侧面描写表现人物性格\n\n有时，《红楼梦》通过对人物居室的描绘突出人物性格，如写院子里“凤尾森森，龙吟细细”“湘帘垂地，悄无人声”，绿纱窗已旧得褪了颜色，室内案上设着笔砚，书架上是“满满的书”，这里的主人只能是林黛玉。侧面描写的另一种手法，是通过别人的叙述来进行的。王熙凤性格中的一些很重要的特点，就是通过周瑞家的和小厮兴儿的介绍得到鲜明的表现。其他如宝玉等人的性格，也常常从别人的口中说出。而由“旁观者”说出，更显得真实而自然。\n\n九、注重人物心理描写\n\n《红楼梦》的心理描写富有民族风格。它不像十八、十九世纪的外国小说那样，冗长地描述心理“过程”，而是以点染的手法，写出一个个精彩的心理“场面”，传达出特有的神韵。这种以一颦一笑，一言半语，一个动作，一件小礼物，一诗一画来表现人物心理活动的手法，就是中国传统美学所追求的写意、传神，为读者进行创造性欣赏提供了广阔的空间。当然，《红楼梦》描写人物心理活动，也并不排除对心理过程的描述，特别是写王熙凤的心理，就往往以“自白”的形式，表现了心理活动的过程，这显然与王熙凤“机关算尽”的性格是协调一致的。","keywords":"真实性 表现人物个性 人物形象多面性 对比手法 出场艺术 激烈矛盾中塑造人物 反复皴染 侧面描写 心理描写","note":"《红楼梦》在人物塑造上有着极高的艺术成就，塑造了一系列个性鲜明的人物形象。而曹雪芹取得这一艺术成就，离不开对传统人物塑造手法的革新，如塑造真实人物、圆形人物这些，也离不开对传统人物塑造手法的继承，如反复皴染、先声夺人这些。正是在批判中继承传统小说艺术，曹雪芹才取得了如此高的成就。"},{"id":"444","stars":"★★★★★","title":"试分析《红楼梦》的叙事艺术（26云南大学）","body":"《红楼梦》对小说传统的写法有了全面的突破与创新，它彻底地摆脱了说书体通俗小说的模式，极大地丰富了小说的叙事艺术，对中国小说的发展产生了深远的影响。《红楼梦》的叙事艺术，主要体现在以下方面：\n\n一、写实与诗化相融合的叙事风格\n\n《红楼梦》做到了写实与诗化的完美融合：既显示了生活的原生态又充满诗意朦胧的甜美感，既是高度的写实又充满了理想的光彩，既是悲凉慷慨的挽歌又蕴蓄着青春的激情和幽深的思考。具体表现在以下方面：\n\n（一）在现实基础上融入人生体验，自觉创造诗的意境\n\n曹雪芹的《红楼梦》直接取材于现实社会生活，渗透着作者个人的血泪感情。作品“如实描写，并无讳饰”，保持了现实生活的多样性、现象的丰富性。但与严格的写实小说不同的是，作者是以诗人的敏感去感知生活，着重于表现自己的人生体验，并自觉地创造一种诗的意境，这使作品婉约含蓄。它极写人物心灵的颤动、令人参悟不透的心理、人生无可回避的苦涩和炎凉，让读者品尝人生的况味。整部小说雄丽深邃又婉约缠绵，把中国古代小说从俗文学提升到雅文学的品位，成为中国小说史乃至整个中国文学史上的奇葩。\n\n（二）借景抒情，移情于景，形成空灵、高雅、优美的风格\n\n《红楼梦》借景抒情，移情于景，从而创造出诗画一体的优美意境，把作品所要歌颂的爱情、青春和生命加以诗化，唱出了美被毁灭的悲歌。当黛玉被无意中关在怡红院外，独自在花荫下悲戚之时，那附近柳枝花朵上的宿鸟栖鸦飞起远避，不忍再听。移情于景，把黛玉那难以言传的苦情愁绪，淋漓尽致而又含蓄委婉地表达出来。作者将诗化的山水和人物的精神面貌相互融合，创造出许多优美的意境。比如黛玉葬花时的飞燕飘絮，衬着落花流水，宝黛在沁芳闸同读《西厢》时的落红阵阵，衬着白瀑银练。诗境入画，画中有诗，从而使人物更添神采，景物更具气韵，作品的叙事由于渗入了抒情因素而具有一种空灵、高雅、优美的风格。\n\n（三）运用象征手法，具有含蓄朦胧的特征\n\n象征手法的运用，引领读者伴随弦外之音，去参透人生的奥秘，也使《红楼梦》像诗一样具有含蓄、朦胧的特点。《红楼梦》里的象征除一般的观念象征，如用翠竹象征黛玉的孤标傲世的人格之外，更有创造性的是整体象征和情绪象征。\n\n整体象征如石头，既是石又是人的双重含义，造成了小说双重层次的艺术世界：一个是以人间故事为代表的写实的具象世界，一个是以石头阐明的意象世界，两者的复合和交织，便使作品所提供的美学启迪意义呈现出多义性。\n\n情绪象征如三十六回宝玉在午睡时的梦中喊骂，不仅表现出宝玉、宝钗、黛玉和湘云之间微妙的感情纠葛，而且预示着宝玉和宝钗“纵然是齐眉举案，到底意难平”的婚姻悲剧。\n\n（李凡说：南帆在《论小说的象征模式》〔《小说评论》1987年第2期〕一文中指出，精神分析学说在释梦中认为，梦是一种愿望的满足，这些愿望寻找到一批相应的意象作为展现自身的现实对象。因此，梦乃是将人们心中隐念变成知觉的形式，尤其是视觉形象。这已经足以令人想到情绪的象征-将某种情感或意绪寄寓于特定的意象，这不也同样在一种表现中得到满足吗？情绪的象征不也正是将情感意绪转为视象吗？这使梦与情绪的象征都共有这种特征，显意和隐意。它们都曾以某种明显可见的意象作为替代物，从而化装似地喻示着另一种情感内容。这使两者都共同包括了重要的象征关系。在潜意识中汇合时，情感、意绪与意象之间的相互对应也同样遵循了一定的规律，尽管批评目前对于这个规律所知甚少。）\n\n（四）将诗词融入情节与人物塑造之中\n\n《红楼梦》中叙述人的诗词，不光是为了抒发作者的情怀，而且是为了丰富和推动情节。红楼诗词融入情节（诗词即情节）必然给叙述带来诗意。诗化于情节，带来情节的诗化，作用于读者的则是诗性的美感。同时，曹雪芹在描写人物性格的发展过程中，常常自觉不自觉地以诗词、骈文等来突显和点化，既使人物栩栩如生，又使描绘渗入了感情。以人物自己作的诗来刻画人物自己的个性，这是《红楼梦》的创造。《红楼梦》中的人物，特别是红楼女儿能写诗，能起诗社、限题吟诵，这本身就具有诗意。诗，净化了红楼女儿的品格，表现了她们的才气、灵气。\n\n二、浑然一体的网状结构\n\n曹雪芹比较彻底地突破了中国古代小说单线结构的方式，采取了多条线索齐头并进、交相联结又互相制约的网状结构。\n\n（一）三个世界构成的立体交叉重叠的宏大结构\n\n青埂峰下的顽石由一僧一道携入红尘，经历了人间的悲欢离合，又由一僧一道携归青埂峰下，这在全书形成了一个严密的、契合天地循环的圆形的结构，形成了一个神话世界。在这个神话世界的统摄之下，以大观园这个理想世界为舞台，着重展开了宝、黛爱情的产生、发展及其悲剧结局，同时，体现了贾府及整个社会这个现实世界由盛而衰的没落过程。从爱情悲剧来看，贾府的盛衰是这个悲剧产生的典型环境；从贾府的盛衰方面看，贾府的衰败趋势促进了叛逆者爱情的滋生，叛逆者的爱情又给贾府以巨大的冲击，加速了它的败落。这样全书三个世界构成了一个立体的交叉重叠的宏大结构。\n\n（二）通过伏笔与照应使情节转换连贯顺滑，浑然一体\n\n《红楼梦》采用“草蛇灰线，伏脉干里”，“注此写彼，手挥目送”的方法，使每一个情节具有多方面的意义，故事和画面之间的转换非常自然，不着痕迹。例如，周瑞家的送宫花介绍了宝钗不爱花儿粉儿的性格；她见到了香菱，交代了葫芦案里英莲的下落；见到惜春与智能儿，伏下了惜春出家的结局；最后送到黛玉处，黛玉多心而尖刻的性格跃然纸上。不但一个情节起多方面的作用，而且情节之间的转换又非常自然。情节转换和运转就如同百道溪流，时分时合地顺着一个方向蜿蜒流泻，只见奔流而不见生硬、中断或牵合之处。\n\n（三）大小事件错综结合着写\n\n在《红楼梦》中，小矛盾凝聚成大矛盾，小事件积累成大事件，一段平静生活之后，就有一个浪头打来，虽然都是日常的生活，但仍是波澜起伏、情趣盎然。在宝玉挨打之前，先写了茗烟闹书房、叔嫂逢五鬼、宝玉诉肺腑、蒋玉菡赠茜香罗、金钏投井、贾环告发等，使宝玉挨打成为集结了许多矛盾的大事件。挨打之后引起袭人进谗言、晴雯送手帕、黛玉题诗、宝钗送药、薛家兄妹争吵等一系列事件，展开了宝玉与贾政之间不同生活道路的冲突，揭示了嫡庶之间、夫妻之间、母子之间的矛盾，刻画了许多人物的性格，推动了情节的发展和生活场景的转换。\n\n（四）精巧的“微观结构”\n\n《红楼梦》十分讲究“微观结构”的精巧，有的从一“点”引出几条“线”，最后又有归结；有的在直线发展的情节中，以“插入”“截断”的方式，形成“横云断岭”；有的明写与暗写相交错；有的又一支笔同写两家事，构成复线发展，平行推进。\n\n三、叙事视角的变换\n\n（一）采用叙事人叙事方式\n\n《红楼梦》虽然还残留了说书人叙事的痕迹，但作者与叙述者分离，作者退隐到幕后，由作者创造的虚拟化以至角色化的叙述人来叙事，在中国小说史上第一次自觉采用了颇有现代意味的叙述人叙事方式。如在小说开头叙述者说明写作缘起、真幻两重本事、创作的写实原则，介绍主要人物和预示其各自的命运，分别由“作者自云”、石头自况、僧道评说、旁观者冷子兴演说叙出，叙述者成了一位述而不作的叙述者。这种叙事方式的转变，既便于作者尽量避免直接介入，又便于作者根\n\n据不同的审美需要和构思来创造不同的叙述人，有利于体现作家的个人风格，有利于展示人物的真实面貌，深入人物的内心世界，进行细致而深刻的心理描写，达到人物个性化的目的。\n\n（二）多角度复合叙事\n\n《红楼梦》在叙述角度上创造性地以叙述人多角度复合叙述，取代了说书人单一的全知角度的叙述。叙述人叙述视点的自由转换进一步改变了传统的叙事方式。例如刘姥姥三进荣国府，从一个社会底层人物眼中来观察贵族之家的奢华生活，引起了她的强烈感受和对比。作者在运用石头的全知叙事之中，融入了刘姥姥的限知视角，把握了刘姥姥初进荣国府的整个过程，又细致地把刘姥姥独特的观察感受直接传达出来。这样把全知叙事和限知叙事结合起来，灵活地运用参与故事者的限知叙事，把作品写得更加真实，人物性格更为鲜明。\n\n（三）叙述者评价隐匿\n\n《红楼梦》的叙述者尽量隐藏在幕后，不直接出面发议论，评判是非，也不明白说出人事背后的隐情，以前小说的叙述者的种种职能，大都转交给所叙人物的话语、感觉，或隐伏在所叙人事的共时或历时的映照中，其中还有着意味蕴藉的反差。第三十二回里金钏含辱投井，王夫人郁郁不乐，薛宝钗适时来劝慰，提出多赏二十两银子以尽主奴之情的办法，消解了王夫人的郁闷，是褒是贬，难以轻断。\n\n四、个性化的文学语言\n\n《红楼梦》作为长篇通俗小说，其语言既通俗晓畅，又委婉细腻，这表现在两个方面。一是叙事的语言，一是写人的语言。尤其是写人的语言，一向被誉为典范。《红楼梦》的作者是语言大师，他继承我国文学语言的优良传统并加以丰富和发展，对语言的使用达到了炉火纯青的地步。\n\n（一）用词准确生动、新鲜传神，具有立体感\n\n《红楼梦》以北方口语为基础，融会了古典书面语言的精粹，经过作家高度提炼加工，形成生动形象、准确精练、自然流畅、有生活气息和感染力的文学语言。《红楼梦》的叙述语言是接近口语的通俗浅显的北方官话，较之前的白话小说，进一步摆脱了话本叙事的语言程式格调，它用词准确生动、新鲜传神，富有立体感。更加自然、鲜活、深细入微，大事繁杂却能有条不紊，脉络清晰；细节真切如绘，声情毕现。如“诉肺腑心迷活宝玉”一节，写贾宝玉和林黛玉在相爱而不能沟通又不能不沟通的情况，两人的痛苦情状和语意幽微的沟通至真至切，感人至深。\n\n（二）人物语言个性化\n\n《红楼梦》中人物语言能准确地显示人物的身份和地位，能形神兼备地表现出人物的个性特征。如林黛玉心细多疑，说话往往尖刻，语中带刺；薛宝钗心地平和而有心计，说话得体圆通；史湘云憨厚，说话爽直烂漫；探春精明干练，说话得理不让人。贾府内外的男人们的语言，则更有由身份、地位、性情而定的文野雅俗之别。\n\n《红楼梦》对主要人物的语言，既注意写出其主体特征，又适应多样化、复杂化的性格因素，如实地写出这种主体因素在不同情境下的不同表现，不同的语言色彩。如贾宝玉平时的语言于几分痴呆之中往往带有奇异、警策之语；而在他酒醉之后，则简直变得颠三倒四，忽此忽彼。黛玉平时语言尖利，但向宝玉敞开心扉时，却情意绵绵，真挚动人。\n\n（三）符合人物个性的诗词\n\n《红楼梦》里的诗词，也是用于刻画人物性格的。这些诗词的作用，不是作为著书者自己的创作，而是作为书中人物的创作，也即是著书者代书中人物的创作，这就必须符合每个人物的性格。《红楼梦》中人物所作的诗词都有这个特色。黛玉的葬花之辞，宝钗的咏絮之诗，无不体现其人的才情和风格。至于全书之中，“那文章的旖旎和缠绵”，随处可见。","keywords":"写实与诗化相融合 自觉创造诗的意境 借景抒情 移情于景 象征手法 含蓄朦胧 诗词融入情节与人物塑造浑然一体的网状结构 三个世界 立体交叉重叠的宏大结构 伏笔与照应 连贯顺滑 浑然一体 大小事件错综结合 微观结构叙事视角 叙事人叙事方式 多角度复合叙事 叙述者评价隐匿 个性化的文学语言 准确生动 新鲜传神 人物语言个性化 符合人物个性的诗词","note":"这部分内容十分庞杂，但在考查中出现的频率非常之高，大家需要重点掌握。这部分中涉及的四个小点，都有可能被单独拿出来考查，尤其是写实与诗化相融合（也即《红楼梦》的诗体小说性质）这一点。此外，有些学校会考查《红楼梦》的艺术成就，回答这样的题目需要将这道题与前一道题结合起来。《红楼梦》这部小说，可以说是代表了中国古典小说的最高成就，所以才会有“红学”，所以才会在考查中高频出现，大家需要重视起来。"},{"id":"445","stars":"★★★★","title":"试论《三国志演义》与《红楼梦》在叙事艺术上的不同（26南开大学）","body":"一个成书于长篇章回小说的巅峰期，因此，二者在叙事艺术上必然表现出许多差异，具体有以下几个方面：\n\n一、在叙事视角上，《三国志演义》以第三人称全知视角为主，而《红楼梦》则是以第三人称限知视角为主\n\n作为中国古代早期章回体长篇小说，《三国演义》在叙事方式上是以全知全能为主。全知全能叙述方式的情节场面叙述，往往直接由讲述者以第一人称方式出面，以无所不知的姿态告诉读者（听众）所有的有关内容。如《三国志通俗演义》卷一《祭天地桃园结义》写刘备出场一段使用的是第三人称全知视角，\n\n限知限能的叙事却将这一任务交给书中的人物去完成，借用人物的眼和口来描述环境，交代背景和介绍人物。《红楼梦》便熟练地采用了这一手法。就全书范围而言，无论是情节场面的进展，还是人物性格的交代，《红楼梦》的作者都最大可能地使用了限知叙事的方式。作者以几个不同人物的视线来观察同一事物，使对象在读者的印象中获得更为立体的感觉。这就是脂砚斋所总结的“皴染法”。比如关于贾府的介绍，作者就将自己隐藏起来，先借冷子兴之口点出要害，再借黛玉、宝钗及刘姥姥等人的感官来层层铺衍，让读者跟随书中人物的感受，去一步步地走进贾府的大门深处。\n\n二、在叙事结构上，《三国志演义》使用的是以时间为序的线性结构，而《红楼梦》采用的是多线并行的网状结构\n\n《三国志演义》在叙事时，将各个空间分头展开的故事化成以时间为序的线性流程。全书约可归纳为五条线：以汉亡为引线，以晋国一统天下为终局，中间的主线是魏、蜀、吴三方的兴衰。这几条线，此起彼伏，交互联络，建构成一个完整的艺术整体。在某种意义上说，小说用浓墨重彩所描绘的隆中决策就是全书的主脑，“其馀枝节，皆从此生”。这样的艺术构思，使全书的结构既宏伟，又严整；看来头绪纷繁，却又脉络分明。\n\n《红楼梦》在叙事时，比较彻底地突破了中国古代小说单线结构的方式，采取了多条线索齐头并进、交相联结又互相制约的网状结构。书中神话世界、现实世界、爱情世界三个世界构成的立体交叉重叠的宏大结构，采用“草蛇灰线，伏脉千里”，“注此写彼，手挥目送”的方法，使每一个情节具有多方面的意义，故事和画面之间的转换非常自然，不着痕迹。小矛盾凝聚成大矛盾，小事件积累成大事件，一段平静生活之后，就有一个浪头打来，虽然都是日常的生活，但仍是波澜起伏、情趣盎然。\n\n三、在叙事语言上，《三国志演义》使用的是讲述性的浅近文言，仍保留着话本叙事语言的格调，而《红楼梦》则是纯正的文学语言，摆脱了话本叙事在语言上的影响\n\n《三国志演义》所用的语言是“文不甚深，言不甚俗”的浅近文言，这有利于营造历史的气氛；有时直接引用一些必要的史料，也能使读者“易观易人”，雅俗共赏，形成了一种适用于历史演义的独特的语体风格。它从讲史而来，故偏于叙述而少描写，其叙述语言以粗笔勾勒见长，简洁、明快、生动、有力，洋溢着一种阳刚之气。\n\n《红楼梦》以北方口语为基础，融会了古典书面语言的精粹，经过作家高度提炼加工，形成生动形象、准确精练、自然流畅、有生活气息和感染力的文学语言。《红楼梦》的叙述语言是接近口语的通俗浅显的北方官话，较之前的白话小说，进一步摆脱了话本叙事的语言程式格调，它用词准确生动、新鲜传神，富有立体感。更加自然、鲜活、深细入微，大事繁杂却能有条不紊，脉络清晰；细节真切如绘，声情毕现。如“诉肺腑心迷活宝玉”一节，写贾宝玉和林黛玉在相爱而不能沟通又不能不沟通的情况，两人的痛苦情状和语意幽微的沟通至真至切，感人至深。\n\n综上所述，《三国志演义》和《红楼梦》在叙事上的差别，正是早期长篇章回小说与成熟的长篇章回小说之间的区别，通过对这二者的比较，可以一窥中国古代长篇章回小说的发展。","keywords":"全知视角 限知视角 线性结构 网状结构 浅近文言 纯正的文学语言","note":"这道题的作答思路还是比较明确的，抓住《三国志演义》和《红楼梦》这两部作品的叙事艺术进行比较就可以了。不过，在具体答题时，要注意审题，明确题目让大家重点讨论二者之间的差异。并且，这两部作品都是相对来说比较重要的作品，涉及的知识点也比较多，要注意梳理。"},{"id":"446","stars":"★★★★","title":"试分析《红楼梦》的地位与影响","body":"《红楼梦》在中国文学史上具有崇高的地位和深远的影响，主要表现在以下几个方面：\n\n一、中国文学古今演变的过程中的里程碑式的作品\n\n在中国古代文学的领域里，就写实主义成分的进展、白话运用的纯熟自如、结构的完整、严密而言，《红楼梦》都达到了登峰造极的地步，并都可以成为新文学的重要遗产。“五四”新文化思潮泛起，《红楼梦》的悲剧内涵和自传性的如实描写的审美特征，被文化人意识到并揭示出来，新小说的作家无不喜读《红楼梦》，受到《红楼梦》的思想和作法的启迪和滋润，创作中受到有形或无形的牵引，写社会底层平凡人生的不幸，爱情婚姻遭遇的痛苦，自叙传式叙事的内向化。像以梦的形式来写人的潜意识这样的手法，既为新文学所常用，在《红楼梦》中也已有其先声。同时作品所反映的个人与环境的剧烈\n\n冲突、个性惨遭扼杀的痛苦、家族制度与礼教对人性的摧残，则又都与新文学所蕴含的现代性相通。连巴金《家》里的少爷觉慧与丫头鸣凤的恋爱的被毁灭，也容易使人联想起宝玉与丫头晴雯的爱情悲剧，尽管晴雯远比鸣凤泼辣。\n\n二、出现了一系列续书\n\n《红楼梦》在传抄时期便显示出了它非凡的文学魅力，刊行后迅速引起了阅读热潮，社会上传有“开口不谈《红楼梦》，此公缺典正糊涂”之戏语，题咏、评点相继不绝，还出现了一批续书，有逍遥子的《后红楼梦》、秦子忱的《续红楼梦》、陈少海的《红楼复梦》、海圃主人的《续红楼梦》、归锄子的《红楼梦补》、临鹤山人的《红楼圆梦》等。由于续作者思想庸俗，境界不高，艺术上荒诞不经，十分拙劣，它们与《红楼梦》相比，真有天壤之别。但是，这些续书的大量涌现，从另一方面说明《红楼梦》本身的巨大成就和艺术魅力。\n\n三、成为文化娱乐文体的重要改编对象\n\n《红楼梦》广泛传播，为人所爱读，从而成为文化娱乐文体的重要改编对象进入了书场，搬上了舞台。据不完全统计，清代根据《红楼梦》的人物故事改编成的传奇、杂剧有二十多种；子弟书的重要作者韩小窗的《黛玉悲秋》是脍炙人口的名段。近世京剧和多种地方戏演出的红楼梦戏多达数百部，梅兰芳的《黛玉葬花》、荀慧生的《红楼二尤》，是京剧剧目中的精品。当代越剧《红楼梦》凝练了小说的悲剧情节，具有强烈的感人效果。电影、电视连续剧多次改编《红楼梦》，有声有色的图像传播到千家万户，风靡整个华人世界。\n\n四、促进了白话长篇世情小说的大量出现\n\n《红楼梦》对文学创作的影响深巨而幽微，它的巨大成功更加显示了长篇白话小说写实叙事的巨大功能，遂引起了众多作者进行白话长篇世情小说创作的兴趣。在它之后，出现了模仿《红楼梦》笔法的写才人与优伶、妓女的缠绵情意的狭邪小说，有《品花宝鉴》《青楼梦》《花月痕》等，再后来又繁衍出大量的鸳鸯蝴蝶派小说。","keywords":"文学古今演变的过程中的里程碑式 一系列续书 文化娱乐文体重要改编对象 白话长篇世情小说大量出现","note":""},{"id":"447","stars":"★★★★","title":"试论述《西厢记》《牡丹亭》与《红楼梦》在处理爱情题材上的不同","body":"在我国戏曲史上，《西厢记》《牡丹亭》是两部家喻户晓的爱情喜剧，而《红楼梦》讲述的是一个哀怨动人的爱情故事。这三部作品在爱情描写方面，随着时代的发展而有所发展，因而显示出一定的差异。总体而言，《西厢记》《牡丹亭》与《红楼梦》三者在处理爱情题材上的不同主要表现为：\n\n一、爱情的基础和产生方式不同\n\n《西厢记》和《牡丹亭》这两部作品在爱情的进行过程中，都有性爱这一层关系维持着。这多少也表现了作者对以男才女貌、一见钟情为前提的爱情的可靠性和牢固程度的怀疑。\n\n王实甫的《西厢记》主张婚姻要建立在爱情的基础上的婚姻爱情观。由于作者思想上仍有时代局限性，所以笔下的爱情故事仍不可避免地打上封建思想的印记。崔莺莺和张君瑞爱情的产生就是以男才女貌为前提的。\n\n《牡丹亭》的杜丽娘与柳梦梅的爱情尽管也还是在佳人配才子的模式里进行，但杜丽娘在追求爱情自由的同时，也追求着个性的解放。杜、柳两人的爱情产生是以才子佳人加个性解放为基础的。\n\n在《红楼梦》里，曹雪芹则打破了男才女貌、一见钟情的俗套。比起《西厢记》《牡丹亭》两部作品里描写的爱情，宝黛的爱情更注重心灵上的交流与沟通。这样的爱情也就更符合人的需要。建立在相知的基础上的爱情比一见钟情式的爱情更高了一个层次。所以在爱情进行过程中，宝、黛并不需要借助于性爱的维系，却仍然可以达到生死相随的程度。\n\n二、对爱情故事结局的处理不同\n\n由于受到传统审美心理的影响，《西厢记》和《牡丹亭》都被作者安排了大团圆的结局。而在《红楼梦》里，作者彻底打破了皆大欢喜的大团圆结局的传统定法，让相爱的两个人，一个为情而死，一个为情而遁入空门，以悲剧来结束整个故事，这比起大团圆的结局更具有震撼人心的力量。\n\n三、作者赋予爱情的具体内涵不同\n\n《西厢记》《牡丹亭》蕴含的是对人们追求爱情的褒奖。《西厢记》《牡丹亭》里写的爱情，仅仅只是当事人自己的个人事情，只写了爱情的本身，与当时的社会现实环境联系不大。\n\n《红楼梦》里蕴含丰富深刻的社会人生内涵。在《红楼梦》里，宝黛的爱情却与贾府的衰亡史息息相关，互为因果。可以说，曹雪芹把对爱情生活的描写与对社会现实的反映密切地结合在一起，赋予了爱情更深刻的社会内涵。在爱情悲剧的表层下面还有社会悲剧，时代悲剧，生命悲剧等深层内涵。\n\n总之，《西厢记》《牡丹亭》《红楼梦》三部作品在爱情的描写上，是随着不同时代的作者对爱情及人的个性觉醒等的理解程度的不同而有所发展的。尤其是《红楼梦》中，对爱情的描写，可以说是对古代文学中爱情题材作品逐渐凝固下来的描写方式的一个超越。","keywords":"爱情基础 产生方式 结局处理 爱情内涵","note":"本题为文学考研的重要考查知识，《西厢记》《牡丹亭》和《红楼梦》同是具备爱情元素的经典作品，其在表达爱情这一题材上既有相同之处，也有不同的点。像这种分析某些相似题材作品异同的题目在考查中出现得越来越多了，所以类似的作品我们要多留意一下。"},{"id":"448","stars":"★★★","title":"试分析《红楼梦》中诗词的作用","body":"曹雪芹为作品中的人物代拟的诗词，熔化在小说故事情节设置、人物性格刻画和心理历程的描绘之中，是小说不可或缺的有机部分。这些诗词的作用，主要表现在以下方面：\n\n一、代拟性格化的诗词，凸现典型人物个性\n\n《红楼梦》是一部彪炳千古的杰出小说，全书出场人物达五百余人，上至皇妃显贵、巨贾政要，下至村妪奴仆、僧侣尼姑，三教九流，形形色色，无所不包。如此众多的人物在曹雪芹的笔下，个个惟妙惟肖、生动传神，既得益于作者生动传神的细节刻画和历历如绘的典型环境的描写，又归功于作者为其代拟的肖其心口、吐其心声的诗词和在特定情境下题咏的对联、匾额、谜语。而这恰恰是《红楼梦》超迈古今、历久弥新的重要因素之一。曹雪芹在《红楼梦》中为他钟爱的少女和他憎恶的“须眉浊物”所创作的大量诗词，既寄寓了自己的情感、理想，又入木三分地活现了他们的灵魂和世相。如在小说第一回，他让贾雨村对月即兴作了两首诗、吟了一副对联，借此逼真传神地再现了这位落魄的穷书生渴求功名利禄、飞黄腾达、贪恋女色的心灵图画。\n\n二、借题发挥褒贬是非，以古讽今伤时骂世\n\n在《红楼梦》中，曹雪芹凭着诗人的智慧和才华，巧妙地借人物的吟诗填词、制谜作曲来抒发人物喜怒哀乐的情感，又善于运用这些诗词曲赋、谜语中的典故、历史事件来干预时世，指奸责偻，通过代拟诗词韵文，借题发挥，以古讽今，抨击时政与邪恶。如薛宝钗的《螃蟹咏》，表面上是咏蟹、描绘蟹的特性，实则是以蟹喻人，讽刺斥责那些横行无忌、心机诡秘、善于伪装的政客官吏、政治赌徒的不轨行径。同时也有善意的警戒劝告。\n\n三、营造小说意境，推动情节发展\n\n《红楼梦》将诗词自然地熔化在小说的人物、情节、主旨之中，贯穿在全书庞大复杂的艺术结构中，与叙事的散文完美地结合在一起，成为全书结构的粘合剂与故事情节、人物性格命运发展变化的推进器。大观园的历次诗会、题咏、对额和制谜活动，都是围绕着作品主旨、服务于主旨而匠心经营和安排的，因而成了全书情节链中重要的节点，推动着情节和人物性格命运的发展。既展示了园中青春女子聪明才华和个性特点，也渲染了气氛、营造了作品意境、升华了作品主旨。\n\n四、似谶实真预示结局，含蓄蕴藉耐人寻味\n\n《红楼梦》中的诗词还兼有隐喻人生遭际，预示人物命运归宿的功能与作用。有时曹氏干脆用一首诗词、一首曲、一篇赋，或者是一个灯谜、一幅联语、一条额匾就把人物的性格命运、遭际结局画龙点睛地概括出来了。如《金陵十二钗图册判词》和《红楼梦十二支曲》就是书中各色主要人物命运的总概括和预示。第一回跛道人的《好了歌》与甄士隐的《好了歌解》则是典型的谶语歌谣的双璧，其中的字字句句都有隐喻、预言和象征的意义，对于读者了解作品中人物的命运与归宿是不可或缺的。","keywords":"代拟性格化诗词 凸现人物个性 借题发挥 伤时骂世 营造意境 推动情节发展 预示结局 含蓄蕴藉 耐人寻味","note":""},{"id":"449","stars":"★★★","title":"结合材料，说说《红楼梦》对才子佳人小说的继承和创新，写一篇微型论文（中央民族大学）","body":"至若佳人才子等书，则又千部共出一套，且其中终不能不涉于淫滥，以致满纸潘安、子建、西子、文君，不过作者要写出自己的那两首情诗艳赋来，故假拟出男女二人名姓，又必旁出一小人其间拨乱，亦如剧中之小丑然。且鬟婢开口即者也之乎，非文即理。故逐一看去，悉皆自相矛盾，大不近情理之话，竟不如我半世亲睹亲闻的这几个女子，虽不敢说强似前代书中所有之人，但事迹原委，亦可以消愁破闷；也有几首歪诗熟话，可以喷饭供酒。\n\n-《红楼梦》第一回 甄士隐梦幻识通灵 贾雨村风尘怀闺秀\n\n贾母笑道：“这些书都是一个套子，左不过是些佳人才子，最没趣儿。把人家女儿说得那样坏，还说是佳人，编得连个影儿也没有了。开口都是书香门第，父亲不是尚书就是宰相，生一个小姐，必是爱如珍宝。这小姐必是通文知礼，无所不晓，竟是个绝色佳人。\n\n只一见了一个清俊的男人，不管是亲是友，便想起终生大事来，父母也忘了，书礼也忘了，鬼不成鬼，贼不成贼，那一点是佳人？便是满腹文章，做出这些事来，也算不得佳人。比如男人满腹文章去做贼，难道那王法看他是才子，就不如贼情一案不成？可知那编书的自己塞了自己的嘴。\n\n再者，既说是世宦书香大家小姐都知礼读书，连夫人都知书识礼，便自告老还家，自然这样大家人口不少，奶母丫鬟伏侍小姐的人也不少，怎么这些书上凡有这样的事，就只小姐和紧跟的一个丫鬟？你们白想想，那些人都是管什么的，可是前言不答后语？”\n\n-《红楼梦》第五十四回 史太君破陈腐旧套 王熙凤效戏彩斑衣\n\n曹雪芹在《红楼梦》中对才子佳人小说进行了彻底的解构与重构。这种突破不仅体现在人物形象的塑造上，更深入到叙事模式、主题表达等多个层面。总体来看，《红楼梦》对才子佳人小说的继承和创新，主要表现在以下方面：\n\n一、《红楼梦》继承并革新了传统才子佳人小说的叙事模式\n\n才子佳人小说的作家都是断绝了科举仕途之路的下层文人，是为应对商业化的图书出版而写作的，在这些小说中，才子必定要有才貌双全的佳人为偶，乃至要外出“游婚姻之学”；才女必待才子而嫁，个人和家长乃至朝廷都要试才选婿。作者写的还是他们的“富贵风流梦”，于是其写作便只是在既定的格局中做些细部的变化，旨趣和故事模式基本相类，人物变换了姓名，却是干人一面；人事场景有所不同，却总脱不掉那种才色相慕一小人拨乱一富贵团圆的公式。\n\n在《红楼梦》中，才子佳人小说的核心要素被曹雪芹逐一拆解。宝黛钗的爱情纠葛不再是简单的才子佳人配对，而是融入了复杂的性格冲突与命运抗争。林黛玉的才情不再是为了迎合男性审美而存在的装饰品，而是她独立人格的重要组成部分。传统才子佳人小说中程式化的相遇、误会、团圆等情节，在《红楼梦》中都被赋予了新的内涵。\n\n二、《红楼梦》继承并发展了传统才子佳人小说的人物塑造，尤其是女性塑造方法\n\n虽然才子佳人小说并没有彻底摆脱男才女貌的窠臼，但许多作品已不再完全按“姿色淑令”的标准来塑造女子的形象，而是大大提高了“才”在她们身上的位置，使之成为构成她们人生价值的重要因素。《红楼梦》承继了这一特点，并将女性之才推向了极致。小说塑造人物的艺术高度成熟，女性形象也更为丰富多彩。\n\n不过，才子佳人小说家们太重理想，他们塑造出来的女性也多成了个人理想的化身，缺乏现实生活中女性的激情和血肉，使女性形象失去了生命力。《红楼梦》明显对此做出了突破，比如说林黛玉的形象就突破了传统才子佳人小说中“温柔敦厚”的女性形象定式。她的叛逆、敏感、孤傲构成了一个完整的艺术形象。在与宝玉的感情中，她既是一个深情的恋人，也是一个具有独立人格的知识女性。\n\n三、《红楼梦》继承并发展了传统才子佳人小说的叙事笔法\n\n首先，《红楼梦》中那些神奇色彩以及幻境的描写就受到才子佳人小说的影响。比如，在才子佳人小说《金云翘传》中已有了类似《红楼梦》中梦境的描写。\n\n其次，在有些具体情节、场面的描绘上，《红楼梦》与才子佳人小说也有着极为惊人的相似，比如《红楼梦》第五十七回与《定情人》第五回的描写就存在着一定的相似性。\n\n才子佳人小说对《红楼梦》的影响，还体现在一些具体话语和自然环境的描绘上。如《红楼梦》中贾宝玉曾说：“女儿是水做的骨肉，男子是泥做的骨肉，我见了女儿便清爽，见了男子便觉浊臭逼人！”这种颂扬女子、表达类似意思的话，《平山冷燕》中已经出现。\n\n不过，相较于才子佳人小说，《红楼梦》对这些材料和笔法的运用更加成熟，也更加深刻。同样是描写梦境，相较于《金云翘传》，《红楼梦》中关于太虚幻境的描写，预示着人物以及故事的发展与结局，充满着象征意义；而同样是颂扬女子，《平山冷燕》中的话语只是一种惊叹，在《红楼梦》中则意义更加深刻，成了人物叛逆思想的组成部分，放射出耀眼的光彩。\n\n四、《红楼梦》深化了传统才子佳人小说的主题表达，使其更贴近现实\n\n才子佳人小说多为大团圆结局，这是作家怀才不遇寄希望于作品来表达自己的人生理想使然。借文学作品抒写人生理想固然可以，但如果对理想的描画近乎偏执，乃至于使大团圆结局失去了存在的生活基础，那么干篇一律的大团圆便有了美化现实、粉饰生活之嫌，理想也便成为梦想和空想。\n\n《红楼梦》的作者曹雪芹在这一点上不仅没有因袭才子佳人小说家的创作套路，在反映理想与现实的选择上毅然回归现实，并且在清醒的悲剧意识的支配下，将《红楼梦》创作成一个“悲凉之雾，遍被华林”的悲剧，作品通过对封建社会病态面相的揭露，展现了曹雪芹深刻的社会洞察力。他对科举制度、婚姻制度、等级制度等封建制度的批判，都显示出超越时代的进步性。《红楼梦》无论是反映现实生活的深度还是美学价值的发掘，都远远高出了才子佳人小说，成为当时文坛及中国小说史上的顶峰之作。\n\n总之，《红楼梦》的成功，在于它既继承了中国古典文学的优秀传统，又实现了对传统模式的突破与超越。也正因此，它为中国文学开辟了一条新的道路，成为世界文学史上的不朽经典。","keywords":"解构与重构 叙事模式 富贵风流梦 逐一拆解 人物塑造 女性之才 个人理想的化身 独立人格 叙事笔法 神奇色彩 幻境的描写 具体情节 场面 具体话语 自然环境的描绘 更加成熟 更加深刻 主题表达 大团圆结局 美化现实 粉饰生活 悲剧意识 社会洞察力","note":"首先毫无疑问的是，《红楼梦》这部在中国文学史上占据着重要地位的巨著，并不是凭空出现的，它虽然由曹雪芹写就，但更是中国古代小说时代积累、发展后必然的结果，必然离不开前代小说的积淀。而在这些前代小说中，与其一脉相承的世情小说以及其中的才子佳人小说无疑会给它带来更加深刻的影响。但我们更需要明白，是曹雪芹的更新与创造，才使得这部作品真正成为了经典。总的来看，曹雪芹正是立足于对前代作品的推陈出新，才有了这部皇皇巨著。在具体论述时，可以从叙事模式、人物塑造、叙事笔法和主题表达等方面，结合才子佳人小说与《红楼梦》的特征展开分析。相关论文可以参考刘坎龙《借鉴与创新-才子佳人小说对＜红楼梦＞影响举隅》、王颖《＜红楼梦＞对才子佳人小说的借鉴与超越-从大团圆结局到“万艳同悲”的悲剧意识》"},{"id":"450","stars":"★★★★","title":"试分析中国古代小说与中国古代戏曲的关系（26北京大学）","body":"中国古代小说与戏曲有如两株盘根错节、枝枝覆盖、叶叶交通的大树，同样植根于社会生活和土壤，汲取着民间艺术的养料，成为异派同源的姊妹艺术。二者的关系，可以从以下方面进行梳理：\n\n一、中国古代小说与中国古代戏曲的区别\n\n中国古代小说和戏曲存在着区别，这是显而易见的，因为小说和戏曲毕竟分属两种文学体裁，是两种不同的艺术形态，在外在特征上就有非常明显的区分之处。比较明显的就有以下方面：\n\n（一）叙事方式上的不同\n\n从小说和戏剧的叙述方式来看，小说是“叙述体”，小说文本是叙述者的话语，其中总有一个或隐或显，置身于故事之外的叙述者。而戏剧是代言体，戏剧“代言体”的叙事方式包括剧作家代人物立言、表演者代人物言说、行当代剧作家言说、剧中人物代剧作家言说，以及剧作家巧借内云代剧场观众言说。\n\n（二）语言运用的不同\n\n在语言运用方面，小说更具“想象性”，戏剧更具“直观性”。\n\n首先，小说的文学意味更浓，它既是现实生活的反映，也具有一定的独特性。作家创作发挥的余地更多，因此常常使用描述性的语言，无论是人物形象塑造还是故事情节的描述，都要靠读者在读书时凭借自己的想象来感悟，而不是直观展现在读者面前。\n\n戏剧的剧本虽然也是以文字为载体，但是戏剧毕竟是表演出来的艺术，要在舞台上给观众视觉及听觉上的美观，这就要求戏剧的表现形式上应呈现出“直观性”。比如元杂剧角色分为旦、末、净、杂，各个角色之间有着鲜明的对比。\n\n二、中国古代小说与中国古代戏曲的联系\n\n（一）影响二者成长的因素有相同之处\n\n探究影响中国古代小说和戏曲成长的共同因素，大致有以下方面：\n\n（1）史传的影响\n\n追溯叙事文学的历史渊源，对“事”的叙述，西方出自史诗，中国出自史传。“史”是我国最早产生和成型的叙事体式，奠定了叙事理论的基础，造成了小说、戏曲取材的历史化倾向。不仅如此，史传还为小说、戏曲的评点提供了最高典范。如金圣叹就是将《三国》《水浒》《西厢》与《左传》《史记》同作为叙事文学加以品评的，可见在他看来，史传是评价小说、戏曲成败得失的重要标准。\n\n（2）传奇的影响\n\n中国的传奇文学在叙事文学的发展中具有关键的作用。首先，在传奇中，人们总是力图利用想象在虚化的充满生气、光怪陆离的世界里自由抒发备受压抑的感情，反映自己的理想，启发人思考。这种活跃的不受限制的想象，对于小说、戏曲的虚构想象产生了巨大的启迪和鼓励作用。其次，传奇文学产生之前的多种叙事文体，或者不具备严格意义上情节的性质，或者过于粗略，而在传奇中“情节”大大强化，为叙事文学提供了必不可少的要素，这是传奇对叙事文学的一个贡献，也是叙事文体趋向成熟的主要标志。\n\n（3）“说话”的影响\n\n讲故事的形式源于上古，成熟于宋元。就叙事性而言，“说话”是时间艺术，与小说有着共同的内在特征；就表演性而言，“说话”又含有空间艺术的表现方法，与戏曲有着共同的内在特征，正是这二者的结合，不仅使说话伎艺具有时空艺术的特征，也为小说、戏曲的直接借鉴提供了充裕的条件。说话一方面为小说、戏剧提供了丰富的题材，另一方面也提供了可资借鉴的艺术经验。\n\n（二）艺术表现上具有相同之处\n\n在艺术上，古代小说与戏曲相通之处颇多，具体有以下方面：\n\n（1）流动的线性结构\n\n中国古代小说、戏曲结构艺术共同遵循着线性原则。中国古代戏曲是叙事文学与抒情文学的统一体。抒情文体的特征是要将人物本来关闭的内心世界打开并公之于众，所以每一种细微的情感都必须经过放大尺寸、放慢节奏的加工，这就必须影响戏剧的复杂性；叙事文体的特征是按时间顺序展开事件进程，每一个行为的逐次安排，就成为戏剧主线的结，二者结合的结果就形成了戏剧的线性结构。\n\n中国古代小说结构的目的，是要把现实生活中纷繁复杂的事件整理为头绪分明的线索，以期明确有力地表现主题。因此不管事件如何错综交织，小说都要通过合理结构使之脉络分明，层次井然，对矛盾的解决也和戏曲一样，要求随起随结。\n\n（2）程式化的思维方式\n\n思维方式的程式化是中国戏曲以及日本、印度等东方戏剧艺术所特有的。戏曲的剧本形式、角色行当、音乐服装、表演手段全面规范性的表现形式一程式，对小说有着不小的影响。这突出反映在人物设置上古代小说有着相对固定的框式。如历史小说一般以忠奸对立将人物划分为两大阵营，在两大阵营中分别安排君主、谋士、战将，通过双方的对抗冲突，达到褒扬\n\n忠臣义士，贬抑奸臣贼子的目的。人情小说，尤其是才子佳人之作中，人物设置的模式化倾向更为明显。戏曲把固定的品类性格赋予生旦净丑诸角色，小说中类型化的人物性格也是辨清各色人等的简便方法。\n\n（3）诗化的语言特色\n\n中国古代戏曲主要通过写情展现人物内心世界对外部世界的观照，使得它接近抒情文体，而已经相当成熟和发达的诗、词、曲又最宜抒发人物在特定境遇中的情感，所以诗歌自然会被戏曲吸收利用，使抒情性成为古代戏曲不可或缺的因素，诗化倾向十分突出。\n\n以小说论，早在唐传奇中已有诗入小说的情况，此风一开，后世小说家趋之若鹜，以诗作为描写人物肖像服饰，烘托渲染环境气氛，表达作者思想感情的重要工具，动辄有诗为证，乃至一些作品中诗词文藻堆砌。这对小说外在形式的影响，以及表达主观感受，丰富叙述情调的内在作用，确使小说具有了诗化的抒情倾向。\n\n（4）戏剧化的时空观念\n\n中国古代戏曲对时空问题的处理注重内在精神的有机整体性，趋于写意，从而突破了舞台时空的局限而获得自由。人物生活在虚拟的时空中，为适应情感抒发的需要，有时一刻光景其长如年，有时又“缩天有术”，使得自由流动，任意伸缩的虚拟时空成为人物活动的存在形式。\n\n戏曲这种处理时空的手法，直接影响小说创作。中国古代小说场景与过场也没有明确界限，小说家对场景的描绘主要为突出行动，丰富的动作容量替代了对空间的过多描写。中国古代小说也多用散点透视设置空间。不仅如此，中国古代小说还喜欢采取写意式的描写方式，使场面描写富有戏剧的造型性和视觉性。\n\n综上所述，中国古代小说和中国古代戏曲虽然分属两种不同的体裁，却在渊源与艺术表现上有许多相同之处，二者相互交织、相互影响，共同推动了中国古代叙事文学的发展。","keywords":"区别 叙事方式 语言运用 联系 成长的因素 史传 传奇“说话”艺术表现 流动的线性结构 程式化的思维方式 诗化的语言特色 戏剧化的时空观念","note":"中国古代小说和古代戏曲虽然分属两种不同的体裁，但却有着干丝万缕的联系，一个简单的例子就是，元代的许多戏曲都是从小说中取材的，比如《西厢记》《倩女离魂》等。不仅如此，在结构、思维方式、语言特色和时空观念这些方面，二者之间也存在着许多相似之处，明确这一点之后，大家逐个展开分析即可。相关内容可以参考刘书成《一个难以解开的“死结”-中国古代小说、戏曲关系论略》、石佳玉《论中国古代小说与戏剧的关系》。"},{"id":"451","stars":"★★★","title":"试述袁枚的诗歌创作主张及其创作特征","body":"袁枚是性灵派的领袖，也是该派创作成就最高的作家。他的诗歌创作主张及创作特征主要表现在以下方面：\n\n一、理论主张：性灵说\n\n（一）思想基础\n\n“性灵说”的思想基础是对“存天理，去人欲”的程、朱之学的反拨。袁枚生活通脱放浪，个性独立不羁，颇具离经叛道、反叛传统的色彩。他宣扬性情至上，肯定情欲合理，在性与情上，主张即“情”求“性”，突出尊情；在言志与言情上，认为“诗言志，言诗之必本乎性情也”。他强调情是其诗论的核心，男女是真情本源。\n\n同时，袁枚还鲜明地表现出对历代经学家与宋代程朱理学的反感，认为“宋学有弊，汉学更有弊”，宋儒偏于心性之说近乎玄虚，而汉儒偏于笺注也多附会，进而质疑“六经”，指出其言未必“皆当”“皆醇”，并借庄子之语抨击“六经尽糟粕”，对虚伪的假道学深恶痛绝，表现出封建社会末期个性解放思想的再次苏醒。\n\n（二）具体内涵\n\n袁枚宗尚性灵，所谓“性灵”，其含义包括性情、个性和诗才。\n\n（1）性情。在袁枚看来，性情是诗歌的第一要素，诗生于性情，性情是诗的本源和灵魂，诗人要“自把新诗写性情”。\n\n（2）个性。袁枚认为，性情要表现出诗人的独特个性，“作诗不可无我”，“有人无我，是傀儡也”，没有个性，也就丧失了真性情，他的《续诗品》辟“著我”一品，所谓“字字古有，言言古无”，就是明确提倡创写“有我”之旨。这是性灵说审美价值的核心。\n\n（3）诗才。仅有个性、性情是不够的，袁枚认为诗人还应具备表现这一切的诗才，“诗人无才，不能役典籍运心灵”，艺术构思中的灵机与才气、天分与学识要结合并重。这些来自诗人的天分，不可复制、模仿。性灵派认为，诗歌创作主要靠个人的天性和智慧，而不能靠古代积淀的现成经验。\n\n这一在“吟咏性情”的基点上构成完整体系的诗歌理论，冲破了传统与时代风尚，对格调模拟复古、肌理考据学问、神韵纤巧修饰、浙派琐屑饾饤给予有力的冲击，是晚明文艺思潮的隔代重兴，为清诗开创了新的局面。\n\n二、创作特征\n\n（一）抒写自己生活感受，清新灵巧\n\n袁枚的诗创作，确能如他自己所说，直抒“性情”，即写自己的生活感受，比之那些模拟格调或以考据文字为诗的作品，别具一种清新灵巧的风格。像是“半天凉月色，一笛酒人心”“雨来蝉小歇，风到柳先知”“十里烟笼村店小，一枝风压酒旗偏”这样的诗句，意境明晰，自有韵味，而又不像“神韵派”那样朦胧隐约，不着实际。袁枚的佳作大抵就是这类近体诗。\n\n（二）不受传统束缚，追求创新\n\n袁枚的笔触相当广泛，反映现实、咏物怀古、描绘山川自然和表现个人志趣，大都不受传统思想束缚和正宗格调限制，信手拈来，矜新斗捷，不尽遵轨范。而且清灵隽妙，具有感情奔放、议论新颖、笔调活泼、语言晓畅、句法灵巧等特点，从内容到形式都有一定的创新。\n\n（三）具有二重性\n\n一方面，袁枚能综合继承古典诗歌的传统达到某种贯通融合的境界，不乏传统型的作品，数量可观，体制全备，艺术水平相当高，个人特色亦鲜明，在继承传统方面超过了公安诸家，艺术水平也在公安诸家之上。这个情况恰恰是对前代性灵一派的修正与发展。另一方面，袁枚又在向民间语言的学习过程中贴近时代生活，这种二重性属于旧诗向新诗转变进程中的一种过渡状态。","keywords":"性灵说 思想基础 具体内涵 性情 个性 诗才 创作特征 清新灵巧 追求创新 二重性","note":"袁枚是性灵派的代表人物，对当时神韵派、格调派等诗歌流派进行了抨击，起到了扭转风气的作用。他推崇“性灵”的诗歌主张也体现在他的诗歌风格上。在袁枚的诗歌创作主张与创作实践之中，我们看到了个性解放思潮的再次涌动，这正是时代发展变化的结果。"},{"id":"452","stars":"★★★★","title":"试述桐城派散文主张与艺术特征","body":"桐城文派是我国古代最大的散文流派，在中国散文发展史上具有十分重要的影响，其散文主张和创作特征主要表现在以下方面：\n\n一、散文主张\n\n（一）方苞\n\n（1）“义法说”\n\n“义法”二字取自《史记》，合起来说是言之有物而文有条理，分开来说，“义”指文章内容要充实，具有明显的服务于当代政治的目的；“法”指文章的作法，包括形式、技巧问题，如布局、章法、文辞等。两者关系是义决定法，而法则体现义。方苞认为，古文的源头可追溯至儒家经典，故义法皆出六经，作文当以儒家思想为指导。如此，便把道统和文统合为了一体。\n\n（2）“雅洁说”\n\n在文章风格上，方苞提出了“雅洁”的标准。所谓雅洁，包括写作内容须简明扼要，语言须规范、洗练等。他对散文语言规定极严，反对语录语、诗歌语、佻巧语等入文，将这种标准运用于当时的散文创作，即所谓的“以古文为时文”，这在当时是符合清朝统治者清真雅正之要求的。\n\n（二）刘大櫆：“神气说”\n\n正如方苞之讲“义法”，刘大櫆也讲“行文之道”，重视“神”“气”“音节”等要素，突破“言有序”的范围。他所说的“神”“气”是作者精神气质在文中的表现，二者比较，“神”是首要的，居于支配地位，“气”是贯穿文章的气势韵味。为了使“神”“气”易于掌握而不至于无可捉摸，又提出因声求气说，由字句以求音节，再由音节以求声气，音节是行文的关键，诵读能体会文章的“神”“气”，这就为探寻“义法”奥妙揭示出门径和方法，也使理论具有较强的实践性和可操作性。\n\n（三）姚鼐\n\n（1）义理、考据、词章三者并重\n\n姚鼐主张“道与艺合，天与人一”，“义理、考据、词章”合一，让儒家道义与文学结合，天赋与学力相济，“义法”外增加考证，兼顾了以义理为中心的宋学和考据见长的汉学，同时将文章艺术当作基本要素之一，与前二者并立，理论上更\n\n加全面、平衡。姚鼐追求的是三者统一和兼长，达到既调和汉学、宋学之争，又写出至善极美文章的目的。姚鼐生当乾嘉之世，考证之学盛行。为考证者，以征实为能，或至轻视辞章，鄙薄义理。姚氏提出三者并重之说，显然是有所针对而发。\n\n（2）“阳刚阴柔”说\n\n姚鼐运用传统的阴阳刚柔说，将多种风格归纳为“阳刚”和“阴柔”两大类。在古代散文史上原本就存在着偏于阳刚或阴柔的两种风格倾向，姚鼐以生动形象的语言，细致描绘两者鲜明的特色，提出“统二气之会而弗偏”，“协合以为体”，追求刚柔相济，避免陷入“一有一绝无”的片面和极端，接触到文学审美风格的实质问题，有助于避免各自的偏弊，使文章进入更高的审美境界。\n\n（3）文章艺术八要素\n\n姚鼐把文章的艺术要素提炼为“神、理、气、味”和“格、律、声、色”八字，前四者是内在的“文之精”：理，指义理和文理，其馀三字，神为风神、精神；气指气势、气魄；味则是韵味，这些处在高层次。后四者是外在的“文之粗”，指文章的结构、句法、音节、辞采等因素，层次虽低但比较具体。精寓于粗，相互依存，从学习角度，由“粗”把握“精”，待融贯其“精”后再遗弃可见的“粗”的部分，摆脱“文之粗”的束缚，匠心独运，就使古文进入最高境地，这细密、完善了刘大櫆因声求气说。\n\n二、艺术特征\n\n（一）擅长写“小文章”\n\n从唐宋以下，古文作品大多已由秦汉时代的鸿篇巨制变得相对短小，至晚明的小品文，这一趋势发展到了极致。古文形制上的这种变化，是与古文有意无意地渐渐疏离载道、实用的功利目的，转而注重对散文家本人的愿望、情感、理想的表达息息相关的。桐城文人深受善写亲朋故交的小文章的归有光的影响，再加上从方苞起就提倡文风的雅洁和含蓄，自然也就热衷写小文章。\n\n（二）将小说笔法融入散文\n\n桐城文家的创作实践受到归有光的影响，归有光把小说描写方法用入散文，桐城派也继承了这一点。桐城派将小说笔法融入散文，主要是在散文写作中注意人物性格的表现，采用一些白描方法，特别是注意特征性细节的描绘。如方苞的《忠毅公逸事》，从开端、发展、高潮到结束，情节基本完整。有人物肖象，有心理解剖，有动作，有语言，通过这些写出人物的形象，显示人物的性格。写得有声有色，栩栩如生，完全是小说笔法。\n\n（三）强调散文的纯洁性、规范性\n\n桐城作者自称其文的特点为“气清词洁”。用方苞的话说，就是要合乎“义法”。这里的“气清词洁”，主要指的是要求散文语言的纯洁，而“义法”则是意图在散文中总结出一套使用语言的规律。因此，桐城派在语体、风格、词语和结构这四个方面都做出了积极探索，强调散文语体的艺术性，追求散文风格简洁，用词准确、清新，讲究谋篇布局、穿插照应。","keywords":"散文主张 方苞 义法说 雅洁说 刘大櫆 神气说 姚鼐 义理、考据、词章三者井重 阳刚阴柔 文章艺术八要素 艺术特征 擅长写“小文章”小说笔法融入散文 纯洁性、规范性","note":"桐城派是中国古代十分重要的一个散文流派，在考查中经常以名词解释的形式作考查，相关内容大家要特别关注。部分学校也会针对桐城派出一些简答题或论述题，大多数情况下会考查其理论主张，但也会涉及其创作特征。其中我们特别要注意的是方苞和姚鼐的散文理论，可能会被单独拿出来考查。相关内容可以参考吴孟复《试论“桐城派”的艺术特点》，具体资料可以在李凡文学正版群中领取。"},{"id":"453","stars":"★★★","title":"试分析桐城派的影响","body":"桐城文派是我国古代散文领域中出现的最后一个流派，它的理论建树、创作实践都带有对古代散文全面总结的性质。桐城派的影响，主要表现在以下方面：\n\n一、促进了职业散文家的出现\n\n桐城文派的影响首先是精神上的。从组成上说，桐城文派基本上是一个并不急功近利而又倾心于散文创作和散文理论研究的职业文人群体，其形成和发展，进一步打破了“以做文人，便无足观”的传统观念。由于散文的载道和实用，散文家不像戏曲家、小说家那样能较为自然地完成职业化的进程。在桐城派之前，虽然也出现过公安文人等不汲汲于名利的散文家，但其人数之众、绵延时间之长都不能与桐城派相比。而桐城文人尽管大多不愿牺牲个性去从政，但他们毕竟是在传统思想熏染下成长起来的，因此他们的创作不是局限于个人生活的小天地，不只满足于对个人的闲情逸致的抒发，而是一直保持着对\n\n现实的关心。桐城文人既满足对自身欲望、情感、理想的抒发，而又不与现实割裂的创作和理论，对于现代意义的职业散文家的出现，无疑是起了示范作用的。\n\n二、总结散文章法，影响了一大批近现代散文作家\n\n桐城文派对散文章法的总结，虽然是以传统古文为对象，但其理论却有普遍意义，因此胡适曾费誉桐城文家把“古文作通顺了”，认为“这点功劳，是不可埋没的”。由于桐城文人多以教师为职业，这为桐城家法的广泛传播提供了良好的条件，近、现代的许多著名文人都不否认桐城家法对自己的影响。如谭嗣同、梁启超、范文澜、章士钊、钱基博、郭沫若等老一辈学人都曾坦言自己受到了桐城派散文的影响，可以说，桐城派总结的散文章法对这些作家的创作发展起到了重要的推动作用。\n\n三、促进了语言的规范化\n\n语言可分口语和书面语，口语的发展变化的速度是远大于书面语的，因此两者之间常常相互脱节。这种现象的出现既有人为的因素，又是语言本身发展规律所决定的。一种语言要保持稳固性，它就必须规范化。只有当书面语在强调承袭的前提下与口语保持一定的距离，而不是对口语亦步亦趋的时候，它才可能担负起语言规范化的重任。桐城文家从方苞起就强调语言风格的清真雅洁，温文不俗。这种对清真雅洁的强调，就包含着注重语言规范性的合理因素。今天的文学散文依旧不是日常口语的简单记录，而是散文家们在继承古代语言的基础上，再对日常口语反复锤炼而形成的文学语言写成的，这当然也是受到桐城文派语言风格主张中合理内核的启发的。","keywords":"促进职业散文家的出现 总结散文章法 促进语言的规范化","note":"桐城派是我国古代最后一个散文流派，处于中国由古代步入近代的关键节点，因而对近代甚至现代的散文发展都产生了重要的影响。而这些影响，又是与桐城派的散文理论主张和创作特征联系在一起的。桐城派对古代散文创作的总结在不少方面是契合散文的一般规律的，这为现代散文家提供了示范和启发，因此，桐城文派实际上可视为古代散文向现代散文过渡的中介。"},{"id":"454","stars":"★★★","title":"试分析《镜花缘》这部作品","body":"《镜花缘》是一部借学问驰骋想象，以寄托理想、讽谕现实的小说。这部小说的创作特征，主要表现在以下方面：\n\n一、表现出了对妇女的地位、境遇的关注、思考\n\n《镜花缘》作者针对现实世界的“男尊女卑”，一方面借百花仙女下凡写出了一大批超群出众的女子，以表彰才女的方式，表现出男女平等的思想；另一方面又虚构“女儿国”，与现实社会相反，让林之洋在那里备尝现实中女子受到的轻侮、摧残。林之洋被纳入宫中，现实中女子遭受的缠足的痛苦，便惊心触目地凸显出来，书中近乎游戏的情节正尖锐地表现了对不人道的封建恶俗的抗议。\n\n二、新颖奇特的构思\n\n《镜花缘》最富特色的是前半部书写唐敖游海外诸国的经历、闻见。三十多个国度的名称及其奇异处，主要采自《山海经》《淮南子》及魏晋志怪书，作法大致有两种：一种是就原书所记诸国人的奇形怪状，借小说人物之口加以解说，来揶揄现实社会的种种不良习性。如长臂国，《山海经·海外西经》载：其人“捕鱼水中，两手各操一鱼”。小说中说是其国人贪婪，“非应得之物，混手伸去，久而久之，徒然把臂膀伸长了”。另一种作法是就其国名的含义演绎出情节故事。如《山海经·海外东经》记君子国“其人好让不争”，小说便让唐敖三人游历了一个“礼乐之邦”，国中一派淳朴祥和的景象。\n\n三、追求趣味性\n\n在这一百回的大书中，写唐敖、多九公等人在海外的游历用了三十二回，写唐小山海外寻父的经过用了十回，写才女们的十日欢聚用了二十五回。前二者所着重的是唐敖父女见闻、遭逢之奇特，后者则主要写才女们的游艺活动和谈论学问。它们的共同特点，是追求趣味性。\n\n四、综合性\n\n读者从《镜花缘》这部作品中，似乎可以看到它以前的某些长篇小说的“影子”，例如，以唐敖的游历为线索，写出种种奇闻异事，有如《西游记》；书中常常出现讽刺揶揄，又似《儒林外史》；而对女性的描写和赞美，更会使读者联想到《红楼梦》。这种“综合性”，也是《镜花缘》的一个显著的艺术特点。","keywords":"对妇女的地位、境遇的关注、思考 新颖奇特的构思 趣味性 综合性","note":"《镜花缘》的整体成就虽然比不上《红楼梦》《儒林外史》等巨著，太多的谈学说艺，一味地炫耀学识，但也具有一定的现实意义，其中尤其值得注意的是对女性的关注。在艺术上，这部小说构思新颖，趣味盎然，并继承了之前小说创作中的许多优点，因而受到了广泛的欢迎。"},{"id":"455","stars":"★","title":"试分析清中叶戏曲创作衰落及其原因","body":"一、清中叶戏曲衰落的表现\n\n清代中期戏曲创作的主要问题有二，即脱离现实和脱离舞台，大写历史剧而远离现实，大写案头剧而不适合演出。“两脱离”倾向在杂剧创作中更为明显和突出。\n\n（一）脱离现实\n\n清代杂剧大量以文人逸事和仕女掌故为题材，这在清初就已经如此，不过清初尚能表现出强烈的民族意识，寄寓亡国之痛和故国之思。但在清政权日趋巩固以后，这种缅怀故国之情淡薄了，代之而起的是一些叙写古人逸事、抒发个人积郁的作品，其中有些虽然蕴含了某些不满现实的情绪，但反抗的力量已比较微弱。即使透露出一些怨世、讽世之情，其出发点也仅仅着眼于个人而非人民大众。更多的一些杂剧则只是以闲适的心情写文人和仕女们的才情，与社会现实极少联系。这个时期的传奇，题材虽较杂剧稍微广泛一些，但也不外乎摹拟前人续写才子佳人、悲欢离合的滥套，或虚构历史为古人及古代作品中人物翻案补恨，还有更多的是借历史以宣扬封建道德，取材于现实生活的极少。\n\n（二）脱离舞台\n\n脱离舞台、不适合演出的倾向在这个时期的杂剧及传奇创作中也很突出。杂剧自明末已趋向案头，清中叶以后更为明显，文人写杂剧就跟作诗填词一样，多吟咏性情，与演出完全脱节。所以这时的杂剧，除个别作家如唐英、杨潮观外，大多只能作案头小品来欣赏。至于传奇，案头化趋向明末略有流露，清初则由于苏州派的改革，强调其舞台性，案头化趋势受到遏阻，但在“南洪北孔”之后又迅速蔓延。剧作家一旦脱离现实，必然会脱离舞台。因其只求文字优美、能够抒怀表意就算达到目的，故对排场关目很少用心。哪怕像蒋士铨这样比较优秀的剧作家，也不例外。\n\n二、清中叶戏曲衰落的原因\n\n（一）清政府加强文化专制\n\n乾隆以后，清统治者加强了文化专制，文字狱愈益增多，乾隆四十二年还专门责成巡盐御史在扬州组织专人与专门机构修改古今词曲。乾隆四十五年在查禁一大批违碍书籍之后，又指令各省督抚派员删毁违碍戏曲剧本。这使得戏曲创作受到沉重压力。\n\n与之同时，清廷又令张照、周祥钰等人为满足帝王享乐的需要而编写宫廷大戏，这些大都是长达二百四十出、连演一天的大戏。这些大戏虽然无法在民间演出，但仍然起着钳制思想、规范戏曲创作的作用。\n\n（二）杂剧、传奇的戏曲艺术的自身局限性\n\n由于杂剧、传奇这些历史悠久的戏曲艺术本身已经老化。它的一些优势已经发挥尽净，而它的局限，如太文雅、太刻板、太缓慢、太雕琢等，则使它愈来愈失去观众。清代的戏曲作家虽也有人想有所变革，但过于典雅、精巧的传奇、杂剧实在难于随俗，不易变通。而更多的剧作家则根本不顾观众和舞台的需要，更加刻意求雅，使其形式愈益僵化，更加远离观众。","keywords":"戏曲衰落的表现 脱离现实 脱离舞台 戏曲衰落的原因 加强文化专制 自身局限性","note":"清中叶戏剧创作走向衰落，一方面有其自身原因，另一方面也受到了外部因素的影响。从戏曲创作自身来看，其总的趋势是案头化、文人化，越来越向“雅”的方向发展，这必然导致其脱离群众，失去生存的土壤；从外部因素来看，清政府文化专制越来越强，导致戏曲创作思想匮乏，进而导致戏曲创作越来越衰落。"},{"id":"456","stars":"★★★","title":"试分析清代“花雅之争”的过程及影响","body":"“花部”与“雅部”之争是指清朝乾隆年间以来戏剧舞台上属于雅部的昆剧与属于花部的梆子腔、皮黄腔、弦索腔和弋阳腔等剧种的三次竞争。其过程及影响主要有以下方面：\n\n一、“花雅之争”的过程\n\n（一）第一轮“花雅之争”：康熙中叶以后的昆腔、弋阳腔（京腔）并峙\n\n弋阳腔早在明万历年间便流播到京师并进入宫廷。由于弋阳腔也是曲牌联套，而且大多数曲牌与昆曲无异，所以为昆曲创作的剧本略作改动，有时几乎不必改动，就可以用弋阳腔演唱。于是，宫中所演历史大戏渐渐从全部演昆曲，逐渐过渡到昆弋相间、昆弋并举。这样，弋阳腔便由被清廷限制、禁止的花部中分化出来，变成皇家御用腔调之一，成为与昆曲并称的“雅部”，打破了昆腔独霸剧坛的局面。但也正因为如此，弋阳腔（京腔）逐渐京化、雅化、规范化、程式化，失去刚健清新的特色，逐渐衰落下去。\n\n（二）第二轮“花雅之争”：乾隆中叶的京腔、秦腔之争\n\n1779年，秦腔表演艺术大师魏长生进京，与昆、高二腔争胜，轰动京师，大有压倒后者的势头，以致“歌闻昆曲，辄哄然散去”。清廷遂以行政手段扶植昆曲，强行禁演秦腔，勒令秦腔艺人改学昆腔，否则“递解回籍”，从而迫使魏长生等秦腔艺人离京南下，在苏、扬二州继续演出。\n\n（三）第三轮“花雅之争”：乾隆末年四大徽班进京，花部取得最终胜利\n\n1790年乾隆帝80大寿，著名艺人高朗亭率三庆徽班进京演出，以安庆花部，合京（即高腔）、秦二腔，组成三庆班，接着又有四喜班、春台班、和春班进京，把二黄调带入北京，与京、秦、昆合演，形成南腔北调汇集一城的奇特景观。这就是中国戏剧史上著名的“四大徽班进京”。到1798年，徽班与京腔、秦腔等已在京城打下坚固的基础，再经过徽、汉合流，又与昆、弋同台演出，为后来居上的京剧的孕育和产生创造了条件。到晚清时，甚至王宫内的庆典演出也是以京剧为主体，昆、梆为辅的局面，这显示了花部对雅部的完全胜利。\n\n二、“花雅之争”的影响\n\n（一）奠定了当代中国戏曲的总体格局\n\n随着秦腔、皮黄为代表的花部戏曲战胜雅部昆曲登上剧坛的中心，中国戏曲面貌也发生了一系列的重大变革：\n\n“板腔体”戏曲剧种成为戏曲音乐的主流；“分场”“分幕”剧本体制代替了传统的“分折”“分出”体制；角色行当从类型化向个性化嬗变-重声腔表演的花部戏曲声音日隆，使得舞台重心大幅朝向唱念做表细节方面倾斜，也带来了戏曲舞台角色行当体制的空前发展，不仅行当内实现最大程度的细化，而且创造了新的行当；戏曲的重心从文学创作向剧场艺术、舞台表演倾斜从而直接催生了现代“角儿制”的出现，代表舞台艺术高度个性化发展的表演流派也取代剧作流派成为戏曲发展程度的最重要标志；戏曲自元代杂剧、南戏而后经历明清传奇的雅化阶段又重回民间，审美视角、观众层级下移，从雅部昆腔传奇时期的“精英阶层”转向广大农民、市民草根阶层。\n\n宏观而言，雅部昆曲所代表的古典戏曲文化被清代剧坛三轮“花雅之争”终结，中国戏曲经历了一次由“词统”向“戏统”回归的“涅槃”般的洗礼后，以全新的面貌进入了其现代化的发展时期。“花雅之争”是中国戏曲走向剧场艺术巅峰的时代分水岭，它奠定了当代中国戏曲的总体格局。\n\n（二）改变了戏曲观众的接受心理\n\n从视戏曲为文体形式到视戏曲为艺术门类的观念变化，是“花雅之争”重要历史意义之一。戏曲重心从文本到舞台的迁移，直接造成了以京剧为代表的花部剧种重表演、轻文学的倾向，并影响了整个二十世纪的戏曲舞台创作。新时期以后，戏曲的文学性被再次强调，但重新整合后的戏曲舞台呈现始终不为传统戏曲观众认同，戏曲创作重心的转移也对观众审美习尚产生了重大影响。\n\n“花雅之争”使得戏曲自身面貌及观众接受心理都发生了重要变化，整个二十世纪戏曲基本格局即建立在“花雅之争”所带来的影响基础之上，戏曲在社会生活中所担任的文化角色亦随之改变，戏曲更广泛地深入到各阶层民众生活之中，成为民俗文化的一个重要载体。\n\n近代文学史","keywords":"过程 第一轮 昆腔、弋阳腔（京腔）并峙 第二轮 京腔、秦腔之争 第三轮 四大徽班进京 花部取得最终胜利 影响 奠定了当代中国戏曲的总体格局 改变了戏曲观众的接受心理","note":"在分析“花雅之争”的过程时，大家需要注意的是花部和雅部之间的斗争并不是匀速发展，而是有所波动并经历了三个主要阶段。而这三个阶段，是花部从一开始处于弱势，到势均力敌，再到取得最终胜利的三个阶段。“花雅之争”的影响是十分深远的，一直延续到了当下，给今日戏曲剧坛的多元局面提供了某些警示。相关论文可以参考黄蓓《清代剧坛“花雅之争”研究》，具体资料可以在李凡文学正版群领取。“花雅之争”是清中叶戏曲部分可能出现的名词解释，除此之外还有弹词、鼓词、子弟书、“四大声腔”这些我们都要注意一下，大家要注意一下。"},{"id":"457","stars":"★★★","title":"试述近代文学的分期及各期概况","body":"近代文学以1840年鸦片战争为开端，到1919年“五四”新文化运动兴起为止。这一阶段的发展衍变流程，大体可以中日甲午战争为界，分为前后两期。相对来说，前期变化较小，后期变化巨大，与“五四”新文学接轨的迹象日益分明。\n\n一、前期\n\n自鸦片战争前后开始，帝国主义的铁蹄踏上中华大地，但人们对传统的思想、文化、制度的信仰，都还没有产生根本性的动摇。所以，本时期文学在形态上还极少变化，但内容与思想上则表现出某些新因素。这一时期，思想文化主潮是经世致用，同时西学中用初见端倪。\n\n（一）雅文学领域\n\n（1）紧承乾嘉以来的文学风气，随着惯性向前推衍的力量还相当大：宋诗派成为近代诗坛的主流。常州词派继续发展。桐城派再度崛起并产生了湘乡文派。这些文学流派在新形势下，虽然都有一定的变化和成就，但总体说来，思想比较陈旧，跟不上时代步伐。\n\n（2）国家与民族的危机成为人们关注的焦点，反帝爱国成为本时期文学突出的新内容：以龚自珍、魏源为代表的经世派文学家兴起。他们改变了文坛旧貌，翻开了近代文学的新篇章，反映了时代的新变化；太平天国的文化政策及其诗文表现出反封建的激进色彩，但因被镇压而未能发生重要影响。稍后的洋务运动时期，湘乡派的一些作家因出使西方，写下一些反映外国情况的作品，也给文坛吹进了新的气息。\n\n（二）通俗文学领域\n\n（1）小说虽然还在《水浒传》《红楼梦》笼罩之下，甚至思想还有滑坡，如《荡寇志》的维护封建法权，侠义之统领于清官等，但也呈现出一些与传统疏离、嬗变的迹象。《三侠五义》的粗犷平民气息，《儿女英雄传》的京味小说文笔与切近世态人情，都显出某种光彩。《品花宝鉴》将题材扩展至狎优风气，特别是《海上花列传》反映畸形繁荣的都市百态，《蜃楼志》以洋行买办商人为主角，都与近代日渐殖民地化的新兴都市的新市井情态密切相关。\n\n（2）戏曲则是雅部衰落，花部兴起，特别是京剧开始成为有广泛影响的一个剧种。\n\n二、后期-传统诗文的结束和新文学的萌生\n\n甲午战败加之一系列改革的失败，刺激资产阶级知识分子自觉求新声于异邦。向民众进行思想启蒙的意识成为进步知识分子的共识。文学成为资产阶级改良派和革命派进行维新与革命斗争的武器，因此激起文学领域中的广泛革命。\n\n（一）这一时期，虽然旧的诗文流派虽然仍在文坛上继续活动，但在充满近代精神的文学比照之下，愈显得黯然失色。新的文学风气与充满新思想的文学作品，已成为文坛的主导潮流。“诗界革命”与“文界革命”使诗文创作面貌一新，将近代诗文的发展推向了高峰，并为“五四”新文学革命准备了某些条件。\n\n（二）一向不登大雅之堂的小说，因其向民众启蒙最为得力，被推为文学的最上乘，占据了中心地位，在诗界革命、文界革命、小说界革命、戏剧革命的口号下，新小说、新传奇杂剧、新文体散文、谴责小说、接受西方影响而产生的小说新品种等，成为文坛的主流。\n\n（三）在这一时期新式话剧也诞生了，并形成相当大的声势，甚至京剧也有了时装新剧的种类。\n\n（四）伴随散文的通俗化运动，白话文也开始被自觉采用，并形成相当大的声势。","keywords":"中日甲午战争为界 前期变化较小 后期变化巨大","note":"近代文学的分期及其概况要结合近代历史发展的背景分析，以具有标志性的历史事件为分界线，1894年中日甲午战争以前为前期，以后为后期，总体特点是前期变化较小，后期变化明显，对于其中的代表人物和事件，大家要仔细掌握。"},{"id":"458","stars":"★★★★","title":"论述近代文学的发展特点","body":"近代文学以1840年鸦片战争为开端，到1919年“五四”新文化运动兴起为止。这一时期从作家身份、文学观念到文学载体、接受对象都逐渐发生新的变化，显示出与此前封建时代文学明显不同的特色，主要体现在以下方面：\n\n一、文学的政治性、战斗性加强\n\n龚自珍开创了近代文学的新世纪，他的诗文大都从政治和社会历史的观点来揭露现实问题，成为现实政治社会批判的工具。后来冯桂芬、康有为、梁启超等更直接宣传改良主义思想，密切配合改良主义的政治、文化运动。太平天国的领袖们提倡“文以纪实”，他们的诗文则是鼓舞广大人民革命斗志、推翻清王朝的武器。章炳麟、秋瑾等和南社的大批诗人们更自觉地使他们的诗文作品为民族、民主革命服务。\n\n二、文学反映现实的领域空前扩大\n\n近代作家们不仅系统地反映了近代历史的许多重大事件，而且也越来越多地反映了资本主义世界的新事物、新思想、新知识等。诗文、戏曲、小说无不如此。\n\n三、继承和发展了现实主义和浪漫主义的优良艺术传统\n\n龚自珍首先突破了清中叶以来拟古主义和形式主义的统治，成为近代早期的一个浪漫主义诗人，同时他的许多散文和诗歌也表现了深刻的现实主义精神。林昌彝的《射鹰楼诗话》具体地反映了诗歌创作的现实主义观点，而许多进步作家的作品无不着重揭露现实政治社会的腐朽黑暗，这一切都说明了现实主义文学思潮和创作运动的不断高涨。\n\n四、文学的形式、语言乃至风格趋向通俗化\n\n诗歌方面，黄遵宪主张“我手写我口”，试图突破旧形式。散文方面，不仅有梁启超“务为平易畅达”的新文体，而且在语文合一的要求下，也出现了白话文。话剧的产生，以及民间文学形式多方面的运用，都是要求通俗化的表现，陈天华的《猛回头》即是以民间唱本形式写成的著名作品。\n\n五、明显的过渡状态\n\n传统文学以“同光体”“常州词派”“桐城派”为代表，依然活跃一时。而许多小说旨在广泛地揭露黑暗，随事牵连，结构散漫，很少创造出时代的典型形象，晚清所谓谴责小说大抵都存在着这种缺点，这些都是过渡状态的表现。但近代文学是有成就的，它的反帝爱国和民主主义的基本主题，它的突破旧形式、语文合一、走向通俗化的探索和努力，都为“五四”以后的新文学准备了一定的历史条件。","keywords":"文学的政治战斗性 现实领域扩大 现实主义与浪漫主义 通俗化 过渡状态","note":"近代文学发展的特点，和此前的封建时代文学明显不同，但整体又呈现着一个过渡的状态，取得了不俗的成就，为“五四”以后的新文学准备了一定的历史条件。"},{"id":"459","stars":"★★★","title":"谈谈你对近代白话文热潮的认识","body":"在19世纪末20世纪初的晚清时代，由于近代化进程的影响及民族危亡的严峻，出现了白话文热潮这样一个思想文化运动。这顺应文学进化的要求，符合广开民智的需要。其中既有黄遵宪“言文一致”说、梁启超“俗语文体”说、裘廷梁“白话文为本”说等专门性理论的提出，又有新文体的广泛应用，白话报的大量发行实践，另外，还出现了白话文告、白话教材、白话小说等多种形式，形成了一个认识白话，使用白话的热潮，这一热潮被称为“近代（晚清）白话文热潮”。\n\n一、近代白话文热潮的积极作用\n\n（一）思想启蒙\n\n近代白话文热潮通过更新文字来输入新的思想，希望以语言方式的改变促进思维方式的改变。无论是维新派还是资产阶级革命派，甚至晚清统治者都利用白话为政治主张的工具。对于白话，人们是有着直接和明确的期待的：借助白话文的平民性和大众性，塑造国民全新的世界观、价值观。白话文是传播新文化、新思想的有效载体。\n\n（二）普及文化\n\n大量白话报刊的出现、白话教材的编订已将文化普及的对象扩大且下移，利于快速地普及文化。文字、书籍不再是少数读书人的专利，那些没受到太多教育的人也能够有一个比较容易的渠道去接触新知识、新思想。这种基础性文化的普及利于整个国民素质的提高，不仅对当时社会，也为后期人们打破固封的观念、接受新鲜的文化做了铺垫。\n\n（三）促进文学近代化\n\n传统文学向近代文学的转化、人文观念的注入使文学随着时代的进程向前发展，也奠定了近代文学的基础。\n\n（四）为五四白话文运动奠基\n\n（1）人员的相同\n\n五四白话文运动的主将都是参与过晚清白话报创办工作的。像陈独秀1902年接办《芜湖白话报》，1904年创办《安徽俗话报》，钱玄同1904年创办《湖州白话报》，胡适1906年主编《竞业旬报》，李莘白1908年主持《安徽俗话报》。正因为有了办白话报的经验，白话的观念和思想才逐渐在胡适、陈独秀等人头脑中成熟，并迅速得到大家的响应。\n\n（2）理论的承接\n\n晚清白话文热潮虽然以宣传白话的工具性为主，但是黄遵宪、裘廷梁、陈荣衮等人也有具体的有关白话的理论。言文一致、“崇白话而废文言”等主张在五四白话文运动中不仅在胡适、陈独秀的白话观点中有所体现，更是经历时间的检验，由理论变成了现实。\n\n（3）大众的接受\n\n晚清白话文热潮中使用白话的原因正是为了启迪下层民众，新文体的广泛使用，白话报的大量发行，甚至白话小说受到追捧都说明在书面中使用白话能够受到大众的欢迎。这种先行经验为五四提倡白话文、废弃文言文提供了群众基础，人们能够渐进地接受这种语言、书写方式的改变。\n\n二、近代白话文热潮的局限性\n\n虽说晚清白话文热潮对五四白话文运动有深远的影响，但两者对白话、文言的认识、态度和最终取得的成效都是不同的。晚清白话文热潮作为初始阶段，对白话的认识、使用也存在着弊端。\n\n（一）只求浅白而缺乏美感\n\n从出发点来看，晚清白话文作为开民智的工具，是写给下层人民看的，只求浅白，容易缺乏遣词造句的美感。例如受到欢迎的白话小说，或宣传政治思想，或单纯娱乐读者，不大注意对白话文的提炼，这对于现代文学来说流失了许多古典、精华的东西。\n\n（二）对白话的认识观念模糊\n\n从观念上来看，晚清时期绝大多数人仍将文言与优秀的民族文化并联，文言的实际地位高于白话。他们提倡白话文，但并不主张全部用白话代替文言。他们大多把文言视为“雅”，而把白话视为“俗”，把文言看成是登大雅之堂的“美文”，把白话视为给“村竖野叟”与“妇孺”启蒙的工具。这种文化等级观念，使他们没有认识到文言文与白话文作为文学的两种文体（或语言形式）并无“雅俗”“高低”之分。也就是说，近代裘廷梁等人所进行的语言改革，还只是传统语言体系内部的调适和修补，并不是对古代整个语言系统的颠覆。\n\n（三）实际创作仍采用文言形式\n\n作为近代白话文主要倡导者的裘廷梁，他的奠定白话理论基础的《论白话为维新之本》就是一篇文言文，创作还是以文言作为语言媒介。其他倡导者如黄遵宪、陈荣衮也均是如此。而五四白话文学的倡导者们不但在理论上主张白话为现代文学的正宗，而且自己带头自觉地用白话赋诗写文。","keywords":"积极作用 思想启蒙 普及文化 文学近代化 五四白话文运动 人员相同 理论承接 大众接受 局限性 缺乏美感 观念模糊 实际创作","note":"晚清白话文热潮作为清末重要的思想文化运动，从当时的成效上看，它达到了启蒙思想、改良风俗、提高国民整体素质的目的。例如白话报、阅报社等关于重大新闻的白话报道，其宣传爱国思想、激励民心，上至满清官员，下至乡野村夫都被鼓舞起来，投入救国自强改革的运动中。另外，像白话报有关戒缠足的宣传，使人们认识到了缠足的危害，缠足人数从那时起已大量减少。而对国学热潮渐兴的今天来说，晚清白话文热潮是一个文白交汇的重要阶段，它影响着人们对文言、白话的看法，对晚清白话文热潮的深入探究也将影响着现代社会的文学、文化发展。"},{"id":"460","stars":"★★★","title":"试分析龚自珍诗歌的特点","body":"一、政治思想和艺术概括的统一，显示出现实主义精神\n\n龚自珍认为诗人作诗和史官作史一样，都是为了社会历史批评。他把自己的诗看成是“清议”或“评论”的工具，因此他常以深邃的史识为诗，撕下“盛世”的面纱，把清王朝统治的腐朽没落形势，清晰地揭示给世人，特别具有警世、醒世和惊世的力量。如诗人在《咏史》中有力地揭露了统治阶级的腐朽面貌以及在残酷的文字狱威胁之下，一般文士埋头著书的庸俗状况，并且揭穿了清王朝对文士仕宦利诱的欺骗，深刻地批判了清王朝统治的历史。\n\n二、创造性的艺术手法，显示出浪漫主义风格\n\n（一）善于创造意象。龚自珍多用象征隐喻，想象奇特，文辞瑰玮，显然可以看出和庄子、屈原、李白有直接的批判地继承的关系。诗人用意象化的手法隐喻、象征他对社会、历史、人生的独特感觉，增强了诗的形象魅力。龚诗中的意象与他所要表现的情感内容相呼应，突出表现为两组：一组是象征清王朝衰世的意象，用“秋气”“暮霭”“夕阳”“黄叶”等。另一组是表现龚自珍自我的意象，比较常见的是“剑”与“箫”，还有“落花”“秋魂”等。\n\n（二）剽悍奇丽之美。龚自珍的诗中贯穿一种诗人独有的凌厉剽悍之气，所谓“以霸气行之”，因此晶光外射，飞动郁勃，富有力度。如“叱起海红帘底月，四厢花影怒于潮”“猛忆儿时心力异，一灯红接混茫前”等，其中展示出来的剽悍奇丽之美，是诗人对古代理想化诗歌艺术的总结与发展。\n\n三、形式风格多样，尤以七绝见长\n\n龚自珍自觉地运用古典诗歌多种传统形式，“自周迄近代之体皆用之，自杂三四言，至杂八九言皆用之”。其中多古体、七言律绝，尤以七言绝句富有创造。他辞官南归，后又北上，途中所写大型组诗《己亥杂诗》，记述了他出都前后以及旅途中的所作所为、所遇之人、所见之情景，其中还补叙了自己的家世、交游、著述，构成了诗人心路历程的全景和传记。七绝的这种功用是龚自珍开创的，它发挥了七绝灵便轻捷的优点，拓展了七绝的表现题材，丰富了七绝的风格。\n\n四、语言清奇多采，不拘一格\n\n龚自珍的诗歌语言有瑰丽，也有朴实；有古奥，也有平易；有生僻，也有通俗。清奇多采，不拘一格。但有些篇章由于用典过繁或过生，或含蓄曲折过甚，不免带来艰深晦涩的缺点。","keywords":"政治思想和艺术概括的统一 现实主义 创造性的艺术手法 浪漫主义 意象 隐喻象征 剽悍奇丽之美 形式风格多样 七绝见长 语言清奇多采","note":"龚自珍的诗歌特点是近代文学中的重要考查内容，大家在记忆时，主要从诗歌思想主题、表现手法、诗歌形式和语言风格四个方面进行考虑。其中前两点都有单独命题的可能，例如“如何理解龚自珍的诗歌是对腐朽社会的批判和对社会变革的呼唤”可以从第一点着手作答。"},{"id":"461","stars":"★★","title":"论述龚自珍散文的特点","body":"一、开创经世散文新风\n\n从清中叶以来，散文领域为桐城派古文所笼罩，其“义法”理论与死守“义法”的态度限制了散文的活力。龚自珍则彻底摆脱了此种影响，在经世思潮的鼓荡下，自辟散文创作新路，主张摆脱一切束缚，畅所欲言。他直接继承和发扬了周秦诸子散文无所拘忌的创造精神，以自由活泼的体式大胆地抒写自己的真知灼见和真情实感，开创了经世散文的新风，标志着清代散文的转折。\n\n二、以反映社会现实为主题，表现出追求个性解放的精神\n\n龚自珍的时代，清王朝的统治已经衰朽，迫切需要变革，但专制主义统治压制言论，摧抑人才，造成官僚平庸，士风萎靡，堵塞了变革新生之路。龚文大胆地揭露这种统治的腐朽本质及其必然没落的命运，呼号变革，憧憬未来，反映了时代的重大课题。如他的《尊隐》一文深刻地表现了对大变革的预见与憧憬，其中的揭示、呼唤、憧憬，都不啻石破天惊。\n\n与反对专制束缚相关，龚自珍的散文也表现了追求个性解放的精神。《病梅馆记》是他这一精神最集中的体现，文章采用比兴手法，以梅为喻，表现了反对摧残自然生机、保护个性自由的坚定态度。再如传记文《吴之瘤》等，着重刻画人物奇崛不俗的个性，反映了同样的精神。\n\n三、识深、气悍而风格瑰奇\n\n（一）识深：龚自珍以“幽光狂慧”透视现实，认识深邃，多透底之言，发人猛醒，读之“若受电然”。正因如此，他的散文才在后来产生了重要影响。\n\n（二）气悍：龚自珍说他自己“气悍心肝淳”，“气悍”便不免横眉冷对，故其“文笔横霸”，具有凌厉的气势与震撼力。\n\n（三）风格瑰奇：龚文在艺术表现上，刻意追求不寻常的构思和语言表现，不落窠臼，想象奇特，文笔纵恣，形成诡异奇崛的独特风格。这使他的一些文章能突破一般的论议和记事的模式，富有杂文的色彩，文学意味更浓，在中国散文史上有其独特的贡献。","keywords":"经世散文 转折 反映社会现实 追求个性解放 识深 气悍 风格瑰奇","note":"龚自珍的散文是在公羊学和阳湖派文的基础上，又借鉴了先秦诸子和古代杂文体的手法，形成了独特的龚氏文风，笔端常带感情，注重形象的锤炼与主观体验的描述，杳渺深邃之思与俶诡连犿的文辞相得益彰，在桐城派古文、骈体文之外另开一种新文风。这种文风与晚清的议政文、报章文以及梁启超的新民体都有渊源关系，也影响了“五四”之后新杂文体的风貌。"},{"id":"462","stars":"★","title":"谈谈你对宋诗派的认识","body":"在历史猛然折入近代行程时，除得风气之先的人物外，传统文坛一般还在循着惯性向前推演。这时在诗歌领域，有偏于宋诗格调的流派兴起，文学史上称之为“宋诗派”或“宋诗运动”。\n\n一、代表人物\n\n宋诗派在道、咸年间的主要人物有程恩泽、祁寯藻、何绍基、郑珍、莫友芝等。太平天国时期曾国藩又为之登高振臂，推波助澜。程恩泽、祁寯藻、曾国藩都身居高位，在学术和文学上均有成就，以他们的政治地位和社会影响，有力地推进了宗宋诗风的展开。\n\n二、产生原因\n\n（一）清初中期宗宋诗风的继续\n\n从钱、黄等人到翁方纲，清代初中期的宗宋诗人围绕唐诗与宋诗，学问与性情，学人与诗人这一诗学问题展开了热烈的探讨。由钱、黄的性情而兼学问至翁方纲的以义理而兼诗理，意味着诗学理论的一种新调整，也是自“诗言志”理论被接受以来，围绕志分情、理所产生纷争后的一种阐释结果。它使得原本藉托于唐诗的宋诗成为与唐诗抒情传统相抗衡的审美传统之一，深深地影响着后来的宋诗派。\n\n（二）时代对文学的制约\n\n我国古典诗歌有悠久的历史和辉煌的成就，思想与艺术都有广泛的开拓与精妙的创造，积累深厚，如果说此前的诗人已面临创新的艰难，那么，近代诗人尤其如此。汉魏以后，唐诗重兴象，妙在神韵空灵，但开拓空间有限，容易流于千口一声的老调子，而且唐诗的蕴藉含蓄、情致意境以及高格朗调已不适合表达当时诗人的内感外激；宋诗重写事，妙在实处，相对似有拓展空间，而且学人的深湛之思、诗人的见微知著，通过宗法宋诗更易寻求抒写渠道。故一些诗人走上宋诗路数，希望有所出新。\n\n三、文学主张\n\n宋诗派所谓学宋并非专门学宋，大体上是学杜甫、韩愈、苏轼、黄庭坚，确立以杜韩苏黄为主体的诗学体系。他们的诗学主张主要有两点：\n\n（一）强调诗品的“不俗”\n\n宋诗派认为，诗人必须首先通过读书修身养气，达到为人之独立不迁，“同流合污，胸无是非，或逐时好，或傍古人，是谓之俗。直起直落，独来独往，有感则通，见义则赴，是谓不俗”。“不俗”是未诗派的理论根基，表现在文学上，就是独创新奇，语必惊人，字忌习见。\n\n（二）追求学人之诗与诗人之诗合一\n\n宋诗派的主要作家大多是学者兼诗人，因此这一派特别强调读书养气。宋诗派注重创作主体的学行实践，学问与理气的涵养使诗歌产生一种理性体验和感悟。他们认为在传统文化结晶的基础上，能够磨砺人格，自立于天地之间，产生一种新的性情，进入一个独立、自创的文学境界。他们的看法在桐城诗论的基础上进一步缓解了自浙派到翁方纲以来学问与性情的紧张和冲突，亦为陈衍的学人之诗理论作了铺垫。","keywords":"代表人物 产生原因 宗宋诗风的继续 时代对文学的制约 文学主张 强调诗品的“不俗”学人之诗与诗人之诗合一","note":"宋诗派以名词解释的形式出现较多，若出现简答题或是论述题的形式，可将理论主张结合具体作品进行论述分析。宋诗派的出现既有时代的影响，也有其历史渊源，可以与清代前中期的钱谦益、黄宗羲、翁方纲等宗宋诗人联系起来，这些大家都要注意。相关内容可以参考贺国强《近代宋诗派研究》，具体资料可以在李凡文学正版群领取。"},{"id":"463","stars":"★★","title":"试分析近代小说创作繁荣的原因（25上海社会科学院）","body":"一、时代变革的需要\n\n中日甲午之战以后，新兴的资产阶级初步形成，开始以一个阶级过问政治，提出改良主义的理论，文学改良运动也配合政治运动而兴起。维新派从西方国家的历史中看到小说在思想启蒙和社会变革中的作用，把小说从社会文学结构的边缘推到中心的地位。半封建半殖民地的社会现实，使一些爱国作家以小说为工具，揭示社会的丑恶面目和国家的危亡局面，以促进群众的觉醒。\n\n二、作家自觉意识提高，创作热情高涨\n\n小说理论的兴起，对小说社会作用的认识空前提高，促进了对社会有改革之志的作家的创作热情和自觉意识。从1900年左右到1910年之间，出现了很多反映改良主义政治要求的小说理论，主要有梁启超的《小说与群治之关系》，夏曾佑的《小说理论》，徐念慈的《小说林缘起》等。\n\n三、新闻、杂志和出版事业发展，小说市场、读者群体壮大\n\n新闻、杂志和出版事业的发展，给小说翻译和创作提供了广阔的发展园地和便利条件。印刷业的发达，报刊的大量出现，为小说创作的繁荣提供了客观条件。依赖通商口岸、现代都市和印刷出版工业及大众传媒出现的都市文学刊物，一方面因适应了都市市民大众的“消闲”“娱乐”要求，从而建立起市场和读者群；一方面又为那些由于种种原因而脱离了传统的“学优而仕”的人生事业格式的知识分子，从传统文人向现代职业作家转变提供了物质条件，使依靠报刊杂志、读者市场和稿酬谋生的“作家”这一职业得到确立，一批职业作家由此在清末逐渐出现。\n\n四、翻译小说的引入推动了小说创作艺术提升\n\n中国近代史上，在外有列强侵略、内有腐败政府的历史背景下，一批有识之士译介了大量的外国文学作品，欲以文学开启民智，达到救国济民的目的。译介作品数量之丰、规模之大达到了历史上文学译介之顶峰。这些外国文学译本，对中国文学，尤其是小说创作产生了深远的影响：拓展了小说家的思想、丰富了小说类型、改革了小说语言、改变了传统小说的艺术创作方法。","keywords":"时代变革的需要 作家自觉意识提高 创作热情高涨 市场、读者群体壮大 翻译小说的引入","note":"近代小说繁荣首先得益于文学观念的转变，小说的地位提高，导致许多作家自觉以小说为工具针砭时弊、推动改革。当然，除了观念的转变之外，小说内部的作家因素和外部的读者、市场因素的影响也不容忽视。正是在这样的基础上，诞生了一系列优秀的小说作品。"},{"id":"464","stars":"★★","title":"试论述资产阶级改良时期小说创作的特点","body":"所谓资产阶级改良时期指的是戊戌变法时期，这一时期的小说主要反映改良主义要求，具体表现出如下特征：\n\n一、强烈的政治色彩\n\n资产阶级改良时期的小说作者虽然立场不同，题材也很多样，但都能反映重大事件，有意识地通过小说表明自己的立场，宣扬自己的观点，而使小说带有一种强烈的政治色彩。反映帝国主义侵略的，有林纾的《京华碧血录》；反映工商界争斗及买办阶级的，有吴趼人的《发财秘诀》；直接宣传资产阶级改良运动的，有梁启超的《新中国未来记》等等。\n\n二、多使用现实主义手法\n\n从创作方法上来看，批判现实主义是资产阶级改良时期小说家普遍采用的创作方法，这主要是由于作家的创作目的就在于暴露现实的丑恶，以唤起民众的改革愿望。鲁迅在《中国小说史略》中说：“群乃知政府不足与图治，顿有掊击之意矣。其在小说，则揭发伏藏，显其弊恶，而于时政，严加纠弹，或更扩充，并及风俗。”这个时期的小说普遍接受《儒林外史》的影响，同时又有新的发展。在结构上，大多采用了“全书无主干，仅驱使各种人物行列而来”的办法。当然，这也有发展，如《老残游记》中的老残不仅起了引线作用，还充当了主人公。在讽刺手法的运用上，这一时期小说受《儒林外史》的影响也较大，只是谴责小说的讽刺采取了夸张和漫画化的手法，比较浅露和直接。\n\n三、现代小说手法出现\n\n由于这一时期外国小说的大量翻译，小说的创作在表现手法上出现了新因素的萌芽，像大段的心理刻画，长段落的景物描写，像倒叙、插叙的运用，像第一人称的写法等。这些虽然还不太普遍，但在《九命奇冤》《文明小史》《老残游记》中已经有了应用。\n\n四、与小说理论互相影响，互相促进\n\n梁启超办的《新小说》杂志不仅刊载小说，还刊载小说理论，开辟专栏发表小说评论。在他的带动下，这一时期小说批评、考证、研究红极一时。可以说中国小说只有到了这个时期，才开始在比较明确的小说理论指导下进行创作。","keywords":"政治色彩 现实主义 现代小说手法出现 新因素萌芽 与小说理论互相影响","note":"资产阶级改良时期的小说创作，呈现出过渡性的特色，一方面在内容与讽刺手法上受中国古代小说如《儒林外史》的影响，另一方面在叙述手法上吸收外国小说经验。同时，这时期的小说第一次在比较明确的小说理论指导下进行创作，这些内容大家要有所了解。"},{"id":"465","stars":"★★★","title":"试分析近代侠义公案小说发展趋向（中国社会科学院大学）","body":"【答题框架】\n\n近代前期小说的发展，承受着文化专制政策与商业媚俗倾向的双重负荷，侠义小说与公案小说的合流，是这一时期侠义公案小说的总体发展趋向。此类小说虽承《水浒传》之勇侠，精神则已蜕变，其人文蕴涵大体在于回归世俗，表现了鲜明的取容于封建法权、封建伦理的倾向。\n\n一、侠义公案小说合流后的发展趋向\n\n（一）从以武犯禁到皈依皇权\n\n古代“侠”的特质，韩非曾一针见血地指出是“以武犯禁”，是在法外维持正义，具有对封建法权挑战的品格，而侠义公案小说则将侠客与清官统而为一，将其纳入封建法权的运行机制之中。\n\n（二）江湖义气被恋主情结所取代\n\n侠客精神中重然诺、轻生死、为朋友两肋插刀等江湖义气趋于淡化，而士为知己者死的思想则趋于强化，发展成为失落自我的恋主情结。《施公案》中的黄天霸为救施仕伦而杀兄逼嫂就是明显的例子。\n\n（三）从绝情泯欲到儿女英雄\n\n古侠客大都摈弃女色，《水浒传》中第一流的豪杰清一色是“赤条条来去无牵挂”。侠义公案小说则推出“儿女英雄”模式，《绿牡丹》写江湖侠女花碧莲对将门之子骆宏勋的痴情苦恋，开英雄美人风气；《儿女英雄传》为侠女十三妹在雍熙和睦的家庭中找到安身立命之地，“英雄至性”与“儿女真情”合而为一，遂开其后武侠而兼言情小说的风气。\n\n（四）清官的忠君色彩加浓，爱民思想相对淡化\n\n《施公案》第三十回写清官施仕伦劝教黄天霸“尽忠岂能顾众”便是一个典型的例子。清官的主要任务，渐由为百姓的折狱断案、伸冤雪恨，发展为直接维护王朝的除“盗”平叛-镇压一切反抗官府的力量。\n\n二、侠义公案小说内容转变的原因\n\n（一）适应清王朝的政治需要\n\n清代自嘉庆以后国势转衰，农民起义和少数民族反抗斗争不断爆发。而这时清王朝因承平日久，武备废弛。统治者面对这种情况，便一方面转而重用各州县地主武装的“团练乡勇”；另一方面在剿的前提下，更加注意做起义队伍中的策反工作。公案侠义小说中的卢方和丁家兄弟等人物，便是当时社会现实的反映。这就是说，公案侠义小说这种内容上的改变，是适应清王朝的政治需要而出现的。\n\n（二）代表了平民百姓的理想和愿望\n\n清廉公正的官吏为百姓折狱断案，伸冤雪恨；行侠仗义的侠客出来济困扶危，惩恶除奸，一方面固然可以维护封建统治阶级的长治久安，另一方面也给人民带来了直接的好处。小说所表现的这种思想虽然并不高明，然而它在当时的历史条件下代表了平民百姓的理想和愿望，它是黑暗社会里无数受害无告的人们拯救苦难的心灵的寄托，因而投合了最大多数民众的口味。\n\n（三）作者的复杂性和特殊性\n\n清代说书业相当繁荣，说书人的敷衍对侠义公案小说的思想和艺术起决定性作用。他们既受普通百姓的思想影响，也受统治阶级的意识感染。他们说书时还要注意照顾和迎合各种听众的兴趣、爱好。公案侠义小说所表现出来的思想内容和艺术技巧上的长短优劣，与它们的作者的复杂性和特殊性有着直接的关系。\n\n（四）侠义小说传统的影响\n\n中国古代刺客的“士为知己者死”的信条到唐代传奇中已融为一部分豪侠的血肉。《聂隐娘》和《虬髯客传》等作品中所写的侠士已渐现弃暗投明之端倪。《水浒传》更具体地描写了宋江等一百零八人接受招安，为朝廷征剿方腊农民起义的故事。公案侠义小说写清官带领一批“侠客”铲恶锄奸，除“盗”平叛，正是我国侠义小说传统的继承和发展。\n\n近代侠义公案小说的发展趋向既是传统侠义精神的延续，也是中国小说现代化进程中的重要过渡形态，为民国武侠小说的崛起提供了叙事经验和读者基础。","keywords":"转变 以武犯禁 皈依皇权 江湖义气 恋主情结 绝情泯欲 儿女英雄 忠君色彩加浓 爱民思想淡化 原因 适应政治需要 平民百姓理想愿望 作者复杂特殊 侠义小说传统","note":"侠义小说和公案小说在近代合流的原因还是在于政治的腐败和民生的困苦，让群众将美好理想寄托在伸张正义的清官与铲霸诛恶上，但由于受到当时封建纲常礼教的束缚，和之前的侠义小说相比，合流之后的小说呈现出很大的变化，这些大家需要有所了解。相关论文可以参考王俊年《侠义公案小说的演化及其在晚清繁盛的原因》，具体资料可以在李凡文学正版群领取。"},{"id":"466","stars":"★★★","title":"试分析《海上花列传》的创作特征","body":"《海上花列传》是近代狭邪小说重要的代表作，作者是韩邦庆。近代狭邪小说自身有一个由言情小说向社会小说的演变过程，此书在演变过程中起了关键的作用。《海上花列传》达到了很高的艺术成就，其创作特征，主要表现在以下方面：\n\n一、真实观照人性\n\n《海上花列传》既非抉发黑幕的谤书，亦非劝善惩恶之作，它体现了一种对于人的生存处境的悲悯，深得人的文学之真谛。作家只是按照生活的本来面目，写出了欲海狂澜中人的异化和沉沦。小说全然摆脱了中国传统的那种理想化的、美善合一的叙事谋略，还原了滚滚红尘中蠕蠕而动的生命本色。书中人物仿佛在一张巨大的、无形的罪恶之网中挣扎，他们非善非恶，或曰亦善亦恶。\n\n二、“穿插”和“藏闪”结合的叙事手法\n\n作家最为自诩的是小说的结构艺术：“惟穿插藏闪之法，则为从来说部所未有。”所谓“穿插”之法，即指几组故事平行发展，穿插映带，首尾呼应，构成脉络贯通、立体交叉的整体布局；所谓“藏闪”之法，即指藏头露尾的绵密笔法，“正面文章如是如是；尚有一半反面文章藏在字句之间，令人意会”。“穿插”手法具有加强悬念的作用，在很大程度上丰富了读者的想象空间。它与“藏闪”之法的结合，就构成了《海上花列传》在叙述方法上的创新，并且部分地显示出叙述模式从全知视角向非全知视角转变的迹象。\n\n三、以白描手法塑造人物，个性鲜明\n\n《海上花列传》人物性格的刻画塑造，以白描传神见功力，作家概括为“无雷同”“无矛盾”“无挂漏”，小说笔致细腻，对人物言、行的描写真切而生动，可谓栩栩如生、恍在眼前，能充分显示出人物的性格特征，诸如陆秀宝的放荡，杨媛媛的诡谲，姚文君的飒爽，卫霞仙的锋利，周双玉的任性骄盈，张蕙贞的水性杨花，人各一面。\n\n四、人物对话中吴语的成功运用，具有浓郁的地方色彩\n\n《海上花列传》的语言运用具有地方特色：叙事、描写用普通白话，记言或对话皆用吴方言。胡适称它为吴语文学的开山之作，认为它创造了独立的吴语文学。所有那些酒筵酬酢，鬓边絮语，乃至相调相侃，相讥相置，无不声口妙肖，充分显示了吴侬软语的魅力，成为一部具有浓郁的地域文化色彩的作品。","keywords":"真实观照人性“穿插”“藏闪”白描手法 个性鲜明 对话运用吴语 浓郁的地方色彩","note":"在中国现代文学的发展上，晚清有着先于甚或超过“五四”的开创性。“海派”文学最大的特色-繁华与糜烂的同体文化模式，正是由《海上花列传》开始形成。而且《海上花列传》明显高于其他地区创作的邪狭小说之处，就是它的“恶之花”中包含了“现代性”的蓓蕾。小说《海上花列传》以独特的艺术魅力被称为《红楼梦》之后又一高峰，这一评价似有过奖之处，但也证明了此书的价值。"},{"id":"467","stars":"★","title":"试分析京剧文学的历史成就","body":"大约在道光末年到咸丰初年，京剧形成，并一跃而居于全国剧坛盟主的地位，经久不衰，取得了如下艺术成就：\n\n一、推动了中国戏曲舞台艺术的发展\n\n京剧剧本的场次结构，情节安排和塑造人物的手法，都比杂剧和传奇进了一步。元杂剧的结构简陋，四折一楔子和一人主唱的框架严重地限制了剧情的展开和人物性格的深化，更妨碍了舞台艺术的发展。明传奇又失于繁冗，结构散漫，冗场冗角比比皆是，加以文词过于典雅，致使传奇逐渐珍列于案头，沦亡于舞台。京剧剧本适应了近代观众的欣赏要求和新式剧场的演出习惯，相对来说比杂剧和传奇的主线更集中，情节更精巧，冗场冗角减少了，容量也比较适中；念白与唱词的疏密安排，相互衔接，以及词格句式的变化等等都与唱、念、做、打更相适应。可以说，中国戏曲舞台艺术的综合性，在京剧艺术中达到了最完美的高度。\n\n二、确立了规范化的板式音乐体系\n\n我国的戏曲音乐在历史上形成了两种不同的结构体系：曲牌联套结构和板式变化结构。古典戏曲从杂剧、南戏，直到昆腔、弋阳腔，都是采用曲牌联套结构。及至梆子、皮簧兴起，创造了以板式变化为主的板腔体。板腔体始由子、皮发展，后由京戏集其大成，使我国的戏曲音乐发展到了一个新阶段。板腔体的曲文大都质朴、通俗、本色，不同于传奇杂剧曲文的典雅华美，这导致戏剧审美意识由重曲到重戏的变化，以角色的唱念做打的舞台表演艺术为主，从而与古典式的传奇杂剧分道扬镳。\n\n三、题材广泛，反映了人民的朴素愿望\n\n京剧在发展过程中向兄弟剧种和说唱文学吸收了大量的剧目，许多传奇、杂剧的名著也被改编上演，同时还接受了清代内廷“雅部”串演长篇历史传说故事的影响。经过京剧艺人的集体创作和在长期舞台实践中的不断提高，许多剧本都成为群众所喜闻乐见的舞台演出本。现在搜集到的京剧传统剧目约有一千二百多种，题材十分广泛，其中反映古代政治、军事斗争的戏占有重要的地位，许多优秀的剧本都从不同角度表达了人民的意愿，反映了封建社会的种种矛盾，歌颂了反侵略反压迫的斗争，并且塑造了人民爱戴的英雄形象，讽刺和抨击了那些为人民所憎恶的各种反面人物。","keywords":"推动了中国戏曲舞台艺术的发展 确立了规范化的板式音乐体系 题材广泛 反映了人民的朴素愿望","note":"京剧相关内容在考查中整体出现较少，不过这一剧种直到当下仍然产生着重要的影响，所以相关内容我们还是要了解一下。京剧的历史成就，一方面表现在舞台艺术和音乐上，另一方面则主要体现在其广泛的内容上，这两个方面我们都要了解。"},{"id":"468","stars":"★★","title":"谈谈你对“诗界革命”的认识","body":"近代后期由资产阶级文化思想更新带来的文学变革之一，是诗歌领域出现的“诗界革命”。\n\n一、诗界革命的概念\n\n诗界革命是近代文学史上的诗歌改良运动，是资产阶级改良运动的有机组成部分。在戊戌变法前，随着资产阶级改良运动的高涨，梁启超、夏曾佑、谭嗣同等人提出“诗界革命”的口号，并试作新诗，但这时只不过在诗句里运用些新名词，还没有真正从诗的思想内容和艺术形式上去进行革新。\n\n二、诗界革命的内容\n\n在“诗界革命”运动中，成就最高的是黄遵宪，作为诗界革命的旗帜，他提出“我手写我口”，要求诗歌反映现实生活和斗争，在表现方法上主张利用古人的优良艺术传统，并结合新事物，利用新语言。\n\n戊戌变法失败后，梁启超在日本继续鼓吹“诗界革命”，他批判了“以堆积满纸新名词为革命”的诗风，提出“能以旧风格含新意境，斯可以举革命之实矣”，力求解决诗歌为改良运动服务的问题。\n\n三、诗界革命进步性与局限性\n\n（一）进步性\n\n（1）诗界革命冲击了长期统治诗坛的拟古主义、形式主义倾向，要求作家努力反映新的时代和新的思想，部分新体诗语言趋于通俗，不受旧体格律束缚，这些在当时都起了解放诗歌表现力的作用。\n\n（2）诗界革命的作者都不同程度地要求取法西方。这一时期，民间歌谣体也得到了一定程度的改造和利用。后期诗界革命更是要求“以旧风格含新意境”，这有着一定的突破性和创新性。\n\n（二）局限性\n\n（1）梁启超等强调保持旧风格，这就束缚了手脚，只是旧瓶装新酒，在中国古典诗歌的改革上虽有前进，却前进不大。\n\n（2）随着改良派政治上的堕落，诗界革命的旗帜逐渐收起。资产阶级革命派和改良派政治上对立，他们中部分人接受过诗界革命影响，但是，不愿意明确地以诗界革命相号召，有的人则企图“别创一宗”，于是诗界革命就很快衰落，乃至销声匿迹了。","keywords":"诗界革命概念 诗界革命内容 进步性 解放诗歌表现力 突破性 创新性 局限性 保持旧风格 改良派政治上的堕落","note":"诗界革命是文学考研考查的重要知识，多数情况下会以名词解释的形式进行考查，大家要注意一下。不过也不排除有学校会出简答题的可能性，所以在这里给大家准备了一道题目。"},{"id":"469","stars":"★★","title":"试分析黄遵宪诗歌的主要内容","body":"黄遵宪的诗“诗之外有事，诗之中有人”，广泛反映了诗人经历的时代，具有深厚的历史内容。\n\n一、反映了新世界的奇异风物以及新的思想文化\n\n黄遵宪的诗，反映了新世界的奇异风物以及新的思想文化，开辟了诗歌史上从来未有的广阔的领域。时代变了，生活变了，接触了新世界，就给他的诗歌创作带来了新源泉、新意境。有名的《今别离》四首，就歌咏了轮船火车、电报、照相片、东西半球昼夜相反四事，这类写新事物，新文化的诗，反映近代社会生活的巨大变化，表现新的思想感情，是一种有历史意义的创造。他写新世界的景物，如《八月十五夜太平洋舟中望月作歌》，即景抒情，奇境独辟，广阔的眼界和胸襟消融了向来旅客所惯有的孤独情绪，也是近代社会生活巨大变化的反映。\n\n二、表现反帝卫国斗争，具有爱国主义激情\n\n黄遵宪时刻关心国家民族的命运，描写了一系列的重大历史事件，突出地反映了中国近代社会的主要矛盾，特别是帝国主义列强与中华民族的矛盾，从抵抗英法联军到庚子事变，都有鲜明反映，表现了强烈的爱国主义精神。特别是关于中日战争，他写下的《悲平壤》《哀旅顺》《哭威海》《台湾行》《渡辽将军歌》等系列诗作，反帝卫国思想尤为突出。诗人在这类主题的作品里颂扬抗战，抨击投降。其中不少篇章，规模宏伟、形象生动，表现出诗歌大家的气魄和功力。如《冯将军歌》就将中法战争中爱国将领冯子材鸷猛无前的英雄形象和冯军排山倒海的气势，活现在纸上。\n\n三、表达对维新变法的支持\n\n黄遵宪早在《感怀》《杂感》《日本杂事诗》等作品中即批判陈腐事物，赞赏派遣留学生和日本明治维新等新事物。后来他更以饱满的热情讴歌变法维新，期望能通过变革使中华民族重新崛起。戊戌政变发生，他作《感事》《仰天》等诗痛惜新政天折，忧虞国家前途，百感交集，情思深挚，但他没有动摇自己的信念，坚信变旧趋新的历史潮流不可扼抑的精神，贯穿在他的诗作中。","keywords":"新世界的奇异风物 新的思想文化 表现反帝卫国斗争 爱国主义激情 表达对维新变法的支持","note":"黄遵宪被称为“诗界革命”的旗帜，其诗歌的内容与当时的时代潮流是联系在一起的。在当时，外来的新思想和新风物涌入中国，给中国社会带来了翻天覆地的变化。在这一过程中，反抗外来侵略和谋求自身变革的斗争一直连绵不绝。这些内容，在黄遵宪的诗歌中都有反映。"},{"id":"470","stars":"★★★","title":"试分析黄遵宪诗歌的创作特征","body":"作为“诗界革命”的一面旗帜，黄遵宪广泛吸取前人成就，并不断推陈出新，创作了一系列别具一格的“我之诗”，其诗特点如下：\n\n一、真切的写实\n\n黄遵宪的诗虽然常有一种前瞻追求的浪漫豪情，但更主要的方面是真切的写实。他有不少鸿篇巨制，篇幅都超越古人，往往自成某一方面小史，如《番客篇》近于华侨南洋开发史，《逐客篇》堪称赴美华工血泪史，《拜曾祖母李太夫人墓》不啻作者的家族史与童年生活史。\n\n黄遵宪善于以细致的笔墨叙事、状物、写景，铺排场面，勾画人物，既内容丰富，又形象生动。他的许多名篇如《冯将军歌》《降将军歌》《台湾行》《番客篇》都形象鲜明。如《冯将军歌》描写抗法老将冯子材的英勇善战、军令威严，在他的统帅下，将士们万众一心、奋勇杀敌，氛围浓重，场面热烈，其英雄形象跃然纸上。\n\n二、吸取古人以文为诗的经验\n\n为了表现丰富的现实内容，黄遵宪比较注意吸取古人以文为诗的经验，用古文家伸缩离合之法以入诗。语法的规范性和完整性、开放的文本结构、以议论为诗是黄遵宪诗歌中以文为诗的主要体现。黄遵宪取其长而避其短，在篇章结构上，注意波澜曲折，长而不板；叙写上多用比兴与描写，减少抽象直陈；议论尽量精要，并安置于描写之后，使之有水到渠成、画龙点睛之妙。长短不一的句式加上相对完整的语法结构，使其诗歌创作显示出一种向散文靠拢的艺术端倪。\n\n三、词汇丰赡，富于表现力\n\n黄遵宪广泛采摘语言资料，同时又不排斥“流俗语”。这使他的诗歌词汇丰赡，富于表现力，典雅之中多生气与变化。他出于写外国事、记叙时事和表情达意的需要，恰当而有节制地使用译言及新名词，如地球、赤道、国会、共和、维新、革命、殖民地、五大洲、南北极等新名词，欧罗巴、美利坚、亚细亚、华盛顿、拿破仑、嘉富洱、玛志尼等译言。这些新语句与古近体诗传统表现风格的和谐统一，凸现出黄遵宪新派诗特有的面貌与境界。\n\n黄遵宪的诗“以旧风格含新意境”，体现了由旧到新的过渡。","keywords":"真切的写实 吸取古人以文为诗的经验 词汇丰赡 富于表现力","note":"黄遵宪对诗歌的革新，主要体现在其语言上，表现为多种新名词的使用，创造了新的意境。但从风格上来看，其诗歌更多地受到了古代诗歌传统的影响，在手法和结构上更多地表现为传统诗歌的特征。这也是“诗界革命”的整体特征，虽然使用了新的名词表现了新的内容，但其格调依旧是旧的。"},{"id":"471","stars":"★★","title":"谈谈你对“文界革命”的认识","body":"1899年12月，梁启超从日本横滨乘船去夏威夷，在船上阅读日本三大新闻主笔之一德富苏峰的著作，颇有感触，于是在《夏威夷游记》中明确提出“文界革命”的口号。\n\n一、“文界革命”的目标\n\n“文界革命”在思想与文学革命的链条中具有最重要的意义。能否在刚刚形成的中国现代公共领域内拥有最广大的阅读公众，以清高之理，美妙之文，输入文明思想，培育国民精神，对于思想与学术百废待兴的中国来说，是一项穆高如山、浩长似水的伟大事业。梁启超为“文界革命”设置的目标，就是要在传统的抒写个人情志的文人之文和以经术为本源的述学之文外，创造出会通中外，融汇古今，热情奔放，悲壮淋漓，自由抒写，流畅锐达的文章新体。\n\n二、“文界革命”的内容\n\n概括而言，梁启超倡言的“文界革命”大致包含以下层面的内容：\n\n（一）“文界革命”的范围是以报章文体为主的著译之业，著译之业在国家民族“非死中求生不足以达彼岸”的危急局势下当以“播文明思想于国民”，促进国家民族的精神维新为最高责任。\n\n（二）著译之业“播文明思想于国民”，当选择从众向俗，化雅为俗，启发蒙昧，导愚觉世的路向，其法度规制与古雅渊懿的述学之文、清正雅洁的作者之文有别。\n\n（三）著译之业谋篇行文当讲求条理细备，洗练锐达，雄放隽快，慷慨淋漓的文风。\n\n三、“文界革命”的意义\n\n（一）增强了散文创作的现实针对性\n\n“文界革命”的理论主张冲破了传统散文的各种清规戒律，使散文从“文以载道”和“替圣贤立言”的目的规范中解放出来，成为融入社会现实，面向广大民众的具有新鲜血肉和切实内容的崭新文体。\n\n（二）丰富了散文词汇系统，更新了散文语言风格\n\n“文界革命”的理论主张也使散文挣脱了桐城、八股等僵化凝固的文体规范，成为不拘一格、自由抒写的崭新文体。尤其是在“新文体”的创作实践中，与“欧西文思”相对应的大量西方新名词，如“国民性”“人权”“功利主义”“专制主义”等，得到了介绍传播。这些“新名词”的输入冲击了“古文辞”的格律、习用典故和陈腐语汇，改造和丰富了文言的词汇系统，更新了文学语言的风格，还促进了散文创作主体价值观念与思维方式的变革。","keywords":"目标 创造文章新体 内容 范围是以报章文体为主的著译之业 从众向俗 条理细备 雄放隽快 意义 增强现实针对性 丰富词汇系统 更新语言风格","note":"“文界革命”虽然也要求从众向俗，但与白话文运动还是有很大的区别，这主要表现在范围局限在报刊文体、注重说教等方面，大家要注意这些区别。相关内容可以参考关爱和《梁启超与文学界革命》，具体资料可以在李凡文学正版群中领取。“文界革命”也是常出现的一道名词解释，大家要注意一下。"},{"id":"472","stars":"★★★","title":"简述梁启超“新文体”散文的特点","body":"梁启超既是“文界革命”口号的提出者，又是新文体的成功创造者。他所创作的“新文体”散文，或叫“时务文体”“新民体”，以比较通俗而富有煽动力的文字运载新思想，震撼了当时的文坛。这种略有变革的文体是对传统古文一次猛烈的冲击，为晚清的文体解放和“五四”的白话文运动开辟了道路，成为我国散文由文言向白话过渡的桥梁。总的来说，梁启超新文体散文的特点主要包括以下内容：\n\n一、以宣传维新变法和思想启蒙为主要内容和目的\n\n梁启超将自己的报章之文视作“觉世之文”，是一种宣传文字。“新文体”以宣传维新变法和思想启蒙为主要内容和目的。《时务报》时期侧重于维新变法宣传（如《变法通议》），《新民丛报》时期偏向“新民”启蒙（如《新民说》）。这些文章表达的都是立于时代潮头的思想，这也是梁氏文章能吸引时代读者的根本原因。\n\n二、自由解放\n\n“新文体”是一种解放性的写作。文体方面，桐城派雅洁的追求、魏晋文矜炼的宗尚，均被梁启超拒之门外；内容方面，文章所述没有禁区，作家自由大胆地抒写己见，思想新警动人；语言方面也不设防，纵笔所至，自由挥写。\n\n三、文风平易畅达\n\n“新文体”不避俚语俗言，文白相杂，成为一种浅近的文言文体；又能打破骈体与散体的严格界限，不分有韵与无韵；同时还能吸收外来新词新语和外国语法，改良文体的语言素质。所以文章词汇丰富，句法灵活，艺术手段多种多样，大大提高了散文的表现力。\n\n四、条理明晰\n\n梁启超的“新文体”讲究逻辑。虽然“纵笔所至不检束”，但议论说理层层推进、步步紧逼，行文起讫自由，各自成段，分项申说，洋洋洒洒，尽意方休，即使长至万言的长篇，亦眉目清晰，往往在题目之下，各部分再列小目，小目之下，又分项论述。同时又能综合利用类比、比喻、事例等论证手法予以辅助，产生强大的说服力量。\n\n五、笔锋常带情感\n\n新文体散文的议论能够情理交织，不但以理服人，还能以情动人。新文体“慷慨论天下事”，激情洋溢，浩莽奔放，虎虎有生气。作者往往倾注充沛的情感，用铺排的笔墨使文章动人心魂，产生极大的鼓动性、说服力和感染力。\n\n总之，梁启超的新文体散文，以其思想之新颖、形式之通俗、艺术之魅力，影响几乎整整一代人，也成为“五四”时期“文体改革的先导”。","keywords":"宣传文字 自由解放 平易畅达 条理明晰 笔锋常带情感","note":"关于“新文体”作品的文体特色，梁启超在1920年出版的《清代学术概论》中有一段“夫子自道”**：**“启超夙不喜桐城派古文，幼年为文，学晚汉魏晋，颇尚矜炼。至是自解放，务为平易畅达，时杂以俚语、韵语及外国语法，纵笔所至不检束，学者竞效之，号‘新文体”。老辈则痛恨，诋为野狐。然其文条理明晰，笔锋常带情感，对于读者，别有一种魔力焉。”作答时，简要结合这段自述进行分析即可。"},{"id":"473","stars":"★★★","title":"试述梁启超对中国近代小说革新的贡献","body":"在晚清文学革新运动中，“小说界革命”改变了中国小说的走向，扭转了中国小说从乾隆以后走向低谷的不景气局面，而开始走向繁荣与近代化，也为“五四”新小说的产生打下了良好的基础。而梁启超在“小说界革命”中，贡献颇丰：\n\n一、创办《新小说》，为小说革新开辟阵地\n\n《新小说》是一本受西方和日本文学刊物影响的文学杂志，面向海外及全国发行，影响极其广泛深远。《新小说》的办刊宗旨，更体现了鲜明的时代特色，表现了维新派要借小说宣传维新变政和反帝爱国的主张，也表现了中国新兴资产阶级在文学上要变革封建文学的勇气和胆略。自《新小说》创刊以后，小说报刊如雨后春笋大量出现，而《新小说》的模式大都为尔后创办的小说报刊所借鉴；同时小说报刊的大量创办，又为小说革新起着促进的作用。\n\n二、努力开创小说理论研究的新领域、新模式\n\n梁启超在《新小说》里，开辟了“论说”专栏，刊载运用西方文学理论，用新的观点阐述小说的专论。晚清“小说界革命”，也正是在其理论指导下得到蓬勃发展，小说被誉为“文学之最上乘”，中国小说也从传统的才子佳人、公案、讲史的\n\n模式中脱颖而出，直接反映社会现实的社会小说、政治小说大量涌现，小说也终于冲破几千年封建文学的桎梏，登上了文学的“大雅之堂”。\n\n三、在小说创作上开辟了现实主义新蹊径\n\n《新中国未来记》是梁启超创作的唯-部长篇政治小说，也是“小说界革命”最早出现的小说创作成果，它标志着一种文学政治化、政治文学化的小说模式的诞生。这类小说，利弊参半，就“利”言之，它密切了文学与社会的关系，适应了当时救亡图强的社会需要，改变了小说不能直面社会的传统模式。但“弊”也比较明显，在他的小说理论的带动下，文学政治化、概念化的小说模式却成了小说家效法的时尚，从而也影响和局限了小说向艺术的深层发展。\n\n四、在结构和语言上，开一代新文风\n\n在结构上，将倒叙手法引进并运用到小说创作中，梁启超是第一人。如《新中国未来记》采用“幻梦倒影之法”，一开始就写小说的结局。这种倒叙的手法在中国传统小说中是没有的，是梁启超借鉴西方和日本小说创造的。在语言方面，《新中国未来记》完全采用语体文，也为近代小说语言语体化树立了楷模。","keywords":"《新小说》阵地 理论新领域 创作现实主义新蹊径 结构语言新文风","note":"梁启超对中国近代小说革新的贡献，首先在于开辟了小说革新的阵地，在这个阵地上，他又在理论和实践两方面为小说革新做出了具体指导与榜样。分析时按照这个思路作答即可。"},{"id":"474","stars":"★★★","title":"论述梁启超在近代文学史上的地位和贡献","body":"梁启超是近代杰出的文学家和资产阶级文学革新的主将，他发动并领导了一系列的文体革命，在各个领域都有突出贡献，具体表现如下：\n\n一、散文方面：倡导“文界革命”，开创新文体散文\n\n大约从1895年开始的十年间，是梁启超散文创作的全盛时期。著名作品有《少年中国说》《新民说》《呵旁观者文》《说希望》《谭嗣同传》《小说与群治之关系》等，半文半白，感情充沛，议论淋漓酣畅，富有鼓动性和感染力。文中大胆抨击清王朝腐朽透顶的官僚政治，对祖国繁荣富强寄予热望，使人警醒，发人深思。梁启超的新体散文，对一切传统古文是一次猛烈的冲击，显示出从古文到白话文的过渡性特征，新颖是其主要特色。许多人都崇拜和仿效其写法，为晚清的文体解放和“五四”的白话文运动开辟了道路。\n\n此外，梁启超不仅自己大力写作，而且在自己和他人创办的报刊上大力宣传，推荐发表这种新体散文，形成巨大的社会进步文学力量。因此可以说，在近代“文体革命”中，无论是创作实践还是理论倡导，梁启超都走在最前列。\n\n二、小说方面：倡导“小说界革命”，提高小说地位\n\n梁启超认为“小说为文学之最上乘”，一时发生了很大的影响。许多人都来探讨小说理论，肯定小说的社会地位和社会作用，抛弃了鄙视小说的传统态度，因而产生了对古典小说的新评价和创作新小说的新风气，对晚清文学有多方面影响。他认为小说在影响群众、教育群众方面有其他文学样式所不及的“熏”“浸”“刺”“提”的艺术感染力和“浅而易解”“乐而多趣”的普及性。这在促进小说同政治、群众的结合，引导小说成为改造社会的工具等方面，起了不小的作用。\n\n在提倡改良小说时，以梁启超为首的一批作者还创造了“小说丛话”的批评样式，模仿历代的词话、诗话等文学批评形式，或长或短，不拘格式，记载小说界轶事，发表自己对于小说问题的各种见解，在文学批评中创造了一种新的样式。\n\n三、诗歌方面：倡导“诗界革命”，为政治斗争服务\n\n梁启超自己写诗不多，但其戊戌变法前的诗作也积极反映重大政治事件，自觉为现实斗争服务。他在诗中即事抒怀，表现了对祖国命运的关切和改良政治的强烈愿望。诗风流畅，语言平易，形式自由，富于改革精神。如《爱国歌四章》《读陆放翁集》等讴歌爱国主义的诗章，产生了一定的意义和影响。\n\n梁启超不仅是当时新派诗的优异作者，而且专门写了《饮冰室诗话》，对当时的新派诗给予极力的鼓吹。这主要表现在宣传改良主义在诗歌方面的旗手-黄遵宪的诗作，宣扬和推广新体诗，特别是扩大优秀诗人黄遵宪的诗歌影响，也宣传康有为、谭嗣同、夏曾佑、蒋智由、丘逢甲等改良派诗人的诗作，并保存了大量关于所谓“诗界革命”的史料。\n\n四、戏剧方面：提倡“戏剧改良”\n\n梁启超创作的传奇剧本《新罗马》，采用意大利烧炭党人反对神圣同盟的斗争事迹，歌颂了烧炭党人英勇不屈的斗志，在当时带有颂扬改良派的政治宣传的意味。他写戏剧表现“新理想”，是有意义的尝试。\n\n五、介绍、引进西方文化和新的文学观念，为文学革新运动指明了方向\n\n梁启超在介绍西方文化方面有很大贡献，其介绍范围之广在近代中国知识分子中也是少有的，包括了哲学、政治、历史、法学、经济、教育、宗教等学科。在文学方面，他介绍与引进了西方18、19世纪资产阶级的文学和美学理论，并以此为思想武器指导了他所倡导的这次资产阶级文学革新运动。梁启超所引进的西方新的文学观和进步的文学思想，不仅为近代文学革新运动增加了新的血液和新的活力，而且也为近代文学的健康发展指明了方向。","keywords":"文界革命 新文体散文 小说界革命 提高小说地位 诗界革命 为政治斗争服务 戏剧改良 指明方向","note":"近代文学史上最重要的几个文学事件便是“三界革命”和戏剧改良运动，而这四个文学事件的发生，都离不开梁启超的倡导和推动，由此可见梁启超在近代文学史上的重要地位。不仅如此，这几个文学事件的余波还蔓延到现代文学史，某种程度上推动了“五四”文学革命的发生，所以对于梁启超的地位与影响，我们需要关注一下。"},{"id":"475","stars":"★★","title":"谈谈你对南社的认识","body":"随着中国同盟会的成立、资产阶级民主革命高潮的到来，出现了文学团体“南社”。\n\n一、成立过程\n\n南社最初酝酿于一九O七年，正式成立于一九0九年，发起人为陈去病、高旭和柳亚子。在第一次“雅集”的十七人中，有十四人是同盟会会员。它以提民族气节相号召，实际上是应和民族民主革命，反对清王朝的种族压迫和专制统治。命名为“南社”，意谓“操南音不忘本”，亦即表示反清革命。\n\n二、社团特征\n\n（一）南社的结社表现出鲜明的新特质\n\n南社与以往那种无严密组织的松散而不稳定的文人结社不同，而是有带约束力的社规、完整的组织架构，除雅集之外，还出版有社刊《南社丛刻》，颇具有现代性社团的气息。特别是它有明确的政治的与文学的追求目标：政治上以反清革命为职志，与当时的民主革命运动紧密呼应，不少社中人是民主革命的直接参与者。南社志在引导文学的发展方向，改变文坛旧况，使文学成为民主革命运动的助力。\n\n（二）强调对“几、复风流”的继承与发扬\n\n南社结社的性质与精神，与明末带有鲜明政治倾向的文士团体-几社、复社息息相通，一脉相承。故南社特别强调对“几、复风流”的继承与发扬。南社主要创始人在建立南社之前曾结为神交社，陈去病《神交社启》即从盛赞明末复社、几社叙起，以承继几、复风流相期许。柳亚子的《重题南社写真》亦云“风流坛坫成陈迹，盟誓河山葆令名”，要使已成陈迹的几、复风流再现当世。复社最盛时就曾在虎丘集会，南社第一次雅集选址亦在苏州虎丘，虽因其地有明末烈士张东阳祠，但亦与欣慕“几、复风流”相关。\n\n三、诗歌内容\n\n南社作为革命诗人群体，创作了大量诗歌，充分反映了从庚子事变至“五四”新文化运动的近代最后二十馀年历史，特别是本时期中震撼大地的反清民主革命风云。\n\n辛亥革命前，南社诗人诗歌着重于揭露清人入主中原，屠杀反抗者的残酷暴行-扬州十日，嘉定三屠，同时颂扬末明末忠贞不屈的烈士，以及哀悼为民主革命牺牲的社友，激扬反清革命风潮；辛亥之后，反动势力反扑频来，革命者抗争不断，从二次革命、护法战争、袁世凯称帝、张勋复辟，直至北洋军阀的混战及其黑暗统治，南社诗人都有鲜明的反映，给反动势力以猛烈抨击。","keywords":"成立过程 社团特征 鲜明的新特质 对“几、复风流”的继承与发扬 诗歌内容 反清民主革命风云","note":"南社是近代第一个革命文学团体，在性质上与之前的文学团体显示出了很大的区别，并积极参与到革命之中，反映了真实的革命风云。“南社”的成立和发展，标志着文学为革命服务的目的性更明确了，文学的战斗性和群众性也大大地加强了。南社是名词解释中比较常出现的内容，大家要注意一下。"},{"id":"476","stars":"★★","title":"简析同光体诗歌的特点","body":"“同光体”是指“同光以来诗人不专宗盛唐”的一派诗人。所谓“不专宗盛唐”，有两方面含义，一是隐隐与专宗盛唐的明七子相对，所以它是道光咸丰以来宋诗运动的继续；二是指其诗歌宗尚大大扩展，超逸盛唐，上探晋宋，下及中晚唐、北宋。“同光体”的诗歌主要具有如下特点：\n\n一、学古而不摹古\n\n作为宋诗运动的殿军，同光体把“不墨守盛唐”“不专宗盛唐”作为自己的诗学旗帜。这是一个指向多元，宽泛硕大的诗学旗帜。它鼓励诗派中的每个创作个体，在遵循由苏、黄上溯杜、韩诗学路径的前提下，获得自我发展、力破余地的最大空间。如陈衍提出“三元说”，即上元盛唐之开元，中元中唐之元和，下元北宋之元祐。沈曾植提出“三关说”，即作诗要通过宋之元祐、唐之元和、南朝刘宋之元嘉三关。虽然主要宗尚在宋，但其学古的主要精神则强调创造。所以他们强调学古而不呆板摹古，要有开拓创造。\n\n二、诗的语言多佶屈聱牙，艰涩难懂\n\n“同光体”诗人多学者，他们或是“博极群书，熟辽金元史学舆地”的考据家，或是“好用道藏佛典”的故事家，或是“恶熟恶俗”、好用生词拗句的学人，故“同光体”的诗多佶屈聱牙，艰涩难懂。沈曾植的诗就是“雅尚险奥，聱牙钩棘”，且极喜用僻典、佛典，陈三立的诗也多数奇奥难懂。\n\n三、追求字句上的新巧\n\n“同光体”诗人主张“恶俗恶熟”，所谓“恶俗恶熟”，固然也可以解释为艺术上的创新，但倘就“同光体”多数诗人和诗作而论，确切的解释是字句上的翻新求奇。这基本上没有摆脱江西诗派黄庭坚“点铁成金”“夺胎换骨”的窠臼。陈三立被近代宋诗派诗人推为宗师，他赞赏黄庭坚“刻造化手，初不用意为”，追求一种精思刻练、奇崛不俗而又能达于自然、不见斧凿痕迹的境界。其《十一月十四夜发南昌月江舟行》比喻、描写都超逸庸常，而又如出自然，不见刻炼之迹，反映了这种艺术努力的成果。","keywords":"学古而不摹古 语言艰涩难懂 字句新巧","note":"“同光体”的诗，成就不一。对这派诗人，应做具体分析，不可一笔抹煞。如陈三立、范当世、沈瑜庆、林旭等人，都写过一些关心时事、反映现实之作，表现了诗人对祖国命运的关注和忧虑。但就总的倾向而言，“同光体”派诗人在近代尖锐复杂的政治斗争中思想较保守，作品的时代气息较淡薄，倘和当时诗坛上的“诗界革命”派、“南社”诗人相比，则更加清晰地显示出这一弱点。相关内容可以参考关爱和《同光体诗人的诗学观与创作实践》，具体资料可以在李凡文学正版群领取。"},{"id":"477","stars":"★★","title":"谈谈你对“小说界革命”的认识","body":"清末的“小说界革命”完全抛弃了以小说为“稗史”的传统思想，引入西方近代的文学观念，重新确立小说的价值，使小说从“不登大雅之堂的末流”成为“文学之最上乘”，促进了传统小说内容和形式的革新，空前提高了小说的地位。\n\n一、“小说界革命”发生的过程\n\n（一）维新派开启“小说界革命”前奏\n\n戊戌变法前后，维新派放眼世界的政治经济形势，提出改革时政的政治主张，迫切需要利用各种文艺形式来开启民智，宣传他们变法图强的理念。他们办报纸、开学堂、提倡今语写作，注意到了小说的重要社会功能，敲响了“小说界革命”的前奏。维新派人士把目光投向被正统文人视为末流，不登大雅之堂的小说，正是看到了通俗浅近的小说对于开启民智的教化作用，希望小说能够成为醒世觉民的工具。\n\n（二）域外政治小说为“小说界革命”提供了借鉴\n\n在明治维新和民权运动期间，政治小说大盛于日本。梁启超在戊戌变法失败流亡日本之后，注意到政治小说对日本明治维新运动的影响，更加触发了他翻译、创作政治小说以为改造中国服务的目的。1898年，他在流亡日本的东渡途中，就把柴四郎的《佳人奇遇》翻译了过来，成为《清议报》连载的第一篇政治小说，接着又翻译连载了矢野龙溪的《经国美谈》，两篇小说在当时的中国都轰动一时。\n\n（三）1902年梁启超正式提出“小说界革命”口号\n\n1900年庚子国变，慈禧太后不得不作出改革新政的决定。对于国内的变革动向，梁启超通过对西方、日本社会的考察，反复思索，认为要真正改革，就必须废除专制政治，代之以民主立宪。他提出“新民”的主张-“欲维新吾国，当先维新我民”。1902年，梁启超办《新民丛报》，作《新民说》，围绕新民思想展开广泛论述。同年11月，《新小说》杂志在日本横滨创刊，梁启超撰文《论小说与群治之关系》，打出“小说界革命”的口号，为“新民”找到了最佳的途径。\n\n二、“小说界革命”的意义\n\n（一）提高了小说地位，弘扬小说的社会功能\n\n就文学的内部研究而言，梁启超“小说界革命”最突出的现代性贡献，是强调小说的文学性质及其在文学中“最上乘”的地位，使之出边缘走向中心，成为现代中国文学的主要体裁之一，从而彻底改变了中国古代文学仅仅以诗文为正宗的局面，揭开了20世纪中国小说史的真正序幕。\n\n（二）促进了晚清小说的繁荣\n\n“小说界革命”口号提出后的第二年，晚清小说创作出现了第一个高峰，计创作小说39部，为1900年的3倍。出现这样的状况，固然离不开庚子国变，人们救亡图存的时代背景，但是这一口号的作用也是不可忽视的。“小说界革命”口号可以说是一呼百应，促进了晚清小说创作的繁荣。\n\n（三）推动了近代稿酬制度的初步形成\n\n在我国，酬谢文人创作文学作品的资银一般称之为润笔。在小说界，由出版商支付给作者编者稿酬的事大约在明末清初的时候就已经出现，但就整个小说史来看，这种现象并不普遍，而且缺乏统一的标准。而《新小说》将所征求的稿件明确分为若干等级，并且明码标价，实行按字数计酬的方法，这已与现代稿酬制度十分接近，可以说，《新小说社征文启》的出现，标志着近代稿酬制度的初步形成。\n\n三、“小说界革命”的局限性\n\n梁氏理论是有偏颇的，他过分夸大了小说的社会作用，带有火色过浓的政治功利色彩，使小说成为政治扬声器，其心理构型与儒家诗教、文以载道的旧统一脉相承。以“小说界革命”为萌芽的现代小说理论，一开始就把小说与政治紧紧联系在了一起，这种实用的小说观对中国以后小说的发展产生了深远影响，小说与社会政治的紧密关系在历史中被不断重复。","keywords":"过程 维新派开启前奏 域外政治小说提供借鉴 1902年梁启超正式提出 意义 提高小说地位 促进晚清小说的繁荣 近代稿酬制度初步形成 局限性 政治功利色彩","note":"“小说界革命”从开始酝酿到梁启超正式提出经历了一个长时间的准备过程，这一点我们要注意一下。“小说界革命”在促进小说发展的同时，也留下了政治功利性过强的弊端，不过总体利大于弊。相关论文可以参考程光炜《小说界革命》，具体资料可以在李凡文学正版群中领取。这一概念也常在名词解释中出现，大家要特别关注。"},{"id":"478","stars":"★★","title":"试分析林译小说的成就与局限性","body":"近代林纾以翻译西方资产阶级小说著名，他以生花妙笔翻译了11个国家的180余种作品。其小说翻译成就与局限性，主要表现在以下方面：\n\n一、小说翻译成就\n\n林译小说具有自己独特的美学风貌，既有古文简洁、隽永的风韵，又兼有西方文学的灵思美感，基本上传达了原作的艺术风格，具有不朽的价值，但它的更主要的贡献在于启迪了中国现代小说意识的觉醒。这主要表现在以下方面：\n\n（一）建构了新的小说审美规范\n\n林纾在中国小说史上第一次明确地提出了“专为下等社会写照”的命题，建构了新的小说审美规范，文学的主人公由英雄豪杰、才子佳人转为卑微的小人物，昭示了“平民意识”的崛起与“人”的觉醒。代表性作品为《块肉余生述》和《孝女耐儿传》。\n\n（二）引进了风格流派的概念。\n\n林译小说扩大了近代小说的题材，介绍了西洋小说的流派和创作方法。林纾对于作家风格往往有一种灵犀暗通的默契，他对西方作家风格的阐发给人以创造性的启示，如司各德的文心奇幻，仲马父子的冶艳秾丽，华盛顿·欧文的诗的氛围与哲理深味等。\n\n（三）诱发了现代性爱意识的觉醒\n\n林纾翻译的《巴黎茶花女遗事》《迦茵小传》等，引进伴随人格独立、个性解放而兴起的现代性爱意识，对几千年铸就的道德心防产生了轰击作用。近则影响了苏曼殊的哀情小说，远则下开“五四”时代那些浪漫自由的爱情咏叹调。\n\n二、局限性\n\n“林译小说”也有许多弱点，归纳起来大致有如下几点：\n\n（一）选材不严\n\n由于林纾不懂外文，选择作家作品的主动权全操在口译者手中，而有的口译者又缺乏文学眼光，选择不严，这便使他翻译了许多二三流的作家作品，没有能把全部精力集中译介世界名著，这不得不说是一个遗憾。在他翻译的180余种文学作品中，大约有三分之二是属于二三流的。\n\n（二）漏译、误译和删节严重\n\n林纾不懂外文，他靠别人的口译来笔述，如口译者理解、口述原著正确，则译文正确；反之，译文难免有误。对此，林纾曾道其苦衷：“近有海内知交，投书举鄙人谬误之处见箴，心甚感之。惟鄙人不审西文，但能笔述，即有讹错，均出不知，尚祈诸君子匡正是幸。”\n\n（三）用“古文笔法”，反对用通俗文体\n\n虽然林纾的译文使用的是一种比较通俗、比较活泼而又富有表现力的文言，但一般人仍难看懂。用文言译西洋小说或西方学术著作有很大的局限性，因为
