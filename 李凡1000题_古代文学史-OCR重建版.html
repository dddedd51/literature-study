<script>
const DATA=[{"id":"1","stars":"★","title":"先秦文学作者的流变","body":"随着社会生产力的进步和人们对社会意义的认知日益深入，先秦文化也经历了一个从原始文化到理性文化的嬗变。在这一转变过程中，文化的主体角色和地位发生了巨大的变化，文学作家也从巫师、史官、贵族，到普通民众，不断演变。主要有以下四种变化：\n\n一、夏商和西周初期，巫觋是文化主要承担者\n\n夏商周时期，原始宗教文化占据了重要的地位，而巫觋则成了这一时期文明的支柱，他们不仅仅负责管理政治事务，还负责推动文明的发展，创造了一系列的历史性成就，陈梦家曾经指出，商代的王室既有政治领袖的身份，又有群众领袖的身份，这使得他们成为了文明的先驱。巫觋的占辞句法简洁而有序，偶尔也会有协调的韵律，这些都是早期诗歌创作的萌芽。《诗经》中的某些祭祖诗篇，如《大雅·生民》，就是宫廷巫师的杰作。商周之际出现的《易》卦爻辞，便产生于巫官的占卜活动中，其中也有不少韵语。民间的巫术祭祀活动普遍采取歌舞音乐的形式，这其中就诞生和传承了不少歌谣和神话传说。如《吴越春秋》卷9所载的《弹歌》：“断竹，续竹，飞土，逐宍。”\n\n二、商周之际，史官成为新兴文化的代表\n\n上古巫史不分，史的职务起初也是宗教性的，是巫官的组成部分。一般说来，史官除了从事宗教活动外，还从事有关锡命、册命、载录氏族谱系等政治活动。随着商周之际鬼神地位的下降，人事受到重视，史官发展了人事方面的职能，并从原始宗教中脱离出来，成为新兴文化的代表。\n\n三、西周时期，贵族成为文学的主要创作者\n\n西周时期，史官的载录职责得到了更大的发展。他们除了继续从事相关的宗教活动外，也越来越多地介入政治事务，如锡命、册命、外交等。\n\n同时，这一时期，学在官府，只有贵族才有受教育的权利，文化为贵族所垄断。这类官学，其后逐渐演变为私人传授，即父子代代相传。贵族掌握了知识文化，进行文学创作，于是贵族成了西周、春秋时文学的主要创作者。春秋时期，史职进一步萎缩，贵族成为最主要的政治力量，贵族对自身文化修养的要求也越来越高。原本属于巫史的职业文献，也已经成了士大夫的常规学习内容。这些巫史文献在士大夫手里，也逐渐改变了它们的宗教性质，带有更多的人文理性色彩。\n\n四、春秋战国之际，士族成为文化创作的新起之秀\n\n这一时期，礼崩乐坏，在不断的争霸战争中，周天子的地位摇摇欲坠，分封制度也随之趋于解体。原来的官制和文化制度也逐渐松弛，巫史的政治地位越来越低，一些贵族也从斗争的旋涡中跌落出来，失去了自己的地位和官职，这些人只能靠传播学识来表达自己的政治理想或者谋生。这种情况促使了士阶层的出现，士的数量急剧增长，社会影响力也越来越大。他\n\n们中很多人都有着参与社会管理的热情，有着特立独行的人格，傲视王侯，以道抗势。一些有学识、有理想的人往往招徒设学，切磋讨论，成一家之说。中国文化史进入了诸子时代。士阶层为这一时期学术文化的发展提供了强大的动力。\n\n先秦文学作者的身份随着社会发展而不断变化，由巫到史，到贵族，再到士，其演变过程，与文学繁荣的趋势是一致的。作者身份的多样性，使文学在体裁、题材、风格等方面显出了异彩纷呈的特性。","keywords":"演变 巫觋 史官 贵族 士族","note":"①近几年围绕文学的作者、体裁、传播媒介等文学要素的论述题比较多，不仅是先秦文学，其他时期的文学也应该做出总结，以更好地把握文学发展的整体脉络。②回答某些问题时需要大家自己有一个梳理过程，这种概括性的思维方法，大家要学会。"},{"id":"2","stars":"★★","title":"先秦诗歌经历了哪些发展阶段","body":"【答题框架】\n\n先秦诗歌的发展经历了一个从口头到书面、从民间到宫廷、从集体歌唱到诗人创作的漫长过程。\n\n从语言字数上讲，先秦诗歌先后经历了两言诗，四言诗，五言诗，七言诗等发展阶段。\n\n从形式上讲，先秦诗歌经历了一个明显的发展过程，主要分为三种类型：第一，宗教颂赞祷祝诗歌。第二，政治叙事诗。第三，言志抒情诗。\n\n一、宗教颂赞祷祝诗歌\n\n宗教颂赞祷祝诗主要是甲骨卜辞中的韵文、《易》卦、钟鼎铭文中的韵语等。《礼记·郊特牲》记载了一首据说是出自神农时代的《蜡辞》，歌云：“土反其宅，水归其壑，昆虫毋作，草木归其泽。”此外，如《山海经·大荒北经》记载的一首不知创作时代的《驱早魃咒》，以及《吕氏春秋·古乐篇》所记载的“昔葛天氏之乐”等，都是原始时代的宗教歌谣。在早期的巫术活动中，人们相信韵语能够传达一种神奇的法力，能通过神灵达成人们的愿望。\n\n二、政治叙事诗\n\n政治叙事诗主要包括大雅的大部分、小雅的小部分以及《颂》等。《大雅》中的《生民》《公刘》《绵》《皇矣》《大明》等五篇系统地追述了周民族的萌生、发展以至最后灭商建国的全过程，是研究周民族史的重要资料。这些通过追叙先王功业以用来祭祖的祭祀诗，带有明显的颂美先王的主观意图，但却能比较完整地勾画出周人兴起、创业和建国的历史。前三篇写后稷、公刘、古公亶父的事迹，周人把他们塑造成英雄人物，并赋予一定的灵异神奇的色彩，很有文学意味。后二篇主要叙述文王、武王的功绩，有浓厚的承天受命思想，描写亦不及前三篇。\n\n三、言志抒情诗\n\n言志抒情诗包括小雅的大部分和国风的全部。《毛诗序》所谓“在心为志，发言为诗”，孔颖达《正义》所谓“舒心志\n\n愤懑，而卒成于歌咏”，无论是积极干预时政的怨刺诗，抒写民间疾苦的征役诗，还是反映社会生活的婚恋诗、农事诗，无不直面人生，表达真情实感，不作无病呻吟。特别是那些“饥者歌其食，劳者歌其事”和“男女有不得其所者，因相与歌咏，各言其伤”的诗篇，如《豳风·七月》《魏风·伐檀》《魏风·硕鼠》等，都是揭露现实、倾诉心声的作品。这些“满心而发，肆口而成”的诗歌，既朴素真实，又自然生动，汉代的乐府民歌、《古诗十九首》以及唐代的“新乐府”都继承了这个艺术传统。\n\n先秦诗歌或追念先祖，或美刺时政，或吟咏性情，奠定了中国诗歌的发展方向。","keywords":"语言 形式 宗教颂赞祷祝诗歌 政治叙事诗 言志抒情诗《诗经》","note":"先秦诗歌的发展变化，一是体现在字数上，二是体现在形式和内容上，不同发展阶段与不同形式的诗歌特色，需要我们有所掌握。其中，政治叙事诗和言志抒情诗相关知识，近年来考查频率略高，需要我们重点掌握。"},{"id":"3","stars":"★★","title":"《山海经》的特色及其对后世文学创作的影响","body":"《山海经》是我国古代保存神话资料最多的著作，约成书于战国初年到汉代初年之间，应是由不同时代的巫觋、方士根据当时流传的材料编选而成，实际上是一部具有民间原始宗教性质的书。\n\n全书共分山经五卷、海外经四卷、海内经五卷、大荒经四卷，内容极其驳杂，除神话传说、宗教祭仪外，还包括我国古代地理、历史、民族、生物、矿产、医药等方面的资料。\n\n神话“鲧禹治水”“夸父逐日”“精卫填海”等就保存在《山海经》中。这些神话内容为后世的文学创作提供了素材及想象空间，尤其对浪漫文学发展有着无可比拟的作用；同时，这些神话传说在一定程度上反映了中国文化的基本特点和文化精神的价值取向，为后世文学塑造了不少文学母题。\n\n《山海经》对后世文学创作的影响具体表现在：\n\n一、《山海经》为后世小说创作提供了浪漫主义思维方式。其充满浪漫主义色彩的行文方式，也开启了后世作家的创作思维，对后世的文学多样化产生了重要的影响。《山海经》被明代胡应麟称为“古今语怪之祖”，清代纪昀修《四库全书》时，把《山海经》作为“小说之最古者耳”纳入了《四库全书》的《子部》。\n\n二、《山海经》为后世小说创作提供了丰富素材。《山海经》之后，在汉魏之际，仿作《山海经》是不少中国古代小说的起源，这一点在《神异经》《十洲记》《汉武故事》和《汉武帝内传》中得到了明确的证实。后世广为流传的关于西王母的故事，也是源于《山海经》。《山海经》在后来的《西游记》《封神演义》《镜花缘》等小说中都发挥了重要作用，并且在某种程度上影响了它们。\n\n三、《山海经》的创作手法对后世文学产生了影响。《山海经》中的神话结构虽简单，但是它所体现的艺术构思对小说的结构艺术有较大的启迪作用。中国的文言小说，大多篇幅短小，故事单一，即受其影响。《山海经》中的神话故事虽不很多，但已经出现了比喻、拟人、象征等修辞手法和表现手法，这对小说中后来自觉地运用这些方法具有一定的启发作用。","keywords":"民间原始宗教性质 神话 浪漫主义思维方式 丰富素材 创作手法","note":"①《山海经》是我国古代最早的一部神话故事集，对后代文学产生了深远影响，后世许多小说，无论是体裁还是人物形象，都能追溯到《山海经》。在考查中，唐五代志怪小说、明清神魔小说等等，都可能会联系到《山海经》来进行论述，这一点需要大家注意。②《山海经》单出大题的可能性很小，大多以名词解释或配合类型出现，大家同样需要注意一下。"},{"id":"4","stars":"★★","title":"中国神话的主要内容及其中蕴含的民族精神","body":"【答题框架】\n\n神话以故事或形象的方式表现了远古人民对宇宙自然、人类自身及诸种文化现象的起源以及当时世间秩序的理解，是“通过人民的幻想，用一种不自觉的艺术方式加工过的自然和社会形式本身”，以故事的形式表现了远古时期人民对自然、社会现象的认识和愿望。神话通常以神为主人公，包括各种自然神和神化了的英雄人物。神话的意义通常显示为对某种自然或社会现象的解释，有的则表达了先民征服自然、变革社会的愿望。中国神话的主要内容以及其中蕴涵的民族精神，主要表现在以下方面：\n\n一、中国神话的主要内容\n\n受较低生产力水平和原始社会生活的影响，中国的神话故事形成了五个主要方面的内容：\n\n（一）创世神话。古代的中国文明深受盘古开天辟地、羲和生育十日、常羲生育十二月的传说的启发，这些传说深刻揭示了古代中国文明中关于宇宙的认识，并且为中国古代的阴阳太极思想提供了强大的支撑。这些都显示了先民对宇宙等自然现象积极探索的精神。\n\n（二）始祖神话。女娲补天和女娲造人的故事，不仅体现出女性在维护家族传统中的重要作用，也表明了她们在社会中的地位。从商民族的契，到周民族的后稷，再到燧人氏、伏羲氏，都有着不同的传说，充满着神秘色彩。它们反映了部族成员对自己祖先的追念，表现出民族自豪感和认同感。\n\n（三）洪水神话。国外的洪水神话，大多是表现这样一个主题，即天帝对人类堕落的失望，洪水是对人类的惩罚，而洪水之后人类的再造，反映了对人性的反省和批判。而保留在中国汉民族古代文献中的洪水神话，则主要把洪水看作是一种自然灾害，所揭示的是与洪水抗争、拯救生民的积极意义，看重人的智慧及抗争精神。在这些洪水神话中最杰出的英雄当数鲧禹父子。\n\n历经种种磨难，祸害人间的洪水终于被大禹制伏了，而一个不辞辛劳、为民除害而又充满智慧的英雄形象在中国文化史上树立起来。洪水神话集中反映了先民在同大自然作斗争中所积累的经验和表现出的智慧。\n\n（四）战争神话。黄帝和炎帝是活跃在中原的两个大部族的首领，分别兴起于相距不远的姬水和姜水，他们在向东发展的过程之中发生了严重的冲突。《新书·益壤》称当时的战场是“流血漂杵”。而黄帝居然能驱使熊、黑等猛兽参加战斗，为这次战争增添了神奇的色彩。这些猛兽可能是某些部落的图腾，它们分别代表不同的部落跟随着黄帝参加战斗。阪泉之战以黄帝的胜利而告终，它导致了炎黄两大部族的融合，华夏民族由此而正式形成，并发展成为中华民族的主要成分。这则神话实际是对一次历史事件的记录和解释。\n\n炎黄汇合后，另一次著名的大战是发生在黄帝和蚩尤之间。蚩尤属于南方的苗蛮部族，他有81个铜头铁额的兄弟，这可能是暗示他们的军队已经装备了金属盔甲，一些文献上提及蚩尤冶炼金属作兵器，这与当时冶金术的发展程度是相适应的。这场战斗十分激烈，涉及风伯、雨师等天神，而风、雨、早、雾等气象也成了相互进攻的利器。这两则神话不仅涉及古代的祈雨、止雨巫术，还涉及一些具有重要文化意义的发明，内涵较为丰富。黄帝正是在对内兼并和对外抗御的两场战争之中，大显神威，确立了他作为中华民族始祖的形象。\n\n出于对中华民族始祖的爱戴，后世又把许多文化史上的发明创造，如车、陶器、井、鼎、音乐、铜镜、鼓等，归功于黄帝，或黄帝的臣子。黄帝在神话中又成了一个善于发明创造的文化英雄。\n\n（五）发明创造神话。黄帝之后，神话进入了英雄时代。人们把自身发展过程中所积累的各类重大发明，以及对各种自然、社会障碍的克服，都加在一个个神话英雄身上，并把他们看作是本部族的理想的象征。这些神话英雄通常是人的形象，有着神异的经历或本领，他们的业绩在于创造和征服，如燧人氏、有巢氏、神农氏、仓颉、后稷等等。\n\n除了以上这些类型的神话外，还有一些神话显示了人类英雄突出的个性勇气，显示了人类对自身不可动摇的信念，如：夸父与日逐走，入日。渴欲得饮，饮于河渭，河渭不足，北饮大泽。未至，道渴而死。弃其杖，化为邓林。（《山海经·嗨外北经》）\n\n夸父为何要与日逐走，已不得而知了，但他那强烈的自信心，那奋力拼搏的勇气，以及他那融入太阳光芒之中的高大形象，构成了一幅气势磅礴的画面，反映了古代先民壮丽的理想。而他渴死道中的结局，又为整个故事涂上了一层浓厚的悲剧色彩。\n\n另一则与自然抗争的悲剧神话，发生在一个纤弱的女子身上：\n\n有鸟焉，其状如乌，文首、白喙、赤足，名曰精卫，其鸣自叫。是炎帝之少女，名曰女娃，女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以埋于东海。（《山海经·北山经》）\n\n女娃被东海淹死，化而为鸟，坚持以弱小的生命、菲薄的力量，向浩瀚的大海复仇，这是何等的悲壮！正是这种明知徒劳仍要抗争的精神，支持初民走过那险恶而艰难的年代。夸父和女娃的神话，讴歌了人类顽强的生命力。\n\n二、中国神话中蕴涵的民族精神\n\n中国古代丰富多彩的神话，是远古历史的回音，它真实地记录了中华民族在它童年时代的瑰丽的幻想、顽强的抗争以及步履蹒跚的足印。同样，它作为中华民族的文化源头，在很大程度上影响了民族精神的形成及其特征。\n\n（一）中国古代神话体现了深重的忧患意识\n\n中华民族发源于以黄河流域为中心的广阔地域。而在3000年前，黄河流域除了不断出现洪水和旱灾以外，还分布着很多密林、灌木丛和沼泽地，其中繁衍着各种毒蛇猛兽，从《山海经》中对那些能带来灾异甚至能食人的奇异动物的描述中，能看到先民对生存环境的警惧。为了顺利地生存和发展，先民们在满怀希望中必须切实地体验现实的艰难，并做不懈的努力。比如在女娲、羿和禹的神话中，无不以相当的分量描绘了人类的恶劣处境，神性主人公们都能正视现实的灾难，并通过锲而不舍的辛勤劳作和斗争，战胜自然灾难。神话特别强调诸神不辞辛劳的现实精神，反映了先民对现实的苦难有着深刻的体验。这与奥林匹斯诸神的享乐精神形成鲜明的对比。\n\n（二）中国古代神话具有明确的敬重生命、爱护人民的意识\n\n对百姓民众生命的爱护和尊重，是中国文化的一贯精神，所谓“天地之大德曰生”（《易·系辞下》），就反映了这种思想，这与以希腊神话为代表的西方神话有显著的不同。中国古代神话在展示人类恶劣的生存境遇的同时，还为人类塑造了一些保护神，如前所说之女娲、后羿等。此外，还有一些神话形象如龙、凤等，“见则天下安宁”（《山海经·南山经》），它们的出现给人带来了祥瑞和安慰。不少神话反映了对个体生命的珍惜和对生命延续的渴望。\n\n（三）中国古代神话体现了先民们的抗争精神\n\n生存环境的艰苦，激发了先民不屈的奋斗精神，这种奋斗精神本身就意味着对于命运的抗争，由此而孕育出一大批反抗自然、反抗天帝的神话英雄。前者如精卫以顽强的生命力，面对着难以征服的自然，作顽强的拼搏；后者如《山海经·海外西经》中所载的刑天，即使断首已死，也要对着天帝大舞干戚，这种顽强的抗争精神是何等的壮烈！他所象征的知其不可为而为之的悲剧性格，成为中华民族生生不息的精神长河中的巨浪。\n\n【李凡关键词：内容 创世 始祖 洪水 战争 发明创造 民族精神 忧患意识 敬生爱人 抗争精神】","keywords":"","note":"①中国神话故事的内容丰富多彩，但在考试中多以名词解释出现，这一道题总体较长，原因是我们把有关神话的所有知识点都做了融合，以方便大家做掌握。②对于比较重点的神话传说，如夸父逐日、精卫填海，其类型与反映的思想都是需要我们掌握的。"},{"id":"5","stars":"★★","title":"《诗经》的产生过程","body":"【答题框架】\n\n《诗经》是我国最早的一部诗歌总集，共收录从西周初年到春秋中叶大约500年间的诗歌305篇（小雅中另有六篇“笙诗”，有目无辞，不计在内）。它是我国古代先民对自己生活的歌唱，是我国古代文化辉煌灿烂的篇章，其成书过程主要需要注意以下因素：\n\n一、《诗经》名称的来源及创作时代\n\n《诗经》的“经”为儒家重要的典册书籍之意，《诗》为六种重要的典籍之一。汉武帝时期罢黜百家，独尊儒术，表彰六经，推行读经的政策，尊奉“孔子为万世师表，六经即万世教科书”（皮锡瑞《经学历史》），并以经取士。于是《诗》或《诗三百》被称为《诗经》，被奉为儒家经典。\n\n《诗经》的许多内容都无法被准确地追溯到哪一位作家。据推测，周颂和鲁颂都产生在西周初年，而商颂则源自东周宋国。不过，这些颂文中有些确实出自西周初年，而有些则产生在春秋中叶。\n\n二、《诗经》产生原因\n\n《诗三百》产生的原因众说纷纭，莫衷一是，学术界主要有以下三种说法：\n\n（一）献诗说。周代公卿列士献诗、陈诗，以颂美或讽谏，是有史籍可考的。《国语·周语上》：“故天子听政，使公卿至于列士献诗。”《晋语》六说：“于是乎使工诵谏于朝，在列者献诗。”《左传·襄公十四年》云：“史为书，为诗，工诵谏，大夫规诲。”《左传·昭公十二年》又说周穆王时“祭公谋父作《祈招》之诗，以止王心”。《礼记·王制》也云：天子“命大师陈诗，以观民风”。《诗经》中也提到“王欲玉汝，是用大谏”（《大雅·民劳》），“家父作诵，以究王汹”（《小雅节南山》）等。\n\n（二）采诗说。关于《诗经》的编集，汉代学者有采诗的说法。班固说：孟春之月，群居者将散，行人振木铎徇于路以采诗，献之太师，比其音律，以闻于天子。”（《汉书·食货志》）又何休说：“男年六十、女年五十无子者，官衣食之，使之民间求诗。乡移于邑，邑移于国，国以闻于天子。”（《春秋公羊传》宣公十五年《解诂》）这些说法的具体情形曾有人怀疑过，但我们认为这并非完全出于后人臆度。《诗经》三百篇的韵部系统和用韵规律基本上是一致的，形式基本上是整齐的四言诗；而它包括的地域又很广，以十五“国风”而言，就占有今陕西、山西、山东、河南、河北、湖北等省的全部或一部分，在古代交通不便、语言互异的情况下，不经过有意识、有目的的采集和整理，像《诗经》这样体系完整、内容丰富的诗歌总集的出现恐怕是不可能的，《诗经》这部书，我们认为当是周王朝经过诸侯各国的协助进行采集，然后命乐师整理，编纂而成的。\n\n（三）删诗说。汉人认为《诗经》是经过孔子删定的。《史记·孔子世家》说：“古者诗三千余篇，及至孔子，去其重，取可施于礼义，上采契、后稷，中述殷、周之盛，至幽、厉之缺......三百五篇孔子皆弦歌之，以求合韶、武、雅、颂之音。”也就是认为，孔子从周朝廷原所储备的三千首诗歌中挑选出305篇，并对其音乐做过整理，然后《诗经》成为现在的样子。但这一说法也并非完全可信。春秋时期士大夫普遍有赋诗、引诗的习惯，从《左传》中看来，他们所赋、所引的诗基本同于现存的《诗经》，只有少量的超出现存《诗经》之外。《左传·襄公二十九年》记载吴公子季札聘鲁时曾观乐，从他的评论中，我们可以看到所谓“周乐”在目次的排列上，基本和现存的《诗经》相同。此外，孔子在《论语》中提到“诗三百”，也说明“诗三百”在孔子之前已基本成型。孔子所能做的事情，大约只是在音乐或文字方面对“诗三百”进行加工整理，并用它教育学生，最终确定了“诗三百”的儒家经典地位。那么，《诗经》的编订者应该还是周王朝的巫官或乐官。\n\n【李凡关键词：献诗说 采诗说 删诗说】","keywords":"","note":"《诗经》的产生是一个非常复杂的过程，由于先秦时期没有较稳定的传播媒介，《诗经》的传播也是几经转手，作者和编者不固定，也造成了《诗经》内容丰富多彩，解释不清楚的局面。但是《诗经》毕竟是我国第一部现实主义诗歌总集，其地位和影响不容小觑，应作为复习重点。《诗经》相关内容也是名词解释中常出现的内容，大家要注意一下。"},{"id":"6","stars":"★★★★★","title":"试述《诗经》六义的具体含义","body":"所谓《诗经》“六义”指的是风、雅、颂、赋、比、兴。《周礼·春官》记载道：“（太师）教六诗，曰风、曰赋、日比、曰兴、曰雅、日颂。”其各自的具体含义，主要如下：\n\n一、风、雅、颂\n\n在《诗经》“六义”中，风、雅、颂分类的依据，有音别和义别两说：从音乐角度划分：郑樵认为“风土之音曰风，朝廷之音曰雅，宗庙之音曰颂”（《通志·总序》）；王国维《说周颂》则认为：“窃谓风、雅、颂之别，当于声求之。”（《观堂集林》卷二）。从内容体裁角度划分：《毛诗序》云：“是以一国之事，系一人之本，谓之风。言天下之事，形四方之风，谓之雅。雅者，正也，言王政之所由废兴也。政有大小，故有小雅焉，有大雅焉。颂者，美盛德之形容，以其成功告于神明者也。”（《毛诗正义》卷一）。孔颖达云：“夫天下有道则庶人不议，治平累世则美刺不兴......故初变恶俗则民歌之，风、雅正经是也。始得太平则民颂之，周颂诸篇是也。”（《毛诗正义》卷一）\n\n通常我们采用音乐之说，但由于不同地区有不同特点的音乐，在流传过程中，也有了内容上的区别，也即风、雅、颂是根据地域和音乐的不同对《诗经》的分类。\n\n（一）风即音乐曲调，国风即各地区的乐调，国是地区、方域之意。十五国风共160篇，分别是：《周南》《召南》《邶风》《鄘风》《卫风》《王风》《郑风》《齐风》《魏风》《唐风》《秦风》《陈风》《桧风》《曹风》《豳风》。周南、召南、豳是地名，王是指东周王畿洛阳，其余是诸侯国名，十五国风即这些地区的地方土乐。国风中，《豳风》全部是西周作品，其他除少数产生于西周外，大部分是东周作品。\n\n（二）“雅”即正，指朝廷正乐，西周王畿的乐调。雅分为大雅和小雅，大雅31篇是西周的作品，大部分作于西周初期，小部分作于西周末期。小雅共74篇，除少数篇目可能是东周作品外，其余都是西周晚期的作品。大雅的作者，主要是上层贵族，小雅的作者，既有上层贵族，也有下层贵族和地位低微者。\n\n（三）颂是宗庙祭祀之乐，许多都是舞曲，音乐可能比较舒缓。周颂31篇，是西周初期的诗。周颂不同于其他诗的体例，不是由数章构成，每篇只有一章。鲁颂4篇，产生于春秋中叶鲁僖公时，都是颂美鲁僖公之作，《泮水》《閟宫》体裁近乎雅诗，《有駜》《駉》则近于国风，可以看出诗的演变轨迹。商颂5篇，大约是商中后期的作品。从内容上可分为两类：《那》《烈祖》《玄鸟》明显是祭歌，主要是写歌舞娱神和对祖先的赞颂；《长发》和《殷武》的祭祀意味不浓，可能是一种祝颂诗，主要写商部族的历史传说和神话。前三篇不分章，后二篇分章，风格近于“雅”，可能比前三篇晚出。\n\n二、赋、比、兴\n\n《诗经》中的赋、比、兴不仅是一种表现手法，更是《诗经》独具匠心的艺术风格。赋、比、兴三种手法，在诗歌创作中，往往交相使用，共同创造了诗歌的艺术形象，抒发了诗人的情感。然而，对它们的含义，学者们的看法却各有不同，宋代朱熹的解释是比较有代表性的，他说：“赋者，敷陈其事而直言之也；比者，以彼物比此物也；兴者，先言他物以引起所咏之词也。”\n\n（一）对于“赋”的认识\n\n对于“赋”的认识，《毛传》未有论及。从古代的经学家、文论家对“赋”的主要论述，可以看出“赋”两个方面的特征。郑玄将“赋”解释为铺陈的意思：用言语表达当前的政治、宗教和道德准则（《郑笺》）。朱熹在训《葛覃》时，将“赋”进一步定义，表明它是一种表达真实情况的方式，即用直接的语言来表达。挚虞《文章流别论》中的《赋》包含了六个方面，其中两个是表达情感的方式。根据《文心雕龙·铨赋》的观点，“赋”指的是一种不依赖于任何其他创作技巧，而是通过富有文采的词藻，直接表达、叙述、描绘、抒发情感，使得作品具有生动、形象的特点，并能够将情感与物质、环境完美结合。这种技巧被广泛应用，并且在创作中起着重要作用。\n\n《诗经》中赋的运用比比皆是，《豳风·七月》运用了赋的手法，按照季节物候变化的顺序，铺叙了农家一年四季的生活。其他如《氓》中弃妇的不幸遭遇、《君子于役》中黄昏时分农家小院的情景、《击鼓》中对家乡妻子的深挚思念以及《溱洧》中男女相约游春的欢乐等，也都是用赋的手法直接叙写出来的。\n\n（二）对于“比”的认识\n\n比从字面意思比较好理解，因而古今差异不大。比喻是一种表达方式，它可以用来比喻物体，也可以用来表示人的思想感情。郑玄和挚虞都认为，比是用来表达类似的东西的，而朱熹则认为，比是用来比喻这个物体的。因此，比的意义在于，它可以用来表达不同的情感，比喻物体的外表，或者用来比喻人的内心，或者用来比喻事物，也即所谓“打比方”。\n\n《诗经》中比的运用也很广泛，比较好理解。其中整首都以拟物手法表达感情的比体诗，如《豳风·鸱鸮》《魏风·硕鼠》《小雅·鹤鸣》，独具特色；而一首诗中部分运用比的手法，更是丰富多彩。《卫风·硕人》描绘庄姜之美，用了一连串的比：“手如柔荑，肤如凝脂，领如蝤蛴，齿如瓠犀，螓首蛾眉，巧笑倩兮，美目盼兮。”分别以柔嫩的白茅芽、冻结的油脂等来比喻美人，“巧笑倩兮，美目盼兮”，两句动态描写，又把这幅美人图变得生动鲜活。《召南·野有死麕》则不从局部比喻，而以“有女如玉”作比，使人由少女的美貌温柔联想到美玉的洁白、温润。\n\n以具体的动作和事物来比拟难言的情感和独具特征的事物，在《诗经》中也很常见。“中心如醉”“中心如噎”（《王风·黍离》），以“醉”“噎”比喻难以形容的忧思；“巧言如簧”（《小雅·巧言》）、“其甘如荠”（《邶风·谷风》），将“巧言”“甘”这些不易描摹的情态，表现为形象具体的“簧”“荠”。总之，《诗经》中大量用比，表明诗人具有丰富的联想和想象，能够以具体形象的诗歌语言来表达思想感情，再现异彩纷呈的物象。\n\n（三）对于“兴”的认识\n\n《毛诗诂训传》是最早深入探讨“兴”的创作方式的著作，它以《毛诗》为基础，通过对《毛诗》的深入分析，提出了一种独特的“兴”理念。所谓“兴”就是《诗经》的作者在创作时，看到甲事物联想到乙事物，于是先写甲事，再写乙事；或者是要写乙事，为了加深感情加浓气氛，写得形象生动，通过联想，选用一个相类的甲事物，然后先写甲事物，再写乙事物，正因为这两种事物间有着或隐或显委婉隐约的内在联系，读者阅读了前一部分所描写叙述的意象，在阅读后一部分主题主旨时，才会产生恰当丰富的联想，才会产生共鸣。\n\n《诗经》中“兴”的运用情况比较复杂，有的只是在开头起调节韵律、唤起情绪的作用，兴句与下文在内容上的联系并不明显。如《小雅·鸳鸯》第二章：“鸳鸯在梁，戢其左翼。君子万年，宜其遐福。”兴句和后面两句的祝福语，并无意义上的联系。《小雅·白华》第七章以同样的句子起兴，抒发的却是怨刺之情：“鸳鸯在梁，戢其左翼。之子无良，二三其德。”这种与本意无关，只在诗歌开头协调音韵，引起下文的起兴，是《诗经》兴句中较简单的一种。\n\n《诗经》中更多的兴句，与下文有着委婉隐约的内在联系，或烘托渲染环境气氛，或比附象征中心题旨，构成诗歌艺术境界不可或缺的部分。《郑风·野有蔓草》第一章写情人在郊野“邂逅相遇”：“野有蔓草，零露溥兮。有美一人，清扬婉兮。邂逅相遇，适我愿兮。”\n\n清秀妩媚的少女，就像滴着点点露珠的绿草一样清新可爱。而绿意浓浓、生趣盎然的景色，和诗人邂逅相遇的喜悦心情，正好交相辉映。\n\n再如《周南·桃天》以“桃之天天，灼灼其华”起兴，茂盛的桃枝、艳丽的桃花，和新娘的青春美貌、婚礼的热闹喜庆互相映衬。而桃树开花（“灼灼其华”）、结实（“有蕡其实”）、枝繁叶茂（“其叶蓁蓁”），也可以理解为对新娘出嫁后多子多孙、家庭幸福昌盛的良好祝愿。诗人触物起兴，兴句与所咏之词通过艺术联想前后相承，是一种象征暗示的关系。《诗经》中的兴，很多都是这种含有喻义、引起联想的画面。比和兴都是以间接的形象表达感情的方式，后世往往比兴合称，用来指《诗经》中通过联想、想象寄寓思想感情于形象之中的创作手法。\n\n《诗经》“六义”的说法对后世影响深远，一方面形成了我国诗歌史上的“风雅传统”，另一方面，赋、比、兴的手法也被后世诗歌所继承，创造出灿烂的文化。","keywords":"风雅颂赋比兴","note":"《诗经》六义基本是《诗经》命题频率最高的点，风、雅、颂和赋、比、兴也可以拆开单独命题，另外，变风变雅，大家也需要注意一下。友情提示：①15国风不用都背诵下来，考试时候写出前几个就行，其他类似考点也做同样处理。②《诗经》篇目多，没必要全文阅读背诵，只需要记住几个重点篇目就行，作品选主要辅助文学史，不要颠倒主次，把大量时间花在背诵作品选上，更多的精力要放在文学史上（除非你的学校明确要求考作品分析）。"},{"id":"7","stars":"★★★★★","title":"如何理解《诗经》的现实主义精神","body":"【答题框架】\n\n总体来看，《诗经》不仅描述了周代丰富多彩的社会生活，特殊的文化形态，而且揭示了周人的精神面貌和情感世界。可以说《诗经》是我国最早的富有现实主义精神的诗歌，奠定了我国诗歌面向现实的传统。《诗经》的现实主义精神，主要表现在以下方面：\n\n一、《诗经》从各个方面广泛描写社会现实生活\n\n《诗经》从各个方面描写了周朝数百年间的社会现实生活，真实、生动、感人至深。其现实主义精神，在国风和二雅中表现尤其突出。\n\n（一）民族史诗记录历史事件\n\n大雅中的周族史诗完整地表现了周人由产生到逐步强大，最后灭商，建立统一王朝的历史过程，反映了周人征服大自然的伟大业绩，社会制度由原始公社向奴隶制国家的转化，以及推翻商人统治的斗争，是他们壮大发展的历史写照。\n\n（二）农事诗\n\n《诗经》的时代，农业生产已有其重要的地位，《诗经》中的作品不仅在道德观念和审美情趣上打上了农业文明的烙印，而且产生了一些直接描写农业生产生活以及相关的政治、宗教活动的农事诗。《诗经》中农事诗指《诗经》中描述农业生产生活的以及与农事直接相关的政治、宗教活动的诗歌，可分为农业祭祀诗和农业生活诗两类。\n\n农业祭祀诗如《小雅》中的《楚茨》《信南山》二篇以及《周颂》中的《臣工》《噫嘻》《丰年》《载芟》及《良耜》等就是有关耕种藉田、春夏祈谷、秋冬报祭的祭祀乐歌。\n\n农业生活诗主要指直接描写农业生产生活的诗。重要作品《七月》直接反映了周人农业生产和生活的面貌。这首诗是风诗中最长的一首，叙述了农夫一年间的艰苦劳动过程和他们的生活情况。\n\n（三）战争诗\n\n《诗经》中的战争诗依照其表达情感的不同，可分为正面的激愤昂扬的作品和反面的厌倦战争的作品。\n\n前者从正面描写了天子、诸侯的武功，表现了强烈的自豪感，充满乐观精神，《大雅》中的《江汉》《常武》，《小雅》中的《出车》《六月》等等，大都反映了宣王时期的武功。\n\n后者更多的是表现出对战争的厌倦和对和平的向往，充满忧伤的情绪。如《小雅·采薇》是保家卫国的出征士兵在归途中所作。诗人在诗中充满了对侵犯者的愤怒，但同时又有对久戍不归，久战不休的厌倦，对自身遭际无限哀伤之情。\n\n（四）燕飨诗\n\n《诗经》中还有以君臣、亲朋欢聚宴飨为主要内容的燕飨诗，《小雅·鹿鸣》《伐木》《鱼丽》《南有嘉鱼》《蓼萧》《湛露》《彤弓》《鱼藻》《宾之初筵》《瓠叶》以及《大雅·行苇》等均属这一类。燕飨诗反映了欢聚宴饮，热闹祥和的气氛，同时也体现了周人的礼乐文化精神。\n\n（五）怨刺诗\n\n西周末期，周室衰微，朝纲废弛，社会动荡，政治黑暗，于是大量反映丧乱、针砭时弊的怨刺诗出现了。怨刺诗主要保存在“二雅”和“国风”中。如大雅中的《民劳》《板》《荡》《桑柔》《瞻卬》等等，小雅中的《节南山》《正月》《十月之交》《雨无正》《巧言》《巷伯》等等，反映了厉王、幽王时赋税沉重，政治黑暗腐朽，社会弊端丛生，民不聊生的现象。《国风》中的《魏风·伐檀》《魏风·硕鼠》《邶风·新台》《齐风·南山》《陈风·株林》，或讽刺不劳而获，贪得无厌者，或揭露统治者的无耻与丑恶，辛辣的讽刺中带有强烈的怨愤和不平。\n\n（六）爱情诗\n\n表现爱情婚姻题材的作品，在《诗经》占有相当大的比例，数量众多，内容丰富。根据内容的不同，又可分为爱情诗、婚嫁诗和弃妇诗三类，从不同方面展现了当时女子的不同境况。\n\n《诗经》中反映战争徭役、恋爱婚姻、生产劳动等大量的诗篇，从各个方面汇聚成一幅生动、真实的社会生活画卷，体现出鲜明的现实主义特色。\n\n二、《诗经》中的客观形象贴近现实生活\n\n（一）人物形象\n\n《诗经》在描写人物的篇章里，刻画了许多鲜明生动，贴近现实生活的人物形象，尤其是女性形象。《诗经》有超过三分之一的诗篇涉及的女性形象，所刻画的女性形象多朴素自然，是周代时期女子形象的真实写照。《郑风·褰裳》：“子惠思我，褰裳涉溱。子不我思，岂无他人？”从女子戏谑的口气中，依稀可见女子娇嗔调皮而又充满自信的性格特征。《小雅·谷风》：“将恐将惧，置予于怀。将安将乐，弃予如遗。”塑造了被弃后依然一往情深，规劝丈夫念及旧情回心转意的懦弱善良无助的女性形象。《卫风·氓》：“信誓旦旦，不思其反。反是不思，亦已焉哉！”叙述女主人公婚前婚后生活的强烈反差，同时穿插着作者沉痛的教训，表达了弃妇对负心男子的谴责与控诉，塑造了刚强果敢，毅然与背弃信义者分手决绝的女性形象。《小雅·谷风》《卫风氓》，从不同的角度，反映了那个时代妇女的悲惨命运。这些贴近真实生活的人物形象，从一个侧面展现了当时的社会现实，体现了《诗经》的现实主义精神。\n\n（二）其他物象\n\n《诗经》的现实主义特色体现在其丰富多彩的内容上，它以海纳百川之势吸纳几乎所有能映入眼帘，纳入耳窗的自然万物，可以说是一本生活的百科全书。据有关学者统计，其中涉及的草有麦、黍、稷、麻等105种，木有桃、李、柏、桑等75种，兽有马、牛、羊、狐等67种，鸟有雎鸠、黄鸟、喜鹊、鸱鸮等39种，虫鱼有螽斯、草虫、鲨、鲂鲤等49种。要想论之有道，须先言之有物，而《诗经》的成功之处正在于它的创作源于人民的所见所闻，这不仅丰实了文章的内容，增强了可读性，更以浓厚的生活气息描述了当时纯朴的风貌。\n\n三、《诗经》忧国忧民，关注下层民生疾苦\n\n《诗经》许多篇章忧国忧民，抒写下层民生疾苦，泄导人情，补察时政，其情感朴素自然，表现出强烈的现实主义精神。\n\n《诗经》的叙事抒情往往不是凭空而起，而是通过具体的事件，抒发真情实感，表达爱憎。如《小雅·大东》：“小东大东，杼柚其空。”通过描绘东方远近诸侯国，掠夺民众布帛的行为，表现了周室与东方诸侯国的矛盾，表示人们对周朝统治者的不满。《小雅·采薇》“曰归曰归，岁亦暮止”，意为整天盼望着早日回家，但日子一天天过去，到了年终岁末，回家之事还是没有指望，表达了征夫苦苦思家和对兵役制度的抱怨。《王风·君子于役》：“君子于役，不知其期......君子于役，如之何勿思。”以夕阳牛羊作为思妇盼归的衬托，描写民女对劳役中丈夫的苦苦思念和对劳役制度的痛恨。《魏风·伐檀》：“不稼不穑，胡取禾三百廛兮？不狩不猎，胡瞻尔庭有县貆兮？彼君子兮，不素餐兮！”讽刺和谴责了奴隶主不劳而获的寄生及贪婪本性，表达人们对于受剥削的社会现实的强烈不满，以及对公平美好的向往。又如《魏风·葛屦（jù）》《国风·召南·野有死麕（jūn）》等作品，或取一事，或取一物，借具体事物，抒发情感。这些作品，体现了《诗经》忧国忧民，关注民生疾苦的现实主义精神。（李凡说：这里所说的现实主义，指《诗经》直面现实的情感抒发，朴素且自然。抒情和现实主义，并不矛盾）\n\n综上所述，《诗经》的内容十分丰富，它立足于社会现实生活，没有虚妄与怪诞，也极少有超自然的神话。无论是写祭祀、宴飨，还是写农事，都是周代社会经济和礼乐文化的产物，而其他一些对时政世风、战争徭役以及对婚姻爱情的叙写，也展示了当时的社会生活和风俗民情。此外，植根于农业生产的乡土情韵，宗法制下浓重的伦理情味和以人为本的人文精神，也必然影响了《诗经》创作的现实主义态度。这种创作观念，对我国后世文学产生了深远的影响，为历史上许多伟大的诗人所继承，形成了我国古代文学的现实主义传统。","keywords":"国风二雅 周祖史诗 怨刺诗 农事诗 战争诗 婚恋诗","note":"①《诗经》是中国文学现实主义的源头，《楚辞》是中国文学浪漫主义的源头，因而，《诗经》的现实主义特色，就是文学史考查中的一个重点，需要大家仔细掌握。②“现实主义”本是我们借用西方的名词，它最早在文学领域里的出现是在席勒的《论素朴的诗和感伤的诗》。在这里，席勒是把“现实主义”与“理想主义”相对立提出的。作为一种现实主义创作潮流，它又特指产生于19世纪中叶，以暴露和批判资本主义为主要特色的面对现实的创作，被人们称为“批判现实主义”。作为一种创作方法，恩格斯曾概括其特点为“除细节的真实外，还要再现典型环境中的典型人物”。当代中国文学研究者又泛指那些以描写现实为主的文学创作，由此他们认为《诗经·国风》里有许多优秀的现实主义诗篇。但我们这里借用“现实主义”这一名词来概括《诗经》的创作传统，并不仅仅止于《国风》的一些创作，而是从民族文化的传统出发，看整部《诗经》的创作者们如何立足于社会现实，用自己特殊的文化眼光去观察生活，描写生活，抒发情感和表现理想，并如何形成一种特殊的民族文学创作精神的。③《诗经》中的燕飨诗、农事诗、战争诗、怨刺诗、婚嫁诗的具体内容及分类也可能单独考查，不过整体出现频率较低，具体题目可以在李凡文学正版群中查看。"},{"id":"8","stars":"★★★★★","title":"谈谈《诗经》的艺术成就","body":"【答题框架】\n\n《诗经》作为中国最早的诗歌总集，不仅是文学的源头，更是中华文化的重要经典，在诗歌形式、表现手法、思想内容等多个维度对后世文学产生了深远影响。总体来看，《诗经》的艺术成就，主要表现在以下方面：\n\n一、抒情和写实的统一\n\n（一）《诗经》的独特之处在于，它具有鲜明的现实主义特色。它通过对西周时期数百年的历史事件的细致描述，展示出西周社会的丰富性与复杂性。“饥者歌其食，劳者歌其事”，更加突出地展示出它对于底层百姓的关怀与同情，同时也折射出他们的悲欢离合、挣扎与渴求。比如《七月》就通过对春天到冬天的描写，展现了一个贫苦的农民的一年辛勤工作，反映了当时的社会实际。\n\n（二）《诗经》中抒情言志之诗占有绝大比重，这些诗“感于哀乐，缘事而发”。无论是《雅》中的忧于政局，伤于遭际，还是《国风》中爱的欣喜、忧伤与渴望，均抒发的是日常现实情怀，抒情方式多不加掩饰。\n\n二、赋、比、兴的运用，既是《诗经》艺术特征的重要标志，也开启了我国古代诗歌创作的基本手法\n\n宋代学者朱熹《诗集传》言：赋者，敷陈其事而直言之者也；比者，以彼物比此物也；兴者，先言他物以引起所咏之词也。\n\n（一）赋：“赋”是《诗经》中最常用、最有用的手法。如《式微》用自问自答的形式，表达出对贵族老爷的怨恨；《芣苢》将采苢之动作分解开来，分别用六个动词加以表示，朴实无华而显亲切生动：“采，始求之也；有，既得之也；掇，拾也；捋，取其子也”，方玉润评其“无所指实而愈佳也，自鸣天机，一片好音”；《七月》则按时间顺序叙述农夫的生活，八章言八事，耕种、采桑、制衣、狩猎、居室、饮食、收获、祭祀，有条不紊。\n\n（二）比：“比”是打比方，是将所写的对象形象化的一种手段，给人以真实感，增强感染力。如《硕人》描绘庄姜之美，“手如柔荑，肤如凝脂，领如蝤蛴，齿如瓠犀，螓首蛾眉”。《氓》中的“桑之落矣，其黄而陨”形象地比喻了青春年华的流逝；《硕鼠》中把统治者比喻为贪得无厌的大老鼠。\n\n（三）兴：“兴”是托物起兴，先从别的事说起，再引起到所要表达的意思上来，二者之间必须有某种联系，或起到一定作用，如联想、象征、比拟、烘托氛围、协调音律等。如《关雎》用“关关雎鸠，在河之洲”象征成双成对的男女；《螽斯》用“螽斯羽，诜诜兮”隐喻多子多孙；《桃天》用“桃之天天，灼灼其华”，烘托渲染婚礼热闹气氛；《蒹葭》用“郝葭苍苍，白露为霜”渲染凄清氛围。\n\n三、句式和章法的特点。\n\n（一）句式：\n\n《诗经》以四言为主，四言独立成章，其间杂有二言至八言不等。二节拍的四言句带有很强的节奏感，是构成《诗经》整齐韵律的基本单位。四字句节奏鲜明而略显短促，重章叠句和双声叠韵读来又显得回环往复，节奏舒卷徐缓。\n\n（二）重章叠咏：\n\n（1）易辞申意：每章歌词大体相同，只在某些地方更换一两字略寓变化。如《陈风·月出》：“月初皎兮，佼人僚兮，舒窈纠兮，劳心悄兮。”后两章几乎是第一章的重叠，其句数、字数和句法结构都完全相同。\n\n（2）循序渐进：在易辞申意时，改换字在程度上有推进，使诗意逐步加深。如《王风·黍离》：“彼黍离离，彼稷之苗。”此诗描写周大夫感慨周王室的衰微，至于第二、三章中分别变为“彼稷之穗”“彼稷之实”，有递进诗意，增强抒情的作用。\n\n（3）加“副歌”的叠咏：诗篇在作部分叠咏变化时，各章有几句歌词完全相同，相当于当代歌曲的“副歌”。这相同的几句歌词有的放在末尾，如《周南·汉广》末尾之“汉之广矣，不可泳思。江之永矣，不可方思。”有的放在开头，如《豳风·东山》各章开头重复出现“我徂东山，慆慆不归。我来自东，零雨其濛”四句。\n\n（三）叠字（重言）：\n\n（1）“伐木丁丁，鸟鸣嘤嘤”，以“丁丁”“嘤嘤”摹伐木、鸟鸣之声。“昔我往矣，杨柳依依。今我来思，雨雪霏霏。”以“依依”“霏霏”，状柳、雪之态。\n\n（2）和重言一样，双声叠韵也使诗歌在演唱或吟咏时，章节舒缓悠扬，语言具有音乐美。双声如“参差”“踊跃”等，叠韵如“委蛇”“差池”等。还有些双声叠韵，如“如切如磋”“爱居爰处”“婉兮变兮”等等。\n\n四、语言艺术特点\n\n《诗经》大约使用了近三千单字，其中有名词、动词，也有形容词，丰富多彩、生动准确地表现了各种事物及其变化特征。如表示动植物的名词有373种，读之可使人博物多识。此外，《诗经》中还用了大量的动词、形容词及双声字、重叠字、叠韵字，写景状物，拟形传声，细致传神，使诗歌富于形象美和音韵美，增强了诗歌语言的艺术魅力。\n\n《诗经》的语言不仅具有音乐美，而且在表意和修辞上也具有很好的效果。《诗经》时代，汉语已有丰富的词汇和修辞手段，为诗人创作提供了很好的条件。《诗经》中数量丰富的名词，显示出诗人对客观事物有充分的认识。《诗经》对动作描绘的具体准确，表明诗人具体细致的观察力和驾驭语言的能力。如《芣苢》，将采芣苢的动作分解开来，以六个动词分别加以表示，鲜明生动地描绘出采芣苢的图景。\n\n后世常用的修辞手段，在《诗经》中几乎都能找：夸张如“谁谓河广，曾不容刀”（《卫风·河广》），对比如“女也不爽，士贰其行”（《卫风·氓》），对偶如“穀则异室，死则同穴”（《王风·大车》）等等，不一而足。\n\n但雅、颂与国风在语言风格上有所不同。雅、颂多数篇章运用严整的四言句，极少杂言，国风中杂言比较多。小雅和国☒风中，重章叠句运用得比较多，在大雅和颂中则比较少见。国风中用了很多语气词，如“兮”“之”“止”“思”“乎”“而”“矣”“也”等，这些语气词在雅、颂中也出现过，但不如国风中数量众多，富于变化。国风中对语气词的驱遣妙用，增强了诗歌的形象性和生动性，达到了传神的境地。雅、颂与国风在语言上这种不同的特点，反映了时代社会的变化，也反映出创作主体身份的差异。雅、颂多为西周时期的作品，出自贵族之手，体现了“雅乐”的威仪典重，国风多为春秋时期的作品，有许多采自民间，更多地体现了新声的自由奔放，比较接近当时的口语。\n\n总之，《诗经》的语言形式形象生动，丰富多彩，往往能“以少总多”“情貌无遗”（《文心雕龙·物色》）。\n\n综上所述，《诗经》不仅以诗性语言构建了中华文化的深层精神结构，更在形式与技巧上做出了重要的开拓，为中国文学树立了永恒的艺术标杆。\n\n【李凡关键词：抒情写实统一 赋比兴 句式章法 语言特点】","keywords":"","note":"现实性固然是《诗经》的重要特点，但抒情性干万不要忘了，另外，六义都是可以单独命题的，一定详细掌握。还有就是这几个特点都是可以单独命题的，比如问你《诗经》的语言特点，大家多记几个例子就好。《诗经》的考点非常多，无论正面还是侧面，都具有灵活可变性，大家阅读时候一定要多注意。"},{"id":"9","stars":"★★★","title":"《诗经》在文学史上的地位及影响","body":"《诗经》在中国文学史上具有崇高的地位和深远的影响，它奠定了我国诗歌的优良传统，哺育了一代又一代诗人，我国诗歌艺术的民族特色由此形成，这可以从以下几个角度进行讨论：\n\n一、《诗经》开启了我国抒情诗的传统，从此抒情诗成为我国诗歌的主要形式。\n\n《诗经》中虽然有少数叙事的史诗，但主要是抒情言志之作。有些偏于叙述的诗如《卫风·氓》，其叙事也是为抒情服务的，不能简单地称为叙事诗。《诗经》可以说主要是一部抒情诗集，在二千五百多年前产生了如此众多、水平如此之高的抒情诗篇，是世界各国文学中罕见的。从《诗经》开始，就显示出了我国抒情诗发达的文学特色。此后我国诗歌就沿着《诗经》开辟的抒情言志道路不断前进。\n\n二、《诗经》表现出的关注现实的热情、强烈的政治和道德意识以及真诚积极的人生态度，被后世概括为“风雅”精神，直接影响了后世诗人的创作。\n\n《诗经》中以个人为主体的抒情发愤之作，为屈原所继承。“国风好色而不淫，小雅怨诽而不乱，若《离骚》者，可谓兼之矣！”（《史记·屈原列传》）《离骚》及《九章》中忧愤深广的作品，兼具了国风、“二雅”的传统。汉乐府诗缘事而发的特点，建安诗人的慷慨之音，都是这种精神的直接继承。\n\n后世诗人往往借倡导“风雅”精神，来进行文学革新。如陈子昂感叹齐梁间“风雅不作”（《与东方左史虬修竹篇序》），他的诗歌革新主张，就是要以“风雅”广泛深刻的现实性和严肃崇高的思想性，以及质朴自然、刚健明朗的创作风格，来矫正诗坛长期流行的颓靡风气。不仅陈子昂，唐代的许多优秀诗人，也都继承了“风雅”的优良传统。如李白慨叹“大雅久不作，吾衰竟谁陈”（《古风》其一）；杜甫更是“别裁伪体亲风雅”（《戏为六绝句》其六）。白居易称张籍“风雅比兴外，未尝著空文”（《读张籍古乐府》），实际上白居易和新乐府诸家所表现出的注重现实生活，干预政治的旨趣和关心人民疾苦的倾向，都是“风雅”精神的体现。而且这种精神在唐代以后的诗歌创作中，从宋代的陆游一直到清末的黄遵宪，代不乏人。\n\n三、《诗经》中的比兴在艺术手法上为后代作家提供了学习的典范。\n\n《诗经》所创立的比兴手法，经过后世的发展，成为了我国古代诗歌独有的民族文化传统。《诗经》中仅作为诗歌起头协调音韵、唤起情绪的兴，在后代诗歌中仍有表现。而大量存在的兼有比义的兴，更为后代诗人所广泛继承，比兴就成了一个固定的词，用来指诗歌的形象思维，或有所寄托的艺术表现形式。《诗经》中的触物动情、运用形象思维的比兴，塑造了鲜明的艺术形象，构成了情景交融的艺术境界，对我国诗歌的发展具有重大的意义。后世诗歌中的兴象、意境等，都可以在《诗经》中看到萌芽，形成了我国古代诗歌含蓄蕴藉、韵味无穷的艺术特点。\n\n另外，《诗经》对我国后世诗歌的诗歌体裁结构、语言艺术等方面，也有深广的影响。\n\n总之，《诗经》衣被后世，不愧为中国古代诗歌的光辉起点。","keywords":"抒情传统 风雅精神 比兴典范","note":"地位影响类的答案较为固定，创造了什么，继承了什么，影响了什么，类似题目都可以这么答。《诗经》作为我国第一部诗歌总集，其内容、手法等诸多方面因素肯定会被后世诗歌继承发展，是中国古代诗歌的光辉起点，这些内容大家要注意。"},{"id":"10","stars":"★★★★","title":"分析古代文学中“男子作闺音”的现象（苏州大学）","body":"【答题框架】\n\n“男子而作闺音”是中国诗歌史上一个独特的但也是一个普及于文人创作领域的一个现象。由于这种现象的出现，使中国古代抒情诗歌呈现出了特殊的抒情面貌和精神特质。对此，我们可以从以下角度进行分析：\n\n一、“男子作闺音”的内涵\n\n所谓“男子作闺音”是指男性诗人（创作主体）代女性（抒情主体）设词，假托女性的身份、口吻创作诗篇而言情抒怀的一种诗歌体式。“男子作闺音”语出清代田同之的《西圃词说·诗词之辩》：“若词则男子而作闺音，其写景也，忽发离别之悲。咏物也，全寓弃捐之恨。无其事，有其情，令读者魂绝色飞，所谓情生于文也。”现在学界对“男子而作闺音”的现象主要采用杨海民先生的观点：“唐宋词中的作者明明是男性，但写出来的词却是一副女性的声情与口吻。”以男扮女装的形式来表现男女精神特质的相互转化。\n\n二、“男子作闺音”的表现\n\n通过对中国文学发展脉络的梳理，我们不难发现以男子自比女性的作品屡屡出现。现就元代之前的男子而为闺音的文学表现作一简单梳理。为其文化心理内涵的探讨做文本上的准备。\n\n（一）先秦两汉诗歌中的“男子作闺音”\n\n《诗经·国风》当中出现了诸如《卫风·伯兮》中的思妇形象与《卫风·氓》中的弃妇形象。虽然，《诗经》的这些所谓的“女性诗”由于“采诗”的搜集方式与民歌的特质，作者难以确指，但是《诗经》中“思妇”与“弃妇”形象的确立为中国后来的怨弃诗奠定了母题。而怨弃诗又是中国文学发展过程中“男子而作闺音”的一个重要的类型模式之一。屈原在《离骚》中以他独有的缤纷物象与意境创造了“香草美人”的文学传统，并开创了中国文学史上以男女喻君臣的抒情模式。\n\n及至汉代，司马相如的《长门赋》成为了文学史上第一篇男子代言女性作闺音的文学作品，作品以一个受到冷遇的嫔妃口吻写成，开骈体官怨题材之先河。在汉末文人的作品《古诗十九首》当中，出现了大量的以女性为抒情主人公的诗歌作品，虽然作者身份不详，但创作主体显然是男性却是毋庸置疑的。《古诗十九首》极写羁旅行役、相思怀人之苦，成为其书写的一大主题。如《行行重行行》写思妇对丈夫的深切怀念，虽然蒙上了唯恐被弃的阴影，她最终还是搁下这剪不断、理还乱的愁绪，转而向对方致以一往情深的祝愿。如果没有对女性内心世界的深刻洞悉，是无法开掘出如此幽微的情感层次的。《古诗十九首》以其恒久的艺术魅力成为了后世文人相继模仿的范本。为魏晋六朝时期此类诗歌的出现及发展奠定了很好的基础。\n\n（二）魏晋诗歌中的“男子作闺音”\n\n魏晋时期，曹丕的《燕歌行》及曹植的《七哀诗》的出现代表了魏晋诗人以女性身份抒情的最高成就。《燕歌行》塑造\n\n了一位盼夫归来的思妇形象，而曹植的《七哀诗》则是诉说思妇对在外十年丈夫的思念及埋怨。\n\n建安时期的文人在为女子代言的过程当中，更加注重了对弃妇、思妇的悲哀心理的揭示，集中笔墨描写弃妇、思妇内心的恐慌，凄凉与哀怨无助以及想象中被抛弃之后无可奈何的心理特征。\n\n（三）唐诗中的“男子作闺音”\n\n男子作闺音发展到唐代，尤其是其中的闺怨诗与宫怨诗，无论是在数量还是在质量上都表现出了巨大的成就。\n\n1．闺怨诗\n\n由于战争的频繁以及唐代所采用的府兵制的兵役制度，致使闺怨诗中征妇之词陡然增多。这类闺怨诗大多从征妇的生活感受出发，立足于抒发她们的离愁别绪和美好愿望。而且在代言的过程当中，男性诗人们更是拓展了女性的形象，贴合了女性的现实心理，在把握和表露女子情感上表现出了前所未有的深度与力度，使唐代的闺怨诗“女性”特征更加明显。如陈陶的《陇西行》“誓扫匈奴不顾身，五千貂锦丧胡尘。可怜无定河边骨，犹是春闺梦里人”作者通过“河边骨”与“梦里人”的悲惨对比，将征妇因为思念远人所表现的相思之苦和牵挂边塞丈夫的生死安危的沉痛情感表现得淋漓尽致。因此，这类诗歌写起来也就格外的痴情。\n\n2．宫怨诗\n\n唐代宫怨诗绝大部分出自男性之手，自初唐至晚唐的许多著名诗人如王昌龄、李白、王维、白居易、李商隐等人都留下了此类作品。其代言的内容可以分为宫人之怨、政治失意之怨两类。这些男子作闺音的宫怨诗的出现更加深化了女性的情感特征，强化了女性的社会角色特征。由于封建社会的嫔妃制度，宫女作为一个特殊的群体有着不为人知的压抑痛苦的经历。于是男性诗人们作为创作主体寄情于宫怨，表达了对宫女们失宠幽怨和希望复宠的不幸命运的深刻同情。如白居易的诗作《上阳白发人》就深刻揭示了作为宫人群体的无奈与悲剧。当然除此之外男性诗人们也往往借抒宫怨为名以自况来表达自己内心的某种情愫。\n\n（四）唐宋词中的“男子作闺音”\n\n纵观晚唐五代至宋代的文人词的创作，我们不难发现词作为和唐诗比肩的另一种文学形式绝大部分表现的都是女性的情感口吻与心态。从晚唐的第一部文人词总集《花间集》来看，几乎所有爱情之作都是以女性为抒情主体，着力于女性生活和女性情怀的描写。如温庭筠的《菩萨蛮》《更漏子》等以角色转换的方式，让女子作言行、情感的主体来表达夫君远行、所嫁非人、遭受薄幸与良偶难求的种种爱情失意时的孤独、悔恨、怨悱之情，把男性作者对女性的揣摩和体验加以间接化、对象化及意象化的表达。宋代晏殊的《玉楼春》以思妇口吻写相思离别之苦，将相思怀人之情写得“婉转缠绵，深情一往，丽而有则，耐人寻味。”而以写文人俗词为代表的柳永，更是洞察了歌姬舞女内心的苦乐，写了大量的代言歌姬舞女心声的作品。如“一生赢得是凄凉，追前事，暗心伤。”“万种思量，多方开解，只恁寂寞厌厌的。系我一生心，负你干行泪。”“风流肚肠不坚牢，只恐被伊牵引断。”柳永词从不同的角度，不同的侧面反映了歌姬们内心的情感和生活的状态，代表了市民阶层的审美情调，因而也就成就了柳永在俗词创作方面的影响与成就。\n\n三、“男子作闺音”的形成原因\n\n（一）儒家宗法社会所形成的臣妾心态与女性人格\n\n从社会关系的角度来说，体现中国文化的是以家庭为本位的封建家庭制，在此基础上又形成了以血缘和姻亲为纽带的“族”，“家”和“族”之上的“宗”。因此“家”是“国”的缩影，宗法制度就是家庭伦理关系的放大。在家庭关系上的“父子”“夫妇”关系就衍生出“君臣”关系，所以有“君父”与“臣子”的观念。夫对妻与君对臣同样具有权威性，而文人臣子的人生价值的实现则全赖于君主对他们的用与废。因此男女情感与君臣际遇在某种程度上有着一致的对应性。即：相思意味着渴望效忠；美人迟暮暗示着怀才不遇；受到宠信意味着为君重用；良人薄情映射着仕途偃蹇；弃妻为之嘘唏隐喻放臣为之悲叹。这样，臣为君思与妇为夫容、待价而沽与择良而嫁、美人迟暮与英雄失路等等都建立了固定的对应关系。文人士大夫们通过不同类型、不同身份的女性形象之口，抒发他们的政治理想及如履薄冰的臣妾心态、感士不遇的仕进情结。\n\n（二）“比兴”“寄托”等传统手法的具体运用\n\n我国古典诗歌一向重视“引类譬喻”“比兴寄托”的创作方法。从《诗经》开始，“比兴”的创作方法就具体的运用到抒情言志的诗歌当中了。以“关雎”的引吭和鸣来比喻琴瑟友好的君子淑女，用“硕鼠”来比喻贪得无厌的统治者。发展到战国时，屈原的《离骚》中就以男女爱情来比拟君臣关系。历代许多诗人，就曾有意识地采用此种比兴手法。如李白在供奉翰林失意之后，作《玉壶吟》：“君王虽爱蛾眉好，无奈宫中妒杀人。”辛弃疾的《摸鱼儿》把自己化作一位失宠的后妃，用“长门事，准拟佳期又误”的典故来埋怨皇帝对自己先是信任，后是弃置的不公正待遇。\n\n（三）“双性同体”的心理机制\n\n在心理学的领域，双性同体是指同一个体既有明显的男性人格特征，又具有明显的女性人格特征。每个人身上都具有男女、阴阳的双重气质。在中国文学的创作中，以男性代言女性的艺术作品的确从心理的角度对女性的阴柔之美进行了深入的挖掘与表现，展现出了同一个体男女阴阳的双重心理特征。\n\n在中国的传统社会中一向强调的是男女有别。在《诗经·小雅·斯干》中就有男女出生伊始“弄璋”“弄瓦”之说，从男女出生之时就决定和形成了男女两者不同的行为方式和价值取向。而在审美方面也要求男女之间截然不同，所以由于中国传统所决定的男女之间这种不可逾越差异性导致了男子只能最大程度的实现建功立业的人生抱负，发扬刚强雄健的男人本色。尽管他们的性格中仍有女性柔的特质，但由于中国古代强大的政教功利的文学观念的影响，男子的女性情感特征是不能流露在言志载道的诗文当中的。因此古代士人的阴柔情感只能通过词的这种文体宣泄出来。这种特征体现在宋词中尤其明显。词之所以承载了宣泄男性的女性化情感的载体主要原因则是男性词人对词的创作心态使然。\n\n综上所述，“男子作闺音”的这一文学现象的出现不仅体现出中国文学的独特性，也反映了此种现象产生的文化及心理内涵。","keywords":"内涵 假托女性 身份、口吻 表现《卫风·伯兮》《卫风·氓》《离骚》香草美人《长门赋》《行行重行行》《燕歌行》《七哀诗》闺怨诗 宫怨诗《菩萨蛮》《更漏子》《玉楼春》形成原因 宗法社会 臣妾心态 女性人格比兴 寄托 双性同体","note":"所谓“男子作闺音”，简单来说，就是男性假托女性的身份、口吻去创作诗歌，其具体体现则是我们非常熟悉的闺怨诗、宫怨诗等。这种情况的出现，与中国的社会和文化传统有着密不可分的联系，是古代诗歌中非常值得去关注的一种独特的现象。相关内容可以参考张伯娟、吕学琴《男子作闺音的文化心理内涵探析》，具体论文可以在李凡文学正版群中领取。"},{"id":"11","stars":"★★★★","title":"论述“《诗》可以兴，可以观，可以群，可以怨”","body":"诗歌是中华民族表情达意的重要手段之一，中国千百年来的诗歌作品盈千累万，孔子在春秋战国时期提出“兴观群怨”这一理论，四种功能层层递进，相互联系，构成一个完整的诗歌功能系统。\n\n一、“兴”的内涵及功能\n\n从古至今，各家对“兴”持有不同理解，原义可以指“起”“发动”，可引申为联想；同时，“兴”也并非空穴来风，凭空感受到的，而是人自身拥有这项感情或思考，诗是将其具体化的工具，方便人们捕捉表达。孔子积极参与政治实践，周游列国，推行“仁”政的政治主张，热衷于将《诗经》与“礼教”相结合。如《关雎》此诗，虽作为描写爱情的诗被传诵，但它作为诗三百之首，起到的是“风天下而正夫妇也”的作用，对百姓们进行教化。\n\n二、“观”的内涵及作用\n\n《诗经》的观念可以被解读为“观风俗之盛衰”，通过学诗，人们可以提高自己的观察能力和认识事物的能力，增进对社会政治经济文化等各方面的认识，加深对社会的理解。“观”还可以相对于个人而言，读诗可以了解一个人的生平事故，深入作者内心，观其“情志”。这两者间也有联系，因为国家政治的兴衰会作用于个人的生活命运上，个人抒发的情志是国家命运的微观表现。\n\n三、“群”的内涵及作用\n\n“群”指的是诗的交际功能，孔子重视朋友、群体的重要性，“有朋自远方来，不亦乐乎”。诗歌承载诗人个人的情感和对社会的认知，个体和个体之间通过诗歌沟通交流感情，求同存异，达到思想和灵魂的共鸣，人与人之间互相关爱，尊重不同意见，这是诗歌在培养人的群体性和相互尊重理解方面的功能。\n\n四、“怨”的内涵及作用\n\n“怨”指的是诗歌的批判与疏导功能，《诗经》很重要的一个作用在于它的批判与讽谏功能，例如《硕鼠》等作品都批判了王公贵族不事劳作，靠压榨百姓过着奢侈淫靡的生活。这是诗歌“怨”的社会性质，“怨”也有个人性质。朱熹所说的“怨而不怒”就是要求人们在表达情感时需要有一个度，怨可以是哀怨，但绝不是违背礼节、社会秩序的狂怒。通过诗歌，人们在表达“怨”时更委婉，意韵深远，避免了极端情绪。诗歌的“怨”不仅仅能表达对国家、民族的担忧，还能够抒发对个人境遇的不满，如怀才不遇，命途多舛，思妇之怨等，这也正是《诗经》现实性和抒情性相统一的地方。\n\n五、“兴、观、群、怨”四者之间的联系\n\n“兴”是诗歌最基础的功能，启发人的思考，诱导人抒发情感，引起人内心的共鸣。“诗者，志之所之也，在心为志，发言为诗”，诗被认为是一种能够将个体思想转换成有形文字的艺术形式，它能够给读者带来审美上的愉悦。“兴”是情感\n\n的冲动，“观”是理性的思索，那么通过诗歌交友则为“群”，拥有相同志向、趣味相投的人们聚在一起，用诗歌抒发己见。“怨”是情感和认知最深层次的抒发，“上以风化下，下以风刺上”，带有折中式的劝谏和表达。\n\n“兴、观、群、怨”四项功能体现了《诗经》对春秋以及后世深刻的影响，不仅具有文化方面的意义，在社会公序良德建设方面也起到一定作用。感知功能帮助人们感受社会、感受情思，认知功能帮助人们了解社会政治、人文，交际功能帮助人们沟通交流情感，批判疏导功能帮助人们抒发怨而不怒的情感。","keywords":"各自功能及联系","note":"“兴、观、群、怨”在课本内容中没有体现，但历年考查均有围绕此知识点展开的命题，是我们需要拓展的一个重点，对于“兴、观、群、怨”各自的特点和它们之间的联系，大家要好好把握。“兴、观、群、怨”也是名词解释中常出现的一个关键概念，大家要有所准备。"},{"id":"12","stars":"★★★","title":"中华民族有史诗吗，请简要分析上古史诗的创作形态","body":"中国古代美学理论中有“诗史”而没有“史诗”这一美学范畴。黑格尔认为“中国人却没有民族史诗，因为他们的观照方式是散文式的”“他们的宗教观点也不适宜于艺术表现，这对史诗的发展也是一个大障碍”。这种观点毫无疑问是片面的，中华民族肯定是有史诗的。《大雅》中的《生民》《公刘》《緜》《皇矣》《大明》以及《商颂》均具有史诗的全部特征。\n\n中国上古史诗有狭义、广义之分，狭义史诗主要指西周初年创作的保存在《大雅》中的《生民》《公刘》《緜》《皇矣》《大明》五首，可以看作我国最早出现的史诗；广义史诗包括狭义史诗，体现为三种不同创作形态：\n\n一、第一种史诗形态：以《商颂》《周大武乐章》为代表的舞蹈史诗创作形态\n\n《商颂》包括《那》《烈祖》《玄鸟》《长发》《殷武》五首，为殷商乐舞献祭仪式中的乐歌。商代祭祀仪式中，音乐舞蹈是其重要组成部分，如《商颂·那》“奏鼓简简”“鞉鼓渊渊”“嘒嘒管声”“依我磬声”“万舞有奕”，当时乐舞有招、濩、隶、羽、万等。《商颂》与乐舞紧密结合，具有音乐舞蹈史诗特性。\n\n《周大武乐章》作于武王克商之后。《礼记·乐记》记载孔子与宾牟贾谈论《大武乐章》的表演，提到“武乐六成”，与之相配的六篇诗乐均在《周颂》之中，因此，《周大武乐章》同样与乐舞结合紧密，具有舞蹈史诗性质。\n\n二、第二种史诗形态：《生民》《公刘》《緜》《皇矣》《大明》等吟诵史诗\n\n《诗经·大雅》史诗以文王、武王伐商胜利这一宏大历史叙述为中心，以“受命”作为叙述主题，描述商周之际波澜壮阔的革命历史。这些诗篇当出自西周初年的“献诗”。其中《生民》最具魅力，在西方学界具有很大影响，如康达维认为《生民》在早期中国诗歌史上具有开创意义，这首赞美文化英雄后稷的诗提供了早期中国文化价值的重要信息。《生民》经历过长期口传史，伴随着音乐和礼仪性的舞蹈，在西周宫廷礼仪中发挥重要作用。从“献诗”来看，《生民》具有吟诵、仪式表演与文本阅读的多重接受形式，表现出了吟诵史诗性质。\n\n三、第三种史诗形态：屈原《天问》以“呵壁问天”形式创作的壁画史诗\n\n《天问》虽然不是叙事体而是问话体，但其内容实质是以夏、商、周三代的兴亡故事为中心的，这三代历史的发问占了整整一百句，超过全诗一半以上的篇幅，是一部兴亡史诗。王逸认为《天问》作于屈原流放途中，“见楚有先王之庙及公卿祠堂，图画天地山川神灵，琦玮僪佹，及古贤圣、怪物行事，周流罢倦，休息其下，仰见图画，因书其壁，何（呵）而问之，以渫愤懑，舒泻愁思”。壁画是历史人物原型的显现，这一长篇“壁画史诗”作于屈原顷襄王时期流放陵阳（今安徽池州）时，见到春秋吴国神殿遗存壁画而作。而吴国开国君主太伯、虞仲由西岐到荆楚衡山、再到吴地建国之事件发生在殷武王（即《商颂·殷武》之“殷武”，死后谥为武乙）之时对荆楚苗蛮部落的征伐，据此可推究《商颂》创作的历史背景和时间。屈原《天问》通过对春秋晚期吴国神殿壁画的审美观照和历史思考，发现了历史表象下面的隐秘联系，成为沟通不同史诗形态之间的桥梁。\n\n这三种史诗形态之间具有内在联系，其史诗情节彼此互溶、互证、互文，体现了中国上古史诗的创作特点。史诗事件往往发生在历史的重要节点，经常采用倒叙的手法，反映了改朝换代时期波澜壮阔的史实。因此，中华民族是有史诗的，\n\n【李凡关键词：舞蹈史诗 吟诵史诗 壁画史诗】","keywords":"","note":"黑格尔说中华民族没有史诗，此题正是源于此，在回答类似题目时，首先要摆正自己的观点，毫无疑问，中华民族是有自己的史诗的，所以黑格尔的观点是错的。然后，我们再通过具体事例，对这些错误的观点予以驳斥，这就十分考验大家的理解能力与对相关知识的掌握。"},{"id":"13","stars":"★★★","title":"结合具体作品论述先秦历史散文的发展阶段（25江苏师范大学）","body":"我国散文的最早源头，可以追溯到甲骨卜辞。而历史散文的出现，则与中国史官文化有关。最初，史官与巫职多相混同有周一代，史官文化与巫觋发生分化，代殷而立的周人有了明确的历史鉴戒意识，由此建立起十分完备的史官制度。周王朝之外，各诸侯国也纷纷设立史官。殷商人主要用来记录卜事的文字，在周人这里已更多被用来记载时人的政治、军事、礼仪等活动。\n\n史官制度的完备，带来历史散文的发达，并出现偏于记言、偏于记事之分。记事的《春秋》，周王朝及各诸侯国均有其书，今见《春秋》，据称即孔子在鲁《春秋》基础上修订而成。《尚书》中的《周书》则是汇集周王朝及诸侯国记述发布诰命训誓之事的篇目选编而成，其中以周王朝前期文章为主要部分。\n\n今见更多富于文学色彩的历史散文大多形成于春秋战国时期。周代除有记载之史外，原本伴有传语讲说之制。春秋后期文化下移，私学渐起，著述之风渐兴，《左传》《国语》《琐语》等各国之史之说的汇总、撰著由此出现。尤其是《左传》的出现，标志着我国叙事散文的成熟。影响所及，战国出现的诸子百家也喜搜集、积累、援用历史故事，《晏子春秋》《战国策》和《韩非子》中的《说林》《储说》等著作中的讲史叙事即是如此，中国古代叙事文学因此形成了自己的特点。\n\n具体来说，先秦历史散文发展大致可以分为三个阶段：\n\n一、早期萌芽阶段：《尚书》《春秋》\n\n《尚书》在时间跨度上与甲骨卜辞和铜器铭文相近，是商周记言史料的汇编，包括《虞书》《夏书》《商书》《周书》四部分。《尚书》文字古奥典雅，语言技巧超过了甲骨卜辞和铜器铭文，而且这些文诰都是单独成篇，有完整的结构，对先秦历史叙事散文的成熟有直接的影响。\n\n春秋时期经过孔子编定的《春秋》，记事系统，具有自觉的记事意识和写作义例。《春秋》本是周王朝和各诸侯国历史的通称，后特指经过孔子修订的鲁国的编年史。《春秋》按时间顺序编排历史事件，具备了明确的时间观念和自觉的记事意识。但其记事都很简略，长的不过四十多字，短的仅有一字。因此，其记事虽简而有法，却并非真正意义上的叙事散文。\n\n二、成熟阶段：《左传》《国语》\n\n《国语》以记言为主，记言文字在形象思维和逻辑思维方面都很缜密，又有通俗化、口语化的特点，生动活泼而富于形象性。虽然记言多于记事，但《国语》没有单纯的议论文或语录，有一系列大小故事穿插其中，因此表现出叙事技巧和形象构思上的特点，有时也能写出鲜明的人物形象。\n\n《左传》以《春秋》的记事为纲，增加了大量的历史事实和传说，叙述了丰富多彩的历史事件，描写了形形色色的历史人物。它把《春秋》中的简短记事，发展成为完整的叙事散文。《左传》发展了《春秋》笔法，不再以事件的简略排比或个别字的褒贬来体现作者的思想倾向，而主要是通过对事件过程的生动叙述，人物言行举止的展开描写，来体现其道德评价。《左传》还创立了一种新形式，即在叙事中或叙事结束后直接引入议论，以“君子曰”“君子是以知”“孔子曰”等来对事件或人物作出道德伦理评价。这种形式，更鲜明地表现出作者的立场和感情，增强了叙事的感情色彩。《左传》确为先秦散文“叙事之最”，标志着我国叙事散文的成熟。\n\n在文学成就上，《国语》和《左传》分从记言、记事两方面将《尚书》《春秋》的文字简约古奥变为繁富通畅，这样就使先秦历史散文发展到了一个成熟的阶段。\n\n三、历史散文语言艺术新高峰：《战国策》\n\n《战国策》主要记载了谋臣策士游说诸侯或进行谋议论辩时的政治主张和斗争策略。全书对战国时期社会各阶层形形色色的人物都有鲜明生动的描写，尤其是一系列“士”的形象，更是写得栩栩如生，光彩照人。《战国策》的“文辞之胜”，在语言艺术上的空前成功，是其文学成就的重要方面，寓言的巧妙运用，也是其文章的一大特点。行文的夸张铺陈，大量运用对偶排比，使其整体呈现出铺张扬厉，气势充沛的特色。《战国策》文章辩丽横肆的文风，雄隽华赡的文采是当时纵横捭阖时代特征的体现，标志着先秦叙事散文语言运用的新水平。\n\n【李凡关键词：史官文化 偏于记言、偏于记事之分 萌芽阶段《尚书》《春秋》成熟阶段《左传》《国语》新高峰《战国策》】","keywords":"","note":"先秦历史散文的发展在课本中为了好理解，把三个阶段分开来讲，实际上任何事物的发展都是重叠交叉的，从记言、记事到言事相融，从巫到史再到士，像一条河的两条支流最终交汇一样，融合到了一起。当然我们也应该注意到，新类型的散文产生了，不代表以前的都消失了。对于这部分内容，我们要好好把握。"},{"id":"14","stars":"★","title":"试论《尚书》特点及今古文《尚书》之争","body":"《尚书》是我国最早的一部历史文献，大体是春秋以前历代史官所收藏的政府重要文件和政治论文的选编。《尚书》原称《书》，“尚”通“上”，指“上古之书”；儒家列入“六经”，又称《书经》。所载“皆典、谟、训、诰、誓、命之文”，不外政府文告，主上誓言，君王命令和贵族诫词。关于《尚书》，我们需要注意以下内容：\n\n一、《尚书》的特点\n\n（一）思想内容\n\n（1）《尚书》的思想核心是商、周时代的神权政治观念\n\n殷商时代强调“天命神授”。《商书·汤誓》说：“有夏多罪，天命殛之”“夏氏有罪，予畏上帝，不敢不正”。认为“天”和“上帝”是宇宙的最高主宰，天子是代天行令的人，因而极端崇尚天帝神权，维护其至高无上的地位。到了周代，殷王朝被推翻的无情现实，给周初统治者以深刻教训，使之逐步认识到人民的力量，对传统的宗教神学作了修正。其重要标志是提出了“德”，强调“敬德保民”，认为“德”体现上天意志，“敬德”即“敬天”。《周书·梓材》说：“先王既勤用明德，怀为夹，庶邦享作，兄弟方来，亦既用明德。......肆王惟德用，和怿先后迷民。”从“天命神授”到“敬天保民”，体现了神权政治观的发展和演变。\n\n（2）《尚书》的一大思想特点是重视总结和借鉴历史经验教训\n\n这一点在《周书》中反映最为突出。周代统治者从殷末周初的动乱中深受震动，认真思考前代盛衰兴亡的原因。《召诰》说：“我不可不监于有夏，亦不可不监于有殷。”由此清醒认识，周人生出“敬德保民”“明德慎罚”的新政治观念，提出用人、理政的原则、方法和勤勉治国、力戒逸乐的主张。《洪范》《立政》《无逸》中的许多见解和主张，都是对历史经验的总结，对后代深有影响。\n\n（二）艺术特色\n\n以今人眼光看，《尚书》未必能算真正的文学作品，然而“唐虞文章，则焕乎始盛”，作为我国第一部兼记叙和论说的散文集，《尚书》确已具有不少文学因素，体现了初步的艺术技巧和一定程度的形象性，对后世文学的发展有所启发。\n\n（1）《尚书》之文已具备记叙、描写、议论、抒情等多样表达方式，虽为“记言”，却并不单调\n\n《尚书》记叙简明扼要，描写用笔不多而颇生动，议论要言不烦而剀切中肯，抒情皆直抒胸而富于感染力。有的篇章还能适当地运用一些修辞手段，如《盘庚上》就有“若颠木之有由蘖，天其永我命于兹新邑”等文句，取譬设喻通俗生动，富于生活气息。有的善用对偶，排比之句，如“何忧乎驩兜，何迁乎有苗，何畏乎巧言令色孔王？”（《皋陶谟》）其特点是简古紧凑，大体整齐而又错落有致。\n\n（2）《尚书》文字古奥，语句拗口，即韩愈所谓“周诰殷盘，佶屈聱牙”。\n\n（3）《尚书》的文风质直古朴，即扬雄所谓“虞、夏之《书》浑浑尔，《商书》灏灏尔，《周书》噩噩尔”。《尚书》之文，主要是“记言”，而所记之言，多属论事。“非上告下，则下告上也。寻其实质，此类皆论事之文”。记“论事”之言，重在意旨，故其所记，大都质实，不事藻饰。\n\n（4）《尚书》的文体是自成一家的。所谓“典、谟、训、诰、誓、命之文”，实即古代散文体式的早期形态。此类文体，自春秋末年以后虽已不甚流行，但对汉代以后的官方文告仍有影响。\n\n二、关于今古文《尚书》之争\n\n汉代以来，《尚书》有今、古文之分。晁错以伏胜记诵的《尚书》为基础，以汉代流传的隶书撰写《尚书》，这就是“今文《尚书》”。汉武帝末年，鲁恭王刘馀在清理孔子故居的过程中，在墙上发掘出了45篇《尚书》。孔子的十一世孙孔安国用这部《尚书》与伏生的本子-对照，发现45篇中有29篇和今文《尚书》基本相同，另外，还多出了16篇。《尚书》学史上称这多出的16篇为“逸书”或者“逸篇”。这45篇《尚书》是用先秦古文字写的，叫作“古文《尚书》”，又因为这个本子发现于孔子家的墙壁，也叫作“孔壁本”。\n\n由于今文《尚书》和古文《尚书》相同的29篇是两个不同的版本，学习《尚书》的学者或崇今文，或尊古文，逐渐形成了《尚书》的今文学派和古文学派。今文《尚书》主要传于官学，古文《尚书》主要传于私学。终汉一代，今文《尚书》一直是官方规定的标准读本，古文《尚书》仅仅在王莽执政时短期立于学官。\n\n自东汉末年以来，《尚书》的文字差异一直存在，直至通过马融和郑玄的努力，《尚书》文字的融合才得以完成。两位学者对《尚书》文字的理论有着深入的研究，不仅对《尚书》文字进行了深入的研究，而且还对《尚书》文字进行了详细的注释，其中29篇篇目大体上和孔安国的原文一致。","keywords":"初步具备说理文的格局 讲究说理的艺术 古奥难懂，行文艰涩 今古文《尚书》之争","note":"近年来，古代文学先秦部分的考查确实有细化的迹象，关于尚书更详细的脉络，已上传至李凡文学领读答疑群，有需要的同学自行下载即可。《尚书》曾作为“四书五经”流传上千年，艺术特点必须掌握，其今古文之争，大家了解即可。"},{"id":"15","stars":"★★","title":"简述《春秋》的艺术特点","body":"《春秋》是我国第一部编年体史书，也是中国古代儒家典籍“六经”之一。“春秋”本是周王朝和各诸侯国编年体记事古史的通称，名称源自“春正月”“秋七月”等记事术语。但流传至今的《春秋》版本，特指经过孔子修订的鲁国的编年史，记载了鲁隐公元年至鲁哀公十四年（前722-前481年）之间，共二百四十年的历史。《春秋》其内容、叙事、语言都很有特点，明显地较《尚书》有了新的发展，具体可以从以下方面展开讨论：\n\n一、体例上：开创编年体史书\n\n《春秋》的开创之功都是无可争辩的。它的编年体例，为史学三大体例之一，它的私修性质，打破了官方对史学的垄断，成为诸子百家争鸣的先声。\n\n《春秋》按时间顺序编排历史事件，记事方式是“以事系日，以日系月，以月系时，以时系年”（杜预《春秋左传集解序》），具备了明确的时间观念和自觉的记事意识。但其记事都很简略，长的不过四十多字，短的仅有一字。因此，其记事虽简而有法，却并非真正意义上的叙事散文。如隐公元年载：“夏，五月，郑伯克段于鄢。”时间、地点、人物、事件都有，但事件的因果、过程，人物的行为、性格，都无从知道，仿佛一则新闻标题，而不像一篇文章。\n\n二、语言上：简练含蓄\n\n《春秋》不过一万八千余字，却记载了二百四十二年的史实，其语言之凝练含蓄，历来为人所称道。《春秋》叙事“简而有法”，既简明扼要，又谨言有方，历来被文章家奉为典范。这一特点，不同于《尚书》的“词旨可称，则一时之言，累篇咸载”（刘知幾《史通·六家》），与《尚书》语言相比较，《春秋》已明显地由“佶屈聱牙”变为明白晓畅，标志着散文的发展和进步。\n\n三、写作手法上：春秋笔法\n\n所谓“春秋笔法”历来有不同见解，但其核心应是一种修史的修辞手法，即通过曲笔表达来呈现史家真正要表达的意思。\n\n（一）微言大义\n\n所谓微言大义，即包含在精微语言里的深刻的道理，《春秋》既经孔子修订而成，必然体现孔子的思想倾向。具体而言，便是遵循周制，维护周礼，明王道，重人事，褒善贬恶，反对“邪说暴行”，志在“拨乱世反之正”这种鲜明的政治意图和浓厚的政治色彩，便是后儒所称道的微言大义。\n\n（二）一字褒贬\n\n《春秋》用笔严谨，晋杜预《春秋经传集解序》：“《春秋》虽以一字为褒贬，然皆须数字以成言。”一字之中常“寓褒贬，别善恶”，褒则称字，贬则称名，其引文用笔，常用一字寓意褒贬，亦为后世史家所效仿。\n\n四、《春秋》是“礼义之大宗”\n\n《春秋》以《周礼》为基础，强调了礼仪的重要性，谴责了僭越和违背礼仪的行为，并且抨击了邪恶的言论和暴行。它的思想倾向并非通过文字的表达，而是通过简洁的记叙和排比来展示。《春秋》以其精练的语言和深刻的思想，将褒贬之分融入其中，从而表达出作者的喜怒哀乐。例如，对有罪的人施加“诛”，对无罪的人施加“杀”，对高层人物施加“弑”等。这种将强烈情感融入史实的写作方式，被后人继承。\n\n五、史学精神\n\n《春秋》的私修性质，打破了官方对史学的垄断，成为诸子百家争鸣的先声。而“二十四史”中，私修者多达三分之一，亦可说是受其引领所致。\n\n《春秋》在史著中倾注鲜明的感情色彩的做法，为后代史传文学所继承，虽刻意为尊者讳的曲笔，有违秉笔直书的实录精神，对后世史传文学亦有不良影响，但其本身所彰显的史学精神却毋庸置疑，那便是勇敢无畏，刚直无私，这种开创之功是无可争辩的。\n\n【李凡关键词：编年体 简练含蓄 春秋笔法 礼义之大宗 史学精神】\n\n【李凡说：①“春秋笔法”是一个常考的名词解释，大家要特别关注一下。②《春秋》虽然记事简而有法，然过于简略，称不上真正的叙事散文，这一点我们也需要注意。】","keywords":"","note":""},{"id":"16","stars":"★★★★","title":"举例说明《左传》的文学成就（叙事特点）(25南京师范大学）","body":"【答题框架】\n\n《左传》是《春秋左氏传》的简称，又名《左氏春秋》。相传《左传》为传述《春秋》而作，作者是左丘明，后人对此颇多疑义。《左传》记事，起于鲁隐公元年（前722)，迄于鲁哀公二十七年（前468)，基本与《春秋》重合，还有个别战国初年的史料。《左传》确为先秦散文“叙事之最”，标志着我国叙事散文的成熟，其艺术成就，主要表现在以下方面：\n\n一、叙述手法丰富多彩，有条不紊\n\n（一）《左传》的情节结构主要是按时间顺序交代事件发生、发展和结果。但倒叙与预叙手法的运用，也是其叙事的重要特色。倒叙就是在叙事过程中回顾事件的起因，或交代与事件有关的背景等。如“宣公三年”先记载了郑穆公兰之死，然后再回顾了他的出生和命名：其母梦见天使与之兰，怀孕而生穆公，故名之兰。《左传》中还有插叙和补叙，性质作用与倒叙类似。这些叙述，常用一个“初”字领起。预叙即预先叙出将要发生的事，或预见事件的结果，如秦晋崤之战中蹇叔在秦出师伐郑时，已预知了必然失败的结果：“吾见师之出而不见其入也。”（僖公三十二年）秦师经过周都洛阳北门，王孙满又预言：“秦师轻而无礼，必败。”（僖公三十三年）《左传》以第三人称作为叙事角度，作者以旁观者的立场叙述事件，发表评论，视角广阔灵活，几乎不受任何限制。个别段落中，作者也从事件中人物的角度，来叙述正在发生的事件及场景。如写晋楚鄢陵之战“楚子登巢车以望晋师”中阵地的情况完全是通过楚子和伯州犁的对话展示出来的。\n\n（二）《左传》叙事，往往很注重完整地叙述事件的过程和因果关系。《左传》叙事最突出的成就在描写战争。《左传》的战争描写，全面反映了《左传》的叙事特点。《左传》一书，记录了大大小小几百次战争，城濮之战、崤之战、邲之战、鞌之战、鄢陵之战等大战的描述历来被人们赞不绝口，不计其数的小战役也写得各具特色，精彩生动。一般说来，《左传》写战争，不局限于对交战过程的记叙，而是深入揭示战争起因、酝酿过程及其后果。如“僖公二十八年”写城濮之战，对大战爆发的背景和直接起因都有交代，而在行文中又不断展示晋胜楚败的原因：晋文公伐怨报德，整饬军纪，遵守诺言，倾听臣下意见，上下齐心协力。而楚方则是君臣意见分歧，主帅子玉恃兵而骄，一意孤行，盲目进逼晋师。城濮之战的结果也写得很全面，不仅写了晋师大胜，晋文公确立霸主地位，而且还写了战争的余波：楚子玉战败羞愧自杀，晋文公闻之大喜，回国后赏功罚罪，对这次战役进行总结，然后以君子之言，赞扬晋文公的霸业。至此，叙述圆满结束。\n\n（三）《左传》对事件因果关系的叙述，还常有道德化与神秘化的特点。如作者在总结城濮之战经验时云：“谓晋于是役也，能以德攻。”（值公二十八年）不仅是城濮之战，整个《左传》叙事中，礼、义、德等道德因素，都被作者当作影响事件成败的重要原因加以叙述，而且叙述中往往还带有神秘因素。以《左传》中常出现的预兆为例，这些预兆大都有道德化倾向：符合礼义要求之事，常有吉兆；而悖于礼义之事，则常有凶兆。这些预兆有时是智者的言论，有时则是占卜、梦境、\n\n天象等的神秘暗示。如“僖公十五年”秦晋韩之战在“僖公十年”就有已故晋太子“敝于韩”的预言；“僖公十四年”又有晋卜偃“期年将有大咎，几亡国”的预言，在这些看似神秘的预兆之后，是晋惠公违礼失义之举。作者面对既成的历史事实，根据历史人物的言行得失，在叙述历史事件时，加入种种神秘化的传说故事，来预示事件的结局，解释事件的因果关系。这反映了春秋时代人们的世界观和认识水平，具有鲜明的时代特色。\n\n二、《左传》叙事具有故事性和戏剧性\n\n《左传》是一部历史著作，但作者有时就像一个讲述故事者，把事件叙述得颇具戏剧性。大量生动的戏剧性情节，使这部作品充满故事性。不仅如此《左传》有的叙事记言，明显不是对历史事实的真实记录，而是出于臆测或虚构。如“僖公二十四年”记载的介子推母子间的对话，不可能有第三者在旁听见或记录，当是作者根据传闻和揣想虚拟而成。这种写法，可以看作后代小说家为人物虚拟对话的萌芽。《左传》中还记述了大量的占卜释梦和神异传闻。如“成公十年”记晋景公之死，情节曲折怪诞，用三个梦构成了互为关联的情节。写晋侯所梦大厉，画鬼如生，令人毛骨悚然；病入膏肓的描写极为生动有趣；桑田巫释梦之语，小臣之梦的印证，更是充满神秘色彩，仿佛志怪小说。\n\n三、人物形象刻画细致生动\n\n（一）《左传》广泛描写了各种人物，其中许多人物写得个性鲜明。《左传》的写人还不像纪传体历史著作在一个专章中叙述一个人物的生平事迹，也没有像后世小说那样塑造人物形象。由于它是编年史，人物的言行事迹大多分散记录在事件发生的各个年代，很少对某一人物集中描写，只有把同一人物在不同年代的事迹联系起来，才能得到一个完整的人物形象。《左传》中许多重要政治人物如郑庄公、晋文公、楚灵王、郑子产、齐晏婴等，都是通过数年行迹的积累来表现的。《左传》中还有一些人物，并不是反复出现而形成的一个完整形象，而是仅在某一时、某一事中出现，表现的仅仅是其一生中的某一片断，反映的是其性格中的某一方面。这些形象往往非常生动传神，能给读者留下极深刻的印象。如“晋灵公不君”中，鉏魔、提弥明、灵辄三位武士（宣公二年），齐晋鞌之战中代君就俘的逢丑父等（成公二年）。\n\n（二）《左传》有些描写还展现了人物性格的丰富性和复杂性，表现了人物性格的变化。晋文公是《左传》中着力歌颂的人物（庄公二十八年至僖公三十二年）。他由一个贵公子成长为政治家，由四处流亡到成为一代霸主，人物性格有一个曲折的成熟过程。楚灵王是《左传》中被否定的国君形象（襄公二十六年至昭公十三年），他在即位前的争强好胜，野心勃勃，弑王自立，即位后的残暴、骄奢狂妄等，都显示出他确实是个昏君。但同时，作者又表现了他宽容纳谏、知过能改、不记前怨、风趣等性格特点，并写了他最后悔恨自己的残暴，刻画出一个性格复杂的人物形象。\n\n（三）《左传》叙事中人物的行动、对话构成了表现人物的主要手段，而绝少对人物进行外貌、心理等主观静态描写。通过人物在重大历史事件中的言行，人物性格得以展现，形象得以完成。如成公二年的齐晋鞌之战，郤克受伤，解张、郑丘缓鼓励他坚持战斗，三人同仇敌忾，视死如归的气概，在对话和行动描写中，得到充分表现。\n\n四、细节描写独显特色\n\n《左传》还在复杂的战争过程、政治事件中，大量描写细节。作为历史著作，这些描写内容完全可以不写或略写，但《左传》却大量地描写了这些琐事细节，它们在叙事生动和人物刻画方面具有文学意义，如“宣公二年”的宋郑大棘之战，其中狂狡倒戟出郑人，华元食士忘其御羊斟，华元逃归后与羊斟的对话，城者之讴等，都非这次战争的重要事件，但如果只写宋郑战于大棘，宋师败绩，郑人获华元，华元逃归，则必然使叙事枯燥无味，毫无文学性可言。正是这些次要事件中的细节描写，才增加了叙事的生动传神。又如“宣公四年”记郑公子归生弑其君夷这一重大历史事件，写了公子宋食指大动，郑灵公食大夫鼋不与公子宋，公子宋怒而染指于鼎等细节。整个事变由食鼋这件小事引起，而公子宋的贪馋好怒、公子归生的迟疑懦弱、郑灵公的昏庸可笑都在生活细节的描写中表现了出来。再如“哀公十六年”记楚国白公之乱这一政治事件，最后写公子高平叛，没有着重写叶公的重大军政措施，而就叶公是否该戴头盔这一细节反复渲染，突出国人对叶公的爱戴和叶公急于争取国人的心理。叶公平叛之所以成功，他的可贵之处，都在叶公免胄的细节中表现出来。\n\n五、《左传》辞令优美，感染力强，行文充满了纵横变化\n\n（一）《左传》中的记言文字，主要是行人应答和大夫辞令，包括出使他国专对之辞和向国君谏说之辞等。这类记言文字无不“文典而美”“语博而奥”（刘知几《史通》卷十四《申左》），简洁精练，委曲达意，婉而有致，栩栩如生。如僖公三十年“烛之武退秦师”的说辞，秦晋联合攻郑，烛之武作为郑使出说秦伯。他着重对秦、晋、郑三国之间的利害关系作了具体的分析。先把郑国之存亡放在一边：“郑既知亡矣。”再叙述郑亡并无利于秦：“亡郑以陪邻，邻之厚，君之薄也。”然后归结到保存郑国于秦有益无害：“若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。”最后还补叙昔日晋对秦之忘恩负义以加强说服力。说辞有意置郑国利害于不顾，而处处为秦国考虑，委婉而多姿，谨严而周密，因此，能打动秦穆\n\n公之心，使他不但退兵，还留秦将杞子等三人率军助郑守卫。晋人也只好退兵，郑国得以保全，充分显示了烛之武说辞的分量。\n\n（二）《左传》中的行人辞令、大夫谏说佳作甚多，这些辞令又因事因人不同而具有不同的个性特点，但都用辞典雅，生气勃勃。\n\n如隐公三年石碏谏宠州吁，隐公五年臧值伯谏观鱼，桓公二年臧哀伯谏纳郜鼎，桓公六年季梁谏追楚师，僖公五年宫之奇谏假道，值公十五年阴饴甥对秦伯，僖公二十六年展喜犒师，宣公三年王孙满对楚子，成公十三年吕相绝秦，襄公三十一年子产坏晋馆垣等等。这些辞令，由于行人身份及对象的不同而风格各异，有的委婉谦恭，不卑不亢；有的词锋犀利，刚柔相济。\n\n（三）《左传》叙述语言简练含蕴，词约义丰。如宣公十二年晋楚邲之战中，写晋师溃败时的狼狈之状云：“中军、下军争舟，舟中之指可掬也。”为争渡船逃命，先上船者以乱刀砍争攀船者手，落入船中的手指竟然“可掬”。简练的一句话，写尽晋师争先恐后、仓皇逃命的紧张混乱场面。同年冬天，楚国出师灭萧，将士“多寒”，于是“（楚）王巡三军，拊而勉之，三军之士皆如挟纩”。楚王劳军的体恤之语，温暖将士之心就如披上了棉衣。以一个贴切的比喻，形象生动地写出了楚王慰勉之殷，将士愉悦之情。“言近而旨远，辞浅而义深。虽发语已殚，而含意未尽，使夫读者望表而知里，扪毛而辨骨，睹一事于句中，反三隅于字外。”（《史通》卷六《叙事》）\n\n《左传》的辞令之美，“谅非经营草创，出自一时，琢磨润色，独成一手”（《史通》卷十四《申左》）。大约当时的外交辞令已很讲究，史家记述时又加修饰，故而文采斐然。\n\n总行所属，《左传》以编年之体铸就叙事之魂，在严谨的历史框架中绽放出璀璨的文学光华。其叙事艺术不仅突破了“断烂朝报”式的简略记录，更开创了历史书写与文学创作交融互渗的典范。","keywords":"叙事手法 戏剧性 人物形象 细节描写 辞令优美纵横变化","note":"《左传》的艺术成就体现着中国叙事散文的成熟，也是历来考研的重点问题，出题角度非常多变，所以我们不仅要熟练掌握《左传》的文学成就，还要熟读一些《左传》重点篇目，有能力者（或报考院校211及以上），最好再多储备一下教材之外的观点和例子，关于《左传》的多种命题方式和细节，已传至李凡文学领读答疑群，大家自行下载就好。"},{"id":"17","stars":"★★★","title":"论《左传》战争描写的特点（26中央财经大学）","body":"《左传》擅长记言叙事，尤其擅长描写战争，虽然《左传》并不是一部专门的战争史，但是它对当时的战争反映之全面，以及对各次重大战争描述之详尽，是历史上其他史书所不能及的。\n\n《左传》全书共记载大大小小战争四百二十九次，写得比较详细的大战有十四次。其中与争霸紧密相关的晋楚城濮之战，秦晋崤之战，齐晋鞌之战，吴楚柏举之战等篇章，材料丰富，叙述详尽，结构严密，充分表现了其叙事散文的特点。\n\n作为一个历史的叙述者，战争胜负早已成竹在胸，因其叙述的是成为过去的历史。鲜活的历史完成了它自身的使命，那么叙述者要做的工作只是尽可能还原历史。但是完全复现历史绝不可能，叙述的历史必须经过叙述者的重组。\n\n首先，战争描写的全面性\n\n作者以全局气魄、历史眼光把战争置于社会历史背景下来写，而不只是单纯地孤立地写战争，把战争与政治、经济、文化相结合。作者详细地写出当时的政治形势和各国之间的关系，战争的起因，交战国的实力对比等等。\n\n比较典型的有晋楚城濮之战，战争的缘由与重耳之亡有关，但也关系到两国之间的实力与关系，南方楚国不断向北扩展，渐次征服陈、蔡、郑、许等中原国家，国力日益强大，使北方诸侯受到威胁，晋文公即位后，励精图治，国力空前强盛，遂与楚国争霸，于是爆发了有名的晋楚城濮之战。\n\n如秦晋韩之战是发生在僖公十五年。而早在二年之前，作者就种下远因：僖公十三年，“晋荐饥”，秦救灾恤邻，输栗于晋。十四年，“秦饥，使乞籴于晋，晋人弗与”。晋大夫庆郑当时就说：“背施幸灾，民所弃也”“四德皆失，何以守国？”至僖公十五年，秦果然伐晋。\n\n还有发生在成公二年的齐晋鞌之战，其原因是：晋大臣郤克使齐，受妇人耻笑。直接导火线是齐侵鲁、卫，孙桓子等如晋乞师。根子是齐晋争霸。又如宣公十二年的邲之战，主因是晋楚争霸，但却与郑国极有关系。郑国处于大国之间，是晋、楚威逼利诱，拉拢打击的对象。晋楚几次大战，皆起因于郑、陈等处于中间地带的小国，邲之战的先因可追溯到十年之前，即宣公三年的晋郑之盟和宣公四年的楚王伐郑。这些战争都有其远由近因，并非单纯孤立地描写战争，与其他诸多因素关系密切，尤其突出战争与政治的密切关系。（李凡说：以上是为了方便大家了解所以多举了几个例子，真正考试的时候，写一两个就行）\n\n其次，情节完整，注重前因后果\n\n《左传》的战争描写，非常注重故事情节的完整性，注重战争前因后果的关系。由于《左传》是编年体史书，为了做到故事完整性，作者是煞费苦心的。作者往往采用穿插，补叙，倒叙多种方法，突破编年体的局限，尽可能保持故事情节完整。\n\n如“晋楚城濮之战”，作者首先叙述战前两国形势，作为引子。接着，作者描写楚子围宋，晋国为救宋国，制定了伐曹、卫而免齐、宋的战略，是为开端。随着形势发展，两国内部出现了复杂的情况：楚国，楚子使子玉去宋，而子玉却使伯棼请战；晋国，拘宛春，假复曹、卫，又退避三舍，作为发展。大战前，子玉表现出的狂妄，自大，晋侯谨慎用兵，是为高潮。战争以楚国战败，子玉自杀为结局。尽管战争的起因、发展、高潮、结局等各个情节以及它们之间的联系非常复杂繁琐，但是作者通过自己深厚的叙事功底，使得战争描写非常完整，且有条不紊，线索分明，表现出高超的驾驭文字的能力。所以，吴阎生曾说：“《左传》每事自为一章。”\n\n第三，细节见风神\n\n《左传》战争描写情节往往跌宕起伏，并且非常注重细节描写。《左传》叙述者在叙述战争时善于抓住那些有代表性的，对情节发展起关键性作用的细节予以刻画描绘，而表现这些细节时又往往能找出恰当的侧面，从而更形象更生动地表现主题，使整个战争篇章既概括又具体，疏密相间、缓急有节，并且在刻画人物性格与形象方面起着重要作用。例如“楚晋鄢陵之战”中，作者通过楚子和伯州犁眺望敌军阵营时的对话，详细地交代了交战双方形势，写出了一片紧张严肃、人马飞驰的场面，两军交战活动历历如在目前，很好烘托了大战前的紧张气氛。又如在“齐桓公伐楚”中，齐侯恃强威胁，咄咄逼人；楚使不卑不亢，据理力争，针锋相对。最后双方达成妥协，桓公退兵。在双方的对话中，我们充分感受到了战争迫在眉睫的紧迫感与情节的跌宕起伏。又如宣公十四年，当楚庄王听到申舟被杀时“投袂而起，屦及于窒皇，剑及于寝门之外，车及于蒲胥之市。”楚庄王自恃国大兵强，派申舟经宋国使齐而不借道，并表示宋国如果杀楚使，他就伐宋。现在他听到申舟被杀，立刻暴跳起来，迫不及待地跑出去，连平常的礼仪都不顾。他的这种急于报复的心理，虽未言明，但通过他的反常动作已经表现出来了。\n\n第四，语言简练\n\n《左传》中的战争描写非常注重叙事语言的简练、生动、准确，往往几个字就能让人非常深刻地了解战争的形势和状况，生动还原战争的画面。如宣公十二年，晋楚邲之战中，晋师溃退，在描述晋师溃退狼狈的样子时，《左传》写道：“中军、下军争舟，舟中之指可掬也。”为争夺渡船逃命，先上船者用乱刀砍争攀船舷者手，落入船中的手指居然可掬。简练的一句话，使得晋师溃退时争先恐后仓皇逃命的紧张混乱场面描写得淋漓尽致。又如，齐晋鞌之战，齐侯在战前说道：“余姑翦灭此而朝食。”说自己暂且灭了晋军然后再吃早饭，短短几个字，充分表现出齐侯傲慢、轻敌的特点，也为后文齐国溃败埋下伏笔，成为齐国失败的重要原因。\n\n第五，神秘化和道德化的倾向\n\n由于作者所处时代的局限性，不可能从当时的社会经济、政治发展背景中揭示战争的实质，所以在《左传》战争描写中，往往掺杂着许多占卜或者做梦应验等描写，并且常常将礼、义、德等作为影响事件成败的重要因素，使得战争往往在一开始就带有神秘色彩，有神秘化和道德化的特点。作者在写战争时，往往要投入大量笔墨描写战争的前因后果，例如秦晋崤之战，作者三分之二都在写战前秦晋双方的情况，秦穆公不听进谏，执意攻打晋国，从而揭示了战争结局的必然性。又如“晋楚鄢陵之战”，吕锜梦见自己射到月亮，自己往后退，陷进泥里，占卜之后，知道自己将会射中楚王，并且自己一定会死，而后来果真发生了这件事。这使得他的梦境带有非常浓厚的神秘色彩。\n\n第六，民本思想\n\n《左传》非常重视民心向背在战争中的决定性地位，战争是否最终能够取胜，往往取决于战争能否得到人民的支持，体现出一定的民本思想。“先养民而后用兵，先守备而后攻伐，先安内而后攘外”，这种思想在《左传》众多战例中都有体现。晋文公“始入而教其民”“入务利民”，又“示民以义”“示民以信”“示民以礼”，说明他认识到了安民重民在战争胜负中的重要作用。正因为如此，城濮之战中下层人民主动献“舍于墓”之计，使得晋文公能够取得最终胜利，并且称霸中原。相反，在晋楚争霸的过程中，成公十六年爆发晋楚鄢陵之战，在开战前，申叔就劝告子反不要出战，认为“民心向背”决定战争的胜负。而楚国不重民事，是不能取胜的：“今楚内弃其民，而外绝其好；渎齐盟，而食话言；奸时以动，而疲民以逞，民不知信，进退罪也。”\n\n而在“曹刿论战”中，作者更是渲染了“民心”的重要性，曹刿认为可以参战的三个条件：第一条“衣食所安”“必以分人”，恩惠所加只在贵族，未及于民。所以曹刿说“民弗听”，不能参战。第二条对神诚信，只对天地神灵，仍未及民，因此仍不能出战。只有第三条，是为民做好事，所以曹刿爽快地回答道，“可以一战，战则请从”。曹刿论战，不与庄公讨\n\n论军队，武器装备，战略部署问题，而是着眼于民心向背，充分说明了他的远见，从而也为最后在长勺之战中战胜强大的齐国埋下伏笔。\n\n第七，鲜明的人物形象塑造\n\n《左传》中人物并非孤立，而是在战争中显示其性格，活动在战争中更显其生动，而战争正是因为有了这些各式各样的人而显得更加激烈精彩。作者直接通过人物言行，而不大借助于心理描写和作者议论，自然显示人物鲜明个性，同时也流露出作者的倾向。\n\n这里面有贤君也有昏主，有明臣也有谗人，有勇士又有懦夫，“其性情心术，声音笑貌，干载如生”。如宽容大度、贤明有“春秋之贤诸侯”之称的秦穆公，爱民亲臣、心胸宽厚的楚庄王，“谲而不正”、狡诈阴险的齐桓公，爱国爱民、忠贞勤恳的子产，疾恶如仇、忠诚君国的赵盾，刚而无礼、自信好强的子玉，贪婪成性、信谗惧死的楚令尹子常......人物形象与战争结合得十分紧密，通过写战争也生动地刻画了诸多人物。\n\n第八，外交辞令\n\n《左传》战争描写中有大量委婉巧妙的外交辞令的描绘，是战争描写中的一大特色。春秋时期，贵族文化发达，社会盛行重礼尚文的风气，大夫进谏，行人应对，都讲究辞令之美。《左传》在战争描写的时候，往往穿插大臣的进谏，其中不乏非常委婉巧妙、典雅从容的经典对话，并且至今仍被人们津津乐道，成为后世谏臣时常引用的典范。\n\n第九，辩证关系的运用\n\n《左传》战争描写非常注重辩证关系的运用。作者认为，一次战争的失败，往往只意味着一时的成败和略处下风，绝不是永久的，所以不会决定一个国家的兴衰。只要君王肯发愤图强、改过自新，在不久之后往往就能扭转战局。如秦晋崤之战之后三年，战败的秦国增修国政，“重施于民”，得以报仇雪耻。\n\n《左传》战争描写的艺术成就，还表现在对后世有关军事题材和战争故事的描写有着重要的影响和启发。明代著名历史小说《三国演义》描写战争时，十分重视描写指挥者的谋略和战术，十分重视君王道德修养和民心所向，注重战争与政治外交的关系的描写，充分吸取了《左传》战争描写的优点与营养。\n\n《左传》的文学成就，是先秦同时期的其他历史著作无法相比的。其题材、叙事方法、写人艺术和纯熟精美的语言，都为后世史传文学、小说、诗歌、戏剧的创作提供了艺术借鉴，影响甚为深远。西晋杜预注解《左传》时评价：“左氏之传，史之极也，文采若云月，高深若山海。”刘知几也曾说过：“左氏之叙事也，述行师则簿领盈视，咙聒沸腾；论备火则区分在目，修饰峻整；言胜捷则收获都尽，记奔败则披靡横前。”\n\n综上所述，《左传》作为一部杰出的历史散文著作，仍将继续被人们所喜爱，其伟大的艺术价值，尤其是战争描写的艺术价值，仍将继续成为人们研究的题材，也必然会继续影响后人关于战争描写的创作。","keywords":"置于社会历史背景下 完整性 细节描写 语言简练、准确 神秘化、道德化 人物形象塑造 外交辞令描绘 辩证关系","note":"《左传》虽然在思想上主要表现的是儒家思想，但由于其诞生于春秋时期诸国征伐的环境中，必然会对当时的战争有所表现，因而《左传》的战争描写也同样出色。在这些战争描写之中，也充分体现出了《左传》的叙事特征。相关内容可以参考郭丹《＜左传》中的战争思想》，具体资料可以在李凡文学正版群中领取。"},{"id":"18","stars":"★★","title":"《国语》及其艺术特色","body":"《国语》是一部国别史，全书二十一卷，分别记载周、鲁、齐、晋、郑、楚、吴、越八国事，是各国史料的汇编，成书约在战国初年。各国“语”在全书所占比例不一，每一国记述事迹各有侧重，其艺术特色，主要表现在以下方面：\n\n一、《国语》中主要反映了儒家崇礼重民等观念\n\n西周以来的敬天保民思想在书中得到了继承。虽然《国语》许多地方都强调天命，遇事求神问卜，但在神与人的关系上，已是人神并重，由对天命的崇拜，转向对人事的重视。因而重视人民的地位和作用，以民心的向背为施政的依据。\n\n二、《国语》以记言为主，所记多为朝聘、飨宴、讽谏、辩诘、应对之辞\n\n《国语》记言文字在形象思维和逻辑思维方面都很缜密，又有通俗化、口语化的特点，生动活泼而富于形象性。当然，由于《国语》是各国史料的汇编，素材来源不一，编者亦未作统一润色，其记言水平参差不一，风格也颇有差异。《国语》中的应对辞令，有的与《左传》相同，但文字不如《左传》精彩，有的则难分高下，有的为《左传》所不载的辞令也颇有特色。而《国语》中一些议论说理文字，往往也精辟严密，层次井然，历来为人们所称道。\n\n三、《国语》叙事技巧丰富\n\n《国语》虽然记言多于记事，但《国语》没有单纯的议论文或语录，有一系列大小故事穿插其中，因此表现出叙事技巧和情节构思上的特点，有时也能写出鲜明生动的人物形象。总的说来，《国语》也有对历史事件因果关系的叙述，但不及《左传》普遍完整。《国语》中许多事件的前因后果及经过都是一笔带过，而把重点放在大段的议论文字上。但《国语》也有情节生动曲折，极富戏剧性的叙事，其中有虚拟的情节，非第三者能知，显然是作者援情度理的虚构，更有一些滑稽的小插曲，写得生动活泼。《国语》中对晋献公诸子争位的叙述，展示了春秋时期一场复杂政治斗争的生动画卷，描绘出一系列生动的人物形象，反映了它叙事的成就。\n\n四、向纪传体过渡\n\n由于国别史的特点，《国语》有时在记叙某一国事件时，集中在一定篇幅写某个人的言行，这种集中篇幅写一人的方式，有向纪传体过渡的趋势，但尚未把一个人的事迹有机结合为一篇完整的传记，而仅仅是材料的汇集，是一组各自独立的小故事的组合，而不是独立的人物传记。总之，由于《国语》以记言为主，虽然叙事和刻画人物有一定特色，但文学成就比《左传》还是稍逊一筹。\n\n作为中国首部国别体史书，《国语》以言载史的书写范式，既延续了青铜器铭文“藏礼于辞”的传统，又在记言与叙的交织中叩响了纪传体的门扉。以其质朴而多元的叙事形态，为后世留存了一部兼具史料价值与文体实验意义的历史“活化石”。","keywords":"国别史 记言为主 叙事技巧丰富 向纪传体过渡","note":"《国语》是一部以记言为主的国别史，反映了儒家崇礼重民等观念，在讨论《国语》的特色时，人们往往会将其与《左传》放在一起进行比较。二者语言上各具特色，《国语》在叙述历史事件时的重点和《左传》也有不同，大家也可以将二者放在一起，比较记忆。"},{"id":"19","stars":"★★★★","title":"《战国策》的艺术特色","body":"《战国策》作为战国策士言行的实录，以恣肆雄辩的文风，熔铸了纵横家智慧与叙事美学。其艺术特色，主要包括以下方面：\n\n一、思想内容\n\n与《春秋》《左传》《国语》主要反映儒家思想不同，《战国策》突出表现了纵横家思想，反映了纵横家的人生观。不过，《战国策》的思想内容又比较复杂，所记人物也反映出不同的价值取向。《战国策》的思想价值，在于它反映了战国时代“士”阶层的崛起。“士贵耳，王者不贵”（《齐策四》）的声音，反映出士人精神的张扬。书中大量描写策士奔走于诸侯之间，纵横捭阖，令“所在国重，所去国轻”（刘向《战国策叙录》）的重要作用和社会地位，可以说是一部士阶层，尤其是策士行迹的生动写照。\n\n二、人物塑造\n\n（一）《战国策》的文学成就首先表现在人物形象的塑造上。全书对战国时期社会各阶层形形色色的人物都有鲜明生动的描写，尤其是一系列“士”的形象，更是写得栩栩如生，光彩照人。作者对这些人物心仪不已，颇为倾慕，甚至不惜脱离史实，以虚构和想象进行文学性描写。夸张虚构不合史著的要求，却使叙事更加生动完整，更有利于塑造鲜明的人物形象。\n\n（二）《战国策》还以波澜起伏的情节，个性化的言行，传神的形态和细节来描写人物。作者不满足于平铺直叙，有意追求行文的奇特惊人，于紧张激烈的矛盾冲突中，人物性格得以生动展现。人物个性化的言行在《战国策》中很突出，这些言行反映了人物的内心世界和性格特征。除此之外，《战国策》在人物的外貌描写上，也很是生动传神。\n\n《战国策》在写人上，一方面继承了《国语》相对集中编排同一人物故事的方法，另一方面又有所发展，出现了一个人物的事迹有机集中在一篇的文章，为以人物为中心的纪传体的成立开创了先例。这样一来，人物形象和性格得到了充分的展示。这类作品，显示了由《左传》编年体向《史记》纪传体的过渡。\n\n三、语言艺术\n\n（一）《战国策》的“文辞之胜”，在语言艺术上的空前成功，是其文学成就的重要方面。其中策士廷说诸侯之辞，臣讽君主之辞，以及不同意见的辩难，都反映出春秋时期从容不迫的行人辞令，已演化为议论纵横的游说之辞。其文章艺术风格，前人概括为“辩丽横肆”。铺张扬厉，气势纵横，可说是《战国策》说辞的主要特色。\n\n（二）《战国策》还用大量的寓言故事、佚闻掌故来增强辩辞的说服力。寓言的巧妙运用，成为《战国策》文章的一大特点。这些寓言大都即事编撰，独出心裁，比附现实，以表情达意。用具体的形象概括抽象的道理，表现出极强的艺术力量。\n\n（三）《战国策》的铺张扬厉，气势充沛，还与行文的夸张铺陈，大量运用对偶、排比有关，与其游说之辞一样，《战国策》的叙述语言，也长于铺张渲染。“苏秦始将连横”（《秦策一》）写苏秦说秦王不行时的狼狈之状，发迹后路过家乡时的踌躇满志，“荆轲刺秦王”（《燕策三》）写荆轲易水送别时的慷慨悲壮，都是典型的例子。《战国策》叙述语言有时描写相当精细：苏秦刺股（《秦策一》），触龙入朝（《赵策四》），邹忌窥镜（《齐策一》）等，写的都是琐屑细节，却展现了人物的精神面貌。尤其是荆轲刺秦王的场面，描写人物动作神情，极为细致传神，荆轲的不惧生死，秦王的惊慌失措，殿上殿下的混乱惊扰，这些顷刻间发生的惊险紧急场面，作者-道来，清晰详尽，有条不紊，如同电影镜头，作者对叙述语言运用之娴熟，令人惊叹。\n\n☒《战国策》文章辩丽横肆的文风，雄隽华赡的文采，是当时纵横捭阖时代特征的体现，标志着先秦叙事散文语言运用的新水平。","keywords":"纵横家思想、人生观“士”的形象 波澜起伏的情节 个性化的言行 传神的形态和细节 “文辞之胜”“辩丽横肆”寓言故事 夸张铺陈 语言运用的新水平","note":"《战国策》的艺术特色，主要从思想内容、人物塑造和语言艺术三个维度进行分析，同时要注意到每一个维度内都包括许多细小的内容。相较于《春秋》《左传》，《战国策》在思想内容上也显露出了很大的差别，具体题目可以在李凡文学正版群中查看。"},{"id":"20","stars":"★★★★","title":"《战国策》在人物塑造上的成就","body":"《战国策》的文学成就首先表现在人物形象的塑造上、全书对战国时期社会各阶层形形色色的人物都有鲜明生动的描写，尤其是一系列“士”的形象，更是写得栩栩如生，光彩照人。纵横之士如苏秦、张仪，勇毅之士如聂政、荆轲，高节之士如鲁仲连、颜斶等等，都个性鲜明，具有一定的典型意义，代表了士的不同类型。\n\n一、以虚构和想象进行文学性描写\n\n由于作者对这些人物心仪不已，颇为倾慕，甚至不惜脱离史实，以虚构和想象进行文学性描写。《战国策》中，不是史实，出于虚构依托的内容颇多。如书中用力极深，描写得极成功的人物苏秦，其事迹言论有不少就是虚构的。至于在具体描写中，虚构的手法更为普遍，也更进一步。如《秦策一》写苏秦夜读，引锥自刺及慨叹之语，夜室独语，有谁知道，显然是作者根据传闻虚拟而成。而《齐策一》邹忌讽齐王纳谏，写邹忌看见徐公时“孰视之，自以为不如，窥镜而自视，又弗如远甚”，不仅表现了邹忌内心的活动，而且涉及心理活动的过程，接近人物的心理描写，显系出于作者的想象。夸张虚构不合史著的要求，但却使叙事更加生动完整，更有利于塑造鲜明的人物形象。\n\n二、以波澜起伏的情节，个性化的言行，传神的形态和细节来描写人物\n\n（一）作者不满足于平铺直叙，有意追求行文的奇特惊人，如《燕策三》记燕太子使荆轲刺秦王，其中田光自刎以明不言，樊於期自刎献头以图报仇，易水送别，秦廷献图行刺等情节出人意表，慷慨悲壮，于紧张激烈的矛盾冲突中，人物性格得以生动展现。\n\n（二）人物个性化的言行在《战国策》中很突出，如《秦策一》中，苏秦落魄而归后的刺股和喟叹，荣归故里时的感慨，其家人前倨后恭的言行等，都反映了人物的内心世界和性格特征。而对苏秦归来时“羸滕履蹻，负书担橐，形容枯槁，面目犁（黧）黑，状有归（愧）色”的外貌神情描写，绵密细致，极为传神。\n\n三、人物编排的过渡性\n\n《战国策》在写人上，一方面继承了《国语》相对集中编排同一人物故事的方法，另一方面又有所发展，出现了一个人物的事迹有机集中在一篇的文章，为以人物为中心的纪传体的成立开创了先例。如《齐策四》冯谖客孟尝君，写冯谖弹铗而歌、焚券市义、营造三窟的事迹，冯谖一生的主要事迹尽在一篇中，人物形象和性格得到了充分的展示。这类作品，显示了由《左传》编年体向《史记》纪传体的过渡。\n\n总之《战国策》在人物塑造上突破了先秦史籍的实录传统，以文学性强化了历史表达的感染力，推动了编年体向纪传体的演变，对《史记》产生了重要影响，在中国叙事文学史上具有承前启后的重要价值。","keywords":"“士”的形象 虚构和想象 波澜起伏情节 个性化言行 传神的形态和细节 向纪传体的过渡","note":"《战国策》的人物塑造有两大特色，一是使用了虚构和想象的手法，二是从情节、人物言行、形态和细节三方面综合表现人物形象。此题和上题有相同之处，意在告诉大家，题目虽然可以多变，但在考场上不要惊慌，一些知识点稍加组织变换，是可以答不同题目的。大家也一定要学会带着问题意识去读书。"},{"id":"21","stars":"★★★★★","title":"《战国策》的语言特色与成就","body":"《战国策》的“文辞之胜”，在语言艺术上的空前成功，是其文学成就的重要方面。《战国策》中策士廷说诸侯之辞，臣讽君主之辞，以及不同意见的辩难，都反映出春秋时期从容不迫的行人辞令，已演化为议论纵横的游说之辞。其文章艺术风格，前人概括为“辩丽横肆”，铺张扬厉，气势纵横，可说是《战国策》说辞的主要特色。具体来说，《战国策》的语言艺术，主要包括以下特色：\n\n一、引类譬喻，言辞委婉\n\n战国时代，君德浅薄，多庸主暴君，游士为说服君相，说辞大都不以直接方式，往往引类譬喻，借动物、植物或人们生活中习见的其他事物为喻，循序渐进地达到辩说的目的。《楚策四》载庄辛说楚襄王，庄辛针对楚襄王淫逸侈靡、不顾国政而进谏，说明国君如此行径必遭杀身之祸。他运用四种譬喻，即蜻蜓为五尺之童所黏捕，黄雀被王孙公子射杀，黄鹄被射者用网罗捕获，蔡圣侯因放荡逸乐被楚大夫子发用绳索捆缚。四种譬喻，由小到大，逐渐过渡到楚顷襄王本身，指出其所作所为，正把自己置于危险境地，形象生动，引喻谐调，气势充沛，说理充分。再如《齐策一》邹忌讽齐王纳谏，也是从切身体验的生活趣事，来形象喻示所要阐述的道理，贴切深刻，饶有风趣，很有说服力。\n\n二、大量使用寓言故事、佚闻掌故\n\n《战国策》还用大量的寓言故事、佚闻掌故来增强辩辞的说服力。寓言的巧妙运用，成为《战国策》文章的一大特点。如《燕策二》苏代以鹬蚌相争，说赵惠王不应伐燕，以免强秦坐收其利，这类例子在《战国策》中俯拾皆是，如“画蛇添足”（《齐策二》）、“狐假虎威”（《楚策一》）、“南辕北辙”（《魏策四》）等等。这些寓言大都即事编撰，独出心裁，比附现实，以表情达意。用具体的形象概括抽象的道理，表现出极强的艺术力量。\n\n三、行文夸张铺陈，长于渲染\n\n（一）《战国策》的铺张扬厉，气势充沛，还与行文的夸张铺陈，大量运用对偶排比有关，如《赵策三》“鲁仲连义不帝秦”，列举了周烈王之斥齐威王，殷纣王之醢鬼侯、脯鄂侯、拘文王等，肆意夸张铺陈，极言尊秦之害。又如《齐策一》记苏秦说齐王合纵，极力夸张渲染齐国之强，临淄之胜，排比对偶层出不穷，文辞瑰丽多姿。\n\n（二）与其游说之辞一样，《战国策》的叙述语言，也长于铺张渲染。“苏秦始将连横”（《秦策一》）写苏秦说秦王不行时的狼狈之状，发迹后路过家乡时的踌躇满志，“荆轲刺秦王”（《燕策三》）写荆轲易水送别时的慷慨悲壮，都是典型的例子。《战国策》叙述语言有时描写相当精细。苏秦刺股（《秦策一》），触龙入朝（《赵策四》），邹忌窥镜（《齐策一》）等，写的都是琐屑细节，却展现了人物的精神面貌。尤其是荆轲刺秦王的场面，描写人物动作神情，极为细致传神，荆轲的不惧生死，秦王的惊慌失措，殿上殿下的混乱惊扰，这些顷刻间发生的惊险紧急场面，作者-道来，清晰详尽，有条不紊，如同电影镜头，作者对叙述语言运用之娴熟，令人惊叹。\n\n《战国策》文章辩丽横肆的文风，雄隽华赡的文采，是当时纵横捭阖时代特征的体现，标志着先秦叙事散文语言运用的新水平。","keywords":"“文辞之胜”铺张扬厉，气势纵横 引类譬喻 寓言故事 夸张铺陈","note":"分析《战国策》的语言艺术特色，需要我们去结合游说之辞和叙事语言两方面去具体分析，其中重点是游说之辞方面的特色。相较于《左传》，《战国策》的语言运用艺术明显更进一步，大家可以结合这二者语言特色的差异来理解“先秦叙事散文语言运用的新水平”这一判断。"},{"id":"22","stars":"★★★★","title":"谈谈先秦叙事散文对后世文学的影响","body":"《左传》《国语》《战国策》等先秦叙事散文，对后代的文学创作产生了深远的影响。它们的叙事传统和语言艺术对史传文学、散文和小说创作的滋养，尤为明显。具体来说，可以从以下角度进行分析：\n\n一、对史传文学的影响\n\n先秦叙事散文的体例、思想、写作艺术等对后世史传文学的创作有直接启发。《史记》体例是在先秦编年史、国别史的基础上的创新和发展，而《汉纪》《资治通鉴》等，则是《春秋》《左传》编年体史书的直接继承。先秦叙事散文记述历史事件时直书其事、褒贬鲜明的特点，《左传》《战国策》高超的写作艺术，对后世史传文学的创作，产生了深远的影响。《左传》的叙事艺术，如对历史事件因果关系、发展过程的重视，对历史事件故事化的描写、历史事件的叙述条理井然而又富于\n\n变化等等特点在后代史传文学中都有充分体现。《左传》简练蕴藉的语言风格为后代史家所继承，而《史记》的奇谲文风，显然与《战国策》的辩丽恣肆有直接的关系。总之，先秦叙事散文是我国史传文学最初成就，其沾溉于后世，不言而喻。\n\n二、对散文的影响\n\n先秦叙事散文在散文史上具有崇高的地位，《左传》《国语》《战国策》等，成为后世散文写作的楷模。秦汉以后，《左传》的文章一直为人们所喜爱，尤其是唐宋以来的古文家，都非常推崇《左传》，并把它作为学习对象。情韵丰富的《左传》散文也深为清代桐城派散文家所推崇。对《国语》语言艺术的赞誉，历来甚多。汉初散文，尚有战国遗风，贾谊、邹阳等西汉前期散文家的作品中更是可以明显看出《战国策》文风的余绪。这种影响持续不断，在苏洵、苏轼等后代作家的散文中，还可以体味到先秦叙事散文的神韵。《战国策》的文章，对汉赋的产生也起过促进作用。汉赋主客问答的形式，铺张扬厉的风格，都可以看出对《战国策》的借鉴。\n\n三、对小说的影响\n\n先秦叙事散文的叙事艺术，对我国古代小说的产生、发展及其独特的艺术个性的形成，都有不可低估的作用。\n\n（一）先秦叙事散文叙述历史事件中表现出的褒贬分明的倾向性，对我国古代小说注重教化作用有直接的影响，并且，《左传》《国语》等作品中用“君子曰”等对事件进行的评述，在文言小说如唐宋传奇、《聊斋志异》等书中被直接借鉴，就是在明清白话小说中，也有明显的痕迹。\n\n（二）先秦叙事散文奠定了我国古代小说基本的叙事结构。我国古代小说常按时间顺序安排结构，串联情节，特别重视对故事起因、过程、结果的完整描写，并以倒叙、插叙、补叙等方式追叙事件的起因，以预叙的方式暗示故事的结局。这些都是《左传》等散文中就已形成的叙事传统。\n\n（三）我国古代小说写人的基本手法在先秦叙事散文中已初具规模。我国古代小说主要通过描写人物个性化的言行，通过生动的细节描写来刻画人物，表现人物性格，而较少长篇的外貌描写、心理描写，而这正是《左传》《国语》《战国策》等写人的共同特点。\n\n（四）我国古代小说和戏曲作品对历史题材的重视，也是受先秦叙事散文的启示。这不仅是指诸如《东周列国志》之类以先秦叙事散文为题材的作品，同时，古代小说大量采用历史题材，也和我国叙事文学最初成果是产生在历史著述中不无关系。\n\n综而观之，先秦叙事散文以其“文史同源”的叙事母体特质，为中国文学构建了多维度的基因图谱。","keywords":"史传文学 体例、思想、写作艺术 散文 写作的楷模 古代小说 产生、发展 艺术个性","note":"先秦叙事散文对后世文学的影响，主要体现在史传文学、散文和小说三种文章体裁上。其中，对史传文学和散文的影响比较容易被我们理解，而对小说的影响，则需要我们去仔细思考。这一部分涉及的《左传》《战国策》等先秦叙事散文，都有可能在名词解释中出现，相关内容大家要特别关注。"},{"id":"23","stars":"★★★","title":"谈谈先秦诸子散文的发展概况及特点","body":"先秦时期，说理散文经历了一个由萌芽到成熟的过程，在语录体的发展变化中逐步成熟。具体来说，主要呈现出以下三个阶段：\n\n一、早期萌芽阶段：《论语》《老子》\n\n儒家和道家的代表著作《论语》《老子》，以其弘深的思想，词约义丰的写作特点，对后世说理散文有广泛的影响。《论语》言近旨远的说理，形象隽永的语言，使它成为先秦说理文主要的形态。作为说理文，《论语》还很幼稚。不过，先秦说理文的一些文体特征，在《论语》中已有萌芽。《老子》以韵文为主，韵散结合的形式，是先秦说理文的另一形态。\n\n二、由语录体向专论体过渡阶段：《孟子》《墨子》《庄子》\n\n战国中期的《孟子》散文也是语录体，篇题仍是取首章首句的二三字，每篇也不是围绕着一个主题来论述。全书不仅记录孟子的只言片语，更有一些章节就一个中心论点反复论述，形成了对话体的论辩文。\n\n时代在孟子之前的《墨子》，和《孟子》同时代的《庄子》，则显示出由语录体向专论体过渡的迹象。《墨子》中反映墨子的主要思想和代表其说理风格的是《尚贤》《尚同》《兼爱》《非攻》等10论。这些篇目的标题都概括了论述的中心思想，也许是编辑者所加；文章结构完整，层次清楚，不再是三言两语的独白或对话。《墨子》尚未完全摆脱语录体的影响，大量的“子墨子曰”，表明这些仍是墨子后学对墨子讲学之辞的记录。只是这些语录段与段之间有密切的联系，是在围绕同一个论题加以论述，因而就再不是语录的简单联缀，而是有内在逻辑的论文，说理文体制在《墨子》中形成了。\n\n《庄子》中的许多篇章虽然围绕论题仍有不少对话，但许多篇章整篇不是问答式的对话结构，而是以多则构思奇妙的寓言结构成文，并且在论述中，形象情感与逻辑思辨结合在一起，就文体形式来说，别具一格，可算是抒情性说理文。\n\n三、散文体制定型阶段：《荀子》《韩非子》\n\n战国末期，《荀子》《韩非子》中的专题论文，标志着说理散文体制的定型。荀、韩之文，往往是长篇大论，有一个标明全篇主旨的标题，论点明确中心突出，论证精密，注意谋篇布局，结构浑然一体，表明我国说理文体制已经成熟。从此以后，专论体成为我国说理散文的主要形式。\n\n综上所述，《论语》创立的语录体，在《墨子》中得到发展，进而形成了《孟子》的对话式论辩文。《庄子》丰富的寓言和奇崛的想象，成为先秦说理文的瑰宝。《荀子》《韩非子》中的专题论文，则标志着我国古代说理文体制的完全成熟。总体来看，先秦散文的发展趋向，是由简而繁，由疏而密，理性和逻辑不断增强。","keywords":"早期萌芽 语录体向专论体过渡 专题论文 散文体制的定型","note":"回答这道题目，首先要明确先秦说理散文由萌芽到成熟的三个阶段，以及每个阶段的代表作品，这些代表作品的具体特色，我们也需要掌握，这些内容大家要注意。总体来看，先秦说理散文从语录体一直进化到专题论文，完成了说理散文体制的定型，后世的说理散文如《六国论》《留侯论》等都采用了这一体制。"},{"id":"24","stars":"★★","title":"简述《论语》的艺术特色（文学价值）","body":"《论语》记载孔子及其弟子的言行，由孔子弟子及再传弟子纂录而成。作为说理文，《论语》尚显幼稚。不过，先秦说理文的一些文体特征，在《论语》中已有萌芽。《论语》的基本特征是语录体，但语录体并不是《论语》文学价值的主要方面，《论语》的文学色彩在于表现了孔子及其弟子的形象性格以及深刻平实、含蓄隽永的语言。具体来说，主要包括以下内容：\n\n一、语录体是《论语》文体的基本特征\n\n它或是记录孔子的只言片语，或是记录孔子与弟子及时人的对话，都比较短小简约，还没有构成单篇的、形式完整的篇章。书中也有些较长的段落，如《先进》篇中“子路、曾皙、冉有、公西华侍坐”，详细记载孔门师生间的一场谈话，叙述清楚，有一定描写，表现了人物的不同个性，作为叙事记言文字，比较成功，但与说理文显然还有一定距离。而《季氏》篇中“季氏将伐颛臾”里孔子的几段话，针对性强，层次清晰，具有说理文的某些特点。《论语》这种在对话中说理的形式，直接影响了先秦说理文的体制。\n\n二、《论语》以记言为主，其文学性突出地表现在人物语言的特有风格、表达和魅力上\n\n（一）《论语》所记人物说话多言近旨远，言简意深，话语不多，用词平易，却含蕴丰厚，极耐寻思和咀嚼，这突出表现在孔子的与人对话中。\n\n（二）《论语》中人物说话时还用比方，使对话形象、风趣，亦因此而颇耐寻味。\n\n（三）《论语》中人物语言虽多处于本色记述，具有口语化特点，但有些表述自然形成排比、对仗等箴言体常有句式，具有凝练、规整之美，既发人深思，亦便于记忆。\n\n三、《论语》的文学性还体现在以形象的语言来表达深刻的道理\n\n如“子曰：“岁寒，然后知松柏之后凋也’”（《子罕》），“子曰：‘饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云’”（《述而》）等等，形象简约地表达了深刻的哲理，令人回味无穷。\n\n四、《论语》中充沛的情感和丰富的语气词使其语言更为委婉\n\n如“子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐，贤哉，回也！’”（《雍也》）简短几句包孕了真挚的情感，以及对颜回安贫乐道自在心境的赞赏。又如“子曰：‘甚矣，吾衰也！久矣，吾不复梦见周公。＇”（《述而》）“矣”“也”等语气词的使用，把对自身的无限感慨和对周公的无限思慕，表现得意味深长。\n\n《论语》言近旨远、词约义丰的说理，形象隽永的语言，使它成为先秦说理文主要的形态。","keywords":"语录体 深刻平实 含蓄隽永 人物语言 以形象的语言来表达深刻的道理 充沛的情感 丰富的语气词","note":"作为说理文，《论语》的不成熟性体现在其语录体的体裁上，而它的文学性则主要体现在对孔子等人物形象的塑造和语言特色上。虽然不成熟，但《论语》已经体现了说理文的基本特征。《论语》可能在名词解释中出现，相关内容大家要特别关注。"},{"id":"25","stars":"★★★★","title":"试分析《孟子》的艺术特色","body":"作为先秦儒家散文的典范，《孟子》以其独特的论辩艺术与审美特质，在诸子著述中构建了兼具哲学深度与文学张力的经典范式。其艺术特色，主要表现在以下方面：\n\n一、长于论辩\n\n孟子曾说：“予岂好辩哉？予不得已也。”在百家争鸣的时代，要阐明自己的观点，维护自己的立场，批评其他学派，就不得不进行论辩。《孟子》的论辩文，在逻辑上也许不如《墨子》严谨，但却更具有艺术的表现力，具有文学散文的性质。\n\n（一）《孟子》中的论辩文，巧妙灵活地运用了逻辑推理的方法\n\n孟子得心应手地运用类比推理，往往是欲擒故纵，反复诘难，迂回曲折地把对方引入自己预设的结论中。《孟子》这种特点在一些长篇论辩文中，更是表现得淋漓尽致。《孟子》对二难推理的灵活运用和机智的反应，使其论辩更有左右逢源之妙。\n\n（二）“孟子长于譬喻”，在论辩中常用比喻，把抽象的道理用具体生动的形象表现出来\n\n孟子的比喻性推理，从逻辑上来说，有些未免牵强，但却使孟子的论辩，富于形象性，具有极大的艺术感染力。《孟子》中的比喻，大多浅近简短而贴切深刻，如“民之归仁也，犹水之就下，兽之走圹也”，以一个简单的比喻，表现民众归仁的必然趋势。这种简短浅近的比喻，在《孟子》中大量运用。此外《孟子》中也有少数就近取譬，生动有趣的寓言故事，如“齐人有一妻一妾”，人物毕肖，结构完整，情节生动，具有很强的戏剧性，成功地以齐人言行喻官场中那般钻营富贵利达之徒，讽刺他们的卑鄙无耻，揭露他们灵魂的丑恶。\n\n二、气势浩然是《孟子》散文的重要风格特征\n\n气势浩然这种风格，源于孟子人格修养的力量。孟子曾说：“我善养吾浩然之气。”“养气”是指按照人的天赋本心，对仁义道德经久不懈的自我修养，久而久之，这种修养升华出一种至大至刚、充塞于天地之间的“浩然之气”。具有这种“浩然之气”的人，“说大人，则藐之”，在精神上首先压倒对方，能够做到藐视政治权势，鄙夷物质贪欲，气概非凡，刚正不阿，无私无畏。写起文章来，自然就情感激越，辞锋犀利，气势磅礴。气盛言宜，孟子内在精神修养上的浩然气概，是《孟子》气势充沛的根本原因。同时，《孟子》大量使用排偶句、叠句等修辞手法，来加强文章的气势，使文气磅礴，若决江河，沛然莫之能御。\n\n三、《孟子》的语言明白晓畅，平实浅近\n\n《孟子》语言精练准确，和古奥难懂的《尚书》及铜器铭文显然不同。它继承发展《论语》《左传》《国语》等开创的新的书面语言形式，形成了一种精练简约、深入浅出的语言风格。可以说，后来统治了我国两千多年的标准书面语，在《孟子》那里已经成熟了。","keywords":"长于论辩 逻辑推理 长于譬喻 气势浩然 明白晓畅 精练准确","note":"孟子相关知识是一个高频考点，许多大学都喜欢围绕他出题。但万变不离其宗，无论怎样考查，都是要以我们所学知识为基准的。只要大家将相关内容掌握扎实，在考试中便可以根据题目设问灵活应对。"},{"id":"26","stars":"★★★★","title":"试分析《孟子》的对话辩论艺术","body":"孟子身处百家争鸣最炽的战国中期，要宣传己说，有时还要招架诘难，正是“予岂好辩哉，予不得已也”（《滕文公下》）。《孟子》因此而以申说论辩为特色，其中除部分以“孟子曰”开篇单记孟子辞说的片段外，多有针对具体问题与人对话论辩的篇目。因此《孟子》文章已不似《论语》简练含蓄，也不以严谨见长，但锋利流畅，富于激情，具有明快奔放、滔滔雄辩的风格特点。\n\n一、《孟子》对话论辩的特点首先在于先声夺人，辞以气胜\n\n无论回答问题或提出论点，孟子总是理直气壮，开篇便以气势占据主动，以自信感染对方。这种肯定的语气，滔滔不绝的说辞，使对方不由不信。\n\n孟子宣称“我善养吾浩然之气”（《公孙丑上》），这种“浩然之气”“配义与道”，有坚定的志向、自我肯定的信念和由信念而生的无畏不屈做支撑，故“至大至刚”，表现在言辞和文章中，才有如此毫不闪避的单刀直入和必胜无疑的凌人辞气。\n\n二、《孟子》对话论辩的特点更在于十分讲究论辩手段和技巧\n\n孟子生性争强好胜，遇对手从不偃旗息鼓，且会根据不同情况采取各种方式和对策。\n\n比如善设机巧，引人入彀，通过由远及近、穷追不舍的提问，使对方在不经意中陷入矛盾，由此赢得论辩主动，甚至不辩已胜。\n\n再比如巧换概念，转换角度，“反败为胜”。当被对方抓住把柄、击中要害时，灵活避免正面交锋，最终仍处不败之地。还比如以其人之道还治其人之身。面对对方有意采取不规范的推导方式，也以同样方式予以回敬，由此显示对方的悖谬。\n\n三、《孟子》对话论辩的特点还在于极喜随口设喻，使所论深入浅出，明白易晓\n\n如《齐宣王问齐桓晋文之事章》（《梁惠王上》），以“力足以举百钧，而不足以举一羽，明足以察秋毫之末，而不见舆薪”的悖谬比附“恩足以及禽兽，而功不至于百姓”的不近情理，以“挟太山以超北海”和“为长者折枝”说明“不能”和“非不能”两种情况，以“天下可运于掌”极言轻而易举，以“缘木求鱼”比喻异想天开，以“邹不敌楚”说明“弱固不可以敌强”等等，各种比方信手拈来。其他如“五十步笑百步”（《梁惠王上》）、“揠苗助长”（《公孙丑上》）、“一傅众咻”（《滕文公下》）、“攘邻之鸡”（《滕文公下》）、“一曝十寒”“弈秋诲弈”“杯水车薪”（《告子上》）、“登泰山而小天下”“观于海者难为水”（《尽心上》），等等，于所喻亦无不生动、形象和贴切。","keywords":"以申说论辩为特色 先声夺人，辞以气胜 讲究论辩手段和技巧 随口设喻","note":"孟子身处百家争鸣最激烈的战国时代，无论是要宣传己说还是应对诘难，都要求孟子与他人进行论辩，因而，“长于论辩”变成为了《孟子》的一个最重要的特色，而相关的论辩特色，则需要我们结合《孟子》的具体内容去进行分析。"},{"id":"27","stars":"★★★★★","title":"试分析《庄子》的艺术特色","body":"先秦说理文中，最有文学价值的是《庄子》，其艺术特色，主要包括以下内容：\n\n一、大量使用寓言故事\n\n《庄子》中自称其创作方法是“以卮言为曼衍，以重言为真，以寓言为广”（《天下》）。寓言即虚拟的寄寓于他人他物的言语。《庄子》一书，大都是用“三言”形式说理。这三种形式有时融为一体难以分清。“三言”之中，“寓言十九”（《寓言》），寓言是最主要的表现方式。\n\n《庄子》内篇及外、杂篇中的许多篇目，都以寓言为文章的主干。大量运用充满“谬悠之说、荒唐之言、无端崖之辞”（《天下》）的寓言，使《庄子》的章法散漫断续，变化无穷，难以捉摸。《庄子》结构线索上的模糊隐秘，并不意味着文章结构缺乏内在联系，而是深邃的思想和浓郁的情感贯注于行文之中，形成一条纽带，把看似断断续续的孤立的寓言与寓言之间，段与段之间联结在一起，融为一个有机体。《庄子》内篇，可以说是哲理抒情散文。\n\n二、运用超常的想象力，“寓真于诞，寓实于玄”\n\n《庄子》一书的文学价值，不仅在于寓言数量多，全书仿佛是一部寓言故事集，还在于这些寓言表现出超常的想象力，构成了奇特的形象世界，“意出尘外，怪生笔端”（刘熙载《艺概·文概》）。《庄子》哲学思想博大精深，深奥玄妙，具有高深莫测、不可捉摸的神秘色彩，用概念和逻辑推理来直接表达，不如通过想象和虚构的形象世界来象征暗示。同时，庄子从“道”的立场来看待万物，万物等齐一体，物与物之间可以互相转化。而且，庄子认识到了时间的无限，空间的无限，宇宙的无穷，他不仅站在个人的立场看待世界万物，也站在宇宙的高度看待世界万物，因而，《庄子》的想象虚构往往超越时空的局限和物我的分别，恢诡谲怪，奇幻异常，变化万千。\n\n《庄子》诡奇的想象，是为了表达其哲学思想。“寓真于诞，寓实于玄”（《艺概·文概》），是《庄子》的主要特征。《庄子》中奇幻的想象，不仅形象地表达了他深邃的哲学思想，而且反映了他对现实社会的认识，充满批判精神。“庄子文看似胡说乱语，骨里却尽有分数。”（《艺概·文概》）《庄子》奇丽诡谲的艺术形象，是其哲学思想的反映，同时也是其深沉情感迂回曲折的流露。《庄子》作者尽管主张忘情寡欲，心斋坐忘，但也有强烈的个性与感情。\n\n三、形象恢诡的论辩风格\n\n《庄子》以丰富的寓言和奇崛的想象，构成了瑰玮諔诡的艺术境界，具有散文诗般的艺术效果，但《庄子》毕竟是哲理散文，和其他诸子说理文一样，属于议论文。只是它的说理不以逻辑推理为主，而是表现出形象恢诡的论辩风格。\n\n《庄子》常以寓言代替哲学观点的阐述，用比喻、象征的手法代替逻辑推理的论述。较少直接发表自己的观点，表明自己的态度，而是让读者从奇特荒诞、生动形象的寓言故事中，去体味、领悟其中的哲理。而在论辩过程中往往又表现出作者精辟的思辨能力。《庄子》中一些比较纯粹的议论文字，则注重逻辑推理，常运用演绎归纳等逻辑方法，层层推论。但若仔细考察其推论过程，在逻辑上并非十分严密。\n\n《庄子》的论，与其说读者是被其逻辑推理所征服，不如说是被奇诡的艺术境界、充沛的情感所感染。如《逍遥游》末两段，庄子与惠子辩有用无用，超越了形式逻辑的规则，进入了“无言无意之域”。正因为这样，庄子哲学充满了诗意。\n\n四、语言具有诗歌般的特色\n\n《庄子》的语言如行云流水，汪洋恣肆，跌宕跳跃，节奏鲜明音调和谐，具有诗歌语言的特点。清人方东树说：＂大约太白诗与庄子文同妙，意接而词不接，发想无端，如天上白云卷舒灭现，无有定形。”（《昭昧詹言》卷十二）庄子的句式错综复杂，富于变化，喜用极端之词，奇崛之语，有意追求尖新奇特。如《齐物论》写大风，既有赋的铺陈，又有诗的节奏。而像《逍遥游》末段那样的文字简直就是抒情诗。","keywords":"寓言为文章的主干 “寓真于诞，寓实于玄”形象恢诡 诗歌语言的特点","note":"①《庄子》是先秦诸子散文中比较重要的一部分内容，在考研时常常会碰到，许多大学都喜欢围绕他出题。并且这部分内容也比较庞杂，需要大家仔细、全面进行记忆。②另，这题还有问《庄子》诗意表现的，主体的答题思路是一样的，就是大标题调整成和“诗意”即可，具体可去正版群中下载。"},{"id":"28","stars":"★★★","title":"试述《庄子》中寓言的类型","body":"不同于其他诸子在说理中的偶或用之，“寓言”是《庄子》全书有意使用的一种基本话语形式，即将抽象哲理寓于角色表述和形象描绘之中，几乎满篇都是“杜撰”出来的人物、故事、场面、情节，“著书十馀万言，大抵率寓言也”（《史记老子韩非列传》），《庄子》因此而成为先秦诸子中最富形象性和艺术创造性的一部著作。\n\n《庄子》寓言丰富多彩，已经出现多种类型：\n\n一、“寄寓型”寓言\n\n一种为“寄寓型”寓言，即“作人姓名，使相与语，是寄辞于其人”，亦即借他人之口直接阐述自己观点。这种“寄寓之言”是《庄子》“三言”之一“寓言”的本义，即“寓言十九，藉外论之”（《寓言》）。要“藉外论之”，势必造设说话人和说话契机，书中因此充满各色人物及人物对话的场面和过程。其中被用来对话的人物，有古人，有时人，有现实中的人，亦有虚构的甚至拟人化的人。他们许多人本有自己的学说和观点，在此却只剩下一个名字，其头脑和口舌则被置换为庄学的载体。\n\n二、“象征型”寓言\n\n另一种可称之为“象征型”寓言，哲理蕴含在形象和具体事物之中，形象与意义构成完整比喻关系，从而具有象征意味。这是诸子所用也是通常所说“寓言”最常见的形式，《庄子》也多有使用，且明显带有庄学痕迹。如《应帝王》中的“儵忽凿浑沌”，儵与忽好心报答浑沌，反而导致浑沌之死，“无以人灭天”的哲学，在这里得以形象呈现。其中“浑沌”“七窍”“儵”“忽”“凿”“浑沌死”皆属喻体，皆有寓意，而各部分彼此相连，又构成一段完整情节。诸如此类在《庄子》中比比皆是，多已成为“成语”而为人们所熟知。\n\n三、“故事型”寓言\n\n还有一种可称之为“故事型”寓言，即通过讲述故事隐喻哲理。其与“象征型”寓言的区别在于更富情节性，哲理也蕴含在描写之中，却不必与形象构成直接比喻关系。如《达生》中的“桓公见鬼”：自以为伤于鬼的齐桓公一病不起，“数日不出”，听说见到此鬼者即可称霸后“不终日而不知病之去”，养生重在养心的哲理于此可见。他如《田子方》中的“宋元君将画图”和“臧丈人逃文王授政”、《徐无鬼》中的“徐无鬼以相狗相马说魏武侯”和“子綦召九方歅为八子相面”、《外物》中的“儒以《诗》《礼》发冢”、《让王》中“子列子辞郑子阳馈赠”和“原宪居鲁”，等等，亦无不于故事中蕴含了作者所要表达的思想和态度。\n\n【李凡关键词：“寄寓型”“象征型”“故事型”】","keywords":"","note":"《庄子》是先秦诸子中使用寓言比较多的一部著作，而这也是《庄子》的典型特征。对于《庄子》中寓言的几个类型，我们需要有所了解。大家可以结合具体例子进行记忆。这部分涉及“《庄子》三言”这一个比较关键的名词解释，大家要注意积累。"},{"id":"29","stars":"★★★★","title":"简述《庄子》“三言”及其特点","body":"《庄子》“三言”即“卮言”“重言”“寓言”，《天下》篇中自称其创作方法是“以卮言为曼衍，以重言为真，以寓言为广”。\n\n一、“卮言”\n\n“卮言”即出于无心、自然流露的语言。《庄子》一书“以卮言为曼衍”，即把“卮言”作为文章连绵不断的要素，以此贯通全篇，使篇章结为一体。它是文章的脉络和线索。只要抓住“卮言”这一文章血脉，就不会“使读者迷于常径”“令人不可捉摸”（刘凤苞语）。综观整部《庄子》，我们可以看到“卮言”始终起着或明或暗的文章线索的作用。\n\n二、“重言”\n\n“重言”意指引重之言。庄子“以重言为真”，主要意图是借重长者、尊者的言论以自重，取信于人。庄子在文中虚构了大量前贤先圣的言行，如通过对孔子的变形，让孔子大谈“心斋”“坐忘”，使得孔子成了道家思想的代言人。\n\n三、“寓言”\n\n“寓言”占九成《庄子》一书九成，有二百则左右。这些寓言故事常常通过寓言人物之间的辩论，来宣扬庄子的哲学思想，庄周联想丰富，具有丰富的想象力，感情充沛，极尽想象之能事，文章中充满了大量的寓言，多则寓言的连用也不时出现，甚至整篇文章全由寓言故事组成，如《人世间》中“孔、颜论心斋”“叶公子高使齐”“匠石见栎社”和“南伯子綦见大木”“支离疏、楚狂接舆讽孔子”等寓言，充分地阐发和宣讲了“道”的处世态度。\n\n四、三言辩证关系\n\n通观《庄子》全篇，“三言”并不是相对独立的。从形式上来说，寓言是借人、借物、借事所说的话，重言是借者艾所说的话，卮言则是随意挥洒之言；从其功能来看，寓言是载道之言，重言是弘道之言，卮言是和道之言，三者分别体现了庄子释道的三个层次；从其关系上看，重言包含在寓言之中，卮言与寓言、重言相互渗透，浑融一体。\n\n不难总结，“寓言”是文章的基本形式，“卮言”是庄子思想的具体内容，“重言”则是借以申明其学说的先贤佐证。庄子以“三言”经营其文章，使其水乳交融，共同在中国古代文化中发挥着自己独特的作用，成为中华民族独特品格的重要支撑之一。","keywords":"“卮言”“重言”“寓言”","note":"以上两道题目配合起来应该能很好地帮助大家理解《庄子》三言，其中，寓言是最重要的。"},{"id":"30","stars":"★★","title":"简述《荀子》散文的写作特点","body":"荀子认为“君子必辩”，特别强调论辩的重要性。因此，与先秦其他诸子一样，荀子的说理文擅长论辩。但荀文以其说理的清晰，论辩的透辟，逻辑的周密，在先秦诸子说理文中别具一格。\n\n一、行文缜密，论证严谨周详\n\n《荀子》思想的深邃丰富，理论的系统严整，使其不仅单篇行文缜密，而且全书各章相互照应，论证严谨周详。\n\n《性恶》篇开首即云：“人之性恶，其善者伪也。”提出了“性”和“伪”两个概念。人的天性在耳目之欲，声色之好，因而出现争夺、残贼、淫乱等现象，要改变这种现实，必须用礼义进行教化，使人从善，并明确界定“性”是“天之就也”，即先天自然本性。“伪”即人为，“可学而能可事而成之在人者”，即后天通过礼义的学习而形成的道德观念。区分了“性”和“伪”之后，再进一步论证“人之性恶明矣，其善者伪矣”，提出“圣人化性而起伪”“故圣人之所以同于众，其不异于众者，性也。所以异而过众者，伪也”“故圣人者，人之所积而致矣”。性恶论是荀子礼乐法术论的理论基础，故而不仅此篇论述周密，而且与荀子的整个理论系统相一致。由于性恶，故须教育，教育当以礼义为本；也由于性恶，故须施行赏罚，于是性恶论和隆礼重法的主张就相互贯通，相辅相成。\n\n二、《荀子》在文辞上，也相互呼应\n\n如《礼论》云：“性者，本始材朴也，伪者，文理隆盛也。”认为性是一种原始材料，和《性恶》篇中认为性是一种天然之情一致，而像《劝学》篇中“积善成德，而神明自得，圣心备焉”等观点，也和“圣人化性起伪”的观点息息相通。总之，荀子之文思理严整，论证全面。为说明观点，层层论述，反复推详，一篇中首尾一贯，一气呵成，整体理论系统严密，各篇之间颇有照应，故而绵密严谨，恢弘博大，风格浑厚。\n\n三、多为譬喻，深入浅出\n\n《荀子》大量运用许多日常生活中常见的事物为譬喻，深入浅出，生动巧妙地把抽象的道理具体化、形象化，使深奥的理论浅显易懂。如《劝学》篇，几乎都是引类譬喻重叠构成，并且譬喻的运用变化多端，或正反为喻，或并列为喻，辞采缤纷。《荀子》还喜欢用大量排比句法，或以韵语描写、抒情，增强了气势，调协了音节，更富于说服力和感染力。\n\n【李凡关键词：擅长论辩 行文缜密 相互照应 多为譬喻】","keywords":"","note":"①文学史上的荀子相对考察较少，其“性恶论”非常有名，也有出名词解释的可能。②和先秦其他说理文一样，《荀子》也长于论辩，但《荀子》的论辩还讲究多篇文章主题和文辞上的相互呼应，从而让论证严谨周详。除此之外，《荀子》在譬喻和句法上的特色，我们也应该注意到，要做到不遗漏任何一个知识点。"},{"id":"31","stars":"★★","title":"举例说明《韩非子》寓言的特点","body":"作为法家思想的集大成者，《韩非子》以其冷峻的思辨理性与独特的文体建构，在先秦诸子散文中独树一帜。其对寓言的使用，是对《庄子》《孟子》等的进一步发展，主要有以下特点：\n\n一、《韩非子》寓言文风峻峭犀利，锋芒毕露，咄咄逼人，所向披靡\n\n如《说难》论述对人君谏说之难，顺之以招祸，逆之而致祸，稍不留神便命丧身亡，列举谏说的种种困难，提出针对不同情况采取种种不同的进言方法，对社会和人君心理进行条分缕析，鞭辟入里，缜密透彻，犀利刻削，入木三分。韩文中的长篇大论，如《显学》《五蠹》《孤愤》等都写得波澜壮阔，发挥得淋漓尽致。而短篇往往则就一个问题深入论述，辞旨简洁爽利。如《难一》《难二》《难三》《难四》中的28个短篇，借评论史实批驳不同意见，阐述自己的政治主张，驳论辩难，仍是其冷峻文风的体现。《韩非子》以论辩的透彻，逻辑的严密，成为先秦说理散文论辩艺术的集大成者。\n\n二、自《韩非子》始有意于寓言故事集\n\n《韩非子》说理散文，最具文学意味的还是数量居先秦散文之首的寓言故事。寓言在《战国策》《孟子》中还只是偶一用之，在《庄子》中虽连篇累牍，但都为阐明一个中心思想，寓言仍只是议论说理文的一部分，而非独立的文学体裁。韩非开始有意识地系统收集、整理、创作寓言，分门别类，辑为各种形式的寓言故事集。像《内储说》《外储说》《说林》《喻老》《十过》，都是寓言专集。《韩非子》的寓言故事主要取材于历史事迹和现实，很少有拟人化的动物故事和神话幻想故事，没有超越现实的虚幻境界和人物。和《庄子》中奇幻玄虚、怪诞神奇的寓言故事，风格截然不同。\n\n三、韩非寓言形象化地体现了他的法家思想和他对社会人生的深刻认识\n\n他也像庄子一样，取材于历史，让历史人物说话，改变历史人物的本来面目，使之反映自己的思想观点。比如孔子，在《庄子》和《韩非子》中都一反其儒者面目。《庄子·人间世》和《大宗师》中论心斋和坐忘的孔子，是一个醉心于道学的形象；《韩非子·内储说上》主张释赏行罚的孔子，则是冷峻的法家形象。而取材于现实社会和民间故事的寓言，更是韩非对社会现象深入仔细观察后提炼出的，如“郑人买履”“郢书燕说”等具有的讽刺力量，“矛与盾”等表现出的哲学智慧，都是韩非寓言思想深度的反映。\n\n题材的平实，使韩非寓言不像庄子寓言那样恢诡谲怪，但韩非寓言在艺术上并不平淡，而是构思精巧，描写大胆，语言幽默，于平实中见奇妙，具有耐人寻味、警策世人的艺术效果。《韩非子》中的许多寓言，千百年流传不衰。“守株待兔”“矛与盾”“滥竽充数”，以及“郑人买履”“画鬼最易”“买椟还珠”等等，都以其丰富的内涵，生动的故事，成为脍炙人口的成语典故，至今为人们广泛运用。","keywords":"峻峭犀利 寓言故事集 反映自己的思想观点 警策世人","note":"《韩非子》文风峻峭犀利，是先秦说理散文论辩艺术的集大成者。但最引人注目的，还是《韩非子》中的那些寓言故事。大家在记忆时，可以将韩非的寓言特色与庄子的寓言特色进行比较，在比较中加深印象。"},{"id":"32","stars":"★★★★","title":"试分析先秦说理散文的地位与影响","body":"先秦说理散文是我国古代文化的渊海，它奠定了我国散文的基础，从思想内容、艺术风格、写作体裁、表现技巧，直至语言的运用等各方面深刻地影响着后世散文的发展，并孕育着其他如小说、寓言、戏剧、赋等各种文学体裁的产生和发展，从这个意义上，确实是“后世之文，其体皆备于战国”。先秦说理散文的地位与影响，主要表现在以下方面：\n\n一、确立了说理文的体制和形象化的说理方式\n\n先秦说理散文是我国散文创作的典范，它以成熟的说理文体制，形象化的说理方式，丰富多彩的创作风格和语言艺术，影响了后世的文学创作。\n\n（一）确立了说理文的体制\n\n早期的语录体和对话体，虽不是我国说理文体制的主流，但后代不乏类似之作。从扬雄模拟《论语》而作的《法言》，到后代的佛教语录和理学家语录，都与《论语》一脉相承，而以问答的形式进行论辩，在后代说理议论文中也不乏其例。成\n\n熟于战国后期的专论体说理文，更是我国说理文的主要模式，不仅在体制上，而且在说理方法上，都对后代说理文有深远影响。\n\n（二）确立了形象化的说理方式\n\n先秦说理文主要是哲理散文和政论散文，但无论是表述对自然和人生的理性认识，还是阐发政治主张和学术观点，都不仅依靠逻辑推理和抽象思辨来完成，还灌注了浓烈的情感，运用了生动的感性形象。先秦说理散文中，寄寓深刻的寓言、譬喻，常有抒情因素。这种形象性和抒情性，使先秦说理散文自身具有了文学意味，对后代散文的发展，具有积极的意义。不仅后代哲理政论文受其影响，颇有文学因素，而且，后代以描写抒情为主的文学散文也由此而孕生。\n\n二、影响后世的创作风格\n\n先秦说理散文大都分析透彻，议论纵横，但由于这些著作者的思想、政治、学术流派不同，个性又各相异，明显地表现出各自不同的风格特点。如《论语》的雍容和顺、迁徐含蓄，《孟子》的灵活善比，气势充沛；《庄子》的想象丰富、奇气袭人；《荀子》的层次清晰，论断缜密；《韩非子》的锋利峭刻、论理透辟，直接影响了后世作家的创作风格。在后代许多文学巨匠的作品中，都可以看到不同风格的先秦说理文的影子。如《孟子》之文深得唐宋古文家的推崇，他们的创作，亦深受孟子文的影响。魏晋南北朝时期游仙诗、玄言诗、山水田园诗都和庄子思想及庄子散文艺术有渊源关系。\n\n三、提供了丰富的文学语言范式\n\n孔、孟、庄、荀、韩非等先秦诸子都是语言大师，先秦说理散文在语言艺术上的高度成功，丰富了汉语的表现力，为我国文学语言的发展奠定了基础。举凡后世常用的语言修辞手法，如比喻、夸张、排比、对偶等，在先秦说理文中，都已有成熟表现，直接影响了后世的语言修辞。后世文学中或平实质朴，或华丽雕琢，或婉约隽永，或放纵恣肆的语言风格，在先秦说理文中都已可见端倪。而先秦说理散文，还为后代文学创作提供了大量的词汇和丰富的成语，其中有不少至今仍活在现代语言之中。\n\n四、促进了古代小说的形成与发展\n\n先秦说理散文中大量的寓言，本是为说理而存在，但由于其自身深厚的意蕴和生动形象的艺术特征，所以能够脱离说理文字而独立，由一种艺术表现手法，成为一种文学样式。其中的优秀之作，对我国古代小说的形成，具有不可忽视的作用。同时，先秦说理散文中，以对话的方式描写人物，也为后世小说提供了可资借鉴的艺术经验。","keywords":"说理文的体制说理文的体制 形象化的说理方式 影响后世的创作风格 丰富的文学语言范式 古代小说的形成与发展","note":"先秦诸子散文虽是哲理著作，但却包含着丰富的文学因素，对后世文学的影响是多方面的，这种影响不仅局限于散文，而且旁溢到小说等文体之中，并一直绵延到了当下。因此，许多学校会针对这一部分内容出题。相关内容可以参考范能船《先秦诸子散文文学成就略论》，具体资料可以在李凡文学正版群中领取。"},{"id":"33","stars":"★★★★","title":"请结合材料中的作品和具体作家，论述先秦诸子散文和唐宋古文的关系（25西北大学）","body":"中国文学至周末而臻极盛，《庄》《列》之深远，苏、张之纵横，《韩非》之排奡，《苟》《吕》之平易，皆为后世文章之祖。\n\n-刘师培《论文杂记》\n\n先秦诸子散文是中国古代散文的源头，为后世文学奠定了坚实的基础。唐宋古文则是中国古代散文发展的高峰，二者之间存在着密切的渊源关系，具体体现在以下几个方面：\n\n一、先秦诸子散文影响了唐宋古文的风格\n\n先秦说理散文大都分析透彻，议论纵横，但由于这些著作者的思想、政治、学术流派不同，个性又各相异，明显地表现出各自不同的风格特点。而这些风格特点，都对唐宋古文产生了重要的影响。比如《荀子》论辩透辟，逻辑周密，《韩非子》文风峻峭犀利，锋芒毕露，咄咄逼人，所向披靡，王安石散文文气充沛、语气斩绝的风格特点，明显就受到了它们的影响。又比如说苏轼吸收了《庄子》想象丰富、奇气袭人的特点，故能于纡余委备、圆活流转之中，带有一种创新出奇的锐气和错综变化的美感。\n\n二、先秦诸子散文影响了唐宋古文的说理方式\n\n先秦诸子散文主要是哲理散文和政论散文，但无论是表述对自然和人生的理性认识，还是阐发政治主张和学术观点，都不仅依靠逻辑推理和抽象思辨来完成，还灌注了浓烈的情感，运用了生动的感性形象。先秦说理散文中，寄寓深刻的寓言、譬喻，常有抒情因素。这种形象性和抒情性，使先秦说理散文自身具有了文学意味。《庄子》的语言就具有浓郁的抒情意味。如《庄子·则阳》中的“旧国旧都，望之畅然，虽使丘陵草木之缗，人之者十九，犹之畅然”，表达了思乡怀旧的情感，语言平淡而情思邈远。这种形象性和抒情性，在唐宋古文中都有体现，比如韩愈的《原毁》《争臣论》《论佛骨表》都将其自身的不平之情融入其中，而柳宗元的山水游记则将悲情沉潜于作品之中，形成“凄神寒骨”之美的特色。欧阳修的散文也有很强的感情色彩，他的政论文慷慨陈词，感情激越；史论文则低回往复，感慨淋漓；其他散文更加注重抒情，哀乐由衷，情文并至。\n\n三、先秦说理散文为唐宋散文提供了丰富的语言范式\n\n孔、孟、庄、荀、韩非等先秦诸子都是语言大师，先秦说理散文在语言艺术上的高度成功，丰富了汉语的表现力，为我国文学语言的发展奠定了基础。举凡后世常用的语言修辞手法，如比喻、夸张、排比、对偶等，在先秦说理文中，都已有成熟表现，直接影响了后世的语言修辞。像是《庄子》《韩非子》喜欢运用寓言来说理，就影响到了柳宗元《三戒》等寓言的创作。\n\n总体来看，唐宋古文既是对先秦诸子散文的继承，又是对其的创新与发展。这种传承关系体现了中国文学发展的连续性与多样性，也展现了中国文化的深厚底蕴与独特魅力。","keywords":"风格 说理方式 哲理散文 政论散文 浓烈的情感 生动的感性形象 形象性 抒情性 语言范式 语言修辞手法】【李凡说：这道题理解起来其实是非常简单的，就是让我们去讨论先秦诸子散文对唐宋古文的影响，但按照要求答题却有一些困难，因为题目要求我们去结合材料给出的作家作品，所以我们需要对材料中体现的作家作品有一定的了解，并将其与唐宋古文的某些特点给联系起来，这就非常考验大家的记忆力和对相关知识的应用能力了。","note":""},{"id":"34","stars":"★","title":"楚辞产生的背景","body":"周公制礼作乐、变革中原文化时，由于地处偏远，楚国受到的影响比中原诸侯国小，所以一直被中原诸国以蛮夷视之。但是，楚贵族集团毕竟源于中原，在春秋战国时期，中原和楚国有着广泛的文化交流，所以，楚国文化和中原文化仍有很多相同之处。\n\n一、在政治思想方面，楚国和中原有很大的一致性\n\n楚国虽然偏居南方，却拥有“周之典籍”甚至“周大史”，再加楚国士人自觉学习中原文化，所以中原文化在楚国具有相当高的地位。如《国语·楚语上》记载，申叔时建议士亹用《诗》《书》《礼》《易》《乐》《春秋》等教育太子，楚国的王公卿士在议事时也经常征引《诗》《书》中的话，这和当时中原的文化风气是一样的。和中原的文化交流在很大程度上影响了楚国贵族的政治理想、历史观念和价值取向。如晋楚邲之战时，楚庄王就认为用兵的目的不在于炫耀武功，而在于“禁暴”“安民”，和中原儒家思想如出一辙。\n\n二、在习俗和审美趣味上，楚国则明显地表现出不同于中原文化的特点\n\n后人概括楚国的文化为“信巫鬼，重淫祀”（《汉书·地理志下》），是有一定道理的。这种崇尚巫风的习气，既是夏、商文化的遗习，更是当地土著民族的风气。巫风的蔓延，自朝廷到民间，无处不在。如楚灵王，史称其“简贤务鬼，信巫祝之道”，当吴人来攻，国人告急之时，犹“鼓舞自若”，不肯发兵。（《新论·言体论》）楚怀王亦是“隆祭祀，事鬼神”（《汉书·郊祀志下》），把破秦的希望寄托在鬼神身上，最终为秦所败。贵族阶层崇信巫祭，现在出土的材料多有证明。而在南方\n\n土著聚居的“南郢之邑、湘之间”，更是巫风浓烈，“其俗信鬼而好祠，其祠，必作歌乐鼓舞以乐诸神”（王逸《楚辞章句·九歌序》）。巫文化对楚国审美风气的影响是明显的。楚地的艺术很兴盛，而这些艺术很多与祭神有关，充满了奇异的浪漫色彩。如王逸所记载的庙堂壁画，楚“凤夔人物帛画”，刻画在器物、帛画上的楚舞造型，以及出土的编钟等，都富有飘逸、艳丽、深邃等美学特点。\n\n在这种独特的楚国文化影响下，诞生了“楚辞”。“楚辞”是指以具有楚国地方特色的乐调、语言、名物而创作的诗赋，在形式上与北方诗歌有较明显的区别。进一步说，楚辞的直接渊源应是以《九歌》为代表的楚地民歌。《九歌》原为祭祀时之巫歌，后经屈原加工而保留下来，而《离骚》等其他作品则是在这基础上发展而来的。因此，南方祭歌那神奇迷离的浪漫精神，也深深地影响甚至决定了楚辞的表现方法及风格特征。这是“楚辞”这一名称所包含的又一层意蕴。","keywords":"政治思想 一致性 习俗和审美趣味 不同于中原文化 神奇迷离的浪漫精神","note":"楚辞是中原文化和楚地文化交融的产物。楚辞的内容主题，受到了中原文化的影响，而它的形式、表现方法和风格，却深深浸润着楚地民歌的特色。而这，也和楚国文化一方面与中原文化有一致性，另一方面又受到楚地习俗和审美趣味的影响有关。"},{"id":"35","stars":"★★★","title":"试分析《离骚》的思想内涵","body":"《离骚》反映了屈原对楚国黑暗腐朽政治的愤慨，和他热爱宗国愿为之效力而不可得的悲痛心情，也抒发了自己遭到不公平待遇的哀怨。全诗缠绵悱恻，感情十分强烈，他的苦闷、哀伤不可扼止地反复迸发，从而形成了诗歌形式上回旋复沓的特点。这种回旋复沓，乍看起来好像无章次文理可寻，其实是他思想感情发展规律的反映。具体来说，《离骚》的思想内涵主要包括以下内容：\n\n一、爱国和忠君\n\n《离骚》大致可分为前后两个部分。前一部分从开头到“岂余心之可惩”，主要写屈原在理想与现实之间的尖锐冲突中的不懈坚持，显示了高尚的情操。后一部分极其幻漫诡奇，用一系列象征性的行为，显示了屈原在苦闷彷徨中何去何从的艰难选择，突出了屈原对宗国的挚爱之情。\n\n在《离骚》前一部分中，有不少“系心怀王”的诗句，诗中用了一些婚姻爱情的比喻，以这种男女之间感情的不谐比喻君臣的疏远。根据中国传统的伦理习惯，弃妇的哀怨是以对夫君的忠贞为前提的，所以，这些诗句可以解释为屈原的忠君。国君在一定程度上是国家的象征，而且只有通过国君才能实现自己的兴国理想。所以，屈原的忠君是他爱国思想的一部分。\n\n屈原的爱国之情，是和宗族感情连在一起的。如他对祖先的深情追认，就是一种宗族感情的流露。屈原的爱国感情更表现在对楚国现实的关切之上，从希望楚国富强出发，屈原反复劝诫楚王向先代的圣贤学习，吸取历代君王荒淫误国的教训，不要只图眼前的享乐，而不顾严重的后果。对宗国命运的担忧，发而为一种严正的批判精神，这是《离骚》中非常值得珍视的地方。\n\n二、“美政”理想不可达成的悲愤\n\n在《离骚》中，屈原感慨道：“既莫足与为美政兮，吾将从彭咸之所居。”表示将用生命来殉自己的“美政”理想。他的“美政”理想在一首抒情诗中当然不能全部表明，但我们从《离骚》中仍能约略知道一些主要内容。这就是明君贤臣共兴楚国。\n\n首先，国君应该具有高尚的品德，才能享有国家。其次，应该选贤任能，罢黜奸佞。另外，屈原重视制度法令，修明法度也是其“美政”的内容之一。\n\n总之，相对于楚国的现实而言，屈原的“美政”理想更加进步，并符合历史的发展趋向。\n\n当然，屈原念念不忘君臣的“两美必合”、和谐共济，还与他自己的身世之感有关。《史记·屈原贾生列传》说：“屈平正道直行，竭忠尽智以事其君，谗人间之，可谓穷矣。信而见疑，忠而被谤，能无怨乎？”楚王的不信任和佞臣的离间，导致君臣乖违，事功不成，这是屈原悲惨人生的症结所在。所以，他在诗中反复地咏叹明君贤臣，实际上也是对楚国现实政治的尖锐批判，更是对自己不幸身世的深切哀叹，其中饱含着悲愤之情。\n\n三、放言无惮的批判精神\n\n战国时期，百家争鸣，诸子放言无惮。屈原也经受了这一时代精神的洗礼，《离骚》畅抒胸臆，“为前人所不敢言”。屈原曾投身于楚国政治斗争的漩涡，对楚国的时弊有非同一般的切身感受。尤其当他遭谗被疏之后，痛定思痛，更加清醒地认识到楚国积重难返的弊政和面临灭亡的危机。他在《离骚》中揭露世俗的混浊，责数楚王的昏惑，痛斥群小的谗邪，无不闪耀着批判精神的光芒。\n\n四、“独立不迁”的峻洁人格\n\n屈原志洁行廉，正道直行，既怀内美，又重修能。他在长期参政实践中屡经风波，养成了忠于理想、坚贞不屈、洁身自好的品格情操。在《离骚》中抒写了对真、善美的执著追求和对假、恶、丑的无情挞伐，表达了九死不悔的坚定意志和不与奸佞谗邪同流合污的坚强决心：“余固知謇膏之为患兮，忍而不能舍也。”“亦余心之所善兮，虽九死其犹未悔！”“路曼曼其修远兮，吾将上下而求索。”","keywords":"爱国和忠君 忠君是爱国思想的一部分 宗族感情“美政”理想 身世之感 悲愤之情 批判精神 峻洁人格","note":"《离骚》的思想主旨是爱国和忠君，在当时的社会条件下，忠君本质上是他爱国思想的一部分，大家在分析这些内容时注意不要超脱时代；同时，屈原在《离骚》中也阐述了自己的“美政”理想，其中蕴含着对楚国现实政治的讽刺和自己的身世之感，充满着悲愤之情。大家可以结合具体诗句，细细体会。"},{"id":"36","stars":"★★★★","title":"试分析《离骚》的抒情主人公形象（26厦门大学）","body":"《离骚》通过诗中“吾”“余”的尽情倾吐，塑造了一位充满神性色彩又与作者精神气质息息相通的抒情主人公的自我形象。一方面，这确是个不凡的生命，自称神灵后裔，又在特殊时日降临，高冠长佩，披花带草，乘龙御凤，升天入地，上扣帝阍，下求佚女，可以向古人陈辞，能指使巫咸降神。这一切，均使主人公具有明显的神性色彩。另一方面，透过这种神灵外衣，直视人物的遭际和内心，从这位抒情主人公的性格中，人们见到的是屈原的精神。具体来说，这一形象主要具备如下特点：\n\n一、这是一个执着地追求真善美的理想，百折不挠并不惜为之献身的形象\n\n《离骚》的主人公立志“为美政”，他与灵脩成约在先，并奔走先后，“岂余身之惮殃兮，恐皇舆之败绩”；当灵脩“悔遁”时，他“伤灵脩之数化”；“朝谇夕替”使他痛苦怨愤但最终不能放弃理想：“民生各有所乐兮，余独好脩以为常；虽体解吾犹未变兮，岂余心之可惩？”“亦余心之所善兮，虽九死其犹未悔。”\n\n二、这又是一个在同一切虚伪丑恶决不妥协前提下追求自身至纯至洁人格的形象\n\n《离骚》的主人公一生都在努力追求、充分肯定并不惜一切代价地保持自身人格的精纯完善，坚持为人要忠于理想、方正端直、表里如一、尊重自身的选择而不随波逐流等。而他这种人格修养，不是避世隐遁洁身自好，而是公开把自己置于与群党众小对立冲突的格局中：“警吾法夫前脩兮，非世俗之所服。”“鸷鸟之不群兮，自前世而固然。何方圜之能周兮，夫孰异道而相安？”明知风摧秀木偏要与众不同：“薋菉葹以盈室兮，判独离而不服。”不但自身处污不染保持芳洁，而且愤世嫉俗，容不得他人的虚伪和污浊，不思后果地抨击邪恶：“芳与泽其杂糅兮，唯昭质其犹未亏。”“芳菲菲而难亏兮，芬至今犹未沫。”“众皆竞进以贪婪兮，凭不厌乎求索。”这也使他难为众容，屡遭打击：“余虽好脩姱以鞿羁兮，謇朝谇而夕替。”\n\n三、这还是一个清高傲世又感情丰富、始终摆脱不开孤独矛盾的痛苦形象\n\n《离骚》的主人公超凡脱俗，尘世中难遇知己；其内心又并不冷漠，反而特别渴求相知，并为此上下寻觅，然上天帝阍不开，下地求女不成，这使他备受孤独煎熬。同时，“何所独无芳草”与“怀乎故宇”两种声音也使他轮番受着“去”“留”荡击，终使他在“远逝自疏”的遐想中又回到苦难“旧乡”：“陟升皇之赫戏兮，忽临睨夫旧乡。仆夫悲余马怀兮，蜷局顾而不行。”\n\n总之，诗人通过这位富于神性色彩的抒情主人公的倾吐，坦露的是自己不屈的追求、倔强的个性和苦闷的情怀。","keywords":"充满神性色彩 与作者精神气质息息相通 执着地追求真善美的理想 追求自身至纯至洁 清高傲世又感情丰富","note":""},{"id":"37","stars":"★★★★★","title":"谈谈你对《离骚》“香草美人”手法的认识","body":"作为中国浪漫主义文学的源头，《离骚》以其独创的象征体系与深邃的情感表达，奠定了楚辞在文学史上的典范地位，这集中体现在其“香草美人”手法之上，对此，我们可以从如下角度进行分析：\n\n一、依《诗》取兴，引类警喻\n\n《离骚》的魅力在于多用隐喻和象征，全诗充满形象描绘，使现实人生和内心世界得以艺术展现。\n\n西汉学者王逸在《楚辞章句》中评论《离骚》：“《离骚》之文，依《诗》取兴，引类譬喻，故善鸟、香草，以配忠贞；......灵修美人，以譬于君。”王逸认为《离骚》中采用了《诗经》中的比、兴手法，并用香草意象来比喻忠贞。\n\n（一）美人的意象一般被解释为比喻，或是比喻君王，或是自喻。前者如“惟草木之零落兮，恐美人之迟暮”，后者如“众女嫉余之蛾眉兮，谣诼谓余以善淫”。可以说，屈原在很大程度上，是通过自拟弃妇而抒情的，所以全诗在情感上哀婉缠绵，如泣如诉。以夫妇喻君臣，不仅形象生动，深契当时的情境，而且也符合中国传统的思维习惯，早在西周春秋时代发展起来的阴阳五行观念里，就把君和夫、臣和妇放在同样的位置，这一观念可能影响了屈原的创作。\n\n（二）《离骚》中充满了种类繁多的香草，这些香草作为装饰，支持并丰富了美人意象。同时，香草意象作为一种独立的象征物，它一方面指品德和人格的高洁，另一方面和恶草相对，象征着政治斗争的双方。总之，《离骚》中的香草美人意象构成了一个复杂而巧妙的象征比喻系统，使得诗歌蕴藉而且生动。\n\n二、完整庞大的象征系统\n\n《诗经》中“香草美人”在塑造美女形象及传达男女感情中发挥着重要作用。但《诗经》中的香草美人不过是简单的比喻或者起兴，多用本义，托喻的成分很少，只能用于抒发一些与当事人的某些生活片段相关联的情感，无法反映包罗万象的社会生活。\n\n《诗经》中的比兴意象大多比较碎片化，并没有形成一个完整的体系，却为屈原提升和丰富浪漫主义的内涵和表现力提供了坚实的基础。\n\n就整体构思而言，《离骚》中抒情主人公上下于天求索寻觅的整个过程即极像是诗人现实经历和心路历程的一个写照。主人公初与灵脩成言有约，后因灵脩“悔遁”而无果，会不会是诗人政治活动的艺术再现？女要之劝与陈辞大舜，或许是诗人在挫折面前进退之思、信念审视的曲折表达？飞升天庭与阊阖不开，很容易使人联想到小人障蔽、难与君通；三次求女，终归失败，岂不是少有知己、十分孤独的心境写照？两次占卜，两种结果，分明是内心去留的矛盾挣扎；远逝自疏，终未离开，更应是诗人情感逻辑注定的结局。完整庞大的象征系统使《离骚》跌宕起伏，虽长篇巨制却不繁琐重复，虽重在人物的独白和倾吐，却又十分富于情节的韵味。\n\n三、忠君爱国与忧伤怨愤\n\n《离骚》以香草比喻高洁的品质，以追求美人比喻自己与君王的关系。用浪漫主义表现手法，运用神话传说，展开想象的翅膀，从多角度抒发自己满腔爱国激情和忧伤怨愤之情，从而展示自己追求“美政”，并为之不畏艰难、不惜生命而上下求索的赤胆忠心，读之撼人心魄，催人泪下。（李凡说：此处可借鉴上题的“《离骚》主题及抒情主人公”）\n\n四、香草美人背后的楚地渊源\n\n“香草美人”作为诗歌象征手法，是屈原的创造，但它们又是与楚国地方文化紧密相关的。《九歌》是巫术祭歌，是楚地“信巫术，重淫祀”（《汉书·地理志》）的文化习俗的反映。《九歌》的基本情节是“人神恋爱”，往往以人神恋爱的成功来象征祭祀的成功，而人神交接的艰难，又使《九歌》充满了悲剧色彩；香草作为献祭或巫神取悦对方的饰物，在表层意义上是一种追求爱情的象征，而它的内核又暗示着宗教的诸种情境；《九歌》既然描述的是人神之间的事，其中自然就假想了许多驾龙骖螭的飞升情节。屈原显然是熟悉楚地民间祭祀文化的，民间文化中这些成熟的文学意象必然会对他的创作产生影响。《离骚》中最耐人寻味的“求女”，与《九歌》中人神恋爱的情节颇有类似之处。至于香草和飞升的细节，与《九歌》也很相似。这些较为原始的楚地民间文化中的文学意象不但被屈原借以描述现实，同时也帮助屈原进入古代神话或原始宗教的情境之中，通过对来自历史和人类心灵深处的自由和激情的体验，达到对现实的超越。\n\n五、浪漫主义抒情传统\n\n香草美人在中国古典文学史上留下了浓墨重彩的一笔，并对后世的文学产生了深远的影响。\n\n汉代的诗歌直接继承了“香草美人”寄情言志、表达爱憎的传统。如汉乐府民歌《江南》中的“江南可采莲”，诗人以莲花引发欢愉、自在的情感。\n\n东汉末年的五言诗《涉江采芙蓉》，诗人用芙蓉和兰花象征爱情的神圣和自身品格的高洁，营造出一种高雅纯洁而又意犹未尽的抒情氛围。\n\n魏晋时期，曹植的诗歌将“香草美人”意象运用得更加灵活多变，其《洛神赋》一篇，名垂千古。\n\n大唐杜甫《佳人》中的“绝代有佳人，幽居在空谷。自云良家子，零落依草木”，塑造了一个高风亮节的女性形象，同时用“比兴”的手法赞美了她高洁的品格。\n\n苏轼以一句“天涯何处无芳草”惊艳了时光，词中的“芳草”即“佳人”，象征一切美好的事物。这首词不是简单的伤春悲秋之作，而是苏轼在对春天的景象和人物描述的过程中，流露出的意欲奋发有为，却难料世事无常的悲伤。\n\n香草美人意象以其浪漫主义的唯美主题，浇筑了历代文人雅士在漫漫岁月与悠悠人生旅途上的诗意家园，哺育了多少莘莘学子在书山学海中探索求知的诗意空间。\n\n【李凡关键词：引类譬喻 象征系统 情感 楚地渊源 抒情传统】","keywords":"","note":"《离骚》的“香草美人”象征手法是《离骚》相关内容考查的一个重点，在回答时，我们首先要明确“香草”“美人”的比喻和象征意义，然后再整体论述《离骚》中象征手法的运用，最后可以适当引申一下。“香草美人”这一手法也是名词解释中经常出现的内容，大家要注意一下。"},{"id":"38","stars":"★★★★★","title":"《离骚》的艺术特色","body":"作为中国首部自觉创作的抒情长诗，《离骚》以政治情怀与艺术独创的双重突破，在中国文学史上占有重要的地位，其艺术特色，主要表现在以下方面：\n\n一、《离骚》具有突出的浪漫主义风格\n\n《离骚》是楚文化的产物，楚文化中既有神奇的神话和宗教信仰，又有美丽独特的地方风物，感情热烈奔放，想象奇幻优美。这些文化特征赋予《离骚》以极其绚丽夺目的光彩。屈原在《离骚》中奇特的装束，还有那一次次天神簇拥中的飞升和求女，场面都极为壮观，超乎人们的想象，激动人心。《离骚》还吸收了大量的楚地方言。黄伯思《翼骚序》云：“屈宋诸骚皆书楚语，作楚声。”所谓楚语楚声，即指“些”“只”“羌”“谇”“謇”这些方言词语，楚声则指“顿挫悲壮，或韵或否”的韵调。这些方言楚声不但具有浓郁的地方色彩，还增强了诗歌的浪漫性特征。\n\n二、《离骚》通过诗中“吾”“余”的尽情倾吐，塑造了一位充满神性色彩又与作者精神气质息息相通的抒情主人公的自我形象。一方面，这确是个不凡的生命，自称神灵后裔，又在特殊时日降临，高冠长佩，披花带草，乘龙御凤，升天入地，上扣帝阍，下求佚女，可以向古人陈辞，能指使巫咸降神。这一切，均使主人公具有明显的神性色彩。另一方面，透过这种神灵外衣，直视人物的遭际和内心，从这位抒情主人公的性格中，人们见到的是屈原的精神。\n\n这是一个执着地追求真善美的理想，百折不挠并不惜为之献身的形象。这又是一个在同一切虚伪丑恶决不妥协前提下追求自身至纯至洁人格的形象。这还是一个清高傲世又感情丰富、始终摆脱不开孤独矛盾的痛苦形象。诗人通过这位富于神性色彩的抒情主人公的倾吐，坦露的是自己不屈的追求、倔强的个性和苦闷的情怀。\n\n三、《离骚》多用隐喻和象征，全诗充满形象描绘，使现实人生和内心世界得以艺术展现\n\n《离骚》最引人注目的是它的两类意象：美人、香草。美人的意象一般被解释为比喻，或是比喻君王，或是自喻。以夫妇喻君臣不仅形象生动，深契当时的情境，而且也符合中国传统的思维习惯。香草意象作为一种独立的象征物，它一方面指品德和人格的高洁，另一方面和恶草相对，象征着政治斗争的双方。总之，《离骚》中的香草美人意象构成了一个复杂而巧妙的象征比喻系统，使得诗歌蕴藉而且生动。\n\n《离骚》更具特色的抒情手法是象征。就整体构思而言，《离骚》中抒情主人公上下于天求索寻觅的整个过程即极像是诗人现实经历和心路历程的一个写照。完整庞大的象征系统使《离骚》跌宕起伏，虽长篇巨制却不繁琐重复，虽重在人物的独白和倾吐，却又十分富于情节的韵味。\n\n四、句法参差、韵散结合的新形式\n\n相对于《诗经》，屈原的作品在形式上也有新的特点。《诗经》的形式是整齐划一而典重的，而屈原的作品则是一种新鲜、生动、自由、长短不一的“骚体”。这种形式是建立在对民间文学学习的基础之上的。屈原以前，楚地流行的民歌句式参差不齐，并且采用“兮”字放在句中或句尾，如《越人歌》（《说苑·善说》），而与《离骚》有直接关系的则有《九歌》。显然，《离骚》学习借鉴了楚歌的形式特点。不仅如此，《离骚》还吸收了大量的楚地方言。黄伯思《翼骚序》云：“屈宋诸骚皆书楚语，作楚声。”并且还举“羌、谇、膏、纷、侘、傺”作楚语的例子，举“顿挫悲壮，或韵或否”作楚声的例子。《离骚》中的楚地方言还有很多，屈原采用这些楚地方言，增强了诗歌的形象性和生动性，同时，对“兮”等语助词的多种方式的使用，促成了句式的变化，这些句式和委婉轻灵的楚声相结合，很适合于各种不同情绪和语气的表达。楚语还使《离骚》带有浓郁的地方色彩，增加了生活气息。","keywords":"突出的浪漫主义风格 抒情主人公 隐喻和象征 新鲜、生动、自由、长短不一的“骚体”","note":"这道题目可以看作是前面题目的综合版，考查的是大家对《离骚》相关内容的整体掌握。在文学史上，往往是“《风》《骚》井举”，同样，在文学史考查中，《离骚》和《诗经》一样，是先秦文学史上十分重要的一部分内容，因此对于其艺术特色，我们一定要重点关注。"},{"id":"39","stars":"★★","title":"《九歌》的内容及艺术特色","body":"《九歌》也是楚辞中重要的作品，其幽微绵缈的情致和优美的诗歌形式深受后人的喜爱。《九歌》原是流传于江南楚地的民间祭歌，屈原加以改定而保留下来。从现存的《九歌》看来，它的民间文化色彩十分浓郁，而屈原的个人身世、思想痕迹倒并不重，《九歌》主要是南方巫祭文化的产物。《九歌》的内容和艺术特色，主要包括以下几点：\n\n一、从内容上说，《九歌》以描写爱情为主，但也表达了对神灵的赞颂和祭者的虔敬之情，还描述了阵亡将士的勇烈悲壮\n\n《东皇太一》就完全是一首颂赞之辞，写得庄严富丽，与爱情无涉，显示了主神和陪祭诸神的区别。《云中君》《东君》等，虽也有流连哀婉之辞，但较多的是对神迹的颂扬，诗中以无限敬仰之情描述了日神普照世界的壮丽气势，还写了它为人类祛除灾难的勇力，表达了祭者的美好愿望。《国殇》以一场异常惨烈的战争过程，描述了将士们奋勇杀敌，以及面对死亡所表现出的凛然气概。全诗节奏紧张，气氛浓烈，化凄凉为悲壮激越。其中的诗句不仅是对死者的颂扬，同时也是对生者的激励，尤其是在楚国不断兵败地削的情形下，对这种献身精神的歌颂实际是深沉的爱国情绪的自然流露。\n\n二、《九歌》中最多最动人的还是对人神情感的摹写\n\n《九歌》除《东皇太一》《国殇》《礼魂》外，其他各篇皆有对人神情感的摹写。如《少司命》中“悲莫悲兮生别离，乐莫乐兮新相知”，被王世贞推许为“千古情语之祖”（《艺苑卮言》卷二）。《湘君》和《湘夫人》描写的都是迎接湘水神的降临，以及巫与神双方复杂的情感状态。无论是巫还是神，他们都怀有十分真挚的爱情，但是别多聚少的经历又使他们变得很脆弱，所以，在希望和绝望的交织中，爱情表现得如此缠绵哀婉。从那些哀怨而又执著的倾诉之中，我们能深切地体会到人间爱情的种种哀愁和悲伤。\n\n《九歌》中所流露出的这种不可抑制的忧愁幽思，显然契合了屈原的心态，所以不妨把《九歌》中所抒发的贞洁自好、哀怨伤感之情绪，看作是屈原长期放逐生活之心情的自然流露。\n\n三、《九歌》具有明显的表演性\n\n首先《九歌》是歌、乐、舞三者合一的。从《九歌》中我们能看到不少对舞乐的描述，如《东皇太一》云：“扬枹兮拊鼓，疏缓节兮安歌，陈竽瑟兮浩倡。灵偃蹇兮姣服，芳菲菲兮满堂。”即是对当时歌、乐、舞同时表演的记录。其次，《九歌》中既有独唱，又有对唱和合唱，如《湘君》《湘夫人》，男女双方互表心迹，对唱的痕迹十分明显。无论是歌、乐、舞三者一体，还是巫与神分角色演唱，都具有一定的戏曲因素，是后世戏曲艺术的萌芽。\n\n四、《九歌》在描写人物心理方面十分细腻深入\n\n《九歌》除了那些一往情深的倾诉外，还叙写了一些细节，如《湘君》言：“君不行兮夷犹，蹇谁留兮中洲？”由爱之深，思之切，而生焦虑疑惑之心，对痴情心态的描述可谓入木三分。此外，诗人善于用景物来衬托人物的心理状态。《湘夫人》云：“帝子降兮北渚，目眇眇兮愁予。嫋嫋兮秋风，洞庭波兮木叶下。”这一凄清杳茫的秋景，构成了一个优美而惆怅的意境，成功地点染了抒情主人公的心境，被后人称为“千古言秋之祖”（明胡应麟《诗薮》内编卷一）。《山鬼》中众多的景物描写：林深杳冥，白日昏暗，淫雨连绵，猿啾狖鸣，风木悲号，那种压抑低沉的气氛，真切地表现了山鬼的孤独和绝望之情。\n\n五、《九歌》的语言自然清丽，优美而富有韵味\n\n《九歌》节奏舒缓深沉，不论是写情还是摹景，都能曲尽其态，有极强的表现力。在传达悲剧性的意境中，尤能低回婉转，韵致悠长。后人赞之曰：“激楚扬阿，声音凄楚，所以能动人而感神也。”（清陈本礼《屈辞精义·九歌》）","keywords":"描写爱情 对神灵的赞颂 祭者的虔敬之情 对人神情感的摹写 明显的表演性 描写人物心理 语言自然清丽","note":""},{"id":"40","stars":"★★★★","title":"屈原的地位与影响","body":"屈原对后世有着积极而深远的影响，司马迁《史记·屈原贾生列传》对屈原的人品、赋作了崇高的评价。同时，后世文人无不对屈原推崇备至，正如刘勰所说“其衣被词人，非一代也”（《文心雕龙·辨骚》）。李白诗云“屈平词赋悬日月，楚王\n\n台榭空山丘”（《江上吟》），杜甫诗云“窃攀屈宋宜方驾，恐与齐梁作后尘”（《戏为六绝句》之五），皆表达了对屈原的敬仰之情。而屈原及其辞赋的贡献，主要包括以下内容：\n\n一、屈原及其辞赋为中华民族精神注入了新的内容\n\n（一）屈原对后世影响最大的，首先是他那砥砺不懈、特立独行的节操，以及在逆境之中敢于坚持真理，敢于反抗黑暗统治的精神。屈原的遭遇是中国封建时代正直的文人士子普遍经历过的，因此，屈原的精神能够得到广泛的认同。如西汉贾谊因为才高受嫉，谪迁长沙，作《吊屈原赋》，以屈原自拟。司马迁一向以“立德、立功、立言”自励，“一心营职，以求亲媚于主上”（《报任安书》），却惨遭宫刑，司马迁从“屈原放逐，乃著《离骚》”（《史记·太史公自序》）的事迹中汲取了巨大的精神力量，完成了《史记》的撰述。可以说哪里有士子之不遇，哪里就有屈原的英魂，屈原精神成了安顿历代文人士子的痛苦心灵的家园。\n\n（二）陆游报国无门，身老家中，慨然叹曰：“《离骚》未尽灵均恨，志士千秋泪满裳。”（《哀郢二首》）“听儿诵《离骚》，可以散我愁。”（《沙市阻风》）此外，如清人屈大均诗云：“一叶《离骚》酒一杯，滩声空助故城哀。”（《吊雪庵和尚》）黄任诗云：“无端哀怨入秋多，读罢《离骚》唤奈何。......千古灵均有高弟，江潭能唱《大招》歌。”（《读＜楚辞＞作》）由此可见，屈原以其卓越的人格力量和深沉悲壮的情怀，鼓舞并感召了后世无数的仁人志士。\n\n屈原由于其忧愤深广的爱国情怀，尤其是他为了理想而顽强不屈地对现实进行批判的精神，早已突破了儒家明哲保身、温柔敦厚等处世原则，为中国文化增添了一股深沉而刚烈之气，培养了中国士人主动承担历史责任的勇气。这是屈原及其辞赋对民族精神的重大贡献。\n\n二、屈赋的艺术成就对后世也有着巨大的影响\n\n鲁迅《汉文学史纲要》说屈原的作品“逸响伟辞，卓绝一世”“其影响于后世之文章，乃甚或在三百篇以上”。与《诗经》相比，楚辞在艺术上达到了一个新的境界，哺育了一代又一代的作家，对中国文学史产生了极其深远而广泛的影响。\n\n首先，楚辞创造了一种新的诗歌样式，这种诗歌形式无论是在句式还是在结构上，都较《诗经》更为自由且富于变化，因此能够更加有效地塑造艺术形象和抒发复杂激烈的感情。就句式而言，楚辞以杂言为主，突破了传统的四言句式。就语言描写而言，楚辞善于渲染、形容，词语繁富，很重视外在形式的美感，这为汉代赋体文学的产生创造了条件。\n\n其次，楚辞突出地表现了浪漫的精神气质。这种浪漫精神主要表现为感情的热烈奔放，对理想的追求，以及抒情主人公形象的凸现，想象的奇幻等。楚辞中另一浪漫特征表现在它通过幻想、神话等创造了一幅幅雄伟壮丽的图景。中国古代神话由于种种原因，传世较少，而《楚辞》尤其是《天问》是我国神话材料保存得较为集中的。《离骚》《九歌》《招魂》中都有不少神话或神话形象，使得诗歌显出缥缈迷离、谲怪神奇的美学特征，对李白、李贺等后世诗人有巨大的影响。\n\n再次，楚辞的象征手法对后世的文学创作有重大影响。楚辞中典型的象征性意象可以概括为香草美人，它是对《诗经》比兴手法的继承和发展，内涵更加丰富，也更有艺术魅力。它成了中国文学史上以男女君臣相比况的常见的创作手法。但楚辞中的香草美人意象又与一个深厚的巫祭传统有关，它包含了一些原始宗教的情感体验，由于屈原卓越的创造能力，使香草美人意象结合着屈原的生平遭遇、人格精神和情感经历，从而更富有现实感，也更加充实，赢得了后世文人的认同，并形成了一个源远流长的香草美人的文学传统。","keywords":"砥砺不懈、特立独行 坚持真理，敢于反抗 卓越的人格力量 深沉悲壮的情怀 对民族精神的重大贡献 艺术成就新的诗歌样式 浪漫的精神气质 象征手法","note":"作为一位伟大的浪漫主义爱国诗人，无论是在思想上还是在艺术上，屈原都给后世的文人留下了深刻的影响。后世的迁客骚人，在远离庙堂之际，往往会想起屈原，如贾谊就曾写下《吊屈原赋》；而屈原浪漫诗歌的影响，则出现在李白等浪漫诗人的笔下。他已经成为一个文化符号，深深地烙印在中华文明之中。"},{"id":"41","stars":"★★★","title":"谈谈楚辞的地位和影响","body":"“楚辞”是指以具有楚国地方特色的乐调、语言、名物而创作的诗赋，在形式上与北方诗歌有较明显的区别。与《诗经》相比，楚辞在艺术上达到了一个新的境界，哺育了一代又一代的作家，对中国文学史产生了极其深远而广泛的影响。\n\n首先，楚辞创造了一种新的诗歌样式\n\n这种诗歌形式无论是在句式还是在结构上，都较《诗经》更为自由且富于变化，因此能够更加有效地塑造艺术形象和抒发复杂激烈的感情。就句式而言，楚辞以杂言为主，突破了传统的四言句式。就语言描写而言，楚辞善于渲染、形容，词语繁富，很重视外在形式的美感，这为汉代赋体文学的产生创造了条件。\n\n这种浪漫精神主要表现为感情的热烈奔放，对理想的追求，以及抒情主人公形象的凸现，想象的奇幻等。楚辞中另一浪漫特征表现在它通过幻想、神话等创造了一幅幅雄伟壮丽的图景。《离骚》中那一次次壮观的天界之游，望舒先驱，飞廉奔属，想象极为大胆奇特，使得屈原的自我形象显得高大明洁，激动人心。中国古代神话由于种种原因，传世较少，而《楚辞》尤其是《天问》是我国神话材料保存得较为集中的。《离骚》《九歌》《招魂》中都有不少神话或神话形象，使得诗歌显出缥缈迷离、谲怪神奇的美学特征，对李白、李贺等后世诗人有巨大的影响。\n\n再次，楚辞的象征手法对后世的文学创作有重大影响\n\n楚辞中典型的象征性意象可以概括为香草美人，它是对《诗经》比兴手法的继承和发展，内涵更加丰富，也更有艺术魅力。如王逸所说：“善鸟香草，以配忠贞；恶禽臭物，以比谗佞；灵修美人，以媲于君；宓妃佚女，以譬贤臣；虬龙鸾凤，以托君子；飘风云霓，以为小人。”（《楚辞章句·离骚经序》）这种以男女君臣相比况的手法成了中国文学史上常见的创作手法。但楚辞中的香草美人意象又与一个深厚的巫祭传统有关，它包含了一些原始宗教的情感体验，如《九歌》中所体现的人神交接的艰难，以及苦苦追求的悲剧精神。由于屈原卓越的创造能力，香草美人意象结合着屈原的生平遭遇、人格精神和情感经历，从而更富有现实感，也更加充实，赢得了后世文人的认同，并形成了一个源远流长的香草美人的文学传统。如张衡《四愁诗》效屈原以美人喻君子，曹植《洛神赋》“感宋玉对楚王神女之事，遂作斯赋”。李贺诗多寄情于香草美人，如凄婉哀绝的《苏小小墓》等。而蒲松龄一生不遇，作《聊斋志异》渲染花妖，自云：“知我者，其在青林黑塞间乎！”（《聊斋志异·自序》）这些显然都是受到了楚辞香草美人传统的影响。","keywords":"新的诗歌样式 浪漫的精神气质 象征手法","note":"①在回答类似的问题时，我们首先要对涉及的概念进行明确，然后再分点进行分析。楚辞的地位与影响，主要包括诗歌形式、内容和手法三个方面，大家可以结合楚辞及后世相关诗文具体作答。②这道题和上述的屈原地位影响异曲同工，可结合在一起记忆。"},{"id":"42","stars":"★","title":"《天问》的艺术特色","body":"《天问》是楚辞中一首奇特的诗歌。所谓“天问”，就是列举出历史和自然界一系列不可理解的现象，对天发问，探讨宇宙万事万物变化发展的道理。诗中一共提出了172个问题，大致次序是先问天地之形成，次问人事之兴衰，最后归结到楚国的现实政治，线索基本清楚。《天问》的艺术特色，主要包括以下内容：\n\n一、形式上有楚地民间一系列“传古”踏唱作为基础\n\n《天问》中有大量纯知识性提问，还有明知故问的成分，更有以问作答、借提问叙事的情况，因此，《天问》更像是一篇盘问叙述之作。以问答体式来叙述天地开辟、万物生成、人类起源及民族英雄业绩的史诗内容，本是南方许多少数民族的惯用形式，如云南白族的《打歌》，即是在节庆踏歌对唱时所唱的以问答为主的古歌，内容亦从开天辟地唱起。《天问》这种提问式句法及囊括天地自然、神话历史的庞大内容，也应有楚地民间一系列“传古”踏唱作为基础。\n\n二、传达了明确的现实政治态度\n\n《天问》虽然叙事庞杂，而思想倾向却很明显，尤其是在涉及天命和历史盛衰时，很能显示屈原的现实政治态度。如蒋骥所说：“其意念所结，每于国运兴废、贤才去留、谗臣女戎之构祸，感激徘徊，太息而不能自已。”（《山带阁注楚辞·馀论》卷上）王夫之认为《天问》“言虽旁薄，而要归之旨，则以有道而兴，无道则丧”（《楚辞通释·天问》）。如《天问》云：“天命反侧，何罚何佑？......皇天集命，惟何戒之？受礼天下，又使至代之。”对殷朝的兴亡史发出了自己的感慨，认为天命反复无常，朝代的兴亡不在天命而在人事。《天问》还流露出鲜明的情感色彩，如诗末数句，一腔怨愤，发泄无余。在一连串的问号后面，我们能够感受到屈原那焦虑而急切的情感状态，感受到他的失望和愤懑，以及孜孜不倦的求索精神。\n\n三、节奏明快而强烈，参差错落，奇崛生动\n\n《天问》以一个“曰”字领起，全诗几乎都由问句组成，这在中国文学史上是罕见的。简短而一问到底的句式，节奏明快而强烈，能有效地宣泄积蓄已久的激情，这是《天问》的特点。全诗基本上以四言句为主，间以少量的五言、六言、七言；四句为一组，每组一韵，也有极少数两句一韵。全诗显得整齐而不呆板，参差错落，奇崛生动。","keywords":"以“传古”踏唱作为基础 现实政治态度 节奏明快而强烈 参差错落，奇崛生动","note":"《天问》和《九歌》相似，也包含着一些民间诗歌的特色，主要表现在形式上。但更值得注意的是，《天问》通过这种形式，传达出了自己明确的现实政治倾向。"},{"id":"43","stars":"★","title":"宋玉的辞赋有何特色","body":"宋玉能在文学史上占据一席之地，得益于他的才华横溢，更取决于他在祖述屈原的同时，又有自己新的创意。\n\n《九辩》是宋玉的代表作，其内容主要是抒发他因不同流俗而被谗见疏、流离失所的悲哀，批判了楚国黑暗的现实政治。作品委婉曲折地表达了对君王的忠诚和自己的怨苦，表现了对国家兴亡的忧虑。其中最动人的是对秋景的描写。诗中刻画了秋景的种种凄凉寂寞，并将其和自身的惆怅失意、冷落孤独之情和谐地交织在一起，感人至深。中国文学史上影响深远的“悲秋”主题，实由此发端。鲁迅《汉文学史纲》谓：“《九辩》......虽驰神逞想，不如《离骚》，而凄怨之情实为独绝。”《九辩》显然继承了《离骚》的抒情传统，把个人的身世之悲和对国家命运的关怀联系在一起，形成悲愤深沉之风格特征。\n\n题为宋玉所作之赋，大多已是设为问答、以叙述描写为主的散体辞赋。具体考察实又可分为三种类型：\n\n
