平的思想与经历笔端饱含感情；《自祭文》对自己一生的行事，毫无悔恨之意，表现了诗人的骨气；《祭程氏妹文》也写得凄恻感人。\n\n二、陶渊明辞赋的艺术成就\n\n陶渊明的辞赋继承了抒情小赋的传统，但能洗净铅华，与他的诗、散文在风格上有其一致之处。《归去来兮辞》是历来为人称颂的名篇。这是诗人归田时的作品。文中着力描写了他由迷途折回的喜悦以及对田园生活的热爱，从中表现了他的高洁志趣。文中不乏华彩的段落，其跌宕的节奏，舒畅的声吻，将诗人欣喜欲狂的情状呈现于读者面前。对于后人来说，一切的回归，一切的解放，都可以借着这篇文章来抒发，因此它也就有了永恒的生命力。\n\n他的《感士不遇赋》抒发了诗人对士不遇的感慨，也揭露了士不遇的原因，表现了他的耿介不阿的品格。他的《闲情赋》则用铺排的写法表现了男女之间深挚的感情，是陶渊明作品中极为特殊的一篇，借汉末以来闲止类题目表达情爱，笔致浓丽，昭示了在陶渊明的隐逸人格之中，还有更为真淳多情的一面。","keywords":"古代士大夫理想 理想社会的生活图景 抒情小赋传统","note":"陶渊明的散文与辞赋也取得了很高的成就，其中《五柳先生传》中的形象寄托了古代士大夫的人生理想，《归去来兮辞》表现了回归田园的喜悦之情，《桃花源记》更是和《茅屋为秋风所破歌》一样，想到了整个社会的出路与广大人民的幸福，这些内容需要大家有所了解。"},{"id":"96","stars":"★★★","title":"试分析陶渊明的符号意义","body":"陶渊明在当时只以隐士著称，他的文学创作没有得到高度的评价，这是因为他平淡自然的风格与当时崇尚的华丽文风不合，萧统是第一位发现陶渊明文学价值的人，既推崇其人格也推崇其文学。到了宋朝，特别是经过苏轼、朱熹的弘扬，以及汤汉对其作品的诠释，陶渊明才真正确立了他在文学史上的崇高地位，这地位一直保持到今天，并获得了世界的声誉。\n\n一、中国士大夫的精神归宿\n\n陶渊明是中国士大夫精神上的一个归宿，许多士大夫在仕途上失意以后，或厌倦了官场的时候，往往回归到陶渊明，从他身上寻找新的人生价值，并借以安慰自己。白居易、苏轼、陆游、辛弃疾等莫不如此。于是，不为五斗米折腰也就成了中国士大夫精神世界的一座堡垒，用以保护自己出处选择的自由。而平淡自然也就成了他们心目中高尚的艺术境地。\n\n二、与酒和菊两个意象联系紧密\n\n由于陶渊明的吟咏，酒和菊已成为他的象征。古代文人爱酒的不少，但能识酒中之深味的，从饮酒中体悟人生真谛的，陶渊明是为数不多的几个人之一，酒和陶渊明的生活及其文学紧密地联系在一起。阮籍饮酒有以醉逃祸和借酒浇愁的意味，陶渊明则是追求酒所助成的物我两忘的境界。陶渊明写菊其实并不多，一共六处，但因“采菊东篱下，悠然见南山”这两句诗太著名了，菊便成了他的化身，成了中国文学里象征着高情远致的意象。在酒和菊之外，象征陶渊明的还有“孤云”。陶渊明生前是孤独的，他的诗文是一个孤独者的自白。他生命的光辉在他死后才逐渐放射出来。\n\n三、士大夫抒发人生理想、寄托生命情怀的载体\n\n长久以来，士人们诵读陶集，追和陶诗，创作以陶渊明为素材的绘画，在对陶渊明的反复言说和描绘中，他不再仅仅是一个单纯的诗人，而逐渐成为士大夫抒发人生理想、寄托生命情怀的一个载体。不妨说，陶渊明是一片被后人不断耕耘的精神高地，这个高地有来自陶渊明原型的基本架构，后人又可以按照自己的理解和期望来栽种各式各样的花木，后代的士大夫参与了对陶渊明的塑造，把自己从他作品中读出的人生体悟置入其中。把握陶渊明的文化符号性，不仅可以更全面地了解陶渊明其人，更可以此为切入点，对中国文化、特别是士大夫文化获得感性的认识。","keywords":"士大夫精神 酒和菊“孤云”士大夫文化","note":"陶渊明对于中国文化的影响，已经不仅仅是几首诗歌、几篇辞赋那样简单了。他已经成为了士大夫精神上的归宿，成为了中华文明中十分重要的一个文学符号，承载着一种精神、一种文化。"},{"id":"97","stars":"★★★★","title":"试分析陶渊明的影响","body":"陶渊明作为中国文学史上伟大的文学家，他平淡冲和的文风，他以酒为诗的旷达，他不为五斗米折腰的气节，他归隐自然的平和心态等等，影响了一代又一代文人。陶渊明对文学的贡献是巨大的，是多方面的，具体来说，表现在以下方面：\n\n一、从思想上影响了后世诗人的思想内容\n\n陶渊明的诗歌，内容是复杂的。因此不同方面的内容，在不同历史时期，对不同的作家，所起的作用也是不同的。他诗歌中所表现的光明峻洁的人格和坚决不与黑暗势力同流合污的高尚品质，教育了后代文人不屈服于权贵，不与庸俗之流为伍。在强敌压境或政治十分黑暗、社会变革即将到来的时候，他的“金刚怒目式”的作品，他的疾恶除暴的精神，也给作家以巨大的支持与鼓舞。他的桃花源理想对后代也有积极的影响。\n\n二、从艺术上影响了后世诗人的艺术创作\n\n陶渊明的艺术影响同样是广泛的。从南朝文人鲍照、江淹作了学陶体的诗歌以后，历代“拟陶”“和陶”相沿成风。我国历代有成就的诗人很少没有表示过对他的创作的企羡和受到他的艺术的熏陶的。仅从陶诗对盛唐中唐一些诗人的影响中，便可以体会到陶诗艺术影响的广泛了。\n\n三、开创了田园诗这一体式\n\n在中国文学史上，把田园风光和田园生活作为创作主题的，陶渊明是第一人。他的田园诗开创了我国古典诗歌一个新流派-田园诗派，他被后人称作“田园诗人之祖”。这一派影响甚大，后来的王维、孟浩然、储光羲、韦应物这些诗人，虽然没有经常提到陶渊明，但他们作品的艺术风格，明显受到陶诗的影响。从他以后，田园诗不断得到发展，到了唐代就已形成了田园山水诗派。宋以后，描写田园的诗人就多到不可胜数了。\n\n四、拓宽了诗歌创作的题材\n\n把饮酒这样的题材纳入诗歌中，这是陶渊明在诗歌题材上的一个创造。陶渊明不仅开创了田园诗，而且开创了饮酒诗。在陶之前，古人写饮酒，大多采取劝诫的态度。而到了陶渊明，不再去写酒德，而是写饮酒的欢畅与乐趣。他有一组《饮酒诗，就像他在序言里所说，他无夕不饮，忽焉复醉，既醉之后，辄题数句自娱。酒、松、菊是陶渊明笔下常见之景，在诗中他将三者和谐地融为一体，表现自己高洁的志趣。陶渊明是以饮酒为题材，大量创作饮酒诗的第一人。他突破礼法传统，尽写饮酒之乐。","keywords":"思想内容 艺术创作 田园诗 拓宽诗歌题材","note":"陶渊明对后世诗人的影响是多方面的，无论是在思想上，还是在艺术上，都引起了后世诗人的共鸣与效法。除此以外，我们还要注意陶渊明诗歌的开拓意义，主要表现在对田园诗这一形式的创造和饮酒题材的开拓上面。后世的诗人，如田园诗派的王、孟，喜好写喝酒宴饮的李白，都明显是受到了陶渊明的影响。"},{"id":"98","stars":"★★★","title":"简析唐代诗人对陶渊明及其诗文的接受史","body":"在隋唐五代，陶渊明为人和诗文的魅力再也遮挡不住，他像上弦月一样日益流光溢彩。他的个性风神、他的诗歌精神从隐居之地走出来，向社会、文化、诗歌创作辐射、渗透。这种辐射、渗透是强有力的，又是如春雨润物般细而无声的。它贯穿于整个隋唐五代陶渊明接受史。\n\n一、初唐：关注陶渊明风流雅士的一面，轻视诗文创作\n\n对初唐人来说，陶渊明主要还是一位颖脱不群、好酒拔俗的风流雅士，而不是一位诗人。初唐人在一般泛论文学史历代作家时，往往忽视了陶渊明。类似的情况在一定范围内是隋唐五代陶渊明接受史上的一种常见现象。\n\n这显示了陶渊明的诗文在初唐直至五代知音稀少、被轻视的一面。但知音稀少并不等于没有知音，轻视并不等于没有注意。同前期相比，从初唐开始，陶渊明的知音、读者便有增无减，上至最高统治者，下至著名文人乃至一般文人大都欣赏陶之为人，常常在宴会等集体场所称引陶好酒的情趣。初唐“四杰”可为其中的代表。\n\n二、盛唐：由个体走向群体，向社会文化渗透，发现了陶渊明的田园诗\n\n承接初唐，在盛唐，对陶渊明的兴趣（主要是对他的隐逸和饮酒）进一步由个体走向群体，向社会文化渗透。旷达知足、怡情于酒、遗世独立、悠然自得，正是盛唐人所理解的典型的陶渊明形象。饮酒是陶渊明表现其旷达任真个性的典型行为，而陶渊明又爱重九之名，因此盛唐人每于九日诗中称引渊明，且与饮酒、菊花联系。大量在“九日”诗中称引陶酒、东篱菊以加强重阳节高雅的文化品位，使陶酒与东篱菊成为日后“九日”诗中的两种典型意象。\n\n盛唐人在陶渊明接受史上最重要的一个贡献是，他们以群体（而非个体）的形式发现并深入学习了陶渊明的田园诗。即，从盛唐开始，陶诗（特别是陶的田园诗）开始对中国古典诗歌的创作产生大面积而又较深刻的影响。盛唐人对陶诗的学习已不是单纯的典故使用，也不是词句的局部借鉴，而是在融合陶、谢（灵运）诗的基础之上创造了辉煌的山水田园诗。\n\n陶渊明对盛唐山水田园诗的影响是全面而广泛地展开的。就广泛而言，以王、孟为中心，绝大多数写过山水田园诗的盛唐诗人都受陶渊明影响。就全面而言，盛唐山水田园诗对陶渊明田园诗所开创的写作典范都有继承和创造性的发展。\n\n盛唐山水田园诗对陶渊明诗文的接受情况表明，陶渊明及其诗文所代表的审美追求、价值追求在盛唐已经被从一定程度上较为普遍地肯定或认同：它作为一种与城市、社会、官场等世俗世界相对立的、具有普遍意义的审美价值、人生价值向知识阶层进一步扩散并初步定型。\n\n三、中唐：更加理解陶渊明的人生追求，以更为明确和理性的态度发现了陶诗\n\n从整体、主流看，中唐人比盛唐人更加理解陶渊明的人生追求，更加津津乐道于陶渊明的隐逸闲趣，并把这一闲趣普遍化、平俗化，从田园引向官衙、从理想引入世俗。由此，隐逸闲趣进一步超越形迹，向心灵内敛，变为超越出处、仕隐而又不避世俗的闲适。盛唐人学陶以示不羁个性的隐逸、饮酒，在中唐则成为独善生活、心灵超越状态下闲适之趣的佐助。\n\n在艺术上，中唐有更多的诗人以更为明确和理性的态度发现了陶诗，特别是皎然在《诗式》《诗古文联句》中明确运用当时的诗学观点对陶诗的艺术特点、艺术价值进行发掘，并在分析的基础上确立了陶诗在诗史上非同寻常的地位。这标志，也代表了唐代人对陶诗的最高理性认识。\n\n四、晚唐：突出陶渊明的鲜明个性，对诗文接受则以众多小诗人为主\n\n晚唐五代人对陶渊明便几乎没有微词了。他们虽仍然认为陶渊明是嗜酒的县令、高雅的隐士，但推崇之情溢于言表。晚唐似乎又回到了萧统的观点，有对陶渊明极为仰慕，将陶渊明理想化的一面。他们更加突出了陶渊明不愿同流合污、不满现实、高蹈避世的鲜明个性。晚唐五代诗人中的大家、名家如杜牧、李商隐、杜荀鹤等对陶渊明的接受甚少，但众多的小诗人对陶诗有或多或少的接受。特别是在业已形成的崇尚淡泊的诗歌精神的影响下，他们在写隐逸淡泊情思时往往受陶诗的影响，如唐彦谦、司空图、李建勋、徐铉等人都有不少明显受陶影响的作品。","keywords":"初唐 风流雅士 轻视诗文 盛唐 社会文化 田园诗 中唐 人生追求 明确理性 晚唐 鲜明个性","note":"唐代对于陶渊明的接受经历了一个发展的过程，整体来看，唐代诗人对陶渊明的态度是从中立逐步走向肯定的，到晚唐之时，整体对陶渊明更是比较推崇的。相关内容可以参考李剑锋《隋唐五代陶渊明接受史概论》，具体资料可以在李凡文学正版群中领取。"},{"id":"99","stars":"★★","title":"试分析山水诗出现的原因","body":"山水诗的出现，不仅使山水成为独立的审美对象，为中国诗歌增加了一种题材，而且开启了南朝一代新的诗歌风貌。继陶渊明的田园诗之后，山水诗标志着人与自然进一步的沟通与和谐，标志着一种新的自然审美观念和审美趣味的产生。而以下众多因素，促进了山水诗的诞生：\n\n一、山水景物在先前诗歌中出现，为后来的山水诗提供了艺术经验\n\n早在《诗经》和《楚辞》的时代，诗中就出现了山水景物，但那往往只是作为生活的衬景或比兴的媒介，作为一种非独立的审美对象。到了汉末建安时期，曹操的《观沧海》才算是中国诗歌史上第一首完整的山水诗。西晋左思的《招隐诗》和郭璞的游仙诗都写到山水的清音和美貌。这类诗虽然数量不多，但它们毕竟在客观上为后来的山水诗提供了艺术经验。\n\n二、隐逸之风盛行，士大夫以山林为乐\n\n山水诗如同游仙诗和玄言诗一样，与魏晋之后隐逸之风有着十分密切的关系。在中国士大夫的传统观念中，山林隐逸总是与社会仕途对立的。孔子所谓“用之则行，舍之则藏”的观念，对后来士大夫的影响相当深刻。自汉代以来，遁迹岩穴即被视为一种清高，同时也是通向仕途的捷径。到了魏晋，由于社会动乱、政治黑暗，隐逸之风大炽。士大夫阶层大都以山林为乐土，他们往往把自己理想的生活和山水之美结合起来。因此山水描写的成分在诗里就逐渐多了起来。\n\n三、江南经济发展，士族地主多在山林中建造别墅\n\n晋宋时代，尤其是南渡之后，江南的经济有了较大的发展，士族地主阶层的物质生活条件更加优越，他们大造别墅，在秀美的山水之间过着登临吟啸的悠闲生活。而作为生活环境的山水景物，也就很自然地反映在诗中。\n\n四、玄学与玄言诗盛行，山水审美意识增加\n\n山水诗的产生，与当时盛行的玄学和玄言诗有着密切的关系。当时的玄学把儒家提倡的“名教”与老庄提倡的“自然”结合在一起，引导士大夫从山水中寻求人生的哲理与趣味。真正的玄言家，是很懂得“山水以形媚道”之理的。因此在玄学发展的过程中，山水审美的意识也渐增。借山水体玄，成为当时一种普遍的风气。在玄言诗里，也常常寓玄理于山水之中，或借山水以抒情，因而出现了不少描写自然山水的佳句，可以说玄言诗本身就孕育了山水诗。晋宋之际，随着自然山水审美意识的不断浓厚，山水绘画及理论也应运而生。这对于山水诗的产生，无疑也有着促进的作用。此外，五言诗的成熟以及江南民歌中描写自然景物的艺术经验，也为山水诗的产生做好了文学上的准备。","keywords":"审美观念和审美趣味 艺术经验 江南的经济发展 隐逸之风 玄学和玄言诗 山水审美意识","note":"山水诗的出现，经历了一个漫长的过程，从文学自身来看，描写山水景物的传统在《诗经》《楚辞》中就已现端倪；从文学外部来看，无论是追求隐逸的风气、江南经济的发展还是山水审美意识的增加，都推动着山水诗的出现。可以说，山水诗的出现是一个必然，是多种因素共同作用的结果。"},{"id":"100","stars":"★★★★","title":"试分析谢灵运诗歌的艺术特色","body":"谢灵运是中国第一个大力写作山水诗的诗人。不独如此，谢灵运更调动多种艺术手段，匠心独运，别开境界，创造山水艺术形象，在古代山水诗中，卓然为一大宗派。谢灵运的诗歌创作特征，主要表现在以下方面：\n\n一、整体风格清新明丽，如“初发芙蓉”\n\n谢灵运的山水诗，绝大部分是他做永嘉太守以后写的。在这些诗里，他用富丽精工的语言描绘了永嘉、会稽、彭蠡湖等地的自然景色。谢灵运的诗以大量描摹山水景物为主要特色，其艺术成就也集中在这一方面。谢诗的写景追求形似，因此诗中的景物描写非常细致。由于谢诗写景主要使用白描手法，很少用典和过多的粉饰，能给读者以清新明丽的感觉。\n\n二、“山水加玄言”的固定模式\n\n在结构上，谢灵运的山水诗也多是先叙出游，次写见闻，最后谈玄或发感喟，如同一篇篇旅行日记，而又常常拖着一条玄言的尾巴。谢灵运山水诗中的说理成分并不仅出现在结尾处，但以玄言结束全诗是其最显著的特点。前写景后说理，是谢诗的典型结构。因此，谢灵运的山水诗往往呈现出“山水加玄言”的固定模式。\n\n三、善于经营画境\n\n谢灵运的山水诗善于经营画境。所以如此，是因为谢灵运的领略山水之美，不是陶渊明式的静观，而是移步换景式的游赏。静观须心境纯静，方能物我亲切交流，落笔成诗，便出意境。游赏则寻幽览胜，山水异态，纷至沓来，耳目为声色所感，摘藻绘象，便成画境。因为登山临水，视野开阔；又因为景有远近，色有浓淡，诗人依其感官印象纳入画面，其山水林木，乃粗具透视的关系；诗歌的画境，因而获得一种疏宕清丽之美。谢诗以远近、大小、疏密、浓淡、虚实表现不同距离的景物留给视觉的印象，与汉赋对山川风物的全景式描绘相比，无疑是一次质的飞跃。\n\n四、语言注重写实性\n\n谢灵运的诗歌语言更注重写实性。他充分发挥了语言的表现力，增强了语言描写实景实物的效果。他凭着细致的观察和敏锐的感受，运用准确的语言，对山水景物作精心细致的刻画，力求真实地再现自然美。因而他笔下的物象，就更多地带有独立性和客观性。也许由于语言自身的局限和不足，当他面对千姿百态、变化无穷的自然景物时，也同样有着语言表达的苦恼，但他还是要充分发挥语言的写实性，努力地探索新的表现方法，创造新的语汇，运用各种技巧去描摹或形容它们，并从不同的角度再现大自然的美，显示出其高度的驾驭语言的能力。\n\n【李凡关键词：清新明丽 山水加玄言 经营画境 写实性】","keywords":"","note":"“山水田园诗”中的田园诗主要受到陶渊明的影响，而山水诗则主要受到谢灵运的影响。除了题材上的不同之外，在艺术上，陶渊明和谢灵运也有很大的区别，总体而言，谢灵运更重视写实性和运动感。大家可以通过对比加深对二者各自特征的理解。"},{"id":"101","stars":"★★★★","title":"试比较陶渊明与谢灵运的诗歌创作的差异","body":"从诗歌发展史来看，魏晋和南朝属于两个不同的阶段。而从魏晋到南朝诗歌艺术的转变，就是从陶渊明、谢灵运的差异开始的。二者的差异，主要表现在以下方面：\n\n一、景物描写：从写意到摹象\n\n在谢灵运之前，中国诗歌以写意为主，摹写物象只占从属的地位。陶渊明就是一位写意的能手。他的生活是诗化的，感情也是诗化的，写诗不过是自然的流露。因此他无意于模山范水，只是写与景物融合为一的心境。\n\n谢灵运则不同，山姿水态在他的诗中占据了主要的地位，注重物我合一，表现出整体的自然美。“极貌以写物”和“尚巧似”成为其主要的艺术追求。他尽量捕捉山水景物的客观美，不肯放过寓目的每一个细节，并不遗余力地勾勒描绘，力图把它们-真实地再现出来。\n\n二、诗歌语言：从启示性到写实性\n\n陶渊明对言不尽意的道理似乎深有体会，他常常遇到语言表达的苦恼，所以他采取的办法是以不辩为辩，启发读者自己去体会和补充。陶渊明的诗，十分注重言外的效果，发挥语言的启示性，以调动读者的联想和想象，去体会那些只可意会而不可言传的东西。陶诗中的物象描写，常采用白描的手法，虽然只是淡淡的几笔，但在平淡的外表下，却蕴含着炽热的感情和浓郁的生活气息。\n\n谢灵运的诗歌语言则更注重写实性。他充分发挥了语言的表现力，增强了语言描写实景实物的效果。他凭着细致的观察和敏锐的感受，运用准确的语言，对山水景物作精心细致的刻画，力求真实地再现自然美。因而他笔下的物象，就更多地带有独立性和客观性。\n\n三、意象构成：由静态到动态\n\n陶渊明的诗受传统诗歌影响较大，意象构成相对稳定，在“比”的框架内，多是静态性的构成。陶诗的意象比较简单，但简单并不同于单调，同样在寻求一种对人生、宇宙的阐释。\n\n谢灵运诗的意象重视当下，在诗人和景物性灵契合的瞬间构成动态性的意象。谢灵运在诗歌中不断地捕捉这种相同中的不同，不变中的变化，幽寂中的活力，那些能和自己内在情感的律动相契合的物象。所以，谢诗意象具有多样性，随物生成的特点，由此形成了两人风格的不同。\n\n四、诗歌意境：由平淡自然到空寂中彰显生命\n\n陶渊明诗中建构的兴象天然的意境，让读者面对诗人所创设的“第二自然”感受和体悟其对人生、历史、宇宙的理解，这是超越当下的景物的一种哲理性的升华，是区别于哲学思辨的感性的思考。因此，平淡而有味，自然而不俗。从陶渊明诗中能看到的是一个悠然自乐、随遇而安的山野达人。\n\n谢灵运诗中不是去构造一种完整的意境，总体上是一种比较小的诗境。在对当前景物的细致描绘中，由物及理，是在大自然的物象及其变化中的感悟。他所创设的空寂中彰显生命的诗境，传达出的是鲜活的生命力。无论溪流旁的小花、林中鲜艳的花朵、还是幽寂的竹林，都是纯净的、自然的、有生气的，是诗人对生命的歌颂，对险恶社会环境的鄙弃。从谢灵运诗中可以看到作者苦苦追寻的身影。\n\n从陶渊明到谢灵运的诗风转变，正反映了两代诗风的嬗递。如果说陶渊明是结束了一代诗风的集大成者的话，那么谢灵运就是开启了一代新诗风的首创者。","keywords":"景物描写 写意 摹象 诗歌语言 启示性 写实性 意象构成 静态 动态 诗歌意境 平淡自然 空寂中彰显生命","note":""},{"id":"102","stars":"★★","title":"试分析南朝民歌的特征","body":"一、类型上分为吴歌和西曲两类\n\n南朝民歌主要有吴歌和西曲两类。吴声歌曲多为女性的吟唱，以清新浅近的语言，表现真挚细腻的感情，风格艳丽柔弱、哀怨缠绵，真实地再现了江南女子在爱情问题上的复杂心态，并富有浓郁的生活气息。西曲产生于长江中游和汉水两岸的城市，以江陵为中心。由于地区的差别和歌者的身份不同，它多写水边船上旅客商妇的离别之情，所反映的生活面比吴歌稍广，而且更多地表现了劳动人民的爱情生活，其突出的特点是结合劳动来描写爱情。因此在情调上与吴歌的闺阁气息有所不同，风格也较为开朗明快。\n\n二、内容上以情歌为主\n\n现存南朝民歌绝大多数是情歌。造成这一现象的原因是多方面的。\n\n南朝和汉代一样设有乐府机构，负责采集民歌配乐演唱。现存南朝民歌就是由这些乐府机构采集而保存下来的。汉代统治者采集民歌尚有“观风俗，知薄厚”的目的，而南朝统治者采集民歌则主要是为了满足其纵情声色的需要。汉魏之世的雅乐，至西晋已渐散亡。及宋武帝平关中，曾将散落在北方的雅乐带回江南。但这些雅乐的曲、辞皆已陈旧，不能满足需要。而此时在南方民间已经产生了大量的新声歌曲，于是统治者便进行采集、润色与拟作。\n\n南朝民歌中多清丽缠绵的情歌，与江南幽美的自然环境和充裕的经济条件也有着直接的关系。南朝民歌产生于长江中下游地区，那里山清水秀，鸟语花香。本自多情的青年男女，在这样的环境中，不免发怀春之情。长江流域物产丰盛，商业发达。而最为富庶的地区又首推荆、扬二州。南朝民歌，大部分就是城市中的产物。它们多半出自商贾、妓女、船户和一般市民之口，主要反映城市中下层居民的生活和思想感情。\n\n三、体制小巧，大多为五言四句，语言清新自然\n\n南朝民歌的形式特点，是体制小巧，大多为五言四句，语言清新自然，正如《大子夜歌》所说“慷慨吐清音，明转出天然”“不知歌谣妙，声势出口心”。清妙的歌谣随口唱来，不雕饰，不做作，便将内心深处细腻缠绵的情感真切地表现出来。\n\n大量运用双关语，是南朝民歌尤其是吴歌的显著特点。双关语大致可分为两类：一类是同音异字的，另一类是同音同字的。这些巧妙的双关语的运用，不仅使得语言更加活泼，而且在表情达意上也更加含蓄委婉。","keywords":"吴歌 西曲 大多数是情歌 体制小巧 清新自然 双关语","note":"南朝民歌主要分为吴歌和西曲两种，这两种的内容与语言风格都有所区别，大家要注意。而南朝民歌总体的特点便是以情歌为主，这与它的来源和社会状况有关。总体来看，南朝民歌更加精致，抒发情感也较为婉转，这也与南朝民风有关。"},{"id":"103","stars":"★★","title":"试分析北朝民歌的特征","body":"一、是各民族文化融合的结果\n\n北朝民歌原来大都是北方少数民族的歌唱，其中又以鲜卑语的歌辞居多。这些歌辞后来被翻译成汉语，如《敕勒歌》“其歌本鲜卑语，易为齐言，故其句长短不齐”。其中也有一部分是北人直接用汉语创作的，有些则是经过了南方乐工的加工润色，同时也不能排除其中还杂有少数北方汉人的作品。所以北朝民歌是北方各民族共同创造的文化硕果。\n\n二、广泛反映社会生活\n\n北朝民歌的数量虽不多，但内容却广泛地反映了社会生活的各个方面。以鲜卑族为主的北方各民族跟南方人民的生活环境有所不同，再加上北方民族特殊的风俗习惯和性格气质，因此北朝民歌的情调和风格，就跟南朝民歌有了显著的差别。\n\n（一）表现北方的景色和风俗\n\n北魏政权刚开始生活在北方草原一带，尽管他们后来逐渐南侵，且受到汉文化的影响，但他们的生活环境和习俗仍旧不同于南方。因此在北朝民歌中，表现北方的景色和风俗，最富有地方色彩。\n\n（二）反映战争\n\n频繁的战争是北朝社会一个严重而突出的问题，因而北朝民歌中反映战争的诗也较多。如《企喻歌辞》中的后三首，《崇骝马歌辞》中的第三首，《慕容垂歌辞》三首，《隔谷歌》二首，以及《陇上歌》等，均属此类题材的作品。\n\n（三）反映羁旅行役和流亡生活\n\n北朝民歌中，还有不少反映羁旅行役和流亡生活的怀土思乡之作，如上文所举《陇头歌辞》和《折杨柳歌辞》即是，刻地反映出他们颠沛流离的苦况和思念家乡的心情。还有些民歌则反映了穷苦人民饥寒交迫的生活以及不合理的社会现实其中充满劳苦之人的愤激与不平。其语言之朴素无华，情调之坦率爽朗，风格之刚健豪放，均与南朝民歌形成鲜明的对比。\n\n（四）反映爱情与婚姻题材\n\n北朝民歌中有不少反映爱情与婚姻题材的作品，这些歌曲坦率直截，与南朝情歌缠绵婉转的情调是大不相同的。这些歌唱直率而朴素，毫无忸怩羞涩之态，与南朝民歌相比，也同样有直与曲、刚与柔之别。\n\n三、直抒胸臆，气盛词质\n\n北朝乐府民歌在艺术上的最大特点是直抒胸臆，气盛词质。其于四、五、七言和杂言的灵活运用，很能见出北方民族不受形式约束的自由创造精神。北朝乐府民歌以其质朴刚健的作风影响于北朝诗坛，使当时的文人在学习南朝文学的同时，能避免陷入纤弱与绮丽。对唐代的边塞诗和五、七言绝句，北朝乐府民歌也是直接输送了养料的。","keywords":"北方各民族 社会生活的各个方面 战争 怀土思乡 爱情与婚姻 直抒胸臆 气盛词质","note":"由于南北朝长期处于对峙的局面，在政治、经济、文化以及民族风尚、自然环境等方面又存在着明显的差异，因而南北朝民歌也呈现出不同的情调与风格。南朝民歌清丽缠绵，更多地反映了人民真挚纯洁的爱情生活；北朝民歌粗犷豪放广泛地反映了北方动乱不安的社会现实和人民的生活风习。南朝民歌中的抒情长诗《西洲曲》和北朝民歌中的叙事长诗《木兰诗》，分别代表着南北朝民歌的最高成就。"},{"id":"104","stars":"★★★","title":"试比较南北朝乐府民歌的异同","body":"魏晋南北朝时期，全国长期分裂，南朝与北朝长期处于对峙的局面，在政治、经济、文化以及民族风尚、自然环境等方面存在着明显的差异，因而南北朝的民歌呈现出不同的情调和风格。然而政治的对立并没有切断南北方文化的交流，随着北魏、齐梁时代南朝和北朝民歌的相继互传，南北朝乐府民歌在不同民族文化间的冲撞、合和、交融中也表现出一些共同的特性。具体来说，表现在以下方面：\n\n一、南北朝民歌的相同点\n\n（一）具备现实主义精神\n\n从《诗经》、汉乐府到南北朝乐府民歌，现实主义精神是一脉相承的，它表现在对社会生活的真实反映。北朝民歌自不必说，南朝民歌虽然题材狭窄，多哀思情语，可它直接反映的是南朝统治区域下（主要是城市）的民间风俗、社会状况和生活情趣。南朝民歌的形式是浪漫的，可思想内容实际上是现实的。\n\n（二）诗歌形式上同样以体制短小为主\n\n南朝民歌与北朝民歌大多体制短小，以五言四句最为常见（约百分之六十），七言二句也不少，这是诗歌形式的共同点。\n\n（三）都用口语创作，民间风味十足\n\n南朝民歌与北朝民歌都用口语创作，在流传中虽经后代文人修改润饰，但绝大多数民歌文笔浅近、轻快，语言清新、活泼，生活气息浓郁，民间风味十足。\n\n（四）同样是情歌占据主要分量\n\n南朝民歌与北朝民歌中都是情歌占据主要分量。北朝民歌内容虽远较南朝民歌丰富，而爱情与婚姻的歌，仍是数量最多的一种。在情歌中，虽然南朝婉约，北朝直率，南朝曲折，北朝爽利，但无论南朝北朝，它们的歌往往都是天真单纯，大胆简单，毫不伪饰对美好事物的追求，对真挚感情的向往，对幸福与快乐的渴望。\n\n二、南北朝民歌的差异\n\n（一）感情表现上的差异\n\n南朝民歌婉转缠绵，并以哀怨的情绪为主导，而北朝民歌直率粗犷，大胆泼辣，毫不掩饰。\n\n（二）语言风格上的差异\n\n北朝民歌朴素、刚健，富有力感；南朝民歌手法精致，文词清丽，北朝民歌往往直抒胸臆，豪放直爽；南朝民歌则迂回婉转，一唱三叹。另外，南朝民歌中大量地运用双关隐语的特点，为北朝民歌所无。\n\n（三）反映内容上的差异\n\n南朝民歌数量较多，但内容单一，多写男女之情（占百分之九十以上）绝大多数以女子口吻倾诉相思之苦，欢情之娱，负心之恨，盟誓之坚，婚姻之缚，集中反映了城市中下层居民的生活和思想感情；北朝民歌虽在数量上仅是南朝民歌的七分之一，可内容丰富，举凡游牧生活、战争动乱、爱情婚姻、民生疾苦、尚武精神，无不入诗，突出体现了北方民族特殊的风俗习惯和性格气质，广泛地反映了社会生活的各个方面。\n\n（四）创作主体差异\n\n南朝民歌作者皆为汉人，其诗多为歌女或中下层文士所作，同时也混杂着贵族文人的拟作；北朝民歌则为鲜卑、羌、氏、汉多民族创作，并以少数民族为主，用本民族语言写成，在该民族的汉化过程中，经由各阶层民众自行翻译，又在口头传播南朝民歌与北朝民歌虽属同一时代，而内容和风格迥然有别。","keywords":"相同点 现实主义精神 体制短小 口语创作 情歌 差异 感情表现 语言风格 反映内容 创作主体","note":"南北朝民歌的差异，主要归因于当时处于分裂局面，南北对峙，各自的政治、文化都有不同，因而在感情表现、语言风格、反映内容和创作主体上都表现出了区别。不过，二者同样属于民歌，在特征上也有相同点，主要是现实主义精神、体制短小、用口语创作和以情歌为主这些方面。相关内容可以参考王明端《南北朝乐府民歌比较谈》，具体资料可以在李凡文学正版群中领取。"},{"id":"105","stars":"★★★","title":"试分析《木兰诗》的艺术特征","body":"《木兰诗》成功地塑造了木兰这个不朽的艺术形象。木兰的形象，是人民理想的化身，她集中了中国民族勤劳、善良、机智、勇敢、刚毅和淳朴的优秀品质，这是一个深深扎根在中国北方广大土地上的有血有肉、有人情味的英雄形象，在男尊女卑的封建社会里尤其可贵。《木兰诗》在艺术表现手法上表现出如下特点：\n\n一、剪裁精当，结构严谨\n\n《木兰诗》描写有繁有简，剪裁精当而结构严谨。作者根据人物刻画的需要，在广阔的生活背景下展示木兰的形象。从时间上说，长达十多年之久；从地域上说，从家乡，到战场，从朝廷，到故乡，空间十分广阔。如此丰富的内容，本来很费笔墨，但诗歌处理得很好。如开头一段写木兰的问答和买马都很繁，但不如此夸张铺叙就无法渲染人物的紧张心情和战争气氛。又如末段写木兰还家，也很繁，但这里是精雕细琢，通过人物行动来刻画人物性格。十年征戍，艰苦备尝，事情原很多，但作者却写得极简，只用“万里赴戎机”六句三十个字就包举无遗。\n\n二、叙事与抒情完美结合\n\n通过人物的行动和气氛的烘托来刻画人物的心理、性格，将叙事与抒情完美地结合在一起。这是一首叙事诗，但抒情的成分却很浓重。作者虽然没有正面写木兰的相貌和武艺，也没有写她的思想、性格与情感，然而这一切都十分传神地呈现在读者面前。\n\n三、音乐性与表现力强，整体基调生动活泼\n\n诗中复沓、排比、对偶、问答的句式；叠字、比喻、夸张的运用；或叙事、或摹声、或写景，如百川归海，均服务于木兰形象的塑造。排句的反复咏叹，譬喻的新奇幽默等，都加强了诗的音乐性和表现力，有助于人物形象的塑造。诗中既有朴素自然的口语，又有对仗工整、精妙绝伦的律句，但它们在生动活泼的基调上又取得统一和协调。虽然后世文人可能对其有所加工润色，但全诗生动活泼，清新刚健，仍不失民歌本色，不愧是千百年来脍炙人口的优秀诗篇。","keywords":"不朽的艺术形象 剪裁精当 结构严谨 叙事与抒情完美结合 生动活泼 清新刚健","note":"《木兰诗》塑造了木兰这样一个不朽的艺术形象，在男尊女卑的封建社会特别可贵。在艺术手法上，《木兰诗》在追求诗歌艺术性的同时，又不失民歌本色，代表着北朝民歌的最高成就。故此相关内容，我们需要了解一下。"},{"id":"106","stars":"★★★","title":"试分析鲍照诗歌的思想内容与艺术特色","body":"在南北朝诗人中，鲍照的成就是相当突出的，对唐代及以后的诗人产生了重要的影响。具体看来，鲍照诗歌的思想内容与艺术特色，主要表现在以下方面：\n\n一、思想内容\n\n鲍照由于“身地孤贱”，曾经从事农耕，生活在门阀士族统治的时代，处处受人压抑。他在《瓜步山楬文》里曾经叹息说：“才之多少，不如势之多少远矣！”这和左思《咏史》中“地势使之然，由来非一朝”的愤慨不平是完全一致的。他的社会地位和生活经历使他在创作上选择了一条和谢灵运不同的道路。他继承和发扬了汉魏乐府民歌的传统精神，描写了广泛的社会生活，对受压迫的人民表示了深刻的同情。他将满腔的悲愁苦闷之情与怨愤不平之气发而为诗，因而其诗歌的突出内容，就是表现其建功立业的愿望和抒发寒门之士备遭压抑的痛苦，其中充满对门阀社会的不满情绪与抗争精神，代表着寒士的强烈呼声。\n\n二、艺术特色\n\n鲍照体气豪迈，内心又多强烈冲突，更兼受南朝尚美文风的熏陶，故其诗俊逸雄迈，华而不弱，声情气势，贯注全篇，显露出了俊逸豪放，奇矫凌厉的艺术风格，具体来看，主要归因于以下方面：\n\n（一）诗歌中蕴涵昂扬激越之情、慷慨不平之气和难以抑制的怨愤\n\n鲍照诗中往往灌注着不平之气，情绪高亢，词采瑰丽，能给读者以强烈的冲击感。从诗歌的思想内容与情调来看，鲍照以寒士的身份抒发了贫寒之士的强烈呼声，表现为昂扬激越之情、慷慨不平之气和难以抑制的怨愤。他描写边塞战争、征夫戍卒以及游子、思妇和弃妇的生活，反映普通百姓及不幸家庭的悲哀；同情百姓的疾苦，揭露统治者横征暴敛和官僚政治的腐朽等，都是很有特色的。\n\n（二）多创作俗体调的诗歌，笔力跳荡雄肆、酣畅淋漓\n\n从诗歌的艺术形式、表现技巧以及风格特征等方面来看，鲍照的诗歌尤其是乐府诗，多得益于汉魏乐府和南朝民歌的艺术经验。他现存的200首诗中乐府占八十多首，其中有三言、五言、七言、杂言等多种形式；有的是学习汉魏乐府，这些作品的题前多冠一“代”或“拟”字；有的是学习南朝民歌。鲍照在这些俗体调的诗中，又以跳荡雄肆、酣畅淋漓的笔力，尽情发泄孤寒之士慷慨不平的激愤之情，因而被视为“险”或“险急”。","keywords":"广泛的社会生活 深刻同情 备遭压抑的痛苦 俊逸豪放 奇矫凌厉 昂扬激越 慷慨不平之气 怨愤 俗体调 跳荡雄肆 酣畅淋漓","note":"鲍照的文学成就主要集中在诗歌上面，他诗歌主要抒发寒门士子备受压抑的情感，继承了汉魏乐府和南朝民歌的艺术经验，将慷慨不平之气与昂扬激越之情融入诗歌之中，并以乐府诗等俗体调的形式表现出来。相关内容可以参考朱思信《试论鲍照创作的艺术成就》，具体资料可以在李凡文学正版群中领取。"},{"id":"107","stars":"★★","title":"试述鲍照诗歌类型及特点","body":"与同时代的诗人相比，出身贫寒而又沉沦下僚的鲍照，对社会下层的生活有更广泛的接触和更深刻的感受。这在他诗歌中有深刻的反映，这些诗歌也同样传达出寒士们慷慨不平的呼声。\n\n一、描写边塞战争、反映征夫戍卒的生活\n\n描写边塞战争、反映征夫戍卒的生活，是鲍照诗歌内容的一个重要方面，其中也渗透着诗人自己的慷慨不平。如《代出自蓟北门行》着重表现将士们誓死报国的决心和诗人建功立业的愿望，与“梗概多气”的建安诗风颇为接近。又如《代苦热行》，以奇峭而夸张的语言，极度形容征战环境之险恶，以突出士兵们“生躯蹈死地”而荣薄赏微的悲哀，对当政者流露出极度的不满。《代东武吟》写一位征战一生，穷老归来的士兵，怨恨之情溢于言表。\n\n二、描写游子、思妇和弃妇\n\n描写游子、思妇和弃妇的诗，在鲍照的诗中也占相当的比例。这些诗歌的共同特点是哀怨凄怆，细致感人。如《拟行路难》其十三描写征夫思念家人故乡的情怀，其十二则描写了思妇对游子的思念，反映了普通百姓的悲哀。同上第二首（“洛阳名工铸为金博山”）和第九首（“剉檗染黄丝”）是描写弃妇的诗，也同样哀婉感人，颇有汉代乐府民歌的韵味。而其《代白头吟》在弃妇诗中则另创一格，一变《白头吟》原诗凄楚哀怨的情调，对世道人心作更为深刻的揭示与讥刺。诗中更深层的含义，未尝不是诗人不幸身世的自况，寓有对执政者的讥刺和对腐朽官僚的斥责。\n\n三、反映统治者横征暴敛和百姓的疾苦\n\n反映统治者横征暴敛和百姓的疾苦，在鲍照的诗中也占有突出的地位。如《拟古》其六就具有代表性，诗中既揭露了统治者的横征暴敛，也表达出对人民疾苦的同情。鲍照的这些诗歌，显然与《诗经》“国风”及汉魏乐府民歌的传统精神是一脉相承的。\n\n四、山水描写\n\n鲍照的诗歌在山水描写方面也颇有特色。他的山水诗以五言古诗为主，在风格上与他的七言乐府不同，以深秀幽奇、严整厚重为主要特点。如《登庐山》《登庐山望石门》《从庾中郎游园山石室》，都很能体现鲍照山水诗的特点。这些诗讲究对句的工整和词语的雕琢，景致深秀而幽奇。但与他的那些俊逸而朗畅的七言乐府诗相比，不免显得滞重。","keywords":"寒士的强烈呼声 边塞战争、征夫戍卒 游子、思妇和弃妇 横征暴敛和百姓疾苦 山水描写","note":"鲍照诗歌成就极高，类型也极为丰富，涉及的内容囊括多个方面，每部分内容都有其独特的风格，大家要仔细甄别，准确记忆。从总体来看，鲍照的诗歌主要关注的是社会下层的民众，包括征夫、游子、思妇、百姓这些人的遭遇，这也与鲍照的出身和遭际有关，大家要注意掌握。"},{"id":"108","stars":"★★★","title":"试述鲍照的文学贡献","body":"鲍照是南北朝时代最杰出的诗人。他的七言及五言乐府等作品，对唐代李白、高适、岑参、杜甫等诗人有很大的影响。杜甫评论李白、高适、岑参的诗都提到鲍照，绝不是偶然的。鲍照诗歌创作的成就，主要体现在以下方面：\n\n一、推动了乐府诗的发展和流传\n\n鲍照是到南北朝为止创作乐府诗最多的诗人，对乐府诗的发展、流传方面也有突出的贡献。鲍照首创和首存的乐府诗体共有十七个、五十五首，同时，鲍照一改历代五言乐府的传统，开始大量使用七言体、以五言七言为主的杂言体，为乐府诗和七言诗的发展，开辟了广阔的道路。\n\n鲍照乐府诗在题材、内容和思想性上也是出类拔萃的。他在乐府诗创作上的最主要的贡献也正在这一方面。鲍照能从当时的社会现实出发，创造性地运用乐府旧题和自制新题，多方面地反映了那个风云变幻的时代以及广大人民的苦难生活和悲愤情绪。\n\n二、开拓了诗歌题材，把征人思妇之苦，融入边塞题材\n\n鲍照还有大量以边塞征戌为题材的作品，如《代出自蓟北门行》《拟古》其三《代东武吟》等。自《诗经》、汉乐府以来，虽有征人行役之诗，但像鲍照这样集中抒发报国之志，表现边塞风光、沙场激战、征人边愁的诗人，的确不曾有过。自此以后，古代诗歌中边塞的题材范畴基本确立，这是鲍照对诗歌题材开拓的一大贡献。除此之外，把征人思妇之苦，融入边塞题材，亦是鲍照诗的一大特色。\n\n三、创制七言歌行，同时推动了五言诗的发展\n\n鲍照是七言歌行的创制者。在此之前，诗赋中虽偶有七言，但体制未能定型，作者偶一为之。鲍照学习汉魏乐府，于杂言中条理出规律，又变曹丕《燕歌行》逐句用韵为隔句用韵，终于创制了以七言为主的歌行体，从而为七言体诗的发展开拓了宽广的道路。这类诗篇“寓廉悍于藻丽中”，虽借古题，而实自成体，不同于晋人的拟古之作，对唐人影响甚大，鲍照又善作五言。其五言乐府，正合歌行之体，一些五言古诗，更渐趋律化，无论声律、对仗，词藻、意境，已是六朝韵味。鲍照五言中还有一类小诗，“声渐入律，语多华藻，然韵格犹胜”，对后来五言绝句的形成，也是很有影响的。","keywords":"乐府诗的发展和流传 开拓了诗歌题材 创制七言歌行 五言诗发展","note":"南北朝时期，在中国文学史上是一个承先启后的重要转折时期，而鲍照正是南北朝最优秀的诗人之一，因而其势必对当时及之后的诗歌创作产生深远的影响。总体来看，鲍照对诗歌创作的影响涉及内容和形式等多个方面，尤其对唐代诗人产生了重要影响。"},{"id":"109","stars":"★★★","title":"谈谈你对“永明体”的认识","body":"所谓“永明体”，指的是齐梁陈三代形成和发展的一种新体诗。所谓新体诗，是与古体诗相对而言，其主要特征是讲究声律和对偶。因为这种新体诗最初形成于南朝齐永明年间，故又称“永明体”。\n\n一、“永明体”形成的原因：声律论的提出\n\n“永明体”产生的关键是声律论的提出。声律论的提出，是以四声的发现为前提的，而四声的发现，又是以汉末以来音韵学的初步发展为基础的。发现四声，并将它运用到诗歌创作之中而成为一种人为规定的声韵，这就是“永明体”产生的过程。南齐时期，产生了很多有关四声的著作，在对四声的研究的基础上，沈约等人提出了自己的理论，要求对文学作品尤其是诗歌的音节进行调配，对音节之间的搭配作出规定，使之诵读起来具有顿挫变化和音律之美，杜绝音律单调或不协调的现象。由此，形成了“永明体”声律论，推动了“永明体”的形成。\n\n二、“永明体”的特征\n\n对声律的规定是“永明体”诗学的核心。后人将“永明体”声律说总结为“四声”“八病”说。四声是根据汉字发声的高低长短而定的。音乐中按宫商角徵羽的组合变化，可以演奏出各种优美动听的乐曲；而诗歌则可以根据字词声调的组合变化，使声调按照一定的规则排列起来，以达到铿锵、和谐，富有音乐美的效果。与此同时，沈约等人将四声的区辨同传统的诗赋音韵知识相结合，研究诗句中声、韵调的配合，并规定了一套五言诗应避免的声律上的毛病，即“病犯”，也就是后人所记述的“八病”。\n\n三、“永明体”的影响\n\n（一）积极影响\n\n“永明体”的产生，标志着中国古典诗歌的一大进步。四声的发现和“永明体”的产生，使诗人具有了自我掌握和运用声律的自觉意识，它对于增加诗歌艺术形式的美感、增强诗歌的艺术效果，是有积极意义的。经过许多诗人的不断探索，在诗的格律声韵、对仗排偶、遣词用句以及构思意境等方面，都较古体诗更为工巧华美、严整精练。“永明体”使掌握音节调配的规律和自觉进行音节搭配成为可能，为近体诗的定型奠定了基础。\n\n（二）消极影响\n\n就“永明体”声律的规定本身来讲，无疑是不成熟和过于苛细的，从现存的一些资料中，可以看出沈约等人对声律的要求是相当精细繁琐并十分严格的，连“永明体”的代表作家沈约、谢眺等人也不能做到完全遵守，这样死板细致的规定也会给诗歌创作带来过多的束缚。由于过分追求形式的华美，再加上声病的限制，未免产生“文贵形似”之偏和“文多拘忌，伤其真美”之弊。","keywords":"声律论提出 诗学核心 中国古典诗歌一大进步 不成熟和过于苛细","note":"“永明体”诞生的核心是四声的发现及运用，而这些发现，让诗歌的音节和谐流畅，具有音韵美，为后来格律诗的成熟与繁荣，尤其是唐代诗歌的辉煌奠定了基础，对声律的规定也就成了“永明体”的诗学核心。不过，由于“永明体”规定过于苛刻，所以会对诗歌创作产生一定的束缚，大家对此也要注意。"},{"id":"110","stars":"★★","title":"试分析沈约文学成就","body":"一、推动了“永明体”的产生\n\n在“永明体”产生的过程中，沈约所起的作用是不可忽视的。沈约等人将四声的区辨同传统的诗赋音韵知识相结合，研究诗句中声、韵调的配合，并规定了一套五言诗应避免的声律上的毛病，即“病犯”，也就是后人所记述的“八病”，为后来诗歌繁荣做出了很大贡献。\n\n二、整体风格“长于清怨”，在“永明体”诗人中成就突出\n\n在“永明体”的诗人之中，沈约在当时甚有名望，诗歌成就也较为突出。锺嵘《诗品》以“长于清怨”概括沈约诗歌的风格。这种特征主要表现在他的山水诗和离别哀伤诗之中。\n\n（一）山水诗具有清新之气，透露出一种哀怨感伤的情调\n\n与同时代的二谢等人相比，沈约的山水诗并不算多，但也同样具有清新之气，不过其中又往往透露出一种哀怨感伤的情调。如《登玄畅楼诗》写景清新而又自然流畅，尤其是对于景物变化的捕捉与描摹，使得诗歌境界具有一种动态之势。诗人以登高临眺之所见来烘托“离群客”的孤独形象，从而将眼前之景同“归心”融为一处。又如其《秋晨羁怨望海思归》，全诗境界阔大高远，给读者展示出天水一色、烟波浩渺的海天景色。结合诗题来看，海天的空旷辽远，正反衬出“羁怨”之情与“思归”之念。此类诗歌在齐梁山水诗中，亦不失为上乘之作。此外，像“日映青丘岛，尘起邯郸陆”等描写山水的诗句，皆令人耳目一新。\n\n（二）离别悼亡诗“清怨”色彩更加突出\n\n沈约的离别诗也同样有“清怨”的特点，如最为后人所称道的《别范安成》，将少年时的分别同如今暮年时的分别相对比，已经蕴含了深沉浓郁的感伤之情；末二句又用战国时张敏和高惠的典故，更加重了黯然离别的色彩。全诗语言浅显平易，但情感表达得真挚、深沉而又委婉，在艺术技巧上具有独创性。\n\n沈约的悼亡怀旧之诗，“清怨”的色彩更加突出，如《悼亡》诗，诗的前半以大自然的永恒来反衬人生易逝、一去不返的悲哀；后半将悲伤的情感同凄凉的环境融为一处，情状交现，悲怆靡加。除离别哀伤之作外，沈约的抒怀之作如《登高望春》《古意》《伤春》《秋夜》，以及乐府诗《临高台》《有所思》《夜夜曲》等，在沈约集中皆为上乘之作，而且也都具有“清怨”的风格特征。","keywords":"“永明体”产生 长于清怨 离别诗 悼亡怀旧之诗","note":"沈约的文学成就，主要集中在文学理论和文学作品两个方面。文学理论方面可以结合“永明体”相关内容进行理解。在诗歌艺术上，沈约处于南朝皇权渐趋复归但新型君臣关系正在调整的历史节点，善隐自身的处世方式让他善于压制、淡化、冷却激烈的情绪，这导致其诗具有“清怨”特色。"},{"id":"111","stars":"★★★","title":"试述谢眺诗歌的思想艺术特征","body":"“永明体”的代表诗人谢眺，不仅在“竟陵八友”中最为突出，而且也是齐梁时期最为杰出的诗人。谢眺是“永明体”的积极参与者，他的诗清新秀丽，音节和婉，具有“永明体”诗歌的共同特征。其于隶事、对偶、声律、辞藻的运用，不独趋于圆熟，有的作品更渐入化境。谢眺的诗歌创作，主要具备如下特征：\n\n一、音节和婉，朗朗上口\n\n谢眺曾说“好诗圆美流转如弹丸”，他的诗歌创作就体现了这一审美观念。要达到“圆美流转”，语言的清新流畅与声韵的铿锵婉转是十分重要的因素。他将讲究平仄四声的永明声律运用于诗歌创作之中，因此他的诗音调流畅和谐，读起来朗朗上口，铿锵悦耳。\n\n二、写景细腻，推动了山水诗的发展\n\n谢眺最突出的贡献，是对山水诗的发展和对新诗体的探索。他的诗写景细腻，在谢灵运之后把山水景物题材诗歌的创作推向了新的高峰。在山水诗方面，他继承了谢灵运山水诗细致、清新的特点，但又不同于谢灵运那种对山水景物作客观描摹的手法，而是通过山水景物的描写来抒发情感意趣，达到了情景交融的地步。与谢灵运相比，谢朓新体诗中的写景更为自然流畅，没有谢灵运山水诗语言生涩的问题，也少有谢灵运诗中常常出现的情景脱节的现象和玄言结尾。从而避免了大谢诗的晦涩、平板及情景割裂之弊，同时还摆脱了玄言的成分，形成一种清新流丽的风格。\n\n三、善于熔裁警句\n\n同谢灵运一样，谢眺也是一位善于熔裁警句的好手，他笔下的警句对仗工整，和谐流畅，清新隽永，体现了“新体诗”的特点，皆似一幅幅萧疏淡远的水墨画，高雅闲淡而又富于思致。\n\n四、小诗创作语言清新，音调和谐，情致含蓄，富于南朝民歌的气息\n\n谢朓的一些短诗也很出色，这些小诗不仅语言清新，音调和谐，情致含蓄，而且还富于南朝民歌的气息，十分耐人寻味。同时它们对后来五言绝句的形成和发展也有一定影响。\n\n谢朓是“永明体”的代表诗人，他不仅在当时就享有盛名，而且对后来唐诗的繁荣也有着相当深刻的影响，甚至像李白和杜甫那样的诗歌巨匠也为之倾倒，足以显示他在中国诗史上的重要地位。","keywords":"音节和婉 写景细腻 山水诗的发展 新诗体的探索 熔裁警句 对仗工整 南朝民歌的气息","note":"谢眺是“永明体”代表诗人，也是“永明体”的积极实践者。他秉持着“好诗圆美流转如弹丸”的审美观念，对山水诗的发展和新诗体的探索都做出了巨大贡献，并对唐代诗人产生了很大的影响。需要注意的是，“大小谢”是较常出现** --- 的一个名词解释，大家要注意一下。“永明体”的积极实践者还有何逊，不过在考查中出现相对较少，具体题目可以在李凡文学正版群中查看。"},{"id":"112","stars":"★★★","title":"谈谈你对宫体诗的认识","body":"所谓宫体诗，指的在内容上以宫廷生活为描写对象，主要题材为咏物与描写女性；在艺术上注重词藻、对偶与声律的一类诗歌，是梁朝后期到陈朝的诗坛主流，以萧纲、徐摛为代表诗人。\n\n一、宫体诗流行的原因\n\n（一）市井风习流入宫廷\n\n南朝皇室皆行伍出身，来自社会下层，入主皇宫后，在过着奢侈糜烂宫廷生活的同时，仍留恋、学习市井之风习。而南朝以来流行的市井歌词及文人歌诗，尤多侧艳之风，其对梁陈宫体诗的形成，影响相当深刻。\n\n（二）适应的统治者生活情调\n\n南朝设有乐府机构，曾采集大量的民歌配乐演唱，以满足统治者纵情声色的需要；统治者及宫廷文人也有润色或拟作新声歌曲的习惯。而那些发自男女恋情的歌唱，正适合于统治者的生活情调，自然更能得到他们的青睐。\n\n这样一来，南朝民歌便从市井进入了宫廷。经过统治者及宫廷文人的润色修改、拟作和进一步的创作发展，宫体艳情诗到了南朝梁、陈之世便达到了高潮。\n\n二、宫体诗的特征\n\n（一）以宫廷生活为描写对象，题材上以咏物和描写女性为主\n\n从题材内容来看，宫体诗描写范围比较狭窄，数量最多的是咏物诗和描写女性的作品。咏物诗多咏身边细物，以铺排词藻典故为主；这些诗的共同特点是内容贫乏，单纯咏物而毫无寄托，只讲究词藻与对偶，均以浓重华丽的词藻和工整的对偶形式，纤细地描摹物形物态，显得琐屑而无生气。\n\n女性题材的作品则多客观描写女性的外貌、情态、体态等，可以说，他们对女性的审美观照同对器物的审美观照的心理是一样的，因而在情调上伤于轻艳，风格上比较柔靡缓弱。在描写女性的诗歌当中，绝大部分是将目光停留在女性的生活团内，有将女性物化的倾向。\n\n（二）注重词藻、对偶与声律\n\n从形式上来看，宫体诗进一步发展了自“永明体”以来对诗歌音韵和对偶的重视，对偶精工、语言华美。“永明体”诗人强调对偶、音律，沈约、谢朓等人还写过很多咏物诗和一些艳情诗，这些都可以看作是宫体诗风的滥觞。徐、庾、萧纲等人在此基础上变本加厉，更加强调诗歌形式的美。\n\n三、对宫体诗的评价\n\n（一）第一次大规模描写女性外在美，具有重情倾向，突破了诗歌传统\n\n宫体诗在内容和格调上的缺点是明显的，范围狭窄、格调不高，甚至个别作品格调低下，艳情描写露骨。但也应看到，在我国古代文学史上，宫体诗第一次大规模地描写女性的容貌、体态等外在美，萧纲本人论文也有重情的倾向，这些是宫体诗对诗歌传统的突破。\n\n（二）积累了大量的经验，是古体诗向近体诗演进中不可或缺的一环\n\n从形式技巧上说，“宫体诗”积累了大量的经验，是古体诗向近体诗演进中不可或缺的一环。宫体诗发展了吴歌西曲的艺术形式，并继续了“永明体”的艺术探索而更趋格律化。如萧纲的《采菱曲》、徐摛的《咏笔》已基本合律。这类诗在体诗中所占的比例是相当大的。这说明官体诗对后来律诗的形成有着重要的推动作用。至于宫体诗语言的风华流丽、对仗的工稳精巧以及用典隶事等方面的艺术探索和积累，也同样为唐代诗人提供了足资借鉴的艺术经验。","keywords":"市井风习 生活情调 咏物 描写女性 词藻、对偶与声律 突破诗歌传统 古体诗向近体诗演进","note":"宫体诗是从民间歌曲发展而来的，因而在形式与情感上受到了相应的影响。宫体诗主要表现宫廷生活，只注重词藻、对偶与声律，内容贫乏、低俗，但它发展了吴歌西曲的艺术形式，继续了“永明体”的艺术探索，推动了由古体诗向近体诗的演进，也有其相应的价值。"},{"id":"113","stars":"★★","title":"谈谈南北文风的交融","body":"一、南北文风交融的原因\n\n（一）人才分布不平衡导致文学发展不平衡\n\n就文学发展的不平衡状况而言，是南方优越，北方滞后。这与文学人才的分布有关。永嘉之乱以后，北方人口大规模流徙，其中流向南方的最多，流向东北的次之，流向西北的又次之。这是构成南北各方文化实力悬殊的基本因素。当时有识之士对各地优异人才的出现，深为敏感，而在南北各政权之间，随着对峙形势的进一步形成，文化方面的竞争更加明显。南北文化彼此都构成一定的激励与影响。\n\n（二）南北文学出现地域性特征\n\n为适应各自政权的需要，北方汉化的少数民族政权对文化传统的选择利用不尽相同，这就导致各个政权在文化上的差异。政权对峙与文化多元凸显出文学的地域性特征，这是南北文风差异的基本情况。\n\n二、南北文风交融的途径\n\n这一时期南北文化的接触与交流仍然是广泛而深刻的。通过使臣往来、士人流寓等途径进行的人才与文化交流逐渐促进了南北文风的交融。\n\n（一）使臣往来\n\n从中国历史上看，列国使臣的职能，主要表现为才辩与文学修养。相对来说，在风云变幻、利害冲突之际，使臣的辩才显得更重要。而在谋求交好、互观风俗之时，使臣的文学修养能带来特殊效果。在南北朝后期，作为一种风气，具备文雅之才已成为南北聘使人选的必要素养。双方才俊之士的直接交往，在很大程度上促成了文学上的相互学习与竞争。\n\n南北双方对聘使的观感与期待，往往反映各方文化实力乃至文化心理的变动。在宋、齐与北魏时期，南方使臣入北后较易受到北人的称美，北方使臣南来时羡慕南方文化；而在梁、陈与东魏、北齐时期，南北使臣彼此各有争锋，北人的才学渐与南人抗衡。\n\n（二）士人流寓\n\n因割据政权之间的战事而羁留使者，掳掠人才，或因政治倾轧而逃奔敌国，这种楚才晋用的方式，在客观上也造成南北之间的交流。前后流寓北方的南人，较有诗才的有奔至后秦的韩延之，至北魏的王肃、萧琮，至东魏的萧祗，至北齐的荀仲举等。南方许多才士以及著作流入关中，加速了南朝文学的北传。\n\n当然，在南北接触中作用更大的，还是迁入北方的文士。宇文氏政权注意任用南人，不惜强留。庾信、王褒被强留北方，终身未归，这是分裂时代才有的特殊人生。不过，如此刻骨铭心的苦楚遭遇，竟嫁接出兼具南北之长的文学硕果，似乎是历史给予的一种补偿。","keywords":"文学发展不平衡 激励与影响 使臣往来 士人流寓 迁入北方的文士","note":"南北文学成就的不平衡有其历史原因，但南北文化逐渐交融则主要是由于当时分裂割据的政治格局。在这种格局下，不同政权之间在保持对峙的同时，文化也在通过多种方式互相影响和激励，最终完成了交融。"},{"id":"114","stars":"★★★","title":"试分析庾信诗文创作的思想艺术特征","body":"庾信是南北朝后期最著名的文学家，他由南入北的经历不仅使个人的创作发生了明显的变化，也影响了当时北方文学的发展。他的一生，以42岁出使西魏并从此流寓北方为标志，可分为前后两期。\n\n一、前期：形式优美，但题材狭窄、内容空洞\n\n庾信早期的作品留下的不多，创作带有典型的南方文学特点，风格清靡，文辞富丽精工，注重用典，诗歌题材主要有咏自然景物、咏身边的物品和与女性有关的题材，有鲜明的宫体文学的印记，早期辞赋流传下来的都是奉教或应和之作，情调偏于轻靡。还有一些应用文，与同时期的骈文风格一致，注重对偶和用典，内容空泛，形式精美。总体来看，庾信的早期作品优点和缺点都非常明显，优点是形式优美，缺点是题材范围狭窄、内容较为空洞。庾信的文学创作代表了当时南方文学的最高水平。\n\n二、后期：以乡关之思发为哀怨之辞，情感深切，笔调苍凉\n\n庾信以使臣身份出使长安，因江陵陷落而不得南归，他“虽位望通显，常有乡关之思”。他以乡关之思发为哀怨之辞，蕴含丰富的思想内容，充满深切的情感，笔调劲健苍凉，艺术上也更为成熟。\n\n（一）思想内容：乡关之思\n\n（1）感伤时变、魂牵故国，是其“乡关之思”的一个重要方面。庾信遭逢亡国之变，内心受到巨大震撼。这种沧桑之感，使他更深刻地意识到个人命运与国家命运之间的密切联系。因此，他在抒发个人的亡国之痛时，也能以悲悯的笔触，反映人民的苦难，并归咎于当权者内部的倾轧与荒嬉。\n\n（2）叹恨羁旅、忧嗟身世，是其“乡关之思”的另一重要方面。庾信文儒传家，“门有通德”，仕北以后无法排解名节玷污的煎迫，将内心的惊辱形容为“倡家遭强聘，质子值仍留”，责备自己仕于敌国为“遂令忘楚操，何但食周薇”。他的羁旅之恨与忧生之嗟是交织在一起的。\n\n（二）艺术特征\n\n（1）刚健清新与深沉雄健风格的出现\n\n北方有完全不同于南方的自然环境和社会环境，庾信入北之后，这些内容都不可避免地出现在他的作品中，不仅拓宽了庾信作品的表现范围，描写对象本身的固有特点，也影响到了作品本身的风格，壮阔的北国风光给作品带来了刚健清新之气。庾信此时的一些写从军、游猎的诗也多深沉雄健。\n\n（2）沉痛悲凉的感情基调\n\n庾信在北方的生活给他带来了深切的耻辱、悲痛，他后半生的很多作品也都带有沉痛悲凉的感情基调。这些抒发自身切肤之痛的作品自然与前半期作品风格相去甚远，而与北方文学沉厚壮阔的风格有一定程度的暗合，尽管庾信采用的仍然是惯用的南方文学的形式技巧，但作品风格已显然不同。\n\n由南入北的经历，使庾信的艺术造诣达到“穷南北之胜”的高度，这在中国文学史上具有重要的典范意义。庾信汲取齐梁文学声律、对偶等修辞技巧，并接受北朝文学的浑灏劲健之风，从而开拓和丰富了审美意境，为唐代新的诗风的形成做了必要的准备。","keywords":"前后两期 前期 形式优美 后期 乡关之思 感伤时变 魂牵故国 叹恨羁旅 忧嗟身世 刚健清新 深沉雄健 沉痛悲凉","note":"庾信的诗歌风格，以他流寓北方为界，被分为前后两期。前期诗歌主要供君王消遣娱乐，内容浅薄；后期诗歌由于其自身遭遇，在内容和情感上都出现了长足的发展，最终“穷南北之胜”，取得了极高的成就。故此，杜甫才评价道“庾信文章老更成”。"},{"id":"115","stars":"★★★","title":"论述庾信《拟咏怀二十七首》的特点及其诗史地位（26山东大学）","body":"《拟咏怀二十七首》是庾信后期诗歌创作的代表，这一组诗虽非一时之作，但全面地反映了一个亡国者痛苦的精神世界.\n\n一、思想艺术特色\n\n（一）思想内容：乡关之思\n\n《拟咏怀二十七首》这一组诗虽非一时之作，但全面地反映了一个亡国者痛苦的精神世界。其中乡关之思是诗人反复吟咏的主题。如其七借流落胡地、心念汉朝的女子，比喻自己仕北的隐恨与南归的渴望，真挚感人。而其十八这篇中，既有不能为国建勋的失意之悲，更有韶华已逝、瞬息衰秋的失志之恸，因而无法给自己留下排遣或超脱的余地。执着家国是自古以来的人生大节，爱情的痛苦可以解脱，仕途的失意可以超越，甚至死亡也可以漠然视之，唯有亡国之痛难以摆脱，后期庾信面临的正是后一种困境。\n\n（二）艺术特色\n\n《拟咏怀二十七首》的艺术特色，主要表现在以下方面：\n\n（1）用典上妥帖深微\n\n从用典上看，《拟咏怀二十七首》中典故较多，庾信用古人境遇比照当下的时局和自己的处境，而且多用“非”“未”“徒”来反增一层意思，加重了感伤之情。如第一首中使用阮籍和嵇康以饮酒和弹琴忘记世间忧愁的典故，庾信却用两个“未”否定，身处乱世的自己不能饮酒弹琴弃绝人事，困于尘俗，是比阮籍、嵇康更深的痛苦。最后一句又用崔骃劝谏窦宪不成辞官而归的典故，庾信用以写自己的相同心境，以反问句结束更加深了消沉的心情。\n\n（2）篇章错落有序、互相对仗、遥相呼应\n\n《拟咏怀二十七首》为组诗，每几首诗相当于一章，每几行诗相当于一节，彼此之间错落有序、互相对仗、遥相呼应，共同谱写出一组或起伏跌宕，或层层递进的奏鸣曲。诗中有大量的像“吴起尝辞魏，韩非遂入秦”这样的对仗方式。除此之外，诗行间也多有对仗，如“横石三五片，长松一两株”，无论在名字、量词、数词的对应上都非常完美，\n\n（3）主客观内容达到高度统一，使诗歌境界得到升华。\n\n在《拟咏怀二十七首》中，庾信将自己落寞悲凉的心情融入北方萧索疏淡的景色中，主客观内容达到高度统一，升华了诗歌的境界。《拟咏怀二十七首》写在周的乡关之思和人生的不得意。从意象上看，多用有萧瑟之气的景象入诗，如“秋风”\n\n“寒水”“苍梧”“荒城”“残月”等。如第一首连用四个萧瑟的意象，用失水之鱼和离群之雁自比，用突变的风云喻江陵陷落，用松竹喻有节之士，但自己去梁仕周，已经失节，所以说松竹悲吟。\n\n二、诗史地位\n\n庾信的《拟咏怀二十七首》，处于六朝诗风向唐诗风转型的关键节点，是南北文风交融的产物，其在诗史发展进程中具有承前启后的重要地位，集中体现在以下方面：\n\n（一）承前：革新了拟古诗创作范式，推动了拟古诗的成熟\n\n在庾信之前，拟古诗创作多停留在字句摹仿、格调沿袭的浅层层面，往往沦为机械仿古、应景酬唱之作，缺乏独立的精神内核与艺术风骨。庾信《拟咏怀二十七首》是诗人在经历了国破家亡之巨变后的忧愤之作，他是通过“拟古”将沉重的寄托引入诗歌中，从而创作了诗风骨力雄厚的作品，他的拟古诗已经完全脱离了逐句逐字的模拟，不仅借古事古意写今人今事，抒发自己的情感，还在模拟的过程中，凸显自己的创作风格，这是拟古诗创作上的一大进步。\n\n（二）启后：感情真挚，为中晚唐现实主义诗歌树立了良好的典范\n\n《拟咏怀二十七首》反复回环，苍凉沉郁，是庾信晚年的力作，“既有对故园的怀念，也有对梁朝君臣失国的伤悼，更多的是自责、自叹和淡泊自守之情的抒发”。它摒弃了南朝诗歌绮靡浮艳的文风，以苍凉沉郁、反复回环的笔触，书写乱世文人的真实境遇与精神困境，兼具故园之思、亡国之痛、身世之叹，情感真挚醇厚、沉挚质劲，重塑了诗歌的现实主义精神内核。庾信这类诗作对中唐、晚唐现实主义诗派的诗人白居易、元稹、皮日休、陆龟蒙等有明显的启发意义。\n\n总体看来，庾信的《拟咏怀二十七首》感情真挚，艺术成就突出，是拟古诗创作的一个飞跃，具有承前启后的重要意义，对后世现实主义诗歌具有重要的影响。","keywords":"思想内容 乡关之思 艺术特色 用典 篇章错落有序 主客观高度统一 诗史地位 推动了拟古诗发展 对中晚唐现实主义诗歌创作有重要影响","note":"庾信的《拟咏怀二十七首》是庾信后期的重要作品，这一组诗摹拟的是阮籍的《咏怀》诗，但却融入了庾信的文学个性，从内容来看，主要表达了作者被迫滞留北方而产生的乡关之思，从形式上看，用典贴切，结构工整，情景完美融合，对于拟古诗的发展和现实主义诗歌创作都有着重要的影响。"},{"id":"116","stars":"★","title":"谈谈“三曹”文章的艺术特征","body":"刘勰用“气爽才丽”一语评论魏之三祖，“气爽”与“才丽”的结合，其实也是建安群才的共同特点，其中曹植在表现“盛藻”方面尤为突出。总体看来，“三曹”文章的艺术特征主要表现在以下方面：\n\n一、曹操：“清峻”“通脱”的散文风格\n\n曹操是“改造文章的祖师”，他的诗、文，都能突破前人的思想传统，放言而无所顾忌，形式亦自由随便。曹操的散文不拘一格，只是用简洁朴素的文笔自由直率地写出要说的话，打破了两汉骈俪典重的趋势，行文中常有一股真率通脱之气，自有鲜明的个性。这种“清峻”“通脱”的散文风格表现了建安散文的新风貌，对魏晋散文的发展有重要的影响。\n\n作为政治家，为了以文章经世，曹操便注重实用功利，在建安各体文章中，他的教令甚具异彩，饶有通脱之风。诏令之体，属于庙堂之制，在两汉时期，这种体制的文辞庄重典雅。曹操所作诸令，不但思想无所顾忌，而且行文风格也不拘常例。\n\n二、曹丕：敏感而多情，文章具有清丽纤弱、便娟婉约的风格\n\n曹丕敏感而多情，常于广坐欢宴之时，突然兴起一股悲情。纤细的情思使他能够体察事物细微的变化，并常为时节的更替、友人乃至陌生人的凋零而落泪。他又极善于选用清丽的词句、绵婉的韵律，所有这些使得曹丕非常适合于创作为游子思妇代言的诗歌，从而形成清丽纤弱、便娟婉约的风格。他的文章也具有同样的特点，特别是他的书信，直抒胸怀，别具感人的力量。他的《与吴质书》《又与吴质书》悼念亡友，凄楚感人，对后来短篇抒情散文的发展是有影响的。曹丕这些散文表现了建安散文通脱自然的共同倾向，但又具有自己清丽的特色。\n\n三、曹植：兼善各类文体，骈俪化倾向较强\n\n曹植在诗歌之外，兼善各类文体。辞赋方面发扬汉末以来抒情小赋的传统，《洛神赋》为传世名篇，以人神之恋隐喻君臣之际，词彩清丽，音韵和协，具有浓郁的诗意。与其兄曹丕相比，曹植的文章更扬厉雄放，这种发扬蹈厉、睥睨天下的姿态，当然与其才高气壮、自视甚高的个性有关。曹植的文章骈俪化倾向较强。但他的骈偶来得使人不觉，不像后来的四六文那样整饬，而是三、四、五、六言并用，且杂以散句，故整齐中不乏气势，字句间饱含情感，处处体现着他“骨气奇高，词彩华茂”的特点。\n\n从总的趋势上看，建安之文亦有从辞清志显到藻饰渐繁的过程，这也预示着此后美文的发展。不过，即以书体而言，建安诸家尚情任气、真挚自然的作风，此后犹不乏继武者。","keywords":"“清峻”“通脱”清丽纤弱 便娟婉约 兼善各类文体 骈俪化倾向","note":"建安文风“以气质为体”，更加注重个性的表现。这其中，比较重要的便是“三曹”，他们不但在诗歌创作上取得了突出成就，而且在文章创作领域成就也不俗。曹操的教令和曹丕、曹植的书札，各具特色，显示出文学魅力，大家要有所了解。"},{"id":"117","stars":"★★","title":"魏晋文坛具有怎样的艺术特色","body":"沈约将建安文风的特点归纳为“以气质为体”，气质体现为个性。文学不再是经学的附庸，褪去了政教的色彩，更注重个性的表现。曹丕提出“文以气为主”的命题，适时地反映了当时人对文学特性的认识与追求。这种文学取向，具有划时代的意义。乐观、悲观、慷慨、颓放、自得、内疚，各种沉潜的或稍纵即逝的感悟倾注于笔端，因而这个时期的文学从总体上说较之于两汉，更具有一代人精神史料的价值。\n\n一、新鲜生动\n\n建安文学的时代风貌，首先在诗歌中得到集中体现，即如刘勰所言“慷慨以任气，磊落以使才”，这是无疑的。不过，辞赋、书信、诏令等其他文体的创作，也流露出一种新鲜生动的气息，既表现为对旧体裁的改造，也表现为强化应用文的文学性，从而下开其后文章创体增类、标能竞才的风尚。\n\n二、“气爽”与“才丽”结合\n\n正如刘勰用“气爽才丽”一语评论“魏之三祖”，“气爽”与“才丽”的结合，其实也是建安群才的共同特点。其中曹植在表现“盛藻”方面尤为突出，伴随着“诗赋欲丽”说的提出，“丽”的审美要求不局限于诗赋，也影响到书表铭颂论说等其他体裁，从而大大加速了东汉以来文章渐趋骈化的进程，推动骈文臻于成熟。就建安文章而言，由于注重“气质”，故对藻饰的讲求尚能情辞相称，这也为后世确立了“以情纬文，以文被质”的典范。\n\n三、辞赋生机焕发\n\n由于主体意识和抒情因素的强化，魏晋时期涌现出一批体物写志的佳作。除此之外，辞赋生机的焕发，还表现在大赋的体式功能得到一定的调动。魏晋以来，大赋仍有表现严正重大题材的习惯，不过与汉代不同的是，它已不限于国家政治生活之一端，更多更重要的是个人生活中的大事，汉大赋多有以“乱”“诗”“歌”等形式系之文末的，但一般说来，这类文字的声情之美游离于主体结构之外，而魏晋以后的大赋则倾向于有意识地在主体结构中汲取诗意，不少中长篇作品的命题就取自诗骚或抒情小赋。\n\n四、各种思想交锋争辩，成为一时风尚\n\n魏晋学术，一改汉代儒术独尊的局面，刑名、老庄之学兴盛，道佛二教亦各有发展，从而形成继春秋战国以后又一个思想活跃期，各种思想交锋争辩，成为一时风尚。谈辩之风也影响于文章，如赋体出现辩难之作以及以思理见长的作品，包括探讨玄学或寄寓佛理。但最能凸现这一时期论辩风采的，则是论辩文。单篇说理之文，虽起于汉代，但受特定时代学术风气的激荡，论辩文至魏晋才出现高潮，这表现在两个方面：一是主题广泛，主要有研寻哲理、衡论宗教、品藻人物、针砭风俗、讨论礼制等内容；二是名家辈出，并形成具有时代特征的风力。","keywords":"以气质为体 新鲜生动 气爽才丽 大赋体式功能调动 思想活跃期","note":"魏晋时期“以气质为体”，总体追求个性，对诏令、书信、辞赋等文体的内容和体式方面都做出了创新，呈现出了一股新鲜生动的风气。除了“魏之三祖”之外，魏晋南北朝时期比较重要的散文家还有“元嘉三大家”，相关题目可以在李凡文学正版群内查看。"},{"id":"118","stars":"★","title":"齐梁文学的“新变”体现在哪些方面","body":"齐梁时期，文学的“新变”意识更加突出，对于文章体貌深有影响。这主要表现在如下三个方面：\n\n一、永明声律说兴起\n\n《南史·庾肩吾传》：“齐永明中，文士王融、谢朓、沈约文章始用四声，以为新变。”其“新变”的意义是揭示四声协调的规则，并自觉运用到诗文创作上，从而变以往自然的巧合为人工的声律，开启诗文格律化的道路。永明声律说对诗体转变的影响特著，形成了所谓“永明体”；而对文章的韵律之美也起着强化的作用，文章写作更注重声调谐和之美。\n\n二、文笔之辨的深入\n\n对于文笔的辨别，发生于宋齐时期。颜延之认为：“笔之为体，言之文也；经典则言而非笔，传记则笔而非言。”肯定“笔”的文学性，并将经典与文笔分别对待，反映了文学的自觉意识。至于文与笔如何区分，正如刘勰所述：“今之常言，有文有笔，以为无韵者笔也，有韵者文也。”有韵与否是当时通行的一个标准。不过，随着宋齐以来美文的衍化，原来无韵的文体也或多或少地显出韵律上的经营，笔与文既有区别又有沟通。梁时萧绎重新提出对“文”的界定：“至如文者，惟须绮縠纷披，宫徵靡曼，唇吻遒会，情灵摇荡。”这对原来文笔之辨的纯形式标准有所超越，而且由于追究的是“文”的实质，因而是兼容文笔而言，如任防、陆倕之笔就被视为上乘之“文”。\n\n三、不拘常体的呼声\n\n萧子显在《南齐书·文学传论》中提出：“若无新变，不能代雄。”他本人在创作上也有探求新变的具体实践。其《自序》称：“少来所为诗赋，则《鸿序》一作，体兼众制，文备多方，颇为好事所传。”这里反映出处理文体的灵活姿态。张融更尖锐地宣称：“夫文岂有常体，但以有体为常，政当使常有其体。”“常体”往往意味着从前代作品中归纳出的定式，而他所欣赏的却是“不阡不陌，非途非路”以及“不文不句”的创作方式。这种意识也是以齐梁文学较善于创变为背景的。","keywords":"永明声律说 文笔之辨 不拘常体","note":"齐梁时期的文学新变较之前更加深入，提出了许多相应的文学理论，在声律、文笔和体裁上都提出了许多新的要求，促进了文学的进一步发展，相关内容可以结合这一时期的创作进行理解。"},{"id":"119","stars":"★★","title":"试分析《水经注》独特的写景艺术","body":"郦道元深受北方山水之美的陶冶，他从山水之美中得到“畅情”“游神”的体验。《水经注》中关于江南水道风景的描摹，文学意味更为浓郁。具体看来，《水经注》独特的写景艺术，主要表现在以下方面：\n\n一、自然景观与人文景观的和谐统一\n\n《水经注》既写自然景观又写人文景观，是自然景观与人文景观的交相辉映，和谐统一。无论是人文景观，还是自然景观，《水经注》中俯拾即是，处处皆景。可以说，《水经注》是古今第一部以水道为经，以人文景观和自然景观为纬，规模宏大、结构谨严的写景散文。《水经注》中自然景观和人文景观的和谐统一，有三个层次：\n\n（一）就整部《水经注》而言，有的部分描绘了人文景观，有的部分则摹写了自然景观，二者相间而出，错落有致。\n\n（二）就对某一地的风景来说，往往既有人文景观的描写，又有自然景观的描绘，二者水乳交融，交相辉映。这一点主要体现在那些游踪清晰的写景片段中。\n\n（三）《水经注》中自然景观和人文景观的和谐统一，还表现在：即使只写自然景观，但由于引入了人文内容-和景观相关的人类活动，此时的自然景观不再只是自在自为的纯自然景观，而是具有人文内涵而富有人文景观意义的自然景观，是自然景观与人文景观的高度融合。\n\n二、善于借用民歌、谣谚、故事传说、诗、赋、文等辅助写景\n\n南朝的山水文作家如鲍照、吴均等人，他们在模山范水时，都是对景物进行单一的直接摹写。而郦道元则不同，他是一位写景圣手，除了善于直接写景以外，还善于借用民歌、谣谚、故事、前人诗赋文等辅助写景。这是《水经注》又一显著的特异的写景艺术。\n\n《水经注》中的写景，有时和故事传说联系起来，借用故事写景。此外，书中大量自然景观的描写，往往还借助于民歌、谣谚。这些歌谣除和描写之景互相印证之外，不仅可起到进一步加强文义，渲染气氛，增强表达效果的作用，甚至有时还能画龙点睛，有效地补充作品的未尽之意、未抒之情。即使是引用前人之诗文来辅助写景的也不乏其例。\n\n三、善于抓住景物的特征，多视角运笔，把山水描绘得极富个性\n\n《水经注》中写山，往往从远视角“拍照”，突出山形的特征，把各山写得形态毕现，形象逼真，个性凸显。此外，描山绘水，还善从色彩着眼，描画出一幅幅绚丽多彩的山水图，给人以色彩美、图画美的审美享受。即使描绘极为相似的景观，比如同样是写山之高峻、路之奇险，也照样能将它们各自的不同特点一目了然地展现给读者。","keywords":"和谐统一 辅助写景 极富个性","note":"《水经注》不仅具有文献学价值，而且在山水散文艺术上成就不俗，并且影响了后世山水散文的创作。尤其是在写景方面，郦道元对之前文人的写景手段进行了革新，给人以更加丰富的体验。相关内容可以参考徐中原《试论（水经注＞独特的写景艺术》，具体资料可以在李凡文学正版群内领取。"},{"id":"120","stars":"★★","title":"试分析《洛阳伽蓝记》的创作特征","body":"杨衒之的《洛阳伽蓝记》一书，是北朝文坛上的旷世杰作。《洛阳伽蓝记》一书尽管不乏前导，实际上却因其富于创和个人才情，而成为现存文史典籍中寺塔记的典范之作。它所达到的高度、享有的声誉，后继的若干同类撰述都难企及。这本书的创作特征，主要表现出以下几点：\n\n一、正文与子注相配的结构方式\n\n《洛阳伽蓝记》在结构上采用魏晋南北朝时期佛书合本子注之体，即正文与子注相配的方式，把博洽的内容组织得有条不紊。《洛阳伽蓝记》一书的材料来源主要是杨衒之本人亲目所见，所以杨衒之记述起洛阳伽蓝总是娓娓道来。但是，他并不以此为满足，而是广泛地运用史料并加以考订，抚今追古，使每一个场景、每一件史实，都带有历史的厚重感。书中所征引的材料，有民歌谣谚、书信、诗赋、碑铭以及自己的考察所得。可以说，杨衒之并不像有的记史者那样，只在故纸堆里讨生活，而是具备了一个优秀史家的最基本的素质。\n\n二、流露出浓烈的北魏旧臣的意识\n\n《洛阳伽蓝记》并非奉教而撰，而是出于个人内心的沧桑之感、兴亡之念，因而笔端或隐或显地带着感情。作者在文中流露出浓烈的北魏旧臣的意识。故都伽蓝不仅是北魏佛教隆盛的象征，而且是北魏国运的象征。经历了巨大历史变故的作者在“重览洛阳”之际，立志要让消逝了的梵钟之声在文字中遗响后世，字里行间难以抑制地流露出恍若隔世的悲怀，这构成了全书的情感主旋律。\n\n三、寓褒贬于叙事之中\n\n无论是现实人事或怪异的内容，作者都能栩栩如生地加以刻画，采取多样形式，寓褒贬于叙事之中。在《洛阳伽蓝记》中，没有以一字定褒贬的所谓“春秋义例”，也没有直接陈述自己对事物的看法，杨衒之总是把事情的真相如实地表述出来把如何评价的问题交给读者。杨衒之在书中对寓褒贬于叙事这一原则的运用十分广泛，有的体现了他的史学观点，有的则体现了他的思想政治倾向。尽管在有的著述中，他的思想倾向表达得很曲折，但细心的读者仍是不难看出的。\n\n四、史书笔法与汉大赋气韵\n\n作者在语言表达上善于使用整齐的句法，主要为四言，有时也适度利用四六骈句，同时又能发挥散句的长处，节奏感与自由韵律得以有机结合，从而形成了典丽而清拔的风格，很能见出史家之笔的影响。值得一提的是，他善于吸取辞赋作品尤其是京都大赋状物写景的经验，当他正面记叙某一贵族豪侈生活或某项京城盛典之际，笔端似有意带上了汉大赋式的气韵，这对传递出特定对象夸饰的本质，无疑是相得的。","keywords":"正文与子注相配 北魏旧臣意识 寓褒贬于叙事 史书笔法 汉大赋气韵","note":"《洛阳伽蓝记》是现存文史典籍中寺塔记的典范之作，不仅具有文学价值，还有极高的史学价值。也正因此，从文章之中，显露出了一些史书气韵，其某些特色甚至与《史记》相契合，大家可以从这个角度去切入记忆。相关内容可以参考李晓明《＜洛阳伽蓝记》的特点》，具体资料可以在李凡文学正版群内领取。"},{"id":"121","stars":"★★","title":"谈谈中国小说的起源","body":"上古神话、历代传说、诸子设警取喻的寓言故事、先秦两汉史书中记人叙事的精彩片段，乃至宣传佛、道教义的宗教故事，无不是古代小说的源头。具体追溯中国小说的起源，主要有以下几个方面：\n\n一、神话传说\n\n尽管古代文献对神话传说的记载十分简略，我们仍然可以从中看到故事情节和人物性格这两种重要的小说因素。神话传说原先在口头流传，有的被采入正史，遂逐渐凝固；有的继续在口头流传并不断丰富发展，分化出一些新的神和英雄，增添了新的故事情节。这些继续活在人们口头上的传说一旦记录下来，就成为具有浓厚小说意味的逸史。从神话传说到小说的：根链条中，逸史是关键的一环。甚至不妨说逸史是中国小说直接的源头，逸史中最接近小说或竟可视为早期小说的，莫过于《穆天子传》和《燕丹子》。前者对周穆王周行天下之事多有细节描写，其中的西王母与《山海经》中的记叙相比，减少了神性，增加了人性。后者写燕太子丹派荆轲刺杀秦王，与《战国策》和《史记》相比，不仅增加了细节描写，而且突出了燕丹这个复仇者的形象，胡应麟称此书为“古今小说杂传之祖”，不为无见。\n\n二、寓言故事\n\n《孟子》《庄子》《韩非子》《战国策》等书中都有不少人物性格鲜明的寓言故事，它们已经带有小说的意味。《韩非子》中保存寓言故事最多的《内储说》《外储说》《说林》，明白地用“说”来标目，也透露出两者之间的关系。显然，寓言故事可以看作小说的源头之一。\n\n三、史传文学\n\n《左传》《战国策》《史记》《三国志》，描写人物性格，叙述故事情节，或为小说提供了素材，或为小说积累了叙事的经验。唐代传奇小说多取人物传记的形式，《三国志演义》径直标明是史传的演义，都证明了史传是小说的一个源头。在传统的目录学著作中，有些书或归入子部小说家类，或归入史部杂传类，这两类书缺少严格的区别，这也从一个侧面说明史传对小说的影响之深。","keywords":"神话传说 寓言故事 史传","note":"小说的起源主要有神话传说、寓言故事和史传三种，在之后的小说创作中都可以看到这三方面因素的影响，大家可以结合具体的作品如《三国志演义》等，加以比较区分，进行具体记忆。"},{"id":"122","stars":"★★★","title":"试述魏晋南北朝小说的主要类型","body":"魏晋南北朝是我国古代小说逐渐形成并走向繁荣的时期，数量很多，在八十种以上。从题材类型来看，此时的小说可分为两大类：一是以记载鬼神怪异之事为主的志怪小说，一是以记载人物轶事为主的志人小说。\n\n一、志怪小说\n\n志怪小说记述神仙方术、鬼魅妖怪、殊方异物、佛法灵异，虽然许多作品中表现了宗教迷信思想，但也保存了一些具有积极意义的民间故事和传说。志人小说记述人物的逸闻轶事、言谈举止，从中可以窥见当时社会生活的一些面貌。\n\n（一）志怪小说产生原因\n\n志怪小说的兴盛与当时的社会背景有很大关系，宗教迷信思想的盛行是其兴盛的土壤。社会上流传的许多巫术灵验的故事，就成为志怪小说的素材。秦汉以来方术盛行，关于神仙的故事也层出不穷，这也成为志怪小说的素材。此外，东汉晚期建立的道教，东汉传入中国的佛教，在魏晋以后广泛传播，产生了许多神仙方术、佛法灵异的故事，也成为志怪小说的素材。至于这些素材被搜集记录下来，则带有自神其教的目的。志怪小说的作者有的就是宗教徒，有的虽不是宗教徒，也往往带着搜奇记异的兴趣来记录这类故事。志怪小说适应了宗教宣传的需要，也提供了闲谈的资料，因而得以流传。\n\n（二）志怪小说分类\n\n志怪小说按内容可分为三类：\n\n（1）地理博物。如托名东方朔的《神异经》、张华的《博物志》。\n\n（2）鬼神怪异。如曹丕的《列异传》、干宝的《搜神记》、托名陶潜的《搜神后记》、王嘉的《拾遗记》、吴均的《续齐谐记》。\n\n（3）佛法灵异。如王琐的《冥祥记》、颜之推的《冤魂志》。\n\n志怪小说中值得注意的，是那些曲折地反映了社会现实、表达了人民的爱憎以及对美好生活向往的作品。\n\n二、志人小说\n\n志人小说以记录人物的轶闻琐事为主。在魏晋南北朝的小说之中，志人小说与史传文学的关系，较志怪小说更为切近。\n\n（一）志人小说产生原因\n\n志人小说的兴盛与士族文人之间品评人物和崇尚清谈的风气有很大关系。这类志人小说既是品评人物和崇尚清谈的结果，又反过来促进了这种风气的发展。从志人小说在当时受到社会重视的情况，也可以看出它们的编纂是适应了社会的需要。\n\n（二）志人小说分类\n\n志人小说今传较少，按其内容也可分为三类：\n\n（1）笑话。邯郸淳的《笑林》，对世态有所讽刺，开后世俳谐文字之端。\n\n（2）野史。东晋葛洪伪托刘歆所作《西京杂记》，记述西汉的人物轶事，也涉及宫室制度、风俗习惯、衣饰器物，并带有怪异色彩。其中有的故事后来很流行，如王昭君、毛延寿故事，司马相如、卓文君故事。\n\n（3）逸闻轶事。这是志人小说的主要部分，刘义庆《世说新语》是成就和影响最大的一部。\n\n在中国小说史上，魏晋南北朝的志怪小说和志人小说是不可缺少的一环。在人物刻画、细节描写，以及叙事语言的运用等方面，它们都为唐传奇的写作积累了经验。\n\n【李凡关键词：志怪小说 志人小说 宗教迷信思想 崇尚清谈的风气】","keywords":"","note":""},{"id":"123","stars":"★★★","title":"试分析《搜神记》的思想艺术特色","body":"魏晋时期的志怪小说，以干宝《搜神记》成就最高。具体来看，《搜神记》的思想艺术特征主要表现为以下方面：\n\n一、思想特征\n\n（一）歌颂孝心、友情、爱情和反抗精神，希望读者通过阅读修身律己\n\n干宝所谓“游心寓目，而无尤焉”，意谓潜心阅读，可以发人深思，修身律己就不会做后悔不该做的事了。比如，《罗威》《庾衮》二则，就是作者提倡孝友品行的例证，而《谢郭同梦》《范巨卿张元伯》两篇则歌颂了同心相感的至诚友情。\n\n古人一向认为夫妻乃人伦之始，对坚贞爱情的歌颂便是《搜神记》的一个重要主题。《紫玉》《王道平》《河间郡男女等篇所记载的男女爱情故事，无不优美感人。\n\n还有些故事描写主人公的侠义英勇，强烈的反抗和斗争精神感人至深。其中最著名的要数《三王墓》，又名《千将莫邪》故事情节奇诞曲折，人物性格极为鲜明，干将的智，其子赤的坚忍，侠客的智勇，楚王的残暴，都能以简洁的笔法刻画得栩栩如生。应该说，《搜神记》给读者印象最深的，正是那些符合人情人性的感人故事。\n\n（二）表现政治批判，寄寓政治理想\n\n《搜神记》中有一类故事，对古往今来的暴虐政治，有很深刻的揭露，如《范寻》《东海孝妇》《淳于伯》。还有一类故事，主题虽在歌颂为父报仇、为民除害或爱情的忠贞，但论其事由，无不与政治的黑暗有关。这些故事体现出了浓重的治批判色彩。\n\n《搜神记》中既有作者的政治批判，也寄寓有作者的政治理想。比如，有的故事体现出对徐栩、王业这样的能吏干臣的肯定，有的故事体现出对“至诚”的追求与歌颂，以仁人之心，至诚待人，则飞蝗不害，白虎相亲，甘霖应时而至。在天人关系之中，作者有这样的认识，则《搜神记》之以大量篇幅摭录汉晋以来的灾异之事，兴废之迹，当然不仅在宣扬迷信，的确也有“用为非德受命者鉴”的意义，体现出了作者的政治理想。\n\n二、艺术特征\n\n（一）注重运用虚构手法\n\n值得注意的是，《搜神记》等志怪小说开始注意运用虚构的手法。对比《搜神记》及其前后的志怪小说，我们可以看到在情节构思、人物描写和细节刻画等方面，虚构叙事在魏晋南北朝获得了较大进展。\n\n（二）结构类似于纪传\n\n《搜神记》大抵以人物为中心，故事完整，结体颇似纪传。如《韩友》《严卿》所载之事，房玄龄《晋书》录入韩友、严卿传，只是辞语微异。足见即在唐人看来，志怪与史的内容，界限仍不甚分明。不独如此，《搜神记》叙事生动，语言疏宕，亦是典型的史家之笔。","keywords":"孝心、友情、爱情和反抗精神 政治批判 政治理想 虚构手法 纪传","note":"《搜神记》是魏晋时期志怪小说的代表，无论是在思想内容上借神鬼之事表达自己的观念，还是类似纪传的结构都对后世志怪小说的创作产生了影响，像是《阅微草堂笔记》《聊斋志异》这样比较知名的志怪小说就明显受到了它的影响."},{"id":"124","stars":"★★★★","title":"谈谈你对《世说新语》的认识","body":"《世说新语》是志人小说的杰出代表，又名《世说》《世说新书》，是在刘义庆的主持之下，由他招聚的文学之士共同编纂完成的。《世说新语》的内容主要是记录魏晋名士的逸闻轶事和玄虚清谈，也可以说这是一部魏晋风流的故事集，从而也起到了名士“教科书”的作用。\n\n一、思想内容\n\n（一）肯定文人名士的疏放、豁达风度，反对任性放浪行为。魏晋士大夫好饮酒、服药，以清谈为务；同时行为放达，不以礼教为意。对魏晋风度，刘义庆却又有自己的是非标准。如他对“嵇中散临刑东市，神气不变”的“雅量”，颇为称道对他的无故被害，深表同情。又如对谢安大喜大怒不形于色的“沉着”，洋溢着钦敬和赞佩之情。借王羲之坦腹东床的故事赞扬了他不慕权门、疏放旷达的风度。\n\n（二）崇尚自然，赞扬隐士，鄙薄功名富贵。两晋士大夫常常通过登山涉水，吟风弄月，以寄胸怀。但《世说》肯定和赞扬的是那些崇尚自然、摈弃富贵、追求个人情操之美的行为，始终把赞扬隐士与鄙薄功名富贵紧密联系起来，表明了作者的人生观。\n\n（三）表彰和称誉品格高尚的人物和行为。关于这方面的内容，既丰富，又复杂，包括了各种各样的人物及其所作所为。既有一时一事的片断记录，也有一人一生发展的全过程，写法多样，异彩纷呈。题材几乎涉及士大夫阶层生活的各个领域。虽具体的性质和意义各有不同，但其中所含的积极因素，却是不言而喻的。\n\n二、艺术特征\n\n《世说新语》在艺术上有较高的成就，鲁迅先生曾把它的艺术特色概括为“记言则玄远冷隽，记行则高简瑰奇”。具体说来，《世说新语》的艺术特征主要表现在以下方面：\n\n（一）重在表现人物的特点\n\n《世说新语》及刘孝标注涉及各类人物共一千五百多个，魏晋两朝主要的人物，无论帝王、将相，或者隐士、僧侣，都包括在内。它对人物的描写有的重在形貌，有的重在才学，有的重在心理，但都集中到一点，就是重在表现人物的特点，通过独特的言谈举止写出了独特人物的独特性格，使之气韵生动、活灵活现、跃然纸上。\n\n（二）《世说新语》刻画人物形象，表现手法灵活多样，有的通过同一环境中几个人的不同表现形成对比，有的则抓住人物性格的主要特征作漫画式的夸张，有的运用富于个性的口语来表现人物的神态，《世说新语》虽然没有虚构，但一定有所提炼，这番提炼就是小说的写作艺术。\n\n（三）《世说新语》的语言简约含蓄，隽永传神，透出种种机智和幽默。正如胡应麟《少室山房笔丛》卷十三所说：“读其语言，晋人面目气韵，恍惚生动，而简约玄澹，真致不穷。”有许多广泛应用的成语便是出自此书，例如：难兄难弟、拾人牙慧、咄咄怪事、一往情深等等。\n\n三、地位与影响\n\n《世说新语》是研究魏晋风流的极好史料。其中关于魏晋名士的种种活动如清谈、品题，种种性格特征如栖逸、任诞、简傲，种种人生的追求，以及种种嗜好，都有生动的描写。综观全书，可以得到魏晋时期几代士人的群像。通过这些人物形象，可以进而了解那个时代上层社会的风尚。《世说新语》对后世有着十分深刻的影响，不仅模仿它的小说不断出现，而且不少戏剧、小说也都取材于它，是魏晋南北朝小说的杰出代表。\n\n隋唐五代文学史","keywords":"肯定疏放、豁达风度 反对任性放浪行为 崇尚自然 鄙薄功名富贵 表彰称誉品格高尚的人物行为 重在表现人物特点 表现手法灵活多样 简约含蓄 隽永传神 极好史料","note":"《世说新语》是魏晋南北朝小说的杰出代表，在思想和艺术上都达到了极高的水平，尤其是其在对人物言行的刻画中，采用多样化的手法表现人物独特性格，令人印象深刻，对后世小说的人物塑造手法产生了极为重要的影响。相关内容可以参考侯忠义《＜世说新语＞思想艺术论》，具体资料可以在李凡文学正版群内领取。"},{"id":"125","stars":"★★★","title":"试分析唐代文学繁荣的原因（26西北师范大学）","body":"一、唐代社会的发展\n\n唐代文学的繁荣，与唐代社会的发展有密切的关系。唐太宗贞观四年打败突厥，原属东突厥的各属国，归属唐朝，推尊唐太宗为天可汗，唐朝遂取代势力强大的突厥而成为东亚盟主。贞观八年大败吐谷浑，贞观十四年平定高昌，高宗显庆二年打败西突厥。唐朝势力之强大，延续一百馀年，直至唐玄宗开元、天宝年间而达到高峰。天可汗的实际存在，达百二十馀年之久。唐朝建立不久，经济就从隋末的大破坏中恢复过来，并迅速得到发展，至天宝中上升达于顶点。国力的强大，为文化的发展创造了极为有利的环境。\n\n二、去华夷之防，中外文化交融\n\n唐朝的立国者，对外来文化采取兼容的政策。去华夷之防，容纳外来的思想与文化。从国家政权到生活方式，都体现了这种华夷如一的思想。整个唐代，广泛接受外来文化的影响，从文学艺术到生活趣味、风俗习惯，都可以看到这种影响。外文化交融造成了一种较为开放的风气，对于文学题材的拓广，文学趣味、文学风格的多样化，都有重要的意义。\n\n三、唐士人有着恢宏的胸怀、气度、抱负与强烈的进取精神\n\n唐代前期，士人对人生普遍持一种积极的、进取的态度。国力的日渐强大，为士人展开了一条宽阔的人生道路。唐人入仕，较之前代有更多途径，为寒门士人提供了更多的机会。一批较接近广阔社会生活的寒门士人进入文坛，使文学离开宫廷的狭窄圈子，走向市井，走向关山与塞漠，这对文学的发展也是意义重大的。由于国力强大，土人有着更为恢宏的胸怀、气度、抱负与强烈的进取精神。他们中的不少人，自信与狂傲往往集于一身。唐代士人功名心特重，这种积极进取的精神反映到文学上来，便是文学（特别是诗）中的昂扬情调。安史乱后，宦官专权，藩镇割据，士人的心态也发生了变化，昂扬入世的进取精神，让位于失落与消沉的情绪文学的格调，亦渐至晚唐而渐见纤弱。\n\n四、史学、书法、绘画、雕塑、音乐、舞蹈等的繁荣\n\n唐人恢宏的胸怀气度与对待不同文化的兼容心态，创造了有利于文化繁荣的环境。史学、书法、绘画、雕塑、音乐、舞蹈都有很大的发展。\n\n唐初大量修史，广泛论述史学问题，反映求实倾向。这种思想倾向，与文学潮流的发展同步。初唐的文学潮流，逐步向着反伪饰求真情的方向发展，并从此一步步地摆脱南朝文风的影响，史家对于文学问题的论述直接影响文学走向。\n\n唐代绘画、书法、雕塑的繁荣，也影响到文学。从唐诗中可以明显地看到这一点。唐人咏画、题画诗，《全唐诗》中著录有189首。许多重要诗人如李白、杜甫、王昌龄、岑参、高适、王维都有题画、咏画诗。在唐代，诗画的融通有了更大的发展。画论诗论交融渗透、相互影响，绘画不仅成为诗的题材，也影响诗的艺术表现技巧。唐诗中色彩表现的丰富细腻，意境的画意，传神的技巧，都与绘画艺术的高度发展有着密切的关系。\n\n音乐和舞蹈的繁荣，与文学发展也有着密切的联系。诗与乐，向来关系密切，而这种关系，在唐代更加发展。有人统计，《乐府诗集》中2239首乐府诗，合乐的占1754首。《唐诗纪事》所记1150诗家中，诗作与音乐有关的，共200家《全唐文》中有关音乐之作有241篇。《全唐诗》中涉及乐舞的就更多了。这些作品对乐声与舞容的精妙描写，充分说明唐代乐舞的高度繁荣，为唐诗表现领域的拓展带来了十分深刻的影响。\n\n五、魏晋南北朝文学发展的必然结果\n\n从文学发展自身说，唐文学的繁荣乃是魏晋南北朝文学发展的必然结果。魏晋南北朝时期，文学已经朝着独立成科的道路迅速发展，骈体文把散文美的形式推向极致，同时也暴露了它的弱点。诗歌的声律形式已具雏形，即将影响我国千余年的一种新的诗歌体式已经呼之欲出。原有的多种文体的写作目的与写作规范正在发生变化，新的文体不断出现。这些都说明，魏晋南北朝文学已经为我国文学发展到一个全新的阶段做好了一切准备。正是在这样的基础上，唐人创造了全面繁荣的一代文学。","keywords":"唐文学发展条件 国力强大 中外文化交融 恢宏的胸怀、气度、抱负 强烈的进取精神 史学、书法、绘画、音乐、舞蹈的发展 必然结果","note":"古代文学的学习要从宏观和微观两个方面准备，不仅要掌握具体代表作家作品，也要对整个朝代发展方向有一个整体的把握。例如要了解唐文学繁荣发展的原因，与当时的社会环境是密不可分的，这也有助于我们能够做到知人论世，更** --- 好地理解作家作品。同时，隋炀帝、唐太宗对于诗文发表了许多见解，这也影响到了这一时期的诗歌创作，相关题目可以在李凡文学正版群中查看。"},{"id":"126","stars":"★★","title":"试分析科举制对唐代文学的影响","body":"唐朝选官制度发生了巨大转变，逐步形成了“以诗取士”的科举制度。科举制的形成与发展，对唐代文学产生了重要影响，具体来说，表现在以下方面：\n\n一、解放了人才，给予社会以活力，促进了文学艺术充分发展\n\n科举制在唐代，是以南北朝豪门把持政权、阻止贫寒而有才能之士进入仕途的对立物而出现的，科举制的实行，使得盛行了几百年的“平流进取，坐致公卿”的门阀世袭统治无最终立足之地，这就极大地解放了人才，大批非士族出身的一般中小地主知识分子，力争在政治上露头角，从而也力求在文化上施展其才艺，这就给予社会以活力，尤其是唐代进士以诗赋取士，在唐代文学艺术充分发展的时代，新科进士的活动就更受到人们的注意。\n\n二、推动了唐代教育的发展，促进了文化的普及\n\n由于科举考试是面向地主阶级整体的，它以文化（当然是封建文化）考试为主要的内容，这就刺激地主阶级对其子弟进行文化教育，客观上则对文化在社会上的普及起了推动的作用，唐代文化的普及远远超过了前代，唐代灿烂的文学艺术就是以文化的普及为基础的。与之相对应的，唐代的科举制度让唐朝的官学制度逐渐完善，私学也逐渐兴盛起来，整个社会形成了重视读书、习文、作诗赋和钻研儒经的风气，有利于文学人才的培养和文学的创作。\n\n三、推动了文化在偏远地区的传播和普及\n\n科举取士面向整个地主阶级知识分子，在他们面前出现了只要提高文化水平就可以有仕进机会的现实可能性，这就不仅是中原地区和经济文化素称发达的江南地区，就是偏远的湘西、桂中及岭南等乡县，地主阶级士人拜师学文也已开风气。这在客观上也就推动了文化在这些地区的传播和普及。\n\n四、扩大了文人的行踪，开阔了他们的视野\n\n科举考试还扩大了文人的行踪，开阔了他们的视野，以有利于他们对现实生活的认识，这在下面一节还要讲到。由于举子大量集中于京都应试，无论及第或落第，士人的流动量是很大的。这就在唐诗中产生了相当数量的送人赴举、贺人及第或慰人落第的诗篇，这些作品不少写得声情并茂，富有现实性和时代气息。\n\n五、唐代进士科的考试诗赋，还对文学的发展起过一定消极的作用\n\n首先是省题诗本身，由于内容的限制和形式格律的拘牵，不容易产生出好的作品。唐代统治者衡量省题诗的标准是齐梁体格。按照对省题诗的要求，以及省题诗的具体创作实践，来比较唐代现实主义和积极浪漫主义诗歌的发展道路，可以说二者正好是背道而驰的。\n\n此外，唐代进士科试文字具有一种“雕琢绮言”与讲究“声病”的风气，只能窒息正常的文学创作活动，而不能带给文学发展以任何的生机。特别是科场中朋党交结、行贿纳赂、吹嘘拍马、互相攻讦等种种恶劣习气，也侵蚀到文坛中来，使得晚唐的文学风气，除了一部分作家还能正视现实、写出较好的作品以外，相当部分的文人，“非自叙无援之苦，即訾他人成事之由”，陷入诉苦和攻讦之中。","keywords":"解放人才 推动教育发展 文化传播和普及 开阔视野 内容限制 形式格律拘牵 雕琢绮言","note":"现在提起科举考试，评价全是诟病之词，可是科举制度取代的是任人唯亲的九品中正制，为贫寒之士进取提供了可能，扩大了人才的招揽，对于当时的社会经济文化发展都有着很大的推动作用，对于文学的发展也起到了一定程度的积极影响。不过，科举制的一些弊端，的确是对文学发展造成了阻碍，这一点大家也要明确。"},{"id":"127","stars":"★★★★","title":"试述唐代文人的整体特征","body":"一、中下层文人入主文坛\n\n唐代文学拥有空前广大的作者群，而其中的主体，则由新兴的庶族地主出身的文人，取代了六朝的豪门士族。唐代许多著名文人，如孟浩然、王昌龄、高适、韩愈、柳宗元、白居易、李白、李贺、李商隐等都出身于这一阶层，庶族地主出身的文人把文学从豪门士族的垄断中，从六朝宫廷的小天地中解放出来，使之世俗化、通俗化，这是唐代文学繁荣的重要原因，也是唐代文学的重大变化。\n\n二、自觉地干预政治\n\n以庶族地主为主体的唐代文人大都受儒家兼济思想的影响，以济苍生、安社稷为己任。政治上，他们有强烈的进取心和参与欲，或赴京应试，辗转千里；或传食幕府，游历山川；或赴边御敌，干求功名；或贬谪荒远，躬耕田园，较之囿于宫廷的六朝文人，他们的生活天地宽阔得多，阅历丰富得多，对社会现实和民间疾苦的了解也深广得多。文学上，他们自觉地用诗文干预现实政治，反映社会民生，而不仅仅是抒怀言志、娱性悦情而已。由干时用世到忧时拯世再到愤世疾俗，这便构成唐代文人政治态度嬗变的轨迹。\n\n三、思想开放，出入三教\n\n唐代文人的思想信仰各有所宗，却大都带有出入儒释道三教的特点。外服儒风，内宗梵行、道行，成为风尚。如李白曾受道箓；王维礼佛吃斋；白居易晚年为香山寺居士；中晚唐许多诗僧，实际是披着袈裟的文人；许多女诗人如薛涛、鱼玄机等也曾为女冠。这种社会风尚的形成，与统治阶级的崇尚相关。综观有唐一代，历朝皇帝虽出于政治需要或个人好恶，曾右佛左道或右道左佛，但大体上仍是三教并举的。\n\n四、文艺兼擅，修养精深\n\n唐代文人的文艺修养普遍较高。唐朝的君王能诗善画、雅好书法、精通乐律者颇多。他们参与创作，并对文人创作辑集品评，倡导奖掖。他们重视文治，发展教育，在全国普设各级学校，教授经、律、书、算、诗等课程，并以此开科取士。唐朝鼓励中外文化交流和融合，与西域、印度、日本等东亚、南亚各国的交流规模和频繁程度都大大超过盛极一时的西汉。在发扬民族文化优良传统的基础上，广泛汲取外来文化的精华，使唐朝的音乐、舞蹈、书法、绘画、建筑、雕塑等艺术门类出现了百花齐放的全面繁荣景象。正是在这样的文化艺术氛围中，唐代文人的文艺修养，得到极大的提高。","keywords":"中下层文人入主文坛 自觉地干预政治 思想开放，出入三教 文艺兼擅，修养精深","note":"唐代文学繁荣与唐代文人整体面貌的改变有很大的关系，相较于魏晋南北朝文人，唐代文人思想更加开放，政治热情更高，艺术修养也更高，这与唐代整体社会的变动密切相关。而唐代文人的整体面貌也影响到了唐代文学的风貌，相较于魏晋文学，唐代文学整体更加昂扬，也更加开放，这也是唐代文学繁荣的重要原因。"},{"id":"128","stars":"★★★","title":"试分析唐代文学的艺术风貌","body":"唐代文人的特质，决定了唐代文学具有文质彬彬的总体特征和世俗化、通俗化的发展倾向。\n\n一、文质彬彬\n\n所谓“文质彬彬”，指的是唐代文学融南北朝文学之所长，在内容和艺术上都取得了很高的成就，“尽善尽美”。\n\n唐代文学的文质彬彬，具有封建社会鼎盛时期的时代特征：气势恢宏，风骨刚劲。唐代文学的恢宏气势，源自豪迈昂扬的时代精神，及其所孕育出来的唐代文人的胸襟和气魄；而唐代文学的刚劲风骨则源自唐代文人对生活的热爱，对理想的执着追求。执着的追求，正是唐代文学刚劲风骨之所自。\n\n唐诗经过百余年的变革发展，到开元、天宝年间，已达到了“既闲新声，复晓古体，文质半取，风骚两挟。言气骨，则建安为传；论宫商，则太康不逮”的水平。唐代散文经过近二百年的革新，到韩柳笔下，也已达到唐初令狐德棻所企盼的“文质因其宜，繁约适其变。权衡轻重，斟酌古今，和而能壮，丽而能典”的境界。唐传奇发展到大历以后，摆脱了六朝志怪的窠臼，写历史、述爱情、颂侠义、究人生，不仅题材大大丰富了，而且从零章碎段的简单记述进化为成功地塑造了各色人物形象，有曲折的情节、完整的结构，有“著文章之美，传要妙之情”的审美追求，作者蔚起，佳作林立。综上所述，可见唐代文学文质彬彬的特征。\n\n二、世俗化、风俗化的发展趋势\n\n唐代文学从六朝狭小的宫廷天地、少数官廷文人和士族的垄断中解放出来，由众多的中下层文人所创作，并拥有空前广泛的读者群体，这就决定了其内容世俗化、风格通俗化的发展趋势。中唐以后，城市经济发展，市民阶层形成，更加速了这一趋势。\n\n就诗歌看，唐诗题材从六朝的宫苑楼阁、花间月下，扩大至江山塞垣、社稷人生。其作者队伍几乎囊括了社会诸阶层的各色人等，其内容自然就涉及社会生活的方方面面，可谓雅俗俱备，巨细靡遗。其深度、广度远过于六朝诗歌。唐诗的审美理想以壮丽自然为贵，以通俗为美，反对雕琢造作，不同于六朝的华艳绮靡。唐诗的世俗化、通俗化使其拥有空前广泛的读者群体。\n\n就散文看，古文即是对骈文的通俗化革新。不仅出现了俳谐刺时之文，而且出现了一批为城市贫民立传讴歌的文章。这在风行贵族化的六朝骈文时代是不可能出现的。即使唐代骈文，也有世俗化、通俗化的变化，较少用典，切实尚用，有以散化骈的趋势，为僵化的骈文注入了新的活力。\n\n就小说看，这一向来被斥于文学殿堂之外的文体，在唐代风行一时。不少尊显、著名文人如元稹、牛僧孺等竞相创作。在内容上，唐传奇多表现中下层文人和市民阶层所喜闻乐见的爱情、侠义、历史题材；在形式上，汲取了民间说唱文学的长处，诗文相辅，在运用文言书面语言时，注意吸收生动活泼的口语、谣谚。可以说，作为文言短篇小说里程碑的唐传奇，一开始就表现出鲜明的世俗化、通俗化的倾向。\n\n【李凡关键词：文质彬彬 世俗化 风俗化】","keywords":"","note":"唐代文学的艺术风貌，一个是“文质彬彬”，即融合南北朝文学之所长；另一个是世俗化、风俗化的发展趋势，表现在诗歌、散文和小说等多种文体之中。而之所以如此，主要与唐代文人的整体面貌有关，大家可以将二者联系在一起进行理解记忆。"},{"id":"129","stars":"★★★★","title":"试述唐代文学在中国文学史上的成就与影响","body":"由于唐代政治制度的开明、文化政策的宽容、城乡经济的繁荣、科举制度的引导、多元文化的沟通以及前代文学的滋养等众多原因，唐代文学登上了传统文学的最高峰，成为华夏民族永久的骄傲。它不仅是前代艺术经验充分累积后的大繁荣，还为中国文学的未来发展开拓出新的疆域。\n\n一、唐诗：诗国的最高峰\n\n唐诗体现了唐代文学的最高成就，诗人和作品的数量都超过前代。其内容包罗万象，可谓唐代社会生活的艺术再现。在艺术上，唐诗也达到了高度成熟的境界。首先，风格与流派较之前代更加多样化。唐诗则在注重修辞之美、注重华丽的基础上，全面发展雄浑、平淡等风格，大胆尝试险怪、粗犷等风格。此外，艺术形式也更加完善，唐人不仅完成了齐梁以来诗歌格律化的进程，而且更自觉地意识到诗歌是一种美的构造，普遍追求“风骨”和“兴象”，尤其是产生了以盛唐诗歌为代表，以开放与开明为根基的“盛唐气象”这一审美典范。\n\n唐诗吸收前代诗歌的艺术经验，加以创造更新，形成诗国的最高峰；在唐人手中定型的律诗，成为后世诗歌的主要体裁。唐诗史上形成的文学流派、文人群体，不仅为后人创造出精美的诗歌作品，也成为中华民族文化心理上的永恒记忆。唐以后诗歌创作都难逃唐诗的影响。\n\n二、唐代文章：变革文体文风，影响后世散文发展\n\n唐代文章也取得了丰硕的成果，尤其“古文运动”的兴起，使古典散文再次焕发光彩。由于古文精炼畅达，较之骈文更利于表达丰富的生活，展现多彩的人生，逐渐形成了可以和秦汉古文媲美的唐宋古文流派，树立了新的文章范式。此外，唐人在骈文、骈赋方面也有新的发展，并创造了文赋、律赋、俗赋等新赋体。唐文的文体文风改革，为北宋欧阳修等作家所发扬，对未以后散文的发展产生了重大的影响。\n\n三、唐传奇：文言小说的成熟\n\n唐代传奇的出现，是我国小说发展史上的里程碑。唐人开始有意识地创作小说，无论取材于现实还是历史，都着重表现人事，不同于旨在证明神怪不诬的六朝志怪。艺术上追求运用想象和虚构，曲折情节，塑造人物形象。唐传奇在人物塑造、情节构造、感情表达等方面代表了我国文言小说的成熟，对宋代的话本小说影响显著。\n\n四、晚唐五代词：词体发展的良好开端\n\n词是唐代产生的一种合乐歌唱的新文体，作为广义诗的一种，它最初多为歌妓们演唱的小曲，为了适应燕乐的曲调，逐渐形成句子长短不齐而有规定体制的形式。中唐以后出现了文人词，多委细，香软浓艳，及至晚唐产生了以温庭筠、韦庄等大量写作词的花间派词人。晚唐五代词取得的成就，是词体得以发展的很好开端。\n\n五、变文：影响后世话本、诸宫调、弹词等戏剧\n\n变文本是一种讲唱佛经故事以宣传佛教的通俗文学形式，本身具备一定的娱乐性。其特点是散文和韵语交杂，唱词与说白兼用，形式上灵活自由，艺术上通俗生动。作为一种适应民间娱乐需要的文学形式，生命力很强，对后来的宋元话本、诸宫调、弹词、宝卷等民间讲唱文学都产生了重要的影响，其意义不可忽视。\n\n【李凡关键词：诗国最高峰 变革文体文风 文言小说成熟 词体发展良好开端 影响后世戏剧】","keywords":"","note":"唐代文学是传统文学的最高峰，是前代文学累积后的绽放，也是后世文学的良好开端。唐代文学的成就与影响是广泛而全面的，在诗、文、词、小说和戏剧等多个方面都对后世产生着重要的影响。这其中，相对考查较多的是唐朝的诗、文和小说，因此，唐代重点诗人、诗派、古文运动相关内容与唐传奇相关内容，我们都要重点关注。"},{"id":"130","stars":"★★★","title":"简述唐诗的发展轨迹","body":"唐代文学的最高成就是诗，它可以说是一代文学的标志。唐诗的发展存在着不同的阶段。\n\n一、最初的九十年左右，即从唐朝建立至开元十五年前后，是唐诗繁荣到来的准备阶段。就表现领域说，逐渐从宫廷台阁走向关山塞漠，作者也从宫廷官吏扩大到一般寒士；就情思格调说，北朝文学的清刚劲健之气与南朝文学的清新明媚相融合，走向既有风骨又开朗明丽的境界；就诗的形式说，在“永明体”的基础上，把四声二元化，并解决了粘式律的问题；从律句、律联到构成律篇，摆脱永明诗人种种病犯说的束缚，创造了一种既有程式约束又留有广阔创造空间的新体诗-律诗。到了开元十五年前后，无论是情思格调、意境兴象，还是声律形式，都已经为唐诗繁荣的到来准备了充分的条件。\n\n二、开元、天宝盛世唐诗的全面繁荣。这个时期，出现了山水田园诗人王维、孟浩然，把山水田园静谧明秀的美表现得让人心驰神往。出现了边塞诗人高适、岑参，把边塞生活写得瑰奇壮伟、豪情慷慨。还有王昌龄、李颀、崔颢、王之涣等一大批名家。当然最重要的是伟大诗人李白，以其绝世才华，豪放飘逸的气质，把诗写得行云流水而又变幻莫测，情则滚滚滔滔，美如清水芙蓉。后人对此期唐诗，有许多的评论。概括地说就是骨气端翔，兴象玲珑。无工可见，无迹可求，而含蕴深厚，韵味无穷。\n\n三、天宝后期至贞元年间，安史之乱成了唐代社会由盛而衰的分水岭，这一社会大变动，也引起了文学的变化。正当唐诗发展到它的高峰的时候，唐代社会也从它繁荣的顶峰走向动乱与衰败。诗歌中开元、天宝盛世繁荣期那种兴象玲珑、骨气端翔的境界意味已逐渐淡化，理想色彩、浪漫情调也逐渐消退。代表这一时期的最伟大的诗人就是诗圣杜甫。他直面这场历经八年的安史之乱，以动地的歌吟，表现战火中的人间灾难、生民血泪。把强烈深沉的抒情融入叙事手法中，以叙事手法写时事，从题材到写法，都不同于盛唐诗了，这可以说是唐诗发展中的一种转变。此后大历诗人出来，因社会的衰败而心绪彷徨，诗中出现了寂寞情思，夕阳秋风，气骨顿衰。\n\n四、贞元元和年间，士人渴望中兴，与政治改革同时，诗坛上也出现了革新的风气。诗歌创作出现了又一个高潮。韩愈、孟郊、李贺等人，受到杜甫奇崛、散文化、炼字的影响，更加怪变，甚至以丑为美，形成韩、孟诗派。白居易、元稹，还有张籍、王建，则从乐府民歌吸取养料，把诗写得通俗易懂，形成元、白诗派。这些中唐诗人在盛唐那样高的水平上，在盛极难继的局面中，以他们的革新精神和创新勇气，又开拓出一片诗歌的新天地。\n\n五、长庆以后，中兴成梦，士人生活走向平庸，心态内敛，感情也趋向细腻。诗歌创作也由此进入一个新阶段。题材多狭窄，写法多苦吟。在这一片诗的退潮中，杜牧、李商隐突起，聚显光芒。特别是李商隐，以其善感灵心、细腻丰富的感情，用象征、暗示、非逻辑结构的手法，表现朦胧情思与朦胧境界，把诗歌表现心灵深层世界的能力推向了无与伦比的高峰，创造了唐诗最后的辉煌。","keywords":"时间顺序 准备阶段 全面繁荣 由盛而衰 革新 新阶段","note":"本题考查频率不高，在进行记忆时主要按照时间顺序进行记忆，了解每个阶段的发展状况与诗人及其写作特点即可。这部分内容有助于我们对唐代诗歌发展脉络有一个整体的理解，进而更好地理解唐代诗人创作风格的变化。"},{"id":"131","stars":"★★★","title":"简述佛教对唐文学的影响（26南开大学）","body":"佛教在唐代有很大的发展，天台、三论、法相、华严、禅宗等教派，在佛教中国化方面，都已经到达了相当成熟的阶段，禅宗尤其如此，它已深深契入中国文化之中。佛教文化对唐代文学的影响，主要表现在以下方面：\n\n一、推动了唐诗“意境说”的形成，促进了唐诗发展\n\n佛教影响士人的人生理想、生活情趣，进而影响诗歌创作。禅宗标榜“明心见性”，有助于诗人静心观照，进入最佳创作状态；禅宗的“顿悟”，引导诗人通过内省体验，领悟一景一境、万物色相中的诗情和禅趣。禅宗注重引发，讲究机锋，多借助活生生的事象，暗示象征，旁敲侧击，以启示悟性。受其影响，王维、孟浩然、韦应物、柳宗元等人的山水田园诗，常借山水之景，表达禅悦之趣，创造出情景交融、物我混一的意境，具有似淡实浓的美学品味。唐诗中空寂的境界，明净和平的趣味，淡泊而又深厚的含蕴，都是从这里来的。禅宗的勃兴，是唐诗“意境说”形成，意境创造成就斐然的重要原因之一。\n\n二、出现了大量的僧诗\n\n佛教对唐文学更为直接的影响，是唐代出现了大量的僧诗。清人编《全唐诗》，收僧人诗作者一百多人，诗两千七百多首。这些僧人的诗，有佛教义理诗、劝善诗、偈颂，但更多的是一般吟咏，如游历、与士人交往、赠答等。僧诗中较为重要的有王梵志诗、寒山诗，影响广泛而深远。除僧诗外，士人与佛教的广泛联系，与僧人的广泛交往，也大量地反映到诗中。\n\n三、拓广了文学的体裁\n\n佛教在唐代的广泛影响，还直接拓广了文学的体裁。俗讲与变文，就是这时出现的新文体。这种文体的主要特征，在于便于讲唱，内容为佛经，而形式则与当时的民间说话一样，带着通俗文学的性质。佛徒的俗讲，促使变文这一新的文学体裁终于形成；佛典的譬喻，丰富了唐代的寓言文学；佛典的偈颂，影响了诗歌的通俗化和议论化；从傅奕、狄仁杰到韩愈、李翺、孙樵的辟佛排佛斗争，则推动了古文运动的发展。\n\n四、影响了创作题材与主题\n\n佛教文学自传入中国以来，就对中国文学创作的题材和主题产生了重要影响。在这一方面，到唐代继续发展，如沈既济《枕中记》的梦游题材与《杂宝藏经》卷二《娑罗那比丘为恶生王所苦恼缘》相似，李朝威《柳毅传》的龙女和煮海情节显然受到《贤愚经》卷八《大施抒海品》的影响。在诗歌方面，以禅理入诗也已相当普遍。\n\n五、影响了语言和修辞手法\n\n佛典翻译丰富了汉语的词汇和语法，进而影响到文学语言。佛典文学的恢宏的想象、巧妙的譬喻、大胆的夸张以及排比、重复等修辞方法，对中国文人也有很大的吸引力。","keywords":"“意境说”形成 僧诗 拓广文学体裁 题材与主题 语言和修辞手法","note":"佛教对唐代文学发展的影响是多方面的，其中最重要的是诗歌，不但许多诗人如王维笃信佛教，更是出现了许多诗僧。不仅如此，佛教文学还对唐代文学的体裁、题材、手法等多个方面产生了深远的影响。相关内容可以参考孙昌武《唐代文学与佛教》，具体资料可以在李凡文学正版群内领取。"},{"id":"132","stars":"★★","title":"简述唐代新文体出现的原因及表现","body":"社会的发展变化，提供了新的文化土壤，新读者群的出现又使文学产生了新的需要，而文学自身的发展也为其提供了新的可能，于是出现了新的文体。传奇、变文、词，是唐文学中的新体裁，是唐文学在文体上的新发展。\n\n一、唐代在魏晋南北朝志怪小说和杂史杂传的基础上，诞生了传奇小说\n\n传奇小说的出现，从文体内部说，是六朝志怪和杂史杂传演变发展的产物；从外部基础说，则是现实生活中娱乐的需要。传奇小说异于六朝小说的地方，一是它的创作意图，就是鲁迅所说的“始有意为小说”；二是它一般有较为完整的情节结构；三是它有较为完整的人物塑造。此外，唐传奇题材多样化，富于人生情趣，以史传笔法叙述虚构故事，不时插入诗赋，与散文、诗歌的发展，都有着微妙的联系。唐传奇的出现，标志着我国文言小说作为一种文体的成熟。\n\n二、唐代出现的又一影响深远的新文体是词\n\n词这一新文体的出现，主要出于娱乐的需要。词随燕乐起，选诗配乐、依调填辞，都为了歌唱。它最初来自民间，俗曲歌舞、酒令著辞，用于日常宴饮、歌楼伎馆。中唐以后，城市经济发展，词也得以迅速兴起，文人加入词作的行列。到了晚唐五代，词在西蜀和南唐得到高度繁荣。西蜀花间词人绮靡侧艳，视野离不开男女情爱，目的无非是欢娱消遣。南唐词人扩大了词的境界，转向对内心缠绵情致的抒写。特别是南唐后主李煜在亡国之后的词作，把词这一善于表现绵邈情怀的文体，发挥得淋漓尽致，把它推向了很高的艺术境界。\n\n三、佛教在民间广泛传播，布道化俗，出现了俗讲和变文\n\n俗讲是僧徒依经文为俗众讲佛家教义，“悦俗邀布施”的一种宗教性说唱活动。俗讲的底本为经文，取材全为佛经，思想内容不外乎佛教的无常、无我、生死轮回、因果报应、涅槃解脱等教义，敦煌遗书中尚保存有十来种。变文，或简称“变”，乃转变的底本，在敦煌说唱类的作品中保存较多。\n\n【李凡关键词：新文体 传奇小说 词 俗讲和变文】","keywords":"","note":"唐朝新文体的不断出现，是社会发展的需要，也是出于文学发展自身规律的需要。魏晋文学在多种文体上已经进行了自觉的探索与归纳，在这样的基础上，唐人创造了全面繁荣的一代文学。"},{"id":"133","stars":"★★★★★","title":"简述“初唐四杰”的诗歌创作特征与诗学贡献","body":"“初唐四杰”指王勃、杨炯、卢照邻、骆宾王四位初唐诗人，他们官小而才大、名高而位卑，心中充满了博取功名的幻想和激情，郁积着不甘居人下的雄杰之气。他们以才子齐名出现于文坛，提倡刚健骨气，被称为“初唐四杰”。\n\n一、“初唐四杰”的诗歌创作特征\n\n（一）追求刚健的骨气，强调文学的经世教化作用\n\n“初唐四杰”有着相似的审美追求。首先，四人都反对绮婉的文风，追求刚健的骨气，矛头直指风靡当时的“绮错婉媚”的“上官体”。其次，他们在理论上都强调文学的经世教化作用，认为文章可“甄明大义，矫正末流，俗化资以兴衰，家国由其轻重”，而他们的创作实践，却更侧重于文学的抒情感发作用，追求壮美的审美境界，要求文章“壮而不虚，刚而能润，雕而不碎，按而弥坚”。\n\n（二）创作题材广泛\n\n“初唐四杰”的诗歌题材较前人已经拓宽，这开拓了诗歌的表现领域。“初唐四杰”的创作题材，主要有以下几种：\n\n（1）边塞诗。四杰除王勃外，都创作了不少边塞诗，有的表现边地苦寒，有的描绘战事的激烈，还有的抒发征夫思亲怀乡之情。其中的主旋律，则是杀敌报国，建功立业。其慷慨激越的情调，反映了初盛唐的时代精神；其悲壮苍劲的风格，开了边塞诗派的先河。\n\n（2）羁旅诗。四杰的这类诗多抒发应举游宦、赴边入幕时的别情乡恋。体验既深，情意又浓，吟咏自能真切感人。他们的这类诗不缠绵于儿女之情，多嗟伤于岁月流逝而功名未就。\n\n（3）牢骚诗。四杰渴望在济危赴难、报效国家中实现自身价值，为此，他们不惜捐躯死难。而在现实中，他们才高位卑，仕途淹蹇，致使理想落空，功名难就。于是，他们感叹世路艰难，人情浇薄。与此同时，他们还将寒士的贫苦落寞与贵族的奢华淫乐相对比，揭露贵族豪富醉生梦死，讽刺他们妄图长享富贵荣华。\n\n（4）咏史、咏物诗。四杰的这类诗借景物、史事抒情言志。\n\n二、“初唐四杰”的诗学贡献\n\n（一）扩大了诗歌的表现领域\n\n综观四杰的诗歌，较之前人题材已经拓宽。“四杰”作为一个群体代表了下层文士在唐代文坛的崛起。宫体诗在卢、骆手里是从宫廷走到市井，五律到王、杨的时代是从台阁移至江山与塞漠。他们以各自或长或短但充满悲剧色彩的一生，推动初唐诗歌题材从宫廷走向了市井和塞漠，给初唐诗歌带来了高情壮风的少年意气，扩大了诗歌的表现领域。尤其是他们由对人生价值的追求到对宇宙哲理的思索，都丰富和加深了他们诗歌的意蕴。这是四杰诗歌创作的成就之一。\n\n（二）转变初唐的诗风\n\n“四杰”作诗重视抒发一己情怀，诗中开始出现了一种壮大的气势，有一种慷慨悲凉的感人力量。这种壮思和气势，在他们创作的较少受格律束缚的古体和歌行中表现得尤为充分。特别是卢、骆的七言歌行气势宏大，视野开阔，写得跌宕流畅，神采飞扬，较早地开启了新的诗风。\n\n（三）完善律绝，发展歌行\n\n王、杨擅长律体，能寓散于偶，运用虚词，化滞重为流走，为律绝的定型作出贡献，被奉为律体“正始”；卢、骆工于歌行，对六朝宫体从题材到形式都作了改造。他们的歌行对偶俪句，四句或八句一换韵，平仄相间，学习六朝民歌，多用双声叠韵、联绵词，蝉联而下，音节圆美流畅。","keywords":"刚健骨气 经世教化 题材广泛 边塞 羁旅 牢骚 咏史、咏物 扩大表现领域 转变初唐诗风 完善律绝 发展歌行","note":"“初唐四杰”的文学史意义是初唐时期的重要考点，以名词解释出现的可能性比较高，但也可能出大题。关于“初唐四杰”，我们首先要注意他们共同的审美追求，同时要注意他们创作题材的特征。而他们的诗学贡献，我们也主要从题材、风格和形式三个角度去分析。初唐时期比较重要的一位诗人还有上官仪，相关题目可以在李凡文学正版群中查看。"},{"id":"134","stars":"★★","title":"试分析“沈宋”对唐代诗歌发展的贡献","body":"沈佺期、宋之问作为初唐著名诗人，他们的诗歌尚处于唐诗初始阶段。在不断地继承和创新中，他们从形式格律方面为唐代诗歌的繁荣做出了贡献。\n\n一、使诗歌律化得以完善并定型\n\n沈佺期、宋之问最大的贡献在于把律诗在声律、对偶、篇制上完全统一和定型起来，在于他们在理论和创作实践中完美地体现了律诗的构思精巧、高度凝炼的特点，使这种诗体能容纳丰富的生活内容，表达复杂的思想感情，而且对中国诗歌逐渐由叙事转向抒情的必然趋势起了重要的推动作用，是中国诗史上一次革命，为盛唐诗歌的繁荣提供了诗歌形式格律上的保障。从这个意义上来讲，沈佺期、宋之问在初唐乃至整个唐代诗坛占了重要的地位。\n\n二、拓宽唐诗题材\n\n在诗歌题材上，沈佺期、宋之问作为武则天宫中极受宠信的宫廷诗人，他们不但写过许多典雅精工、构思精巧、气象恢宏的应制诗，还创作许多意境开阔、感情真切的贬谪诗以及情景交融、模山范水的山水诗。沈佺期、宋之问在被贬之后将怀乡、述怀、送友等内容融入诗歌，把宽广的社会生活、人生感受摄入自己的创作视野，以此来抒情言志，从而突破了应制诗的束缚，给初唐诗歌注入情感的血脉，使其具有了一种新的文学生命。诗歌取材多样性使初唐诗歌的宫廷特质不断弱化，初唐柔弱的诗风有了根本性的改观。\n\n三、扭转初唐诗歌审美风格\n\n沈佺期、宋之问对初唐诗歌的贡献还体现在扩大诗歌题材、拓新诗歌内容。首先，沈佺期、宋之问诗一改齐梁诗生硬、板滞的诗风，以自然流丽的感情抒发为诗坛带来一股清新之风，并以精巧的构思使诗更具诗味。其次，沈佺期、宋之问诗中出现了诸多意境开阔，气象宏大的诗作。在审美风格上，沈、宋二人突破了初唐以来诗歌写景咏物沿袭齐梁思路的框框，建构和恢复诗歌抒情特质，不断进行创意造境方面的开拓和尝试，引领初唐诗歌朝着自然流丽、气象宏大的盛唐诗歌方向发展。这些创新与探索对唐诗的发展尤其是盛唐诗的繁荣起了很大的推动作用。\n\n综上所述，沈佺期、宋之问在律诗的定型、题材扩大及审美倾向的突破，为盛唐诗歌的全面兴盛繁荣做出了形制方面的重要贡献。","keywords":"诗歌格律化 拓宽题材 扭转审美风格","note":"所谓“不以人废言”，虽然沈宋二人的品德低劣，但他们的确对诗歌发展做出了贡献，这主要集中于诗歌的形制方面，包括格律、题材和审美风格三个方向。相关问题可能在考查中出现，大家要注意掌握。"},{"id":"135","stars":"★★★","title":"谈谈你对陈子昂的诗学理论的认识","body":"陈子昂继“四杰”主张“骨气”“刚健”之后，明确标举“汉魏风骨”以反对“彩丽竞繁，而兴寄都绝”的藻饰文风，其实质是复古旗帜下的革新。陈子昂针对六朝文学内容不够充实、不注意整体审美形象塑造两个弊病，从正面提出了“兴寄论”与“风骨论”的文学创作主张，这也正是唐代前朝文艺思想发展中的核心思想。\n\n一、陈子昂诗学理论的主要内容\n\n（一）“兴寄”论\n\n“兴寄”既是强调作品要有充实的社会内容，同时也是重视诗歌整体审美形象的表现。兴，指感兴、意兴，是诗人浮想联翩，形象思维十分活跃时的一种状态。寄，指寄托，是诗人隐含于诗歌审美意象中的现实寓意。陈子昂反对诗歌创作只有“彩丽竞繁”，而忽视“兴寄”，要求诗歌创作以审美形象来感动读者，并从中体会到积极的思想意义。\n\n（二）“风骨”论\n\n陈子昂的“风骨”论从形象塑造的角度看，要求有生动传神的整体形象，同时，又很注意要有抑扬顿挫的声律之美，能够有“金石声”。陈子昂这种“风骨”论显然是针对齐梁文学的弊病以及它在唐初的影响而发的，它一方面反对齐梁描写宫廷艳情诗作，要求文学作品表现政治理想抱负、抒发豪情壮志，有济世安民的广阔社会内容；另一方面是反对齐梁文学仅在辞藻堆砌、典故排比、碎用声律这些“小技”上追求纤巧，要求创造鲜明、生动、自然、传神的艺术形象。\n\n二、陈子昂诗学主张的积极影响\n\n陈子昂的“兴寄”论从实质上增加了诗歌的内容，使诗歌具有更多的质感，较之于前人出于政教目的以纠正诗风的简单做法，距离文学的本来规律更近了一步，为即将到来的盛唐之音做了较为完善的准备。而“风骨”论追求思想内容壮大昂扬，音情的抑扬顿挫、波澜起伏，文辞上的明朗皎洁等，体现了上进社会对于文学的最基本要求，足以反映走向盛唐的封建社会的精神面貌。陈子昂的诗歌创作和理论主张影响了有唐一代，他对风骨的追求，他提出的诗美理想，对于唐诗的变革具有关键性的意义。这为后来唐代文学的进一步发展所证实，成为盛唐诗歌行将到来的序曲。\n\n三、陈子昂诗学主张的局限性\n\n陈子昂文艺思想中的弱点是对南朝文学在艺术形式和技巧上的成就重视不够，对南朝文学创作中辞藻之华美、典故之深刻、对偶之工整、音律之严密这些有益因素没有充分吸收，因而他自己的创作也显得过分古朴，文采不足。","keywords":"“兴寄”论“风骨”论 增加诗歌内容 反映精神面貌 关键性意义 对南朝文学成就重视不够","note":"陈子昂的诗歌理论，加上他的创作实践，廓清了初唐半个世纪齐梁余风的影响，迎来了以“风骨”“气象”著称的盛唐诗歌创作高潮。在这之后，李白的“复古”主张，以及后来韩、柳倡导的古文运动和元、白倡导的新乐府运动，无一不受到陈子昂的影响，他们和陈子昂的这些革新主张是一脉相承的。因此，从这个意义上讲，陈子昂无愧为唐代文学革新运动的先驱者。"},{"id":"136","stars":"★★★","title":"陈子昂诗歌创作的艺术特征","body":"陈子昂继“四杰”主张“骨气”“刚健”之后，明确标举“汉魏风骨”以反对“彩丽竞繁，而兴寄都绝”的藻饰文风，其实质是复古旗帜下的革新。陈子昂的诗歌创作，鲜明有力地体现了他的革新主张。\n\n一、思想复杂，但以儒家兼善天下的精神为主导\n\n陈子昂的思想是很复杂的，他既好纵横任侠，又好佛老神仙，但儒家兼善天下的精神，仍然是他思想的主导方面。从他的许多政论奏疏中，我们可以看到他洞察国家安危的远见，关怀人民疾苦的热情。他的政治热情是他从事诗歌革新的动力。而他的诗文创作既贯穿了他的施政主张，抒发了他的理想抱负，也反映了他驳杂的思想。\n\n二、注重有所寄托\n\n注重有所寄托是陈子昂诗歌创作的一个特色。自然界的事物可以成为“兴寄”之体，历史上的故事也可以寄托“兴寄”，甚至连时事都可以成为陈子昂寄托“兴寄”的载体。在陈子昂的诗里，寄托在对于自然界事物的咏叹，怀古时对于已经消失的人和事的感叹之中的，是陈子昂永不停歇的壮怀雄心。此种积极昂扬向上的精神对于盛唐诗人无疑也是有所影响的。\n\n三、鲜明的复古倾向\n\n陈子昂的诗歌创作表现出明显的复古倾向，即恢复古诗比兴言志的风雅传统。这使他的诗呈现出与当时朝中流行的馆阁体完全不同的精神风貌。在陈子昂看来，诗歌既要反映社会现实，又要敢于干预社会政治，即发挥其“美刺”的艺术效用。陈子昂倡导风雅比兴，是将其视为纠正初唐诗坛沿袭齐梁绮艳靡丽诗风的重要方式与途径。其既体现在对社会弊端和污浊风气的辛辣嘲讽与批判上，也反映在对统治者种种倒行逆施行为举止的揭露与抨击上。陈子昂诗歌既题材丰富又内容深刻，显然与其崇尚“风骨”的诗歌主张有着密切的联系。\n\n四、壮伟之情和豪侠之气\n\n壮伟之情和豪侠之气，最能体现陈子昂诗歌创作的个性风采，也是他倡导的风雅兴寄中能反映一个时代士人精神风貌的新内容，一种被称为唐诗风骨的东西。陈子昂的诗歌蕴藏着壮伟情怀，展现出不甘平庸、积极进取的精神风貌。从“四杰”开始的那种渴望建功立业的昂扬情调，在陈子昂的兴寄之作里更显激越，带有壮怀激烈、拔剑而起的豪侠之气。","keywords":"兼善天下为主导 有所寄托 复古倾向 壮伟之情豪侠之气","note":"陈子昂是唐代诗歌革新运动的倡导者。“风骨”与“兴寄”的提出，既扫荡了初唐形式主义诗风，又为唐代诗歌的健康发展指明了方向，在当时无疑是具有开创性意义的。而陈子昂的诗歌创作，又实践了这一理论，显示出了独特的风貌，大家可以将这二者结合起来，加深记忆。"},{"id":"137","stars":"★★","title":"试分析张若虚《春江花月夜》的文学成就","body":"《春江花月夜》是一首长篇歌行，采用的是乐府旧题，但作者已赋予了它全新的内容。它的文学成就，主要表现在以下几个方面：\n\n一、初唐时代精神的体现\n\n从初唐开始，诗人“已从美的暂促性中”逐渐领悟到一种宇宙意识，一种超时空的永恒观念，并把这种观念用形象思维的方式在诗中体现、表达出来。《春江花月夜》由时空的无限，遐想到了生命的无限，感到神秘而亲切，表现出一种更深沉更寥廓的宇宙意识。这娓娓道出的宇宙意识，即是对永恒的领悟，原是一种时代精神的体现，也正是构成“盛唐气象”的不可缺少的因素，它的出现既难能可贵而又理所当然，因为这是时代赋予这一批诗人的使命。然而，如果专就突破宫体诗的平凡庸俗的藩篱而言，它确不愧是一篇典型之作。\n\n二、恢复了自“诗三百”以来的游子思妇主题\n\n《春江花月夜》实质上是“复古”，即是对艳情诗的彻底清算，其写人事、写情的部分却恢复了自“诗三百”以来的游子思妇主题。这一传统的恢复看似简单而无所谓，其实却具有普遍典型意义。而这个表面上的“复古”，实质却具有革新的意义。这就把我国优秀的诗歌传统彻底从艳情诗的堕落深渊中勇敢地自拔出来，洗尽邪恶的魔障，使男女间纯真的爱情重新回到圣洁的境界中来。\n\n三、构思之缜密精巧远超前人\n\n用“春江花月夜”这个题目来作诗，其写景部分是要扣紧题面的，即诗中之景离不开“春”“江”“花”“月”“夜”这五方面的内容。全诗以春、江、花、月、夜为背景，以月为主体，生发展开。江流、芳甸、花树、沙汀，都笼罩在迷人的月色下，面对这朦胧而和谐的美景，诗人由“江畔何人初见月，江月何年初照人”的冥思遐想进而探求宇宙奥秘，思索人生哲理，接着由江月有恨、流水无情过渡到思妇游子的离愁别恨的描写。这种顾及全局而重点突出、一环扣一环、牵一发而动全身的艺术构思，也是唐以前的诗人所不易做到的。\n\n四、创造了诗画交融、兴象玲珑的意境\n\n诗人用江水海潮、芳甸花林、白云青枫、沙汀扁舟、明月楼、妆镜台、玉户帘、捣衣砧、长飞的鸿雁、潜跃的鱼龙等众多景物来渲染气氛，烘托意境。全诗四句一韵，平仄交错，借声韵的回环往复，把离愁别恨表现得往复缠绵，摇曳有致。全诗结构完整，层次分明，画意与诗情兼具，意境深邃圆融，兴象玲珑超诣。\n\n从诗歌史的角度来看，张若虚的《春江花月夜》总结升华了同类题材的旧传统，开辟了境界圆融、兴象玲珑、情韵深厚的新的境界，预示了一个诗歌的新时代即将到来。","keywords":"时代精神 游子思妇主题 构思之缜密精巧 诗画交融 兴象玲珑","note":"被闻一多先生誉为“诗中的诗，顶峰上的顶峰”的《春江花月夜》，一千多年来使无数读者为之倾倒。一生仅留下两首诗的张若虚，也因这一首诗，“孤篇横绝，竟为大家”。无论是在思想还是在艺术上，张若虚都突破了前人的窠臼，为诗歌发展开辟了新的道路。"},{"id":"138","stars":"★★","title":"张若虚、刘希夷为唐诗发展作出了怎样的贡献","body":"经过九十馀年的发展，初唐诗歌在题材范围的扩大、体物写景技巧的成熟、声律的完善和风骨的形成等诸多方面，已为唐诗艺术的繁荣奠定了基础。与此同时，在诗歌意境的创造方面，张若虚和刘希夷的诗歌提供了成功的经验。\n\n一、刘希夷的诗歌意境构造\n\n在刘希夷的诗里能见到优美的诗歌意境。他的代表作《代悲白头翁》，触景生情，以落花起兴，在深微的叹息声中，有一种朦胧的生命意识的觉醒和对自然的周而复始与青春年华转瞬即逝的领悟。花相似而人不同的意象，深藏着诗人对生命短促的悼惜之情。\n\n这种带有青春伤感的情思贯穿全篇，尤其在对红颜美少年和鹤发白头翁的对比描写中而愈显浓烈，创造出兴象鲜明而韵味无穷的诗境。它包容着情感景象、哲思诸端，显然超越了此前诗人分别对情怀抒发、景物描摹、哲理思索等方面的各有侧重的努力，从而使得刘希夷成为唐诗史上第一个着力于营造诗境的诗人。\n\n二、张若虚的诗歌意境构造\n\n张若虚的《春江花月夜》是一首长篇歌行，采用的是乐府旧题，但作者已赋予了它全新的内容，将画意、诗情与对宇宙奥秘和人生哲理的体察融为一体，创造出情景交融、玲珑透彻的诗境。\n\n从具体的诗境特征看，张若虚显然在刘希夷的基础上进行了进一步的提升与凝炼，将刘希夷所代表的一种新的艺术追求趋向推至极境，将刘希夷初创的诗境提高到一个新的审美层次。正是因此，在唐诗学史上，张若虚既被视为刘希夷之一体，其《春江花月夜》又被明确认为“出刘希夷《白头翁》上”，并且以其“孤篇横绝，竟为大家”的实际存在，使得“李贺、商隐，挹其鲜润，宋词、元诗，尽其支流”，形成一个影响深远的诗境范型，而这也就是张若虚诗的最重要的价值所在。\n\n张若虚和刘希夷在诗歌意境创造上取得的进展，如将真切的生命体验融入美的兴象，诗情与画意相结合，浓烈的情思氛围，空明纯美的诗境，表明唐诗意境的创造已进入炉火纯青的阶段，为盛唐诗歌的到来做了艺术上的充分准备。兴象玲珑、不可凑泊的盛唐诗歌随之出现，也就是十分自然的了。\n\n【李凡关键词：诗歌意境的创造 情景交融 兴象鲜明】","keywords":"","note":"张若虚与刘希夷为唐诗发展做出的贡献，主要就集中在他们表现出来的意境营造的经验与能力，为后人提供了学习的样本。而在二者的成就上，张若虚明显又高刘希夷一筹，对唐诗乃至后世诗歌发展都产生了深远的影响。"},{"id":"139","stars":"★★★★★","title":"谈谈你对于“盛唐气象”的认识","body":"“盛唐气象”这一概念最初源自南宋严羽《沧浪诗话》对盛唐诗歌美学特质的概括，后经现代学者进一步阐发，成为描述盛唐诗歌整体精神风貌的核心术语。\n\n一、“盛唐气象”的内涵\n\n“盛唐气象”是宋元明清时代的一个文学批评的专门术语，指盛唐诗歌的总体风貌特征。所谓“盛唐气象”，着眼于昼唐诗歌给人的总体印象，诗歌的时代风格、时代精神：博大、雄浑、深远、超逸；充沛的活力、创造的愉悦、崭新的体验；以及通过意象的运用、意境的呈现，性情和声色的结合，而形成的新的美感-这一切合起来就成为盛唐诗歌与其他时期的诗歌相区别的特色。宋代严羽的《沧浪诗话》等著作最推崇盛唐诗，指出盛唐诗的特征是“既笔力雄壮，又气象浑厚”，并对此在其诗话中多有阐述，此后常把雄壮、浑厚二者作为盛唐诗歌的风貌特征，并称之为“盛唐气象”。\n\n二、“盛唐气象”的特征\n\n盛唐气象的艺术表现形式是“雄浑”。“雄浑”包括“雄厚博大”和“浑然天成”两方面。在盛唐气象中，雄浑的艺术特征主要体现在以下几个方面：\n\n（一）阳刚与阴柔相兼之美。盛唐诗人的个性特征兼具阴柔与阳刚，他们对社会和自然的感受和体认不拘一格，悲愤或闲适的情感，壮美或清幽的物色，无不包容在他们的艺术视野中，表现在他们的艺术境界里，这使盛唐气象具备了刚柔兼备的艺术情韵。\n\n（二）多样性与统一性共存的表现艺术。盛唐诗人表现形式和艺术风格是多样的，如李白的雄放、杜甫的沉郁、王维的清新，孟浩然的清幽、高适的苍凉，岑参的奇丽等。但这多样性的风格又都统一于“雄浑”中，因为无论诗人写怎样的题材，描绘怎样的意境，都符合“浑然天成”的艺术规律。“浑然天成”的统一性，使得盛唐诗歌于万千气象中显现出一种共性，一种永为后世所艳羡和赞美的美学范畴。\n\n（三）主体风格与多种笔墨相得益彰的艺术魄力。“浑然天成”与“雄厚博大”也是互为因果的，具备了“雄厚博大”的内在修养和感知体系，便能揽天下风云入胸中，纵横开阖，自如运用多种艺术，因此盛唐诗人往往在一种主体风格之外，\n\n还能根据所抒写的对象，灵活而成功地运用多种表现艺术。其之所以如此，就因为盛唐诗人的内在修养深厚，表现手段全面，他们几乎每个人都有几套笔墨，每套笔墨中都能写出极有特色的佳作。这也是盛唐气象雄厚博大的艺术体现。\n\n三、“盛唐气象”形成的原因\n\n盛唐气象的形成有诗歌艺术方面和历史、文化的发展以及当时的社会背景等多方面的原因，具体如下：\n\n（一）盛唐时代所孕育的人们特定的心理状态和精神面貌\n\n（1）南北文化的交融\n\n晋室东渡之后，中国经历了二百多年的分裂和战乱。在这期间，南北双方的文化呈现相当明显的差异。隋朝统一全国，以及大运河的通航，已经开启了南北文化互补的过程。唐朝继隋之后，经过太宗贞观之治，文化交融的过程大大地加速了。一种融合了南北文化之长的、与唐帝国的政治经济形势相适应的新文化达到了成熟的地步。盛唐气象正是这种富有深厚内涵的新文化的升华。\n\n（2）中外文化的交流\n\n当时的长安、洛阳、扬州、广州等大都市，都是中外文化交汇的地方，长安是当时世界上最大的国际都会，居住着许多外国的王侯、供职于唐朝的外国人、留学生、求法僧、外国的音乐家、舞蹈家、美术家，以及大量外来的商贾，至于外国的使臣更是络绎不绝。外国的宗教、音乐、舞蹈、绘画等都流行一时，产生了很大的影响。中外文化的交流，打开了盛唐人的眼界，开阔了他们的胸襟，这对气象的形成无疑起了积极作用。\n\n（3）儒、释、道三教并用，思想界自由\n\n在安定的局面下，儒、释、道三教得以并用，思想界出现比较自由的气氛，这是形成盛唐气象不可忽视的原因之一。儒家在唐朝的地位不断提高，玄宗很重视在官学里研习儒家经典，并允许民间立私学以弘扬儒家学说。对于佛教，玄宗在开元初期曾经采取一些限制的政策，但总的看来他对佛教还是尊重的，对于开元年间传入的密宗尤有兴趣。玄宗的崇道更有甚于尊儒，他在科举中设立了道举：在两京设立崇玄馆；还亲自注释《道德经》颁示天下。在思想比较自由的气氛中，诗人们可以从各方面汲取营养。\n\n（4）人才发展空间扩大\n\n由于唐朝实行抑制门阀士族的政策，以科举取士，打破了门阀士族垄断政治的局面，使大批中下层庶族文人登上政治舞台。与此同时，文化也从少数士族文人手中转移到中下层庶族文人手中。这批在唐朝建国后成长起来的新人，有丰富的生活阅历，比较了解社会的实际、政治的利弊和民生的疾苦。他们有抱负、有见识、有能力，敢于冲破旧的藩篱开拓新的局面。盛唐文化实际上主要是这批新人创造出来的，盛唐气象也就是这批新人的气象。\n\n（5）文人之间关系健康融洽\n\n盛唐文人之间有一种健康融洽的关系，这也有助于气象的形成。杜甫在《忆昔》中回忆开元年间的情况说：“天下朋友皆胶漆”，反映了当时的状况。他们觉得某个人受了委屈，就为之大声疾呼，有担当、不世故。而当他们佩服一个人时，又出自真心的褒之扬之。文人奖掖后进的做法已经形成传统。从以上所举的种种事例可以看出，盛唐文人是怎样的大度。\n\n（二）对前代优秀诗歌遗产的继承与发扬\n\n（1）对汉魏六朝乐府诗的学习\n\n盛唐时代，诗风趋向质朴，扫除南朝浮风气，注意向古乐府学习。古乐府中多民间作品，前代一部分文人乐府诗，因受乐府民歌影响，也具有较浓的民歌气息。这类古乐府诗风格大抵或质朴刚健，或清新活泼。盛唐著名诗人王昌龄、王维、崔颢、高适、岑参、李颀、崔国辅、李白、杜甫等等，都喜欢写作乐府诗。他们用古体写的乐府诗，大抵受汉魏古乐府影响较深，以刚健流畅见长；用绝句写的乐府小诗，则受六朝乐府影响较深，以清新婉转取胜。他们吸取了乐府民歌质朴自然的优长，在此基础上再加上锤炼工夫，使诗的意境更深，韵味更美。\n\n（2）对建安诗歌的学习\n\n除乐府诗外，盛唐诗人还注意向建安诗人学习。以三曹、王粲、刘桢等为代表的建安诗人，作品富有风骨，历史上称为建安风骨。盛唐诗人自觉地以恢复建安风骨为己任。建安文人喜欢写作乐府诗，三曹、王粲等都写了不少乐府诗。建安诗歌风清骨峻、明朗刚健的艺术风貌，实际上可说是清新刚健的汉乐府民歌优良诗风的继承与发扬。因此，盛唐诗人们学习古乐府，学习建安诗歌，二者在精神上是一致的，其目的都是为了建立自己时代的浑厚雄壮的诗风。","keywords":"文学批评专门术语 总体风貌特征 雄浑 阳刚与阴柔相兼 多样性与统一性共存 主体风格与多种笔墨相得益彰心理状态 精神面貌 南北文化交融 中外文化交流 儒、释、道三教并用 人才发展空间扩大 文人之间关系健康融洽 继承与发扬 汉魏六朝乐府诗 建安诗歌","note":"“盛唐气象”是宋及宋以后论述盛唐诗歌整体风貌的一个专用文学理论术语，其整体特征是“雄浑”。而其形成原因，则主要从社会环境和诗歌自身发展两方面进行分析。这一概念在名词解释中出现较多，但也可能会作为简答题或论述题出现，可以说是经常出现的一个核心考点，大家要重点掌握。相关内容可以参考林庚《盛唐气象》，具体资料可以在李凡文学正版群内领取。"},{"id":"140","stars":"★★★","title":"试述京城诗人群的构成及其对唐诗发展的影响","body":"一、京城诗人群的构成\n\n盛唐时期，文官制度的健全让文人热衷于诗歌创作，京城云集了大批诗人，主要可分为三个层级，一是以唐玄宗李隆基、岐王李范和玉真公主为代表的帝王及皇族宗室，二是以张说、贺知章等为代表的朝廷重臣与台阁文人，三是以王昌龄、储光羲、祖咏、郑虔等为代表的京城中下层文士。\n\n二、京城诗人群的创作特点\n\n（一）盛唐时期的宰相群体与台阁重臣诗作多为宴会所得应和之作，内容多描写宫廷生活或歌功颂德、称赞太平盛世之类，风格也显得端庄华美、大度昂扬，显示了官廷诗具有的大唐气象。\n\n（二）京城中下层文士的创作代表了当时诗歌艺术的较高水平，他们的诗歌在内容上突破了官廷诗应制应景的局限，关注的是更广阔的自然山水与更多样的社会风情；在艺术技巧上汲取了宫廷诗的精致典雅，但又不刻意雕琢，尽量显示出自然之美。\n\n三、京城诗人群对唐诗发展的影响\n\n（一）唐代帝王大多爱好文艺，多能诗，促进了宫廷诗歌的发展。皇族宗室也多爱好诗歌，青睐文士，并热衷于诗歌酬唱活动，对诗歌的发展有积极作用。\n\n（二）京城诗人将诗歌作为抒发情感和交游结友的工具，尤其是中下层文士，他们相似的境遇和经历让他们的诗歌呈现出趋同的时代风格，展现了气势恢宏的“盛唐气象”。时代精神的昂扬让盛唐时期的贬谪文学也充满了具有时代特质的从容与洒脱，这种京城诗风是盛唐气度的最佳体现。\n\n（三）京城诗风代表了“盛唐气象”，而各地不同的诗风则展现了唐诗的多元化特征。京城诗人群与地方诗人群之间相互影响，文人入仕的理想让京城诗风对地方诗人有着巨大的吸引力，地方诗人坚守个性的佳作也会反过来对京城诗风产生影响，两者之间的交融互动让唐诗不时焕发新的面貌，诗歌因此蓬勃发展，富有生命力。\n\n（1）有些诗人不在京城，其诗却带有京城诗风的影子。如常建，来往山水名胜之间，他的诗歌意境清迥，语言洗练自然，境界超远，带有京城诗风的味道。\n\n（2）有一些地方诗人受当地山水景致、风土人情的熏染，形成了不同于京城风味的诗歌风格，反过来对京城诗风产生了影响。","keywords":"三个层级构成 两种不同风格 三种影响","note":"盛唐“京城诗”的诞生与流行，是长安地区音乐盛行、经济繁荣、士风高涨等因素共同作用的结果。在这一过程中，以长安为代表的都城不仅仅是诗歌的表现对象，也不只是为诗人提供创作背景，而是成为孕生这一文学形式的母体。都城长安容纳古今、南北、胡汉之长，从制度思想、空间形态与文化形态三个层面，促成了“京城诗”的诞生，并进一步奠定了其体制、主题及艺术风格。"},{"id":"141","stars":"★★★","title":"唐代山水诗、园林诗呈现出哪些新特点","body":"山水田园诗起源于南北朝的谢灵运与东晋的陶渊明，唐朝时期以王维、孟浩然为代表。盛唐山水田园诗派的主要内容是反映田园生活、描绘山水景物，他们的作品风格大多恬静淡雅，充满诗情画意和生活情趣，多以五言古体和五言律绝的形式呈现。唐代山水诗、园林诗的新特点主要包括以下内容：\n\n一、南北兼得的博大气度\n\n盛唐时期，国家的繁荣、南北交通的发展以及包容开放的态度让山水诗进一步发展，宦游的风气也让山水诗的描写范围跨越南北，直至边塞，具有其他时期山水诗无法拥有的博大气度和南北兼得的突出特征。\n\n二、对山水田园的主动追求\n\n盛唐时期文人都有着昂扬奋发的精神状态和渴望入仕、匡时济世的人生理想，同时他们也通过对山水田园的主动追求，通达地处理山林与廊庙的关系，并在自然山水和田园风光中寄托了他们的隐逸情怀，调整了自己的人生哲学和处世心态。盛唐诗人对于田园的关注，更多的是对于自然境界的一种追求，山水田园具备了超越时代的价值内容，品格大大提高。\n\n三、山水田园诗相互融合\n\n盛唐时代园林别业的兴盛与发展，对诗歌创作起到了积极的作用。唐代田制的发展和社会富裕让别业得到发展和普及，享有庄园不再是士大夫的特权，尚未入仕的文人和下层官吏也兴建庄园以备赋闲之需。加上朝廷举贤招隐，许多人将隐居当作入仕的“终南捷径”，官员也要通过“吏隐”的方式来彰显自己的淡泊名利。这些别业往往兼有山水田园之胜，因此盛唐的山水田园诗往往合为一体，拓展了传统山水田园诗的境界。\n\n四、创作技法的发展\n\n唐代的山水园林诗在创作技法上更注重对山水意蕴的捕捉，以清旷空灵的笔墨刻画山水之态。\n\n五、创作群体的扩大\n\n盛唐时期，山水园林诗兴盛，形成了以王维、孟浩然、储光羲等为代表的山水田园诗派，除此之外，其他诗人，如李白、杜甫等也都热衷于山水园林诗的创作。大批文人投身于山水园林诗的创作，对山水园林诗境界的拓展、表现技巧的成熟以及艺术风格的丰富都起到了重要的推动作用。","keywords":"南北兼得的博大气度 对山水田园的主动追求 山水田园诗相互融合 创作技法的发展 创作群体的扩大","note":"盛唐时期社会安定，国力强大，社会的政治、经济、文化全面繁荣。文人士大夫的物质生活优裕，为漫游行旅、赏玩山水提供了条件。社会上佛道思想流行，道家崇尚自然及返璞归真的追求和佛家禅宗的净心明性的境界，为诗歌提供了文化及审美心理的基奠。文人的隐逸情怀也与山水田园诗的形成有紧密的关系，但此际并非为隐而隐，而是酿成了一种向往自然、追求超然独立的文化心态和崇尚自然的审美趣味。此外，晋宋以来的田园诗、山水诗的创作，也无疑提供了艺术上的借鉴。"},{"id":"142","stars":"★★★★","title":"试分析王维山水田园诗“诗中有画”的艺术特色","body":"王维的艺术造诣精湛，艺术品位极高。在山水田园诗中，他诗、书、乐、画兼擅的艺术才华发挥得淋漓尽致，使他的山水田园诗不仅“诗中有画”，而且是绘声绘色的“有声画”。\n\n一、描绘的景物富于图画美\n\n绘画是空间的艺术，讲究“经营位置”和布局构图。王维以画入诗，遂使他笔下山水田园景物的布局错落有序，富于图画美。绘画艺术构思讲究虚实相间，常留虚白，供读画者再创造。王维深谙此道，不仅在描绘山水景物时，往往从虚处落笔，如“江流天地外，山色有无中”，状江水浩渺，山色空濛，有以少总多，以一当十的艺术效果。诗人在表情达意时，追求画外意，韵外致，如“行到水穷处，坐看云起时”，不言情而将诗人超然出尘的意兴和随遇而安的处世态度表现得神完意足。\n\n二、充分调动绘画艺术手段来塑造意境\n\n绘画以线条、色彩为艺术语言，用以抒情达意。王维充分调动绘画的这些艺术手段来塑造意境。如“大漠孤烟直，长河落日圆”与“渡头余落日，墟里上孤烟”，都用落日、孤烟为主要景物，绘状的却是大漠和村落渡头两种截然不同的景色，而各见精彩。此外，王维也善于运用色彩的浓淡、光线的明暗等绘画语言来抒情达意。如“白水明田外，碧蜂出山后”“雨中草色绿堪染，水上桃花红欲燃”，用明丽鲜艳的色彩表现盎然的春意和诗人欢欣喜悦之情。而“深林人不知，明月来相照”中光色明暗的对比，所表达的则是诗人的孤寂和清高。\n\n三、善于捕捉和描摹大自然的音响来刻画景物，创造意境\n\n“明月松间照，清泉石上流。竹喧归浣女，莲动下渔舟”，其中竹林浣女的嬉笑喧闹及其动竹之声是实写，石上清泉的流水声、舟穿莲摇的划船声是虚写，构成的是一幅生机勃发、诗意浓郁的秋景。而同是状“山中秋色”，“草间蛩响临秋急，山里蝉声薄暮悲”两句，则是借助蟋蟀、秋蝉的鸣叫声，渲染萧瑟的气氛和诗人落寞的心情。王维偏爱清幽寂静的境界，又善于运用以动衬静的手法，如“月出惊山鸟，时鸣春涧中”“雨中山果落，灯下草虫鸣”，都是以鸣声表现“山更幽”的境界和诗人清心入静的禅趣。\n\n总之，王维是以诗人的灵感、画家的眼光、乐师的听觉创作山水田园诗的，所以他这些诗就不仅是“诗中有画”，而且是绘声绘色的有声画。\n\n【李凡关键词：富于图画美 塑造意境 捕捉和描摹大自然的音响】","keywords":"","note":"王维山水田园诗的“诗中有画”这一特征，在考查中出现的频率非常高，所以我们要重点关注。苏轼曾说：“味摩诘之诗，诗中有画；观摩诘之画，画中有诗。”正是指的王维山水田园诗这一特征。所谓“诗中有画”，就是运用绘画艺术来创作诗歌，包括描绘景物、塑造意境，捕捉和描摹大自然的音响三个方面。除了山水诗之外，王维还曾经写过边塞诗与禅诗，因而有的学校会针对王维的诗歌类型出题，具体题目可以在李凡文学正版群内领取。"},{"id":"143","stars":"★★★★","title":"简述王维山水田园诗的艺术特色","body":"王维是山水田园诗派的代表诗人之一，其内容多为清淡自然的山水田园，开创了情景交融、物我契合的意境，发掘并开拓了自然美。具体表现如下：\n\n一、隐士特色，闲适情调\n\n王维田园诗有隐士特色和闲适情调，固然是因为他生活优裕，饶有田庄别业，不愁衣食，无须躬耕，也是因为他失望于现实，醉心于田园山水，把田园景色的自然美好，农村人情的真挚淳朴，作为现实龌龊、官场倾轧的对立面来加以描绘和讴歌。王维的田园诗有些表现了农村田园牧歌式的和谐美，有一定的愉悦性情的审美；另有不少田园诗有初、盛唐的时代气息，充满勃发的生机。\n\n二、诗如画卷，美不胜收\n\n苏轼曾说：“味摩诘之诗，诗中有画，观摩诘之画，画中有诗。”王维的诗具有“诗中有画，画中有诗”的静逸明秀诗境，兴象玲珑而难以句诠。\n\n绘画是空间的艺术，讲究“经营位置”和布局构图。王维以画入诗，遂使他笔下山水田园景物的布局错落有序，富于图画美。绘画艺术构思讲究虚实相间，常留虚白，供读画者再创造。王维深谙此道，不仅在描绘山水景物时，往往从虚处落笔。诗人在表情达意时，追求画外意，韵外致。绘画以线条、色彩为艺术语言，用以抒情达意。王维充分调动绘画的这些艺术手段来塑造意境。此外，王维也善于运用色彩的浓淡、光线的明暗等绘画语言来抒情达意。王维还善于捕捉和描慕大自然的音响来刻画景物，创造意境。\n\n三、诗渗禅意，流动空灵\n\n王维的思想是受到佛教影响的，因此喜欢以禅入诗。他往往用佛家的思维方式去感受世界、认识世界，用佛家的语言表述方式表达自己对世界的认知。佛教禅宗是王维接受的主要佛教思想。禅宗认为，人要想从现实中解脱，唯一的途径就是摆脱现实中的一切欲望，对尘世的一切都不要执着，达到澄心净虑的“无念”之境。这也是王维许多诗歌中的内容。王维习惯把宁静的自然作为凝神关照而悉心静虑的对象，将禅的静默观照与山水审美体验合而为一。以禅入诗使得王维的诗歌呈现出一种独特的空灵美。他的有些诗里并未直接出现佛语，但是亦蕴含着无限的机趣。\n\n四、自然生动，不事雕琢\n\n诗歌是语言的艺术，融画入诗，描摹声响，都离不开语言。王维能得心应手地驾驭语言，才能达到上述艺术境界。他的诗中有“细枝风响乱，疏影月光寒”之类的精细刻画，也有“万壑树参天，千山响杜鹃。山中一夜雨，树杪百重泉”之类的大笔濡染；既有“泉声咽危石，日色冷青松”之类的炼字，也有“松风吹解带，山月照弹琴”之类的口语。而它们的共同特点是自然生动，不事雕琢，达到炉火纯青的境界。\n\n总之，王维山水诗艺术成就斐然，诗趣与禅趣相映，自然与心境相融，写得纯净优美，为后人所激赏。","keywords":"隐士特色 闲适情调 诗如画卷 诗渗禅意 自然生动 不事雕琢","note":"王维山水田园诗成就最高，因而在考查中出现的频率也比较高。分析王维山水田园诗的艺术特征，我们要注意结合王维的思想、经历和身份。王维不仅参禅悟理，学庄信道，还精通诗、书、画、音乐等。可以明显看到，王维的山水田园诗受到佛学思想、隐逸思想和其绘画技巧的影响。"},{"id":"144","stars":"★★★★","title":"试分析陶渊明与王维山水田园诗创作的异同","body":"陶渊明是中国田园诗的开创者，王维是山水田园诗的代表。他们都是田园诗的集大成者，但是由于两者的生活道路、个性秉赋、文化背景的不同，他们最终选择了不同的生存方式，这最终决定了两者诗歌虽一脉相承，却表现出了许多区别。\n\n一、都追求归隐，但具体态度不同\n\n陶渊明与王维都追求归隐，也做出了归隐的选择。但陶渊明归隐是因为不愿与世俗同流合污，而王维归隐虽然也有厌倦官场这一方面的原因，但主要还是受到了禅宗的影响。这也使得二人的山水田园诗流露出了不同的个性风格。\n\n从生活地位、个性来看，陶渊明不肯改变本性以适应世俗，故与仕途决裂，安贫乐道，体现了儒家“独善其身”的思想，同时也表现了道家“遗世独立”思想对陶渊明的影响；根植于农田耕作中的充沛情感以及固穷却要守志、绝不忘记最初信念的情操，还有每时每刻在农田边上劳作所获得的快乐心情，这些情致是他诗作当中展现的重点内容。\n\n王维一生过着亦官亦隐亦居士的生活，可以说，是富贵不离身的隐逸-官隐，王诗更多的是展现其纵情山水，游遍田园的归隐生活状态，较为具体地表现出其生活上热衷的事物以及审美上的追求。\n\n二、诗中都蕴涵哲理，但具体内容不同\n\n从对待玄理与禅宗方面来看，陶渊明与王维山水田园诗中都隐含着深刻的理趣。不过，陶渊明诗中蕴涵的是哲理化的生活体验，而王维诗中更多的则是禅趣。\n\n陶渊明将生活中的体验提炼到哲学的高度，成为以发挥哲理为主要内容的作品，陶渊明在中国文化史上是第一位心境与物境冥一的人，为玄学人生观画了一个句号，是魏晋古朴诗歌的集大成者。\n\n王维笃信佛教，被后人称作“诗佛”，他的禅悟是别的诗人难以企及的，与坐禅时的体验相关联，王维多写独坐时的感悟，将禅的静默观照同山水审美体验结合起来，在对山水的描绘中，折射出清幽的禅趣、禅意，从而寄托诗人的幽独情怀。可以说，王维的许多诗“字字入禅”，具有禅趣、禅悦、禅味，言有尽而意无穷，传达出了禅的意蕴。\n\n三、都追求意境创造，但具体表现不同\n\n陶渊明与王维都注重意境的创造，但在具体手法上，二人表现出了很大的差异，因而最终表现出来的意境也有很大的不同。陶渊明表现出来的是整体的自然美，而王维则表现出了“诗画合一”的特色。\n\n从意境方面来看，陶渊明之诗很有意境，以写意为主，注重物我合一，情、景、事、理达到浑融一体的地步，表现出整体的自然美。\n\n而王维从早期的图物写貌和巧为形似之言中摆脱出来，进入“神会于物”的意境创造。他的诗歌追求一种含蓄、淡雅、空灵、形神俱似的最高境界和宁静之美，充分发挥诗歌表情达意的特长，以表现画面难于表现的内容，将诗歌、绘画和音乐艺术融会贯通，使诗情和画意完美地融合在一起。\n\n四、语言都追求自然，但具体目的不同\n\n从语言方面来看，陶渊明诗歌语言看似平淡、朴素的“田家语”，但并非随口而道，而是经过艺术提炼，在平淡、朴素之中见警策、绮丽，呈现明净的单纯，使人感到厚而有味，来调动读者的联想和想象，取得意外的效果，让读者体会只可意会不可言传的东西。\n\n王维诗语言同样清新活泼，自然通俗，似平淡实精雅，令人咀嚼品尝不已，但王维的诗歌语言艺术是为其诗中有画、描摹声响等表达目的服务的。","keywords":"追求归隐 态度不同 蕴涵哲理 内容不同 意境创造 表现不同 追求自然 目的不同","note":"陶渊明和王维都是山水田园诗的代表作家，甚至可以说是一脉相承，因而在创作中必然有许多相似之处。但是，陶渊明和王维毕竟处于两个不同的时代，出身、生活方式、思想倾向和时代背景等都有很大的不同，因而二者的诗歌创作也必然有许多不同的倾向。关于二者的诗歌对比是在考查中出现频率比较高的一部分内容，大家要注意重点掌握。相关内容可以参考甘益慧《陶渊明与王维山水田园诗歌之比较》、毛三艳《陶渊明与王维田园诗比较研究》，具体资料可以在李凡文学正版群内领取。"},{"id":"145","stars":"★★★","title":"孟浩然的诗歌创作特征是怎样的","body":"孟浩然的诗歌主要表现他的隐逸生活，他是一代名士，风流倜傥，艺术偏精独诣，总的成就虽不及王维，而比王维更有个性和创造性。具体来看，孟浩然的诗歌创作特征，主要表现在以下几个方面：\n\n一、题材以隐居闲适和羁旅愁思为主\n\n孟浩然的一生几乎是在隐居与旅程中度过，因此他的诗歌多写隐居闲适和羁旅愁思，伫兴造思，不落凡近。孟浩然的隐逸诗，表达了他栖幽隐逸的志趣。孟浩然的山水诗，常于行旅、怀友、赠别之时吟咏江南，尤其是江湘洞庭一带的山光水色。孟浩然的这类山水诗，善于撷取孤月、疏雨、古木、风泉、幽壑、松月、寒钟、孤琴等景物，融入旅思、乡恋、客愁、友情，表现一种幽远凄清的意境，形成他的山水诗清幽淡雅的风格。\n\n二、贴近生活\n\n孟浩然的山水田园诗，更贴近自己的生活，出现在孟浩然诗里的景物描写，常常就是他生活环境的一部分，带有即兴而发、不假雕饰的特点。在塑造意境时，孟浩然以表现自己的生活和行动为主，结合对周围环境的描绘，抒发自己的思想，来构成意境。诗语自然纯净而采秀内映，相较而言，似比王维的诗更显淳朴，更接近陶渊明诗“豪华落尽见真淳”的境界。\n\n三、平淡清远而意兴无穷的明秀诗境\n\n孟浩然一生多次出游，而且偏爱水行，在乘舟漫游吴越水乡的过程中写了不少山水诗。遇景入咏时，他常从高远处落笔自寂寥处低徊，随意点染的景物与清淡的情思相融，形成平淡清远而意兴无穷的明秀诗境。如果说王维的山居歌咏长于头空山的宁静之美的话，那么孟浩然的乘舟行吟之作，则给人以洗削凡近之感，情思的净化、语言的清淡，和诗境的明秀融为一体，将自然纯净的山水之美透彻地表现了出来。\n\n四、自然平淡的风格\n\n自然平淡是孟浩然山水诗的风格特点。孟浩然擅长朴素清淡的白描手法。他的诗里没有抅奇抉异的语言，往往在平白如话的描写中见出清空之境和传神之韵。尽管他的诗中也有刻画细致、用字精审的工整偶句，但非有意于模山范水，只是一时兴到之语。观其全诗多以单行之气运笔，一气浑成，无刻画之迹；妙在自然流走、冲淡闲远，不求工而自工。","keywords":"隐居闲适 羁旅愁思 贴近生活 平淡 清远 意兴无穷 自然平淡","note":"孟浩然与王维并称，都是山水田园诗派的代表诗人。大家要注意到二者虽然同样擅长山水田园诗，但风格却略有差别，可以通过相互比较共同记忆。孟浩然的诗歌在题材上主要表现隐逸生活和羁旅愁思，而且十分贴近自己的生活，在艺术上比较突出的风格则是“平淡”，从中我们明显感受到与王维诗歌的区别。"},{"id":"146","stars":"★★★","title":"试分析王维、孟浩然山水诗的区别","body":"以王维、孟浩然等为代表的山水田园诗派是盛唐诗歌流派之一，内容多为清淡自然的山水田园，开创了情景交融、物我契合的意境，发掘并开拓了自然美。但由于生活环境和性格气质的不同，在诗的意境、写法和艺术风格等方面，王、孟同中有异，具体表现如下：\n\n一、意境之别\n\n王维的诗歌达到了“无我”境界，表现出山水的宁静之美，抒发了诗人自甘寂寞的山水情怀和一片完全摆脱尘世之累的宁静心境，“兴来每独往”，王维喜欢写独坐时的感悟，在清幽的禅趣中描绘山水清晖。“行到水穷处，坐看云起时”，云水之间，天高地阔，似乎一切情绪的波动和情思都被净化掉了，忘乎自我，只有难以言说的自然之美。\n\n孟诗更贴近自己的日常生活，“余”“我”等字眼常出现在诗里。其《过故人庄》叙写了“邀我至田家”后的农村生活情趣，出现的景物描写诸如鸡黍、场圃、桑麻、绿树、青山、菊花等都是生活场景的构成元素，字里行间洋溢着生活的气息带有即兴而发，不假雕饰的特点。\n\n二、写法之别\n\n王维精通音乐，擅长绘画，其诗具有“诗中有画，画中有诗”的静逸明秀，兴象玲珑而难以句诠。其《山居秋暝》之“明月松间照，清泉石上流”，抓住月下林中的特色来写：月光透过松树的缝隙，洒下点点亮斑；清泉流经石上，发出潺漏声，突出了林中的静谧清幽。王维以他画家的眼睛和诗人的情思，写物态天趣，宁静优美而神韵缥缈。\n\n孟浩然遇景入咏时，常从高远处落笔，自寂寞处低回，随意点染的景物与清淡的情思相触。其《春晓》之“夜来风雨声花落知多少”，在咏景时不禁透露出对明媚宜人的大好春光的惋惜之情，但又无迹可寻，形成平淡清远而意味无穷的明秀诗境。\n\n三、风格之别\n\n王维的诗空灵自然，他习惯把宁静的自然作为凝神关照而悉心静虑的对象，将禅的静默观照与山水审美体验合而为一。如“行到水穷处，坐看云起时”，水穷尽处，自然也就是深山空静无人处。人无心而至此，云无心而出岫，可谓思与境谐、神会于物。将对境观心而道契玄微的禅意渗入山情水态之中，化作天光云影，空灵而自然。\n\n冲淡自然则是孟浩然山水诗的风格特点。尽管其诗也有刻画细致、用字精审的工整偶句，但非有意于模山范水，只是一时兴到之语。以气运笔，一气浑成，无雅琢之迹，妙在自然流走、冲淡闲远，不求工而自工。\n\n王维、孟浩然作为盛唐时期山水田园诗派的代表人物，他们对后世诗歌创作产生了巨大的影响。后代诗人，在诗歌意境的刻画、语言的锤炼等方面，尤其是田园山水题材作品的创作上，或多或少都受到王、孟作品的启发。\n\n【李凡关键词：王孟山水诗比较 三个方面 代表作品分析】","keywords":"","note":"在备考时，不仅要了解每一位诗人，更要注意同时期、同题材诗人之间的对比，要更加灵活地运用所学知识，做到融会贯通。王、孟二人，不仅处于同一时代，并且属于同一流派，二者的诗歌创作必然是同中有异，异中有同。二人的相同点便是山水田园诗派的共同特征，而二人诗歌的不同点则是二者的个性所在。"},{"id":"147","stars":"★★★","title":"试论盛唐的隐逸之风对诗歌创作的影响","body":"盛唐时代国力强盛，社会风气宽容开放，加之唐统治者出于实际的政治需要屡屡下诏求贤征隐，以显示太平，教化风俗。这种礼遇隐士的做法促进了盛唐独特的隐逸风尚，以孟浩然、王维为代表的隐逸诗人群体就是在这种风尚中形成的。\n\n一、推动山水田园诗大量出现\n\n隐逸使大批知识分子走入山林、江湖之中，与山水产生了非同寻常的亲和关系，这正是山水文学产生、兴起的重要的社会条件之一。由于隐逸形式与山水的历史联系，不管隐者受何种思想支配，在动机、目的上无论是无欲的、守节的、修行的、避乱的，还是走“终南捷径”的，甚至附庸风雅的，等等，都把山水作为依托对象，与山水产生亲和的关系。这种亲和关系是山水自然美的发现、认识、开发和艺术表现的重要条件。因此，盛唐山水田园诗的大量出现，与隐逸之风的盛行有直接的关系。\n\n二、促进山水田园诗的合流\n\n山水田园诗在唐代的发展成熟，隐逸的诱因不可忽视。隐逸不仅促成田园山水在晋宋的兴起，而且隐逸在唐代的转变也带来山水与田园的合流。唐代山水田园诗的主创者大多有隐逸的经历。他们或敛迹田园，或亦官亦隐，或在郡斋中求得隐逸之趣，从王绩、王维、孟浩然、储光羲、常建、祖咏、韦应物等行迹，可以清楚地看出隐逸不仅深入其人格气质，而且还将这种“乐天安命、适性自然的人生观”不自觉地融入创作中，改变着由东晋陶渊明和刘宋谢灵运分别开创的山水诗、田园诗的面貌，使之趋于融合。\n\n三、推动明秀诗境的创造\n\n山水情怀对于明秀诗境的创造十分重要。因唯有甘于寂寞，才能对自然有细致敏锐的观察，才能以一种虚灵的胸襟去体悟山水，由实入虚，一片空明，向外发现了山水的美，向内发现了自己的真性情。孟浩然的纵情山水，还不时流露出深感寂寞的孤独；王维晚年的归隐，确已达到了他在《裴右丞写真赞》里说的“气和容众，心静如空”的“无我”境界。因此，在表现自然山水的宁静之美方面，王维诗的心态更具典型意义。","keywords":"山水田园诗大量出现 山水田园诗的合流 明秀诗境的创造","note":"盛唐时期隐逸之风对诗歌的影响主要集中于山水田园诗之中，一方面，隐逸之风为山水田园诗准备了大量的作者，进而推动了山水田园诗大量出现；另一方面，隐逸之风推动了山水田园诗的变革。当然，隐逸之风也影响到了其他诗歌，这主要集中于意境创造上面。"},{"id":"148","stars":"★★","title":"试论佛学思想对王、孟等山水田园诗人的影响","body":"唐代山水田园诗人中，王维很早就归心于佛法，精研佛理，受当时流行的北宗禅的影响较大，晚年思想又接近南宗禅。孟浩然、裴迪、储光羲、刘眘虚、常建等人，也都与禅僧往来很密切，作诗深受禅风的熏染。佛学思想对山水田园诗人的影响，主要表现在以下方面：\n\n一、促使诗人接近山水、表现山水\n\n佛教强调通过沉思冥想使精神集中，达到禅定的境界。这种冥想，是要在自然中体验一种宗教的快乐，对自然“观想静察”，以自然所体现的“德”隐喻佛法的广大无边。这种以禅入定、由定生慧的精神境界，是中国人接触佛教大乘教义后体悟到的一种心灵状态，对王、孟等人的艺术思维和观物方式影响极大。佛家与道家同样以自然作为体道悟道的对象，作为主观沉思的依据，作为传达思想的意象来源。这些都与道家相一致，也促使诗人们接近山水，表现山水，以自然景物娱心，抒情言志或写人。\n\n二、清淡的诗歌风格\n\n因习禅讲究悟性，山水田园诗人语言表达以简为妙，甚至于以不答为答，抑或答非所问，只以启发听者的悟性为目的。另外禅僧们淡泊的心境，朴素的生活以及清幽的生活环境，也促成他们在诗歌创作中用词设语的朴素和情调的恬淡。类似的感情格调亦多见于与王孟诗风相近的其他诗人的作品中，形成了偏于表现自然山水宁静之美的清淡诗风。\n\n三、“空灵”的艺术追求\n\n禅家强调直觉体验，追求顿悟，这种主体参悟性常常打破了时空界限和物我界线，表现出“空灵”的特征。拈花微笑的空灵境界，是禅的最高境界，也是王、孟等人在山水诗创作中所追求的艺术极境。僧人脱俗出世的生活和情志，在诗歌构思中往往与生活中实在的景物拉开距离，留下空白；在体悟中重视主体，在思维中常常不受时空、外物的局限，表现出强烈的主观随意性，故而诗境不至于板滞，而富轻盈灵动之感。\n\n在唐代山水田园诗人创造的明秀诗境中，既有澄清精致的宁静画面，又有绵邈灵动的情韵，能于空静中传出动荡，平淡里透出幽深。此外，王、孟等人还善于写静中之动，如静谧山林里的一声鸟叫、清潭中的游鱼、深山古寺的几杵疏钟等，能于空寂处见生气流行，清幽禅趣转化为诗的悠远情韵，更显冲淡空灵。","keywords":"接近山水 表现山水 清淡诗风 空灵境界","note":"在注意到盛唐山水田园诗派受到了隐逸之风的强烈影响的同时，我们也不要忽视佛学思想对山水田园诗人的影响。山水田园诗人要么自己就笃信佛教，要么与佛教众人关系密切，佛学思想不可能不对他们产生影响。佛学思想对山水田园诗人的影响，表现在诗歌题材、诗歌风格和艺术追求等多个方面，大家可以结合具体作品去理解记忆。"},{"id":"149","stars":"★★★★","title":"试分析盛唐边塞诗繁荣的原因及主要特征","body":"以边塞为题材的诗在唐代极为流行，盛唐时蔚为壮观。边塞诗为唐诗带来慷慨壮大的气势情调和壮美的境界。\n\n一、盛唐边塞诗繁荣的原因\n\n（一）国家强盛繁荣为边塞诗发展提供了坚定的物质基础\n\n“盛唐”时期，在经历了唐太宗、唐高宗、武则天等近一百年的治理，又经过唐玄宗开元年间三十年的惨淡经营，国家发展到空前强盛的阶段，盛唐时期，唐王朝的国势空前强盛。无论是政治、经济、军事还是思想文化诸方面，几乎都达到了中国封建社会的极致，是当时世界上文明程度最高、影响力最大的国家。这就为文学艺术的发展提供了坚定的物质基础。\n\n（二）知识分子形成以入幕从军、博取军功为荣的风气\n\n盛唐士人们普遍拥有乐观情绪与从政热情，玄宗后期重视边功的现实，又为士人们实现自己的功业理想提供了难得的机遇，中下层知识分子很快形成以入幕从军、博取军功为荣的风气，价值追求发生极大改变。在诗人们眼中，从军边塞是建功立业的捷径，因此，他们义无反顾，奔向沙场，以其诗笔尽情地抒发驰骋沙场、为国建功的雄心壮志和慷慨从戎、杀敌御辱的爱国思想，关注士卒命运的人道精神、展示长河落日的塞外壮景，透射出昂扬奋发的强烈的时代精神。\n\n（三）初唐诗歌理论建树和创作实践为边塞诗发展扫清障碍\n\n就诗歌而言，经过“初唐四杰”、陈子昂为代表的几批诗人的理论建树和创作实践，基本廓清了自齐梁以来弥漫诗坛二百馀年的浮华绮靡之风，特别是陈子昂倡导的诗歌革新取得了很大胜利，为盛唐诗歌的全面发展开辟了康庄大道。\n\n二、盛唐边塞诗的主要特征\n\n（一）积极用世的思想倾向\n\n盛唐边塞诗的作者们，在思想倾向方面，大都积极用世，在追求功名的同时，亦有慷慨报国的雄心壮志，因此，这种边塞诗的背后潜藏着儒家的伦理观念和政治情怀，当个人的功名气节和国家的安危治乱，乃至民族的生死存亡融为一体的时候，一己的政治抱负便会升华为“投笔从戎”的壮烈行为和“以身殉国”的忧患意识。\n\n（二）题材上反映军旅生活的各个方面\n\n在题材或主题方面，盛唐边塞诗主要反映与边塞征战生活相关的军旅生活的豪壮或艰辛，战争场面的壮阔或残酷，也有凯旋的喜悦、失败的悲伤，对正义战争的歌颂，对不义战争的谴责；或描绘边塞风光的雄浑苍茫，或叙写边地民族间的友好交往。其题材之广泛、内容之丰富，充分反映了诗人们对这一方面社会生活认识之深刻、眼界之宽广。\n\n（三）雄浑的美学境界\n\n在审美趣尚方面，盛唐边塞诗的作者们，往往追求一种“具备万物，横绝太空”的雄浑的美学境界。他们笔下的人物显得威武豪迈，气吞山河。同时，诗人在寻找表达自己激情的“客观对应物”即景抒情时，大都选取大笔挥洒、浓墨重彩之景象，这也是“江山之助”，使其诗歌大放异彩。","keywords":"物质基础 博取军功为荣的风气 扫清障碍 积极用世 军旅生活各个方面 雄浑的美学境界","note":"盛唐边塞诗的繁荣有其现实基础，那就是唐朝国力的强大和士人入幕从军的风气，但诗歌自身理论的变革也不容忽视。盛唐边塞诗在艺术上与其他时期的边塞诗都有不同，整体积极昂扬，与这一时期唐朝国力蓬勃向上一致。可以说，正是先有了盛唐，才有了盛唐边塞诗。"},{"id":"150","stars":"★★★","title":"王昌龄的诗歌创作特征","body":"王昌龄是个慕侠尚气、纵酒长歌的性情中人。不乏睥睨一世的狂放气概。他的一再被贬，与不护细行、放纵不羁很有关系。但因出身孤寒和受道教虚玄思想的影响，他身上有种一般豪侠之人缺乏的深沉，观察问题较为敏锐，带有透视历史的厚重感。王昌龄的诗歌创作特征，主要表现在以下方面：\n\n一、激昂沉郁的诗歌风骨\n\n激昂是指奋发昂扬之气，沉郁是指深沉蕴藉之势，它们是相反相成的两方面，共同构成了王昌龄独特激昂沉郁的诗歌风骨。不可否定王昌龄诗歌中有豪爽明朗、奋发昂扬的一面，他诗中有对人生、社会的积极思考，有建功立业的豪壮热情和乐观自信，有坚持高洁人格的坚贞，这些都是他诗中雄壮激昂、光辉明朗的一面，也是历代研究者重点研究的一面。但是王昌龄诗歌还杂有一些黯淡的色调，构成了王昌龄诗歌风骨沉郁的一面，他在讴歌英雄的同时有悲壮的无奈，在享受自然的同时有看透人生的悲凉和孤独，在关注和揭露社会弊病时有感同身受的痛苦，在追求理想的热情乐观中有愁苦之情，孤愤之气。黯淡凄苦的色调与明朗光辉的成分共同构成了王昌龄诗歌激昂沉郁的独特气骨，是独具王昌龄个性的盛唐气象。\n\n二、简练清峻的语言风格\n\n王昌龄的诗歌从语象选择、句式运用到语句组合三方面都体现了诗人对典雅劲健的语言艺术风格的追求，这是诗人内在的诗歌艺术风格的要求。\n\n在语象选择方面，王昌龄多选用大的数词、有力度的动词、准确的形容词来表现有气势的大场景或有气魄的大胸怀，体现出了语言的力量美、气势美。在句式选择上面，王昌龄在诗中多使用短句、变形句式、紧缩复句。使语言有力量感、经济简练。诗歌中的语句组合也体现着他简练清峻的语言风格。\n\n三、含蓄抒情手法与比兴物象结合\n\n王昌龄在诗中继承了《诗经》《楚辞》及陶渊明的比兴物象，他的成就不在于对比兴物象数量、种类的开拓，而在于对这些传统比兴物象的运用。王昌龄在各种含蓄抒情手法里镶入比兴物象，将含蓄抒情手法与比兴物象巧妙地结合起来运用，取得了更胜一筹的含蓄效果。他主要用了两种方法将比兴物象融入诗中：一种是化比兴物象为景象，一种是化比兴物象为动作对象。王昌龄将比兴物象融入诗中的技巧达到了了无痕迹的境地，创造出了含蓄婉曲的诗歌意境。\n\n四、情景相间\n\n王昌龄虽然不是以山水诗名世的，但他提倡诗歌应该“情景相兼”，其诗中有大量的描写手法。特别是其七绝诗中描写手法更是繁密，因此其七绝诗歌具有可视性，有强烈的画面感。王昌龄的描写艺术虽然没有精细的技巧，但有突出的特色。他无意于景物的形色刻画和景物位置的安排，往往从一个视点上用直接的语言写出景物神韵，突出自己对景物鲜明心理感受的描写。从他所描写景物的格调上看，其七言绝句多为凄清寂丽的景物描写和动作描写，而五言古诗多为气势磅礴的景物描写。","keywords":"激昂沉郁 简练清峻 含蓄婉曲 比兴物象 情景相间","note":"王昌龄的诗歌创作特征，整体考查较少，但大家也不要忽视。分析王昌龄的诗歌创作特征，我们主要从整体风貌、语言风格、抒情手法和描写艺术四个角度进行，必要时可以结合具体作品进行分析。可以看到，王昌龄的性格特征在其诗歌创作中被表现得淋漓尽致，所以知人论世还是有必要的。"},{"id":"151","stars":"★★★","title":"试分析高适边塞诗的创作特征","body":"以边塞为题材的诗在唐代极为流行，盛唐时蔚为壮观。作为盛唐边塞诗的杰出代表，高适的诗歌在反映现实的深度方面超过同时的许多诗人，应时而生的追求不朽功名的高昂意气，与冷峻直面现实的悲慨相结合，使他的诗有一种慷慨悲壮的美。高适的诗歌创作特征，主要表现在以下方面：\n\n一、基调慷慨激昂\n\n高适的边塞诗，多数写于蓟北之行和入河西幕府期间，是据诗人亲临边塞的实际生活体验写成的。除七言歌行外，在表现形式上多采用长篇咏怀式的五言古诗，将作者个人的边塞见闻、观察思考和功名志向糅为一体，苍凉悲慨中带有理智的冷静，但基调是慷慨昂扬的。特别是他被哥舒翰聘用，入河西幕府后，精神很振奋。热烈向往边功的慷慨豪情，往往使他的诗显得壮大雄浑、骨气端翔。不过，战争的艰苦往往超出想象，也是诗人能冷静感受到的，故慷慨激昂中亦时见悲凉。\n\n二、思想深刻\n\n高适的边塞诗是他豪壮的戎马生活的写照，也是他对边疆战事关注和思考的结果。他常常能以政治家的眼光分析边防问题，以政论的笔调表达对边防政策的见解，揭露边防政策的弊端。这使他诗歌的思想深刻性超出了同时代的其他边塞诗人。在高适的诗歌中，有对国家安定边疆之术的思索，有对主帅非人、处置失当而造成战争失利的责难与忧心，还有消除边患的希望和理想，《燕歌行》一首更是以写实的笔墨描绘了边塞的景象、军旅生活的艰辛，对于军中存在的弊端进行了深刻的揭露与批判。\n\n三、“多胸臆语”“尚质主理”\n\n高适“负气敢言，权近侧目”，其诗有所“感”、有所“激”发，诗中“感激”一词多达十来处，如“平生怀感激”“伊余寡栖托，感激多愠见”“感激建安时”。说明他的抒情诗以胸臆语抒慷慨气，多用赋法，较少比兴。其状景写人，也常用大笔濡染，较少精雕细刻。\n\n四、古、近体兼擅，尤长于歌行\n\n高适的七言歌行打破了初唐“四句一转韵，转必双承蝉联而下”的程式，而能错综变化，“散行中时作对偶警拔之句，以为上下关键，非惟于散漫中求整齐，平正中求警策。而一篇之骨，即树于此”。风格之沉雄激昂，也一变初唐歌行的婉丽之风。他的五古质直古朴，近于汉魏。殷璠在《河岳英灵集》里称赞高适，说他“诗多胸臆语，兼有气骨”。故高适作诗以质实的古体见长，律诗好的不多，但他写的一些与从军边塞相关的绝句，亦有气质沉雄、境界壮阔的特点。如《别董大》，再如《塞上听笛》。这样的诗，若没有亲临边塞的生活体验，也是不容易写出来的。","keywords":"慷慨悲壮 思想深刻 多胸臆语 尚质主理 长于歌行","note":"高适是盛唐诗人的杰出代表，他的作品既承载了恢弘豪迈的盛唐气势，又流露出与同时代其他诗人相异的特质。从整体来看，高适的诗歌创作与盛唐昂扬慷慨的基调是一致的，但又融入了深刻的思想-这又与高适的性格有关系。可以说，是盛唐的时期氛围和高适的个人性格共同铸就了他的诗歌艺术。"},{"id":"152","stars":"★★★★","title":"试分析岑参边塞诗的思想艺术特征","body":"在以写边塞题材著称的盛唐诗人里，岑参是留存作品最多的。他前、后两次出塞创作的边塞诗多达七十馀首。尤其是后一次出塞，他写出了同类题材中最优秀的作品，其艺术成就在某些方面已超过了高适，无愧高、岑并称的荣誉。岑参边塞诗的艺术特征，主要表现在以下方面：\n\n一、整体基调昂扬向上\n\n岑参与高适一样，热衷于功名，有着强烈的入世精神。他先后两次出塞，留下了许多优秀的边塞诗篇。不同于高适诗歌以思想的深度见长、悲壮中带有冷静的分析，岑参的诗善于以雄奇瑰丽的笔触描绘西北边疆的奇异景色、民风民俗以及将士勇敢报国、不畏艰苦的精神，饱含热情，气概豪迈。他突破了以往征戍诗多写边地苦寒和士卒劳苦的传统格局，作品中充满昂扬的情绪和乐观的精神。\n\n二、边塞题材内容广泛，突破了以往格局\n\n描绘西域边疆雄奇壮丽的风光，是岑参边塞诗的重要内容。茫茫戈壁，巍巍天山，皑皑白雪，炎炎烈日、火云、热海和狂风飞沙，加上边疆变幻不定的气候，构成他的边塞诗奇异绚丽的特色。在立功边塞的慷慨豪情的支配下，岑参印象中的军旅生活、边塞风物、异域风情，全都变得神奇瑰丽起来，岑参热情地对这些内容加以歌颂，突破了以往征戍诗写边地苦寒和士卒劳苦的传统格局，极大地丰富拓宽了边塞诗的描写题材和内容范围。\n\n三、新奇峭丽\n\n岑诗的立意构思、遣词造境无不具有新奇峭丽的特色，传奇式的边塞从军生活，神异奇特的西域风光，是形成岑参诗新奇峭丽风格的客观基础，而“岑参兄弟皆好奇”，则是形成岑诗风格特色的主观条件。本来就奇异不凡的现实生活题材，经过好奇的诗人独特的想象，艺术的夸张，绚丽的著色，便更富于浪漫的色彩：奇异的西域风光变得更加神奇瑰丽，艰苦的军旅生活显得悲壮而有诗意，激烈的战斗使人惊心动魄。这种“奇而入理”“奇而实确”的艺术境界是创作的主客观条件在岑诗中得到和谐统一的结果。\n\n四、用韵灵活，意调高远\n\n艺术表现上，岑参借鉴了高适等人七言歌行纵横跌宕、舒卷自如的体势而加以创新，形式接近乐府，但完全不用乐府古题而自立新题。用韵十分灵活，有基本上一韵到底的，也有两句换韵或三句换韵的，视所写内容而定。声韵或轻快平稳或急促劲折，音节宏亮而意调高远。\n\n五、体裁上擅长七言歌行与七言绝句\n\n岑参擅长的体裁是七言歌行和七言绝句，他以边塞生活为题的七绝也多佳作，如《逢入京使》表达赴边塞时对家乡和亲友的思念，情真意切。虽只是用家常话写眼前景致，却道出人人胸臆中语，反映了诗人感情生活及诗风深沉细腻的一面，遂成为客中绝唱。","keywords":"昂扬向上 题材内容广泛 新奇峭丽 用韵灵活 意调高远 七言歌行和七言绝句","note":"岑参和高适并称，都是著名的边塞诗人，但二人的边塞诗风格也略有不同。在某些方面，岑参的艺术成就甚至超越了高适，大家可以将二者放在一起，对比记忆。岑参的边塞诗整体昂扬向上，题材内容广泛，开拓了边塞诗格局，在艺术上追求新奇峭丽，用韵灵活，长于七言。这部分内容，我们要掌握。"},{"id":"153","stars":"★★★","title":"试分析李白的思想对诗歌创作的影响","body":"李白豪放不羁，从小接受的就不是严格正统的儒家教育，又有习剑任侠、学道求仙的经历，所以他的思想极其驳杂矛盾，儒、道及纵横家思想在李白身上皆有体现。李白将各家思想化合在一起，形成了自身独特的处世方式。\n\n一、道家思想：神异浪漫色彩和追求个性自由的精神\n\n李白或许是历代著名诗人中受道家和道教思想影响最深的，由于家风和社会习尚的濡染，李白自幼崇信道教，学道求仙、服食炼丹，几乎贯穿其一生。他曾受道箓于齐，一生交往过不少道徒。道教鼓吹的神仙世界，投合李白热爱自由、向往自然的性格，现实生活的黑暗龌龊使他更强烈地幻想和追求美好的神仙世界。道教给李白安上了精骛八极、神游四方的想象翅膀，使他的诗歌增加了恍惚飘逸、光怪陆离的神异浪漫色彩。李白傲睨权贵，蔑视封建等级制度，追求个性自由，旷放不羁，粪土富贵荣华。他的这些思想性格深受庄子叛逆精神的影响。而他的隐逸颓放，及时行乐，一生死、齐万物等消极思想，也都源于老庄思想。\n\n二、纵横家思想：豪放恣肆的诗风\n\n《新唐书》称李白“喜纵横术”，他在诗歌中亦自称“试涉霸王略，将期轩冕荣”“空谈帝王略，紫绶不挂身”，侠义纵横思想可以说对李白产生了深远的影响。他笔下的众多战国人物如苏秦、张仪、毛遂、朱亥等固然有纵横家和侠义之士的气质，而且，即使是后世的张良、孔明、谢安之辈，也都被他烙上纵横家的印记，他诗风的豪放，文风的恣肆，也都有纵横家文的影响。他诗歌中大量歌颂的抗暴安良、重然诺、轻生死的侠义行为，也反映出他的人生价值观和为人处世的行为准则。可见侠义行为、纵横家思想对李白的影响之深。\n\n三、儒家思想：用世济时的价值追求\n\n儒家思想对李白的影响也非常明显。安社稷、济苍生是李白一生的理想，即使在晚年也豪情不减，这正是儒家用世思想的体现。他的“苟无济代心，独善亦何益”的人生价值观念也来自儒家的用世济时思想。因此，李白有着积极入世、进取的人生态度，功名心很强。\n\n李白的儒家思想，经自身变形走样，已带有他鲜明的个性色彩。他对自己才能的自负自信，对不世之功的渴求以及他为达到这一目的而采取的游说干谒方式，都留有纵横家的印记。他所向往的儒家至治境界，也杂有道家无为而治的成分。他尊孔，却是借以自许自慰，而他的嘲圣讥儒似乎更多，这些离经叛道之处，是他对儒家传统束缚的突破。","keywords":"道家思想 神异浪漫 追求个性自由 纵横家思想 豪放恣肆 儒家思想 用世济时","note":"由于出身、所受教育和个人经历等多方面的影响，李白的思想极为复杂，在唐代诗人中很有代表性。儒家、道家和纵横家等思想都在他身上有所体现，并且影响了他的诗歌创作。相关内容可以参考葛景春《儒道释结合熔铸百家的开放型思想-李白思想新论》，具体资料可以在李凡文学正版群内领取。"},{"id":"154","stars":"★★★★","title":"试分析李白诗歌的思想内容","body":"李白的诗歌表现了他的理想抱负和性格气质，抒发了他的思想感情和矛盾痛苦，从中折射出社会的精神，跳动着时代的脉搏，既反映了盛唐的强大、繁荣、昌盛，也暴露了它的腐朽黑暗和危机四伏，揭示了其由盛而衰的历史轨迹和这一演变的必然趋势。\n\n一、讴歌理想、抒发抱负、张扬自我、突出个性\n\n李白以不世之才自居，顽强而执着地追求惊世骇俗的功业。讴歌理想，抒发抱负，张扬自我，突出个性，是他的诗歌重要的内容和特征。他的抱负气概，老而不衰。李白的理想抱负以安社稷、济苍生为内容，他的英雄主义以爱国主义为核心。安史之乱升华了他的爱国主义热情，而且给了他几十年等待寻觅而不得的施展抱负才能的机会，在参加永王璘军队之后所写\n\n的诗歌中充满着昂扬的爱国激情，表达了必胜的信心，这些诗歌既有高昂奋发的盛唐时代精神，又有李白豪迈自信的个性特征。\n\n二、傲睨权要、蔑视富贵、宣泄悲愤、抗争命运\n\n李白一生为理想而奋斗，却失败得一次比一次惨，他在诗中愤怒地抗议封建社会对人才的摧残扼杀，尖锐地揭露了忠妍不分，贤愚颠倒的现实，从一个侧面揭示了天宝末期社会政治的黑暗和唐朝由盛而衰的原因。李白刚正不阿，不愿曲意逢迎也不屑于与俗沉浮。他卑视那些庸才贵仕的权要，嘲笑他们对荣华富贵的孜孜以求，具有桀傲不驯的叛逆抗争精神，\n\n三、自信与绝望、追求与颓放、眷恋与怨恨、崇高与庸俗等思想感情的复杂矛盾\n\n由于理想屡遭挫折，失败打击接踵而至，所以李白的诗歌交织着自信与绝望、追求与颓放、眷恋与怨恨、崇高与庸俗等思想感情的复杂矛盾，代表作有《行路难》三首、《梁园吟》《将进酒》《陪侍御叔华登楼歌》等。这些诗歌是李白的崇高理想与黑暗现实相撞击后迸发的电闪雷鸣，具有惊心动魄的力量。它们曲折地反映出时代的矛盾，又有鲜明的个性特征。\n\n四、对现实黑暗的大胆揭露，对时弊的猛烈抨击\n\n这是李白叛逆精神的体现。玄宗晚年好大喜功，穷兵黩武，文臣武将们便滋衅生事，希旨邀宠。李白对这一情况进行了揭露和抨击。由于玄宗的骄纵，天宝末年宦官权势日重。对此，李白是最早予以讥刺揭露的。玄宗晚年惑方士，求神仙，不顾百姓死活，李白借秦皇、汉武以讥讽，他更大胆地以殷纣王、怀王比玄宗，对忠贤遭斥、奸邪当道致使国家濒临危亡的ザ况作了尖锐的揭露。\n\n五、关注劳动人民和广大妇女命运\n\n由于生活范围的局限，李白诗歌中像《丁都护歌》和《下泾县陵阳溪至涩滩》那样直接描绘江南船工纤夫艰险劳动的诗篇是仅见的；像《秋浦歌》十四、十六中那样描绘冶炼工人、田舍翁的富有诗意的劳动场景也不多，但从他的诗中，我们还是可以感受到他对灾害战乱中劳动人民命运的深切关注。\n\n此外，李白关切和同情广大妇女的命运。他的诗歌成功地塑造了身份不同、性格各异的许多妇女形象。他描绘了她们的天真，赞美她们的纯情，表现她们的忠贞，理解她们相思的悲苦，同情她们被遗弃的不幸，热情地歌颂她们的刚勇和反抗。\n\n六、对大自然美的探索与发掘\n\n李白足迹遍于大半个中国。他把大自然当作理想的寄托、自由的化身，努力去探索和发掘其中的美，用他的神来之笔描绘、用他的满腔激情讴歌祖国的锦绣江山。他笔下的巍巍群山上摩苍天，下亘四域，气势磅礴，是诗人的凌云壮志和崇高气节的象征。他笔下的滔滔江河，波如雪涌，潮似山倾，汇纳百川，奔泻万里，犹如诗人冲决羁绊、追求自由的精神不可阻挡。它们熔铸了诗人的性格，倾注了作者的感情，体现了李白的审美理想，也展现了那个时代的风采，能激励人们奋发进取，有雄奇的崇高美。李白也还有不少诗篇描绘大自然的明媚、幽静、秀丽、清新，它们体现了李白性格的另一侧面：他对光明宁静、纯净和谐的憧憬，以及李白诗歌的阴柔之美。\n\n综上所述，李白诗歌充满理想色彩和浪漫激情地抒发了他的志向抱负，表达了他的思想感情，充分地表现了自我；又以强烈的叛逆和反抗精神揭露时弊，深刻而曲折地再现了现实，无论于己于时，都是一面镜子。","keywords":"讴歌理想 抒发抱负 张扬自我 突出个性 傲睨权要 蔑视富贵 宣泄悲愤 抗争命运 自信与绝望 追求与颓放眷恋与怨恨 崇高与庸俗 大胆揭露 猛烈抨击 关注劳动人民命运 对大自然美的探索与发掘","note":"李白诗歌的思想内容是十分复杂的，而这种复杂思想的成因也是多方面的，既有儒、道、纵横多家思想的影响，又是社会复杂精神的体现，还受到了李白自身个性的影响。但在这复杂的思想之中，最突出的无疑是对自我个性的表现和强烈的叛逆性，而这正是其浪漫诗风的重要成因。"},{"id":"155","stars":"★★★★★","title":"试分析李白诗歌的创作特征","body":"在盛唐诗人中，李白是艺术个性非常鲜明的一位，在中国诗歌史上，他作品的艺术个性也是独一无二的。他既具有敏锐的艺术洞察力，又有着不凡的创造才情。李白的诗歌气势浩瀚、洒脱飘逸，充分展现出自由浪漫的创作情怀。他的诗歌创作特征，主要表现在以下方面：\n\n一、独特的批判视角\n\n李白终身以“布衣”自居，他从“布衣”的角度肆无忌惮地嘲笑以政治权力为中心的等级秩序，对当时社会的种种弊端进行了尖锐的批判。\n\n李白生活在唐王朝由盛转衰的大转折时代，他一生怀抱建功立业的理想，然而在现实中屡屡受挫，这样的人生经历使得其诗歌中的批判精神尤为强烈。李白用鲜明的艺术形象，反映了安史之乱前后政治的黑暗、社会的混乱和人民的痛苦，批判当时统治集团的昏聩，也批判世人的庸俗和见风使舵。\n\n在李白看来，他的理想和才华既不能被统治集团认可，在世俗中也难觅知音，这种孤独感使得他唯有以批判的途径来宣泄心中的不平，也希望通过这种批判警醒世人。作为一位充满布衣感的特立批判者，李白将他对于这个社会的认识通过诗歌艺术地折射了出来。\n\n二、强烈的主观色彩\n\n李白在借鉴前代诗歌创作经验的基础上，将自身的性格特征、人格追求融注于作品中，文质兼取，从而形成了别具一格的诗歌风貌。诗人侧重抒写豪迈气概和激昂情怀，很少对客观物象和具体事件做细致的描述。诗歌的跳跃性也极强，因为他往往不是按照生活的逻辑，而是按照情感的踪迹来结构全诗，通过诗歌的开阖跌宕表现感情的变幻无常。他笔下的形象不是客观现实的直接反映，而是其内心主观世界的外化，是艺术的真实。\n\n三、充沛的气势\n\n李白一生寄情山水，在壮丽河山中挥洒豪情逸志，实现自己对现实自由的追求。他诗中的自然山水往往气势磅礴，瑰玮而壮美。不仅山水如此，他笔下的万物也都显示出强大的气势。诗人自己更是有着驾驭一切的气魄，他在诗中始终是一个强者，是一个征服者，睥睨一切，傲岸不屈。李白诗中那大气磅礴的世界，正是诗人人格中自我肯定的表现。可以说，自始至终，李白都充满着手把乾坤的自信，世间万物都是他的走卒，可以由他任意摆放在理想的棋盘上。与此相关，李白作品中的情感表现多呈现出喷射式的状态，洒脱不羁的气质、傲世独立的人格、易于触动而又爆发强烈的感情，无节制地奔涌而出，宛若天际的狂飙和喷溢的火山。\n\n四、丰富奇特的想象\n\n李白诗歌的想象天马行空，变幻莫测，奇之又奇。他意象的衔接组合也是大跨度的，极尽才思敏捷之所能。凭借想象的翅膀，驰骋古今，翱翔八荒，把现实与梦境、仙境，自然界与人类社会打成一片；运用想象的彩笔，描绘神话、点化事物、渲染意境，是李白诗歌艺术的鲜明特色。\n\n李白诗歌的想象有许多与众不同的特点。善于把神奇瑰丽的想象与江河奔泻、火山进发式的感情宣泄结合起来是其一。奇思遐想与自然天真相结合是其二。想象与比兴象征和拟人夸张有机地结合是其三。李白将神奇绚丽的想象与这些抒情修辞手法参互使用，使客观的主观化，现实的虚幻化；内在的外在化，抽象的具象化；将常态的、习见的，变形或拉开审美距离之后强化、异化、陌生化；从而使他的诗歌具有与众不同的鲜明的浪漫主义艺术个性，给人强烈、新奇、生动的审美感受。\n\n五、壮美与优美两种类型的意象\n\n李白的诗中颇多吞吐山河、包孕日月的壮美意象。他对体积巨大的壮观事物似乎尤为倾心，大鹏、巨鱼、长鲸，以及大江、大河、沧海、雪山等，都是他喜欢吟咏的对象，李白将它们置于异常广阔的空间背景下加以描绘，构成雄奇壮伟的诗歌意象。但是，李白诗里亦不乏清新明丽的优美意象。这些由清溪、明月、白鹭、竹色、白露等明净景物构成的清丽意象，极大地丰富了李白诗歌的艺术蕴涵。因此李白诗的意象，便有壮美与优美两种类型。\n\n六、结构跳跃跌宕、纵横开阖\n\n以感情的抒发为线索，诗歌的结构跳跃跌宕、纵横开阖是李白诗歌的又一显著特征。思想感情的恣肆奔放，跌宕起伏，决定了他的诗歌结构不拘一格，变化多端。以开端为例，有横空起势，若狂飙骤起者，又如诗的中间，常常现实与幻境交错、神话与史实杂陈，有纵横跌宕的特点。又如结尾，有的在感情最高潮最强烈处戛然而止，有的在内容或感情的陡然转折处突然煞尾，这两种结尾都有千钧笔力。\n\n七、色调明丽，语言清新明快\n\n李白对白色的透明体，有一种本能的喜欢，最感亲切的东西是月亮，月的形象在李白诗
