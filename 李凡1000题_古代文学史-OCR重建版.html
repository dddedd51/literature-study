西方近代文化的新内容与中国传统语言形式之间确有难以协调的矛盾。茅盾说：“林译小说”的“这种译法是不免两重的歪曲的：口译者把原文译为口语，光景不免有多少歪曲；再由林氏将口语译成文言，那就是第二次歪曲了”。\n\n（四）内容上含有封建意识\n\n由于译者思想的陈旧和受中国传统文化心理的制约，林纾往往把正常的亲子之爱和人类感情附会成“忠”“孝”，并和中国的封建伦理观念联系起来，如把《美洲童子万里寻亲记》和《英孝子火山报仇录》的千里寻亲和为母报仇都归结为“孝”的力量，说《英孝子火山报仇录》中的“一烈一节，在吾国烈女传中，犹铮铮然”。另外“林译小说”在译名上也带有封建文化色彩。","keywords":"成就 新的小说审美规范 风格流派概念 性爱意识觉醒 局限性 选材不严 翻译错误 古文笔法 封建意识","note":""},{"id":"479","stars":"★★★","title":"试分析《官场现形记》的创作特征","body":"【答题框架】\n\n李宝嘉的《官场现形记》是我国第一部在报刊上连载、直面社会而取得轰动效应的长篇章回小说，首开近代小说批判现实的风气。这部小说的创作特征，主要表现在以下方面：\n\n一、全方位暴露官场的黑暗\n\n《官场现形记》是一部专门暴露官场黑暗的力作，对中国封建社会崩溃时期的官僚政治进行了总体解剖，上自军机大臣，下至佐杂胥吏，全方位地摄入笔底。它以纪实性而风靡于世，书中人物故事多以真人真事为蓝本。《官场现形记》所写的不是个别的贪官污吏，而是整个政治体制的腐朽，无官不贪，无吏不污，卖官鬻爵、贪赃纳贿已成为官场的运行机制。官场腐败，自然道德沦丧。居上位者，只知珠玉妖姬，升官发财，所谓政绩，无非是祸国殃民。综观全书，人性的堕落与异化到了触目惊心的地步，书中暴露黑暗有馀，缺乏一丝亮色。\n\n二、若干相对独立的短篇故事蝉联而下的结构方式\n\n从整个小说的结构来看，一个故事接着另一个故事，类似于一部官场故事的类书，而故事情节大同小异，编成一部长篇小说，有千篇一律的嫌疑。不过这种结构适合一边写作一边在杂志上连载，有利于作品的传播。同时小说通过各故事单元同一的语义模式，形成了空间化的叙事结构模式，消解了忠奸对立的情节方式，将批判的锋芒对准“此刻的世界”和各个地域，适应了敏锐地反映广阔的社会人生的需要。\n\n三、写实性强\n\n《官场现形记》写及八百多个人物，重点描写的也有七八十人，上自朝廷的王爷军机大臣，下至地方的总督、巡抚、藩台、臬台、统领、知府、知县、师爷，以及处于底层的佐杂小吏等，有正途有捐班有荐举，有实缺有候补，可谓将晚清官场各种层次的人物一网打尽。书中人物故事多以真人真事为蓝本。如周中堂影射翁同龢，华中堂影射荣禄，黑大叔影射李莲英等，以纪实性而风靡于世。\n\n☒四、塑造人物手法多样\n\n（一）白描传神，是《官场现形记》所长。如胡统领严州剿匪数回，布局精巧，错落有致，人物映带成趣。\n\n（二）作家尤擅长于渲染细节，运以颊上添毫之笔，有入木三分之妙。如“跌茶碗初次上台盘”通过跌茶碗这一细节，将小人物受宠若惊的扭曲心态，描摹尽致。\n\n（三）小说还充分运用了夸张、漫画化的喜剧手法，尤喜撕破人生的假面。如浙江巡抚傅理堂，自命崇尚理学，讲究“慎独”功夫，却偏有“叩辕门荡妇觅情郎”一幕好戏。","keywords":"全方位暴露官场的黑暗 相对独立短篇故事蝉联而下 写实性强 塑造人物手法多样 白描传神 渲染细节 夸张、漫画化","note":"《官场现形记》在近代小说发展中具有开先河的意义，历来为人所关注，像是鲁迅、胡适都针对这部小说做过研究。这部小说的思想性是我们首要关注的内容，而在艺术上，对这部小说结构优劣的评价，仍值得讨论。这部小说可能以名词解释的形式出现，大家要注意一下。"},{"id":"480","stars":"★★★","title":"试分析《二十年目睹之怪现状》的创作特征","body":"吴沃尧的《二十年目睹之怪现状》是一部带有自传色彩的作品，全书以主人公九死一生奔父丧始，至其经商失败止。小说触及相当广阔的社会生活面，上自部堂督抚，下至三教九流，显示了日益殖民地化的中国封建社会肌体的溃烂不堪。这部小说主要表现出了如下特征：\n\n一、注重道德批判\n\n小说富有特色的部分是对封建家庭的罪恶与道德沦丧的暴露。在拜金主义狂潮的冲击下，旧式家庭中骨肉乖违，人伦惨变，作者以犀利的笔锋直抉那些道貌岸然的正人君子的丑恶灵魂。作家抉发官场黑幕，亦颇重从道德批判切入，直斥“这个官竟然不是人做的”“头一件先要学会了卑污苟贱”。此外，书中对于清末官吏的崇洋媚外，也有相当生动的刻画，体现了作家的爱国义愤。\n\n二、反映了作家追求与幻灭的心灵历程\n\n《二十年目睹之怪现状》中着意推出一些正面人物如吴继之、九死一生等，寄托着作家的理想和追求。吴继之由地主、官僚转化为富商，是我国小说中最早出现的新兴资产阶级形象，体现了社会价值观念的变化。他们最后的破产则反映了半封建半殖民地的中国社会中新兴资产阶级的命定归宿。书中正面人物无一例外地被物欲横流的尘嚣浊浪所吞没，“实业救国”“道德救国”-破产，体现了作家“救世之情竭，而后厌世之念生”的心灵搏斗历程。\n\n三、多种叙事视角的使用\n\n小说的开始是对《红楼梦》开篇形式的模仿，以第三人称写“死里逃生”偶得奇书《二十年目睹之怪现状》，正文部分则是以第一人称的叙事视角展开（偶有第三人称的转述），视角的限知控制较为自如。这种第一人称限知视角的运用，是晚清小说创作中的一次开创性实践。但在小说中，当某些人物在讲述“怪现状”的新闻故事时，又多是第三人称叙事，重新变回到全知视角。这样的叙事视角的转换，是“自传性”小说增加故事容量和表现广度的技术手段。\n\n四、一条线索贯穿始终\n\n从结构上来看，《二十年目睹之怪现状》有一条贯穿始终的线索，即“九死一生”的故事：一是“九死一生”的家庭故事，二是“九死一生”与吴继之等人合作经商的故事。前者因为有作者的经历作底子，所以写得比较饱满；后者则未见实质性的故事展开。总的来看，这条线索仿佛一根藤，那些“怪现状”故事就好像这藤上结挂的串串果实。\n\n五、笔锋凌厉，庄谐杂陈\n\n小说突出地体现了作家的艺术风格：笔锋凌厉，庄谐杂陈，辛辣而有兴味。如苟才初次亮相，他那如瓶泻水般的谈吐，旁若无人的意态，寥寥数笔便跃然纸上。","keywords":"自传色彩 道德批判 追求与幻灭的心灵历程 多种叙事视角的使用 一条线索贯穿始终 笔锋凌厉 庄谐杂陈","note":""},{"id":"481","stars":"★★★","title":"试分析《老残游记》的思想内容与艺术成就","body":"《老残游记》以一个摇串铃的走方郎中老残为主人公，记叙他在北中国大地游历的所见、所闻、所思、所感。书中触及的社会生活面并不甚广，但开掘甚深。这部小说的思想内容与艺术成就，主要有以下方面：\n\n一、思想内容\n\n（一）首揭“清官”之恶\n\n《老残游记》成功地塑造了两个“清廉得格登登的”酷吏典型-玉贤、刚弼。他们的清官、能吏之誉，是以残酷虐政换来的。玉贤做曹州知府，号称路不拾遗，揭开这一美誉的背面，则是滥杀无辜，冤案累累。作家深刻地揭示出这些酷吏的可怕的精神世界，掩盖在清廉之下的是无比冷酷残忍与比贪黩更大的贪欲，他们刚愎自用、任性妄为，愚顽而又专横，不问青红皂白，放手做去，其实灵魂深处是无限膨胀的野心和权欲。他们的飞黄腾达，说明中国封建政体不只孕育贪官，也是孳生酷吏的土壤。\n\n（二）反理学、反禁欲\n\n《老残游记》中塑造了两个带有反理学、反禁欲色彩的女性，即《初集》中的玙姑和《二集》中的逸云。她们属于哲理型或曰思辨型的女性，是我国古典文学中罕见的新形象，堪称空谷幽兰。桃花山一夕夜话，作家让自己笔下的理想女性娓娓道出宋儒的虚伪和矫情，表现了对于压抑个性、遏制情欲的伦理道德的深刻憎恶。\n\n（三）社会变革意识\n\n刘鹗显然试图使作品涵纳自己的政治思想以至哲学思想。首回危船一梦，以象征的手法，将晚清国势的危殆、各派政治力量对时局的立场和态度，做了寓言式的图解。刘鹗无疑反对“北拳南革”，他所开出的治世药方是：补残。所谓“三元甲子之说”，虽蒙上神秘预言色彩，实质也蕴涵着循序渐进的社会变革意识。\n\n二、艺术成就\n\n（一）叙事模式转变，由说书人叙事转为作家叙事\n\n《老残游记》具有浓郁的主观感情色彩，作家的创作个性和主体意识得到充分弘扬。小说视角也由传统的全知叙事转为第三人称限制叙事。\n\n（二）使用心理分析手法\n\n《二集》中写斗姥宫姑子逸云讲述她与任三爷热恋的长篇自白，就是心理分析手法的一种大胆尝试。作家的笔锋触及人的潜意识中最隐秘的心弦震颤，将一个青春少女对于情欲、物欲的强烈渴求和盘托出，颇有现代心理分析的意味。\n\n（三）由叙事型小说向描写型小说转变\n\n《老残游记》掺入诗和散文的笔法，开拓审美空间，其文笔之清丽潇洒，意境之深邃高远，都达到很高境界。白描自然景色，尤见艺术功力，堪称美文。如写大明湖秋色，于梵宇僧楼、苍松翠柏间点染一株半株浓艳的丹枫，顿觉秋意盎然。写黄河冰封凌怒，则苍莽遒劲。而在对白妞说书的描写中，刘鹗将有声无形的音乐，幻化成可视的登山和东洋烟火，以此凸显白妞唱腔的婉转变化、层次丰富和沁人心脾，可谓千古至文。《老残游记》摆脱了传统小说的格调和晚清小说“新闻化”的倾向，具有了现代小说的韵味。\n\n（四）以作者意图为中心统筹结构\n\n老残是作者的艺术化身，是作者抒情写意的寄托。作者不仅利用他来贯穿全书，使一些本来不相连属的人、事、景、物因老残的游历而形成了一个整体，而且利用他抒写了作者的身世之感，家国之痛，乃至爱好和情趣，使作品带上了浓重的主观抒情色彩，从而改变了中国长篇小说的传统品格。这在中国小说史上是前所未有的。","keywords":"思想内容 首揭“清官”之恶 反理学 反禁欲 社会变革意识 艺术成就 转为作家叙事 心理分析手法 向描写型小说转变","note":"相较于《官场现形记》和《二十年目睹之怪现状》，《老残游记》艺术上无疑是更进一步，无论是心理分析手法的使用，还是在小说中掺入诗和散文的笔法，都是具有开创性的，在某种程度上表现出了现代小说的韵味，因而受到了更多的关注。当然，名词解释中也会出现《老残游记》相关的题目，大家要注意一下。"},{"id":"482","stars":"★★★","title":"试分析《孽海花》的思想内容与艺术特征","body":"【答题框架】\n\n曾朴的《孽海花》是晚清四大谴责小说之一，具有较为进步的思想内容和较为完美的艺术形式，这主要表现在以下方面：\n\n一、思想内容\n\n（一）具有昂扬的爱国精神和激进的革命倾向\n\n《孽海花》成书于资产阶级革命走向高涨的年代，其昂扬的爱国精神和激进的革命倾向，振聋发聩。首回“恶风潮陆沉奴隶国”，体现了作家深切的危机意识，“十八省早已都不保了”的疾呼，在20世纪初叶敲起了警钟。作家的批判笔锋集中指向封建专制政体，甚至借书中人物之口，阐扬了石破天惊的革命主张：“要组织我黄帝子孙民族共和的政府。”书中还勾勒了英气勃勃的革命党人孙汶、陈千秋、史坚如等的形象，其思想之激进，实出于晚清一般谴责小说之上。\n\n（二）融注了多重意蕴\n\n（1）具有历史小说的厚重内涵\n\n在一定程度上，《孽海花》是对历史的一次艺术再现，具有很强的历史性。同治五年至光绪二十一年的三十年间，对中国历史产生重大影响的中法战争和中日战争，在小说中都得到了展现。这三十年中官场、士林风气变迁，从清流党的锋锐，公羊学的勃起，到帝、后的失和都得到了描绘。从对声光电化坚船利炮的注重到派使臣进入万国体系，再到社会改革，以至于维新、革命，《孽海花》十分真实地再现了晚清这三十年间的社会变革。小说还写到了三十年中思想文化及学术风气的变迁，如由沉溺于金石考据之学到今文经学的兴起，再到关注西北史地等。\n\n（2）浓重的讽刺色彩\n\n《孽海花》的讽刺笔墨亦擅胜场。作家多撷取一些有趣的琐闻轶事，举凡宫闱秘闻、科场闹剧、官吏贪墨、士林麻木等，初无过甚贬词却能挖掘出其中荒唐、古怪、畸形的喜剧因素。\n\n（3）表现了中国文化心态的冲突与嬗替\n\n故事开篇苏州雅聚园茶话，显示了咸、同年间人们对于科名的沉醉，留下了文化封闭心态的印迹。而在繁华总汇的上海，冯桂芬对新科状元金雯青的一席话，却透露了物换星移的信息。小说着力渲染上海味莼园的谈瀛胜会，通过风发泉涌的席间议论，几乎囊括了晚清向西方寻求真理的人们所提出的各种主张，表现了中国一代先哲奋进自强的追求。小说尤其突出地表现了旧式封建士大夫的必然没落。他们颇有文化素养，论金石，谈考据，一派高雅斯文气象，却大都不堪承当大事。揭露这过渡时代中持守旧文明的“士”完全无助于挽救天朝上国的沦落，是此书的重要底蕴之一。\n\n二、艺术特征\n\n（一）文采斐然\n\n《孽海花》是一部瑰玮缛丽的作品，文笔娟好，词采华披，写景状物，明丽如画。叙述语言流畅典雅，人物对白贴合身份，颇见作者的语言功力。\n\n（二）“珠花”式结构\n\n整部小说按时间顺序展开叙事，讲述“三十年旧事”，但它又不是纯然的短篇联缀成长篇的组织方式，而是以金雯青和傅彩云的分合故事贯穿其中，其他各故事基本上按时间顺序穿插进来。曾朴把这种方式比喻成围绕中心盘曲回旋穿成的“珠花”，以与《儒林外史》直线穿珠相区别。这种“珠花”结构收到了纵横交错、收放自如的效果，既有利于表现时代风云的波谲云诡，又能看到在时代变迁中爱情故事的终始变幻。\n\n（三）骨肉丰满、真实生动的人物形象\n\n傅彩云以清末民初红极一时的名妓赛金花为模特，是曾朴精心雕塑的艺术典型，一个色相和情欲都红艳似火的女人。她聪明乖巧，善解人意；又机敏老辣，富有手腕。温顺时，如依人小鸟；刁恶时，如毒螯蛇蝎。她轻薄如浮花浪蕊，终于把雯青活活气死。这是一种不合理制度中形成的畸形性格：她被男人当作玩物，她也玩弄男人。作家深入灵肉合一的人性层面，成功地塑造出这个带着无法自制的本性弱点，深深陷溺于情欲、物欲孽海之中不能自拔的形象。","keywords":"思想内容 爱国精神 革命倾向 多重意蕴 历史小说的厚重内涵 讽刺色彩 中国文化心态冲突与嬗替 艺术特征文采斐然“珠花”式结构 骨肉丰满、真实生动的人物形象","note":"《孽海花》的思想内容与艺术成就较之前的谴责小说都高出一筹，其中特别值得注意的是其思想内容，尤其是其中蕴涵的爱国情怀与革命精神，而这是与当时的时代思潮相适应的。在艺术上，我们需要重点关注的则是这部小说的“珠花”式结构，这和传统小说也很不一样。《孽海花》也是名词解释中常出现的内容，大家要注意一下。"},{"id":"483","stars":"★★★","title":"谈谈你对晚清戏剧改良运动的认识","body":"近代戏剧改良运动是近代文学改良运动的重要组成部分，也是近代剧坛上唯-次涉及戏剧观念、戏剧创作和若干重要剧种的具有一定规模的戏剧运动。\n\n一、戏剧改良运动兴起的原因\n\n（一）以为政治斗争服务为旨归的近代资产阶级启蒙思潮的需要\n\n戊戌变法失败以后，维新派从单纯的政治变法失败的教训中认识到，欲使维新救国大业获得成功，必须首先“新民”，即刷新国民精神，提高国民觉悟，振作国民志气。而“新民”的最有效方式，莫若用文学向国民灌输文明思想和救亡意识。于是他们在倡导“诗界革命”“文界革命”“小说界革命”的同时，也提出了“戏曲改良”的主张。继维新之后出现的资产阶级革命派人士，在用文学对国民进行启蒙教育这一点上的认识与维新派基本一致的，并在维新派人士政治上落伍之后扮演了戏剧改良运动的主要角色。\n\n（二）西方文学观念和戏剧文学影响的结果\n\n近代自甲午战争失败、单向的洋务运动受挫后，在西学东渐的大背景之下，国人的文学观念更发生巨大变化，其中最突出的一点即是小说、戏曲这些所谓的俗文学倍受重视，其文学地位和社会功能实际上被置于诗文之上。部分读者还从中西戏剧的横向比较中，看到西方戏剧的长处和中国戏曲的短处，由此激发出革新中国戏曲的要求。可以说，没有西方文学观念和戏剧的影响，没有中西文学交融碰撞的文化氛围，戏剧改良运动是难以提上日程的。\n\n（三）近代戏曲发展的必然要求\n\n鸦片战争失败以后，民族矛盾和国内的阶级矛盾日趋严重，大清王朝已无可奈何地露出了衰世景况。于是一种大厦将倾的危机感和救世乏人的焦灼情绪在部分敏感的传奇杂剧作者中弥漫开来，这使得情节曲折、节奏舒缓、文辞优美、音乐婉转的“雅部”曲风发生了一些转变。有的剧作开始曲折地针砭现实，如李文翰的《银汉槎》；有的剧作呈现出苍凉悲愤的美学格调，如黄燮清的《帝女花》......所有这些，实际上都是戏曲改良的先兆。因此，近代戏剧改良运动的兴起，不仅有戏剧外部的政治、思想、文化环境等方面的原因，也有戏剧自身发展方面的动因。\n\n二、戏剧改良运动的理论建设\n\n（一）充分肯定和高扬了戏剧的文学地位和教育功能\n\n如天修生在《剧场之教育》一文中从戏曲普及性最广这一事实出发，指出戏曲可作为最通俗、最有效的启迪民众的手段，这实际上是戏剧改良运动的倡导者咸予赞同的戏剧观。这一戏剧理论是以西方相对先进的资产阶级戏剧文化为参照系的，是以开启民智，促进社会改革为出发点的，是服务于资产阶级的启蒙运动的。\n\n（二）明确指出戏剧演员的人格和地位应受到充分尊重\n\n在戏剧改良运动中，戏剧的文学地位被突出地高扬了，而且很明显地吸取了西方的人权学说。如陈独秀这样礼赞戏园和演员：“戏园者，实普天下之大学堂也；优伶者，实普天下之大教师也。”\n\n（三）对戏剧如何改良提出了许多具体设想\n\n陈独秀的《论戏曲》一文提出了如下五项建议：一是“宜多新编有益风化之戏”，二是“采用西法”，三是“不可演神仙鬼怪之事”，四是“不可演淫戏”，五是戏剧内容要“除富贵功名之俗套”。柳亚子在《二十世纪大舞台·发刊词》中更站在反清革命的立场上指出：戏剧应通过表演教育人们“崇拜共和，欢迎改革”。此外，基于对当时中华民族深重危机的感受，有的倡导者还鼓吹多演悲剧。\n\n三、戏剧改良运动的成就\n\n近代戏剧改良运动从本质上讲，是近代资产阶级向封建阶级夺取戏剧阵地的一个重要步骤，是戏剧力图挣脱封建社会强加给它的漠视和羁绊，求得自身发展的自觉行动。它虽然存在着过分看重戏剧的宣传作用而相对忽视戏剧艺术特征的缺点，但它在戏剧发展史上第一次以富有近代意识的文学观念肯定了戏剧在文学艺术王国里的地位和价值，第一次以近代中华民族反帝反封建斗争的需要为依据，对戏剧的内容和形式进行了革新，第一次以有组织、有计划的形式推动了某些地方戏的繁荣和发展，这些成就将永载史册。","keywords":"兴起原因 资产阶级启蒙思潮的需要 西方文学观念和戏剧文学影响 近代戏曲发展的必然要求 理论建设肯定和高扬文学地位和教育功能 指出戏剧演员的人格和地位应受尊重 提出许多具体设想 成就","note":"晚清的戏剧改良运动与“三界革命”一样，是名词解释中常出现的内容。在中国近代剧坛上，像戏剧改良运动这样广泛、深入地对戏剧进行变革的运动是绝无仅有的，故此我们要重视起来。相关内容可以参考张俊才《近代戏剧改良运动始末及意义》、马跃敏《近代戏曲改良运动研究》，具体资料可以在李凡文学正版群中领取。"}];

const EXAMPLES=[{"id":"231","title":"试分析宋诗的思想艺术特征","examples":[{"ref":"第三卷 第五编 第十四章","ref_text":"宋诗与宋词总体","anchor":"议论化","quote":"严羽《沧浪诗话》：近代诸公乃作奇特解会，遂以文字为诗，以才学为诗，以议论为诗。","note":"袁版第四章以“以文字为诗、以才学为诗、以议论为诗”为宋诗艺术总纲，此题正文正以“议论化、才学化、散文化”展开，故引严羽评语作印证。"},{"ref":"第三卷 第五编 第十四章","ref_text":"宋诗与宋词总体","anchor":"宋诗","quote":"欧阳修《试笔》：诗之为巧，犹画工小笔尔，以此知文章与造化争巧可也。","note":"此题强调宋诗描写民生、议政、爱国等广阔题材，袁版以欧阳修论艺语说明宋人在唐诗高度完备后仍于构思、立意、修辞上求新求精的自觉。"}]},{"id":"233","title":"谈谈你对钱钟书“诗分唐宋”观点的认识（26陕西师范大学、四川大学）【答题框架】","examples":[{"ref":"第三卷 第五编 第十四章","ref_text":"宋诗与宋词总体","anchor":"诗分唐宋","quote":"钱钟书《谈艺录》：夫人禀性，各有偏至。发为声诗，高明者近唐，沉潜者近宋，有不期而然者。","note":"此题论“诗分唐宋”为体格性分之殊而非朝代之别，袁版即指出从欧阳修、梅尧臣起宋人试图摆脱唐诗藩篱。钱钟书之论恰是此说的近代总结。"},{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"题西林壁","quote":"苏轼《题西林壁》：横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。","note":"题意对比唐诗雄浑、宋诗深折：以王之涣《登鹳雀楼》与《题西林壁》相较，袁版正引此诗说明宋诗“主理”“有理趣”的特点，诗“以象入理，以理验境”。"}]},{"id":"239","title":"柳永为宋词的变革做出了怎样的贡献","examples":[{"ref":"第三卷 第五编 第二章","ref_text":"柳永","anchor":"柳永","quote":"柳永《望海潮》：东南形胜，三吴都会，钱塘自古繁华。重湖叠巘清嘉，有三秋桂子，十里荷花。","note":"袁版论柳永变革以“大力创作慢词、变雅为俗、铺叙白描”为核心，此题正文正引《望海潮》说明其描写都市繁华，最能体现柳永开拓词境与题材的贡献。"},{"ref":"第三卷 第五编 第二章","ref_text":"柳永","anchor":"慢词","quote":"叶梦得《避暑录话》：凡有井水饮处，即能歌柳词。","note":"袁版以“凡有井水饮处，即能歌柳词”说明柳词语言的通俗化与其市民化审美内涵变革的深远影响，正呼应此题“变雅为俗”和语言革新的论述。"}]},{"id":"240","title":"试分析柳永词作在内容上有何特点","examples":[{"ref":"第三卷 第五编 第二章","ref_text":"柳永","anchor":"羁旅行役","quote":"柳永《八声甘州》：不忍登高临远，望故乡渺邈，归思难收。","note":"袁版指出柳永“尤工于羁旅行役”，把仕途不顺的痛苦写入词中，此题正文正以《八声甘州》一类写游宦飘泊之作说明其内容的自我化拓展。"},{"ref":"第三卷 第五编 第二章","ref_text":"柳永","anchor":"望海潮","quote":"柳永《望海潮》：千骑拥高牙，乘醉听箫鼓，吟赏烟霞。异日图将好景，归去凤池夸。","note":"此题专论柳永对繁华都市风光的描写，袁版以《望海潮》为“承平气象，形容曲尽”的代表，正是柳永拓展词内容、写都市富庶的例证。"}]},{"id":"241","title":"试分析柳永词作的艺术特征","examples":[{"ref":"第三卷 第五编 第二章","ref_text":"柳永","anchor":"雨霖铃","quote":"柳永《雨霖铃》：多情自古伤离别，更那堪、冷落清秋节！今宵酒醒何处？杨柳岸、晓风残月。","note":"袁版以《雨霖铃》说明柳永将叙事、抒情、写景融为一体的铺叙白描特色，且善于以秋景点染离愁，符合此题论其艺术特征的要点。"},{"ref":"第三卷 第五编 第二章","ref_text":"柳永","anchor":"八声甘州","quote":"柳永《八声甘州》：对潇潇暮雨洒江天，一番洗清秋。","note":"此题论柳永善于借景抒情、铺叙白描，袁版以《八声甘州》写清秋暮雨之开阔意境说明其慢词写景抒情交融的高超技艺。"}]},{"id":"243","title":"试述欧阳修的散文成就","examples":[{"ref":"第三卷 第五编 第三章","ref_text":"欧阳修","anchor":"醉翁亭记","quote":"欧阳修《醉翁亭记》：环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。","note":"袁版以《醉翁亭记》开篇“环滁皆山也”为例说明欧阳修“平易自然、简洁晓畅”的文风，正契此题论其散文风格平易自然的特点。"},{"ref":"第三卷 第五编 第三章","ref_text":"欧阳修","anchor":"秋声赋","quote":"欧阳修《秋声赋》：盖夫秋之为状也：其色惨淡，烟霏云敛；其容清明，天高日晶；其气栗冽，砭人肌骨；其意萧条，山川寂寥。","note":"袁版论欧阳修改造骈赋律赋、创制文赋以《秋声赋》为代表，此题正文以《秋声赋》说明其文体革新的成就与高超艺术水准。"}]},{"id":"250","title":"试分析苏轼散文的艺术成就","examples":[{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"记承天寺夜游","quote":"苏轼《记承天寺夜游》：庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。","note":"袁版论苏轼散文善将情韵与感情结合，以八十五字短文《记承天寺夜游》“韵流字间，神余篇外”为例，印证此题所说超凡入化的情韵与真率感情。"},{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"赤壁赋","quote":"苏轼《前赤壁赋》：寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。","note":"袁版论苏轼使赋进一步散体化，以前后《赤壁赋》“以文为赋、骈散结合、叶韵藏于不觉”登散文诗之高峰，正契此题论苏轼“破体”与发展文体。"}]},{"id":"251","title":"试分析苏轼诗歌的主要内容","examples":[{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"饮湖上初晴后雨","quote":"苏轼《饮湖上初晴后雨》：水光潋滟晴方好，山色空蒙雨亦奇。欲把西湖比西子，淡妆浓抹总相宜。","note":"袁版论苏轼“歌咏自然”一类作品数量多、风格多样，此题正列《饮湖上初晴后雨二首》为通判杭州时歌咏自然的名作，说明其对自然美的开拓。"}]},{"id":"252","title":"苏轼的诗具有怎样的艺术特征","examples":[{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"题西林壁","quote":"苏轼《题西林壁》：横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。","note":"袁版以《题西林壁》说明苏诗“理趣”的特点，即哲理通过生动意象自然流出而非议论直说，是此题所称“求物之妙”与“理趣”的典型例证。"},{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"清雄","quote":"苏轼《惠崇春江晚景》：竹外桃花三两枝，春江水暖鸭先知。蒌蒿满地芦芽短，正是河豚欲上时。","note":"袁版论苏诗“清雄”为刚柔相济的主导风格，又讲究“求物之妙”；《惠崇春江晚景》以寻常景物显生意，正体现其细腻观察与意境之妙，可助理解此题论艺术追求之条。"}]},{"id":"253","title":"试分析苏轼“以文为诗”表现在哪些方面","examples":[{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"以文为诗","quote":"赵翼《瓯北诗话》：以文为诗，自昌黎始；至东坡益大放厥词，别开生面，成一代之大观。","note":"此题正文开篇即引赵翼此语作为“以文为诗”的定评，袁版亦以此说明苏轼把散文章法、句法入诗，是此题的论证根基。"},{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"题西林壁","quote":"苏轼《题西林壁》：不识庐山真面目，只缘身在此山中。","note":"此题论苏轼“以文为诗”使议论增多、题材拓展，袁版以《题西林壁》说明其以议论方式揭示普遍哲理的议论化特点，是“以议论为诗”的典范。"}]},{"id":"254","title":"苏轼为词的变革做出了哪些努力","examples":[{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"江城子·密州出猎","quote":"苏轼《江城子·密州出猎》：老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈。会挽雕弓如满月，西北望，射天狼。","note":"袁版以《江城子·密州出猎》说明苏轼将词由写柔情变为写豪情、表现其以身许国的壮志，正是此题所述的“以诗为词”、扩大词的功能与开拓词境的例证。"},{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"水调歌头","quote":"苏轼《水调歌头·明月几时有》：明月几时有？把酒问青天。但愿人长久，千里共婵娟。","note":"袁版以《水调歌头》说明苏轼运用题序、突破音律束缚，表现充沛激情与丰富想象，是此题论苏轼“以诗为词”手法与提高词体地位的例证。"}]},{"id":"255","title":"结合具体作品谈谈你如何理解苏轼“以诗为词”（26安徽大学）","examples":[{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"念奴娇·赤壁怀古","quote":"苏轼《念奴娇·赤壁怀古》：大江东去，浪淘尽，千古风流人物。乱石穿空，惊涛拍岸，卷起千堆雪。","note":"袁版以《念奴娇·赤壁怀古》说明“以诗为词”使苏词风格趋同于诗、境界阔大、直抒胸臆，是此题论“以诗为词”在题材、风格上突破诗词界限的代表。"},{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"以诗为词","quote":"苏轼《江城子·密州出猎》：会挽雕弓如满月，西北望，射天狼。","note":"此题论苏轼以诗为词大量用典、以词述志，袁版以《江城子·密州出猎》上下阕用孙权、冯唐典故说明其使用替代性叙事与曲折抒情，正是“以诗为词”手法之例。"}]},{"id":"257","title":"苏轼的词具有怎样的思想艺术特色","examples":[{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"江城子·密州出猎","quote":"苏轼《江城子·密州出猎》：酒酣胸胆尚开张，鬓微霜，又何妨！持节云中，何日遣冯唐？","note":"袁版以《江城子·密州出猎》说明苏词总体风格豪放雄奇、境界阔大、直抒胸臆寄托豪情，正契此题论其“豪放雄奇”与“言志抒情”的思想艺术特色。"},{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"念奴娇·赤壁怀古","quote":"苏轼《念奴娇·赤壁怀古》：人生如梦，一尊还酹江月。","note":"袁版论苏词具有“理趣”化特征、常浩叹“人生如梦”，并以《念奴娇·赤壁怀古》为其怀古词代表，此题正文正以该词说明苏词的哲理意蕴。"}]},{"id":"258","title":"试比较苏轼诗词的相同之处","examples":[{"ref":"第三卷 第五编 第四章","ref_text":"苏轼","anchor":"清雄","quote":"苏轼《念奴娇·赤壁怀古》：大江东去，浪淘尽，千古风流人物。","note":"此题论苏诗苏词共有“清雄”风格与议论化、用典等特点，袁版以《念奴娇·赤壁怀古》《水调歌头》等为苏词“清雄”代表，说明苏诗词在风格上相通。"}]},{"id":"261","title":"试分析黄庭坚诗歌的创作特征","examples":[{"ref":"第三卷 第五编 第六章","ref_text":"黄庭坚与江西诗派","anchor":"黄庭坚","quote":"黄庭坚《寄黄几复》：我居北海君南海，寄雁传书谢不能。桃李春风一杯酒，江湖夜雨十年灯。","note":"袁版论黄庭坚“生新廉悍”风貌与“点铁成金、夺胎换骨”，其佳者能“以俗为雅，以故为新”，此题正文即以《寄黄幾复》为例说明其善使事用典、化故为新。"},{"ref":"第三卷 第五编 第六章","ref_text":"黄庭坚与江西诗派","anchor":"点铁成金","quote":"黄庭坚《答洪驹父书》：老杜作诗，退之作文，无一字无来处，盖后人读书少，故谓韩、杜自作此语耳。古之能为文章者，真能陶冶万物，虽取古人之陈言入于翰墨，如灵丹一粒，点铁成金也。","note":"袁版论黄庭坚句法创新与“点铁成金”说，此题正文正以此为其艺术特征的论证，引黄氏原语可明其“夺胎换骨、以故为新”之术。"}]},{"id":"271","title":"试分析周邦彦词的思想内容和艺术特征","examples":[{"ref":"第三卷 第五编 第七章","ref_text":"周邦彦","anchor":"周邦彦","quote":"周邦彦《兰陵王·柳》：登临望故国，谁识京华倦客？长亭路，年去岁来，应折柔条过千尺。","note":"袁版论周词重“羁旅行役之感”主题，以《兰陵王·柳》为代表的“漂零不偶”之叹，是此题论周邦彦羁旅词内容与自度曲艺术规范的重要例证。"},{"ref":"第三卷 第五编 第七章","ref_text":"周邦彦","anchor":"羁旅行役","quote":"周邦彦《苏幕遮》：叶上初阳干宿雨、水面清圆，一一风荷举。","note":"此题论周词自度曲、律严字工、融化前人诗句入词，袁版以《苏幕遮》名句说明其炼句措辞精工、音律谐婉的艺术特色。"}]},{"id":"272","title":"试分析周邦彦的词学成就（26山东大学）","examples":[{"ref":"第三卷 第五编 第七章","ref_text":"周邦彦","anchor":"富艳精工","quote":"周邦彦《苏幕遮》：叶上初阳干宿雨、水面清圆，一一风荷举。","note":"袁版以“富艳精工”概括周邦彦成家之风，此题正文引此句说明其融化前人诗句入词、律严字工的艺术成就，正体现其婉约集大成的地位。"},{"ref":"第三卷 第五编 第七章","ref_text":"周邦彦","anchor":"周邦彦","quote":"周邦彦《兰陵王·柳》：悽恻，恨堆积！渐别浦萦回，津堠岑寂，斜阳冉冉春无极。","note":"此题论周邦彦承前启后、正宗婉约集大成，袁版以其自度曲《兰陵王》声腔圆美、用字高雅说明其对南宋词人的示范与法度规范之功。"}]},{"id":"278","title":"试述陆游的诗学主张","examples":[{"ref":"第三卷 第五编 第十一章","ref_text":"陆游与中兴四大诗人","anchor":"江西诗派","quote":"陆游《示子遹》：汝果欲学诗，工夫在诗外。","note":"袁版论陆游强调诗歌从社会现实生活取材、摆脱江西诗派束缚，此题正文正引“工夫在诗外”说明其重视生活反映的诗学主张。"},{"ref":"第三卷 第五编 第十一章","ref_text":"陆游与中兴四大诗人","anchor":"陆游","quote":"陆游《冬夜读书示子聿》：纸上得来终觉浅，绝知此事要躬行。","note":"此题论陆游主张从社会现实取材，袁版以陆游“纸上得来终觉浅，绝知此事要躬行”说明其对重内容、重生活的诗歌理论的倡导。"}]},{"id":"279","title":"试述陆游诗歌的创作特征","examples":[{"ref":"第三卷 第五编 第十一章","ref_text":"陆游与中兴四大诗人","anchor":"书愤","quote":"陆游《书愤》：楼船夜雪瓜洲渡，铁马秋风大散关。","note":"袁版论陆游七律以对仗工整著称、善于使事用典，《书愤》中此联是其工力锤炼、语言豪丽雄壮的典型，正契此题论其创作特征。"},{"ref":"第三卷 第五编 第十一章","ref_text":"陆游与中兴四大诗人","anchor":"游山西村","quote":"陆游《游山西村》：山重水复疑无路，柳暗花明又一村。","note":"袁版论陆诗表现日常生活情景之美，此题正文举《游山西村》赞美宁静村景与淳朴民风，此句正体现其于日常生活发现诗材的创作特点。"}]},{"id":"280","title":"试分析陆游爱国诗的特征","examples":[{"ref":"第三卷 第五编 第十一章","ref_text":"陆游与中兴四大诗人","anchor":"示儿","quote":"陆游《示儿》：死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。","note":"袁版论陆游爱国诗信念坚定、一贯坚持到生命最后一刻，此题正文正以弥留之际的《示儿》说明其爱国信念的坚定性与一贯性。"},{"ref":"第三卷 第五编 第十一章","ref_text":"陆游与中兴四大诗人","anchor":"爱国","quote":"陆游《秋夜将晓出篱门迎凉有感》：遗民泪尽胡尘里，南望王师又一年！","note":"此题论陆游爱国诗写沦陷区人民对王师之期待，袁版以“遗民泪尽胡尘里”说明其爱国诗题材之广、感情之真挚与时代性个性之强。"}]},{"id":"284","title":"试述辛弃疾词的主要类型","examples":[{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"永遇乐","quote":"辛弃疾《永遇乐·京口北固亭怀古》：想当年，金戈铁马，气吞万里如虎。","note":"此题论辛词类型之一“英雄词”，袁版以《永遇乐·京口北固亭怀古》说明辛弃疾登临怀古之时仍抒英雄老矣尚可驱驰的豪情，正是英雄词的例证。"},{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"水龙吟","quote":"辛弃疾《水龙吟·登建康赏心亭》：把吴钩看了，栏杆拍遍，无人会、登临意。","note":"此题论辛词类型之二“失意词”，袁版以《水龙吟·登建康赏心亭》最能体现辛词沉郁顿挫、慷慨悲凉之风格，说明其壮志难酬的失意悲愤。"}]},{"id":"285","title":"试分析辛弃疾词运用典故有何特征","examples":[{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"典故","quote":"辛弃疾《永遇乐·京口北固亭怀古》：凭谁问，廉颇老矣，尚能饭否？","note":"此题论辛词用典广泛庞杂、连用大量历史典故，袁版以《永遇乐·京口北固亭怀古》连用孙权、刘裕、廉颇等典故且层层深入说明其用典圆熟自然。"},{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"水龙吟","quote":"辛弃疾《水龙吟·登建康赏心亭》：休说鲈鱼堪脍，尽西风、季鹰归未？求田问舍，怕应羞见，刘郎才气。","note":"此题论辛词善反用典故、据个人诉求取用，袁版以“休说鲈鱼堪脍”反借张翰典故说明归隐并非其真正心志，正是反用典之例。"}]},{"id":"286","title":"辛弃疾对词境的开拓体现在哪些方面","examples":[{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"水龙吟","quote":"辛弃疾《水龙吟·登建康赏心亭》：落日楼头，断鸿声里，江南游子。把吴钩看了，栏杆拍遍，无人会、登临意。","note":"袁版论辛弃疾对心灵世界的开拓，以《水龙吟·登建康赏心亭》充分表现英雄心灵世界的丰富性与曲折性，此题正文正引此为据。"},{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"农村田园","quote":"辛弃疾《清平乐·村居》：大儿锄豆溪东，中儿正织鸡笼。最喜小儿亡赖，溪头卧剥莲蓬。","note":"袁版论辛弃疾拓展词境到农村田园和隐逸情趣，此题正文指出其表现农村劳动生活的活跃人物，此句正写照乡村平凡人物走进词世界的新开拓。"}]},{"id":"287","title":"试分析辛弃疾词作的艺术成就（25东北师范大学、浙江大学、渤海大学）","examples":[{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"破阵子","quote":"辛弃疾《破阵子·为陈同甫赋壮词以寄之》：醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。","note":"袁版论辛词转换意象群、军事意象大规模出现，以《破阵子》为密集军事意象连结成雄豪壮阔境界的代表，此题正文正引此词。"},{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"以文为词","quote":"辛弃疾《西江月·遣兴》：以手推松曰：“去！”","note":"袁版论辛弃疾在苏轼“以诗为词”基础上进而“以文为词”，此题正文引《西江月·遣兴》对话式散文化句法，说明其将古文辞赋章法与议论对话移植入词的特点。"}]},{"id":"288","title":"试分析辛弃疾田园词的艺术成就","examples":[{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"清平乐","quote":"辛弃疾《清平乐·村居》：茅檐低小，溪上青青草。醉里吴音相媚好，白发谁家翁媪？","note":"袁版论辛弃疾田园词以农村人物为中心描写田园生活之乐，此题正文以《清平乐·村居》说明其白描手法与对田园词的突破。"},{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"西江月","quote":"辛弃疾《西江月·夜行黄沙道中》：稻花香里说丰年，听取蛙声一片。明月别枝惊鹊，清风半夜鸣蝉。","note":"此题论辛弃疾田园词长于将叙事手法运用于小令、选取典型生活场景白描，袁版以《西江月·夜行黄沙道中》说明其叙事、情节与田园风光的结合。"}]},{"id":"289","title":"试分析苏轼、辛弃疾豪放词风的差异及其原因","examples":[{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"念奴娇·赤壁怀古","quote":"苏轼《念奴娇·赤壁怀古》：大江东去，浪淘尽，千古风流人物。故垒西边，人道是、三国周郎赤壁。","note":"此题对比苏辛豪放词风，袁版以苏词追慕前人风流功业、胸襟开阔说明东坡豪中带旷，正以此词体现苏的旷达而辛的多悲愤。"},{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"水龙吟","quote":"辛弃疾《水龙吟·登建康赏心亭》：可惜流年，忧愁风雨，树犹如此！倩何人唤取，红巾翠袖，揾英雄泪？","note":"此题论辛词多悲愤沉郁、抒胸中块垒，袁版以《水龙吟·登建康赏心亭》设事用典、悲愤不能自抑说明稼轩词风之悲凉沉郁，正与此题对照苏辛差异。"}]},{"id":"290","title":"试述辛弃疾的词史地位","examples":[{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"辛弃疾","quote":"辛弃疾《破阵子·为陈同甫赋壮词以寄之》：了却君王天下事，赢得生前身后名。可怜白发生！","note":"袁版论辛弃疾以大量写国家事、民族恨之词彻底摆脱“诗余”地位、完成豪放词派，此词正体现其以词写军国大志、题材空前的特点。"},{"ref":"第三卷 第五编 第九章","ref_text":"辛弃疾","anchor":"散文入词","quote":"辛弃疾《破阵子·为陈同甫赋壮词以寄之》：马作的卢飞快，弓如霹雳弦惊。","note":"此题论辛弃疾以散文入词、彻底改造词的语言，袁版指出其从“以诗为词”推进至“以文为词”，并击破诗词分野，此题以稼轩军事意象之雄豪说明其解放词体的贡献。"}]},{"id":"293","title":"试述姜夔词的艺术特征","examples":[{"ref":"第三卷 第五编 第十章","ref_text":"姜夔清雅词派","anchor":"扬州慢","quote":"姜夔《扬州慢》：二十四桥仍在，波心荡、冷月无声。念桥边红药，年年知为谁生？","note":"袁版论姜夔词幽冷悲凉的词境与虚处传神手法，此题正文以《扬州慢》说明其善以冷月寒景营构清凄意境，并配有成熟的小序。"},{"ref":"第三卷 第五编 第十章","ref_text":"姜夔清雅词派","anchor":"暗香","quote":"姜夔《暗香》：唤起玉人，不管清寒与攀摘。何逊而今渐老，都忘却春风词笔。","note":"此题论姜夔咏物词别有寄托、语言雅化刚化并配有精制小序，袁版以《暗香》《疏影》为咏物重寄托之代表作，说明其空灵蕴藉、寄托遥深的特点。"},{"ref":"第三卷 第五编 第十章","ref_text":"姜夔清雅词派","anchor":"疏影","quote":"姜夔《疏影》：昭君不惯胡沙远，但暗忆、江南江北。想佩环月夜归来，化作此花幽独。","note":"袁版论姜夔移诗法入词使语言雅化、咏梅而别有怀抱，此题正文以《暗香》《疏影》说明其将身世零落之感与家国之情融入咏物、寄托遥深的艺术特征。"}]},{"id":"309","title":"试述关汉卿的创作成就","examples":[{"ref":"第三卷 第六编 第二章","ref_text":"关汉卿","anchor":"单刀会","quote":"〔双调·新水令〕大江东去浪千叠，引着这数十人驾着这小舟一叶。又不比九重龙凤阙，可正是千丈虎狼穴。大丈夫心别，我觑这单刀会似赛村社。","note":"关汉卿不囿于一本四折、悲于结局的常格，把最精彩的冲突放在第四折，于结局处显高潮。关羽直抒胸臆的这段唱，正见其“须刀会”式造境与本色当行语言，袁版以之为关汉卿戏剧体制内自由创新的代表作。"}]},{"id":"313","title":"试分析《窦娥冤》的艺术成就","examples":[{"ref":"第三卷 第六编 第二章","ref_text":"关汉卿","anchor":"滚绣球","quote":"〔正宫·滚绣球〕有日月朝暮悬，有鬼神掌着生死权。天地也，只合把清浊分辨，可怎生糊突了盗跖颜渊……地也，你不分好歹何为地！天也，你错勘贤愚枉做天！","note":"此曲正是王国维所称“该又有情者失其泪”的“悲戚”“悲壮”高峰。窦娥由安分而觉醒，痛斥天地，语言直白而有意蕴，是袁版论述《窦娥冤》作为悲剧典范的核心唱段。"}]},{"id":"314","title":"试分析关汉卿悲剧的创作特征","examples":[{"ref":"第三卷 第六编 第二章","ref_text":"关汉卿","anchor":"窦娥冤","quote":"〔正宫·滚绣球〕“……地也，你不分好歹何为地！天也，你错勘贤愚枉做天！”","note":"悲剧主角是凡人弱女窦娥，高扬正义、敢于以性命与天地封建势力抗诘，从悲愤走向悲壮。这正体现袁版所论关汉卿悲剧“以民众痛苦为题材、悲剧主角多为普通人”的特征。"}]},{"id":"315","title":"试分析关汉卿杂剧创作的主要特征","examples":[{"ref":"第三卷 第六编 第二章","ref_text":"关汉卿","anchor":"本色当行","quote":"〔双调·新水令〕大江东去浪千叠，引着这数十人驾着这小舟一叶……大丈夫心别，我觑这单刀会似赛村社。","note":"袁版以“本色当行”为关汉卿语言标格，王国维誉为“曲尽人情，字字本色”。关羽出金口、雅俗贯通的唱词动作性极强，是本色当行戏剧语言的典范。"}]},{"id":"316","title":"试分析西厢故事艺术形式与思想内容的流变","examples":[{"ref":"第三卷 第六编 第三章","ref_text":"王实甫与《西厢记》","anchor":"西厢记","quote":"第五本第四折【收尾】“愿天下有情的都成了眷属。”","note":"从《莺莺传》“善补过”到《董西厢》讴歌爱情，再到王实甫《西厢记》以“有情”为婚姻基础，此句将西厢故事思想流变推至顶点，袁版以之为“有情人成眷属”题旨之结穴。"}]},{"id":"317","title":"试分析王实甫《西厢记》对董解元《西厢记诸宫调》的创新","examples":[{"ref":"第三卷 第六编 第三章","ref_text":"王实甫与《西厢记》","anchor":"王实甫","quote":"第四本第三折【正宫·端正好】碧云天，黄花地，西风紧，北雁南飞。晓来谁染霜林醉？总是离人泪。","note":"长亭送别为全剧情感高潮，王实甫重构情景、以戏演情，比董西厢更细腻地揭出莺莺对爱情的眷恋与对未来的惶恐，正体现其对董西厢“强化人物互动、多侧面刻画”的创新。"}]},{"id":"318","title":"为什么《西厢记》被称为元杂剧的“压卷之作”","examples":[{"ref":"第三卷 第六编 第三章","ref_text":"王实甫与《西厢记》","anchor":"压卷之作","quote":"第四本第三折【正宫·端正好】碧云天，黄花地，西风紧，北雁南飞。晓来谁染霜林醉？总是离人泪。","note":"王骥德、徐复祚奉《西厢记》为戏曲语言艺术最高峰。此曲寓情于景、化景物为情思，是《西厢记》语言华美、浓丽绵密而成为“压卷之作”的典型例证。"}]},{"id":"320","title":"《梧桐雨》有何艺术特色","examples":[{"ref":"第三卷 第六编 第四章","ref_text":"马致远/白朴等","anchor":"雨和人紧厮熬","quote":"末折【黄钟煞】“……斟量来这一宵，雨和人紧厮熬。伴铜壶点点敲，雨更多泪不少。雨湿寒梢，泪染龙袍。不肯相饶。共隔着一树梧桐直滴到晓。”","note":"白朴以“梧桐夜雨”写人物心境，情与景深融，盛衰对比、低沉衰飒之音尽出，强化了《梧桐雨》抒情性浓、意境含蓄的抒情诗剧特色，袁版概之为“情深而意切的抒情诗剧”。"}]},{"id":"328","title":"试分析《琵琶记》的艺术成就（25黑龙江大学）","examples":[{"ref":"第三卷 第六编 第五章","ref_text":"南戏（荆刘拜杀 / 高明《琵琶记》）","anchor":"双线","quote":"第一出副末开场【水调歌头】“……正是不关风化体，纵好也徒然。论传奇，乐人易，动人难。”","note":"高明以“风化”“动人”立言，遂以“三不从”为纲、蔡赵双线结构展演。此曲揭示《琵琶记》双线并进、交错映照的整体构思之宗旨，袁版由此论其标志南戏文学品格之提升。"},{"ref":"第三卷 第六编 第五章","ref_text":"南戏（荆刘拜杀 / 高明《琵琶记》）","anchor":"糟糠","quote":"第二十一出【前腔】“糠和米本是相依倚，被簸扬作两处飞。一贱与一贵，好似奴家与夫婿，终无见期。”","note":"赵五娘自食糟糠，以“糠和米”喻己与夫之贵贱云泥，于生理、心理双重磨难中将内心苦楚入戏。袁版称此段“在性情上着功夫”，为其质朴本真、擅长心理刻画之卓例。"}]},{"id":"6","title":"试述《诗经》六义的具体含义","examples":[{"ref":"第一卷 第一编 第二章","ref_text":"《诗经》","anchor":"风、雅、颂","quote":"孔颖达《毛诗正义》引《郑玄六艺论》：“赋、比、兴是诗之所用，风、雅、颂是诗之成形。用彼三事，成此三事，是故同称为义。”又朱熹《诗集传》卷一：“赋者，敷陈其事而直言之者也；比者，以彼物比此物也；兴者，先言他物以引起所咏之词也。","note":"“六义”之名出于《周礼·春官·大师》“教六诗：曰风、曰赋、曰比、曰兴、曰雅、曰颂”。袁行霈本以此为纲分述风雅颂之音乐类别与赋比兴之表现手法。"},{"ref":"第一卷 第一编 第二章","ref_text":"《诗经》","anchor":"《卫风·硕人》","quote":"《卫风·硕人》：“手如柔荑，肤如凝脂，领如蝤蛴，齿如瓠犀，螓首蛾眉。巧笑倩兮，美目盼兮。”— 连用一系列物象比喻，是“比”的显例。","note":"赋比兴中以“比”最易辨识，此段连续设喻，可见《诗经》用比之工。"}]},{"id":"7","title":"如何理解《诗经》的现实主义精神","examples":[{"ref":"第一卷 第一编 第二章","ref_text":"《诗经》","anchor":"《魏风·硕鼠》","quote":"《魏风·硕鼠》：“硕鼠硕鼠，无食我黍！三岁贯女，莫我肯顾。逝将去女，适彼乐土。”— 以“硕鼠”讽喻贪残的统治者，直斥现实。","note":"怨刺诗直面“饥者歌其食，劳者歌其事”的社会现实，是《诗经》现实主义精神的核心表征。"},{"ref":"第一卷 第一编 第二章","ref_text":"《诗经》","anchor":"《七月》","quote":"《豳风·七月》：“七月流火，九月授衣。一之日觱发，二之日栗烈。无衣无褐，何以卒岁？”— 按季节物候铺叙农事，真实再现农夫一年的劳作与饥寒。","note":"农事诗直接描写农业生产生活，是“饥者歌其食”的典型，袁章举《七月》为现实主义代表作。"}]},{"id":"8","title":"谈谈《诗经》的艺术成就","examples":[{"ref":"第一卷 第一编 第二章","ref_text":"《诗经》","anchor":"重章叠句","quote":"《周南·芣苢》：“采采芣苢，薄言采之。采采芣苢，薄言有之。采采芣苢，薄言掇之……”— 通过重章叠句、只易一字，层层递进，回环往复。","note":"重章叠句是《诗经》最突出的形式特征，此举《芣苢》三章换字，可见其于重复中求变化。"}]},{"id":"9","title":"《诗经》在文学史上的地位及影响","examples":[{"ref":"第一卷 第一编 第二章","ref_text":"《诗经》","anchor":"诗经","quote":"《魏风·伐檀》：“坎坎伐檀兮，寘之河之干兮，河水清且涟猗。不稼不穑，胡取禾三百廛兮？”— 揭露不劳而获，直面现实。","note":"《诗经》奠定我国诗歌面向现实的传统，历代“饥者歌其食，劳者歌其事”及乐府、杜甫、白居易等皆承其精神。"}]},{"id":"10","title":"分析古代文学中“男子作闺音”的现象（苏州大学）","examples":[{"ref":"第一卷 第一编 第二章","ref_text":"《诗经》","anchor":"弃妇","quote":"《卫风·氓》：“于嗟鸠兮，无食桑葚！于嗟女兮，无与士耽。士之耽兮，犹可说也；女之耽兮，不可说也。”— 男子代女性立言，抒写弃妇的怨愤与觉悟。","note":"“男子作闺音”即男性作家代女性抒写心声；此《氓》以男子之笔全篇代言弃妇，是早期“作闺音”的典型。"}]},{"id":"11","title":"论述“《诗》可以兴，可以观，可以群，可以怨”","examples":[{"ref":"第一卷 第一编 第二章","ref_text":"《诗经》","anchor":"兴观群怨","quote":"《论语·阳货》：“子曰：‘小子何莫学夫《诗》？《诗》可以兴，可以观，可以群，可以怨。迩之事父，远之事君；多识于鸟兽草木之名。’”","note":"“兴观群怨”出自孔子论《诗》，概括了《诗》的认识、教育与社会作用，是理解《诗经》功能与讽谏传统的钥匙。"}]},{"id":"12","title":"中华民族有史诗吗，请简要分析上古史诗的创作形态","examples":[{"ref":"第一卷 第一编 第二章","ref_text":"《诗经》","anchor":"生民","quote":"《大雅·生民》：“载生载育，时维后稷。诞弥厥月，先生如达。不坼不副，无菑无害。以赫厥灵。”— 追叙周祖后稷传奇诞生与稼穑之绩。","note":"周族史诗（《生民》《公刘》《绵》《皇矣》《大明》）以祭祖颂赞形式追述民族发祥，构成我国早期的民族叙事诗形态。"}]},{"id":"13","title":"结合具体作品论述先秦历史散文的发展阶段（25江苏师范大学）","examples":[{"ref":"第一卷 第一编 第三章","ref_text":"先秦历史散文","anchor":"《左传》","quote":"《左传·晋公子重耳之亡》：“（重耳）对曰：‘子女玉帛，则君有之；羽毛齿革，则君地生焉。其波及晋国者，君之余也，其何以报君？’曰：‘虽然，何以报我？’对曰：‘若以君之灵，得反晋国，晋、楚治兵，遇于中原，其辟君三舍。若不获命，其左执鞭弭，右属櫜鞬，以与君周旋。’”","note":"《左传》叙事婉曲、记言精雅，标志着先秦历史散文由编年记事走向成熟的叙事散文。"}]},{"id":"16","title":"举例说明《左传》的文学成就（叙事特点）(25南京师范大学）","examples":[{"ref":"第一卷 第一编 第三章","ref_text":"先秦历史散文","anchor":"叙事","quote":"《左传·宣公十五年》叙“结草”之报，前有“余而以是报”之言，后有“及辅氏之役，颖见老人结草以亢杜回”之应，因果照应，脉络井井。","note":"《左传》叙事重视“礼”的伦理评判与因果牵连，被刘知几誉为“叙事之最”；后世《史记》多承其叙事之法。"}]},{"id":"17","title":"论《左传》战争描写的特点（26中央财经大学）","examples":[{"ref":"第一卷 第一编 第三章","ref_text":"先秦历史散文","anchor":"曹刿","quote":"《左传·庄公十年》：“夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。”— 不写刀兵相接之状，而重在战前决策与战略分析。","note":"《左传》写战争不拘于战场，而重其前因后果、谋略胜负与人物识度，此举《曹刿论战》可见其“重谋略、轻杀伐”的叙事倾向。"}]},{"id":"19","title":"《战国策》的艺术特色","examples":[{"ref":"第一卷 第一编 第三章","ref_text":"先秦历史散文","anchor":"策士","quote":"《战国策·齐策四·冯谖客孟尝君》：“弹剑而歌曰：‘长铗归来乎！食无鱼。’……后复弹其剑，歌曰：‘长铗归来乎！出无车。’”","note":"《战国策》以策士言行为中心，刻画冯谖等智士的机智纵横，其雄辩与巧饰，是战国纵横之风的写照。"}]},{"id":"20","title":"《战国策》在人物塑造上的成就","examples":[{"ref":"第一卷 第一编 第三章","ref_text":"先秦历史散文","anchor":"人物","quote":"《战国策·赵策四》：“左师触龙言愿见太后，太后盛气而揖之。入而徐趋，至而自谢曰：‘老臣病足，曾不能疾走，不得见久矣，窃自恕……’”","note":"《战国策》善于通过言语动作的细节与势态描写刻画人物，如触龙以迂回方式进谏，人物个性跃然纸上。"}]},{"id":"21","title":"《战国策》的语言特色与成就","examples":[{"ref":"第一卷 第一编 第三章","ref_text":"先秦历史散文","anchor":"排比","quote":"《战国策·齐策一》：“城非不高也，池非不深也，兵革非不坚利也，米粟非不多也。”— （借孟子语）排比铺陈，气势酣畅。","note":"《战国策》辞令敷张扬厉，好铺排、善譬喻、多用排比偶俪，对后世汉赋与论说文影响深远。"}]},{"id":"22","title":"谈谈先秦叙事散文对后世文学的影响","examples":[{"ref":"第一卷 第一编 第三章","ref_text":"先秦历史散文","anchor":"《史记》","quote":"《史记·太史公自序》：“网罗天下放失旧闻，考之行事，稽其成败兴坏之理，上计轩辕，下至于兹。”— 司马迁自称“厥协六经异传，整齐百家杂语”，其纪传叙事实承先秦史笔。","note":"先秦历史散文的纪事、记言传统为《史记》等纪传体史书奠基，《左传》《战国策》之叙事成为后代叙事文学的渊薮。"}]},{"id":"23","title":"谈谈先秦诸子散文的发展概况及特点","examples":[{"ref":"第一卷 第一编 第四章","ref_text":"先秦诸子散文","anchor":"《论语》","quote":"《论语·先进》：“暮春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。夫子喟然叹曰：‘吾与点也！’”— 语录体，言约义丰，富形象性。","note":"诸子散文由《论语》《墨子》之语录体，演进为《孟子》《庄子》之对话体，再至《荀子》《韩非子》之专题论说，体制日益宏大。"}]},{"id":"25","title":"试分析《孟子》的艺术特色","examples":[{"ref":"第一卷 第一编 第四章","ref_text":"先秦诸子散文","anchor":"论辩","quote":"《孟子·梁惠王上》：“王顾左右而言他。”— 孟子以步步逼问之法论辩，使对方词穷理屈，无处可遁。","note":"孟子散文以雄辩著称，善用逐层诘难、设喻类比与排比反诘，气势磅礴，形成“文如折狱”的论辩特色。"}]},{"id":"26","title":"试分析《孟子》的对话辩论艺术","examples":[{"ref":"第一卷 第一编 第四章","ref_text":"先秦诸子散文","anchor":"五十步笑百步","quote":"《孟子·梁惠王上》：“王好战，请以战喻：填然鼓之，兵刃既接，弃甲曳兵而走，或百步而后止，或五十步而后止。以五十步笑百步，则何如？”","note":"孟子善用日常生活之设喻（“以战喻”）层层引譬，使深奥义理寓于浅近故事，是对话论辩艺术的典范。"}]},{"id":"27","title":"试分析《庄子》的艺术特色","examples":[{"ref":"第一卷 第一编 第四章","ref_text":"先秦诸子散文","anchor":"《逍遥游》","quote":"《庄子·逍遥游》：“北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也。怒而飞，其翼若垂天之云。”","note":"庄子以奇幻夸张的想象与汪洋恣肆的语言创造寓言世界，想象奇诡、意境宏廓，是散文浪漫主义之祖。"}]},{"id":"28","title":"试述《庄子》中寓言的类型","examples":[{"ref":"第一卷 第一编 第四章","ref_text":"先秦诸子散文","anchor":"寓言","quote":"《庄子·秋水》：“庄子与惠子游于濠梁之上。庄子曰：‘鯈鱼出游从容，是鱼之乐也。’惠子曰：‘子非鱼，安知鱼之乐？’庄子曰：‘子非我，安知我不知鱼之乐？’”","note":"此“濠梁之辩”属哲理寓言，借庄子与惠子的诘难阐发相对主义认识论，是《庄子》寓言以故事寓理的代表。"}]},{"id":"29","title":"简述《庄子》“三言”及其特点","examples":[{"ref":"第一卷 第一编 第四章","ref_text":"先秦诸子散文","anchor":"寓言","quote":"《庄子·寓言》：“寓言十九，重言十七，卮言日出，和以天倪。”— 庄子自述其书以寓言、重言、卮言三种方式行文。","note":"“三言”即寓言（寄寓之言）、重言（托于尊老之言）、卮言（随物而变之言），是理解《庄子》文章体式与语言特色的总纲。"}]},{"id":"32","title":"试分析先秦说理散文的地位与影响","examples":[{"ref":"第一卷 第一编 第四章","ref_text":"先秦诸子散文","anchor":"《荀子》","quote":"《荀子·劝学》：“积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。”","note":"《荀子》文思缜密、论证严密，已臻专题论说文之成熟，标志先秦说理散文的集大成，影响后世论说、赋体。"}]},{"id":"33","title":"请结合材料中的作品和具体作家，论述先秦诸子散文和唐宋古文的关系（25西北大学）","examples":[{"ref":"第一卷 第一编 第四章","ref_text":"先秦诸子散文","anchor":"韩愈","quote":"韩愈《进学解》：“……沉浸醲郁，含英咀华，作为文章，其书满家。上规姚姒，浑浑无涯；周诰殷盘，佶屈聱牙；《春秋》谨严，左氏浮夸；《易》奇而法，《诗》正而葩。”","note":"韩愈推重先秦两汉古文，倡“文以载道”，主张“非三代两汉之书不敢观”，诸子散文正是其复古宗经之所本。"}]},{"id":"35","title":"试分析《离骚》的思想内涵","examples":[{"ref":"第一卷 第一编 第五章","ref_text":"屈原与楚辞","anchor":"《离骚》","quote":"《离骚》：“虽九死其犹未悔。”“亦余心之所善兮，虽九死其犹未悔。怨灵修之浩荡兮，终不察夫民心。”— 抒写宁死不屈的忠贞与对不察民心的怨愤。","note":"《离骚》集中表现屈原“美政”理想与忧国忧民之情、忠而见谤的悲愤，是“发愤以抒情”的爱国主义、理想主义诗篇。"}]},{"id":"36","title":"试分析《离骚》的抒情主人公形象（26厦门大学）","examples":[{"ref":"第一卷 第一编 第五章","ref_text":"屈原与楚辞","anchor":"主人公","quote":"《离骚》：“纷吾既有此内美兮，又重之以修能。扈江离与辟芷兮，纫秋兰以为佩。”— 以佩戴香草象征高洁品格的自我修为。","note":"《离骚》主人公自述内美与修能，以香草自喻、上下求索，塑造了一个忠贞耿介、高洁不屈的诗人自我形象。"}]},{"id":"37","title":"谈谈你对《离骚》“香草美人”手法的认识","examples":[{"ref":"第一卷 第一编 第五章","ref_text":"屈原与楚辞","anchor":"香草美人","quote":"《离骚》：“惟草木之零落兮，恐美人之迟暮……初既与余成言兮，后悔遁而有他。余既不难夫离别兮，伤灵修之数化。”— 以“美人”喻君王与贤君，以“草木零落”感时不我待。","note":"“香草美人”以芳草喻贤人、佩玉比美德，以“求女”喻求贤君，比兴寄托，开创中国诗歌象征/寄托传统，影响后世之微言大义。"}]},{"id":"38","title":"《离骚》的艺术特色","examples":[{"ref":"第一卷 第一编 第五章","ref_text":"屈原与楚辞","anchor":"想象","quote":"《离骚》：“前望舒使先驱兮，后飞廉使奔属。鸾皇为余先戒兮，雷师告余以未具。吾令凤鸟飞腾兮，继之以日夜。”— 驱使日月风雷、鸾皇凤鸟，神游天地。","note":"《离骚》以神话传说与瑰奇想象构成光怪陆离的遨游境界，辅以驰骋跌宕的语言与香草美人之比兴，呈壮浪纵恣的浪漫风格。"}]},{"id":"40","title":"屈原的地位与影响","examples":[{"ref":"第一卷 第一编 第五章","ref_text":"屈原与楚辞","anchor":"香草美人","quote":"《离骚》：“路漫漫其修远兮，吾将上下而求索。”“亦余心之所善兮，虽九死其犹未悔。”","note":"屈原是第一位有名有姓的诗人，其“发愤以抒情”与香草美人传统，开创中国诗歌的浪漫主义与抒情传统，被尊为“骚体”之祖。"}]},{"id":"41","title":"谈谈楚辞的地位和影响","examples":[{"ref":"第一卷 第一编 第五章","ref_text":"屈原与楚辞","anchor":"《楚辞》","quote":"刘勰《文心雕龙·辨骚》：“不有屈原，岂见《离骚》？惊才风逸，壮志烟高。”— 王逸《楚辞章句》尊称其为“辞赋之宗”。","note":"楚辞为楚地新兴诗体，与《诗经》双峰并峙，其骚体句式、香草美人传统与浪漫精神，垂范汉赋及后世辞赋与诗。"}]},{"id":"346","title":"试分析《三国志演义》的历史地位","examples":[{"ref":"第四卷 第七编 第二章","ref_text":"《三国志演义》","anchor":"章回小说","quote":"开卷词（明·杨慎《临江仙》，毛宗岗托为毛本卷首）：滚滚长江东逝水，浪花淘尽英雄。是非成败转头空：青山依旧在，几度夕阳红。白发渔樵江渚上，惯看秋月春风。一壶浊酒喜相逢：古今多少事，都付笑谈中。","note":"卷首一词定下咏史与以小说观照兴亡的基调，正呼应袁版所称《三国志演义》为章回小说开山之作、以近百年历史立大的史诗格局。"}]},{"id":"347","title":"试分析《三国志演义》的思想内容","examples":[{"ref":"第四卷 第七编 第二章","ref_text":"《三国志演义》","anchor":"忠义","quote":"《三国志演义》第一回桃园三结义誓言：“同心协力，救困扶危；上报国家，下安黎庶。不求同年同月同日生，只愿同年同月同日死。”","note":"桃园结义誓言以“忠义”为全书思想内核，正是袁版所论《三国志演义》恪守以“忠义”为核心伦理、又崇尚智勇与仁政的思想梗概所在。"}]},{"id":"348","title":"试分析《三国志演义》的艺术成就","examples":[{"ref":"第四卷 第七编 第二章","ref_text":"《三国志演义》","anchor":"七实三虚","quote":"清·章学诚《丙辰札记》：“《三国演义》则七分实事，三分虚构，以致观者往往为所惑乱。”","note":"“七实三虚”既是袁版所论《三国志演义》处理史实与虚构关系的艺术构思，也是其高超叙事、塑造特征化典型的根基。"}]},{"id":"350","title":"试分析《三国志演义》“七实三虚”的艺术构思","examples":[{"ref":"第四卷 第七编 第二章","ref_text":"《三国志演义》","anchor":"三顾茅庐","quote":"《三国志·蜀书·诸葛亮传》：“先主诣亮，凡三往，乃见。”","note":"正文所引“三往乃见”出于史书为实，而《三国志演义》据“三往”二字敷衍为跌宕的“三顾茅庐”，是“以虚化实”、虚中见真的典型例证，正合袁版对“七实三虚”的剖析。"}]},{"id":"351","title":"试分析《三国志演义》在人物塑造方面的艺术成就","examples":[{"ref":"第四卷 第七编 第二章","ref_text":"《三国志演义》","anchor":"其酒尚温","quote":"《三国志演义》第五回“温酒斩华雄”：操教酾热酒一杯，与关公饮了上马。关公曰：“酒且斟下，某去便来。”出帐提刀，飞身上马。……鸾铃响处，马到中军，云长提华雄之头，掷于地上。其酒尚温。","note":"“其酒尚温”四字以极简之笔夸张字凸显关羽神勇，恰是袁版所称以传奇细节凸显人物性格、塑造特征化典型的成功笔墨。"}]},{"id":"352","title":"试分析《三国志演义》悲剧审美品格","examples":[{"ref":"第四卷 第七编 第二章","ref_text":"《三国志演义》","anchor":"崇高","quote":"诸葛亮《后出师表》：“臣鞠躬尽瘁，死而后已。至于成败利钝，非臣之明所能逆睹也。”","note":"“鞠躬尽瘁，死而后已”正是蜀汉理想具象化的悲剧英雄之志；袁版将此悲剧气质绾结为壮美崇高——在激烈冲突中显示主体精神与道德力量的崇高，此语即其注脚。"}]},{"id":"355","title":"试分析《水浒传》的结构和主旨","examples":[{"ref":"第四卷 第七编 第三章","ref_text":"《水浒传》","anchor":"官逼民反","quote":"《水浒传》第十回林冲风雪山神庙，金圣叹夹批：“妙绝之笔，故曰‘那雪正下得紧’！古人之于酒，于雪，亦何所不至哉。”正文：“那雪正下得紧。”","note":"林冲由忍到狠正是“官逼民反”的巅峰体现；袁版以结构与主旨合一立论，此“逼上梁山”之情节即官逼民反语义结构的核心例证。"}]},{"id":"356","title":"试分析《水浒传》的忠义思想","examples":[{"ref":"第四卷 第七编 第三章","ref_text":"《水浒传》","anchor":"忠义","quote":"《水浒传》第七十五回李逵语：“招安，招安，招甚鸟安！”","note":"李逵直斥招安之语，正因袁版以“忠义”思想为纲、把宋江塑为忠义的化身而对李逵等“只作忠义之映衬”，此语正是全书的映衬之笔。"}]},{"id":"357","title":"试分析《水浒传》的艺术成就","examples":[{"ref":"第四卷 第七编 第三章","ref_text":"《水浒传》","anchor":"鲁智深","quote":"《水浒传》第三回回目：“史大郎夜走华阴县　鲁提辖拳打镇关西。”","note":"鲁达一出场即拳打镇关西、搭救金氏父女，给读者以强烈的“第一印象”，是正文所云“注重人物出场亮相、构思动作性情节”的典型，正合袁版对《水浒传》人物塑造的推重。"},{"ref":"第四卷 第七编 第三章","ref_text":"《水浒传》","anchor":"武松打虎","quote":"《水浒传》第二十三回回目：“横海郡柴进留宾　景阳冈武松打虎。”","note":"景阳冈打虎一节正文极写虎之“一扑、一掀、一剪”与武松之“一闪、一躲、偷一棒”，细节逼真，正是袁版所称《水浒传》卓越细节描写的代表例证。"}]},{"id":"358","title":"试比较《三国志演义》和《水浒传》的异同","examples":[{"ref":"第四卷 第七编 第三章","ref_text":"《水浒传》","anchor":"英雄传奇","quote":"《三国志演义》第一回回目：“宴桃园豪杰三结义　斩黄巾英雄首立功”；《水浒传》第二回回目：“史大郎夜走华阴县　鲁提辖拳打镇关西。”","note":"一为依史敷演一代兴废的历史演义，一为聚焦传奇英雄个人的英雄传奇；袁版正以此二类代表为据比较其思想与艺术之异同。"}]},{"id":"361","title":"请阐述你对金圣叹“腰斩水浒”这一行为的看法","examples":[{"ref":"第四卷 第七编 第三章","ref_text":"《水浒传》","anchor":"腰斩","quote":"金圣叹评改本命名《第五才子书施耐庵水浒传》，删去招安以后情节而止于“卢俊义惊恶梦”；所据第七十一回回目：“忠义堂石碣受天文　梁山泊英雄排座次”。","note":"袁版指出金圣叹将百二十回本“腰斩”为七十回本、以卢俊义一梦作结，此处以回目与书名点出“腰斩”之所据，便于评析其得失。"}]},{"id":"362","title":"结合《三国志演义》与《水浒传》论述“历史演义”与“英雄传奇”的异同","examples":[{"ref":"第四卷 第七编 第三章","ref_text":"《水浒传》","anchor":"历史演义","quote":"《三国志演义》开卷词：“滚滚长江东逝水，浪花淘尽英雄。是非成败转头空：青山依旧在，几度夕阳红。”","note":"历史演义着眼于“陈叙百年，该括万事”的一代兴废，开卷一词即点出以史为纲的格局；与英雄传奇聚焦个人命运正相映照，呼应袁版的类型比较。"},{"ref":"第四卷 第七编 第三章","ref_text":"《水浒传》","anchor":"英雄传奇","quote":"《水浒传》第一回回目：“洪太尉误走妖魔　张天师祈禳瘟疫。”","note":"英雄传奇多出于虚构、横向铺展生活面，第一回以误走妖魔起兴即见其离史实而重想象的性质，正合袁版所述英雄传奇“虚多于实”之特征。"}]},{"id":"366","title":"简述前后七子文学复古的得失","examples":[{"ref":"第四卷 第七编 第一章","ref_text":"明前期诗文（前后七子）","anchor":"复古","quote":"明·李梦阳、何景明等前七子倡言的旗号：“文必秦汉，诗必盛唐。”（见《明史·文苑传》综括前后七子主张）","note":"“文必秦汉，诗必盛唐”是前后七子复古运动的核心旗帜，袁版即据此评其功在重振文学语体与真情、而失于拟古蹈袭。"}]},{"id":"374","title":"谈谈你对汤显祖“至情”论的认识","examples":[{"ref":"第四卷 第七编 第七章","ref_text":"汤显祖与《牡丹亭》","anchor":"至情","quote":"汤显祖《牡丹亭题词》：“情不知所起，一往而深。生者可以死，死可以生。生而不可与死，死而不可复生者，皆非情之至也。”","note":"此即袁版所称“至情”论的纲领：以“生而死、死而生”贯通生死虚实的至情，呼唤精神自由与个性解放。"}]},{"id":"375","title":"试分析《牡丹亭》的艺术特色","examples":[{"ref":"第四卷 第七编 第七章","ref_text":"汤显祖与《牡丹亭》","anchor":"惊梦","quote":"《牡丹亭·惊梦》〔皂罗袍〕：“原来姹紫嫣红开遍，似这般都付与断井颓垣。良辰美景奈何天，赏心乐事谁家院？”","note":"惊梦一出的皂罗袍典雅蕴藉、于花园发现中寄寓春情觉醒，是袁版所称《牡丹亭》重抒情重意境、语言“在浅深浓淡雅俗之间”的典范。"},{"ref":"第四卷 第七编 第七章","ref_text":"汤显祖与《牡丹亭》","anchor":"语言","quote":"《牡丹亭·惊梦》〔绕地游〕：“梦回莺啭，乱煞年光遍。人立小庭深院。”","note":"开篇这支曲子以春色撩人写杜丽娘幽居之寂，足见《牡丹亭》由环境诗化到心理刻画、虚实结合的浪漫风格，正对袁版的“从筋节窍髓探其七情生动之微”。"}]},{"id":"376","title":"试分析《牡丹亭》思想价值","examples":[{"ref":"第四卷 第七编 第七章","ref_text":"汤显祖与《牡丹亭》","anchor":"禁欲主义","quote":"《牡丹亭·惊梦》〔皂罗袍〕：“原来姹紫嫣红开遍，似这般都付与断井颓垣。良辰美景奈何天，赏心乐事谁家院？”","note":"杜丽娘于禁闭之中“惊羡春色”、萌发青春意识，正是袁版所论《牡丹亭》以情反理、崇尚个性解放、突破禁欲主义的基点。"}]},{"id":"377","title":"试分析《牡丹亭》中杜丽娘的形象","examples":[{"ref":"第四卷 第七编 第七章","ref_text":"汤显祖与《牡丹亭》","anchor":"杜丽娘","quote":"《牡丹亭·题词》：“如丽娘者，乃可谓之有情人耳。情不知所起，一往而深。生者可以死，死可以生。”","note":"袁版称杜丽娘为“至情”之人，其“生而死、死而生”的情感历程正由题词点破，是她由大家闺秀走向勇敢斗士的关键题眼。"}]},{"id":"380","title":"试论述《西厢记》和《牡丹亭》爱情的观念异同","examples":[{"ref":"第四卷 第七编 第七章","ref_text":"汤显祖与《牡丹亭》","anchor":"西厢记","quote":"王实甫《西厢记》第四本第三折〔正宫·端正好〕：“碧云天，黄花地，西风紧，北雁南飞。晓来谁染霜林醉，总是离人泪。”","note":"西厢以“长亭送别”直抒有情人离情，属袁版所称“以情战礼”、把婚姻建立在爱情基础上的现实主义爱情观。"},{"ref":"第四卷 第七编 第七章","ref_text":"汤显祖与《牡丹亭》","anchor":"牡丹亭","quote":"汤显祖《牡丹亭题词》：“情不知所起，一往而深。生者可以死，死可以生。生而不可与死，死而不可复生者，皆非情之至也。”","note":"牡丹亭将爱情提升为贯生死、抗“存天理灭人欲”的哲理性“至情”，即为袁版所谓《牡丹亭》主题“以情战理”的题词自证，正可与西厢相对照。"}]},{"id":"384","title":"试分析《西游记》的思想内容","examples":[{"ref":"第四卷 第七编 第五章","ref_text":"《西游记》","anchor":"心猿","quote":"《西游记》第一回回目：“灵根育孕源流出　心性修持大道生。”","note":"以“心猿”喻躁动不安之心、回目点明“心性修持”，正是袁版所称《西游记》于游戏之中寄托“三教合一”化心学的思想内核。"}]},{"id":"385","title":"试分析《西游记》中孙悟空的形象特征","examples":[{"ref":"第四卷 第七编 第五章","ref_text":"《西游记》","anchor":"大闹天宫","quote":"《西游记》第七回孙悟空语：“皇帝轮流做，明年到我家。只教他搬出去，将天宫让与我，便罢了。”","note":"“皇帝轮流做”道出孙悟空蔑视神权、尊重自我、向往自由的强烈个性精神，恰是袁版所论孙悟空形象最鲜明的特征。"}]},{"id":"386","title":"一位学者说孙悟空形象“自在不成人，成人不自在”，请结合《西游记》情节与相关思想文化背景对这一说法进行分析","examples":[{"ref":"第四卷 第七编 第五章","ref_text":"《西游记》","anchor":"定心猿","quote":"《西游记》第七回回目：“八卦炉中逃大圣　五行山下定心猿。”","note":"“五行山下定心猿”正是正文“放开之则放心、压迫而归定心、西行而修心”的枢轴，呼应袁版用心学框架阐发“自在”与“成人”之辩证。"}]},{"id":"387","title":"《西游记》中是如何将神性、人性、物性统一在一起的？请具体结合人物与故事情节说明。","examples":[{"ref":"第四卷 第七编 第五章","ref_text":"《西游记》","anchor":"人性","quote":"鲁迅《中国小说史略》评《西游记》（现代评语）：“其所以无端拔散者，以殊未详加究诘，故神魔皆有人情，精魅亦通世故。”","note":"鲁迅“神魔皆有人情，精魅亦通世故”一语，正从整体上点明袁版所谓神性、物性与人性的统一——妖魔鬼怪合七情六欲、具人之世故。"}]},{"id":"388","title":"试分析《西游记》的艺术特色","examples":[{"ref":"第四卷 第七编 第五章","ref_text":"《西游记》","anchor":"游戏笔墨","quote":"《西游记》第四十四回车迟国影身图旁白：“且莫说是和尚，就是剪鬃、秃子、毛稀的，都也难逃。”","note":"此语看似风趣夸张，实以游戏笔墨讽刺厂卫特务横行之世，正合袁版所称《西游记》喜剧色彩与“游戏之中暗传密谛”的讽刺锋芒。"}]},{"id":"389","title":"为什么说《西游记》是一部“游戏之作”","examples":[{"ref":"第四卷 第七编 第五章","ref_text":"《西游记》","anchor":"游戏","quote":"鲁迅《中国小说史略》评《西游记》（现代评语）：“虽述变幻恍惚之事，亦每杂解颐之言，使神魔皆有人情，精魅亦通世故。”","note":"鲁迅以“解颐之言”指《西游记》谐谑游戏之笔，袁版即据其“出于游戏”之说讨论游戏之作的性质与“游戏之中暗传密谛”的深意。"}]},{"id":"391","title":"试分析《金瓶梅》的思想内容","examples":[{"ref":"第四卷 第七编 第六章","ref_text":"《金瓶梅》","anchor":"西门庆","quote":"《金瓶梅》第一回回目：“西门庆热结十弟兄　武二郎冷遇亲哥嫂。”","note":"作品以市井暴发户西门庆家族为核心展开性、权、利之纠葛，正合袁版所论《金瓶梅》暴露封建统治集团与新兴商人势力、揭示人性弱点的思想主旨。"}]},{"id":"392","title":"试分析《金瓶梅》在白话小说发展上的里程碑意义","examples":[{"ref":"第四卷 第七编 第六章","ref_text":"《金瓶梅》","anchor":"寄意于时俗","quote":"鲁迅《中国小说史略》评《金瓶梅》（现代评语）：“作者之于世情，盖诚极洞达……皆以缁然现世相，或幽伏而含讥，或一时并写两面，使之相形。”","note":"“寄意于时俗”“讽刺写实”是袁版所论《金瓶梅》作为第一部文人独立创作的长篇白话世情小说的里程碑意义，鲁迅评语与之互证。"}]},{"id":"394","title":"明清世情小说的写实性倾向和文学史地位","examples":[{"ref":"第四卷 第七编 第六章","ref_text":"《金瓶梅》","anchor":"世情小说","quote":"《金瓶梅》第一回回目：“西门庆热结十弟兄　武二郎冷遇亲哥嫂。”","note":"以家庭琐事、市井凡俗为描写对象，正是世情小说“极摹人情世态”的写实倾向之始，袁版以《金瓶梅》为世情小说之源、并以白描写实开启《儒林外史》《红楼梦》之绪。"}]},{"id":"396","title":"试分析“三言”“二拍”的思想内容","examples":[{"ref":"第四卷 第七编 第四章","ref_text":"明代拟话本（三言二拍）","anchor":"杜十娘","quote":"冯梦龙编《喻世明言》《警世通言》《醒世恒言》，合称“三言”；其中《杜十娘怒沉百宝箱》即见《警世通言》。","note":"杜十娘怒沉百宝箱、维护人格尊严，正是袁版所称“三言”“二拍”讴歌婚恋自主、流露男女平等思想并为女性请命的代表作。"},{"ref":"第四卷 第七编 第四章","ref_text":"明代拟话本（三言二拍）","anchor":"卖油郎独占花魁","quote":"《卖油郎独占花魁》回目（见《醒世恒言》），写秦重与莘瑶琴以相互平等尊重为基础、终成眷属的爱情婚姻。","note":"卖油郎独占花魁以市民婚恋为题材、肯定以义为本的平等结合，正印证袁版所论“三言”婚恋自主精神与晚明商人崛起的新价值取向。"}]},{"id":"397","title":"试分析“三言”“二拍”的艺术特色","examples":[{"ref":"第四卷 第七编 第四章","ref_text":"明代拟话本（三言二拍）","anchor":"珍珠衫","quote":"《蒋兴哥重会珍珠衫》（《喻世明言》）以一件“珍珠衫”为贯穿全篇的“小道具”，使离合悲欢一线贯通。","note":"以一“小道具”贯穿、设误会巧合而造波澜，正是袁版所称“三言”“二拍”“无奇之所以为奇”、于日常题材中见传奇之奇的核心手法。"}]},{"id":"416","title":"简答《桃花扇》的思想内容和艺术特色","examples":[{"ref":"第四卷 第八编 第五章","ref_text":"孔尚任与《桃花扇》","anchor":"桃花扇","quote":"俺曾见金陵玉殿莺啼晓，秦淮水榭花开早，谁知道容易冰消。眼看他起朱楼，眼看他宴宾客，眼看他楼塌了。——〔离亭宴带歇拍煞〕《哀江南》","note":"〔哀江南〕一曲由老艺人苏昆生吊古，把南明王朝梦幻般忽兴忽亡的历史化为「起朱楼—宴宾客—楼塌了」的沉痛绝唱，正是袁版所论《桃花扇》「借离合之情，写兴亡之感」及一代兴亡慨叹愈益深邃的高潮所在。"}]},{"id":"417","title":"试分析《长生殿》的思想内容","examples":[{"ref":"第四卷 第八编 第四章","ref_text":"洪昇与《长生殿》","anchor":"长生殿","quote":"天长地久有时尽，此恨绵绵无绝期。——白居易《长恨歌》","note":"洪昇《长生殿》上卷《密誓》《埋玉》敷演李、杨生死之别，下卷《闻铃》《哭像》抒写精诚不灭的思念，其「情至」主题正是对白氏《长恨歌》「天长地久有时尽，此恨绵绵无绝期」所开「帝妃深情」叙事的继承与推衍，契合袁版「洪昇旨在言情、歌赞生死不渝真情」的定位。"}]},{"id":"418","title":"简述《长生殿》的艺术特色","examples":[{"ref":"第四卷 第八编 第四章","ref_text":"洪昇与《长生殿》","anchor":"长生殿","quote":"白杨萧瑟雨纵横，此际孤魂凄冷。鬼火光寒，草间湿乱萤。——《长生殿·闻铃》","note":"《闻铃》借蜀道铃声、空山夜雨之景传李隆基丧妃之孤凄，正是袁版所称《长生殿》「借景抒情、情景交融」与全书浓郁抒情诗剧风格的典型曲文。"}]},{"id":"419","title":"试分析《长生殿》与《桃花扇》之异同","examples":[{"ref":"第四卷 第八编 第四章","ref_text":"洪昇与《长生殿》","anchor":"长生殿","quote":"天长地久有时尽，此恨绵绵无绝期。——白居易《长恨歌》","note":"《长生殿》以李、杨深情离合写一代兴亡，其情缘主轴承接《长恨歌》；而《桃花扇》则借侯、李离合的「兴亡之感」探求南明灭亡之由，两剧「情政结合」而主从相反，正合袁版并论二剧同源而异旨之说。"}]},{"id":"427","title":"试分析《聊斋志异》的诗化倾向","examples":[{"ref":"第四卷 第八编 第六章","ref_text":"蒲松龄与《聊斋志异》","anchor":"聊斋志异","quote":"有女郎携婢，捻梅花一枝，容华绝代，笑容可掬，天真烂漫。——《聊斋志异·婴宁》","note":"写婴宁「捻梅花一枝」的出场白描，以景衬人、以笑见性，含蓄蕴藉，正是袁版所称《聊斋志异》「以诗歌品格建构小说、营造诗之意境」之诗化倾向的体现。"}]},{"id":"428","title":"试论述《聊斋志异》的人物塑造","examples":[{"ref":"第四卷 第八编 第六章","ref_text":"蒲松龄与《聊斋志异》","anchor":"婴宁","quote":"门前皆丝柳，墙内桃杏尤繁，间以修竹，野鸟格磔其中。门内白石砌路，夹道红花，片片堕阶上。——《聊斋志异·婴宁》","note":"以居处之静谧明丽烘托婴宁的天真纯洁、不可方物，正是袁版所论《聊斋志异》「通过环境气氛之描写烘托人物性格」之一例。"}]},{"id":"429","title":"《聊斋志异》是一部以幻想的形式写成的社会问题小说，请分析它所反映的社会内容","examples":[{"ref":"第四卷 第八编 第六章","ref_text":"蒲松龄与《聊斋志异》","anchor":"聊斋志异","quote":"集腋为裘，妄续幽冥之录；浮白载笔，仅成孤愤之书。——蒲松龄《聊斋志异·自序》","note":"蒲松龄自道以狐鬼故事寄满腔孤愤，正印证袁版所评：全书借谈狐说鬼的幻想形式，曲折批判政治腐败、歌颂反抗与真情，「孤愤之书」八字即其社会问题小说性格的自白。"}]},{"id":"430","title":"试分析《儒林外史》的结构特点","examples":[{"ref":"第四卷 第八编 第七章","ref_text":"吴敬梓与《儒林外史》","anchor":"儒林外史","quote":"虽云长篇，颇同短制。——鲁迅《中国小说史略》","note":"鲁迅此评恰道出《儒林外史》无贯穿全书之中心人物事件、由众多人物的行状片断连缀而成的独特结构，袁版即据此论其「编年与纪传结合、兼具短篇之灵活与长篇之宏阔」。"}]},{"id":"431","title":"试分析《儒林外史》的叙事艺术（26浙江大学）","examples":[{"ref":"第四卷 第八编 第七章","ref_text":"吴敬梓与《儒林外史》","anchor":"儒林外史","quote":"严监生喉咙里痰响得一进一出，一声不倒一声的，总不得断气，还把手从被单里拿出来，伸着两个指头。——《儒林外史》第五回（严监生临终挑灯草）","note":"袁版评《儒林外史》叙事善以第三身隐身人客观白描，「不复有人物评述而是让言行自呈」；严监生临死伸两指这一白描细节即其「以客观细节传神、不着一字褒贬」叙事艺术的代表性例证。"}]},{"id":"432","title":"试论《聊斋志异》与《儒林外史》对科举制度批判的异同","examples":[{"ref":"第四卷 第八编 第七章","ref_text":"吴敬梓与《儒林外史》","anchor":"儒林外史","quote":"范进中举……两个报人扶住，拍着门扇大喊：「中了，中了！」范进把两手拍了一下，笑了一声道：噫！好了！我中了。——《儒林外史》第三回（范进中举）","note":"范进中举发疯的详尽白描，正是吴敬梓对八股科举制度批判、揭露其「把读书人弄得发疯发痴」的代表情节；与《聊斋志异》借鬼魂（《叶生》《于去恶》）的浪漫讽喻相对照，可见袁版所论二者「前者偏向写实批判、后者偏向幻想悲愤」之别。"}]},{"id":"433","title":"试论述《儒林外史》两组对立人物及其意义","examples":[{"ref":"第四卷 第八编 第七章","ref_text":"吴敬梓与《儒林外史》","anchor":"王冕","quote":"外史记儒林，刻画何工妍。——程晋芳《怀人诗》","note":"王冕居楔子之首，淡泊功名、自重名节，寄寓吴敬梓对知识分子理想人格的寄托；程晋芳诗句称其「刻画工妍」，可佐证袁版所论书中以王冕等真名士与群丑相对照、正反两组人物分别承载批判与理想的用意。"}]},{"id":"434","title":"试论述《儒林外史》的讽刺艺术特色","examples":[{"ref":"第四卷 第八编 第七章","ref_text":"吴敬梓与《儒林外史》","anchor":"儒林外史","quote":"秉持公心，指擿时弊……戚而能谐，婉而多讽。——鲁迅《中国小说史略》","note":"袁版引鲁迅「戚而能谐，婉而多讽」以定《儒林外史》讽刺之性格：非剑拔弩张而是委婉深沉的含蓄讽刺，写实、夸张、矛盾对照诸法皆统于此，故成中国古代讽刺小说典范。"}]},{"id":"438","title":"试分析《红楼梦》的悲剧意蕴（25南昌大学、26东南大学）","examples":[{"ref":"第四卷 第八编 第八章","ref_text":"曹雪芹与《红楼梦》","anchor":"红楼梦","quote":"好一似食尽鸟投林，落了片白茫茫大地真干净。——《红楼梦》第五回〔飞鸟各投林〕","note":"〔飞鸟各投林〕以「白茫茫大地真干净」总束贾府家败、青春毁灭、爱情落空的多重悲剧，正是袁版所称《红楼梦》由盛而衰、色空梦幻之悲剧意蕴的主题曲。"}]},{"id":"442","title":"王熙凤性格的多面性（河南大学）","examples":[{"ref":"第四卷 第八编 第八章","ref_text":"曹雪芹与《红楼梦》","anchor":"王熙凤","quote":"嘴甜心苦，两面三刀；上头笑，脚底下使绊子；明是一盆火，暗是一把刀；她都占全了。——《红楼梦》第六十五回（兴儿语）","note":"小厮兴儿这段评价概括了王熙凤八面玲珑与心狠手辣并存的矛盾性格，正印证袁版所论其「治家干才与营私蛀虫」二位一体的圆型形象，是《红楼梦》打破脸谱化、写活人物的代表作。"}]},{"id":"443","title":"论述《红楼梦》在人物塑造上的艺术成就","examples":[{"ref":"第四卷 第八编 第八章","ref_text":"曹雪芹与《红楼梦》","anchor":"红楼梦","quote":"满纸荒唐言，一把辛酸泪！都云作者痴，谁解其中味？——曹雪芹《红楼梦》第一回自题诗","note":"作者自道以血泪写人物之真相，正呼应袁版所论《红楼梦》人物塑造「注重真实性、打破历来小说窠臼」，写出现实中真切的人而非善恶类型之化身。"}]},{"id":"444","title":"试分析《红楼梦》的叙事艺术（26云南大学）","examples":[{"ref":"第四卷 第八编 第八章","ref_text":"曹雪芹与《红楼梦》","anchor":"红楼梦","quote":"假作真时真亦假，无为有处有还无。——《红楼梦》太虚幻境对联","note":"这副对联与石头神话、宝黛情缘相表里，笼罩全书的写实与诗化、多线网状结构与象征笔法，正合袁版所论《红楼梦》「写实与诗化相融、摆脱说书体单线而创网状结构」的叙事艺术。"}]},{"id":"445","title":"试论《三国志演义》与《红楼梦》在叙事艺术上的不同（26南开大学）","examples":[{"ref":"第四卷 第八编 第八章","ref_text":"曹雪芹与《红楼梦》","anchor":"红楼梦","quote":"假作真时真亦假，无为有处有还无。——《红楼梦》太虚幻境对联","note":"《三国志演义》以全知视角、线性时序、浅近文言铺陈帝王将相兴亡；《红楼梦》则以限知视角、网状结构、纯熟白话语体写日常人情，太虚幻境对联的含蓄象征正体现后者写实而诗化、意蕴朦胧的雅化叙事。"}]},{"id":"446","title":"试分析《红楼梦》的地位与影响","examples":[{"ref":"第四卷 第八编 第八章","ref_text":"曹雪芹与《红楼梦》","anchor":"红楼梦","quote":"满纸荒唐言，一把辛酸泪！都云作者痴，谁解其中味？——曹雪芹《红楼梦》第一回自题诗","note":"曹雪芹以亲历之血泪写家族与个人之悲剧，其自传性的如实描写滋养了后世新文学；袁版称《红楼梦》为「中国文学古今演变之里程碑」，此自题诗即其悲剧内涵与真挚自叙传统之源。"}]},{"id":"447","title":"试论述《西厢记》《牡丹亭》与《红楼梦》在处理爱情题材上的不同","examples":[{"ref":"第四卷 第七编 第七章","ref_text":"汤显祖与《牡丹亭》","anchor":"牡丹亭","quote":"情不知所起，一往而深。生者可以死，死可以生。——汤显祖《牡丹亭·题词》","note":"汤显祖标举「至情」，杜丽娘为情而死复因情而生，仍以「生者可以死死可以生」之浪漫实现理想；与《红楼梦》宝黛以相知相爱而终究「一个为情而死、一个遁入空门」的真实悲剧相较，可见袁版所论爱情题材处理由理想化走向社会悲剧之演进。"},{"ref":"第四卷 第八编 第八章","ref_text":"曹雪芹与《红楼梦》","anchor":"红楼梦","quote":"纵然是齐眉举案，到底意难平。——《红楼梦》第五回〔终身误〕","note":"〔终身误〕写宝钗虽与宝玉成就「金玉良缘」，终究只是「意难平」的无爱婚姻；曹雪芹以大团圆之打破赋予爱情以深切的社会人生内涵，正呼应袁版对《西厢》《牡丹亭》圆满结局到《红楼梦》悲剧结局转变的论述。"}]},{"id":"450","title":"试分析中国古代小说与中国古代戏曲的关系（26北京大学）","examples":[{"ref":"第四卷 第八编 第八章","ref_text":"清代文学·小说与戏曲源流（曹雪芹与《红楼梦》）","anchor":"传奇","quote":"凡变异之谈，盛于六朝，然多是传录舛讹，未必尽幻设语。至唐人乃作意好奇，假小说以寄笔端。——明·胡应麟《少室山房笔丛》","note":"胡应麟指出唐人传奇「作意好奇、假小说以寄笔端」的自觉虚构精神，正是袁版论古代小说与戏曲共同受「史传—传奇—说话」三重积淀滋养之关键一环，传奇之想象与情节遂成为二者异派同源的重要结晶。"}]},{"id":"452","title":"试述桐城派散文主张与艺术特征","examples":[{"ref":"第四卷 第八编 第三章","ref_text":"清初散文与桐城派","anchor":"方苞","quote":"义即《易》之所谓「言有物」也；法即《易》之所谓「言有序」也。义以为经而法纬之，然后为成体之文。——方苞《又书货殖传后》","note":"方苞以「言有物」「言有序」释「义法」，主张义决定法、法体现义，使古文合于六经之道统，正是袁版所述桐城派立派纲领与「雅洁」「清真」文风的理论根基。"},{"ref":"第四卷 第八编 第三章","ref_text":"清初散文与桐城派","anchor":"姚鼐","quote":"余尝论学问之事，有三端焉：曰义理也，考证也，文章也。——姚鼐《述庵文钞序》","note":"姚鼐「义理、考证、文章三端不可偏废」之说，调和宋学汉学之争并兼重文辞，是袁版所论桐城派理论至姚鼐而集大成、兼综义理考据辞章的代表主张。"}]},{"id":"46","title":"谈谈《史记》的叙事艺术","examples":[{"ref":"第一卷 第二编 第三章","ref_text":"司马迁与《史记》","anchor":"究天人之际","quote":"亦欲以究天人之际，通古今之变，成一家之言。（司马迁《报任安书》）","note":"袁版指出《史记》的首要成就是其纪传体通史结构框架，本句正是司马迁自述其修史宗旨，呼应袁版所谓'究天人之际、通古今之变'贯穿全书的叙事设计。"}]},{"id":"48","title":"《史记》人物刻画的特色","examples":[{"ref":"第一卷 第二编 第三章","ref_text":"司马迁与《史记》","anchor":"蔺相如","quote":"廉颇闻之，肉袒负荆，因宾客至蔺相如门谢罪。曰：“鄙贱之人，不知将军宽之至此也。”（《史记·廉颇蔺相如列传》）","note":"袁版以'负荆请罪·将相和'为例说明《史记》通过矛盾冲突、具体言行写人，使人物在尖锐对立中个性凸显，正是'共性与个性统一'的典型例证。"}]},{"id":"49","title":"《史记》的风格特征","examples":[{"ref":"第一卷 第二编 第三章","ref_text":"司马迁与《史记》","anchor":"雄深雅健","quote":"然自刘向、扬雄博极群书，皆称迁有良史之才，服其善序事理，辨而不华，质而不俚，其文直，其事核，不虚美，不隐恶，故谓之实录。（班固《汉书·司马迁传赞》）","note":"袁版归纳《史记》'雄深雅健'的风格特征，班固'其文直、其事核、辨而不华、质而不俚'之评正可印证其雅健庄重、谨严有法的一面。"}]},{"id":"50","title":"谈谈《史记》的悲剧性","examples":[{"ref":"第一卷 第二编 第三章","ref_text":"司马迁与《史记》","anchor":"项羽","quote":"自矜功伐，奋其私智而不师古，谓霸王之业，欲以力征经营天下，五年卒亡其国。身死东城，尚不觉寤而不自责，过矣。乃引“天亡我，非用兵之罪也”，岂不谬哉！（《史记·项羽本纪》'太史公曰'）","note":"袁版以项羽为'缺失型悲剧英雄'的典型，本段论定其败亡源于自身性格弱点的致命失误，体现《史记》对悲剧人物命运根因的深沉探求。"}]},{"id":"51","title":"论述《史记》对中国文学的影响（25华东师范大学）","examples":[{"ref":"第一卷 第二编 第三章","ref_text":"司马迁与《史记》","anchor":"纪传体","quote":"网罗天下放失旧闻，略考其行事，综其终始，稽其成败兴坏之理，上计轩辕，下至于兹，为十表、本纪十二、书八、世家三十、列传七十，凡百三十篇。（司马迁《报任安书》）","note":"袁版开篇即称《史记》为'纪传体史学的奠基之作、传记文学的开端'，此句自述其创立的纪传体通史构架，正是其对后世影响深远的总根源。"}]},{"id":"52","title":"谈谈《汉书》与《史记》的差别","examples":[{"ref":"第一卷 第二编 第四章","ref_text":"班固《汉书》","anchor":"苏武","quote":"武既至海上，廪食不至，掘野鼠去草实而食之。杖汉节牧羊，卧起操持，节旄尽落。（《汉书·李广苏建传》）","note":"袁版指出《汉书》精华在于对西汉盛世人物（含李陵、苏武）的生动记叙，本段状苏武牧羊之细节，正体现《汉书》行文谨严、记叙翔实的笔法。"}]},{"id":"53","title":"结合作品论述“君子曰”“太史公曰”在早期史传散文中的作用（26北京大学）","examples":[{"ref":"第一卷 第二编 第三章","ref_text":"司马迁与《史记》","anchor":"桃李不言，下自成蹊","quote":"《传》曰：“其身正，不令而行；其身不正，虽令不从。”其李将军之谓也？余睹李将军悛悛如鄙人，口不能道辞；及死之日，天下知与不知，皆为尽哀。……谚曰：“桃李不言，下自成蹊。”此言虽小，可以喻大也。（《史记·李将军列传》'太史公曰'）","note":"袁版将『太史公曰』的'论赞'视为史家借议论抒情（补叙事义、评人物）的典范手法，本段正是太史公借赞语宣泄对李广的敬意与悲慨。"}]},{"id":"54","title":"简述汉代辞赋的体裁、特点与其兴盛原因","examples":[{"ref":"第一卷 第二编 第二章","ref_text":"汉赋","anchor":"铺采摛文","quote":"赋者，铺也，铺采摛文，体物写志也。（刘勰《文心雕龙·诠赋》）","note":"袁版依《文心雕龙·诠赋》界定赋体'铺采摛文、体物写志'的特征，可用以说明散体大赋铺陈夸饰、韵散结合的体裁特点及其兴盛之由。"}]},{"id":"63","title":"汉赋的产生发展及演变过程","examples":[{"ref":"第一卷 第二编 第二章","ref_text":"汉赋","anchor":"铺采摛文","quote":"赋者，铺也，铺采摛文，体物写志也。（刘勰《文心雕龙·诠赋》）","note":"袁版论汉赋演变首标此'铺采摛文、体物写志'之义，正可印证赋体由《诗》六义之'赋'演为独立文体的过程。"},{"ref":"第一卷 第二编 第二章","ref_text":"汉赋","anchor":"屈原","quote":"屈原既死之后，楚有宋玉、唐勒、景差之徒者，皆好辞而以赋见称。（《史记·屈原列传》）","note":"袁版称屈原作品直接影响汉赋、其门徒已完成由辞到赋的转变，此句为这一演变提供了直接的史载依据。"}]},{"id":"64","title":"“乐府”概念是如何演变的","examples":[{"ref":"第一卷 第二编 第五章","ref_text":"汉乐府民歌","anchor":"乐府","quote":"自孝武立乐府而采歌谣，于是有代、赵之讴，秦、楚之风。皆感于哀乐，缘事而发。（班固《汉书·艺文志》）","note":"袁版论乐府之由音乐机关演为诗体，此见《汉书·艺文志》对'孝武立乐府而采歌谣'的记载，是把握'乐府'初义（机关名）的根本史料。"},{"ref":"第一卷 第二编 第五章","ref_text":"汉乐府民歌","anchor":"声依永，律和声","quote":"乐府者，声依永，律和声也。（刘勰《文心雕龙·乐府》）","note":"袁版据刘勰此说指明六朝时'乐府'已由机关名变成一种带音乐性的诗体名称，正是其概念演变的关键节点。"}]},{"id":"67","title":"《古诗十九首》的主要内容及思想内涵","examples":[{"ref":"第一卷 第二编 第六章","ref_text":"《古诗十九首》及东汉文人诗","anchor":"行行重行行","quote":"行行重行行，与君生别离。相去万余里，各在天一涯。（《古诗十九首·行行重行行》）","note":"袁版将游子羁旅、思妇闺愁并列为此组诗的基本内容，本首'行行重行行、与君生别离'正是思妇盼归之情的典型开篇。"},{"ref":"第一卷 第二编 第六章","ref_text":"《古诗十九首》及东汉文人诗","anchor":"涉江采芙蓉","quote":"涉江采芙蓉，兰泽多芳草。采之欲遗谁？所思在远道。（《古诗十九首·涉江采芙蓉》）","note":"袁版引《涉江采芙蓉》'还顾望旧乡'以证游子思乡之情，此处全诗起句展现托物言情、以远方相忆为念的典型书写。"}]},{"id":"68","title":"《古诗十九首》的艺术特征（25湖南师范大学、26山东大学）","examples":[{"ref":"第一卷 第二编 第六章","ref_text":"《古诗十九首》及东汉文人诗","anchor":"五言之冠冕","quote":"观其结体散文，直而不野，婉转附物，怊怅切情，实五言之冠冕也。（刘勰《文心雕龙·明诗》）","note":"袁版以刘勰此评总括《古诗十九首》的艺术成就，'直而不野、婉转附物'正可论证其长于抒情而委曲含蓄的手法。"},{"ref":"第一卷 第二编 第六章","ref_text":"《古诗十九首》及东汉文人诗","anchor":"一字千金","quote":"惊心动魄，可谓几乎一字千金。（钟嵘《诗品》卷上）","note":"袁版论《古诗十九首》语言炉火纯青时引钟嵘此评，印证其用语明白晓畅却高度凝练、意在言外的语言艺术。"}]},{"id":"458","title":"论述近代文学的发展特点","examples":[{"ref":"第四卷 第九编 第一章","ref_text":"龚自珍与近代前期诗歌","anchor":"龚自珍","quote":"九州生气恃风雷，万马齐喑究可哀。我劝天公重抖擞，不拘一格降人才。","note":"龚自珍《己亥杂诗》此首以“风雷”喻变革之利器，痛陈“万马齐喑”之衰世窒息人才，呼唤“不拘一格”之人材降世，正是近代文学生不逢时的政治批判与救亡呐喊的开端；袁版以龚自珍“开创了近代文学的新世纪”，此诗即文学政治性、战斗性加强且初现浪漫主义新声的最有力注脚。"},{"ref":"第四卷 第九编 第二章","ref_text":"诗界革命（黄遵宪）","anchor":"黄遵宪","quote":"我手写我口，古岂能拘牵？","note":"黄遵宪《杂感》破旧立新之宣言，“我手写我口”号为“诗界革命”纲领，恰与题干所论近代文学“形式、语言乃至风格趋向通俗化”及“突破旧形式”的特点相印证，是近代文人求新变、为“五四”新文学预伏“文学革命先声”的关键证据。"}]},{"id":"127","title":"试述唐代文人的整体特征","examples":[{"ref":"第二卷 第四编","ref_text":"隋唐五代文学——唐代文人概述","anchor":"安社稷","quote":"致君尧舜上，再使风俗淳。——杜甫《奉赠韦左丞丈二十二韵》","note":"唐代文人“自觉地干预政治”，以济苍生、安社稷为任，杜甫“致君尧舜上”尤为典型，正呼应袁版对唐代文人经世精神的定位。"}]},{"id":"129","title":"试述唐代文学在中国文学史上的成就与影响","examples":[{"ref":"第二卷 第四编","ref_text":"盛唐诗——李白（第四编第四章及全编概述）","anchor":"盛唐气象","quote":"君不见黄河之水天上来，奔流到海不复回。——李白《将进酒》","note":"唐诗造就“盛唐气象”这一审美典范，李白诗奔涌的激情正是其昂扬开放风神的最直接印记。"},{"ref":"第二卷 第四编 第十一章","ref_text":"唐传奇","anchor":"唐传奇","quote":"待月西厢下，迎风户半开。——元稹《莺莺传》","note":"唐传奇“文言小说的成熟，始有意为小说”，元稹《莺莺传》以诗入文、委曲传情的写法，正见其一变志怪粗陈梗概的面貌。"}]},{"id":"133","title":"简述“初唐四杰”的诗歌创作特征与诗学贡献","examples":[{"ref":"第二卷 第四编 第一章","ref_text":"隋代文学与初唐诗坛（初唐四杰）","anchor":"王勃","quote":"落霞与孤鹜齐飞，秋水共长天一色。——王勃《滕王阁序》","note":"四杰以才子高情推动初唐诗歌从台阁走向江山塞漠，王勃此联气象壮阔、骈散兼融，正是四杰刚健骨气与壮思的体现。"}]},{"id":"139","title":"谈谈你对于“盛唐气象”的认识","examples":[{"ref":"第二卷 第四编","ref_text":"盛唐诗（盛唐气象）","anchor":"严羽","quote":"盛唐诸人惟在兴趣，羚羊挂角，无迹可求。——严羽《沧浪诗话·诗辨》","note":"“盛唐气象”一名源于严羽《沧浪诗话》对盛唐诗“兴趣”“气象浑厚”的概括，此语即其张本，印证袁版对盛唐诗风雄浑朦胧的定位。"}]},{"id":"142","title":"试分析王维山水田园诗“诗中有画”的艺术特色","examples":[{"ref":"第二卷 第四编 第二章","ref_text":"盛唐山水田园诗人（王维）","anchor":"大漠孤烟直","quote":"大漠孤烟直，长河落日圆。——王维《使至塞上》","note":"此联以线条与构图为诗，点染大漠落日，正是王维以画入诗、构图空灵而富于图画美的代表。"},{"ref":"第二卷 第四编 第二章","ref_text":"盛唐山水田园诗人（王维）","anchor":"明月松间照","quote":"明月松间照，清泉石上流。——王维《山居秋暝》","note":"光色相映、虚实相间，王维以“有声画”营造秋暝意境，正是其“诗中有画”与绘声绘色艺术特色的具体呈现。"}]},{"id":"143","title":"简述王维山水田园诗的艺术特色","examples":[{"ref":"第二卷 第四编 第二章","ref_text":"盛唐山水田园诗人（王维）","anchor":"诗中有画","quote":"味摩诘之诗，诗中有画；观摩诘之画，画中有诗。——苏轼《书摩诘蓝田烟雨图》","note":"苏轼此评是“诗中有画”的出处，王维静逸明秀的山水诗境恰与之相印证。"},{"ref":"第二卷 第四编 第二章","ref_text":"盛唐山水田园诗人（王维·诗渗禅意）","anchor":"无念","quote":"行到水穷处，坐看云起时。——王维《终南别业》","note":"王维以禅入诗、追求“无念”之境，此联随遇而安、物我相忘，正是其诗渗禅意、流动空灵的表征。"}]},{"id":"144","title":"试分析陶渊明与王维山水田园诗创作的异同","examples":[{"ref":"第二卷 第四编 第二章（并及第二卷第三编第四章陶渊明）","ref_text":"陶渊明与王维山水田园诗之比较","anchor":"陶渊明","quote":"采菊东篱下，悠然见南山。——陶渊明《饮酒·其五》","note":"陶渊明安贫乐道、物我浑融，此句写意的平淡自然，正是其田园诗的整体自然美，与王维的禅趣形成对照。"},{"ref":"第二卷 第四编 第二章","ref_text":"盛唐山水田园诗人（王维）","anchor":"王维","quote":"明月松间照，清泉石上流。——王维《山居秋暝》","note":"王维注重诗画合一与禅趣之表现，此联以画入诗、饶有禅味，正见其与陶渊明在诗意与手法上的差异。"}]},{"id":"149","title":"试分析盛唐边塞诗繁荣的原因及主要特征","examples":[{"ref":"第二卷 第四编 第三章","ref_text":"盛唐边塞诗人（高适、岑参等）","anchor":"边塞","quote":"忽如一夜春风来，千树万树梨花开。——岑参《白雪歌送武判官归京》","note":"盛唐边塞诗以瑰奇的塞外壮景写慷慨报国之气，岑参此喻化苦寒为奇丽，正是其雄浑壮美境界的代表。"}]},{"id":"152","title":"试分析岑参边塞诗的思想艺术特征","examples":[{"ref":"第二卷 第四编 第三章","ref_text":"盛唐边塞诗人（岑参）","anchor":"岑参","quote":"忽如一夜春风来，千树万树梨花开。——岑参《白雪歌送武判官归京》","note":"岑参以雄奇瑰丽的笔触写西北奇景、昂扬乐观，此喻正是其边塞诗“新奇峭丽”风格的标志。"},{"ref":"第二卷 第四编 第三章","ref_text":"盛唐边塞诗人（岑参）","anchor":"新奇峭丽","quote":"君不见走马川行雪海边，平沙莽莽黄入天。——岑参《走马川行奉送封大夫出师西征》","note":"岑参善于艺术夸张与浓墨着色，将艰苦出师写得惊心动魄、瑰奇壮丽，正体现边塞题材的极大开拓。"}]},{"id":"154","title":"试分析李白诗歌的思想内容","examples":[{"ref":"第二卷 第四编 第四章","ref_text":"李白","anchor":"李白","quote":"君不见黄河之水天上来，奔流到海不复回。君不见高堂明镜悲白发，朝如青丝暮成雪。——李白《将进酒》","note":"此篇交织自信与悲慨、亢奋与颓放，正见李白诗歌自信与绝望并存的复杂思想矛盾。"},{"ref":"第二卷 第四编 第四章","ref_text":"李白","anchor":"蔑视富贵","quote":"安能摧眉折腰事权贵，使我不得开心颜。——李白《梦游天姥吟留别》","note":"李白蔑视富贵、傲睨权贵，此句为其不曲意逢迎个性的典型宣示，体现其叛逆抗争精神。"}]},{"id":"155","title":"试分析李白诗歌的创作特征","examples":[{"ref":"第二卷 第四编 第四章","ref_text":"李白","anchor":"清水出芙蓉","quote":"清水出芙蓉，天然去雕饰。——李白《经乱离后天恩流夜郎忆旧游书怀赠江夏韦太守良宰》","note":"李白自道其语言清新明快、天然脱饰之美，与袁版对李白诗色调明丽、清新自然的定位相印证。"},{"ref":"第二卷 第四编 第四章","ref_text":"李白","anchor":"想象","quote":"蜀道之难，难于上青天。——李白《蜀道难》","note":"李白诗想象天马行空、极尽夸张，此句即为壮伟意象与无穷气势的典型。"}]},{"id":"156","title":"结合具体作品说明李白诗歌类型“众体兼具”的特点（天津师范大学）","examples":[{"ref":"第二卷 第四编 第四章","ref_text":"李白（古题乐府）","anchor":"将进酒","quote":"君不见黄河之水天上来，奔流到海不复回。——李白《将进酒》","note":"《将进酒》为乐府鼓吹古题，李白借旧题抒真情、张扬个性，是古题乐府创新的代表作。"},{"ref":"第二卷 第四编 第四章","ref_text":"李白（律诗）","anchor":"登金陵凤凰台","quote":"三山半落青天外，二水中分白鹭洲。——李白《登金陵凤凰台》","note":"李白七律虽少而极工，此联写景构图精妙、对仗工整自然，见其众体兼具中律体之成就。"}]},{"id":"157","title":"简述李白乐府诗的特点","examples":[{"ref":"第二卷 第四编 第四章","ref_text":"李白（乐府诗）","anchor":"蜀道难","quote":"蜀道之难，难于上青天。——李白《蜀道难》","note":"李白大量沿用乐府古题而自出新意、《蜀道难》行云流水、气势奔泻，体现其在古题乐府上的卓绝创造。"},{"ref":"第二卷 第四编 第四章","ref_text":"李白（乐府诗·借古题写现事）","anchor":"侠客行","quote":"十步杀一人，千里不留行。——李白《侠客行》","note":"《侠客行》借古题写侠士豪情、具时代精神，正见李白乐府借古题写现事、抒己怀的个性特色。"}]},{"id":"158","title":"试分析李白绝句的特点","examples":[{"ref":"第二卷 第四编 第四章","ref_text":"李白（绝句）","anchor":"静夜思","quote":"床前明月光，疑是地上霜。举头望明月，低头思故乡。——李白《静夜思》","note":"《静夜思》清新纯朴、纯赖兴会，是李白绝句受乐府民歌影响、清新自然最高的代表。"},{"ref":"第二卷 第四编 第四章","ref_text":"李白（绝句）","anchor":"清水出芙蓉","quote":"清水出芙蓉，天然去雕饰。——李白《经乱离后天恩流夜郎……》","note":"“清水出芙蓉，天然去雕饰”集中概括了李白绝句自然天成、清新明快之美。"}]},{"id":"159","title":"试分析李白的歌行体诗歌的创作特点（26中央财经大学）","examples":[{"ref":"第二卷 第四编 第四章","ref_text":"李白（歌行）","anchor":"梦游天姥吟留别","quote":"安能摧眉折腰事权贵，使我不得开心颜。——李白《梦游天姥吟留别》","note":"李白歌行打破一切固有格式、任随性情抒写，此联壮伟而豪迈，最能体现歌行的主体性与豪迈飘逸风貌。"}]},{"id":"163","title":"杜甫“诗圣”“诗史”的称呼你怎么理解。（25北京外国语大学）","examples":[{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（诗圣、诗史）","anchor":"诗史","quote":"上薄风骚，下该沈宋，尽得古今之体势，而兼人人之所独专矣。——元稹《唐故工部员外郎杜君墓系铭》","note":"元稹此言谓杜诗集大成、诗备众体，正为杜甫称“诗圣”张本，也是“诗史”足以为史的开端。"},{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（诗史·忧国忧民）","anchor":"忧国忧民","quote":"朱门酒肉臭，路有冻死骨。——杜甫《自京赴奉先县咏怀五百字》","note":"杜甫忧国忧民、以诗为史，此句揭露贫富悬殊的社会矛盾，正是其诗成为唐代由盛而衰之“诗史”的症结。"}]},{"id":"164","title":"试论述杜甫叙事诗的特点","examples":[{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（叙事诗）","anchor":"朱门酒肉臭","quote":"朱门酒肉臭，路有冻死骨。——杜甫《自京赴奉先县咏怀五百字》","note":"此句以典型化的手法高度概括贫富对立，是杜甫叙事诗典型化艺术最有力的注脚。"},{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（叙事诗）","anchor":"兵车行","quote":"车辚辚，马萧萧，行人弓箭各在腰。——杜甫《兵车行》","note":"《兵车行》客观叙写征丁之苦、寓主观于客观，见杜甫叙事诗对现实的客观描写与语言的个性化。"}]},{"id":"165","title":"试论述杜甫律诗创作的成就（26首都师范大学）","examples":[{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（律诗）","anchor":"秋兴八首","quote":"玉露凋伤枫树林，巫山巫峡气萧森。——杜甫《秋兴八首·其一》","note":"《秋兴八首》以律诗写组诗、浑融蓄深，正是杜甫把七律推向成熟、开拓律诗表现力的巅峰之作。"},{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（律诗）","anchor":"闻官军收河南河北","quote":"剑外忽传收蓟北，初闻涕泪满衣裳。——杜甫《闻官军收河南河北》","note":"此诗合律而不受声律束缚、对仗工整而不觉其迹，是杜甫律诗浑融境界与严谨中求变化的代表。"}]},{"id":"166","title":"试分析杜甫“沉郁顿挫”的诗风","examples":[{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（沉郁顿挫）","anchor":"沉郁顿挫","quote":"无边落木萧萧下，不尽长江滚滚来。万里悲秋常作客，百年多病独登台。——杜甫《登高》","note":"《登高》时空并驭、境界阔大而情思沉郁，是杜诗“沉郁”（忧愤深广）的典型，亦见其时空意象沉雄。"},{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（顿挫·批判现实）","anchor":"致君尧舜上","quote":"致君尧舜上，再使风俗淳。——杜甫《奉赠韦左丞丈二十二韵》","note":"杜甫以“致君尧舜上”为政治理想而一生批判现实、抑折其辞，正是“顿挫”在内容上的表现。"}]},{"id":"168","title":"试分析杜甫诗歌的艺术特征","examples":[{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（集大成）","anchor":"集大成","quote":"尽得古今之体势，而兼人人之所独专矣。——元稹《唐故工部员外郎杜君墓系铭》","note":"元稹评杜诗“尽得古今之体势”，正是杜诗荟萃前人而集大成的定位，回应本题“集大成”一特征。"},{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（沉郁顿挫）","anchor":"沉郁顿挫","quote":"无边落木萧萧下，不尽长江滚滚来。——杜甫《登高》","note":"《登高》壮阔而深沉的境界，正是杜甫“沉郁顿挫”主导风格的表现。"}]},{"id":"169","title":"试分析杜甫在文学史上的影响","examples":[{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（新题乐府）","anchor":"新题乐府","quote":"车辚辚，马萧萧，行人弓箭各在腰。——杜甫《兵车行》","note":"杜甫本着汉乐府“缘事而发”精神自创新题乐府，为后代诗人指出通向现实创作的道路，《兵车行》即为范例。"}]},{"id":"170","title":"试比较李白和杜甫诗歌的区别","examples":[{"ref":"第二卷 第四编 第四章","ref_text":"李白（浪漫主义）","anchor":"诗仙","quote":"君不见黄河之水天上来，奔流到海不复回。——李白《将进酒》","note":"李白被称“诗仙”，此句奔放飘逸，正是其浪漫主义、飘逸俊美主导风格的典型。"},{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（现实主义）","anchor":"诗圣","quote":"感时花溅泪，恨别鸟惊心。——杜甫《春望》","note":"杜甫被称“诗圣”，此句感时伤事、沉郁顿挫，正是其现实主义写实意象与忧国情怀的体现。"}]},{"id":"190","title":"试分析白居易《新乐府》创作的得与失（25延安大学）","examples":[{"ref":"第二卷 第四编 第八章","ref_text":"元白诗派与新乐府（白居易）","anchor":"卖炭翁","quote":"卖炭翁，伐薪烧炭南山中。满面尘灰烟火色，两鬓苍苍十指黑。——白居易《卖炭翁》","note":"《卖炭翁》一篇专咏一事、通俗写实，是《新乐府》在题材与语言上之“得”的代表。"},{"ref":"第二卷 第四编 第八章","ref_text":"元白诗派与新乐府（白居易）","anchor":"卒章显其志","quote":"首句标其目，卒章显其志。——白居易《新乐府序》","note":"“卒章显其志”本是新乐府纲领，但因欲明志常以议论尾巴损害艺术性，正是《新乐府》之“失”所在。"}]},{"id":"192","title":"白居易的讽谕诗有何特色","examples":[{"ref":"第二卷 第四编 第八章","ref_text":"元白诗派与新乐府（白居易讽谕诗）","anchor":"秦中吟","quote":"是岁江南旱，衢州人食人。——白居易《轻肥》（《秦中吟》其十）","note":"《秦中吟》等直陈时弊、揭露达官腐化与民生疾苦，是白居易讽谕诗深刻反映现实的代表。"},{"ref":"第二卷 第四编 第八章","ref_text":"元白诗派与新乐府（白居易讽谕诗）","anchor":"卒章显志","quote":"可怜身上衣正单，心忧炭贱愿天寒。——白居易《卖炭翁》","note":"此句由细微心理托出老翁之悲苦，见白居易讽谕诗主题集中、人物高度典型化，亦体现其卒章显志的议论手法。"}]},{"id":"197","title":"试述韩愈、柳宗元的古文理论","examples":[{"ref":"第二卷 第四编 第十章","ref_text":"唐代古文运动（韩愈、柳宗元）","anchor":"文以明道","quote":"博爱之谓仁，行而宜之之谓义，由是而之焉之谓道。——韩愈《原道》","note":"“文以明道”是韩柳古文理论的核心，韩愈以仁义为道之内容，此文即其明道主张的经典表述。"},{"ref":"第二卷 第四编 第十章","ref_text":"唐代古文运动（韩愈）","anchor":"词必己出","quote":"惟古于词必己出，降而不能乃剽贼。——韩愈《南阳樊绍述墓志铭》","note":"“词必己出”呼应古文理论“贵在创新”，韩愈主张复古而能变古，正见其超越前人之处。"}]},{"id":"198","title":"韩愈、柳宗元在散体文创作上的开拓","examples":[{"ref":"第二卷 第四编 第十章","ref_text":"唐代古文运动（韩愈）","anchor":"去陈言","quote":"当其取于心而注于手也，惟陈言之务去。——韩愈《答李翊书》","note":"韩愈力倡“去陈言”而“文从字顺”，于散文语言上自铸新词，是其建立新的散文美学规范的关键。"},{"ref":"第二卷 第四编 第十章","ref_text":"唐代古文运动（韩愈）","anchor":"文从字顺","quote":"文从字顺，各识其职。——韩愈《南阳樊绍述墓志铭》","note":"韩文奇崛排奡而复归于文从字顺，正见其在散体文语言技巧上的极大开拓。"}]},{"id":"200","title":"试分析韩愈散文的艺术成就","examples":[{"ref":"第二卷 第四编 第十章","ref_text":"唐代古文运动（韩愈）","anchor":"词必己出","quote":"当其取于心而注于手也，惟陈言之务去。——韩愈《答李翊书》","note":"韩愈论文极重语言，“陈言务去”在创作中得以实践，是其词语创新的基准。"},{"ref":"第二卷 第四编 第十章","ref_text":"唐代古文运动（韩愈）","anchor":"文从字顺","quote":"文从字顺，各识其职。——韩愈《南阳樊绍述墓志铭》","note":"韩文气势磅礴、奇崛排奡而与文从字顺统一，此正是其风格上“奇崛与文从字顺”并臻的体现。"}]},{"id":"201","title":"秦观说：“杜氏、韩氏，亦集诗文之大成者欤”，谈谈你的看法（山西大学）","examples":[{"ref":"第二卷 第四编（杜甫、韩愈）","ref_text":"杜甫诗与韩愈文的集大成","anchor":"集大成","quote":"杜氏、韩氏，亦集诗文之大成者欤。——秦观《进论·韩愈论》","note":"秦观评杜甫、韩愈为诗文“集大成”，与袁版对二家荟萃前人而开后世之定位正相呼应。"},{"ref":"第二卷 第四编 第五章","ref_text":"杜甫（集大成）","anchor":"杜甫","quote":"尽得古今之体势，而兼人人之所独专矣。——元稹《唐故工部员外郎杜君墓系铭》","note":"元稹“尽得古今之体势”即杜诗集大成之确证，可见秦观之评实有本而来。"}]},{"id":"202","title":"试分析柳宗元散文的类型与成就","examples":[{"ref":"第二卷 第四编 第十章","ref_text":"唐代古文运动（柳宗元寓言文）","anchor":"三戒","quote":"黔无驴，有好事者船载以入。至则无可用，放之山下。——柳宗元《黔之驴》（《三戒》之一）","note":"柳宗元寓言假物为说、讽政刺世，《黔之驴》短小精悍而富有哲理性，是其将先秦寓言重大发展的代表。"},{"ref":"第二卷 第四编 第十章","ref_text":"唐代古文运动（柳宗元山水游记）","anchor":"山水游记","quote":"潭中鱼可百许头，皆若空游无所依。——柳宗元《小石潭记》","note":"柳宗元山水游记冷峭蕴趣、凄神寒骨，《小石潭记》正开创了描写自然美的游记散文新局面。"}]},{"id":"205","title":"试分析唐传奇的创作特征","examples":[{"ref":"第二卷 第四编 第十一章","ref_text":"唐传奇","anchor":"莺莺传","quote":"待月西厢下，迎风户半开。拂墙花影动，疑是玉人来。——元稹《莺莺传》","note":"《莺莺传》以诗传情、对话生动，见唐传奇构思曲折、诗化语言与人物塑造的艺术特征。"},{"ref":"第二卷 第四编 第十一章","ref_text":"唐传奇","anchor":"有意为小说","quote":"唐人始有意为小说。——鲁迅《中国小说史略》","note":"唐传奇因“有意为小说”而异于六朝志怪，于虚实交织间追求文采与意想，此评道出其叙事的自觉性。"}]},{"id":"206","title":"试分析唐传奇在文学史上的地位与影响","examples":[{"ref":"第二卷 第四编 第十一章","ref_text":"唐传奇","anchor":"文言小说","quote":"至唐人乃作意好奇，假小说以寄笔端。——鲁迅《中国小说史略》","note":"唐传奇标志着中国文言小说的成熟与定型，鲁迅“作意好奇、假小说以寄笔端”正见其由自发趋于自觉的转变。"}]},{"id":"210","title":"试论述杜牧诗歌创作的艺术成就","examples":[{"ref":"第二卷 第四编 第九章","ref_text":"晚唐诗人（杜牧）","anchor":"咏史怀古","quote":"烟笼寒水月笼沙，夜泊秦淮近酒家。商女不知亡国恨，隔江犹唱后庭花。——杜牧《泊秦淮》","note":"杜牧咏史怀古长于借典型画面发表史论，此诗情景交融而含蓄隽永，是其清新明洁意境与议史之长的代表。"}]},{"id":"213","title":"试分析李商隐诗歌的创作特征","examples":[{"ref":"第二卷 第四编 第九章","ref_text":"晚唐诗人（李商隐）","anchor":"无题","quote":"春蚕到死丝方尽，蜡炬成灰泪始干。——李商隐《无题》","note":"《无题》情调幽美、诗境朦胧，此句以象征写缠绵深情，正见李商隐诗情思意绪的隐约深沉。"},{"ref":"第二卷 第四编 第九章","ref_text":"晚唐诗人（李商隐·用典）","anchor":"用典","quote":"庄生晓梦迷蝴蝶，望帝春心托杜鹃。——李商隐《锦瑟》","note":"李商隐用典使事精工灵活，《锦瑟》连用典故寄寓隐曲情思，正是其用典风格的代表。"}]},{"id":"214","title":"试论李商隐无题诗的艺术特征（25山东大学、26中央财经大学）","examples":[{"ref":"第二卷 第四编 第九章","ref_text":"晚唐诗人（李商隐无题诗）","anchor":"多义性","quote":"锦瑟无端五十弦，一弦一柱思华年。——李商隐《锦瑟》","note":"《锦瑟》以迷离意象写整个心境而歧解纷出，正是李商隐无题诗“多义性”与朦胧诗境的双重体现。"},{"ref":"第二卷 第四编 第九章","ref_text":"晚唐诗人（李商隐无题诗）","anchor":"无题","quote":"春蚕到死丝方尽，蜡炬成灰泪始干。——李商隐《无题》","note":"《无题》含蓄婉曲、缠绵悱恻，情调幽美而迂回曲折，是其无题诗抒情艺术的典型。"}]},{"id":"215","title":"李商隐诗歌多义性的成因","examples":[{"ref":"第二卷 第四编 第九章","ref_text":"晚唐诗人（李商隐·多义性）","anchor":"珠泪","quote":"沧海月明珠有泪，蓝田日暖玉生烟。——李商隐《锦瑟》","note":"“珠泪”“玉烟”等意象心灵化、难以指实，正是李商隐诗多义性在语言符号层面的成因。"},{"ref":"第二卷 第四编 第九章","ref_text":"晚唐诗人（李商隐·用典）","anchor":"用典","quote":"庄生晓梦迷蝴蝶，望帝春心托杜鹃。——李商隐《锦瑟》","note":"李商隐大量用典并增造改构典故内涵，多歧多解，正是其诗多义性的又一桩重要成因。"}]},{"id":"77","title":"论述南朝文学的“文笔之辨”（25西南交通大学、浙江大学）","examples":[{"ref":"第二卷 第三编 第十章","ref_text":"骈文与齐梁文论（《文心雕龙》《诗品》）——文笔之辨的文体论背景","anchor":"文笔","quote":"今之常言，有文有笔，以为无韵者笔也，有韵者文也。（刘勰《文心雕龙·总术》）","note":"文笔之辨是南朝文体论与文学自觉的核心议题，袁版将其置于第三编第十章骈文与齐梁文论中论述；刘勰从韵/无韵立论，恰是题中所述“从音韵上分辨”的代表说。"},{"ref":"第二卷 第三编 第十章","ref_text":"骈文与齐梁文论——萧绎立言说的审美标准","anchor":"审美","quote":"吟咏风谣，流连哀思者，谓之文。……至若文者，惟须绮縠纷披，宫徵靡曼，唇吻遒会，情灵摇荡。（萧绎《金楼子·立言》）","note":"萧绎不以用韵而以审美论“文”，是文笔之辨由体裁定标准转向审美标准的关键一步，正对应题中“从审美上分辨”之论。"}]},{"id":"81","title":"谈谈你对建安风骨的认识","examples":[{"ref":"第二卷 第三编 第一章","ref_text":"建安文学——建安风骨的时代成因与内涵","anchor":"建安风骨","quote":"观其时文，雅好慷慨，良由世积乱离，风衰俗怨，并志深而笔长，故梗概而多气也。（刘勰《文心雕龙·时序》）","note":"刘勰概括建安文学“慷慨多气”的时代精神，正是袁版所论建安风骨的成因与底蕴，与题中“世积乱离风衰俗怨”之说互为印证。"},{"ref":"第二卷 第三编 第一章","ref_text":"建安文学——曹丕《典论·论文》的文学自觉","anchor":"建安","quote":"盖文章，经国之大业，不朽之盛事。年寿有时而尽，荣乐止乎其身，二者必至之常期，未若文章之无穷也。（曹丕《典论·论文》）","note":"曹丕把文学提到“经国之大业”的高度，张示了建安文学自觉与个体生命意识的高扬，呼应袁版对建安风骨中“人生苦短……追求不朽”内涵的论述。"}]},{"id":"90","title":"试分析陶渊明的思想性格","examples":[{"ref":"第二卷 第三编 第四章","ref_text":"陶渊明——安贫乐道与崇尚自然的两大思想支柱","anchor":"安贫乐道","quote":"闲静少言，不慕荣利。好读书，不求甚解；每有会意，便欣然忘食。……环堵萧然，不蔽风日；短褐穿结，箪瓢屡空，晏如也。（陶渊明《五柳先生传》）","note":"“不慕荣利”“箪瓢屡空，晏如也”正是安贫乐道人格的自画像，袁版据此阐发陶渊明以品德节操为归的人生准则。"},{"ref":"第二卷 第三编 第四章","ref_text":"陶渊明——崇尚自然的思想","anchor":"崇尚自然","quote":"少无适俗韵，性本爱丘山。误落尘网中，一去三十年。……久在樊笼里，复得返自然。（陶渊明《归园田居》其一）","note":"“复得返自然”直白道出崇尚自然、返归本真的思想，与袁版所论陶渊明追求“真我”、抱朴含真的哲学相互印证。"}]},{"id":"91","title":"试述陶渊明田园诗的主要内容","examples":[{"ref":"第二卷 第三编 第四章","ref_text":"陶渊明——田园诗的躬耕题材与新题材的开创","anchor":"田园诗","quote":"开荒南野际，守拙归园田。方宅十余亩，草屋八九间。榆柳荫后檐，桃李罗堂前。……户庭无尘杂，虚室有余闲。久在樊笼里，复得返自然。（陶渊明《归园田居》其一）","note":"此诗真切展现田园生活与躬耕之乐，是袁版所称陶渊明“以自己的田园生活为内容、写躬耕之甘苦的第一人”的代表例证。"},{"ref":"第二卷 第三编 第四章","ref_text":"陶渊明——田园诗的躬耕生活体验","anchor":"躬耕","quote":"种豆南山下，草盛豆苗稀。晨兴理荒秽，带月荷锄归。道狭草木长，夕露沾我衣。衣沾不足惜，但使愿无违。（陶渊明《归园田居》其三）","note":"劳动第一次在文人创作里得到充分歌颂，正对应袁版所言陶渊明田园诗“着重写躬耕的生活体验、最为可贵”的部分。"}]},{"id":"93","title":"试分析陶渊明诗歌的艺术特征（25中央财经大学）","examples":[{"ref":"第二卷 第三编 第四章","ref_text":"陶渊明——自然、平淡中见警策的艺术追求","anchor":"自然","quote":"结庐在人境，而无车马喧。问君何能尔？心远地自偏。采菊东篱下，悠然见南山。（陶渊明《饮酒》其五）","note":"“心远地自偏”与“采菊见山”浑然无迹，正是陶诗“自然”、情情景事理浑融而无斧凿痕迹的典型写照，契合袁版“自然”为陶诗总体特征之论。"},{"ref":"第二卷 第三编 第四章","ref_text":"陶渊明——钟嵘《诗品》评陶的语言风格","anchor":"平淡","quote":"文体省净，殆无长语。笃意真古，辞兴婉惬。每观其文，想其人德。世叹其质直。（钟嵘《诗品·中品·宋征士陶潜》）","note":"钟嵘“文体省净，殆无长语”点出陶诗平淡质直的风格，袁版据此深化为“平淡中见警策，朴素中见绮丽”的辩证认识。"}]},{"id":"94","title":"谈谈你对陶渊明“古今隐逸诗人之宗”的理解及评价（北京师范大学）","examples":[{"ref":"第二卷 第三编 第四章","ref_text":"陶渊明——隐逸题材的开创与“古今隐逸诗人之宗”","anchor":"古今隐逸诗人之宗","quote":"文体省净，殆无长语。笃意真古，辞兴婉惬。每观其文，想其人德。世叹其质直。至如欢言醉春酒、日暮天无云，风华清靡，岂直为田家语邪？古今隐逸诗人之宗也。（钟嵘《诗品·中品·宋征士陶潜》）","note":"题干所引即钟嵘《诗品》此条；袁版指出钟嵘以“古今隐逸诗人之宗”为陶渊明定诗人身份，故其评在文学史定位中具有承前启后的意义。"},{"ref":"第二卷 第三编 第四章","ref_text":"陶渊明——诗人精神的写照","anchor":"安贫乐道","quote":"衔觞赋诗，以乐其志，无怀氏之民欤？葛天氏之民欤？（陶渊明《五柳先生传》）","note":"“衔觞赋诗，以乐其志”写照其隐逸自得、安贫乐道之人格，恰是钟嵘“想其人德”与“隐逸诗人之宗”之评在陶渊明处境上的落实。"}]},{"id":"95","title":"试述陶渊明散文与辞赋的艺术成就","examples":[{"ref":"第二卷 第三编 第四章","ref_text":"陶渊明——散文《桃花源记》《五柳先生传》","anchor":"桃花源记","quote":"土地平旷，屋舍俨然，有良田美池桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。（陶渊明《桃花源记》）","note":"袁版称《桃花源记》生动展现理想社会图景、令人悠然神往，此引正是其“与污浊现实成鲜明对比”的核心文段。"},{"ref":"第二卷 第三编 第四章","ref_text":"陶渊明——辞赋《归去来兮辞》","anchor":"归去来兮辞","quote":"归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。（陶渊明《归去来兮辞》）","note":"袁版称《归去来兮辞》着意描写由迷途折回的喜悦与对田园的热爱，此数句正见于其开篇，是历来称颂的名句。"}]},{"id":"97","title":"试分析陶渊明的影响","examples":[{"ref":"第二卷 第三编 第四章","ref_text":"陶渊明——田园诗与饮酒题材的开创及影响","anchor":"田园诗","quote":"少无适俗韵，性本爱丘山。……开荒南野际，守拙归园田。（陶渊明《归园田居》其一）","note":"袁版论陶渊明开创田园诗一体、影响及于王维孟浩然等；此诗是后世田园诗派取法的典范之作。"},{"ref":"第二卷 第三编 第四章","ref_text":"陶渊明——金刚怒目与疾恶除暴的一面","anchor":"陶渊明","quote":"精卫衔微木，将以填沧海。刑天舞干戚，猛志固常在。（陶渊明《读山海经》其十）","note":"袁版指出陶诗中“金刚怒目式”作品在黑暗时代给作家以鼓舞；此引正是其疾恶除暴精神的直接例证。"}]},{"id":"100","title":"试分析谢灵运诗歌的艺术特色","examples":[{"ref":"第二卷 第三编 第五章","ref_text":"元嘉诗（谢灵运）——清新明丽、写景工巧的山水诗","anchor":"谢灵运","quote":"潜虬媚幽姿，飞鸿响远音。……初景革绪风，新阳改故阴。池塘生春草，园柳变鸣禽。（谢灵运《登池上楼》）","note":"“池塘生春草”是谢诗清新明丽、注重写实与瞬间景物的名句，袁版引以为谢灵运山水诗艺术的典型例证。"},{"ref":"第二卷 第三编 第五章","ref_text":"元嘉诗（谢灵运）——诗体风貌的转变","anchor":"清新明丽","quote":"情必极貌以写物，辞必穷力而追新。……宋初文咏，体有因革，庄老告退，而山水方滋。（刘勰《文心雕龙·明诗》）","note":"刘勰以“山水方滋”概括宋初诗风之变，与袁版所论谢灵运山水诗“极貌写物”“尚巧似”、开启元嘉新风的判断一致。"}]},{"id":"101","title":"试比较陶渊明与谢灵运的诗歌创作的差异","examples":[{"ref":"第二卷 第三编 第四章、第五章","ref_text":"陶渊明（第四）与谢灵运（第五）——写意与摹象之异","anchor":"谢灵运","quote":"采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。（陶渊明《饮酒》其五）／池塘生春草，园柳变鸣禽。（谢灵运《登池上楼》）","note":"一则以心融物写意（陶），一则捕捉瞬间景物极端刻画物象（谢），恰印证袁版所论陶之“写意”与谢之“摹象”的本质差异。"},{"ref":"第二卷 第三编 第五章","ref_text":"元嘉诗（谢灵运）——与陶诗相对的雕琢写实之风","anchor":"摹象","quote":"俪采百字之偶，争价一句之奇，情必极貌以写物，辞必穷力而追新。（刘勰《文心雕龙·明诗》）","note":"刘勰对宋初诗风的概括正对应谢灵运“极貌写物”“尚巧似”的摹象追求，与陶渊明的白描写意、启示性语言相对，是两代诗风嬗递的注脚。"}]},{"id":"124","title":"谈谈你对《世说新语》的认识","examples":[{"ref":"第二卷 第三编 第九章","ref_text":"志人小说《世说新语》——《任诞》篇名士风度的代表","anchor":"世说新语","quote":"王子猷居山阴，夜大雪，眠觉，开室命酌酒，四望皎然。……忽忆戴安道。时戴在剡，即便夜乘小船就之。经宿方至，造门不前而返。人问其故，王曰：“吾本乘兴而行，兴尽而返，何必见戴？”（《世说新语·任诞》）","note":"这则名士轶事正是《世说新语》记录魏晋名士疏放风度的典型篇目，呼应袁版对志人小说“记言玄远冷隽、记行高简瑰奇”艺术特征的论述。"},{"ref":"第二卷 第三编 第九章","ref_text":"志人小说《世说新语》——简约传神的语言艺术","anchor":"简约含蓄","quote":"读其语言，晋人面目气韵，恍惚生动，而简约玄澹，真致不穷。（胡应麟《少室山房笔丛》卷十三）","note":"胡应麟所评“简约玄澹，真致不穷”与袁版、鲁迅概括《世说新语》简约含蓄隽永传神的语言特点若合符契，题中亦引此则以明其艺术成就。"}]}];
const EXBYID={};
EXAMPLES.forEach(function(it){EXBYID[it.id]=it;});

function renderExCardHtml(ex){
  return '<div class="ex-inline-block">'+
    '<div class="ex-q">'+escHtml(ex.quote)+'</div>'+
    (ex.ref?('<div class="ex-ref">【'+escHtml(ex.ref)+(ex.ref_text?(' · '+escHtml(ex.ref_text)):'')+'】</div>'):'')+
    (ex.note?('<div class="ex-note">'+escHtml(ex.note)+'</div>'):'')+
    '</div>';
}
function renderParaWithMark(paraText, anchor){
  const idx=paraText.indexOf(anchor);
  if(idx<0) return '<p class="ans-p">'+escHtml(paraText)+'</p>';
  const before=escHtml(paraText.slice(0,idx));const hit=escHtml(paraText.slice(idx,idx+anchor.length));const after=escHtml(paraText.slice(idx+anchor.length));
  return '<p class="ans-p">'+before+'<mark class="ex-anchor">'+hit+'</mark>'+after+'</p>';
}
function renderBodyWithExamples(body, exList){
  const hs=(exList||[]).filter(function(ex){return (ex.anchor||'').trim()?ex:null;}).filter(Boolean).slice();
  let h='';const paras=body?body.split(/\n\n+/):[];
  if(!body||!paras.length) h='<p class="ans-p">（本题 OCR 未识别到答案，可能为扫描遗漏）</p>';
  paras.forEach(function(p){const t=p.trim();if(!t)return;const isHead=isSectionHead(t);const paraText=t.replace(/\n+/g,' ');
    if(isHead){h+='<p class="ans-head no-indent">'+escHtml(t)+'</p>';return;}
    const matched=[];for(let i=hs.length-1;i>=0;i--){const a=(hs[i].anchor||'').trim();if(a&&paraText.indexOf(a)>=0){matched.push(hs[i]);hs.splice(i,1);}}
    if(!matched.length){h+='<p class="ans-p">'+escHtml(paraText)+'</p>';return;}
    h+=renderParaWithMark(paraText,matched[0].anchor.trim());
    matched.reverse().forEach(function(ex){h+=renderExCardHtml(ex);});
  });
  hs.forEach(function(ex){h+=renderExCardHtml(ex);});
  return h;
}


let curKw='',curStar=0;const list=document.getElementById('list'),stat=document.getElementById('stat');
function render(){const kw=curKw.trim().toLowerCase();const items=DATA.filter(d=>{if(curStar&&(starStr(d.stars).length!==curStar))return false;if(!inEra(d))return false;if(curType&&qType(d)!==curType)return false;if(kw){const hay=(d.id+' '+d.title+' '+d.keywords+' '+d.body).toLowerCase();if(!hay.includes(kw))return false;}return true;});if(!items.length){list.innerHTML='<div class="empty">没有匹配的题目</div>';stat.textContent='匹配 0 题';return;}list.innerHTML=items.map(d=>{const miss=!d.body&&!d.keywords&&!d.note;return '<div class="q"><div class="qhead" onclick="this.parentNode.classList.toggle(\'open\')"><span class="num">'+escHtml(d.id)+'</span><span class="qt">'+(miss?'<span class="missed">':'')+escHtml(d.title)+(miss?'</span>':'')+'</span><span class="st">'+starStr(d.stars)+'</span><span class="arrow">▶</span></div><div class="body"><div class="answer">'+renderBodyWithExamples(d.body, EXBYID[d.id]?EXBYID[d.id].examples:[])+'</div>'+renderKw(d.keywords)+renderNote(d.note)+'</div></div>';}).join('');stat.textContent='匹配 '+items.length+' / '+DATA.length+' 题'+(curEra>=0?(' · '+ERAS[curEra].name+(curType?(' · '+curType):'')):'');}
document.getElementById('search').addEventListener('input',e=>{curKw=e.target.value;render();});
document.getElementById('stars').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;curStar=parseInt(e.target.dataset.s,10);[...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target));render();});

const ERAS=[{"name":"先秦文学","start":1,"end":43},{"name":"秦汉文学","start":44,"end":69},{"name":"魏晋南北朝文学","start":70,"end":124},{"name":"隋唐五代文学","start":125,"end":223},{"name":"两宋辽金文学","start":224,"end":300},{"name":"元代文学","start":301,"end":335},{"name":"明代文学","start":336,"end":404},{"name":"清初至清中叶文学","start":405,"end":456},{"name":"近代文学","start":457,"end":483}];

let curEra=-1,curType='';
function inEra(d){if(curEra<0)return true;const e=ERAS[curEra],n=parseInt(d.id,10);return n>=e.start&&n<=e.end;}

function closeToc(){tocPanel.classList.remove('show');tocMask.classList.remove('show');}
if(tocBtn){tocBtn.onclick=function(){tocPanel.classList.contains('show')?closeToc():openToc();};}
if(tocMask) tocMask.onclick=closeToc;
var tocClose=document.getElementById('tocClose'); if(tocClose) tocClose.onclick=closeToc;
function buildToc(){
  const body=document.getElementById('tocBody'); if(!body) return;
  let h='<div class="toc-all" data-all="1">显示全部 '+DATA.length+' 题</div>';
  ERAS.forEach(function(e,i){
    const inR=DATA.filter(function(d){const n=parseInt(d.id,10);return n>=e.start&&n<=e.end;});
    const types={};
    inR.forEach(function(d){const t=qType(d);types[t]=(types[t]||0)+1;});
    let subs='';
    Object.keys(types).forEach(function(t){
      const on=(curEra===i&&curType===t)?' on':'';
      subs+='<span class="toc-sub'+on+'" data-era="'+i+'" data-t="'+t+'">'+t+' '+types[t]+'</span>';
    });
    h+='<div class="toc-item"><div class="toc-era'+(curEra===i?' on':'')+'" data-era="'+i+'">'+
       '<span class="idx">'+(i+1)+'.</span><span class="nm">'+e.name+'</span>'+
       '<span class="cnt">'+inR.length+'</span></div><div class="toc-subs">'+subs+'</div></div>';
  });
  body.innerHTML=h;
  if(tocBtn) tocBtn.classList.toggle('on', curEra>=0);
}
document.getElementById('tocBody').addEventListener('click',function(e){
  const all=e.target.closest('.toc-all');
  if(all){curEra=-1;curType='';buildToc();render();closeToc();return;}
  const sub=e.target.closest('.toc-sub');
  if(sub){curEra=parseInt(sub.getAttribute('data-era'),10);curType=sub.getAttribute('data-t');buildToc();render();closeToc();return;}
  const era=e.target.closest('.toc-era');
  if(era){const i=parseInt(era.getAttribute('data-era'),10);curEra=(curEra===i&&!curType)?-1:i;curType='';buildToc();render();closeToc();return;}
});
buildToc();

render();
</script><!-- deep-link-patch --><script>
/* 深链：支持 页面.html#q<题号>，从《百日冲刺计划》一键跳到当天要背的那道题 */
(function(){
  var tries = 0;
  function jump(){
    var m=(location.hash||'').match(/^#q(\d+)$/); if(!m) return true;
    var id=m[1], nodes=document.querySelectorAll('#list .q .num');
    for(var i=0;i<nodes.length;i++){
      if(nodes[i].textContent.replace(/\s/g,'')===id){
        var card=nodes[i].closest?nodes[i].closest('.q'):null;
        if(!card) return true;
        card.classList.add('open');
        card.style.boxShadow='0 0 0 3px #c8902a';
        if(card.scrollIntoView) card.scrollIntoView({block:'center'});
        setTimeout(function(){ card.style.boxShadow=''; }, 2600);
        return true;
      }
    }
    return false;                       /* 还没渲染出来，稍后重试 */
  }
  // 大页面的 load 事件很慢，改用 DOMContentLoaded + 重试，最多约 8 秒
  function run(){ if(jump()) return; if(++tries > 40) return; setTimeout(run,200); }
  if(document.readyState === 'complete') setTimeout(run,60);
  else document.addEventListener('DOMContentLoaded', function(){ setTimeout(run,60); });
  window.addEventListener('hashchange', function(){ run(); });
})();
</script>
<!-- back-to-plan-patch --><script>
/* 返回计划：从《百日冲刺计划》跳来的页面右下角会出现返回按钮 */
(function(){
  var qs = location.search || '';
  if(!/[?&]from=plan/.test(qs)) return;
  var m = qs.match(/[?&]d=(\d+)/);
  var href = '百日冲刺计划.html' + (m ? '?d=' + m[1] : '');

  function go(){
    if(window.opener && !window.opener.closed){
      try{ window.opener.focus(); }catch(e){}
      try{ window.close(); }catch(e){}
      if(window.closed) return;          /* 关掉了：原来那个标签就停在出发那天 */
    }
    location.href = href;                /* 关不掉就本标签跳回去 */
  }

  function draw(){
    if(document.getElementById('__backPlan')) return;
    var st = document.createElement('style');
    st.textContent =
      '#__backPlan{position:fixed;right:16px;bottom:16px;z-index:99999;font-family:inherit;'+
      'font-size:14px;font-weight:700;line-height:1;color:#fff;cursor:pointer;border:none;'+
      'background:linear-gradient(120deg,#9a3b2e,#c8902a);padding:12px 18px;border-radius:99px;'+
      'box-shadow:0 6px 20px rgba(154,59,46,.34);letter-spacing:1px;'+
      'transition:transform .15s,box-shadow .15s}'+
      '#__backPlan:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(154,59,46,.44)}'+
      '#__backPlan:active{transform:translateY(0)}'+
      '#__backPlan small{font-weight:400;opacity:.86;font-size:12px}'+
      '@media print{#__backPlan{display:none}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.id = '__backPlan'; b.type = 'button';
    b.innerHTML = '\u2190 返回计划' + (m ? ' <small>D-' + m[1] + '</small>' : '');
    b.onclick = go;
    document.body.appendChild(b);
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', draw);
  else draw();
})();
</script>
</body></html>
