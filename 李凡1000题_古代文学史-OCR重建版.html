其一是借问答以表宋玉之志或宋玉的特点\n\n应是直承《卜居》《渔父》而来，但增加了描述成分。如《对楚王问》设言楚襄王质问宋玉，此篇文章正是“曲高和寡”的由来，这里塑造了一位才艺超群不同流俗的文士形象，同时流露出遭世不济的无奈和孤芳自赏。《登徒子好色赋》设言登徒子在楚王面前短宋玉好色，宋玉以自己不好色反唇相讥。《文心雕龙·谐隐》称此赋“意在微讽，有足观者”，但宋玉在虚构假设中将自己编排进去，情不自禁自我表白，这应是他“好辞”、继承楚辞抒情传统在赋作中的表现，然而该赋真正富于魅力的是其中对于东家子恰到好处之美的描摹和夸饰。\n\n其二是借问答以展开对外部景观的描摹\n\n《高唐赋》《神女赋》是典型代表。《高唐赋》由回答高唐云气何称“朝云”，引出“旦为朝云，暮为行雨，朝朝暮暮，阳台之下”的巫山神女“愿荐枕席”的浪漫传说，进而杂骚体与诗体展开对高唐之景之游的铺排描绘，其主旨即在于摹景状物。《神女赋》紧承前者而来，由赋高唐引出夜梦与神女遇，进而同样杂以诗体、骚体展开对神女的刻画。《高唐》《神女》一出，“朝云”“暮雨”从此成为性爱的隐喻；山峦、波涛、饮宴、游猎从此成为描摹的对象；神女的身姿，更化身为各种形象，在后代美女赋中反复出现，曹植《洛神赋》中的宓妃“髣髴兮若轻云之蔽月，飘飖兮若流风之回雪”，就是它的流风馀韵。\n\n其三是借问答以比试语言功力，滑稽为文\n\n如《大言赋》比试夸张，《小言赋》又比试“小言”，两次都是和唐勒、景差比试，都是宋玉胜出。\n\n题为宋玉所作的这些赋作，虚构情节，客主问答，散韵结合，描写铺排，极言大小，已经为汉代大赋的创作拉开了序幕。\n\n秦汉文学史","keywords":"祖述屈原 新的创意《九辩》《离骚》的抒情传统 悲愤深沉 设为问答、以叙述描写为主 表宋玉之志或特点 展开对外部景观的描摹 比试语言功力","note":"在回答宋玉辞赋的特色时，我们首先要明确宋玉祖述屈原并加以创新这一根本特色，然后结合宋玉作品，具体作答。宋玉的辞赋特色，主要体现在设为问答、叙述描写为主上面。而宋玉作品中，需要我们重点关注的是《九辩》，当然，《高唐》《神女》也不应该被忽视，曾经出过名词解释。"},{"id":"44","stars":"★★","title":"谈谈贾谊散文的艺术成就","body":"年轻的思想家贾谊把汉代政论体散文的创作推向一个新的高度。《汉书·艺文志》记载贾谊散文共58篇，收录于《新书》。其作品大体可分为三类，一类是专题政论文，如《过秦论》；一类是就具体问题所写的疏牍文，如《陈政事疏》；还有一些是杂论。\n\n一、专题政论文\n\n《过秦论》是贾谊政论散文的代表作，分上中下三篇。这是一组见解深刻而又极富艺术感染力的文章。\n\n（一）上篇先讲秦自孝公以迄始皇逐渐强大的原因，接着笔锋陡转，运用对比的方法，写强盛的秦帝国，竟然会在转眼之间，被陈涉这个普通人灭亡，给人以强烈的心灵震撼，从而总结出秦亡的教训：此乃“仁义不施，而攻守之势异也”。\n\n（二）中篇重点分析秦在统一中国之后政策上的失误，接着得出“牧民之道，务在安之”的结论，可为精辟之见。\n\n（三）下篇进一步指陈秦人在危难当头不能挽狂澜于既倒的原因，从而说明：秦人之亡，非在外力，而在于自身，“本末并失，故不能长”。\n\n三篇文章，就这样环环相扣地把秦朝亡国的原因层层剖析下去，思维严谨，说理透辟，见解不凡。文章取名“过秦”，实则是借此来警告汉朝皇帝不要重蹈亡秦覆辙，故全文取一句野谚结尾：“前事之不忘，后事之师也。”由此，我们不但能见到作为汉初思想家贾谊关注国家政治的热情和深刻的思想，还能见出他的才思、智慧和人格风采。此文虽为说理，有浓厚的战国纵横家遗风，但是在遣词造句中又处处流露出诗人的气质，词语讲究，多用修饰，感情充沛，行文流畅，可视为汉初散文的典范之作。\n\n二、疏牍文\n\n贾谊另一类有特色的散文是疏牍文，其中的代表作是《论积贮疏》和《陈政事疏》。《论积贮疏》的主旨是建议汉文帝重视农业生产。文章层次清晰，语言简洁，论述透辟，态度诚恳朴实而又带有真挚的感情，很有汉代文章的特色。《陈政事疏》（一称《治安策》）则是贾谊系统地阐述自己治国主张的一篇长文。他在文中驳斥了“天下已安已治”的观点，从多个方面指陈社会现时危机和潜在隐患，表现了他洞察社会矛盾的能力、见微知著的远见和对国家大事的深切关怀。而作为一个有着深刻见解的思想家，精辟的论述更使文章增添了说服人的力量。\n\n三、杂论\n\n除此之外，贾谊《新书》中还有一些杂论文章，语言或朴实浅显，或生动形象，叙事说理均有特色。\n\n贾谊是汉初最重要的思想家和最杰出的文人。他的政论散文，全面地阐述了深刻的政治思想和高瞻远瞩的治国方略，鲜明地体现了汉初知识分子在大一统封建帝国创始时期积极用世的人生态度和昂扬向上的精神风貌，标志着中国散文发展的一个新阶段，代表汉初政论散文的最高成就。","keywords":"一个新的高度 专题政论文 疏牍文 杂论《过秦论》典范之作 汉初政论散文的最高成就","note":"贾谊是汉初最重要的思想家和最杰出的文人，他的散文大致可以分为三种类型，每种类型都有其特色。在回答时，我们只需要紧紧抓住这一点，结合具体文章作答就可以了。"},{"id":"45","stars":"★★★","title":"《淮南子》的艺术特色","body":"《淮南子》，又称《淮南鸿烈》，堪称汉初黄老思想的集大成之作。其艺术特色主要表现在以下方面：\n\n一、以道家思想为中心\n\n《淮南子》原称《淮南鸿烈》，“鸿”是广大之意，“烈”是光明之意。作者自认为此书包含广大光明的道理，可出于诸子百家之上，为汉代治国法典，但是《淮南子》在《汉书·艺文志》中被归入杂家，这大概与其内容显得博杂有关。\n\n不过总的看来，此书还是以道家思想为中心的，旨在究天地之理，接人间之事，备帝王之道-基于天道而认识人道。东汉高诱说：“其旨近老子，淡泊无为，蹈虚守静，出入经道。”（《淮南子注·叙目》）立足于自然之道，《淮南子》对儒家有所批评，如《本经训》中说：“立仁义，修礼乐，则德迁而为伪矣。及伪之生也，饰智以惊愚，设诈以巧上。”《齐俗训》中也说：“率性而行谓之道，得其天性谓之德。性失然后贵仁，道失然后贵义。”《淮南子》还反对复古思想，认为人类社会在不断发展变化，不能尊古而贱今。\n\n二、形成了完整的思想体系\n\n作为一部理论著作，《淮南子》的论说博奥深宏，无所不包，有一套完整的思想体系。但它并非一部抽象论道之书，其重点乃在于“纪纲道德，经纬人事”（《淮南子·要略》），处处紧密关合着现实，多用历史、神话、传说、故事来说理，具有很强的文学色彩。\n\n三、风格浪漫，行文繁富有序\n\n从文学风格上看，《淮南子》颇有庄骚浪漫之馀韵，战国策士之遗风，刘勰称其“泛采而文丽”“得百氏之华采”（《文心雕龙·诸子》）。刘安及其许多门客都擅长辞赋，《淮南子》有些地方也带有辞赋色彩，书中也不乏奇特的想象，刘熙载说：”《淮南子》连类喻义，本诸《易》与《庄子》，而奇伟宏富，又能自用其才，虽使与先秦诸子同时，亦足成一家之作。”行文多形容铺张，繁富有序，颇重语言的修饰和整饬。大量排比式的句子，与陆贾、贾谊等人的文章共开后世骈文之先河。\n\n四、大量使用神话传说和寓言\n\n《淮南子》中的神话传说相当丰富，保存了“女娲造人”“女娲补天”“仓颉造字”“共工怒触不周山”“后羿射日”“嫦娥奔月”等约四十条神话传说。与《楚辞》《山海经》有所不同的是，此书有关三皇五帝的神话传说颇为丰富。《淮南子》也善于运用寓言故事说理，“塞翁失马”“削足适履”等广为流传。《说山训》《说林训》还汇集了许多格言警句，如\n\n“以天下之大，托于一人之才，譬若悬干钧之重于木之一枝”“太（泰）山之高，背而弗见；秋毫之末，视之可察”等，无不发人深省。","keywords":"道家思想 完整的思想体系 开后世骈文之先河 神话传说 运用寓言故事说理","note":"《淮南子》成书于汉武帝之前，受到道家黄老思想的影响比较明显。在行文风格上，它继承了先秦诸子的特色，并有所发展。不过多数情况下，《淮南子》还是会以名词解释的形式进行考查，相关内容大家要特别关注。"},{"id":"46","stars":"★★★★","title":"谈谈《史记》的叙事艺术","body":"作为中国首部纪传体通史，《史记》以“究天人之际，通古今之变”为旨归，将严谨的历史逻辑与鲜活的文学笔法熔铸一炉，其叙事艺术，主要表现在以下方面：\n\n一、勾连天人、贯通古今的结构框架\n\n司马迁在《报任安书》中说，他修史的宗旨是“究天人之际，通古今之变，成一家之言”。为了达到这个目的，他在综合前代史书各种体制的基础上，创立了纪传体的通史。《史记》由五种体例相互补充而形成的结构框架，勾连天人，贯通古今，在设计上颇具匠心，同时也使它的叙事范围广泛，展示了波澜壮阔的社会生活画图。十二本纪按帝王世代顺序记叙各朝兴衰终始，十表排列帝王侯国间大事，八书是有关经济、文化、天文、历法等方面的专门论述，世家主要是贵族之家的历史，列传是不同阶层、不同类型的人物传记。《史记》这部纪传体通史著作，在体例上冲破了以往历史散文的局限，能够把更多的内容纳入其中，比较全面地反映了社会生活的总体风貌。\n\n二、人物传记编排体现了历史和逻辑的统一\n\n《史记》一书最有文学价值的是人物传记。司马迁在编排人物传记时显示出高超的技巧，使它生动地体现了历史和逻辑的统一，形成了自己独特的叙事脉络。\n\n（一）本纪、世家的传主基本上都是传说或历史上真实存在的皇帝侯王，根据政治地位决定他们入本纪还是入世家。但情况又不尽然，西汉惠帝虽然当了几年天子，实际上有职无权，没起什么作用，所以本纪中没有他的地位。项羽是秦汉之际主宰天下的人物，吕后是惠帝朝的发号施令者，他们虽然没有天子称号，却被列入本纪。孔子没有侯爵，陈胜是自立为王，二人都列入世家，因为他们的历史地位堪与王侯相比。司马迁的上述安排可谓独具慧眼，是对历史事实的充分尊重，也是合乎逻辑的归纳。\n\n（二）《史记》各层次人物传记的排列基本是以时间为序，但又兼顾各传记之间的内在联系，遵循着以类相从的原则。如：司马穰苴、孙武、吴起、伍子胥都是军事家，所以，他们的传记前后相次。苏秦、张仪是战国策士，他们的传记也紧紧相连。再看西汉人物传记：韩长孺、李广、卫青、霍去病都是抗击匈奴的将领，故韩长孺、李广传记后面插入《匈奴列传》，然后是卫青、霍去病的传记。公孙弘、主父偃都以伐匈奴、通西南夷为非，曾上书谏止，他们二人传记列在卫青、霍去病之后，接着是《西南夷列传》。司马相如曾奉命出使西南，所以，他的传记在《西南夷列传》之后。通过叙述西汉中央王朝与周边各民族的交往，使几位相关人物的传记以类相从，前后相次，来龙去脉非常清晰。司马迁对人物传记次序的巧妙编排，造就了《史记》一书婉转多变的叙事脉络，在明灭起伏中体现了历史和逻辑的统一。\n\n（三）《史记》的人物传记有分传，有合传。分传即人各一传，合传是把几个人的传记合在一起，写成一篇传记。合传都是以类相从，把某些相同类型的人物放在一起，《游侠列传》《佞幸列传》《滑稽列传》《循吏列传》《酷吏列传》《货殖列传》等，都是为专门人物设立的合传。在人物合传中，历史和逻辑的统一有时达到天衣无缝的程度，叙事手法非常高超。通过叙述某一类型人物的所作所为，描绘出特定领域的总体风貌，人物合传以这种方式集中体现了历史和逻辑的统一。\n\n三、叙事善于以小见大，追根溯源，揭露深层次中的决定性因素\n\n司马迁喜欢从大处落笔，描写大场面，如写荆轲刺秦王时的险象环生、惊心动魄；写鸿门宴时的剑拔弩张，一触即发，但他同样善于描写一些小事，甚至是生活琐事，初看会觉得很平常，其实这些事都带有深意，甚至在人物活动中带有原始动因的性质，是很多接下来发生的事的根源。《李斯列传》开头写了李斯这样一件事：“年少时，为郡小吏，见吏舍厕中鼠食不洁近人犬，数惊恐之。斯入仓，观仓中鼠，食积粟，居大之下，不见人犬之忧于是李斯乃叹曰：人之贤不肖譬如鼠矣，在所自处耳。”这是一件小事，但却集中反映了李斯的人生观和价值观。他为了摆脱厕鼠的处境，为了成为仓鼠那样的食利者，于是向荀子学帝王之术。学成之后前往秦国游说，在和荀子告别时又说道：“故诟莫大于卑贱，而悲莫甚于穷困。”苦于贫贱而贪恋富贵，是李斯人生观、价值观的核心，这种思想是他人生之梦得以实现的动力，也是葬送他身家性命的祸根。\n\n司马迁叙事并不停留在对表面现象的陈述，而是揭示出隐藏在深处的根源比如他认为项羽失败的原因是“自矜功伐，奋其私智”“欲以力征经营天下”，而不是所说的“天之亡我，非战之罪”。（李凡说：当然，司马迁在探寻因果关系的时候，\n\n往往也误入宿命论的歧途。司马迁对于事件发展过程中起决定作用的原始动因，在叙事时反复加以强调，成为贯穿人物传记的主线。司马迁对许多历史事件、人物命运因果关系的判断并不完全正确，但是，他对始因的苦苦思索和在行文中的自觉揭示，使得人物传记血脉贯通，各篇都有自己的灵魂，有统摄全篇的主导思想。）\n\n四、详略得当\n\n《史记》叙事有详略之分，一般情况下，司马迁对于事情发展的起因，往往都详写；而对于这种原因所引发的最终结果，往往是略写。《史记》人物传记写了许多生活琐事，司马迁之所以对这些生活琐事详加叙述，就在于它们在人物的活动中带有原始动因的性质，是诸多事象得以生成的根源。《史记》各篇都有贯穿始终的主线，和主线相关的事件都是详写的对象。总之，《史记》许多篇章的详写与略写，往往和对因果律的展示密切相关。\n\n五、强烈的故事性和戏剧性\n\n作为一部史书，作者应坚持实录的原则，坚决排斥虚构，但司马迁确实在叙事时加入了一些故事性和戏剧性，有些已类似后世小说，他在记叙一些历史事件时，结构上基本上已经有开端、发展、高潮、结局这些小说的因素了，而且有很多细节刻画，使人身临其境。《史记》的一些故事还极具传奇色彩，比如刘邦斩蛇起义，张良圯上受书等故事，为其人增添了许多神秘感。虽不符合史书的原则，却为本书增加了更多的文学性。\n\n六、对复杂事件和宏大场面的驾驭能力高超\n\n司马迁有很强的驾驭材料的能力，与韩信将兵一样，是多多益善。无论是头绪众多的历史事件，还是人物错杂的重大场面，他写起来都条理清晰，显得游刃有余。在叙述诸吕之乱和七国之乱这两个事件的原委及经过时，司马迁对天下大势了如指掌，对事态的轻重缓急明于心而应于手，成功地运用了顺叙、倒叙、正叙、侧叙等手法，使人应接不暇而又无不了然。《史记》的场面描写也很精彩，不同场面有不同的气氛，司马迁采用白描、铺陈、渲染等笔法，传达出了各种宏大场面的实况及自己的独特感受。《史记》固然时而穿插生活琐事，但司马迁更善于写复杂事件、重大场面，这也是《史记》一书的厚重之处。","keywords":"勾连天人 贯通古今 历史和逻辑的统一 以小见大 追根溯源 详略得当 故事性 戏剧性 对复杂事件和宏大场面的驾驭能力高超","note":"《史记》作为二十四史之首，除了历史文献价值之外，还具有突出的文学价值，而其叙事艺术就是其文学价值的重要组成部分。在叙事上，《史记》相较于之前的《左传》《战国策》等又有了新的发展，反映了更加丰富的内容，并在其中融入了自己的思考，为后世的史传文学树立了一个优秀的榜样。需要注意的是，司马迁的生平也对《史记》的艺术产生了很重要的影响，具体题目可以在李凡文学正版群内查看。"},{"id":"47","stars":"★★★","title":"简述《史记》“实录”精神的体现（25内蒙古大学、天津师范大学）","body":"【答题框架】\n\n《史记》的“实录”精神，素为后人所称道。这主要体现在以下方面：\n\n一、《史记》的“实录”精神首先表现在对历史发展进程及历史事件的客观评价上\n\n例如，汉初政治舆论对秦王朝只是一味否定，甚至不把它看作一个朝代，司马迁却认为秦统一天下，统一文字及度量衡，实行郡县制等，都是符合历史发展进程的，其功业是非凡的。司马迁力图还原历史人物的本来面目，不把传主抽象化或简单化，也不为某些不实传闻所蔽。例如，司马迁把陈涉写入世家，同时也没有掩盖他身上的弱点。\n\n二、《史记》的“实录”精神也表现在对历史上明君贤臣、忠臣良将的赞颂上，颂所当颂，无虚夸溢美之词\n\n在《夏本纪》《殷本纪》《周本纪》中，司马迁歌颂了禹、汤、文王等明君以及他们周围的贤臣。《循吏列传》中司马迁在记述了孙叔敖、子产、公仪休、石奢、李离等人的政绩后，不无感慨地说：“奉职循理，亦可以为治，何必威严哉？”\n\n三、《史记》的“实录”精神还体现在不为王者讳、不为尊者讳上\n\n司马迁继承了古代“良史”的优秀传统，善恶必书。他称颂“终不以天下之病而利一人”的明君，同时也在《夏本纪》《殷本纪》《周本纪》中揭露夏桀王、殷纣王、周厉王、周幽王的残忍暴虐，在《秦本纪》中揭露秦武公、秦穆公用人殉葬，在《秦始皇本纪》里揭露秦始皇不恤民力、坑杀儒生等。\n\n孔子担心受到统治者的加害，故《春秋》记事详远而略近；司马迁《史记》则“言秦、汉详矣”，对于汉朝君臣的恶行败德毫不避讳。如《项羽本纪》就写刘邦兵败彭城，逃跑时“推堕孝惠、鲁元车下，公（夏侯婴）常下收载之，如是者三”。\n\n四、《史记》的“实录”精神还体现在对儒学末流的讥讽、批判上\n\n一些儒者表面上尊奉孔子，宣扬仁义道德，实际上却趋炎附势，对统治者阿谀奉承，只考虑一己之私利。如《平津侯主父列传》中的公孙弘，起初武帝下诏征召贤良文学之士，公孙弘对策，被拜为博士，受到重用。然而，公孙弘却一味迎合顺从皇帝的旨意。这些都被司马迁详细地记录了下来。","keywords":"历史发展进程 历史事件 客观评价 明君贤臣 忠臣良将 颂所当颂 不为王者讳 不为尊者讳 儒学末流 讥讽批判","note":"本题为马工程版《中国古代文学史》中的内容，相对来说还是比较简单的。《史记》的“实录”精神，简单来说就是秉笔直书，客观评价历史人物和历史事件，不刻意隐瞒上面，大家在记忆时，主要是记住四个关键句，其余内容结合作品举例分析就可以了。这道题虽然简单，在24、25两年的考查中都有不少院校进行了考查，所以参考书为马工程版《中国古代文学史》的同学需要重点关注一下这道题。"},{"id":"48","stars":"★★★★","title":"《史记》人物刻画的特色","body":"《史记》之所以在文学史上占据着重要的地位，不仅是因为其宏伟的结构，更在于其优秀的人物塑造能力，这具体表现在以下方面：\n\n【袁行霈版】\n\n一、下层人物入传\n\n《史记》中的“纪”“传”是以人物为中心的纪传散文，通过展示人物的活动而再现多彩的历史画面。本纪、世家、列传中的人物来自不同阶层，上自帝王将相，下至市井细民，诸子百家、三教九流，应有尽有，所涉人物四千多个，重要人物数百名。《史记》的人物传记之所以有如此广大的覆盖面，和司马迁进步的历史观及开阔的视野密不可分。司马迁对那些在历史上虽有卓越表现、终因无人奖掖而难以扬名的布衣平民怀有深切的同情。为他们鸣不平，在按照惯例为帝王将相立传的同时，也把许多下层人物写入书中，其中包括刺客、游侠、商人、方士等，使得《史记》所收的人物非常广泛，并且都刻画得栩栩如生。\n\n二、人物个性特征鲜明又有普遍共性\n\n（一）《史记》中的人物形象各具姿态，都有自己鲜明的个性特征。就是同一类型的人物，形象也罕有雷同，不同类型人物形象之间更是形成巨大的反差，鲜明的对照。人物的个性在差异区别中得到充分的显示。\n\n司马迁在刻画人物时，能准确地把握表现对象的基本特征加以渲染，使许多人物形象的个性非常突出。《史记》中的人物形象之所以各具风采，就在于司马迁充分地展示了他们的个性特征。\n\n司马迁在表现人物的个性特征时，能充分注意到他们的家庭出身、文化教养、社会经历等各方面的因素，给以恰如其分的表现。不但展现出人物的个性特征，而且对形成人物个性特征的原因也有或明或暗的显示，有时一开始就为人物性格的发展作了铺垫。影响人物个性的许多重要因素，司马迁都充分注意到了，因此，他使《史记》中的人物都按各自的方式说话行事，符合自己的年龄身份和教养。\n\n（二）《史记》中的人物形象各有各的风貌，各有各的性格，同时，他们身上还表现出许多带有普遍性的东西，即得到社会广泛认可、并对后代产生深远影响的某些共性。这是《史记》在刻画人物方面取得的重要成就，最容易引起读者的共鸣。《史记》人物形象的共性是多方面的，主要有以下几点：一是知恩图报，以德报德。知恩图报的人物在《史记》中有一大批，他们百倍、千倍地报偿恩人，以表示自己不忘本、不负人。二是以牙还牙，以怨报怨。这是和知恩图报、以德报德相对应的一种行为，伍子胥之于楚平王、李广之于霸陵尉、主父偃之于昆弟宾客，采取的都是这种做法。知恩图报和以怨报怨是相互\n\n联系的两个侧面，往往在一个人的身上同时体现出来。三是士为知己者死，为报答知遇之恩而赴汤蹈火，甚至不惜献出自己的生命。这是知恩图报的升华，是它的极端形式。《史记》人物形象还普遍存在富贵还乡的想法，这是他们共同的理想和追求。\n\n《史记》中的人物既有鲜明的个性，又有普遍的共性，是共性与个性的完美结合。《史记》中有许多人物所做的事情相近，但是怎样去做，却是各人有各人的选择，各人有各人的方式。人物的共性寓于鲜明的个性之中，二者都得到了充分的表现。\n\n三、采用多维透视的方法和互见法展示出人物的多方面性格特征\n\n司马迁在刻画人物时，采用多维透视的方法，使笔下的人物显露多方面的性格特征，有血有肉，生动丰满，一方面能把握他的基本特征，同时对其性格的次要方面也能给予充分的重视，多侧面地展现人物的精神风貌。\n\n司马迁全面把握和充分展示自己笔下的人物形象的丰富性复杂性，有的是在一篇传记中同时写出人物性格的几个侧面，有的则采用旁见侧出的方法，通过多篇传记完成对某个人物形象的塑造。旁见侧出法，又称互见法，即在一个人物的传记中着重表现他的主要特征，而其他方面的性格特征则放到别人的传记中显示。《史记》人物形象具有多方面的性格特征，要把相关传记联系起来加以观照才能全面地把握。\n\n【马工程版】\n\n一、妙于选材，以小见大\n\n《廉颇蔺相如列传》写蔺相如，重点选取了完璧归赵、渑池会、将相和三事。这三件事在当时赵国的内政外交方面都十分重要借此可充分表现蔺相如机智勇敢的个性、出色的外交才能以及崇高的爱国精神。司马迁特别注意选择那些能突出一篇主旨、体现人物个性特征的材料。他在《留侯世家》中说：留侯“所与上从容言天下事甚众，非天下所以存亡，故不著”。也就是说，对于塑造张良这个辅佐刘邦定天下的重要人物而言，那些与天下存亡、事业成败不甚相关的诸多材料就不涉及了。\n\n《史记》不少人物传记中，司马迁往往选取传主早年的一个小故事，以小见大，以反映其志向或性格特征的一贯性。如《李斯列传》写李斯少时从厕中鼠、仓中鼠的不同处境中，悟出自己应依托帝王权势以求富贵利达。正是在官仓鼠式人生观的支配下，李斯当了丞相之后贪恋禄位，不敢坚持正义，最终被赵高所杀。\n\n二、通过矛盾冲突写人\n\n司马迁常借助戏剧性的场面，把人物推到矛盾冲突的风口浪尖，表现其性格特征。《项羽本纪》中的“鸿门宴”在这方面相当典型：秦王朝被推翻后，刘邦、项羽争夺天下的斗争渐趋激烈。围绕鸿门宴，司马迁写刘邦在张良等人的协助下收买项伯、争取项羽、挫败范增，从而在这场惊心动魄的斗争中化险为夷。相比之下，项羽则消极被动，寡谋少断。刘邦、项羽之外，范增、张良、项伯、樊哙等人的个性也借此得到了展现。\n\n三、生动的细节描写\n\n司马迁善用细节描写来刻画人物，有时候通过一句话、一个动作，就能画出人物的灵魂来。如《吕太后本纪》写惠帝死，吕后担心幼子继位难以控制局面，故虽哭而“泣不下”；直到丞相陈平“请拜吕台、吕产、吕禄为将，将兵居南北军，及诸吕皆入宫，居中用事”，“其哭乃哀”。\n\n四、鲜活的人物语言\n\n司马迁善于通过鲜活的人物语言来表现人物的思想及个性，使读者如闻其声，如见其人。如《孙子吴起列传》中写庞涓于马陵道遭到齐军伏击，“自知智穷兵败，乃自到，曰：“遂成竖子之名！’”短短一句话，庞涓心胸之狭隘表露无遗。\n\n五、司马迁还善于引用歌诗甚至辞赋，让所塑造人物直接抒情言志\n\n引诗如伯夷、叔齐的《采薇歌》，箕子的《麦秀歌》，荆轲的《易水歌》，刘邦的《大风歌》《鸿鹄歌》，项羽的《垓下歌》，赵王刘友死前之悲歌，汉武帝的《秋风辞》等；引辞赋如《屈原贾生列传》中的《渔父》《怀沙》《吊屈原赋》《鹏鸟赋》等将传主的自我言说、心理活动的揭示、气氛的烘托等融为一体，给读者留下了难忘的印象。","keywords":"下层人物 个性特征 共性 共性与个性的完美结合 多维透视 旁见侧出法","note":"①论述《史记》人物刻画的特色，我们需要从题材、艺术手法和具体表现三个维度进行考虑，题材上是下层人物入传，艺术手法主要有多维透视和旁见侧出两种，具体表现则是共性与个性的统一。这里需要注意的是，在考查中我们还会遇到诸如“如何理解《史记》中人物性格是共性与个性的统一””《史记》在刻画人物时运用了怎样的手法”这样的问题，到时候我们只要截取相关知识点，结合《史记》内容作扩充，灵活作答即可。②旁见侧出法经常考查名词解释，大家注意积累。③应同学们要求，将马工程版教材中对《史记》人物刻画艺术的讨论也补充在这里，条理更加清晰一些，大家也可以参考一下。"},{"id":"49","stars":"★★★★","title":"《史记》的风格特征","body":"《史记》既对历史的记录，又熔铸着司马迁个人的思想，两相结合，使得其呈现出了独特的气质，具体表现在以下方面：\n\n一、雄深雅健\n\n《史记》的叙事写人都围绕“究天人之际，通古今之变”的宗旨，司马迁虽然也从琐碎的生活细事写起，但绝大多数的人物传记最终都在宏伟壮阔的画面中展开，有一系列历史上的大事穿插其间，他所选择的题材多是重大的。司马迁不是一般地描述历史进程和人物的生平事迹，而是对历史规律和人物命运进行深刻的思考，透过表象去发掘本质，通过偶然性去把握必然规律。这就使得《史记》的人物传记既有宏伟的画面，又有深邃的意蕴，形成了雄深雅健的风格。\n\n二、富有哲理色彩\n\n司马迁善于把笔下的人物置于广阔的社会背景下加以表现，在叙述一系列重大历史事件的过程中，展示个人命运偶然性中所体现的历史必然性。《史记》中的人物形形色色，或卑琐、或伟岸；有的先荣后辱，有的先辱后荣；有的事业成功，人生幸运，也有的虽然事业成功，却命运悲惨。司马迁既把他们写成重大事件的导演、演员，又把他们写成重大事件的产儿，通过描写、叙述他们对时势潮流的顺应与抗拒、对历史机遇的及时把握与失之交臂，以如椽巨笔勾勒出历史和人生的壮阔画面，点出其中蕴含的哲理。\n\n三、浓郁的悲剧气\n\n司马迁的人生遭遇是不幸的，他的命运是悲剧性的，《史记》也成功地塑造了一大批悲剧人物形象，使全书具有浓郁的悲剧气。\n\n《史记》中的悲剧人物有多种类型。按其在历史上的地位和作用而论，有些悲剧主人公身上体现的是历史的必然要求和这个要求实际上不可能实现之间的矛盾。这类悲剧人物是历史的先行者，他们的行动具有超前性。尽管他们的主张是正确的，但由于当时的条件还不成熟，他们付出了惨重的代价，有的甚至献出了生命。还有一类悲剧人物尽管死得非常壮烈，但他们的悲剧性不是体现了无法实现的历史必然要求，而是他们相信旧制度的合理。\n\n《史记》中的悲剧人物按其品格划分，又有完美型和缺失型两类。有一些悲剧人物是具有高尚品格和献身精神的英雄；有一些悲剧人物的品格存在明显的弱点，由这些弱点而导致的失误最终毁灭了自身，但由于他们终归是英雄，所以其毁灭也是悲剧性的。\n\n司马迁的人生遭遇是不幸的，他的命运是悲剧性的，他为众多悲剧人物立传，寄寓自己深切的同情。《史记》中所述的众多苦难的经历都带有悲剧性，其中暗含了司马迁自己的人生感慨。\n\n司马迁在探讨人物悲剧的根源时，流露出对天意的怀疑，以及命运不可捉摸、难以把握之感。对于像萧何、陈平那样的幸运儿，司马迁认为他们的人生偶然性中体现出历史的必然性，自身才能对历史潮流的顺应，使他们扮演英雄的角色，命运对于这些人来说不是难解的谜。而从那些悲剧人物身上，司马迁更多感受到的是历史和人生的不确定、不公平和难以理解。司马迁还通过为悲剧人物立传，揭示了异化造成的人性扭曲。\n\n四、富有传奇色彩\n\n司马迁喜欢猎奇，把许多传说故事写入人物传记中，造成一种神秘感。除了类似荒诞不经的传说之外，《史记》所写的许多真人真事也带有传奇色彩。《史记》中的许多故事都疏离常规，出乎人的意料之外，也富有传奇性。\n\n《史记》的传奇性还源于司马迁叙事写人的笔法。司马迁为文疏荡多变，忽起忽落，其来无端，其去无迹，起灭转接，令人莫测端倪。《史记》的章法、句法、用词都有许多独特之处，它别出心裁，不蹈故常，摇曳回荡，跌宕有致，以其新异和多变而产生传奇效果。","keywords":"雄深雅健 哲理色彩 浓郁的悲剧气 传奇色彩","note":"《史记》表现出了多方面的风格特征，包含了多方面的内容。既蕴含着深刻的道理，又表达了作者心中复杂的情感。这些特征中，特别需要我们注意的，是那浓郁的悲剧气息。在记忆这些风格特征时，我们可以结合《史记》中相关的内容加深印象。"},{"id":"50","stars":"★★★★","title":"谈谈《史记》的悲剧性","body":"司马迁的人生遭遇是不幸的，他的命运是悲剧性的，《史记》也成功地塑造了一大批悲剧人物形象，使全书具有浓郁的悲剧气。\n\n一、《史记》中的悲剧人物有多种类型\n\n（一）按其在历史上的地位和作用而论，有些悲剧主人公身上体现的是历史的必然要求和这个要求实际上不可能实现之间的矛盾。这类悲剧人物是历史的先行者，他们的行动具有超前性。尽管他们的主张是正确的，但由于当时的条件还不成熟，他们付出了惨重的代价，有的甚至献出了生命，推行变法的吴起、商鞅，主张削藩的贾谊、晁错，都是这类悲剧英雄。还有一类悲剧人物尽管死得非常壮烈，但他们的悲剧性不是体现了无法实现的历史必然要求，而是他们相信旧制度的合理。田横是司马迁着力描写的英雄人物，他相信已经过时的制度仍然是合理的，并为之而奋斗拼搏，这就决定了他必然成为悲剧人物。《史记》中许多反抗中央朝廷的诸侯王，都属于这类相信旧制度合理性的悲剧人物。\n\n（二）《史记》中的悲剧人物按其品格划分，又有完美型和缺失型两类。《赵世家》中为保护赵氏孤儿而付出巨大牺牲的义士公孙杵曰、程婴，《刺客列传》《游侠列传》中的刺客、游侠，都是具有高尚品格和献身精神的英雄，他们的所作所为几乎无可挑剔，是把身上最有价值的东西毁灭给人看，是完美型的悲剧英雄。还有一些悲剧人物的品格存在明显的弱点，由这些弱点而导致的失误最终毁灭了自身。但由于他们终归是英雄，所以其毁灭也是悲剧性的。这类缺失型悲剧英雄以项羽为代表，他生前战功赫赫，死得慷慨壮烈，他的弱点也暴露得非常明显，只是他自己没有意识到本身的缺欠。\n\n二、悲剧性中暗含着司马迁自己的人生感慨\n\n司马迁的人生遭遇是不幸的，他的命运是悲剧性的，他为众多悲剧人物立传，寄寓自己深切的同情。他赞扬弃小义、雪大耻，名垂后世的伍子胥，塑造出一位烈丈夫形象。他笔下的虞卿、范雎、蔡泽、魏豹、彭越等人，或在穷愁中著书立说，或历经磨难而愈加坚强，或身被刑戮而自负其材，欲有所用。所述这些苦难的经历都带有悲剧性，其中暗含了司马迁自己的人生感慨。\n\n三、悲剧性中蕴涵着对天意、命运的怀疑\n\n司马迁在探讨人物悲剧的根源时，流露出对天意的怀疑，以及命运不可捉摸、难以把握之感。对于像萧何、陈平那样的幸运儿，司马迁认为他们的人生偶然性中体现出历史的必然性，自身才能对历史潮流的顺应使他们扮演英雄的角色，命运对于这些人来说不是难解的谜。而从那些悲剧人物身上，司马迁更多感受到的是历史和人生的不确定、不公平和难以理解。\n\n四、通过悲剧揭示了异化造成的人性扭曲\n\n司马迁还通过为悲剧人物立传，揭示了异化造成的人性扭曲。吴起为了当上鲁国将军而杀妻，未为卿相而母死不归，名缰利锁把他变成一个刻暴少恩之人，最终也因此亡身。政治上的巨大功绩与人性的严重异化形成直接冲突。张耳、陈余早年为刎颈之交，后来却反目为仇，也是利欲把他们拆开。","keywords":"浓郁的悲剧气 悲剧人物有多种类型 人生感慨 天意、命运 人性扭曲","note":"《史记》的悲剧性，不仅在于书中塑造了一大批各种类型的悲剧人物，还在于作者通过为这些人物立传所表达的情感具有浓郁的悲剧色彩。大家把握住这两点，结合作品内容进行分析即可。在理解这些内容时，可以联系司马迁的生平和思想加深印象。"},{"id":"51","stars":"★★★★","title":"论述《史记》对中国文学的影响（25华东师范大学）","body":"《史记》被鲁迅赞誉为“史家之绝唱，无韵之离骚”，从艺术上看是如此，从对中国文学的影响上来看，亦是如此，这主要表现在以下方面：\n\n一、《史记》是我国纪传体史学的奠基之作，同时也是我国传记文学的开端\n\n中国古代史传文学在先秦时期就已经初具规模，记言为《尚书》，记事为《春秋》，其后又有编年体的《左传》和国别体的《国语》《战国策》。但是，以人物为中心的纪传体史学著作，却是司马迁的首创。《史记》的出现，标志中国古代史传文学的发展已经达到高峰。\n\n《史记》是传记文学名著，但它具有诗的意蕴和魅力。《史记》指次古今，出入风骚，对《诗经》和《楚辞》均有继承，同时，战国散文那种酣畅淋漓的风格也为《史记》所借鉴，充分体现了大一统王朝中各种文学传统的融会。\n\n二、《史记》的影响是极其深远的，它为后代文学的发展提供了丰富的营养和强大的动力\n\n（一）大力弘扬人文精神，为后代作家树立典范\n\n司马迁作为伟大的历史学家和文学家，在《史记》一书中大力弘扬人文精神，为后代作家树立起一面光辉的旗帜。《史记》所渗透的人文精神是多方面的，主要有：以立德、立功、立言为宗旨以求青史留名的积极入世精神，忍辱含垢、历尽艰辛而百折不挠、自强不息的进取精神，舍生取义、赴汤蹈火的勇于牺牲精神，批判暴政酷刑、呼唤世间真情的人道主义精神，\n\n立志高远、义不受辱的人格自尊精神。《史记》中一系列血肉丰满的人物形象，从不同侧面集中体现了上述精神，许多人物成为后代作家仰慕和思索的对象，给他们以鼓舞和启迪。\n\n（二）《史记》的写作技巧、文章风格等为古代散文发展提供了借鉴\n\n《史记》是传记文学的典范，也是古代散文的楷模，它的写作技巧、文章风格、语言特点，无不令后代散文家翕然宗之。从唐宋古文八大家，到明代前后七子、清代的桐城派，都对《史记》推崇备至，他们的文章也深受司马迁的影响。《史记》在语言上平易简洁而又富有表现力，把许多佶屈聱牙的古书词句译成汉代书面语，还适当地引用口语、谚语，显得生动鲜活。《史记》语言多是单行奇字，不刻意追求对仗工稳，亦不避讳重复用字，形式自由，不拘一格。正因为如此，历史上的古文家在批评骈俪文的形式主义倾向和纠正艰涩古奥文风时，都要标举《史记》，把它视为古文的典范。\n\n（三）《史记》的情节和人物塑造为小说创作积累了经验\n\n《史记》的许多传记情节曲折，人物形象栩栩如生，为后代小说创作积累了宝贵的经验。小说塑造人物形象的许多基本手法在《史记》中都已经开始运用，如使用符合人物身份、性格的语言，通过具体事件或生活琐事显示人物性格，把人物置于矛盾冲突中加以表现。从唐传奇到明清小说，在人物塑造、情节安排、场面描写等方面都可以见到《史记》的痕迹。同时，古代作家还从写法上探讨《史记》与小说的关系，得出了许多精辟的结论。\n\n（四）《史记》的内容为小说、戏剧创作提供了素材\n\n《史记》的许多故事在古代广为流传，成为后代小说戏剧的取材对象。元代出现的列国故事平话，明代出现的《列国志传》，以及流传至今的《东周列国志》，所叙人物和故事有相当一部分取自《史记》。明甄伟的《西汉通俗演义》，也是大量利用《史记》中的材料。《史记》的许多人物故事相继被写入戏剧，搬上舞台，据傅惜华《元代杂剧全目》所载，取材于《史记》的剧目就有180多种。据李长之统计，在现存132种元杂剧中，有16种采自《史记》的故事。后来的京剧也有不少剧目取材于《史记》。总之，《史记》成为中国古代小说、戏剧的材料宝库，它作为高品位的艺术矿藏得到反复地开发利用。","keywords":"纪传体史学的奠基之作 文学传统的融会 传记文学的开端 弘扬人文精神 古代散文的楷模 小说创作积累经验小说戏剧取材对象","note":"《史记》的地位主要体现在史传文学方面，而《史记》的影响，则渗透进了后代散文、小说、戏剧等多种文体之中。后世作家纷纷从《史记》的思想内涵、写作技巧、人物塑造等多方面汲取营养。鲁迅称《史记》是“无韵之《离骚》”，不仅在艺术上，在对中国文学的影响上，《史记》也可以与《离骚》一较高下。"},{"id":"52","stars":"★★★★","title":"谈谈《汉书》与《史记》的差别","body":"班固编撰的《汉书》是我国第一部纪传体断代史，在叙事写人方面取得很大成就。它是继《史记》以后出现的又一部史传文学典范之作。因此，历史上经常把司马迁和班固并列、《史记》和《汉书》对举。但是，在内容和手法上，《汉书》和《史记》还是有许多不同之处，主要包括以下内容：\n\n一、传记主角身份不同\n\n《史记》最精彩的篇章是楚汉相争和西汉初期的人物传记，《汉书》的精华则在于对西汉盛世各类人物的生动记叙。通过叙述这些历史人物的事迹，全面地展现了西汉盛世的繁荣景象和那个时代的精神风貌。《史记》所写的秦汉之际的杰出人物是在天下未定的形势下云蒸龙变，建功立业，涌现出的一批草莽英雄，其中最引人注目的是战将和谋士。《汉书》所写的西汉盛世人物则不同。他们是在四海已定、天下一统的环境中成长起来的，其中固然不乏武将和谋士，但更多的是法律之士和经师儒生。\n\n二、《汉书》记叙世袭官僚家族的历史更多\n\n除《世家》外，《史记》的人物传记基本都是以写单个人为主，很少全面叙述家族的兴衰史。在汉初的功臣传记中，只有《绛侯周勃世家》写了周勃、周亚夫父子的事迹，其他人的传记基本是止于其身。西汉盛世培育了一大批官僚世家，他们不是一代为官，而是几代人相承，长盛不衰。《汉书》记叙了许多世袭官僚家族的历史，如《霍光金日磾传》《张汤传》《杜周传》《韦贤传》《萧望之传》《冯奉世传》《翟方进传》等，传主都不是单独一个人，而是记叙几代人的事迹，通过描述这些家族的兴衰史，对西汉社会的变迁作了多方面的展示。\n\n三、二者对酷吏批判的程度不同\n\n《史记》对酷吏的揭露极为深刻，张汤、杜周是酷吏的典型代表。在他们身上充分体现了西汉社会刑法的严酷，吏士的残暴。班固也批判酷吏，《汉书》亦设《酷吏列传》。可是，《汉书》的《张汤传》《杜周传》在揭露张汤、杜周文法刻深，\n\n寡恩少义的同时，对他们的子孙张贺、张安世、张延寿、张千秋，杜延年、杜缓、杜钦等人的美德懿行多有称扬，从而在一定程度上缓解了人们对张汤、杜周这两位酷吏的反感，使他们的形象更接近于生活实际。\n\n四、二者悲剧人物数量不同\n\n《史记》具有浓郁的悲剧色彩，有大量悲剧人物的传记。《汉书》中悲剧人物的数量不如《史记》那样众多，但《李广苏建传》中李陵和苏武的传记，却和《史记》的许多名篇一样，写得酣畅淋漓，悲剧气氛很重。\n\n五、二者行文笔法不同\n\n和《史记》疏荡往复的笔法不同，《汉书》重视规矩绳墨，行文谨严有法。\n\n首先，《汉书》笔法精密。在平铺直叙过程中寓含褒贬、预示吉凶，分寸掌握得非常准确。其次，《汉书》不但对于事情的来龙去脉能够清晰地加以叙述，而且对于那些带有起始性质的事件，都要特别加以强调，以引起读者的注意。它有助于读者准确把握汉代各种制度的演变，强化了叙事的力度。\n\n再次，《汉书》的谨严有法，还在于它对某些材料的位置安排有自己的特殊规定，并且在全书一以贯之。《汉书》和《史记》一样，也写了许多人物的轶闻逸事，有的甚至是生活琐事。对于这类事情，司马迁或把它放在传记的前面，或者穿插在中间，也有的放在末尾，没有固定的位置。《汉书》则不同，凡属传闻类的生活小故事几乎全部置于篇末，很少有例外者。这与其说是追述往事，不如说是为所写的人物作一生的总结。这种追叙、补叙的手法，使作品避免了平铺直叙，增加了波澜起伏。\n\n总之，《汉书》有精细的笔法，有自己固定的叙事规则，以谨严取胜，从而形成和《史记》迥然有别的风格。","keywords":"楚汉相争和西汉初期 西汉盛世 草莽英雄 法律之士和经师儒生 世袭官僚家族 对酷吏批判的程度 悲剧人物疏荡往复 谨严有法","note":"《史记》与《汉书》都是十分重要的历史传记类作品，二者的区别，主要根源于二者所处的时代不同，自身的遭遇不同以及记载的内容不同。在比较中，大家可以明确《汉书》的艺术特色，遇到相关问题时，灵活作答即可。"},{"id":"53","stars":"★★★★","title":"结合作品论述“君子曰”“太史公曰”在早期史传散文中的作用（26北京大学）","body":"“君子曰”主要出现在《左传》中，“太史公曰”出自《史记》，二者都是附在传记中的评论，并且前者明显影响到了后者。后来，这种评论形式被确定为史传的文体标志。这些“君子曰”“太史公曰”在早期史传散文中的作用，主要包括以下方面：\n\n一、史学意义：“君子曰”“太史公曰”这些“论赞”式的批评，是史家表达历史识见的一个重要方式\n\n中国古代史家从来不把自己置身于历史之外只作“纯客观”的描述，而是将主体和客体统一起来，在对历史事件进行描述的时候，又进行多方面的评价，使史家的观点、思想倾向和才识见解得到充分的表现。其目的，在于更充分发挥史著和史学经世致用、借鉴资治的作用。“春秋笔法”“一字定褒贬”的潜隐式的评价，实在限制了史家识见的充分发挥。“直书”的要求，也使得史家无法在叙述历史事件与人物时带上太多的倾向性和个人好恶，所以史家不得不另辟蹊径来拓展思维空间和寻找表达方式。“君子曰”“太史公曰”这些“论赞”体的创立，给史家充分发表议论提供了机会和空间，“论赞”也成为史家著作中不可忽略的一个重要组成部分。\n\n二、文学意义\n\n对于史传文学作品来说，“君子曰”“太史公曰”的功能可以包括三个方面。\n\n（一）可以用来叙事，以补充原来篇章中的事和义，使得全篇的材料组织剪裁更为合理\n\n中国古代史传文学作品中，极少对人物进行外貌的描绘，就是有，也是极其简略的。《史记》中的《项羽本纪》《留侯世家》的传文部分，项羽、张良的形象栩栩如生，却没有多少具体的外貌特征。然而司马迁在“太史公曰”中补叙二人相貌之特点，并非特为外貌描写而作，乃是从相貌上突出二人之奇，以显示与众不同的独特之处。再如《淮阴侯列传》在“太史公曰”中补叙韩信为母行营高敞地而葬以见“其志与众异”。类似这些“君子曰”“太史公曰”中的补充事义，既补充了人物行状，丰满了人物形象，又与前面的传文相映成辉。\n\n（二）对历史人物进行评论，使形象性格更为鲜明\n\n这一点，在《左传》的“君子曰”的论赞体式中已初见端倪。《左传》文公三年与文公六年两条“君子”的评论，既见出秦穆公有善于用人的一面，又点明他的昏庸残忍，竟用人殉。弃民残民，是左氏最为深恶痛绝者，所以断言“秦穆之不为盟主也宜哉”“君子是以知秦之不复东征也”。\n\n《史记》人物传记中的“太史公曰”，大量的是对人物性格的概括，对人物的功过、作用、地位、影响的全面评价。《项羽本纪》的“太史公日”，对于项羽在灭秦战争中所建立的丰功伟绩，给予充分的肯定，让后人充分认识项羽这一人物的历史作用。又用“难矣”“过矣”“岂不谬哉”三个充满惋惜之情的否定句，从政策方略以及个人性格的弱点多方面评述了项羽的过失，这样，就从更为广阔的历史背景上对项羽其人给予客观的概括评价，既强化了作为史学研究的科学性，也更丰满的突现出项羽这一人物形象。\n\n（三）增强了史传文学的议论和抒情的特征\n\n鲜明的褒贬美恶所产生的强烈的主观感情，与客观的史事记载和史学分析，二者常不容易统一。而司马迁则把它们统一起来了。这就是利用“太史公曰”议论抒情，这样，既不影响实录的原则，又可为作者找到一条宣泄感情的途径。司马迁常在“太史公曰”中或夹叙夹议，或直抒胸臆。\n\n司马迁写《李将军列传》，对李广其人充满崇敬之情，对李广的不平遭遇，寄予了深切的同情，所以全传写来，可谓一唱三叹，及至“太史公日”，达到全文的高潮：“《传》曰：＇其身正，不令而行；其身不正，虽令不从。＇其李将军之谓也？余睹李将军悛悛如鄙人，口不能道辞；及死之日，天下知与不知，皆为尽哀。彼其忠实诚信于士大夫也？谚曰：桃李不言，下自成蹊。＇此言虽小，可以喻大也。”像这样的论赞，本不应是传文的附加部分，而是传文不可分割的有机组成，是对李广坎坷悲惨一生的不可缺少的补充。又由于司马迁是“极意摹写淋漓，悲咽可涕”，所以产生极强的感染力。\n\n中国早期史传散文中的“君子曰”“太史公曰”这些内容，对于史传文学来说，丰富了史传文学的构成，不但无损史传文学作品的内涵，反而成为史传文学不可或缺的重要组成部分。","keywords":"史学意义 表达历史识见 文学意义 叙事 材料组织剪裁合理 评论 形象性格更为鲜明 增强议论和抒情","note":""},{"id":"54","stars":"★★★★","title":"简述汉代辞赋的体裁、特点与其兴盛原因","body":"汉代赋从其体裁特点看，有四种基本形式。\n\n第一种，由诗三百篇演变而来的诗体赋，句式以四言为主，隔句用韵，篇幅短小，形式与《诗经》相似。\n\n第二种，由楚民歌演变而来的骚体赋，形式与楚辞相同\n\n骚体赋是指在体制上极力模仿屈原且以赋名篇的作品，并兼有楚辞与赋的特点（也有少量不以赋为名但模仿屈原的作品）。楚辞体作品的创作在汉代基本没有新发展，许多作品在内容上和形式上刻意模仿屈原的《离骚》《九章》，有些仅仅因袭楚辞体的形式，故被称为骚体赋。骚体赋并非楚辞，它已散文化，是楚辞演变为汉大赋的过渡形式，在赋的发展史上有着承上启下的作用。代表性作品有贾谊的《吊屈原赋》、司马相如的《长门赋》等。\n\n第三种，由诸子问答体和游士说辞演变而来的散体赋（汉大赋、新体赋）\n\n它韵散结合，篇幅较长，规模宏大，句式短则三言、四言，长则九言、十言，多假托两个或多个人物，通过以假设主客问答的方式“铺采摛文，体物写志”（《文心雕龙·诠赋》），虽散韵结合，而散文的意味较重，故称为散体赋。散体赋是赋的主干，所以散体赋可以直接称之为汉赋，一般说来，文学史上所说的“汉赋”，皆指汉代散体大赋。\n\n第四种，抒情小赋\n\n两汉王朝四百多年的历史，汉赋内容经历了从汉初的反思历史，至西汉盛世的歌功颂德、劝百讽一，到东汉末年，汉王朝的统治已走到崩溃的边缘，士人已经失去了参与政治活动的机会，因此，文学界的批判潮流再次涌动。这一时期的文学创作，在辞赋这种文体里，除了汉大赋被继承外，又出现了新的变化-抒情小赋悄然兴起，涌现出许多名家名作。如班彪的《北征赋》、蔡邕的《述行赋》、班固的《幽通赋》、张衡的《思玄赋》和《归田赋》、赵壹的《刺世疾邪赋》、祢衡的《鹦鹉赋》等等。\n\n赋在汉代特别兴盛，其原因也是出自多方。\n\n首先在经济上，西汉经过前期六七十年的休养生息，经济上发展较快，百姓“人给家足”，国家货财多得无法计算，粮食无处堆藏。由于经济空前雄厚，势必直接或间接地为文学活动提供必不可少的物质前提条件。\n\n其二，武帝时，国力空前强大，开始对边远地区用兵，北方击退长期为患的匈奴，同时对东南和西南方等边远地区进行有效拓展，这就增强了汉帝国的国威，影响着统治阶级及文人心理上一统天下，威震华夏观念的形成。这也是汉赋中所体现的大一统气概之渊源。\n\n其三，张骞出使西域，打通河西走廊，从而沟通西域诸国直至波斯、印度以及罗马的商路，为中外物产与文化的交流开辟道路，汉人眼界扩大，见识增长。故能在大赋中能罗列见所未见，闻所未闻丰富的珍禽异兽，奇珍怪物。\n\n其四，武帝好大喜功，追求享乐，大兴土木，建造宫苑。汉高祖时，已建有长乐宫、未央宫。武帝更是建造甘泉宫、建章宫、上林苑、通天台、飞帘阁等，这些宫殿富丽堂皇，宏伟豪华，给大赋提供了主要的描写对象，并成为大赋的重要题材。\n\n其五，在政治思想上，武帝罢黜百家，独尊儒术，于是黄老简朴之风渐退，儒学繁缛之气方炽。\n\n其六，统治者的喜好和提倡，更是促进赋体文学的昌盛。汉代很多帝王都喜爱文学，如吴王刘濞、梁孝王刘武、淮南王刘安等，皆以爱好文学，招揽文士而著称于史。武帝刘彻尤爱文学，特别是辞赋。由于以上诸种因素，汉赋遂成为文学史上赋体文学的高峰。","keywords":"诗体赋、骚体赋、汉大赋、抒情小赋 赋的诗化 多种繁荣原因并存","note":"赋分三体，然而古今研究者大多只关注文体赋和骚体赋，对于诗体赋却很少提及。“诗体赋”这一概念，是已故马积高先生在《赋史》中最早提出来的。“赋的诗化”是个复杂过程，可详见李凡相关课程。现在的主流教材是直接把赋分为了骚体赋、汉大赋、抒情小赋，但诗体赋大家也应了解。"},{"id":"55","stars":"★","title":"《七发》的艺术成就","body":"《七发》是汉大赋的发端之作，对后世影响很大，它以主客问答的形式，连写七件事的结构方式，为后世所沿习，并形成赋中的“七体”。其艺术成就，主要表现在以下方面：\n\n一、《七发》是在一个虚构的故事框架中，以主客问答的形式结构全篇。正如李善注《文选》所称：“《七发》者，说七事以起发太子也。”（《文选》卷三十四）这是劝诫膏粱子弟的一篇成功之作。\n\n《七发》假托楚太子因纵欲享乐而致病，“吴客”前去探望，最后用“要言妙道”的吸引力使楚太子病愈。这个虚构的故事框架虽很简单，却摆脱了描述实际事件、抒发由此产生的感想之限制，使作者能够自由地选择、表现自然与社会生活之内容。之后的大赋，也多采用这种虚构框架和问答体的形式。虚构手段的运用，对汉赋的发展起着至关重要的作用。\n\n二、《七发》从思想内容到艺术形式，对先秦文学多有借鉴。《七发》中吴客用以劝谏楚太子的养生理论，和《吕氏春秋·本生》的论述一脉相承。赋中大肆铺写音乐、饮食、宫室之事，则明显沿袭《楚辞》中的《招魂》和《大招》，但一重抒情，一重明理，而且一正一反，用意不同。至于观涛的描写则与宋玉《高唐赋》中写山洪暴发的一段有神似之处，但枚乘写得更生动形象，激动人心。其中“观其所驾轶者，所擢拔者，所扬汩者，所温汾者，所涤汔者”几句，又显然取法《庄子·齐物论》中写风的部分，但用笔更为巧妙。这说明汉赋确是综合前代诸多文学样式融合而成，也说明汉赋在继承中有创新，表现出有异于先秦时期的审美情趣和艺术取向，昭示出新的文学时代的到来。\n\n三、逐步盘升手法的运用。赋中讽喻意图的表达是通过重重超越和逐步盘升来实现的。作者在赋中花费大量笔墨去精心描绘的内容，正是作者最终所要超越和否定的东西。如写音乐，作者极尽铺叙之能事，然而太子的一句“仆病未能也”立时将这音乐否定。实际上这也是作者的否定，而且是刻意安排的。最后对要言妙道的肯定，实际上是对前六事的超越和否定。\n\n《七发》已出现道德主题与审美主题的矛盾，出现“劝百讽一”的现象，这也就成为后来汉赋的基本特征。这种超越和盘升手法是汉大赋惯用的技巧，如后来司马相如的《子虚赋》《上林赋》，扬雄的《甘泉赋》《羽猎赋》等，其讽喻意图都是通过这一方式实现的。\n\n四、移步换形和铺夸手法的运用。赋写七事，一事一转，如行山间，人移景变，给人以耳目生新之感，俨然是后世山水游记的笔法精神。每写一事又能刻意求奇，反复渲染，精刻细画，极尽铺夸之能事。其中观涛一段历来为人所激赏，这一段运用生动形象的比喻和大胆雄奇的夸张，把潮水描写成声势显赫的军阵，从形、声、态、势等多方面，描摹曲江大潮的景象，多角度展现潮水与军阵之间的相似之处。奇观满目，涛声盈耳，炜烨谲诡，对自然景观的描绘闪耀着生命的光辉，使读者精神震荡，有如身临其境。刘勰评其为“腴辞云构，夸丽风骇”（《文心雕龙·杂文》）。\n\n五、《七发》在文学史上取得了重要的地位。首先它标志着汉大赋体制的形成。《七发》鸿篇巨制，韵散结合；采用设为问答的形式结纂全篇；笔墨铺夸，描绘精细；以叙事状物为主，辞藻繁富，多用比喻和叠字，这些都是成熟的汉大赋的显著标志。\n\n其次，枚乘和他的《七发》标志着以地方诸王为中心的汉赋创作时代的终结和以京都为中心的创作时代的到来。在枚乘之前，诸如庄忌、淮南小山，包括《汉书·艺文志》中所著录的几个侯王的创作基本上都是在地方进行的。贾谊虽身在皇朝，但《吊屈原赋》《鵩鸟赋》实则作于流放外地之际，也是异时异地的产物，所以这一时期可以看作是地方中心时期。枚乘之后，司马相如、扬雄、班固等人则集于京都，在皇帝周围，形成了以帝王为核心的新的创作格局，所以这一时期可以看作帝都中心时期，而枚乘及其所作的《七发》恰好处于这两个时期的转折点上。\n\n六、《七发》脱离楚辞的抒情性特征，转化为用铺陈写物为中心的高度散文化的文体。《七发》的文句，改变了楚辞文句多用虚词和语气词的特点，而运用排比整齐的句法，辞藻繁富，多用比喻和叠字，使语言本身上更具形式美感。这奠定了新体赋的根本特色-以铺张为能事，以适应统一帝国之需要。\n\n七、《七发》从多方面开拓了文学的题材，这些题材在之后赋作中得以发挥。枚乘以前，《招魂》中对音乐歌舞以及宴游景象已有较多地描写，《七发》继承《招魂》且表现得更为集中、丰富和细致；狩猎、观涛、车马的描写，更是前所未有。之后司马相如《子虚赋》《上林赋》中关于游猎和酒宴场面的描写，则可以看作是对《七发》第四节宴游、第五节狩猎的扩充和发展；王褒专写乐器和音乐的《洞箫赋》，亦可说是对《七发》第一节音乐的拓展；《七发》中写海涛的第六节，则启迪了后来木华的《海赋》、郭璞《江赋》等江河湖海题材之辞赋。\n\n《七发》既奠定了典型的汉代大赋的基础，又是辞赋中特殊的一支-“七”体的开创之先作，譬如傅毅的《七激》、张衡的《七辩》、曹植的《七启》等，但都不及枚乘的《七发》。清代平步青统计，自枚乘之后至唐代，“七”体辞赋有目可查的有四十多家；唐之后虽仍有仿者，但少有出色者。","keywords":"主客问答 多有借鉴 逐步盘升 移步换形和铺夸手法 汉大赋体制的形成 铺陈写物为中心 文学的题材","note":"汉大赋作为一种特殊的文学体裁，历来考查频率（大题）相对较低，《七发》是汉大赋的一种创新，可做名解和简答题掌握，另外，梁园文学、《梁王菟园赋》《忘忧馆柳赋》最近几年曾出现过名词解释，大家要注意一下。"},{"id":"56","stars":"★★★","title":"以《子虚赋》《上林赋》为例，论述司马相如作品的思想内容和艺术特点","body":"《子虚赋》《上林赋》不仅是汉代散体大赋的巅峰之作，更是武帝时期大一统王朝精神气象的文学结晶，集中代表着司马相如的创作特点，这具体表现在以下方面：\n\n一、思想内容方面：\n\n（一）帝国形象的塑造。《上林赋》中塑造了一个幅员极为辽阔，物质极大丰富，国势极其强大，国泰民安，崇德尚义，天下大治的盛世帝国形象。在这个国度里，奇花异草，珍禽怪兽，美酒佳肴，巧夺天工的池苑亭台，气象万千的崇楼峻宇，应有尽有；可以搏虎的勇士，曼妙赛仙的佳人，贤良方正的大臣，无不聚于仁政爱民的帝王周围；诸侯宾服，四海晏然，君民同乐，富庶无边。这些描绘充分展示了汉王朝的宏大气象和赫赫声威，从而奏出汉世最强音。\n\n（二）一统观念的弘扬。汉自贾谊以后就不断有人提出削减诸侯地方势力，实现中央王朝天下一统的主张，这也是社会发展的必然要求。以文学作品体现这种要求的，司马相如是第一人。在《上林赋》中作者明显怀有用中央王朝的强大与诸侯相比，并使之黯然失色、相形见绌的意图；明显有用大一统的盛世强国精神与诸侯的竞富斗侈行为相比，以显高下迥异、君臣有别的意图。强大帝国形象的塑造正是对天下一统的颂歌。作者千方百计想凸显的，就是中央王朝的核心地位和绝对权威，并由此实现对大一统观念的阐释和宣扬。\n\n（三）时代精神的体现。这里所体现的时代精神也即一种民族精神。《上林赋》中从多侧面、直接或间接地表现出中华民族处于蓬勃上升期的那种昂扬奋进、激励张扬、气势充溢、信心十足的精神风貌。天下大治的理想社会图景的描绘充分展示了国民的渴望和追求。整篇作品给人以热情四射、血脉贲张、极欲有所作为而不可遏止之感，充分体现了这种时代精神的感召力量。\n\n二、艺术特点方面：\n\n（一）按时空顺序和以类相缀兼用的铺陈方式。《上林赋》总体上按时空顺序进行推移，先是写楚、齐两个诸侯王，然后重点表现天子的游猎。这中间既遵循时间推移的顺序，又有空间的依次拓展。在描写上林苑的时候，按照东南西北的顺序展示各方景观，显得有条不紊。这篇作品还有另一种铺陈方式，那就是以类相缀，把属于同类的事物连缀在一起。作者在对上林苑各种生物进行铺陈时，依次出现的是水族、飞禽、花草、走兽，都是按照类别进行划分和排列。\n\n（二）主客问答的结构形式与夸张笔法的融通。《子虚赋》中子虚、乌有和亡是公的对话，实际上是以辩难的方式进行夸张艺术的表演和比赛，总的趋势是夸张的强度越来越大，都是后者超越前者。后来者踵事增华、变本加厉，最后把夸张推到极致，使作品呈现逐步盘升的走势。\n\n（三）句法灵活多变，句式长短不一。尤其值得提出的是，在《上林赋》中，作者用大量的三言排比句式描绘天子的狩猎活动，这在中国古代文学作品中首开风气之先。三言句式比较短，再加上以排比的方式出现，很容易收到紧迫、急促的效果，使作品具有奔腾跳跃的气势。赋中所用的三言句，犹如刀剑之类的短兵器，轻便灵活，可以在短时间内连续出击，营造出紧张而充满动感的气氛，从而在一定程度上缓解由于作品篇幅过长而带来的沉闷感。\n\n总之，司马相如这篇作品所创造的是一种巨丽之美，是充满浪漫色彩的壮阔画面，成为后世赋家争相效仿却又无法企及的楷模。","keywords":"思想内容 帝国形象 一统观念 时代精神 艺术特点 时空顺序和以类相缀兼用 主客问答与夸张笔法融通 灵活多变","note":"司马相如是汉赋代表，历来为重中之重，“天子游猎赋”可能考名词解释，对于《上林赋》和《子虚赋》这两部十分重要的作品的特色、思想主题我们需要有所了解，以备不时之需。同时需要注意的是，这两部作品可能在名词解释中出现，大家要注意一下。"},{"id":"57","stars":"★★","title":"扬雄的“四赋”及其特征是什么","body":"扬雄（前53-18）是继司马相如之后，对汉赋发展产生深远影响的又一赋家，其赋体创作大致可以44岁为界分为前后两期。前期有《蜀都赋》《甘泉赋》《河东赋》《羽猎赋》《长杨赋》等作品。《蜀都赋》作于居蜀期间，为后世京都大赋之先声。余下四赋是扬雄大赋的代表作品，史称“四大赋”。这四篇作品模仿司马相如的痕迹非常明显，尤其是《羽猎赋》和《长杨赋》，从形式到内容都与《子虚赋》《上林赋》有着千丝万缕的联系。\n\n它们同以天子游猎为题材，极力描写畋猎场面的壮观和天子气象的恢弘、池苑的阔大和物产的丰富。最后均以君王悔悟戒奢戒侈，勤政爱民作结。手法上均极力夸张渲染，铺张扬厉。但相比之下，扬雄的赋更显理性特征。\n\n《子虚赋》《上林赋》极其热情洋溢，而《羽猎赋》《长杨赋》则显冷静沉着；前者醉心于宫室、苑囿、禽兽、珍奇等自然景观的描绘，后者则致力于历史、社会和人文精神的挖掘。这样不但增强了作品的讽刺力度，而且扩大了描写范围，使大赋的内容虽以帝王为主要对象，却在一定程度上跳出了宫廷生活的圈子，使作品更有深度。\n\n另外，扬雄的作品中还体现出一定的民本思想，非常鲜明地反对扰民、虐民的行为。如《羽猎赋》中有这样的文字：“不夺百姓膏腴谷土，桑柘之地。”在《长杨赋》中则直言天子大规模的狩猎行为“颇扰于农人”，虽然作者的最终目的是为统治者的长治久安计，但能有此爱民之心亦属难能可贵。所有这些都使他的赋有别于司马相如而显示出开创精神，这也是扬雄赋的魅力所在。\n\n《甘泉赋》和《河东赋》写作的年代略早，有较强的针对性。赋前都有序文，以明创作主旨。《甘泉赋》主要采取“推而隆之”的方法，极力描写甘泉宫的崇殿华阙，称它“似紫宫之峥嵘”，借以说明如此奢华的建筑非人力所能为，非人间所应有，以期对统治者有所警戒。同时，作品还提出“屏玉女而却宓妃”“玉女亡所眺其清矑兮，宓妃曾不得施其蛾眉。方揽道德之精刚兮，侔神明与之为资”，委婉地讽刺了成帝宠幸赵昭仪事。但就作品而言，其讽喻主旨并不十分明显，没有达到序中所设定的目的。《河东赋》是作者随成帝横大河、祭后土、祭祀巡游归来之后所作，亦寄讽谏之意。\n\n在扬雄的代表作品四大赋中，《甘泉赋》的艺术成就最高，对景物的描写方面有新的发展。\n\n一是采用主体向观照对象逐步趋靠的方式进行铺陈。先是写道：“是时未轃夫甘泉也，乃望通天之绎绎。”这是铺陈的第一时段，后面用大段文字叙述远望所见。第二时段是在近处仰望甘泉宫，“仰矫首以高视兮，目瞑眴而无见”。从“据軨轩而周流”进入第三时段，是置身甘泉宫内部之后的见闻，是重点的铺陈对象。第四时段叙述天子在甘泉宫的感受及相关举措。\n\n二是铺陈空间的多向维度，展示的是三维六合空间。作者对于天子巡游甘泉宫的描写，既有平面拓展，又有立体延伸。在进行平面拓展时，对甘泉宫的景物按照东西北南的顺序进行铺陈；在进行立体延伸时，天子在甘泉宫仿佛上天入地，潜海升空。扬雄在对空间景观进行铺陈时，是全方位展开，并且兼有静态审视和动态描写。\n\n三是赋予骚体这种文学样式新的功能。扬雄之前，骚体主要用于言志抒情，而且多是以抑郁为基调。扬雄的《甘泉赋》采用骚体，用这种文体来表现汉代盛世和天子的声威，这在历史上是首创，扩大了骚体的选材范围，也使这种文体正式融入主流文化。\n\n从扬雄前期作品中可以看出，作家的政治热情很饱满，关心朝廷大事，对君主期望很高，作品有较强的现实意义。到了后期，因政治上的失意和生活上的清贫，热情渐冷，心态也转向虚静平和，所作多以关注自身、反思人生为主，但对现实的\n\n暴露与批判也更为深刻。这一时期的作品有《解嘲》《太玄赋》《逐贫赋》和《酒赋》等，其中尤以《解嘲》和《逐贫赋》最为前人所称道。","keywords":"理性特征 民本思想 向观照对象逐步趋靠 多向维度 新的功能","note":"扬雄四赋在汉代辞赋中是需要重点掌握的一部分内容，这四篇赋各自的内容及特色，我们都需要有所掌握。这四篇赋中，最重要的便是《甘泉赋》。当然，扬雄前后期创作风格的差异，我们也不应该忽视。"},{"id":"58","stars":"★★★","title":"东汉的辞赋创作有哪些新变？这些新变表现在哪些方面","body":"一、东汉辞赋的创作较之西汉，其整体风貌发生了较大的变化。主要发生了以下变化：\n\n（一）内容题材和创作宗旨的变化\n\n东汉士人环境和地位的变化给予了他们广泛接触社会的机会，他们的关注点由宫廷苑囿转向突出的社会问题。与内容题材的变化相适应，东汉辞赋的创作宗旨也发生了变化，由颂扬功德转向抒情述志。东汉社会现实的黑暗以及统治集团所采取的“党锢”等高压政策使士人普遍受到压抑，士人运用辞赋抒发自己的不平，于是东汉文坛出现了一批感情激切的抒情赋。\n\n（二）艺术风格和表现形式的变化\n\n世风的变化不仅导致辞赋创作在题材选择和宗旨设定方面出现了新的取向，在艺术风格和表现形式方面也有了较大的变化。昔日以铺张扬厉、汪洋恣肆为主调的风格和豪放昂扬的气势，被深邃冷峻、平正典雅的风格所代替；散句单行的语言，演变为骈俪对偶的句式。\n\n二、东汉时期，京都大赋和抒情小赋的创作是赋风转变的重要表现。此时期京都大赋和抒情小赋的创作概况如下：\n\n（一）东汉京都大赋的创作概况\n\n两汉之际的社会动荡，导致东汉初期的社会生活乃至文化思想发生了较大变化，作家的审美情趣和艺术视野同汉赋发展的鼎盛时期相比也产生了明显的差异。杜笃的《论都赋》所表达的思想感情，具有更广泛的社会基础，是东汉赋风转变的重要标志。班固的《两都赋》开创了京都赋的范例，它一改传统表现方法中“劝百讽一”的结构模式，其下篇《东都赋》通篇作讽喻诱导。班固对赋的艺术表现方式做出了重大的突破，同时也推动了汉代文学思想的发展。张衡《二京赋》紧随班固之后，以规模宏大被称为京都大赋的发展。王延寿的《鲁灵光殿赋》对于灵光殿雄伟的整体外观、豪华的殿内装饰、精巧的栋宇结构，无不进行多角度、全镜头式的细致描写，取得了独特的艺术成就。\n\n（二）东汉抒情小赋的创作概况\n\n东汉抒情小赋是对西汉以赋抒情传统的发扬，主要有纪行赋和述志赋两类。\n\n（一）所谓纪行赋，以行踪为线索，通过记叙旅途所见而抒发自己的感慨。一般篇幅不太长，兼有写景叙事，抒情述怀，和那些铺张扬厉的京都大赋明显不同。这类题材导源于刘歆的《遂初赋》，东汉赋家时有续作。代表性作品如班彪的《北征赋》，乱世叹兴亡，线索清晰，文风典雅。班昭的《东征赋》，感情细腻，文风古淡。蔡邕的《述行赋》，衰世叹治乱，感情痛切，气氛悲凉，是东汉纪行赋的殿军之作。\n\n（二）所谓述志赋，是指赋家在社会动乱、宦海沉浮中用以宣寄情志的作品。冯衍的《显志赋》是东汉早期述志赋的重要作品，慨叹怀才不遇的个人遭际。班固的《幽通赋》追述自己的家族发展史，颇多哲理思考，文风典雅深邃。张衡的《思玄赋》采用骚体句式，探求人生玄妙之理；他的《归田赋》写得清新明丽，是中国文学史上第一篇描写田园隐居之乐的赋作。东汉末年赵壹的《刺世疾邪赋》文风刚劲朴素，具有犀利的批判精神；他的《穷鸟赋》象征手法的运用也别具特色。另外，祢衡的《鹦鹉赋》以鸟喻人，苦情哀绝，也是借物言志赋中的上乘之作。","keywords":"内容题材 创作宗旨 艺术风格 表现形式 京都大赋 抒情小赋","note":"这是一道宏观题目，近年类似这种题目的比重都在上升，可见文学史考查的难度确实在上升，大家在平时自己复习的时候也要多注意总结类似题目，把某种问题或文学现象放在整个时代背景中进行记忆。"},{"id":"59","stars":"★★","title":"班固的《两都赋》有哪些艺术特色","body":"东汉以都洛、都雍（即长安）这一议论焦点为题材的辞赋作品中，班固的《两都赋》“以极众人之所眩曜，折以今之法度”，成就突出，影响最大。《两都赋》奠定了班固在辞赋史上的地位，也确立了京都大赋的创作格局，成为后世效仿的典范。《两都赋》的艺术特色，主要包括以下内容：\n\n一、从林苑描写到京都铺叙-辞赋题材范围的拓展\n\n东汉之前的散体大赋题材多限于宫廷苑囿；到了东汉京都大赋的出现，其写作题材才得到了相当的空间拓展。班固的《两都赋》分为《西都赋》和《东都赋》两篇，实为上、下篇。作品虚拟“西都宾”“东都主人”两个人物，通过他们的谈话构成过渡；同时，两个人物分别代表都雍、都洛两种不同的态度，而在宾主的设定之间，作者的立场明晰可辨。《两都赋》虽然在体制和形式上模仿了司马相如的《子虚赋》和《上林赋》，但其选取的题材却由林苑品物之盛转入了京都法度之美，由宫廷转向了京都。\n\n二、下篇通篇讽喻-对“劝百讽一”结构模式的突破\n\n以往的辞赋，对其不赞成的社会现象常常极尽铺张描写之能事，而作者的正面主张则在文章结尾处画龙点睛，这种表现模式被责为“劝百讽一”，在《两都赋》中，作者一改传统表现方法中“劝”与“讽”篇幅相差悬殊的结构模式，其下篇《东都赋》通篇是讽喻、诱导。作者的主张见解十分自然地融入对东都各方面事物的陈述中，表现出他的较为进步的京都观。这是他对赋的艺术表现和篇章结构关系的重大突破，也是他推动汉代文学思想发展的可贵贡献。\n\n三、回环往复和错落有致-铺叙手法及详略安排的别致\n\n《两都赋》按空间方位进行铺排时，由远及近，由近及远，又由外到内，由内到外，采用了回环往复的笔法。在对长城外景观进行铺叙时，展示的是总体风貌，是宏观审视；而对城内所作的铺叙，则有大量的具体描写，比较深入细致。整篇作品显得井然有序，错落有致。《两都赋》所选用的表现手法根据其要展现的具体内容而作调整，详略安排别具匠心。《西都赋》铺叙较详，其艺术风格更近司马相如，汪洋恣肆、富丽详赡，具有较强的艺术表现力；《东都赋》铺叙较略，其表现手法较为平实，语言风格也较趋典雅，而法度风范随处可见。\n\n四、法度之美-理想色彩和理性因素的渗透\n\n《两都赋》对天子风范的向往和描绘，带有鲜明的理想化的色彩，《两都赋》加强了作品的理性因素的透入，作者把西都、东都的选择，以及人们感受、主张的差异根源，归结为法度的不同，较为深刻地体现了作者的政治观念和历史观念，使内容显得比较厚重。在艺术表现方面，赋作的现实成分相对增加，而虚夸的成分减少，以更为中允的笔墨描写都市的风貌，这种写作风格也赋予了作品较强的理性色彩。","keywords":"题材范围 结构模式 铺叙手法 法度之美","note":"京都赋相关知识可能会综合考查，也可能将班固和张衡相关知识分开进行考查。大家要注意在总体汉文学史发展中京都赋的过渡意义。另外，《汉书》仍然是班固最大的命题点，这一点大家需要明确。京都赋也是一个比较关键的名词解释，大家要注意一下。"},{"id":"60","stars":"★★","title":"张衡的《二京赋》具有怎样的艺术特色","body":"东汉张衡的《二京赋》是继班固的《两都赋》后的又一篇京都大赋的力作。它的艺术特色主要包括以下内容：\n\n一、“极长篇之极轨”与题材范围的拓展\n\n《二京赋》紧随班固之后，以规模宏大被称为京都赋之极轨，推动了以都洛、都雍这一议论焦点为题材的文学创作的发展。与其宏阔规模和体制篇幅相适应，《二京赋》在题材范围上又有了新的拓展，赋作加入了京都生活中市井风情的描写。赋作不但叙述了都市商贾、游侠、辩士的社会活动，还描写了角抵百戏的演出情况，反映了都市各方面的社会风俗和世态人情，涉及的民俗事象之丰富令人叹为观止。《二京赋》以《西京赋》《东京赋》构成上、下篇。《西京赋》陈述朝会、郊祀、祭庙、亲农、大射、田猎等上层统治者的盛典礼会，涉及的社会面极为广阔。从这一意义上讲，《二京赋》成为京都大赋的绝响。\n\n二、理性精神和叙述过程中议论说理的引入\n\n《后汉书·张衡传》说：“永元中，时天下承平日久，自王侯以下，莫不逾侈，衡乃拟班固《两都》，作《二京赋》，因以讽谏。精思傅会，十年乃成。”可见《二京赋》的创作宗旨是讽谏奢侈的社会风气。与其创作宗旨相配合，《二京赋》的规谏讽谕切直，并在铺叙的过程中引入了议论说理，这也是其独特之处。张衡的赋作虽然贯注了自己真切的思想感情，但是描写京都的民俗事象和朝廷礼仪还是秉持了理性的态度，这与东汉人性觉醒和理性思潮复苏有关。\n\n三、景物描写的诗化意境\n\n张衡具备多方面的艺术才能，不仅擅作辞赋，而且工于诗歌，既是赋家又是诗人。因此《二京赋》中的景物描写体现了东汉清新自然的诗化意境，又与他的抒情小赋《归田赋》笔法相类，带有一定的抒情色彩。例如“濯龙芳林，九谷八溪。芙蓉覆水，秋兰被涯”一段文字，意境清新，格调明丽，富于美感，充满情趣，开创汉赋前所未有之境界。\n\n四、对班固《两都赋》铺叙手法的借鉴和超越\n\n《二京赋》在体制结构、谋篇布局、艺术手法等方面都明显地模拟了班固的《两都赋》，然而张衡“精思傅会，十年乃成”，其精心琢磨的程度还是超过了《两都赋》。《二京赋》的体制更为宏阔，铺陈描写更为细腻。值得注意的是，《两都赋》运用发展了由远及近、由近及远，再由外到内、由内到外两次回环往复的铺叙，而《二京赋》只经历由外到内，再由内到外一次推移。尽管《二京赋》的具体描写显得更为精致细密，但铺陈程序较之《两都赋》已经有意简化。","keywords":"题材拓展 理性精神 景物描写 借鉴超越","note":"张衡《二京赋》单独命题可能性不大，大概率会联合《两都赋》进行命题，反倒张衡《归田赋》具有开拓意义，需要重点理解。"},{"id":"61","stars":"★★","title":"张衡的《归田赋》有哪些艺术特色？它在汉赋发展史上具有怎样的意义","body":"东汉辞赋家张衡到了晚年，经历了宦海浮沉，深感世路艰难，又自知壮志难酬，于是产生了归隐田居的愿望，在这种心境下，他创作了抒情小赋《归田赋》。全赋抒发了一位耿介多才的士大夫对现实失望之后心慕田园的真切情怀。\n\n一、《归田赋》的艺术特色\n\n（一）诗化意境和情志表现\n\n《归田赋》将自己的心绪融合到了环境的描写之中，所述之意与所写之境相互结合，形成了和谐优美的诗化意境，作者这种心灵憧憬的自由美好和现实的幽暗压抑形成了鲜明的比照。《归田赋》的写景状物主要用于抒情，叙事议论则主要用于言志，作品运用了议论、用典、铺叙等多种表现手法来抒情述志，其情志的表达效果充分而生动。\n\n（二）对田园景象的描绘\n\n《归田赋》中的写景部分，尤为令人神往：“仲春令月，时和气清，原隰郁茂，百草滋荣。”张衡笔下的田园景象清丽明快，和谐优美，充溢着浓郁的自然情趣和生活气息，表现出他对顺情适性的人生境界的向往。这种美好的田园景象与作者身处的官场氛围形成了鲜明的对比，提升了作品所蕴涵的思想境界。\n\n（三）体制特点和语言风格\n\n《归田赋》篇制短小，形式整齐，全赋用四六句式，且多排偶，韵律和谐，是汉代较早出现的比较成熟的骈体赋；全篇简短明畅，平实自然，情味悠长，摆脱了铺叙排比的繁重陈规。《归田赋》的语言清新明丽，工致典雅，与赋作所采用的艺术表现形式相配合，也与作品所展现的环境和心情等内容相适应，取得了独特的成就。\n\n二、《归田赋》在汉赋发展史上的意义\n\n（一）《归田赋》是汉赋发展史上现存的第一篇比较完整的抒情小赋，由宫殿游猎的铺陈转变为个人胸怀与情趣的抒发，是体现汉代赋风转变的标志性作品。自此以后，东汉抒情小赋大量出现，对魏晋抒情赋的发展产生了重要的影响。\n\n（二）《归田赋》骈偶成分较多，在形式上体现了骈体文“骈四俪六”的典型特征，是辞赋史上现存的第一篇比较成熟的骈赋。\n\n（三）《归田赋》是我国文学史上第一篇以写田园隐居乐趣为主题的作品，对晋人陶渊明《归去来兮辞》产生的影响尤为明显。\n\n总之，《归田赋》对以后辞赋和诗文的发展都产生了深远的影响。","keywords":"诗化意境 田园描绘 体制和语言特点","note":"此题可单独命题，也可对整个“抒情小赋”的来龙去脉命题。《归田赋》作为抒情小赋发展史上十分重要的一部作品，艺术特色和地位，需要我们准确掌握。同时，其他的一些抒情小赋我们也需要有所了解。"},{"id":"62","stars":"★★★","title":"抒情小赋的思想内容与审美特色","body":"在两汉王朝四百多年的历史中，汉赋内容经历了从汉初的反思历史，至西汉盛世的歌功颂德、劝百讽一，到东汉末年，汉王朝的统治已走到崩溃的边缘，士人已经失去了参与政治活动的机会，因此，文学界的批判潮流再次涌动。这一时期的文学创作，在辞赋这种文体里，除了汉大赋被继承外，又出现了新的变化-抒情小赋悄然兴起，涌现出许多名家名作。如班彪的《北征赋》、蔡邕的《述行赋》、班固的《幽通赋》、张衡的《思玄赋》和《归田赋》、赵壹的《刺世疾邪赋》、祢衡的《鹦鹉赋》等等。\n\n一、抒情小赋的内容\n\n（一）反映黑暗现实，抒发愤懑不平\n\n东汉中后期，社会现实黑暗，统治集团又采取高压政策，士人的心性普遍受到压抑。尤其到了东汉末年的桓、灵时期，外戚和宦官交替专权，官场污浊，贤愚错位，人情虚伪。物不得其平则鸣，表现在抒情小赋的内容上，就是越来越多的士人运用赋来反映社会的动乱及黑暗，抒发他们压抑激愤的感情。蔡邕的《述行赋》作于桓帝延熹二年（159)，当时桓帝与宦官单超等合谋诛杀把持朝政二十余年的梁翼，五侯之一宦官徐璜为讨好汉桓帝，听说蔡邕善琴，令其到京，蔡邕内心不愿，但也只能从陈留出发，到偃师就托病不前，后返陈留。蔡邕途中所经都是先朝故地，其在赋中于历史事实的叙述中寄寓了自己的悲愤之情。此外，东汉末年赵壹的《刺世疾邪赋》直将矛头指向当时的统治者。作品开篇即言自春秋以后圣明理想的时代早已一去不返，而“德政”“赏罚”都已无法挽救当前的社会。其后，他列举了小人得志、贤者失位、是非颠倒等各种龌龊现象，并指出“实执政之匪贤”，由刺世而至与世道决绝。此外，还有其他一些作品也表现了对王朝兴衰、世道浑浊的不满与悲愤。\n\n（二）表现出世归隐的思想\n\n东汉时期在思想界，维持世道人心的西汉经学开始衰落，道家思想又重新趋于活跃。因道家倡导以人合天，主张无为清静，对生命价值积极肯定，这些都促进了人的生命意识的觉醒。东汉末年的衰世激发了士人力挽狂澜的情怀，但是当士人发现他们维护的皇权带给他们的只是血光之灾和囹圈之祸，而又仕途不顺，社会不可挽救时，他们逐渐转而注重于个体的生命价值，此时士人中隐逸和出世思想抬头。\n\n出世归隐思想体现在辞赋创作上，典型的就是张衡的《归田赋》，此赋真正宣告了抒情小赋的诞生。张衡因亲历污浊黑暗的官场朝廷和奸党的排斥异己，目睹权贵的骄奢淫逸，上书乞归，写下了这篇赋。在赋中他描绘了一个明丽祥和、情趣盎然的田园世界，着意追求一种顺情适性、自我身心与外在环境和谐融洽的人生境界。此外，表现悲观厌世和隐居的思想是抒情小赋的又一内容。\n\n（三）重视抒写自我心性，出现咏物和爱情的主题\n\n汉末，在经学式微及庄骚思想再度回归的双向影响下，文人个性的解放及自我意识的觉醒带动了文学创作思潮的变迁，作品表现的内容由浓墨重彩地描摹盛世，转变为重视对自我心性的抒写。汉赋也由追求词藻华丽、以大为美，转变为以满足自我审美愉悦为主旨。《后汉书》中记载，东汉中后期有许多文人，学富五车、多才多艺，在琴、棋、书、画、舞蹈、音乐等众多方面都有极深的造诣，尤其是中期的马融和后期的蔡邕，因而东汉中后期的文学作品在题材、体裁方面多有创新。在多元化的审美追求和自娱世风的共同促使下，文人们创作了很多咏物赋以满足自身精神上的愉悦。如马融有《长笛赋》《围棋赋》《琴赋》等辞赋，蔡邕有《弹琴赋》《弹棋赋》《团扇赋》《笔赋》等赋。此外，蔡邕还将男女情爱的主题引入文学作品之中，如在《青衣赋》中，他对青衣的美貌进行了优美的描写，并抒发了自己的爱慕之情。咏物和爱情的表现主题在抒情小赋中的出现是文人人格的独立所体现出来的创作意识的自觉，同时也是许多朝代末期，由于社会动荡、朝政腐败，文人政治理想无法实现所造成的文学作品主题的一种改变。\n\n二、抒情小赋的艺术特色\n\n抒情小赋与汉大赋在艺术特色上迥然不同。汉大赋多长篇巨制，运用散文句式和主客问答的形式，以宫殿、政事等为主要描写对象，并且多歌功颂德，曲终奏雅，“劝百讽一”，喜用华丽辞藻。而抒情小赋则不然，它的艺术特色，主要包括以下内容：\n\n（一）抒情小赋篇幅短小，重在抒情写志，语言流畅朴实，多直抒胸臆，犀利明快。如张衡的《归田赋》全文四个段落二百多字，分为归田的原因和归田的快乐两大部分，简洁明快，没有汉大赋的铺张扬厉和呆板凝滞。“游都邑以永久，无明略以佐时；徒临川以羡鱼，俟河清乎未期。感蔡子之慷慨，从唐生以决疑。谅天道之微昧，追渔父以同嬉；超埃尘以遐逝，与世事乎长辞”。短短六十个字已经委婉表达了自己希望有所作为，但是官场黑暗、怀才不遇，所以决意归隐。\n\n汉大赋赞誉的成分多，批评的成分少，相比较而言，抒情小赋言志抒情更直截了当，如赵壹的《刺世疾邪赋》：“故法禁屈挠于势族，恩泽不逮于单门。宁饥寒于尧舜之荒岁兮，不饱暖于当今之丰年。”赵壹在此赋中对汉代的政治进行了大胆的批判，就连人们通常所称颂的文、景盛世也未放过。\n\n（二）抒情小赋题材广泛，形式灵活多样。王褒的《洞箫赋》是汉代咏物赋的代表作品，写洞箫曲调悲凉哀怨，作者从它的制作材料-竹子恶劣的生长环境，与洞箫相伴的孤独悲鸣的飞禽走兽，以及吹奏者是苦难的盲人入手去表现洞箫声悲戚的特质。这篇赋独辟蹊径，以悲为美，是乐器赋的奠基之作。东汉末年宦官专权，政治腐败，赵壹的《穷鸟赋》、祢衡的《鹦鹉赋》运用拟人手法，物我交融，抒发作者自己的思想情志，展现出咏物赋的另类特色。赵壹生性刚直，屡次抨击，《穷鸟赋》就是赵壹犯死罪被友人救回，感恩而写，赋中借一穷鸟陷入困境，幸获贤人救济的遭遇以自况，一抒怨愤，一表感恩，\n\n此赋运用拟人手法，物我合一。《鹦鹉赋》以聪慧高贵的鹦鹉被人捕获，身处笼槛，抛乡弃子，前景堪忧的拟人化手法来表现自己内心的哀怨以及感恩报德之心。\n\n（三）抒情小赋语言多运用骈偶句式，对仗工整，有明显的韵律美，像散文诗的语言。例如张衡的《归田赋》：“于是仲春令月，时和气清；原隰郁茂，百草滋荣。王睢鼓翼，鸧鹒哀鸣；交颈颉颃，关关嘤嘤”等等，语言清新明快。另外，抒情小赋在具体的写作过程中还时常一边写景一边抒情，例如蔡邕《述行赋》：“玄云黯以凝结兮，集零雨之溱溱。路阻败而无轨兮，涂泞溺而难遵。......伫淹留以候霁兮，感忧心之殷殷。并日夜而遥思兮，宵不寐以极晨。”\n\n抒情小赋是汉代文学的一枝奇葩，它在内容和艺术特色上都对汉大赋有所突破和创新，其创新是文人人格的独立和自觉的创作意识在文学上的体现，它为魏晋南北朝时期文学创作更加注重个性化、抒情性的发展导夫先路。","keywords":"黑暗现实 出世归隐 咏物和爱情 直抒胸臆 题材广泛 对仗工整","note":"凡新变必有命题，近年来抒情小赋的考查频率不断上升，相关内容需要大家多加掌握。袁行霈版教材将抒情小赋单独拿出来与骚体赋、汉大赋并列，而马工程教材则将其归入到骚体赋之中与散体赋并列，大家要结合目标院校的参考教材灵活应对。"},{"id":"63","stars":"★★★★","title":"汉赋的产生发展及演变过程","body":"赋，原本是《诗经》六艺之一，是一种铺陈直言的手法。而作为文学体裁的赋，正是运用这一手法而写成的。刘勰在《文心雕龙·诠赋》篇中说：“赋者，铺也，铺采摛文，体物写志也。”铺采摛文，用华丽的辞彩进行铺陈描述，这概括了赋的形式；体物写志，一是对事物的刻画，一是抒写作者的情怀，这概括了赋的内容。\n\n现存最早的以赋名篇的，是荀子的《赋篇》，写礼、知、云、蚕、箴五样东西，运用暗示、象征等手法，与铺陈手法不同。而直接影响汉赋的，是屈原的作品，譬如《招魂》对四方上下及楚国宫廷的铺陈夸张地描绘，《史记·屈原列传》说：“屈原既死之后，楚有宋玉、唐勒、景差之徒者，皆好辞而以赋见称。”这说明屈原的弟子已完成由辞到赋的转变。\n\n秦朝有杂赋九篇，至汉初，赋已逐渐兴盛。\n\n汉赋是汉代文学的代表，是一种有韵散文。其特点是韵散结合，专事铺叙。其内容可分为五类：渲染宫殿城市，描写帝王游猎，叙述旅行经历，抒发不遇之情，杂谈禽兽草木。前二者为汉赋代表。\n\n汉初赋家继承楚辞余绪，流行“骚体赋”，其后逐渐演变为有独立特征的散体大赋，这是汉赋的主体，也是汉赋最兴盛的阶段。东汉中叶以后，散体大赋逐渐衰微，抒情、言志小赋开始兴起。汉赋的发展可以分为三个阶段：\n\n一、自汉高祖初年至武帝初年\n\n当时所谓“大汉初定，日不暇给”，封建统治者在思想文化上禁锢不严，儒家思想尚未占据统治地位。当时诸王纳士，著书立说，文化思想还比较活跃。这一时期的辞赋，主要仍是继承《楚辞》传统，内容多是抒发作者的政治见解和身世感慨，在形式上初步有所转变。这时较有成就和代表性的作家主要是贾谊，此外还有淮南小山和枚乘等人。\n\n贾谊的《吊屈原赋》是借悼念屈原抒发愤慨，虽吊逝者，实为自喻，《鵩鸟赋》是一篇寓志遣怀之作，散文的气味浓厚，预示了新的赋体正在孕育形成。\n\n贾谊之后，骚体赋创作后继有人，即便在汉大赋如日中天，光芒掩罩的武、宣之世，骚体赋的创作也从未间断过，与汉大赋一明一暗，并行不悖。其中如淮南小山的《招隐士》，董仲舒的《士不遇赋》，司马迁的《悲士不遇赋》，司马相如的《大人赋》《哀秦二世赋》《长门赋》，扬雄的《太玄赋》等都是优秀的作品。另外，在贾谊之后，还出现了一系列以悼念屈原为主题的骚体赋，诸如庄忌的《哀时命》、东方朔的《七谏》、王褒的《九怀》、刘向的《九叹》、王逸的《九思》等。尤其是《九怀》《九叹》《九思》等作品，一脉相承，九章成篇，体制固定，主题相类，作为骚体赋的一种体制，虽然规模未大，却具备了独有的格局，与大赋中的“七体”互相辉映，是为“九体”。在这些骚体赋作家中，特别值得一提的是淮南小山和司马相如。\n\n文景时代，各路诸侯聚揽宾客，大兴养士之风，形成了多个以诸侯王为中心的文学群体，代表有梁园文学群体，其中枚乘是杰出代表，代表作品《七发》，“《七发》者，说七事以起发太子也”，劝诫膏粱子弟，也是劝诫世人。《七发》鸿篇巨制，韵散结合；采用设为问答的形式结纂全篇；笔墨夸张，描绘精细；以叙事状物为主，辞藻繁富，多比喻和叠字，标志着汉大赋体制的形成。\n\n二、西汉武帝初年至东汉中叶，共二百多年时间，其中从武帝至宣帝的九十年间，是汉赋发展的鼎盛期\n\n这一时期的赋作基本上同《诗经》的雅、颂一样，是一种宫廷文学，是为封建统治阶级“润色鸿业”服务的，内容上往往既歌颂夸耀于前，又讽谕劝戒于后，所谓“劝百讽一”。\n\n（一）司马相如的《子虚赋》《上林赋》是其代表作，这两篇赋虽然创作时间相去十年，但内容相连，一贯而下，结体严谨，可作一篇来看，充满浪漫色彩和壮阔画面，是汉赋中最优秀的作品，后世赋家争相效仿而又无法企及。\n\n（二）扬雄的四篇代表作，即“扬雄四赋”，又称“四大赋”：《河东赋》《甘泉赋》《羽猎赋》《长杨赋》。四赋模仿司马相如《子虚赋》和《上林赋》的痕迹十分明显，但又有别于司马相如，显示出开创精神，从而独具魅力，其中《甘泉赋》艺术成就最高。扬雄后期的作品《解嘲》《逐贫赋》也较为有名，其辞赋理论，也对后世产生了极为深远的影响。\n\n（三）西汉赋坛，较为著名的赋家还有武帝时的东方朔和枚皋，宣帝时的王褒以及与扬雄大略同时的刘向父子。\n\n（1）东方朔的《答客难》抒发怀才不遇之感。赋中对汉代文士不得志的状况揭示得非常深刻，是现存汉代最早以遇与不遇为主题的设辞类作品。另外东方朔还有《非有先生论》，也是发愤述志的作品。\n\n（2）枚皋是西汉赋坛创作最多的作家，但作品罕有流传。\n\n（3）王褒是宣帝朝成绩最突出的赋家。代表作品是《洞箫赋》，对枚乘的《七发》有关乐器的描写有所继承，是汉代独立成篇的乐器赋的奠基之作。在他之后出现的汉代乐器赋基本都是以悲为美，并且也是将生命一体化观念灌注于作品。“箫声咽”是中国古代文学的一个原型，《洞箫赋》对其有生成开创之功。\n\n从西汉后期开始，相继出现一批纪实性的述行赋。由于作者的遭遇和所处历史阶段客观形势的差异，抒发的感情又不尽相同，按其性质可分为治世之作、衰世之作和乱世之作。\n\n汉代纪实性述行赋的开山之作是刘歆的《遂初赋》，是衰世文人的感叹，关注的是社会治乱问题。班彪《北征赋》是以国家兴亡为中心的乱世之作。班昭的《东征赋》内容主要是承平之世人们关注的问题和努力的目标。蔡邕《述行赋》则是衰世叹治乱的作品。\n\n西汉晚期至东汉早期，作家创作意识发生转变，思想内容和审美情趣方面出现新的迹象和发展，鲜明标志之一便是京都赋的崛起。这开始于扬雄的《蜀都赋》，赋风转变的重要标志是杜笃《论都赋》，其后有傅毅的《洛都赋》《反都赋》，张衡的《二京赋》《南都赋》。成就最突出的是班固的《两都赋》和张衡的《二京赋》。\n\n《两都赋》分为《西都赋》和《东都赋》两篇，实为上、下章，肯定了定都洛阳的正确性，极力宣扬崇文尚礼、“法度”为重的思想。《两都赋》奠定了班固在辞赋史上的地位，确立了京都赋的创作格局，成为后世学习的典范。\n\n《二京赋》上、下篇分别为《西京赋》《东京赋》，借“凭虚公子”和“安处先生”对答成篇。《西京赋》铺叙的品物之盛，再现了西京的繁荣富庶，体现了恢弘巨丽、雄壮无比的盛世气魄。但对穷奢极侈的都市景观，是有所批判的。《东京赋》表现了对西京奢靡生活的否定，表现东都礼治，有力地阐明了作者的创作意图和政治主张。《二京赋》理性精神和充实的社会内容结合得非常完美，长篇铺陈，力求面面俱到，在思想和艺术上具有不可忽视的价值。\n\n三、东汉中叶至东汉末年\n\n东汉中叶以后，宦官外戚争权，政治日趋腐败，加以帝王贵族奢侈成风，横征暴敛，社会动乱频仍，民生凋敝。文人们失去了奋发扬厉的精神，失望、悲愤，乃至忧国忧民的情绪成为他们思想的基调，这就促使赋的题材有所扩大，抒情咏物的短篇小赋开始兴起，赋的风格有所转变，这种情况的出现始于张衡。\n\n张衡《归田赋》宣告抒情小赋的诞生，并充分展示了其迷人的魅力。充满自然情趣的田园景象，还我本真地表现出来，却从容闲淡。语言清新晓畅，挥洒自如，骈偶恰到好处，为后世骈体赋创作了一个典范。东汉末赵壹《刺世疾邪赋》和祢衡的《鹦鹉赋》也是抒情小赋的名篇。","keywords":"由辞到赋 骚体赋 汉大赋 述行赋 京都赋 抒情小赋","note":"这一题内容比较庞杂，但脉络还是很清晰的，主要是以时间为线索（需要大家对两汉史有所了解），梳理了汉代辞赋发展的不同阶段，以及每个阶段代表性的作家作品。类似的题目在近年来的考查中出现的频率越来越高，大家要对相关知识进行综合把握。"},{"id":"64","stars":"★★★★","title":"“乐府”概念是如何演变的","body":"“乐府”一词，在古代具有多种含义，确切来说，“乐府”的含义是随着时代的变化不断发展着的。\n\n乐府初设于秦，是当时少府下辖的机构，正式成立于西汉汉武帝时期，职责是采集民间歌谣或文人的诗来配乐，以备朝廷祭祀或宴会时演奏之用。乐府搜集整理的诗歌，后世叫“乐府诗”，或简称“乐府”。它是继《诗经》《楚辞》而起的一种新诗体。\n\n一、先秦时期\n\n以“乐府”为这种机构的名称，约始于秦代，一九七七年秦始皇陵附近出土的编钟上，铸有“乐府”二字。秦朝首次设置了音乐机构-乐府，将“六国之乐”集中于咸阳宫中，并广泛收集各国民间音乐，创作一些为秦王朝服务的乐曲。（李凡说：秦代乐府机构及制度史料并没有完整记载，只知乐府初设于秦）\n\n二、两汉时期\n\n两汉乐府诗是指由朝廷乐府系统或相当于乐府职能的音乐管理机关搜集保存而流传下来的汉代诗歌。\n\n（一）西汉时期\n\n汉承秦制，也设有专门的乐府机构。史载惠帝时有“乐府令”之职。乐府在西汉哀帝之前是朝廷常设的音乐管理部门，行政长官是乐府令，隶属于少府，是少府所管辖的十六令丞之一。\n\n西汉负责乐府工作的有两种，分别是乐府和太乐，乐府执掌天子及朝廷平时所用的乐章，它不是传统古乐而是以楚声为主的流行曲调。太乐主管的郊庙之乐，是前代流传下来的雅颂古乐。\n\n最初用楚声演唱的乐府诗是《安世房中歌》17章，另外，汉高祖刘邦的《大风歌》在祭祀沛宫原庙时用楚声演唱，也由乐府机关负责管理。西汉从惠帝到文、景之世，见于记载的乐府歌诗主要是以上两种。\n\n西汉乐府的扩充和发展是在武帝时期，乐府的职能在武帝时进一步加强，它除了组织文人创作朝廷所用的歌诗外，还广泛搜集各地歌谣。许多民间歌谣在乐府演唱，得以流传下来。文人所创作的乐府歌诗也不再像《安世房中歌》那样仅限于享宴所用，还在祭天时演唱，乐府诗的地位明显提高。据《汉书·百官公卿表》记载，武帝时，乐府令下设三丞。又据《汉书·礼乐志》所言，至成帝末年，乐府人员多达八百余人，成为一个规模庞大的音乐机构。武帝至成帝期间的一百多年，是乐府的昌盛期。哀帝登基，下诏罢乐府官，大量裁减乐府人员，从此以后，汉代再没有乐府建制。\n\n（二）东汉时期\n\n东汉管理音乐的机关也分属两个系统，一个是太予乐署，行政长官是太予令，相当于西汉的太乐令，隶属于太常卿。一个是黄门鼓吹署，由承华令掌管，隶属于少府。黄门鼓吹之名西汉就已有之，它和乐府的关系非常密切。至东汉，由承华令掌管的黄门鼓吹署，为天子享宴群臣提供歌诗，实际上发挥着西汉乐府的作用，东汉的乐府诗歌主要是由黄门鼓吹署搜集、演唱，因此得以保存。\n\n三、后续发展\n\n魏晋六朝时，却将乐府所唱的诗-汉代原叫“歌诗”的-也叫“乐府”，于是所谓乐府便由机关的名称变为一种带有音乐性的诗体之名称（李凡说：乐府的复意始于此）。如《文选》于骚、赋、诗之外另立“乐府”一门；《文心雕龙》于《明诗》之外又特标《乐府》一篇，并说“乐府者，声依永，律和声也”，都是这一演变的标志。六朝人虽把乐府看成一种诗体，但着眼点仍在音乐上。\n\n唐代的诗人面对乐府诗歌，则又撇开音乐，而注重其社会内容，如元结的《系乐府》、白居易的《新乐府》、皮日休的《正乐府》等，都未入乐，但都自名为乐府，于是所谓乐府又一变而为一种批判现实的讽刺诗。\n\n宋元以后，也有称词、曲为乐府的，则又离开了唐人所揭示出来的乐府的精神实质，这也是值得我们注意的。","keywords":"音乐机关 时期演变","note":"①在语言学中，存在“古今异义”这一现象；而在文学史上，同一名称在不同时期有其不同的内涵。了解“乐府”从一个音乐机关发展为一种诗体的变化，有助于我们去更好地体会、记忆相关知识。②乐府和汉乐府是两个概念，大家要注意。③乐府双璧可能考名词解释，大家要注意一下。④郭茂倩的《乐府诗集》按音乐将乐府诗分为了十二类，我们可以了解一下，具体题目可以在李凡文学正版群领取。"},{"id":"65","stars":"★★★","title":"汉乐府“感于哀乐，缘事而发”的情怀特征（25浙江大学、26西华师范大学）【答题框架】","body":"《汉书·艺文志》在叙述西汉乐府歌诗时写道：“自孝武立乐府而采歌谣，于是有代、赵之讴，秦、楚之风。皆感于哀乐，缘事而发。”两汉乐府诗都是创作主体的有感而发，具有很强的针对性。乐府诗所表现的也多是人们普遍关心的敏感问题，道出了那个时代的苦与乐、爱与恨，以及对于生与死的人生态度。这时期的乐府诗，主要包括以下方面的内容：\n\n一、反映社会最底层平民百姓的呻吟呼号\n\n《妇病行》叙述妻死儿幼，丈夫和儿子饥寒交迫的悲惨情况，病妇临终遗嘱伤心刺骨，而丈夫无力抚养遗孤的愧疚、悲哀，也渗透于字里行间。《孤儿行》中，一个孤苦伶仃的孤儿因不堪忍受哥嫂的虐待，竟然有生不如死的想法，小小年纪便对命运已经完全丧失信心。《东门行》写一个城市贫民为贫困所逼迫而决心拔剑反抗的情景，男主人公在做出最终抉择之后，不得不割舍夫妻之爱、儿女之情，伤感之情溢于言表。\n\n两汉乐府诗在表现平民百姓疾苦时，兼顾物质生活的饥寒交迫和精神世界的严重创伤。尤其可贵的是，诗的作者对于这些在死亡线上挣扎的平民百姓寄予深切的同情，是以恻隐之心申诉下层贫民的不幸遭遇。\n\n二、反映富贵之家的奢华生活\n\n同是收录在相和歌辞中的《鸡鸣》《相逢行》《长安有狭斜行》三诗，与《东门行》等三篇作品迥然有别，这三首诗基本内容相同，都是以富贵之家为表现对象。《相逢行》在渲染主人富有的同时，还点出了他的尊贵身份：“兄弟两三人，中子为侍郎。”这是一个既富且贵的家庭，黄金为门，白玉为堂，是富埒王侯的标志，而侍郎是皇宫的禁卫官或天子左右侍从，是皇帝信任的近臣，其特殊地位不是普通朝廷官员所能相比。《鸡鸣》和《长安有狭斜行》把表现对象的显赫地位渲染得更加充分，诗中的富贵之家是兄弟几人同时宦达，而且是秩达二千石的高官显宦。上述三诗对富贵之家气象的展现，对中国古代文学创作具有示范性，后来许多同类作品都是以此作为蓝本。三妇织锦鼓瑟的段落，则被单独划分出去，名为“三妇艳”，在古代乐府诗中频繁重复出现，成为富贵之家的象征，积淀成一种具有特定含义的符号。\n\n三、表现女主人公爱与恨的坦率表白\n\n爱情婚姻题材作品在两汉乐府诗中占有较大比重，这些诗篇多是来自民间，或是出自下层文人之手，因此，在表达婚恋方面的爱与恨时，都显得大胆泼辣，毫不掩饰。《上邪》是女子的自誓之词，对自己的意中人爱得真挚、热烈。《有所思》写女子听到对方变心，由爱到恨，果断地与他分手。《孔雀东南飞》叙述的是焦仲卿、刘兰芝的婚姻悲剧。《上山采蘼芜》讲述弃妇与故夫的邂逅。《羽林郎》和《陌上桑》写女子拒绝有权势男子的调戏。\n\n四、表现个体生命乐生恶死的愿望\n\n如何超越个体生命的有限性，是古人苦苦思索的重要课题，两汉乐府诗在这个领域较之前代文学作品有更深的开掘，把创作主体乐生恶死的愿望表现得特别充分。\n\n首先是对死亡的厌恶之情。乐歌的尚悲，在汉代成为一种时代风气，甚至在庆贺新婚的宴会上，也会唱起送葬歌。《薤露行》直接感伤生之短暂，死之容易，写尽死亡的悲哀。《蒿里行》写尽死后灵魂的苦惨，并表现出鬼伯催促濒死者的情节。\n\n其次是长生不老的愿望。两汉乐府诗以虚幻的形式把乐生愿望寄托在与神灵的沟通上。《艳歌》描绘出一幅进入天国的理想画面。诗人幻想自己升上云霄，来到神界仙乡，成为那里的贵宾。《练时日》和《华烨烨》是郊祀歌，写神界的精灵来到人间，和创作主体生活在同一世界。","keywords":"底层平民百姓的呻吟呼号 富贵之家的奢华生活 爱与恨的坦率表白 乐生恶死","note":"这道题乍一看似乎无从下手，但只要稍微思索一下便会明白过来，这是在让大家讨论汉乐府民歌的思想内容。汉乐府民歌的思想内容比较好理解，因为是民歌，自然而然表现了底层人民最简单最朴素的愿望与情感，和现在的流行歌曲差不多，表现生活中的苦与乐、爱与恨等，从这一角度看，汉乐府具有很强的现实意义。"},{"id":"66","stars":"★★★","title":"试分析汉乐府民歌的艺术特色","body":"作为中国诗歌史上承《诗经》、启盛唐的重要桥梁，汉乐府民歌以其独特的艺术品格和深刻的社会关怀，在古典文学长河中树立起一座不朽的丰碑。其艺术特色，主要表现在以下方面：\n\n一、汉乐府民歌最突出的特点是叙事生动\n\n这一点在明代徐祯卿的《谈艺录》中有所提及，《诗经》中绝大部分作品是抒情诗，很少带有故事情节，而汉乐府民歌拥有丰富多彩、充满想象力的叙述内容，从《孔雀东南飞》到《陌上桑》，都是充满艺术魅力的优秀民歌。《十五从军征》深入剖析了一位老兵的艰辛旅程，从细微的情节出发，把汉代的军事体系暴露无遗。《艳歌行》“翩翩堂前燕，冬藏夏来见。兄妹两三人，流宕在他县。故衣谁当补？”简单几句就描绘了一个漂泊的故事。\n\n二、汉乐府民歌的语言质朴自然，生动活泼，富于生活气息\n\n汉乐府民歌的语言简洁明了，充满了浓郁的乡土风味。《白头吟》以“竹竿何袅袅，鱼尾何簁簁”将爱情的美好与忠贞的精神表达得淋漓尽致。《古歌》以“离家日渐远，衣带日趋缓，情思不能言，肠中车轮转”为题，描绘出深沉的思念之痛，其语言简洁有力，蕴含着深刻的意蕴。\n\n三、汉乐府民歌中的有些作品带有浪漫主义色彩\n\n如《上邪》：“上邪，我欲与君相知，长命无绝衰。山无陵，江水为竭，冬雷阵阵，夏雨雪，天地合，乃敢与君绝！”诗中用火山爆发般的激情和高度夸张的比喻表达对爱情的坚贞；《战城南》《乌生》《枯鱼过河泣》中展开了奇特的想象，或让死者与乌鸦对话，或让乌鸦自诉遭遇，或假托枯鱼告诫同伴，令人拍案惊奇；《陌上桑》中则把女主人公的美丽、机智和坚贞都做了理想化的表现，其情节也幽默风趣，带有喜剧性。这些浪漫主义的表现正是民歌的突出特点。\n\n四、汉乐府民歌的形式灵活自由，篇章句式变化多样\n\n这些民歌打破了《诗经》中传统的四言韵律，并且发展出了各种不同的语法结构，如四言、七言、八言等，更具有表现力。\n\n汉乐府民歌延续《诗经》“饥者歌其食，劳者歌其事”的精髓，其勇敢地揭示社会现实的态度，在中国文学史上留下了深远的影响。\n\n汉乐府民歌是中国古典叙事诗的重要组成部分，其独特的叙事方式和技巧，为后世作家提供了宝贵的启示，并在文学史上留下了深远的影响。五言诗的出现对文人的创作产生了深远的影响，而杂言诗则在诗歌史上占据着重要的地位，并且一直被后世的诗人们广泛使用。","keywords":"叙事性 质朴自然 浪漫主义 形式灵活自由 揭示社会现实","note":"①汉乐府民歌是继《诗经》之后中国民歌的进一步发展，此后还有南北朝民歌、唐代民歌等，这些民歌可能会放在一起来考查，比如会设问这些民歌有什么异同或者继承与发展。总体而言，民歌都有现实主义的共性，又有时代的不同点。②本题答案也可适当参考补充上题“汉乐府的主要思想内容”。"},{"id":"67","stars":"★★★★","title":"《古诗十九首》的主要内容及思想内涵","body":"《古诗十九首》除了游子之歌，便是思妇之词，抒发游子的羁旅情怀和思妇闺愁是它的基本内容。二者相互补充，围绕着同一个主题，是一个问题的两个方面。《古诗十九首》所表现的游子思妇各种复杂的思想情感，在中国古代具有普遍性和典型意义，千百年来引起读者的广泛共鸣，就像清人陈祚明所说的：“《十九首》所以为千古至文者，以能言人同有之情也。”（《采菽堂古诗选》）\n\n一、《古诗十九首》的情感构成\n\n《古诗十九首》再现了汉末社会思想转变时期游子和思妇的社会境遇和精神生活，即所谓“逐臣弃友、思妇劳人、托境抒情、比物连类、亲疏厚薄、死生新故之感，质言之、寓言之、一唱而三叹之”，具体来说，主要包括以下内容：\n\n（一）宦游子弟的思乡之情\n\n《古诗十九首》的作者多数为漂泊在外的游子，他们身在他乡，心系故园，均有无法消释的思乡情结，思乡之曲，语悴情悲，如《涉江采芙蓉》：“还顾望旧乡，长路漫浩浩。”《明月何皎皎》：“客行虽云乐，不如早旋归。”宦游之途的士子，能够敏锐地感受到节序如流所带来的感伤，如《回车驾言迈》：“四顾何茫茫，东风摇百草。所遇无故物，焉得不速老？”另外，游子思乡的焦点多集中在妻子身上，思乡和怀内不分，乡情和恋情融会。\n\n（二）失意士子的伤时之叹\n\n《古诗十九首》的作者多为宦游子弟，他们在诗中坦率地表白自己建功立业的心志：“何不策高足，先据要路津。”（《今日良宴会》）“盛衰各有时，立身苦不早。”（《回车驾言迈》）然而，游子宦达者毕竟是少数，仕途的挫折，使他们对世态冷暖的体会更加深切，如“昔我同门友，高举振六翮，不念携手好，弃我如遗迹”（《明月皎夜光》）。\n\n（三）闺楼思妇的愁怨之绪\n\n《古诗十九首》抒写了思妇盼归的精神苦闷和复杂心态。或珍视来信，“三岁字不灭”（《孟冬寒气至》）；或自我宽慰，“努力加餐饭”（《行行重行行》）；或寂寞难耐，“空床难独守”（《青青河畔草》）。而思妇微妙感受的表达，常运用多维的空间定位，如“相去万余里，故人心尚尔”（《客从远方来》），“盈盈一水间，脉脉不得语”（《迢迢牵牛星》），咫尺天涯，时空通贯。\n\n二、《古诗十九首》的思辨理性\n\n诗人对人生真谛的领悟，使这些诗篇具有深邃的意蕴，诗意盎然而又不乏思辨色彩。这主要表现为以下方面：\n\n（一）人生忧虑与及时行乐\n\n《古诗十九首》对人生易逝、节序如流的感伤，大有汲汲皇皇、如恐不及的忧虑，外物的永恒更加衬托了人生的有限，“人生非金石，岂能长寿考？”（《回车驾言迈》）他们不相信服食成仙之术，认为“服食求神仙，多为药所误”（《驱车上东门》）。诗人慨叹“生年不满百，常怀千岁忧”，并选择了“为乐当及时，何能待来兹”的解脱方式，忧郁与欢乐相互纠缠而又涣然消解。\n\n（二）末世风俗与道德追恋\n\n《古诗十九首》在慨叹末世风俗的同时，也隐含了对已失去的道德原则的追恋。诗人“去者日以疏，来者日以亲”（《去者日以疏》）的感触，认识到人情世态之常理，从历史长河中看待人际亲疏的推移变化，揭示出微妙的人生哲理。“良无磐石固，虚名复何益”（《明月皎夜光》）则反映了世风不古之下，诗人所受的虚伪友谊的伤害和对真挚情谊的期许。\n\n（三）深挚感情与生命理性\n\n《行行重行行》和《冉冉孤生竹》两诗中均有“思君令人老”之语，诗人清醒地认识到，这种深切思念，使他们的生命周期缩短，衰老加速。而这种认识，来自于诗人的生命理性。《古诗十九首》所表现的游子思妇，徘徊于理教和世俗之间，时而有违礼之言，而不及于乱。游子即使决心“荡涤放情志”，一旦面对燕赵佳人，又“沉吟聊踯躅”（《东城高且长》）；待嫁女子先是埋怨迎娶来迟，继而表白：“君亮执高节，贱妾亦何为。”（《冉冉孤生竹》）这种情与理的徘徊，是东汉士林风气的折射。\n\n三、《古诗十九首》抒发作者独特感受\n\n（一）敏锐的节序感\n\n《古诗十九首》的作者对季节的变化特别敏感，这些作品中明确标示出季节的有6篇，其他以物候暗示节序的诗篇亦为数不少。上述两项加在一起，占据19首诗的绝大部分。那些或明或暗标示节序的物象不是孤立地置于作品中，而是作为激发诗人情感的对象出现，同时也是表达情感的载体。诗人以感伤的情调回应季节的变化，不同季节的多种物候都被轻烟薄雾\n\n般的愁思所笼罩。萧瑟的秋风固然引起游子的苍凉之感，就是“东风摇百草”的春天，在他们心中产生的也不是欢快喜悦，而是“所遇无故物”（《回车驾言迈》）的失落和孤独。至于闺房思妇，更因春天的到来而牵动愁肠。\n\n（二）微妙的空间感\n\n《古诗十九首》所展开的空间方位是多维的，诗人把自己置于不同的空间方位，产生许多微妙的感受。“相去万余里，故人心尚尔”（《客从远方来》），这是远距离的心灵沟通，是天涯咫尺。“盈盈一水间，脉脉不得语”（《迢迢牵牛星》），这是近距离的感情交流受阻，是咫尺天涯。诗的作者多是行旅之人，饱尝长途跋涉的艰辛，所谓“回车驾言迈，悠悠涉长道”（《回车驾言迈》），就是通过展现空间距离的遥远，抒发未能及时建功立业的惆怅，道路的漫长暗示宦游的渺茫前程。诗人旅居他乡，四处漂泊，他们本身是离家而去的远行客，对于人生也按照自己的生存方式加以描述：“人生天地间，忽如远行客。”（《青青陵上柏》）这是以远距离的行走比喻人生的历程，人生短暂感和距离遥远感交织在一起，时空贯通而又相互背反。\n\n（三）深切的世态炎凉感\n\n《古诗十九首》的多数作者寓居他乡，饱经忧患，他们需要同情和帮助，对人间冷暖的感受特别深切。《西北有高楼》的作者被楼上飘下来的歌声所吸引，心有所感：“不惜歌者苦，但伤知音稀。”他把歌者设想成一个失意之人，自命为歌者的知音，和对方同病相怜，实际是慨叹知音难遇。《明月皎夜光》是有感于朋友间的友谊不牢固而发：“昔我同门友，高举振六翮。不念携手好，弃我如遗迹。”富贵易交，严重伤害了那些仕宦无门的游子，他们本已脆弱的神经实在难以承受这样的打击，抚今追昔带来的只有悲伤和怨愤。\n\n总之，《古诗十九首》描绘了汉乐府民歌中人们的悲欢离合，包含了深沉的离愁别绪，构成了一幅珍贵的历史画卷。","keywords":"情感构成 思辨理性 独特感受","note":"《古诗十九首》表现了汉代末期那个特殊时期人民群众的特殊情感，汉代末期战争频繁，逃亡生活常见，人的生命短暂，反映个体生命价值，羁旅之苦的作品应运而生，这样的情绪一直延续到魏晋南北朝。相较于汉乐府民歌，《古诗十九首》作为文人诗感慨更加深刻，也更加关注个人情感，大家可以通过对比明确这二者思想的差异。"},{"id":"68","stars":"★★★★","title":"《古诗十九首》的艺术特征（25湖南师范大学、26山东大学）","body":"【答题框架】\n\n汉代文学尚处于萌芽阶段，文人们没有刻意去写诗，他们的诗歌大多是凭借感受而写，没有经过任何雕琢，因此，总的来说，《古诗十九首》具有一种天生浑然圆融的艺术风格。\n\n一、《古诗十九首》是古代抒情诗的典范，它长于抒情，却不径直言之，而是委曲婉转，反复低徊\n\n许多诗篇都能巧妙地起兴发端，很少一开始就抒情明理。用以起兴发端的有典型事件，也有具体物象。《涉江采芙蓉》《庭中有奇树》选择的都是采择芳条鲜花以赠情侣的情节，只不过一者是远在他乡的游子，一者是独守闺房的思妇。以物象起兴发端多选择和时序相关的景观，抒情主人公或遇春草，或临秋风，有的眼望明月，有的耳听虫鸣，由这些具体物象引发出种种思绪。以事件起兴发端的诗篇，往往顺势推衍成一个故事。《孟冬寒气至》和《客从远方来》都以女主人公收到远方寄来的物品发端，然后写她们对游子的信件和礼物如何珍视，或精心收藏，或巧加裁制。以具体物象起兴发端的诗篇，则由这些物象构成优美的艺术境界。《古诗十九首》以写景叙事发端，极其自然地转入抒情，水到渠成，而且又抑扬有致。\n\n二、《古诗十九首》中许多诗篇以其情景交融、物我互化的笔法，构成浑然圆融的艺术境界\n\n《凛凛岁云暮》和《明月何皎皎》展示的都是典型的意境，抒情主人公一为思妇，一为游子。思妇在岁暮给远方游子寄去衣被，自己也思绪如潮。她在梦中见到了朝思暮想的“良人”，并且携手同车而归。然而，未及同床共枕，游子便儵忽离\n\n去。思妇醒后回忆梦境，徙倚感伤，一洒相思之泪。《明月何皎皎》则是以夜晚独宿为背景，抒发游子的思乡之情。这两首诗基本是写实之作，构成的意境却是如幻如梦，朦胧而又深沉。《西北有高楼》的抒情主人公先是听见高楼飘来的乐曲，接着品味曲中的慷慨和悲哀，最后幻想“愿为双鸿鹄，奋翅起高飞”。从空中逸响写起，又以奋翅高飞结束，诗中多想象之词，构成的是恍惚空灵的境界。《明月皎夜光》以月光星象发端，又以南箕、北斗和牵牛星徒有其名为喻而结束，中间穿插富贵易交一事，整首诗都给人一种寒凉凄清之感，作者的造境技巧是非常高明的。《古诗十九首》的抒情主人公绝大多数都在诗中直接出现，《迢迢牵牛星》是个例外，全诗通篇描写牵牛织女隔河相望而无法相聚的痛苦，把本来无情的两个星宿写得如同人间被活活拆散的恩爱夫妻。诗中无一句言及自身苦衷，但又无一语不渗透作者的离情别绪。\n\n三、《古诗十九首》的语言达到炉火纯青的程度\n\n锺嵘《诗品》卷上称《古诗十九首》“惊心动魄，可谓几乎一字千金”。《古诗十九首》不作艰深之语，无冷僻之词，而是用最明白晓畅的语言道出真情至理。浅浅寄言，深深道款，用意曲尽而造语新警，从而形成深衷浅貌的语言风格。《古诗十九首》的语言又是浓缩的积淀已久的，具有高度的概括性和丰富的表现力。诗中有许多名言警句，简洁生动，哲理深而诗意浓。《古诗十九首》的语言如山间甘泉，如千年陈酿，既清新而又醇厚，这得益于诗的作者对于各种语言融会消化能力。诗中有许多日常用语，虽造语平淡却有韵味。诗中化用了许多古代典故，却不给人以晦涩生硬之感。至于《青青河畔草》《迢迢牵牛星》两诗叠字的巧妙连用，《客从远方来》诗中双关语的自然融入，又颇得乐府民歌的神韵。\n\n《古诗十九首》在各方面均取得突出成就，古人对它给予很高的评价。刘勰《文心雕龙·明诗》谈到包括《古诗十九首》在内的“古诗”时称：“观其结体散文，直而不野，婉转附物，怊怅切情，实五言之冠冕也。”古代作家喜爱《古诗十九首》，并自觉地学习、借鉴它的艺术风格和创作手法，甚至加以模拟，曹植、陆机、陶渊明、鲍照等人都有这方面的作品传世。","keywords":"委曲婉转 浑然圆融的艺术境界 炉火纯青的语言艺术","note":"《古诗十九首》中起兴发端的事物比较多，由一棵树，一株草，一颗星，都能浮想联翩，达到情景交融，浑然圆融的艺术境界，这也是文人诗萌芽阶段的典型特征，不过分追求技巧，多数情况下是强烈感情的直接流露。另外，个别作品也可能会考赏析，需要我们对相关内容有所了解。"},{"id":"69","stars":"★★★","title":"《古诗十九首》的地位和影响","body":"《古诗十九首》在中国文学史上具有特殊的地位，尤其是为后代古诗的创作奠定了良好的基础。具体表现在以下三个方面：\n\n一、《古诗十九首》不仅是定型的五言诗，也是文人诗进入成熟阶段的显著标志\n\n《古诗十九首》中五言诗的问世，对于中国文学的发展和演变来说，具有里程碑意义，象征着中国文学的发展和进步。刘勰曾经在《文心雕龙》中对其进行精妙的描述：“直而不野，婉转附物，怊怅切情，实五言之冠冕也。”《古诗十九首》的出现，才算真正有了文人五言诗，这一来自民间的新型诗歌语言形式，也真正为文人所驾驭和掌握。它把深入浅出的构思，富于形象的比兴手法，情景交融的描写技巧，如话家常的平淡语言融为一体，形成曲尽衷情、婉转动人的独特风格。《古诗十九首》是古典诗“民歌体”与文人诗相结合的活化石，自此以后，五言一体遂取代了《诗经》的四言，楚辞的骚体，成为我国古典诗歌史上的一种重要的语言形式，\n\n二、自《古诗十九首》出现，其题材内容与表现手法为后人所师法，几乎成为固定模式\n\n《古诗十九首》出现之后，后世诗歌多有游子思妇之诗，像陶渊明的田园诗、孟郊的游子诗、柳永的爱情诗，在艺术境界表现上也是达到了《古诗十九首》浑然圆融的地步，并没有脱离《古诗十九首》在题材内容与表现手法上的框架。吴淇《古诗十九首定论》中说：“《古诗十九首》不出于一人手，作于一时，要皆臣不得于君而托意于夫妇朋友，深合风人之旨。后世作者，皆不出其范围。”\n\n三、《古诗十九首》也成为后世论诗的标准之一\n\n”《十九首》后，得其调者，古今曹子建而已；《三百篇》后，得其意者，古今杜子美而已。元亮之高，太白之逸，自是词坛绝步，但入此二流不得。”（《诗薮》外编卷四）许多文人把《古诗十九首》和《诗经》相提并论，将二者作为评判诗歌的标准之一，即使是陶渊明、李白这样艺术成就之高的诗人也不能“入此二流”，可见后人对其评价之高。\n\n《古诗十九首》在各方面均取得突出成就，古人对它给予很高的评价。古代作家喜爱《古诗十九首》，并自觉地学习、借鉴它的艺术风格和创作手法，甚至加以模拟，曹植、陆机、陶渊明、鲍照等人都有这方面的作品传世。\n\n魏晋南北朝文学史","keywords":"五言诗 题材内容 表现手法 后世论诗","note":"《古诗十九首》本身就是一个重要知识点，其思想内容、艺术特色、地位影响等都要复习到位。《古诗十九首》的地位与影响，需要我们结合具体作品和后人的评价，仔细作答。相关内容可以参考罗新芳《《古诗十九首》的历史地位及语言特色》，具体资料可以在李凡文学正版群中领取。"},{"id":"70","stars":"★★★","title":"为什么说魏晋是文学自觉的时代","body":"所谓“文学自觉”指的是文学及文学创作主体意识到文学的独立性和价值性，自觉地对文学的本质和发展规律等进行探讨和认识，促进文学按其自身的规律向前发展。文学的自觉是一个相当漫长的过程，它贯穿于整个魏晋南北朝，是经过大约三百年才实现的。魏晋被认为是文学自觉的时代，主要由于以下三个方面的标志：\n\n一、文学从广义的学术中分化出来，成为独立的一个门类\n\n汉朝人所谓文学指的是学术，特别是儒学，到了南朝，文学有了新的独立于学术的地位，宋文帝立四学，文学与儒学、玄学、史学并立；范晔《后汉书》单列《文苑列传》，与《儒林列传》等并立，都是重要的标志。此外又有文笔之分，《文心雕龙·总术》：“今之常言，有文有笔，以为无韵者笔也，有韵者文也。”这代表了一般的认识。梁元帝萧绎《金楼子·立言篇》对文笔之分有进一步的说明。萧绎所说的文笔之别已不限于有韵无韵，而强调了以情动人的特点，并且更广泛地注重语言的形式美。他所说的“文”已接近今天所说的文学了。\n\n二、对文学的各种体裁有了比较细致的区分，更重要的是对各种体裁的体制和风格特点有了比较明确的认识\n\n文体辨析可以上溯至《汉书·艺文志》，至于《东观汉记》以及蔡邕的《独断》、刘熙的《释名》等，反映了早期的文体辨析的意识。更为明晰而自觉的文体辨析则始自曹丕的《典论·论文》，他将文体分为四科，并指出它们各自的特点。《文赋》进一步将文体分为十类，对每一类的特点也有所论述。挚虞的《文章流别论》，论及12种文体，对各种文体追溯其起源，考察其演变，并举出一些作品加以讨论，比曹丕和陆机又进了一变。《文选》是按文体编成的一部文学总集，当然对文体有详细的辨析。如果对文学只有一种混沌的概念而不能加以区分，还不能算是对文学有了自觉的认识，所以文体辨析是文学自觉的重要标志。\n\n三、对文学的审美特性有了自觉的追求\n\n文学之所以成为文学，离不开审美的特性。所谓文学的自觉，最重要的或者说最终还是表现在对审美特性的自觉追求上。“诗赋欲丽”的“丽”，“诗缘情而绮靡”的“绮靡”，“赋体物而浏亮”的“浏亮”，便已经是审美的追求了。到了南朝，四声的发现及其在诗歌中的运用，再加上对用事和对偶的讲究，证明他们对语言的形式美有了更自觉的追求，这对中国文学包括诗歌、骈文、词和曲的发展具有极其重要的影响。而《文心雕龙》以大量篇幅论述文学作品的艺术特征，涉及情采、声律、丽辞、比兴、夸饰、炼字等许多方面，更是文学自觉的标志。","keywords":"文学独立 独立门类 体制和风格特点认识 自觉追求审美特性","note":"魏晋文学是古代文学史部分的重要命题，任何一个小点都具有单出的可能，“文学自觉”是近现代以来中国古代文学研究的一个重要话题，是魏晋南北朝文学部分首先需要掌握的问题之一。鲁迅曾说过，用近代的文学眼光来看曹丕的一个时代，可说是文学的自觉时代，或如近代所说的是为艺术而艺术的一派。掌握此问题可以更好地理解魏晋文学在题材和审美特性方面的主要特征。"},{"id":"71","stars":"★★","title":"试分析两汉文学之于魏晋文学自觉的意义","body":"两汉文学一方面尚未达到文学自觉的境地，另一方面也为文学自觉做出了必要的准备。\n\n一、体物大赋出现\n\n汉代文学的主体无疑是赋而非诗。屈原创作追求丽文的倾向，直接影响了此后的辞赋家。为好辞而作赋是典型的刻意为文，为艺术的艺术。到了汉代，辞赋家们在追求丽辞的道路上越走越远，形成了汉代以“靡丽多夸”为主要特征的体物大赋。这些作品讲究结构的宏大、语汇的丰富、文采的华美，如同精心构筑的大厦，构架、砖瓦都经过了细心的选择与安排。这批作品的创作与产生，对文学的自觉起了关键作用。\n\n二、文章之士具有了独立存在的地位\n\n屈、宋而下，司马相如、东方朔、枚皋、王褒等人，在汉代已被冠以“言语侍从之臣”的名号。辞赋家因以文章名世，开始成为史书中的独立传主。汉代史学家为屈原及汉代的文章之士立传，不是因为他们的功业显赫，官职之高，主要取其文章尤著而已。从汉代史学家为文章之士立传，可见文章之士已在当时的社会中具有了独立存在的地位。虽然汉世文学尚处于\n\n传统的立德、立功之下，“三不朽”之末，文学本身尚未成为文人有意识的、普遍的追求，但这也为后来魏晋文人自觉追求文学的审美特性打下了基础。\n\n三、经、史、子、集渐趋分离，文学逐渐摆脱经学束缚\n\n汉代又是经、史、子、集渐趋分离，文学逐渐摆脱经学束缚的时代。文人在大量的文学创作活动中，开始总结文学自身的艺术规律。而自刘向、刘歆父子整理图书，诗赋与六艺、诸子等并列，文学已有独立倾向，文体的辨析也自此日渐细密。至汉末蔡邕的《独断》，则列出君臣所用的文体各四种，而在实际应用和认识上，中国古代文体观念在汉代日益明确，传统的主要文体也多在此时定型。文体辨析是文学批评、文学自觉的基础。\n\n四、汉末抒情传统建立，人的生命意识觉醒\n\n汉大赋的“劝百讽一”注定了其生命活力的不足，而源自屈原的抒情传统在小赋发展史上由最初的涓涓细流，至东汉中后期终于演为洪涛巨浪，声势、成就超过了大赋。在诗歌领域，汉末文人诗改变了汉乐府以叙事为主的情况，转而以抒发个人的情感为主。日益动荡的社会局势使人的生存环境愈加恶劣，于是汉末文人诗中也就大量充斥着生命维艰的悲吟。以《古诗十九首》为代表的文人五言诗，可以说代表着人的生命意识的觉醒。","keywords":"体物大赋 独立地位 摆脱束缚 生命意识","note":"汉代文学作为魏晋文学的先导者，与魏晋文学一脉相承，二者之间存在联系。在掌握魏晋文学自觉的知识点时，应适当地了解汉代文学作为魏晋文学自觉前提的原因。在汉代，体物大赋出现，为艺术而艺术的倾向出现。同时，文人获得独立地位，文学也逐渐摆脱经学束缚，抒情传统建立，生命意识觉醒，这些都为魏晋文学自觉打下了基础。"},{"id":"72","stars":"★★★","title":"试分析《文心雕龙》的贡献","body":"刘勰的《文心雕龙》是一部内容丰富的文学理论和美学理论专著，对文学理论和美学方面的问题都有许多精辟的论述。他的文学理论和美学见解，不仅对我们理解中国古代的文学成就有直接的帮助，而且对我们今天开展文艺批评仍有借鉴意义。这部作品的贡献，主要表现在以下方面：\n\n一、用发展的观点，比较明确地阐明了文学与社会环境、自然环境的关系\n\n刘勰明确地认识到，文学艺术的变化，主要是外界社会环境的变化起决定的作用，文学艺术是随着时代的变化而变化的。他看到了政治变迁、社会风尚、宗教学术对文学艺术的变化所起的重要作用。同时，刘勰还注意到自然环境对作家的影响，指出气候时令和山川风物对作家思想感情的潜移默化的作用。\n\n总体上看，刘勰继承并发挥了孔丘“兴、观、群、怨”的观点，提出了“政教贵文”“事迹贵文”“修身贵文”的思想，肯定了文学的认识作用和对社会政治生活等方面的反作用。从我国文学理论和美学思想的发展来看，刘勰对文学和美学的这些见解是当时美学思想史上的一个很大的进步。\n\n二、比较正确地阐明了文学艺术的内容和形式的关系，对当时重文轻质的形式主义、唯美主义的倾向有纠偏作用\n\n刘勰针对当时重文轻质的文学创作倾向，提出了文学作品应该文质相符，即内容与形式相结合的理论。刘勰提倡质文并重，两者不可或缺，在这种认识的基础上，刘勰提倡“为情而造文”，反对“为文而造情”。刘勰尖锐批评了当时“体情之制日疏，逐文之篇愈盛”的创作倾向，由于作者们只注意了虚浮的形式忽略了真实的内容，所以表现真实思想感情的作品越来越少，而追求虚假形式的作品越来越多。刘勰这些看法，对当时唯美主义、形式主义的文风，对“为文而造情”的矫揉造作的倾向，有很重要的纠正作用。\n\n三、对文学艺术的特殊规律进行了可贵的探索，提出了许多精湛的见解，对我国文学艺术创作的发展，特别是艺术技巧上成熟，起了一定的推动作用\n\n《文心雕龙》内容非常丰富，从文学创作的艺术构思、作品的内容和形式、比兴和夸张手法的运用，到辞章、句法等等，都作了相当深入的研究。在这里，刘勰相当深刻地阐述了文学创作中艺术想象的重要意义以及想象思维方法的运用问题，指出作家丰富的感情，生动的艺术形象，都应贯穿在作家整个创作过程的始终。同时，刘勰还提出运用艺术想象和虚构，用形象化的语言，将大量无穷无尽的事物，概括在有限篇幅之中的“以少总多”的观点，这实际上就是今天所说的“典型化”艺术概括理论的一个雏形。\n\n四、探讨了作家的个性与作品艺术风格的关系，比前人更进一步\n\n相较于曹丕、陆机等前辈，刘勰不只从作家的“才性”一个方面来探讨作家的风格，而是从“才”“气”“学”“习”四个方面来探讨作家的风格，这就更具有一定的科学性了。同时，刘勰认识到风格的形成是与作家的个性分不开的，认识到\n\n了风格的多样性，他把作家的风格分为八种类型，叫作“八体”。此外，刘勰在《风骨》篇里明确提出了作家的作品应该“风清骨峻”，即要求作家有明朗健康、遒劲有力的风格。刘勰关于风格的论述，比曹丕、陆机都进了一大步。\n\n五、为我国古代文艺批评和文艺鉴赏树立了一个典范，为文学批评史和美学史的建立开拓了道路\n\n刘勰认为过去“崇己抑人”的文学批评，往往存在“贵古贱今”“信伪迷真”这样一些通病，要纠正这些通病就是要提倡“博观”。刘勰提出鉴赏文学作品要做到“六观”，强调评论和鉴赏文学作品要从内容到形式进行全面的分析。\n\n在提出这些文学批评观的同时，刘勰还进行了文学批评实践。他在从《辨骚》到《书记》二十多篇分类文学史式的篇章中，对各类文体的作家与作品采取具体分析的态度，对它作了比较全面而中肯的评价，不仅提高了人们对文学特点的认识，而且对齐梁之前文学的评价和其后文学的发展，都有帮助和推动作用。这是刘勰在文学批评和美学方面的贡献。","keywords":"文学和环境的关系 内容和形式的关系 文学艺术的特殊规律探索 个性与风格的关系 树立典范","note":"刘勰的《文心雕龙》作为我国第一部严密体系的文学理论和评论专著，提出系统的文学理论和明确的文学史观，联系时代文学的背景情况，对每个代表作家和代表作品给出了简单的评论。对于文学考研来说，《文心雕龙》是相当重要的一部古代文学理论著作，其相关知识点需要掌握。相关内容可以参考翟富生《浅析＜文心雕龙》在文学理论和美学方面的贡献》，具体资料可以在李凡文学正版群中领取。"},{"id":"73","stars":"★★","title":"试述魏晋南北朝文学创作主题","body":"魏晋南北朝的文学是典型的乱世文学，在这种情况下，文学创作很自然地形成一些共同的主题，这就是生死主题、游仙主题、隐逸主题。这些主题往往以药和酒为酵母引发开来，药和酒遂与这个时期的文学结下了不解之缘。\n\n一、生死主题\n\n生死主题主要是感慨人生的短促、死亡的不可避免，以及表现如何对待生、如何迎接死的思考。在汉乐府和《古诗十九首》中已有不少感叹生死的诗歌。魏晋以后生死主题越发普遍了。\n\n生与死是一个带有哲理意味的主题，如果结合人生的真实体验可以写得有血有肉，如果陷入纯哲学的议论又会很枯燥。对待人生的态度无非四种：一是提高生命的质量，及时勉励，建功立业；二是增加生命的长度，服食求仙，这要借助药；三是增加生命的密度，及时行乐，这须借助酒；第四种态度，就是陶渊明所采取的不以生死为念的顺应自然的态度。从陶诗看来，他不再是一个自叹生命短促的渺小的生灵，他具有与“大化”合一的身份和超越生死的眼光，因此他的这类诗歌便有了新的面貌。\n\n二、游仙主题\n\n游仙主题与生死主题关系很密切，主要是想象神仙的世界，表现对那个世界的向往以及企求长生的愿望。《楚辞》中的《离骚》《远游》已开了游仙主题的先河，不过那主要是一种政治的寄托。魏晋以后，游仙主题作为生死主题的补充，企求长生的意思变得浓厚了。如曹操的《气出唱》《精列》，曹植的《游仙》《升天行》《仙人篇》，张华的《游仙诗》，何劭的《游仙诗》，已经构成一个游仙的系列。特别是郭璞的多首《游仙诗》，使游仙主题成为魏晋南北朝文学中不可忽视的一个主题了。\n\n三、隐逸主题\n\n隐逸主题包括向往和歌咏隐逸生活的作品，也包括招隐诗、反招隐诗，形成这个时期的一种特殊的文学景观。隐逸思想早在《庄子》书中就体现得很强烈了，隐逸主题可以追溯到《楚辞》中淮南小山的《招隐士》。汉代张衡的《归田赋》可以视为表现这类主题的早期作品。到了魏晋以后，沿袭《招隐士》的作品有左思和陆机的《招隐诗》、王康琚的《反招隐诗》。沿袭《归田赋》的作品有潘岳的《闲居赋》。而陶渊明的大量描写隐逸生活和表现隐逸思想的作品，则使这类主题达到登峰造极的地步，所以锺嵘《诗品》说他是“古今隐逸诗人之宗”。至于其他许多人的作品中，表达隐逸思想的地方就不胜枚举了。隐逸主题的兴起与魏晋以后士人中希企隐逸之风的兴盛有直接关系，而这种风气又与战乱的社会背景和玄学的影响有关。\n\n【李凡关键词：创作主题 生死主题 游仙主题 隐逸主题】","keywords":"","note":"在记忆南北朝文学创作主题时要结合当时的时代背景。其三个主题当中的代表作品，也需要有所了解掌握。在后面将会有作家涉及相关主题的作品，二者可以相互联系记忆，比如郭璞的游仙诗，带有游仙主题的色彩。"},{"id":"74","stars":"★","title":"试分析魏晋门阀制度对于文学创作的影响","body":"魏文帝曹丕建立九品中正制，因为中正官把持在士族手中，从而形成“上品无寒门，下品无势族”的局面。士族子弟经过中正品第入仕，形成世代相传的贵胄；而寒门庶族几乎失去了入仕的机会。进入东晋，士族门阀的势力更加强盛，特别是一些高级士族控制了中央政权，形成“王与马，共天下”的局面。这种门阀政治是士族与皇权的共治，是在东晋特定条件下出现的皇权政治的变态。到了南朝，士族势力衰微，遂又回到皇权政治。\n\n一、士族和庶族的对立\n\n门阀制度阻塞了寒士的仕进之路，一些才高的寒士自然心怀不平，士族和庶族的对立成为这个时期的一个重要特点，寒士的不平反映在文学创作中，就成为这个时期文学的一个特色。其实寒士的不平早在战国时代的文学作品中就有所反映了，魏晋南北朝时期，在门阀制度下，寒士的不平更为强烈，在诗中的呼喊之声也就更为高亢。\n\n二、文学家族大量出现\n\n文学家族的大量出现也是值得注意的现象。例如：三曹（曹操及其子曹丕、曹植）；阮瑀及其子阮籍；嵇康及其子嵇绍、绍从子嵇含；三张（张载及其弟张协、张亢），二陆（陆机、陆云兄弟），两潘（潘岳及其从子潘尼）；傅玄及其子傅咸；谢安及其孙谢混，谢混及其族子谢灵运、谢瞻、谢晦、谢曜，谢灵运及其族弟谢惠连，其同族的谢朓；萧衍及其子萧纲、萧绎。文学家族的大量出现与门阀制度有直接的关系，文学乃至文化集中在少数世家大族手中，与政治权力一起世代相传。文学家族在魏晋两代尤盛，南朝以后逐渐减少，这与南朝门阀势力逐渐衰微的趋势是一致的。\n\n三、对宗族关系和伦理观念的强调\n\n重视门第的风气在文学作品中还表现为对宗族关系和伦理观念的强调。在魏晋南北朝的诗中，有一些追述或炫耀自己宗族门第的作品，在那些表现伦理关系或规诫子弟的诗中也往往带有追述先祖功德的内容，以及绍续家风、重振家业的愿望和使命感，而且多用典雅的四言形式写成。有趣的是，进入南朝以后，随着士族的没落，这类诗几乎不见了，谢灵运的《述祖德》五言诗二首算是例外。","keywords":"寒士的不平 文学家族的大量出现 重视门第的风气 宗族关系 伦理观念","note":"门阀制度对魏晋南北朝时期文学的影响是非常明显的，像是鲍照的诗歌中就有许多批判门阀制度的内容。门阀制度阻碍了下层寒门的上升渠道，因而在文学作品中可以看到下层的不平；而门阀制度之下，文化集中在士族手中，又导致了文学家族大量出现，和重视门第风气作品的出现。"},{"id":"75","stars":"★★","title":"试分析魏晋玄学论题对文学创作的影响","body":"玄学有几个重要的论题：崇有与贵无、名教与自然、言意之辨、形神之辨、名理之辨。对文学和艺术有直接影响的是崇尚自然的一派、言不尽意的一派和得意忘言的一派。这些论题对魏晋文学创作的影响，主要表现在以下方面：\n\n一、崇尚自然\n\n“自然”一词不见于《论语》《孟子》，是老庄哲学特有的范畴。其所谓“自然”，不是近代所谓与人类社会相对而言的自然界，而是一种状态，即非人为的、本来如此的、天然而然的。“真”，也不见于《论语》和《孟子》，是道家特有的哲学范畴。这样看来，“真”和“自然”有相通的地方，它们不仅属于抽象理念的范畴，又属于道德的范畴。玄学中崇尚自然的思想，其影响所及就是进一步确立了以“自然”与“真”为上的审美理想。“自然”和“真”，在魏晋南北朝的文学创作和文学批评中虽然还未占据主导地位，但是体现着这种美的陶渊明的出现，以及嵇康、阮籍、锺嵘、刘勰、萧统等人关于“自然”和“真”的论述，却对此后整个中国文学产生了极其深远的影响。\n\n二、言不尽意\n\n言意之辨讨论的内容是言辞和意旨之间的关系，其中言不尽意论和得意忘言论对文学创作和文学鉴赏产生了重大的影响。\n\n以荀粲为代表的言不尽意论，认为言可达意，但不能尽意，指出了言意之间的联系和差别，以及言辞在表达意旨时的局限。以王弼为代表的得意忘言论，认为象的功用是存意，言的功用是明象，只要得到象就不必拘守原来用以明象的言，只要得到意就不必拘守原来用以存意的象。如果不忘象就不能真正得到意，不忘言就不能真正得到象。要想真正得到意必须忘象，要想真正得到象必须忘言。\n\n三、得意忘言\n\n言不尽意论对创作论有所启发，得意忘言论对鉴赏论有所启发。语言是人类伟大的创造，然而它同人类丰富的感情、心理相比，同大千世界相比，又是苍白无力的。文学创作欲求达意，最好的方法是：既诉诸言内，又寄诸言外，充分运用语言的启发性和暗示性，以唤起读者的联想，让他们自己去体味那字句之外隽永深长的情思和意趣，以达到言有尽而意无穷的效果。言有尽而意无穷，这个道理对诗人和读者都很重要。中国诗歌的艺术精髓说到底就在于此。而这正是受了魏晋玄学的启发而得到的。","keywords":"论题 自然言辞和意旨之间的关系 言不尽意 创作论 得意忘言 鉴赏论","note":"玄谈是在魏晋时期一个独特的现象，众多文学作品受魏晋玄学的影响。因此了解玄学的重要论题，有助于我们理解魏晋时期的文学作品。其中对文学产生重要影响的是“自然”和言意之辨，言意之辨中两种不同的观点分别对创作论和鉴赏论产生了启发。"},{"id":"76","stars":"★★","title":"试分析魏晋时期佛教对文学的影响","body":"魏晋时期，佛教传入中国，从政治上为魏晋文学创造了新的文化氛围与文化土壤。佛教与文人关系密切，影响了魏晋文学的内容与思想。关于佛教对文学的影响，可以从以下五个方面考察：\n\n一、想象世界的丰富。佛教传入以前，中国传统的思想中只有今生此世，既无前世也无来世，佛教带来了三世（前世、今世、来世）的观念，因果、轮回的观念，以及三界、五道的观念。这样就把思维的时间和空间都扩大了，随之而来的就是人的想象世界也扩大了。人活着不但要考虑今世，还要考虑前世，尤其是来世，今世的善恶是因，种下了来世的幸与不幸的果。用因果报应的观念解释人世间的许多现象，遂有了《幽明录》《冥祥记》《冤魂志》等笔记小说。维摩与观音的形象在这时建立起来，并对后代的文学产生了广泛的影响，也很值得注意。\n\n二、故事性的加强。佛经中记载的大量故事，随着佛经的翻译传入中国，并且流传到民间，加强了中国文学的故事性。有的故事是直接来自佛经的，在这时的小说里改写为中国本土的故事。有的是印证佛教思想的中国本土产生的故事。南北朝时期，记载因果报应之类故事的小说大量出现，显然与佛教有关。唐代的俗讲与变文，导致了中国白话小说的产生，则更证明了佛教的深远影响。\n\n三、反切的产生和四声的发现。关于反切产生的年代历来有不同的说法，以颜之推所谓汉末说最为可信，这正是佛教传入中国以后的事。在翻译佛经的过程中，梵语的拼音法启发人们去分析汉语的声音结构，分析出汉语的声母和韵母，于是产生了反切。而反切欲求准确，就自然会发展到对汉字声调的注意。四声的发现，据文献记载，始自南朝宋代的周颙。但根据北齐李概在《音韵决疑序》中提到的相关内容，似乎在此前民间已有四声之辨了。陈寅恪《四声三问》认为四声的发现与佛经的转读有关，虽然有学者质疑，其细节是否确切尚待进一步考证，但从大的文化背景来看，这两件事情还是有一定联系的。\n\n四、词汇的扩大。随着佛经的大量翻译，反映佛教概念的词语也大量进入汉语，使汉语词汇丰富起来。其中有的是用原有的汉字翻译佛教的概念，使之具有了新的意义，如“因缘”“境界”等。有的是外来语的音译词，如“佛陀”“菩萨”“沙门”“菩提”等。\n\n五、文学观念的多样化。魏晋南北朝本是文学观念脱离儒家强调的政教中心说，发生重大变化的时期，这与玄学有很大关系。而佛教中关于真与空的观念，关于心性的观念，关于境界的观念，关于象和象外的观念，以及关于形神的讨论，也丰富了文学观念。","keywords":"想象世界 故事性 反切四声 词汇 文学观念","note":"佛教从魏晋时期开始传入中国，对中国文化产生影响，同时也影响着中国文学的发展，比如后来的陶渊明、王维等人的作品中都有佛教的影子。佛教对魏晋文学的影响，可以从想象世界的丰富、故事性加强、反切四声的发现、词汇的扩大以及文学观念的多样化五个方面去考虑。"},{"id":"77","stars":"★★★★","title":"论述南朝文学的“文笔之辨”（25西南交通大学、浙江大学）","body":"【答题框架】\n\n南朝时期是中国古代文学发展的重要阶段，文学创作与理论批评都达到了新的高度。在这一时期，“文笔之辨”成为一个重要的理论议题，引发了诸多文人学者的讨论。对此，我们可以从以下方面展开讨论。\n\n一、“文笔之辨”的内涵\n\n所谓“文笔之辨”，是关于文体论的辩论，是指文和笔作为文章的两种文体而相异。其实质是当时人们对文学与非文学区别的深入探讨和研究，这是人们辨析文章体制日益精密的结果，因此它在中国文体学史乃至整个中国文学史上都具有重要意义。\n\n二、南朝“文笔之辨”出现的背景\n\n南朝时期，文学有了新的独立于学术的地位，“文学”之义已与西汉大相径庭，从所有的文字作品都可以称为文学，到专门的以修饰的文字、以某种艺术形式来表情达意才能称为文学。“文学”脱离了最初的文字的实用功用，走向了独立的道路。宋文帝立四学，文学与儒学、玄学、史学并立；范晔《后汉书》单列《文苑列传》，与《儒林列传》等井立，都是重要的标志。文与学相分以后，文笔之辨即成为一个重要的问题，提出区分文笔，正是为了要进一步分清文学与非文学。\n\n三、南朝“文笔之辨”的几种观点\n\n南朝时期，文章家们试图从目录、音韵和情感上对文笔作进一步的区分。\n\n（一）从音韵上分辨。\n\n《文心雕龙·总术》曰：“今之常言，有文有笔，以为无韵者笔也，有韵者文也。”《文笔式》把刘勰的文笔理论作了进一步的论证，认为文由两句组成，所以容易押韵；笔由四句组成，所以不容易押韵。\n\n（二）从用途上分辨\n\n范晔在《狱中与诸甥侄书》中曾提出一种的“文笔”区分思路：“吾思乃无定方，特能济难适轻重，所禀之分，犹当未尽。但多公家之言，少于事外远致，以此为恨，亦由无意于文名故也。”以功用来划分当时的文字作品“公家之言”是实用性文字，为“笔”；“事外远致”是私人化情趣性文字，为诗、赋之类的“文”，“文与“笔”就是私人化之文字与公家实用性之文字的对举。\n\n（三）从审美上分辨\n\n梁代的萧绎在《金楼子·立言》中提出了一个新的原则：“笔退则吟咏风谣，流连哀思者，谓之文。......非谓成篇，进则不云取义，神其巧惠笔端而已。至如文者，惟须绮縠纷披，宫徵靡曼，唇吻道会，情灵摇荡。”这里不再以是否用韵，而是以审美作为划分文笔的标准：“笔”的标准是表达一定内容，但要构思巧妙就行了；而“文”则要“宫徵靡曼，唇吻道会”，要打动人心，让人“情灵摇荡”。逯钦立先生所谓“放弃以体裁分文笔的旧说，开始以制作的技巧，重为文笔定标准”。这无疑是时代的进步，也标志着“文笔之辨”理论的深化。\n\n南朝时期的“文笔之辨”是一场关于文学本质与功能的重要理论争论。这场争论不仅推动了南朝文学的发展，也为后世文学理论提供了宝贵的遗产。","keywords":"内涵 文体论 背景 独立地位 观点 音韵 用途 审美","note":"南朝的文笔之辨，其实是魏晋文学自觉之后必然会出现的内容。随着人们对文学与非文学认识的深入，势必会对文章的类型进行划分，以更好地去确认文学与非文学的边界。魏晋六朝的“文笔”之分的讨论一直持续到了初唐，之后被“诗文”之分的相关讨论所取代，一直到了清代才重新被重视，所以如果对“文笔之辨”进行考查的话，必然离不开南北朝文学。而在其中，刘勰、萧绎的相关主张更是值得重视。"},{"id":"78","stars":"★★","title":"试分析曹操的诗歌创作特征与成就","body":"曹操“外定武功，内兴文学”，他是汉末杰出的文学家和建安文学新局面的开创者。他一方面凭借政治上的领导地位，广泛地搜罗文士，造成了“彬彬之盛”的建安文学局面；一方面用自己富有创造性的作品开创文学上的新风气。\n\n一、诗歌创作特征\n\n作为诗人，曹操的诗歌更多地表现出他深刻的思想矛盾。他的诗兼有四言、五言和杂言，全用乐府古题，抒写全新的时代感受。\n\n（一）诗歌题材\n\n（1）反映汉末战乱的现实和人民遭受的苦难，如《蒿里行》写的是初平元年关东义军联合讨伐董卓的历史事件。这些诗歌，由于反映现实深刻真实，因而被后人称为“汉末实录”。\n\n（2）抒写个人情怀。曹操乐府中有相当一部分是抒写个人情怀的诗歌，或者借歌咏历史人物抒发政治怀抱，或者直抒胸臆，表达自己的愿望、理想和抱负，或者借游仙的主题慰藉自己生命有限、壮志难遂的情怀。相对来讲，描绘理想政治及游仙类的诗歌成就较低，而受汉乐府的影响也较大。他的名世之作主要是表现自己雄心壮志的诗歌。\n\n（二）曹操诗歌内容和写作方法都与汉乐府“感于哀乐，缘事而发”的精神一脉相承。他采用乐府古题写时事。他的诗继承汉乐府的传统，既反映现实，又有很深的感慨，语言古朴率真。\n\n（三）曹操本人是个雄心勃勃的政治家、军事家，所写的诗篇都是反映社会现实的重大题材和自己的切身感受，尤其善于从大处落笔，寄托自己的感慨和雄心。\n\n二、诗歌成就\n\n（一）曹操的《步出夏门行·观沧海》是我国现存第一首较为完整的山水诗，写出了大海孕大含深、动荡不安的性格，诗歌以雄健的笔力，生动饱满地描绘了沧海的形象。大海那吞吐日月、含孕群星的气魄，也正是诗人博大襟怀的写照。\n\n（二）就艺术形式而言，曹操的四言诗也为已经板滞僵化了的四言体注入了活力。《诗经》以后，四言诗很少佳篇，曹操继承了“国风”和“小雅”的抒情的传统，创造出一些动人的篇章，使四言诗再一次放出光彩。后来嵇康、陶渊明等人有成就的四言诗都是沿着这条路走下去的。\n\n（三）曹操的诗不仅对建安文学有开风气的作用，由于创造性较大，对后代文学也有重要的影响。他的以乐府古题写时事的做法对后来的新乐府诗有很大的启示。从他这种旧题新事乐府到杜甫的“即事名篇”的新题新事乐府，再到白居易等人掀起的新乐府运动，可以清晰地看出一脉相承的发展。","keywords":"汉末实录 个人情怀 用乐府古题写时事 大处落笔 第一首较为完整的山水诗 为四言体注入活力 影响后代文学","note":"曹操诗歌创作的一大成就，是开创了文人“拟乐府”诗歌创造的全盛局面。借古题写新事，如《薤露》《蒿里》，乐府旧辞皆为挽歌，曹操却用悲凉苦恨之调。他的诗特别能表现出他的个性，有政治领袖人物的宏大气魄，本色质朴抒情浓郁，表现了他高远的志向、坚定的信心、卓越的毅力和雄伟的气势，悲歌慷慨，气韵沉雄。"},{"id":"79","stars":"★★","title":"试述曹丕诗歌创作特征","body":"曹丕的诗歌婉约悱恻，这是他区别于曹操、曹植诗歌的显著特点。这种风格的形成，主要是描写客体与创作主体的原因。同时，曹丕的诗歌，根据不同的题材，也表现了不同的风格。具体来说，曹丕的诗歌创作特征，主要表现在以下方面：\n\n一、诗歌的题材大致可分三类\n\n第一类是军事征伐之作，这些诗歌皆颇具声威，有追步曹操的志意，只是笔力嫌弱，难以振起全诗。\n\n第二类是述游宴之作，这些诗多写游赏之乐，模山范水比较细致，文词富丽，常用对偶，在我国山水诗的发展史上有一定地位。\n\n第三类是代言游子思妇之情的作品，也是他写得最好的，最能体现曹丕诗的水平。曹丕此类诗作在艺术上常有佳构。他很少用浓墨重彩表现情感的跌宕起伏，而是着重描写情感的真挚与细微的变化，再以富于气氛的景物描写来加以烘托，使诗歌的情思丰溢，韵味悠长。\n\n二、清丽纤弱、便娟婉约的风格\n\n曹丕敏感而多情，常于广坐欢宴之时，突然兴起一股悲情。纤细的情思使他能够体察事物细微的变化，并常为时节的更替、友人乃至陌生人的凋零而落泪。他又极善于选用清词丽句，配以和谐的音韵，表达他纤丽的情思。所有这些使得曹丕非常适合于创作为游子思妇代言的诗歌，从而形成清丽纤弱、便娟婉约的风格。曹丕的诗歌抒情性极强，善于委婉曲折地抒发自己内心的喜怒哀乐之情，善于刻画人物的心理活动，将笔触深入到人的心灵世界，可谓是“以情纬文”，发展了诗歌的抒情特色。\n\n三、诗歌体裁上多方面尝试\n\n在艺术形式上，曹丕也勇于创新，他的诗题材相对狭窄，但他在诗歌体裁上却有多方面的尝试，虽然仅存约四十首诗，却是三言、四言、五言、六言、七言、杂言诸体具备无所不有，其中长篇杂言歌行《大墙上蒿行》，长达75句，三百六十馀字，三字至九字句都有，极尽纵横开阖之能事。这些诗歌体式中，尤以五言七言成就最高、影响最大。他的《燕歌行》是我国现存第一首成熟的七言诗，对后代歌行体诗的发展产生了重大的影响。","keywords":"题材可分三类 军事征伐 述游宴 代言游子思妇之情 清丽纤弱 便娟婉约 体裁上多方面尝试","note":"曹丕诗歌的类型，主要有宴游诗、抒情诗和写征人思妇的诗三种，而相较于同时代诗人，曹丕侧重于个人情感的抒发，使用文人化的艺术表现手法，形成了自己独特的艺术风格，在艺术形式上进行创新，体现了一种“新变”，这些我们需要了解。相关内容可以参考丁夏《论述曹丕诗-兼论对“建安风骨”的再认识》，具体资料可以在李凡文学正版群内领取。"},{"id":"80","stars":"★★★","title":"试述曹植诗歌类型及成就","body":"在政治上，曹植是一位悲剧人物，然而政治上的悲剧客观上促成了他在诗歌创作上的卓越成就。曹植的诗歌创作特征，主要表现出以下特征：\n\n一、骨气奇高\n\n曹植的创作以建安二十五年为界，分为前后两期。前期诗歌主要是歌唱理想和抱负，洋溢着乐观、浪漫的情调，对前途充满信心。后期诗歌主要是表达由理想与现实的矛盾所激起的悲愤。其内容可分为四类：\n\n第一类是对自己和朋友遭遇迫害的愤懑。这方面的典型作品则是《赠白马王彪》，全诗共分七章，以感情活动为线索，集中抒发了诗人多年来屡受迫害而积压在心头的愤慨。\n\n第二类用思妇、弃妇托寓身世，表白心迹。这类诗歌或叹盛年无偶，或自述无辜被弃，其主旨在于抒发自己的失意。\n\n第三类是述志诗。曹植用世之心，在黄初以后屡屡诉诸诗赋，《杂诗》（“仆夫早严驾”）就是这方面的代表作。诗中表示愿为伐吴效力，但报国无门。诗末充满慷慨之音。\n\n第四类是游仙诗。曹植在现实世界中处处碰壁，深感时光流逝，功业无成，幻想在神仙世界中得到解脱，于是写下了许多游仙诗。诗中所描绘的神仙境界，皆明净、高洁，实际上是诗人理想世界的象征。\n\n曹植一生热衷功名，追求理想，遭遇挫折后，壮志不衰，转多愤激之情，所以诗歌内容充满追求与反抗富有气势和力量，这就形成了“骨气奇高”的一面。\n\n二、情兼雅怨\n\n曹植的诗中倾注了他极为浓烈的情感，不论前期激昂奋发的壮怀，还是后期幽怨悱恻的哀吟，深厚浓烈的感情总是贯注于每一句、每个字中。他这种强烈的情感因素感染着古今所有的读者，以致每个人心目中的曹植都是一个英姿少年的形象。不仅如此，曹植浓厚的思想情感还体现了乐而不淫、哀而不伤、怨而不怒的诗骚传统，所以说“情兼雅怨”。\n\n三、词采华茂\n\n曹植在诗歌的艺术形式上也有极高的追求。他非常注意起句，多起句高唱。此外，他的诗篇能够做到一气贯通，没有窒碍，也没有赘语，紧凑洁净。他继承了《诗经》比兴的手法，寄托深远。他的诗对仗、辞藻、声色兼善，但又不失汉诗的质朴自然，可以说每个字都是经过锤炼的。用“词采华茂”来评价，是一点也不为过的。\n\n四、完成了乐府民歌向文人诗的转变\n\n曹植兼擅各类文体、诗体，尤其长于五言，是第一个大力写作五言诗的作家。他现存诗歌九十馀首，其中有六十多首是五言诗。他的诗歌，既体现了《诗经》“哀而不伤”的庄雅，又蕴含着《楚辞》窈窕深邃的奇谲；既继承了汉乐府反映现实的笔力，又保留了《古诗十九首》温丽悲远的情调。曹植的诗又有自己鲜明独特的风格，完成了乐府民歌向文人诗的转变。\n\n曹植既不同于曹操的古直悲凉，又不同于曹丕的便娟婉约，而能兼有父兄之长，达到风骨与文采的完美结合，成为当时诗坛最杰出的代表。","keywords":"骨气奇高 前后两期 愤懑 思妇 弃妇 述志 游仙 情兼雅怨 词采华茂 乐府民歌向文人诗的转变","note":"曹植前期诗歌主要是歌唱理想和抱负，洋溢着乐观、浪漫的情调，对前途充满信心。曹植后期诗歌，主要是表达由理想与现实的矛盾所激起的悲愤。曹植既不同于曹操的古直悲凉，又不同于曹丕的便娟婉约，而能兼有父兄之长，达到风骨与文采的完美结合，成为当时诗坛最杰出的代表，在三曹当中应当重点掌握。"},{"id":"81","stars":"★★★★","title":"谈谈你对建安风骨的认识","body":"一、建安风骨的形成\n\n建安风骨是由于世积乱离风衰俗怨，加上建安作家的慷慨报国的壮志豪情；慷慨任气，磊落使才，造怀指事，不求纤密之巧，驱辞逐貌，唯取昭晰之能；结言端直，意气骏爽，构成刚健的风格，可以翰飞戾天，骨劲气猛，使风清骨峻，篇体光华。再加上它继承了风雅楚骚和乐府诗的优良传统，形成了建安风骨。\n\n二、建安风骨的内涵\n\n（一）政治热情普遍高扬，具有悲凉慷慨的精神\n\n东汉末年的动乱，既使建安文人饱受离乱之苦，也激起他们的政治热情，建功立业、扬名后世，成为他们共同的追求。建安文人政治热情的普遍高扬，造成了当时诗歌“雅好慷慨”“志深笔长”“梗概多气”的特点。“慷慨”一词，为建安诗人所习用，还有“悲风”这个意象，在建安诗歌中也常出现，建安诗歌这种悲凉慷慨的精神，具有鲜明时代特色。\n\n（二）人生苦短的慨叹\n\n人生苦短的慨叹，是建安诗歌的另一个主题。当时社会动乱，生灵涂炭，疾疫流行，人多短寿。这种情况对文人刺激很大。面对短促而又多艰的人生，建安诗人采取了三种不同的态度：第一种是单纯的悲叹，第二种是慨叹岁月短促、功名未立，却仍努力追求。第三类是努力突破天命的限制，在有生之年追求更高的人生价值。后两种思想体现了建安诗人积极的人生观，对后世有志之士有很大的激励作用。\n\n（三）鲜明的个性色彩\n\n建安时代是文学开始走向自觉的时代，也是诗人创作个性高扬的时代。建安诗人多高自标置，以文才武略自负，在进行诗歌创作时，便不肯踵武前贤或效法同辈，而是另辟蹊径，努力展现自己独特的风貌。在诗体的运用上，也各具匠心。鲜明的个性色彩，是建安诗歌独具魅力的标志。\n\n（四）浓郁的悲剧色彩\n\n由于“世积乱离，风衰俗怨”，建安诗歌带有浓郁的悲剧色彩。建安诗人处于时代与个人双重悲剧的交汇点上，都敢于正视苦难的社会与人生，勉励自己及他人惜时如金，及早建功立业，赢得不朽的名声。\n\n以上所举各点，就是“建安风骨”这一美学范畴的内涵。\n\n三、建安风骨的作用\n\n从文学的总的倾向看，晋代轻绮，宋代新巧，齐梁浮艳，趋向“逶迤颓靡”，提出建安风骨的用意，要把这种“逶迤颓靡”的风气挽回过来，建立一种“骨气端翔，音情顿挫，光英朗练”，也就是“风清骨骏，篇体光华”的文学，这是提出建安风骨的重要意义，也是建安风骨的突出成就。","keywords":"形成 政治理想的高扬 人生短暂的慨叹 强烈的个性表现 浓郁的悲剧色彩 作用","note":"建安诗歌的时代特征，即“建安风骨”，是魏晋时期相对比较重要的知识点，主要体现了以“三曹”和“建安七子”为代表的建安时期诗人的诗歌内容与风格，需要大家重点掌握。在分析时，除了要关注建安风骨的内涵外，也要注意建安风骨形成的原因及其在文学史上的意义。相关内容可以参考周振甫《释“建安风骨”》，具体资料可以在李凡文学正版群内领取。"},{"id":"82","stars":"★★★","title":"试分析阮籍《咏怀诗》的思想主题与艺术特征","body":"阮籍《咏怀诗》共八十二首，这些诗非一时一地所作，是其政治感慨的记录。这些诗抒感慨，发议论，写理想，开创了中国文学史上政治抒情组诗的先河，对后世产生了重大影响。\n\n一、思想特征\n\n（一）充满苦闷、孤独的情绪，表现出忧愤深广的情怀\n\n阮籍的《咏怀诗》充满苦闷、孤独的情绪，其诗或者写时光飞逝、人生无常，或者写树木花草由繁华转为憔悴，比喻世事的反复，或者写鸟兽虫鱼对自身命运之无奈，如孤鸟、寒鸟、孤鸿、离兽等意象经常出现在诗中，特别是春生秋死的蟋蟀、蟪蛄，成为诗人反复歌咏的对象。或者直接慨叹人生的各种深创巨痛，如少年之忽成丑老，功名富贵之难保、以色事人之不可靠。由于从自然到人事都充满苦难，阮籍心中的苦闷难以排遣。\n\n《咏怀诗》中迁逝之悲、祸福无常之感触目皆是，正体现了阮籍忧愤深广的情怀。阮籍诗中悲哀、凄怆、涕下、咨嗟、辛酸、蹉跎、忧伤、愤懑、怨尤、悲悼等词语十分常见，充分反映了他极度苦闷的心情。\n\n（二）以游仙和隐居来逃避污浊的社会，但仍怀济世之志\n\n面对污浊的社会与短暂的人生，阮籍无法找到真正的出路，只好故作旷达，在生活中，他做出许多惊世骇俗的事情；在诗歌中，他也为自己设计了精神的出路，这就是游仙和隐居。\n\n阮籍赞美神仙隐逸，只是排遣苦闷的一种方式，他其实是颇有济世之志的。所以他在写愤懑与出世之情的同时，也表现出对时局的关注和自己的怀抱。有的诗则揭露礼法之士的虚伪，有的诗则抒发自己的壮志。\n\n二、艺术特征\n\n（一）风格隐约曲折\n\n阮籍诗的风格隐约曲折，这主要是由其时代与身世决定的。他同情曹魏，不满于司马氏，但身仕乱朝，常恐遭祸，故处世极为谨慎，作诗亦不敢直言，常常借比兴、象征的手法来表达感情、寄托怀抱。或借古讽今，或借游仙讽刺世俗，或借写美人香草寓写怀抱。\n\n（二）与建安风骨一脉相承\n\n就诗歌精神而言，阮籍的《咏怀诗》与建安风骨仍是一脉相承的。虽然阮籍不敢在诗中直言其愤慨，而且时常表现出消沉、避祸的思想，以游仙与隐居作为心仪的归宿，但他并没有真的泯灭理想，对政治屠杀的无道他要斥责，对礼法之士的虚伪他也敢于揭露。飞鸟、玄鹤、凤凰、鸾鹭、幽兰、朱草、神仙、奇士，是他笔下出现最多的意象，阮籍用比兴的手法，在含蓄婉曲地吟咏着自己的情怀，这就是“咏怀”的含义。虽然这种表达过于曲折，但是其精神仍上接建安，影响百世。\n\n（三）五言诗的形式\n\n阮籍是继曹植之后又一位大力写作五言诗的重要诗人，而且完全“摆脱了乐府诗的格调，用五言诗来歌咏自己”，《咏怀诗》便是阮籍五言诗的典范。它从表达方式到题材命意等多方面开拓、丰富了五言诗，在我国诗歌史上占有重要地位。同时，阮籍能吸收多方面的影响，创造独特的风格，推动了文人五言诗的创作发展，进一步确立了五言诗体制，丰富了五言诗的抒情内涵，避免了五言诗语言过早走向“风华有余，骨肉不足”的局面，在五言诗的发展中是占有重要地位的。","keywords":"政治抒情组诗先河 苦闷、孤独 忧愤深广 故作旷达 风格隐约曲折 与建安风骨一脉相承 五言","note":"阮籍的《咏怀诗》，开创了政治抒情组诗的先河，抒发了苦闷、孤独的情绪和忧愤深广的情怀，这与阮籍处于当时那样一个黑暗的时代有关。在诗歌艺术上，他也做出了许多开拓，继续推进五言诗的创作。相关内容可以参考贺雯婧《阮籍＜咏怀诗＞研究》、张翔《阮籍＜咏怀诗＞研究》，具体资料可以在李凡文学正版群中领取。"},{"id":"83","stars":"★★★","title":"嵇康诗歌的创作特征","body":"嵇康的诗，现存五十馀首。有四言、五言、七言和杂言，而以四言成就较高。总体来看，嵇康的诗歌创作特征，主要表现在以下方面：\n\n一、清高峻切的性格与超尘脱俗的意象\n\n嵇康的性格明显地表现为两面：一面崇尚老庄，恬静寡欲，好服食，求长生；一面却尚奇任侠，刚肠嫉恶，在现实生活中锋芒毕露。所以，嵇康既有恬静寡欲、好尚自然的庄老思想，也有狂放不羁、任侠尚气的一面，看似矛盾的品性统一在他身上，就形成清高峻切的独特性格。从嵇康诗歌中的意象群看来，绝大部分意象所蕴含的意味大抵可以用“超尘脱俗”来归\n\n结。这样的意蕴反映了他内心不一样的理想以及他的自然观和人生观。而这个意象群最终都指向一个归处：处处表现嵇康超尘脱俗的情怀隽洁的情意，展现他高洁的人格以及他坚强不屈峻切的性情。\n\n二、擅长四言，在取法《诗经》的基础上又有所创新\n\n嵇康的诗歌虽有四言、五言、七言、杂言等多种体裁，而他最擅长的则在四言。嵇康的四言诗是继曹操之后又一成功典范，诗较曹操又有所创新。嵇康在取法《诗经》的基础上又使其个性化，他用他全部的生命激情、个性与峻切之气，对传统四言进行了改造，跳出“思无邪”之俗套而投入全部性情独抒性灵，表现出强烈的抒情性和鲜明的个性色彩。这要和其文章创作中表现出来的风格相呼应。他不再受《诗经》和乐府的羁绊，直抒胸臆，写出他潇洒超然、清峻豪迈的情怀与境界。\n\n三、吟咏以肆志、寄言以广意的文学观\n\n嵇康的哲学观要旨是越名教而任自然，提倡自然道德，而不是儒家道德，这是嵇康文学观的哲学支撑。在这一哲学指导下，嵇康提出“吟咏以肆志”的文学观，肯定文学的抒情特性，并且认为抒情并没有特别节制的要求。同时，嵇康提出“寄言以广意”，点明诗在不能完全表达思想观点的情况下，用文这样更合适的体裁来阐释思想观点。\n\n嵇康吟咏以肆志、寄言以广意的文学观与其诗文创作特色是吻合的。嵇康的诗从内容方面看可分为赠答述志、隐逸游仙、阐述玄理三种类型，赠答述志和隐逸游仙诗体现“肆志”抒情和“广义”说理的观点，阐述玄理则是“广义”说理之作。其诗的艺术特色有抒情直接，即所谓“峻切”，是“肆志”之“肆”的体现，而说理条理逻辑清晰则符合寄言广义的要求。","keywords":"清高峻切 超尘脱俗 擅长四言 吟咏以肆志 寄言以广意","note":"曹魏后期，政局混乱，司马懿父子掌握朝政，大肆诛杀异己。此时文人的命运与建安时大不相同。嵇康拒绝与司马氏合作，亦惨遭杀害。嵇康诗，主要就是针对当时黑暗的现实，表现自己独特的人生观，整体呈现出“清峻”的风格。在形式上，他以四言诗创作成就最高。同时，要注意嵇康独特的文学观。相关内容可以参考王强《嵇康研究》，具体资料可以在李凡文学正版群中领取。"},{"id":"84","stars":"★★","title":"魏晋南北朝时期政权更迭、南北对立对文学写作的影响","body":"魏晋南北朝长期处于战乱分裂的局势，政权的更迭十分频繁，就连存在时间最长、相对安定的北魏，统一北方的时间也不过百年，而且其间也时常爆发内乱。\n\n一、思想解放，但与政治距离较远\n\n在思想统治上，此时两种相反的倾向是并存的。一方面，自东汉末年以来，礼教对人的控制已渐松弛，曹魏的统治更给人们的思想带来了一次大解放。此后玄学兴起，佛教流行，儒家思想虽然在中央政权中始终处于核心地位，但独尊的局面就此打破了。另一方面，频繁地改朝换代势必令统治者对异己思想进行残酷打压，曹操之杀孔融、杨修，曹丕之杀丁仪、丁廙及迫害曹植，已是统治者诛杀异己的开端，司马氏篡魏，士人更是噤若寒蝉，所以何晏被杀，天下名士去其半；嵇康遭戮，向秀失图。此后士人除了俯首于司马氏，别无选择。整个魏晋南北朝时期，许多文人因卷入政治斗争而不得善终，当时士人不仅会因政见不合招致杀身之祸，还往往以身负才学而见忌于当权。在如此险恶的政局下，人的思想虽然解放，但除了发言玄远的清谈玄理，就是纵情山水、沉迷声色，文字上也难免表现为上述内容和倾向。\n\n二、文化上不平衡发展\n\n魏晋南北朝是南北政权对峙的时期，在文化上表现为不平衡发展。南方文化相对来说较为成熟，文学创作取得了很高的成就。北方尤其是前期，主要是向南方文化学习，一些较为有名的作家，很明显在南方作家作品中讨生活。\n\n尽管如此，北朝作家仍然具有自己的风格。总的说来，北朝文学比较重实用，思想上尊崇儒学，维护礼教、纲常，因此现实性较强。在文体的选择上也与南方有所不同，比较重应用性文体。北朝的散文很发达，是胜于南方作家的。\n\n三、南北文学交流频繁\n\n不过南北虽然对峙，文化交流却很频繁，而且形式多种多样。著名者如庾信由南入北，其文风对北人产生了极大影响。这不仅直接促进了北朝文学的进步，而且庾信自己也汲取了北方的营养，他那写于北方，表现乡关之思、亡国之恨、羁旅之悲的作品，为他赢得了文学史上不朽的声名。这些作品是南北文化融合背景中的产物。庾信的成功，显示出南北方文学传统合流后所能取得的成就，同时北方文学已经具有了自己独立的风格特征，在许多方面都已赶上，甚至超过了南方文学。","keywords":"思想统治 思想解放 对异己思想残酷打压 文化不平衡发展 文化交流频繁","note":"魏晋南北朝时期，政权更迭，南北对立。由于政权更迭较快，因而无法形成严密的思想控制，但也造成了许多政治斗争和打击异己，这导致文人们大多只能寄情山水、崇尚玄谈。而由于南北政权对峙，一方面导致了文化发展不平衡，另一方面却也促进了二者的文化交流，整体推动了文学的发展。"},{"id":"85","stars":"★★★","title":"晋宋之际山水诗大量出现的原因（26湖南师范大学）","body":"一、生命主题成为诗人歌咏的对象\n\n由于社会黑暗混乱，生存维艰，汉末以来生命主题已成为诗人歌咏的对象。三国时期，诗人们摆脱了礼教的束缚，在干疮百孔的社会废墟上慷慨悲歌，抒发自我的生命体验，再现了汉末社会真实面貌。自司马氏掌权，以礼教的名义大肆诛杀异己，故而正始名士大呼“礼岂为我辈设也”，隐曲地表达胸中的愤懑和不满，抒发忧生之嗟，以自然对抗名教。此时，玄言诗也在悄然兴起。至西晋，政治高压之下，以自然为尚的玄学沦为清谈，实际上是向统治者的所谓名教屈服了。其时士无特操，更没有了进取的激情。故而太康文学虽勃而复兴，但已无复建安之风力，东晋更以玄言诗独标一代。\n\n二、玄谈流行\n\n“淡乎寡味”的玄言诗风中早已开始酝酿新的质素。玄学本身即有很强的审美趣味，谈玄者常因谈论之玄妙而流连忘倦，玄谈本身即是一种审美。他们最初注重仪容之美，渐渐地许多其他事物也进入人们的审美视野，而明秀的江南山水也就愈益成为诗人审美歌咏的对象。在他们看来，山水的自然与玄理的自然是相冥合的，在山水田园中诗人可以更好地冥悟自然真率的玄理。陶渊明出现于晋末宋初，绝非偶然之事。陶渊明诗文顺应自然、真率质朴，但行文不苟，字句凝练而不可移易，这与他身处的时代，他的个性才情，以及他思想中融合了玄、儒都是不可分割的。在六朝，山水小品和山水诗都达到了极高的水平，这与玄学思想的流行是紧密相关的。\n\n三、隐居成为许多士人切实的选择\n\n政局的不安，生命的易逝，玄学的流行，以及佛教的传入，加上士族的富庶，使得隐居不再停留在口头上，而是成为了许多士人切实的选择。高卧东山，归隐田园，成为此时一些人的真实追求，或者某些人自高身价的捷径。不论何种情形，隐逸终于成为文坛吟咏的一大主题。如果说左思和陆机的《招隐诗》、王康琚的《反招隐诗》是受了淮南小山的《招隐士》之影响，潘岳的《闲居赋》来自张衡《归田赋》的启发，那么陶渊明的大量描写田园隐居生活的诗歌，则是他隐居躬耕生活的真实写照，无怪乎锺嵘许之为“古今隐逸诗人之宗”了。","keywords":"生命主题 政治高压 玄言诗风 山水田园 隐居","note":"魏晋时期山水田园诗的出现，与当时政治的高压、玄学的流行有关。同时，随着佛教的传入和士族的逐渐富庶，隐居成了许多士人的切实选择，所以才有魏晋时期山水田园诗的出现和隐居的盛行。除了魏晋时期，唐代的山水田园诗也繁盛一时，这两个时期山水田园诗繁荣的原因有其相同之处，但也有区别，大家要注意一下。"},{"id":"86","stars":"★★★","title":"结合陆机与潘岳的创作，谈谈太康诗风的特征","body":"所谓太康诗风就是指以陆、潘为代表的西晋诗风。由于时代的原因，潘、陆诸人不可能唱出建安诗歌的慷慨之音，也不会写出阮籍那种寄托遥深的作品，他们的努力表现在两个方面：一是拟古，二是追求形式技巧的进步，并表现出繁缛的诗风。\n\n一、拟古：摹拟《诗经》、汉乐府和《古诗十九首》\n\n摹拟《诗经》、汉乐府和《古诗十九首》，成为当时的风气。其中陆机的其他乐府诗也往往成为后来拟作同题乐府诗的样本。陆机的《拟古诗》十二首，基本上都是拟《古诗十九首》的，在内容上皆沿袭原题，格调上变朴素为文雅，显示出诗歌文人化的倾向，其总体水平不及原作。然而陆机有时能够拟得惟妙惟肖，有些地方还另有特色，已属难能可贵。\n\n二、繁缛的诗风\n\n在诗歌技巧方面，陆机、潘岳诸人进行了多方面的努力，形成了与汉魏古诗不同的艺术风貌-繁缛。与汉魏古诗相比，太康诗风“繁缛”的特征表现在以下几个方面：\n\n（一）语言由朴素古直趋向华丽藻饰\n\n陆机的《拟古诗》，可作为华丽藻饰的代表。《古诗·西北有高楼》和陆机的拟作内容相同，每两句所描绘的具体情景相似，结构也一致。可是风格有朴素和华丽之别。陆机、潘岳其他的诗作，以及张华的《情诗》《轻薄篇》《美女篇》等，与此类似。\n\n（二）描写由简单趋向繁复\n\n以《猛虎行》为例，《猛虎行》古辞十分简单，魏文帝、明帝的拟作也很简单，陆机的拟作大大地丰富了原作的内容，文辞委婉曲折，而以繁复取胜。又如潘岳的代表作《悼亡诗》三首，其一写丧妻后的悲痛之情，诗中叙亡妻葬后，自己准备赴任时的所见所感，笔触细腻，低徊哀婉。\n\n（三）句式由散行趋向骈偶\n\n例如陆机的名作《赴洛道中作》二首。除首尾之外，几乎都是偶句。其骈偶化的程度不但为汉诗所未见，而且也大大超过了曹植、王粲的诗作。潘岳的《金谷集作诗》《河阳县作诗》二首、《在怀县作诗》二首以及张协的《杂诗》等，也大量运用偶句。\n\n陆、潘诸人为了加强诗歌铺陈排比的描写功能，将辞赋的句式用于诗歌，丰富了诗歌的表现手法。他们诗中山水描写的成分大量增加，排偶之句主要用于描写山姿水态，为谢灵运、谢朓诸人的山水诗起了先导的作用。","keywords":"拟古 形式技巧的进步 繁缛的诗风 华丽藻饰 由简单趋向繁复 由散行趋向骈偶","note":"追求华辞丽藻、描写繁复详尽及大量运用排偶，是太康诗风“繁缛”特征的主要表现。从文学发展的规律来看，由质朴到华丽，由简单到繁复，是必然的趋势。关于以陆机、潘岳为代表的太康诗风的风格，需要大家有所掌握。太康诗风也是名词解释中常出现的内容，大家要注意一下。"},{"id":"87","stars":"★★★","title":"试分析左思《咏史诗》的思想艺术特色","body":"左思的作品与西晋太康文风有显著的不同，其《咏史诗》笔力遒劲，抒发了下层文人对现实的不满，是寒士文学的代表。左思《咏史诗》的思想艺术特色，主要表现在以下方面：\n\n一、名为咏史，实为咏怀\n\n左思的《咏史诗》不囿于咏史，把咏史和咏怀相结合。《咏史诗》八首为一个整体，有统一的主题，就是抒发下层知识分子怀才不遇的不平之气，其中包含作者对自身遭际的感慨。组诗的第一首就直抒胸臆，写出了作者的抱负和对才能的自信，奠定了整组诗的基调，如同整组诗的大纲。实际上左思的《咏史诗》都是借古人古事写自己的怀抱。\n\n二、主要表现寒士之不平及对士族的蔑视与抗争\n\n作者表现主题有两个侧重点，一是直接抨击门第观念和社会对下层人才的打压，二是借咏史来大力歌颂历史上出身下层或沉沦下僚的著名人物。在整组诗中，左思或极力赞颂荆轲、扬雄、许由等古人不拘流俗、不慕权势的形象，或引主父偃、朱买臣、陈平、司马相如等出身贫寒而建功立业的古人为例对当时的门第观念进行批判，或引古时隐士为同调，对荣华富贵、官场沉浮表现出冷眼旁观的态度。实际上整组诗仍是以咏史为途径，立足于现实社会，抒发对当时社会的不满。\n\n三、气势雄健，慷慨淋漓\n\n左思的诗歌不尚词采，饱含慷慨之气，笔力遒劲，在西晋诗坛独树一帜，成就突出。锺嵘认为他的诗源出于刘桢，正是就这一点而言的。就风格而论，《咏史》无论写志向抱负、失望愤懑、高蹈遗世安贫乐道，无不气势雄健，慷慨淋漓。诗人创造的自我形象或历史人物形象，诸如谋臣策士、游侠刺客、文人学者、高人隐士、失路英雄无不有睥睨四海的傲岸之气。如此作风与气概，锺嵘谓之“野”，刘熙载谓之“豪放”。\n\n四、文典以怨，得讽谕之致\n\n锺嵘《诗品》置左思于上品，评其诗曰：“文典以怨，颇为精切，得讽谕之致。”左思诗多引史实，故曰“典”。借古讽今，对现实政治持批评态度，故曰“怨”。而借古讽今又能做到深刻恰当，故曰“精切”。他的诗能起到讽谕作用，故日“得讽谕之致”。锺嵘《诗品》还说左思的诗“出于公幹”，公幹即建安诗人刘桢。在论及陶渊明时则说“又协左思风力”，“风力”与“风骨”义近。锺嵘标举“左思风力”，含有左思再现了建安风骨的意思，这是很有道理的。\n\n左思的《咏史》八首，开创了咏史诗借咏史以咏怀的新路，成为后世诗人效法的范例，这是他对中国诗歌史的独特贡献。","keywords":"名为咏史 实为咏怀 寒士不平 对士族蔑视与抗争 气势雄健 慷慨淋漓 文典以怨 得讽谕之致","note":"左思的《咏史》八首，开创了咏史诗借咏史以咏怀的新路，成为后世诗人效法的范例，这是他对中国诗歌史的独特贡献，所以前人评云：“创成一体，垂式千秋。”左思的咏史诗表现了寒士的不平和对士族的蔑视与抗争，被标举为“左思风力”，这些内容大家要有所掌握。"},{"id":"88","stars":"★★","title":"试分析郭璞游仙诗的思想艺术特征","body":"郭璞借游仙写其坎壤之怀，继承了《诗》《骚》的比兴寄托传统，以游仙写失意之悲，与左思借咏史抒牢骚不平，有异曲同工之妙。具体来看，郭璞的游仙诗主要具备如下特征：\n\n一、借游仙以表示对现实的不满与反抗\n\n郭璞南渡后，深感世路坎，祸福难测，又目睹晋室豪族争权夺利，不思北伐，乃作《游仙诗》以明志。《游仙》既言隐逸，又言求仙。二者都是诗人所追求的。然而理智告诉诗人，仙界又最终是不可企及的。不独如此，即使高蹈遗世，诗人的内心也是很不平静的。南渡之后，诗人的身心，依然系于现实人生。从诗歌的内在精神来说，郭璞的《游仙诗》与曹植的《游仙诗》是一脉相承的，是借游仙来排遣对现实的不满和壮志难酬的愤懑。故郭璞诗的“游仙”形式，虽源自汉人乐府，但其忧心时事的精神和隐而不显的风格，却是源自《离骚》与阮籍《咏怀》的。\n\n二、既能用典，又讲究对仗和语言锻炼\n\n郭璞在东晋初年诗人中，不但在内容方面独树一帜，而且遣词造句也和当时人不甚相同。他继承了太康诗人重辞采，比较讲求对仗等特点。他又是个渊博的学者，善于在《楚辞》《山海经》等书中吸取神话故事，作为构思之助。因此他遣词造句，既能化用古书中的典故，又在对仗和语言的锻炼方面颇费工夫，确可以当得起锺嵘所谓“文体相辉，彪炳可玩”的评语。比起东晋初年那些“淡乎寡味”的玄言诗来，毕竟远胜，所以古人评为“中兴第一”，确实不是过誉。\n\n三、辞藻清丽，富于形象性\n\n郭璞的《游仙诗》辞藻清丽，富于形象性，在盛行玄言诗的东晋诗坛独树一帜，《文心雕龙·明诗》说“景纯仙篇，挺拔而为俊矣”，指出了《游仙诗》在当时的独特地位和成就。和一般游仙诗往往写得过于抽象不同，当他写到一些隐居山林的求仙之士时，往往能用鲜明生动的形象，刻画出那种幽静宁谧的山景。如第三首说：“翡翠戏兰苕，容色更相鲜，绿萝结高林，蒙笼盖一山......赤松临上游，驾鸿乘紫烟，左挹浮丘袖，右拍洪崖肩”，郭璞在写想象中的神仙居处和生活情态，形象鲜明而生动。\n\n在玄言诗盛行的东晋诗坛，郭璞借游仙诗抒发自己的抑郁之情和哀世之感，以现实、人生充实诗歌的内容，这些发自肺腑的诗句，与那些“理过其辞，淡乎寡味”的玄言诗相比，显示出独特的艺术魅力。郭璞的游仙诗，为晋代诗风的转变，山水诗的兴起做出了贡献。","keywords":"不满与反抗 用典 对仗 语言锻炼 辞藻清丽 富于形象性","note":"郭璞的《游仙诗》与当时的玄言诗有很大的区别，主要抒发的是发源自儒家，壮志难酬的思想。即使是写神仙世界，也别有怀抱，更是以文采富丽见称于时。可以将其游仙诗与左思咏史诗做类比，都是表达了对现实的失意和不平。相关内容可以参考魏晓虹《郭璞游仙诗的艺术特色》，具体资料可以在李凡文学正版群中领取。"},{"id":"89","stars":"★★","title":"简要论述东晋玄言诗","body":"一、形成原因\n\n玄言诗兴盛于东晋，一方面是魏晋玄学及清谈之风兴盛的结果，另一方面也与东晋政局及由此而形成的士人心态有关。\n\n（一）清谈之风兴盛\n\n东晋王朝建立之初，曾数次北伐，均告失败。北方既不可恢复，江南又山清水秀，南渡士人就在此安居下来。起源于中朝的清谈之风，也被过江诸人带至东晋，并且风气日炽。这种心态对东晋文人影响很大。玄言诗的兴盛，便是在这种心态下，老庄玄理与山水之美相混合的产物。\n\n（二）玄释合流让士人追求“心隐”的生活态度\n\n东晋玄言诗的发展，与佛教的流行大有关系，玄释合流，给东晋玄言诗人的思想和生活带来很大影响。思想上，支遁注《逍遥游》之新义，为众人所接受。东晋士人在这种思想指导下，又处于较为安定富足的生活环境中，因而追求“心隐”，无论在朝在野，只求适意而已。以幽雅从容的风度，过着风流潇洒的生活。当时方内名士与方外高僧无不追求这种生活方式，而这一生活的主体，便是山水、清谈和诗酒风流。东晋玄言诗便是在这一背景下产生、发展的。\n\n二、主要特征\n\n（一）诗歌主题单一\n\n所谓玄言诗，就是用诗歌的形式阐释玄学，语言枯燥，缺乏形象性，其所阐释的“理”也基本限制在《老子》《庄子》的范围内，诗歌主题相对单一。\n\n（二）淡乎寡味，缺乏形象\n\n东晋玄言诗的特点，从现存玄言诗来看，的确淡乎寡味，缺乏形象。玄言诗人虽多与名僧交往，但玄释合流，主要体现在思想和生活方式上，在现存的玄言诗中，佛学的痕迹并不浓厚，即使在名僧支遁的诗中，也是以抒发老庄玄理为主。玄言诗中也有形象性较强的作品，大都借山水以抒情。\n\n三、成就与影响\n\n玄言诗自身的成就不高，但从文学史的角度而言，它对诗歌的发展并非只有消极的影响。\n\n（一）玄言诗人都深受道家思想的影响，崇尚自然，他们往往在自然山水中体味道的玄妙，因此玄言诗中出现了不少描写山水的诗句，这对山水诗的形成至关重要。\n\n（二）玄言诗对言外之意的追求影响了后世的审美趣味，自魏晋玄学形成时期以来，言意之辨就是玄学的重要论题，“言不尽意”“得意忘言”等玄学义理深入人心，文人在欣赏文学作品时也注意体会作品的言外之意，尤其是体会其中蕴含的理趣。玄言诗多不尚词藻，诗人或有意或无意地追求诗句的言外之意，追求清新、自然淡远的风格。这些都奠定了后世山水诗歌的一种审美基调。\n\n（三）东晋玄言诗盛行，注重说理，这在中国古代诗歌史上是较为罕见的现象。虽然玄言诗本身的成就不高，主题单一但却是说理诗写作的尝试，开拓了古代诗歌的表现领域，为后来的说理诗写作提供了创作经验。","keywords":"清谈之风 玄释合流 心隐 主题单一 淡乎寡味 缺乏形象 山水诗形成 审美基调 说理诗","note":"东晋玄言诗的盛行，一是因为当时人们心态上追求“清净”，二是因为玄释合流影响了当时人们的行为与思想。玄言诗艺术价值不高，但对后世影响深远，主要体现在对山水诗和说理诗的影响上，大家要注意。"},{"id":"90","stars":"★★★★","title":"试分析陶渊明的思想性格","body":"陶渊明的思想既融会了儒道两家之说，又来自他本人的生活实践，具有独特的视点、方式和结论；而思考的结论又付诸实践身体力行。安贫乐道与崇尚自然，是陶渊明思考人生所得出的两个主要结论，也是他人生的两大支柱。\n\n一、安贫乐道\n\n“安贫乐道”是陶渊明的为人准则。他所谓“道”，偏重于个人的品德节操方面，体现了儒家思想。他特别推崇颜回、黔娄、袁安、荣启期等安贫乐道的贫士，希望自己像他们那样努力保持品德节操的纯洁，绝不为追求高官厚禄而玷污自己。他并不是一般地鄙视出仕，而是不肯同流合污。他希望建功立业，又要功成身退。他也考虑贫富的问题，安贫和求富在他心中常常发生矛盾，但是他能用“道”来求得平衡，而那些安贫乐道的古代贤人，也就成为他的榜样。他的晚年很贫穷，到了挨饿的程度，但是并没有丧失其为人的准则。\n\n二、崇尚自然\n\n崇尚自然是陶渊明对人生的更深刻的哲学思考。“自然”者，事物自身之本然，即非人为的、本来的样子，亦即“真”。它是一种状态，非人为的、本来如此的、自然而然的。世间万物皆按其本来的面貌而存在，依其自身固有的规律而变化，无须任何外在的条件和力量。人应当顺应自然的状态和变化，抱朴而含真。陶渊明希望返归和保持自己本来的、未经世俗异化的、天真的性情。纯任自然的陶渊明既有同于时人的名士风流，又有异于时人的拔俗性情。崇尚自然是魏晋名士风流的共同点，而陶渊明的“自然”性情中又有“守拙”“抱朴”的特点。陶渊明在《与子俨等疏》中自称“性刚才拙，与物多忤。自量为己，必贻俗患”，以其出处行止而言，亦是实情。陶渊明崇尚自然的思想以及由此引导出来的顺化、养真的思想，已经形成比较完整而一贯的哲学。\n\n总之，陶渊明的思想可以这样概括：通过泯去后天的经过世俗熏染的“伪我”，以求返归一个“真我”，陶渊明看到了社会的腐朽，但没有力量去改变它，只好追求自身道德的完善。他看到了社会的危机，但找不到正确的途径去挽救它，只好求救于人性的复归。这在他自己也许能部分地达到，特别是在他所创造的诗境里，但作为医治社会的药方却是无效的。\n\n【李凡关键词：安贫乐道 崇尚自然“伪我”“真我”】","keywords":"","note":"陶渊明的思想很复杂，他崇尚儒学，也受到了道家影响，还受到了佛教的影响。多种思想交织之下，他得出了安贫乐道与崇尚自然两个重要的结论，这是他生命的支柱。陶渊明的思想影响了他的诗歌创作实践，需要我们有所掌握。相关内容可以参考张可礼《陶渊明的文艺思想》，具体资料可以在李凡文学正版群中领取。"},{"id":"91","stars":"★★★★★","title":"试述陶渊明田园诗的主要内容","body":"田园诗是陶渊明为中国文学增添的一种新的题材。以自己的田园生活为内容，并真切地写出躬耕之甘苦，陶渊明是中国文学史上的第一人。具体来看，陶渊明田园诗的主要内容包括以下方面：\n\n一、展现丰富的生活内容，表现自己悠然自得的心境\n\n陶渊明的田园诗有的是通过描写田园景物的恬美、田园生活的简朴，表现自己悠然自得的心境。或春游、或登高、或酌酒、或读书，或与朋友谈心，或与家人团聚，或盥溜于檐下，或采菊于东篱，以及在南风下张开翅膀的新苗、日见茁壮的桑\n\n麻，无不化为美妙的诗歌。诗人的田园生活虽然是远离统治阶级，却更接近了下层文人和农民。这里有志同道合的朋友谈心赏文，有朴实的农民共话桑麻，有邻里的相与宴饮，也有天伦之乐。所以，他的田园诗是有着丰富的现实生活内容的，这也是他的田园诗动人的原因之一。\n\n二、表现躬耕的生活体验\n\n陶渊明的田园诗有的着重写躬耕的生活体验，这是其田园诗最有特点的部分，也是最为可贵的部分。《诗经》中有农事诗，那是农夫们一边劳动一边唱的歌。至于士大夫亲身参加农耕，并用诗写出农耕体验的，陶渊明是第一位。陶渊明之后的田园诗，真正写自己劳动生活的也不多见。由于诗人亲自参加了农业劳动，并由衷地喜爱它，劳动，第一次在文人创作中得到充分的歌颂。陶渊明的一些田园诗还表现了只有一个劳动者才可能体会的思想感情，展现劳动者躬耕的艰辛。此外。在农耕生活的描写背后，隐然含有农耕与为官两种生活的对比，以及对理想人生的追求。\n\n三、展现自己的穷困和农村的凋敝\n\n有些田园诗是陶渊明写自己的穷困和农村的凋敝。陶渊明还有一些田园诗描写了他的田园生活的贫困状况。这些诗虽然只是描述他自己晚年每逢天灾不免屡受饥寒的境遇，但是我们也可以从中想见当时农民们更加悲惨的生活情景。躬耕的甘苦并不止于劳作的艰辛，有时还会遇上火灾，使得“一宅无遗宇”，不得不迁居他处；贫困和灾难的不期而至，有时竟会逼迫他出门乞食。农耕生活的感受既是陶渊明个人的，又是能够反映当时农村实情的。","keywords":"新的题材 悠然自得的心境 躬耕的生活体验 自己的穷困 农村的凋敝","note":"陶渊明是中国文学史上的第一个将自己的田园躬耕生活写入诗歌的作家，同时田园诗也是陶渊明最具有特色的作品，陶渊明田园诗主要表现了田园生活的简朴、恬美，躬耕的生活体验和自己的穷困，农村的凋敝，需要重点掌握。"},{"id":"92","stars":"★★★","title":"试述陶渊明的诗歌题材","body":"陶诗的题材主要可以分为五类：田园诗、咏怀诗、咏史诗、行役诗、赠答诗。\n\n一、田园诗\n\n田园诗和山水诗往往并称，但这是两类不同的题材。陶渊明的诗严格地讲只有《游斜川》一首是山水诗，他写得多的是田园诗。田园诗是陶渊明为中国文学增添的一种新的题材。以自己的田园生活为内容，并真切地写出躬耕之甘苦，陶渊明是中国文学史上的第一人。他的田园诗有的是通过描写田园景物的恬美、田园生活的简朴，表现自己悠然自得的心境。有的着重写躬耕的生活体验，这是其田园诗最有特点的部分，也是最为可贵的部分。有些田园诗是他写自己的穷困和农村的凋敝。\n\n二、咏怀、咏史诗\n\n咏怀诗和咏史诗内容有相近之处，咏史也是咏怀，不过是借史实为媒介而已。他的咏怀诗有些是以组诗的形式写成的，如《饮酒》《拟古》《杂诗》。他的咏史诗所咏的对象偏重于古代的人物，如“三良”“二疏”、荆轲，以及《咏贫士》所写的古代贫士。《读山海经》也可归入这一类。这些咏怀、咏史之作，明显地继承了阮籍、左思诗歌的传统，又有陶渊明自己的特点。这就是围绕着出仕与归隐这个中心，表现自己不与统治者同流合污的品格。其中有对自己生平的回顾，如《饮酒》其十九；有对社会的抨击，如《饮酒》其二十。不乏惋惜也不乏激愤，如《咏荆轲》。从《杂诗》其二可以看出，陶渊明的忧愤是深而且广的。\n\n三、行役诗\n\n陶渊明的行役诗都是他宦游期间的作品，它们有一个共同的主题，就是悲叹行役的辛苦，表达对仕宦的厌倦，反复诉说对田园的思念和归隐的决心。悲叹行役的辛苦原是此前行役诗共同的内容，后两者则是陶渊明所特有的，而且越到后来这两种情绪就越强烈，那种失去自由的无奈之感，成为这类诗的基调。\n\n四、赠答诗\n\n陶渊明的赠答诗颇能见其对友人的敦厚之情。赠答是古已有之的传统题材，传为苏李赠答的诗歌以叙离情见长，曹植的《赠白马王彪》以抒幽愤著名，刘桢的《赠从弟》表现了高洁的品格，嵇康的《赠秀才入军》展示了洒脱的情趣。陶渊明的赠答诗又有他自己的特点：以其真挚的感情、家常的内容、隽永的意味、既不火热也不冷淡的语调，为自己塑造了一位仁者的形象。\n\n在以上五类题材之外，陶渊明还有一些以发挥哲理为主要内容的作品，如《形影神》《连雨独饮》《拟挽歌辞》也可以归入这一类。这类诗可以视为玄言诗，但与东晋流行的玄言诗有所不同，并非“柱下之旨归”或“漆园之义疏”，而是将生活中的体验提炼到哲学的高度。魏晋人注重门阀，陶诗中有的写到宗族关系或对儿子加以训诫，如《命子》《责子》《赠长沙公》等，可见陶渊明也还是重视家族的荣誉和门第的。\n\n【李凡关键词：新的题材 咏怀咏史内容有相近之处 悲叹行役的辛苦 敦厚之情】\n\n【李凡说：陶渊明的诗歌题材内容主要可以分为五类，每一类都有其特色，都是在继承前人的基础上做出了自己的发展，尤其是田园诗，具有十分重要的地位，大家要仔细掌握。除了这五类题材之外，还有一些其他题材内容的作品，大家稍微了解即可。】","keywords":"","note":""},{"id":"93","stars":"★★★★★","title":"试分析陶渊明诗歌的艺术特征（25中央财经大学）","body":"陶渊明的诗歌题材多样，风格也是多样的，他以其真率质朴的如椽巨笔，不仅为诗坛开辟出田园的领地，更为后世描绘出真实的人生场景。陶渊明以其独具风采的创作铸就了中国诗史上第一流诗人的地位。具体来看，陶渊明诗歌的艺术特征，主要表现在以下方面：\n\n一、“自然”的艺术追求\n\n自然，不仅是陶渊明的人生旨趣，也是其诗歌的总体艺术特征。他作诗不存驰誉之心，生活中有了感触就诉诸笔墨，既无矫情也不矫饰。陶诗的声吻和节奏，舒缓而沉稳，给人以蔼如之感。陶诗多用内省式的话语，坦诚地记录了他内心细微的波澜，没有夺人的气势，没有雄辩的力量，也没有轩昂的气象，却如春雨一样慢慢地渗透到读者的心中。他的诗不追求强烈的刺激，没有浓重的色彩，没有曲折的结构，纯是自然流露，一片神行。但因其人格清高超逸，生活体验真切深刻，所以只要原原本本地写出来就有感染力。\n\n二、情、景、事、理的浑融\n\n陶渊明描写景物并不追求物象的形似，叙事也不追求情节的曲折，而是透过人人可见之物、普普通通之事，表达高于世人之情，写出人所未必能够悟出之理。陶诗重在写心，写那种与景物融而为一的、对人生了悟明彻的心境。他无意于模山范水，也不在乎什么似与不似，只是写出他自己胸中的一片天地。陶诗发乎事，源乎景，缘乎情，而以理为统摄。而这“理”是在生活中亲自体验到的，其中包含着生活的情趣。陶诗表现了他对宇宙、历史和人生的认识，是探求其奥秘和意义的结晶，而这一切又是用格言一样既有情趣又有理趣的语言表现的，取得了言有尽而意无穷的效果。自然的万物，诗人的形神，道的虚静无为，三者融为一体，陶诗的平淡由此而来，其平淡中蕴含有深刻的哲理亦由此而来。这种情、景，物、理交融的艺术境界与东晋玄言诗风大相异趣；哲学与诗的结合，亦即诗的哲理化，在陶诗之中，才算得到了真正的实现。\n\n三、平淡中见警策，朴素中见绮丽\n\n前人往往用“平淡朴素”概括陶诗的风格，然而陶诗不仅仅是平淡，陶诗的好处是在平淡中见警策；陶诗不仅仅是朴素，陶诗的好处是在朴素中见绮丽。\n\n陶渊明的诗给人的突出印象是平淡自然。这是和他的诗歌内容以及表现上的特点分不开的。他的诗的主要内容是平淡的田园风光，农村的日常生活，以及处于这种生活中的恬静心境；而又是通过朴素的语言，白描的手法，真率自然地抒写出来，使人感到真好像是从“胸中自然流出”，没有一点斧凿痕迹。\n\n陶渊明的诗歌虽然平淡，却不浅薄，相反只使人感到淳厚有味。他的诗歌语言虽然只是极普通的“田家语”，却是经过高度艺术提炼的，平淡之中可见绮丽。而在这十分精粹的语言中又都含有丰富的形象，这些形象无论是自然风光，或是社会生活，都有着深厚的现实生活基础。\n\n四、将日常生活诗化\n\n陶诗的一大特点也是他的一种开创，就是将日常生活诗化，在日常生活中发现重要的意义和久而弥淳的诗味。在他以前，屈原、曹操、曹植、阮籍、陆机等都着重写社会政治的题材，陶渊明则着重写普通民众的普通生活，用家常话写家常事，写得诗意盎然。","keywords":"自然 情、景、事、理的浑融 平淡中见警策，朴素中见绮丽 日常生活诗化","note":"“自然”是陶渊明诗歌的总体特征，这一特征既体现在内容上，又体现在艺术上。陶渊明这种“自然”的追求，与他之前的曹植、左思等诗人都形成了区别，在某种程度上具有开创性意义，对后世诗人的诗歌创作有很大的启发。因而，陶渊明的诗歌创作特征是考查中的一个重点，大家要仔细掌握。"},{"id":"94","stars":"★★★★","title":"谈谈你对陶渊明“古今隐逸诗人之宗”的理解及评价（北京师范大学）","body":"文体省净，殆无长语。笃意真古，辞兴婉惬。每观其文，想其人德。世叹其质直。至如欢言醉春酒、日暮天无云，风华清靡，岂直为田家语邪？古今隐逸诗人之宗也。\n\n-钟嵘《诗品》\n\n【答题框架】\n\n钟嵘评价陶渊明为“古今隐逸诗人之宗”，这一评价既体现了陶渊明在隐逸诗歌创作中的开创性地位，也反映了南朝文学批评的审美取向，对于这一观点的理解和评价，主要如下：\n\n一、钟嵘评价陶渊明为“古今隐逸诗人之宗”，核心在于其诗歌内容与人格精神的统一\n\n“安贫乐道”是陶渊明的为人准则。他特别推崇颜回、黔娄、袁安、荣启期等安贫乐道的贫士，希望自己像他们那样努力保持品德节操的纯洁，绝不为追求高官厚禄而玷污自己。崇尚自然是陶渊明对人生的更深刻的哲学思考。陶渊明希望返归和保持自己本来的、未经世俗异化的、天真的性情。\n\n而在艺术上，陶渊明的诗给人的突出印象就是平淡自然。他的诗的主要内容是平淡的田园风光，农村的日常生活，以及处于这种生活中的恬静心境；而又是通过朴素的语言，白描的手法，真率自然地抒写出来，使人感到真好像是从“胸中自然流出”，没有一点斧凿痕迹。\n\n钟嵘明显是看到了陶渊明思想上与其诗歌艺术上的共通之处，才得出了“古今隐逸诗人之宗”这一评论。\n\n二、钟嵘这一评价，有其合理之处，但也有局限性\n\n（一）钟嵘的这一评价确定了陶渊明的诗人身份，肯定了陶渊明在隐逸题材诗歌上的开创性地位，总结出陶渊明语言质朴自然，又强调其内蕴的文采的特点，对我们认识陶渊明诗歌创作特征以及文学史地位是有很大的帮助的。\n\n在钟嵘之前，人们多是从隐居的角度赞颂陶渊明品德的高洁的。沈约把他列入《宋书·隐逸传》，颜延之的《陶征士诔》对陶渊明的文学成就只是“学非称师，文取指达”一笔带过而已。钟嵘《诗品》称陶渊明为“古今隐逸诗人之宗”，才算定了他诗人的身份。\n\n在艺术上，钟嵘指出陶诗“风华清靡，岂直为田家语邪”，既肯定其语言质朴自然，又强调其内蕴的文采，敏锐地捕折到陶诗对隐逸主题的深化与范式化意义，对于后世诗人认识陶渊明的诗歌创作艺术有很大的启发。\n\n（二）钟嵘将陶诗列为中品，与陆机、谢灵运等绮丽诗风并列，反映出南朝文坛对“错彩镂金”的偏好，而陶诗“质实绮”的审美特质尚未被充分认知。同时，“古今隐逸诗人之宗”对隐逸主题的强调还遮蔽了陶渊明思想的复杂性。所以，这一观点也有其局限性。\n\n陶渊明的诗歌虽然平淡，却不浅薄，相反只使人感到淳厚有味。他的诗歌语言虽然只是极普通的“田家语”，却是经过高度艺术提炼的，平淡之中可见绮丽。而在这十分精粹的语言中又都含有丰富的形象，这些形象无论是自然风光，或是社会生活，都有着深厚的现实生活基础。总而言之就是平淡中见警策，朴素中见绮丽。这一点是钟嵘还没有认识到的。\n\n同时，从思想上来看，陶渊明的思想也是十分复杂的。从对隐逸的追求来看，陶渊明与东晋其他隐逸诗人是有一定的别的，他不是为隐逸而隐逸，而是希望通过隐逸来保持自己对“真”的追求。陶渊明看到了社会的腐朽，但没有力量去改引它，只好追求自身道德的完善。除此以外，陶渊明思想中消极的东西也不少。比如乐天安命的思想，及时行乐的思想，＂生似幻化，终当归空无”的虚无主义思想等等，都是要慎重分析对待的。\n\n总体来看，钟嵘的这一评价有其可取之处，但也有局限性，不过无论如何，对我们认识陶渊明及其诗歌创作来说都具有重要的意义。","keywords":"开创性地位 审美取向 诗歌内容与人格精神的统一 安贫乐道 崇尚自然 平淡自然 诗人身份 隐逸主题的深什与范式化 尚未被充分认知 思想的复杂性","note":"回答这道题，我们首先要明确的是陶渊明的思想内容以及其诗歌艺术特征，但同时对于钟嵘“古今隐逸诗人之宗这一评价的提出背景也要有所掌握。题目中引用的这段话出自钟嵘的《诗品》，在《诗品》中，钟嵘仅将陶渊明的诗歌列为中品，并没有像后世那样将其放到一个很高的位置，这其实与当时盛行绮丽诗风密切相关，陶渊明的诗歌与当时的流行风格背道而驰，自然得不到重视。不仅如此，这一时期陶渊明的诗歌艺术成就还未得到广泛的承认（真正认识到陶渊明文学成就的是萧统），所以钟嵘对陶渊明的评价，其实也是当时诗坛某种程度上的反映。明确了这些背景之后，我们再去理解这个词价就很轻松了。很明显，钟嵘的这一评价有其合理之处，也有不足，我们结合陶渊明诗歌创作特征将其一一分析到位就可以**了。"},{"id":"95","stars":"★★★★","title":"试述陶渊明散文与辞赋的艺术成就","body":"陶渊明的辞赋和散文，虽然篇数不多，但也都写得很好。陶渊明在文学史上的地位和影响，有赖于他的散文和辞赋的，实不下于他的诗歌。特别是《五柳先生传》《桃花源记》和《归去来兮辞》，这三篇最见其性情和思想，也最著名。\n\n一、陶渊明散文的艺术成就\n\n陶渊明的散文都是用朴素简洁的文笔描写真实的思想感情，真切而且传神。《五柳先生传》是诗人自撰的小传。在一百多字的篇幅中，以极其简洁的笔墨表达了不同流俗的性格，清楚地划出一条与世俗的界限，从而塑造了一个清高洒脱、怡然自得、安贫乐道的隐士形象。五柳先生遂成为寄托中国古代士大夫理想的人物形象。\n\n《桃花源记》也不过三百多字，却生动地展现了理想社会的生活图景，令人悠然神往。桃花源里生活的是一群普通人，他们真淳质朴，毫无机心，享受着和平、宁静的生活，没有苛政的骚扰。这与污浊诈伪的现实形成极其鲜明的对比。“桃花源”对后世影响极大，成为人们的理想寄托。陶渊明说出了人类共同的愿望：对和平、自由、宁静的向往。从根本上讲，这才是他描绘的田园以及桃花源的恒久魅力之所在。\n\n此外《与子俨等疏》追叙生
