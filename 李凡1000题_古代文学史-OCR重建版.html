"},{"id":"216","stars":"★★★","title":"试分析李商隐咏史怀古诗的主要特征","body":"李商隐的咏史怀古诗和杜牧诗一起，代表着晚唐这一题材诗作的最高成就。总体来看，李商隐的咏史怀古诗，主要表现出以下特征：\n\n一、强烈的讽时性\n\n李商隐咏史诗的显著特征之一，是强烈的讽时性。咏史诗所歌咏的历史人事，并不一定都与政治有关；即使有关，诗人也完全可以泛泛咏古，不涉时政。但李商隐的咏史诗却绝大部分都是借咏史以讽时的政治诗。\n\n咏史诗一向以正面赞颂、评论和抒发感慨为主，很少与讽刺结缘；即使咏荒淫之主，也常出之以严肃的指摘批判。李商隐咏史诗除极少数带有自况意味之作以外，大都具有强烈的讽刺性。对于他笔下的荒淫昏顽之君，诗人的基本感情倾向是辛辣尖刻而冷峻的讽刺和揶揄挖苦，不是充满感情的劝诫讽喻或惋惜遗憾。\n\n二、概括性与典型性\n\n李商隐咏史诗另一重要特征，是具有较高的概括性与典型性。咏史诗要成为真正的艺术，必须正确处理历史真实与艺术真实的关系。围绕这个关键问题，李商隐做了多方面的成功尝试。他不是简单地“隐括本传”，撮述史事，而是根据主题表达的需要进行提炼加工（包括一定程度的想象虚构），使诗中的人物、事件、场景既不脱离历史的基本面貌，又不拘限于历史事实，融铸成具有典型性的诗歌境界。\n\n三、浓郁的抒情色彩和深长的情韵\n\n李商隐优秀的咏史诗则既能避免单纯议论造成的质木无文，缺乏情韵，又能避免刻露的讽刺所造成的缺乏余蕴，达到深刻的思致、尖锐的讽刺与含蕴微婉的抒情唱叹完美结合。主要有两种类型。\n\n一种是寓议论讽刺于经过精心提炼熔铸的典型场景、情节之中，不着议论，不下针砭，有案无断，具文见意。这是李商隐运用得最得心应手的一种手段。但丝毫不着议论的写法在李商隐咏史诗中毕竟只是一部分，在较多的情况下，他还是将议论和抒情融合起来。为了加强咏史诗的咏叹情调，他还往往借助抒慨、设问、反问等方式在篇末将全诗意蕴凝聚起来，显得既奇警遒劲而又韵味深长。\n\n讽时性、典型性、抒情性，是李商隐咏史诗的三个主要特征。如果说，讽时性赋予咏史诗以鲜活的生命灵魂，典型性赋予它丰满充实的血肉肌体，则抒情性便赋予它动人的情韵风神。李商隐的咏史诗全面集中地体现上述特征，这也正是他对古代咏史诗的发展作出的重要贡献。","keywords":"讽时性 概括性 典型性 抒情色彩 深长情韵","note":"对于晚唐咏史诗，人们对于杜牧关注较多，而相对忽视了李商隐的诗歌创作。总体而言，李商隐的咏史怀古诗的整体情调与晚唐咏史诗是一致的，但其中熔铸着自己的个性，大家可以通过对比加深记忆。相关内容可以参考刘学锴《李商隐咏史诗的主要特征及其对古代咏史诗的发展》，具体资料可以在李凡文学正版群内领取。"},{"id":"217","stars":"★★★","title":"试分析李商隐对前代诗歌创作的继承","body":"李商隐所开创的风格和境界，是在晚唐诗歌发展潮流中，总结吸取前代艺术经验并加以提高的结果。代表晚唐，而又高于晚唐，做到了能够与前代第一流大诗人相沟通和呼应。通过将李商隐和前代某些阶段诗歌与诗人作比较，可以进一步看到他在创作上的取径和成就：\n\n一、继承齐、梁诗歌讲究词藻声律、对仗用典\n\n李诗中爱情和绮艳题材比重很大，同时讲究词藻声律、对仗用典。这与齐、梁诗无疑有渊源关系。但齐、梁诗主要兴趣在描写闺阁楼榭与女子的容貌体态服饰，重声色而乏性情。李商隐的爱情诗，侧重于感情领域的表现，摆脱了以满足感官欲望为特征的庸俗情调，以其深情绵邈，把这一题材的诗境推向高峰。男女之间无论是热烈的相爱还是执着的相思，抑或是爱情破灭后的伤感，都表现了对对方的尊重同情和对所爱者处境心境的体谅。\n\n二、继承阮籍朦胧而不易索解的风格\n\n论诗之朦胧而不易索解，李商隐与魏晋之交的阮籍有相似之处。但在写法上，李商隐主情，努力表现情感的本原状态；阮籍主理，以哲学观照方式入诗，借带哲理性的、虚化的事写景抒情，隐约地暗示诗旨。阮诗略形取神，诗旨的恍惚与缺少形象化的实写相联系。而阮籍之后的齐梁诗歌，致力于精确细致地再现景色物态，经历了一个“声色大开”的发展阶段。李商隐充分吸收了包括齐、梁在内的前代诗歌艺术成就，其诗“有声有色，有情有味”，不像阮籍诗歌那样虚化玄奥。\n\n三、接踵李贺幽奥隐微的走向\n\n李贺写诗开始走向幽奥隐微的途径，对李商隐有直接先导作用。但李贺僻性高才、一任主观，加以异于常人的思维和感知方式，不免显得奇诡。他逞笔写古诗，在出人意表的同时，夹杂着生而未化的成分。李商隐虽有一部分古诗模仿李贺几至乱真，但更主要的是把幽奥隐微的情感，用律体的形式写出。精心结撰，才思绵密，既有沉郁之致，又精美妥贴。李贺个性极强，在失落中追求心理上的补偿，有很强的感官欲求。所写的物象，往往具有特别的硬度和锋芒。又多用颜色字，秾丽炫目。李商隐则是虽美艳而又较少给人色彩刺激，脱离了李贺的词诡调激，归于温润纯熟。\n\n四、呼应杜甫艺术上的浑成境界\n\n李商隐优秀诗歌所达到的浑融境界，在艺术上可以和杜甫诗歌的浑成境界遥相呼应。李商隐推崇杜甫，不仅学杜甫的古体，更重视学杜甫的近体。李商隐之通于杜甫，不仅得力于多方面学习，更在于其诗“秾丽之中，时带沉郁”。李商隐跟杜甫一样，内心深处有一股郁结很深的沉潜之气，发而为诗，在情思的沉郁上十分相近。由于内在充实，通体完整，两人诗歌都达到了“浑”的境地。不同的是，杜甫较李商隐外向，诗思经常盘旋在社会江山朝市之间，诗境与社会、自然直接沟通，“篇终接混茫”，所接的是外部世界。李商隐转向内心，内在浩浩茫茫，无涯无际扑朔迷离，也有一种浑沦之状。再加上李商隐的诗美，偏于幽美细腻，七律律法较杜甫更为规范细密，故其诗境没有回到杜甫及盛唐诗人那种与外部世界贴近的浑成，而归于跟无形无质的心理意绪更易相合的浑融，成为唐诗中达于浑化层次的一种新境界。","keywords":"爱情和绮艳题材 朦胧而不易索解 幽奥隐微 浑融境界","note":"李商隐的诗歌创作，对齐、梁诗歌，阮籍，李贺和杜甫诗歌都有所继承。但他们之间，又有区别。这足以证明，李商隐诗歌不是凭空出现的，而是在前人的基础上发展出来的。这部分内容中涉及的一系列诗人，都有可能拿出来与李商隐进行对比，大家要注意一下。"},{"id":"218","stars":"★★★","title":"试分析李商隐诗歌创作的开拓作用","body":"李商隐的诗歌创作，给在盛唐和中唐已经有过充分发展的唐诗，以重大的推进，使其再次出现高峰，这主要表现在以下方面：\n\n一、对心灵世界作出了前人未曾有过的深入开拓与表现。任何诗歌都这样那样地表现着心灵世界，李商隐的独特贡献，在于他对心灵世界的丰富层次以及它的变化的复杂奥妙和清晰的、不清晰的、难以言说的领域，做了前所未有的细腻传神的展示。他围绕表现心灵世界，在对诗歌语言潜在能力的发掘，比兴象征手法和典故运用等方面，亦有许多独到的探索。他的诗所特具的感伤情调、朦胧意境、象征暗示色彩，都和表现内心深隐幽微情绪密切相关。\n\n二、开拓了一个全新的艺术表现的领域：非逻辑的跳跃的意象组合；朦胧情思与朦胧境界的创造；把诗境虚化。这样的非写实的艺术表现手法，不仅极大地扩大了诗的容量，且亦留给读者以更大的联想空间。由于抒写概括面很广的人生感受，李商隐的一部分最优秀的诗往往意蕴宽泛、境界朦胧、歧解纷出。它们所表现的往往不是具体的人事景物，而是一种由多方面生活体验融铸成的内涵非常宽泛的感情境界。就艺术表现手法的创新而言，在中国诗史上是空前的。\n\n三、在无题诗、咏史诗、咏物诗三种类型诗歌的发展上做出重要贡献。李商隐所创写的无题诗，在诗歌中成为一种富有特色的新体式。他的咏史诗，情韵深长，善于突破“史”的拘限，真正进入“诗”的领域，将咏史诗的创作，往更具典型性、抒情性的境界推进。李商隐的咏史怀古诗和杜牧诗一起，代表着晚唐这一题材诗作的最高成就。他的咏物诗，托物寓怀，表现诗人独特的境遇命运、人生体验和精神意绪，在物与我、形与神、情与理等类关系处理上做出了新贡献。\n\n四、在体裁方面，李商隐的七律、七绝，深婉精丽，充分发挥了这两种诗体在抒写情感、表现心理方面的潜能，取得了重要的成就，他的七律沉郁精炼，酷似杜甫，虽气势的海涵汪洋，笔力的雄健苍劲有所不及，而深曲婉丽则过之。李商隐七绝，寄托遥深，措辞委婉，议论警策，神韵隽永，堪称晚唐绝唱。\n\n清代吴乔云：“唐人能自辟宇宙者，惟李、杜、昌黎、义山。”李商隐确实是继李白、杜甫、韩愈之后，再次为诗国开疆辟土的大家。","keywords":"心灵世界 全新的艺术表现的领域 无题诗、咏史诗、咏物诗 抒写情感、表现心理方面的潜能","note":"文学史上，人们把李商隐和杜牧并称为“小李杜”，但从对诗歌开拓的贡献来看，李商隐无疑是更高一筹的，因而更多地受到了关注，在考查中出现的频率也相对较高。李商隐对诗歌的开拓是多个方面的，包括表现内容、题材、体裁等等。可以说，李商隐是晚唐时期最重要的一位诗人。"},{"id":"219","stars":"★★","title":"试分析“词”这一文体兴起的原因","body":"词的兴起，与唐代经济发达，五七言诗繁荣，音乐的发展等有密切关系。总体来看，词的兴起主要得益于以下因素：\n\n一、外国音乐传入，燕乐流行\n\n隋唐时期的音乐，由于西域（还有其他外国）音乐的大量传入，与古乐府所配的中原音乐相比，已经起了很大的变化。它集南北古今、胡汉俚雅、宗教世俗音乐之大成，有力地促进词的产生和兴盛。其中以西域音乐为主的燕乐，成为当时的俗乐，燕乐（因常用于宴会又称宴乐、讌乐）曲目繁多，旋律灵活多变，生动活泼，适宜抒发不同的思绪情怀，需要长短错落、优美婉转的歌辞与之匹配，因声度辞的词便随燕乐的流行而兴盛。\n\n二、唐诗繁荣，人们的节奏感、韵律美等音乐审美水平有所提高\n\n词是音乐语言和文学语言相结合的产物。诗歌发展到唐代，众体俱备，声韵格律日臻完美：四声抑扬，平仄粘对。说明人们的节奏感、韵律美等音乐审美水平有所提高。六朝以来，以乐配诗的有杂言歌辞和五七言律绝，但两者辞与曲均未能熨贴契合。在诗与乐本身不断嬗变演进、克服互相矛盾的过程中，词这种新的诗歌体裁便应运而生。唐诗的繁荣为词的产生与成熟创造了条件。\n\n三、酒令著辞艺术流行\n\n词的兴起，以及某些具体格律和修辞特征的形成，还与酒令著辞有关。盛极一时的饮宴娱乐风气，培育并发展了精彩丰富的酒令艺术。有些歌舞化的酒令，则近于或已经成了词。今存词调中，留下了种种“令”词的名目，共一百多调。酒令在不断翻新过程中常常设计出种种令格，这些令格，有的被继承下来，成了词的某些体式或修辞特点。\n\n四、教坊等俗乐机构的推动\n\n唐五代时期，孳生出词的乐曲，主要是短小轻便的杂曲小唱。这些杂曲小唱的产生，与唐代设置教坊有一定关系。唐代所传主要曲乐资料为太常曲和教坊曲。太常曲二百馀曲中转为词调的，仅少数几个曲调，大量转变为词调的是教坊曲。教坊是女乐和俗乐集中地。它创制了许多新乐曲。来自民间和来自各地方的乐曲，也总汇于教坊，并通过教坊，加速了在社会上的传播。唐五代所用词调，总共一百八十调左右，半数皆可见于《教坊记》的曲名表中。这说明以教坊为代表的俗乐机构，以及以教坊妓为代表的歌舞艺人，在众多曲调的创制、形成过程中，起了重要作用。\n\n【李凡关键词：燕乐流行 唐诗繁荣 酒令著辞艺术流行 教坊等俗乐机构的推动】","keywords":"","note":"在上古时期，诗乐舞是一体的，诗的整体发展，也与音乐、舞蹈等的发展密不可分。词的兴起，可以说是重现了这一过程，它的发展也是与音乐、舞蹈的发展联系在一起的。可以说，正是有了音乐的发展变化，才有了词的兴起。不过，词兴起的过程中，其余因素的影响也不容忽视。"},{"id":"220","stars":"★★★","title":"简述敦煌词的主要特征","body":"敦煌词创作的早期性与作者成分来源的民间性，使作品从内容、体制到语言风格，都表现出这些初起的词，初步脱离一般诗歌的大文化系统，开始独立成体的过渡性特征。\n\n一、取材广泛\n\n词与诗在题材内容上各有自己的领地，诗歌界域宽广，而词多言闺情风月。敦煌词虽亦多写男女之情，但同时又有更广泛的取材。敦煌曲子词内容丰赡，反映了贾客、渔夫、征夫、侠客、妓女、思妇、僧侣、道士、医生、士子各色人等的生活和思想，涉及的社会生活面之广，为唐五代文人词所望尘莫及。如写晚唐动乱局面：“每见惶惶，队队雄军惊御辇”。写坚\n\n守敦煌，威镇荒服的边将：“敦煌古往出神将，感得诸蕃遥钦仰。”写商人逐利，“客在江西”，或富、或贫、或死的不同境况，均为后来词家所未曾写到。即使是词中最普遍的妓女题材，敦煌词中也展开了文人笔下所未曾有的侧面。这样多方面的内容和题材，说明它在取材上还没有和一般民歌或一般诗歌分疆划界，进入词所特有的窄而深的领域。\n\n二、体制上粗备型体，未臻成熟\n\n敦煌曲子词的押韵比较随便，其程度要比唐宋以来的文人词随便得多。敦煌曲子词的字数、甚至句数的多少，也比较随便。如《菩萨蛮》的前二句一般是七字句，以下是五字句，敦煌曲子词一般也是如此。但却有一、三句为七字句，二、四句为五字句的情况（如“香绡罗幌”一首），又有第二句为六字句、第四句和最后一句为七字句的情况（如“枕前发尽千般愿”一首）。字数不定，韵脚不拘，平仄通押，兼押方音，常用衬字等等，都说明词格宽，声辞相配要求不严，用韵方法简单，处于草创阶段。\n\n三、所咏内容与词调大致相符\n\n敦煌词所咏内容，一般与词调大致相符，这种所谓“咏调名”的现象，与其后词在内容上离调愈来愈远不同，亦属早期词调初创时的特征。例如《虞美人》所写的就是一位可爱的美人折海棠花的趣事；《感皇恩》一词内容即为歌颂皇帝恩德；《拜新月》即与拜月的习俗有关；而《苏幕遮》调名的由来，更是别有情趣，它与一种浑脱舞有关。参加表演的人用水互相泼洒，为避免水激头面，都戴着油帽，高昌语说油帽为苏幕遮，所以这种舞和配这种舞的乐曲又称苏幕遮。\n\n四、风格朴素，但向重视抒情、讲究词藻的方向过渡\n\n敦煌词造句遣词保存了民间词的素朴风格，富于生活气息。如《菩萨蛮》（枕前发尽千般愿）一连展开六种比喻，全用民间成语中认为不可能的事，很像汉乐府《上邪》中情侣的信誓而更为新奇。\n\n拙朴是敦煌词的本色，但也有不少作品讲究词藻华饰，甚至文与白、纤巧与朴拙，并见一篇之中。同时，相当一部分作品，表现出重心向抒情方面转移，以及市井化，甚至艳情化的趋势。因此，敦煌词作为“洵倚声椎轮大辂”，不止在于其具有词处于萌芽状态的拙朴，同时还在于其多方面显示了过渡性的特征。","keywords":"过渡性的特征 取材广泛 体制粗备 内容与词调相符 风格朴素","note":"敦煌曲子词显出了众多过渡性特征，这正与敦煌词创作的早期型和作者来源的民间性相联系。相较于宋词，无论是在艺术上还是在内容上，敦煌词都显得较为稚嫩，不过已经有了进一步发展的迹象。除了考查简答题和论述题之外，敦煌词还有可能出一些名词解释，大家要注意一下。"},{"id":"221","stars":"★★★","title":"试分析温庭筠词的创作特征","body":"温庭筠在《花间集》中被列于首位，他是第一个努力作词的人，把词同南朝宫体与北里倡风结合起来，成为花间派的鼻祖。温庭筠的词，主要具有以下特征：\n\n一、以表现妇女生活为主要题材\n\n温庭筠是文学史上第一个以词名家的作者，他的词今存七十余首，以表现妇女生活为主要题材，如《菩萨蛮》十四首、《更漏子》六首表现宫女、思妇、歌伎的生活和情怀，其中可能融入作者的某些失意怅惘。其他如《女冠子》写女道士，《河渎神》表现民间祠庙赛神的风俗，《荷叶杯》《河传》描写采莲女的采莲及相思，《定西蕃》《遐方怨》倾诉闺妇对征夫的思念，《梦江南》刻画商妇对丈夫归还的企盼。\n\n二、绮靡华艳的词风\n\n温庭筠精通音律，能逐弦吹之音，为侧艳之词。他的词把南朝宫体诗的传统引入词中，结合北里倡风，形成绮靡华艳的词风。温庭筠词不仅擅长抒情，而且在抒情的表现方法上有两个重要特征：一是喜欢用色彩浓丽的词语和香艳精美的名物意象来加以“包裹”和“装饰”，使其所表现的人物情事显得更为香艳精美；二是喜欢用冷静客观的态度和深隐婉曲的手法来进行“冷化”和“深化”，使其所表现的人物情事显得更为朦胧幽深。如《菩萨蛮》（小山重叠金明灭），表面看来，全词镂金错彩，一片浓丽香艳，但仔细品味，人物幽微深曲的情感心绪正隐含在这一片浓丽香艳之中。\n\n三、借景物的精雕细刻，表达情思\n\n温庭筠词景语多，情语少，善于借景物的精雕细刻，表达情思。温词很少用赋法直接抒发主观感情，而善于在客观景物组成的绵密秾丽的意象中，用比兴、象征、暗示、烘托等手法表达重襞层积的情思。如《更漏子·玉炉香》词，明以红烛垂泪之有情，反衬长夜寒雨之无情，暗以思妇长夜之苦，怨征人不晓离情之苦，把思妇深曲幽怨的离情之苦，表达得凄婉动人。温词还常以成双作对的鸳鸯、凤凰、双蝶反衬暗示闺妇的孤独，以屏山喻心曲。善于以隐约迷离的意境，暗示幽深莫名的心曲，形成不同于诗的词境，这是温词重要的艺术成就。\n\n四、富于音韵美\n\n温庭筠既精通音律，他的词又多为应歌而作，故特别追求合乐性和格律性的统一，使词的文字的格律音韵与曲调的节奏旋律密切融合，内外一体。如《南歌子》七首，各首平仄一毫不差，格律精严。同时，温庭筠本人工声律，喜歌吹，所作诗词讲究平仄四声，喜用双声叠韵，如“明灭”“鬓云”等，使词和谐动听。","keywords":"表现妇女生活 绮靡华艳 借景物表达情思 富于音韵美","note":"温庭筠在词史上的地位很高。其词上承南北朝齐、梁、陈宫体的余风，下启花间派的艳体，是民间词转为文人词的重要标志。这主要体现在温庭筠对于词风、抒情方式和词的格律等方面的开拓和发展上。相关内容可以参考刘尊明《试论温庭筠词的艺术成就与审美特色》，具体资料可以在李凡文学正版群内领取。"},{"id":"222","stars":"★★★","title":"试分析花间词的文学史地位","body":"晚唐五代时期，在西蜀地区形成的花间词派，是中国文学史上第一个词人群体。作为“倚声填词之祖”的花间词，在干年词史上占有极为重要的地位。\n\n一、对词境的开拓有启发作用\n\n花间一派作品在题材上并非如人们所言只有花前月下、歌儿舞女、灯酒喧沸、弦歌继夜，其题材的包容性和内容的广泛性是具有很强的张力的。如韦庄词《清平乐》（春愁南陌）、《河传》（何处烟雨）、《谒金门》（春雨足）等三首分别借“春愁”“古今愁”“寸心千里目”来表达故国之思。欧阳炯《南乡子》八首是对南国风光的描写。除此之外，花间词还有一些咏史、边塞、渔隐、田园题材方面的作品，虽然在数量上并不是很多，但花间词所描写表现的社会生活范围却非常广泛，因此意义深远，对于后世词境的扩大，题材的开拓，是具有一定启发意义的。\n\n二、为我们体认中国古代文人的心灵世界提供帮助\n\n透过花间词，我们可以窥见晚唐五代文化的某些本质特征。尤其值得重视的是，它在刻画人物心理和抒写人物情感方面所表现出来的深入程度，为我们体认中国古代文人的心灵世界提供了莫大的帮助。花间词的出现，是中唐以后社会文化转型的必然结果。配合音乐歌唱的曲子词在表现“纵情逸乐”这一人性侧面时显示出极强的真实性。它既是文人品格的一次堕落，又是人性情欲的一次张扬，这种张扬更因蜀地文化的兴盛而愈显活跃。花间词以其独特的体式优势酣畅淋漓地宣泄出冶艳的“花草情思”。\n\n三、创立了“词为艳科”的题材规范\n\n作为当时的“流行歌曲”，花间词经过歌妓的演唱广为传播，对于南唐、北宋词坛颇有影响。北宋人视曲子词为“末技”“小道”，词体遭到普遍的轻视，但是正因为有了“词为艳科”的挡箭牌，人类的本真情感获得了“安身立命”之所，有了一个可以卸去虚饰、宣泄情欲的舞台。在词人内心的底层，冶艳的“花草情思”从来就没有衰歇。花间词所创立的“词为艳科”的题材规范，终于成为词体创作的“当行”“本色”。\n\n四、开创了中国古代文学和审美文化的新境界\n\n花间词的价值还在于开创了中国古代文学和审美文化的新境界。花间词人竭力追求语言、音韵意象、情感表达的唯美化效果，创造出了深美闳约的艺术境界。它的心理刻画、意境表现、工巧构思、细腻白描、景物烘染、隽永韵致等，也都体现出与“词为艳科”相对应的“香而弱”的艺术品性，对宋代婉约词的兴盛起到极大的示范作用，从而构成了词“别是一家”的体制特征。","keywords":"词境开拓 体认古代文人心灵世界“词为艳科”的题材规范 文学和审美文化新境界","note":"《花间集》集中而典型地反映了我国早期词史上文人词创作的主题取向、审美情趣、体貌风格以及艺术成就，同时真实地展现了词由民间状态向文人创作演进、转化的过程。《花间集》大体规范了词体的文学体性和美学特征，确立了花间范式，在中国词史、中国古代文学史上具有相当重要的地位和影响，一向被称为“倚声填词之祖”“长短句之宗”。"},{"id":"223","stars":"★★★","title":"试分析李煜词的创作特征（26西北师范大学）","body":"李煜多才多艺，精书法，善绘画，通音律，更以填词为擅。其词多有散佚，现存世者有三十馀首。总体来看，李煜词的创作特征，主要表现在以下方面：\n\n一、内容上以南唐灭亡为界，分为前后两期\n\n前期的李煜，过着风流糜烂的帝王生活，极尽享乐，其词作多是对他风流帝王生活的叙写。也有作品不涉帝王家生活，而以传统的伤春悲秋题材表现他多愁善感的敏锐才思。\n\n国破家亡的剧变，使李煜后期词发生显著变化。李煜的后期词，多以抒情之笔调写自己沉重悲伤的情感。他将丧家亡国的悲伤和耻辱倾注于词篇当中，写下一首首沉痛悲怆的作品。如《相见欢》写别愁，凄婉至极。\n\n二、情感真率自然、真挚深厚\n\n从抒情内容看，李煜词可以分为前后两期，但从抒情艺术看，李煜词有一以贯之的特质，那就是他所抒发的真率自然、真挚深厚的情感。李煜的抒情如行云流水，不见丝毫作态。而这些感情的倾吐又与结构的匠心安排浑然天成，全词腾挪开合，浑然一体。李煜用词传达自己的感情世界，把词当作抒情文字，而不再是酒席宴前的应歌之作，发展了词的抒情性，开拓了词的境界，提升了词的品质。\n\n三、善于使用白描手法\n\n李煜的艺术素养极高，他的词有十分鲜明的艺术个性，而最显著的特色是白描手法的成功运用。他善于用白描手法，表现人物的对话动作，刻画人物的情态和心理。如“绣床斜凭娇无那，烂嚼红茸，笑向檀郎唾”表现青年女子的娇憨和爱情，全无雕饰，却形象生动。李煜的白描，还表现在用简笔淡墨，点染景物，将抽象的情思融入具体的景物中，创造出情景交融的意境，如《乌夜啼》（其三）。又如《相见欢》（无言独上西楼），前半阕渲染环境气氛，后半阕以“剪不断，理还乱”，将排解不开的干愁万绪形象化，结尾把全词的抒情拓宽加深，升华到新的境界。\n\n四、语言是直白通俗与形象精炼的完美统一\n\n如“林花谢了春红，太匆匆。无奈朝来寒雨晚来风”，不过寻常话语，而能在伤春惜花中抒发家国之痛，用朝夕风雨象征凄苦孤危之心情和处境。又如“一片芳心千万绪，人间没个安排处”，被俞陛云评价道：“言寸心之愁，而宇宙虽宽，竟无容处，其愁宁有际耶？”这样的语言，有言浅意深、语短情长之妙。\n\n宋代文学史","keywords":"前后两期 真率自然 真挚深厚 白描手法 直白通俗与形象精炼完美统一","note":"李煜的词在词史上评价很高，王国维称赞他“词至李后主，而眼界始大，感慨遂深，遂变伶工之词而为士大夫之词”，故此对于李煜相关内容大家要重点了解掌握。南唐词人除了李煜之外，冯延已也值得关注一下，具体题目可以在李凡文学正版群中查看。"},{"id":"224","stars":"★★★","title":"北宋文学的基本特征和文学史地位（26中国人民大学）","body":"宋代文学基本上是沿着中唐以来的方向发展起来的，并在此基础上取得了非常辉煌的成就，对后世文学的发展产生了极为重要的影响。北宋文学的基本特征以及文学史地位，主要表现在以下方面：\n\n一、北宋文学的基本特征\n\n（一）在内容上，北宋文学具有高度的现实精神，其强烈性、广泛性、一贯性都超出前代。具体表现有以下几点：\n\n（1）能及时而广泛地反映政治斗争与政治事件\n\n文学创作的高潮往往是伴随着政治斗争高潮出现的。如北宋庆历新政期间围绕范仲淹被贬事件，熙丰变法期间围绕各种新法的实施情况，都出现了相应的创作高潮。\n\n（2）掀起了爱国文学的高潮\n\n从北宋起，有感于同辽和西夏的屡战屡败，苏舜钦、梅尧臣、欧阳修、苏轼就写下许多抒发爱国、忧国思想感情的作品，\n\n（3）广泛地反映社会生活及民风民情、民间疾苦\n\n宋人在抒写民生时，不但写到一般农民，而且写到手工业者、城市贫民、小商小贩、歌女艺人等；不但写到一般的阶级压迫、诛求征戍，还具体写到大大小小各级官吏如何利用各种权势欺压人民，而且在表现这方面主题时显得更自觉、更深刻：不但触及生活领域，而且深入到经济、文化、科技等各种领域，这不能不说是宋代文人与社会有着更深广联系的结果。\n\n（二）北宋文学在风格及表现手法上形成了独特的“宋调”，其具体表现有以下三个方面：\n\n（1）多深沉悲慨之气\n\n以最应充满慷慨激情的爱国之作而言，由于受客观现实及主观心理的影响，多数作品缺少汉代那种“匈奴未灭，何以家为”，“立功异域，安能终老笔砚间”的气魄；更缺乏唐代那种渴望建功立业，喋血边城，向往瑰奇壮伟的军旅生活的情调，因而盛唐那种热情奔放的边塞诗在宋代已很少见。代之而起的是范仲淹“将军白发征夫泪”的叹惋。因而宋代文学的浪漫主义气息也逊于唐代。\n\n（2）多议论之风\n\n宋代文学一方面要反映复杂的政治斗争，一方面又要体现对国家兴亡的责任感，所以“开口揽时事，论议争煌煌”，“深探力取常不寐，思以正议排纵横”，以议论入文入诗就成为历史的必然，成为宋调的主要特征之一。\n\n（3）文风多朴实平易\n\n宋人为文既多出于为现实政治服务的功利观，也必以功利观点考虑表达与接受的效果，“易道易晓”遂成为终两宋之世的基本文风，既构成宋调基本特色，且对后代文学亦发生了深远影响。\n\n二、北未文学的文学史地位\n\n北宋文学是中国古代文学发展史上承前启后的关键节点，既承接唐代文学的深厚积淀，又突破前代范式，形成了宋代文学的独特风骨，深刻影响了元明清乃至后世文学的发展走向，奠定了近古文学的基本格局。具体来说，可以从以下方面加以讨论：\n\n（一）接续隔唐传统，推动诗、词、散文的进一步发展，以及多种文学体裁的繁荣\n\n1．诗歌：北宋诗在唐诗的巨大阴影下，另辟蹊径，自成一家，形成与唐诗双峰并峙的“宋调”。\n\n2．词：北未是词的黄金时代，完成了词体的成熟与升华，使其成为宋代文学的标志性文体。\n\n3．散文：北宋以欧阳修为领袖，联合王安石、曾巩、苏洵、苏轼、苏辙（唐宋八大家中北宋占六位），彻底完成了唐代韩愈、柳宗元开启的古文运动。\n\n（李凡说：这一部分需要结合后面宋词、宋代诗歌和宋代散文三道题目的内容详细展开，篇幅有限，这里就不再赘述了。）\n\n4．除了诗文词，北宋诗话、词话等批评文体兴起，标志着文学理论的自觉，构建了系统的文论体系。大量笔记（如沈括《梦溪笔谈》）兼具史料、学术与文学价值，成为宋代文学的重要组成部分。\n\n（二）承前启后：北宋文学上承汉唐，下启南宋以及元明清文学，是中国文学从中古向近古转型的关键节点。\n\n北宋时期，不仅各个文学体裁都得到了长足发展，传统文学中的各种体式，从创作题材、内容到表现手法都出现前所未有的大融合。“以文为诗”“以诗为词”，诗如文，词如诗。诗、文、词各种文学样式的艺术天地，被极大地拓展了。也正是在北宋文学的基础上，才有了后世诗文词等体裁的发展与繁荣。\n\n（三）以俗为雅，拓展了文学尤其是诗歌的审美视野，为后世通俗文学的发展以及雅俗文学的交融埋下了伏笔\n\n北宋文人的审美态度世俗化了。他们认为，审美活动中的雅俗之辨，关键在于主体是否具有高雅的品质和情趣，而不在于审美客体是高雅还是凡俗之物。审美情趣的转变，促成了北宋文学从严于雅俗之辨转向以俗为雅。这在宋诗中尤为明显。梅尧臣、苏轼、黄庭坚都曾提出“以俗为雅”的命题。“以俗为雅”，才能具有更为广阔的审美视野，才能实现由“俗”向“雅”的升华，或者说完成“雅”对“俗”的超越。宋代诗人采取“以俗为雅”的态度，扩大了诗歌的题材范围，增强了诗歌的表现手段，也使诗歌更加贴近日常生活。后世通俗文学的发展，以及雅俗文学之间的互动与交融，明显是受到了宋代这一文学观念的影响。\n\n北宋文学具有高度的现实精神，表现出深沉悲慨之气、议论之风、朴实平易之貌，对文学样式的革新和文学内容的拓展都起到了非常重要的作用。陈寅恪先生评价“华夏民族之文化，历数千载之演进，造极于赵宋之世”，北宋文学正是这一文化巅峰最核心、最灿烂的体现。","keywords":"基本特征 现实精神 反映政治斗争与政治事件 爱国文学的高潮 反映社会生活 民风民情 民间疾苦 独特的“宋调 深沉悲慨 议论 朴实平易 文学史地位 文学样式革新与拓展 拓展审美视野","note":"这道题让我们讨论的是北宋文学的基本特征和文学史地位，但南北宋本为一体，我们可以从整体宋代文学的基本特征的角度去切入，然后聚焦于北宋时期的文学创作，结合北宋时期的具体文学创作区进行分析即可。总体来看，北宋文学的总体特征是写实性强，爱国热情高涨，议论色彩较强，文风较为质朴。可以结合北宋的诗文词创作去加深理解。"},{"id":"225","stars":"★★★","title":"试分析宋代文化繁荣的原因","body":"对于宋代的文化，史学大师陈寅恪曾予以很高评价：“华夏民族之文化，历数千载之演进，造极于赵宋之世。”而宋代文化的繁荣，主要归功于以下几点：\n\n一、汉、唐以来社会的发展和文化的积淀\n\n首先，唐中叶以来，社会结构发生了变化。土地所有制关系的改变，加之唐末、五代的战乱打击，社会呈现贫民化的趋势。这种社会结构的演变至宋代形成新的格局，并带来意识结构的演变，一个突出的反映就是教育进入贫民化阶段，从而使文化得以走向更广泛的社会人群，为文化的繁荣提供了较好的社会基础。\n\n其次，开创于隋唐的科举制度被宋继承并完善，为宋代文化繁荣奠定了人才基础。宋代科举考试趋向公平同时，经义、诗赋、策论几乎占了同等重要的地位，这在一定程度上改变了士人的知识结构，有宋一代一些闻名于世的大家多兼长文章、经义、节义与政学。而这种变化得益于科举制度的不断发展与完善。\n\n此外，作为宋文化承载者的哲学、史学、文学、艺术、教育、科技等，则更直接继承了千余年来丰富的文化遗产。如与唐诗、元曲并列于中国文学史的宋词经晚唐、五代的发展而成熟于宋；其它方面如绘画、活字印刷术等，大多在隋唐五代的基础上发展起来的。\n\n二、宋代国家政策为文化繁荣提供了保障\n\n首先，鉴于中唐以来藩镇强盛、尾大不掉的历史教训，宋王朝决定采用崇文抑武的基本国策。在限制武人兵权的同时，宋王朝重用文臣，不但宰相须用读书人，而且主兵的枢密使等职也多由文人担任。这样一方面提升了文人的地位，客观上也为文人提供了相对宽松的政治、言论环境，他们的积极性、创造性得到了很好的发挥。\n\n其次，宋代在尊崇儒家的同时，并不排斥佛、老思想，而是实行儒、释、道井行的策略。儒、释、道的融合，直接对宋代理学产生影响，更重要的是，由于儒、释、道并重，使宋代士人不迷信传统经典理论，在学术界形成疑古之风。这种疑古精神有突破藩篱的作用，使宋代士人不再相信传统经典理论的权威性。不仅使宋代在经学上有突破性的发展与成就，也使得文化在各个领域都有所创新与突破。\n\n最后，宋代统治者重视教育，鼓励读书。统治者为了网罗更多的人才，对教育十分重视，对培养人才的摇篮-书院和官学予以支持，使宋代的教育制度比较完备。同时，鼓励读书，从而为文化发展提供了良好的社会环境。\n\n三、宋代经济发展为文化繁荣提供了基础\n\n北宋建国后不久，经济即得到了复苏和发展，南宋初虽一度遭到局部破坏，但并未伤及根本，这是造成文化繁荣的物质基础。\n\n统一的宋王朝的建立为农业的发展提供了一个安定的社会局面，统治者采取了一些鼓励农业的措施，为生产发展提供了必要条件，宋代农业在农民的辛勤劳作下获得很大的发展。宋代几种主要的手工业生产也获得巨大发展。农业、手工业的发展又刺激了商业和城市经济的发展。\n\n经济的发展首先促进了教育的发展。宋代官学、私学都很发达，几乎县县都有官学，而白鹿洞、应天府等几大书院规模均极其宏大，可同时容纳数干名学生。经济的发展还促进了科技的发展；而科技的发展，特别是印刷术的提高和普及又直接促进了文化的发展。\n\n四、对外文化交流促进了文化的繁荣\n\n宋代文化的繁荣，除了内在因素外，与外来文化的交流，从而相互影响也是重要的原因。自汉武帝打通西域丝绸之路后，东西方文化就开始交流。到了宋代，较之唐代又向前发展了很多。宋不仅和北非、东非的国家有了直接交往，而且对周边国家的贸易有了新进展。在对外贸易的过程中，宋王朝也注重同这些国家的文化交流，一方面向外传播自己的文化，同时对亚.非一些国家文化中先进的成分加以吸收、融汇，在这方面宋王朝既不保守，亦不自大。\n\n宋代对外经济、文化交流的加强，一定程度上促进了文化的发展，丰富了文化内容，对宋代文化的繁荣产生了积极的作用。","keywords":"社会发展 文化积淀 国家政策 经济发展 对外文化交流","note":"宋代的文化繁荣，与有宋一代的社会状况、国家政策和对外交流息息相关，这种繁荣，表现在诗、词、散文、小说等多种文体之中。了解宋代文化繁荣的原因，对于我们分析宋代各种文体的具体发展有很大的帮助，所以这里给大家设置一道题进行补充拓展。"},{"id":"226","stars":"★★","title":"谈谈宋代忧患意识对宋代文学的影响","body":"儒家强调个体对社会应有责任感，士人应有社会忧患意识。宋代的士大夫发扬了这种传统，深沉的忧患意识，对宋代文学产生了重要影响，主要表现在以下方面：\n\n一、文学整体冷静、沉稳\n\n深沉的忧患意识，使宋代文学在整体上显得比较冷静、沉稳。早在宋初，已出现了路振的《伐棘篇》、王禹偁的《对雪》那样优念国计民生的诗作。宋代作家在表达个人抱负时，也相当拘谨、收敛。王安石是宋代政治自信心最强烈的人，自述其志时也只是说“材疏命贱不自揣，欲与稷契遐相希”，口气远不如李、杜之狂傲。此外，宋代的思想控制比唐代严密得多，又不断发生激烈的党争，士大夫因作诗而得罪的情况屡有发生，他们作诗讽世或述怀时就顾虑较多。后人读宋人的诗文时，很容易感受到严谨、平实、细密、深沉等特征，却难以发现唐人那种天马行空、气冲斗牛的昂扬气概。\n\n二、爱国主题高扬\n\n深沉的优患意识，又造成宋代文学中爱国主题的高扬。爱国主题是我国源远流长的文学传统。每逢国家危急存亡之秋，这类主题便会放射出异彩，从屈原到杜甫的先唐文学史实已经昭示了这种规律。宋代的民族矛盾空前激烈，三百年间外患不断。汉、唐都亡于国内的农民起义和军阀混战，而北宋和南宋却亡于外族入侵。这样，宋代的作家就势必对爱国主题给予格外的重视。\n\n北宋时期，辽和西夏经常侵扰边境，宋王朝无力制止，就以每年供给巨额财物的条件求得妥协。这种屈辱的处境成为士大夫心头的重负，也成为诗文中经常出现的题材。从北宋末年开始，更强大的金、元相继崛起，铁马胡笳不但骚扰边境，而且长驱南下，直至倾覆了宋室江山，在中国建立了非汉族统治的新朝。在长达一个半世纪的抗金、抗元斗争中，爱国主题成为整个文坛的主导倾向。\n\n三、高度的现实精神\n\n在内容上，优患意识导致宋代文学具有高度的现实精神，其强烈性、广泛性、一贯性都超出前代。具体表现有以下几点：一是能及时而广泛地反映政治斗争与政治事件，文学创作的高潮往往是伴随着政治斗争高潮出现的。二是及时地反映社会生活及民风民情、民间疾苦。宋人在抒写民生时，不但写到一般农民，而且写到手工业者、城市贫民、小商小贩、歌女艺人等；不但写到一般的阶级压迫、诛求征戍，还具体写到大大小小各级官吏如何利用各种权势欺压人民，而且在表现这方面主题时显得更自觉、更深刻；不但触及生活领域，而且深入到经济、文化、科技等各种领域，这不能不说是宋代文人与社会有着更深广联系的结果。","keywords":"冷静、沉稳 爱国主题 现实精神","note":"宋代文学中的忧患意识，一是来源于儒家传统，二是根植于社会现实，这种忧患意识对宋代文学产生了重要影响，尤其是让宋代文学与唐代文学产生了明显的区别，整体更加理智，更加务实，爱国热情也更加高昂。同时，这种忧患意识也加深了文人与社会的联系，这些内容我们都要了解。"},{"id":"227","stars":"★★★","title":"试分析宋代三教合一思潮对宋代文学的影响","body":"由于宋代的儒、道、释三种思想都从注重外部事功向注重内心修养转变，因而更容易在思想的层面上有机地融合起来。到北宋中叶，三教合一已成为一种时代思潮。这一思潮，对宋代文学产生了重要影响。\n\n一、三教合一思潮影响了宋代士大夫的文化性格\n\n三教合一的思潮使宋代士大夫的文化性格迥异于前代文人。首先，士大夫对传统的处世方式进行了整合，承担社会责任与追求个性自由不再是互相排斥的两极。宋人把自我人格修养的完善看作是人生的最高目标，一切事功仅是人格修养的外部表现而已。所以宋代的士大夫虽然比唐人承担了更多更重的社会责任，也受到朝廷更严密的控制，但并不缺乏个性自由。他们可以向内心去寻求个体生命的意义，去追求经过道德自律的自由。\n\n其次，宋代文人采取了新型的生活态度。宋人认为个人的努力和贡献是整个传统或整个阶层中的一部分，应当受到理性和道德的制约。宋人的个体意识不像唐人那样张扬、发舒，他们的人生态度倾向于理智、平和、稳健和淡泊。与唐人相比，宋代文人的生命范式更加冷静、理性和脚踏实地，超越了青春的躁动，而臻于成熟之境。\n\n宋代的诗文，情感强度不如唐代，但思想的深度则有所超越：不追求高华绚丽，而以平淡美为艺术极境。这些特征都植根于宋代文人的文化性格和生活态度。\n\n二、三教合一思潮促进了宋代文人审美情趣的转变\n\n宋代文人的审美情趣发生了很大的转变。宋代的禅宗以内心的顿悟和超越为宗旨，轻视甚至否定行善、诵经等外部功德。与此同时，宋代的儒学也发生了类似的转变。宋儒弘扬了韩愈把儒家思想与日用人伦相结合的传统，更加重视内心道德的修养。所以，宋代的士大夫多采取和光同尘、与俗俯仰的生活态度。\n\n随之而来的是，宋人的审美态度也世俗化了。他们认为，审美活动中的雅俗之辨，关键在于主体是否具有高雅的品质和情趣，而不在于审美客体是高雅还是凡俗之物。审美情趣的转变，促成了宋代文学从严于雅俗之辨转向以俗为雅。这在宋诗中尤为明显。宋代诗人采取“以俗为雅”的态度，扩大了诗歌的题材范围，增强了诗歌的表现手段，也使诗歌更加贴近日常生活。\n\n三、三教合一思潮影响了宋人文化理性特征的形成\n\n三教合一思潮促使整个社会哲学氛围浓郁，士大夫群体热衷于讲道论学，往往为了探寻真理而进行思想辩论。宋人文集中大量的辩难文章，说明宋人文化气质上鲜明的理性特征。普遍存在的论道风习，以及时代风习推助下文学主体所富有的“思想者”精神意态，决定了契合于宋代文化精神的文学理趣。这种文学理趣与启动于中唐时代的儒学复兴和古文复兴思潮相呼应，在重塑儒家理想人格的人文精神建构过程中，形成了道学中人与艺林中人莫不心仪“孔颜乐处”，并以“吾与点也”之意为孔子人格范式的思想旨趣。","keywords":"文化性格 审美情趣转变 理性特征","note":"宋代的“三教合一”是以儒家思想为主唱，佛、道为伴唱而共谱的时代之曲。宋代“三教合一”思潮不仅完成了三教之间的理论整合，推动了理学的形成，而且造就了以“和合”为特征的深层民族心理结构，对中国社会产生了至深至远的影响。相关内容可以参考张玉璞《“三教合一”与宋代士人心态及文学呈现》，具体资料可以在李凡文学正版群内领取。"},{"id":"228","stars":"★★★","title":"试分析宋词兴盛的原因","body":"宋初百馀年间，国内比较安定，生产持续发展，经济高度繁荣。宋繁华的都市生活，滋生了各类以娱乐为目的的文艺形式，而词则成为宋代最引人注目的文学样式。宋词的繁荣，主要归结于以下原因：\n\n一、歌台舞榭和歌儿舞女成为士大夫生活中的重要内容\n\n宋王朝的财政措施是“恩逮于百官者唯恐其不足，财取于万民者不留其有馀”，大量的财富被集中起来供皇室和官僚阶层享用，这种用物质享受笼络官员的做法在整个宋代都没有改变。官员们既有丰厚的俸禄，以满足奢华生活的需求，这种生活方式又可以避免朝廷的疑忌，于是纵情享乐之风盛行一时。宋代的官员大多是有高度文化修养的士大夫，他们的享乐方式\n\n通常是轻歌曼舞，浅斟低唱。地位高的士大夫大多蓄家伎，地位低的官员也有官伎提供歌舞娱乐。歌台舞榭和歌儿舞女既然成为士大夫生活中的重要内容，滋生于这种土壤的词自然会异常兴盛。\n\n二、宋代文人实现了社会责任感和个性自由的人生态度的整合，诗词分工观念形成\n\n宋代文人的人生态度也有利于词的兴盛。宋代文人大多实现了社会责任感和个性自由的整合。他们用诗文来表现有关政治、社会的严肃内容，词则用来抒写纯属个人私生活的幽约情愫。这样，诗文和词就有了明确的分工：诗文主要用来述志，词则用来娱情。这种分工在北宋尤为明显。宋代的士大夫本有丰富的声色享受，又有趋于轻柔、细密的审美心态，自然能够领略男女之间的旖旎风情。词便是他们最合适的宣泄内心衷肠的渠道。诗词分工的观念对宋词的发展大有好处。由于词被看作是用于抒写个人情愫的文体，很少受到“文以载道”思想的约束，因而文人可以比较自由地抒写旖旎风情，词体也因此能够保持自身的特性，取得独立的地位。\n\n三、社会的广泛需求\n\n词是宋代尤其是北宋社会文化消费的热点。由于都市的繁荣，民间的娱乐场所也需要大量的歌词，士大夫的词作便通过各种途径流传于民间。更有一些词人直接为歌女写词，社会对词作的广泛需求，刺激了词人的创作热情，也促进了词的繁荣和发展。\n\n四、知识分子群体庞大\n\n宋代重文轻武的统治思想和政策，形成畸形的文人政治和庞大的知识分子队伍，他们是宋代文化繁荣的生力军，也是宋词繁荣的作者群体。在制度影响下，宋社会重文而轻武，为生存，千军万马涌向文化的“独木桥”。同时，为加强统治，笼络士人，化消极因素为积极因素，宋主动地把准反对者吸纳进自己的统治阵营中，扩大科举取士名额，所谓“野无遗贤”。在这些因素影响下，知识分子群体庞大，为宋词繁荣提供了强有力的推动作用。\n\n五、宋代时词这一领域还未充分开发，潜力巨大\n\n就历史因革考察，诗在唐人笔下已臻于至善，难乎为继了，富于创新精神的诗人们便抓住词这种要眇宜修、轻灵活泼、委宛言长的新诗体继续驰骋他们的天才。但唐五代基本上仍是诗的天下，词这块领域还未来得及充分开发，遂给宋人留下了充分空间任其飞跃，在这得天独厚的土壤中，宋人稍加耕耘就会结出累累硕果。\n\n六、词体适用于表达深长、细腻、丰富的情感，具有宽广的美学空间\n\n就美学因素考察，诗这种体裁，由于形式过于整齐，有时难免影响它的表现力，尤其是律诗更受到起承转合的限制。用这样始终如一的均衡的节奏表达千变万化的丰富内容和感情，有时就未免宽窄不适。词正弥补了这种不足。它可以用各种长短句或疏或密灵活多变地表达深长、细腻、丰富的情感，不管是初期的婉约风格还是后起的清旷、豪放、骚雅风格皆如此。这正给词的繁荣开拓了一块宽广的美学空间。","keywords":"歌台舞榭 歌儿舞女 生活中重要内容 人生态度 诗词分工 广泛需求 知识分子群体庞大 潜力巨大 美学空间","note":""},{"id":"229","stars":"★★★","title":"试述宋词的主要成就","body":"作为有宋一代文学之胜的是宋词。在词史上，宋词占有无与伦比的巅峰地位。宋词的总体成就十分突出，主要体现在以下方面：\n\n一、完成了词体的建设，艺术手段日益成熟\n\n无论是小令还是长调，最常用的词调都定型于宋代。在词的过片、句读、字声等方面，宋词都建立了严格的规范。词与音乐有特别密切的关系，词的声律和章法、句法也格外细密。唐五代词多是小令，满心而发、肆口而成，无需更多的手法与技巧，未词则多是中长调，就需要在篇章结构、铺陈点染、呼应映衬、语言修辞上讲究技巧方法。才高学富的宋人就把诗、文、论、赋中的种种手法移植到词中，以至出现了词诗、词论等现象，填词艺术确实有了长足的进步与提高。宋词独特的艺术魅力是五七言诗难以达到的，它为丰富古典诗歌的艺术作出了独特的贡献。\n\n二、在题材内容和风格倾向上，开拓了广阔的领域\n\n晚唐五代词，大多是风格柔婉的艳词，宋代词人继承并改造了这个传统，创作出大量的抒情意味更浓的美丽动人的爱情词，弥补了古代诗歌爱情题材的不足。此外，经过苏、辛等人的努力，宋词的题材范围，几乎达到了与五七言诗同样广阔的\n\n程度，咏物词、咏史词、田园词、爱情词、赠答词、送别词、谐谑词，应有尽有。艺术风格上，也是争奇斗艳，婉约与豪放并存，清新与秾丽相竞。无论是题材还是风格，后代词人很少能超出宋词的范围。\n\n三、全社会普及\n\n宋代上至皇帝，下至庶民，全都喜好词曲。北宋太宗、真宗、仁宗、神宗都深晓词律，雅好词章，经常让人在宫中演唱。南渡以后，高宗不但能词，而且刻意提倡，奖掖词才，孝宗、光宗、宁宗也都有词作流传。而从“凡有井水处，即能歌柳词”这一传言来推测，可以肯定词的普及已扩展到社会的各个阶层、各个角落。宋人的笔记中常有关于歌女乐妓即兴作词的记载，不但这些受过专业训练的人能如此，很多普通人亦善于填词。\n\n四、风格流派众多\n\n宋词流派众多，在当时就已有“柳永体”“东坡体”“易安体”“朱希真体”“稼轩体”“白石体”等等名目。而后人又常“以时而论”，如把宋词分成北、南两大期或效法唐诗分成初盛中晚四期；“以人而论”，如认为某些人是师法某人的；“以正变而论”，如认为传统的婉约是正宗，反婉约的豪放是变调，把宋词分成很多流派。最多的还是“以风格而论”。如有人将宋词划分成婉约与豪放两大风格。有人又从两大派中分出较中和平正的一派，称“宋词有二派”。还有人称“词之为体，大略有四”。因此，很难对它作出绝对的规定与划分，但起码不应少于以下几种：婉约，如柳永、秦观、李清照等；旷达，如苏轼；豪放，如苏轼、辛弃疾及一些辛派词人；骚雅，如姜夔及其后的很多人。这和唐五代只有婉约一种主要风格相比，真可谓异彩纷呈，空前繁荣了。","keywords":"词体的建设 艺术手段成熟 题材内容和风格倾向开拓 全社会普及 风格流派众多","note":"宋代词的成熟，不仅表现在其内容和艺术上，更表现在其普及度上。宋词不再作为“诗之余”，而是作为一种独立的文体而为人所承认，并渗透在了生活的方方面面。可以说，在宋代词人的手上，词作为一种文学体裁最终得以成熟，并成长为可以与唐诗分庭抗礼的存在。"},{"id":"230","stars":"★★★","title":"试述宋代散文的成就","body":"宋代散文沿着唐代散文的道路而发展，最终的成就却超过了唐文。宋代作家吸取了唐代古文的经验和教训，使古文更加健康地发展。欧阳修等人既采取古文作为主要的文体，又反对追求古奥而造成的险怪艰涩，从而为宋代古文的发展开辟了正确的道路。宋代的散文成就，主要表现在以下方面：\n\n一、散文文体出现多样化趋势\n\n除了既有文体之外，宋代还出现了一些新的散文体式。如欧、苏等人并不绝对摒弃骈文，他们的古文注意吸收骈文在辞采、声调等方面的长处，以构筑古文的节奏韵律之美。同时，他们又借鉴古文手法，对骈文进行改造，创造出参用散体单行的四六和文赋。这样，古文和骈文经过取长补短而各自获得了新的活力。此外，宋代散文中还出现了独具一格的笔记文。这种文体长短不拘，轻松活泼，是古文文体解放的重要标志。\n\n二、散文实用价值与审美价值结合\n\n散文在传统上具有议论、叙事、抒情三种主要功能。在宋代散文中，这些功能更加完善，而且融为一体，使散文的实用价值和审美价值更好地结合起来。宋代的政论文和学术论文特别发达，从王安石、曾巩到胡铨、吕祖谦，散文的议论功能臻于完善。以欧、苏为代表的作家则更加注意三种功能的融合，加强了散文的抒情性质和文学意味。散文的各种功能已水乳交融，且具有诗的意境，成为名副其实的美文。\n\n三、开辟新的艺术境界\n\n宋代散文的风格丰富多彩，几位大家各具鲜明的艺术个性。就整体倾向而言，宋文的风格是趋于平易畅达、简洁明快，从而在韩文之雄肆、柳文之峻切之外开辟出新的艺术境界。就美学价值而言，宋文与唐文并无高下之分。宋文的风格变化，主要是朝着更加自然、更加贴近生活的方向发展。这种文从字顺、如行云流水的散文，显然更切于实用，也更易为作者和读者所接受。\n\n从宋代开始，古文成为用途最广的散文文体，以古文为主，骈文为辅的文体格局得以确立，历元、明、清诸代而没有变化。明末艾南英说：“文至宋而体备，至宋而法严。”这是后人对宋代散文历史地位的公正评价。","keywords":"文体多样化 实用价值和审美价值结合 新的艺术境界 古文为主，骈文为辅的文体格局","note":"宋代散文是在唐代散文的基础上发展起来的，不过，以欧阳修为代表的宋代散文家整体明显更加开放与包容，纠正了韩愈等人尚奇尚险、古奥艰涩的文风，并最终确立了散文文体格局。宋代的散文成就，因此而得到了后人的肯定，这一点，从“唐宋八大家”中宋人比唐人多得多这一点就可以看出来。"},{"id":"231","stars":"★★★★","title":"试分析宋诗的思想艺术特征","body":"自从产生宋诗以后，唐诗和宋诗便成为诗歌史上双峰并峙的两个典范。总体来看，宋诗具有如下思想艺术特色：\n\n一、从思想内容上看，宋诗比历代诗歌都要广阔，和当代社会生活、政治生活结合得更为紧密\n\n（一）直接以诗歌议政\n\n唐代的杜甫、白居易多有直接议政的诗歌，宋则更多，且针对性更为具体明确。很多诗就是针对某一政治事件而发的，堪称地地道道的政治诗，如梅尧臣的《书窜》就是记录唐介弹劾文彦博的，全诗几乎只将唐介的弹章改成韵语，虽称不上好诗，但是是很有宋代特色的政治诗，时事诗。至于王安石以诗称颂变法、苏轼以诗讥讽新政，则更是宋诗政治化的突出表现。\n\n（二）自始至终地表现爱国思想\n\n因为时代的原因，爱国主题成为宋诗不同于唐诗的一大特色。早在北宋初中期，随着对辽、西夏战事的频仍，这类作品就日益增多，至南宋更成为最广泛的主题，几乎所有较知名的诗人都有这类佳作。这些作品既有屈辱，也有奋争；既有批判，也有激励；既有痛哭，也有讴歌，五光十色，大放异彩，为中国诗歌宝库增加了绚烂的瑰宝。\n\n（三）广泛而深入地描写民生\n\n描写民生的作品在唐诗中虽然很多，但宋诗仍有所突破发展。它反映的面更广了，不但描写一般的田夫织妇，而且扩展到纤夫、渔民、城市贫民、手工业者、小商贩、艺人等。揭示得也更深了，不但揭露了贫富不均的表面现象和苛捐杂税加给人民的种种苦难，而且对一些本质性的问题有了更深刻的反映，如土地兼并和囤积居奇；不但泛泛揭露了统治者作威作福、鱼肉人民的罪行，而且更具体深入了。这都是对唐诗内容的进一步拓宽。\n\n（四）极为广泛地描绘出经济生产、民风民俗等社会生活画面\n\n随着宋代社会的发展，越来越多新的经济、社会、文化现象引起诗人的兴趣，并被他们摄入笔端。如盐酒专卖、漕运、矿业、新式农具、医疗技术、年节风俗、占卜、说书等，几乎无所不包。内容之广，就连经济已很发达的唐代也望尘莫及，为我们保留了很多有益的经济和民俗资料。\n\n（五）品评艺术的作品大量产生\n\n凡较著名的作家，几乎都有不少评诗、评书、评画、评音乐等论艺之作。唐人虽有不少这样的作品，但宋人更多，水平更高，更自觉地表现了他们的审美情趣和艺术修养。如黄庭坚《题郑防画夹五首》之一写绘画之美，其奇特巧妙的“诡谲”手法恐怕令唐人亦为之瞠目。\n\n二、从艺术特色上看，宋诗亦有自己的独特风格\n\n（一）议论化\n\n议论化即严羽所说的“以议论为诗”，刘克庄所说的“尚理致”。这已成为对宋诗的定评公论。唐人诗如杜甫、韩愈已有一些议论，但尚未形成一种明显的倾向。至宋，随着诗歌功能、表现力的不断发展，随着社会矛盾的不断加剧，正直的有责任感的诗人以诗为武器，议论时事、干预政治，实属历史的必然，至于议论的好坏当视具体情况而论。大致说来，自梅尧臣、欧阳修、苏舜钦起，议论已成为一种倾向，但尚处于探索初创阶段，生硬的议论较多，生动的议论较少。到王安石、苏轼，借助于高度的思想修养，包括禅学思想修养以及艺术修养，以议论入诗变得更成熟，优秀的作品也就更多了。再到陆游、杨万里、朱熹等人，或借助于对生活的丰富体验，或借助高度的思想修养，其中主要是理学思想修养，更写下了许多“有理趣而无理障”的议论诗，这无疑应视为宋诗的一大成就。\n\n（二）才学化\n\n才学化即严羽所说的“以才学为诗”，刘克庄所说的“逞辨博”“负材力”。这主要表现在广征博引、多用故实上，它直接导源于宋人有高度的文化修养、学术水平。这种现象在唐代已露端倪。有人评杜诗有才学，无一字无来历，这未免有些强加于人；较明显的是韩愈，但终未形成“一代”之倾向。至宋诗，这种现象普遍起来，从西昆到苏轼，再到黄庭坚及江西诗派，确实已形成一代之风，只是到南宋中后期，这种风气才有所减弱。\n\n（三）散文化\n\n散文化或曰以文为诗，即以散文句式、句法入诗。这和严羽所说的“以文字为诗”，虽不完全相同，但仍有一定联系，即都着眼于语言特点而言。“以文为诗，自昌黎始。至东坡益大放厥词，别开生面，成一代之大观。”其实从欧阳修起即已如此。这种倾向总的说来弊大于利，它破坏了诗歌语言的优美，生动，削弱了诗歌的美学特征。但在一定情况下也能突破诗歌语言句式过于死板的束缚，增强诗歌的表现力。\n\n（四）某些具体写作手法的翻新与改进。\n\n欧阳修曾云：“诗之为巧，犹画工小笔尔，以此知文章与造化争巧可也。”可见宋人是很注重这些具体小手法的。这种风气的形成，也是建立在面对高度发达的唐诗背景之上的。唐诗在各种表现方法、写作技巧方面都已臻于完备，宋人只能在它开拓的道路上或向深处，或向远处，或向侧处作进一步的开发。在构思、立意、修辞、语言诸方面进一步的求细、求新、求透、求活、求精。","keywords":"以诗歌议政 爱国思想 描写民生 社会生活画面 品评艺术 议论化 才学化 散文化 写作手法翻新与改进","note":"宋诗是中国诗歌史上继唐诗之后的又一高峰，不过相较于唐诗，宋诗在思想和艺术上表现了许多新的变化，这些变化某种程度上都是与宋代整体文学环境的变化是息息相关的，从这部分内容中我们可以看到前面几道题的影子，可以说，很大程度上正是唐代与宋代社会环境的不同，使唐诗与宋诗之间形成了差异。"},{"id":"232","stars":"★★★","title":"宋人在唐后，开辟真难为，谈一谈宋人对唐人诗歌的创作继承与发展（26北京大学）","body":"一、从中唐开始，唐诗就有向日后的宋诗演变的趋势。而宋诗的许多特征，都可在杜甫、韩愈的诗中找到滥觞。从整个诗歌史来看，宋诗正是唐诗发展的必然结果。唐诗与宋诗，本是一脉相承的。这从以下方面可以略见一斑：\n\n（一）诗歌题材和语言的通俗化\n\n诗歌在题材和语言上趋于通俗化，描写平凡、琐细的日常生活，并采用俗字俚语，这种趋势是从杜甫开始的，中唐韩愈、白居易、孟郊、贾岛及晚唐皮日休、罗隐等人又有所发展，而宋代诗人则沿其流而扬其波。\n\n（二）诗歌中发议论\n\n在诗歌中发议论，是从杜甫、韩愈开始，在晚唐杜牧、李商隐的诗中已屡见不鲜，入宋以后则发展成为诗坛的普遍风气。宋代诗人正是充分吸取了唐诗的营养，才创造出自具面目的一代诗风。杜甫、韩愈对宋诗的启迪作用尤其重要。\n\n（三）宋诗在体裁上因袭了唐代五七言诗的古体、今体诸形式\n\n由于唐代诗人在声律、丽辞上提供了正反两方面的丰富经验，唐人就水到渠成地实现了诗歌的格律化，从此奠定了五七言诗的古体、今体诸形式。但由于唐人对这些诗体都已掌握得得心应手，宋人在体裁方面就很难再作什么创新了。除了拗律和对仗手法的灵活多变之外，宋人在诗歌形式方面基本上是沿袭了唐人的手法而无所变化。\n\n二、从欧阳修、梅尧臣开始，宋人就试图摆脱唐诗的藩篱。他们在诗国中很难发现未经唐人触动的新的宝藏，他们所能做的是在唐人开采过的矿井里向深处发掘。宋诗对唐诗的革新，主要表现在以下方面：\n\n（一）选材角度更趋向世俗化和平凡化\n\n宋诗较成功的题材开拓是向平凡的日常生活倾斜，唐人注意不够的琐事细物都成为宋人笔下的诗料，比如苏轼有咏农具之诗，黄庭坚多咏茶之诗，有些生活内容唐人也已写过，但宋诗的选材角度更趋向世俗化和平凡化，比如唐代的山水诗多咏幽静绝俗之境，而宋人却喜写游人熙攘的金山、西湖。宋诗所展示的抒情主人公更像平凡的普通人。\n\n（二）以平淡为美的诗学观点\n\n宋代许多诗人具有鲜明的艺术个性，他们的风格特征相对于唐诗而言都是生新的，都可视为对唐诗风格的陌生化的结果。然而宋代诗坛有一个整体性的风格追求，那就是以平淡为美。苏轼和黄庭坚一向被看作宋诗特征的典型代表，苏轼论诗最重陶渊明，黄庭坚则更推崇杜甫晚期诗的平淡境界。他们的诗美理想是殊途同归的，他们追求的平淡实指一种超越了雕润绚烂的老成风格，一种炉火纯青的美学境界。以平淡为美的诗学观点显然是对以丰华情韵为特征的唐诗美学风范的深刻变革，这是宋代诗人求新求变的终极目标。\n\n（三）注重筋骨思理，温和、内敛\n\n如果说唐诗是以丰神情韵见长，那么宋诗则是以筋骨思理取胜的，更简洁的说法是唐诗主情，宋诗主意。宋诗并不缺乏情感，但是宋诗的情感内蕴，大多经过理性的节制，比较温和、内敛，不如唐诗那般热烈，外扬。所以宋诗的特长是思虑深刻而外表平淡，它是宋人对生活的深沉思考的文学表现。唐情、宋意既互相对立，又互相补充，它们是古典诗歌美学的两大范式，对后代诗歌具有深远的影响。","keywords":"题材和语言通俗化 诗歌中发议论 体裁 世俗化 平凡化 以平淡为美 筋骨思理 温和、内敛","note":"宋诗和唐诗的差异是多方面的，但宋诗却是在唐诗的基础上发展而来的，这些差异，都是宋代诗人不断追求创新的结果。二者既各树一帜，又互相补充。它们是古典诗歌美学的两大范式，对后代诗歌具有深远的影响。在题材、语言、体裁等种种方面，宋诗都是唐诗的发展，但宋诗在这些基础上更深入地发掘，并且形成了以平淡为美的美学境界，整体风格温和、内敛，最终形成了可堪与唐诗并肩的又一高峰。相关内容可以参考莫砺锋《宋诗三论》，具体资料可以在李凡文学正版群内领取。"},{"id":"233","stars":"★★★★","title":"谈谈你对钱钟书“诗分唐宋”观点的认识（26陕西师范大学、四川大学）【答题框架】","body":"唐宋诗在美学风格上，既各树一帜，又互相补充。它们是五七言古典诗歌美学的两大范式，对后代诗歌具有深远的影响。因此，在后世文学批评之中，才有了“诗分唐宋”这一观点，并引发了持续多年的唐宋诗之争。《谈艺录》中，钱钟书摒弃旧有成见，结合中西文学现象和诗学话语，在否定社会造因说的基础上，对“诗分唐宋”的理论内涵做出了更为合理的阐释。具体可以从以下角度进行分析\n\n一、钱钟书“诗分唐宋”说的内涵\n\n“诗分唐宋”昭示的不是“朝代之别”，而是创作主体的“体格性分之殊”。论及这一问题时，钱钟书将杨万里、博纳米、席勒等中西学人的言论并置一处，使其彼此阐发相互映射，从两个层面凸显出“诗分唐宋”的理论内涵：\n\n（一）“诗分唐宋”中的“唐宋”指的并不是唐朝和宋朝\n\n杨万里曾经谈到，“诗江西也，非人皆江西也”，在钱钟书看来，“诗人之分唐宋，亦略同杨序之恉”：诗唐宋也，非人皆唐宋也。与“杨序之恉”相映成趣的，是英国18世纪的文坛状况和批评家博纳米对英国散文家安迪生文学地位的认定：18世纪初是英国安妮女王在位时期，但是此时的英国作家却多好模仿古罗马奥古斯都时代的文学；英国著名散文家和诗人安迪生的主要创作集中在这一时段，而批评家博纳米却将其定位为维多利亚时代的第一位文学家。可见，文学创作的价值取向和实际影响并不会受制或局限于创作主体所处的社会时代，“固知文章流别，初不拘名从主人之例，中外一理也。”唐诗宋诗的发展理路与唐朝宋朝的社会时代变迁之间也不存在同构关系。\n\n（二）“诗分唐宋”所标举的是创作主体的不同性情心理所造就的不同创作倾向，性情心理的复杂性决定了唐诗宋诗这两种创作倾向往往交缠在一起\n\n钱钟书认为，诗人的主体差异性决定了唐诗和宋诗这两种创作倾向的分别：“夫人禀性，各有偏至。发为声诗，高明者近唐，沉潜者近宋，有不期而然者。”唐代诗人和宋代诗人的性情心理各有特点，在诗歌创作方面，唐代诗人多重想象，追求融之美，未代诗人多重理智，追求分析之妙，其他朝代的诗作均是唐宋诗风的轮回。\n\n但是，唐代诗人和宋代诗人性情心理的区别并不是绝对的，宋代诗歌中也有重想象的成分，唐代诗歌中也有重理智的成分，甚至在同一个诗人的诗作中，也会出现“丰神情韵”和“筋骨思理”这两种审美特质。\n\n在钱钟书看来，这种唐宋诗交缠的创作倾向主要取决于创作主体性情心理的复杂性，而创作主体性情心理的复杂性对文学创作的影响主要体现在两个方面：其一，处于不同时代的人可能会具有相同或类似的气质性情和心理倾向，所以“旷世而可同调”的文学创作现象屡见不鲜。其二，同一个人身上会交缠着不同的气质性情和心理倾向，所以，不要说在同一个时代，即使在同一创作主体那里也会出现不同的文学创作倾向。\n\n二、“诗分唐宋”的表现\n\n（一）唐诗主情而蕴藉，宋诗主理而直露\n\n唐诗以情胜，故无论构思和表现都借助形象思维；宋诗以理胜，往往要通过逻辑思维对现实生活进行解剖，并归纳出一个理性主题。而唐诗则不能，因为唐诗中所叙述的乃是生活本身，而不是诗人对于生活的见解。试比较王安石《河北民》、苏轼《吴中田妇叹》和杜甫的“三吏”“三别”，前者揭露了官府役民、扰民，主题鲜明突出，诗人反对的态度一目了然。而后者却像生活本身那么复杂，既写了抓丁民，又写了人们愿意共赴国难（如“勿为新婚念，努力事戎行”“老妪力虽衰，\n\n请从吏夜归”等语）以及诗人的劝慰语（如“送行勿泣血，仆射如弟兄”等语）。诗歌就像生活一样复杂，很难从中归结出一个抽象化的题旨。这是宋诗与唐诗最主要的区别。\n\n（二）唐诗自然，宋诗深折\n\n唐诗主情，因情是潜存于内心的，一触即发，不待思虑而得，自然流露，如行云流水，毫不凝滞，因而自然无成，无雕琢匠气；宋诗主理，必须深思冥索，多方探求始得，所以使人感到深折。\n\n我们试以唐王之涣《登鹳雀楼》和苏轼《题西林壁》为例进行比较。王诗意境阔大之处有灵动，由“白日”“黄河”构成的色彩斑斓图景中，兴起诗人感物之怀，意象浑成韵味深远，充溢的是盛唐气象。同为游景后作的《题西林壁》可见出用心深微，写景变化有序，由虚到实，有“理趣”之致，但略显呆板，少些斑斓图景。\n\n（三）唐诗雄浑，宋诗风雅\n\n古典诗歌的意象，大致可以有两个来源，一个是自然的意象，就是日月星辰，山川风物，自然界的意象。另外一种意象是人文的意象，就是历史文化遗存的意象，这种人文意象更多地体现在典故的利用上。唐诗以自然意象取胜，把自然意象与诗人强烈的现实感怀结合起来，表现清新刚健的时代精神，兴象玲珑，境界浑成；宋诗以人文意象取胜，以富有人文积淀色彩的典故、语码和充满才情智慧的议论，表现渊雅不俗的人文情趣与修养，具有人文风采。\n\n如杜甫的《登高》与黄庭坚的《登快阁》均为登高望远的遣怀之作，杜诗纯用自然意象，先勾勒一幅凄清哀凉之秋景，再结合自己的身世遭遇，于是穷愁潦倒、年老多病、流寓他乡的悲苦之情也就自然流出，充塞于天地之间。与杜诗的真情流露人心肺相比，黄诗就显得注重技巧了，有创造“佳句”“名句”的用心融于其中，其摒去尘俗、归隐故园之意，纯用典故隐隐道出，有点掉书袋的嫌疑味。\n\n总体来看，如果说唐诗是“沧海横流方显英雄本色”，那么宋诗则是“曾经沧海”后的平易老成，这也正是宋诗对唐诗变革的实质所在。总之，唐宋诗各树一帜，又互相补充，是古典诗歌美学的两大范式，对后代诗歌具有深远的影响。","keywords":"内涵 不是唐朝和宋朝 性情心理 创作倾向 交缠在一起 表现 主情而蕴藉 主理而直露 自然 深折 雄浑 风雅","note":"让大家去讨论“诗分唐宋”，讨论的不是“唐代诗歌”和“宋代诗歌”，而是“唐诗范式”和“宋诗范式”。唐宋诗之间的差别，在宋代就已经被注意到了，并且经常会被拿出来讨论，并且因为尊唐和尊宋的不同而引起了许多争论，比如清代的“唐宋之争”。钱钟书“诗分唐宋”的观点，可以说是在之前观点的基础上的新发掘，将这两大美学范式给成功调和。相关内容可以参考刘媛《论钱钟书的“诗分唐宋”观》，具体论文可以在李凡文学正版群领取。"},{"id":"234","stars":"★★★","title":"试分析王禹偶诗歌的艺术特征","body":"王禹偁以白体诗人著称，他表现出中正平和、自然流畅的风格，较好地贯彻了其“词丽而不冶，气直而不讦，意远而不泥”的诗学主张，成为宋初诗人学习白体的翘楚。总体来看，王禹偁的诗歌创作，主要具备如下特征：\n\n一、内容上继承了白居易诗歌的干政与讽谕传统\n\n王禹偁屡屡提及“寄语采诗官”“传于执政者”，希冀发挥诗歌的政治功用。王禹偁的诗“多涉规讽”“未尝空言”，多写民生疾苦、军国大事。这类诗又有两个显著特点。一是常明确表示要效法《诗经》，以诗干政。二是常以己推人，把自己摆进对比的位置中，把反映现实与剖析内心结合起来，因而其感情色彩亦朴实可信，其创作宗旨与创作心态确实继承了杜甫、白居易的传统。如其《对雪》以自己的安逸生活与为戍边将士运输的“河朔民”的艰辛、边塞兵的苦寒进行对比，愈见诗人的真实情感，篇末的自我拷问，更是令人感受到作者的崇高品格。\n\n二、整体风格简雅古淡\n\n王禹偁不但强调文学创作要“易道易晓”，而且还提倡“意不常而语不俗”的创新精神，重视文学的美学功效，因而其创作能呈现出“简雅古淡”之美。这一特点使他的创作既不同于五代的雕绘之习，又不同于柳开的奇僻之陋，而显出自家特色。王禹偁学习白居易的闲适诗，一些写景之作亦极似之，如《村行》，意象之清丽，语言之明畅，皆与白居易《钱塘湖春行》一类作品相类。\n\n三、有诗歌议论化倾向，但瑕瑜互见\n\n如《唱山歌》极力描写滁地“春来恣歌吟”的风俗，以及自己对此采取的“修教不易俗”的治令，最后将因势利导的教化之功归结为“乃知国家事，成败因人心”的议论，既有深度，又不造作。但有些议论就较为生硬，如《送戚维戚纶之阆州亳州》纯似逻辑推理，不足为法。这两种倾向在以后的宋诗中都有反映。\n\n从总体上看，王禹偁的诗平易流畅，简雅古淡，在宋初白体诗中独树一帜，已初步表现出对于平淡美的追求。他的长篇诗歌叙事简直，议论畅达，已开宋诗散文化、议论化的风气。清人吴之振说“元之独开有宋风气”，这个评价是合乎事实的。","keywords":"干政与讽谕传统 简雅古淡 诗歌议论化","note":"王禹偁可以说是宋初白体诗人的代表，他的诗歌也受到了白居易很大的影响。不过相较于其他白体诗人诗歌内容的浅薄，王禹偁的诗歌明显学习了白居易的讽谕传统，整体言之有物，这也让他高出其他白体诗人一筹。"},{"id":"235","stars":"★★★","title":"试分析西昆体的特征","body":"西昆体，是以《西昆酬唱集》而得名的。它通过学习李商隐倡导诗句用典、注重字面修饰、对仗精切和吟咏自适性情的诗歌品格，历经两宋诗人的扬弃，贯穿于两宋诗歌的发展历程，成为宋代诗歌重要的特征。西昆体诗人的人数虽然不少，但成就较高的只有杨亿、刘筠、钱惟演三人。西昆体创作有得有失，总体来看，主要表现为以下特征：\n\n一、题材范围狭隘，思想内容贫乏\n\n西昆体题材范围比较狭隘。《西昆酬唱集》全集70个诗题中，主要有三类题材：一是怀古咏史，二是咏物，三是描写流连光景的生活内容。此外西昆集中偶有闺情题材，但为数很少。后人或责备西昆体“淫靡”，那是不符合事实的。西昆体诗在内容上并非毫无可取之处，例如刘筠的《汉武》，体现了批判时政的现实意义。但是从总体上看，西昆体诗的思想内容是比较贫乏的，它们与时代、社会没有密切的关系，也很少抒写诗人的真情实感，缺乏生活气息。\n\n二、注重对诗句进行雕琢\n\n西昆体对未代诗歌产生重大影响，在于注重用典、藻饰、锻炼等诗歌写作手法，形成被后世称为“昆体工夫”的诗歌创作技巧。所谓“昆体工夫”，表现为西昆体诗人注重对诗句进行雕琢，诗作中往往含有多个历史典故，强调诗句的对偶、押韵以及诗句语言的色彩等，追求诗歌雍容典赡、炼词工整的诗歌风格。如杨亿的《泪》把窦滔妻苏氏织回文诗、卓文君作《白头吟》、陇头流水、三峡听猿、汉陈皇后、魏文帝美人薛灵芸、荆轲别易水等一些与流泪有关的典故堆砌一起，词藻华丽，对仗精工。全诗缺乏结构线索，感情表达比较隐晦。\n\n三、整饰、典丽、深密的风格\n\n西昆诗人学习李商隐诗的艺术有得有失，其得益之处为对仗工稳，用事深密，文字华美，呈现出整饰、典丽的艺术特征，西昆体虽然没能在唐诗之外开辟新的艺术境界，但是相对于平直浅陋的五代诗风而言，这种整饰、典丽、深密的诗风毕竟意味着艺术上的进步。在宋初诗坛弥漫着白体和晚唐体崇尚白描、少用典故的诗风的背景下，西昆体的出现无疑令人耳目一新，它初步反映出北未统一帝国的堂皇气象，这是“杨、刘风采，耸动天下”的主要原因。","keywords":"题材狭隘 思想贫乏 注重雕琢 整饰、典丽、深密","note":"西昆体能风行一时，和西昆体诗人学习李商隐，艺术成就上超越白体、晚唐体不无关系；但其题材狭窄，缺乏自立精神，最终走向了衰落。从本质上说，它和白体、晚唐体一样，都是五代诗风的延续。需要注意的是“宋初三体”以及“西昆体”都有可能在名词解释中出现，大家要注意一下。"},{"id":"236","stars":"★★★","title":"试分析晏殊词的特征（26新疆大学）","body":"晏殊词得花间遗韵和南唐俊逸，同时，他又以“情中有思”的个人风格，将小令的创作推向了更加圆熟的境地，于是，他被称为“北宋倚声家初祖”。晏殊的词作，主要具备如下特征：\n\n一、多写男女之情，风格清丽淡雅\n\n晏殊绝大部分词作的内容是抒写男女之间的相思爱恋和离愁别恨。如“无穷无尽是离愁，天涯地角寻思遍”“天涯地角有穷时，只有相思无尽处”。然而，晏殊词写男女恋情，已过滤了五代“花间”词所包含的轻佻艳冶的杂质，而显得纯净雅致，他往往略去对女性容貌色相的描写而着重表现抒情主人公的恋情。其词的情感基调是雍容和缓，淡淡的忧愁中时而透露出自我解脱的气度；语言也一洗五代“花间”词的脂粉气和浓艳色彩而变得清丽淡雅，温润秀洁。\n\n二、圆融平静，多存富贵气象\n\n所谓富贵气象，并不是词藻上的镂金错彩，不在形貌，而在于精神。晏殊词中的富贵并非金玉满眼，而只是一种闲适之景。这种闲适的环境，自然要有富贵生活支撑，用晏殊自己的话说：“穷儿家有这景致也无？”而在这种景致中活动的人物，自然也就是一位安雅闲适的士大夫。如《踏莎行》（小径红稀），景物清丽雅致，温润秀洁；笔法清圆婉转，从容不迫，一切皆和他的富贵身份相协调。\n\n三、“情中有思”的个人风格\n\n晏殊词与其卓有修养的士大夫心态相称，他不会直书“人生非金石，岂能长寿考”，而是将这种生命哀愁表现得含蓄淡然，难以言传。所以，丰厚的文艺修养、浓重的人生感慨，使他的词发展成“情中有思”的个人风格，即词中渗透着理性沉思的特质和对生命的深层探寻。名作《浣溪沙》最能代表这种特色，词中描写的都是他特别钟爱的夕阳和落花、今日和去年，这些景致虽然司空见惯，但其中记录的却是留不住的时光。词作表达的是时间永恒而人生有限这样深广的矛盾，但晏殊却在闲雅的景物和淡雅闲适的情调中，将其表现得悠悠含蓄。\n\n四、以女性描写来寄托个人情感\n\n《珠玉词》以女性描写来寄托个人情感的作品占到了近一半数量。有学者认为这是继承屈原的《离骚》传统，以男女恋情暗喻君臣不遇、宦海忧患，这种“臣妾心态”把在内忧外患中宰相词人的精神世界展露无遗。晏殊笔下的爱情多是难以实现的，是迷茫彷徨的，这的确可以暗喻词人一生在朝堂之上的理想失落和价值迷茫。但也应该看到，晏殊的高明之处是他将这种爱情的愁苦推向理性的境界，如“满目山河空念远，落花风雨更伤春。不如怜取眼前人”，这就使其词有了某种指引人生的意味。","keywords":"相思爱恋和离愁别恨 纯净雅致 清丽淡雅 对生命的忧思","note":"晏殊的词虽然在内容上还集中于男女之间的相思爱恋和离愁别绪，但无论是从整体风格还是语言形式上，都脱离了五代词风的窠臼，并在词中蕴涵着对生命的忧思，对宋词发展有一定的积极意义。又因其年辈和政治地位，所以被尊为“北宋倚声家初祖”。"},{"id":"237","stars":"★★★","title":"谈谈欧阳修对词境开拓做出的贡献","body":"尽管欧阳修作词是“以其馀力游戏”，固守着词为“薄伎，聊佐清欢”的创作观念，但作为开创风气的一代文宗，他对词作也有所革新。这具体表现在以下方面：\n\n一、提升词的格调，扩大词的抒情功能\n\n从内容题材上讲，欧阳修虽仍写传统的相思离别、伤春悲秋以至男欢女怨的情词、艳词，但用力处已不在体态色相，而在细腻的神态描写与内心刻画上，格调更为高雅，使词进一步摆脱歌者之词的地位而转向文人的抒情之作。如《踏莎行》（画馆残梅），虽然“寸寸柔肠，盈盈粉泪”仍是香而弱的伤别老调，但前有无穷春水的深沉比喻，后有青山之外的遥深寄托，全词格调顿显得高远深邃。\n\n欧词中有的题材内容还突破了传统的范围，如歌咏自然风光，抒发仕宦遭遇、人生感慨和豪迈性格等。而这些发展变化的实质，乃是进一步加强词的言志抒情功能，使其成为更能表现个性、更向诗靠拢的体裁，这对苏词的大解放有一定影响。\n\n二、在审美情趣和表现手法上朝通俗化方向开拓\n\n欧阳修在政治生活中，刚劲正直，见义勇为，他的诗文和部分“雅词”表现出其性格中的这个侧面。而他的日常私生活，尤其是年轻时的生活，则颇风流放任，因而也写了一些带“世俗之气”的艳词，其中有的比较庸俗，另一些内容和情调则比较健康，此类词作，体现出一种与五代词追求语言富丽华美的贵族化倾向相异的审美趣味，而接近市民大众的审美情趣。\n\n欧阳修词朝通俗化方向开拓的另一表现是，他借鉴和吸取了民歌的“定格联章”等表现手法，创作了两套分咏十二月节气的《渔家傲》“鼓子词”，这对后来苏轼用联章组词的方式来抒情纪事颇有影响；而另外两首《渔家傲》词，分别写采莲女的浪漫欢乐和爱情苦恼，格调清新，也具有民歌风味。在宋代词史上，欧阳修是主动向民歌学习的第一人，由此也造就了其词清新明畅的艺术风格，歌咏颍州西湖的十首《采桑子》就集中体现出这种风格特征。\n\n三、在词作风格上进行创新，起到承前启后的作用\n\n随着内容题材的扩展，欧词的风格也有创新。这新意来自作家的修养、学识、情趣、性格、人品。因此除传统的婉丽外，还增加了与其为人相似的深挚、自然、爽朗、豪放等不同色彩，虽然这些色彩还没形成一种明显的风格，更未创立新的流派，但对其产生无疑起到促进与过渡作用。自然、爽朗以《朝中措》（平山阑槛倚晴空）为代表，豪放可以《渔家傲·十二月严凝天地闭》为代表，而深挚尤能代表欧词的特色，如《蝶恋花》（庭院深深深几许）。凡此都可以看出欧词在冯、晏基础上更偏向深挚方面发展的特征。而这些特征又“疏隽开子瞻，深婉开少游”，在词史上起到承前启后的作用。","keywords":"提升格调 扩大抒情功能 审美情趣 表现手法 通俗化 风格创新 承前启后","note":"欧阳修虽然主要走五代词人老路，作词观念也未转变，但他在词的功能、审美取向和表现手法等方面都做出了明显的变革，在客观上起到了一个承上启下的作用，对宋词发展产生了重要的影响。所以这部分内容，我们还是有必要了解一下。"},{"id":"238","stars":"★★★","title":"张先对宋词发展做出了怎样的贡献","body":"张先词的内容虽然主要是写“心中事，眼中泪，意中人”，并没有超越传统的相思恨别的范围，但他的创作对于词的发展产生了重要的影响，主要表现在以下方面：\n\n一、扩大了词的实用功能\n\n张先大量用词来赠别酬唱，扩大了词的实用功能。以前的文士日常交际中只用正统的诗歌来唱和赠答，词因被视为不登大雅之堂的“小道”而只写给歌妓演唱。而张先打破了这种惯例，在文士的社交场合中，也常常用词来酬唱赠别。这类赠别唱和之作，艺术上未必都很精致，但扩大了词的日常交际功能，从而在观念上提高了词的文学地位。后来苏轼等人的唱和词作日渐增多，即受张先的影响和启示。\n\n二、率先用题序，将日常生活引入词中。\n\n张先现存165首词，有七十多首用了题序。有的词序文字颇长，有一定的叙事性。著名的“六客词”《定风波令》，词序也长达33字。缘题赋词，写眼前景、身边事，使词的题材取向逐渐贴近作者的日常生活，改变了以往词作有调而无题的传统格局，也加强了词的纪实性和现实感。此后苏轼等人的词大量用题序表明创作的缘起、背景，即是直接受张先的启发。正因为如此，张先词被人视为“古今一大转移”。\n\n三、推动宋词朝着精工的方向发展\n\n张先常把听歌看舞的场面和感受形之于词，传神地表现出那些歌妓的才艺和表演时的情态，使人如临其境，如闻其声，如见其人，对自然景物的描写，张先也独具匠心。他往往通过物影来表现景物的动态美和朦胧美。他因善写“影”而得“张三影”的美名。张先词中写影的共有29句，以“云破月来花弄影”“帘压卷花影”“堕轻絮无影”三句最为有名。其他如“中庭月色正清明，无数杨花过无影”，也同样精妙。正像王国维所评，著一“影”字，意境全出。可见宋词到张先等人手中已向着更精工的方向发展了，这正是他们的贡献。\n\n四、起到了承前启后的作用\n\n张先在宋词发展上起到一定的承前启后作用。张先一生大部分时光来往于湖州与杭州，和苏轼在杭州为官时期有过不少交往，从张先的题序和苏轼的词作都可见二人的酬唱交游。神宗熙宁时期，柳永与晏、欧一时俱逝，张先则作为词坛耆宿，与初濡词笔、尚属新进的苏轼唱酬，又成为维系北宋前期至中期这两代词人的纽带，代表了其间词风嬗变的趋向。张先的词作实践同时也对年轻的苏轼产生了重要影响，这包括以士大夫日常生活为主要创作对象、频繁使用题序、增强词体内容的真实性与实用性、风格清新自然等方面。","keywords":"扩大实用功能 率先用题序 将日常生活引入词中 精工 承前启后","note":"张先的词作艺术成就并不是特别高，其对词体的开拓，主要集中于词的形式和功能上。不仅如此，张先还起着连接两代词人的承上启下的作用。相较于柳永、苏轼等关键词人，张先被单独考查的可能性较小，但在梳理词体整体发展脉络时这部分内容还是比较重要的，所以大家要有所了解。"},{"id":"239","stars":"★★★★","title":"柳永为宋词的变革做出了怎样的贡献","body":"作为第一位对未词进行全面革新的大词人，柳永对后来词人影响甚大。即使是苏轼、黄庭坚、秦观、周邦彦等著名词人，也无不受惠于柳永。北宋中后期，苏轼和周邦彦各开一派，而追根溯源，都是从柳词分化而出，犹如一水中分，分流并进。柳永对未词的开拓与变革，做出了以下贡献：\n\n一、大力创作慢词，创用词调，创制词体\n\n柳永大力创作慢词，从根本上改变了唐五代以来词坛上小令一统天下的格局，使慢词与小令两种体式平分秋色，齐头并进。柳永最长的慢词《戚氏》长212字。慢词篇幅体制的扩大，相应地扩充了词的内容涵量，也提高了词的表现能力。\n\n在两宋词坛上，柳永是创用词调最多的词人。他现存213首词，用了133种词调。而在宋代所用八百八十多个词调中，有一百多调是柳永首创或首次使用。词至柳永，体制始备。令、引、近、慢，单调、双调、三叠、四叠等长调短令，日益丰富。形式体制的完备，为宋词的发展和后继者在内容上的开拓提供了前提条件。\n\n二、从创作方向上改变了词的审美内涵和审美趣味，变“雅”为“俗”\n\n柳永不仅从音乐体制上改变和发展了词的声腔体式，而且从创作方向上改变了词的审美内涵和审美趣味，即变“雅”为“俗”，着意运用通俗化的语言表现世俗化的市民生活情调。\n\n（一）柳永一改文人词的创作路数，而迎合、满足市民大众的审美需求，用他们容易理解的语言、易于接受的表现方式，着力表现他们所熟悉的人物、所关注的情事。\n\n（1）表现了世俗女性大胆而泼辣的爱情意识。在其他文人的同类词作中，爱情缺失的深闺女性一般只是自怨自艾，逆来顺受，内心的愿望含而不露。而柳永词中的世俗女子，则是大胆而主动地追求爱情，无所顾忌地坦陈心中对平等自由的爱情的渴望。\n\n（2）表现了被遗弃的或失恋的平民女子的痛苦心声。在词史上，柳永也许是第一次将笔端伸向平民妇女的内心世界，为她们诉说心中的苦闷忧怨。\n\n（3）表现下层妓女的不幸和她们从良的愿望。柳永长期流连坊曲，与歌妓交往频繁。他虽然有时也不免狎戏玩弄歌妓，但更多的是以平等的身份和相知的态度对待她们，作为当时一个特殊社会群体的歌妓，与市民的生活内容消费方式密不可分，因而，柳永词真切地表现她们的命运，也非常贴近市民大众的日常生活和欣赏趣味。\n\n（4）柳永词还多方面展现了北宋繁华富裕的都市生活和丰富多彩的市井风情。柳永长期生活在都市里，对都市生活有着丰富的体验。他用彩笔-描绘过当时汴京、洛阳、益州、扬州、会稽、金陵、杭州等城市的繁荣景象和市民的游乐情景。这方面的代表作，首推《望海潮》。\n\n（二）柳永在词的语言表达方式上，也进行了大胆的革新。他充分运用现实生活中的日常口语和便语。诸如副词“恁”“怎”“争”等，代词“我”“你”“伊”“自家”“伊家”“阿谁”等，动词“看承”“都来”“抵死”“消得”等，柳永词都反复使用。用富有表现力的口语入词，不仅生动活泼，而且像是直接与人对话、诉说，使读者和听众既感到亲切有味，又易于理解接受。当时“凡有井水饮处，即能歌柳词”，与柳词语言的通俗化不无关系。\n\n三、创造性地运用了铺叙和白描的手法\n\n词的体式和内容的变化，要求表现方法也要作相应的变革。柳永为适应慢词长调体式的需要和市民大众欣赏趣味的需求，创造性地运用了铺叙和白描的手法。\n\n（一）慢词可以尽情地铺叙衍展，故柳永将“敷陈其事而直言之”的赋法移植于词，或直接层层刻画抒情主人公丰富复杂的内心世界，或铺陈描绘情事发生、发展的场面和过程，以展现不同时空场景中人物情感、心态的变化。\n\n（二）柳永善于巧妙利用时空的转换来叙事、布景、言情，而自创出独特的结构方式。词的一般结构方式，是由过去和现在或加上将来的二重或三重时空构成的单线结构；柳永则扩展为从现在回想过去而念及现在，又设想将来再回到现在，即体现为回环往复式的多重时间结构。在空间结构方式上，柳永也将一般的人我双方互写的双重结构，发展为从自我思念对方，又设想对方思念自我的多重空间结构。\n\n（三）与铺叙相配合，柳永还大量使用白描手法，写景状物，不用假借替代；言情叙事，不需烘托渲染，而直抒胸臆。如《忆帝京》不加任何藻饰，却生动地刻画出主人公曲折的心理过程。\n\n四、在题材取向上朝着自我化的方向拓展\n\n柳永去除了晚唐五代词中那种模式化的男情女爱与伤春悲秋，取而代之的是自我独特的人生体验和个人心态。他的词注意表现自我独特的人生体验和心态，《乐章集》中六十多首羁旅行役词，比较全面地展现出柳永一生中的追求、挫折、矛盾、苦闷、辛酸、失意等复杂心态。稍后的苏轼，即是沿着这种抒情自我化的方向而进一步开拓深化。","keywords":"创用词调 创制词体 改变审美内涵和审美趣味 变“雅”为“俗”铺叙和白描 题材取向上朝着自我化","note":"柳永为宋词革新做出的贡献，不像晏殊他们那样集中在一两个方面，而是从形式、审美内涵到题材、表现手法多方面多层次的。柳永之后的许多词人，都受益于他做出的革新，所以是宋词考查中的重点。对于这一部分内容，大家要注意重点掌握。"},{"id":"240","stars":"★★★★","title":"试分析柳永词作在内容上有何特点","body":"柳永词虽仍多舞筵歌席、倚红偎翠之作，但终有若干值得注意的新倾向。具体来说，表现在以下方面：\n\n一、描写享乐与风情传统题材时具有市民文艺色彩\n\n在描写享乐与风情传统题材时，柳永把以晏殊为代表的专写达官贵人的天地转向青楼市井，更具有市民文艺的色彩。在创作意识上，他并不隐瞒自己对物质享受和男女风情的追求；在描写女性时，虽仍多从直接感官上着笔，但赋予她们更多的现实感情和现实环境，这就和“花间”以来多描写理想中的女性有所不同。柳永首先是表现了世俗女性大胆而泼辣的爱情意识。其次是表现了被遗弃的或失恋的平民女子的痛苦心声。再次是表现下层妓女的不幸和她们从良的愿望。如《定风波》（自\n\n春来）写的就是一个现实的、非理性化的歌女。这种写法较之他人虽显得缺乏含蓄感、典雅感，以致遭到淫冶从俗的非议；但它的人情味和生活气息却更浓了，写出了一个有真情实感，活生生的女性。\n\n二、借助羁旅行役时的所见所感表现仕途不顺的痛苦\n\n柳永“尤工于羁旅行役”。入仕前，柳永曾怀着屡试不第的怨艾心情漫游过江南一带；入仕后，又怀着久困不迁的失意心情宦游过很多地方。可以说落魄与牢骚始终伴随着他的一生。他把这些本来多入于诗的言志抒情内容一并移入词中，并借助羁旅行役时的所见所感，特别是景物描写，将这些不幸与痛苦表现得淋漓尽致。由于“未名未禄”必须去“奔名竞利”，于是“游宦成羁旅”“谙尽宦游滋味”。而长期在外宦游，又“因此伤行役。思念多媚多娇，咫尺千山隔。都为深情密爱，不忍轻离拆”。但“利名牵役”，又不得不与佳人离别：“走舟车向此，人人奔名竞利。念荡子、终日驱驱，争觉乡关转迢递。”这种大容量的景物画面与内心独白相结合的作品是前人少有的。\n\n三、对繁华的都市风光的描写\n\n柳永的词作增加了对繁华的都市风光的描写。这既是北宋城市经济繁荣的直接产物，也是柳永对词内容上的开拓。北去的大型城市如汴京、洛阳、益州、扬州、金陵等绮靡的都市生活和多彩的市井风情，都可以在柳永的词作中找到精彩的描述。不用说和其他词人词作相比，就是和同期的诗文相比，这类作品也弥足珍贵，说明柳永对社会环境和经济发展有很敏锐的体验力。如其名作《望海潮》用波澜起伏的笔法，配以浓墨重彩的铺叙，写尽杭州的山水景致与城市富庶，可谓“承平气象，形容曲尽”，是一种饱含着主体生命、情感的形象表现。","keywords":"市民文艺色彩 借助羁旅行役表现仕途不顺的痛苦 繁华的都市风光","note":"从对词作内容拓展程度来看，柳永不及苏轼、辛弃疾等人，其词作内容相对还是较为狭窄。但相较于前人，柳永的词作已经增添了不少新的内容，无论是表现女性、情感与景物结合还是描写都市风光，在前人的词作中都是比较少见的。由此来看，柳永为词作表现内容的开拓也做出了贡献。"},{"id":"241","stars":"★★★★","title":"试分析柳永词作的艺术特征","body":"未词到了柳永手中才发生了重大变化，与之相对应的，柳永词作也取得了不俗的艺术成就。总体来看，柳永词的艺术特征，主要表现在以下方面：\n\n一、多用铺叙、白描手法\n\n柳永为适应慢词长调体式的需要和市民大众欣赏趣味的需求，创造性地运用了铺叙和白描的手法。柳永将“敷陈其事而直言之”的赋法移植于词，或直接层层刻画抒情主人公丰富复杂的内心世界；或铺陈描绘情事发生、发展的场面和过程，以展现不同时空场景中人物情感心态的变化。同时，他善于巧妙利用时空的转换来叙事、布景、言情，而自创出独特的结构方式。\n\n与铺叙相配合，柳永还大量使用白描手法，写景状物，不用假借替代；言情叙事，不需烘托渲染，而直抒胸臆。如《忆帝京》不加任何藻饰，却生动地刻画出主人公曲折的心理过程。\n\n二、将叙事、抒情、写景融合在一起\n\n柳永词善于将叙事、抒情、写景融合在一起，进行综合性的表达，这是柳永慢词善于铺叙的又一重要表现。其中尤善于借景抒情。不论是由景生情，还是化情为景，都能达到自然交融、无迹可求的妙境。在借景抒情时尤善于借秋天凄风苦雨之景来抒发自己失意幽怨之情，使外在画面与内在感情极为谐调。如《雨霖铃》《八声甘州》。\n\n三、善于作细节描写\n\n不管对景物、心理、动作，柳永都善于作具体细腻的描述。从空间上，他善于抓住某些具有典型性的场景来描写；从时间上，他善于抓住某些具有戏剧性的瞬间来发挥，因而他的词显得时空容量都很大，达到了铺叙的目的，增加了词的表现力。“执手相看泪眼”“针线闲拈伴伊坐”等皆是如此。又如《夜半乐》的“岸边两两三三，浣纱游女。避行客，含羞笑相语”之写人；《婆罗门令》的“霜天冷，风细细，触疏窗，闪闪灯摇曳”之写景；《忆帝京》的“展转数寒更，起了还重睡；毕竟不成眠，一夜长如岁”之写心情，都是非常成功的细节描写。\n\n四、讲究音调和格律\n\n慢词本来就音调悠扬，柳永又通过采纳市井新声、扩充小令、自度曲及改造旧曲等手段，一方面不断地“变旧声作新声”，一方面又“得音调之正”，极大地发展丰富了慢词的音乐美。即使在失去演唱方法后的今天，人们仍能从柳词中体会出他善于考辨四声并喜欢用双声叠韵、句中韵等音乐技巧。如“登孤垒荒凉，危亭旷望，静临烟渚”。","keywords":"铺叙、白描 叙事、抒情、写景融合 细节描写 音调和格律","note":"柳永对于词作艺术的发展，是其主要贡献所在，这具体表现在手法和格律等多个方面。这里我们要注意的是，柳永词的思想内容和艺术特征可能会放在一起进行考查，大家可以将这二者结合起来记忆。同时，在记忆柳永词的艺术特征时，也可以从柳永对宋词的开拓的相关内容出发，比较记忆。"},{"id":"242","stars":"★★★","title":"欧阳修诗文革新的主张是怎样的","body":"欧阳修倡导的诗文革新在本质上是针对五代文风和宋初西昆体的，可是欧阳修的文学理论和创作实践都与柳开以来的复古派文论家有很大的不同。总体来说，欧阳修的文学主张，主要有以下方面：\n\n一、文道并重\n\n欧阳修对文与道的关系有了全新的认识。首先，欧阳修认为儒家之道是与现实生活密切相关的；其次，欧阳修文道井重，他认为“道纯则充于中者实，中充实则发为文者辉光”。又认为“其言之所载者大且文，则其传也彰；言之所载者不文而又小，则其传也不彰”。此外，他还认为文具有独立的性质：“古人之学者非一家，其为道虽同，言语文章，未尝相似。”这种文道并重的思想有两重意义：一是把文学看得与道同样重要，二是把文学的艺术形式看得与思想内容同样重要，这无疑大大地提高了文学的地位。柳开等人以韩愈相号召，主要着眼于其道统，而欧阳修却重于继承韩愈的文学传统。\n\n二、不盲目崇古，不否定骈文\n\n欧阳修自幼喜爱韩文，后来写作古文也以韩、柳为学习典范，但他并不盲目崇古，他所取法的是韩文文从字顺的一面，对韩、柳古文已露端倪的奇险深奥倾向则弃而不取。他说：“孟、韩文虽高，不必似之也，取其自然耳。”同时，欧阳修对骈体文的艺术成就并不一概否定，对杨亿等人的“雄文博学，笔力有馀”也颇为赞赏。欧阳修早年为了应试，对骈俪之文下过很深的功夫，同时也认真研读韩文，为日后的古文写作打好了基础。\n\n三、注重文学的感情因素\n\n除对文道观加以发展外，欧阳修还特别注重文学的感情因素，强调“人情”的作用，在吸收司马迁“发愤”说、韩愈“不平则鸣”说的基础上提出了“穷而后工”说。他认为遭时之士往往以文章为末事，所以很难写出好文章，而失志之人，往往因满腔激情无处发泄，只好-寓之于文辞，故能写出好文章。\n\n四、提倡严肃的创作态度\n\n欧阳修的文章常推敲累日、修改数十遍方定稿，虽一二十字小柬亦必起草。他论文有“三多”即“多看、多做、多商量也”，又有“三上”，即谓平生文章多得于“马上、枕上、厕上也”。他作文总是精益求精，相传《醉翁亭记》开头“环滁皆山也”五字就是他多次修改后才定夺的。深厚的学养和辛勤的实践使他的散文创作取得了卓越的成就。\n\n这样，欧阳修在理论上既纠正了柳开、石介的偏颇，又矫正了韩、柳古文的某些缺点，从而为北宋的诗文革新建立了正确的指导思想，也为宋代古文的发展开辟了广阔的前景。\n\n【李凡关键词：文道并重 不盲目崇古 不否定骈文 感情因素 严肃的创作态度】","keywords":"","note":"欧阳修的诗文革新主张虽然是针对西昆体，但也对石介矫枉过正的行为做出了批评。而他既纠正了柳开、石介的偏颇，又矫正了韩、柳古文的某些缺点，从而为宋代古文发展开辟了前路。宋代的散文大家，如三苏、曾巩等都受到了欧阳修的影响，可以说，宋代散文之所以取得非常高的成就，欧阳修功不可没。"},{"id":"243","stars":"★★★★","title":"试述欧阳修的散文成就","body":"欧阳修散文创作的高度成就与其正确的古文理论相辅相成，从而开创了一代文风。欧阳修散文成就，主要表现在以下方面：\n\n一、内容充实，形式多样\n\n欧阳修的古文有论辩、记叙、序跋、书信、祭文、墓志等多种类型，包罗广泛，皆有名篇。无论是议论，还是叙事，都是有为而作，有感而发。\n\n欧阳修的议论文有些直接关系到当时的政治斗争，这一类文章具有积极的实质性内容，是古文的实际功用和艺术价值有机结合的典范。欧阳修另有一类议论文与现实政治并无直接关系，但表达了作者对历史、人生的深刻思考，如《五代史》中的一些序论，对五代的历史教训进行总结，并鲜明地表达了作者的褒贬，以及国家兴亡在于人事而非天命的历史观。\n\n欧阳修的记叙文也都言之有物，如《五代史记》一类历史散文自不必说，即使是亭台记、哀祭文、碑志文等作品，也都具有充实的内容，如《丰乐亭记》对滁州的历史故事、地理环境乃至风土人情都作了细致的描写。\n\n二、感情色彩强烈\n\n欧阳修的散文有很强的感情色彩，他的政论文慷慨陈词，感情激越；史论文则低回往复，感慨淋漓；其他散文更加注重抒情，哀乐由衷，情文并至。在欧阳修笔下，散文的实用性质和审美性质得到了充分的显示，散文的叙事、议论、抒情三种功能也得到了高度的有机融合。\n\n三、体裁多样，各得其宜\n\n欧阳修对散文文体的发展也作出了很大的贡献。他的作品体裁多样，各得其宜。除了古文之外，辞赋和四六也是他擅长的文体。\n\n首先，欧阳修对前代的骈赋、律赋进行了改造，去除了排偶、限韵的两重规定，改以单笔散体作赋，创造了文赋。欧阳修的成功尝试，对文赋形式的确立具有里程碑的意义。他的《秋声赋》从多方面来描绘秋夜的物态，以巧妙的比喻将秋声抒写出来，表现出高超的艺术水准。\n\n其次，欧阳修对四六体也进行了革新。欧阳修虽也遵守旧制，用四六体来写公牍文书，但他常参用散体单行之古文笔法，且少用故事成语，不求对偶工切，从而给这种骈四俪六的文体注入了新的活力。\n\n欧阳修的创作使散文的体裁更加丰富，功能更加完备。\n\n四、风格平易自然\n\n欧阳修散文的语言简洁流畅，文气纤徐委婉，创造了一种平易自然的新风格，在韩文的雄肆、柳文的峻切之外别开生面。例如《醉翁亭记》的开头一段，语言平易晓畅，晶莹秀润，既简洁凝练，又圆融轻快，毫无滞涩窘迫之感。深沉的感慨和精当的议论都出之以委婉含蓄的语气，娓娓而谈，纤徐有致。这种平易近人的文风显然更容易为读者所接受，所以具有广阔的发展前景，其后宋代散文的发展历程就证明了这一点。","keywords":"内容充实 形式多样 感情色彩强烈 体裁多样 各得其宜 风格平易自然","note":"欧阳修散文的成就，与他正确的文学理论是分不开的。正是在他的文学理论指导下，他的散文才取得了成功，所以他的散文也体现了他文学理论的内容。大家可以将这二者结合起来记忆。同时，这道题还可以用来回答“欧阳修为散文发展做出的贡献”，大家要注意灵活应对。"},{"id":"244","stars":"★★★","title":"试分析欧阳修诗歌的创作特征","body":"欧阳修诗歌的成就虽比不上散文，但与其友梅尧臣、苏舜钦一起，对廓清晚唐五代以至宋初西昆的不良诗风，奠定新的未诗风格起过决定性作用。欧阳修的诗歌创作，主要具备如下特征：\n\n一、题材丰富，现实性强\n\n欧诗涉及的社会范围、生活领域极为广泛，尤其注重反映人民生活、国家大事。这本是很多进步作家常见的主题，而欧诗特点在于常把表现民生疾苦与评论国事联系起来，具有政治家的深度，对王安石、苏轼有较深的影响。欧诗中有一些以社会现实为题材的作品，如《食糟民》揭露了种粮的农民只能以酒糟充饥的不合理现实，《边户》描写了宋辽边境地区人民的不幸遭遇。欧诗更重要的内容则是表现个人的生活经历或抒发个人的情怀，以及对历史题材的吟咏等。由于他的这类诗篇多含有很深的人生感慨，所以与西昆体的同类诗作有本质的区别。例如《戏答元珍》以荒远山城的凄凉春景衬托自己的落寞情怀，篇末故作宽解之言，委婉地倾吐了内心的感触，真切感人。\n\n二、以散文手法和议论入诗，议论与叙事、抒情融为一体\n\n欧诗受韩愈的影响较大，主要体现在散文手法和以议论入诗。然而欧诗并不对古人亦步亦趋，故仍然具有自家面目。欧诗中的议论往往能与叙事、抒情融为一体，所以得韩诗畅尽之致而避免了其枯燥艰涩之失。例如《再和明妃曲》中“虽能杀画工，于事竟何益”及“红颜胜人多薄命，莫怨春风当自嗟”，议论精警，又富有情韵。欧诗的散文手法主要不是体现在句法上，而是借鉴散文的叙事手段，如《书怀感事寄梅圣俞》叙述宴游经历，平直周详，深得古文之妙。\n\n三、流丽宛转的风格\n\n欧阳修的诗歌创作也学李白，主要得益于语言之清新流畅，这与欧诗特有的委婉平易的章法相结合，便形成了流丽宛转的风格，例如《春日西湖寄谢法曹歌》，写好友万里相思和少去老来的感慨，时空跨度很大，情绪亦跌宕起落，然而文气仍很宛转，娓娓如诉家常。欧阳修主要是从诗歌出人意表的议论和诗篇结构，以及感情抒发的方式上来向李白学习的。但是，与李白的古诗对比就会发现，李白诗中那种展现诗人狂放自信人格风采的气概，以及以大胆的夸张和巧妙的比喻来突出内心感受的诗歌风格，被欧诗较为客观冷静的叙事与透辟议论所代替。欧阳修诗歌的成就不如欧阳修的散文，但两者的风格倾向是一致的，这种诗风显然是对西昆体诗风的矫正。\n\n【李凡关键词：题材丰富 现实性强 散文、议论入诗 议论、叙事、抒情融合 流丽宛转】","keywords":"","note":"欧阳修的诗风与他的文风倾向一致，是对西昆体诗风的矫正。而欧阳修对诗歌进行了革新，反映了矫正五代诗风的最初自觉。和他的散文一样，欧阳修作诗师法前人如韩愈、李白，但又不亦步亦趋，最终形成了自己个人独特的诗风，推动了宋代诗歌的发展。"},{"id":"245","stars":"★★","title":"试分析梅尧臣诗歌的创作特征","body":"梅诗的题材走向和风格倾向都具有得宋诗风气之先的意义，正是着眼于此，从欧阳修到王安石、苏轼都对梅诗赞叹不已。梅尧臣的诗歌创作，主要具备如下特征：\n\n一、关注世事人生，反映民生疾苦\n\n梅尧臣虽然沉沦下僚，却非常关心时政。梅尧臣诗歌题材关注世事人生，对同时期的政治、军事、经济重大事项，以及建设符合时代需求的士节士气等问题，都有所反映。朝中有重大的政治事件发生，他也总爱在诗中予以反映。这些诗或以寓言的形式来抨击邪恶势力，如《彼鴷吟》《猛虎行》讥刺吕夷简；或干脆直书其事，如《书窜》为弹劾大臣而身遭贬窜的唐介鸣不平。\n\n梅尧臣也积极地用诗歌反映民生疾苦，对他担任地方官时目睹的贫民惨状作了尖锐的揭露，如《汝坟贫女》《田家语》等，秉笔直书，感情愤激，继承了杜甫、白居易的传统。\n\n二、题材内容平凡化\n\n梅尧臣强调“以故为新，以俗为雅”。他的诗歌善于捕捉生活中细小、琐碎甚至丑陋的事物。这就拓展了诗歌表现的对象，表现出浓郁的生活气息，给当时的诗坛带入了一种陌生之美。从六朝到盛唐，诗人们对生活中凡俗的内容不屑一顾。从中晚唐开始，虽然诗歌不再回避平凡、琐屑的生活细节，但尚未形成风气。梅尧臣的创作表明此类题材是初次进入诗歌的殿堂。梅尧臣的尝试有时不很成功，更多的作品则成功地实现了题材的开拓，把日常生活中的琐屑小事写得饶有兴味，如《七月十六日赴庾直有怀》写值夜时想念妻儿，《范饶州坐中客语食河豚鱼》描写味美而有毒的河豚等，为宋诗开辟了更加贴近日常生活的题材走向。\n\n三、艺术上以“平淡”为终极目标\n\n与题材内容趋于平凡化相应的是，梅诗在艺术风格上以追求“平淡”为终极目标。他说：“作诗无古今，唯造平淡难。”他说的“平淡”不是指陶渊明、韦应物的诗风，而是指一种炉火纯青的艺术境界，一种超越了雕润绮丽的老成风格。\n\n“平淡美”统帅梅诗其他诗学旨趣和艺术表现手段。梅尧臣为了实现其“平淡”诗学，在诗歌造意、用语、命题等方面表现出与他人迥异的诗歌特征。例如他的《鲁山山行》和《东溪》这两首名作，两首诗以偏离唐诗丰神情韵的风格为方向的。虽说这种尝试有时给梅诗带来了词句枯涩、缺乏韵味的缺点，但它最终导致了新诗风的形成。","keywords":"关注世事人生 反映民生疾苦 题材内容平凡化 以“平淡”为终极目标","note":"梅尧臣关心时政，他在诗歌上做出的最重要的贡献便是开宋诗风气之先，虽然从整体来看，梅尧臣对于诗歌内容和艺术的开拓并不是十分成功，但对于新诗风的形成有重要的影响。也正因此，他的开拓精神，受到了后人的推崇。"},{"id":"246","stars":"★★","title":"试分析苏舜钦诗歌的艺术特征","body":"苏舜钦诗歌在宋代诗歌史上首开风气，具有重要的诗歌史意义。他的诗歌创作，主要具备如下特征：\n\n一、诗歌创作关注现实\n\n苏舜钦的诗歌较好地实现了他的文学主张。他的诗歌创作关注现实。诗作主题或针砭弊政，或陈述政见，或高歌理想，或同情人民苦难，其宗旨都可以归结到“重道”上来。\n\n苏舜钦早年慷慨有大志，喜以诗歌痛快淋漓地反映时政，抒发强烈的政治感慨，例如《庆州败》对北宋与西夏的战争中宋军将昧士怯终致丧师辱国的丑闻的抨击，《城南感怀呈永叔》对达官贵人坐视民瘼空发高论的行径的揭露，都是直言痛斥，毫无顾忌。\n\n他被逐后的诗多抒写心中的愤懑之情，例如《维舟野步呈子履》《天平山》，虽牢骚满纸，却仍然表达了对黑暗势力的蔑视，同样具有批判现实的意义。\n\n二、雄豪奔放的诗歌风格\n\n苏舜钦诗直率自然，意境开阔，以雄豪奔放的风格见长。苏舜钦的诗歌，多以超逸豪迈的审美旨趣为统摄，突出创作主体的崇高伟岸人格和气吞宇宙的阔大胸怀，彰显创作主体的真性情。从诗歌意境上看他的诗，写月色则长空无瑕，江平万顷；登楼则四望，但见秋色人林，日光穿竹，视野辽阔，不对具体之境、局限之景精细描绘。即使诗题专写一小景小事，则一定要小中有大，在写小景的同时必定连带阔大的景象。\n\n这种风格主要体现于他的长篇古诗，例如《中秋夜吴江亭上对月怀前宰张子野及寄君谟蔡大》，想象奇特，笔力酣畅，本是宁静柔和的月夜也被赋予开阔的意境，风格奔放。苏舜钦的短诗也有相似的风格倾向，但是语言更为凝练。\n\n三、具有崇高之美\n\n苏舜钦的诗歌，多以“造境”为手段，以彰显作者的超逸豪迈情怀为构建意境、剪裁物象的主要标准。这种诗歌意境的构造方式，又与其关注现实寄托抱负的诗篇内容相一致，造就了苏诗的崇高之美。如其《舟行有感》第二联写景，天色阴霾，鸟儿孤独自语河水寂然退落，河岸露出青苔痕迹。春天正是万物并茂的季节，苏舜钦因为被政敌陷害，不得不离开京都南游以避祸，远大抱负无从实现，孤独、寂寞与伤感无时无刻不在啮噬着失意的诗人。诗篇调子低沉，但作者取泛指的景物而不坐实，显然，诗中景物构成的意境是为凸显作者的情感服务的。\n\n四、不够含蓄、不够精炼\n\n苏舜钦诗歌在意境的构造技巧上虽然较多使用“造境”艺术，但在感情表达方式上，却主要使用议论而很少依靠意境。这种方式使用过度，就容易造成作品的直白、直率、不够含蓄、不够精炼的缺点。在苏舜钦诗歌中，有些诗就出现了这种弊病。如《过濠梁别王原叔》纯以议论抒发被削职为民、抱负无从施展的愤懑，《送子履》因送而发议论，叹息人生多难，勉励子履报答君王之恩。宋诗畅尽而伤直露的特点，在苏舜钦诗中已见端倪。","keywords":"关注现实 雄豪奔放 崇高之美 不够含蓄 不够精炼","note":"苏舜钦的诗歌风格和他本人的性格有很大的关系，由于个人性格豪迈，所以诗风也豪迈雄壮，显示出了与同时期的梅尧臣迥然不同的风貌。但也正因此，造成了他的诗歌不够含蓄的特点，体现了诗风开拓变革时期的特色。"},{"id":"247","stars":"★★","title":"王安石的散文风格是怎样的","body":"王安石散文最突出的特色是文如其人，处处显示出不惑于众人的大政治家超凡脱俗的胸襟气度和真知卓见。这主要表现在以下方面：\n\n一、见地深刻，立论警绝\n\n王安石能见人所不能见，道人所不敢道，有高度有深度，绝不作人云亦云语，因而往往比别人更能切中时弊，抓住关键。如《乞制置三司条例》对宋代的社会问题可谓探骊取珠，以法家的观点直言不讳地言财言术，且能组成自己严密的体系，实为当时的文人，不管是像欧阳修、苏轼那样的大作家，司马光那样的政治家，还是周、程那样的理学家，这都是他们所不肯道、不敢道、也不能道者。\n\n二、布局谨严，思路犀利，逻辑性强\n\n王安石善于以深刻而清晰的思维高屋建瓴、条分缕析地统率材料，“以一线贯千条”“议论愈多，头绪愈整”。如在《上仁宗皇帝言事书》中，他提出了“方今之急，在于人才而已”这一观点，并指出今日之所以会出现人才不足的问题，是因为“陶冶而成之者非其道故也”。然后总提一笔“所谓陶冶而成之者，何也？亦教之、养之、取之、任之有其道而已”。然后分四层详细论述“教之”“养之”“取之”“任之”的具体内容，在每一层中又分出若干小层次，各求阐述深透。因此全文虽洋洋万言，但“行文部勒有方，如大将将数十万兵而不乱”。\n\n三、口吻坚定，语气斩绝，文势充沛\n\n王安石散文明显地带有其傲岸崛强、睥睨凡众的个性。这是他超人哲学在文学中的必然流露，因而尤善于驳论，因为在他看来，很多议论之所以错，就是因为论者脱不开常人之见。如《答司马谏议书》就是一篇典型的由兀傲之性陶铸而成的“理足气盛，劲悍廉厉”的文章。与司马光给王安石的原书相比，两人文风的不同昭然若揭。司马光对侵官、生事、征利、拒谏的表现-详加剖析，而王安石却仅各用一句便将对这四件事的指贵带过，而且语气极为坚定；然后转向揭示之所以有此四说的认识根源，即“当一切不事事”的保守世界观作祟。显然王文的重点不在于表面性的“其然”，而在于背后的“其所以然”，立论更深一层，语气也就显得更斩绝有力，无容辩驳。\n\n四、见解独到，境界非凡\n\n王安石善于在短制中发惊人之论、出翻案之语、成一家之理，从而掀起大波澜，取得咫尺千里的艺术效果；或善于从一般现象中领悟出非一般的境界，生发出令人深省的议论，表现出超凡的思想。前者如《读孟尝君传》，全文共四大句只九十\n\n字，然而笔势峭拔，辞气横厉，文短气长，句句转折，可称得上是短篇之极则；后者如《游褒禅山记》，在记叙游玩经过之后，笔锋突然一转曰：“于是予有叹焉。......”而其所叹者既是论游，更是论学、论人生、论事业，包含着深邃的哲理性。","keywords":"见地深刻 立论警绝 布局谨严 思路犀利 逻辑性强 口吻坚定 语气斩绝 文势充沛 见解独到 境界非凡","note":""},{"id":"248","stars":"★★★","title":"王安石诗歌的创作特征是怎样的","body":"王安石写诗与作文一样，也有重视实际功用的倾向。但是他也把诗歌看作是抒情述志的工具，偏重于抒写个人的情怀，反映的生活内容也更为丰富，所以其诗歌的艺术成就超过了他的散文。王安石诗歌的创作特征，主要表现在以下方面：\n\n一、诗歌风格分为前后两期，前期直露峭刻，后期含蓄深沉\n\n王安石的诗风在56岁退居江宁以后发生了较大的变化，他的创作历程可以此为界分成前后两期。\n\n王安石早年的诗歌，多追求直露峭刻之风，主要依靠说理来发表对时局政事的看法，表达革弊图新的政治主张。连带而及，凡是需要表达观点和感受的地方他多以议论精辟来出奇制胜，往往是精细的刻画、精当的议论而以散文的笔法表现出来，故其诗风显得开阖跌宕、意气纵横，于峭拔中见警奇，如“人怜直节生来瘦，自许高才老更刚”等。\n\n王安石退出政治舞台以后，心情渐趋平淡，诗风也随之趋于含蓄深沉。虽然后期王诗中仍有寓悲壮于闲淡之中的情形，但诗风显然已从直截刻露变为深婉不迫了。\n\n二、现实性、社会性强烈\n\n王诗内容上的共同点是，绝大部分代表作都深深地打上了政治生涯的烙印，现实性、社会性特别强。\n\n（一）王安石的咏政诗体现了一个大政治家的思想。他不是仅以一个富有责任感和同情心的诗人身份写现实问题和民生疾苦，而是以一个大政治家的眼光探索其社会根源，寻求其政治出路。有些诗索性直接宣传、歌颂变法。如《兼井》《收盐》《省兵》《发廪》《后元丰行》《歌元丰五首》等。\n\n（二）王安石的咏古诗往往借思古之幽情，表现自己卓然特立的胸襟及超人意识和疑古精神，有些诗还利用借古喻今的手法直接服务于变法。因此这些诗常在古人未到处立论，或尽翻古人意，别出手眼地另立新论。\n\n（三）王安石的咏怀诗大多写其胸襟抱负及出处进退之间的矛盾心态，感情深挚，格韵高远，既有政治家的风度，又有诗人的气质。如《示长安君》《思王逢原三首》等，均是此类名作。\n\n三、以工取胜\n\n王安石造语用字，间不容发，言随意遣，浑然天成，不见有牵率处。这一特点在晚年尤为明显。这既与唐诗不同，又与欧阳修以平易、苏轼以情韵、黄庭坚以新奇取胜者不同。如《泊船瓜洲》最精彩的“绿”字是经过“到”“过”“入”“满”等十几次改动，才最后确定的。虽然“绿”字用法在唐人已有之，但用得如此灵活、生动，此诗实为仅见。\n\n四、以才学取胜\n\n宋人喜以才学为诗，大约始自王安石这一代。王安石读书多，知识渊博、精通经史小学，因而作起诗来往往“经对经，史对史，释氏事对释氏事，道家事对道家事”。如对于《书湖阴先生壁》，王安石曾自负道：“用汉人语止可以汉人语对，若参以异代语，便不相类。如‘水’云云，皆汉人语也。”这是因为“护田”一词出自《汉书·西域传》，“排闼”一词出自《汉书·樊哙传》。\n\n五、进一步将议论入诗发展到绝句等短制之中\n\n王安石进一步将议论入诗发展到绝句等短制之中，使见解警策形象生动的议论诗、哲理诗得到进一步的定型和发展，如《贾生》不借助任何形象，只靠议论的警绝出奇致胜；《登飞来峰》借助生动的形象，使哲理显得更耐人寻味。","keywords":"前后两期 直露峭刻 含蓄深沉 现实性 社会性 以工取胜 以才学取胜 将议论入诗发展到短制之中","note":"①王安石的诗风以56岁隐居为界分为前后两个时期，前期诗歌长于议论，体现出了宋诗的求新求变；后期诗歌含蓄深沉，体现了向唐诗的复归。从文学成就上来说，王安石后期诗歌远胜于前期诗歌，而其后期诗歌成就也是王安石在诗坛上享有盛誉的原因。②“王荆公体”常考名词解释，注意积累。"},{"id":"249","stars":"★★★","title":"试分析苏轼的文学创作主张","body":"苏轼的文学艺术观及美学思想极其丰富、深刻、自觉，他的有关理论既是创作实践的总结，又是创作实践的指导。苏轼的文学创作主张，主要有以下方面：\n\n一、求新求变\n\n苏轼论文艺最具进取性的见解在于求新求变。他认为只有“一变古法”，“出新意于法度之中，寄妙理于豪放之外”，才能成为艺术家。他也要求自己能在文学艺术中“自是一家”，“自出新意，不践古人”。但他又反对一味以标新立异为能事。他认为唐代的古文运动即失败于此，并对宋代诗文革新运动中“好奇务新”的“新弊”不断提出批评和警告。\n\n他的这种和谐观在创作中得到了充分的实践，其文既发展了韩、欧等人之长，又避免了他们的某些不足，正处在他反对的五代以来“浮巧轻媚”和宋初某些人“求深务奇”之间。他的诗既有唐诗的格韵情致，又增加了宋诗的理趣气骨；他的词既打破了婉约的一统天下，但又决不一味故作豪放或旷达。\n\n二、求真求理\n\n苏轼对文艺最完备、最丰富的见解在于求真、求理，他所说的“真”与人们常说的“神似”相近，他认为在形似的基础上求神似才是最高的境界。他所说的“理”，或曰“常理”，近似今人所说的艺术规律。苏轼认为符合艺术规律，乃是艺术创作的最高原则。为了追求这一境界，苏轼又提出了一系列艺术方法，体现了他和谐的美学原则。\n\n首先，苏轼非常重“意思”，即事物的本质特征及细节特征，类似现在所说的“典型”与“细节描写”。他曾以绘画举例说，在人物的“颊上加三毛”或“眉后加三纹”，就很可能使人在精神气质上“大似”。其次，苏轼非常重灵感，但同时又强调“经营”，即艰苦的艺术构思。他认为只有通过苦心经营，才能厚积薄发，在须奥间窥见艺术的真实，勃发出滔滔汨汨的创作激情和灵感。苏轼还特别强调“得之象外”“咀嚼有味”的含蓄之美。但他又认为要达到这样的境界不能靠朦胧与晦涩，而要靠“词达”。苏轼还特别强调艺术应表达艺术家的主观情趣，应多著艺术家的自我感情，亦即应表现“有我之境”的个性。\n\n三 求空求静\n\n苏轼对文艺最深刻、最富有哲学意味的见解，在于求空、求静。苏轼论艺术风格最推崇平淡自然，天成神妙。但他也不排斥“端庄杂流丽，刚健含婀娜”的其他风格。\n\n苏轼认为只要将佛法的“空静”观改造成观照世界的方法论和认识论，以便艺术家在静中观照万物之动，从空中摄取万境之象，将万物从纷纷杂杂、变化无常的偶然性中抽离、净化出来，以一含万，以静观动，就能使二者统一起来，达到“发纤秾于简古，寄至味于淡泊”“渐老渐熟，乃造平淡，其实不是平淡，乃绚烂之至也”的境界。\n\n可见，苏轼所说的平淡自然绝非像北宋初期古文家那样，仅指具有实用价值的“易道易晓”，文从字顺；而是上升到具有美学意义的更高层次。而他所说的雄放、绮腴、纤秾、绚烂，又是以这种平淡自然风格为基础的。他发挥了禅宗的美学思想，并以其空静观为出发点，将这些不同的美学风格融为一体。\n\n【李凡关键词：求新求变 求真求理 求空求静】","keywords":"","note":"苏轼的创作主张内容十分庞杂，但总体来看，主要有求新求变、求真求理、求空求静这三个方面。这是在这些创.作主张的指导下，苏轼完成了对诗、词和散文的革新，在这三个方面都取得了极高的成就，成为有宋一代首屈一指的大家。理解这三个方面的创作主张，有助于我们更好地去理解苏轼的创作特征。"},{"id":"250","stars":"★★★★","title":"试分析苏轼散文的艺术成就","body":"苏轼散文的总成就，在于能集前人之大成并加以发展，特别是能集韩愈、欧阳修之大成而又有独特的发展：既保有欧阳修的纡余委备，又增加了变化流转；既继承韩愈的气盛言宜，又避免了其深奥艰险，文风正在他反对的“浮巧轻媚”与“求深务奇”之间。具体而论，以下列表现最为突出。\n\n一、超凡入化的情韵和真率深挚的感情\n\n苏轼能于平淡自然的通达和雄深磅礴的气势中带有一种超凡入化的情韵和真率深挚的感情。苏轼能将平淡自然又实用的价值上升到美学的价值；能将雄深磅礴中的险怪部分化为通脱畅达，所以一旦将这二者结合起来驭之以情，自然就会带有浓厚的韵味和深挚的情意。\n\n也正因此，苏轼文章往往渗透着创作主体的情感旨趣，嬉笑怒骂往往形诸纸上，作品主题往往就是作者的情感表达。这一特征不仅表现在苏轼的叙事抒情文、序跋等文章里，也表现在其论道文、史评文中，如八十五字的短文《记承天寺夜游》，韵流字间，神余篇外，深得禅悦。\n\n二、创新出奇的锐气和错综变化的美感\n\n苏轼能于纡余委备、圆活流转之中，带有一种创新出奇的锐气和错综变化的美感。\n\n纡余委备是欧文的特色，但为了避免由此而导致的平缓，苏轼在这一基础上有意吸取了《庄子》《战国策》以至禅宗的手法，这样就使文章增加了有无相生，奇正互倚，显隐交呈，虚实代替，疾徐错行，若无意而意合，若无法而法随的各种变化，从而获得更大的表现自由，真正实践了他“淡而实美，质而实绮，癯而实腴”的美学理想。而苏轼的天才又使这些变化常如神工鬼斧，天外飞来，既富于卓识哲理，又富于才情趣味。\n\n这种富于新奇变化与天才想象的特征，又是苏轼的独诣。如《留侯论》，全篇将无作有，专在“忍”字上立论，借助这一“忍”字，将张良博浪沙击秦与圯桥进履两件绝不相干之事连在一起，使全文若断若续，变幻不测，曲尽文章操纵之妙。\n\n三、对多种散文文体进行发展，叙事、议论、抒情结合得更为紧密\n\n苏轼文章具有“破体”特点，亦即使用多种文体的表现手法来抒情表志。因其富于变化，所以很多文体在苏轼的笔下都有所发展，叙事、议论、抒情结合得更为紧密，如记中多带议论，这也正是宋文普遍的变异现象。他的《石钟山记》在记游之后引出一段绝大的、远远高出于记游本身的议论。又如使赋进一步散体化，如前后《赤壁赋》，以文为赋，骈散结合，叶韵藏于不觉之中，既有传统赋的铺排格套，又有散文的灵活自然，更有诗的情韵意境，登上了散文诗的高峰。\n\n四、气势雄深和善于雅谑\n\n苏轼的散文还具有气势雄深和善于雅谑的特点。这既继承了韩愈的风格，又不失苏轼的本色。前人评苏文，多喜用长江大河一泻千里作比，形容其文排宕宏伟，格高力雄。如《潮州韩文公庙碑》，不独在内容上歌颂韩愈，而且在笔法上也力学韩愈。而苏文的谐谑多见于笔记杂文一类的小品之中。","keywords":"超凡入化的情韵 真率深挚的感情 创新出奇的锐气 错综变化的美感 叙事、议论、抒情结合 气势雄深 善于雅谑","note":"在散文上，苏轼是宋代成就最高的一位文人，代表着宋代散文的最高成就。他的散文，无论是论说文、还是叙事游记等都取得了很高的成就，整体呈现出多姿多彩的风貌，兼得韩愈与欧阳修之所长，总体流露出圆活流转之美、错综变化之美和自然真率之美。"},{"id":"251","stars":"★★★★","title":"试分析苏轼诗歌的主要内容","body":"苏诗在思想内容方面继承了唐宋两代的优良传统，内容博大，言之有物，达到了“天地万物，嬉笑怒骂，无不鼓舞于笔端，而适如其意之所出”和“情与事无不可尽者”的地步。具体而言，以下几方面最为集中。\n\n一、表现自我\n\n描写个人遭遇，抒发个人情怀，塑造自我形象，这虽是传统题材，但苏轼仍有所创新。他在诗中突出塑造了自己超脱、旷达的“坡仙”性格，个性极为鲜明，让人一读便知此诗必为苏子所作，这样突出的主人公形象在前人，特别是在宋初诗人的笔下是少有的，如《初到黄州》《六月二十日夜渡海》《纵笔》等皆为这类诗的名作，尤其是《纵笔》以似玩世的放达态度对待正在执政的政敌的迫害，难怪要再贬海南了。\n\n二、反映现实\n\n苏轼重视文学的社会功用，强调“有为而作”“言必中当世之过”“凿凿乎如五谷必可以疗饥，断断乎如药石必可以伐病”，主张“缘诗人之义，托事以讽，庶几有补于国”。苏轼在许多州郡做过地方官，了解民情，常把耳闻目见的民间疾苦写进诗中。更可贵的是，苏轼对社会的批判并未局限于新政，也未局限于眼前，他对封建社会中由来已久的弊政、陋习进行抨击，体现出更深沉的批判意识，如《和子由闻子瞻将如终南太平宫溪堂读书》《荔支叹》等。\n\n三、歌咏自然\n\n苏轼对这类作品的发展，主要表现在：一是数量多，如仅在通判杭州时就有《游金山寺》《六月二十七日望湖楼醉书五绝》《望海楼晚景五绝》《饮湖上初晴后雨二首》《有美堂暴雨》等一系列名作；二是风格多样，既有细腻之作，也有豪放之作，既有流走之笔，也有刻意之篇；三是多“有我之境”，使景物描写注入丰富的诗人主人公感情。诗人的美学修养极高，故而诗人笔下的自然美也就显得更有个性，更为雅致。\n\n四、品评艺术\n\n苏轼是个全才的艺术家和艺术评论家，他经常以诗论艺，包括论诗、论画、论书法、论音乐等。以诗论艺术自杜甫始，经欧阳修等人努力又有了进一步发展。苏轼的这类作品不管从数量上还是质量上都远远超出了前人，达到了中国古典诗歌中同类作品的最高水平，如《送参寥师》《书鄢陵王主簿所画折枝二首》《王维吴道子画》等皆是。\n\n五、描写民风民俗\n\n描写民风民俗是宋诗内容上的一大发展。梅尧臣、欧阳修等人为此奠定了坚实基础，苏轼在他们的基础上又加以拓展，视角更为扩大，笔触更为敏感，节候物态、世俗众生、风土人情，无不入诗。如描写过年风俗的《馈岁》《别岁》《守岁》，描写经济生活的《无锡道中赋水车》《秧马歌》《石炭》，描写医术的《赠眼医王彦若》等。","keywords":"表现自我 反映现实 歌咏自然 品评艺术 描写民风民俗","note":"在苏轼的诗歌中，无论是唐代已有的内容，如表现自我、歌咏自然，还是宋代新出现的内容，如描写民风民俗，都可以看到，所以才说苏轼继承了唐宋两代的优良传统。总体来看，苏轼的诗歌将诗歌表现题材进一步做出了开拓，对诗歌发展起到了重要的影响。"},{"id":"252","stars":"★★★★★","title":"苏轼的诗具有怎样的艺术特征","body":"苏轼以杰出的诗文创作成为这一时期的标志性人物，其贡献是多方面的。就诗歌而言，他开拓了诗歌的表现领域，丰富了诗歌的表现手法和艺术技巧，拓深了诗歌的审美意蕴和审美类型。苏轼的诗歌创作，具有如下艺术特征：\n\n一、“求物之妙”的艺术追求\n\n苏轼诗歌往往能够抓住独特之处刻画事物的属性和本质。他的《新城道中》诗运用拟人手法，赋无情之物以有情，将自然景物刻画得生动可爱。\n\n“求物之妙”往往典型地表现于苏轼的咏物诗和风景诗之中。苏轼精通画理，所以在许多写景诗中追求“诗中有画”的效果，强调诗篇要抓住事物的“理”，凸显其本质、规律及其蕴含的意义，如《寓居定惠院之东杂花满山有海棠一株土人不知贵也》。\n\n“求物之妙”也表现为苏轼善于描写瞬息万变的景物以展现变化的过程，这表现出苏轼诗歌的重要风格之一：诗篇写景、叙事富有动感美，如《望湖楼醉书》在动静对比、颜色变换之中，生动地表现了夏日西湖暴雨的景象，充满画面感，令人有身临其境的感觉。\n\n二、“清雄”总体风格\n\n就像其文论一样，苏轼对诗歌风格也主张兼收并蓄。他曾模仿过陶渊明、李白、杜甫、韩愈、孟郊乃至同时诗友黄庭坚的诗风，无不惟妙惟肖。苏轼在创作中十分注意使阳刚之美与阴柔之美互相渗透，互相调节。毫无疑问，苏诗的主导风格是雄放，有些作品甚至有粗豪而缺少馀蕴的缺点。然而苏诗中许多佳作已经做到了刚柔相济，从而呈现出“清雄”的风格。如《游金山寺》描写细致，层次分明，但又笔势骞腾，兴象超妙。惆怅的心情与潇洒的风度融于一体，且流露出豪迈之气，典型地体现出苏诗的风格特征。\n\n三、具有“理趣”\n\n苏诗的“理趣”，也是其比较显著的诗歌风格。苏轼一生宦海浮沉，奔走四方，生活阅历极为丰富。他善于从人生遭遇中总结经验，也善于从客观事物中见出规律。在他眼中，极平常的生活内容和自然景物都蕴含着深刻的道理。\n\n在这些诗中，自然现象已上升为哲理，人生的感受也已转化为理性的反思。尤为难能可贵的是，诗中的哲理是通过生动、鲜明的艺术意象自然而然地表达出来，而不是经过逻辑推导或议论分析所得。这样的诗歌既优美动人，又饶有趣味，是名副其实的理趣诗，如其《题西林壁》从对现象的观感入手，以象入理，以理验境。\n\n四、讲究才学\n\n苏轼诗的艺术成就是多方面的，集中代表了“宋调”的特点，讲究才学。才学包括才气和学问两方面，苏诗兼而有之，而前者表现更突出。\n\n苏轼的才气，首先表现在生动活泼、丰富出奇的想象上，他总要通过这种手段扩展诗境，将平凡的题目升华出新意。其次表现在细致的观察力与细腻的表现力上，如《汲江煎茶》。许多看似平淡的题材，一经他探微发幽就变得情趣盎然，深曲倍至。再次表现在构思布局的波澜起伏、变化开合上。苏诗绝少“以题还题”地直说、正说、浅说，而是曲一层、侧一层、深一层说，造成结构上的曲折跌宕，如《荔支叹》。\n\n苏诗在讲究才气的同时，也讲究学问，善于使事用典。苏轼不但才高八斗，而且学富五车，上至经传子史、历代诗赋，下至小说杂记、佛经道书，莫不毕究，也莫不毕用，且用法灵活多变。虽有时过于逞才斗胜，驰骋辩博，但大多显而易读，切当妥贴。\n\n五、讲究议论\n\n以议论为诗非自苏轼始，但苏轼在继承前人，特别是韩愈、欧阳修、梅尧臣、苏舜钦等人的基础上，更喜议论，更善议论，却是事实。其表现主要在以下几方面：\n\n首先，在议论时亦体现出讲究才情的特点，因而绝少笨拙地空发议论。其次，议论本身也新奇警策，深刻精彩，富有启发性，充分显示了作者思辨的敏锐，识见的卓越，并创造了一批“哲理诗”，如《题西林壁》《琴诗》。\n\n六、善于雅谑\n\n有意识地提倡这种风格始自欧阳修，而较多地体现此种风格则始自苏轼。苏轼常在诗中以游戏语写庄重事，通过谐谑调侃，将自己内含痛苦外作放达的心情发挥得淋漓尽致。如《戏子由》，不仅用典巧妙，而且对新法以及新法实行以来自己所遭的不幸充满了讥讽与怨艾，写得诙诡有奇趣，为他人笔墨所难道及。\n\n七、善于修辞，尤善于比喻\n\n苏轼学富才高，修辞技巧更趋精美。他能灵活自然地运用各种修辞手法。苏轼可以把夸张与对偶巧妙地结合在一起，使人难以觉察。苏诗的比喻，不但妥帖生动，形象新奇，而且形式多样：有倒喻、博喻；有一句数喻的短喻，也有数句一喻的长喻；还有由一个比喻生出另一个比喻的“曲喻”，以及将两个或两个以上的比喻复合在一起，生出一个新含义的复喻。如用奇喻、长喻相结合，在律诗中形容人生短暂渺小为：“人生到处知何似，应似飞鸿踏雪泥。泥上偶然留指爪，鸿飞那复计东西。”","keywords":"“求物之妙”“清雄”“理趣”讲究才学 讲究议论 善于雅谑 善于修辞 善于比喻","note":"苏轼的诗，就风格个性上，或许不如王安石等人突出，但从创作成就上，无疑是北宋诗坛魁首。无论是从诗歌内容、题材驾驭，还是诗歌艺术手法、整体风格上，苏轼都做到了几乎完美。这部分内容在考查中出现的频率相对较高，大家要认真准备。"},{"id":"253","stars":"★★★★★","title":"试分析苏轼“以文为诗”表现在哪些方面","body":"“以文为诗”既是古代文人诗体格创变的标志，又使唐宋两代诗史在体格意义上贯通整合为一体。“以文为诗”有两种含义，狭义上是指用散文的章法写诗，广义上用散文的内容写诗。苏轼是“以文为诗”之集大成者，他“以文为诗”，一方面是对唐人的继承，一方面又是有着由量及质的飞跃。赵翼《瓯北诗话》：“以文为诗，自昌黎始；至东坡益大放厥词，别开生面，成一代之大观。”\n\n苏轼“以文为诗”，主要表现在以下方面：\n\n一、对诗歌语言领域的扩大\n\n苏轼主要是从字法、句法、章法等方面对诗歌的艺术形式给予了进一步的改造，以使诗歌更接近社会生活的原形，更具有“自然艺术”的性质，把诗歌语言扩展到前所未有的领域。他把在散文中能够使用的虚词，尽可能地在诗歌创作中使用。另外，散文的章法和叙述方式也在诗歌创作中肆无忌惮地运用。前者如“伸眉一笑岂易得，神之报汝亦已丰”，后者如“君不见昔时李生好客手自煎”。苏轼的“以文为诗”还有不可忽视的一点就是大量运用行业语、方言、俗语，这也是他所谓的“以俗为雅”的论点之一。\n\n二、对诗歌题材的拓展\n\n苏轼“以文为诗”，扩大了诗歌题材，并将日常事物加以诗化、雅化、美化，既是对宋诗题材的进一步丰富，又是对“宋调”诗性特征的加强。“空”“静”的哲学思想，形成了苏轼独特的“诗眼”，使他能够把不为人所注意的题材纳入诗歌，并加以裁剪提炼。苏轼认为，物类是平等的，没有大小之分。如果诗人能够“游于物之外”，以一种泛功利的态度观赏当下的每一个事物，一切事物都可以成为审美的对象，成为丰富的诗材。如苏轼诗《汲江煎茶》写汲水、煎茶、喝茶，把茶事注入文士情趣，将其雅化和个性化，从而于平常中含奇特，细腻中见洒脱，有语少意多，言近旨远之妙。\n\n三、议论增多\n\n“以文为诗”对传统诗歌表现功能和范围的拓展，首先是包含着强烈社会政治意识的议论化方法和特征的大量增加和强化。作为“以文为诗”的典型人物，苏轼诗中的议论化表现在几乎所有的题材之中。\n\n在政治上，苏轼属于保守集团，其诗中自然亦不免政治观点的表达，如《山村》《赠孙莘老》《寄刘孝权》等作，都是以议论化方式通过社会问题表达出自己的政治立场。\n\n除政治议论之外，苏轼诗的议论更多地表现为一种纯粹的创作方法，如《和子由渑池怀旧》在对往日情形的回忆之中引起对“雪泥鸿爪”般人生道路的痛苦思索，而全诗皆以议论出之，更使得这类抒情诗具有了别一样的意味。\n\n苏轼访友的“人似秋鸿来有信，事如春梦了无痕”亦以议论的方式深化旧地重游的感慨和世事变幻的迷惘，写景诗《题西林壁》更是以议论的方式揭示出对自然乃至社会具有普遍意义的深刻哲理。","keywords":"散文的章法 散文的内容 诗歌语言领域 诗歌题材 议论增多","note":"“以文为诗”可以说是由杜甫开启的，经韩愈提倡，成为贯穿唐宋两代诗歌创作的一大创作思潮，而苏轼是这一思潮的集大成者。“以文为诗”，主要指的是散文的章法和内容向诗歌中渗透，前者表现在苏轼诗中是指其诗歌字法、句法和章法上的扩大，后者表现在苏轼诗中主要是题材扩大和议论增多。需要注意的是，苏轼不仅有“以文为诗”，还有“以诗为词”，答题时一定要看清。"},{"id":"254","stars":"★★★★★","title":"苏轼为词的变革做出了哪些努力","body":"苏轼继柳永之后，对词体进行了全面的改革，最终突破了词为“艳科”的传统格局，提高了词的文学地位，使词从音乐的附属品转变为一种独立的抒情诗体，从根本上改变了词史的发展方向。\n\n一、苏轼对词的变革，基于他诗词一体的词学观念和“自成一家”的创作主张\n\n（一）苏轼首先在理论上破除了诗尊词卑的观念。他认为诗词同源，本属一体，词“为诗之苗裔”，诗与词虽有外在形式上的差别，但它们的艺术本质和表现功能应是一致的。因此他常常将诗与词相提并论。由于他从文体观念上将词提高到与诗同等的地位，这就为词向诗风靠拢、实现词与诗的相互沟通渗透提供了理论依据。\n\n（二）为了使词的美学品位真正能与诗并驾齐驱，苏轼还提出了词须“自是一家”的创作主张。此处的“自是一家”之说，是针对不同于柳永词的“风味”而提出的，其内涵包括：追求壮美的风格和阔大的意境，词品应与人品相一致，作词应像写诗一样抒发自我的真实性情和独特的人生感受。只有这样才能“其文如其为人”，在词的创作上自成一家。\n\n二、扩大词的表现功能，开拓词境，是苏轼改革词体的主要方向\n\n（一）苏轼将传统的表现女性化的柔情之词扩展为表现男性化的豪情之词，将传统上只表现爱情之词变革为表现性情之词，使词像诗一样可以充分表现作者的性情怀抱和人格个性。例如《江城子·密州出猎》就表现了他希望驰骋疆场、以身许国的豪情壮志。\n\n（二）与苏诗一样，苏词中也常常表现对人生的思考。苏词比较完整地表现出作者由积极进取转而压抑苦闷又力求超脱自适的心路历程和他疏狂浪漫、多情善思的个性气质。继柳永、欧阳修之后，苏轼进一步使词作中的抒情人物形象与创作主体由分离走向同一。\n\n（三）苏词既向内心的世界开拓，也朝外在的世界拓展。苏轼不仅在词中大力描绘了作者日常交际、闲居读书及躬耕、射猎、游览等生活场景，而且进一步展现了大自然的壮丽景色。\n\n苏轼用自己的创作实践表明：词是无事不可写，无意不可人的。词与诗一样，具有充分表现社会生活和现实人生的功能。由于苏轼扩大了词的表现功能，丰富了词的情感内涵，拓展了词的时空场景，从而提高了词的艺术品位把词堂堂正正地引进文学的殿堂，使词从“小道”上升为一种与诗具有同等地位的抒情文体。\n\n三、“以诗为词”是苏轼变革词风的主要手法\n\n所谓“以诗为词”，是将诗的表现手法移植到词中。这主要体现在用题序和用典故两个方面。苏词大量运用题序和典故，丰富和发展了词的表现手法，对后来词的发展产生了重大影响。\n\n（一）苏轼把词变为缘事而发、因情而作的抒情言志之体，所以词作所抒的是何种情志或因何事生发，必须有所交代和说明。然而词体长于抒情，不宜叙事。为解决这一矛盾，苏轼在词中与诗一样大量采用标题和小序的形式，使词的题序和词本文构成不可分割的有机统一体。与张先的词题仅起交代创作的时间、地点的作用相比，苏轼赋予了词的题序以新的功能。有的题序交代词的创作动机和缘起，以确定词中所抒情感的指向，如《水调歌头》；另有一些题序与词本文在内容上有互补作用，如《满江红》（忧喜相寻），有了词题和词序，既便于交代词的写作时地和创作缘起，也可以丰富和深化词的审美内涵。\n\n（二）在词中大量使事用典，也始于苏轼。词中使事用典，既是一种替代性、浓缩性的叙事方式，也是一种曲折深婉的抒情方法。如《江城子·密州出猎》用孙权射虎的典故来作替代性的概括描写，就一笔写出了太守一马当先亲自射虎的英姿。词的下阕用冯唐故事，既表达了作者的壮志，又蕴含着对历史人物和自我怀才不遇的隐痛，增强了词的历史感和现实感。\n\n从本质上说，苏轼“以诗为词”是要突破音乐对词体的制约和束缚，把词从音乐的附属品变为一种独立的抒情诗体。苏轼写词，主要是供人阅读，而不求人演唱，故注重抒情言志的自由，虽也遵守词的音律规范而不为音律所拘，即使偶尔不协音律也在所不顾。正因如此，苏词像苏诗一样，表现出充沛的激情，丰富的想象力和变化自如、多姿多彩的语言风格。苏轼已有相当数量的作品体现出奔放豪迈、倾荡磊落如天风海雨般的新风格，如名作《水调歌头》。","keywords":"诗词一体 自成一家 创作主张 扩大表现功能 开拓词境 主要方向 以诗为词 主要手法 题序 典故 独立抒情诗体","note":"苏轼对于词这一诗体的发展可以说是产生了极其重大的影响，因而，类似于“苏轼对词境的开拓”这样的问题常常在考查中出现，所以对于这一部分内容我们要重点关注。对于这道题目，袁行霈版教材论述得可谓是十分详尽了，所以没有再给大家作额外的补充，大家可以仔细阅读。苏轼对词这一诗体的发展，首先提出了“诗词一体”和“自成一家”两大主张，其次是以扩大词的表现功能和开拓词境为主要方向，最后是以“以诗为词”作为主要手段，包括用典、用题序等方面。这一部分内容，我们要重点掌握。"},{"id":"255","stars":"★★★★★","title":"结合具体作品谈谈你如何理解苏轼“以诗为词”（26安徽大学）","body":"“以诗为词”是宋及之后的词论家对苏轼词作的综合评价之一，与苏轼同期的词人多批评这一特点，如李清照评价苏轼词是“句读不葺之诗”，后来随着南宋之后词境开拓，苏轼词的这一特征被越来越多的人所肯定。苏轼“以诗为词”的内涵及影响，主要为以下方面：\n\n一、“以诗为词”的内涵\n\n从宏观上看，词与诗歌的合分关系如上所述；如果以苏词作为考查对象，可以发现“以诗为词”的具体内涵可以反映在以下几个方面：\n\n（一）题材上开拓，诗词“同题共作”\n\n内容、题材、词境之扩大，突破“词为艳科”的狭窄藩篱，重新回到诗歌取境的阔大范围。诗之境阔，词之言长，词体经过温庭筠的奠基，历宋初后，在题材方面形成了狭深的约束性，而发展至东坡才有新的突破和超越。\n\n“以诗为词”，除了题材上的不断开拓之外，另一个重要的表现就是，诗词“同题共作”。像苏轼《定风波·咏红梅》与《红梅三首》，从题材、立意到句式、用韵都完全相同，甚至有些相同的句子分别出现在诗词中。同样的题材，苏轼可以入诗，也可以入词，诗词域完全被打破。“以诗为词”，使词的视野和畛域重新向诗靠拢，解决了词以后“写什么”的问题。\n\n（二）风格上趋同，打破了“诗庄词媚”的界限\n\n“清雄”是苏词与苏诗共有的风格倾向，毫无疑问，苏诗中许多佳作已经做到了刚柔相济，从而呈现出“清雄”的风格，苏轼词中的风景，经常出现气势雄奇，境界阔大的景象。苏轼笔下的“大风景”往往气势高昂澎湃，地势雄健险峻，有的还带有飘逸清旷的浪漫色彩，苏轼还善于将自己对人生的感悟、对世态炎凉的认识融合到这些风景描绘中，直抒胸臆，寄托豪情。《念奴娇·赤壁怀古》《水调歌头》（明月几时有）《水龙吟·次韵章质夫杨花词》《西江月·黄州定惠院寓居作》四首就基本上可视为上述风格的代表作。\n\n（三）对诗歌创作手法、技巧的借鉴\n\n苏轼“以诗为词”，将诗的表现手法移植到词中，这主要表现在用题序和用典故两个方面。\n\n（1）为解决词体长于抒情，不宜叙事的矛盾，苏轼在词中与诗一样大量采用标题和小序的形式，使词的题序和词本文构成不可分割的有机统一体。与张先词的题序仅起交代创作的时间、地点的作用相比，苏轼赋予了词的题序以新的功能。有些苏词的题序交代创作动机和缘起，以确定词中所抒情感的指向，如《水调歌头》；另有一些题序与词本文在内容上有互补作用，词序用来纪事，词本文则着重抒发由其事所引发的情感，如《定风波》（莫听穿林打叶声）。有了词题和词序，既便于交代词的写作时地和创作缘起，也可以丰富和深化词的审美内涵。\n\n（2）在词中大量使事用典，也始于苏轼。词中使事用典，既是一种替代性、浓缩性的叙事方式，也是一种曲折深婉的抒情方式。如《江城子·密州出猎》用孙权射虎的典故来作替代性的概括描写，就一笔写出了太守一马当先、亲身射虎的英姿。词的下阕用冯唐故事，既表达了作者的壮志，又蕴含着历史人物和自身怀才不遇的隐痛，增强了词的历史感和现实感。\n\n（四）对诗体功能的借鉴，以词述志\n\n从词体用途的变迁看，“以诗为词”的本质是词体对诗体功能的借鉴。词作为音乐文学，最初的用途主要是娱乐。苏轼之前，词作所抒之情多非词人自己真实的感情，其中读来动人的“真实”感情，只是一种模拟、虚构得来的表面真实。苏词之前，词中的抒情主人公是普泛化、类的形象，从苏始才转为自我、独特的“这一个”的形象。\n\n只有到苏轼才使词在功能上和诗真正合流，题材上凡可以入诗者皆可同时入词，至此词人和抒情主人公才合一。可以说，至苏轼，“词直是诗”，苏轼开启了以词述志的阶段。\n\n（五）突破音乐对词体的制约和束缚\n\n苏轼“以诗为词”，突破了音乐对词体的制约和束缚，注重抒情言志的自由，虽也遵守词的音律规范，但不为音律所拘。正因如此，苏轼作词时挥洒如意，即使偶尔不协音律也在所不顾。有意使词体逐渐疏离音乐，使词由附丽而走向独立，由唱本转而为文学文本，由被传唱转而为被传看，由合乐以娱情到不谐律而述志，这些转变也就成了“以诗为词”的应有之义。这个转变过程中，词体自身的独立性、表达功能逐渐凸现，音乐的娱乐性则渐次被淡化。\n\n二、“以诗为词”的影响\n\n（一）积极影响\n\n苏轼“以诗为词”，苏词大量运用题序和典故，丰富和发展了词的表现手法。同时，苏轼“以诗为词”，突破了音乐对词体的制约和束缚，注重抒情言志的自由，虽也遵守词的音律规范，但不为音律所拘。正因如此，苏轼作词时挥洒如意，即使偶尔不协音律也在所不顾。也正是如此，苏词像苏诗一样，表现出丰沛的激情，丰富的想象力和变化自如、多姿多彩的语言风格。换言之“以诗为词”拓宽歌词表现范围，成就歌词新的审美风格，对歌词发展做出巨大贡献。\n\n（二）消极影响\n\n“以诗为词”之弊端，南宋人已有所言及。沈义父云：“近世作词者，不晓音律，乃故为豪放不羁之语，遂借东坡、稼轩诸贤自诿。”后人对此有更深刻的认识。明王世贞云：“以气概属词，词所以亡也。”也就是说，苏轼“以诗为词”，消融了诗、词这两种诗体之间的界限，淡化或取消词这一文体的独立性，词存在的意义同时被淡化或取消。即“以诗为词”是一双刃剑，在拓宽歌词表现范围，成就歌词新的审美风格的同时，也有可能造成词这一文体的消解。","keywords":"主要武器 题材开拓 风格趋同 手法、技巧的借鉴 诗体功能的借鉴 突破音乐束缚 积极影响 拓宽表现范围 成就新的审美风格 消极影响 词的消解","note":"“以诗为词”是后世对苏轼词特征的一个综合评价，其本质上说就是将诗的题材、风格、功能、手法等因素渗透到词中去。广义上看，苏轼“以诗为词”是从题材、风格等多方面用作诗的手法来作词，具体到手法上，则主要是用典和用题序，这道题可以和上一道题相互补充。“以诗为词”是对词体的开拓，但也有可能造成词体的消解。相关内容，大家可以参考莫砺锋《从苏诗苏词之异同看“以诗为词”》、诸葛忆兵《“以诗为词”辨》、木斋《苏轼“以诗为词”涵义综论》等论文。"},{"id":"256","stars":"★","title":"苏轼在《与鲜于子骏书》曾言：“近却颇作小词，虽无柳七郎风味，亦自是一家。”请论述你对这句话的理解（26华东师范大学）","body":"苏轼的这句话，是针对当时流行的以柳永为代表的词风而说的。柳词以其大胆直率的抒情、明白流畅的语言在市民中大受欢迎，代表着当时词坛的主流风格。不过苏轼却另辟蹊径，朝着另一方向对词进行开拓，这使得他的词作在柳永“风味”之外独树一帜，并由此提出了自己“自是一家”的词学主张。因此，这句话，可以从以下这些角度进行理解：\n\n一、“无柳七郎风味”：形成了与柳永词作风格迥异的崭新特征\n\n（一）柳永讲究音调和格律，而苏轼则往往突破格律\n\n慢词本来就音调悠扬，柳永又通过采纳市井新声、扩充小令、自度曲及改造旧曲等手段，一方面不断地“变旧声作新声”一方面又“得音调之正”，极大地发展丰富了慢词的音乐美。即使在失去演唱方法后的今天，人们仍能从柳词中体会出他善于考辨四声并喜欢用双声叠韵、句中韵等音乐技巧。如“登孤垒荒凉，危亭旷望，静临烟渚”。\n\n苏询往往有意地突破音律的束缚，而充分照顾到内容表达的需要。苏轼的原则是形式要服从于内容，既要照顾到词的音乐性，又要适当打破过于严格的束缚，便于词从应歌转为抒情。故苏轼注重抒情言志的自由，虽也遵守词的音律规范而不为音律所拘，即使偶尔不协音律也在所不顾。\n\n（二）柳永多运用铺叙和白描，而苏轼多用小序和用典\n\n柳永为适应慢词长调体式的需要和市民大众欣赏趣味的需求，创造性地运用了铺叙和白描的手法。柳永将“敷陈其事而\n\n直言之”的赋法移植于词，或直接层层刻画抒情主人公丰富复杂的内心世界；或铺陈描绘情事发生、发展的场面和过程，以展现不同时空场景中人物情感心态的变化。同时，他善于巧妙利用时空的转换来叙事、布景、言情，而自创出独特的结构方式。\n\n苏轼在词中与诗一样大量采用标题和小序的形式，使词的题序和词本文构成不可分割的有机统一体。有了词题和词序，既便于交代词的写作时地和创作缘起，也可以丰富和深化词的审美内涵。在词中大量使事用典，也始于苏轼。词中使事用典，既是一种替代性、浓缩性的叙事方式，也是一种曲折深婉的抒情方法。\n\n（三）柳永词多表现出婉约繁复之美，而苏轼词则出现了奔放豪迈的崭新风格\n\n柳永词作虽然题材不尽相同，但其中一以贯之的是柳永所擅长的层层铺叙、回环断续的艺术手法。柳永正是依赖调式变化、句式参差，从而造就了一种急促的节奏和繁密的语势。同时他又通过特色景物的点染、大量细节的描写和场面的铺陈，将描写对象加以渲染，为全词带来一种“细密而妥溜”的繁复之美。这便是柳永的自家风貌。\n\n苏词像苏诗一样，表现出充沛的激情，丰富的想象力和变化自如、多姿多彩的语言风格。虽然苏轼现存的362首词中，大多数词的风格仍与传统的婉约柔美之风比较接近，但已有相当数量的作品体现出奔放豪迈、倾荡磊落如天风海雨般的新风格，如名作《水调歌头》。\n\n二、在对柳永词作进行理性审视的基础上，苏轼提出了自己的“自是一家”的词学主张。这一主张的内涵，主要包括以下方面：\n\n（一）追求壮美的风格和阔大的境界\n\n柳永词多舞筵歌席、倚红偎翠之作，风格婉约，而苏轼的词却呈现出“清雄”的风格。苏轼词中的风景，经常出现气势雄奇，境界阔大的景象。苏轼笔下的“大风景”往往气势高昂澎湃，地势雄健险峻，有的还带有飘逸清旷的浪漫色彩，苏轼还善于将自己对人生的感悟、对世态炎凉的认识融合到这些风景描绘中，直抒胸臆，寄托豪情。《念奴娇·赤壁怀古》《水调歌头》（明月几时有）《水龙吟·次韵章质夫杨花词》《西江月·黄州定惠院寓居作》四首就基本上可视为上述风格的代表作。\n\n（二）词品应与人品相一致，作词应该像作诗一样抒发自我的真实性情和独特的人生感受\n\n柳永变“雅”为“俗”，着意运用通俗化的语言表现世俗化的市民生活情调。他一改文人词的创作路数，而迎合、满足市民大众的审美需求，用他们容易理解的语言、易于接受的表现方式，着力表现他们所熟悉的人物、所关注的情事。\n\n苏词则走出了一条不同的道路，他突破了词作内容上的“闺情”“相思”“近色”等传统藩篱，而借鉴诗歌中常见的“言志”功用来抒情表意，将传统的表现女性化的柔情之词扩展为表现男性化的豪情之词，将传统上只表现爱情之词变革为表现性情之词，使词像诗一样可以充分表现作者的性情怀抱和人格个性。苏词经常抒写其独有的个体精神、气质与人生抱负，表达其不遇于时而蹉跎困顿的人生苦闷，及其善以儒道佛思想自我排遣与超越的践行与体验，所有这些，就在其词作中塑造出了“坡仙”这一文学形象。如其《卜算子》（黄州定惠院寓居作）风格凄清、幽冷。词以孤鸿自喻，词中“鸿”之形象孤独、自惜、高洁，正代表了作者孤傲不群、洁身自好的君子品格。而《江城子·密州出猎》则表现了他希望驰骋疆场、以身许国的豪情壮志。\n\n在“自是一家”的词学观统帅下，苏轼创作的是与柳词的市俗风味迥然不同的另一种士大夫情调之词，是欲摆脱词体之“俗”而走向“雅”化的词。\n\n三、“自是一家”主张，并不是单纯地对柳永词风的否定\n\n苏轼虽然提出了“自是一家”的主张，赞赏作词如“古人长短句诗”，其作仍属于新兴之词而非传统之诗，故名之为“新词”“新阕”，或仍自承“颇作小词”。也就是说，苏轼自己也承认，他这种“自是一家”的词学观念以及相关的一系列变革，是建立在北宋以来欧阳修、张先、柳永等人的基础上的。而且苏轼也并未因之否定婉约词风，他称赞张先词为“微词宛转，乃诗之裔”便是一例。苏轼屡次以自己的词与柳永词相比，作为争鸣竞技对手，也可见柳词在他心目中地位。\n\n总之，苏轼这句话，虽然是针对柳永而发，但并非对柳永词风的单纯否定，而是在当时的词作现状中，提出的一种新的变革词风的方向，其目的是推动词的雅化。","keywords":"崭新特征 突破格律 小序和用典 奔放豪迈的崭新风格 内涵 壮美的风格 阔大的境界 真实性情 人生感受不是单纯否定","note":"这道题理解起来并不算难，主要是围绕苏轼与柳永的对比以及苏轼“自是一家”的词学观展开讨论就可以了，不过需要注意的是，教材上对于“自是一家”讨论得比较简略，需要我们进行适当的补充。相关内容可以参考王启鹏《论苏轼的“自是一家”创作创新论》。"},{"id":"257","stars":"★★★★★","title":"苏轼的词具有怎样的思想艺术特色","body":"苏词一如其诗，包蕴广泛，题材丰富，情感多样，几乎到了无事无情不可以表达的程度。苏轼词的艺术特征，主要表现在以下方面：\n\n一、题材众多，内容广泛\n\n苏轼的词，题材上可以分为哲理词、咏物词、纪事词、闺怨词、应酬词、农事词、游仙词、戏谑词、集句词等。苏轼把前人很少涉猎或从未表现过的题材大量引入词中，使词从“花间”“樽前”的小圈子走向了社会的各个领域。举凡咏史、咏物、登临、怀古、悼亡、送别、游仙、谈禅、农村生活、田园风光、爱国热情、人生哲理等无不摄入笔端。苏词如此广泛地反映生活和表达各种情感志向，较之以抒写闺怨、两性情感与色情为主要内容的传统词而言，极大地丰富了词体的抒写空间。\n\n二、借鉴诗歌“言志”功用来抒情表意，塑造了“坡仙”这一文学形象\n\n苏词突破了词作内容上的“闺情”“相思”“近色”等传统藩篱，而借鉴诗歌中常见的“言志”功用来抒情表意，这就拓展了宋词的文化功能。苏词经常抒写其独有的个体精神、气质与人生抱负，表达其不遇于时而蹉跎困顿的人生苦闷，及其善以儒道佛思想自我排遣与超越的践行与体验，所有这些，就在其词作中塑造出了“坡仙”这一文学形象。如其《卜算子》（黄州定惠院寓居作）风格凄清、幽冷。词以孤鸿自喻，词中“鸿”之形象孤独、自惜、高洁，正代表了作者孤傲不群、洁身自好的君子品格。\n\n三、总体风格豪放雄奇，但也显露出多样性\n\n苏词的总体艺术风格也与其诗歌非常接近，总体风格偏向于豪放雄奇。苏轼词中的风景，经常出现气势雄奇，境界阔大的景象。如“我梦扁舟浮震泽。雪浪摇空干顷白。”苏轼笔下的“大风景”往往气势高昂澎湃，地势雄健险峻，有的还带有飘逸清旷的浪漫色彩，如“凭高眺远”，苏轼还善于将自己对人生的感悟、对世态炎凉的认识融合到这些风景描绘中，直抒胸臆，寄托豪情，如《江城子·密州出猎》。\n\n不过，苏词风格也表现出多样性。他的很多词也追求本色“当行”，继承了词体的“言情”传统与“佑欢佐酒”功能，情致深婉、清丽纯正。如《水龙吟·次韵章质夫杨花词》表情往复折叠，风格约清雅，表现了苏词的另一种风貌。\n\n四、具有“理趣”化特征\n\n苏词中也常常表现对人生的思考，具有“理趣”化特征。他多次在词中浩叹“人生如梦”“笑劳生一梦”“万事到头都是梦”“世事一场大梦”，在词人为数不多的怀古词中，也能见到此类的感叹，如其著名的怀古之作《念奴娇·赤壁怀古》。这种对人生命运的理性思考，一方面透露了词人受佛道思想影响之深，同时又增强了词境的哲理意蕴。\n\n五、突破传统词体形式和音律\n\n苏词的词体创作成就，也表现在对传统词体形式及音律的突破上。\n\n苏词在表达技巧上，也引入了诗、赋、散文等文体的写作技法。苏轼在词中与诗一样大量采用标题和小序的形式，使词的题序和词本文构成不可分割的有机统一体。有了词题和词序，既便于交代词的写作时地和创作缘起，也可以丰富和深化词的审美内涵。在词中大量使事用典，也始于苏轼。词中使事用典，既是一种替代性、浓缩性的叙事方式，也是一种曲折深婉的抒情方法。\n\n同时，苏词也往往有意地突破音律的束缚，而充分照顾到内容表达的需要。苏轼的原则是形式要服从于内容，既要照顾到词的音乐性，又要适当打破过于严格的束缚，便于词从应歌转为抒情。故苏轼注重抒情言志的自由，虽也遵守词的音律规范而不为音律所拘，即使偶尔不协音律也在所不顾。","keywords":"题材众多 内容广泛 借鉴“言志”抒情表意 “坡仙”形象 豪放雄奇 风格多样性“理趣”化 突破词体形式和音律","note":"相较于苏诗在诗歌发展史上的地位，苏词在词体发展史上的地位明显更加重要，因而苏轼词的艺术特色也是在考查中出现频率非常高的内容，大家要仔细准备。大家在分析苏轼词的艺术特色时，一方面可以联系苏轼诗歌的艺术特色，另一方面可以联系苏轼对词境的开拓这方面的内容。相互对照之下，更容易记忆。"},{"id":"258","stars":"★★★★","title":"试比较苏轼诗词的相同之处","body":"苏诗确实有“以文字为诗，以才学为诗，以议论为诗”，即散文化、议论化（及哲理化）、才学化（特别是频繁用典）之特点。而且，苏词似乎也受诗之影响，同样体现出类似的倾向，具体表现在以下方面：\n\n一、散文化\n\n苏诗散文化的章法表现，指具有散文开阖动荡、腾挪变化、不拘常格的升腾之势。苏诗散文化的特点，在句法上的表现就是根据表意需要，打破呆板句式的结构，随意伸缩变化，给人舒卷自如的读感。苏诗散文化，还有一种直观表现就是将相关的散文稍作改动直接入诗，给人的读感就是：诗乃句式相对整齐的散文而已。\n\n苏词与苏诗一样具有散文化的特点，早为论者注意到，东坡“以文为词”，没有以文为诗那么复杂，主要表现就以白话、口语入词，且为苏轼首创。（李凡说：“以文为诗”具体可以参考前面的题）\n\n二、议论化、哲理化\n\n以议论为诗、用诗讲理这是苏诗的又一重要特点，也可以说是议论化、哲理化。苏轼的早期诗歌，南行与凤翔时期，散文化倾向非常明显，好发议论的特点即显露无遗。苏诗所论之理，极为广泛，有论庄子的齐万物、一是非思想，有佛家的无住、幻灭思想，有论循序渐进的成功之道，有论作诗之道等等。苏诗的议论有个重要特点就是刻意翻新出奇，经常反弹琵琶，比如《谢苏自之惠酒》全诗结构相当于今天议论文的驳论结构，求异倾向甚明。\n\n词的传统本来以艳科、艳情为主，至苏轼引入议论，用以抒发人生感受或者谈禅论佛，在客观上拓展了词的表现范围。苏轼黄州时期的词一个重要内容就是抒发人生如梦的幻灭感，基本都是以议论入词，如“万事到头都是梦，休休。明日黄花蝶也愁”。此外，还有抒发随遇而安、随缘自适思想的议论，用词谈佛理的议论。\n\n三、大量用典\n\n苏轼一生博学多闻，庄禅佛老经史子集，无不涉猎，无不融会贯通，作诗熔经铸史，使事用典，信手挥洒，实为最大之特点。\n\n苏轼诗中用典既多且好，大多数情况下，苏轼用典旨在借其凝练的形式委曲表达不能直言的情志，如《次韵答章传道见赠》。当然，还有一些情况，并没有严肃、深刻的用意，用典只是为了迎合特定场合的需要，这种情况下难免有逞才炫博之嫌。\n\n词最初只是用来配乐歌唱的歌词，合乐可歌、浅显易懂是其基本要求，故不求、亦不必使事用典。至苏轼转化其功能，变词为陶写性灵、抒发情志的载体，遂大量用典。苏轼在词中的用典情况与诗中一样，大部分是为了借典故表达特定、不便直言的心志，或者其他重要的情感。\n\n四、日常生活化、世俗化\n\n如果我们从内容、题材角度分析，苏轼诗词还有日常生活化、世俗化等共同倾向。\n\n从诗歌内容来看，苏轼以诗真实记录自己的日常行为，如《湖上夜归》，还会记录同僚宴饮、官府公事，身边朋友的生活，或者将一些民间活动也摄入诗中，如《试院煎茶》《与述古自有美堂乘月夜归》。\n\n苏词的生活化表现与诗接近，也是用以真实记录个人的日常行为，比如出游、赏花等活动。苏轼用词记录与周围的文人生活，反映士人群体的活动，虽然这种倾向并不始于苏轼，但却是经苏轼才发扬光大。此外，苏轼还以词记录民间、民俗活动，也带有明显的世俗化色彩。宋代重大的节序及活动都在其词中有所反映，如《瑞鹧鸪·观潮》（碧山影里小红旗）。苏轼的一些咏物词，带有明显记叙性质，实际上也记录了苏轼相关的日常生活。\n\n五、游戏化\n\n苏轼天生风趣幽默、才思敏捷，对侪辈经常戏谑玩笑，他将这种快意、真率、乐观的个性风格、处事方式带入创作中，常常信笔挥洒，纵情嬉笑，体现强烈的游戏化倾向。这种倾向，我们可以从内容与形式两方面进行分析。\n\n从诗歌内容来看，具有此种倾向的诗作，往往采用夸张、反衬、对比等手段，突出主题，给人或者忍俊不禁，或者回味无穷的深刻印象，如《戏子由》；从诗歌形式上看，一些纯粹的文字游戏也大量见于苏诗中，如回文有《记梦回文二首并叙》，集句有《次韵孔毅父集古人句见赠五首》，联句有《夜坐与迈联句》，集字有《归去来集字十首并引予喜读渊明＜归去来辞）》。\n\n苏词中游戏化倾向比诗更突出，这些作品中有的用于文人之间相互戏谑取笑，于字里行间追求一种谐趣；有的则完全是文字游戏，无甚趣味可言，其意只在玩，单纯地追求“搞笑”的效果，艺术上难免有瑕疵。\n\n六、“清雄”的风格\n\n“清雄”作为一个风格术语，它的涵义大约有雄放、阔大、清丽、飘逸等项，应该说，这些确实都是苏词与苏诗共有的风格倾向。毫无疑问，苏诗中许多佳作已经做到了刚柔相济，从而呈现出“清雄”的风格。如《游金山寺》描写细致，层次分明，但又笔势骞腾，兴象超妙。惆怅的心情与潇洒的风度融于一体，且流露出豪迈之气，典型地体现出苏诗的风格特征。就苏词而言，《念奴娇·赤壁怀古》《水调歌头·丙辰中秋欢饮达旦大醉作此篇兼怀子由》《水龙吟·次韵章质夫杨花词》《卜算子·黄州定惠院寓居作》四首就基本上可视为上述风格的代表作。\n\n-【李凡关键词：散文化 议论化 哲理化 大量用典 日常生活化 世俗化 游戏化 “清雄”风格】","keywords":"","note":"苏轼“以诗为词”，将诗歌的题材、内容、表现手法等方面的因素渗透到此之中，因而他的诗词之间必然表现出了许多相同之处，比如散文化、议论化、哲理化等等。大家可以结合前面的内容理解这一部分。相关内容可以参考莫砺锋《从苏词苏诗之异同看苏轼“以诗为词”》、彭文良《苏轼诗词比较研究》，具体资料可以在李凡文学正版群内领取。"},{"id":"259","stars":"★★★","title":"试分析苏轼的地位与影响","body":"苏轼在文、诗、词三方面都达到了极高的造诣，堪称宋代文学最高成就的代表。而且苏轼的创造性活动不局限于文学，他在书法、绘画等领域内的成就都很突出，对医药、烹饪、水利等技艺也有所贡献。苏轼典型地体现着宋代的文化精神。苏轼的地位与影响，主要表现在以下方面：\n\n一、从人生态度和审美态度上为后代文人提供了范式\n\n从文学史的范围来说，苏轼的意义主要有两点。\n\n首先，苏轼的人生态度成为后代文人景仰的范式：进退自如，宠辱不惊。由于苏轼把封建社会中士人的两种主要处世态度用同一种价值尺度予以整合，所以他能处变不惊，无往而不可。当然，这种范式更适用于士人遭受坎坷之时，它可以通向既坚持操守又全生养性的人生境界，这正是宋以后的历代士人所希望做到的。\n\n其次，苏轼的审美态度为后人提供了富有启迪意义的审美范式。他以宽广的审美眼光去拥抱大千世界，所以凡物皆有可观，到处都能发现美的存在。这种范式在题材内容和表现手法两方面为后人开辟了新的世界。所以，苏轼受到后代文人的普遍热爱，实为历史的必然。\n\n二、发现和培养了一大批文学人才\n\n苏轼在当时文坛上享有巨大的声誉，他继承了欧阳修的精神，十分重视发现和培养文学人材。被称为苏门四学士的黄庭坚、秦观、张耒、晁补之，以及陈师道、李廉等，在他们还不大为人所知时就得到苏轼的热情鼓励和培养，在文艺方面各有成就，和中唐时期的“韩门弟子”后先辉映。当时就有许多青年作家众星拱月似的围绕在他周围，此外，李格非、李之仪、唐庚、张舜民、孔平仲、贺铸等人，也都直接或间接地受到苏轼的影响。由于苏轼的成就包括各种文学样式，他本人的创作又没有固定不变的规范可循，所以苏门的作家在创作上各具面目。同时，他们的艺术风貌也各具个性。\n\n三、完成了宋代诗文革新，推进了两宋词风转变\n\n苏轼以丰富的、多方面的创作实践，继承欧阳修、梅尧臣等人的事业和成就，最后完成诗文革新运动，并把这运动的精神扩展到词的领域，创立豪放词派，为南宋爱国词人开先路。在两宋词风转变过程中，苏轼是关键人物。王灼《碧鸡漫志》卷二说：“东坡先生非心醉于音律者，偶尔作歌，指出向上一路，新天下耳目，弄笔者始知自振。”强化词的文学性，弱化词对音乐的依附性，是苏轼为后代词人所指出的“向上一路”。后来的南渡词人和辛派词人就是沿着此路而进一步开拓发展的。\n\n四、影响了后代诗、词和散文等多种文体的创作\n\n在后代文人的心目中，苏轼是一位天才的文学巨匠，人们争相从苏轼的作品中汲取营养。在金国和南宋对峙的时代，苏轼在南北两方都发生了深远的影响。苏诗不但影响有宋一代的诗歌，而且对明代的公安派诗人和清初的宋诗派诗人有重要的启迪。苏轼的词体解放精神直接为南宋辛派词人所继承，形成了与婉约词平分秋色的豪放词派，其影响一直波及清代陈维等人。苏轼的散文，尤其是他的小品文，是明代标举独抒性灵的公安派散文的艺术渊源，直到清代袁枚、郑燮的散文中仍可时见苏文的影响。\n\n【李凡关键词：人生态度 审美态度 发现培养文学人才 诗文革新 词风转变 天才的文学巨匠】","keywords":"","note":"苏轼的成就是多方面的，而他对当时以及后世的影响也是多方面的。他不仅发掘了文学人才，他的作品在当时以及后世都产生了广泛影响。而他的人生态度与审美范式，更是影响至今。即使是在今天，在文学之外依然有苏轼留下的痕迹，如东坡肉、苏堤等，苏轼的影响，可见一斑。"},{"id":"260","stars":"★★★","title":"欧阳修、苏轼的散文对宋代文风的影响（河北师范大学）","body":"【答题框架】\n\n宋代散文的风格丰富多彩，几位大家各具鲜明的艺术个性。不过就整体倾向而言，宋文的风格是趋于平易畅达、简洁明快，从而在韩文之雄肆、柳文之峻切之外开辟出新的艺术境界。就美学价值而言，宋文与唐文并无高下之分。宋文的风格变化，主要是朝着更加自然、更加贴近生活的方向发展。这种文从字顺、如行云流水的散文，显然更切于实用，也更易为作者和读者所接受。而这种平易畅达、简洁明快文风的出现，与欧阳修和苏轼这两位大家有着密切的联系，这具体表现在以下方面\n\n一、文道并重，为宋代文风发展确立了正确的指导思想\n\n欧阳修对文与道的关系有了全新的认识。首先，欧阳修认为儒家之道是与现实生活密切相关的；其次，欧阳修文道井重，他认为“道纯则充于中者实，中充实则发为文者辉光”。又认为“其言之所载者大且文，则其传也彰；言之所载者不文而又小，则其传也不彰”。此外，他还认为文具有独立的性质：“古人之学者非一家，其为道虽同，言语文章，未尝相似。”这种文道并重的思想有两重意义：一是把文学看得与道同样重要，二是把文学的艺术形式看得与思想内容同样重要，这无疑大大地提高了文学的地位。\n\n在文道理论方面，苏轼从欧阳修的有关言论中有意推崇恩师“吾所谓文，必与道俱”的文道并重之言，力主文道结合，密不可分。就道而言，苏轼之道不限于儒家孔孟之道，而意在“通万物之理”。这比欧阳修主张从“百事”中体会道更加深入，更加切近现实生活的方方面面。反映到苏轼散文创作的实践中便是题材内容十分广泛，大至古圣先贤的宏业伟烈，经邦济世的汗谟远猷，小至山川景物，风土习俗，无不可入文。\n\n这样，欧阳修和苏轼前后相继，在理论上为北宋的诗文革新建立了正确的指导思想，既纠正了柳开、石介的偏颇，又矫正了韩、柳古文的某些缺点，有力推动了平易畅达文风的形成。\n\n二、以自身创作实践推广了平易畅达的文风\n\n欧阳修散文的语言简洁流畅，文气纤徐委婉，创造了一种平易自然的新风格，在韩文的雄肆、柳文的峻切之外别开生面。例如《醉翁亭记》的开头一段，语言平易晓畅，晶莹秀润，既简洁凝练，又圆融轻快，毫无滞涩窘迫之感。深沉的感慨和精☒当的议论都出之以委婉含蓄的语气，娓娓而谈，纤徐有致。\n\n欧阳修的文风在苏轼这里得到了进一步的发展。在散文创作上，苏轼能于纡余委备、圆活流转之中，带有一种创新出奇的锐气和错综变化的美感。纡余委备是欧文的特色，但为了避免由此而导致的平缓，苏轼在这一基础上有意吸取了《庄子》《战国策》以至禅宗的手法，这样就使文章增加了有无相生，奇正互倚，显隐交呈，虚实代替，疾徐错行，若无意而意合，若无法而法随的各种变化，从而获得更大的表现自由，真正实践了他“淡而实美，质而实绮，癯而实腴”的美学理想。\n\n欧阳修和苏轼这种平易近人的文风显然更容易为读者所接受，对宋代平易畅达文风产生了重要的影响。\n\n三、提拔后进、奖掖人才，促进了平易畅达文风的传播\n\n欧阳修诗文创作和学术著述都成就卓著，政治上也有很高的声望，被推举为文坛领袖。加之他乐于赏拔、奖掖人才，所以在他周围团结了一大批人才，被后世称为“唐宋八大家”的著名文人苏洵、苏轼、苏辙、曾巩、王安石等都因他的赏识与奖掖而成名。而当时具有重要影响的文人或官僚，如梅尧臣、苏舜钦、范仲淹、司马光等人，或为其同僚，或为其友人，或为其指教过的后学晚辈。除了其杰出的文学创作对时人的影响之外，欧阳修还在知贡举期间，大力打压太学体等不良文风，提拔了大批富有才学之士，为宋代文学的发展指明了方向。\n\n苏轼则是欧阳修之后又一位文坛领袖，他继承了欧阳修的精神，十分重视发现和培养文学人材。除了苏门六君子之外，还有许多青年作家众星拱月似的围绕在他周围，这对于平易畅达文风的推广也产生了很大的作用。\n\n总体来看欧阳修推动了散文从骈俪之风向质朴务实的转变，苏轼则为散文注入了更多的艺术性和感染力，共同影响了宋代平易畅达文风的形成和推广。","keywords":"整体倾向 平易畅达 简洁明快 自然 贴近生活 文道并重 正确的指导思想 创作实践 纤徐委婉 淡而实美 质而实绮 癯而实腴 提拔后进 奖掖人才","note":"宋代平易畅达文风的形成，与北宋诗文革新有着密切的联系。而论及北宋诗文革新，就离不开欧阳修和苏轼这两位举足轻重的散文大家。作为前后相继的两代文学领袖，欧阳修可以说是开启了北宋诗文革新的序幕，而苏轼则完成了北宋诗文的革新。而在散文风格上，这两位也是一脉相承，追求平易畅达，加之他们都注重提拔后辈，这又促进了这种文风的传播，这些都对宋代平易畅达文风的形成起到了重要的影响。"},{"id":"261","stars":"★★★★","title":"试分析黄庭坚诗歌的创作特征","body":"在苏轼周围的作家群中，黄庭坚的诗歌成就最为突出，他最终与苏轼齐名，并称“苏黄”。黄庭坚的诗歌创作特征，主要表现为以下方面：\n\n一、文人气和书卷气浓厚，人文意象密集\n\n就题材范围而言，黄庭坚诗没有显著的特点，整体题材走向与王安石、苏轼基本相同。黄诗的特点是文人气和书卷气特别浓厚，诗中的人文意象格外密集。首先，黄庭坚喜爱吟咏书画作品、亭台楼阁以及笔、墨、纸、砚、香扇等物品，这些对象自身都是文化活动的产物或与文人生活密切相关的物品，自然会使诗歌充满文人色彩。其次，黄庭坚写其他题材也努力抉发其中的文人意识。文化活动是一种特殊的生活形态，以此为内容的黄诗微妙而深刻地反映出诗人内心的情感律动，书卷气与生活气息并存。这正是宋诗别开生面的表现之一。\n\n二、用密集的意象群来表达既定主旨来，表现出程式化的特征\n\n黄庭坚有把写诗当作求道亦即践履其心性观的倾向，他认为诗歌是克治存养的手段，而不仅仅是“言志抒怀”。黄庭坚的很多诗歌都表现出创作者对于心性存养的体认。因此，黄庭坚在选取表现方式时，或因情裁景，因情生境，而非借景生情或者情景交融；或取历史故事多方叠加，形成密集的意象群，来表达既定主旨。\n\n为了充分表现诗歌的“载道”功能，黄庭坚常以观物而求心性修养，凸显创作主体对世网与自由、物性与自性的体认，从而实现对道体心体性体的体悟，并付诸以诗求道的践履实践。黄庭坚诗歌中荷、竹、松、鸟、鱼虫、字画等，都被拿过来充当见明心性的“话头”。由此，黄庭坚诗歌中往往表现为程式化的特征。\n\n三、生新廉悍的艺术风貌\n\n黄诗更引人注目的是鲜明的艺术个性。自梅尧臣以来，北宋诗人都在诗歌艺术上追求“生新”，也即追求在唐诗之外另辟境界，而黄庭坚在这方面表现出更强烈的自觉性。他的整个诗歌创作都贯彻了求新求变的精神，从而创造了生新廉悍的艺术风貌。\n\n（一）句法创新上“点铁成金”“夺胎换骨”\n\n在句法创新上，黄庭坚既学习杜甫、韩愈“无一字无来处”，又向禅宗“点铁成金”“夺胎换骨”“翻案”等技巧学习。“点铁成金”主要是指借用前人的语言材料，根据自己的构思重新组织，为我所用。本此，他又提出化用典故与前人诗语的技巧为“夺胎换骨”。“夺胎”指的是利用别人的语言材料、构思经验，注入新的意蕴；而“换骨”就是利用前人的语意、诗意重新组织，使诗意生新。黄庭坚善于在诗中点化前人的诗意或诗句，善于使事用典，广征博引，犹喜用《庄子》《世说》及南朝语，甚至是佛经、语录等他人少用之典，堪称以学问为诗的典型。其佳者确能做到“以俗为雅，以故为新”，化腐朽为神奇，如《寄黄幾复》。\n\n（二）注重在句中炼字\n\n黄庭坚注重在句中炼字，尤其在动词的选用上追求新警。在句法上则打破传统的声调节奏，造成枝桠拗口的效果。在声律上则主张变化出奇，用韵不拘一格，有时以险韵显示功力。在律诗中运用不合平仄规范的拗句，或有意使对偶不切产生奇崛顿挫的语言效果。\n\n（三）声律奇峭\n\n黄诗还有声律奇峭的特点。他有意识地打破音节常规，如“心犹未死杯中物，春不能朱镜里颜”等，矫健奇峭。在律诗中又多用拗句，以避免平仄和谐以至圆熟的声调，如《题落星寺》大拗大救，奇崛劲挺，为表现幽僻清绝的境界创制了恰到好处的语音形式。黄庭坚的三百多首七律中有一半是拗体，这也是形成其生新风格的重要因素。\n\n（四）句法变化丰富多彩\n\n黄庭坚借鉴杜甫等人的七律变体而加以发展，尤重对仗的变化。黄诗的对仗常常变幻莫测，或一气贯注，或迥不相属，或如骏马注坡，语句流畅而逸出格律；或如车走羊肠，语法艰涩而意脉可寻。譬如“流水对”，如“谁谓石渠刘校尉，来依绛帐马荆州”。这种流水对打破格律和语法的平行关系，从而突破了七律的严整格式，表现出飞动流丽之美。\n\n除了七律的对仗外，黄庭坚其他诗体的句法变化也是丰富多彩的。如五言诗“吾早知有觏，而不知有觌”是一二二句式；“吞五湖三江”是一四句式。他注意运用散文化的句式，大量加入虚词。如“且然聊尔耳，得也自知之”，纯是散文笔法。黄诗注重使用浓缩、省略、倒装、词汇活用等手段“造硬语”，造成句法的拗折瘦劲。如“眼中故旧青常在，鬓上光阴绿不回”，把青眼和绿鬓这样固定的词组拆开使用，语法逻辑消失而“青”“绿”形象和情感性得到凸显。\n\n（五）运用修辞时出奇制胜\n\n黄诗运用修辞手段，善于出奇制胜。如用“煎成车声绕羊肠”来形容煎茶的声音，又如“程婴杵臼立孤难，伯夷叔齐采薇瘦”，以古代的志士仁人来比喻竹子的高风亮节，都是很新警的比喻。他有时也求奇过甚，不够自然，如“露湿何郎试汤饼，日烘荀令炷炉香”就招致了许多人的批评。","keywords":"文人气 书卷气 人文意象密集 程式化 生新廉悍“点铁成金”“夺胎换骨”句中炼字 声律奇峭 句法变化丰富多彩 修辞出奇制胜","note":"苏门弟子中，黄庭坚是诗歌成就最高的一位，更是直接影响了江西诗派的诞生，在诗歌发展史上留下了重要的影响。在黄庭坚的诗歌中，无论是思想内容还是具体手法，明显可以看到杜甫、韩愈等唐代诗歌的影响。这部分最重要的是黄庭坚“生新廉悍”的艺术风貌，可能会单独考查，比如中国矿业大学在25年的考查中就出现了“论述黄庭坚的诗风特点”这道题目。"},{"id":"262","stars":"★★★","title":"试述黄庭坚的诗歌主张","body":"黄庭坚的诗论内蕴丰富，既包括诗歌艺术的入门指南，也包括通向艺术极境的深刻启示，因而产生了重要的影响。黄庭坚诗论的主要内容大致包括以下内容：\n\n一、在诗歌功能上认为诗歌是克治存养的手段，强调“因诗求道”来存养心性\n\n黄庭坚并不轻视诗歌的思想内容，主张诗歌要有所寄托，要批判现实。他也认同“文以载道”的观点，但他更加强调诗歌应抒写性情，应以道德修养为其根本。黄庭坚发展了诗歌的文化功能，强调“因诗求道”来存养心性。他有把写诗当作求道亦即践履其心性观的倾向，认为诗歌是克治存养的手段，而不仅仅是“言志抒怀”。黄庭坚以为诗歌的功能，就在于写作者以其抒写心性及存养体悟，从而潜移默化地影响读者。\n\n黄庭坚把诗人的心性存养功夫高低与诗歌写作水平的高低结合起来进行讨论，认为诗歌的写作与文同之画竹、《庄子》中的“梓人”“痀偻老人”相同，只有不假人力而实现“技进乎道”，才能到达高超境界。要想实现以文笔的描摹而把万物逼真地刻画出来，需要“胸中洞然”，强调只有通过对心体性体道体的认知和存养，达到“无私”“清静”“无欲”等层次，才能实现“技进乎道”。黄庭坚的很多诗歌都表现出创作者对于心性存养的体认。\n\n二、在重视杜诗的思想意义的同时，倡导以借鉴杜诗的艺术经验为重点\n\n宋初以来，宋人对唐诗中的典范不断进行新的选择。这种选择沿着道德判断和美学判断两条途径同步进行，最终汇聚在杜甫身上。到了北宋中叶，尊杜成为整个诗坛的共识。在这种背景下，黄庭坚举起了以杜甫为诗家宗祖的大旗。与他的整个诗论一样，黄庭坚很重视杜诗的思想意义，但他倡导学杜的重点则在于借鉴杜诗的艺术经验。黄庭坚对杜甫在炼字、造句、谋篇等方面的艺术特点有许多细致的分析，尤其倾倒于晚期杜诗的艺术境界。黄庭坚把晚期杜诗视为宋诗美学理想的参照典范，实际上即是倡导超越雕润绮丽而进入精光内敛的老成境界。在这重意义上，黄庭坚的尊杜观点最能体现宋代诗学的时代精神。\n\n三、以“点铁成金”来推陈出新\n\n黄庭坚诗论中影响很大的另一个内容是“点铁成金”之说。“点铁成金”主要是指借用前人的语言材料，根据自己的构思重新组织，为我所用。唐诗的成就登峰造极，唐诗的题材和意境也几乎无所不包，修辞手段的运用已达到炉火纯青的程度，这对于想要另辟新境的宋代诗人来说无疑是巨大的压力。对于摆脱这个窘境，黄庭坚提出了一种对策：对前代诗歌的语言艺术作积极的借鉴，黄庭坚在创作中比较成功地运用了“点铁成金”的方法，从而在借鉴前人的基础上推陈出新。“点铁成金”之说往往被后人目为“剽窃”，但在北宋的特定时代里，这不失为摆脱窘境的一种策略，所以当时发生了较大的影响。\n\n一","keywords":"克治存养手段“因诗求道”重视杜诗思想意义 借鉴杜诗艺术经验“点铁成金”推陈出新","note":"黄庭坚在诗歌功能上强调将诗歌作为克治存养手段，在艺术上提倡“点铁成金”，同时推进对杜诗的学习。他的诗论之所以能产生很大的影响，一方面是因为他的诗论内蕴丰富，初学者和才能较高的诗人都能有所收获；另一方面在于他的“点铁成金”说为宋诗开辟新境指出了另一条道路，他的理论最终促进了“江西诗派”的形成。"},{"id":"263","stars":"★★","title":"试分析陈师道的诗歌创作特征","body":"陈师道对后世的影响虽不及欧、王、苏、黄等人，然其自成风格的“陈师道体”对后世影响很大。陈师道的诗歌创作特征，主要表现在以下方面：\n\n一、诗歌题材主要为个人生活经历和人生感慨\n\n陈师道家境贫寒，性格狷介，生活圈子相当狭小，曾自叹：“苦嗟所历小，不尽千里目。”诗歌的题材内容也比较狭窄，主要是写个人的生活经历和人生感慨，但写得真挚诚恳，是寒士生活的真实写照。从题材内容来看，陈师道诗歌多写个人身世际遇。陈师道一生贫苦，故诗歌中多出现“贫”“困”“寒”“穷”“饥”等字。啼号饥寒成为陈师道诗作的一个重要内容，如《拟古》即写其不能饱腹的饥饿之状。其诗作中亦体现其“固穷”之精神，以古人自励，从而获得精神支持来超越现实生活的困苦。如《雪》诗前四句先通过写晚风、树木、鸟等自然物态来烘托雪夜寒冷，五、六句表现出诗人受冻之窘态，最后表达虽贫仍不改其节之决心。\n\n二、自觉追求“朴拙”的艺术风格\n\n陈师道不像苏轼那样才气过人，也没有黄庭坚那样精深的学力，但他在诗歌艺术上颇有自成一家的气概，有自己的风格追求。他以为作诗应该“宁拙毋巧，宁朴毋华”。他在创作中也贯彻了这种美学追求，从而创造出以“朴拙”为主要特征的艺术风格。清人叶燮认为：“宋诗在工拙之外，其工处固有意求工，拙处亦有意为拙。”陈师道以冥心孤往的苦吟形成了朴拙诗风，正是“有意为拙”的典型例子。其实他早年的诗风并不朴拙，例如《十七日观潮三首》构思新奇，《放歌行二首》则绮语旖旎，但这些诗后来都被他自己删去了。可见陈师道的风格追求是自觉的行为。\n\n三、简洁精练，质朴无华，但由于过于追求简练而导致语意破碎\n\n陈师道诗的长处是简洁精练，质朴无华，外表浑朴而意味深长。陈师道诗炼字造句精工。如《春怀示邻里》中“雷动蜂窠趁两衙”之“趁”，《登快哉亭》“暮霭已依山”之“依”等，着此一字，境界完全不同，均为炼字之经典。陈师道造句追求简、工、丰，试图以最简洁的语言表达丰富的内容，因此，他的诗篇多注重压缩他人诗句来入诗。如杜甫有“无边落木萧萧下，不尽长江滚滚来”句，陈诗缩成“落木无边江不尽”等。陈师道的缺点是过于追求言简意赅，有时把诗句压缩过甚，以至于语意破碎。此外有一些作品质木无文而缺乏情韵。显然，陈师道诗的缺点也是刻意求新所造成的。\n\n【李凡关键词：题材内容狭窄 个人生活经历 人生感慨“朴拙”的自觉追求 简洁精练 质朴无华】","keywords":"","note":"陈师道诗“朴拙”的风格是一种自觉的美学追求，体现了宋诗以平淡为美、思理见长的特色，大家可以从这个角度去切入分析。他语言简洁精练，有时把诗句压缩过甚，都是这种自觉追求的结果。"},{"id":"264","stars":"★★★","title":"谈谈你对江西诗派的认识","body":"【答题框架】\n\n一、江西诗派的内涵\n\n南宋初期吕本中作《江西诗社宗派图》，以黄庭坚为诗派之祖，以下列陈师道、潘大临、谢逸、洪刍、饶节、僧祖可、徐俯、洪朋、林敏修、洪炎、汪革、李、韩驹、李彭、晁沖之等二十五人，江西诗派的名称从此确立。除此之外，陈与义、吕本中、曾几、赵蕃、韩淲等也被看作是诗派中人。江西诗派以学杜相号召，故后来方回《瀛奎律髓》提出“一祖三宗”说，以杜甫为祖，黄庭坚、陈师道、陈与义为三宗。\n\n二、江西诗派的发展过程\n\n宏观上，江西诗派经历了很长的发展阶段，大约可分三期。\n\n（一）第一期是产生期，其代表人物是黄庭坚、陈师道。他们并未自称江西派，只不过他们的创作理论与创作实践都成了后代的楷模，被奉为派别之宗罢了。\n\n（二）第二期为确立与扩展期，代表人物是吕本中、曾几、陈与义等，虽未列入二十五人的宗派图，但他们承前启后，体现着江西诗派的成熟与变化，是正宗典型的江西诗派。\n\n（三）第三期为余波期，其影响波及杨万里、范成大、陆游等人，但他们都始从江西派入而终不由江西派出，江西诗派的影响到此宣告结束。\n\n三、江西诗派的诗学主张\n\n（一）宗法杜甫，抒写自我，表现淡泊的生活态度\n\n江西诗派宗法杜甫，以杜甫为不桃之祖。然而，江西诗派所效法的不是“三吏”“三别”和《北征》之类政治时事诗，而是杜甫至夔州后诗中那种自我内省的创作精神及体现出来的人格力量、深厚的文化艺术修养和变化百出的艺术形式。江西诗派的诗作，其内容已由北宋中叶梅、欧、苏等人的干预现实生活、指陈时弊转向抒写人生、表现自我；同样是“以议论为诗”，梅、欧、苏的议论直接评论时事政治，而江西派的议论则倾向于对人生的洞察和理解。黄庭坚特别欣赏陶渊明“不为五斗米折腰”的孤傲耿介、追求高洁脱俗的人格修养。诗派中其他人也多对淡泊的生活态度表示由衷的企慕。粪土功名，鄙弃庸俗，乃是江西诗最常见的主题。与此同时，江西派还具有一种退避社会、自我保护的思想倾向。他们醉心于日常生活的\n\n诗意发现、亲属师友的交往情谊、个人道德的自我完善和对江湖山林的向往讴歌。\n\n（二）艺术追求以清淡瘦健为审美标准\n\n所谓清淡，指诗中的描写很少色彩渲染或堆砌词藻，很少涉及男女艳情。山谷诗表现最为突出。其意象如茶碗垆董之清香，古松瘦竹之清劲，书册翰墨之清寒，蛛网尘壁之清贫，青睛白眼之清高，白鸥扁舟之清闲，具有清淡的审美特征。\n\n所谓瘦健，集中表现为造硬语、作拗句。即用浓缩、省略、倒装、词语活用等手段，打破正常的语法规则，把不拘平仄的古诗句式融入格律谨严的近体诗之中，造成音律的拗折。\n\n（三）以俗为雅，以故为新\n\n江西诗派反对浮华轻薄，崇尚老成朴拙的风格，力主出奇翻新，趋生避熟。这就是黄庭坚提倡的“以俗为雅，以故为新”。“以俗为雅”即注意从古书中吸取人们很少使用的方言俗语，以矫文人诗中常见的陈词滥调；“以故为新”，是指点化成语或前人诗句，也包括用典要求诗人有“点铁成金”之妙。\n\n四、对江西诗派的评价\n\n江西诗派人在诗学观点和写作风格上大体一致，学杜、黄，但是大部分人缺乏杰出才力和深刻的思想，只是在诗歌句法、用事等创作形式方面下功夫，而对诗歌的内容、主题等缺少必要关注，更缺乏黄庭坚那种对于儒、释、道哲理的深刻把握与自觉融合文道的意识。因此，虽然江西诗派诗人在诗歌创作上取得一定的成就，在当时影响较大，但较之黄庭坚而言，他们重诗歌技巧而轻诗歌内容及境界，继承多而创新少，诗歌成就有限。","keywords":"《江西诗社宗派图》名称确立一祖三宗 发展过程 诗学主张 倡活法 主悟入 重锤炼 归于自然 评价 继承多而创新少 成就有限","note":"“江西诗派”的形成与黄庭坚诗论的巨大影响息息相关。正是由于黄庭坚诗论的影响，一大批年轻人团结在黄庭坚身边，题材风格都比较接近，才有了“江西诗派”。同时，与江西诗派密切相关的“一祖三宗”也是在名词解释中常出现的内容，大家要注意一下。此外，对于江西诗派的发展过程、诗学主张等内容我们也要了解，总体上考查名词解释的可能性比较高，但也不排除会出一些答题。"},{"id":"265","stars":"★★","title":"试分析曾几的诗歌创作特征","body":"曾几在后期江西诗派中占有重要的地位，陆游和杨万里都受其影响。曾几的诗歌创作，主要具备如下特征：\n\n一、诗风清新活泼\n\n曾几曾向吕本中请教诗法，对吕本中提出的“活法”甚为服膺。曾几论诗亦主禅悟和活法，曾作诗云：“学诗如参禅，慎勿参死句。”但他更注重清新平易，主张“律令合时方帖妥，工夫深处却平夷”。由此，曾几后来居上，在实践中进行创新，在江西诗派袭旧成风外，在吕本中流动圆美的风格基础上更进一步，形成了一种清新活泼的新风格。其手法以白描为主；其诗用语自然，无奇字僻文；少用典故，自然妥帖；声调委婉，音节和谐。如《蛱蝶》《三衢道中》这两首诗，语言明快畅达，声调委婉和谐，全诗呈轻快流动之态，而且情韵宛然。这对校正黄陈等人过于生涩的倾向有积极意义，对宋诗从江西诗派转向中兴诗派起到了一定的过渡作用。\n\n二、前期诗歌多抒发个人情怀，后期诗歌多忧时伤世，表现爱国主题\n\n曾几前期的诗歌大部分为抒发个人情怀之作，多似江西诗法，刻意炼字、务求生新，学黄庭坚七律体诗歌。两宋之际，金兵南侵对文人的生活产生了深远的影响，促使诗人从个人的书斋生活中走出来，经历流离失所、辗转漂泊的生活，接触到现实社会内容，故诗歌创作的题材有所扩大。靖康之变后，面对山河破碎，个人飘摇的情形，曾诗歌中也出现不少写时事政事之作。曾几是爱国主战派，曾上疏高宗，力主抗金反对和议。同时，曾几一直非常关注战事发展、国事兴衰，喜忧同步，以切身之感真实地传达了爱国的情操。如得知虞允文采石矶一战挽回危局时，曾几写下《雪中陆务观数来问讯用其韵奉晴》表达自己的欣喜，南渡之初写下《寓居吴兴》以一腔悲愤谴责讽刺当局缺乏恢复中原的大志和才干，抒发了自己对外族入侵、山河破碎壮志难酬而又无可奈何的痛苦心情。这种“一饭不忘君，殆与杜甫之忠爱等”的爱国思想给陆游的影响极大。\n\n三、在诗歌艺术上积极探索\n\n曾几诗在章法的安排上也有不少成功之处。有的诗开头显得突兀，似神来一笔，如《禽声》首句，有的诗在开头又故留悬念，还常在诗的结尾上做文章。曾几诗在炼字方面也有比较成功的地方。如“云气深鸿雁”中的“深”字，写出了鸿雁在云气中飞翔时乍隐乍现的身影。在对仗方面，曾几常用一句称他人，一句道自己的句式。曾几还喜欢多用叠字、重字。这些艺术技巧的运用，正是曾几也对诗艺的孜孜以求的表现。他采用多种形式，从各个角度不断地进行探索，才使自己的诗歌达到了一定的艺术高度。","keywords":"清新活泼 前期抒发个人情怀 后期忧时伤世 艺术上积极探索","note":"在江西诗派中，曾几虽然不如“一祖三宗”地位崇高，但也对江西诗派的发展产生着重要的影响，整体来看起到了一个承上启下的关键作用。其中，曾几对于陆游的影响尤其值得我们去注意。不过总体来看，曾几相关内容在考查中单独出题的概率不高，主要是作为拓展知识供大家了解。"},{"id":"266","stars":"★★","title":"试述陈与义的诗歌创作特征","body":"陈与义是南北宋之际的重要诗人，江西诗派中的后起之秀。他的诗歌不但较早以反对异族侵略的爱国主义思想内容放射异彩于宋代诗坛，而且在艺术上也对黄庭坚、陈师道的诗风有所突破。\n\n一、前期题材多为题画、咏物和个人情怀的抒发，后期则以爱国主题为主导\n\n靖康之前，诗人虽然在仕途上不甚得意，但他毕竟是过着富家公子的生活，其诗歌内容与他的前辈黄庭坚等人大同小异。题画、咏物和个人情怀的抒发，乃是他最主要的题材。靖康乱起，侵略者的铁蹄使诗人的生活和思想都发生了突变。陈与义经历了与杜甫相似的时代，山河破碎的形势和颠沛流离的遭遇使他对杜诗思想性的认识远较其前辈为深刻，并在诗歌创作中努力学习杜甫的精神。从此以后，爱国主义的主题在陈与义的诗中占了主导地位，诗人“感时抚事，慷慨激越，寄托遥深，乃往往突过古人”，给宋诗增添了光辉的篇章。\n\n二、雄浑深沉的诗风\n\n伴随着爱国思想在诗作中的出现，陈与义在艺术上也有了重大的突破，山河破碎的形势和颠沛流离的经历使陈与义认清了杜诗的思想意义，对杜诗艺术的借鉴也转以学习其沉郁、壮阔的风格为主。在陈与义的笔下，黄庭坚诗风伤于生硬、工巧的缺点已一扫而尽，而语言凝炼准确的长处则得到了发扬。他的诗歌风格终于从黄庭坚的奇巧、陈师道的朴拙而发展为雄浑，最终呈现出了雄浑深沉的诗风。雄浑的特色在陈与义诗中体现于各种题材，例如，诗人写离愁别恨是“匆匆秣归马，离恨满霜天”，写惆怅之感是“天意苍茫里，村醪亦醉人”，写月亮是“玉盘忽微露，银浪泻干顷”等等。\n\n三、一部分表现闲情逸致的诗歌具有清远平淡的风格\n\n除了雄浑之外，陈与义的诗也有清远平淡的一面。他很敬慕陶渊明的为人，所以其诗歌受陶诗的影响也相当深。比如他曾多次次陶诗之韵，又曾两次借用陶诗“今日天气佳”的成句：“今日天气佳，忽思赋新诗”“今日天气佳，登临散腰脚”。此外，陈与义在摹写山水景物和表现闲适生活时，也曾受到韦应物、柳宗元等人的影响。陈与义的生活经历前后不同，其世界观也本有矛盾，这也就很自然地同时体现在其作品的思想内容和艺术风格中。表现爱国主义思想内容的诗歌主要体现了雄浑的艺术风格，而一部分表现闲情逸致的诗歌主要体现了清远平淡的艺术风格。\n\n四、擅长七律、七绝\n\n江西诗派的诗人大多擅长写律诗，陈与义也不例外。陈与义的七律不但在江西派中堪称擅场，就是在整个宋诗苑里也能算是奇葩。陈与义的七律有一个很显著的特色，就是对仗非常灵活，例如被魏庆之为“宋朝警句”的“客子光阴诗卷里，杏花消息雨声中”一联，除了“里”“中”二字外，其余的字都不算工对，正因为诗人已经由追求工稳而发展到突破工稳的境地，所以能以流动之风调，发深沉之情思。对句的流动多姿，是陈与义七律成就较高的重要因素之一。\n\n除了七律之外，陈与义的七绝也颇多佳作。陈与义的七绝在思想内容上确实“多本老杜”，但在艺术风格上则与杜甫颇异其趣。如《中秋夜》生新瘦硬，矫然劲挺，纯为宋调。","keywords":"前期 题画、咏物 个人情怀 后期 爱国主题 雄浑深沉 清远平淡 擅长七律、七绝","note":"和许多南渡文人一样，陈与义的诗歌创作也明显地分为前后两期，前期无论是从思想上还是艺术上都未能摆脱黄、陈的藩篇，后期却能形成了自己雄浑的独特诗风。大家在分析时，也可以从这一点入手，前后对照，比较记忆。"},{"id":"267","stars":"★★","title":"试分析黄庭坚词作的艺术特征","body":"黄庭坚的词亦有相当成就，在北宋后期具有相当地位，后人常把他和秦观并称为“秦七、黄九”。黄庭坚的词作，主要具备如下特征：\n\n一、雅俗并存，但以雅词为其成就与风格的代表\n\n黄庭坚论诗强调“以俗为雅”，论词也是雅俗并重。一方面，他承认词是“艳歌小词”，而称赞晏几道词是“狎邪之大雅，豪士之鼓吹”；另一方面，他认为词与诗一样是表达“意中事”的言志之体，而赞美张志和的《渔父词》“雅有远韵”，苏轼《卜算子》词“语意高妙”“无一点尘俗气”。因而他写词也是雅俗并存，存在着两种不同的创作倾向：其一是继承《花\n\n间集》的传统，以词抒写男女间的相思爱恋之情、伤离怨别之绪，一些词也涉色情；其二是突破了词为“艳科”藩篱，表现人生的际遇和感慨，乃至哲理的思考。代表黄庭坚词成就与风格的是他的雅词。\n\n二、抒情的自我化\n\n黄庭坚沿着苏轼开拓的抒情自我化方向发展，即表现自我刚直倔强的个性和旷达乐观的人生态度。他晚年两次被流放到边远之地，但始终保持着顽强乐观的人生信念。如《定风波·次高左藏使君韵》年虽老而豪情不减，在这样的佳节良辰，不仅要头插菊花，还要追慕古时在戏马台置酒高会的风流人物，骑马射箭，吟诗作赋，口吻间流露出老当益壮的气概。因此他每以侮世慢俗表现出他的兀傲，他的豪情中也常流露出落寞孤寂，折射出心灵深处积淀的人生创伤。如《水调歌头》（瑶草一何碧）不仅有直贯而下的气势，且透露出向慕与疑虑、超脱与留恋的人生矛盾。\n\n三、题材贴近日常生活\n\n黄庭坚使词的题材进一步贴近自我的日常生活。这不仅表现在他的词作大多数有题序，用以表明词作所写的具体时、地和日常情事，而且体现在词作的内容中。他在黔州、戎州、宜州贬所的“意中事”，写得更多更具体，完全可以依据词中所写的时、地和情事予以编年。这与从前的词作没有具体背景的写法完全不同，从而继苏轼之后，给后来的南渡词人进一步将词贴近社会现实生活，提供了可仿效的创作范式。\n\n四、格调闲逸而语言隽拔的风貌\n\n黄庭坚把江西诗派句法运化入词，使作品呈现出格调闲逸而语言隽拔的风貌，体现出文人墨客的儒雅情趣。如《满庭芳》这首咏茶词，上片写茶叶形状、影响和精神品格以及消食、克睡、启思的功能；下片写司马相如以茶醒酒，文思愈壮而晚归不倦。全词构思新颖，作者运用渲染比喻、美人衬托、点化故实等诸种手法，使作品格调浩逸，语言隽拔，字面典雅，意境形象生动，充满了浓厚的文人墨客的骚雅情趣。","keywords":"雅俗并存 抒情自我化 题材贴近日常生活 格调闲逸 语言隽拔","note":"黄庭坚的词作成就虽然不如他的诗歌，但整体成就也颇为不俗。不过相较于其词作的艺术成就，他和晁补之通过亲身创作实践对苏轼词作理论进行声援这一行为对词作发展无疑具有更重要的意义。总体来看，对于黄庭坚的考查还是集中于诗歌，词作部分我们了解一下就好。"},{"id":"268","stars":"★★","title":"晁补之对词体发展做出了怎样的贡献","body":"晁补之在理论和创作实践上都给苏轼以有力的支持，壮大了苏词的声势，对词的革新和发展有重要的意义。\n\n一、全面公允评论当时词人词作，肯定苏词的革新意义\n\n苏轼曾多次表述有关词的理论见解，晁补之受其启发，也撰有篇《评本朝乐章》。他对当时词人词作的评论，比较公允全面。时人多责难柳词“俗”，他却指出柳词也有雅而不减唐人的一面；针对东坡词“多不谐音律”之说，他认为东坡是“横放杰出，自是曲子中缚不住者”，从而肯定了苏词的革新意义，为后来学苏者提供了理论依据。此前杨绘的词话著作《本事曲》，偏于记本事，而晁补之词话则着重论词艺，开创了词话的新体式，推动了词学理论的发展。\n\n二、通过创作实践继承并拓展了苏轼的词体革新精神\n\n晁补之在理论上认同苏词的革新，创作实践上也步趋其后：\n\n（一）题材开拓面大、开拓性强\n\n苏轼革新词风的突出成就在于冲破了“词为艳科”的传统，扩大了词的题材内容，增强了词的表达功能，使词达到了“无意不可入”“无事不可言”的境地，从而使文人士大夫的人格情怀在词中得以充分展露。就晁补之词而言，其题材内容的广泛性是显而易见的，大凡艳情、歌妓、咏物、唱酬、寄赠、送别、宦游、怀旧、归隐、祝寿、吊亡、节序、题画、完括、集句等各类作品，无不俱在；同时其开拓面大，开拓性强，是其踵武苏词的主要方面。如晁补之有数首写给妻子的代言体与祝寿词，感情真挚深，品格质朴无华，有别于一般投寄歌儿舞女的缠绵悱恻的恋情词。\n\n（二）继承了苏轼豪放的词风\n\n苏轼变革词体还有一大功绩就是打破了柔弱靡艳的传统词风，开拓了“豪放派”的新词风，给词带来了壮阔的场景、高远的境界和恢宏的气度，使词由原来专写儿女之情变得可以直抒士大夫的经济之怀，从而提高了词的品格和地位。晁补之具有磊落慷慨的个性气质，他将自己对功名和人生理想的追求与失落倾注词中，其词即呈现出与苏词相近的艺术风貌和审美形态，故历来论者多从这个角度确认晁词与苏词的承传关系。晁词的风格也有豪健的一面，写“解弯弓掠地”的将军和“青云少年，燕赵豪俊”自不必说，
