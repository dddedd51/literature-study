限性","body":"从主观上看，高明创作《琵琶记》的目的在于宣扬封建道德思想，但在客观上，《琵琶记》引发了人们对封建伦理合理性的怀疑，反映了当时尊重自我、尊重情感的思潮。因此，《琵琶记》的思想价值与局限性主要反映在以下方面：\n\n一、局限性：宣扬封建道德理想\n\n高明强调封建伦理的重要性，希望通过戏曲“动人”的力量，让观众受到教化。“三不从”就是《琵琶记》全剧情节结构的纲领。所谓“三不从”，即“辞试不从，辞婚不从，辞官不从”。戏剧冲突依循着这“三不从”事件而展开，把“妄作”中的弃亲背妇的蔡伯喈“改造”为“全忠全孝”的蔡伯喈；而且就在这“改造”之中塑造了“子孝妻贤”的形象（伯喈、五娘、牛氏），以一夫两妻、俱受旌表的结局，宣传了封建道德的理想，因此，明太祖曾盛誉《琵琶记》是“山珍海错，贵富家不可无”。在这方面，《琵琶记》产生过一些消极的作用。\n\n二、思想成就\n\n（一）展示由于封建伦理而产生的社会悲剧，引发对封建伦理合理性的怀疑\n\n高明能正视社会生活的真实，在肯定孝子贤妻的同时，揭示封建伦理本身存在的矛盾，展示由于封建伦理而产生的社会悲剧，而给予观众强烈的震撼。\n\n封建伦理，是统治者赖以维护封建秩序的支柱。然而，伦理纲常本身是存在缺陷的。所谓“忠孝不能两全”，即是因为伦理纲常本身经常出现抵牾的局面。蔡伯喈服从了皇帝朝廷，便照顾不了父母家庭；反过来他要做“孝子”，便做不了“忠臣”。至于个人的意愿，更遭到无情的践踏。这一来，努力按照伦理纲常行事的蔡伯喈，只能陷入两难的境地之中。\n\n《琵琶记》尽管从正面肯定了封建伦理，但通篇展示的却是“全忠全孝”的蔡伯喈和“有贞有烈”的赵五娘的悲剧命运，从而可以引发对封建伦理合理性的怀疑。\n\n（二）写出蔡邕“抑情就理”的剧烈痛苦井加以同情，体现了当时尊重自我、尊重感情的思潮\n\n作者高明所处的时代，对自我、感情的尊重都已达到了前所未见的高度。因此，他已开始意识到了“情”与“理”之间的矛盾。当蔡邕和赵五娘等返回家乡，在其父母坟上痛哭时，张广才劝解说：“休恁地哭，且逆来顺受么！（唱）抑情就理通今古。”因此，在作者的笔下，蔡邕的实现“全忠全孝”的这一过程也就是“逆来顺受”“抑情就理”的过程；而他之所以不把“情”视为邪恶的东西，并能理解和写出“抑情就理”的剧烈痛苦，加以同情，则正是当时这种尊重自我、尊重感情的思潮在他身上的反映。","keywords":"宣扬封建道德理想 社会悲剧 伦理纲常缺陷 尊重自我 尊重感情","note":"在《琵琶记》之中，高明虽然有着明确的教忠教孝的意图，但作品中不乏反映生活真实的艺术描写，体现了高明世界观与创作方法的矛盾。而也正是这艺术上的真实性，使这部作品客观上推动了对封建伦理纲常的思考，体现了时代思潮，具有一定的积极意义。"},{"id":"328","stars":"★★★★","title":"试分析《琵琶记》的艺术成就（25黑龙江大学）","body":"【答题框架】\n\n《琵琶记》是元代南戏作品的突出代表，取得了极高的艺术成就，这主要表现在以下方面：\n\n一、双线并行的戏剧结构\n\n《琵琶记》在结构布局上成功地运用了双线并进、交错映照的手法，以蔡伯喈和赵五娘的悲欢离合构成两条戏剧动作线索，一条在京城，叙述蔡伯喈中进士以后的发达经历；一条在陈留郡，叙述赵五娘在家侍奉公婆。两条线索对比鲜明，反差强烈：仕途与穷途，京城与乡村，富贵与贫贱，安乐与悲苦......交错穿插，两相映照，形成强烈的对比，并逐渐把戏剧冲突推向高潮。\n\n写罢蔡父临死前大骂伯喈逆不孝，就写伯喈在京城自叹“他乡游子不能归，高堂父母无人管”；写罢赵五娘身无分文，卖发葬父，场景旋即转到伯托拐子带金珠书信回家；写罢五娘兜土筑坟，就以伯喈对月怀亲相映衬；写罢五娘上路寻夫，就写伯喈与牛氏决意返乡省亲......这种一以贯之的往还对照，将中国戏曲自由的时空观发挥得淋漓尽致，奠定了中国戏曲流线型结构的艺术格局。这种结构布局方式近似于电影的“蒙太奇语言”，给人一种立体的、流动的、联想的审美感受，成为中国传统戏曲独特的审美特征。\n\n二、在语言运用上取得了突出成就\n\n（一）配合人物不同的处境以及两条戏剧线索的开展，运用两种不同风格的语言\n\n在语言的运用方面，《琵琶记》最突出的成就，是能配合人物不同的处境以及两条戏剧线索的开展，运用两种不同风格的语言。赵五娘一线，语言本色；蔡伯喈一线，词藻华丽。这表明作者充分注意到语言与环境、性格、心理的关系。\n\n（二）富有动作性\n\n作为戏剧，《琵琶记》的语言也富于动作性。不少唱词、对白能与角色动作结合，成为蕴味深厚的潜台词。\n\n（三）质朴、本真、感人\n\n《琵琶记》的语言以质朴、本真、感人著称。剧作家十分细微地捕捉人物在具体情境里的情绪起伏与情感动态，调动多种艺术手段描述人物的内心感受，通俗的比喻、明晓的语句，令人过目难忘，被深深打动。不仅唱词如此，《琵琶记》的宾白也是富于生活气息，充满戏剧机趣。\n\n三、在人物塑造上取得了较大的成功\n\n蔡伯喈形象体现了知识分子的软弱性格和复杂心理。这种软弱性格与他恪守礼教伦理观念紧密相关。他努力按照伦理纲常行事，但封建伦理本身难以周全的矛盾却使他无所适从。从君从父的伦理要求，使他难以违抗；家庭的灾难，又使他难辞其咎。所以他始终处于夹缝之中，难以两全。另外，蔡伯喈也是有情有欲的，如入赘相府的那一刻，他情不自禁流露出喜悦；但他也确实思念前妻，牵挂父母，因而彷徨苦闷，忐忑难安。\n\n赵五娘形象的刻画也比较成功。她善良朴素、刻苦耐劳，在饥荒年岁，典尽衣衫，自食糟糠，独力奉养公婆，后又营葬筑坟，忍受了常人无法承受的磨难。在她身上，体现了古代中国妇女的优秀品德。同时，作者以更多的笔墨深入赵五娘心底的苦楚，揭露了封建社会和伦理纲常给予女性的苦难和无奈，让人们看到这些被视为道德楷模的人物内心的隐痛。\n\n蔡伯喈和赵五娘形象的出现，说明在元代后期，戏剧舞台逐步摆脱了单线平涂的类型化的写法，注意多角度地展示人物个性和内心世界，在形象创作史上揭开了新的一页。\n\n四、善于表现人物的心理活动\n\n《琵琶记》在刻画人物时，善于表现人物的内心活动，尤其是人物的内心矛盾。如蔡伯喈那种欲归不得的复杂心情，以功名为荣耀但又视官场为樊笼的矛盾心理，以及那种不忘旧弦但又撒不下新弦的复杂感情，都表现得非常具体和生动。《琵琶记》中不少著名曲辞都具有丰富的心理活动内容，都是“在性情上着功夫，并不以词调巧情见长”。如“吃糠”一段，既写出了赵五娘在这饥荒年头的总的情状，更深刻地表现了她在吃糠这一事件上的内心矛盾、肉体苦痛和由此所引起的对前途的绝望；由糠和米的悬殊想到自己和丈夫的云泥之别更是奇绝之思。\n\n《琵琶记》在艺术上的成就，大大提高了南戏的文学品位，把南曲戏文作品提高到雅俗共赏的新境界，就这个意义而言，《琵琶记》既是元代剧坛的殿军，又为明代传奇的繁荣开辟了道路。","keywords":"双线并行 交错映照 对比鲜明 语言运用 不同风格 富有动作性 质朴、本真、感人 人物塑造 蔡伯喈 赵五娘心理活动 内心矛盾 文学品位","note":"戏晚于杂剧出现，但却后来居上，其中一个具有标志性的重要节点就是《琵琶记》的出现。可以说，《琵琶记》出现之后，南戏终于得以在艺术上得以与北曲杂剧相提并论，由此可见《琵琶记》的艺术成就之高。也正因此，这部作品常在考查中出现，其中的一些小点也会被单独拿出来在简答题中进行考查，比如25年宁波大学就考查到了《琵琶记》的双线结构，大家要重点关注。"},{"id":"329","stars":"★★★","title":"试分析《琵琶记》的文学史地位","body":"《琵琶记》在中国戏剧史上影响深远，被称为“元代剧坛之殿军，明代戏曲之先声”，这主要是因为《琵琶记》吸收了元代戏曲艺术成就，并启发了明代戏曲创作。具体来看，表现在以下方面：\n\n一、实践了高明“关风化”“动人”主张，影响了明代戏曲的思想内容\n\n高明主张戏曲必须有关风化、合乎教化的功用，把当时士大夫所不屑的南戏看作可以“载道”的工具。同时，高明也曾提出戏剧作品要以“动人”为目的，这与自唐代参军戏以来滑稽逗笑的传统有明显差异。他并不排斥戏剧要有娱乐大众的功能，只是认为这是浅层的、容易做到的，故称“乐人易”；他更看重戏剧的特质在于“动人”，以强烈紧张的戏剧冲突、催人泪下的情节场面、品性高尚的人物形象来打动人心，他的《琵琶记》实践了这些主张。\n\n受到《琵琶记》的影响，明代《五伦全备记》《香囊记》等作品在表层意义上发展了“关风化”的口号；《浣纱记》和“临川四梦”等则间接地从“动人”和载道的内在意蕴中吸取了《琵琶记》的精华。整个明代戏曲，都可以看到《琵琶记》的印痕。\n\n二、借鉴和吸收了元杂剧创作的艺术成就，在形式上影响了明代戏曲作品\n\n从形式上，《琵琶记》吸收了元代杂剧的艺术成就，取得了很重要的影响。它的双线结构，成为传奇创作的固定范式；它的曲律，成为各家曲谱选录的主要对象，也是人们谱曲作剧的直接依据；它在长期的演出过程中积淀起来的表演艺术，还使它成为演剧的典范，成为每一个演员必须学习的入门戏本；而每一种新的戏曲声腔兴起，往往从成功改编《琵琶记》等作品为开端。所以《琵琶记》在明清时期仍活跃于舞台是戏曲史上传演最广的作品之一。《琵琶记》多达数十种的明代刊本，还表明它同时也是人们案头阅读的对象。\n\n三、提高了南戏的地位，推动了明传奇的繁荣\n\n《琵琶记》为南戏发展史划出了一道清晰的界线，对此明代徐渭有准确的表述：“......乃作《琵琶记》，以清丽之词，一洗作者之陋，于是村坊小伎，进与古法部相参，卓乎不可及已。”就是说，《琵琶记》的出现，整个地提高了南戏的档次，也提高了南戏的地位，使之在艺术上得以与北曲杂剧相提并论，并“进与古法部相参”，这也在一定程度上推动了明传奇的繁荣。所以，《琵琶记》无疑是南戏发展史上的划时代作品，有着里程碑的意义。","keywords":"“关风化”“动人”影响了思想内容 借鉴吸收艺术成就 形式影响了明代戏曲作品 提高南戏地位","note":"在南戏对北剧的继承和整个元代戏曲史的意义上，《琵琶记》不仅成为南曲“中兴之祖”，在北曲中衰之时，承担了振兴戏曲的重任；而且，作为元代戏曲的最后一座高峰，它同时也是元杂剧艺术的最好的继承人，有元一代戏曲的殿军，“元曲”的最后一位巨人，明“传奇”的开创者。相关内容可以参考黄仕忠《＜琵琶记＞在戏曲史上的影响与地位》，具体资料可以在李凡文学正版群内领取。"},{"id":"330","stars":"★★","title":"试分析《拜月亭记》的艺术成就","body":"《拜月亭记》在《荆》《刘》《拜》《杀》四大南戏中，尤其以其艺术上的卓越成就受到了历代观众和读者的喜爱。具体来看，这部南戏作品的艺术成就主要表现在以下方面：\n\n一、情节起伏跌宕，关目生动\n\n它吸收了杂剧《拜月亭》的情节和曲辞上的长处，但情节结构上要比关剧更为繁复曲折，故事细腻旖旎，展现的人物性格和社会生活也更加多样广阔。同时，《拜月亭记》在悲剧性的事件中，巧妙地插入巧合、误会的关目。机智有趣的对话，使全剧带上喜剧的色彩。如写乱离中兄妹、母女惊慌失散，瑞兰、瑞莲音近，世隆喊妹“瑞莲”，瑞兰误以为母亲喊她，结果与世隆相遇，在旷野中举目无亲的情况下，只得要求与世隆同行；而王夫人喊“瑞兰”，却喊来了瑞莲，两人同病相怜，认了母女。正是这种巧合，使人物的命运发生了始料不及的变化。还有“隆兰拆散”“瑞兰拜月”等场合，也都有巧合的关目。这些遭遇看似偶然，但在离乱中完全可能发生，由于有实际生活的依据，所以使人感到真实可信。\n\n二、通过心理描写刻画人物\n\n《拜月亭记》的人物刻画相当成功，在刻画人物时注重心理活动的描写。特别是对王瑞兰的内心的微妙活动以及矛盾心理的描写，更显得细致入微而又富于喜剧性。身为尚书小姐，在旷野中孤零无依时，她无法顾及自己的身份，只能央求蒋世隆掣带同行，甚至主动提出了“权说是夫妻”的建议。但到达旅舍，当世隆正式提出成亲要求时，她心中愿意，却又故作回避，表现出相府小姐的矜持。这一形象的出现，说明南戏的艺术水平，上升到一个新的阶段。\n\n三、语言天然本色\n\n《拜月亭记》的语言天然本色，不事雕琢又时有文采，其淡静隽永处大有陶诗之风，一向为人们称道。如瑞兰一家驿中时相会的一段曲白，这段简短的曲白，把四个人物此刻的情状展现得十分清楚：瑞兰满腔愁苦，欲说还休；王夫人爱女心切，却又絮絮叨叨；王镇气急败坏，蛮横压制；瑞莲左右周旋，从旁排解。这里，本色自然的唱词与说白浑然一体，很难区分。而曲白相生，耐人寻味，又极大增强了语言的表现力。","keywords":"情节起伏跌宕 关目生动 心理描写 语言天然本色","note":"这里我们首先要注意的是“四大南戏”这一概念，可能会出名词解释，大家要注意一下。在四大南戏之中，《拜月亭记》成就最高，几乎可以与《琵琶记》争胜，因而要重点关注。总体来看，《拜月亭记》显示出了这一时期南戏的典型特点：积极吸收杂剧的优点，并逐渐形成了自己的特色。"},{"id":"331","stars":"★★★","title":"谈谈你对元代散曲的认识","body":"元代除了诗词依然处于“正宗”位置外，诗坛上又涌现出一种新样式，这就是散曲。散曲，元人称为“乐府”或“今乐府”。散曲之名最早见之于文献，是明初朱有燉的《诚斋乐府》，至20世纪初，吴梅、任讷等曲学家的一系列论著问世以后，散曲作为包容小令和套数的完整的文体概念，最终被确定了下来。\n\n一、散曲的体制\n\n散曲的体制主要有小令、套数以及介于两者之间的带过曲等几种。\n\n（一）小令\n\n小令，又称“叶儿”，是散曲体制的基本单位。其名称源自唐代的酒令。单片只曲，调短字少是其最基本的特征。但小令除了单片只曲外，还有一种联章体，又称重头小令，它由同题同调的数支小令组成，最多可达百支，用以合咏一事或分咏数事。联章体虽以同题同调的组曲形式出现，内容上互有联系，但组曲中的各支曲子仍是完整独立的小令形态，故仍属于小令的范畴。\n\n（二）套数\n\n套数，又称“套曲”“散套”“大令”，是从唐宋大曲、宋金诸宫调发展而来。套数的体式特征最主要的有三点，即它由同一宫调的若干首曲牌联缀而成，各曲同押一部韵，通常在结尾部分还有〔尾声〕。因其体式颇有“规”，套数在抒情、叙事方面都富于表现力。\n\n（三）带过曲\n\n“带过曲”介乎小令与套数之间，用两支或三支同一宫调的小令连缀成曲，曲牌最多不能超过三首，其作用是弥补单支小令在表现力上的不足，用以表达稍微复杂一些的内容。带过曲往往形成较为常见的连带关系，即某一曲牌常常带上另一特定曲牌，如双调的〔雁儿落〕带〔得胜令〕。\n\n二、散曲的特征\n\n（一）音乐来源丰富，是多民族音乐交流融合的产物\n\n散曲的音乐，包含各地流行的民间小调、原有的一些宋词词调，还有唐宋以来的大曲、鼓子词等的曲调形式。此外，更为值得关注的是少数民族音乐的传入与渗透。尤其在北方，自宋代以来，少数民族音乐渐次在汉族人中传播。宋金时期，随着金朝政权在北方建立，女真族乐曲更多传入中原。而由金入元后，蒙古族音乐也纷纷传入，不断增强音乐的表现力。一些散曲作家如不忽、木贯云石、薛昂夫、阿鲁威等，本身就是少数民族作家。散曲是多民族的音乐交流融合的产物。\n\n（二）内容丰富，题材广泛\n\n元代散曲的内容极其丰富，反映社会现实极其广泛。有反映社会政治黑暗、百姓生活艰难困苦的作品，有辛辣讽刺皇权的作品，有表现归隐情趣而曲折反映社会腐败的作品，也有描写爱情生活以及写景抒情的作品。\n\n（三）具有独特的艺术个性和表现手法\n\n散曲作为继诗、词之后出现的新诗体，在它身上既有诗、词这些韵文文体的影子，但更有着不同于传统诗、词的鲜明独特的艺术个性和表现手法，这主要表现在以下三个方面：\n\n（1）灵活多变伸缩自如的句式\n\n散曲与词一样，采用长短句句式，但句式更加灵活多变。这主要是由于散曲采用了特有的“衬字”方式。所谓衬字，指的是曲中句子本格以外的字。增加衬字，突破了词的字数限制，使得曲调的字数可以随着旋律的往复而自由伸缩增减，较好地解决了诗的字数整齐单调与乐的节奏、旋律繁复变化之间的矛盾。同时，在艺术上，衬字还明显具有让语言口语化、通俗化，并使曲意诙谐活泼、穷形尽相的作用。\n\n（2）以俗为尚和口语化、散文化的语言风格\n\n散曲的语言虽也不乏典雅的一面，但从总体倾向来看，却是以俗为美。披阅散曲，俗语、蛮语（少数民族之语）、谑语（戏谑调侃之语）、嗑语（唠叨琐屑之语）、市语（行话、隐语、谜语）、方言常语纷至沓来，比比皆是，使人一下子就沉浸到浓郁的生活气息的氛围之中。散曲的句法讲求完整连贯，省略语法关系，直接以意象平列和句与句之间跳跃接续等诗、词中常见的写法，在散曲中却较少见，因而，散曲的语言明显地具有口语化、散文化的特点。\n\n（3）明快显豁自然酣畅的审美取向\n\n在我国古代抒情性文学的创作中，尽管存在着各种风格争奇斗妍各逞风骚的情况，但含蓄蕴藉始终是抒情性文学审美取向的主流，这一点在诗、词创作中表现得尤为明显。散曲在审美取向上当然也不排斥含蓄蕴藉一格，这在小令一体中表现得还比较突出，但从总体上说，它崇尚的是明快显豁、自然酣畅之美，与诗、词大异其趣。","keywords":"体制 小令 套数 带过曲 特征 音乐来源丰富 题材广泛 灵活多变 伸缩自如 以俗为尚 口语化、散文化 明快显豁 自然酣畅","note":"在元代，散曲地位高于杂剧，罗宗信《中原音韵·序》中以“唐诗、宋词、大元乐府”并称，所谓“大元乐府”，便主要是指元散曲。散曲作为与流行乐曲结合的新兴诗体，在元代极为兴盛，在文人范圈内，它远比杂剧风光。后来，由于多方面原因，元杂剧比元散曲更受世人的重视和推崇，元散曲反而渐被冷落了。在考查中，多数情况下，会以名词解释的形式考查散曲的知识，但散曲的体制和特征分别单独出简答题和论述题的可能性也不低，所以对此大家要有所准备。"},{"id":"332","stars":"★★","title":"试分析元代散曲兴起的原因","body":"元代散曲的兴起受到了社会变动的影响，同时也是文学自身发展的需要，总体来看，可以归纳为以下几个方面的原因：\n\n一、政治上南北分割，造成北方传统文化变异\n\n散曲和杂剧都是北方独特文化的产物。从1127年金灭北宋到1279年元灭南宋统一中国，一个半世纪，中国都处于南北对峙的分裂局面，先是南宋与北方金朝对峙一百多年，1234年元灭金后，南宋又与元朝对峙40余年，北方先后在金朝和元朝的政治统治下。金、元都是少数民族政权，政治体制、意识形态与南方的汉族政权有异，受其影响，北方文化便形成与南方不同的特点，如正统的儒家思想削弱，女真、蒙古等少数民族意识潜入等。这就使汉族的传统文化发生变异，元散曲和杂剧即是北方文化变异的产物。\n\n二、少数民族乐曲融入\n\n少数民族乐曲的融入，是散曲形成的催化剂。宋金之际，北方少数民族如契丹、女真、蒙古相继入据中原，他们带来的胡曲番乐与汉族地区原有的音乐相结合，孕育出一种新的乐曲。这样，逐渐和音乐脱离并且只能适应原有乐曲的词，在新的乐曲面前，既显得苍白无力，又显得很不合拍。在这种情况下，一种新的诗歌形式-散曲，便应运而生。\n\n三、城市经济发展、市民阶层的兴起及其文化生活的需要\n\n宋末以来我国城乡的手工业、商业，经过一段时期的停滞以后，又走上繁荣的道路。由于国土统一，交通顺畅，形成了空前规模的市场；也由于朝廷重视商业经营，元代的商业从某种意义上来说，其发展程度是超越于前代的。与此相关，许多城市的规模日益扩大。随着大中城市的涌现，市民阶层也不断壮大。他们的生活喜好，自然显畅、以俗为雅的审美趣味，需要产生更能表达时代情趣的诗歌体裁。这一切，是使文坛萌发一种新花的土壤。\n\n四、作家重新选择诗歌语言形式以表情达意\n\n从诗词发展史来看，元代散曲的形成，是作家重新选择诗歌语言形式以求更直接、更随意地表达其所感所思的结果。在元代以前，唐诗以近体诗为主要体式，讲究严谨的格律，宋词也受到词调的种种规限，诗歌语言与鲜活口语之间产生一定的距离，如何使得二者能够较为自然地结合起来，成为作家们要突破的一个难题。元代散曲的形成正是诗歌语言进一步口语化、鲜活化的具体表现。","keywords":"南北分割 传统文化变异 少数民族乐曲融入 城市经济发展 市民阶层兴起 重新选择诗歌语言形式","note":"中国歌诗，历代有继承，有创新，有发展，因时而异，因地而异。元散曲是对唐宋歌诗的继承、革新、发展。当然，元散曲是元代的新曲，不同于唐宋旧调，有其独特性，而就中国歌诗发展源流来看，它也是其中不可分割的流段。对于其兴起的原因，我们要有所了解。"},{"id":"333","stars":"★★★","title":"试分析关汉卿散曲创作的艺术成就","body":"关汉卿所留下的散曲作品在元代散曲作家中是数量较多，种类较全，反映内容较丰富，创作时间较早，充分地展现了属于他自己的艺术风格。\n\n一、主题突出，内容丰富\n\n所谓主题突出，即是说关汉卿散曲创作的主题集中而不杂乱；所谓内容丰富，即是说关汉卿的散曲创作内容基本涵盖了元代散曲所表现的主要内容。\n\n关汉卿的散曲，有表现士子才情怀和反对封建的作品，如〔南吕·一枝花〕《不伏老》；有表现男女恋情，抒写离情别绪\n\n的作品，如两首〔仙吕一半儿·题情〕《碧纱窗外静无人》和《多情多绪小冤家》写豆蔻年华、情感热烈的怀春女子情感。此外关汉卿的创作中还有探讨人生哲理的感悟、热爱生活的作品和表现对人文之美、自然之美的赞叹的作品。很明显，元代散曲所有的题材，都可以在关汉卿的作品中找到。\n\n二、叙事突出，形象鲜明\n\n所谓叙事突出，是指在散曲中叙事的比重很大，突破了传统诗歌以抒情为主的模式，形成了散曲叙事的独特艺术表现风格。所谓形象鲜明，即是指大量散曲中塑造了各种各样的人物形象，并使人物形象惟妙惟肖、具体鲜明，具有戏剧性特点。\n\n关汉卿把戏剧创作表现手法引入到散曲的创作中，重视叙事，重视情节。在他大量散曲作品中，不仅塑造了栩栩如生的人物形象，而且还将情节叙述得惟妙惟肖，能把一个个风姿绰约，独具个性女子的细腻心态和音容笑貌纤毫毕现地勾勒出来。\n\n三、语言通俗，感情率真\n\n关汉卿散曲语言平易、通俗、生动，且艺术表现手法多样，比喻、排笔、对偶、叠字、反复、顶真等辞格运用精妙得当、恰到好处。\n\n这种语言艺术上的特点直接影响着作者感情的表达，关汉卿散曲中所抒发的主要是“士子才人”的情愫，他远离官场、生活于勾栏瓦舍、对现实有清醒的认识，他的思想表达是率真直露，大胆泼辣，无所遮拦。\n\n关氏散曲中呈现出率真的感情，与其运用通俗的语言有直接的关系，二者相辅相成，合二而一，从而使关汉卿的散曲创作取得了极高的艺术成就。","keywords":"主题突出 内容丰富 叙事突出 形象鲜明 语言通俗 感情率真","note":"关汉卿散曲创作的艺术成就比不上他杂剧的成就，但在元代散曲作家中已经算是成就较高的一位了，相关内容我们需要有所了解。作为一位优秀的杂剧作家，关汉卿的散曲也不可避免地表现出了与其杂剧类似的特征，如叙事突出，大家可以将这二者联系起来理解记忆。"},{"id":"334","stars":"★★★","title":"为什么马致远被称为“曲状元”，请结合作品进行分析（25北京师范大学）【答题框架】","body":"马致远的散曲在艺术上是绚丽夺目的，这也是他的散曲为后代曲家推重，被称为“曲状元”的原因。他作品中表现出来的典雅清丽、本色自然的风格，使他的散曲意境高远开阔。\n\n一、散曲具有画意\n\n马致远散曲的意境高妙缘于他曲中的画意。他充分发挥散曲语言的丰富性和自由性，施展自己摹景状物的才情，对事物的色、形、态进行细微而传神的描绘，唤起读者的联想和想象，构成一幅幅生动的图画。\n\n马致远善于抓住事物的主要特征，巧妙地截取最鲜明的一段和最引人入胜的一瞬，加以突出渲染。同时，马致远将景物巧妙地放在一个画面空间里，使曲中景致有层次，有错落，像一幅图画展现在读者眼前。马致远的散曲的画意，更在于他借助大量诉诸感官的秾丽词藻来表现。据不完全统计，马致远散曲中表现色彩的词有近百处，这些词的使用，使马致远的散曲\n\n更生动、更明丽更有画意，也更能引发读者的联想。\n\n二、语言清丽本色，多姿多彩\n\n马致远散曲的语言清丽本色，多姿多彩。在不同的题材中，马致远散曲语言呈现出不同的风采。他十分注意字句的锤炼，像〔越调·天净沙〕《秋思》的前三句用十八字写九种物象，精炼之极，无一字可更换，无一字可增删。马致远很少用生僻字，语言自然本色。很多作品，以极通俗明白的口语写出。例如“心间事，说与他，动不动早言两罢。”全曲流畅浅白，清新活泼，俗而不粗，清丽可人。马致远散曲语言合乎作品的特定情景，富有鲜明个性，使他的作品摇曳多姿，绚丽无比。\n\n三、善于化前人诗句为己用\n\n马致远还善于化前人诗句为己用。他将唐诗人苏味道《正月十五夜》中“火树银花合，星桥铁索开”的两句化为“照星桥火树银花”；将唐人张籍《楚妃怨》中“梧树叶下黄金井”化为“梧桐初雕金井”；将唐诗人李白诗句“山阴道士如相见，应写黄庭换白鹅”化作“写黄庭换取，道士鹅归”。化前人诗句入曲，使马致远的散曲很富文采，飘逸洒脱。他化用前人诗句信手拈来，似无心巧合，毫无痕迹，这是他的过人之处。\n\n四、擅长对偶艺术\n\n对偶句的使用，在诗词中很常见。严格说来，逢双对是诗词的一个基本规律。散曲继承了诗词逢双必对的传统，又将其发扬光大，创造出更适合散曲形式活泼特点的多种对偶形式，如鼎足对、连珠对，隔句对、首尾对等，其中最富特色、最有成就的即是鼎足对。马致远很纯熟地运用对偶艺术，他的散曲中鼎足对比比皆是，且对仗工整，寓意深远，音律和谐，达到了很高的艺术境界。","keywords":"画意 清丽本色 多姿多彩 化前人诗句为己用 对偶艺术","note":"在元代散曲作家之中，马致远是成就最高的一位，故被称为“曲状元”。在散曲创作之中，马致远开拓了散曲题材范围，提高了散曲的意境，在整体上推动了散曲这一艺术的发展，被后世推为“散曲第一家”。这部分内容，可谓是相当重要。相关内容可以参考黄卉《马致远的散曲艺术》，具体资料可以在李凡文学正版群内领取。"},{"id":"335","stars":"★★","title":"试分析杨维桢“铁崖体”诗歌创作特征","body":"元代后期最具艺术个性的诗人是杨维桢。杨维桢个性狂狷，认为诗是个人情性的表现，强烈地主张艺术创作个性化。他力图打破元代中期那种缺乏生气、面目雷同的诗风，追求构思的超乎寻常和意象的奇崛不凡，从而创造了元代诗坛独一无二的“铁崖体”。杨维桢“铁崖体”诗歌，主要具备如下特征：\n\n一、题材众多，内容广泛，有不少离经叛道的作品\n\n杨维祯虽然由于自己的思想局限曾写过一些褒美节义的诗，但也创作了不少颇有离经叛道倾向的作品。大致说来，他的这种性质的诗歌可以分为三类。\n\n（一）张扬自我。在他的《大人词》《道人歌》等诗篇里，诗人的自我独立天地，含蕴万物，傲视众人，直指宇宙的奥秘，同时又无限寂寞与孤独。\n\n（二）对于与礼教相对立的爱情的肯定。在他的诗集中，写爱情的诗不少。有些作品的爱情性质不明确，有些则显然为礼教所不容。\n\n（三）对于热烈的、世俗的美的追求。中国的诗歌表现热烈的美，始于曹植而盛于李白；中晚唐诗歌已不复有此等情趣。而在杨维祯的诗中不但重新出现了热烈的美，而且经常是世俗化的，如杨维桢的《花游曲》。\n\n二、体裁上以乐府为主\n\n在创作实践上，杨维桢张扬个性，不拘一格，诗无定体；拒斥律诗，不受束缚；喜用古乐府体，不讲究“整饬”，而随意发为歌诗，杂言句式每每常用，有参差错落之美。在体裁形式上，“铁崖体”以“古乐府”为主，造语藻绘而有力度美，在诗的整体审美效应上具有“陌生化”的特征。在构思、遣词方面，“铁崖体”融汇了汉魏乐府以及李白、杜甫、李贺等人的长处，飘逸与奇诵相结合，以气势雄健的奇思幻想突破了元代中期诗歌的畦径，给人以石破天惊的感觉。\n\n三、与民间文艺关系密切\n\n杨维桢留意民间文艺，从民间诗歌中吸收营养，故而有《西湖竹枝歌》《吴下竹枝歌》《海乡竹枝歌》等。他还引俗入雅，将民间故事隐括为诗，自有一番意趣。如《的卢马》将民间流传的刘备马跃檀溪的故事转化为诗，并且对那匹神勇的骏马大加表彰，与“关张”并列，可见作者在感受故事时的趣味所在。其他如《银瓶女》《桑中妇操》等，都是隐括民间故事而成。\n\n明代文学史","keywords":"题材众多 内容广泛 离经叛道 以乐府为主 与民间文艺关系密切","note":"杨维桢是元代中后期成就较高的诗人之一，他的“铁崖体”也是在名词解释中常出现的一部分内容，大家要注意一下。杨维桢主张写个人性情，区别于从儒家正统观念出发的所谓“性情之正”，实际上又是开了明代的“性灵”说的先河，这一点我们也要注意一下。"},{"id":"336","stars":"★★★","title":"试述明代文学思潮的流变","body":"明代文化的发展，正好浓缩了中国从秦代到近代中国封建社会文化的发展。人的发现的过程，在明代似乎得到了高效的催化剂。而这种发展，在文学中显得特别醒目、集中和浓烈，主要体现在明代文学思潮的流变上面。\n\n一、明初：异化思潮\n\n明代从元明之交以后100多年的文学思潮可以用“异化”来概括，这是因为明初文人主体性的失落是空前的，他们甚至丧失了历代文人选择隐居的特权。在一种高压的政治文化环境中，文人除了有意无意培养自己的奴性之外，别无选择。\n\n明初异化思潮有着基本特征，大体上由三种文学潮流构成。其中心是颂圣之风，而崇神派与尚道派则成为颂圣派的佐翼。\n\n（一）颂圣之风\n\n明初异化思潮的中心是颂圣之风，从明初的宋濂到三杨的台阁体，其发展的线索相当清楚。这一流派的发展更多地表现在作品数量的庞大积累方面，而有文学意义的突破创新并不多见。\n\n（二）崇神派\n\n崇神一派主要是二藩王和一些宫廷御用文人组成的戏剧创作群体。在他们的创作中更加重视道教，但其成就主要是在题材方面开启了神怪小说一路，在艺术上继承和发展了传统叙事文学的文本结构。\n\n（三）尚道派\n\n尚道之“道”指的是明代官方的意识形态-程朱理学。由于明代建国伊始以来的最高统治者的大力提倡以及以官方版本的朱注四书五经为科举中的法定教材，这一派的创作有着最有力的理论依据。但如历代尚道的文学一样，无论在内容还是艺术方面，都显得刻板有余而生机不足。\n\n二、明中期：理性思潮\n\n理性思潮在异化思潮仍占统治地位时已悄然生起。这种理性表现为文人个人主体性的觉醒，为自己的心灵保留一片相对自由的空间，对国事、人生和艺术进行相对独立的思索。大体从弘、正年间始，文学的总体走向显然开始背离异化思潮之路。其构成也有三端：\n\n（一）言文派出现\n\n言文派对文学的艺术范畴的诸要素特别关注。高棅可谓是这一派的先行者，相隔百年，李东阳领导的茶陵诗派兴起，他们认识到了文学不只是政治的工具和附庸，因此提出宗杜主张，认为诗歌创作中要有格调，尤重严羽，推崇“别材”“别趣”，积极地探索了古典诗歌的创作规律。前七子在此基础上继续前进，他们的复古主张并不只是简单地想要逾迈宋人而步武汉唐文化，而是从侧面对宋代理学的道统文统提出了挑战。\n\n（二）王阳明心学产生\n\n明代中期最引人注目的文化现象是作为程朱理学对立物的王阳明心学的产生。王学承认个人在修习儒学时的巨大主观能动作用，认为每个人都可以通过自己的努力，达致圣贤的境界。这实际上已经开启了晚明人本思潮之门径。而明代中期以后文学中文人主体性的觉醒与王学的巨大感召力有必然的联系。如在《西游记》中的驯心猿以获正果的主旨上就不难看出其与王阳明“致良知”说的关系。\n\n（三）文人干预政治\n\n到了明代中期，文人们主体性的觉醒表现在对于国事的关注。从正德到嘉靖年间，传统的忠奸之辨又成为中国政坛上的主要话题。具有正统儒家理念的朝野文人士大夫与民间人士站在一起，激烈地抨击政敌，因在政治上处于弱势，所以文学成为他们最常用的武器。\n\n总之，言文、正心与预政，成为这一时期理性文学思潮的三大组成部分，而这三部分，都源于传统的儒家文化。\n\n三、晚明：主情思潮\n\n晚明文化和文学的绚丽多彩不仅使其成为中国古代文化史上最引人入胜的景观之一，而且成为中国近现代的文化和文学的直接源头。情与理的冲突，或者说得更准确一些，是情对理的冲击，成为明代后期文学的主题。其主要内容有二，一是高蹈扬厉的个性观念，一是重民益世的整体意识。尽管前者振聋发聩，但是后者的重要性也一点儿不能忽视。\n\n这一思潮有两个派别：在诗文中主要是性灵诉求，在小说戏曲中是欲望宣泄。正因其将人的感情放在了高峻的位置，所\n\n以在美学风貌上也表现出了“不拘格套”的特点。而理学文化文学的传统，在主情观念的冲击下，虽然还不至于一败涂地，但是处于全面的防守态势却是不容置疑的。","keywords":"异化思潮 颂圣之风 崇神派 尚道派 理性思潮 言文派 王阳明心学 文人干预政治 主情思潮 个性观念 整体意识 性灵诉求 欲望宣泄","note":"明代文学思潮的流变，与明代整体社会环境、政治环境等的变化是密切相关的。从总体来看，明代的文学思潮表现出了一个人的情感与个性逐渐复归的过程，而在这背后是封建制度趋于衰落，资本主义生产关系开始萌芽所引发的人的觉醒。"},{"id":"337","stars":"★★","title":"试述明代文学整体成就","body":"明代文学主要分为前期和后期，其前期文学成就主要集中于元末明初时期，主要体现在小说、诗文方面；而其后期则是在小说、戏曲等方面都取得了重要成就。这主要表现在以下方面：\n\n一、前期文学的成就\n\n明代前期文学的成就，无论是小说还是诗文，几乎全部集中于元末明初。元末明初诗文中流露着诗人对元末社会动乱的反思。比较有代表性的有宋濂、刘基的散文，高启的诗歌。小说方面，《三国志演义》《水浒传》整理写定，成为后世历史演义、英雄传奇模仿的对象。\n\n明代初期，诗文方面先后出现了歌功颂德的台阁体，追求声调格律的茶陵诗派，以李梦阳、何景明为首的前七子，提出了“文必秦汉，诗必盛唐”的复古口号。这一时期诗文的成就不大，与思想控制的加强有着直接的联系。\n\n二、后期文学的成就\n\n（一）戏曲创作和戏曲理论的繁荣\n\n明代后期文学在社会危机日趋严重、商品经济发展、文化思想松动的背景下出现新的局面。戏曲进入全盛时期，有徐渭的《四声猿》杂剧，以及《宝剑记》《鸣凤记》《浣纱记》等传奇；汤显祖的“临川四梦”尤其是《牡丹亭》的出现，使戏曲创作攀上了新的高峰。\n\n同时，还出现了一批有分量的戏曲理论批评著作。徐渭的《南词叙录》是第一部研究南戏的著作，魏良辅的《曲律》是关于昆曲的重要著作，何元朗的《曲论》、王骥德的《曲律》、吕天成的《曲品》、祁彪佳的《远山堂曲品》《远山堂剧品》等都是戏曲理论的重要著作。剧本刊刻很多，有臧晋叔的《元曲选》，毛晋的《六十种曲》，孟称舜的《古今名剧酹江集》《柳枝集》等等。\n\n（二）小说的勃兴\n\n（1）白话小说成就\n\n《西游记》成为神魔小说的顶峰之作。在《三国志演义》《水浒传》《西游记》的巨大影响之下，出现了一大批历史演义、英雄传奇和神魔小说。\n\n与此同时，一批取材于当代重大事件的长篇小说相继问世。有《于少保萃忠全传》，写于谦抗击瓦刺、保卫北京的故事；有《平妖全传》，写徐鸿儒起义的故事；有《辽海丹忠录》，写毛文龙与满洲作战的故事；有《梼杌闲评》，写魏忠贤误国的故事。《金瓶梅》作为第一部描写家庭生活、世俗社会的长篇小说的出现，标志着中国小说的写实手法进入了新的历史阶段。\n\n白话短篇小说有冯梦龙所编“三言”、凌濛初所编“二拍”。白话小说的潜力至明代得到了充分的证明。明代成为白话小说空前繁荣、硕果累累的时代。\n\n（2）文言小说成就\n\n明代文言小说的成就无法和白话小说相比，但也出现了如《剪灯新话》《剪灯余话》等有影响的作品。明代文言小说大多因袭六朝志怪和唐人传奇的传统，宣扬灵怪，记述怪异，渲染艳情，只是增加了说教的色彩。纪传体的小说和小说意味的纪传文非常风行。\n\n文言小说明显地受到白话小说的吸引，有通俗化的趋势，出现了一些篇幅较长的文言小说，以《剪灯新话》为开端，《钟情丽集》《怀春雅集》《天缘奇遇》《花神三妙传》等中篇相继跟进。篇幅加长的同时，情节越来越曲折复杂，文言小说的容量越来越大了。\n\n（三）诗文流派迭起\n\n这一时期诗文的成就无法与小说、戏曲相比。明代的后期，诗坛继续高唱复古，流派迭起。有以李攀龙、王世贞为首的后七子，王慎中、唐顺之、茅坤和归有光为代表的唐宋派，三袁为代表的公安派，锺惺、谭元春为代表的竟陵派，晚明则有以张岱为代表的小品文。\n\n（四）小说和戏曲社会地位的提高\n\n明代小说和戏曲的创作空前的繁荣得到了越来越多的肯定和重视。李开先高度评价《水浒传》，李贽则更进一步为提高小说戏曲乃至整个通俗文艺的地位大声疾呼。通俗文艺大家冯梦龙甚至认为，通俗小说的感化教育作用，超过了像《孝经》《论语》这样的儒家经典。明代的通俗小说刊刻流传，影响广泛，深入民间，不顾卫道者的咒骂和抵制，蓬勃发展。","keywords":"前期文学 后期文学 戏曲繁荣 小说成就 诗文流派 小说和戏曲的社会地位","note":"明代文学概貌分为前期和后期，前期文学成就以小说和诗文为主，包括《三国志演义》《水浒传》等小说的写定和高启、宋濂等的诗文创作；后期的文学成就最突出的主要还是在戏曲和小说方面，体现出了俗文学的繁荣，而这也与市民阶层愈发壮大有关。"},{"id":"338","stars":"★★","title":"试分析明代诗文的流变","body":"明代诗文的流变与明代整体社会的发展变动是密切相关的，总体来看，大致可以分为五个阶段。\n\n一、第一阶段（自开国至永乐初）：刚健清新，感情充沛\n\n明初的诗文，成就突出，一扫元末的纤弱靡丽之习。大乱以后，作家无意功名，埋头读书，反思人生，散文刚健清新，感情充沛。散文的代表作家是宋濂、刘基，诗歌的代表作家当推高启。正如陈田《明诗纪事序》所说：“明初诗家，各抒心得，隽旨名篇，自在流出，无前后七子相矜相轧之习。”\n\n二、第二阶段（自永乐初至成化年间）：平易雍容\n\n这一时期，进入了太平时代，诗文趋于平易雍容，以三杨（杨士奇、杨荣、杨溥）为代表的台阁体风行一时，没有深刻的思想和痛切的感受，却有一种宫廷贵族的富贵福泽之气，不为风气所囿的只有于谦，他的《石灰吟》至今为人称道。另有高棅选编唐诗为《唐诗品汇》，以其巨大影响，引导了明代诗歌宗唐的大方向。\n\n三、第三阶段（弘治、正德年间）：诗文复古思潮兴起\n\n这一时期社会已不再太平，权臣宦官把持朝政。以李东阳为代表的茶陵派雄踞文坛，领导着当时的诗文潮流。李东阳提出了诗学汉唐的主张。与此同时，以李梦阳、何景明为代表的“前七子”，提倡诗文复古，有效地改变了文坛的风气。此时不依门户、自成风格的作家有马中锡，《中山狼传》是他的散文名篇。文章寓意深刻，刻画生动。\n\n四、第四阶段（嘉靖、万历时期）：政局不稳，文风多变\n\n这一阶段政局不稳，文风多变，出现了以王慎中、唐顺之为代表的唐宋派，他们提出“变秦汉为欧曾”的口号。归有光继起，为文务求文从字顺，一洗聱牙诘屈的风气。\n\n嘉靖时期，以李攀龙、王世贞为代表的“后七子”步“前七子”的后尘，继续推动文学的复古运动，“后七子”的声势和影响更在“前七子”之上。数十年间，复古之风弥漫文坛，陈陈相因，万喙同音。\n\n万历时期，又有以三袁兄弟（袁宗道、袁宏道、袁中道）为代表的“公安派”，反对前后七子的复古，主张打破陈规陋习，“独抒性灵”。三袁之中，以袁宏道的成就和影响较大。公安派以后，又有以锺惺、谭元春为代表的“竟陵派”，企图以幽深孤僻来纠正三袁的浅俗率直。\n\n五、第五阶段（天启至明末）：慷慨激昂、悲凉苍楚\n\n这一阶段的明王朝已经病入膏肓，大势已去，文人多受刺激，社会的情绪由浮夸转向颓唐和激烈，发为诗文，多慷慨激昂、悲凉苍楚之声。诗文的主要收获是小品，代表作家是张岱，他的小品生活化、个性化，独具一格，富有审美价值。","keywords":"开国至永乐初 永乐初至成化年间 弘治、正德 嘉靖、万历 天启至明末","note":"明代诗文流变这一题目在论述时要注意五个阶段的时间段是哪些，以及每一时间段的主要文学流派和文学主张。这部分内容单独出题的可能性不算特别大，但对于我们梳理明代诗文整体发展状况有很大帮助，所以放在这里让大家了解一下。"},{"id":"339","stars":"★★★","title":"简述王学左派兴起的原因及其对文学创作的影响","body":"以王艮、颜钧、何心隐、李贽为代表的“王学左派”的兴起，有其社会、思想方面的原因。同时，这一学派对于当时的文学创作也产生了重要的影响。\n\n一、王学左派兴起的原因\n\n（一）政治思想由高压趋向失控\n\n明代中叶以后，皇权的集中与皇帝的腐化，导致了宦官的专权与朝政的腐败，这两者又加剧了党争。政治上的混乱伴随着商业经济的发展，城市的繁荣，风俗的变化，使统治集团逐渐放松了政治思想的控制。\n\n（二）佛教禅宗思想的广泛渗透\n\n心学与禅宗相结合并在社会上广泛传播，促使人们在思想观念，思维方式上发生了变革。\n\n（三）时代的呼唤\n\n新的市民阶层对代言人的需求推动了王学左派的兴起。弘治、正德年间，思想家王守仁继胡居仁、陈献章、湛若水等人之后进一步发展了宋代陆九渊的“心学”，不仅打破了程朱理学的僵化统治，而且还冲击了圣经贤传的神圣地位。自此之后，心学亦称王学，流布天下，并在嘉靖、万历年间形成了多种派别。其中泰州学派，亦称王学左派，从王艮、徐樾、颜钧、罗汝芳，到何心隐、李贽，越来越具有离经叛道的倾向。这样，就在社会上兴起了一股高扬个性和肯定人欲的思潮。\n\n二、王学左派的影响\n\n（一）促进高扬人性和肯定人欲的思潮兴起，推进文学的通俗化和对心灵世界的开拓\n\n王学左派冲破了僵化的思维，冲击了当时的封建礼教，心学与禅宗相结合，在社会上广泛传播，促使人们在思想观念、思维方式上发生了变革，开始用批判的精神去对待传统、人生和自我，为明代掀起复苏人性、张扬个性的思潮创造了一种气氛，启发了一条新的思路，提供了一种理论武器。一些思想家、文学家纷纷张扬起不顾天理而求世俗爱好的个人的情欲，在社会上兴起了一股高扬个性和肯定人欲的思潮。\n\n王学左派掀起的高扬个性与肯定人欲的思潮对于冲破僵化的思维，在创作中强化主体意识具有重要的作用。主体意识的加强和人的自我价值的觉醒，肯定了世俗人欲，扩大了题材范围。文学家们面向现实，注重用通俗的语言，真实而细致地开掘和表现人的心灵，特别是由此而出现的一些有关青年男女争取恋爱自由和婚姻自主的作品，有力地冲击了当时的封建礼教，致使明代文学呈现出一种新的气象。\n\n（二）使文学陷入了非道德、非理性的泥淖之中\n\n明代新的社会思潮、新的文学现象缺乏一个具有独立思想和文化品格的阶级基础，未能冲垮沉重的封建枷锁和陈旧的文化观念，在疏狂不羁的作风、主观唯心的原则指引下，常常明显地暴露出它的先天不足。张扬个性、肯定人欲，固然促进了文学向着个性化、世俗化的方向发展，冲击了封建的伦理观念，破坏了严格的尊卑等秩序，有利于思想的解放，但怪诞的行为、荒唐的举止却往往忽视群体的利益，有损于社会的正常秩序，以至于公然宣扬露骨的色情，怂恿“诲淫导欲”、伤风败俗的作品出笼，使文学陷入了非道德、非理性的泥淖之中。","keywords":"政治思想 佛教禅宗 时代呼唤 高扬个性 肯定人欲 通俗语言 细致开掘和表现心灵 非道德 非理性","note":"王学左派的兴起受到了政治、宗教和市民阶层兴起三方面的影响，但总体来看是时代发展的必然结果。王学左派的兴起解放了思想，推动了文学通俗化，客观上推动了文学的发展，但过犹不及，也带来了一些消极影响，对此我们要辩证分析。"},{"id":"340","stars":"★★★","title":"结合具体案例，分析中国古代文学地域性流派的形成原因（26苏州大学）","body":"南宋以来，尤其是明清以来，中国古代地域性文学流派大量涌现，比如竟陵派、公安派、桐城派，不可胜数。细究这些地域性流派形成的原因，主要包括以下方面：\n\n一、地缘关系\n\n在交通阻隔、车马舟楫不便的古代社会，地方就是自然形成的社会，而地方视野往往就是人们的主要视野，地方活动亦即人们的主要活动，地方的经济文化生活也成为人们赖以生存和发展的现实土壤。因而在具有相当限制性的自然环境中，基层文人之文学活动和社团组织以地域为基本范围，就是必然的了。地域空间的接近性，使得生活于同一地域的文人很容易结\n\n成各种类型的文社，给文人们群体唱酬、切磋技艺和议论品评提供了便利条件，并进而形成地域性的文学流派。中国文学史上曾出现过大量以地域命名的文学流派，如茶陵派、公安派、竟陵派、浙西词派、常州词派、桐城派、阳湖派、湘乡派等等。\n\n二、亲缘关系\n\n在地域性文学社团中，作者之间往往存在一定的亲缘关系。中国古代思想传统最值得注意的重要根基，是氏族宗法血亲传统遗风的强固力量和长期延续。它在很大程度上影响和决定了中国社会和意识形态所具有的特征。\n\n明清两代不少地域文学社团和文学群体都是基于亲缘关系结成的，家族作家形成了一个个群体，在地域文学发展中的重要地位由此可见，而进一步考察地域流派组成情况可以发现不少群体属于纯粹的家族性文学组织。如常州词派在早期与张氏家族息息相关，公安派的核心主要是袁氏三兄弟。\n\n姻娅关系是结成地域文学流派的重要纽带。中国古代社会之上层，家族间的姻亲结缘多具有政治联盟的意义，而在地方基层则主要是形成经济和文化的互助作用。明清时期在地方性社团流派中发挥支柱作用的，往往正是具有姻戚之谊的家族，如阳羡词派中陈维崧号为巨擘，陈氏诸兄弟为其左右，而陈氏与阳羡一地的著名文化家族储氏、万氏、吴氏、史氏、任氏等结成连环性、累复性的婚姻网络，因此在很大程度上姻娅关系就成为阳羡词派的基本结构。\n\n三、地域文化和历史传统\n\n由于相同的地域文化和历史传统，很容易使词人产生相同的感受，容易使词人寻找共同的文学源头和选择崇奉的对象，从而形成大致相近的流派理论和流派风格。如浙西词派崇雅正，推崇姜夔、张炎，宋代的词人中吴文英、王沂孙、张炎、周密、陈允平都是浙江人，姜夔、史达祖、蒋捷虽非浙人，但都曾长期生活在两浙，对两浙的人文环境和词学传统都产生了极大的影响。因此，浙西的词人经常自豪地谈到嘉兴一带的词学传统。\n\n四、经济中心南移的结果\n\n明清时期，经济中心南移，以环太湖流域为核心的江南地区经济、文化的高度发达，人口的急剧膨胀，尤其是地方望族的兴起，以一府或一县为区域的郡邑文化显示出了前所未有的强大力量。同时，由于经济发达，文化事业也走向了繁荣，由此，这一地区成为明清时期全国科举最发达的地区，造就了无数因科举起家的世家大族，世家大族的子弟不仅参与当地的各项文化活动，而且成为这些活动的骨干。因此，一些有着较为固定的活动场所、较为充裕的活动经费、较为固定的人员所组成的规模较大的文化群体自然而然地形成了，带有地域性特征的文学流派（或艺术流派）也就从这些文化群体中产生出来。中国古代比较知名的地域性文学流派，大多出自这一地区，比如竟陵派、公安派、湘乡派。\n\n综上所述，地域文学流派形成的基础是“熟人社会”的关系网络，地缘关系和亲缘关系是这一网络最重要之纲维，与此同时，地域文化、社会经济发展等因素，也在地域性文学流派形成中发挥着重要的影响。","keywords":"地缘关系 亲缘关系 地域文化 历史传统 经济中心南移","note":"这道题中为大家分析的中国古代地域性文学流派形成的这些原因中，地缘关系和亲缘关系都是比较好理解的，至于地域文化和历史传统的影响，指的是一个区域内的诗人和作家都会自觉或者不自觉地学习这一区域内以往的知名作家，进而形成一个文学流派。而经济中心南移的影响，则是由于经济重心南移，导致南方脱产者增多，文人数量增多，他们相互唱和，形成了一系列地域性文学流派。这也是明清时期许多文学流派都出现在南方的原因。相关内容可以参考罗时进《基层写作-明清地域性文学社团考察》、陈雪军《论地域性因素在文学流派形成中的作用-以清初环太湖流域郡邑性词派为例》。"},{"id":"341","stars":"★★★","title":"明代通俗文学在哪些方面促进了人们对于文学特性认识的深化","body":"明代戏曲、小说及民歌等通俗文学的发展，明显地促进了人们对于文学特性认识的深化。这主要表现在以下几个方面：\n\n一、高度重视文学的情感特征\n\n明代文学家对于情感的论述特别丰富，往往把情感作为品评作品美学意义和社会功能的准则。俗文学一般都“绝假纯真”，是真情实感的自然流露，所以往往成为主情论者的“样板”，于此加深了他们对于文学情感特征的思考和认识，并以此来作为批判“假文学”的武器。从李梦阳说“真诗乃在民间”，到袁宏道称民歌是“真人所作”之“真声”；从徐渭强调“曲本取于感发人心”，反对在戏曲创作中玩弄“时文气”，到汤显祖创造“理之所必无”而“情之所必有”的“有情人”杜丽娘，都表明明代情感论的发展与俗文学的繁荣有着密切的关系。\n\n二、清晰认识文学的“虚”与“实”关系\n\n明代以前的文学理论往往不能正确地认识艺术真实与生活真实的关系。而戏曲、小说与诗歌、散文不同，它们描绘的故事与人物大都是虚实相间、真幻互出，多有艺术虚构。但是，由于受传统观念的束缚，对戏曲、小说艺术虚构问题的认识也\n\n有一个过程。就文言小说而言，直到胡应麟才对唐传奇的艺术虚构有了比较清醒的认识。他在《少室山房笔丛》中说“唐人乃作意好奇，假小说以寄笔端”，作“幻设语”。在他前后，汤显祖、王骥德、冯梦龙等都对文学的虚构性作了较好的论述。\n\n三、开始关注人物的性格刻画\n\n明代戏曲、小说的繁荣，促使人们对于有关人物塑造和性格刻画的问题予以关注。如徐渭评《西厢记》云：“作《西厢》者，妙在竭力描写莺之娇痴，张之笨趣，方为传神。”用写形传神的理论来评价人物形象在小说批评中更加普遍。叶昼在总结《水浒传》塑造人物形象的成就时说：“《水浒传》文字妙绝千古，全在同而不同处有辨。”这里所提出的“同而不同处有辨”的命题，即要求在共性中写出个性，充分地说明了中国明代文学理论批评中的人物性格论已经具有相当的深度。\n\n四、文章语言通俗化\n\n中国文学史上，大张旗鼓地提倡语言的通俗化，是随着白话小说的繁荣而兴起的。嘉靖本《三国志通俗演义》书名就突出了“通俗”两字。以后的小说论者曾从各个角度论证了使用“俗近语”的重要意义。至于戏曲，虽有一定的特殊性，但不少论者在谈及宾白时，也都强调通俗性。明代文学家对于语言通俗化的注重，不但对当时俗文学的发展起了直接的推动作用，而且对后来特别是晚清文学革命也产生了深远的影响。","keywords":"情感特征 文学虚与实的关系 人物性格刻画 语言通俗化","note":"明代是小说、戏曲等俗文学昌盛而正统诗文相对衰微的时期。然而这种力量消长的变化并不表现在诗文数量的减少，而是表现在作品思想和艺术质量的退化。从质量上看，明代的诗文作家很难找到像李白、杜甫、苏轼那样在诗文方面做出划时代贡献的巨匠，缺乏唐宋诗文作家在艺术上的创新精神。但在通俗文学方面，明代却在多个方面做出了变革与突破，对后世文学产生了深远的影响。"},{"id":"342","stars":"★★★","title":"试论明代长篇小说繁荣的原因","body":"人们常把小说作为明代最具时代特征的文学样式，特别是长篇小说在这一时期出现了繁荣局面。总体来说，明代长篇小说繁荣的原因主要有以下几个方面：\n\n一、明代安定繁荣的社会经济，为明代小说的发展准备了丰富的土壤\n\n明太祖朱元璋在建立政权以后，吸取了元统治者覆亡的历史教训，在明初采取了恢复发展生产、使人民休养生息的方针。历百年左右，出现了经济繁荣和社会安定的局面。明中叶以后，工商业得到进一步的发展，市民阶层日益壮大，他们的生活和思想要求在文学中得到反映，因而在宋元时期说话艺术基础上发展起来的通俗小说，便受到他们的欢迎而得到发展的机会。\n\n二、宋元时期说话艺术发展的必然结果\n\n明代小说，是在宋元时期的说话艺术的基础上发展起来的。明代文人创作的白话短篇小说称为“拟话本”，就是直接摹拟学习宋元话本的产物；长篇小说如《三国志演义》《水浒传》《西游记》等，大部分由宋元说话中的讲史、说经演化发展而来。嘉靖以后，文人独立创作的反映现实的长篇小说如《金瓶梅》，亦取资于讲唱文学的写作经验。\n\n三、小说理论发展的推动\n\n由于宋元以来通俗小说创作的实践显示了这一文学形式不可忽视的社会作用，小说受到明中叶以后一些具有进步思想的文人的重视，他们在理论上给予其高度的评价，阐明其社会的和文学的价值，为小说争得了文学地位。如李贽就将《西厢记》《水浒传》与两汉文学相提并论，同称为“古今至文”；袁宏道称《水浒》和《金瓶梅》为“逸曲”。而《古今小说》绿天馆主人序更指出话本小说比儒家的经典《孝经》和《论语》具有更强烈的感人力量。\n\n四、印刷技术的进步\n\n明代印刷术的进步，刻书业的发展，也为小说创作的刊行流布创造了良好的条件，从而促进小说创作的繁荣。\n\n总之，正是基于以上原因，明代小说才得以出现繁荣之貌。在明代各类文学体裁的发展中，小说的勃兴最为引人注目。特别是中国古代长篇小说主要的、甚至是唯一的体裁-章回小说的发展和定型，是明代对中国文学作出的最为宝贵的贡献。以“四大奇书”为主要标志，清晰地展示了长篇小说艺术发展的历程。\n\n【李凡关键词：社会经济 说话艺术发展的结果 小说理论 印刷技术 刻书业】","keywords":"","note":"论述明代长篇小说繁荣的原因，我们既需要注意外部原因，即经济发展和印刷业进步，也需要注意文学自身原因，明代小说的繁荣是在唐传奇、宋元话本等的基础上发展起来的，是文学自身发展规律作用的结果。从这两个角度去切入，就更容易理解这部分内容了。"},{"id":"343","stars":"★★★","title":"为什么说“小说是明代最具时代特征的文学样式”","body":"在明代各类文学体裁的发展中，小说的勃兴最为引人注目。因此人们常把小说作为明代最具时代特征的文学样式。这主要表现在以下方面：\n\n一、章回小说的发展和定型\n\n中国古代长篇小说主要的、甚至是唯一的体裁-章回小说的发展和定型，是明代对中国文学作出的最为宝贵的贡献。\n\n（一）章回小说体制定型\n\n章回小说是在宋元讲史等话本的基础上发展而成的。它的特色是分章叙事，分回标目，每回故事相对独立，段落整齐，但又前后勾连、首尾相接，将全书构成统一的整体。现存的宋元平话已经分卷分目，但这时的目录，字数参差不等，未作修饬。至明代，目录文字越来越讲究。今见最早的嘉靖壬午刻本《三国志通俗演义》，每回标题都是单句七字。《水浒传》每回的标题已是双句，大致对偶。崇祯本《金瓶梅》，回目已十分工整完美。\n\n除分回立目之外，章回小说还保存了宋元话本中开头引开场诗、结尾用散场诗的体制。正文常以“话说”两字起首，往往在情节开展的紧要关头煞尾。用一句“欲知后事如何，且听下回分解”的套语，中间又多引诗词曲赋来作场景描写或人物评赞等。\n\n（二）章回小说艺术表现成熟\n\n明代章回小说在体制上得以定型的同时，在艺术表现方面也日趋成熟。以《三国志通俗演义》《水浒传》《西游记》《金瓶梅词话》“四大奇书”为主要标志，清晰地展示了长篇小说艺术发展的历程。\n\n这主要表现在：成书过程从历代集体编著过渡到个人独创；创作意识从借史演义，寓言寄托，到面对现实，关注人生；表现题材从着眼于兴废争战等国家大事，到注目于日常生活、家庭琐事；描写的人物从非凡的英雄怪杰，到寻常的平民百姓；塑造的典型从突出特征性的性格到用多色、动感的笔触去刻画人物的个性；情节结构从线性的流动，到网状的交叉；小说的语言从半文半白，到口语化、方言化；如此等等，都足以说明明代的章回小说在我国的小说史上取得了巨大的成就。\n\n二、白话短篇小说出现鼎盛局面\n\n与章回小说交相辉映的是，明代中后期的白话短篇小说在宋元“小说”话本的基础上也出现了一个鼎盛的局面，发展得更为精致；尤其是在“三言”“二拍”的推动下，明末清初白话短篇小说的创作如雨后春笋，繁盛一时。先后刊印的有天然痴叟的《石点头》、周清源的《西湖二集》、陆人龙的《型世言》、西湖渔隐主人的《欢喜冤家》、古吴金木散人的《鼓掌绝尘》、华阳散人的《鸳鸯针》、东鲁古狂生的《醉醒石》等多种。\n\n三、文言小说话本化推进\n\n在以《娇红记》为代表的元代文言小说之后，明代文言小说的创作也并不寂寥。特别是在白话小说尚未形成气候的明代前期，文言小说更是显得活跃。而明代中后期，文言小说在话本化的道路上也有新的变化。白话小说广阔的题材、通俗的语言、曲折的情节、较长的篇幅，甚至话本的某些体式等都对文言小说的发展有过影响。这也使得明代文言小说进一步发展，并对清代以《聊斋志异》为代表的文言小说产生了重要的影响。","keywords":"章回小说发展定型 体制定型 艺术表现成熟 白话短篇小说鼎盛 文言小说话本化","note":"小说之所以是明代最具时代特征的文学样式，是因为明代小说整体成就非常之高，无论是章回小说，白话短篇小说还是文言小说都取得了长足的进步，并且在多个方面做出了开拓，在多个方面奠定了小说这一体制的具体规范。所以人们常把小说作为明代最具时代特征的文学样式。"},{"id":"344","stars":"★★","title":"试述《三国志演义》的成书过程","body":"《三国志演义》不仅是我国章回小说中出类拔萃的开山作品，也是我国最有成就的长篇历史小说。小说本身的产生，有它自己的历史过程。《三国志演义》的成书，主要受到三个因素的影响：历史资料，民间故事，文人改编。\n\n一、历史资料\n\n与三国故事有关的历史资料，主要是晋陈寿的《三国志》和刘宋裴松之的《三国志注》。陈寿写于西晋的《三国志》，与《史记》《汉书》《后汉书》并称为“前四史”。裴注引用魏晋人的著作达二百一十余种，资料详赡，极大地充实了《三国志》的内容。而且多采轶闻，异趣横生。\n\n裴注而外，两晋以来的笔记及各类著述，其有关汉末三国的史实与传闻，都为《三国演义》提供了丰富而生动的素材。\n\n二、民间故事\n\n在民间，不断地流传和丰富着三国的故事。而三国故事在民间的流传方式，主要是“说话”（讲故事）和演戏。\n\n到隋代，文艺表演中已有“三国”的节目；李商隐有《骄儿》诗云“或谑张飞胡，或笑邓艾吃”，可见到晚唐，连儿童也熟悉三国的故事。宋代通过艺人的表演说唱，三国故事更为流行。根据《东京梦华录》载，北宋时已出现了“说三分”的专家霍四究。这里值得注意的是，宋代民间说三国故事已经表现出“尊刘贬曹”的鲜明倾向。\n\n在戏曲舞台上，金元时期搬演了大量的三国戏。金代院本，有关三国故事的回目有“赤壁鏖兵”“刺董卓”“襄阳会”等。元代杂剧，更以三国故事为其重要题材。《录鬼簿》《录鬼簿续编》《太和正音谱》《曲录》等记载的三国题材杂剧约有六十余种，这些剧目半数以上是以蜀汉人物为中心，拥刘反曹的倾向十分鲜明，在情节结构、语言风格等方面，具有浓厚的民间色彩。当时著名的杂剧作家如关汉卿、王实甫、高文秀、武汉臣、尚仲贤、石君宝、郑光祖都写有三国戏。\n\n从晚唐到元末，在民间流行的三国故事，愈来愈丰富，为《三国志演义》的创作提供了充分的条件。\n\n三、文人改编\n\n《三国志》及其裴注，戏剧、“说话”等民间艺术，均为长篇小说的创作提供了基础。在长期的、众多的群众传说和民间艺人创作的基础上，罗贯中“据正史，采小说，证文辞，通好尚”，创作了《三国志演义》这部历史演义的典范作品。","keywords":"历史资料《三国志》《三国志注》民间故事“说话”戏曲舞台 文人改编","note":"《三国志演义》的成书过程起于陈寿的《三国志》，随着时代的发展，三国故事不断地流传和丰富，表现在民间“说话”艺术、戏曲舞台等多个方面，有了这些群众传说和民间艺人创作的基础，才有巨著典范《三国志演义》。明代的三本名著的成书过程都有可能在考查中出现，大家都要掌握。"},{"id":"345","stars":"★★","title":"请简述《三国志演义》的版本系统","body":"《三国志演义》在流传过程中经历了多次修改、调整，诞生了多个版本，不过，总体来看，大致可以分为以下三个版本系统：\n\n一、“演义”系统\n\n现存最早的《三国志演义》刊本是明嘉靖王午年刊刻的《三国志通俗演义》，题“晋平阳候陈寿史传”“后学罗本贯中编次”。该书24卷，240则，每则前有七言单句小目，以“祭天地英雄结义”始，以“王濬计取石头城”终。卷首有弘治甲寅愚子（蒋大器）《序》、嘉靖壬午修髯子（张尚德）《引》。\n\n嘉靖本之后，又出现多种刻本。这类刻本，或稍易书名，或加入评点，或改二百四十回为一百二十回，文字亦有参差。其中，《李卓吾先生批评三国志》即把嘉靖本的两回合为一回，把原有的单句回目合为双句回目。“李卓吾先生批评”中常有“梁溪叶仲子谑曰”，叶仲子即叶昼。全书评语实为叶昼所写。至今影响最大、流传最广的“毛本”，即以此本为基础。\n\n二、“志传”系统\n\n存世的《三国志演义》刊本还有嘉靖二十七年叶逢春刊印的《三国志通俗演义史传》十卷，分240段（现存八卷，佚卷三、卷七）。此本比嘉靖壬午本晚出，然保存了一些传抄阶段旧本的面貌。万历以后，有不少刊本与叶逢春本关系密切，其内容有关索（或花关索）故事，书名又多含有“志传”两字，与嘉靖王午本等名“演义”及无关索（或花关索）等故事有异，形成了《三国》的“演义”本与“志传”本两大系统。\n\n三、“毛本”系统\n\n清康熙年间，毛纶、毛宗岗父子以“演义”本为基础，也吸取了“志传”本若干内容，修订文辞，增删情节，削去无保留价值的论赞和诗评，使之更便于阅读。此外，把原回目调整为七言或八言的对偶句，增强了文学性与可读性。同时，毛氏父子多达二十余万言的评点文字，全面反映了他们的历史观、伦理观和文学观，内容十分复杂，旧本《三国演义》经毛氏父子之手，拥刘反曹的倾向更为突出，加重了正统的道德色彩，成为后来最流行的本子。\n\n对于促进中国古代小说理论和文学批评的发展，毛氏评点有很大的贡献。近人常将它简称为《三国演义》，并渐渐地与《三国志通俗演义》混为一谈，甚至将在文学史上最具代表意义的书名《三国志通俗演义》取而代之。","keywords":"“演义”系统《三国志通俗演义》“志传”系统《三国志通俗演义史传》“毛本”系统 最流行的本子","note":""},{"id":"346","stars":"★★★★★","title":"试分析《三国志演义》的历史地位","body":"《三国志通俗演义》是中国文学史上出现的第一部长篇小说，它在创作上所取得的成就对后世的小说创作产生了深远的影响，在中国小说史上占有重要的地位。总起来看，《三国志通俗演义》对中国小说史所做的贡献主要表现在以下几个方面。\n\n一、在中国小说史上，《三国志演义》第一次突出地描写了人的生命力并给予热情的歌颂，第一次较集中地描写和肯定了维护个人尊严的行为\n\n《三国志通俗演义》描写英雄时所显示出的特色，实际上就是对人的生命力的肯定与赞美。如孙策大战太史慈是个人勇力的较量，关羽刮骨疗毒是对强韧的个体生命毅力的颂扬，等等。这些都是三国英雄生命力的表现形态，作者对此都给予肯定与歌颂。\n\n同时，《三国志通俗演义》也写了很多英雄死亡的场面，其描写着力凸现出人物的生命欲求以及充分发挥个体生命力的渴望。如诸葛亮，在“秋风五丈原”，预感到自己的生命将尽时，也禁不住仰天长叹，这本身就是其不断奋斗、永不满足的生命力的显现。这种描写带有一种昂扬而悲壮的情调，表现出对英雄的崇仰与对英雄命运的同情。\n\n对个人尊严的维护与生命力的弘扬其实也是联系在一起的，因为那需要相应的勇气，否则就只能卑躬屈节。在这方面，它的要求甚至高于一般的勇敢。\n\n二、在中国小说史上，《三国志演义》第一次比较集中地反映出当时的市民意识\n\n当时市民意识的主要特点是重功利、重个体、重个人的能力。《三国志通俗演义》写英雄不重个人的道德品质，而重视其个体能力、建树与个人的情感。如华容道义释曹操，就主要是基于关羽的个人情感与价值选择，而不是基于对刘备集团的忠诚。这种重个人利益-关羽对曹操的好感也正是基于曹操对其个人利益的满足-而轻道德的观念在明代后期的短篇白话小说集“三言”“二拍”中表现得更充分。\n\n三、从小说创作上看，《三国志演义》是中国小说史上民间文艺与文人素养相结合而产生的第一个重要成果\n\n在《三国志通俗演义》之前，关于三国的故事一直以民间文艺的形式流传着，这些民间的文艺虽有其生动活泼的一面，却比较原始粗糙。罗贯中则以其深厚的文学素养对有关三国的民间文艺进行艺术的加工与提高，将雅俗结合，使《三国志通俗演义》成为一部成功的艺术作品。罗贯中的这一经验在后来的长篇小说如《水浒传》《西游记》等的创作中被进一步继承发扬，形成了中国小说史上独特的创作传统。\n\n四、《三国志演义》是我国章回小说的开山之作，也是历史演义的代表作，在它的影响下，先后出现了一二百部历史演义\n\n《三国志演义》以75万字的规模，用一种比较成熟的演义体小说语言塑造了四百多个人物形象，描写了近百年的历史进程，创造了一种新型的小说体裁，这不仅使当时的读者“争相誊录，以便观览”，而且也刺激了文士和书商们继续编写和出版同类小说的热情。自嘉靖以后，各种历史演义如雨后春笋，不断问世，从开天辟地，一直写到当代。据不完全统计，今存明、清两代的历史演义约有一二百种之多。可以说，这些小说无不受到《三国志演义》的影响。\n\n五、《三国志演义》长期被人们视作一部通俗的历史教科书和军事著作，对社会生活各方面都产生了重要的影响\n\n《三国志演义》是一座极为丰富的精神宝库，实际上也是一部大众文化的百科全书。从中人们可以得到历史的知识、斗争的智慧、做人的道理和处世的经验。从总体来看，全书肯定智慧谋略，歌颂武勇奋进，重视德才兼备，主张积极入世，赞美秉公执法，提倡求实作风，强调以民为本，向往国家统一等，都对培养和发扬良好的民族文化心理起到了积极的作用。它之所以得到几百年来人民大众的欢迎，既是由于其文学审美吸引了读者，也是由于它的精神内涵与文化价值为大众所认同。","keywords":"生命力 肯定维护个人尊严 反映市民意识 民间文艺与文人素养相结合 章回小说开山之作 历史演义代表历史教科书和军事著作","note":"《三国志演义》是中国文学史上出现的第一部长篇小说，虽然在许多方面如语言等仍保留着说话艺术的痕迹，但在思想和艺术上的许多方面都已经做出了开拓，具有开风气之先的重要作用，为长篇章回体小说的发展树立了典范，因而在文学史上具有重要的意义。"},{"id":"347","stars":"★★★★","title":"试分析《三国志演义》的思想内容","body":"《三国志演义》不但在艺术上取得了极高的成就，而且包含着非常丰富的思想内容，这主要表现在以下方面：\n\n一、对于昏君贼臣的痛恨，对于明君良臣的渴慕\n\n统观《三国志演义》全书，作者显然是以儒家的政治道德观念为核心，同时也糅合着干百年来广大民众的心理，表现了对于导致天下大乱的昏君贼臣的痛恨，对于创造清平世界的明君良臣的渴慕。这也就是一部《三国志演义》的主旨。明君良臣的主要标志，就是能在政治上行“仁政”，人格上重道德，才能上尚智勇。\n\n（一）政治上向往“仁政”\n\n小说在以蜀为中心，展开三国间错综复杂的争斗故事时，把蜀主刘备塑造成一个仁君的典范，他手下的大臣也都有“救国救民之心”，这都寄托着作者仁政爱民的理想。\n\n与刘备相对照的是，作者又塑造了一个残暴的奸雄曹操。曹操也是一个“人杰”，但他工于权谋，奸诈、残忍，毫无惜民爱民之心。这种对于蔑视黎元、残杀无辜的乱臣贼子的愤恨，正反映了广大民众对于“仁政”的渴慕。\n\n（二）人格上重视道德\n\n《三国志演义》在人格构建上的价值取向，是恪守以“忠义”为核心的伦理道德规范。全书写人论事，都鲜明地以此来区分善恶，评定高下，而不问其身处什么集团，也不论其出身贵贱和性别，只要“义不负心，忠不顾死”，都一律加以赞美。\n\n但小说也反复强调“良禽相木而栖，贤臣择主而事”的思想，说明这种“忠”具有一定的开放性、灵活性。他们的“义”，又包含着“同心协力，救困扶危，上报国家，下安黎民”的精神，是与社会大义紧密相连的。\n\n（三）才能上崇智尚勇\n\n走出乱世，还得凭借军事上的实力和谋略上的成功。小说对于智与勇，都是予以歌颂的。比较起来，在描写三国间政治、军事、外交的错综复杂的矛盾斗争中，小说更突出了智慧的重要性。小说中的诸葛亮，不但是忠贞的典范，而且也是智慧的化身。魏国的曹操、司马懿，吴国的周瑜、吕蒙、陆逊，蜀国的庞统、姜维等，尽管也都长于计谋，但与诸葛亮一比，就都相形见绌。小说把他的谋略胜算写得出神入化，这无疑是寄托着人民的理想。\n\n二、“拥刘反曹”的思想倾向\n\n《三国志演义》把蜀国的刘备、诸葛亮、关羽等君臣作为理想中的政治道德观念的化身，仁君、贤相、良将的典范，而把魏国的曹操等作为奸邪权诈推行暴政的代表，具有贯穿始终的拥刘反曹倾向。而这一倾向一方面是作者封建正统观念的反映，另一方面也是受到了民间思想的影响。\n\n在民间流传的故事中，从来就有尊刘贬曹的倾向。究其原因，一是由于刘备是“帝室胄裔”，多少有点正统的血缘关系；二是刘备从来以“弘毅宽厚，知人待士”著称，容易被接受。特别是在宋元以来民族矛盾尖锐的时候，“人心思汉”“恢复汉室”，正是当时汉族人民共同的心愿，因而将这位既是“汉室宗亲”，又能“仁德及人”的刘备树为仁君，奉为正统，是最能迎合大众的接受心理，符合广大民众的善良愿望的。\n\n三、因理想的幻灭、道德的失落、价值的颠倒所感到的一种困惑和痛苦\n\n作者从儒家的政治道德观念出发，融合着千百年来人民大众对于明君贤臣的渴望心理，把刘备、诸葛亮等人作为美好理想的寄托。根据儒家的思维逻辑，“天道无亲，常与善人”或“天下土地，唯有德者居之”。但历史的发展恰恰是事与愿违：暴政战胜了仁政，奸邪压倒了忠义，全能全知、超凡入圣的诸葛亮竟无力回天！作者在全书结尾无可奈何地将这一场历史悲剧归结为“天意”或“天数”，流露了作者对于理想的幻灭、道德的失落、价值的颠倒所感到的一种困惑和痛苦。","keywords":"对昏君贼臣的痛恨 对明君良臣的渴慕 政治上向往“仁政”人格上重视道德 才能上崇智尚勇“拥刘反曹”困惑和痛苦","note":"《三国志演义》的思想内容显示着浓郁的市民精神文化特征，像是痛恨昏君贼臣，向往仁政这些，都反映着市民阶层的朴素愿望，尤其是“拥刘反曹”这一倾向，更是深受民间思想影响。但是，《三国志演义》的作者毕竟是一位真正的文人，他的精神世界必然也在这部作品中有所反映。因此可以说，《三国志演义》的思想内容正是民间思想与文人情怀相融合的产物。"},{"id":"348","stars":"★★★★★","title":"试分析《三国志演义》的艺术成就","body":"《三国志演义》之所以在文学史上占据极高的地位，不仅仅是因为其对于章回小说和历史小说的开创作用，更在于其高超的艺术成就，具体表现在以下方面：\n\n一、高超的叙事才能\n\n《三国志演义》“陈叙百年，该括万事”，人众事繁、矛盾复杂，却组织得有条不紊、主次分明，充分显示了作者的叙事才能。\n\n（一）将分头展开的故事化成以时间为序的线性流程\n\n小说在叙事时，将各个空间分头展开的故事化成以时间为序的线性流程。全书约可归纳为五条线：以汉亡为引线，以晋国一统天下为终局，中间的主线是魏、蜀、吴三方的兴衰。这几条线，此起彼伏，交互联络，建构成一个完整的艺术整体。\n\n在魏、蜀、吴三条线中，尤以魏、蜀两大集团的矛盾斗争为全书的主干；在写魏、蜀两方时，又以蜀汉的故事为重点。在写蜀汉时，则以诸葛亮为中心；在写诸葛亮时，更以隆中决策为关键。因此，在某种意义上说，小说用浓墨重彩所描绘的隆中决策就是全书的主脑，“其馀枝节，皆从此生”。这样的艺术构思，使全书的结构既宏伟，又严整；看来头绪纷繁，却又脉络分明。\n\n（二）故事详略得当，摇曳多姿\n\n在以时间为序的线性流程构架上，《三国志演义》又兼用了顺叙、倒叙、插叙、补叙等不同笔法，时而实写、明写、正写、详写，时而又虚写、暗写、侧写、略写，使全书的故事详略得当，摇曳多姿。\n\n二、“全景性军事文学作品”\n\n就所叙的事件而言，《三国志演义》以描写战争为主，可说是一部“全景性军事文学作品”。它描写战争的时间之长、次数之多、形式之多样、规模之宏大，在世界文学史中是罕见的。全书共写四十多次战役、上百个战斗场面，包容了这一历史时期所有重大的战役，写得各有个性，绝少雷同，充分显示了战争的多样性和复杂性。\n\n《三国志演义》描写战争，又突出智斗，特别是在写官渡之战、赤壁之战、彝陵之战等重大战役时，将错综复杂的政治斗争、外交斗争等交织在一起，重视写统帅部的运筹帷幄决胜千里，战略决策以及战术的运用。作者笔下的战争，多数并不表现得惨烈可怕，而如一曲英雄的史诗，在激扬高昂的格调中，往往洋溢着诗情画意。\n\n总之，这部小说中的战争描写，不是仅仅歌颂了力，更重要的是赞美了智，传递了美。\n\n三、“七实三虚”的艺术构思\n\n《三国志演义》采用“七实三虚”的艺术构思，成功处理了史实与虚构的关系。它的事件主干“皆排比陈寿《三国志》及裴松之注”，自然无悖于史实。其调动多种艺术手段，敷衍情节，刻画人物，则属虚构的成分。《三国志演义》的艺术虚构，有如下几种情况：\n\n首先是正史所无，纯属虚构的情节，如舌战群儒、智激周瑜等；其次是正史记载简略，《三国志演义》又加夸张与渲染，如三顾茅庐；最后是把正史所记某人之事，移花接木，张冠李戴，如张飞鞭督邮。\n\n从上述几种情况不难见出，《三国志演义》史事的夸张和情节的虚构准则有三：一是有利于更集中地表现人物性格；二是有利于情节的丰富多彩，生动感人；三是有利于美化和颂扬蜀汉集团及其人物。《三国志演义》之夸张与虚构，既有文学的意义，亦符合全书的思想倾向。\n\n四、创造了一批具有特征化性格的艺术典型\n\n《三国志演义》塑造人物形象的显著特点，即是突出甚至夸大历史人物的主要性格特征，舍弃性格中的次要方面，创造了一批具有特征化性格的艺术典型。\n\n这些艺术典型都具有鲜明的个性，又具有一定的“类”的意义。他们的性格特征一股都显得比较单一和稳定，有点像戏曲中程式化、脸谱化的表现，容易给读者以强烈、鲜明的印象；也有点近乎雕塑，在单一、稳定乃至夸张之中呈现出一种单纯、和谐、崇高的美。\n\n它适应并规范了古代读者的艺术欣赏趣味，所以使曹操、张飞、关羽、诸葛亮、赵云、周瑜、司马懿等众多的人物形象一直具有迷人的艺术魅力。《三国志演义》一书也就成了我国古代塑造特征化艺术典型的范本。\n\n五、语言简洁、明快、生动、有力，洋溢着一种阳刚之气，开始注意人物语言个性化\n\n《三国志演义》所用的语言是“文不甚深，言不甚俗”的浅近文言，这有利于营造历史的气氛；有时直接引用一些必要的史料，也能使读者“易观易人”，雅俗共赏，形成了一种适用于历史演义的独特的语体风格。它从讲史而来，故偏于叙述而少描写，其叙述语言以粗笔勾勒见长，简洁、明快、生动、有力，洋溢着一种阳刚之气。\n\n同时，《三国志演义》的人物语言已开始注意个性化，如在卷一《安喜张飞鞭督邮》中，张飞快人快语、嫉恶如仇，关羽心高气傲、思虑周全，刘备是非分明、心底宽厚都通过他们的语言表现了出来。","keywords":"高超叙事才能 以时间为序的线性流程 详略得当，摇曳多姿 全景性军事文学作品 七实三虚 特征化性格语言简洁、明快、生动、有力 阳刚之气 人物语言个性化","note":"《三国志演义》之所以令人着迷，直至今日还拥有众多拥趸，不仅仅是因为这部作品展现了一个异彩纷呈的时代，更是因为这部作品有着高超的艺术技巧。正是得益于作者出色的技巧，千百年流传下来的这些纷繁的故事才最终完美结构成这样一部名著。因此，这部分内容在考查中出现的频率非常高，大家一定要重点关注。"},{"id":"349","stars":"★★★","title":"试论述《三国志演义》中战争描写的特点","body":"《三国志演义》最擅长描写战争，它描写战争的时间之长、次数之多、形式之多样、规模之宏大，在世界文学史中也是罕见的。《三国志演义》战争描写的特点有以下几个方面：\n\n一、多方面反映了当时的战乱局势，充分显示了战争的多样性和复杂性\n\n《三国志演义》全书共写四十多次战役、上百个战斗场面，包容了这一历史时期所有重大的战役，写得各有个性，绝少雷同：或鸟瞰全局，或特写片断；或以寡敌众，或以强制弱；或设伏劫营，或围城打援；或江上水战，或陆上车攻；或强攻，或智取；以至火攻、水淹、马战，乃至徒手搏斗，表现各异。\n\n就战争规模而言，既有排山倒海的血战，更有惊心动魄的厮杀；既有旷日持久的对垒，又有短兵相接的速决；既有几十万上百万人参加的大战役，又有千百人出击的小战斗。\n\n就其战争范围而言，既有镇压黄巾起义的统治者与农民军的战争，又有各路诸侯之间争夺地盘的战争；既有造成“天下三分”原因的战争，又有形成一统归晋结局的战争；既有关于“三国”之间的战争，又有只反映某一方内部矛盾的战争。\n\n总之，《三国演义》描写战争是全面的，它从不同的规模、不同的范围、不同的角度反映了当时的战乱局势，充分显示了战争的多样性和复杂性。\n\n二、着重表现每次战争的不同条件，特别是具体条件下战略战术的运用\n\n《三国志演义》描写战争，不把主要笔墨花在单纯的实力和武艺较量上，而是着重表现每次战争的不同条件，特别是具体条件下战略战术的运用，突出智斗，特别是在写官渡之战、赤壁之战、彝陵之战等重大战役时将错综复杂的政治斗争、外交斗争等交织在一起，重视写统帅部的运筹帷幄决胜千里，战略决策以及战术的运用，突出战争指挥者主观指导的正确与否对战争成败的重要意义，因此它不仅描写了战争的丰富性和复杂性，揭示出战争的某些客观规律，而且得出了各次战争的特点。\n\n三、在激扬高昂的格调中洋溢着诗情画意\n\n作者笔下的战争，多数并不表现得惨烈可怕，而如一曲英雄的史诗，在激扬高昂的格调中，往往洋溢着诗情画意。有时在激烈的战争中又穿插着一些比较轻松的场面。如在赤壁之战的进程中，作者不吝笔墨，大写诸葛亮与鲁肃乘雾联舟、群英会蒋干中计、庞统挑灯夜读、曹操横槊赋诗等，把战争写得有张有弛，富有节奏感。总之，这部小说中的战争描写，不是仅仅歌颂了力，更重要的是赞美了智，传递了美。","keywords":"多样性 复杂性 不同条件 激扬高昂的格调 诗情画意","note":"《三国志演义》作为一部演义性的历史小说，堪称百年战争史，它艺术地再现了当时的战争画卷。在全书大小40多次战役、战斗中，既有战略策略上的斗争，又有实战战术上的描述；既有政治、外交、军事相结合的大战役大场面，又有单纯的两军对垒、布阵战斗的战地描写；既有错综复杂的智斗，又有跃马挥刀的决战......作者的生花妙笔，使一个个战争场面、无数个人物形象，生动地展现在读者的面前！更为巧妙的是在罗贯中的笔下，数十次战争变化多样，无一雷同，无不体现出各自的特点。相关内容可以参考吴国联《论＜三国演义＞的战争描写特色》，具体资料可以在李凡文学正版群内领取。"},{"id":"350","stars":"★★★★","title":"试分析《三国志演义》“七实三虚”的艺术构思","body":"《三国志演义》是我国第一部长篇历史小说，它在艺术上取得成功的基本条件，就是正确地处理了历史真实与艺术创造的关系问题，采用了“七实三虚”的艺术构思。\n\n所谓“七实三虚”，“七实”是指作品的主要框架、人物和事件是按照史书记载的真实情况来设计和组织安排的，从而给人以基本的历史真实感，《三国志演义》的事件主干“皆排比陈寿《三国志》及裴松之注”，自然无悖于史实；“三虚”是指在人物和时间的细节描绘上，尽量采用民间传闻中的精彩片段，并附之以作者本人的虚构想象，使之在不影响基本真实的前提下，最大可能地增强故事和人物的艺术魅力。《三国志演义》的艺术虚构，有如下几种情况：\n\n一、正史所无，纯属虚构的情节\n\n在诸葛亮的有关故事中，舌战群儒、智激周瑜、七星坛借东风、柴桑祭吊周瑜皆于史无证；失街亭虽为史事，空城计却属虚无。在关羽故事中，“暂归曹操”是实，“秉烛达旦”“过五关斩六将”“华容道义释曹操”为虚。值得注意的是，这些虚构的故事，在刻画人物方面，皆属精妙之笔，因而引人入胜，流传最广。\n\n二、正史记载简略，《三国志演义》又加夸张与渲染\n\n如刘备之访孔明，《三国志》只云：“先主诣亮，凡三往乃见。”《三国志演义》乃据“三往”二字，敷衍为曲折跌宕的“三顾茅庐”故事。《三国志》有建兴三年诸葛亮“率众南征，其秋悉平”的记载，《三国志演义》却因此衍成颇富戏剧色彩的“七擒七纵”的故事。《三国志演义》绝大多数情节，皆属此类。\n\n三、把正史所记某人之事，移花接木，张冠李戴\n\n如《三国志先主传》载：“（先主）除安喜尉。督邮以公事到县，先主求谒，不通。直入缚督邮，杖二百。解绶系其颈着马柳，弃官亡命。”裴注所引《典略》，记载更为详切。但在《三国志演义》，鞭挞督邮者变为张飞，且敷衍设色，描绘得有声有色。所以如此，乃在于这类行为，有损于刘备的宽厚形象，却更符合张飞的暴烈性格。\n\n从上述几种情况不难见出，《三国志演义》史事的夸张和情节的虚构准则有三：一是有利于更集中地表现人物性格；二是有利于情节的丰富多彩，生动感人；三是有利于美化和颂扬蜀汉集团及其人物。《三国志演义》之夸张与虚构，既有文学的意义，亦符合全书的思想倾向。","keywords":"七实三虚 纯属虚构 夸张与渲染 移花接木 张冠李戴","note":"学会使用虚构手法是小说创作的一大进步，而《三国志演义》更是出入于虚实之间，在史实的基础上恰当地进行虚构，极大地增强了人物的性格魅力和情节的精彩程度。因此，《三国志演义》“七实三虚”的手法，历来为人所称道。相关内容可以参考刘军《试论历史小说的虚构-兼谈＜三国演义＞虚构的得与失》，具体资料可以在李凡文学正版群内领取。"},{"id":"351","stars":"★★★★","title":"试分析《三国志演义》在人物塑造方面的艺术成就（25广西大学、26南昌大学）","body":"《三国志演义》塑造了一系列具有特征化性格的典型人物，这也是其艺术成就的重要组成部分。《三国志演义》在人物塑造上的成就，主要体现在以下方面：\n\n一、善用对比与烘托的手法\n\n《三国志演义》中重要人物的性格特点，大都在对比中得到突出的表现。如刘备与曹操，一个是仁明君主，一个是狡诈奸雄，这是一种反差极为强烈的对比。唯其如此，各自的性格特征才能在作品中得到充分的发挥。诸葛亮出山一节，通过徐庶、司马徽的赞美、推荐，三顾茅庐而两次不遇，一些亲友的歌吟谈吐，以及山林景色的幽雅清美，层层烘托了诸葛亮的高洁品格和绝世才能。\n\n二、在势均力敌的斗争中刻画人物\n\n《三国志演义》还注重写出矛盾双方都是有才有识的强者，从而把人物置于势均力敌的斗争中加以刻画，这是作品塑造人物的更为成功之处。\n\n《三国志演义》虽尊蜀为正统，但着力描写一大批魏、吴集团中的奇才，以此反衬出蜀汉人物的品格和才干。如在诸葛亮的前期活动中，他的对手是曹操和周瑜；在其后期活动中，他的对手又是老谋深算的司马懿。棋逢对手，方见英雄本色。\n\n三、在人物类型化的同时注重人物的个性特征\n\n《三国志演义》中的人物，大抵可分为若干类型。虽然如此，作者在每一类型中，又十分注重人物的个性特征。如同属乱世之奸雄，曹操性格偏于阳刚，司马懿性格则近于阴柔。故《三国志演义》人物虽分类型，性格并不雷同。\n\n四，反复皴染\n\n《三国志演义》在塑造人物时，围绕着人物性格的主要特征，多角度、多层次地加以强化、深化，使其性格在单一中呈现出丰富性、复杂性。如写曹操之凶残，连续写了他杀吕伯奢一家，杀粮官以欺全军；写他的奸诈，就写他不杀陈琳而爱其才，不追关羽以全其志；写他的雄豪，则写他棒责蹇硕之叔，献刀刺卓，矫诏讨卓。这样就把一个既专横残暴、阴险狡诈，又豪爽多智、目光远大的“古今来奸雄中第一奇人”写得血肉饱满。\n\n五、用传奇故事和生动的细节来凸显人物的性格特征\n\n《三国志演义》多用传奇故事和生动的细节来凸显人物的性格特征。这类笔墨一般从史书或传说中借鉴而来，具有一定的夸张性和理想化的色彩，虽然不一定能经得起生活真实的检验，但与整体的艺术效果却十分吻合。例如关羽斩华雄一节，最后当关羽提华雄之头掷于地下时，只点了一笔，战前酾下的热酒“其酒尚温”。这四个字，就不无夸张地凸显了关羽的神勇。\n\n六、出场定型\n\n如写刘备“与乡中小儿戏于树下”的非常言行，曹操少时诈“中风”以诬叔父，诸葛亮隐居隆中时的非凡抱负，都可以说是一种性格的“亮相”。\n\n【李凡关键词：对比烘托 势均力敌的斗争 注重个性特征 反复皴染 传奇故事 生动细节 出场定型】","keywords":"","note":"《三国志演义》在塑造人物时所用的手法比较复杂，集中体现了罗贯中人物塑造的高超技艺。不仅仅是曹操、诸葛亮、关羽这三个塑造得极为出色的角色，像是张飞、赵云、许褚、周瑜这些角色，我们一提起来，马上就可以在脑海中浮现出他们的形象、性格，《三国志演义》在人物塑造上取得的成就可见一斑，所以这部分内容我们要重点关注。"},{"id":"352","stars":"★★★★","title":"试分析《三国志演义》悲剧审美品格","body":"《三国志演义》弥漫全书的悲剧情绪在很大程度上得益于作者对悲剧冲突的梳理和把握，从而使读者可以感受到巨大的悲剧力量和崇高的悲剧精神。作为悲剧，《三国志演义》具有壮美与崇高的审美品格，而这主要通过以下方式体现出来。\n\n一、史诗性的宏伟结构\n\n《三国志演义》是一部描写三国时期重大政治、军事斗争的悲剧性作品，从时间上，它涵盖了三国一代近百年的斗争历史；从空间上，它从辽阔中原，写到东、西蜀，甚至南方不毛之地；从事件上，不仅反映了有关民族兴亡，国家安危的重大史实，军阀间纵横的斗争，而且细致描绘了人民的流离和百姓的饥态；从人物上，上至封建皇帝、台阁重臣、军队将帅，下至流离的饥民、隐士、医者，都有涉及。它“陈叙百年，该括万事”，在中国小说史上还没有哪一部作品以如此宏大的气势这般广阔地对一个时代历史做这样详尽的史诗般的呈现。\n\n二、独特的题材\n\n《三国志演义》以战争为主要题材，其中最为动人的无疑也是战争。在作者笔下，战争显得丰富多彩，千变万化，但气势的宏伟、氛围的肃杀、攻击的凌厉、争斗的严酷、声威的壮烈则是其主旋律。无论两阵对圆、二将出马的交关；短兵相接、刀剑交光的厮杀；火光冲天，人喊马嘶的混战，皆以其特有的魅力勾出一幅幅撼人心魄的图画，使人振奋、惊愕乃至恐怖，给人一种壮美、崇高之感。\n\n三、在严酷的环境与激烈的冲突中显示主体（人）精神道德力量的崇高\n\n（一）在激烈的冲突中展现悲剧人物精神的崇高\n\n《三国志演义》悲剧人物的崇高正是在冲突中呈现的。书中众多的“忠臣义士”，面对强暴，以身殉义，皆表现出一种不屈不挠的坚强意志，一种精神的崇高和壮美。\n\n（二）在特定环境中凸现悲剧人物道德的崇高\n\n如第二十五回中，“义重如山”的关羽被迫与曹操“约三事”而身陷曹营。这是一个非常独特的环境。在这个环境中，曹操得以有机会联络关羽，但他丝毫不为所动。正是在这特殊环境中的特殊行为，体现了关羽“威武不能屈、贫贱不能移”的高尚品质和道德。\n\n（三）在悲剧氛围中烘托悲剧人物品格的崇高\n\n《三国志演义》在描写悲剧人物的不幸结局时，善于渲染浓重的悲剧气氛，在悲剧氛围中显现人物品格的崇高。不论是刘备、关羽、张飞、还是诸葛亮，当他们受到外界的干扰而被毁灭的时候，正是我们对之给予最大同情的时候。","keywords":"壮美与崇高 史诗性宏伟结构 独特题材 激烈冲突 特定环境 悲剧氛围","note":"作为悲剧，《三国志演义》的悲剧审美品格显然不同于《长生殿》《桃花扇》等细腻、抒情式的品格，而是具有一种壮美与崇高之美；如果说后者的风格是“悲戚”的话，《三国志演义》则是“悲壮”。这种审美品格，则主要是通过史诗性的结构、独特的题材和在特定环境、激烈冲突中凸显悲剧人物这三种方式达成的。"},{"id":"353","stars":"★★","title":"请简述《水浒传》的成书过程","body":"《水浒传》的成书过程与《三国志演义》有相似之处，都是从历史资料和民间故事中汲取资源，并经历了文人改编。但《水浒传》的成书过程有其特殊性。总体来看，《水浒传》主要经历了如下成书过程：\n\n一、北宋时期：《宋史》中宋江起义的记载\n\n《水浒传》所写宋江起义的故事源于历史真实。《宋史》中的《徽宗本纪》《侯蒙传》《张叔夜传》及其他一些史料都曾提及，略谓徽宗宣和年间宋江等“三十六人横行齐魏”，“转略十郡，官兵莫敢撄其锋”，后被张叔夜设计招降。还有的史书记载宋江投降后征方腊。\n\n二、南宋时期：宋江故事在民间广为流传，《大宋宣和遗事》已展现《水浒传》原始面貌\n\n从南宋起，宋江的故事就在民间广泛流传。宋末元初人龚开作《宋江三十六人赞》已完整地记录了36人的姓名和绰号。同时代罗烨的《醉翁谈录》已著录了如“石头孙立”“青面兽”“花和尚”“武行者”等说话名目。这显然是一些独立的水浒“小说”。\n\n南宋末年，以《大宋宣和遗事》的产生为标志，水浒故事完成了第一次向长篇的过渡。从规模看，早期的水浒故事是短篇的英雄们各自独立地出现在不同的“小说”话本中，《大宋宣和遗事》将三十六人集中在一起，以提纲的形式形成了长篇“讲史”的规模。从结构形式看，《大宋宣和遗事》关注的主要是历史事件的发展，在结构上表现为以事件为中心来组织情节和描写人物。故此，《大宋宣和遗事》笔墨虽然简略，但已把水浒故事连缀起来，展现了《水浒传》的原始面貌。\n\n三、元代：“水浒戏”出现，水浒故事丰富多彩并正在逐步趋向统一\n\n元代出现了大批“水浒戏”，今存剧目（含元明间作）共33种，剧本全存的仅6种，其中至少有二十余种杂剧作品的题材为此后成书的《水浒传》所取用，即所谓“水浒戏”。它们对于宋江、李逵等形象的刻画比较集中，但性格不很一致，也无共同的主题，不过“三十六大伙，七十二小伙”“寨名水浒，泊号梁山”的说法大体相同。这说明宋元以来的水浒故事丰富多彩并正在逐步趋向统一，小说戏曲作家们纷纷从中汲取创作的素材而加以搬演。\n\n至元末明初，乃有作家在长期流传于民间的水浒故事的基础上编写而成长篇小说《水浒传》。","keywords":"北宋《宋史》记载 南宋 民间广为流传《大宋宣和遗事》元代“水浒戏”趋向统一","note":"《水浒传》的成书过程和《三国志演义》成书过程有相似之处，都是先在民间广泛流传，通过民间艺人的创作丰富故事内容，被搬上戏曲舞台，最终经过作者的再创作，彻底成型。不过与《三国志演义》多来源于历史资料不同，《水浒传》更多从民间故事中获取营养，大家可以将这两道题目对比记忆。"},{"id":"354","stars":"★★","title":"试述《水浒传》的版本","body":"《水浒传》的版本相当复杂，从文字的繁略、描写的细密来分，大致可分为繁本与简本两个系统。简本和繁本的区别，不在于回目的多少，而在于描写的详略、文词的繁简。繁本描写细致生动，简本则描写简略。目前多数学者认为，简本是繁本的节本，而不是由简本发展成繁本。这两大系统各自的特征主要表现在以下方面：\n\n一、繁本系统\n\n《水浒传》通行本均为繁本，以其回目的多少作为区分标准主要有百回本、百二十回本和七十回本。其主要区别是，七十回本（即金圣叹评改本）的故事至“梁山泊英雄大聚义”结束，无招安以后的情节；百回本除了包含七十回本的所有故事外，还有受招安、征辽、征方腊的情节；百二十回本除了包含百回本的所有故事外，还有征田虎、征王庆的情节。这三种版本中，百回本较为接近《水浒传》原著的面貌；至于征辽情节是否为原本所有，学界存在较大争议。\n\n在繁本系统中，一般认为，今存最早的较为完整的百回本是万历己丑天都外臣（汪道昆）序的《忠义水浒传》一百卷。另有万历三十八年容与堂刊《李卓吾先生批评忠义水浒传》，也是较早和较有名的百回本。繁本中的120回本，增加了平田虎和王庆的故事，在文字上与百回本略有不同，并也附有“李卓吾”的评语，故称《李卓吾先生批评忠义水浒全传》；明末金圣叹将120回本“腰斩”成70回本，砍去了大聚义后的内容，而以卢俊义一梦作结，名《第五才子书施耐庵水浒传》。由于它保存了原书的精华部分，在文字上也作了修饰，且附有精彩评语，遂成为清三百年间最流行的本子。\n\n二、简本系统\n\n简本系统中比较重要的有《忠义水浒传》和《水浒志传评林》。目前多数学者认为，简本是繁本的节本，而不是由简本发展成繁本。简本一般都有平田虎、王庆两传，但文字简陋、缺乏文学性，现在只是作为研究资料来使用。现存较早而完整的简本是双峰堂刊《水浒志传评林》。\n\n此外，《水浒传》曾与《三国志演义》合刊，题为《英雄谱》。此书有两种本子，一为明崇祯年间雄飞馆刊本《精镌三国水浒全书》，一为清代刊本《绣像汉宋奇书》，均别题《英雄谱》。《英雄谱》所收《水浒传》均系简本。\n\n【李凡说：《水浒传》的版本复杂且多样，目前比较统一的分类方式是根据文字繁略和描写细密程度分为繁本和简本这两大系统，每个系统中有各种不同的版本，这些版本回目数量不同，内容也有出入，不过基本可以囊括所有《水浒传》版本。需要注意的是简本是繁本的节本，而不是由简本发展成繁本。另外，袁行霈版教材提到，在明万历甲寅刊行的吴从先《小窗自纪》中有《读水浒传》一文，所载《水浒传》的内容与今知繁简各本多有不同，有人认为此“吴读本”是“古本”，甚至是“施耐庵的本”，然也有人认为是万历间后出的本子，迄今尚无定论。这一点大家要了解一下。】","keywords":"从文字的繁略、描写的细密来分 简本是繁本的节本 繁本系统 简本系统","note":""},{"id":"355","stars":"★★★★","title":"试分析《水浒传》的结构和主旨","body":"《水浒传》的主旨表达与其结构安排之间关系极为密切，具体来说，表现在以下方面：\n\n一、在情节安排上突出“官逼民反”\n\n《水浒传》的结构，其特点之一是，小说在情节安排上突出“官逼民反”，以表达批判现实政治的立场。\n\n宋元时代的水浒故事，一方面写了本来意义上的绿林好汉，另一方面又借以表达社会批判。《水浒传》成书时也照此办理，兼容二者，但加强了社会政治批判的意味。“官逼民反”与《水浒传》中的几组情节（如林冲、杨志的故事）对应，而且作品将“反”的原因明确直接地归结到“官”的头上，“官”是“施事者”，民是“受事者”。这样一个语义结构，给读者留下了这样一个印象：世上的动乱（“反”）是坏“官”胡作非为的结果。\n\n小说偶尔还借人物之口传达作者的这一意思，比如第二回，朱武说：“小人等三个，累被官司逼迫，不得已上山落草。”这类笔墨，意在为好汉们赢得同情，并且在部分读者中产生了效果，比如钱湘《续刻＜荡寇志＞序》就说：“且夫为盗者诚有罪矣，而迫之使盗，不尤重乎？”\n\n当然，“官逼民反”这一语义结构其实概括不了所有梁山好汉的命运，如卢俊义、张青、石勇就不属于“官逼民反”的范畴。因此，《水浒传》经由人物出场顺序的安排，在确立了“乱自上作”“官逼民反”的叙事基调之后，这才展开张青、卢俊义等人的故事，同时尽量不让张青、石勇等给读者留下鲜明的印象-由此可见《水浒传》作者的匠心和用意所在。\n\n二、以强烈的悲剧性写出了宋江义军的结局\n\n《水浒传》的结构，其特点之二是，小说完整地写出了宋江义军从星星之火到燎原再到“魂聚蓼儿洼”的过程，并以强烈的悲剧性写出了义军的结局。\n\n《水浒传》以“梁山泊英雄排座次”为坐标，分为前后两个部分。前面部分更多关注水浒英雄的个人命运，其中的若干主要人物如鲁智深、武松、宋江、林冲等都有相对独立的传记。后面部分集中笔墨写招安和征方腊的情节（征田虎、王庆部分为后人所增添，征辽是否原本就有尚存争议），而且再没有出现英雄独立的个人传记。\n\n从纯艺术的角度来看，这种结构形式是有矛盾的。可实际上，宋江义军因接受招安而导致悲剧发生，这是内涵极为深厚的一组情节。梁山好汉接受招安之后，以惨重牺牲为代价替朝廷立下了汗马功劳，却备受猜疑和迫害，宋江、卢俊义更是被直接害死。梁山英雄为朝廷建功立业，却落得这样的结局，这种浓郁的悲剧性发人深省。\n\n三、以列传体浓墨重彩地描写豪侠\n\n《水浒传》的结构，其特点之三是，小说对绿林好汉尤其是那些堪称豪侠的绿林好汉，多以列传体予以浓墨重彩的描写，并在描写中致力于豪侠精神的渲染。\n\n豪侠形象的描写和豪侠精神的渲染是《水浒传》分量最重的部分。在《水浒传》中，武松、鲁智深、李逵、石秀，路见不平，拔刀相助，是一类人物；晁盖、宋江、柴进，仗义疏财，结交天下好汉，又是一类人物。《水浒传》不写恋爱，只写英雄。\n\n侠这一社会阶层，实际上已不存在。但侠的精神、侠的气概，却作为一种人生境界进入文学作品中，成为了一种浪漫情怀和少年壮志的呈现。如鲁智深的狂放不羁的意气，摧枯拉朽的气概，自然淳朴的生命形态，正是体现出了豪侠精神，具有一种超越庸常的特殊魅力。\n\n此外，“义气”和“功夫”也是豪侠的两个特征，“义气”又更重要些。武松说过：“凭着我胸中本事，平生只要打天下硬汉，不明道德的人。”鲁智深“路见不平拔刀相助”，更为豪侠赢得了崇高声誉。那种仇必雪、恩必偿，言必信、行必果，仗义疏财、打抱不平的人生气象，带给读者的是一种超越凡俗的心理愉悦。\n\n【李凡关键词：情节安排 官逼民反 强烈的悲剧性 结局 列传体 豪侠】","keywords":"","note":"学校参考书目为马工程版《中国古代文学史》的同学们注意重点关注此题。《水浒传》的结构和主旨是密不可分的，小说正是希望通过结构安排，通过悲剧性的营造，通过列传体的形式去突出作品的主旨，表达丰富的思想内容。有些学校会直接提问“《水浒传》的结构和主旨是什么”，比如25年云南大学就考查到了一道差不多的题目，而有些学校则会让大家从主题和艺术两个方面评价金圣叹“腰斩水浒”的行为-这实质上也是在考查这部分内容，大家要明确这一点。"},{"id":"356","stars":"★★★★","title":"试分析《水浒传》的忠义思想","body":"宣扬忠义，是《水浒传》客观存在的思想倾向，可以说，《水浒传》就是作者为梁山英雄被误国之臣、无道之君一个个逼向绝路的现实深感不平，发愤而谱写的一曲忠义的悲歌。\n\n一、忠义思想的载体：宋江\n\n最能体现《水浒传》“忠义”思想的是宋江这一形象。宋江作为小说中的第一主角，就是忠义的化身。他的性格在既矛盾又统一的忠和义的主导下曲折地发展。从“义”字出发，他给晁盖通风报信，对他们被逼上梁山报以同情，“仗义疏财，济困扶危”，结交天下豪杰；从“忠”字出发，他不肯轻易落草，把“聚义厅”改成“忠义堂”，直到饮了朝廷药酒，死在旦夕，还表白自己的一片忠心。\n\n盖棺论定，宋江就是一个“忠义之烈”。《水浒传》作者以“忠义”为指导思想来塑造宋江，并描写了以宋江为首的一支“全忠仗义”“替天行道”的武装队伍。至于像叫嚷“招安招安，招甚鸟安”的李逵等，只是作为“忠义”的映衬而存在罢了。\n\n二、忠义思想的意义\n\n（一）揭露封建社会的黑暗\n\n《水浒传》在歌颂宋江等梁山英雄“全忠仗义”的同时，深刻地揭露了上自朝廷、下至地方的一批批贪官污吏、恶霸豪绅的“不忠不义”。从手握朝纲的高俅、蔡京，到称霸一方的江州知府蔡九、大名府留守梁世杰，直到横行乡里的西门庆、蒋门神，乃至董超、薛霸等爪牙走狗，相互勾结，狼狈为奸，把整个社会弄得暗无天日，民不聊生，不反抗就没有别的出路。于是，一批忠义之士不得不“撞破天罗归水浒，掀开地网上梁山”。《水浒传》作为一部长篇小说，第一次如此广泛而深刻地揭露了封建社会的黑暗，并揭示了“奸逼民反”的道理，是很有意义的。\n\n（二）表达对传统道德无法匡正现实的痛苦与悲哀\n\n在《水浒传》中，作者强调了是这样一个悲剧：“全忠仗义”的英雄不能“在朝廷”“在君侧”“在干城心腹”，而反倒“在水浒”；“替天行道”的好汉改变不了悖谬的现实，而最后还是被这个“不忠不义”的社会吞噬。作者在以“忠义”为武器来批判这个无道的天下时，对传统的道德无力扭转这个颠倒的乾坤感到极大的痛苦和悲哀，以至对“忠义”这一批判武器自身也表现出了一种深沉的迷惘。\n\n三、忠义思想的内涵\n\n“忠”与“义”从来就是中国古代儒家伦理观念中的重要范畴，自宋元以来在社会上特别流行。\n\n显然，“忠义”中有“为君”而符合封建统治集团利益的一面，但在“忠”字中也包含着“保境安民”“杀尽贪官”等爱国精神和民本思想。对“义”字的强调，更反映出社会道德规范的变化之后广大百姓的愿望和意志。传统的农业社会虽然十分重视维护宗法关系的基本规范“孝”，但对于那些离开土地的市民、商人等“三教九流”的人来说，维护异姓关系的基本规范“义”显得更为重要。\n\n总之，“忠义”的内涵本身就十分复杂，它以儒家的伦理道德为基础，但也融合着包括城市居民和江湖游民在内的广大百姓的愿望和意志。它不是蒙在《水浒传》外面的一层道德正义的保护色，而是能使小说被当时社会各阶层普遍接受的基本精神。","keywords":"载体 宋江 意义 揭露社会黑暗 表达痛苦与悲哀 内涵 爱国精神 民本思想 以儒家的伦理道德为基础 广大百姓的愿望和意志 基本精神","note":"相较于马工程版教材将结构与主旨纠缠在一起，袁行霈版教材则更关注《水浒传》中“忠义”这一主旨，故学校参考书目为袁行霈版教材的同学注意重点关注此题。《水浒传》最早的名字叫《忠义水浒传》，甚至就叫《忠义传》，“忠义”思想是《水浒传》重点想要表达的内容，这一主题贯穿全书。需要注意的是，这一思想虽然是儒家伦理道德观念中的重要范畴，但在宋元之后，随着时代的发展，它被注入了新的内涵。所以在《水浒传》中，作者才以这一思想为武器对社会进行批判。"},{"id":"357","stars":"★★★★★","title":"试分析《水浒传》的艺术成就","body":"无论是人物环境的渲染，人物典型化的高度，还是表现手法的多样等，《水浒传》都有自己独特的创造，比话本无疑又大大前进了一步。总体来看，《水浒传》的艺术成就，主要表现在以下方面：\n\n一、卓越的人物塑造成就\n\n《水浒传》最为突出的成就，无疑是在人物形象的塑造上。这主要表现为以下几点：\n\n（一）人物形象个性鲜明，各具风采\n\n《水浒传》中出现的人物形象多达数百，数量虽多，却极具区分度，其中堪称血肉丰满、个性鲜明的典型人物不下一二十个。在《水浒传》中，即便同属鲁莽、勇猛类型的人物，如李逵、鲁智深等，也是个性有别，风采各异。《水浒传》之所以能将众多的英雄写得性格鲜明，很重要的一点是注意多层次地刻画人物的性格。比如写鲁智深粗豪，有时候又写他的机智，写他的精细。这样就在“同而不同”之中显示了人物的个性特点。为了达到这一艺术效果，在具体手法上就常常故意创造类型相同的人物，描写冲突相似的情节，以犯中求避，相互映衬。如武松打虎后，又写李逵杀虎，又写二解争虎。\n\n（二）注意表现人物个性形成的原因\n\n《水浒传》不仅写出人物的不同个性，而且揭示其不同个性形成的原因。作者通过对各阶层人物和他们之间错综复杂的关系以及“逼上梁山”的种种情节的描写，真实地展现了北宋社会生活的恢宏画面。作者把所写人物置于这样的历史环境中，进而写出了各个人物的身份、经历、文化教养、现实遭遇和生活环境的迥然不同，这就直接或间接地揭示了人物个性形成的诸多因素。如李逵一无所有的贫苦农民出身，鲁智深提辖的经历，都是形成他们独特个性的主要因素之一。\n\n（三）善于从发展变化中刻画人物\n\n《水浒传》不仅合情合理地写出人物性格变化的历史环境、经历和遭遇，还能将变化了的人物性格生动准确地展现出来。如作者描写林冲，一出场便把他置于妻子被“本管高衙内”调戏的冲突之中，表现了他安于现状、怯于反抗的性格特点。接着写他被高俅阴谋陷害，刺配沧州，野猪林几乎遇害，到沧州安分为囚，他都是逆来顺受，一再隐忍。然而当火烧草料场，手刃陆谦、富安之后，他的性格由“忍”发展到“狠”，先前安分守己、委曲求全的林教头，一变而为桀骜不驯、敢作敢为的造反英雄。这在火并王伦之时表现得更为突出。林冲性格的发展变化，堪称最成功的例证。\n\n（四）多姿多彩的人物塑造手法\n\n在塑造人物的一些具体手法上，《水浒传》也有高超的艺术技巧。作者十分注重人物出场亮相的描写，往往让人物一出场就处于尖锐复杂的矛盾冲突之中。例如鲁达一出场，就写他搭救金氏父女，三拳打死镇关西，给读者形成强烈的“第一印象”，有扣人心弦、引人入胜之妙。作者还十分注重构思有力度的动作性情节，以表现人物的英雄气概。如武松打虎，鲁智深倒拔垂杨柳，石秀跳楼......均以夸张的笔法，增饰人物的传奇色彩，使人物形象更加鲜明突出。《水浒传》塑造人物的艺术多姿多彩，其成功的经验，为我国小说艺术的进步和发展，作出了重大贡献。\n\n二、注重细节描写\n\n卓越的细节描写，是《水浒传》对小说艺术的一大开拓。《水浒传》由“小说”演变而来，不仅长于叙述，更长于描写，特别是在细节描写方面，取得了超越前代的出色成就。如写武松景阳冈打虎，虎的“一扑”“一掀”“一剪”“一兜”，武松的“一闪”“一躲”“又闪”“一棒”，写得明明白白，细致入微。一幅人虎相搏的惊心动魄场面，逼真而清晰地呈现在读者面前，令人有亲临目睹之感，大大增强了作品的艺术感染力。通过这样的细节描写，武松的勇猛神威得到了淋漓尽致的表现。\n\n三、单线纵向连环推进的独特结构\n\n《水浒传》的情节结构是以单线纵向进行的。上半部是以人为单元，下半部则以事为顺序，连环钩锁，层层推进。在七十一回之前，小说往往集中几回写一个或一组主要人物，将其上梁山前的业绩基本写完，然后引出另一个或另一组主要人物，而上一组人物则退居次要的地位。这样环环相扣，以聚义梁山为线索将一个个、一批批英雄人物串联起来。七十一回之后，就以时间为顺序，写两赢童贯、三败高俅、受招安、征辽国、平方腊，以报效朝廷为主干将故事贯穿始终。这样的艺术结构，前半部犹如长江的上游百川汇聚，形成主干；下半部则如长江的主流奔腾而下，直泻东海。它形成一个整体，但各部分往往又具有相对的独立性，特别是前半部的连环列传体的结构形式，固然留有组织改造原有民间故事的痕迹，但也有利于集中笔墨、淋漓酣畅地描写一些主要的英雄豪杰。史进、鲁智深、林冲、杨志、宋江、武松等一些英雄之所以能“千古若活”，与此不无关系。\n\n四、出色的语言艺术\n\n《水浒传》是我国第一部全用通俗口语写成的长篇小说。它标志着古代通俗小说语言艺术的成熟。《水浒传》的语言艺术，主要表现以下方面：\n\n（一）生动活泼，富有生活气息\n\n《水浒传》的语言生动、活泼，极富表现力，充满生活气息，不同于《三国演义》的文白夹杂和带有较多的书卷气。这是因为《水浒传》源于“小说”，自然具有口语化的特点；其所写又多为市井人物，市井生活口语为其当行本色。\n\n（二）人物语言性格化\n\n《水浒传》的语言虽为市井口语，但并非原始状态的“通俗热闹文字”。它经过了民间艺人的加工和天才作家的锤炼，在艺术上取得了非凡的成就。人物语言的性格化，或者说性格化的语言，是《水浒传》语言艺术最突出的特点，也是它塑造人物形象、表现个性特征的重要手段。如写宋江开口，十之八九，必讲忠义；李逵出言，一片天真，憨直可笑。\n\n《水浒传》无论写人叙事，还是描景状物，其语言或细腻，或简捷，或夸张，或明快，都显得粗犷俊爽，雄健豪放，具有壮美的风格特点。在中国古代长篇小说中，《水浒传》是运用日常口语达到炉火纯青艺术境界的典范。\n\n五、悬念手法生活化\n\n《水浒传》作者对悬念的兴趣建立在乐于和读者捉迷藏这样一种纯粹小说家的心态之上，这就造成了《水浒传》悬念手法的广泛采用和生活化倾向。和《三国志演义》一样，《水浒传》也注重悬念的设计，但不再采用锦囊妙计和“如此如此”的方式，而是更加生活化，泯除了技巧的痕迹，在艺术上臻于更高的境界。\n\n比如第二十八回《武松威震安平寨 施恩义夺快活林》。武松来到牢城营，因武松不肯托人情，还口口声声与差拨抬杠，牢友们都料定他“晚间必然”被“结果”，不曾想却被盛情款待。不仅众囚徒百思不得其解，武松也百思不得其解；不仅武松百思不得其解，读者也同样百思不得其解。\n\n瞒住武松是表面的现象，瞒住读者才是作者的真实目的。能成功地瞒住读者，引发读者的牵挂和往下读的欲望，这就是悬念的作用。《水浒传》有意瞒住读者，却又没有故意设置悬念的痕迹，这是作者的高明之处：仿佛在顺其自然地展示生活，其实是精心制造悬念，这是一种不易达到的境界。\n\n六、传奇性与现实性交融\n\n《水浒传》中的英雄好汉与《三国志演义》中的帝王将相一样，尚不脱“超人”的气息。作者在将英雄理想化时，往往把他们渲染、放大到超越常态的地步，如鲁达倒拔杨柳、武松徒手打虎、花荣射雁、石秀跳楼等，都带有传奇的色彩。但与此同时，作者又把超凡的人物放置在现实生活的背景上，让他们在李小二、武大郎、潘金莲、阎婆惜、牛二等市井细民中周旋；在用重彩浓墨描绘高度夸张、惊心动魄的故事时，也注意在细节真实上精雕细刻，逼近生活；这样就使传奇性与现实性结合起来，增强了作品的生活气息和真实感。","keywords":"人物塑造 个性鲜明 表现个性形成原因 从发展变化中刻画人物 多姿多彩的人物塑造手法 细节描写 单线纵向连环推进的独特结构 出色的语言艺术 富有生活气息 人物语言性格化 悬念手法生活化 传奇性与现实性交融","note":"《水浒传》是在话本的基础上发展出来的，因而在语言上继承了话本的传统；但是和宋元话本比起来，小说又有所发展，这表现在多个方面。即便是与同为“四大名著”的《三国志演义》相比，《水浒传》的艺术成就也更高一筹。这部分内容虽然很多，但都很重要，大家要认真对待。其中，《水浒传》的人物塑造艺术这一部分可能会单独出题，大家要注意一下。"},{"id":"358","stars":"★★★★★","title":"试比较《三国志演义》和《水浒传》的异同","body":"《三国志演义》和《水浒传》分别是历史演义小说和英雄传奇小说的典型代表，二者创作时代相近，这使两者在创作上有某些相似之处，但由于所表现的具体内容不同，所以两部小说在思想内容与艺术成就上也存在着不少差异。具体来说，表现在以下方面：\n\n一、思想内容\n\n（一）都歌颂“义”，但具体内涵不同\n\n三国英雄讲义气，虽然同样是出于对个人情感价值的选择，但那是受上层社会价值判断的影响的，至多危及集团的利益，而不致危及封建秩序本身，例如关羽之在华容道上释放曹操。\n\n水浒英雄的义气则是下层社会中人与人之间的情感沟通、气味相投，《水浒传》歌颂了建立在个人感情之上的友谊与义气。例如鲁智深为救林冲而大闹野猪林，宋江为义气而放走晁盖。为了朋友间的义气，他们可以置官府法律与社会道德于不顾。因而有可能危及封建的社会秩序本身。\n\n（二）都体现了维护自我尊严的要求，但具体程度不同\n\n《三国志演义》虽已在若干人物身上体现了维护自我尊严的要求，却还看不到对个性自由的哪怕是某种程度上的愿望。\n\n在水浒英雄身上则表现出了不愿压抑自我，忍受不了束缚和欺凌，要求在某种程度上张扬个性的倾向。这一特点在鲁智深、武松、李逵等人身上表现得尤为明显。他们不仅自己不愿受压抑和欺凌，还容不得别人受人欺凌，遇到别人受欺凌时，往往会路见不平，拔刀相助。如鲁智深看到金翠莲受恶霸郑屠的凌辱逼迫，就毫不犹豫地挺身而出，打死郑屠，救出金翠莲。\n\n（三）表现的内容不同\n\n《三国志演义》描写的是上层统治集团之间的军事、政治争斗。\n\n《水浒传》表现的是众多英雄走上梁山或被逼上梁山的过程，这也是他们反抗社会的过程，从中反映了个人与社会之间的矛盾冲突。\n\n二、艺术手法\n\n（一）都善于在故事情节叙述中描写人物，但精彩程度不同\n\n《水浒传》与《三国志通俗演义》所写的都是英雄故事，并善于在故事情节的叙述中描写人物，但比较而言，《水浒传》所写的故事比《三国志通俗演义》中的故事更精彩、更生动，在故事中所展示的社会矛盾也更复杂、更尖锐。无论是武松的故事或是三打祝家庄的故事，都较《三国》中的精彩故事更引人入胜。因为《三国》的故事一般是一组矛盾，因而比较单纯；《水浒传》中故事则是多种矛盾的组合，且包含着矛盾的转化，因而其情节容易展开，内容也更为丰满。\n\n（二）都使用悬念手法，但具体目的不同\n\n无论是《三国志演义》，还是《水浒传》，都受到民间说话的影响，表现出对悬念的兴趣。但由于《三国志演义》和《水浒传》的总体氛围不同，《三国志演义》仅仅在表现诸葛亮时使用悬念技巧，目的是把他塑造成为神奇莫测的人物，悬念技巧本身并不为历史演义作者所看重，这就造成了《三国志演义》悬念手法的非生活化倾向。与此形成对照，《水浒传》作者对悬念的兴趣建立在乐于和读者捉迷藏这样一种纯粹小说家的心态之上，这就造成了《水浒传》悬念手法的广泛采用和生活化倾向。\n\n（三）在情节展开上，《三国志演义》偏重于朴实粗略，而《水浒传》则注重细节\n\n在情节展开方面，注重细节描写的《水浒传》与粗线条的《三国志演义》正好形成对照。三国故事在民间流传已久，并确已产生了大量的异于历史记载的故事，但是，既然有着详备的史籍可供依傍，罗贯中便有意剔除了民间说话和戏曲中的许多情节，而偏重于朴实地重述历史事件。《水浒传》的作者没有充足的史籍可供依傍，他只能采用民间传说和戏曲提供的情节。这样，他在表达上面临的困难远比罗贯中要大：《水浒传》是虚构的，它必须从两个方面满足读者的审美需要，一是具有可与历史事实抗衡的真实感，二是具有可与历史事实抗衡的吸引力。因此，他以遒劲的风格展开英雄们被逼上梁山的历程，细节的丰富和高度戏剧性创造出引人入胜的情趣。\n\n（四）语言上，《三国志演义》多半文半白，《水浒传》则口语化\n\n《水浒传》源于“小说”，自然具有口语化的特点；其所写又多为市井人物，市井生活口语为其当行本色。而《三国演义》源于“讲史”，自然与史书关系密切；其所写人物又多为帝王将相，所以语言风格与《水浒传》大不相同。与在情节上依傍史籍相一致，罗贯中在语言上也直接或稍加通俗化而沿用史籍中的语言，结果形成半文半白的语言风格。《水浒传》的作者没有这种便利，他不得不揣摩说书人的口气进行创作，从而使《水浒传》成为我国第一部以北方方言为基础的白话长篇小说。","keywords":"思想内容 歌颂“义”内涵不同 维护自我尊严 程度不同 表现的内容不同 艺术手法 在故事情节叙述中描写人物 精彩程度不同 悬念手法 目的不同 情节展开 朴实粗略 注重细节 语言 半文半白 口语化","note":"《三国志演义》和《水浒传》分别是历史演义小说和英雄传奇小说的代表，二者创作时代相近，又很有可能都经过罗贯中之手，并同为四大名著之一，因而很可能被放在一起进行对比，从中我们也可以看到历史演义小说和英雄传奇小说之间的区别。相较于《三国志演义》，《水浒传》在思想内容上更多地体现出了市民阶层思想内涵，在艺术上则有了更进一步的发展。"},{"id":"359","stars":"★★★","title":"试论述《水浒传》中宋江的性格及其文化内涵","body":"宋江谱写的是一曲忠义的悲歌。作为书中主人公，他有着鲜明的性格特点和丰富的文化内涵。\n\n一、宋江的性格特点\n\n（一）是忠义的化身，性格在“忠”“义”的矛盾统一中曲折发展\n\n宋江作为小说中的第一主角，就是忠义的化身。他的性格在既矛盾又统一的忠和义的主导下曲折地发展。他作为一个县衙小吏，能“仗义疏财，济困扶危”，结交天下豪杰，但又有忠君孝亲、安于现状的习性。\n\n从“义”字出发，宋江帮助他人“排难解纷”，“济人贫苦，周人之急，扶人之困”，能在这些英雄们落难的时候、最需要帮助的时候及时伸出援手，甚至“担着血海也似干系”救晁盖，也同情他们被逼上梁山。\n\n同时，宋江总以忠、孝来约束自己。如他对晁盖等人上梁山的看法是“于法度上却饶不得”，不肯轻易上梁山，浔阳楼题反诗后不得已上了梁山，却以“替天行道，为主全忠仗义，为臣辅国安民去邪归正”为宗旨，直到饮了朝廷药酒，死在旦夕，还表白自己的一片忠心。\n\n（二）领袖气质\n\n作为义军领袖，宋江有他的特点和长处：他为人又精明练达，懂得斗争策略，并有相当广泛的社会关系，上至官僚地主，下至江湖好汉，多和他有深厚的情谊。同时，宋江有着“识人”之能，作为一个领袖，麾下聚拢着一大批得力的助手，人尽其才。他能把大部分梁山好汉紧密地团结在他的周围并不是偶然的。作为梁山好汉的首领，领袖人格是《水浒传》中宋江形象的基本特征。\n\n二、宋江形象的内涵\n\n（一）忠义思想的载体，体现了作者的价值取向\n\n从整体来看，宋江就是一个“忠义之烈”，《水浒》作者是以“忠义”为指导思想来塑造宋江，并描写了以宋江为首的一支“全忠仗义”“替天行道”的武装队伍。这样看来，宋江这一形象就是作者所极力弘扬的忠义思想的载体，是《水浒传》全书的中心人物，是体现全书的主旨的惟一中心。正是他、他的命运体现了作者对于故事思想倾向的设定、安排，体现了他的价值取向。\n\n（二）全书结构的中心，是由个人反抗发展为武装割据的标志\n\n宋江是全书故事的中心，所有人物的中心。我们看，宋江虽然在书中出现得比较晚，但是，无论是早出现的人物还是后来出现的人物，几乎没有什么人不是早早地就知道宋江。在《水浒传》中，朱仝、徐宁、卢俊义、关胜等全是在宋江的策划下先后上了梁山的。一百单八条好汉中，因宋江而上梁山的居于主导地位。只有到宋江上了梁山，梁山才稳定下来，逐渐兴旺发达。所以，宋江这个人是所有梁山英雄的中心、领袖。\n\n也正是有了这样一个宋江，才有义军的空前壮大，才有“梁山泊英雄排座次”。从这个角度来看，宋江上梁山是英雄们由个人反抗发展为大规模武装割据的标志，他是一个功能性人物，也是一个标志性人物。","keywords":"性格特点 忠义化身 矛盾统一中曲折发展 领袖气质 内涵 忠义思想的载体 价值取向 全书结构中心 个人反抗发展为武装割据的标志","note":"宋江的性格和文化内涵是文学考研的经常考查内容，宋江身上最突出的性格特征便是“忠”和“义”，而忠义思想则是作者极力想表达的东西；而在结构上，宋江这一角色联系着诸多好汉，他上梁山也是梁山走向繁荣的标志。由此看来，无论是从内容上还是从结构上，宋江都是全书的中心，对此我们要掌握。相关内容可以参考叶兴才《（水浒传）宋江形象分析》，具体内容可以在李凡文学正版群中领取。"},{"id":"360","stars":"★★★","title":"试分析《水浒传》的历史地位","body":"《水浒传》上承《三国志演义》，下启《金瓶梅》，在文学史上具有重要地位，具体来说，表现在以下方面：\n\n一、进一步发展了市民意识\n\n在《三国志通俗演义》中已经显露出初步的市民意识，这种市民意识在《水浒传》中有了进一步的发展。《水浒传》所写的英雄们对物质欲望的追求，享乐的意识，不甘受束缚的自我要求，以及较强烈的反抗精神等，都不见于《三国志演义》；因而，其所反映的市民阶层的愿望和理想都较《三国志演义》强烈。同时，《水浒传》所写的英雄们平凡的人生欲望，也使人们更感到亲切可近。从《三国志演义》到《水浒传》，再到《金瓶梅》，我们可以看到市民意识的不断增强，看到市民性在中国文学史上的发展脉络。\n\n二、推动了人物描写从类型化向性格化发展\n\n在人物描写上，《水浒传》体现了从类型化向性格化发展的趋向。武松、鲁智深、李逵等人物具有了多层次的性格特征。当然，对《水浒传》人物描写的性格化程度也不应夸张过度，在其所写的一百零八位英雄中，有特色的只有少数人，大多数的人性格还不够鲜明。应该说，《水浒传》的人物描写比《三国志通俗演义》有了进步，而《金瓶梅》在人物描写上的成就实较《水浒》更为突出。但它比《水浒》要晚一百数十年。所以，《水浒传》在人物描写方面所起的推进作用理应受到重视。\n\n三、是第一部以较成熟的白话文写成的文学作品，为文学开辟了一个新的世界\n\n《水浒传》是我国历史上第一部以较成熟的白话文写成的文学作品。其文字生动而精练，无论抒情叙事，皆能得其窍要，较之那些仅能粗述梗概的白话作品固然远胜，就是较之以文言写的叙事名篇，也别具胜场-由于其委曲周至且富于形象性，能给予读者以这些文言名篇所无法给予的感动。在《水浒》以后，近世文学中的白话文学作品在质量上已不弱于同期的文言作品，甚或有所超越。\n\n《水浒传》由于白话的成功运用，在形式上也为文学开辟了一个新的世界，使它得以生动真切、不失原貌而删其繁冗、突出神髓地展现人物的内心世界、行为动作及其所置身的环境，从而承担起近世文学所要求的描写在新的历史阶段出现的个人强烈感情及其与环境的剧烈冲突的任务。\n\n四、是后世戏剧、小说等多种文学样式题材的渊薮\n\n《水浒传》盛行以后，各种文学艺术样式都把它作为题材的渊薮。以戏剧作品而言，明清的传奇就有李开先的《宝剑记》、陈与郊的《灵宝刀》、沈璟的《义侠记》、许自昌的《水浒记》、李渔的《偷甲记》、金蕉云的《生辰纲》等三十馀种。昆曲、京剧和各种地方戏中都有许多深受群众欢迎的《水浒》剧目，如陶君起的《京剧剧目初探》就著录了67种。至于以《水浒》故事为题材的绘画、说唱及各种民间文艺等，更是不可胜数。\n\n小说作品中，世情小说《金瓶梅》就是“从《水浒传》潘金莲演出一支”。清代又出现了《水浒后传》《后水浒传》和《结水浒传》（《荡寇志》））等续书。后世的侠义小说如《三侠五义》等虽然其命意另有所在，“而源流则仍出于水浒”。当然，《水浒传》作为英雄传奇小说的典范，对于诸如《杨家府演义》《大宋中兴通俗演义》《英烈传》等作品的影响更是显而易见的。","keywords":"发展市民意识 推动人物描写向性格化发展 第一部以较成熟的白话文写成的文学作品 开辟了一个新的世界题材的渊薮","note":"《水浒传》的历史地位，首先是对于小说尤其是长篇白话小说发展的重大推动作用，《水浒传》的作者开始把目光投向市井社会、日常琐事和平凡的人物，注重刻画人物性格的层次性、流动性，并纯熟地使用了白话，多方面地推进了中国古代长篇小说艺术的发展。同时，这部作品还成为了许多戏剧、绘画等艺术题材的渊薮。"},{"id":"361","stars":"★★★★","title":"请阐述你对金圣叹“腰斩水浒”这一行为的看法","body":"金圣叹将《水浒传》120回本“腰斩”成70回本，砍去了大聚义后的内容，而以卢俊义一梦作结，名《第五才子书施耐庵水浒传》。金圣叹这一行为一定程度上损害了作品的完整性，但也取得了独特的效果，具体表现在以下方面：\n\n一、损害了《水浒传》内容的完整性\n\n《水浒传》以“梁山泊英雄排座次”为坐标，分为前后两个部分。前面部分更多关注水浒英雄的个人命运，其中的若干主要人物都有相对独立的传记。后面部分集中笔墨写招安和征方腊的情节，而且再没有出现英雄独立的个人传记。从纯艺术的角度来看，这种结构形式是有矛盾的。正是鉴于这一事实，明末清初的金圣叹删掉了招安之后的情节，保留以英雄传记为主体的部分，其结构形式更为统一。\n\n不过，金圣叹腰斩《水浒传》，也导致了《水浒传》内容上的显著缺憾。宋江义军因接受招安而导致悲剧发生，这是内涵极为深厚的一组情节，却因金圣叹的腰斩而被抹杀了，一支义军的完整历史也因其腰斩得不到真实的反映。\n\n二、突出了小说本文的审美价值与艺术技巧\n\n腰斩行为本身使金圣叹头脑中的封建正统思想和《水浒传》本文中的离经叛道倾向在相互妥协的过程中同时被弱化，小说本文的审美价值与艺术技巧则吸引了读者与批评家绝大部分的注意力，从而获得了置于前景的突出地位。这一过程同时也是“文载道”“诗言志”的传统文学观被迫让位于以审美趣味与艺术技巧为价值体现的新文学观的过程。把《水浒传》《史记》《西厢》《庄子》《离骚》及《杜诗》相并列虽说有因袭前人之嫌，但从文学观念上以“才子书”打破“圣贤书”一统天下，肯定读才子书的精神性审美享受之价值，金圣叹却功不可没。\n\n三、突显了《水浒传》作为经过加工的民间创作狂欢化的复调思想价值\n\n金圣叹是一个思想极为复杂的人物，一方面浓厚的封建正统意识成为他“腰斩”《忠义水浒传》的基本动因，另一方面，晚明时期思想界“天崩地裂”的巨大变化，身处下层、穷困贫窘的个人生活境遇，又促使他对《水浒传》中体现下层民众愿望、理想与幸福追求的美学倾向有强烈的心理共鸣。如果说《水浒传》中聚义、招安、征腊的叙事线索，“替天行道”的思想旗帜，忠孝仁义的宋江，是统摄全书三位一体的核心，有着把各自独立的人物、事件融汇聚合为一个有机整体的结构功能，那么，金圣叹的“腰斩”则消解了这个有着统摄融聚功能的核心，使得包括宋江在内的各主要人物之身世、经历、人格及价\n\n值观念的相对独立与平等地位得到最大限度的突显，使《水浒传》中原本具有的狂欢性艺术情调与复调性思想意蕴得到最大限度的突显。\n\n★★362．结合《三国志演义》与《水浒传》论述“历史演义”与“英雄传奇”的异同（25黑龙江大学）★★★★★\n\n一、相同点\n\n（一）都来源于“说话”艺术的讲史\n\n历史演义小说与英雄传奇小说相同之处在于都来源于“说话”艺术中的讲史，在民间流传的基础上由文人加工而成，都有一定的历史因素。如《水浒传》《三国志演义》的成书过程与就有相似之处，二者都是从历史资料和民间故事中汲取资源，并经历了文人改编。\n\n（二）都表现出作者政治理想和思想倾向，它们的成书同样经历了一个漫长的传说和演变的过程\n\n如从《三国志》到《三国志演义》成书，经历了一个漫长的过程；《水浒传》中的故事在南宋已有雏形，但到元末明初才成书。前者寄托了作者对贤君明臣的向往之情，后者则表现了作者对“忠义”思想的追求，并且二者都从侧面表现了对社会黑暗的批判。\n\n二、不同点\n\n（一）具体来源不同\n\n历史演义小说一般是由“讲史”话本演化而成，而英雄传奇小说是从宋元小说话本中的“说公案”或“说铁骑儿”之类发展而来。\n\n（二）表现内容不同\n\n历史演义小说着眼于全面地描写一代兴废，而英雄传奇小说以塑造一个或几个传奇式的英雄人物为重。\n\n（三）虚实比例不同\n\n历史演义小说比较注重依照史实，英雄传奇小说的故事虚多于实，甚至主要出于虚构。\n\n历史演义小说是根据史实，敷演大义，在叙事中融进作者的生活体验和思想感情，并对历史事件和历史人物进行政治和道德评价的小说，既有史实的依据，又进行了艺术的加工和创造；既有纪实的成分，又有艺术的想象和虚构。如《三国志演义》就是以三国时期的历史为内容的一部长篇历史小说，它既不同于历史著作，也不同于纯出于虚构的一般的小说。《三国志演义》“七实三虚”，描写的是相当长的一个历史阶段的基本历史发展轮廓，重大的历史事件，主要人物的重要活动，都符合历史的真实面貌，只是在具体的情节、细节、人物的思想性格方面，有较多的加工和虚构。\n\n英雄传奇小说以历史英雄人物为讲说对象，更多来自历史传说，虚构的成分比较大，如《水浒传》描写的时期并不长，它是横向扩展，不注重于历史发展的过程，不拘泥于历史事件本身，而广泛地反映某一个历史时期的社会生活。这类小说，可称之为“英雄传奇”。其特点是由历史上的一时故事生发开来，反映的生活内容，从纵向看不如历史演义那么长，但从横向来看，却比历史演义反映的生活面要广阔得多，几乎涉及各个阶层的人物，特别值得注意的是描写了市井小民的生活，在描写中又有较多的艺术创造和虚构。如《水浒传》中的一百零八位领袖人物，就绝大多数是虚构的，只有宋江、杨志等十几个人物能找到历史的依据，而且活动也不尽相同。","keywords":"损害完整性 突出审美价值与艺术技巧 突显复调思想价值\n相同点 来源于讲史 表现出政治理想和思想倾向 漫长的传说和演变的过程 不同点 具体来源 表现内容 虚实比例","note":"金圣叹在中国文学批评史上占据重要地位，这很大程度上得益于其对《水浒传》的批评。而在这之中，金圣叹“腰斩水浒”这一行为无疑引起了很多争议，许多学校也会专门针对这一行为进行考查。毫无疑问，“腰斩水浒”这一行为损害了文本内容的完整性，但也一定程度上突出了作品的思想艺术价值，对此我们要辩证地看待。相关内容可以参考崔茂新《从金评本＜水浒传》看“腰斩”问题》，具体资料可以在李凡文学正版群领取。“腰斩水浒”这一概念也可能会以名词解释的形式考查，大家要注意一下。\n历史演义与英雄传奇这两种小说类型的代表作品大致于同一时间出现，都对后世小说创作产生了重要影响，其成书过程也有许多的相似之处，故而往往会放在一起进行对比。大家可以结合《三国志演义》和《水浒传》这两部十分具有代表性的作品进行分析。"},{"id":"362","stars":"★★★★★","title":"结合《三国志演义》与《水浒传》论述“历史演义”与“英雄传奇”的异同（25黑龙江大学）","body":"一、相同点\n\n（一）都来源于“说话”艺术的讲史\n\n历史演义小说与英雄传奇小说相同之处在于都来源于“说话”艺术中的讲史，在民间流传的基础上由文人加工而成，都有一定的历史因素。如《水浒传》《三国志演义》的成书过程与就有相似之处，二者都是从历史资料和民间故事中汲取资源，并经历了文人改编。\n\n（二）都表现出作者政治理想和思想倾向，它们的成书同样经历了一个漫长的传说和演变的过程\n\n如从《三国志》到《三国志演义》成书，经历了一个漫长的过程；《水浒传》中的故事在南宋已有雏形，但到元末明初才成书。前者寄托了作者对贤君明臣的向往之情，后者则表现了作者对“忠义”思想的追求，并且二者都从侧面表现了对社会黑暗的批判。\n\n二、不同点\n\n（一）具体来源不同\n\n历史演义小说一般是由“讲史”话本演化而成，而英雄传奇小说是从宋元小说话本中的“说公案”或“说铁骑儿”之类发展而来。\n\n（二）表现内容不同\n\n历史演义小说着眼于全面地描写一代兴废，而英雄传奇小说以塑造一个或几个传奇式的英雄人物为重。\n\n（三）虚实比例不同\n\n历史演义小说比较注重依照史实，英雄传奇小说的故事虚多于实，甚至主要出于虚构。\n\n历史演义小说是根据史实，敷演大义，在叙事中融进作者的生活体验和思想感情，并对历史事件和历史人物进行政治和道德评价的小说，既有史实的依据，又进行了艺术的加工和创造；既有纪实的成分，又有艺术的想象和虚构。如《三国志演义》就是以三国时期的历史为内容的一部长篇历史小说，它既不同于历史著作，也不同于纯出于虚构的一般的小说。《三国志演义》“七实三虚”，描写的是相当长的一个历史阶段的基本历史发展轮廓，重大的历史事件，主要人物的重要活动，都符合历史的真实面貌，只是在具体的情节、细节、人物的思想性格方面，有较多的加工和虚构。\n\n英雄传奇小说以历史英雄人物为讲说对象，更多来自历史传说，虚构的成分比较大，如《水浒传》描写的时期并不长，它是横向扩展，不注重于历史发展的过程，不拘泥于历史事件本身，而广泛地反映某一个历史时期的社会生活。这类小说，可称之为“英雄传奇”。其特点是由历史上的一时故事生发开来，反映的生活内容，从纵向看不如历史演义那么长，但从横向来看，却比历史演义反映的生活面要广阔得多，几乎涉及各个阶层的人物，特别值得注意的是描写了市井小民的生活，在描写中又有较多的艺术创造和虚构。如《水浒传》中的一百零八位领袖人物，就绝大多数是虚构的，只有宋江、杨志等十几个人物能找到历史的依据，而且活动也不尽相同。\n\n","keywords":"相同点 来源于讲史 表现出政治理想和思想倾向 漫长的传说和演变的过程 不同点 具体来源 表现内容 虚实比例","note":"历史演义与英雄传奇这两种小说类型的代表作品大致于同一时间出现，都对后世小说创作产生了重要影响，其成书过程也有许多的相似之处，故而往往会放在一起进行对比。大家可以结合《三国志演义》和《水浒传》这两部十分具有代表性的作品进行分析。"},{"id":"363","stars":"★★","title":"简述高启诗歌的特点","body":"明初众诗人中，高启是成就最高的一位，所谓“天才高逸，实据明一代诗人之上”。高启的诗歌，主要具有以下特点：\n\n一、不少作品流露出忧郁、苦闷、彷徨、孤独的情绪\n\n高启生活在元明交替之际，其作品烙上了某些鲜明的时代特征，反映当时战乱生活便是其中的一个方面，如《吴越纪游过奉口战场》。元明之交，时代动荡，战火纷起，给人们带来了种种灾难与痛苦。诗人生活在兵连祸结的年代，对此有着亲身的体验。这首诗便以写实的手法向我们展示了一幕战后的景象；空荒的村落，满地的白骨，枯萎的蓬根，还有不时发出凄厉叫声的饥鸢，这一切在飞沙与寒日的笼盖与映照下显得惨烈荒寂，整首诗的基调凝重悲怆。生活的动荡，对时局艰难的恐惶不安和个人前途命运的忧虑，使得他的不少作品流露出忧郁、苦闷、彷徨、孤独的情绪。\n\n二、具有强烈的个人主体意识\n\n高启的人生态度最令人注目的，是其对个性的尊重。在他看来，维护个性而不使扭曲，乃是人生最重要的事件。早在元末时所作的《青丘子歌》中，他已直接地表达了自己的生活志趣，显示出了自我心灵把握、再现宇宙万物的艺术创造力。应该说，此诗从一个侧面流露了作者对个体精神世界进行重塑的意向，体现出较为强烈的个人主体意识。在中国诗歌史上，高启最早唱出了个性被压抑的悲哀和焦虑。\n\n三、拟历朝历代的古体，融入创新之风\n\n高启认为要“兼师众长，随事摹拟，待其时至心融，浑然自成，始可以名大方而免夫偏执之弊矣”。因此他的诗歌才如此风格多样。他的古题乐府诗，虽袭用旧题，但能别出新意。他的一些新题乐府诗如《牧牛词》《捕鱼词》《养蚕词》《卖花词》《伐木词》《打麦词》《采茶词》《田家行》等，大都能描绘出一幅幅农村劳动生活的图景，并在一定程度上反映出阶级剥削和民生疾苦。","keywords":"忧郁、苦闷、彷徨、孤独 个人主体意识 继承创新","note":"《四库提要》评价高启“拟汉魏似汉魏，拟六朝似六朝，拟唐似唐，拟宋似宋，凡古人之所长，无不兼之......然行世太早，殒折太速，未能熔铸变化，自为一家。故备有古人之格，而反不能名启为何格。”足以见得，高启虽擅长拟古体，也有创新之处，但由于过世太早，并没有形成自己鲜明的个性。"},{"id":"364","stars":"★★","title":"试述李梦阳的文学主张","body":"明代中期文学复古思潮生发于前七子的文学活动。前七子是一个以李梦阳为核心代表的文学群体，主要成员有李梦阳、何景明、王九思、边贡、康海、徐祯卿、王廷相。他们的创作主张，主要包括以下内容：\n\n一、要求诗文能写出真情、真人\n\n在诗歌方面，李梦阳认为当时的诗歌“情寡而工于词多”，这样的诗当然不是“真诗”而只是“韵言”。同时，在李梦阳看来，比兴就是“托物寓情”，所以当时的诗歌也体现出“比兴寡”的特征，而从这里还可以进一步理解：李梦阳对于诗歌，不但要求真情，而且还要求用比兴来表现真情。这也正是李东阳的理论。\n\n在散文方面，李梦阳认为“今之文”所“文”的无论是自己或别人，都要使之“合道”，于是在文章中就看不到真的人了。这种按照“道”所臆造出来的东西，当然不可能有打动人之处自然落得“抽华则无文”的结果。\n\n总之，李东阳所提出的“真情”和“真人”，用词虽别，其实是相通的。只不过诗歌偏于抒情，文则以叙事为多，所以他在论诗时强调情，论文时则强调“人”。\n\n二、“宋无诗”（“宋后无文”）\n\n李梦阳不但肯定了诗文必须写“真情”“真人”，而且明确提出：当时诗文之堕落，实是宋儒所造成的恶果。\n\n以诗歌来说，按照李梦阳等人的意见“比兴”源于情。而由于“宋人主理”，作诗时只有理而铲去了情，诗歌就达不到“比兴错杂，假物以神变”的程度了。李梦阳在这里特别举出了“性气诗”-理学诗，更说明了他的反对“宋人主理”是含有反理学的内容的。\n\n在散文方面，李梦阳认为，宋人的“言理”使得人们误认为人的“性行”都是合“理”-“合道”的，倘非写元恶巨奸，只好把其性行都写得“合道”，其结果就是“古之文废矣”。\n\n三、真情超越于“理”，可以不受“理”的束缚\n\n正由于不满宋人的“言理”，李梦阳甚至提出了真情超越于“理”的观点。他的《《结肠操谱＞序》末几句就认为：尽\n\n管其感情是由“殊理”之事所产生，但只要这感情是真的，就应该肯定和值得流传。这种认为真情可以不受“理”的束缚的观点，给予个人的心灵活动以较前广大的空间，也是自我意识的觉醒程度较前提高的表现。\n\n总之，李梦阳在文学创作中提倡“真情”“真人”，既包含着对宋代诗文的厌恶，也是对当时的诗文现状的否定，渗透着改革的要求。","keywords":"真情、真人 宋无诗 真情超越于“理”","note":"李梦阳作为前七子的代表，他的文学主张显示出鲜明的反理学特征，并且高度弘扬“真情”“真人”。在李梦阳相关内容中，“宋无诗”这一概念经常会被考查到，大家要明确李梦阳这一观点其实是在抨击“宋人主理”给诗歌发展带来的消极影响，有些学校会通过这一概念考查宋诗相关内容，可以从宋诗的理趣这一角度作答。"},{"id":"365","stars":"★★★","title":"明代前后七子的创作特征是怎样的","body":"一、前七子的创作特征\n\n明代中期文学复古思潮生发于前七子的文学活动。前七子是一个以李梦阳为核心代表的文学群体，主要成员有李梦阳、何景明、王九思、边贡、康海、徐祯卿、王廷相。他们的创作主张，主要包括以下内容：\n\n（一）贬斥“主理”现象，认为文学应重视表现真情\n\n前七子的某些复古论点透露出他们对文学现状的不满与对文学本质新的理解，这在李梦阳的复古主张中体现得尤为明显。在贬斥文学“主理”现象的同时，李梦阳提出文学应重视真情表现的主情论调，他将民间创作与文人学子作品进行对比。这些都在强调文学自身价值的基础上，对传统的文学观念与创作大胆提出怀疑，具有某种挑战性。而所谓“真诗在民间”之说，也反映了以李梦阳为代表的前七子文学观念由雅向俗转变的一种特征，散发出浓烈的庶民化气息。\n\n（二）重视时政题材\n\n从前七子创作情况来看，除了大量的拟古之作外，也有值得注意的地方，其中重视时政题材是一个重要的方面。这跟前七子中一些成员自身的政治命运和干预时政的勇气有关，在这些作品中作者或描写个人生活遭遇，或直言政治弊端与民生忧苦，有较为浓厚的危机感与批判意识。如李梦阳的《述征赋》《省愆赋》《述愤》《离愤》，便以作者纵论时政得失、攻讦皇后之父张鹤龄与宦官刘瑾而被逮下狱的经历为背景，抒写自己不幸的遭遇与不平的心绪。\n\n（三）反映民间生活，表现下层市井人物\n\n除时政题材外，李梦阳等前七子也注意将文学表现的视线转向丰富的民间生活，从中汲取创作素材，这与李梦阳、何景明等人重视那些反映社会下层生活的民间作品的文学态度相吻合，并且也偶有佳作。\n\n与反映民间生活相联系，一些下层的市井人物也成了前七子文学表现的对象。如李梦阳就有不少刻画商人形象的作品引人注目，作者一生与许多商人有过密切的交往，为他的创作打下了生活基础。他的《梅山先生墓志铭》《明故王文显墓志铭》《潜虬山人记》《鲍允亨传》等篇，都是为商人作的传记、记事作品。\n\n（四）过多注重古人诗文法度格调，影响了情感充分表达\n\n前七子过多地注重古人诗文法度格调，如李梦阳提出“文必有法式，然后中谐音度”，又强调“高古者格，宛亮者调”的诗歌审美标准，这些多少束缚了他们的创作手脚，影响作品中作家情感自由充分地表达，难免导致“刻意古范，铸形宿镆，而独守尺寸”。\n\n二、后七子的创作特征\n\n明代前七子于嘉靖初逐渐偃旗息鼓。至嘉靖中期，以李攀龙、王世贞为首的后七子重新在文坛举起了复古的大旗，声势赫然，为众人所瞩目。其成员除李、王外，还有谢榛、吴国伦、宗臣、徐中行、梁有誉。\n\n后七子的复古主张在很大程度上承接李梦阳等前七子的文学思想，而比起前七子，后七子在学古过程中对法度格调的讲究更趋于强化和具体化，这主要表现在后七子复古理论集大成者王世贞身上：\n\n（一）诗文创作要重视法则\n\n王世贞提出：“思即才之用，调即思之境，格即调之界。”进一步结合才思来谈格调。他还主张诗与文的创作都要重视“法”的准则，而“法”落实到具体作品的辞采、句法、结构上都有具体的讲究，这些所谓的“篇法”“句法”“字法”就是一条条有板有眼的艺术法则。\n\n（二）重视思想感情的主导作用\n\n王世贞强调格调要“本于情实”和“因意见法”，重视作家的思想感情在艺术创作中的主导作用，特别是到了晚年，他在反省格调说的流变时，明确地将主格调者分成两种，一种是“先有它人而后有我”的“用于格者”，另一种是在“先有己”\n\n的基础上学习古人的“用格者”，从而提出了“有真我而后有真诗”的主张。同时后七子曾对当时在文坛上具有相当影响的唐宋派文人“惮于修辞，理胜相掩”的现象提出了批评，击中了唐宋派一些作品理气过重的弱点。\n\n（三）与前七子相类似的是，后七子创作的弊病也在于过分注重对古体的揣度模拟，以至于难脱蹈袭的窠臼。","keywords":"前七子 贬斥“主理”重视表现真情 时政题材 民间生活 注重古人诗文法度格调 后七子 重视法则 思想感情的主导作用 注重对古体的揣度模拟","note":"明代前后七子是各大高校文学考研的重要考查点，他们的主要主张是复古，提出了“诗必盛唐，文必秦汉”的口号，他们的创作主张与创作特征也一脉相承，大家可以对照着记忆。需要注意的是，古代文学史上的“复古”，其实质都是为了达到革新的目的，前后七子也不例外。与之相似的还有唐宋的古文运动，所以二者可能会被放在一起进行考查。同时，前后七子这一概念在名词解释中也经常出现，大家要注意一下。"},{"id":"366","stars":"★★★★","title":"简述前后七子文学复古的得失","body":"前后七子的文学复古在明中期文坛掀起了一场波澜，其中激进与保守交错，创新与蹈袭相杂，所体现出的功过是非相互错杂的特征，显示了这股文学思潮自身的复杂性。\n\n一、前后七子文学复古的收获\n\n（一）巩固了文学的独立地位\n\n在复古的旗帜下，前后七子为文学寻求了一席独立存在的地位。特别是前七子崛起之初，文坛歌颂圣德、粉饰太平的台阁体创作风气还没有完全消除，加上程朱理学学风的炽热，文士中有轻视诗文而热衷于治经穷理的倾向，一些“文学士”甚至遭到排挤打击。显然，李梦阳等前七子在文坛高举复古大旗，与他们重视文学的独立地位、积极探索文学发展道路有着重要的联系。\n\n（二）增强了对文学本质的理解\n\n在重视文学独立地位的基础上，前后七子增强了对文学本质的理解，也正是在这一点上，他们对旧的文学价值观念和创作实践发起了一定的冲击。如后七子提出重“辞”而轻“理”的主张，虽有过多地注重文学形式的一面，却在某种程度上反映了他们以重形式的手段来摆脱文学受道德说教束缚的要求。而前七子则明确地将复古的目的与文学表现作家真情实感、刻画真实人生的追求联系起来，这些都多多少少体现了对文学自身价值的一种新的理解，以及同传统文学观念发生离异的勇气，赋予了文学复古活动以深刻性和挑战性。\n\n（三）开启了后世文学新精神\n\n前后七子一些文学变革的主张在某种意义上也开启了后世文学新精神。晚明时期公安派代表人物袁宏道，对李梦阳、何景明的文学活动加以肯定，曾经颇有见地地赞赏民间所传唱的《擎破玉》《打草竿》之类作品为“多真声”，这一论调显然与李梦阳“真诗在民间”的说法神理相通，或者可以说是李梦阳“真诗”说的某种延续。又如王世贞“有真我而后有真诗”的看法，似乎可以从公安派直抒胸臆的“性灵说”中找到它的影子。这些从一个方面显示出前后七子与晚明文人文学主张上某些内在的联系。\n\n二、前后七子文学复古的不足：陷入了拟古的泥潭\n\n前后七子在复古过程中寻求消除文学旧误区的办法，却又陷入了文学新的误区，在拟古的圈子中徘徊。这其中一个显而易见的特征便是他们的文学主张与创作实践存在着距离，求真写实的观念并未在他们的作品中充分体现出来，缺乏真情实感的模拟之作影响了他们的创作水准，他们的许多作品，都是对汉唐作品的生吞活剥、刻意规摹，像这样的作品，显然没有多少艺术生命力可言。","keywords":"巩固了文学的独立地位 增强了对文学本质的理解 开启了后世文学新精神 陷入了拟古的泥潭","note":"前后七子的文学复古运动，对于匡正当时的诗风、文风具有积极的意义，并且对后世性灵说等都产生了积极的影响。但是过犹不及，前后七子过分追求古诗的格调，却无法从中生发出真正的新的，属于自己的东西，所以只能沦为对古诗的摹拟，陷入了拟古的泥潭。"},{"id":"367","stars":"★★","title":"谈谈你对唐宋派创作特征的认识","body":"所谓唐宋派，指的是嘉靖年间继承南宋以来推尊韩柳欧曾王苏古文的既成传统，作为前后七子的反对派而出现的一个散文流派，代表作家有王慎中、唐顺之、茅坤、归有光等人。唐宋派的散文创作，主要具备如下特征：\n\n一、推崇韩愈、欧阳修、曾巩等唐宋古文名家\n\n王慎中把宋人欧阳修、曾巩作文之法当作重点学习的对象，唐顺之对曾巩推崇备至。茅坤则采录韩愈、柳宗元、欧阳修、苏洵、苏轼、苏辙、曾巩、王安石八家之文，编成《唐宋八大家文钞》，标榜上述唐宋古文名家为效法的“正统”。唐宋派之所以选择唐宋古文为取法对象，并非对秦汉古文表示不满，而是在重塑科举文风背景下的策略性选择。唐宋派从指导文章写作的角度立论，注重具有可操作性的“法”，因而更看重唐宋古文。唐宋八大家中，尤其推崇欧阳修和曾巩。\n\n二、创作主张上强调文以明道\n\n唐顺之在《答廖东雩提学》中曾明确提出“文与道非二也”，作文应“浸涵六经之言，以博其旨趣，而后发之”，而王慎中则尤其欣赏曾巩文章能“会通于圣人之旨”“思出于道德”，与明初文人宋濂等“以道为文”的文道一元论思想脉络相通，即要求文章根本六经、贯穿“圣贤之道”的内核。\n\n三、以无关理道的感怀纪事之作成就最高\n\n唐宋派撰写了大量“以道为文”、发明“圣贤之旨”的文章，但为近人所称的多是一些无关理道的感怀纪事之作，如唐顺之的《任光禄竹溪记》，归有光的《寒花葬志》《先妣事略》《吴山图记》等，常为人称引。其中最著名的要数《项脊轩志》，全文从容平淡，情真意挚，“无意于感人，而欢愉惨恻之思，溢于言语之外”。\n\n四、过于强调文章的载道功能而忽视了艺术性\n\n唐宋派立足“法”“理”两个层面推崇唐宋八大家古文，其结果或因为过于强调“理”而由文入道，或因为拘泥于具体的“法”而流于模拟。前者在王慎中、唐顺之身上有明显体现，后者主要发生在唐宋派的后继者当中。拟秦汉古文与唐宋古文，虽然在谱系选择上存在差异，但与效仿者的实际创作水平并无必然联系。因此，唐宋派过于强调文章的载道功能，出现“惮于修辞，理胜相掩”的情形实属必然。","keywords":"推崇唐宋古文名家 强调文以明道 感怀纪事之作成就最高 忽视了艺术性","note":"唐宋派前七子的反对派，二者的创作特征也针锋相对。前七子主情，而唐宋派强调文以载道；前七子否定宋代以来的诗文，而唐宋派则极为推崇欧阳修、曾巩，大家可以将二者对比记忆。需要注意的是，“唐宋八大家”这一概念的提出与唐宋派有着密切的关系，在回答相关名词解释时可以补充上，同时，唐宋派也是在名词解释中常出现的内容，大家要注意一下。"},{"id":"368","stars":"★★","title":"试分析归有光散文的艺术特色和贡献","body":"归有光是明代唐宋派的代表作家。他主张作文应学习唐宋古文的法度，在提倡道的同时，还特别重视文学的抒情作用。归有光散文创作的艺术特色及其对散文发展的贡献，主要表现在以下方面：\n\n一、归有光散文创作的艺术特色\n\n（一）质朴自然，真切生动\n\n归有光的散文长处在善于捕捉日常生活中一些平凡琐事及普通人物，状情摹态，细心刻画，寄寓作者真实的生活感受，富有感情色彩，因此读来使人感到真切、生动。他的《先妣事略》《项脊轩志》《思子亭记》等篇或记述平常事件，或抒写亲人之情，具有描写质朴自然、抒情真切感人的特点。\n\n（二）描绘生动细腻\n\n《寒花葬志》所描述的不过是极平常的人物和极细小的家事，但写得生动细致，尤其是人物的状貌情态刻画，虽着墨不多，却惟妙惟肖，颇有生活的情趣。又如《项脊轩志》写所居项脊轩：“万籁有声，而庭阶寂寂，小鸟时来啄食，人至不去。三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。”笔触虽属平淡，但形象细腻，点染之间描绘出居处凄清宁静的气氛。\n\n二、归有光散文的贡献\n\n（一）消除了前后七子复古理论的弊病，推动了明代散文的发展\n\n归有光一生著作繁富，涉及经史子集各部，但是其主要成就则在散文创作上。清代史学家王鸣盛在《钝翁类稿》里，从散文发展的角度评价了归有光的贡献：“明自永、宣以下，尚台阁体；化、治以下，尚伪秦、汉；天下无真文章者百数一年。震川归氏起于吾郡，以妙远不测之旨，发其淡宕不收之音，扫台阁之肤庸，斥伪体之恶浊，而于唐宋七大家及浙东道学体，又不相沿袭，盖文之超绝者也。”作为明代唐宋派散文的代表作家，归有光在一定程度上消除了前后七子复古了理论的弊病，推动了明代散文的发展。\n\n（二）继承并发展了唐宋古文运动的传统\n\n归有光的散文“家龙门而户昌黎”，博采唐宋诸家之长，继承了唐宋古文运动的传统，同时又在唐宋古文运动的基础上有所发展。他进一步扩大了散文的题材，把日常生活中的琐事引进了严肃的“载道”之古文中来，使之更密切地和生活联系起来。这样，就容易使文章写得情真意切，平易近人，给人以清新之感。尤其是一些叙述家庭琐事或亲旧的生死聚散的短文，写得朴素简洁、悱恻动人，“使览者恻然有隐”。归有光的这些叙事散文，在当时一味摹古浮饰的散文园地中，就像一泓甘甜的泉水，沁人心脾，给人以美的享受，为散文的发展开辟了一片新的境界。","keywords":"艺术特色 质朴自然 真切生动 生动细腻 贡献 消除弊病 继承并发展唐宋古文运动传统","note":"归有光是唐宋派代表人物，而唐宋派的文学主张与前七子针锋相对，所以归有光的贡献，有很大一部分是与前七子的局限相关的。至于其散文创作特征，大家可以从《项脊轩志》《寒花葬志》等代表作品入手，结合内容进行分析。"},{"id":"369","stars":"★","title":"试述明代杂剧发展脉络","body":"一、明代初叶：题材偏狭，语言华丽，突破一人主唱的格局\n\n明代初叶实行严酷政策，禁止“妆扮历代帝王后妃、忠臣烈士、先圣先贤”，在一段时间内导致明初杂剧题材的褊狭。同时，明初杂剧从作家构成上看，大多与朝廷有着千丝万缕的联系，所以其作品缺乏元杂剧直面现实的抗争精神，而将元杂剧后期愈演愈烈的封建说教、神仙道化乃至风花雪月等种种倾向加以张扬，具有粉饰太平的浓厚色彩。\n\n从语言风格上看，明初杂剧与元杂剧的质朴本色相较，有着渐趋华丽雅致的追求。从艺术创新上看，明初杂剧突破了元杂剧一人主唱的僵化格局，朱有燉在剧中安排了灵活有趣的轮唱合唱，贾仲明将南北曲融入一折，杨讷的《西游记》更是超越了元杂剧四折一楔子的通常规范，这都为明中叶后杂剧的南曲化奠定了基础。\n\n二、明代中叶：与诗文复古思潮呼应，文人剧出现\n\n明代中叶嘉靖前后的杂剧在内容和作法上都有了新的收获，显示出深刻的思想和战斗的精神。这与诗文领域内反复古主义思潮的兴起彼此呼应，形成了锐意革新的气候。同时，明代中期杂剧，大量抒写文人自身的人生失意的情绪，主体意识强化，因此也被称为文人剧。\n\n三、明代末期：杂剧南曲化，同时过度文人化、案头化\n\n明末的杂剧不乏警世之作，杂剧南曲化也蔚为风尚。南曲杂剧的好处是称意而写，短小精悍，成为文人们逞气使才的匕首和投枪。南杂剧在体制上具有如下特征：其一，剧本结构自由，长短随意，一本可演多事；其二，用曲可南可北，也可南北合套，南北曲混用间用成为普遍现象；其三，不限一人主唱。南杂剧在内容上突出体现为文人心绪的宣泄，许多作品甚至采用了诗歌化乃至戏谑化、寓言化的笔法。但其缺点是过度文人化、案头化，不重视群众性与舞台性。总的说来，本时期的杂剧已经更多地成为文学中的一体，不大适合于登场演出了。","keywords":"明代初叶 题材偏狭 语言华丽 突破一人主唱的格局 明代中叶 复古思潮 文人剧 明代末期 南曲化 文人化案头化","note":"明杂剧的整体成就不如元杂剧和明传奇，但相较于元杂剧，它还是做出了许多创新。明代杂剧的整体发展是题材逐渐扩大，思想内容不断丰富的过程，也是逐渐南曲化、文人化、案头化，逐渐脱离演出的过程。考查中基本不会针对明杂剧出题，相关内容我们了解一下就好。"},{"id":"370","stars":"★★","title":"试分析徐渭《四声猿》的创作特征","body":"《四声猿》指明代徐渭的四部杂剧，《四声猿》语出于郦道元《水经注》。“猿鸣三声泪沾裳”，鸣四声则更属断肠之歌。作为一组杂剧，《四声猿》包括了《狂鼓史渔阳三弄》《玉禅师翠乡一梦》《雌木兰替父从军》《女状元辞凰得凤》四本短戏，四部剧各自独立，合为《四声猿》。其创作特色主要表现为：\n\n一、体现了徐渭狂放不羁的性格和强烈的个性精神\n\n《玉禅师》是对佛教，也是对权威的怀疑和否定，是对人性和情欲的肯定。《狂鼓史》不仅是一部痛斥权奸，批判黑暗世道，宣泄内心愤懑的作品，更是一部张扬个性，肯定自我的杰作。《雌木兰》和《女状元》既曲折地反映了作者内心深处自我价值不能实现的苦闷，也表现了作者晚年的处世态度和价值取向。总之，《四声猿》表现了作者对人的生命，命运的思索和追求，突出了个人存在的意义和价值，它实质上标志着一种人的觉醒。\n\n二、通俗本色的语言\n\n《四声猿》的成就，主要还在于语言的运用。徐渭努力实践他自己的主张，力求通俗，多用本色语，然而也是用力做了\n\n锤炼和琢磨的。如《玉禅师》里的〔收江南〕，共五十俗句，大部分用短柱体，两字一韵，极见才力。《女状元》里的〔北江儿水〕曲四支，押的都是险韵，颇有巧思。这两曲都是前人大加称赏的。\n\n三、开放性体制形态\n\n《四声猿》体制灵活，每个杂剧的篇幅均视剧情需要而设置：《狂鼓史》一折，《玉禅师》《雌木兰》各二折，《女状元》五折，打破了元杂剧多为四折、按起承转合安排剧情的惯例，给人耳目一新的审美感受；尤其是以四个题材与情节互不相涉的故事合为一剧，在戏曲史上堪称独创。\n\n四、熟练运用对比手法\n\n《四声猿》四剧一以贯之地体现为两个世界的关目对比：通过对一个“畸”的世界的描写，倾吐对“正”的世界的渴望；通过对一个“幻”的世界的认可，强调对一个“真”的世界的追求。《玉禅师》的一阴一阳，《雌木兰》的从军之前和还乡之后，《女状元》的中举前后，皆是通过两个世界的比照进行一种艺术性思考；《狂鼓史》体制上为一折，形态上依然暗含着一个与理想世界对比的现实世界，这种对比是通过幽冥关目的设置实现的。","keywords":"狂放不羁的性格 强烈的个性精神 通俗本色的语言 开放性体制形态 熟练运用对比手法","note":"明代杂剧的艺术成就，以徐渭为最高代表，而徐渭的杂剧创作，又以《四声猿》最具代表性。从《四声猿》中，我们可以体会到明代杂剧艺术相较于元代杂剧艺术的新发展，也可以感受到个性精神张扬的时代潮流。相关内容可以参考程毅中《徐渭及其（四声猿）》、杜桂萍《论清代杂剧对徐渭＜四声猿＞的接受》，具体资料可以在李凡文学正版群中领取。《四声猿》也是名词解释中常出现的内容，大家要特别关注。"},{"id":"371","stars":"★★★","title":"谈谈你对明代传奇的认识","body":"一、明代传奇的内涵\n\n“传奇”最早特指唐代的短篇文言小说，宋代话本小说中也有“传奇”类；但元末明初的学者们也曾将元杂剧称为“传奇”，原因之一在于许多唐传奇都曾被元杂剧改编成剧本，而大部分杂剧也都带有浓郁的传奇色彩。自从宋元南戏在明代得以规范化、文雅化、声腔化和全国化之后，由南戏所升格的传奇便渐渐成为不包括杂剧在内的明清中长篇戏曲作品的总称。\n\n二、明代传奇的体制\n\n经过长期的探索，明代传奇终于摆脱了早期南戏的朴素面貌，确立了其体制特征。\n\n（一）演出体制\n\n传奇角色由南戏的生、旦、净、末、丑、外、贴七色扩大到十二色，即副末、正生、贴生（或小生）、正旦、贴旦、老旦、小旦、外、末、净、丑（中净）、小丑（小净）。角色登场也形成定规，即副末开场介绍剧情，旦末等角色先后登场自报家门，然后展开剧情。\n\n（二）音乐体制\n\n明代早期传奇不问宫调，嘉靖时期开始有了变化，沈璟《南九宫十三调曲谱》成为传奇宫调准则；南曲曲牌分引子、过曲和尾声，引子用于角色上场，尾声用于每出结尾，过曲包括大曲和小曲，正角唱大曲，次角唱小曲，过曲采用曲牌联套体；出现了一种曲牌运用的新方式-集曲，又称犯调，即把旋律风格相近的不同曲牌中的旋律片段集合成新的曲牌；另一种曲牌运用的新方式为滚调，有利于酣畅淋漓地表现人物情绪其板式为“流水板”。\n\n（三）剧本体制\n\n明代传奇基本采用长篇体制，一般都在三十出以上；采用了分卷、分出标目的做法；每出有下场诗，总结剧情或设置悬念；曲辞要求押韵，韵脚一般依据周德清《中原音韵》《洪武正韵》。由于传奇篇幅太长，实际演出时一般都会加以简省，其中的一些精彩出目往往单独演出，这就是所谓的折子戏。一般认为，折子戏演出在万历时期成为时尚，促进了传奇角色行当的发展，提升了舞台表演艺术水平。\n\n三、明代传奇的发展\n\n（一）洪武至天顺时期\n\n这一时期传奇创作队伍主要是民间艺人和下层文人，带有浓厚的伦理教化意味，这与统治集团对程朱理学的大力推行息息相关-一个建国不久的新朝廷，需要局面的稳定与思想的统一。如朱元璋就对标举风化、有益人心的《琵琶记》赞不绝口，上有所好下必甚焉，这对明初传奇产生了重要的影响。\n\n（二）成化至嘉靖时期\n\n这一时期传奇更为盛行，成为剧坛上的主流艺术，传奇创作逐渐文人化。剧作家们的创作也更为自觉，更能直面现实，更加具备战斗精神。社会政治的腐败，边境敌寇的骚扰，这些内忧外患都促使作家们在剧作中发出沉重的呐喊。\n\n（三）万历至崇祯时期\n\n这一时期，传奇创作进入了高潮期和繁荣期。以汤显祖为杰出代表的传奇作家，成为明代文学史上的一支重要方面军。以沈璟为带头人的吴江派，在传奇的创作和理论上也形成了自己的特点。从剧目建设上看，本时期涌现出的数百种传奇作品大多较好。从声腔发展上看，昆曲传奇的创作一枝独秀，大部分传奇都是比较典雅的昆曲作品，具备较高的文学品位。\n\n此外，明初以来一直在民间流传的弋阳腔与各地的地方戏结合起来，也上演了丰富多彩的传奇剧目。而从剧作精神上看，本时期最为突出的创作倾向是张扬个性，批评封建专制。市民阶层的崛起与市场经济的萌芽，在文化精神上以个性解放的要求为基点。个性解放常常通过恋爱自由、婚姻自主来具体演绎，批评封建专制又往往以对抗僵化的伦理教条为基本冲突。","keywords":"内涵 不包括杂剧在内的明清中长篇戏曲作品的总称 体制 演出体制 音乐体制 剧本体制 发展 洪武至天顺伦理教化意味 成化至嘉靖 主流艺术 万历至崇祯 高潮期和繁荣期","note":"“传奇”这一概念的具体内涵与“乐府”一样，都经历了一个发展的过程，到明代专指除杂剧以外的中长篇戏曲作品。大家要注意“传奇”和“唐传奇”这两个概念的区别，前者的内涵更加丰富一些，大家要注意一下。这部分内容中，除了要注意“传奇”这一关键概念外，还要注意一下传奇的体制。"},{"id":"372","stars":"★★","title":"试分析沈璟的戏曲主张","body":"沈璟的曲学主张甚至比他的戏剧创作更知名，与此相关的“沈汤之争”成为明代戏剧史上的重要话题。总体来看，沈璟的戏曲主张，主要包括以下内容：\n\n一、以封建伦理道德为出发点\n\n沈璟剧作的思想倾向偏于保守，倡导封建伦理道德的气息比较浓厚。这可以说是其曲论主张的一个基本出发点。除了《十孝记》《奇节记》等直接宣扬忠孝节义的作品外，其他传奇也随处表现沈璟的封建道德观点。如取材于唐代牛肃《吴保安传》的《埋剑记》，写书生郭飞卿与吴永固朋友之间“轻利重义”的至交，就宣扬了封建伦常准则。吴江派的重要作家吕天成说沈璟的戏曲“命意皆主风世”，正好说明了这一点。\n\n二、重视音律\n\n沈璟认为，剧本创作必须在音乐上“协律”，即所谓“合律依腔”，这是沈璟曲论中影响最大的方面，也是他一以贯之的主张。沈璟说：“宁协律而不工，读之不成句，而讴之始协，是曲中之工巧。”又说：“怎得词人当行，歌客守腔，大家细把音律讲。”在文人作传奇者渐多而所作往往不合音律的明中叶以后，他提出这样的主张是有积极意义的。为了使作曲者有所遵守，他还订定《南九宫十三调曲谱》，就每个曲牌详列不同格式，分别正字、衬字，注明板眼，为传奇创作确立了规范。\n\n三、重视戏曲“本色”\n\n明初至明中叶的剧坛一直笼罩在文词骈俪派的创作风气之中，创作与演出严重脱节。沈璟对这种创作风气进行了批评，并提出了注重当行表演、注重语言通俗易晓、富有生活气息的本色理论。沈璟对于戏曲本色的重视、阐述和提倡，是在经历过《红蕖记》秾艳纤丽的语言风格之后而得出的符合戏曲规律的理论认识。注重语言的浅显通俗、符合场上表演与观众的欣赏，在当时骈俪成风的戏曲创作环境中，提出这样的真知灼见，这是难能可贵的，他的胆识与理论见解值得我们大力肯定。","keywords":"以封建伦理道德为出发点 重视音律 重视戏曲“本色”","note":"沈璟是吴江派的领军人物，他的创作主张，很大程度上就是吴江派的创作主张，大家可以把二者结合起来记忆。沈璟的戏曲主张与汤显祖的戏曲主张有很大的相异之处，这也是“汤沈之争”发生的深层次原因，大家可以结合二者的创作主张去更深入地理解这一事件。"},{"id":"373","stars":"★★★","title":"谈谈你对汤沈之争的认识","body":"一、汤沈之争的内涵\n\n明万历朝，戏曲界同时出现了汤显祖和沈璟两位大家。在戏曲创作及其有关理论的问题上，他们之间存在着尖锐的分歧，甚至达到针锋相对的地步。\n\n汤显祖以“至情”为其戏曲创作之本，讲究浪漫风格，文辞上偏于绮丽，称“文采派”；而沈璟则好以封建伦理道德为基调，强调本色，尤其苛求曲辞的格律，称为“本色派”或“格律派”。在当时和后世的诸多戏曲理论著作中，文人们不约而同地把汤、沈两人并提而论，出现了说汤必言沈，说沈必论汤的现象。基于汤氏文采为先、沈氏格律第一这两种创作理论上的差别，汤、沈之间产生了争论。后人称之为“汤沈之争”。\n\n二、汤沈之争的实质\n\n在这场争论中，汤显祖与沈璟都表明了自己的戏曲主张，而联系当时曲坛上所出现的戏曲文人化的现状来看，两人所提出的戏曲主张，也正是分别代表了文人剧作家们对戏曲典雅化的追求。\n\n汤显祖是从戏曲内容与语言的典雅化的角度，提出了自己的戏曲主张，沈璟则是从曲调的雅化与精致化的角度提出了自己的见解。尽管两人的主张各有偏颇，但两人的出发点是一致的，即都是从文人剧作家的立场出发，为使戏曲的雅化而提出了各自的戏曲主张，只是各有所强调，才产生了分歧与争论，而这也就是这场争论的实质。\n\n三、汤沈之争的意义\n\n（一）确立了戏曲创作的标准\n\n汤沈之争使得当时及后来的文人剧作家们对文人化的戏曲的标准有了较清晰的认识，也就是将才情的抒发、文辞的华美、音律的谐合作为戏曲创作的最高境界。也正因为此，虽然汤沈之争在当时的曲坛上产生了很大的影响，但戏曲家们并没有站在某一方来批评、指责另一方，而是持调和的态度，即提出了“合之双美”的主张。\n\n（二）推动了戏曲的雅化\n\n汤显祖与沈璟，一个追求个人志趣的张扬与文辞的典雅，一个追求格律的精致细密，两者都对当时及后世的戏曲创作产生了很大的影响，而经过文人剧作家与理论家们对两人的戏曲主张的总结，使得两者合成了一股强大的驱动力，推动了戏曲的进一步雅化。到了明末清初，出现了一大批才情、曲律双美的文人之作，如以李玉为代表的苏州派戏曲家的戏曲创作，既富才情，又合曲律。","keywords":"内涵 创作理论上的差别 实质 为使戏曲的雅化而提出各自主张 意义 确立标准 推动雅化","note":"汤沈之争及其文学意义是文学考研的常考知识，也是明代传奇相关内容中比较重要的一个考点。汤沈之争其实就是两种创作主张之间的分歧，其产生背景是明朝中后期戏曲雅化、文人化的潮流出现。汤显祖与沈璟虽然创作主张不同，但实质上都是为了戏曲创作进一步发展，相关内容可以参考俞为民《明代戏曲文化的两个方面-重评汤沈之争》，具体资料可以在李凡文学正版群领取。汤沈之争本身也是一个比较重要的名词解释，大家要注意一下。"},{"id":"374","stars":"★★★★","title":"谈谈你对汤显祖“至情”论的认识","body":"一、汤显祖“至情”论的来源\n\n汤显祖的“至情”论主要是源于泰州学派，同时也渗透着佛道的因缘。\n\n（一）泰州学派\n\n业师罗汝芳、亦师亦友的达观和尚、素所服膺的李卓吾先生，在汤显祖思想与人格的形成过程中矗立起三座丰碑。罗汝芳是泰州学派代表人物王良的三传弟子，提出了“制欲非体仁”的观点，肯定了人的多重欲求。李贽的诸多论说带有市民阶层强烈的个性解放色彩，达观和尚则与李贽并列为当时思想界“二大教主”，他们对汤显祖确立以戏曲救世、用至情悟人的观念都影响至深。\n\n（二）佛道思想\n\n仙风道骨的隐居传统、寻幽爱静的家庭祖训，也在一定程度上左右着汤显祖的人生选择。汤显祖的祖父崇道，祖母信佛，启蒙老师徐良傅对蓬莱仙境企慕，罗汝芳也深通神仙吐纳之旨。凡此种种，都潜移默化地影响着汤显祖的人生信念。\n\n徘徊出入在儒、释、道的堂庑之间，使得汤显祖更加洞彻事理，更能从容构建自己的“至情”世界观，并在戏剧创作中予以淋漓尽致的演绎和张扬。\n\n二、汤显祖“至情”论的表现\n\n汤显祖的“至情”论大致表现在三个方面：\n\n（一）从宏观上看，世界是有情世界，人生是有情人生。“世总为情”“人生而有情”。“情”与生俱来并始终伴随着生命进程。悲欢喜乐等表象、感伤宣泄等渠道，都是情感流程中的不同环节。世间之事，非理所能尽释，但一定都伴随着情感的旋律。\n\n（二）从程度上看，有情人生的最高境界是“至情”，《牡丹亭》便是“至情”的演绎。汤显祖在该剧《题词》中说：“情不知所起，一往而深。生者可以死，死可以生。生而不可与死，死而不可复生者，皆非情之至也。”这种贯通于生死虚实之间、如影随形的“至情”，呼唤着精神的自由与个性的解放。\n\n（三）从途径上看，最有效的“至情”感悟方式是借戏剧之道来表达。汤显祖借梨园小天地展现人生大舞台的瑰丽画面，在戏剧艺术中畅快恣意地演绎出无情、有情和至情的三大层面和多元境界。他甚至把戏剧的情感教化作用自由铺张、无限放大，最终把戏剧看成是一种可与儒、释、道并列的极为神圣的精神文化活动。\n\n【李凡关键词：来源 泰州学派 佛道思想 表现 宏观 有情世界 有情人生 程度 最高境界是“至情”途径 戏剧之道】【李凡说：提起汤显祖，人们就不由得想到《牡丹亭》中的那一句“情不知所起，一往而深”，对情的弘扬与追求可以说贯穿汤显祖的整个戏曲创作过程，也是其最鲜明的一个特色，所以很多学校都会针对“至情”论出题，我们不仅要明确其具体表现，更要了解这一思想的渊源。】","keywords":"","note":""},{"id":"375","stars":"★★★★★","title":"试分析《牡丹亭》的艺术特色","body":"【答题框架】\n\n《牡丹亭》是明代作家汤显祖“临川四梦”中的一部传奇，它的题材来源于话本《杜丽娘慕色还魂》。汤显祖以点石成金的圣手，将话本的认识意义与审美价值擢升到新的高度。《牡丹亭》的艺术特色，主要表现在以下方面：\n\n一、充满象征意义的结构\n\n汤显祖曾说过：“因情成梦，因梦成戏。”正是为了张扬至情，为了表现情与理的激烈冲突，汤显祖才有意构思了杜丽娘出生入死、起死回生的情感历程，以此展现个人与社会、理想与现实、主观与客观之间的冲突与调和。\n\n以情与理的冲突为中心线索，《牡丹亭》可以分为三个情节结构段落：从《言怀》到《闹殇》，写杜丽娘的“生可以死”；从《谒遇》到《回生》，写杜丽娘的“死可以生”；从《婚走》到《圆驾》，写柳、杜婚姻的成立。人间一阴间一人间，现实一理想一现实，依次转换的三个场景，既是杜丽娘人生追求的完整的情感历程，也是汤显祖文化探索的完整的精神历程。这一情节结构本身，就包含着独特而深的象征意蕴。\n\n二、通过心理描写与艺术虚构塑造人物性格\n\n戏曲文学特别注重展示人物的内心世界，发掘人物内心幽微细密的情感，汤显祖的《牡丹亭》在这方面也取得了很高的艺术成就。汤显祖善于“从筋节窍髓，以探其七情生动之微”，深入人物的内心世界，寻找其喜怒哀乐的潜在根源，并加以细腻深刻、委婉曲折的表现；而且还善于对人物形象从“玄空中增减圬塑，而以毫风吹气生活之”，进行艺术虚构、艺术创造，使之形神毕露，从而赋予人物形象以鲜明的性格特征和深刻的文化内涵。\n\n三、“在浅深、浓淡、雅俗之间”的语言\n\n（一）整体典雅蕴藉\n\n重抒情，重意境，也决定了《牡丹亭》的语言特色。《牡丹亭》所运用的语言，总体上看是文学语言而不是生活语言，是剧诗而不是口语，许多地方未免过于典雅蕴藉了。但是，这种典雅蕴藉的语言，却正是汤显祖表达浪漫情思所必需的。汤\n\n显祖的浪漫情思，本来就难以明言，似浅似深，若有若无，朦朦胧胧如雾中之花，水中之月。这种情感，可以感受，却不能解释；可以意会，却难以言传。\n\n（二）根据环境、人物身份的变化调整语言风格\n\n汤显祖的戏剧语言并不都模糊晦涩，也有明白如话、通俗晓畅的。汤显祖常常能扣准不同环境、不同身份的人物，采用不同风格的语言。例如，那些艳丽典雅的语言，往往用来描写才子佳人、官宦士大夫的生活；而《劝农》一出写到公人、田夫、牧童、采桑女，《冥判》一出写到胡判官，唱词就比较通俗。\n\n王骥德《曲律》卷四《杂论》评汤显祖的戏曲语言“在浅深、浓淡、雅俗之间”，这正是文人戏曲追求的最高境界。\n\n四、浪漫主义风格\n\n奇幻与现实的紧密结合，强烈的主观精神追求，浓郁的抒情场面，典雅绚丽的曲文铺排，都体现出《牡丹亭》较为典型的浪漫主义风格和多重艺术魅力。\n\n（一）虚实结合\n\n《牡丹亭》中的天上地下、虚实正奇达到了一种从心所欲的境界。仅仅为了春情的驱驰，杜丽娘没有爱却可以得到爱，没有情人却可以生发出情人，虽然是春梦一场却又俨然如真，甚至为了追求梦中情人而一命归阴，又死而复生，这显然是奇幻到了极点。\n\n在具有奇幻色彩的同时，《牡丹亭》却又常常落脚到真切之处。每当汤显祖笔下的人物在梦境魂乡时，那一种泼天似的自由精神便无所不在、无所不为；一旦梦醒还阳，便“成人不自在”，活着的小姐必须遵循人间的礼法，受种种无奈的束缚。这种先虚后实、虚实结合乃至虚则虚之、实则实之的写法，正好将理想与现实融会贯通起来，提醒人们去做现实中的浪漫主义者和理想中的现实主义者。\n\n（二）强烈的抒情性\n\n以一系列抒情场次表现主人公强烈的追求，使其主观精神外化，并在此基础上令戏剧冲突持续升级，这正是《牡丹亭》的神韵与魅力之所在。从《惊梦》《寻梦》到《写真》《闹殇》，都是杜丽娘的情感抒发得至为强烈、命运呈现得至为酸楚的重点抒情场次。《惊梦》是写对美和爱的发现与拥抱，《寻梦》是对美与爱的深刻回味与强烈追忆，《写真》是描摹美的容颜及保存爱的信息，《闹殇》是写美的毁灭与爱的持续延伸。\n\n（三）悲喜交融，彼此映衬\n\n《牡丹亭》是一部兼悲剧、喜剧、趣剧和闹剧因素于一体的复合戏，各种审美意趣调配成内在统一的有机体。全剧共55出，前28出大体属于以喜衬悲的悲剧，后27出属于以悲衬喜的喜剧。仅仅为了争取爱的权利，便不得不付出生命的代价，这既是杜丽娘本人的青春悲剧，也是家庭与社会的悲剧，《诀谒》《闹殇》《魂游》等出戏，都极其悲凉凄婉；而《闺塾》等出戏则极富喜剧色彩，但其中的悲剧意味也着实令人伤感：原来正值青春妙龄之人，往往难得佳偶，常常要挣扎在梦魂死生之间！原来做官是要以六亲不认、牺牲情感作为代价的！这种悲喜交融、彼此映衬的戏曲风格，正是富有中国戏曲特色的浪漫精神的具体呈现。","keywords":"充满象征意义的结构 心理描写 艺术虚构 整体典雅蕴藉 根据环境、人物身份的变化调整语言风格 浪漫主义风格 虚实结合 强烈的抒情性 悲喜交融 彼此映衬","note":"《牡丹亭》是汤显祖最具代表性的一部作品，也是明代传奇中艺术成就最高的一部作品，在考查中出现的频率非常之高。总体来看，《牡丹亭》这部作品在主题、语言等方面都实践了汤显祖的创作主张，考查中可能会让大家结合这部作品分析汤显祖的“至情”论，大家可以把这两部分的内容结合起来记忆，《牡丹亭》的浪漫主义风格可能会单独考查，这部分大家也要留意一下，比如在25年的考查中，西华大学就考查到了“汤显祖《牡丹亭》浪漫主义成就”这道题目，大家结合这部分内容的第四点灵活作答就可以了。"},{"id":"376","stars":"★★★★★","title":"试分析《牡丹亭》思想价值","body":"《牡丹亭》可以说是实践了汤显祖的“至情”论，在歌颂真情的同时，也拥有了文化警世意义。总体来看，《牡丹亭》的思想价值主要表现在以下方面：\n\n一、反对程朱理学，解放女性思想\n\n《牡丹亭》以情反理，反对处于正统地位的程朱理学，肯定和提倡人的自由权利和情感价值，褒扬像杜丽娘这样的有情之人，从而拨开了正统理学的迷雾，在受迫害最深的女性心头吹拂起阵阵和煦清新的春风。身处明代社会的广大女性，确实有如生活在水深火热的监牢之中：一方面是上层社会的寻欢作乐、纵欲无度，另一方面是统治阶级对女性的高度防范与严厉\n\n禁锢。《牡丹亭》横空出世之后，温暖并开启了多少女性的心胸！封建卫道士们痛感“此词一出，使天下多少闺女失节”“其间点染风流，惟恐一女子不销魂，一方人不失节”，这正是慑于《牡丹亭》意欲解救天下弱女子的强烈震撼力所发出的哀鸣。\n\n二、崇尚个性解放，突破禁欲主义\n\n《牡丹亭》肯定了青春的美好、爱情的崇高以及生死相随的美满结合。千金小姐杜丽娘尚且能突破自身的心理防线，逾越家庭与社会的层层障碍，勇敢迈过贞节关、鬼门关和朝廷的金门槛，这是振聋发聩的闪电惊雷，是对许多正在情关面前止步甚至后缩的女性的深刻启示与巨大鼓舞。杜丽娘的处境原是那般艰难，父亲拘管得那么严密，她连刺绣之馀倦眠片刻，都要受到严父的呵责，并连带埋怨其“娘亲失教”。请教师讲书，原也是为了从儒教经典方面进一步拘束女儿的身心。可怜杜丽娘长到如花岁月，竟连家中偌大的一座后花园都未曾去过，这华堂玉室，也恰如监牢一般......所以被禁锢极深的杜丽娘反抗也极烈，做梦、做鬼、做人都体现出无限的“至情”。\n\n三、为个性解放思潮开辟了文学领域这一新的战场\n\n商业经济日益增长、市民阶层不断壮大的新形势，对于正在兴起的个性解放思潮起了推波助澜的作用。汤显祖所师事的泰州学派、所服膺的李贽学说乃至达观的救世言行，都是市民社会发展到一定阶段的必然产物。尽管汤显祖没有像李贽“头可断”而“身不可辱”、达观“断发如断头”那样去生死打拼，但他却以另外一种唯美至极的戏剧样式，在文学艺术领域开辟了思想解放、个性张扬的新战场。\n\n（李凡说：以上内容为《牡丹亭》的思想价值，也即“《牡丹亭》的文化警世意义”，但有时候会出现“有人认为《牡丹亭》的“至情＇论没有超越“发乎情，止乎礼义＇的传统轨道，你怎么看”这样的题目，在回答这样的题目时，就要在以上内容的基础上，增补以下内容。）\n\n四、没有跳出“发乎情，止乎礼义”的传统轨道\n\n作为影响极大的主情之作，《牡丹亭》虽然表现出激情驰骋、辞采华丽的浪漫主义戏剧风格，但也必须看到，《壮丹亭》其实还未从根本上跳出“发乎情，止乎礼义”的传统轨道。特别是后半部戏在总体上还是遵理复礼的篇章，作者并没有彻底实现其以情代理的哲学宣言。他的个性解放思路尚未从根本上脱离封建藩篱，而只是对其中特别戕杀人性、极其违背常情的地方进行了理想化的艺术处理。乞灵于科考得第、皇上明断，这也是戏曲的常套之一。\n\n即便如此，汤显祖终究还是封建时代中勇于冲破黑暗，打破牢笼，向往烂漫春光的伟大先行者。《牡丹亭》也成为古代爱情戏中继《西厢记》以来影响最大、艺术成就最高的一部杰作，杜丽娘已经成为人们心中青春与美艳的化身，至情与纯情的偶像。","keywords":"反对程朱理学 解放女性思想 崇尚个性解放 突破禁欲主义 为个性解放思潮开辟新的战场 没有跳出传统轨道","note":""},{"id":"377","stars":"★★★★","title":"试分析《牡丹亭》中杜丽娘的形象","body":"杜丽娘是我国古典文学里继崔莺莺之后出现的最动人的妇女形象之一，这一形象的性格经历了多次发展变化，表现出了多方面的特征，具体包括以下方面：\n\n一、端妍恭顺的大家闺秀\n\n杜丽娘是一个生长于封建官僚家庭的千金小姐，其承受着来自父母师长的沉重的“爱”，父母古板而严谨的管束和塾师陈最良迂腐而单调的教导使其养成了温柔恭顺的性格，为人行事一派大家闺秀的风范。杜丽娘才貌端妍，聪慧过人。四书能逐一记诵，摹卫夫人书法几可乱真。作为掌上明珠般的独生女，她对父母无比孝顺；作为女学生，她对老师十分尊敬，一见面就提出要为师母绣双寿鞋。\n\n二、情感意识的自我觉醒\n\n杜丽娘不仅是一个大家闺秀，她的身上显示出了与大自然的天然谐和感，体现出了对美与爱的强烈追求；作者在其心细如丝的分析能力和独立识见之上充分张扬出反叛束缚、酷爱自由的精神。杜丽娘因伤春而游园、惊梦、寻梦，而后又以死殉梦，表现了她的情感意识一步步走向自我觉醒，这一时期的她已逐渐退却大家闺秀的贤良恭顺，转向青春、个性和情感意识的觉醒，并在追求自由和爱情的艰辛的道路上越走越远。由唯唯诺诺的官宦之家的千金小姐，发展到勇于决裂、敢于献身的深情女郎，这是杜丽娘性格的第一度发展。\n\n三、生死相恋的“至情”之人\n\n杜丽娘的死并不意味着希望的幻灭与追求的停止，相反，却昭示着其新生活的开始，在另一个世界里，她更大胆地追求着理想和幸福，她的死是对封建礼教的束缚的反抗，她作为生死相恋的“至情”之人，再次出现在读者面前。但杜丽娘的可贵之处不仅在于能为情而死，还表现在面对阎罗王时敢于据理力争，表现在身为鬼魂而对情人柳梦梅的一往情深，以身相慰，最终历尽艰阻，为情而复生，与柳梦梅在十分简陋的仪式下称意成婚。这是杜丽娘性格的第二度发展与升华，所谓“一灵咬住，决不放松”“生生死死为情多”。这一阶段的杜丽娘在经历情感意识的自我觉醒后，冲破了生与死、人与鬼，世间与冥府的种种界限，开始大胆并执着地追求自由美好的爱情，其可谓是古今“至情”之人的典型和象征。\n\n四、冲破礼教的勇敢斗士\n\n杜丽娘性格的第三度发展，表现在对历经劫难、终得团圆之胜利成果的保护与捍卫。面对亲爹爹再三打压她那状元夫君的淫威，回应老父亲在金銮殿上指着嫡亲女儿“愿吾皇向金阶一打，立见妖魔”的狠心，杜丽娘在朝堂之上时而情深一叙，慷慨陈词，把一部为情而死生的追求史演述得那般动人，就连皇上也为之感动，甚至亲自主婚，“敕赐团圆”。杜丽娘在强大的封建势力的逼迫下坚定地维护着自己的爱情，表现出其坚贞不移的意志和誓死不休的抗争精神，最终他们的婚姻获得了家庭和社会的认可，实现了苦苦追求的理想。","keywords":"大家闺秀 自我觉醒“至情”之人 勇敢斗士","note":"杜丽娘的性格表现为四个阶段，其中经历了三次发展，她从一个端庄的大家闺秀一步步成长为勇敢捍卫自己爱情、反抗封建礼教的斗士。借助于这一过程，汤显祖表达了对生死之恋与浪漫婚姻的深情礼赞。在考查中，有些学校会直接提问“杜丽娘的形象特征”，有些学校则会提问“杜丽娘性格的三次发展”，这两个问题都可以用这一部分的内容作答。相关内容可以参考樊小青《＜牡丹亭＞中杜丽娘人物形象分析》，具体资料可以在李凡文学正版群中领取。"},{"id":"378","stars":"★★★","title":"试比较崔莺莺与杜丽娘形象的异同","body":"崔莺莺与杜丽娘都是“以情反理”、大胆叛逆封建礼教的贵族少女典型。但是，不同的时代和生活环境必然会赋予人物不同的性格因素。总体看来，二人形象的异同主要表现在以下方面：\n\n一、相同点\n\n（一）出身相同，并都受到封建礼教压迫\n\n崔莺莺是美丽端妍、深沉娴静，“针黹女工，诗词书算”样样精通的相国小姐。但是，这样出众的少女却由于封建礼教的束缚被深深地困在寂寞的闺阁之中，在“父母之命，媒妁之言”下许配给了花花公子郑恒。她只能按照封建礼教的道德和行为规范安度闺阁小姐的寂寞时光。\n\n杜丽娘与崔莺莺一样，同样是才貌出众，年正青春的闺阁小姐，但她生活的年代理学盛行，因而受到了比崔莺莺更加严格的禁锢。她平时只能做些针线女红，或者熟读背诵班姬的《四戒》；跟随身为太守的父亲在官衙里住了三年，却连后花园都没有去过。在礼教压迫下，她不仅与社会隔绝，而且也与大自然隔绝，丧失了一切自由和权利。\n\n（二）具有反抗精神\n\n崔莺莺是个正值青春妙龄的少女，具有叛逆精神。面对封建势力的阻挠，崔莺莺毫不动摇地追求爱情的幸福，在几经波折和激烈的思想斗争后，最终战胜自我，摆脱礼教，成就了一桩美满姻缘。\n\n杜丽娘同样不满于自己生活的单调、苦闷，珍惜自己的青春美好年华，埋怨“拣名门”而虚度青春，渴望拥有幸福自由的良缘。她为情而死，又为情而复生，最后更是以情抗理，在金銮殿上慷慨陈词，体现出了强烈的叛逆反抗精神。\n\n二、不同点\n\n（一）觉醒程度不同\n\n在《西厢记》中，崔莺莺虽然也大胆反抗封建礼教，但她的反抗表现得偏向软弱，崔、张二人的结合更多得益于红娘。如果没有红娘的鼓励，崔、张的爱情就难以发展，没有红娘的见义勇为，穿针引线，崔、张的结合就不会成功。\n\n而《牡丹亭》中，杜丽娘显得更深刻、更成熟，她是自己思想行为的主宰者，是《牡丹亭》中最光彩的人物。她是自觉地去追求、去捍卫自己的爱情，去反抗封建礼教的压迫。杜丽娘个性觉醒的程度，叛逆性格的内涵远远超过崔莺莺。\n\n（二）结合的过程不同\n\n崔莺莺与张生结合，是由情到欲。先是有张生对莺莺一见钟情，才有了后续一系列事情的发生。崔、张二人之间是有了花前月下的浪漫之情，才激发自己的欲望冲动，冲破“男女大防”的限制。\n\n而杜丽娘与柳梦梅则是由欲到情。杜丽娘是因春心萌动，迫切感到青春寂寞难耐，因而自然涌发欲望冲动，才在梦中与柳梦梅相会，一时之欢，孕育了一段生死不渝的爱情。\n\n（三）具体内涵不同\n\n莺莺是文学史上为数不多的以贵族少女身份反抗封建礼教的叛逆女性，她的出现标志着古老的封建礼教的压迫，已经激起了本阶级成员的反抗。因为，在那个时代这个阶层的妇女不可能得到专一的爱情，封建的婚姻乃是一种政治行为，起决定作用的是家世利益，而且一夫多妻也消灭了爱情本身。所以，莺莺把维护这种专一爱情放在高于一切的地位，是具有深刻社会意义的。\n\n杜丽娘形象的深刻涵义，不仅在于对封建婚姻的批判和对理想爱情的追求，还在于通过杜丽娘的生活环境及人物关系，深刻地揭示了封建礼教对人的禁锢和窒息；杜丽娘“本心”“欲望”的表露，又揭示了个性解放同封建专制主义的尖锐对立，她执著追求的艰难历程，绽放着肯定人欲、张扬个性自由的思想火花。","keywords":"相同点 出身相同 封建礼教压迫 反抗精神 不同点 觉醒程度 结合的过程 具体内涵","note":"毫无疑问，《牡丹亭》的创作受到了《西厢记》的影响，杜丽娘身上也有着崔莺莺的影子，但这两部作品毕竟处于不同的时代，时代环境和思潮的不同必然也体现在这两个形象身上，我们可以从这一点入手去分析。相关内容可以参考刘健《＜西厢记》《牡丹亭＞才子佳人形象探异及其文化阐释》、耿光华《“至情”超逸传统意识的叛逆女性-（西厢记）与＜牡丹亭＞之比较》，具体资料可以在李凡文学正版群中领取。"},{"id":"379","stars":"★★★","title":"简述王实甫《西厢记》中的红娘、汤显祖《牡丹亭》中的春香这两个人物形象的主要异同","body":"王实甫《西厢记》中的红娘、汤显祖《牡丹亭》中的春香虽然不是作品中的主要人物，然而作者都赋予她们鲜明的个性特点，是剧情发展的重要人物。二者性格的异同，主要表现在以下方面：\n\n一、相同点\n\n（一）身份相同\n\n红娘和春香分别是崔莺莺和杜丽娘的贴身丫环。红娘是老夫人派来监视、服侍莺莺的；春香则不仅服侍丽娘的起居，还要陪她读书。作为婢女，她们都是处于社会下层的人物。\n\n红娘和春香的身份相同，都是婢女，社会地位低下，是受气挨打的角色。\n\n（二）性格相同\n\n从红娘和春香的性格来说，她们都充满活力，活泼开朗而又机灵聪慧。《闹简》和《赖简》两折，红娘的机敏表现得特别突出；春香的机灵活泼集中表现在《闺塾》一出，因为她的突出表现，这一出后来就叫《春香闹学》。二者都属于心计不是很深而且兢兢业业服侍主人的那一类。\n\n（三）都有推动剧情的作用\n\n《西厢记》完全离不开红娘，离开了红娘，剧情就没法发展。她的活动，从起初的传书递简到后来捍卫崔、张爱情，主要就是为了使“有情人终成眷属”。当莺莺在爱情上很不主动时，红娘还有意识地推动她。春香对于丽娘的爱情，也是起了推动作用的，最主要的是她发现了大花园，于是便有了“游园”，“良辰美景”牵动了杜丽娘“赏心乐事”，于是有了“惊梦”，乃至为情而死、为情而生等一系列故事。\n\n二、不同点\n\n（一）风格不同\n\n红娘和春香给读者的整体印象不一样。两人虽然都是同处于社会下层的丫环，可是风格并不一样。红娘举止大方得体，端庄而又礼貌，出语不凡，颇有大家闺秀的风范。春香则显得孩子气，有孩子的天真无邪，率直顽皮。\n\n（二）存在的意义不同\n\n红娘是崔莺莺和张生之间的连结，她符合大众的接受和欣赏特点，很自然地成为剧情发展的积极联络者和推动者。而且，她为作者代言，直接体现了作者的意图，作者把自己的思想和想说的话，加在了红娘身上，让她去行、去说。而春香是服侍和陪读的丫鬟，她是作为杜丽娘的陪衬而存在的。她的活泼开朗、调皮直率，也是属于丽娘的，她是丽娘这些层面的外化。\n\n（三）所处环境不同\n\n红娘面对的相国夫人和崔莺莺都心计深重，什么事都藏着掩着不愿意讲，崔莺莺把她当作母亲安插在身边的间谍，而夫人又认为她带小姐出去学坏的，两面都难做人。而春香生活的环境较好，杜丽娘和她没什么特别明显的阶级不同。\n\n（四）本质不同\n\n红娘在本质上是与封建礼教对抗的，她从心底里不满封建礼教对年轻人的束缚，亦即对于封建礼教的罪恶，她是有比较清醒的认识的，她认为有情人不应该受到阻挠，所以她一心帮助崔、张，她有十分的胆量与强烈的反抗精神。春香没法同红\n\n娘媲美。春香固然也热情、活泼、开朗、泼辣，有大胆的反抗精神。但作者写她，很大程度上只是从她爱美爱自由的天性出发的。春香是杜丽娘影子似的人物，陪衬丽娘，突出丽娘，春香没有也不必具备红娘那样的认识与才能。","keywords":"相同点 身份 性格 推动剧情 不同点 风格 存在的意义 所处环境 本质","note":"红娘虽然不是《西厢记》的主角，却是全剧中极为出彩的一个角色，受到了很多观众的喜爱，后世有些戏剧干脆以红娘为主角来改编《西厢记》，如京剧《红娘》。相较而言，春香这一形象则逊色不少，不过二者明显一脉相承，在身份、性格等方面存在不少联系与区别，因而会被放在一起对比。相关内容可以参考吴文昭《两个最佳女配角-＜西厢记＞红娘与＜牡丹亭＞春香试比较》，具体资料可以在李凡文学正版群中领取。除了《西厢记》，《牡丹亭》还时常被拿出来与《长生殿》对比，甚至有人直接认为《长生殿》是一出热闹的《牡丹亭》，相关题目会在提升版中给到大家。"},{"id":"380","stars":"★★★★","title":"试论述《西厢记》和《牡丹亭》爱情的观念异同（26黑龙江大学）","body":"《西厢记》与《牡丹亭》都是中国古代戏曲的杰作，都歌颂了爱情的伟大，对于中国古代爱情文学发展起到了十分重要的影响。但二者毕竟是两部作品，在爱情观念上，还是不同之处。二者爱情观念的异同，可以从以下方面进行梳理。\n\n一、相同点\n\n《西厢记》与《牡丹亭》同为爱情题材的作品，都在张扬着一种与封建传统相左的爱情观，在精神意蕴上也是一脉相承的。\n\n在王实甫笔下，张生、莺莺固然是才子佳人，但才与貌并非他们结合的唯一纽带。王实甫强调，这一对青年一见钟情，“情一发难收”，受到封建家长的阻梗，他们便做出冲破礼教樊篱的举动。对真挚的爱情，王实甫给予充分的肯定，认为它纯洁无邪，不必涂上“合礼”“报恩”之类保护色。他认为爱情是婚姻的基础，只要男女间彼此“有情”，就应让他们同偕白首；而一切阻挠有情人成为眷属的行为、制度，则应受到鞭挞。\n\n王实甫对“情”的关注，比关汉卿、白朴更进一步。他希望所有恋人能够如愿以偿，等于不把“父母之命，媒妁之言”放在眼内，这是对封建礼教和封建婚姻制度的大胆挑战。\n\n而在汤显祖看来，有情人生的最高境界是“至情”，《牡丹亭》便是“至情”的演绎。汤显祖在该剧《题词》中说：“情不知所起，一往而深。生者可以死，死可以生。生而不可与死，死而不可复生者，皆非情之至也。”这种贯通于生死虚实之间、如影随形的“至情”，同样呼唤着精神的自由与个性的解放。\n\n二、不同点\n\n《西厢记》诞生于元代，而《牡丹亭》诞生于明代，仍会发现随着时代的推移、新思潮的不断涌现，剧作中所体现出来的爱情观念必然也出现了一些差别，具体表现在以下方面：\n\n（一）针对的目标不同\n\n如果说《西厢记》的主题是“以情战礼”，那么《牡丹亭》的主题则是“以情战理”。\n\n王实甫所处的元代在利用正统的儒家学说巩固自己的统治的同时，各民族固有的宗教信仰也得到了最大程度的尊重，宋代程朱理学独尊的局面发生了巨大变化。王实甫的《西厢记》就是在这样的时代环境中问世的，所以，这部作品所表露出来的观念，指向的是一直以来的封建礼教。《西厢记》写出了爱情的伟大生命力，它是一曲以情抗礼的战歌，也是一支爱情战胜礼教的凯歌。\n\n汤显祖所在的明代在思想文化方面，大力提倡朱理学，并且把理学思想推向极致。正是在这样一个背景下，汤显祖以《牡丹亭》为平台，集中实现其“以情代理”的哲学宣言。它所反对的不仅仅是封建礼教的条条框框，而更多关注的是如何用那种“生可以死，死可以生”的人间“至情”去剔除现实生活中历经数代积淀下来的“存天理，灭人欲”的毒瘤。\n\n（二）在哲学渗透的程度上有所不同\n\n从理想道德角度讲爱情，“王西厢”可以说是最现实主义的了，它通过一个完整的艺术世界向整个社会发言，它提出一个可贵的要求，即把婚姻建立在爱情基础上的道德要求。因此，“王西厢”虽非反思之作品，但它供人们反思的力量却是强劲的但是，“王西厢”也表现了感觉敏锐而理性不足的弱点。它的爱情
