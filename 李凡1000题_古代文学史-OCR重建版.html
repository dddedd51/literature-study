中反复出现。在李白诗里，用得最多的色彩字是“白”，其次是金、青、黄、绿、紫等。他天性开朗，喜欢明丽的色调，不喜欢灰暗色。\n\n如李白自己所言：“清水出芙蓉，天然去雕饰。”李白诗歌的语言风格，具有清新明快的特点，明丽爽朗是其词语的基本色调。他那些脱口而出、不加雕饰的诗，常呈现出透明纯净而又绚丽夺目的光彩，反映出其不肯苟同于世俗的高洁人格。\n\n李白以其天才的艺术创造力，丰富了诗歌的浪漫主义风格，发展了浪漫主义的艺术方法和技巧，开拓了诗歌艺术的新境界，使他的诗歌成为继屈原之后，我国古代浪漫主义的新高峰，成为中华民族乃至世界文坛诗苑中的一朵奇葩。","keywords":"独特的批判视角 强烈的主观色彩 充沛的气势 丰富奇特的想象 壮美与优美 跳跃跌宕 纵横开阖 色调明丽语言清新明快","note":"在盛唐乃至中国诗歌史上，李白都有着不可更替的不朽地位，在备考过程中对李白知识点复习要极其详尽，同时还要注意结合具体作品对其艺术特点进行分析，答题要尽可能完整全面。除了结合作品之外，大家还可以结合李白的生平及思想去认识理解李白诗歌的艺术特征。"},{"id":"156","stars":"★★★★","title":"结合具体作品说明李白诗歌类型“众体兼具”的特点（天津师范大学）","body":"在李白的现存作品中，有古诗，有乐府，有歌行，有近体诗，可谓众体兼具。李白继承了中国古典诗歌的多种类型，并融入作者鲜明的个性特征与艺术创造，使得作品呈现出新的生命力。\n\n一、古体诗的纵横开阖\n\n李白的古体诗既远绍汉魏古体诗浑朴的艺术风貌，又带有盛唐时代非凡的气魄，更渗透着作者对于生命的激情。\n\n在五言古诗中，最具有代表性的是《古风》五十九首。这五十九首诗非一时一地之作，但大多与开元、天宝年间重大的政治事件相关，兼取咏怀、咏史、游仙三种形式，抒发作者对当时政治的批评与感慨。\n\n李白的七言古诗纵横开阖，气势如虹。《唐宋诗醇》卷六评价道：“白诗天才纵逸，至于七言长古，往往风雨争飞，鱼龙百变，又如大江无风，波浪自涌；白云从空，随风变灭，诚可谓怪伟奇绝者矣。”\n\n李白的歌行多以行云流水般的笔墨畅抒情怀。在这些作品中，情感的宣泄更为浓烈，笔法跳荡流动，极尽曲折宛转之能事。\n\n二、古题乐府的创新与个性张扬\n\n乐府诗是凸显李白创作才华的诗体之一。《李太白全集》自卷三至卷六录其乐府共一百四十九首，多沿用古题，但是又有所创新。\n\n李白沿用古意的诗作往往对于古辞古意有所发挥，如《将进酒》是乐府鼓吹曲辞旧题，内容多写饮酒放歌时的情怀。李白借劝酒表现出对于人生短暂的慨叹，对于世俗功名富贵的鄙弃，而流贯于全篇的及时行乐思想，则体现出诗人在失意苦闷中力求旷达超脱的心境。\n\n李白的乐府诗不止于发挥古意，还善于创新，借古题另立新意，《远别离》为乐府杂曲歌辞旧题，多写悲伤离别之事。李白通过娥皇、女英二妃和舜帝生离死别的故事，既传达了远别离的悲哀，又从中引出“尧幽囚”“舜野死”的传说，说明“君失臣”“权归臣”的后果，寄托讽谏，表现出诗人对唐王朝前途的忧虑。\n\n李白善于从乐府的旧题古义中寻找与自己人生经历和身世感慨相契合之处，并借此抒发自己独特的情感体验和张扬的个性风采。\n\n三、绝句的兴到神会\n\n在绝句的创作上，李白也取得了不凡的成就，后人历来将其五绝与王维并举，七绝与王昌龄共称。李白的绝句多是对于自然与人生的感悟，兴到神会，清新自然。\n\n五绝多用白描手法，格调明快，语近情遥。如《独坐敬亭山》，一人独坐时的寂寞心情与寂静的山景忽然冥会，感受到与自然相亲近的温暖，人与山刹那间灵性相通、浑然一体了。诗人将这种心领神会的感受信口说出，仿佛毫不费力，但在相看两不厌的人与山的冥会中，似有未曾说出且不必说出的无限情思在其中。\n\n李白的七言绝句清新飘逸，韵味深远。如《陪族叔刑部侍郎晔及中书贾舍人至游洞庭五首》其二把一个水、月、白云连成一体的琉璃世界，和在这个世界里产生的奇妙想象，写得那样明净秀美，如入神仙境界。\n\n四、律诗的自然天成\n\n相较于其他体裁，李白的律诗较少，这大概是因为李白才气纵横，不愿受格律所束缚，更喜欢天马行空式的驰骋诗思。但是也有脍炙人口的佳作，如《送友人》中“浮云”一联将当时之景与双方的心情巧妙地结合，比拟形象而贴切，凝练而准确地表达出作者及友人依依惜别的心境。李白的七律只有八首，但也都写得对仗工稳，气势浑浩。如《登金陵凤凰台》写登临凤凰台的所见所感，吊古怀今，感慨深沉，境界阔大。“三山”一联写景构图精妙，对仗工整而自然，气象雄浑。","keywords":"古体诗 纵横开阖 古题乐府 创新 个性张扬 绝句 兴到神会 律诗 自然天成","note":"李白诗歌类型广泛，古体诗、古题乐府、绝句和律诗都有所涉猎，并且都取得了不俗的成就，不同体裁的诗歌所表现出来的艺术风貌也有很大的不同。而在这些体裁之中，最为人所关注的就是李白的乐府、歌行和绝句，这些也是考查中出现较多的内容，所以大家要重点准备。"},{"id":"157","stars":"★★★★","title":"简述李白乐府诗的特点","body":"李白继承汉魏乐府感于哀乐、缘事而发的优良传统和诗歌风骨，使之成为他振起诗道的革新手段，这主要体现在他大力拟作古乐府的创作实践中。\n\n一、沿用古题，又有所创新\n\n乐府诗是凸显李白创作才华的诗体之一。李白的乐府诗大量地沿用乐府古题，或用其本意，或翻案另出新意，能曲尽拟古之妙。其创新之处主要表现在两个方面：\n\n一方面是借古题写现事，具有鲜明的时代精神。如《出自蓟北门行》《侠客行》等，均属于缘事而发之作，表达的是作者对现实生活的感受，具有深刻的寓意和寄托。\n\n再一方面，则是用古题写己怀，因旧题乐府蕴含的主题和曲名本事，在某一点引发了作者的感触和联想，便用它来抒写自己的情怀。李白用古题写己怀的乐府诗，因偏重于主观抒情，更能体现李白诗歌创作发必无端、气势壮大的个性特色，其妙处常在可解与不可解之间，既可以说它有寄托，也可以说它只是抒写感慨，想落天外，奇之又奇。\n\n二、独特的艺术个性\n\n李白的乐府诗，虽说是拟古，却处处有“我”在，呈现出他人无法摹拟的个性特色，杳冥惝恍，纵横变幻，充分体现了李白诗歌艺术的独创性。但这种独创性是以总结前人艺术成就为基础的。因为这类乐府虽然没有借鉴同题乐府的传统手法，但综合了先秦两汉以来诗赋散文的各种表现艺术。只是李白凭借其超凡的才情、丰富的想象和大胆的夸张，使语言节奏的变换与思路的跳跃、情感的跌宕和气势的奔泻达到高度的和谐，进入了出神入化的境界。\n\n三、行云流水的抒情方式，奔腾回旋的动感\n\n李白把自己的个性气质融入乐府诗的创作中，便形成了行云流水的抒情方式，有一种奔腾回旋的动感。这种动感，见诸字句音节时，常表现为句式的参差错落和韵律的跌宕舒展，在杂言体的乐府中尤为明显。李白乐府的代表作，如《蜀道难》《将进酒》《梁甫吟》等，大都是以五、七言为主的杂言体。这种杂言体乐府，在体制和格调方面，与唐代盛行的歌行体几乎没有什么实质性的差别。李白的乐府诗创作，实已完成了从汉魏古体到唐体的根本性转变。\n\n四、自由奔放的诗歌形式\n\n李白的乐府是最为奔放的自由诗，完全突破了旧题乐府的创作模式。篇无定句，句无定字，换韵自由，平仄不限。李白乐府诗的自由奔放，不仅是他的创作个性使然，也是历史发展的必然结果。从诗体演变的角度讲，他是在着力创造一种自由诗的新形式，以顺应语言发展的历史潮流和吸取西域歌词的优秀成果。","keywords":"沿用古题 有所创新 艺术个性 行云流水 奔腾回旋 自由奔放","note":"李白的乐府诗虽然大多沿用古题，但本质是在写现事、抒己怀，充满了个性特色与个人气质。在抒情方式和诗歌形式上，李白也完成了对古体的突破，表现出了崭新的特色。本题可结合具体作品进行分析，着重记忆大框架，根据其作品填充内容。相关内容可以参考钱志熙《李白乐府诗的创作思想、体制与方法》，具体资料可以在李凡文学正版群中领取。"},{"id":"158","stars":"★★★★","title":"试分析李白绝句的特点","body":"李白诗歌的美是多样的，除大气磅礴、雄奇浪漫的壮美风格外还有自然明快的优美情韵，这主要体现在他那些随口而发、颇多神来之笔的绝句里。他的绝句，主要有以下特点：\n\n一、五绝格调明快，清新飘逸\n\n李白是唐人中五绝与七绝都写得极好的人。他的五言绝句，往往有一种明快格调，以明白晓畅的语言，表现出无尽的情思韵味。\n\n绝句体制短小，适于写一地景色、一时情调。可它离首即尾，易流于浅露，所以绝句贵在含蓄。但若刻意锤炼，又易流于斧凿，所以绝句又贵在自然天成。李白的五言绝句，能以简洁明快的语言表达出无尽的情思，做到了既自然，又含蓄，真实简练而蕴含丰富，这是绝句的最高境界。\n\n李白的绝句境界清新，而内蕴飘逸潇洒。他爽朗的性格、自由自适的气质，反映到他的绝句里，就形成了清新飘逸的情思韵味。\n\n二、七绝以山水诗和送别诗见长，表现自然的美和普遍的人性、人情\n\n李白的七绝，以山水诗和送别诗为多，也写得最出色。他有一种与天地自然融为一体的气质，以其天真纯朴的童心，与山水冥合。无论写景言情，都具有一气流贯的俊逸风神和爽朗情韵。\n\n七绝佳作，在李白诗中不胜枚举。这些作品，多写诗人在大自然怀抱和日常生活中获得的审美感悟及片刻情思，是属兴到神会、一挥而就的自然天成之作。那刹那的感觉，那无穷的韵味，所表现的是自然的美和普遍的人性、人情，平易真切，极富生活情趣，有一种“清水出芙蓉，天然去雕饰”的美。\n\n三、以古入律、自由发挥，受到了乐府民歌的影响\n\n李白的绝句，特别是七言绝句，带有以古入律、自由发挥的特点，融入了乐府歌行开合随意而以气贯穿的表现手法。\n\n李白绝句受乐府民歌的影响极为明显，在他159首绝句里，乐府民歌的作品约四十五首，占了近三分之一。其中有很多脍炙人口之作，如《静夜思》《秋浦歌十七首》《玉阶怨》《越女词五首》《巴女词》《襄阳曲四首》等，都是李白拟乐府作品里的绝句佳作，多具有清新纯朴的民间气息和活泼生动的民歌情调。像这种类于民歌出口成章、纯赖兴会或灵感的天然句式，在李白的五、七言绝句中是最多的。就作品的自然天成和清新明快而言，李白绝句的成就无人可比。\n\n绝句是李白感情世界的瞬间呈现，其开朗的性格、率真的情感，以及洒脱的气质，全都灵光一闪地反映了出来，脱口即成绝唱。在盛唐诗人中，王维、孟浩然长于五绝，王昌龄等七绝写得好。兼长五绝与七绝而并至极境的，只有李白一人。","keywords":"明快格调 清新飘逸 自然的美 人性人情 乐府民歌影响","note":"李白五绝七绝都写得登峰造极，不过二者在表现内容和艺术特征上都有不同，大家可以结合代表作品进行理解记忆。总体来看，李白的绝句更像是情感的瞬间进发，其中熔铸着李白的个性气质，没有太多的斧凿，因而整体表现得十分自然，集中体现了李白诗歌的自然明快之美。"},{"id":"159","stars":"★★★★","title":"试分析李白的歌行体诗歌的创作特点（26中央财经大学）","body":"李白的歌行体，鲜明地反映了时代特征及其思想个性，极大地丰富了歌行的表现领域，在题材开拓上作出了重要贡献。在艺术上，李白的歌行更体现了前所未有的创造力和无比强大的表现力，并把这种形式的创作推向了巅峰。\n\n一、壮大奇伟的阳刚之美\n\n李白的歌行，感情强烈，个性突出，显示了鲜明的主体性。他的诗，具有澎湃奔涌的激情和不可阻遏的力量，气势飞动，格调高扬，飘逸洒脱，纵横超迈，创造出开阔壮美的意境。主体性是李白歌行体最显明的艺术特征。在其歌行中，李白的个性和人格精神得到了最充分的张扬和最强烈的宣达，李白独特的艺术个性，及其非凡的气魄和生命激情，在他的歌行中全都展露出来，充分体现了盛唐诗歌气来、情来而蓬勃向上的时代精神，具有壮大奇伟的阳刚之美。\n\n二、豪迈飘逸的诗歌风貌\n\n在歌行体的艺术形式及艺术表现上，李白显示了巨大的创造力，变初唐歌行的“规制”，形成了酣畅淋漓、纵横恣肆、雄奇奔放、跌宕多姿的风格特征。李白的歌行，完全打破诗歌创作的一切固有格式，空无依傍，笔法多变，达到了任随性情之所之而变幻莫测、摇曳多姿的神奇境界，不仅感情一气直下，而且还以句式的长短变化和音节的错落，来显示其回旋振荡的节奏旋律，造成诗的气势，突出诗的力度，呈现出豪迈飘逸的诗歌风貌。\n\n三、抒情的意味浓厚\n\n李白的歌行多以行云流水般的笔墨畅抒情怀，《襄阳歌》《南都行》《玉壶吟》《江上吟》《西岳云台歌送丹丘子》《梦游天姥吟留别》《庐山谣寄卢侍御虚舟》等都属于此类。在这些作品中，情感的宣泄更为浓烈，笔法跳荡流动，极尽曲折宛转之能事。诗人以主观情感和意向为轴心展开篇章，飞腾想象，虚实相间，笔势大开大合，有时顺流直下，有时大跨度跳跃，想怎么写就怎么写。这种李白式的抒情，似暴风急雨，骤起骤落；如行云流水，一泻千里，像是从胸中直接奔涌喷吐出来。\n\n四、深沉的历史感和现实感\n\n李白谙熟历史，而浪漫的气质又常常使他产生丰富的联想，驰骋八荒，追溯千古，把现实、人生与历史故事、人物联系起来，使诗歌具有更深沉的历史感和现实感。在其诗中，伯夷、叔齐、燕昭王、吕尚、鲁仲连、乐毅、韩信、谢安......作为李白诗中的重要描写对象，不断地、反复地出现，这成为了李白诗歌，尤其是歌行体创作中的独特现象。这些历史人物，从多侧面体现了李白的政治理想、人生遭遇和价值追求，成为了诗人更形象、更生动的化身，成为他蕴涵着强烈的主体意识和情感倾向的“自我”。所以，李白歌行中的历史人物，不完全等同于某些咏史怀古诗中作为引发感慨的、纯典故式的人物，而更具有深厚、丰富的意蕴与内涵。","keywords":"壮大奇伟的阳刚之美 豪迈飘逸的诗歌风貌 抒情意味浓厚 历史感与现实感","note":"七言歌行产生于汉魏，发展于齐梁，依其句式、韵式、修辞手法和后出的声律诸种构成要素，形成了古七言体、骚体、乐府杂言体、齐梁体、赋体等体式，各体都有自己的独特形态。李白在歌行创作中全面吸收了之前歌行创作的艺术经验，接受了各体式的深刻影响，从而使他的歌行形成了有别于前人和时人的独特的体式特征。相关内容可以参考马承五《李白歌行特征论-兼论歌行的诗体定义与形式特点》，具体内容可以在李凡文学正版群内领取。"},{"id":"160","stars":"★★★","title":"简述李白浪漫主义诗风形成的原因","body":"盛唐时期，出现了以李白为代表的浪漫主义诗歌的高潮，李白扩大了浪漫主义的表现领域，丰富了浪漫主义的手法，并在一定程度上体现了浪漫主义与现实主义的结合，可以说，李白的诗歌成为屈原以后浪漫主义诗歌的新高峰。而李白浪漫主义诗风的成因，主要有以下几点：\n\n一、盛唐的政治、经济全面繁荣\n\n诗歌是时代的产物，李白能取得巨大成就，与盛唐的政治、经济全面繁荣以及由此形成的盛唐气象有着密不可分的关系。特定的时代孕育着特定的气象-政治上的开明文化上的博大包容，使得大唐帝国孕育着一种乐观、自信与积极向上的社会风尚。当时自由开放的文化氛围，正是李白得以成长的沃土。他那追求理想的精神，个性张扬的气质，雄奇飘逸的诗风，特别是他那吞吐天地的气势，无疑就是唐朝政治经济全面繁荣昌盛在精神领域的真实写照。风格是时代的产物，可以说李白浪漫主义风格正是盛唐气象的反映。\n\n二、浪漫主义文学传统影响\n\n在先秦文学中，对李白影响最大的无过于庄子、屈原。庄子的愤世疾俗，蔑视富贵权豪，追求自由解放、放达超脱、齐一万物、消极出世等对李白都有影响。李白诗歌想象的奇特、形象的丰富、比喻的生动、结构的跳跃、笔力的恣肆，均得益于庄子散文。屈原和李白都在诗歌中用浪漫主义手法塑造了诗人的自我形象，屈原的上下求索、九死不悔的精神更为鲜明，李白的桀骜不驯、叛逆反抗精神尤为突出。屈原的想象绚丽多彩，李白的想象夸张扬厉；屈原的风格萦回缠绵中有深挚沉郁，李白的风格豪放雄健中有清新俊逸。李白诗歌中的浪漫主义精神在一定程度上承袭屈原传统。\n\n三、家庭的熏陶、豪迈的性格、丰富的阅历\n\n李白幼年及少年时期良好的教育形成了诗人豪迈奔放、热情、刚直不阿的性格。此后诗人经历了长安失意，又走上了漫游之路，他虽然感到沮丧，但不悲伤；虽然感到懊恼，但不沉沦；虽然感到失意，但却矢志不渝地去追求。诗人笔下的山川、河流、日月总是气势磅礴，宏伟壮观。一幅幅壮美的画卷令人游骋目怀，而心旷神怡。因而家庭的熏陶、豪迈的性格、丰富的阅历是诗人浪漫主义诗歌风格形成的重要原因。\n\n四、错综复杂的思想\n\n李白一方面接受儒家“兼济天下”的思想，另一方面又接受道教和道家的思想。他求仙访道、委顺自然、遗世独立，追求绝对自由，他深受庄子影响，蔑视世间的一切。当他在现实生活中失望时，他就把思想寄托在山川、河流、仙界神灵上。他以山为朋，以月为友，和神仙为伴。\n\n同时他还受游侠思想的影响。儒家思想、道家思想和游侠本是不相容的，但这种错综复杂的思想却是支配他一生的主导思想。他虽然渴望入世、匡济天下，又不屑于走科举出仕的道路；他干谒王侯，却不肯摧眉折腰事权贵；他希望从政，但却\n\n要求从政不能妨碍他对自由的追求。李白这种不能实现理想的错综复杂的思想，使得浪漫主义艺术手法成为他在进行诗歌创作时必然的选择。","keywords":"盛唐繁荣 浪漫主义文学传统 家庭的熏陶 豪迈的性格 丰富的阅历 错综复杂的思想","note":"一般来说，与人相关的某种现象形成的原因都可以从社会原因和个人原因的角度来分析把握。李白浪漫主义诗风的形成与唐朝特定的文化大背景有着必然的深刻的联系；而他的个人经历，也使他成为积极浪漫主义伟大的旗手。大家可以从这些方面入手，展开分析。相关内容可以参考李连发《李白浪漫主义诗风探源》，具体资料可以在李凡文学正版群内领取。"},{"id":"161","stars":"★★★","title":"试述李白的诗歌史地位","body":"李白是中国文学史上一位承前启后、继往开来的伟大作家。他继承了《诗经》《楚辞》以及乐府民歌的优良传统，既以复“古道”为己任，提倡风雅，又汲取六朝作家的创作经验，从而形成了想落天外、逸兴云飞、清新自然的创作风格，成为中国诗歌史上一道亮丽的风景。\n\n一、浪漫主义诗歌又一高峰\n\n李白的诗歌，继承了前代浪漫主义创作的成就，以他叛逆的思想，豪放的风格，反映了盛唐时代乐观向上的创造精神以及不满封建秩序的潜在力量，扩大了浪漫主义的表现领域，丰富了浪漫主义的手法，并在一定程度上体现了浪漫主义和现实主义的结合。这些成就，使他的诗成为屈原以后浪漫主义诗歌的新的高峰。\n\n二、推动了唐代诗歌革新\n\n李白对唐代诗歌的革新也有杰出的贡献。他继承了陈子昂诗歌革新的主张，在理论和实践上使诗歌革新取得了最后的成功。在诗歌理论上，李白回顾了整个诗歌发展的历史，以自豪的精神肯定了唐诗力挽颓风，恢复风雅传统的正确道路。在创作实践上，他也和陈子昂有相似之处，多写古体，少写律诗，但他在学习乐府民歌以及大力开拓七言诗上，成就却远远超过陈子昂。他这些努力对诗歌革新任务的完成起了巨大作用。\n\n三、将进取之狂演绎得淋漓尽致\n\n李白那“天生我材必有用”的非凡自信，那“安能摧眉折腰事权贵”的独立人格，那“戏万乘若僚友，视同列如草芥”的凛然风骨，那与自然合而为一的潇洒风神，曾经吸引过无数士人。在中国古代封建社会那种个体人格意识受到正统思想压抑的文化传统中，李白狂放不受约束的纯真的个性风采，无疑有着巨大的魅力。他的狂既是自身人格的外化，又是时代精神的产物，李白完美地将二者融为一体，诠释了盛唐狂士的独特魅力。李白作为中国古代文人中“狂”的典型，将进取之狂演绎得淋漓尽致，不仅在唐代诗坛具有代表性，也影响着后来的文人骚客。\n\n四、从诗歌风格上影响后世文人创作\n\n李白诗歌豪放飘逸的风格、变化莫测的想象、清水芙蓉的美，对后来的诗人有很大的吸引力。李白诗歌对后代的影响也是极为深远的。他的诗名在当代已广泛传扬，到贞元时期，他的没有定卷的诗集已“家家有之”。中唐韩愈、孟郊大力赞扬他的诗歌，并从他吸收经验，以创造自己的横放杰出的诗风。李贺浪漫主义的诗风更显然是受过他更多启发的。宋代诗人苏舜钦、王令、苏轼、陆游，明清诗人高启、杨慎、黄景仁、龚自珍等也莫不从他的诗中吸收营养。此外，宋代以苏轼、辛弃疾为代表的豪放派的词，也受过他的影响。由于他以才力写诗，凭气质写诗，他的诗风事实上是无法学习的。在中国诗歌史上，李白有不可更替的不朽的地位。\n\n【李凡关键词：浪漫主义诗歌高峰 唐代诗歌革新 进取之狂 诗歌风格影响后世文人】","keywords":"","note":"李杜文章在，光焰万丈长，说到诗歌，就必然绕不开李白和杜甫这两座高峰。作为屈原之后最伟大的浪漫主义诗人，李白将前人对于诗歌的革新进一步推进，在中国浪漫主义诗歌整体发展上具有承前启后的重要意义。可以说，李白的浪漫诗风，正是代表着盛唐昂扬进取的一面。"},{"id":"162","stars":"★★★","title":"试述杜甫诗歌创作风格的发展","body":"杜甫的诗歌创作历程与其人生经历紧密相连，随着个人经历和社会环境的变化，其诗歌创作呈现出不同的风貌。纵观其一生，可分为四个阶段。\n\n一、读书壮游时期（35岁前）：蓬勃向上的朝气\n\n这一时期是诗人创作的准备时期。杜甫早慧，十四五岁便与文坛前辈相交，并受夸奖，这都为他日后的诗歌创作打下了良好的基础。杜甫的青年时期曾有过一段南北漫游、裘马轻狂的生活。这次壮游使杜甫结交了不少文学造诣深厚的朋友，丰\n\n富了他的阅历，扩大了他的视野，陶冶了他的性情，也使他的诗歌创作充满蓬勃向上的朝气，为他诗歌创作的成熟奠定了基础。但从他留下的为数不多的作品来看，他这一时期涉世还不深，更未接触到社会深层问题。\n\n二、困守长安时期（35岁至44岁）：客观写实的创作方向和沉郁苍凉的诗歌风格\n\n这是安史之乱的酝酿时期，也是杜甫的生活、思想和创作的重要转变时期。杜甫怀着“致君尧舜上，再使风俗淳”的政治理想来到长安，但残酷的现实很快击破了他的幻想。困守长安的十年，杜甫生活拮据，辛酸屈辱的现实生活与雄心壮志形成鲜明对比。贫困的生活体验使诗人的性格逐渐由轻狂转为深沉。杜甫历尽人生辛酸，看到了生民疾苦，他身上那仁民爱物的情怀在这颠沛辛酸的生活里不唯未曾衰退，反而更加强烈了。这对于他的诗歌创作来说意义巨大。这一阶段，杜甫作为一个忧国忧民诗人走向成熟，奠定了他客观写实的创作方向和沉郁苍凉的诗歌风格。\n\n三、为官、流亡时期（45岁至48岁）：强烈的政治性和炽热的忧国忧民感情\n\n这是安史叛乱为祸最烈的时期，也是杜甫创作成就最高的时期。这一时期，国家处于剧烈的震荡中，王朝倾危，而杜甫本人生活也充满危险和艰难。他的诗歌创作，因为受到血与泪的滋养，达到了巅峰状态。他在作品中更加客观地记叙时代的真实。强烈的政治性和炽热的忧国忧民感情是该时期作品的突出特色，许多叙事性诗作更是思想性与艺术性的完美结合，代表了杜甫诗歌写实艺术的独特成就。\n\n四、漂泊西南时期（49岁至去世）：格律精致，技巧成熟\n\n这一时期是杜甫创作上的丰收期，有诗四百三十多首，内容从国家大事、朋友往来到个人身世都有涉及。在此期间，杜甫乐府古体诗的创作减少了，写了些回忆性自传体诗，如《壮游》《昔游》《往在》等。而七律诗的创作却大量增加了，在用七律表现社会政治生活方面有重大创获。在诗歌技巧上，他对诗歌格律、形式等写作技巧也有更深入的探讨，对七言律诗用力甚勤，创作达到了炉火纯青的地步。","keywords":"读书壮游 蓬勃向上 困守长安 客观写实 沉郁苍凉 为官、流亡 政治性 忧国忧民感情漂泊西南格律精致技巧成熟","note":"宋人评杜甫：“考其笔力，少而锐，壮而肆，老而严，非妙于文章不足以至此。”杜甫的诗歌创作，由于其生活体验的不同，在不同阶段显示出了不同的风格，并不断地走向成熟。大家可以结合杜甫的人生经历，分析杜甫诗歌创作的发展。"},{"id":"163","stars":"★★★★","title":"杜甫“诗圣”“诗史”的称呼你怎么理解。（25北京外国语大学）","body":"【答题框架】\n\n杜甫被后世尊称为“诗圣”，他的诗歌被誉为“诗史”。这两个称号不仅是对杜甫诗歌艺术的高度评价，更是对其人格精神和社会责任感的充分肯定。我对这两个称号的理解，主要如下：\n\n一、对“诗圣”的理解\n\n宋以前尚无“诗圣”之说。最早使用“诗圣”一词的，大概是北宋后期的晁说之。但这里的“诗圣”，不是指杜甫，而是指南朝齐谢朓。第一次正式称杜甫为诗圣的，大概是明代的费宏，但此时诗圣还不是杜甫的专名。到明代中后期，渐渐都称杜甫为诗圣，李白为诗仙。清初以后，大都称杜甫为诗圣。\n\n所谓圣，包括两个方面：一是学识或技艺达到极高的水平，一是道德修养达到极高的境界，足以为人师表，成人楷模，为人们所景仰和崇拜。所以，称杜甫为“诗圣”，一方面是指杜诗的集大成，杜甫诗备众体，诸体兼擅，诗艺达到了炉火纯青、出神入化的极高境界；另一方面是指杜甫的忧国忧民、忠君爱国、仁者情怀、高尚品德。（李凡说：这里要结合杜甫的\n\n思想内容和诗歌的艺术成就进行展开，后面已经有专门的论述，这里不再赘述）\n\n二、对“诗史”的理解\n\n“诗史”的内涵和指向要明确得多，主要是对杜甫诗歌的社会价值所作的一种历史评判。杜甫诗歌内容博大精深，存一千四百多首诗，既是他伟大人格的写真，又是安史之乱前后唐代社会的一面镜子。诗人从各个角度艺术地再现了特定史时期的社会面貌，历史的真实与艺术的真实在他的诗中得到了高度的统一。其反映现实生活的广度与深度，不仅同时代人无法比拟，也是古代文学史上任何一个诗人难以企及的，杜甫的诗堪称唐代由盛而衰的诗史。\n\n（一）揭露社会矛盾和贫富差距\n\n作为一代诗史，杜甫在诗中揭露了尖锐的社会矛盾和悬殊的贫富差距。天宝时期玄宗穷兵黩武，不仅使生产遭到严重研坏，也大大加剧了对农民的盘剥。杜诗深刻揭示了封建社会的基本矛盾：地主与农民的严重阶级对立和悬殊的贫富差别，正是唐朝由盛而衰、安史之乱爆发的根本原因。揭露统治阶级敲骨吸随的剥削，反对竭泽而渔，诛求无度，反映广大人民苦难，是杜诗重要的思想内容。\n\n（二）忧心时局、关心黎庶\n\n忧心时局、关心黎庶，是杜甫爱国主义思想的突出表现，是杜诗内容的一大特色，也是它成为诗史的又一重要原因。杜诗所反映的玄宗、肃宗、代宗三朝安史之乱前后二十余年间的军国大事，不仅可证诸史实，而且可以补充史实。其特点在于不作纯客观的叙述，而能把它们与诗人的亲身经历感受紧密地结合起来。\n\n（三）诗歌创作中浓郁的史诗特点\n\n杜甫的诗歌创作，尤其是其叙事性较强的五七言古诗，多以安史之乱前后的民生百态为对象，在典型环境中通过对典型人物进行叙写，使诗歌情感在具体事件的铺陈过程中自然流露，也体现出浓郁的史诗特点。如“三吏”“三别”不仅深刻，阔地反映了社会现实，还通过对百姓生活的铺写表达其同情。\n\n（四）在抒发闲情逸趣的题材中，融入身世飘零、忧国忧民之情\n\n杜甫在抒发闲情逸趣的题材中，也常融入身世飘零、忧国忧民之情，从而体现出鲜明的时代风貌和个性特征。其《秋兴》《登楼》《登高》《旅夜书怀》等皆将眼前江山、胸中社稷、国家兴衰与个人坎坷浑然无间熔铸于诗中，所表现出的家国之恨、身世之悲令人长久喟叹。他的咏物诗继承了托物言志传统，图貌写物，水乳交融。他所借以自喻的马、鹰、松柏等神骏高洁之物，风采寓意，篇篇不同。他的思亲念友之作也具有鲜明的时代特征和典型意义，但他并未沉溺于个人和家庭的不幸，而常能推己及人，并由此深化对社稷苍生的关怀。其胸怀之博大和人品之高尚，于此可见。\n\n杜甫被称为“诗圣”和“诗史”，不仅是对他个人成就的高度评价，更是对中国文学传统和社会责任感的一种肯定。他的诗歌以其卓越的艺术成就和社会价值，成为中国文学史上的一座丰碑。","keywords":"“诗圣”两个方面 集大成 诗备众体 炉火纯青 忧国忧民 仁者情怀“诗史”历史评判 社会矛盾和贫富差距 忧心时局 关心黎庶 史诗特点 身世飘零","note":"杜甫的被称为“诗圣”，包括两个方面的意义：一是指诗艺的高超绝伦，一是指道德修养达到极高的境界，足以为人师表，为人们所景仰和崇拜，大家可以结合杜甫诗歌的艺术成就展开讨论。“诗史”是指杜甫诗歌中所体现出来的“善陈时事”的现实主义精神和创作方法。这既是对《诗经》风雅精神的继承，又影响了后代诗人如白居易新乐府的创作。杜甫伟大的精神，正由这“诗史”所承载。相关内容可以参考张忠纲《说“诗圣”》、刘宁《杜甫五古的艺术格局与杜诗“诗史”品质》，具体资料可以在李凡文学正版群中领取。需要注意的是，杜甫诗歌的“诗史”性质可能会单独被拿出来考查，像是25年中南财经政法大学就考查到了这一点，大家要注意灵活应对。"},{"id":"164","stars":"★★★★","title":"试论述杜甫叙事诗的特点","body":"杜甫写出了大量的叙事诗。不仅数量空前，而且质量也高。在这些叙事诗中，他全面地总结和发扬了《诗经》以来的现实主义创作精神和表现手法，达到了高度的思想性和高度的艺术性的统一。关于杜甫叙事诗的艺术特征，主要有以下几点：\n\n一、典型化手法\n\n杜甫善于选择并概括具有典型意义的社会现象，有名的诗句“朱门酒肉臭，路有冻死骨”，便是通过典型化的手法而获得惊人的艺术感染力的。同时，他还善于选择和塑造具有典型意义的人物，他往往从许多同一类型的人物里面选择并着重描写一个人物，通过这一个个别人物的塑造来反映一般，反映全体。例如《兵车行》只写那一个“行人”的谈话，但所有的行人的命运也就显示无遗。这里杜甫是把和许多行人交谈所得的情况集中在那一个行人身上，集中在那一个行人口中的。除《兵车行》外，《前出塞》和《后出塞》都是只写一个士兵的从军过程，同样也是用的典型化的手法。\n\n二、对现实的客观描写\n\n所谓客观的描写，并不是客观主义的描写，而是把自己的主观意识融化在客观的具体的描写中，让自己的主观倾向从客观事物的叙述中流露出来，而不是明白地说出。有时明白说出，但也是借用人物的口或者说通过人物的口来说出的，属于“寓主观于客观”。杜甫尽量避免主观的发议论，而尽量让事实说话。这是杜甫叙事诗最突出的特点，也是诗人杜甫最大的本领所在，因为要做到这点，不动声色，还必须具有能克制自己的感情冲动的冷静头脑。杜甫这样做是为了集中读者的目光和注意力，为了保全这一事件本身所具有的特殊的感染力。\n\n三、融入强烈的抒情\n\n多数的叙事诗，杜甫其实是作为抒情来写的，例如《羌村三首》。可以说，杜甫将客观的真实的叙述与主观的强烈的抒情融为一体，他的一些诗，很难分出是抒情还是叙事。有时还杂以议论，融抒情、叙事、议论于一体，长篇如此，短篇也如此，有赋的铺排、散文的句法，也有抒情诗的意境创造。杜甫的诗歌记述的是时事，反映的是历史的真实画面，而抒发的是一己情怀，这在中国诗歌史上是空前的，是诗歌表现方法的一种转变，是杜诗异于盛唐诗的地方。\n\n四、心理刻画\n\n叙事诗是有人物的，既是人物，当然有他的思想活动。没有思想活动的人物是不会生动的。杜甫非常注意这一点。这从《三别》3首诗全都可以得到证明。《三别》全是人物的自白，杜甫本人不出场。由于《三别》是用的第一人称的“我”，有利于作心理的刻画，所以在《三别》中全都可以看到人物的心理状态，而且这些心理刻画，都非常细致、曲折、逼真。\n\n五、语言的个性化\n\n为了把人物写得生动，杜甫在他的叙事诗中不只是采用对话的表现手法，而且注意到“对话”中人物语言的个性化。所谓语言的个性化，也就是什么样的人说什么样的话，符合人物的身份、年龄、性别和处境。在这点上，杜甫也是非常成功的。例如《兵车行》中那位行人的语言，《石壕吏》中那位老妇的语言，《垂老别》中那位老汉的语言，都写得恰如其分。特别是《新婚别》写那位新娘子的话更是惟妙惟肖。正因为人物语言是个性化了的，所以我们读杜甫的叙事诗，总有一种如见其人，如闻其声的感觉。\n\n六、细节描写\n\n杜甫善于辨别也善于捕捉富有表现力的、能够反映事物本质和显示人物精神面貌的细节。杜甫诗中的细节描写，或人或物或心情，精心刻画，从细微处见出真实，展开画面，把人引入某种氛围、某种境界。如《北征》叙述从凤翔到鄜州途中的一路所见，通过一些细节描写，从一个视角展现了广阔的历史画面。也正是这些细小的描写，使杜诗的叙事方式有别于此前的叙事诗，从概括描写走向写具体事件的片断，同时概括描写常有的夸张更少了，增添了更多真实感，并且故事性被冲淡了，生活色彩则得到极大的加强，《兵车行》《羌村三首》、“三吏”“三别”等诗无不如此。\n\n七、多采用俗语\n\n多用俗语，这是杜诗语言的一大特色。杜甫在抒情的近体诗中也多用俗语，但在叙事的古体诗中则更为丰富，关系也更为重要。因为这些叙事诗许多都是写的人民生活，采用一些俗语，自能增加诗的真实性和亲切感，并有助于突出人物性格和语言的个性化。","keywords":"典型化手法 客观描写 强烈的抒情 心理刻画 语言个性化 细节描写 多采用俗语","note":"在杜甫以前，文人写的叙事诗是很少的，而杜甫则在诗中大量运用叙述手法，以五、七言古体写时事，留下了不少名篇，可以说叙事技巧在杜甫手中达到了高度成熟。杜甫叙事诗对于宋代以黄庭坚为首的江西诗派影响很大。对于这一部分内容，我们要注意重点掌握。相关内容可以参考谢思炜《杜诗叙事艺术探微》，具体资料可以在李凡文学正版群内领取。"},{"id":"165","stars":"★★★★★","title":"试论述杜甫律诗创作的成就（26首都师范大学）","body":"律诗在杜诗中占有极重要的地位，杜甫的律诗在艺术上的成就更为辉煌。杜甫不仅对律诗具有开拓之功，还从诗境创造和艺术技巧两方面推动了唐代律诗的成熟。具体来看，杜甫律诗的主要特点，表现在以下方面：\n\n一、在律诗题材和形式上进行挖掘，拓宽了律诗的表现空间\n\n杜甫不仅以律诗写应酬、咏怀、羁旅、宴游，以及写山水，而且用律诗写时事。以古体写时事，较少受限制，杜甫多数写时事的诗都是古体；用律诗写时事，字数和格律都受限制，难度更大，而杜甫却能运用自如。他这部分写时事的律诗，较少叙述而较多抒情与议论。在杜甫之前，七律多用于宫廷应制唱和，内容贫乏，语言较为平缓无力，亦乏佳作。而至杜甫，他不仅在声律上把七律推向成熟，更重要的是充分发掘了这一诗歌形式所蕴含的可能性。杜甫利用它比五律稍大的篇幅，使之能够包含更大的容量。在语言节奏上，虽然七律每句仅比五律多两字，但经过杜甫的精心调节，却可以产生多种多样的变\n\n化，使七律成为一种既工丽严整，又开阖动荡，具有独特艺术表现力的诗型。杜甫还使用七律表现现实重大题材，且较多抒情与议论，大大拓展了律诗的表现空间。\n\n二、以律诗写组诗，扩大了律诗的表现力\n\n杜甫还用多首律诗围绕一个主题展开抒写。这种以组诗形式表现一些较难表现、较宽泛内容的做法，为杜甫所独擅。五律和七律都有这样的组诗，而最为成功的是七律。《秋兴八首》可以说是杜甫律诗中的登峰造极之作。这组诗写于滞留夔州时期，要表现的是一种深沉复杂的感情，交错着感慨、回忆、思念与对时局的看法，要用一首诗来把这些复杂的、低徊不尽的感情表达出来不容易做到，或者说不容易表现得淋漓尽致，而用组诗则可以做到这一点。以律诗写组诗，极大地扩大了律诗的表现力，这是杜甫在律诗发展史上的贡献。\n\n三、浑融的境界\n\n杜甫律诗曲尽其变，合律而不受声律束缚，对仗工整而不觉其迹，从而营构出了浑然一体的诗境。如《闻官军收河南河北》，全诗把一种骤然到来的狂喜心情表现得淋漓尽致，用“忽传”“初闻”“却看”“漫卷”这些动词，加强了突然性和随意性色彩；用“即从”“便下”“穿”“向”等词，连接四个地名，造成风驰电掣的气势；表达的方式，仿佛散文一般，感慨流畅，连贯性、整体感极强，毫不受律体的束缚。\n\n四、从严谨中求变化的态度\n\n杜甫说：“晚节渐于诗律细。”这正是他对律诗的主要追求。“诗律细”不仅在于声律的精心安排，也在于从严谨中求变化，变化莫测而不离规矩。而“老去诗篇浑漫与”则强调诗律之精并非刻意雕琢，而是自然天成的。有时他为了表达某种感情的需要而写拗体，晚年七律拗体更多，这种拗体与七律初期出现的某些不合律现象是不同的，它是成熟之后的通变，表现为变化中的完整。\n\n五、注重字与句的锤炼\n\n杜甫律诗的又一成就，在句与字的锤炼，加大字与句的容量；常用倒装叠字，使句式富于变化。杜甫炼字，用力之处在表现神情韵味。他的用字，常常达到一字之下，他人难以更改的地步。他善于用动词使诗句活起来，用副词使诗疏畅而富于转折，特别是“自”字，他实在是用得好极了。他还善于用颜色字以强化某种情感色彩，用叠字以创造氛围，用双声叠韵以使诗的声调更加和谐悦耳，用俗字口语使诗读来更加亲切。炼字，是他的自觉追求。","keywords":"表现范围 表现力 浑融的境界 严谨中求变化 字与句的锤炼","note":"杜甫在律诗创作上取得了令人瞩目的成就，可以说，律诗正是在杜甫手中走向了成熟。在题材与艺术上，杜甫都对律诗进行了开拓，大家可以结合其具体作品细细体会。这部分内容也可以回答“杜甫律诗的主要成就”，比如25年河南大学就考查到的“杜甫对律诗发展史的贡献”这道题目就完全可以使用这部分内容作答，大家要注意灵活应对。"},{"id":"166","stars":"★★★★★","title":"试分析杜甫“沉郁顿挫”的诗风","body":"杜甫是个集大成的诗人，他的诗歌风格是多种多样的，而最主要的风格则是其夫子自道的“沉郁顿挫”。\n\n一、“沉郁顿挫”风格形成的原因\n\n（一）性格遭际影响\n\n杜甫性格深沉、思想深邃、感情深挚，又有饱经忧患、壮志难酬的坎坷遭遇。经眼风云与胸中潮汐交融汇合，思蕴既深，郁结复厚，诉之于诗，“随所遇之人、之境、之事、之物，无处不发其思君王、优祸乱、悲时日、念友朋、吊古人、怀远道，凡欢愉、幽愁、离合、今昔之感，-触类而起”，形成沉郁、深厚的风格。\n\n（二）写真传神的审美理想\n\n作为伟大的现实主义诗人，杜甫对诗、书、画的审美要求是写真传神。所谓“真”“神”，即事物的真相、本质。作为这种审美要求的实践，杜诗写时代之实、道性情之真、传事物之神。诗人的肺腑肝胆坦于字里行间，使人悲，使人愤，具有震撼人心的艺术力量。他善用典型化的方法，从众多的事物中选取最有代表性者，又从众多现象中提炼本质，发掘意蕴，加以集中概括，达到以小见大、以少总多的艺术效果。形成风格，则深厚而不肤浅，沉挚而不浮泛。\n\n（三）追求宏观的惊世骇俗与微观的毫发无爽相统一的审美效果\n\n这种艺术追求体现在杜诗中，便是雄浑壮阔的意境与精细入微的表现手法的统一。可见杜甫胸中气吞八荒，笔下包举山海，其诗自有宏大壮阔之美。同时，作为现实主义诗人，杜甫崇尚写真传神，追求体物工细、毫发无爽。杜甫又善于将宏大与精微、壮阔与深细完美地结合起来，通过身边琐事、眼前景物、一时感触的深细描绘，反映天下大事、刻画壮阔境界、表现博大情怀，这也有助于形成雄浑沉郁的风格。\n\n（四）寓意深远、表达一波三折\n\n杜诗的沉郁顿挫，还与其寓意的深远、表达的一波三折有关。杜甫善于把丰富的感情、层叠的蕴涵集中浓缩，托物比兴，即景言志加以表达。他还惯用层层转折、以退为进、盘旋而上、曲折而下之类抑扬顿挫的手法使要表达的内容愈转愈深。\n\n（五）语言凝炼苍劲，句式拗折变化\n\n杜诗的沉郁顿挫，还与他“为人性僻耽佳句，语不惊人死不休”的创作态度和语言功力有关。杜甫是语言的巨匠，杜诗的语言有精炼苍劲的特点，这取决于他深刻的思想、深入的洞察力和高度的概括力。杜诗十分注意字、词、句的锤炼，力求达到神完意足的境界。为确切地表达或更有力地强调某方面的意义，杜甫还打破五言上二下三、七言上四下三的句式常规，予以变化。这样的炼句，增强了五七言诗的表现力。总之，杜诗语言的凝炼苍劲，句式的拗折变化，也是构成杜诗沉郁顿挫风格的重要因素。\n\n二、“沉郁顿挫”风格的表现\n\n沉郁顿挫主要概括了杜诗在思想内容方面忧愤深广、表达上波澜曲折的特点。\n\n（一）“沉郁”\n\n（1）“沉郁”在内容上的表现\n\n从形式上看，“沉郁”的内涵所指，一般认为是杜诗的思想感情之沉厚、深沉、沉雄、沉着、浓郁、郁勃、忧郁、郁结，这些解释都与杜诗的基本内容相吻合。杜甫是一位系念国家安危和生民疾苦的诗人。动乱的时代，个人的坎坷遭遇，一有感触，则悲慨满怀。他的诗有一种深沉的忧思，无论是写生民疾苦，还是写自己的穷愁潦倒，感情都是深沉阔大的。\n\n（2）“沉郁”在形式上的表现\n\n杜甫在一些描绘山川景物或反映个人身世的作品中，每每采用“时空并驭”的手法，即在一个联语（一个押韵单元的两句诗）中，从时间和空间两个角度下笔，使诗境具有超常的广度、厚度与深度。这一手法，在描写壮大的景物和感叹个人身世的联语中常常出现，还常常用于表达漂泊岁月中的时局感受或身世感受。每每在一个联语中，兼出时、空两种意念。而且，经常使用“百年”“万里”“日月”“乾坤”等词汇，极力扩展时、空的程度，造成悲壮深沉的诗境，塑造出白发老人面对天下烽烟的艺术形象。\n\n（二）“顿挫”\n\n（1）“顿挫”的在内容上的表现\n\n众所周知，批判现实是整部杜诗的生命线。“致君尧舜上，再使风俗淳”，是杜甫的政治理想，而要“致”要“使”，都是离不开规谏和批判的。杜甫一生无论居官还是在野，他所做的大事之一就是用诗歌批判现实，包括他所经历的三代君主-玄宗、肃宗、代宗，一个都没放过，言辞之尖锐、深刻，无他人可比。杜甫诗中抑折、批判色彩正是“顿挫”在内容方面的表现。\n\n（2）“顿挫”在形式上的表现\n\n从形式角度理解，杜诗的“顿挫”风格，表现在杜诗每每在一句或两句之间，意思发生逆转，前后形成针锋相对之势。其次，杜诗具有独特的取景抒情方式。杜甫言愁，较少取用哀景，更多的是取用丽景。他惯以丽景伴愁心，心越愁而景越丽，从而构成情与景的巨大冲突，在冲突中，感情表达获得了超常的力度。","keywords":"性格遭际 写真传神 惊世骇俗与毫发无爽相统一 寓意深远 一波三折 凝炼苍劲 拗折变化 思想感情沉厚 时空并驭 抑折批判 前后针锋相对 情与景冲突","note":"杜甫诗歌的主要风格是沉郁顿挫，对这种风格进行解释是近几年文学的常考点，在背诵时要结合杜甫生活的时代背景、生活经历和具体作品进行分析。这一风格的成因，我们需要从杜甫的性格遭际、审美理想、审美追求、情感表达和语言等方面进行分析，而这一风格的表现，我们则要从内容、形式两个层次分别展开叙述。需要注意的是，“沉郁顿挫”风格的成因和表现可能单独出题，大家要注意灵活应对。相关内容可以参考韩成武《新论“沉郁顿挫”的内涵》，具体资料可以在李凡文学正版群中领取。"},{"id":"167","stars":"★★★","title":"试分析杜甫对诗歌体裁的发展","body":"作为深受盛唐文化哺育的诗人，杜甫早年也曾乐观自信、昂扬奋发，但受到时代原因和个人经历的影响，他的诗歌由高唱个人理想转为对社会生活的客观写实。与这种写实方法相适应的是诗人纯熟地运用和创造了一系列艺术手法，并取得了巨大的诗歌艺术成就。杜甫对诗歌体裁的发展，主要表现在以下方面：\n\n杜甫在继承前代文学遗产和博采古今作家之长的基础上，形成了自己独特的诗歌风格，并且众体兼长。杜甫对前代诗歌的态度比较宽容，主张“转益多师”而不轻易加以否定。杜甫在艺术上善于博采众长，兼具古诗人的各种风格，不仅能熟练地运用各种诗体进行创作，而且经过他的实践和探索，各种诗体也都有了长足发展。他的诗歌应用范围较广，不仅用诗歌来叙事抒情，还用来写作与友朋往来的书信、游记、政论、诗文评等，几乎无所不能。\n\n二、开拓律诗题材和形式，从诗境创造和艺术技巧两方面推动了唐代律诗的成熟\n\n杜甫对律诗特别是七律的开拓主要表现在两方面。首先是在题材上，他不仅在声律上把七律推向成熟，更重要的是充分发掘了这一诗歌形式所蕴含的可能性。其次，杜甫还用多首律诗围绕一个主题展开抒写。这种以组诗形式表现一些较难表现、较宽泛内容的做法，为杜甫所独擅。\n\n杜甫不仅对律诗具有开拓之功，还从诗境创造和艺术技巧两方面推动了唐代律诗的成熟。首先，杜甫律诗曲尽其变，合律而不受声律束缚，对仗工整而不觉其迹，从而营构出了浑然一体的诗境。其次，杜甫对诗律采取从严谨中求变化的态度。最后，杜甫律诗造诣还在于他炼字炼句上的成功。杜甫善于用动词使诗句活起来，用副词使诗疏畅而富于转折，用颜色字以强化某种情感色彩，用叠字以创造氛围，用双声叠韵以使诗的声调更加和谐悦耳，用俗字口语使诗读来更加亲切。炼字琢句是他的自觉追求。\n\n三、对古体诗创作进行开拓与创新\n\n杜甫在律诗创作取得巨大成就的同时，在古体诗创作上也体现出开拓与创新。杜甫的古体诗创作分为两个方面，一类是用五言古体写成的自叙性叙事长篇，另一类则是五七言叙事诗。总体而言，杜甫的古体诗创作有下述四个特点。\n\n首先，杜甫五七言古诗能牢笼千人而又别开生面。他的乐府诗摆脱六朝以来陈陈相因的俗套。其次，杜甫善于通过典型事例来反映社会生活和历史事件，对现实进行高度的艺术概括。再次，杜甫的古体诗还善于揭示人物复杂的内心活动。最后，杜甫的古体诗十分重视诗歌的形象性，并常把自己的主观爱憎融注其中。","keywords":"众体兼长 开拓律诗题材和形式 推动唐代律诗成熟 古体诗开拓与创新","note":"杜甫对诗歌体裁的发展，是杜甫相关知识点考查时的一个重点，大家在作答时，可以结合杜甫的代表作品进行理解记忆。总体来看，杜甫擅长各种体裁的创作，而尤其擅长律诗和古体诗，像是“三吏”“三别”都是古体诗，而律诗更是在杜甫手中成熟。"},{"id":"168","stars":"★★★★★","title":"试分析杜甫诗歌的艺术特征","body":"李白和杜甫是中国诗歌史上雄视今古的双子星座，分别代表诗歌创作中浪漫主义和现实主义创作的高峰。杜甫的诗歌创作，主要具备如下特征：\n\n一、集大成的特点\n\n在唐代诗坛上，杜甫以其孜孜不倦的创作精神和严肃认真的写实态度，客观真实地描绘了万方多难的时代，抒写深沉的优国忧民情怀，从而使诗坛创作倾向由盛唐时代的高歌个人理想，逐渐转变为中唐时期面向社会的客观写实和深入剖析。与此同时，杜诗在艺术上也完成了荟萃前人诗歌技巧的历史使命。他不但集以往之大成，而且通过自己的艺术实践加以革新创造，以新的面貌开启后世。杜甫的诗歌创作，实具有集大成的特点。主要表现在两方面。首先，继承《诗经》、汉乐府以来诗歌的写实传统，为中国古代诗歌反映社会人生开辟了广阔道路。其次，博采古今作家之长并形成自己独特的诗歌风格。\n\n二、儒者的淑世情怀\n\n杜甫儒者的淑世情怀一直根深蒂固。他所接受的主要是儒家的“仁政”“民本”思想。对儒家的社会理想，杜甫不是仅作标榜，也不是稍遇挫折便转向“独善”，而是非常笃信和执着。与此同时，他对儒家思想中的消极因素也有所批判。\n\n忠君是杜甫淑世情怀的另一侧面。他把君王看成是国家社稷的化身，把“得君”视为“行道”的唯一途径，把振兴国家、改善民生和实现自身价值的希望全都寄托在“明君”身上。需要强调的是，虽然杜甫充满淑世情怀，充满忠君思想，但他的忠君是以国和民为前提的。因此，他一方面对皇帝充满幻想，另一方面又基于爱民悯时，揭露苛政。\n\n三、沉郁顿挫的风格\n\n杜甫诗歌风格多样，但最主要的风格还是“沉郁顿挫”。“沉郁”主要是指感情深沉苍凉、境界开阔壮大；“顿挫”则指语言刚健、音调铿锵和章法多变。沉郁顿挫主要概括了杜诗在思想内容方面忧愤深广、表达上波澜曲折的特点。\n\n杜甫是一位系念国家安危和生民疾苦的诗人。他的诗有一种深沉的忧思，无论是写生民疾苦，还是写自己的穷愁潦倒，感情都是深沉阔大的。他的诗，蕴含着一种厚积的感情力量，每欲喷薄而出时，他的仁者之心、他的儒家涵养便把这喷薄欲\n\n出的悲怆抑制住了，使它变得缓慢、深沉，变得低回起伏。同时，杜甫在语言锤炼方面也体现了沉郁顿挫的风格。杜诗用字下语，安排句式，务使声韵铿锵，抑扬缓急，顿挫有致。\n\n四、以议论入诗\n\n成功地在诗歌中大量以议论入诗，是由杜甫开其端。杜诗议论手法的运用，有如下开创性的特点：首先，杜甫不仅在五七言古诗诸作中运用议论手法，而且在五七言近体中也运用自如。其次，杜甫在诗歌中将议论与形象有机结合。再次，杜甫诗歌中议论与叙事相结合。此外，杜甫还将议论与抒情相结合，以情韵行之。最后，杜甫的议论手法十分多样，不拘一格，随内容和表达的需要而灵活变化，对韩愈和宋诗的议论影响不小。","keywords":"集大成 儒者的淑世情怀 沉郁顿挫 以议论入诗","note":"如果说李白代表着唐代浪漫主义诗风的巅峰，那么杜甫就是唐代现实主义诗风的巅峰。而且相较于李白想落天外。放纵不羁，杜甫的诗歌具有更为完整的章法，因而他的诗歌在后世有更加深刻的影响，如江西诗派就奉杜甫为“祖”。所以，相较于李白，杜甫在考查中出现的频率更高一些，所以对于其创作特征，我们要重点关注。"},{"id":"169","stars":"★★★★","title":"试分析杜甫在文学史上的影响","body":"在中国诗歌史上，杜甫既是一位集大成的诗人，又起着承上启下的重要作用。杜甫爱国忧民的思想和精深的艺术技巧对后世诗人具有重要影响。总体来看，杜甫的深远影响，主要表现在以下方面：\n\n一、继承唐前写实叙事的传统并加以创变\n\n中国诗歌中的写实传统早在周代就已产生，汉魏乐府更是将写实精神和创作手法向前推进了一大步，出现了大量“缘事而发”的叙事诗，对话的运用、人物性格的刻画和细节描写都趋于成熟和完善。建安以后，写实主义创作逐渐转入低潮，至唐方略见起色，因此总结并发扬古代诗歌写实主义传统的任务是由杜甫来完成的，杜甫诗歌的写实主义传统主要表现在他的新题乐府诗中。他没有遵循建安以来沿袭乐府古题的创作方法，而是本着汉乐府“缘事而发”的精神自创新题，即所谓“即事名题”或“因事命题”。其实，是否使用古题，并非只为单纯的形式问题，而是为后代诗人指出了一条通向现实的创作道路。这一影响一直贯穿到清末黄遵宪等人的诗歌创作中。\n\n二、影响了后世诗歌艺术的发展\n\n杜甫精湛的诗歌艺术泽被后世诸多诗人。从古代诗歌艺术的发展来看，从中唐至明清，历代诗人中受杜甫影响者非常多。他们从各自的性格爱好、学力才情出发，学习杜诗的艺术风格技巧，各有所得。在唐代，有的学杜诗亲风雅的写实精神，注重诗歌缘事而发和写民生疾苦，有的则偏重学习杜诗遣词造句的艺术技巧以求新变。到了宋代，杜诗在长期接受过程中得到普遍认可，成为宋人作诗效法的最高典范。明清两代，敬仰杜甫、自觉学杜的人就更多了，他们都从不同侧面学习杜诗，取得了较高的成就。此外，宋以后杜诗注本的繁盛，也从一个方面说明了杜诗的影响。\n\n三、在思想上影响士人人格的形成\n\n杜甫的更为重要的影响，是在思想情操方面。他系念国家安危，同情生民疾苦，为历代士人所崇仰，在士人人格的形成上，有不可估量的影响。宋代真正能够继承杜甫爱国思想、发扬杜诗沉郁顿挫风格者，首推陆游和文天祥。陆游终生以爱国忧民为怀，直至临终还“但悲不见九州同”，惦记恢复中原，他的七律深得杜诗神髓，具有沉郁苍凉的风格。文天祥一生敬仰杜甫，他的思想与杜甫的情感完全一致。明清直到近现代，杜甫诗中的爱国精神依然为世人所高扬。\n\n四、开拓了诗歌的表现领域\n\n杜诗对后世的影响，除了忧国忧民的精神和精湛高超的艺术技巧外，还体现在他开拓了诗歌的表现领域。后世诗歌中以诗论诗，用诗题画，用诗写日常生活，用诗代替奏疏信札，杜甫都是开风气之先的人物。\n\n【李凡关键词：写实叙事传统 诗歌艺术发展 士人人格形成 开拓诗歌表现领域】","keywords":"","note":"在诗歌发展史上，杜甫既是一位集大成的人物，又是一位承上启下的人物。他一方面继承了先秦魏晋以来诗歌创作的经验，一方面又为后世诗人的诗歌创作提供了经验与启发。但最重要的影响，是他高尚的思想情操，这种心系国家、关心民生的精神影响着一代代士人的人格与追求。"},{"id":"170","stars":"★★★★★","title":"试比较李白和杜甫诗歌的区别","body":"李白和杜甫被视为古代诗歌星海中的双子星，被我们分别称为“诗仙”和“诗圣”。尽管他们年纪只相差十一岁，但却生活在唐朝截然不同的社会背景下，也因此形成了截然不同的艺术风格和个性特征。二人诗歌的差别，主要表现在以下方面：\n\n一、创作方法的不同\n\n对朝廷的腐败，李白、杜甫采用不同的形式来抨击这社会的不公。李白用浪漫主义手法通过梦游的方式，抒写了他对山水名区的喜爱，对仙界的向往，表现其鄙弃世俗，蔑视权贵，追求自由的思想。\n\n至于杜甫，则是采用现实主义笔法，将自己所见所闻所感给记叙下来。作为一个优国忧民的现实主义大诗人，杜甫的咏史诗都是密切联系现实和自身。因此，在杜甫的咏史诗中我们可以看见当时的社会状况，也能看见作者的自身形象。\n\n二、诗歌风格的不同\n\n李白诗歌的主导风格是飘逸俊美。李白是继屈原以来最著名的浪漫主义诗人，他有着强烈的积极向上的精神，充满自信，渴望施展才华成就一番事业。他从少年开始就喜欢游历于山水之间，使得他的许多诗歌自由奔放，充满浪漫主义气息，那种酣饮之后的豪情万丈是他人难以企及的魅力。\n\n杜甫诗歌的主导风格是沉郁顿挫。杜甫则是现实主义诗人的代表，一生颠沛流离，饱尝世间疾苦，所以十分体会老百姓的苦难，具有人道主义的关怀。他的诗歌蕴含着一种深沉的忧思，那种个人的惆怅和对百姓苦难的悲悯呼之欲出，意味深远。\n\n三、诗歌语言的不同\n\n李白的诗歌自然朴素，飘逸俊美，所咏之物脱口而出，不加雕饰。“清水出芙蓉，天然去雕饰”是对李白诗歌最精准的概括，尤其是一些绝句，非常质朴简洁，清新流畅。\n\n杜甫则十分重视语言的锤炼、用词准确，往往能通过两个字就能达到直扣人心的目的，可谓是“为人性僻耽佳句，语不惊人死不休”。\n\n四、诗歌意象的不同\n\n李白的诗歌多用浪漫意象，杜甫诗歌多用写实意象。李白的诗歌就是通过大量的浪漫意象展现出来的。李白诗歌中的自然意象，都十分富有个性，据袁行霈先生统计，在李白现存的987首诗篇中，宏伟的自然意象出现了1100多次，其中自然现象类以天、日、月、云、雪五种意象运用最多。\n\n跟李白相比，杜甫的诗歌则采用的是大量的写实意象。他是按照生活本身来塑造形象的，这些形象中都渗透着诗人感时伤事，忧国忧民的情感，带有浓烈的壮烈色彩。他把家仇国恨融汇在诗歌意象中，表现出当时的知识分子对国家命运的关心，有很强的典型性。\n\n五、美学追求的不同\n\n李白的诗歌给我们呈现的是自信豪放、乐观向上、热爱家国社稷、有远大的政治抱负的情怀，这是盛唐气象的杰出体现。诗人对高远目标的追求喷薄而出，这是一种风骨美，也是李白美学追求的核心。\n\n再来说杜甫，杜甫由于经历过社会的动荡，体味过生活的艰苦，因此诗歌中时常体现出一种深沉厚重的美学思想，意味深远。","keywords":"创作方法 诗歌风格 诗歌语言 诗歌意象 美学追求","note":"李白与杜甫作为盛唐时期成就最高的两位诗人，可以说是双峰并峙。但二人由于出身、际遇、思想等多方面的因素，导致二人的诗歌显示出了不同的个性特征。其中最主要的是现实主义与浪漫主义的区别，由此出发，可以发现二人诗歌在风格、语言、意象和美学追求的区别。"},{"id":"171","stars":"★★★","title":"试分析庾信对杜甫诗歌的影响","body":"杜甫对庾信的接受深入而全面，它不仅涉及对庾信前后期诗歌艺术风格的准确把握，还体现在字法、句法、章法等方面，庾信五言一体所蕴含的巨大诗歌史能量被杜甫发挥到了前所未有的高度。具体来看，庾信对杜甫诗歌的影响主要表现在以下几个方面：\n\n一、峭健沉郁的风格\n\n庾信入北后受河朔贞刚之质以及尚武之风的熏染，其众多行军、戎旅之作，不唯对仗精工、用事典切，还富清峭整健之气。清健之外，由于入北之后的抑塞心境，其《拟咏怀》诸作一转而为沉郁悲凉，多“风云”之气。笔力的雄健与情志的沉郁萧索融于一篇之中，构成了庾信后期之诗极强的审美张力。\n\n早自秦州始，杜甫的五言就已在清新中融入峭健，至蜀中、夔州时期，随着自身诗歌理念的成熟以及对庾信诗歌成就的深层次理解，杜甫对庾信此类作品深有领悟，不仅如此，在对庾信诗歌的体悟与借鉴中，杜甫还成功地将庾信五古峭健沉郁的风格引入到原本以工稳典雅见长的律诗中，由于境遇以及情感的相似与契合，杜甫对于庾信的风云意象以及虚实相生，兼\n\n有比兴的手法多所借鉴，沿着庾信《拟咏怀》诸篇所开拓的道路，杜甫在阔大雄浑的诗境中注入沉郁悲凉的情思，使得近体境界顿开。\n\n二、萧瑟衰飒的情感\n\n与早年的欢乐骀荡、雍容高华不同，入北后的庾信虽周旋于北周诸王之间，并写下了大量绮艳的奉和之作。然而，作为破国亡家的羁旅之臣，其内心却始终有一种深刻的羞耻感。惭耻之外，作为羁旅之臣的庾信对北周政权的变动亦心存戒惧。这种惭耻、戒惧的心境，加之长时间的卧病幽居生活，心境一转而为萧瑟、悲凉，每多萧瑟愁苦之音。\n\n乱离中的杜甫亦深切体验着羁旅之悲，频见于庾信笔下的“萧瑟”“萧条”“苍茫”“凄凉”等字眼也因此为杜甫所用。身处乱世流离、兵戈屡兴的杜甫对于庾信诗中“战鼓”“边塞”“风云”等意象，亦时时用诸笔端。衰飒之景外，庾信还时有羁旅穷老之叹，这一点，也为杜甫所继承，就表现手法上来说，庾信后期之作长于在悲凉、苍茫之境中演绎个人些微的日常悲欢，造成一种强烈的情感张力，这一手法至杜甫手中得到了淋漓尽致的发挥。\n\n三、朴拙直率的语言\n\n入北后的庾信精神上苦痛茫然的同时，物质生活亦极困顿，时赖北周诸王接济。困窘之中，自不免要为生计操劳，至有田家厌劳作之苦叹。与题材的“萧飒”“鄙俗”相应的，庾信后期的幽居之诗还多用“拙”词“鄙”句，值得注意的是，庾信在引鄙俗之事入诗，用拙辞累句的同时又能化俗为雅，乃至屡用拙语、率语、鄙语。这些田园幽隐之作使得庾信的诗歌境界大大突破了梁陈宫体之狭小。\n\n杜甫一生羁旅飘荡，饱经世态炎凉，人情冷暖。翻开杜诗，幽居穷困以及乞谢酬和之作随处可见。在精神的苦痛以及生活的困顿中，杜甫对庾信的朴拙、鄙俗之作颇能切身领会。同庾信入北后的幽居经历相似，羁旅中的杜甫亦时常处于幽栖之中。与之相应的，杜甫对庾信幽居诗中的拙语、率语颇为效仿。对庾信朴拙之作的接受，使得杜甫大大拓展了传统诗歌的题材范围，达到了无事、无物不可入诗之境。在继承庾信朴拙一面的同时，杜甫还继承了其化俗为雅的本领。对于庾信诗歌朴拙、率意中间以秾丽、生新等手法的体悟不仅使得杜甫体悟到了庾信诗歌的“老成”，更造就了其诗歌的集大成。\n\n四、字法、句法和章法的开拓\n\n作为古今体分流的一个重要坐标，庾信之五言新体与五古在字法、句法和章法上呈现出“精致”和“朴拙”两种截然不同的面目，对唐代诗坛的古今体进一步分流产生了极为深远的影响。\n\n作为古今体兼收的大家，杜甫作诗论诗极讲究诗法。凭着对庾信诗歌的深刻领悟以及对诗体分流的独到把握，杜甫敏锐地发现并借鉴了庾信诗歌在字法、句法和章法上所作的有益开拓，并在不同体裁、风格之间加以融合，形成了其诗歌“工而能化”之境界。","keywords":"峭健沉郁 萧瑟衰飒 朴拙直率 字法、句法和章法","note":"庾信对杜甫的影响是显而易见的，从“清新庾开府”到“庾信文章老更成”，这一影响贯穿了杜甫整体诗歌的发展。而且，二者在经历、情感上的确也有许多相似之处。故此，这两位诗人很可能被放在一起进行考查，大家对此要注意。相关内容可以参考仲瑶《论杜甫对庾信诗歌的接受与其自身诗歌理论构建之关系》，具体资料可以在李凡文学正版群内领取。"},{"id":"172","stars":"★★★","title":"谈谈杜甫对中晚唐诗歌艺术的影响（26北京大学）","body":"杜甫与李白相比，对后世诗歌发展的影响更加系统具体。如果说李白主要在精神气质与浪漫风格上感染后人，那么杜甫则是从诗歌的思想内容到艺术技巧等各方面都为后世诗歌创作提供了可以模仿的范式。整个中晚唐诗坛，几乎无不受杜甫诗歌的影响。\n\n一、“元白诗派”继承了杜甫重写实、尚通俗的倾向以及缘事而发、写生民疾苦的一面，且受到杜甫五言排律夹叙夹议的影响。杜甫继承汉乐府缘事而发的特点，创作了大量反映民生疾苦的作品，这些作品大多朴实真切、浅显通俗。杜甫诗中的写实性和通俗化倾向，在与他同时或稍后的元结、顾况、戴叔伦等人手中得到了不同程度的表现和继承，而到了贞元、元和年间，则有了强烈的回响。元稹、白居易等人极力推崇杜甫写实通俗的诗歌，并依此大力创作“新乐府”，借以补察时政。可以说，“元白诗派”的创作风尚深受杜甫影响，元白等人的“新乐府运动”更是对杜甫诗歌创作的直接继承。\n\n二、韩愈、孟郊、李贺等深受杜甫的奇崛、散文化和炼字的影响。杜甫自己说：“晚节渐于诗律细。”“诗律细”不仅在于声律的精心安排，也在于从严谨中求变化，变化莫测而不离规矩，有时他为了表达某种感情的需要而写拗体，显出“奇崛”的特点。杜诗还精于用字，刻画细微。杜诗的这些特点都为韩孟等人所继承，“韩孟诗派”主张“笔补造化”，即是对杜甫诗歌创作态度的继承。\n\n三、杜甫的“炼字”在晚唐更发展成苦吟一派。晚唐贾岛、姚合等人在创作态度上发扬了杜甫的“炼字”精神，形成了苦吟的创作风格。晚唐苦吟一派在音律、对偶、字句上见功夫，澄心静气地推敲锤炼，确实创造了不少佳句。\n\n四、李商隐的七律得力于杜甫七律的组织严密而跳跃性极大的技法，达到了杜诗的“浑融”境界。李商隐优秀诗歌所达到的浑融境界，在艺术上可以和杜甫诗歌的浑成境界遥相呼应。李商隐跟杜甫一样，内心深处有一股郁结很深的沉潜之气，发而为诗，在情思的沉郁上十分相近。由于内在充实，通体完整，两人诗歌都达到了“浑融”的境地。","keywords":"不平则鸣 雄奇豪放 重写实 尚通俗 格律组织严格 浑融","note":"李白与杜甫都对中晚唐诗歌发展产生了重要影响，对两人不同创作风格的继承与发扬导致了不同诗歌流派的产生，中晚唐的“韩孟诗派”与“元白诗派”之别，杜牧与李商隐之别，在某些方面正可以体现李杜二人对后世诗歌发展的不同影响。"},{"id":"173","stars":"★★★","title":"试分析杜甫的文化意义","body":"杜甫的意义决非局限于文学领域，他的光辉已经照耀到整个中华文化史，从而对后人起着人格典范的作用。总体来看，杜甫的文化意义，主要表现在以下方面：\n\n一、以整个的生命为儒家的人格理想提供了典范\n\n儒家极其重视修身，认为这是实现其政治理想的必要条件，杜甫对此是身体力行的。更重要的是，杜甫的命运正是一般人所容易遭遇的，既然杜甫能够在如此的平凡人生中完成儒家理想人格的建树，那么当然会使人产生“有为者亦若是”的联想，从而增加修行进德的信心。\n\n如果说先秦的儒者已经提出了“人皆可以为尧舜”的可贵命题，而宋明理学家的一大成就是在理论上阐明了“满街都是圣人”的可能性，那么杜甫正是以他的人生实践证明了这种可能性。对于一向以“有教无类”为宗旨的儒家来说，“诗圣”杜甫的出现具有极其重要的意义。\n\n二、以实际行为丰富了儒学的内涵\n\n杜甫以实际行为丰富了儒学的内涵，尤其是关于“仁”的内涵。“仁”无疑是儒家思想体系的精华，杜甫对之奉为金科玉律。杜甫以其人生实践使儒家关于“仁”的概念更为丰富，更为切实可行，也就是使“仁”的内涵在广度和深度两个维度上都得到了加强。\n\n（一）杜甫是以忧国忧民的形象而载入史册的。这种把仁爱之心施及于天地间万物的精神，乃是中华民族伟大胸怀的体现，是中华文化的核心价值之一，而杜甫对这种民族精神的铸造无疑作出了极大的贡献。\n\n（二）杜甫的仁爱之心完全来源于内心情感的真实流露，他用自己的行为证明了儒家学说的合理性。儒家在倡导仁爱精神时，有一个重要的特点，那就是把这种精神归因于人的自然本性。杜甫的行为完全符合儒家的立论原则。他对别人的爱都是发自内心的，毫无任何伪饰的成分，也毫无任何虚矫或浮夸，这无疑是回应了儒家对仁爱精神的倡导。\n\n三、在中华民族文化性格的陶铸过程中作出了杰出贡献\n\n不同的民族创造了不同的文化，而不同的文化又陶铸了不同的民族性格。杜甫的性格是受到中华文化的陶铸的，但是反过来说，在中华民族文化性格的陶铸过程中，杜甫也作出了杰出的贡献。\n\n（一）杜甫具有以天下为己任的责任感和忧国忧民的忧患意识，他始终把群体的利益看得高于一切。杜甫的责任感与忧患意识是相辅相成、融为一体的，这种精神形态正是杜诗沉郁顿挫的独特风格的内在本质。毫无疑问，这种精神形态具有积极的意义，它给后人带来的不是压抑和绝望，而是激昂和希望。\n\n（二）杜甫胸怀宽广，对不同的文化及思想采取了宽容的态度。这种对非主流文化乃至外来文化所采取的开放心态，正是中华文化赋予杜甫的最佳品格，这对杜甫成为诗国中的集大成者是有重要作用的。\n\n（三）杜甫对天地万物怀有深挚的仁爱之心，对各种思想文化都持宽容态度，但是这并不意味着无原则的迁就和妥协。杜甫的性格中，刚毅是很重要的成份。他一生中遭遇了无数的艰难困苦，但是从不屈服，从不动摇，仍然坚定不移地追求他的理想。而这，也无疑是中华民族性格的表现。\n\n杜甫是集中体现中华民族的民族性格的典型人物，是中华传统文化精神在文学领域内的闪光点。后人向他献上“诗圣”的桂冠，其中固然有褒扬其诗歌造诣集前代之大成的意义，但是更重要的原因则是他的人格精神在古代诗歌史上发出无与伦比的光辉。“诗圣”的称号既有文学的涵义，更有文化的性质，而且主要的意义在于后者。","keywords":"儒家人格理想典范 丰富儒学内涵 中华民族文化性格陶铸","note":"杜甫的影响，不仅仅局限在文学领域，他已经和屈原、陶渊明一样，成为了一个重要的文化符号，深深地影响了中华民族，代表着一种忧国忧民的忧患意识，一种兼济天下的伟大情怀，对后世文人的理想和追求产生了非常重要的影响。"},{"id":"174","stars":"★★★","title":"试分析杜甫《秋兴八首》的艺术成就","body":"《秋兴八首》是杜甫在公元766年，55岁旅居夔府时的作品。这是八首蝉联、结构严密、抒情深挚的七言律诗，体现了诗人晚年的思想感情和艺术成就。总体来看，这组诗的艺术成就，主要表现在以下方面：\n\n一、章法严整，层次分明\n\n《秋兴八首》内容丰富，感情深沉，章法缜密严整，层次分明。各首之间有伏笔、有照应。事实上，杜甫围绕一个中心主题，尽量深入发掘其思想感情的起伏变化，而不得不反复咏叹，婉转低回。\n\n八首诗是不可分割的整体，正如一个大型抒情乐曲的有八个乐章一样。这个抒情曲以国家兴衰的爱国思想为主题，以夔府的秋日萧瑟萧索，诗人的暮年多病，身世飘零，特别是忧念祖国安危的沉重心情作为基调。其间也穿插有明快欢乐的抒情，有表现慷慨悲愤情绪的，有极为沉郁低回的咏叹。就以表现诗人孤独和不安的情绪而言，其色调也不尽同。总之，八章中的每一章，都以它自己独特的表现手法，从不同的角度共同表现基调的思想感情。而它们每一章在八章中又是互相支撑，构成了整体。\n\n二、运用循环往复的表现手法，形成强烈的对比\n\n杜甫恰当地、熟练地继承了古人已有的循环往复的表现手法，八首诗中，用强烈的对比，无数次的循环往复，把读者引入诗的境界中去。组诗的纲目是由夔府望长安-“每依北斗望京华”。全组诗的枢纽是“瞿塘峡口曲江头，万里风烟接素秋”。从瞿塘峡口到曲江头，本来相去万里，诗人以一“接”字，把客蜀望京，抚今追昔，忧国家安危......种种复杂感情交织构成一个深厚悲壮的艺术境界。\n\n不论从夔府写到长安，还是从追忆长安而归结到夔府，总是夔府一长安，长安一夔府。循环往复，从不同角度，层层加深。全诗不仅毫无重复之感，还赋予诗以无比深沉感人的力量。这组诗里有繁华与冷落的对比，远与近的对比，个人处境的对比，唐中央政权的今昔对比，志愿与现实的对比，春与秋的对比等等。由对比产生的矛盾和苦闷，一切事与愿违。\n\n三、意象独特，意境深沉\n\n在意象选择上，一方面，杜甫情景交融，选取荒凉的意象，将自身感情熔铸进景色描写之中。如“江间波浪兼天涌，塞上风云接地阴”这一联，在描写景色的同时，也表现了诗人的极度不安，翻腾起伏的忧思和胸中的勃郁不平；也象征了国家局势的变易无常和脆弱不安的前途。两句把峡谷的深秋、诗人个人身世以及国家丧乱都包括在里面。\n\n另一方面，杜甫善于运用壮丽、华美的字和词表现深沉的忧伤。在《秋兴八首》中，他运用“蓬莱宫阙”“瑶池”“紫气”等在通常情况下很容易引起读者联想到春天的景色，以及愉快的心情的字和词，衬托荒凉和寂寞，用字之勇，真出于常情之外，而意境之深，又使人感到无处不在常情之中。","keywords":"章法严整 层次分明 循环往复 强烈对比 意象独特 意境深沉","note":"通常情况下，考查某位诗人时，很少会具体到某一首或某一组诗。不过，有些学校专门针对杜甫《秋兴八首》进行过考查，所以这里给大家整理了一道题目供大家参考。在作答时，大家可以从章法层次、循环对比和意象选取三个角度进行分析，注意紧密联系作品。"},{"id":"175","stars":"★★★","title":"简述大历诗风的特点","body":"大历年间是盛唐诗风向中唐诗风演变的过渡期，大历诗风，指的是大历至贞元年间活跃于诗坛上的一批诗人的共同创作风貌。其中“大历十才子”、李益、刘长卿、韦应物是这一时期的代表。总体来看，大历诗风主要表现出以下特点：\n\n一、表现出过渡状态\n\n大历时期的诗歌是连结盛唐诗歌高峰与中唐贞元、元和诗歌再次繁荣的一座桥梁，表现为一种过渡状态，这种过渡的特点主要体现在以下三个方面。\n\n（一）这时的诗歌创作中还有一些盛唐诗歌的流风遗韵。这个时期的诗人们，许多生长于安史之乱以前，于天宝末年或安史之乱以后登第入仕，受过盛唐诗歌那种激情闪烁、浪漫自信、气势飞腾的艺术熏陶，因此，在大历诗歌中或多或少地表现出盛唐诗那种高亢豪迈、雄健刚劲的风骨气概。\n\n（二）大历诗歌中的才情诗思普遍地趋向中和淡泊。虽然保留着一些盛唐诗歌的流风馀韵，但毕竟不是盛唐之诗了。诗中情感的奔突进发，激越慷慨与浓郁强烈，在大历诗中很少见到而代之以闲淡高雅与静穆冲和。\n\n（三）大历诗歌开启了中唐后期一些诗派的先河。元结、顾况等人倡导人生写实、对后来白居易、元稹等人写新乐府是很有影响的；韦应物等人山水诗的空寂清冷，和后来的柳宗元山水诗孤峭幽寒之气的形成是一脉相承的；而顾况诗歌的风格又与李贺很相近。\n\n二、冷淡色调的词语选择，凄凉衰飒的风格印象\n\n由于大历诗人多生不逢时之感，意气消沉，受其特定心境和意绪支配的诗歌的词语选择，往往带有凄清、寒冷、萧瑟乃至暗淡的色彩。在这方面，刘长卿表现得尤为突出。他是个最喜欢吟咏秋风、夕阳的诗人，秋风的冷色调与夕阳返照的黄昏构成了刘长卿诗歌独特的底色，形成凄清、萧索的秋之色调。让人感到寒冷的暗淡秋光，映照出诗人心灵中一个王朝的秋天。类似秋风、落叶、夕照、寒雁等冷淡色调的词语，在大历诗人的作品中俯拾即是。暗淡清冷的词语色彩，使大历诗整体上给人以凄凉衰飒的风格印象。\n\n三、象征性意象和描述性意象两大意象类型\n\n在大历诗中，诗人寂寞冷落的情思，多通过象征性意象或描述性意象表达出来，形成了两种意象类型。\n\n象征性的意象在刘长卿的诗里用得较多，其中用得最多的一个意象是“青山”，“青山”似乎成了诗人坎坷愁苦的人生之旅中的归宿地，一种内心深处向往的安宁的居所。此外，具有隐逸、高洁意蕴的“白云”意象，象征漂泊不定生活的“孤舟”意象，隐喻衰败消沉的“夕阳”意象，以及“芳草”“落叶”“沧洲”“寒山”等，在刘长卿诗里的出现频率也相当高，其情绪化的象征隐喻功能远大于描述性和写实性。\n\n相较而言，其他大历诗人更多地偏爱使用描述性意象，采用白描手法写诗，以求意象的创新。这些诗句，均具有追求精确和具体的写实倾向，往往是从极细微处感受体认，再逼真地描绘出带有清幽韵味的小境界。其意象多由生活中常见的山峰、寒雨、落叶、灯影、蝉声、苍苔等组成，刻画精致细巧。","keywords":"过渡状态 冷淡色调的词语 凄凉衰飒 象征性意象 描述性意象","note":"大历诗风既有盛唐流风遗韵，又已经表现出了中唐诗歌的情调，再加上涉及的诗人众多，因而具体表现十分复杂，大家可以结合当时的社会现实细细分析体会。像是“大历诗风”“大历十才子”等都是名词解释中经常出现的内容，大家要注意一下。"},{"id":"176","stars":"★★","title":"谈谈你对大历十才子的认识","body":"“大历十才子”是以大历时期十位诗人为代表的一个诗歌流派。“十才子”之名起于姚合《极玄集》，指李端、卢纶、吉中孚、韩翃、钱起、司空曙、苗发、崔峒、耿湋、夏侯审。他们大都出身于中小地主官僚家庭，官阶不高，或为衙门佐贰，或为权门清客，有的还曾遭贬闲居。他们的诗歌创作，主要具备如下共同特征：\n\n一、回避现实矛盾、偏重形式美的创作倾向\n\n“十才子”齐名的一个重要原因，还在于主要创作倾向和诗风的相近。他们的生活态度，不再像前辈盛唐诗人那样充满兼济理想，真正的兴趣也不在政事，而是集情趣于山水，寄心绪于景物。除了应酬唱和之作外，他们的诗主要写日常生活细事、自然风物和羁旅愁思，抒发寂寞清冷的孤独情怀，表现超然世外的隐逸风调。作品多为投赠、应酬、送别和写景之作，表现出回避现实矛盾、偏重形式美的创作倾向。\n\n二、擅长近体，注重技巧和字句的研炼\n\n大历十才子熟悉诗律，擅长五言近体，艺术形式方面注重技巧和字句的研炼。大历十才子现存一千五百余首诗，近体诗占其作品总数的百分之八十多。而且在对仗、用韵、章法等方面更加工稳圆熟。总的看，大历十才子的近体诗具有精整细切、流畅圆熟的特点。\n\n同时，大历十才子的诗注重字句的锤炼，而有忽略炼篇炼意的倾向，同盛唐诗的高凝整浑、气象浑成有质的差异。但对艺术技巧的追求，对字句的锤炼不能不说是大历十才子对唐诗发展的贡献。\n\n三、情思格调冷落萧瑟\n\n十才子的诗大都写得精致工整，但在情思格调上表现出冷落萧瑟的气象，体现出大历诗坛特有的韵味。时代乱离是形成冷落萧瑟气象的主要原因，同时也和大历十才子自身的心理气质有关。面对安史之乱造成的时代性灾难及其后遗症，大历十才子等一些诗人失去了生活理想和热情，精神衰顿疲惫，情调黯淡清冷，因此自然而然地表现在诗歌气貌上。大历十才子诗\n\n的意象大都是萧瑟、黯淡的，到处是黄昏、夕阳、烟岚、雾气等景象。这些景象都与诗人百无聊赖，浮生若梦，迷失惆怅，悲凉冷落等心态有关。\n\n四、善于言情\n\n大历十才子的诗歌体情细腻。管世铭云：“大历诸公，善于言情”，他们的感情不如盛唐诗人那样浓烈、才力不及盛唐诗人那样雄厚宏肆，便向深细工巧处着力，善于表现细腻的生活体验及内心意绪、情态，精于选料，善于言情。","keywords":"回避现实矛盾 偏重形式美 擅长近体 技巧字句研炼 冷落萧瑟 善于言情","note":"大历十才子是大历时期十分重要的一个文人团体，很能代表大历时期的诗歌创作趋向。大家可以将他们的诗歌创作特征与大历诗风相互对照，比较记忆。相关内容可以参考沈文凡《简论大历十才子诗歌思想内容及艺术表现的共同趋向》，具体资料可以在李凡文学正版群内领取。"},{"id":"177","stars":"★★","title":"顾况诗歌的艺术成就是怎样的","body":"顾况作为一位承前启后的诗人，奠定了中唐诗歌流派的发展和中唐诗歌再次进入高潮的基础，同时在诗的表现技巧的探索、诗美的新的追求上，顾况都是一位值得重视的人物。\n\n一、反映了当时的社会现实\n\n顾况推重“风雅”，主张诗歌应反映现实，所以面对安史之乱后国家残破，生民涂炭，朝政昏暗的社会现实并没有回避，而是以自己的创作实践，从不同的方面较为深刻地加以反映。顾况反映现实的诗作，虽不及杜甫的数量多，方面广，甚至稍逊于元结，但在大历到贞元的诗坛上，可以说是异军突起，少有其匹。顾况诗歌所表现的现实主义优良传统应该说是上承杜甫、元结，下启白居易、元稹等中唐诗人。从这方面看，顾况的贡献是不可抹煞的。\n\n二、朴素自然、通俗晓畅\n\n顾况对当时诗坛上一些诗人刻意雕琢，追求文辞华丽，忽视内容的浮靡诗风深为不满，进行批评。因而他在诗歌创作中，一方面向民歌学习，一方面有意识地使用浅近流畅的语言，使诗篇通俗易懂，明白畅晓。顾况的诗歌流传下来的有二百三十多首，其中除《琴歌》和《上古之什补亡训传十三章》用四言外，余者不论五七言古诗，或自创的即事名篇新体乐府，也不论五七言律诗，或五七言绝句，都不着意雕绘，堆砌词藻。这就构成了顾况诗歌朴素自然，通俗畅晓的特点，也表现了诗人的艺术个性和独创性。\n\n三、口语化、散文化\n\n诗篇口语化或以口语入诗，这是顾况诗歌通俗浅近，明白流丽的重要因素，也开了白居易自觉地致力于诗歌通俗化的先河。\n\n顾况在使诗歌通俗流畅，明白易晓的同时，在五七言古诗中，又较多地用虚词入诗，使有些诗句明显地散文化。诗人有意识地在诗中用虚词，在当时的诗坛上也可以说是别开生面，对中唐时期的韩愈、白居易也有影响。韩愈的诗较多地用虚词，多散文化诗句；白居易的“讽喻诗”也以虚词入诗，散文化的句式也较多，显然是与顾况的影响有关。\n\n四、活泼自由，纵横排宕，舒卷自如\n\n顾况还有些作品，句式长短错落，完全摆脱定句定字的束缚，极错综变化之能事，显得活泼自由，纵横排宕，舒卷自如。在诗人得心应手的运用下，三言、四言、五言、六言、七言、八言、九言、十言，乃至十二言都可互相间杂，如行云水，毫不险拗艰涩，这是“大历十才子”所没有的。","keywords":"反映现实 朴素自然 通俗晓畅 口语化 散文化 活泼自由","note":"在大历诗风以淡泊寂寞为主流情调时，顾况的诗却显示出异于同辈的艺术个性。他在对诗表现技巧的探索和诗美新的追求上都作出了巨大的贡献。同时，他对此后诗歌发展的影响也非常大，可以说是联结了盛唐与中唐，起到了承上启下的重要作用，所以我们要了解一下。"},{"id":"178","stars":"★★","title":"试分析李益诗歌的特点","body":"在大历诗坛，以边塞诗独树一帜而艺术成就很高的诗人是李益。有别于大历十才子，李益的诗歌带有盛唐的馀韵，呈现出独特的色彩，具体表现在如下方面：\n\n一、苍凉悲怆的情绪\n\n在艺术上，李益的诗歌尤其是边塞诗，有别于初唐时期的豪放，也有别于盛唐时期的激越，内容描写更加细腻，情感表达更加深邃。这不是简单意义上的审美情趣的嬗变，而是诗人的忧患意识使然。李益的多数诗歌中，都有忧患意识渗透于字里行间，充满了苍凉悲怆的情绪。正是这种情绪，以及由此形成的诗风，对后来者的诗歌创作，起到了承前启后的重要作用。\n\n二、边塞诗基调慷慨悲凉\n\n李益“腰悬锦带佩吴钩，走马曾防玉塞秋”，自称“莫笑关西将家子，只将诗思入凉州”。有这样的边塞生活经历，他的创作“多军旅之思”，而且数量居中唐诗人之冠，也就不足为怪了。他的边塞诗不乏报国杀敌的“慷慨意气”。\n\n但他的边塞诗还是有鲜明的中唐特色的，他的诗尖锐地揭露了中唐边患日炽，领土日衰，而朝廷苟安，无人御寇的现实，对军中的矛盾也有所反映，这种悲凉凄伤的情调为中唐边塞诗的特点。\n\n李益的边塞诗中最动人心弦的是对久戍不归的将士思亲怀乡心情的描写，深情幽怨、凄伤婉转是李益这类乡思边愁诗的特点。但就总体看，李益的边塞诗慷慨悲凉。\n\n三、妇女题材和羁旅赠别酬唱诗善于描摹心理\n\n李益的妇女题材诗也写得相当出色，涵盖面也较广，以善道各色妇女心理见长。他的《江南曲》和《长干行》都是学习南朝乐府民歌之作，但从所写的商妇哀怨中，反映出中唐商贸、河运的发达，也有时代特点。李益的羁旅赠别酬唱诗，也有善于言情描摹心理的特点。\n\n四、擅长七绝\n\n李益众体皆有佳作，七绝尤为杰出。后人也有将他与韩翃、刘禹锡的七绝并提者。他的七绝，语言自然，神韵自在，接踵李白；深情幽怨，含蓄婉约，上承王昌龄，比肩韩翃；慷慨多气，风骨遒劲，下启刘禹锡。他的边塞诗也以七绝最为著名，写景抒情，注重于瞬间感受中捕捉诗意，偏于较精细深婉的心态描写，且经常通过画外声来渲染悲怆情绪，韵味尤为深远。\n\n李益的诗较突出地表现了大历诗歌风格上的两重性，既有盛唐馀韵，也有中唐先声。诗中感伤情调，实具大历的时代特点。","keywords":"苍凉悲怆 边塞诗基调慷慨悲凉 善于描摹心理 擅长七绝","note":"李益诗歌风格具有两重性，既有盛唐馀韵，又有中唐先声，和顾况一样，主要起到了一个承上启下的作用，并且与大历十才子形成了明显的区别，对于我们认识大历年间的整体诗歌创作特征有很大的帮助，所以放在这里进行补充。"},{"id":"179","stars":"★★★","title":"试述韩孟诗派的诗歌主张","body":"作为一个诗派，韩、孟等人有明确的诗歌理论主张，具体可梳理为以下几点：\n\n一、“不平则鸣”\n\n所谓“不平”主要是指内心的不平衡，强调的是内心不平情感的抒发。它既是对创作动因的揭示，也是对特定创作心理即“不平”心态的肯定。“不平”谓感情之激荡，不平之鸣，其鸣各异，或激昂、或悲愤、或凄清、或欢愉。\n\n“不平则鸣”说的另一要点在于特重诗歌的抒情功能。由于韩愈没有把诗与文等量齐观，才使诗歌得以保持其“舒忧娱悲”“感激怨怼”的美学品性。“感激怨怼”就是“不平”，“舒忧娱悲”就是将此“不平”不加限制、痛痛快快地抒发出去，所谓“郁于中而泄于外”，指的便是这种情况。由此看来，韩愈提倡“不平则鸣”就是提倡审美上的情绪宣泄，尤其是“感激怨烈”情绪的宣泄，可以说是抓住了文学的抒情特质。\n\n二、“笔补造化”\n\n韩孟诗派的另一个重要观点，是“笔补造化”。用李贺的话来说，就是“笔补造化天无功”。用诗笔补造化之不足，既要有创造性的诗思，又要对物象进行主观裁夺。孟郊认为作诗虽“形拘在风尘”，但可以“心放出天地”，用一己之心去牢笼乾坤，绳律“万有”。\n\n与孟郊相比，韩愈更重视心智、胆力和对物象的主观裁夺。他认为要研讨诗文而至于“幽玄”，搜求“智网”复辅以“雕刻”，造端命意、遣词造句则要力避流俗，觑寻“天巧”。韩愈还屡屡强调写作要“能自树立，不因循”，要大胆创新，“勇往无不敢”。在他看来，随主观情思而裁夺造化，这也就是“笔补造化”。\n\n三、崇尚雄奇怪异之美\n\n韩孟诗派在倡导“笔补造化”的同时，还特别崇尚雄奇怪异之美。韩愈与李杜精神之“交通”处便是“百怪入我肠”，他欲追踪李杜，所取法也正在于此。所谓“拔鲸牙”“酌天浆”，将其胆之大、力之猛、思之怪、境之奇发挥到极致，完全是一派天马行空、超越世俗的气象。这是一种全新的审美取向。韩愈不仅在自己的创作实践中努力实践它，而且用以审视、评价、赞许同派及相关友人的诗作。其着眼点都在力量的雄大、词语的险怪和造境的奇特。\n\n与韩愈相同，韩孟诗派其他成员也大都具有崇尚雄奇怪异的审美取向，虽然这些诗人因自身经历所限，视野不够宏阔，取材偏于狭窄，大都在苦吟上下工夫，以致雄奇不足而怪异有馀，诗境也多流于幽僻蹇涩，但他们却以自己的美学追求和创作实践有力地回应了韩愈的主张，强化了以怪奇为主的风格特点。\n\n从“不平则鸣”到裁物象、觑天巧、补造化，到明确提出雄奇怪异的审美理想，韩孟诗派形成了一套系统的诗歌创作理论。它突破了过于重视人伦道德和温柔敦厚的传统诗教，由重诗的社会功能转向重诗的抒情特质，转向重创作主体内心的展露和艺术创造力的发挥，这在诗歌理论史上是一个值得重视的现象。","keywords":"不平则鸣 笔补造化 雄奇怪异","note":"韩孟诗派的诗歌主张是一步步递进的，先从创作目的上要求“不平则鸣”，再从创作手法上要求“笔补造化”，最后在实践中提出雄奇怪异的审美理想，大家可以这样去记忆。韩孟诗派的这些主张是认识韩孟诗派的一个重要支撑，大家可以将其与韩孟诗派的诗歌创作特征结合起来进行理解记忆。"},{"id":"180","stars":"★★★","title":"试分析韩孟诗派的诗歌创作特征（26东北师范大学）","body":"韩孟诗派并非有组织有纲领的文学创作集团。后人之视韩愈、孟郊等人为一诗派，主要是由于他们的诗歌风格有极其明显的共同点，并沿流溯源，看到了他们之间的朋友、师生关系以及共同的思想基础和文学审美情趣。总体来看，韩孟诗派的共同特征主要表现为以下几点：\n\n一、崇尚雄奇怪异之美\n\n韩愈的诗歌从意境、结构到语言技巧，都力避陈俗。尚奇求怪是他的审美理想，他的诗歌长于古体，形成了其雄奇怪异的诗风。他以匪夷所思的想象、雄伟豪壮的精神气魄和怒张怪诞的变形，塑造生新雄奇的意境，用一系列超现实的不可捉摸的形象表达自己的艺术追求。\n\n与韩愈相同，孟郊也曾声称自己为诗“孤韵耻春俗”，其奇境的创造，一方面是由于其造境别开生面，思新意奇；另一方面则是因为他句奇语奇。韩孟诗派的其他成员或因自身遭际，或因才力所限，取材偏于狭窄，大都在苦吟上下工夫以致其雄奇不足而怪异有馀，诗境也流于幽僻，但他们却以自己的创作实践有力响应了韩愈的主张，强化了韩孟诗派以怪奇为主的风格特征。\n\n二、以文为诗\n\n韩孟诗派还以散文化的章法、句法入诗，融叙述、议论为一体，写出了“既有诗之优美，复具文之流畅，韵散同体，诗文合一”的佳作。韩愈是这方面的突出代表。孟郊的诗中也偶有散文句式，却不突出，至于赋化手法，则很不明显。但在韩愈的诗中，情况就不同了。发议论成了显著的特点。作为古文大家，他谙熟古文章法。其雄奇精神和豪放性格又使他不受诗律束缚，故常采用较为自由的散文笔调入诗。首先，以议论为诗。其次，用汉赋的铺陈夸张手法写诗。最后，运用散文的叙述方法、篇章结构、句式虚词以及硬语险韵写诗。韩诗多硬语盘空，有的妥帖通顺，但也有不少古奥的生僻字词。他还喜用险韵窄韵，以逞才斗奇，有的也流于文字游戏。\n\n三、变熟为生，化夷为险\n\n变熟为生，力求别开面，出奇制胜，是韩孟诗派共同追求的美学原则之一。当然，韩孟派诗人着意经营变熟为生，也有它的两面性，即既造成新鲜、生动的一面，也出现了生僻难解的一面。\n\n化夷为险则是指本来平淡无奇，却变得恢奇怪诞，惊心动魄，令人悬挂、惊叹。如果说变熟为生指的还多是诗中的部分事物，那么，化夷为险指的却多是诗篇的整体意境或部分意境。有的诗篇就题目的意义或题材的内涵看，本属平淡无奇，至少不属险怪，而在韩孟诗派诗人笔下，却变得险怪无比，甚至令人咋舌。\n\n四、少今多古\n\n古代诗歌发展到了盛唐，已经众体大备。而盛唐以来，以律体较受推重。不过，“大历十才子”以盛唐王孟诗风为榜样却又相形见绌的教训，启发了有作为的后来人必须另辟新径，才有出路。孟郊毅然选择了弃今就古道路，现存《孟东野诗集》511篇全为古体诗。韩愈、卢仝、李贺等人，也以写古体诗为主。由此看来，就整个诗派而言，是少今多古的。韩孟派诗人之所以在诗歌创作中较多地选择古诗的形式，是因为这种形式不仅押韵要求较宽，而且声调也不受严格限制，句式较自由，这就比较适合用来表达奇险奔放的内容。\n\n总之，无论在文学思想还是创作主题，以及艺术技巧上，韩孟诗派都是“唐诗之一大变”，力矫大历诗风的平庸圆熟，对于中唐诗坛的功利主义创作思想也是一种反拨。\n\n【李凡关键词：崇尚雄奇怪异之美 以文为诗 变熟为生 化夷为险 少今多古】","keywords":"","note":"韩孟诗派虽然没有统一明确的纲领，但却因诗歌风格和审美追求的相似而被视为一派。韩孟诗派的创作特征集中体现在韩愈、孟郊这两位具有代表性的诗人身上，大家可以结合这二者的诗歌创作特征去理解韩孟诗派的创作特征。同时需要注意的是，韩孟诗派这一概念也常在名词解释中出现，大家要注意一下。"},{"id":"181","stars":"★★★","title":"韩愈诗歌具有怎样的特点","body":"韩愈作为韩孟诗派的代表诗人，集中体现了韩孟诗派的创作特征。总体来看，韩愈的诗歌创作，主要具备如下特征：\n\n一、气豪势猛，声宏调激\n\n韩愈多长篇古诗，其中不乏揭露现实矛盾、表现个人失意的佳作，大都写得平实顺畅。他也有写得清新、富于神韵、近似盛唐人的诗。但韩愈最具独创性和代表性的作品，是那些以雄大气势见长和怪奇意象著称的诗作。他“少小尚奇伟”“搜奇日有富”，天生一种雄强豪放的资质，性格中充溢着对新鲜奇异、雄奇壮美之事之景之情的追求冲动，而他一再倡导的“养气”说，更使他在提高自我修养的同时，增添了一股敢作敢为、睥睨万物的气概，发而为诗，便气豪势猛，声宏调激。\n\n二、以俗为美，以丑为美\n\n韩愈一生用世之心甚切，是非观念极强，性格刚直，昂然不肯少屈，这一方面使他在步入官场后的一次次政治旋涡中屡受打击，另一方面也导致其审美情趣不可能淡泊平和，而呈现出一种怨愤郁躁、情激调变的怪奇特征。韩愈诗风向怪奇一路发展，大致始于贞元中后期，至元和中期已经定型。贞元、元和之际的阳山之贬，一方面是巨大的政治压力极大地加剧了韩愈的心理冲突，另一方面将荒僻险怪的南国景观推到诗人面前，二者交相作用，乃是造成韩愈诗风大变的重要条件。在此后的几年中，韩愈基本上沿着这条道路发展，以世俗、丑陋之事之景入诗，写落齿，写鼾睡，写恐怖，写血腥，形成了以俗为美、以丑为美的特点。\n\n三、用写赋的方法作诗\n\n在诗歌表现手法上，韩愈也做了大胆的探索和创新，用写赋的方法作诗，铺张罗列，浓彩涂抹，穷形尽相，力尽而后止。作为古文大家，他深谙古文章法。其雄奇精神和豪放性格又使他不受诗律束缚，故常采用较为自由的散文笔调入诗。首先，以议论为诗，韩诗“约六经之旨而成文”。其次，用汉赋的铺陈夸张手法写诗。最后，运用散文的叙述方法、篇章结构、句式虚词以及硬语险韵写诗。韩诗多硬语盘空，有的妥帖通顺，但也有不少古奥的生僻字词。他还喜用险韵窄韵，以逞才斗奇，有的也流于文字游戏。\n\n总之，韩愈的诗“力大”“思雄”，成为“唐诗之一大变”。不但力矫大历诗风的平庸圆熟，而且开创了中唐诗家奥衍一派，推动了宋诗的议论化、散文化。宋代的梅尧臣、王安石、黄庭坚直至清代的黄遵宪都受其不同程度的影响。","keywords":"气豪势猛 声宏调激 以俗为美 以丑为美 用写赋的方法作诗","note":"韩愈虽然是韩孟诗派的代表诗人，但其主要文学成就还是在散文方面，因而诗歌整体考查较少，但其具体特征我们也要注意一下。可以看到，韩愈的诗歌创作，受到了其个人经历很大的影响，同时也受到了其古文创作的影响，大家可以从这两个方面去切入理解韩愈的诗歌创作特征。"},{"id":"182","stars":"★★★","title":"试分析孟郊诗歌的创作特征","body":"孟郊诗歌的风格首先是奇，但他的奇，又与他人的奇迥异。孟郊的奇，是因峭硬而奇，于奇中见硬，语句坚实，落地作金石声。孟郊诗歌是因硬而奇，奇中见硬的，这种奇、硬，便形成了孟郊诗歌独特的艺术风格。而这种风格的形成，主要归因于以下几点：\n\n一、力求构思奇特，造语新颖妥贴\n\n在孟郊诗中，在构思上精研苦虑、开人耳目的篇章不乏其例，这些诗句虽取材不同，但都因构思奇特而收异曲同工之效。\n\n同时，孟郊还特别重视语言的锤炼，那些经过镂刻锻造的词句，尽去枝蔓，精当洗练，对他奇硬风格的形成有着极大的帮助。韩愈在《贞曜先生墓志铭》中指出：“及其为诗，刿目鉥心，刃迎缕解。钩章棘句，掐擢胃肾。神施鬼设，间见曾出。”此数语可谓孟郊造语炼字的最好说明。\n\n二、运用多种修辞手法\n\n为了努力创造自己的风格，孟郊还运用了多种修辞手法，其中较为突出的，就是想象、夸张和比喻。在《远愁曲》中，他用“声翻太白云，泪洗蓝田峰”来夸张形容哀愁之深，突兀嶙峋，力透纸背，给人留下深刻的印象。在《京山行》中，孟\n\n郊一个远行的游子在“后路起夜色，前山闻虎声”的情况下，偏偏坐骑又因病走不动了。在这山穷水尽的恐怖气氛中，游子之心宛如“百尺风中旌”一样，高危颤动。仅此一句，就把人物当时极为复杂的内心活动惟妙惟肖地揭示出来。\n\n三、专作五言古诗，古朴苍劲\n\n“岸亭当四迥，诗老独一家。”这是孟郊对自己诗作的看法。在中唐时代，人们竞为近体律诗，惟独孟郊力避时俗，专心五言古诗，更进一步，他还创作了不少乐府诗章，古意古调，自成一格，形成了古朴苍劲的特色。这种做法，对他奇、硬风格的形成也颇有关系。\n\n四、清寒的意境，悲苦凄凉的情调\n\n与对自己贫寒生活的写照相关联，孟郊的不少诗作还表现出一种清寒的意境，弥漫着一股悲苦凄凉的情调。孟郊写得最多、也最引人注目的，是那些充满幽僻、清冷、苦涩意象的诗作，这些诗作大都表现诗人凄怆寒苦的生活，诗境仄狭、风格峭硬，以“寒”字为中心，极力突出诗人对生活的特殊感受。苏轼所谓“郊寒岛瘦”之“郊寒”一语，可以说是对孟诗特点的最好概括。“寒”字本身就是一种温度的标志，它主要诉之于人的触觉，而人体所接触的寒凉之物，诸如朔风、厚冰、冷光等等，大都具有尖利峭硬之质地，极易引起人们“硬”的感觉，而当这种物的质地与人的感觉不断累积，达到一定数量与程度的时候，“横空盘硬语”诗风的出现便势在必行了。","keywords":"构思奇特 造语新颖妥贴 多种修辞手法 古朴苍劲 清寒意境","note":"和韩愈主要成就在散文方面不同，孟郊的文学成就集中在诗歌方面。而分析孟郊的诗歌创作特征，我们可以联系“郊寒岛瘦”这一比较关键的概念。所谓“郊寒”，正是其诗歌意境清寒、情调悲凄的体现，而这种意境和情调主要与其诗歌的构思、语言和手法有关。“郊寒岛瘦”也是在名词解释中常出现的内容，大家要注意一下。"},{"id":"183","stars":"★★★","title":"李贺诗歌的创作特征（26河北师范大学）","body":"在短短27年的生涯中，李贺将其卓荦的才华和全部精力都投入到了诗歌创作上，骑驴觅诗，苦吟成性，呕心沥血，废寝忘食，把作诗视为生命之所系。这一方面导致他对社会不可能有较深刻的理性认识，而时时耽于幻想；另一方面则使得他的诗作融入了极为浓郁的伤感意绪和幽僻怪诞的个性特征，表现重点也从韩愈的粗猛豪横、孟郊的冷峭枯寂转向对主体心灵的全力开掘和虚幻意象的巧妙营造，由此形成了与韩、孟颇有差异的凄艳诡激的诗风。\n\n一、冷艳凄迷的意象\n\n李贺深受屈原、李白及汉乐府民歌的影响，多以乐府体裁驰骋想象，自铸奇语，表现其苦闷情怀。他对冷艳凄迷的意象有着特殊的偏爱，并大量使用“泣”“啼”等字词使其情感化，由此构成极具悲感色彩的意象群。对于物象的色彩和情态，李贺也极尽描绘渲染之能事，写红，有“冷红”“老红”“愁红”“笑红”；写绿，有“凝绿”“寒绿”“颓绿”“静绿”。作者宛如一位高明的画工，一眼觑定事物的本质特征，便倾全力摹状绘形，敷彩设色，构造五彩斑斓的画图，又在此画图的关键色彩上加以哀伤的字眼，注入强烈的主观感受，使得其笔下的诸多意象都呈现出一种哀感顽艳甚或病态美的特征。\n\n二、独特的思维方式和精选的动词形容词\n\n为了强化诗歌意象的感染力，李贺还以独特的思维方式和精选的动词形容词，来创造视觉听觉与味觉互通的艺术效果。通过这些不同感官相互沟通转换所构成的意象，诗人的艺术直觉和细微感受倍加鲜明地展现出来。与此同时，李贺也多用质地锐利、脆硬、狞恶的物象，辅之以“剪”“斫”“古”“死”“瘦”“血”“狞”等字词，营造一种瘦硬、坚脆、狠透、刺目的意象，或惊心刺目，或幽凄冷艳，大都是一种怪奇、畸形的审美形态。这种审美形态的产生，既源于李贺偏执狭隘的精神世界和审美取向，也得力于李贺对字词的精心锤炼。似乎可以说，艺术思维的逸出常轨、遣词造句的刺激狠透、修辞设色的惨淡经营、意象结构的古怪生新，乃是李贺诗歌意象创造的基本特点。\n\n三、迥异于常人的想象乃至幻想\n\n李贺诗中的怪奇特征，还主要得力于他迥异于常人的想象乃至幻想，而这想象、幻想又总是和夸张相并行的。求生的意志、对天国的向往与人生的短促、现实的困厄构成一对尖锐的矛盾，困扰着诗人的心灵，使他的精神常常处于亢奋与消沉交替起伏的状态，导致其想象变化倏忽，活跃异常。李贺不少诗歌，特别是游仙诗都具有这种特点。表面上看，这一特点与现代意识流的创作方法确有相通之处，但从深层来看，却直接导源于李贺独特的心理状态，换言之，李贺全部诗歌都可视作苦闷的象征。\n\n【李凡关键词：凄艳诡激 冷艳凄迷的意象 独特的思维方式 精选的动词形容词 迥异于常人的想象】","keywords":"","note":"李贺作为中唐独树一帜的杰出诗人，在中国乃至世界都享有较高的声誉。其诗歌整体风格与韩愈、孟郊迥异，呈现出凄艳诡激的色彩，这与其关注对主体心灵的全力开掘和虚幻意象的巧妙营造有关。可以说，李贺的诗歌风格受到了其生平经历的深刻影响。"},{"id":"184","stars":"★★★","title":"试分析刘禹锡诗歌的艺术特征","body":"一、诗歌主要内容是抒写内心的苦闷、哀怨，表现身处逆境而不肯降心辱志的执着精神\n\n与当时活跃在文坛中心的韩、孟、元、白诸人有很大不同，刘禹锡、柳宗元一生的大部分时间都是在穷僻荒远的贬所度过的，所以抒写内心的苦闷、哀怨，表现身处逆境而不肯降心辱志的执着精神，便成了他们诗歌创作的主要内容。\n\n二、雄直刚健独特性的诗风\n\n刘禹锡及其诗风颇具独特性。他性格刚毅，饶有豪猛之气，在忧患相仍的谪居年月里，确实感到了沉重的心理苦闷，吟出了一曲曲孤臣的哀唱。但他始终不曾绝望，始终跳动着一颗斗士的灵魂；写下诗文屡屡讽刺、抨击政敌，由此导致一次次的政治压抑和打击，但这压抑打击却激起他更为强烈的愤懑和反抗，并从不同方面强化着他的诗人气质。他说：“我本山东人，平生多感慨。”这种“感慨”不仅增加了其诗耐人涵咏的韵味，而且极大地丰富了其诗的深度和力度。\n\n三、风格简捷明快\n\n刘禹锡的诗，无论短章长篇，大都简捷明快，风情俊爽。有一种哲人的睿智和诗人的挚情渗透其中，极富艺术张力和雄直气势。这类诗句，写得昂扬高举，格调激越，具有一种振衰起废、催人向上的力量。至于其七言绝句，也是别具特色，如《浪淘沙词九首》其八，《杨柳枝词九首》其一，就诗意看，这两篇作品均简练爽利，晓畅易解，但透过一层看，便会领悟到一种傲视优患、独立不移的气概和迎接苦难、超越苦难的情怀，一种奔腾流走的生命活力和弃旧图新面向未来的乐观精神，一种坚毅高洁的人格内蕴。\n\n四、咏史怀古的诗语言平易简洁，意象精当新颖。\n\n刘禹锡最为人称道的是咏史怀古的诗作。这些诗语言平易简洁，意象精当新颖，在古今相接的大跨度时空中，缓缓注入诗人源于苦难而又沉潜凝聚了的悲情，使得作品具有一种沉思历史和人生的沧桑感、隽永感，在中唐诗坛胜境独标。\n\n五、富有民歌情调\n\n在长期的谪居生涯中，刘禹锡受民间俚歌俗调的浸染，还创作了不少富有民歌情调、介于雅俗之间的优秀诗作，清新质朴，真率自然。如《竹枝词二首》其一，用谐音双关语表现女子对情人的微妙感情，既具浓郁的生活气息又有很高的艺术品味。","keywords":"苦闷、哀怨 雄直刚健 简捷明快 民歌情调","note":"刘禹锡和柳宗元屡遭贬谪，所以他们的诗歌大多都在吟咏自身境遇和由此引发的哀怨、苦闷。但刘禹锡对待这些的态度和柳宗元不尽相同，整体呈现出一种昂扬的姿态，而这也体现在了他的诗歌里。这种区别，从柳宗元《江雪》和刘禹锡《秋词（其一）》的对比之中就可以体现出来。"},{"id":"185","stars":"★★★","title":"试分析柳宗元诗歌的艺术特征","body":"与刘禹锡诗相比，柳宗元诗又别具风貌。简言之，刘诗昂扬，柳诗沉重；刘诗外扩，柳诗内敛；刘诗气雄，柳诗骨峭；刘诗风情朗丽，柳诗淡泊简古。总体来看，柳宗元的诗歌创作，主要具备如下特征：\n\n一、幽清悲凉的色彩\n\n从本质上说，柳宗元是位性格激切、甚至有些褊狭的执着型诗人。他思想深刻，有着极敏锐的哲学洞察力，但却不具各解决自身困境的能力。面对沉重的人生优患，他读佛书，游山水，并幻想回归田园，希望获得超越；但他激切孤直的心性似乎过于根深蒂固了，他对那场导致自己终身沉沦的政治悲剧始终难以忘怀，因而很难超拔出来。这种忧乐交替、以忧为主的心态，使得柳宗元的大量纪游诗作染上一层浓郁的幽清悲凉色彩。\n\n二、自觉的美学追求\n\n在《答韦中立论师道书》中，柳宗元明确提出了“奥”“节”“清”“幽”“洁”诸点写作标准，其内在指向都与清冷峭拔有关。在创作实践中，柳宗元对具有凄冷意味和峭厉之感的意象也特别偏爱，大量使用诸如“残月”“枯桐”“深竹”“寒松”“零露”“寒光”“幽谷”等词语；在色彩选用上，也偏重于青、翠、碧等冷色调，使得诗境阴暗幽冷。至于柳诗\n\n中使用的形象尖利的词语，更是所在多有。当暗淡的冷色调与词语尖利的峭硬结合在一起的时候，无论是作品的基调，还是作者的感受，都势必呈现出冷峭的风格特征。\n\n三、淡泊中寓忧怨、见峭厉\n\n柳宗元的诗风还有淡泊纤徐的一面，前人多将柳诗与陶渊明、韦应物的诗风联系在一起。从风格之淡泊古雅一点上看，部分柳诗与陶、韦诗确有近似之处，亦即都能以其接近自然、不事藻绘的风貌给人以清新淡雅之感。然而，从总体看，柳与陶、韦的诗风又是颇有差异的：陶诗淡泊而近自然，最能反映心境的平和旷达；韦诗淡泊而近清丽，令人读后怡悦自得；而柳诗则于淡泊中寓忧怨、见峭厉，尽管诗人曾有意识地将此忧怨淡化，但痕迹却未能全然抹去，加上诗人在遣词造句上多所经营，致使不少诗作仍于隐显明暗之间传达出冷峭的信息。","keywords":"幽清悲凉 美学追求 淡泊中寓忧怨","note":"柳宗元和刘禹锡人生经历相似，诗歌内容也相似，但整体风格却又有明显的差异，归根结底，这种差异是由于二位诗人的性格不同。刘禹锡豁达，柳宗元偏执，大家可以从这一点出发，去比较两位诗人的诗歌风格，进而明确这二位诗人各自的诗歌创作特征。"},{"id":"186","stars":"★★★","title":"试分析元白诗派务实尚俗特征形成的原因","body":"中唐时期，与韩孟诗派同时活跃于诗坛的，是以元稹、白居易为代表的元白诗派。与韩孟诗派追求奇崛险怪的风尚不同，元白诗派尚通俗、求平易、重写实，积极发挥诗歌关注现实、经世致用的功能，形成务实尚俗的美学特征。而这一特征的形成，主要归因于以下几点：\n\n一、杜甫写实倾向传承\n\n元白诗派的重写实、尚通俗是中唐文化转型时期文学世俗化的新思潮，其远源可以追溯到三百篇中的“风”诗和汉魏乐府民歌那里，其近源则是安史之乱以来一批具有写实倾向的诗人创作，尤其是伟大诗人杜甫的创作。杜甫一生饱经忧患，深入地接触了下层社会，创作了大量反映战乱和民生苦难的优秀篇什。这些诗作有两点最值得注意：一是继承了古乐府的形式，自拟新题，缘事而发，写真实时事、亲身见闻；二是以朴实真切的语言乃至口语入诗，力求通俗浅显。杜甫诗中的写实性和通俗化倾向，在与他同时或稍后的元结、顾况等人手中得到了不同程度的表现和继承，而到了贞元、元和年间，则有了强烈的回响。\n\n二、形成了重写实的时代风尚\n\n元白诗派兴起于贞元、元和年间，这一时期安史之乱虽然平息，但导致安史之乱爆发的各种矛盾却愈演愈烈：藩镇割据，宦官擅权，土地兼并，赋役繁重，民不聊生，边患四起，战祸频仍。缓解矛盾，振兴唐室，成为时代要求；人心思治，成为社会的普遍心理。于是政治上出现了永贞改革，经济上实施了两税法，军事上平息了几次藩镇作乱。作为文学对时代要求的反响，诗文中的现实主义思潮高涨，张籍、王建、白居易、元稹等人致力于通俗晓畅指事明切的乐府诗的创作，白居易作诗甚至要求老妪能解，一时间蔚为风气。\n\n三、自觉向民歌学习\n\n在诗歌通俗化的过程中，张、王、元、白等人还自觉地向民歌学习，写下了不少颇具民歌风味的歌诗。如张籍的《白鼍鸣》《云童行》《春别曲》，王建的《神树词》《古谣》《祝鹊》，白居易的《竹枝》《杨柳枝》《何满子》等，都平实浅易，自然明快，充满乡土市井气息。此外，他们的乐府诗创作，也受到来自民歌的不小影响。这样一种接近民间取法民歌的群体性努力，反映了此期诗人已形成通俗化审美的自觉追求；而当这种自觉追求与他们对杜诗写实倾向的自觉承传聚合一途，并受到尚俗时风的强烈鼓荡时，自然而然便会迅猛发展，在诗坛形成轩然大波。","keywords":"杜甫写实倾向传承 重写实的时代风尚 自觉向民歌学习","note":"元白诗派尚通俗、求平易、重写实的风格形成的原因，既有诗歌传统的影响，也有时代风尚的影响。总体来看，元白诗派与韩孟诗派的追求迥然不同，可以说是代表了中唐时期两种诗歌发展的不同方向，因而，在考查中可能会将这两个诗派进行对比，大家要注意一下。元白诗派也是名词解释中会出现的内容，大家要注意一下。"},{"id":"187","stars":"★★","title":"张籍的诗歌创作风格是怎样的","body":"张籍在乐府诗及其他方面的艺术的探索之功，使之卓然于中唐韩白之外，自成大家，对后来诗歌发展产生重要影响。\n\n一、乐府诗创作\n\n（一）题材广泛，不着意于讽谕而讽谕之义已见\n\n张籍有乐府诗90首，有古题，也有新题，取材非常广泛，农民、樵夫、牧童、织妇、船工、兵士，都成了表现对象；商人的奢侈牟利、官府的横征暴敛、战争的残酷破坏、边将的邀宠无能，在诗中也有真切反映；但张籍乐府中写得最集中、最深刻的还是农民的生活和苦难，如《野老歌》简略地勾勒了老农一年的苦辛，语极平易，却字字血泪。官府的残酷、老农的凄苦、社会的不公，都从“化为土”三字和“船中养犬长食肉”的对比中自然传达出来，不着意于讽谕而讽谕之义已见，这正是张籍乐府之一特色。\n\n（二）以小见大\n\n张籍的乐府诗一般选题不大，多取材于现实生活中的常见琐事，都是些“俗人俗事”，但挖掘其深，以小见大，往往由一人一事一语见出社会的缩影，反映社会的本质问题。如其《牧童词》平淡随意中传达出一个触目惊心的社会现实：官家对农民欺压掠夺，连牛角都不放过；而牧童动辄用“官家”吓唬牛，正说明百姓们对统治者已是何等的恐畏和反感。\n\n（三）擅长刻画人物的心理活动\n\n张籍乐府还擅长刻画人物的心理活动，如那首有名的《节妇吟》则借男女情爱写自己的政治态度，入情入理，一波三折，最后以“还君明珠双泪垂，恨不相逢未嫁时”结束，将人物在两美难全之际复杂微妙的心理活动展示出来，极贴切传神。\n\n（四）以俗言写俗事\n\n张籍的乐府，在以俗言写俗事方面较有特色。首先，他善于浓缩和凝炼各种社会现象，舍弃对事件具体过程的描述，以简洁通俗的语言表现生活感受和人物内心。因而与元、白诗的铺陈始终、曲折情节大异其趣：元、白数句一意，数句一韵，有舒缓委婉之致；张籍一句一意，转韵频繁，有急管繁弦之感。而在“专以道得人心中事为工”方面，则与元、白同。其次，张籍诗“思难辞易”“思深而语精”，有深入浅出的特点。\n\n二、近体平易而意蕴深厚\n\n张籍的近体，也多追求一种平易而意蕴深厚的风格。张籍的不少优秀诗作表面看来非常平易本色，无丝毫雕琢痕迹，但其中又确确实实融入了作者在布局造语上的大量心血。只是所有这些功夫，在诗成之后都已浑化无迹了。","keywords":"取材广泛 挖掘其深 刻画人物的心理活动 以俗言写俗事 平易而意蕴深厚","note":"张籍诗歌的主要成就集中在乐府诗上，着重表现社会现实，整体风格追求一种平易而意蕴深厚的感觉，这种风格在他的乐府诗和近体诗中都有体现，大家可以从这些方面切入理解。"},{"id":"188","stars":"★★","title":"试述王建的诗歌类型及其特征","body":"在扭转大历风调，继承汉魏乐府和杜诗传统，将诗歌创作导向重写实、尚通俗之路的过程中，张籍、王建的贡献是不可忽视的，他们的努力，对元稹、白居易的新乐府创作有着直接的影响。王建的诗歌类型与特色，主要表现在如下方面：\n\n一、乐府诗表现社会现实与民生疾苦，写实含蓄隐曲\n\n王建官卑职小，转徙南北，生活清贫，沉沦下僚，艰辛苦寒的人生经历，使他对贫民百姓的生活有着更多的了解和同情，了解社会现实与民生疾苦，并在大量乐府诗中加以反映。他有不少描写农民日常生活的诗，表现其喜怒哀乐，生活气息浓厚。他不仅描述了农夫织女耕织的辛劳，而且刻画出他们悲苦的心理。如《织锦曲》写女工之劳，《水夫谣》写运粮之苦，《海人谣》写采珠人的艰辛等。其《田家行》写农村丰收之后农民的酸苦。\n\n王建与张籍虽都以写实见长，但王建诗往往更含蓄、更隐曲些。如《织锦曲》以精细的笔触描写织锦女劳作的艰辛，结尾写道：“莫言山积无尽日，百尺高楼一曲歌。”劳动的果实自己不能享有，而全被统治者拿去，主人公内心的怨恨、哀伤可想而知，但王建不予说破，感情全在暗示之中。\n\n二、边塞诗声调低沉，善于从多种角度描绘人物心理和情结\n\n王建有“从军塞上，弓剑不离身”的戎马生涯。他笔下的边塞诗自有中唐的时代特点和其艺术个性。如《辽东行》《送衣曲》《饮马长城窟》等，大都声调低沉，已很不同于盛唐边塞诗的昂扬振作了。\n\n善于从多种角度楔入，描绘各类人物的心理和情结是王建边塞诗的特色，“来时父母知隔生，重著衣裳如送死”，这是父母送子应征，生离死别的心情；“宁为草木乡中生，有身不向辽东行”这是有去无回的征夫的心愿；“身在应无回渡日，驻马相看辽水旁”，这是有家难回的士卒寄诸流水的、绝望的思乡念亲之情。\n\n三、宫词广泛描述宫廷生活\n\n王建又有反映宫女生活以白描见长的《官词》百首，其中不乏构思巧妙、清新可诵的篇章。王建与宦者王守澄有宗人之分，故熟谙宫中琐事，他的宫词一百首，突破了历来宫词多写宫怨的窠臼，广泛描述君王狩猎行幸、殿台楼宇、节庆嘉赏、歌舞宴乐、竞渡百戏等，犹如一幅幅宫廷生活画，有一定的史料认识价值。","keywords":"乐府诗 社会现实 民生疾苦 含蓄隐曲 边塞诗 声调低沉 多种角度描绘 宫词 广泛描述宫廷生活","note":"王建和张籍风格相似，主要成就也都在乐府诗上，同样以写实见长，为诗歌创作导向尚俗、写实做出了巨大贡献，大家可以将二者放在一起，比较记忆。不过与张籍相比，王建除大力创作乐府诗以外，在边塞诗、宫词创作上也取得了不俗的成就。"},{"id":"189","stars":"★★","title":"元稹诗歌的艺术特色是怎样的","body":"在诗歌创作方面，元稹与白居易齐名，世称元白。元稹的诗歌创作，主要具备如下特征：\n\n一、深刻广泛反映现实问题\n\n元稹总结了杜甫“即事名篇，无复依傍”的创作经验，反对“沿袭古题”，主张“美刺见事”。受李绅“雅有所谓，不虚为文”的新题乐府启迪，他创作了不少现实主义的诗篇，推动了新乐府运动的发展。\n\n元稹的乐府和古诗，反映的现实问题有相当深度和广度。在《西凉伎》《缚戎人》等诗中，元稹揭露边将拥兵自重，不图收复，唯事享受，御侮无能，掠财有方，表现了沦陷区人民翘首企盼恢复的爱国之情和冒死逃归，被边将冒功邀赏的悲惨遭遇，反映了当时边防的种种弊端。在《华原磬》《胡旋女》《法曲》等诗中，他借玄宗讽今上，揭露统治者耽于声色，荒亡误国。\n\n二、善用浓笔重彩渲染气氛，刻画场面，描绘人物\n\n元稹的诗善用浓笔重彩渲染气氛，刻画场面，描绘人物。如连昌宫荒败景象的渲染、胡旋女、西凉伎歌舞场面的刻画，《梦游春》中的环境与梦境描绘，都有此特点，《旧唐书》本传调其“善状咏风态物色”，陆时雍称“微之多深着色，乐天多浅着趣”，正道出他的诗歌特色，及与白诗的不同之处。\n\n三、善于运用细节刻画心理，抒发感情\n\n善用细节，刻画人物心理，抒发感情，状难状之景，传难言之情，是元诗的另一特色。如：“寥落古行宫，宫花寂寞红。白头宫女在，闲坐说玄宗。”在“白头”“闲坐”的细节中，表达宫女的凄凉身世、寂寞哀怨的情怀和兴衰隆替的感慨，有“语少意足”之妙。又如“怪来醒后旁人泣，醉里时时错问君”，“醉里时时错问”，正见醒时念念难忘；“旁人”犹“泣”，则自己之心碎，不言而喻。\n\n四、艳诗低回缱绻，悼亡诗情意真挚\n\n元稹创作了一些优秀的爱情诗。他的爱情诗主要有两类，分别名为“艳诗”和“悼亡诗”。他的“艳诗”以女性为描写对象，多写青年时期的浪漫爱情和对恋人的美好回忆。这些小诗语言浅易，格调轻快，而又低回缱绻，一往情深。\n\n元稹的悼亡诗把自潘岳以来的悼亡之作推向了极致，几乎无人能匹。元稹和妻子韦丛感情真挚，其悼亡诗充满对妻子的深情厚意，表现了贫贱夫妻相濡以沫的真情，其中以《遣悲怀三首》最为著名。这三首诗全是对妻子生前身后琐事的描摹，字里行间时时流露出夫妻之间的真挚情意。","keywords":"深刻广泛反映现实问题 浓笔重彩 运用细节 低回缱绻 情意真挚","note":"元稹的乐府诗受张籍、王建乐府诗的影响，直接源于李绅的启迪，但他的乐府诗成就并不如白居易高，反而一些艳情诗和悼亡诗别具一格，大家可以结合具体作品，记忆元稹诗歌特色。"},{"id":"190","stars":"★★★★","title":"试分析白居易《新乐府》创作的得与失（25延安大学）","body":"白居易《新乐府》五十首，是一组有着明确政治目的、经过严密组织构建的系统化诗作，内容颇为广泛，涉及王化、治乱、礼乐、边事、宫女诸多方面，其中写得好而且有价值的，仍然是反映民生疾苦和下层情事、揭露弊政和权贵丑恶的那些篇章。\n\n一、《新乐府》的成就\n\n（一）一篇专咏一事，篇题即所咏之事，篇下小序即该篇主旨。如《上阳白发人》，“愍怨旷也”；《红线毯》，“忧蚕桑之费也”；《卖炭翁》，“苦宫市也”等等，这种安排使得中心突出，意旨明确，避免了一题数意、端绪繁杂的弊病。\n\n（二）不少篇章形式灵活，多以三字句起首，后接以七字句，富有民歌咏叹情调。在语言运用上，力避典雅的书面语，而用口头语或俗语穿插其间，如《秦吉了》开篇浅显流利，读来朗朗上口；诗的后半以秦吉了喻谏官，以鸡燕喻百姓，以凤凰喻君主，用寓言形式进行了讽刺批判。\n\n（三）一些优秀诗篇善于生动地描绘人物，感情浓烈。如《上阳白发人》中间一段写那位白头宫女因被妒而“潜配上阳宫”后的生活，又如《井底引银瓶》中的青年男女是未经父母之命、媒妁之言结合在一起，最终导致爱情悲剧。诗歌最后的议论，透露出强烈的悲剧气氛，引发读者的深切同情。\n\n二、《新乐府》的缺憾\n\n（一）《新乐府》的创作目的是“首句标其目，卒章显其志”，为了做到这一点，作者往往不惜以丧失艺术性为代价，给诗篇添加一个议论的尾巴；有时则画蛇添足，作不必要的重复。\n\n（二）有些诗篇所写事件，诗人本无深感，只是为了凑足五十篇之数而作，所以写得枯燥乏味，如《七德舞》《法曲歌》《采诗官》等，大都是议论和说教的堆积。同时，由于过多注重诗的现实功利目的，作者常用理念去结构诗篇，真情实感相对不足，比起杜甫那些深切体察民瘼、一任情感自然流露而又意蕴丰厚的乐府佳作来，《新乐府》中不少作品确有一间之隔。\n\n（三）在语言使用上，《新乐府》因一意追求浅显务尽而失之于直露无隐，有时一件简单的事理也要反复陈说，不够精炼含蕴。\n\n总之，白居易以《新乐府》为代表的讽谕诗在当时的影响并不大，以至时人罕能知者；在后世则毁誉参半。但无论如何，白居易通过自己的努力，创造了一种新的诗体和新的风格，并以“不惧权豪怒，亦任亲朋讥”的勇气，对当时的社会丑恶进行了最大胆的指斥和抨击，这一点，是永远值得人们钦敬的。","keywords":"成就一篇专咏一事，形式灵活，感情浓烈 缺点 丧失艺术性 枯燥 不够精炼","note":"白居易新乐府运动的基本宗旨是“文章合为时而著”，但我们既要看到其“为时”“为事”的人民性的一面，也要看到其平俗浅易的一面。其诗歌的缺陷不仅仅是其个人创作的遗憾，更是唐王朝封建时代的遗憾。在这里，大家需要注意一点是，白居易的《新乐府》并不等于其讽谕诗，前者是被后者包含在内的，大家要注意区分。"},{"id":"191","stars":"★★★","title":"试述白居易的诗歌主张","body":"白居易的诗歌主张与传统的儒家诗论一脉相承，主要体现在他的《新乐府序》和《与元九书》中，而以《与元九书》最为全面系统。白居易诗歌主张的主要内容是：\n\n一、强调诗歌的政治教化功能\n\n白居易认为诗歌必须为政治服务，担当起“补察时政，泄导人情”的政治使命，实现“救济人病，裨补时阙”的政治目的。他提出“文章合为时而著，歌诗合为事而作”，即诗歌应当“为君、为臣、为民、为物、为事而作，不为文而作也”。将诗歌与政治密切结合，这是白居易诗论的核心。这种观点，不仅是他自己的创作指南，而且也是他衡量古代作家作品的标准和领导新乐府运动的纲领。\n\n二、阐发诗歌的特性，认为内容对形式有决定作用\n\n在《与元九书》中，白居易写道：“感人心者，莫先乎情，莫始乎言，莫切乎声，莫深乎义。诗者，根情、苗言、华声、实义。上自贤圣，下至愚騃，微及豚鱼，幽及鬼神。群分而气同，形异而情一，未有声入而不应，情交而不感者。”“情”“义”指内容，“言”“声”指形式，他认为“情”“义”对“言”“声”有决定作用。“义”即《诗经》的“六义”，主要是指那种“美刺”精神。“实义”即以义为果实，也就是要“经之以六义”，使诗具有美刺的内容。因为只有这样的诗才能感人至深，并感人为善，从而收到“补察时政”“泄导人情”的效果。所以说“莫深乎义”。\n\n三、主张诗歌形式为内容服务\n\n《新乐府序》云：“其辞质而径，欲见之者易谕也。其言直而切，欲闻之者深诫也。其事核而实，使采之者传信也。其体顺而肆，可以播于乐章歌曲也。”这里的“质而径”“直而切”“核而实”“顺而肆”，分别强调了语言须质朴通俗，议论须直白显露，写事须绝假纯真，形式须流利畅达，具有歌谣色彩。也就是说，诗歌必须既写得真实可信，又浅显易懂，还便于入乐歌唱，才算达到了极致。白居易“非求宫律高，不务文字奇”，注重诗歌的通俗平易、晓畅明白。\n\n总之，白居易特别强调诗歌之于政治的服务功能。这种诗歌主张远绍“诗言志”的儒家传统诗论，近承杜甫诗歌的现实精神，是现实主义诗风的具体体现。但是，白居易过分强调诗歌的现实功用，给诗歌的艺术性造成一定的损伤，对当时和后世诗歌有一定的消极影响。","keywords":"政治教化功能 阐发诗歌的特性 形式为内容服务","note":"白居易的诗歌理论核心目的便是补察时政，强调诗歌的政治教化功能。他重写实、尚通俗、强调讽谕创作倾向，提出美刺褒贬，炯戒讽谕的诗歌手段，都是为他的目的服务。这一写实性主张有其先进意义，但也有其弊端，大家要辩证分析，综合来看。"},{"id":"192","stars":"★★★★","title":"白居易的讽谕诗有何特色","body":"所谓讽谕诗，据白居易自述，是他“自拾遗来，凡所适、所感关于美刺兴比者；又自武德迄元和，因事立题，题为新乐府者”。在内容上，这些诗歌显示出了鲜明的揭露批判色彩，在艺术上，这些诗歌实践了白居易在《新乐府序》中的主张。\n\n一、广泛揭示各种重大问题，深刻反映现实黑暗和民生疾苦\n\n白居易的讽谕诗有一百七十馀首，这些诗大都作于贬谪之前，在写实和尚俗一点上，与张籍、王建等人一脉相通，而且在反映现实的深广度和尖锐性上，有更进一步的发展。这些诗篇广泛地揭示了中唐社会生活的各种重大问题，深刻地反映了现实的黑暗和民生的疾苦。此类诗作有两个基本倾向，即对下层民众苦难生活的深刻反映，对上层达官贵人腐化生活和欺压人民之恶行的尖锐揭露。这种反映和揭露，在有名的《秦中吟》和《新乐府》中更是得到了淋漓尽致的表现。\n\n二、主题集中，人物事件高度典型化\n\n《卖炭翁》《新丰折臂翁》《缚戎人》《井底引银瓶》等，诗人直赋其事，叙述完整，情节曲折。他运用外貌、服饰、心理活动等细节描写刻画人物，塑造了一系列劳动人民的形象，较之杜甫“三吏”“三别”的类型化描写，更有个性化特色。\n\n白居易笔下的劳动人民形象栩栩如生，不仅是因为他们的外貌衣饰富有特征，更因为他们的内心世界得到了真实的披露。内心矛盾痛苦的描写，不仅使人物有血有肉，而且使他们的血泪控诉，更惊心动魄，也增强了揭露和批判的力量。这是诗人在叙事诗中融入了传奇小说表现手法的结果，是他对传统叙事诗的发展。\n\n三、卒章显志\n\n白居易的讽谕诗，在叙事议论的结合上也有特色。像《卖炭翁》那样不著议论，褒贬自见的诗较少，像《重赋》《杜陵叟》那样夹叙夹议的诗也不多，而多数诗是“卒章显志”，即篇末议论。其中有几类：一是诗人直接议论，宣泄感情；二是将自己的优裕生活与百姓的贫苦相对比；三是将百姓的饥寒冻馁与豪贵的穷奢极欲进行对比，在大小、轻重、贫富、苦乐的对比中，深化主题，增强诗歌的战斗性。\n\n四、寓言托物\n\n白居易的讽谕诗除了直赋其事外，还采用寓言托物的手法。有的借自然物象以寄寓作者对社会政治问题的见解和感慨。如《黑龙潭》诗借祭龙祈福的民俗为言，形象地揭示出贪官污吏狐假虎威，鱼肉百姓，而深居九重的皇帝却不闻不问的情形。还有一种寓言诗，将羸骏、涧底松、秦吉了等拟人化，用以比喻社会的某类人物或现象，褒善贬恶同情不幸。这种寓言托物的手法是传统比兴手法的发展。与直赋其事相比，较有蕴藉婉曲之致。","keywords":"揭示重大问题 主题集中 人物事件典型化 卒章显志 寓言托物","note":"白居易的讽谕诗共一百七十余首，以《秦中吟》和《新乐府》为代表，是白居易诗歌理论的重要实践，表现出了鲜明的批判色彩，同时也代表了白居易诗歌创作的主要成就，因而在考查中出现的也相对较多。从这些讽谕诗，可以看到杜甫诗歌的影响，因而有可能与杜甫的“三吏”“三别”等联系起来让大家对比，要注意一下。"},{"id":"193","stars":"★★","title":"试分析《长恨歌》与《琵琶行》的艺术成就","body":"贞元、元和之际，伴随着传奇小说的蓬勃发展，诗坛也出现了一些带有故事性、抒情性的长篇叙事诗。《长恨歌》和《琵琶行》乃是这些作品中最优秀的两篇。这两部作品的艺术成就，主要表现在以下方面：\n\n一、音韵和谐浏亮，婉转动人\n\n在形式上，两诗都用平仄协调的律句，间用对偶，数句一转韵，音节随情节而曲折，依感情而顿挫，而多处顶针格的运用，如“后宫佳丽三千人，三千宠爱在一身”“醉不成欢惨将别，别时茫茫江浸月”使音韵更和谐浏亮，婉转动人。后人称之为“长庆体”。\n\n二、移植了小说的表现手法\n\n两诗除了新乐府中运用过的外貌、服饰、动作、心理描写等手法外，还运用气氛渲染、环境描绘以塑造人物形象，抒发诗人感情，表达诗歌主题。如《琵琶行》的开头，即是一段江边夜晚送客的场景描写，这为琵琶女的出场，自述她的不幸遭\n\n遇和诗人抒发感伤的情怀设置了浓重的悲剧氛围。两诗每处写景，都是抒情的深入。层层渲染，步步深入，即是两诗以景衬情的成功处。\n\n三、叙事曲折详尽，描写生动细腻\n\n两诗叙事的曲折详尽，描写的生动细腻也远过于以往的叙事诗，而这也是受小说传奇的影响。如《琵琶行》将诗人邂逅琵琶女的简单故事写成两人同病相怜、感情互相激荡回环往复的过程，极为生动曲折。又如《琵琶行》中那段出神入化的音乐描绘，诗人运用比喻、想象、通感、象声等多种艺术手法，表现乐曲高亢、低沉、急骤、徐缓、欢快、哀伤、间歇、突发等种种变化，使抽象的声音曲调具象化，给读者以“大珠小珠落玉盘”的审美感受，描摹之细腻生动，前所未有。\n\n四、抒情因素的强化\n\n《琵琶行》与《长恨歌》艺术表现上的突出特点是抒情因素的强化。与此前的叙事诗相比，这两篇作品虽也用叙述、描写来表现事件，但却把事件简到不能再简，只用一个中心事件和两三个主要人物来结构全篇，即使《琵琶行》这种在乐声摹写和人物遭遇叙述上着墨较多的作品，也是用情把声和事紧紧联结在一起，声随情起，情随事迁，使诗的进程始终伴随着动人的情感力量。\n\n除此之外，这两篇作品的抒情性还表现在以精选的意象来营造恰当的氛围、烘托诗歌的意境上。或将凄冷的月色、淅沥的夜雨、断肠的铃声组合成令人销魂的场景，或以瑟瑟作响的枫叶、荻花和茫茫江月构成哀凉孤寂的画面，其中透露的凄楚、感伤、怅惘意绪为诗中人物、事件统统染色，也使读者面对如此意境氛围而心灵摇荡，不能自己。","keywords":"和谐浏亮 婉转动人 小说的表现手法 曲折详尽 生动细腻 抒情因素的强化","note":"尽管《长恨歌》与《琵琶行》在诗歌艺术特色上有许多不同之处，但二者也有许多相同之处，比如抒情因素强化和语言明白晓畅，这两部是唐朝长篇叙事诗中成就最高的两篇，虽然基本不会单独考查论述题，但有可能会让大家进行赏析，所以放在这里作为补充。"},{"id":"194","stars":"★★★","title":"试分析白居易闲适诗的艺术特色","body":"白居易的闲适诗在艺术上也达到了很高的成就。他的闲适诗大都诗意含蓄，韵味盎然，表现出一种圆熟和自然流丽之美。\n\n一、情调淡泊平和、闲逸悠然\n\n闲适诗和讽谕诗是白居易特别看重的两类诗作，二者都具有尚实、尚俗、务尽的特点，但在内容和情调上却很不相同。讽谕诗志在“兼济”，与社会政治紧密关联，多写得意激气烈；闲适诗则意在“独善”“知足保和，吟玩性情”，从而表现出淡泊平和、闲逸悠然的情调。白居易这种知足保和的心境，越到晚年表现得越突出。\n\n二、题材个人化、日常化和世俗化\n\n作为中唐诗坛的代表人物，白居易闲适诗的题材特点首先表现为个人化。白居易自元和十年江州被贬后，政治上的失意使他的思想发生了很大的变化，诗歌的题材由早年的国计民生大事转为表现日常生活感受、个人情感经历。\n\n其次，白居易闲适诗的题材特点表现为日常化。由于白居易在后期仕途一直顺畅，生活上并没有太多的波澜起伏。作诗又早已成了他的一种雷打不动的习惯，于是他就把自己生活中的一切琐碎的事情都如实地记录下来。\n\n再次，白居易闲适诗的题材特点表现为世俗化。白居易的闲适诗所展现的诗人自在旷达、任运随缘的人生哲学和肆意抒写自由人生情趣的世俗生活内容代表了当时世俗文化的特征。\n\n三、细腻生动、情景交融\n\n白居易的闲适诗写情中景、景中情，往往呈现出一种独特的意境美。他的闲适诗用平语常字，没有华丽的词藻，却富于鲜明的形象性，高度的概括性。有声有色，有情有景，淡淡写来，意态万千，体现出诗人细腻生动的描述技巧和情景交融的画面营造，除了细致生动的画面描写，白居易闲适诗的另一个特点：注重融情入景、写象外之意，也不容忽视。细味之下，白居易的许多闲适诗有着极深远、极令人回味的内质，令人寻思不已。\n\n白居易的闲适诗对后世有相当的影响。一方面，其闲适诗平易浅近的语言悠闲淡泊的情调为后世文人所欣赏、所模仿；另一方面，闲适诗表现出的超脱情怀也容易引起后世失意文人的心理共鸣，成为他们的灵魂抚慰剂。宋代的王禹偁、欧阳修、苏轼等著名文人，都对白居易的闲适诗情有独钟，据此可知白居易闲适诗影响之一斑。","keywords":"淡泊平和 闲逸悠然 个人化 日常化 世俗化 细腻生动 情景交融","note":"白居易的闲适诗和讽喻诗迥然不同，呈现出一种淡泊平和的情调，虽然部分诗歌内容乏善可陈，但整体上还是别具一格，对后世产生了深远的影响，需要我们有所掌握。大家在分析时，可以从整体风格、题材和手法三个角度切入。"},{"id":"195","stars":"★★★","title":"试分析白居易对苏轼、陆游的影响，要结合史实（中国社会科学院大学）","body":"【答题框架】\n\n白居易作为唐代杰出的诗人，其创作理念、诗歌风格以及文学精神对后世文人产生了深远的影响。苏轼和陆游作为宋代文学的代表人物，他们的创作思想和艺术实践都不同程度地受到白居易的影响，这具体表现在以下方面：\n\n一、白居易对苏轼的影响\n\n（一）白居易影响了苏轼的人生观和处世态度\n\n在人生观和处世态度上，苏轼所具有的超越意识，很明显是受到了白居易的影响。所谓超越意识，既是一种人生理念，更是一种生活态度，盖指主体在历经磨难后承受忧患、理解忧患并最终超越忧患以获取自由人格的一种努力，也就是说，士人虽身处逆境，却能不为所累，超然物外，与世无争，在精神上达到一种无所挂碍的境界。\n\n这种超越意识首先在白居易身上有着突出的表现。白氏久经宦海沉浮之后，思想意识已从对理想的执著走向了远离政治和求取闲适的超越。他走向超越的方法大抵有三：一是“无论海角与天涯，大抵心安即是家”的安心思想；二是“吾道寻知止”的知足观念；三是“应似诸天观下界”的看破态度。\n\n而苏轼对白居易超越意识的接受，可以说是全方位的。对于知足观念和看破态度，苏轼笔下也屡有展示，如“日啖荔枝三百颗，不辞长作岭南人”“九死南荒吾不恨，兹游奇绝冠平生”。同时，苏轼对白氏倡导的“中隐”方式予以赞赏：“未成小隐聊中隐，可得长闲胜暂闲。我本无家更安住，故乡无此好湖山。”希慕中隐，追求长闲，四海为家，湖山优游，并明言要像白居易一样“庶几复享晚节闲适之乐”。据此可知，在超越意识一点上，苏与白实有着一脉相承的紧密关联。\n\n（二）白居易影响了苏轼的诗歌风格、题材和语言章法\n\n（1）苏轼作为一位伟大的诗人，他的诗歌形成了自己的风格，既有豪放恣肆的一面，又有平淡自然的一面。而这平淡自然的特点是近于白居易的，受到了白居易影响的。宋人周必大在谈到苏轼对白居易的推崇时说其中一个原因就是“其文章皆主辞达”，而“辞达”的一个含义正是语言自然流畅。\n\n（2）白居易诗按题材分有三类：讽谕诗、闲适诗和感伤诗。苏轼所受容的白诗，主要就是感伤诗和闲适诗，这和苏诗中数量最多也最为人们喜好的是那些通过描绘日常生活经历和自然景物抒发人生情怀的作品的情况也是吻合的。如苏轼的《除夜病中赠段屯田》中“龙钟三十九，劳生已强半。岁暮日斜时，还为昔人叹”明显就是受到了白居易《隐几》中“行年三十九，岁暮日斜时”的启发。\n\n（3）在语言、章法等方面苏轼也有不少诗具有白居易诗歌的特点，如《新滩》《壬寅二月有诏令郡吏分往属县减决囚禁》《张寺丞益斋》《鱼蛮子》《刘丑厮诗》《宥老楮》等诗歌都有白居易的影子，被后人给出“大段似香山”“香山一派”等评语。\n\n二、白居易对陆游的影响\n\n现存的陆游诗歌有四分之三以上是其晚年闲居农村时所写，农村闲居生活成为陆游诗歌的重要题材。陆游热爱生活，善于从各种生活情景中发现诗材。无论是高山大川还是草木虫鱼，无论是农村的平凡生活还是书斋的闲情逸趣，他都有细致入微的描绘，如《游山西村》和《临安春雨初霁》。总体来看，陆游的大量诗作，无论是题材内容还是风格特点，都与白居易\n\n诗非常接近。陆游自己也说过：“闭门谁共处，藉乐天诗”“乐天不生梦得死，恨无人续竹枝歌”。可见陆游对白居易的诗非常喜爱，并加以学习。\n\n综上所述，白居易的影响贯穿于苏轼和陆游的整个创作生涯。这种影响不仅体现了白居易在文学史上的重要地位，也展现了中国文学传承与发展的一脉相承。","keywords":"人生观 处世态度 超越意识 安心思想 知足观念 看破态度 诗歌风格 题材** 平淡自然 感伤诗 闲适诗 语言 章法 闲居农村 从各种生活情景中发现诗材 题材内容 风格特点","note":"总体来看，白居易对苏轼、陆游的影响，并不像杜甫、韩愈那样明显，不过，中国文学前后相继、一脉相承，每一代诗人的崛起，都得益于前人的艺术经验，所以，或多或少都会显露出前人的影子。回答这道题，我们也是从白居易、苏轼、陆游具体的诗歌创作特征出发去进行对比，然后寻找他们之间的相似之处就可以了。总体来看，白居易对苏轼的影响更加广泛，而对陆游则影响相对较小。相关内容可以参考尚永亮《苏轼与白居易的文化关联及差异》、王域铖《宋诗对白居易的受容与超越》，具体论文可以在李凡文学正版群获取。"},{"id":"196","stars":"★★★","title":"试分析唐代古文运动发生的原因","body":"中兴的愿望促成了儒学的复兴，促成了政治改革。正是在这样的背景下，文体文风的改革得到了发展。换言之，是经世致用的需要促成了文体文风改革高潮的到来。故而，古文运动的发生，主要归因于以下几点：\n\n一、忧时伤世之文引导\n\n安史之乱后，唐王朝由盛转衰，文章却出现繁荣的局面。元结、李华、萧颖士、独孤及、梁肃、柳冕等作者继起，产生了许多忧时伤世之文。残酷的现实逼迫他们不断思考，寻找挽救衰世的方案。他们普遍认为社会颓败的根本原因在于儒家传统缺失，进而造成社会失序，礼义沦丧，道德水准不断下降。而解决的方案是重建儒学的权威地位，清除六朝以来文坛上的萎靡颓败之风。他们以宗经复古为号召，创作了大量散体文，积极探讨文体与文风改革的理论，攻击骈体文浮靡空洞、干篇一律的弊端，对韩愈、柳宗元领导的文风文体改革起到有力的引导作用。\n\n二、儒学的复兴\n\n安史乱后，随着社会形势的急剧变化，儒学开始出现一种新倾向，就是重大义而轻章句。其中成绩最大的当数啖助、赵匡、陆质的新《春秋》学。他们的《春秋》学著作考核三传，取长补短，不拘泥于一经，采兼收并蓄之途。一方面推重《公羊传》《穀梁传》今文经学的观念，另一方面以经驳传，改变了此前疏不破注的解经方法。他们注重对微言大义的阐发，倡导以己意体会圣人之意，与汉儒章句之学截然不同。这种跨越传注，直指本义的研究方式，直接促成了儒学的复兴。\n\n三、政治上的改革\n\n从儒学复兴到对现实的改革，是安史之乱后的一大变局。肃宗后期到代宗朝任盐铁使的刘晏，在其主管财政期间采取了一系列理财措施，改进盐铁专卖制度，改革税制，初征茶税；随后德宗朝宰相杨炎正式颁行新的赋税制度-两税法。经过这一系列的财政改革，国家收入有了明显增加，生产力也得到了一定恢复。在此基础上，中央政府展开了对地方藩镇的整顿，到宪宗朝取得了较大的成果，藩镇对抗中央的局面暂时结束，因宪宗年号为元和，故史称“元和中兴”。可以说，对中兴的企盼造就了儒学的复兴，而儒学的复兴促发了政治上的改革。在这种背景下，文体文风改革的出现就顺理成章了。","keywords":"忧时伤世之文引导 儒学复兴 政治改革","note":"古文运动是唐代文体文风改革的高潮，这一现象的出现，是与当时士人渴望政治上的复兴联系起来的。需要注意的是，虽然名为“古文运动”，但实际上是对当时散文的革新。在考查中，可能将古文运动与明代前后七子的文学复古联系起来，大家要注意一下。古文运动也常在名词解释中出现，大家要注意一下。"},{"id":"197","stars":"★★★★★","title":"试述韩愈、柳宗元的古文理论","body":"在继承前人的基础上，韩愈、柳宗元提出了更为明确、更具有现实针对性的古文理论。概括来讲有如下内容：\n\n一、文以明道\n\n韩愈标举仁义道德为其道的内涵。他的“道”，乃是“夫子、孟轲、扬雄所传之道”。他倡导古文最主要的目的是尊崇古道，在建立儒家道统之外，用“道”来丰富文的内容从而使其文章能够在现实生活中发挥作用。他将明道和事功紧密结合起来，用文章表达其排斥佛老、反对割据、振兴儒学的宗旨，这为他的古文理论注入了强烈的现实因子。\n\n柳宗元的文学理论大体上与韩愈接近，也强调“文”与“道”之间的关系。不过柳宗元对文章的经世致用功能特别关注，他在《答吴武陵论＜非国语＞书》中要求文章要“辅时及物”，即使在永贞革新失败后，他仍然认为“辅时及物之道，不可陈于今，则宜垂于后”，可见他对“辅时及物”的执着。\n\n二、为文宜“自树立，不因循”，贵在创新\n\n韩愈主张“词必己出”，而不是简单地模拟古文。韩愈重视从古人的作品中学习语言，但他并不停留在学习这些古文的技巧和语言上，而是提倡在师法古人的同时不忘语言的创新和风格的个性化。他追求的是“师其意不师其辞”的学习方法和“自树立，不因循”的语言风格。可以认为，倡导复古而能变古，反对因袭而志在创新，乃是韩愈古文理论超越前人的一大关键。\n\n柳宗元提倡创新的力度虽不及韩愈，但也一再反对“渔猎前作，戕贼文史”，这正说明他与韩愈的主张是一致的。\n\n三、标举重道而不轻文的观念\n\n韩愈和柳宗元在倡导“文以明道”的同时，充分意识到“文”的作用，为写好文章而博采前人遗产，这种重道亦重文的态度，已与他们之前的古文家有了明显的区别。\n\n由此出发，他们进一步主张广泛学习经书以外的各种文化典籍，对《庄》《骚》《史记》、相如之赋、子云之赋等“百氏之书，未有闻而不求，得而不观者”并借此“旁推交通而以为之文也”。即使对他们一再指斥的“骈四俪六，锦心绣口”的骈文，也未全予否定，而注意吸取其有益成分。这种文学观较之此前古文家将屈、宋以后文学一并排斥的极端态度来，无疑有了长足的进展。\n\n四、重视作家的道德修养和文章的情感力量\n\n韩愈重视作家个人修养与文章内容的内在联系，也承认作家个人情感在文章中的重要性。韩愈所说的“道”在儒家伦理规范的基础上兼指个人的内在修养和人格精神。他重视“气”的功用，认为这是决定文章优劣的重要方面。他对“道”的理解从外在的礼法道德转化为人的内在人格修养，丰富了“道”的内涵，也引导文学趋向于个人情感的抒发。他所说的“气”，包括“不平则鸣”“穷苦之言”等个人情感在文章中的抒发与表现。韩愈的“文以明道”观念是个庞大的体系，对人的喜怒哀乐之情持肯定的态度，不像前人那样一味排斥。\n\n与韩愈相同，柳宗元也主张人的气质“独要谨充之”，情感要“引笔行墨，快意累累”地尽兴抒发，作为一种高度重视个人情感的理论主张，二者均具有不容忽视的价值和意义。\n\n总的看来，韩愈和柳宗元在评价骈文时出语尖刻，在强调“文以明道”观念时又能强调“文”的作用，凸显“人”的价值，重视文学语言、文章气势等艺术层面。","keywords":"文以明道 贵在创新 重道而不轻文 道德修养 情感力量","note":"韩柳古文运动是唐代散文中简答和论述的常考点，在备考时要准备得尽量全面完整。关于韩愈、柳宗元的理论，最重要的一点是“文以明道”，这可以说是他们论文的核心。韩、柳二人其余的观点，都是从这一点上发展延伸出来的。不过二人并未重道轻文，在强调“道”的同时又关注“文”，这一点是值得肯定的。"},{"id":"198","stars":"★★★★","title":"韩愈、柳宗元在散体文创作上的开拓","body":"韩愈、柳宗元在散体文创作上有着众多的开拓，但主要表现在两个方面：\n\n一、在勇于创新的基础上建立新的散文美学规范\n\n韩愈和柳宗元在文学观念上否定了六朝的“文笔”之分，把散文引入了杂文学的发展之途；但在创作实践中却颇为重视辞采、语言和技巧，突破了一切文体的界限和陈规旧制，把大部分应用文写成了艺术性很强的文学散文：\n\n（一）从辞采来说，韩愈、柳宗元既一致反对“绣绘雕琢”的骈文末流，又在自己的文章中尽量吸收骈文的优长，用不少整齐有力的四字句夹杂于散体文句之间，造成长短错落、音调铿锵的声情效果。\n\n（二）从语言来看，韩愈既力倡“去陈言”，又强调“文从字顺”，其雕琢词语、匠心密运的程度丝毫不亚于骈文作家。韩愈的散文语言准确、生动、凝练、独创，兼收前人语言和时下词语，熔铸成精警独到、别具一格的新词，如“蝇营狗苟”“痛定思痛”“大放厥词”等等。柳宗元也力主博采众长而自铸伟词，对遣词造句和文势的营造给予了极高的重视。\n\n（三）从技巧来看，韩愈善于用变化多端的构思方法组织文章，善于通过比喻、排比、细节描写来丰富文章的形象性和感染力，他的文章自有抑扬起伏、开阖照应的规律可寻，在无法与有法之间，创立了一种与上古文章判然有别的新的散文规范和秩序。\n\n读韩、柳的散文，会感到一股股迎面扑来的情感浪潮，会感到令人心悸魄动的鲜活灵魂和生命力。\n\n韩愈的文章如长江大河，澎湃流转。作者横绝奔放的气魄借其滔滔雄辩而溢诸行墨之间，更重要的是，韩愈在应用文中感怀言志，以感激、怨怼、奇怪之辞，发其穷苦愁思不平之声，既变“笔”为“文”，又使“文”具备了源于现实的情感力度。\n\n与韩文相比，柳文则如崇山峻岭，简古峭拔，立意精警。他的书信，充溢着椎心泣血的身世之悲；他的游记，渗透了人与自然的亲和之情；他的不少论说文则具有“笔笔锋刃，无坚不摧”的特点。\n\n总之，唐代散文到了韩愈、柳宗元这里，可以说是竖起了一道明确的界碑，此前文多平庸、苍白，较少感染力；至韩愈、柳宗元而面目为之一变，于浑厚坚实中寓有一气贯注的精神气脉和情感力量，展现出异常鲜明的个性特征。","keywords":"新的散文美学规范 提高古文文学境地 鲜明的个性特征","note":"唐代文体文风的改革的成功，是在韩愈，柳宗元手中完成的。韩、柳的出现，使得散文的创作别开生面、气象一变，此知识点需要重点把握。韩、柳二人对散文的变革，主要体现在散文艺术与思想内涵这两个方面，可以说是全方位提升了散文的品位与境界。"},{"id":"199","stars":"★★★","title":"试述韩愈散文主要类型及各自的特征","body":"一、论说文气势夺人\n\n韩愈论说文从内容上可分为两类：一类重在宣扬道统和儒家思想，如《原道》等，因其思想陈旧且少文学色彩，故价值不高；另一类重在反映现实，揭露矛盾，值得重视。\n\n韩愈是一位善辩之士，而善辩又主要来源于他的胆壮气盛，二者结合在一起，遂使得他的议论文字往往惊世骇俗，极具震慑人的气势。如《论佛骨表》，韩愈敢于直斥佛骨为“朽秽之物”，并对宪宗亲临观之的行为表示“耻之”。自我形象在波涛翻卷的情感激流和气势夺人的滔滔雄辩中得以自然展现，这是韩愈论说文的一大特点。\n\n二、杂文嘲讽现实，议论犀利\n\n韩愈的杂文主要有《杂说一说龙》《杂说四·说马》《获麟解》《伯夷颂》等，多借龙、马、麒麟等动物为喻，表达作者对个人人生际遇的喟叹以及对现实生活的不满，议论犀利。韩愈的杂文相较论说文更为自由随便些，或长或短，或庄或谐，文随事异，各当其用。其中最为人称道的是《杂说四》，文章通篇以马喻人，表现作者对人才受压抑的悲愤，构思精巧，寄慨遥深。\n\n三、序文言简意赅，形式多样，表达对现实社会的各种感慨\n\n如《送董邵南序》起首一句“燕赵古称多感慨悲歌之士”，劈空而来，一股郁勃侠烈之气溢于笔端，其中笼罩着的悲怆情调和言而未尽的深长情绪，给人以强烈震撼。《祭十二郎文》，则围绕家庭、身世和生活琐事，尽情抒写作者对亡侄的伤痛，缠绵悱恻，凄切无限。写“一在天之涯，一在地之角，生而影不与吾形相依，死而魂不与吾梦相接，......彼苍者天，曷其有极”的无穷怅恨，无一语不从至性中流出，令人读后，为之泪下。\n\n四、碑志因人而异，竭尽变化，尤重细节描写\n\n墓志本是应用文体，多用骈文，韩愈之前的墓志创作一般较少文学性，韩愈的碑志打破了传统碑志死气沉沉的局面，用古文写墓志，因人而异，竭尽变化，在写法上不拘格套，尤重细节描写，借一二琐事，即将传主的性格、心态巧妙地展现出来，使之成为一篇篇生动的人物传记。在人物刻画上，韩愈诸碑志更是“一人一样”，极近小说笔法。韩愈碑志不惟叙墓主事迹，时亦借以发议论、寓讽刺，表现强烈的爱憎之情。此类已将重心转向揭露现实社会弊端的写法，在此前墓志中也是不多见的。","keywords":"气势夺人 嘲讽现实 议论犀利 言简意赅 因人而异 竭尽变化","note":"韩柳倡导的古文运动，开辟了唐以来古文的发展道路。韩愈散文成就很高，包括论说文、杂文、序文和碑志、传记等方面，大家要结合作品，具体掌握。其中论说文的分类，袁行霈版教材和马工程版教材有所不同，前者将其论说文分为宣扬道统和反映现实两类，而将其序文单列出来；而后者则将其论说文分为四类：论道、论政、论学和牢骚，并未将序文单列。大家要根据报考学校的参考书灵活应对。"},{"id":"200","stars":"★★★★","title":"试分析韩愈散文的艺术成就","body":"韩愈是继司马迁之后，成就卓著的散文作家，其散文创作的艺术成就，主要表现在以下几个方面：\n\n一、积极进行文体创新\n\n韩愈在三代秦汉以来逐步形成发展的各种散文体裁的基础上，加以完善、变化、创新，使之更富于表现力，从而开创了散文创作的繁荣局面。\n\n序记之文，前人常用以流连光景，刻画山川，间以叙说事功，抒发感慨，有类辞赋，率多浮浅。韩愈用而为夹叙夹议的杂文，可以议政讽俗，也可以论道斥佛。铭墓之文，韩集独多。他一改历来志铭“铺排郡望，藻饰官阶，殆于以人为赋，更无质实之意”的旧貌，使之成为高品位的文学作品。记传之文，韩愈师法《史》《汉》，亦能有所创新。书信之文，汉代详尽，六朝贵简，“独昌黎与人书，则因人而变其词”。\n\n总之，韩愈“所著书、论、序、记、碑、铭、颂、辩诸什”，“多所独开门户”。\n\n二、重视语言，致力于词语创新\n\n韩愈论文，极重视语言，“词必己出”“陈言务去”“怪怪奇奇”“文从字顺”等主张，在其为文时，得到实践。在词语的运用上，他活用成语，自铸新词，喜用口语，多用虚词，因事造言，生动活泼，颇多创新。他不仅创造性使用古代的成语，还经常引入当代口语，我们今天所用的成语如“杂乱无章”“落井下石”“佶屈聱牙”等，都出自他的手笔。\n\n三、风格上气势磅礴、汪洋恣肆，做到了奇崛排奡与文从字顺的统一，在风格上做到了创新\n\n韩愈散文风格的主要特色是气势磅礴，汪洋恣肆。韩文气势，源自韩愈为人的浩然正气。他正道直行，疾恶如仇，谠言极谏，不计顿踣，以道统自居，发而为文，理直而气壮。韩文的情激气盛，也是他实践养浩然之气、不平而鸣的论文主张的结果。\n\n韩文风格另一显著特色是奇崛排奡与文从字顺的统一。韩文之奇崛，在于其立意构思，布局造语，力求翻新出奇，不肯犹人。韩文之文从字顺，在于其“虽以力去陈言为务，而又必以文从字顺各识其职为贵”。\n\n总之，韩愈继承和发展了先秦两汉散文，在赠序、书启、碑志、杂感、论说、记传等文体中，以散体取代了骈体，并用以论政议学记事状物、抒发情感，大大拓展了散文的社会和文学功能，提高了它的文学品位，打破了骈文的一统天下，扫荡了气骨萎靡、词必俪偶的文风，开创了古文运动的新局面。","keywords":"文体创新 词语创新 气势磅礴 汪洋恣肆 奇崛排奡 文从字顺","note":"韩愈是唐代古文运动的代表人物，他不但做出了理论贡献，而且以自身散文创作实践推动了散文的发展。可以看到，韩愈的散文创作风格一方面受到了其自身性格的影响，另一方面也体现出了对“文以明道”等散文创作理念的贯彻。可以说，作为古文运动的主要发起者，韩愈的确起到了带头的作用。"},{"id":"201","stars":"★★★★","title":"秦观说：“杜氏、韩氏，亦集诗文之大成者欤”，谈谈你的看法（山西大学）","body":"【答题框架】\n\n秦观的这一评价强调了杜甫诗歌和韩愈散文集大成的特点，深刻地揭示了杜甫和韩愈在中国古代文学史上的崇高地位，是非常值得肯定的，理由如下：\n\n一、杜甫诗歌的集大成特点\n\n杜诗在艺术上完成了荟萃前人诗歌技巧的历史使命。他不但集以往之大成，而且通过自己的艺术实践加以革新创造，以新的面貌开启后世。杜诗集大成的特点主要表现在两方面。\n\n（一）继承《诗经》、汉乐府以来诗歌的写实传统，为中国古代诗歌反映社会人生开辟了广阔道路\n\n杜诗的叙事与写实，显然是受到《诗经》和汉乐府的影响，其忠君恋国、仁民爱物的精神又是对屈原《离骚》的主动继\n\n承。在五言古诗的写作中，他接受王粲、曹植、陶渊明等诗人的影响。他的古诗多律句，正是学齐梁以来重偶句排比的缘故。他主张力崇古调，兼取新声；一方面推重古体，另一方面又注意近体；一方面要求风格、语言的雄浑古朴，另一方面又重视修辞的清丽华美。正是在这种文学思想的指导下，杜甫能够较为全面地认识到各个历史时期的作家作品都有自己的特色与成就，能兼取众人之长。\n\n（二）博采古今作家之长并形成自己独特的诗歌风格\n\n杜甫在句法变化与炼字的精当方面确已达到惊人的地步。为了在色彩的组合上造成先声夺人的艺术意境，他常把色彩字或词置于句首，如“绿垂风折笋，红绽雨肥梅”。他还善于运用动词和副词，描写水常用“动”，描写鸟则常用“度”和“过”，如“大江动我前，汹若溟渤宽”。他有意用较宽泛的动词，构成浑融含蓄的意境，如“映阶碧草自春色，隔叶黄空好音。由于注重诗歌语言的锤炼，他的诗歌中常有非常美丽或精警的句子，如“细雨鱼儿出，微风燕子斜”“落日照大旗，马鸣风萧萧”。\n\n二、韩愈散文的集大成特点\n\n韩愈善于兼收并蓄，采众家之“花”，酿自己的“蜜”，集众美于一体，遂“创立了一种与上古文判然有别的新的散文规范和秩序”。\n\n（一）韩愈全面吸收了先秦两汉散文的精华。他的论说文，兼有孟子的论辩性、名墨的逻辑性和法家辨析的深刻性。他的叙事散文也是“深造孟子，陶铸子长，勒一家之言”，全面地吸收了史传散文的艺术营养，整体简洁、传神，如在《送石处士序》中，只抓住石处士处事“无求于人”，一旦因“以义请而强委重任”，则“不告于妻子，不谋于朋友，冠带出见客”，一个在危难之际，敢于为知己者死的侠士风采，跃然纸上。\n\n（二）韩愈既摄取先秦两汉散体文之长，又能“吸六朝之髓”，他制裁骈文，合以今词，比如《送李愿归盘谷序》中就存在大量的骈辞俪句。与六朝骈文不同的是，这些骈词俪句，并不刻意对偶、谐韵，而是一任自然。\n\n（三）韩愈还善于熔裁古语，吸收当代口语而自铸新词。诸如“跋前踬后”“蝇营狗苟”“粉白黛绿”“俯首帖耳”“下寒上聋”“摇尾乞怜”“形单影只”“贪多务得，细大不捐”“杂乱无章”“不平则鸣”“落井下石”等等，皆是他在对前人和俗语凝炼的基础上，铸造的语言精华。\n\n因此，无论是杜甫还是韩愈，他们的文学成就都离不开对前人的继承，以及在继承基础上的创新，所以秦观才评价道：“杜氏、韩氏，亦集诗文之大成者欤。”","keywords":"杜甫诗歌 写实传统 独特的诗歌风格 韩愈散文 先秦两汉散文的精华 论说文 叙事散文 制裁骈文 合以今词熔裁古语 自铸新词","note":"秦观的这句话出自他的《韩愈论》，这篇文章主要是在评价韩愈的文学成就。在文章中，秦观将韩愈在散文上的成就比作杜甫在诗歌上的成就，并且二人都具有集大成的特点。因此，文章虽然讨论的是韩愈，但也有相当一部分篇幅在讨论杜甫的“集大成”，并且秦观还是第一个明确提出杜甫“集大成”特点的人，对后世杜甫批评产生了非常重要的影响。在答题时，我们主要是紧扣“集大成”这一关键词，结合杜甫诗歌、韩愈散文的艺术成就作答就可以了。相关内容可以参考曹林娣《略论韩愈散文的历史贡献》，具体论文可以在李凡文学正版群中获取。"},{"id":"202","stars":"★★★★","title":"试分析柳宗元散文的类型与成就","body":"柳宗元散文的总体艺术风格是沉郁凝敛、冷峻峭拔，具有凄幽、愤激、冷峻的色彩和浓郁的诗意，以及明显的讽谕性、象征性。他的散文创作主要包括如下类型：\n\n一、杂文表现为正话反说和借形似之物，抨击政敌与现实两大特征\n\n柳宗元的杂文有两个显著特征：一是正话反说，借问答体抒发自己被贬被弃的满腔幽愤。在《愚溪对》中，作者通过虚拟梦境，写了他与溪神的一段辩论，将其哀怨全部包容于“智者用，愚者伏，用者宜迩，伏者宜远”的反语之中。另一个特征是巧借形似之物，抨击政敌和现实。\n\n二、寓言文结构短小而极富哲理意味，是对零章片段的先秦寓言的重大发展\n\n柳宗元寓言的旨意多在讽政刺世，手法都是假物为说。《三戒》借麋、驴、鼠的故事，写三件应该警戒的事情。其中《永某氏之鼠》写群鼠在旧房主纵容下横行无忌、干尽坏事，最后被新房主彻底消灭；《黔之驴》的故事已广为人知，被贵州山中小老虎吃掉的那只蠢笨的驴子已成为某些外强中干者的绝妙象征，而“黔驴之技”“庞然大物”也作为富有形象性的成语流传下来。柳宗元的寓言，体裁多样，深刻的哲理性、严肃的政治性和幽默的讽刺性高度统一，有完整生动的情节典型的形象，是对零章片段的先秦寓言的重大发展。\n\n三、传记文为普通百姓立传，受唐代新兴的传奇小说的影响\n\n柳宗元传记散文为普通百姓立传，突破了以往传记作品不为普通人物立传的传统，以非凡的胆识和深邃的笔触，从小人物身上挖掘出普通人所具有的高尚品质、善良天性和聪明才智，为传记文学的画廊增添了小人物的光辉。这些传记文大多以真人真事为基础，但有的作品也带有若干虚构、寓言的成分，作了一定的夸张。其重情节、重细节处，明显地受唐代新兴的传奇小说的影响，如《捕蛇者说》着重描写的是人物的奇特之处。\n\n四、山水游记风格冷峭，蕴涵理趣，开创了描写自然美的游记散文创作的新局面\n\n山水游记是柳宗元散文中的精品，也是作者悲剧人生的审美情趣的结晶。由意在宜泄悲情到艺术地表现自然，将悲情沉潜于作品之中，形成柳氏山水游记“凄神寒骨”之美的特色。在山水散文方面创造天人合一的意境，尽情于空漾明瑟的境界，放意于登临游观，人与山水密不可分，风格冷峭，蕴涵理趣，开创了描写自然美的游记散文创作的新局面。\n\n柳宗元善于选取深奥幽美型的小景物，经过一丝不苟的精心刻画，展现出高于自然原型的艺术之美。用他的话说，就是“美不自美，因人而彰”。他的山水游记上承郦道元《水经注》，而又有了突破性的提高：它不是对山水的纯客观描写，而是在描写中贯注了一股浓烈的寂寥心境，且借对山水的传神写照来表现一种永恒的宇宙情怀。同时它极富诗情画意，表现了对自然美的新鲜感受，丰富了描绘自然山水的艺术技巧，开拓了散文反映现实与人生的新领域，从而确立了这种体裁在文学史上的独立地位。","keywords":"正话反说 巧借形似之物 极富哲理意味 为普通百姓立传 风格冷峭 蕴涵理趣","note":"柳宗元是古文运动的积极倡导者、实践者，他的散文取得了杰出的成就。柳宗元在“古文运动”中的地位仅次于韩愈，与韩愈并称“韩柳”，对后世散文家影响甚大。柳宗元也提出过重要的古文理论，但其主要成就还是以他典范的古文创作参加和领导“古文运动”的。由于长期谪居边远地区，他在领导“古文运动”方面不及韩愈，但他作品所达到的思想高度和艺术成就又是韩愈所不及的。"},{"id":"203","stars":"★★★","title":"试分析柳宗元山水游记文的艺术特征","body":"柳宗元擅长写山水游记，他往往在描写景物时，融入个人的遭遇和对现实的不满。山水在他的笔下有了精神、有了人格，山水帮助他获得暂时的心理平衡和精神的超越。他在游记中再现的山水成为他的精神家园。柳宗元的山水游记散文，主要具备如下特色：\n\n一、“凄神寒骨”的美学风格\n\n山水游记是柳宗元散文中的精品，也是作者悲剧人生和审美情趣的结晶。身世遭遇和环境的压迫，造成心理的变异，长歌当哭，强颜为欢，聊为优游，乐而复悲。郁愤填膺时，憎山恶山，以山水为“牢”；一人独游时，又与之同病相怜，并借山水之“幽幽”“宥宥”以“处休”“观妙”。由意在宣泄悲情到表现自然，将悲情沉潜于作品之中，形成了柳氏山水游记“凄神寒骨”之美。\n\n二、运用象征手法，“借题感慨”\n\n翻阅柳宗元那些主要写于永州贬所的记游之作，会突出地感觉到，其中呈现的大都是奇异美丽却遭人忽视、为世所弃的自然山水。在描写过程中，作者有时采用直接象征手法，借“弃地”来表现自己虽才华卓荦却不为世用而被远弃遐荒的悲剧命运，如《小石城山记》对小石城山的被冷落深表惋惜和不平，《钴鉧潭西小丘记》直接抒写对“唐氏之弃地”的同情，都具有“借题感慨”的特点：既重自然景物的真实描摹，又将情感不露痕迹地融注其中，令人于意会中领略作者的情感指向。\n\n三、展现出高于自然原型的艺术之美\n\n柳宗元的山水游记是真正的艺术性的文学，美的文学。他善于选取深奥幽美型的小景物，经过精心刻画，展现出高于自然原型的艺术之美。用他的话说，就是“美不自美，因人而彰”。即通过发掘、加工和再创造，将那些罕见的胜境传给世人，以免“贻林涧之愧”。他要用自己的全副精力和才情，去“漱涤万物，牢笼百态”，借以安顿他那颗悲哀苦闷的灵魂，并从中获得些许凄美的怡悦。在他笔下，自然山水是那么纯净，那么奇特，那么多彩多姿，那么富有灵性！至于林木山风，更是生气勃勃，气象万千。这里，有动有静，有形有色，有疾有缓，有点有面，刻画细而不琐碎，语言精练而极富变化，文势则严整劲峭而不乏参差舒缓。","keywords":"凄神寒骨 象征手法 借题感慨 高于自然原型","note":"柳宗元的散文创作中，以山水游记成就最高，所以大家对于其山水游记散文要重点关注。柳宗元的山水游记散文融注了许多自身的情感体验，体现出了强烈的个性化色彩，因而整体“凄神寒骨”，充满悲情。这一点，从他的《至小丘西小石潭记》等代表作品中可以看出来。"},{"id":"204","stars":"★★★","title":"简述唐传奇的发展阶段及代表作品","body":"唐传奇指庸代流行的文言短篇小说，是在六朝志怪小说的基础上，融合历史传记小说、辞赋、诗歌和民间说唱艺术而形成的新的小说文体。唐传奇的发展大致可分为三个时期，即初兴期、繁盛期和袁落期。\n\n一、初、盛唐时代：唐传奇的初兴期\n\n从初唐的武德年间到大历末，是由六朝志怪小说演变为唐人传奇小说的过渡期。这一时期，单篇的传奇文已出现。一方面六期志怪小说的某些特征还未完全摆脱，另一方面，又开始具备唐人小说某些新的素质。如王度的《古镜记》以古镜为线，将12个小故事连缀在一起，记述此镜伏妖等灵异事迹。《古镜记》是唐代现存最早的一篇小说作品，它是用“古文”体第一人称写成的，结束了以往中国小说一律采用第三人称叙事的局面。张鸞的《游仙窟》是唐代传奇初兴期艺术成就较高的作品，带有讲体小说的鲜明特征，同时又带有艳遇纪实的性质，用第一人称的叙述方式，语言浅显通俗，逸趣横生，有不少民间气息很浓的妙语。唐初传奇小说在志怪小说基础上，融合史传、辞赋、诗歌、民间说唱艺术等多种叙事文学成分而形成，一开始就显示出风格的多样化。\n\n二、中庸时代：传奇发展的繁盛期\n\n中唐时代是传奇发展的兴盛期，从唐代宗到宜宗这100年间，名家名作蔚起，唐传奇的大部分作品都产生在这个时期。这一现象，一方面固然是小说本身由低级向高级不断演进的结果，另一方面也得益于蓬勃昌盛的各体文学在表现手法上所提供的丰富借鉴，如诗歌的抒情写意、散文的叙事状物、辞赋的虚构铺排等艺术技巧在传奇作品中屡见不鲜，而诗歌向传奇的渗入尤为明显，使得诸多传奇作品都具有诗意化特点。\n\n传奇在中唐的繁荣，还与此时特殊的社会文化风尚紧密关联。中唐时期，通俗的审美趣味由于变文、俗讲的兴盛而进入士人群落，传奇在很大程度上已为人们接受和欣赏，已经有了广大的接受群。这一接受群，是伴随着贞元、元和之际由雅入俗的浪潮而日趋壮大的。\n\n三、晚唐到五代：唐传奇的衰落期\n\n所谓衰落，不是指数量，而是指质量。虽然此期作品数量仍然不少，并出现了较多的传奇集，如牛僧孺的《玄怪录》、袁郊的《甘泽谣》等。但这些作品大多篇幅短小，内容单薄，或搜奇猎异，或吉神志怪，思想和艺术成就都失去了前一个时期的光彩。而杜光庭的《虬髯客传》是晚唐游侠小说中成就最高的作品，故事曲折多变，引人入胜，突出豪侠人物的坚韧刚毅和車尔不群，展示出一种高蹈不羁的生命情渊。","keywords":"初、盛唐初兴期 中唐繁盛期 晚唐衰落期","note":"唐代传奇的产生，标志着我国小说的发展已逐渐趋于成熟。从此，小说形成了自己的规模和特点，成为一种独立的文学形式，而且出现了一些专门从事传奇创作的作家，促进了小说在艺术上的丰富和提高，对后来宋元戏曲、白话小说的创作也产生了很大的影响。"},{"id":"205","stars":"★★★★","title":"试分析唐传奇的创作特征","body":"唐传奇是魏晋南北朝志怪、志人两类小说的综合发展。就志怪而言，是由以怪异为本转向叙人情世态为本，而不放弃志怪之文笔。就志人而言，是由纪实其人言行之短语扩张为虚构人物志传纪。两者都摇摆于写实与幻设两端之间，形成了传奇叙事文体的几个特征。\n\n一、构思之奇：虚实相生的多样结构\n\n唐传奇因为是“有意为小说”，而归趣则在“文采与意想”，所以传奇作家对各种传说间见除艺术加工外，还在其础上进行杜撰，亦即有闻加工，无闻虚构，从而使小说所传之“奇”，成为有意为之之奇、大加渲染发挥后之奇。在结构布局上，传奇则往往采用史传的表现方法，明确交代故事发生的时间、地点，甚至标注年号，故意给读者造成心理上的真实感觉，而在故事展开过程中，则绝不受其限制，既大量使用虚构想象以求奇，又致力于细节描写以求真，在真假实幻之间，创造出情韵盎然、文采斐然的艺术品，从而在小说这一文体的独立历程上迈出了关键性的一步。所以唐传奇叙事绝大多数篇什都是虚实相间，幻中有真，真中有幻，富有奇情奇趣。\n\n二、观照的焦点：人格之价值\n\n唐传奇虽然许多篇章记述的是怪异之事，但基本上是志人的，而不是志怪的，一些为后世广泛传诵的篇什，如《莺莺传》《李娃传》《霍小玉传》《虬臂客传》等，更都是纯写实的小说。即便是记梦幻、神仙物怪，那也是人情化了的，或是世情\n\n世态的折光，或是具象化了的伦理的诉求，或是寄托了温馨的情趣。唐传奇里更多的是寻常人的人物传和行事记，都是传述其卓异的性情行事，此外，也有反映弱势人群的不幸的。\n\n因此，从总体看，唐人传奇以愉悦性情为旨归，更加关注个体生命和个体情感，全方位地展示纷纭复杂的人世生活，让诸色人等在作品中跃动，借以寄寓个人的志趣爱好和理想追求，已成大势所趋。\n\n三、藻绘可观，意韵深沉\n\n唐传奇变六朝志怪小说的粗陈梗概为“施之藻绘，扩其波澜”，记叙委曲，而且绘形绘色，便增大了文学的直观审美性。\n\n（一）构思新颖，情节曲折委婉\n\n现存传奇的篇幅一般不长，短的仅有几百字，长的也没有超过一万字，但在艺术构思上大都奇异新颖、富于变化，使有限的文字生出无限的波澜，以曲折委婉的情节引人入胜。\n\n（二）人物刻画传神\n\n不少传奇作者还是人物写生的好手，他们不仅善于以精湛的细节描写来揭示人物的心理活动，用对比、衬托手法来表现人物的性格特点，而且尤工于白描式的肖像慕写，往往三言两语，即飞笔传神。\n\n（三）叙事简明，对话生动，情境优美\n\n在语言、辞采等修辞手法的使用中，唐传奇也取得了突出的成就：叙述事件简洁明快，人物对话生动传神，词汇丰富，句式多变。有些作品虽施以藻绘，却无繁缛之弊而有明丽之美，一些佳作更善于用诗化语言营造含蓄优美的情境，“莫不宛转有思致”。在描写景物、渲染气氛时，或简笔勾勒，或浓墨重染，极富艺术表现力和感染力。","keywords":"虚实相生 人格价值 藻绘可观 意韵深沉 构思新颖 曲折委婉 刻画传神 叙事简明 对话生动 情境优美","note":"唐传奇可以说是中国小说发展史上的一个重要阶段，鲁迅评价说，中国的小说作家到唐传奇这里才“始有意为小说”，可以说，正是在唐代，小说作家才从自发走向了自觉，可见其重要地位。唐传奇这一概念在名词解释中出现的频率非常之高，大家要注意一下。"},{"id":"206","stars":"★★★★","title":"试分析唐传奇在文学史上的地位与影响","body":"唐传奇是我国古典小说发展史上的里程碑，其成就迥高于前人，沾溉乎后世。唐传奇的地位与影响，主要表现在以下方面：\n\n一、标志着中国古代文言小说的成熟和定型\n\n唐传奇是对以前的叙事作品的综合性的跃进，源出志怪，却摆脱了六朝志怪小说佛道宣教宗旨和儒家以神道设教的意识，半是借喻，半是直叙现实人生状况。为历史家轻视、排斥的虚构叙事，在这里获得了广阔的自由天地，“施以藻绘，扩其波澜”，也就具备了小说文体构成的情节、人物、情境三个要素。唐传奇标志着中国古代文言小说的成熟和定型，后世历代都有众多作者，形成古代小说的一条主要支脉。\n\n二、使中国小说走向自觉\n\n通过几代作家的努力，唐传奇融汇以往各种文体的特长并使之辞章化，在叙事方式、细节描写、人物对话、心理描写等多方面都取得了长足的进展，从而形成一种新的文学体裁而跻身于文章之林，终于使中国小说在进入中唐以后从理论到创作都走向了自觉。\n\n三、为中国叙事文学发展确立了正确的方向和原则\n\n一大批优秀传奇作家以其独创性的实践，不仅塑造了一系列具有永久魅力的艺术典型，为古代文言小说树立了各种新的范式，而且为中国叙事文学的发展确立了正确的方向和原则-即无论是描写非现实性的题材，还是以一定的历史真实和现实生活真实为依据，都需要运用想象和虚构来处理情节和描写人物，旨在塑造出生动的人物形象并借以表达作者的思想感情。\n\n四、唐传奇的题材、主题和艺术表现手法对后世文学产生了深远的影响\n\n唐传奇所表现的反对封建婚姻制度，抨击门第等级观念，追求爱情自由，歌颂除暴安良的侠义行为，否定荣华富贵思想，成为后世小说戏曲的传统主题。唐传奇对后代诗词创作也有影响，倩女离魂、柳毅传书、章台柳、黄粱梦等都成为了诗词典故。不过受唐传奇影响最大的还是戏曲和小说，就说唱文学和戏曲而言，唐传奇中的若干故事情节成为诸宫调、宋金杂剧、元明戏曲不断改写和再创造的题材来源；就小说而言，首先，唐传奇直接推动了后世文言小说的发展，并且在形式上呈现出一方面继续以短篇为主、一方面向中篇拓展的趋势。其次，后世白话小说在虚构与想象、行文方式与题材范型、叙事技巧与人物塑造等方面都或多或少地继承了唐传奇的特点。\n\n【李凡关键词：文言小说成熟定型 走向自觉 确立方向原则 对后世文学产生深远影响】","keywords":"","note":"宋元时期的话本、元代的杂剧、明代的传奇和拟话本、清代的戏剧中的许多篇目，都是以明代传奇为蓝本的，比如王实甫的《西厢记》、郑光祖的《倩女离魂》，唐传奇中故事的影响可见一斑。至于其在艺术上的影响，则主要集中于人物塑造、情节的想象和虚构等方面。可以说，唐传奇不仅对小说发展有重要意义，而且对戏剧等叙事文学发展也有重要影响，所以相关内容我们都要重点掌握。"},{"id":"207","stars":"★★","title":"试分析唐代俗讲的艺术特色","body":"佛教传入中土，僧徒为弘道扬教，除译经建寺、斋会讲经外，更利用音乐绘画、雕塑、建筑、文学等手段，广泛布道化俗。佛家讲经，因听讲者不同，有僧讲与俗讲之别。俗讲乃僧徒依经文为俗众讲佛家教义、“悦俗布施”的一种宗教性说唱活动。\n\n一、融讲说、咏唱为一体\n\n俗讲与我国固有的说唱传统有关，但它更主要的来源，是六朝以来佛家的一种讲道化俗的手段：“转读”与“唱导”。转读，或称咏经、唱经，指讲经时抑扬其声，讽诵经文。转读是随佛经传入，改梵为汉，为适应汉语声韵特点而产生的一种读经方法。到了唐代，转读经师吸收民间声腔，趋附时好，专以取悦俗众为务，转读遂向大众娱乐的方向发展。同时，讲经中的另一种方式-唱导，也有了相当的发展。唱导是宣唱法理、开导众心。转读与唱导，以及偈颂歌赞的梵呗，融讲说、咏唱为一体，有说有唱，遂形成唐代的俗讲。\n\n二、由佛家讲经衍出，讲者尽为僧徒\n\n俗讲由佛家讲经衍出，讲者尽为僧徒，即所谓俗讲僧。他们有主咏经的都讲，主讲解的法师，主吟偈赞的梵呗等。俗讲有一定仪轨，维那鸣钟集众；法师、都讲上堂升高座，作梵，念菩萨；说押座；开题，说庄严、忏悔、受三归、请五戒、称佛名等。正式讲经，先由都讲咏经原文若干，法师即就经文敷陈讲解，继以唱辞。一段完了，例以套语催经；于是都讲再咏经若干，次又由法师解说。如此反复，直至讲毕，以解座文结束。俗讲的底本，就是讲经文。这些讲经文都是散韵结合说唱兼行。说为浅近文言或口语，唱为七言，间用三三句式，六言或五言。其上往往有平、断、侧、吟之类的辞语，标示声腔唱法。\n\n三、突破宗教藩篱，映照出现实世界\n\n讲经文取材全为佛经，思想内容不外佛教的无常、无我、苦空、业惑、生死轮回、因果报应，修持戒定慧，以求涅槃解脱等等教义。其中一些作品，以生动的故事情节，叙事、描绘、抒情等手法，广譬博喻，纵横骋说，把深奥的教义转化为生活展示，往往突破宗教藩篱，映照出现实世界，以其浓郁的生活气息，新奇别致的内容，张弛起伏的情节，通俗生动的语言，引人入胜。","keywords":"宗教性说唱活动 讲说、咏唱为一体 佛家讲经衍出 映照现实世界","note":"唐代的俗讲是一种宗教性活动，主要是为佛教传播服务，但也有部分内容突破了宗教藩篱，具有一定的艺术价值。总体来看，俗讲相关内容单独出论述题的可能性不大，多数情况下还是出一些名词解释，大家要注意一下。"},{"id":"208","stars":"★★","title":"谈谈你对唐代变文的认识","body":"唐五代时与俗讲同时流行的民间说唱伎艺尚有“转变”。转变，就是说唱变文。变文，或简称“变”，乃转变的底本，在敦煌说唱类的作品中保存较多。\n\n一、变文的题材\n\n现存敦煌变文，以题材分，大体有四类：\n\n（一）宗教性变文，这类变文通过佛经故事的说唱，宣传佛家的基本教义。但它们与讲经文不同。它们不直接援引经文，常选佛经故事中最有趣味的部分，铺陈敷衍，渲染发挥，较少受佛经的拘束。\n\n（二）讲史性变文，它们大多以一个历史人物为主，取轶事趣闻，吸收民间传说，加以渲染。这类变文多表现对故国的眷恋与对乡土的思念。在晚唐五代内忧外患、河西地区沦于异族统治的形势下，传唱这些故事，是寄寓着无限感慨的。\n\n（三）民间传说题材的变文，这类变文虽假借历史人物，而所讲故事了无历史根据。\n\n（四）取材于当地当时重大事件与人物的变文，有《张议潮变文》与《张淮深变文》两篇。虽仅两篇，且残缺过甚，但仍可看出当时民间艺人是如何通过变文说唱，热情讴歌张议潮叔侄及其率领下的归义军民艰苦卓绝，英勇奋战，抵御异族侵扰，保境安民的英雄业绩的。\n\n二、变文的特点\n\n敦煌变文以民众喜闻乐见的形式，丰富的想象，曲折的情节，生动的形象，活泼的语言引人入胜。\n\n（一）以声传情，以情带声，声情井茂地演述故事\n\n变文作为转变的底本，本不是案头读物。它是供艺人说唱用的。根据说唱的需要，说表与唱诵结合，叙事与代言并用，融文学、音乐、表演为一体。以声传情，以情带声，声情并茂地演述故事，是它最突出的艺术特点。\n\n（二）想象丰富\n\n变文的想象极为丰富，往往使一些比较简略粗疏的故事，通过扩充细节，夸张渲染，驰骋想象，大大充实丰富起来。\n\n（三）故事完整，情节紧凑，性格生动\n\n在艺术结构上，变文大多能做到故事的有头有尾、脉络清晰；同时又注意情节波澜起伏，留下悬念，以吸引听众。优秀的变文作品，能在故事的矛盾冲突中刻画出生动的人物性格。\n\n（四）语言通俗易懂，生活气息浓厚\n\n变文的语言无论是口语或是浅显的骈体，大都能做到通俗易懂，生活气息浓厚，又杂用俚语方言、谚语成语，新鲜活泼，流畅明快，朗朗上口，悦耳动听。在修辞上，还常用比兴、夸张、排比、对偶、反复、问对、谐音、隐语等手法，加强语言的形象性和表现力。\n\n三、变文的影响\n\n（一）变文表演大体可分三种体制：韵文歌唱、散文讲说兼用，以散文讲说为主，以韵文歌唱为主。这三种表演体制分别对中国古典戏曲、话本小说以及宝卷、弹词、鼓词等说唱文学的发展有重要影响。\n\n（二）作为佛教文化与民间文化交流的硕果，敦煌变文对佛教偈颂和民间歌曲的援引，推进了佛教文学和民间文学对上层文学的影响，中唐时期以韩愈为代表的以文为诗的创作风格的形成，以白居易为代表的通俗诗风的流行，都与变文表演有密切关系。","keywords":"转变底本 宗教性 讲史性 民间传说题材 声情井茂 想象丰富 故事完整 情节紧凑 性格生动 通俗易懂 生活气息浓厚 影响","note":"在这里大家要注意区分“转变”和“变文”。“转变”和俗讲类似，是一种说唱艺术，而“变文”则是其底本。在题材上，变文有宗教性、讲史性、民间题材、重大事件和人物四类；在艺术上，变文在形式、想象力、人物塑造和语言上都取得了不俗的成就。它不仅推动了多种说唱文学体裁的发展，而且推动了佛教文学和民间文学对上层文学的影响。"},{"id":"209","stars":"★★★","title":"试分析晚唐咏史诗的艺术特色","body":"晚唐咏史诗第一次集中地、成功地展示了咏史，怀古诗的悲剧美形态。咏史诗自身的特点与晚唐文学悲凉感伤的时代氛围交织一起，形成了不同于前代的鲜明审美特征。\n\n一、题材上关注末路英雄和前代覆亡\n\n晚唐咏史诗注意最多的已不是魏晋以来前辈诗人屡屡赞美的理想人物，而将注意力更多地转向虽不乏英雄业绩但以失败告终的末路英雄；高才远志却终身偃蹇的憔悴文士；以色事人、结局凄惨的薄命女子。他们很少赞颂开国君主的赫赫功业、清平治世的炎炎盛况，优虑的目光更多投射到灯焰昏昏的衰世，于前代的覆亡中搜寻无情的历史教训。在对题材的处理和史实的评论上，晚唐诗人总是特别清醒地在历史中寻找失误，寻找教训。即使是早被历史确认的胜利者，晚唐诗人也向他们投以悲悯的目光。\n\n二、主观色彩浓厚，抒情特点鲜明\n\n晚唐诗人写作咏史诗的意图不在准确叙述历史，而在于抒发自己观照历史时的情感意绪，甚至是为了负载主观的悲剧性情绪。因此，浓厚的主观色彩涵盖于历史题材之上，成为晚唐咏史诗的重要审美特征。晚唐咏史诗的抒情特点鲜明，诗人不是作为历史故事的叙述者，而是以抒情主人公面目出现于诗中。他们最急于表现的不是历史，而是自我，是身处悲剧性时代的“我”充溢于胸中的悲情绪。他们比前辈诗人更不拘泥于史实，而着重抒发历史引发的个人情感，或者干脆为抒情的目的而寻找相应的历史对象作为载体。\n\n三、沉重的感伤与冷峻的理性\n\n晚唐咏史诗中，主观色彩由沉重的感伤与冷峻的理性复合构成。在感伤情绪层下流动着诗人对史实的思索，思索给感伤以力度，赋予它深沉的特色。\n\n浓郁沉重的感伤是晚唐咏史诗的情绪基调，这一情调生长于诗人苦痛的深心，没有晚唐的时代和心理基础，不经血泪的滋养就不会有这样的入骨沉哀，晚唐诗人带着幽深的悲剧感沉吟于历史中，苦思冥索历史前进时显示的哲理，探寻解答现实困惑的一线光明，这种思索的痕迹或显或隐地呈现于诗中。\n\n四、“弥散式”的情绪渗透，衰飒凋残的意象\n\n与感伤基调及沉思的特征相应，晚唐咏史诗无爆发式情感表现，多为“弥散式”的情绪渗透：诗人的感伤弥漫于历史画面或现实物象，呈现出虽不激扬壮烈但深婉朦胧的悲剧美。诗人并不纵情直抒胸臆，而宁愿将情感弥散于历史或自然的意象来显现内心，为适应此特征，晚唐诗人往往选取衰飒凋残的意象寄托历史感伤，在晚唐咏史诗中，夕阳衰草、残柳落花、荒阡野烟、寒山危堞、断戟残碑等衰飒意象比比皆是，它们渗透着诗人的情绪，构成晚唐咏史诗特有的凄凉冷寂的悲剧气氛。【李凡关键询：末路英雄 前代覆亡 主观色彩浓厚 抒情特点鲜明 沉重感伤 冷峻理性“弥散式”情绪渗透 衰飒凋残意象】【李凡说：晚唐的衰落和盛唐的繁荣形成了鲜明对比，这一时期的咏史诗也由于社会现实的变化而表现出了独特的风格，在表现内容、整体情调方面都显得十分暗沉，一种盛世不再的苍凉之感不由自主地逸散开来，具有一种独特的悲剧之美。相关论文可以参考王红《试论晚唐咏史诗的悲剧审美特征》，具体资料可以在李凡文学正版群内领取。】","keywords":"","note":""},{"id":"210","stars":"★★★★","title":"试论述杜牧诗歌创作的艺术成就","body":"杜牧积极进取的精神和豪迈不羁的气概使他选择了一条与追求形式技巧的晚唐诗人所不同的创作道路，在遵守以内容和气势为主、艺术形式为辅的传统表现方法的基础上融合今古之长，创造自己的风格。杜牧的诗歌创作，主要具备如下特征：\n\n一、诗歌内容丰富多样，展现了复杂的社会现实和诗人多彩的生活\n\n作为出身世家又怀有雄心壮志的士大夫文人，关心政治、关注国计民生的淑世精神在杜牧的诗歌里有着多方面的表现。写景、咏物、纪行，是杜牧诗歌的又一表现内容。杜牧感情丰富，细腻多情，对自然和人事有着敏锐的感受。杜牧成就最高的是他的咏史怀古诗。杜牧的三十多首咏史怀古诗大体可以分为两类，第一类借助典型画面和细节传达历史感怀，另一类咏史怀古诗则好直接发表议论，表达自己对历史的见解。在咏史怀古中阐发议论，表达自己对历史事件的反思和见解，这是杜牧咏史怀古诗的独到之处。\n\n二、豪爽健朗的形象美\n\n杜牧一生的宿愿是削平藩镇，平定边防，因而他笔下的武将，都是英姿勃发、十分美好的英雄形象。作为唐代杰出诗人的杜牧，因为具有追求理想实现的积极进取精神，对生活总是寄托着热切的希望，虽数经坎坷，乐观的情绪和前进的信心终没有完全磨灭，所以他长于发掘事物积极美好的一面，表现出明爽健朗的格调，以唤起人们对美好未来的追求和向往。\n\n三、强烈、坦荡的诗情美\n\n杜牧的诗，多出于他的肺腑。读之可以感受到他跳动着的心，饱含着的情，强烈、坦露，真而切，诚而深。他不像李商隐那样曲回萦隐，而是坦荡显露，似海潮拍岸一样撞击着人的心扉。杜牧善于把炽热的感情寓于诗的形象之中，使之真切感人。诗情强烈坦荡，这是杜牧诗的显著特色。但坦荡并不是平直，他十分注意诗意的深邈章法的曲折变化。和李商隐等所不同的，杜牧多是以爽朗明快的语言，来表现蕴藉深隐的情思。\n\n四、清新明洁的意境美\n\n杜牧善于选取清新明朗、能给人以快感的景物来抒写他的情怀，创造出情景交融、诗情画意的优美意境。在杜牧笔下，就是萧瑟之秋，其景色也是十分明洁清爽的。杜牧有着宏阔的胸怀，高尚的人格，我们从他诗作情景相生、诗情画意的优美意境中，总是强烈地感受到他的思想、性格和情操。物和我、情和景，意和象的完美融合，实际上就是杜牧所追求的“高绝”的艺术境界。他善于以清倩明丽的语言，描状出优美的形象和意境。","keywords":"内容丰富多样 豪爽健朗 强烈、坦荡 清新明洁","note":"杜牧和李商隐并称“小李杜”，相较于李白、杜甫，小李杜的文风是截然不同的，晚唐诗多柔靡，牧之以峻峭矫之。不仅如此，杜牧在书法上也有很高的造诣，杜牧的草书气势雄健，和他文章中表达的情感一样。杜牧虽然受晚唐风气影响，但是并没有失去本心，他出淤泥而不染，将繁华的辞藻和个人特色结合，创作出一篇篇优秀的作品。"},{"id":"211","stars":"★★★","title":"以贾岛、姚合为代表的苦吟诗人有何创作特征","body":"贾、姚一派诗人的心态，与封建王朝末世一些政治上无出路的士人比较吻合。这些士人将生活情趣转移到吟咏日常感受以及与亲友唱和上，因而贾岛、姚合等人便很容易成为追摹的对象。总体来看，贾姚一派诗人的创作特征表现为以下方面：\n\n一、诗歌内容狭窄，很少反映社会问题\n\n贾岛、姚合及其追随者，诗歌内容都比较狭窄，很少反映社会问题。贾岛所写，有科考碰壁的失意和怨愤，有对贫穷窘困生活的哀叹，有对于清寂之境和佛禅境界的感受，以及与僧人、隐士的交往，大多不出个人生活范围。姚合诗的题材与贾岛接近，而对琐细的日常生活情景写得更多。在风格上，贾岛因有过禅房生活体验，又曾受韩愈、孟郊的影响，诗中冷僻的成分多一些，而姚合仕途较为顺利，诗风相对显得清稳闲适。\n\n二、创作态度上追求苦吟\n\n贾岛、姚合等人在创作态度上的共同表现是苦吟。晚唐时期，有大批长期困于考场的士子，也有许多人虽然入仕，却处于低下闲冷的地位。他们有点像大历时代的文人，需要通过作诗获取精神上的补偿。求科名者则更需要把五律当日常功课训练。这样，这些在社会上被冷落的文人，就把大量的时间和精力投放在作诗上，对自己的贫穷和闲散，多方面地加以审视、发掘、体验，抒写他们的无奈。于是，通过对情与景深刻的挖掘与琢磨，做到工整中见清新奇僻，就成了一种新的风尚，有别于韩、孟的奇险和元、白的流易。\n\n三、诗思往往是着意为之\n\n晚唐苦吟诗人对社会生活关心不够，阅历范围狭窄，诗的事料相对贫乏。他们的诗思往往不是自然涌现，而是一开始就着意为之。他们撇开以情感充沛、气势贯注为特点的歌行之类体裁，把力量倾注在近体上。近体可以在音律、对偶、字句上见功夫，可以澄心静气地推敲锤炼。由于苦吟，晚唐人确实创造了不少佳句。这些诗句，虽然着意写成，却颇为工整、精警。不用典故，不镶嵌奇字，以看似平常的语言，取得了很好的艺术效果。\n\n四、诗境狭窄，有句无篇\n\n贾、姚一派生活阅历有限，诗料不离琴、棋、僧、鹤、茶、酒、竹、石等物。内容不足而一味苦吟，不免琢伤元气，减损诗美，露出小家习气。他们的诗之所以受缚于格律，局促不伸，关键还是由于缺乏博大深广的情怀。晚唐诗人常常刻苦造就一些工整的句子，但由于才力不足，通篇看去，仍显馁弱。先有句，后有篇，难免前后不够匀称，缺少完整的意境。","keywords":"诗境狭窄 苦吟 诗思着意为之 有句无篇","note":"苦吟派士人的创作态度与他们切身的生活经历相关，进而表现出来的便是诗境狭窄，虽然看上去句子工整，但往往丢失了意境和内涵。苦吟派相关内容可能在名词解释中出现，大家要注意一下。"},{"id":"212","stars":"★★","title":"以皮日休、陆龟蒙为代表的诗歌有何艺术特色","body":"皮日休、陆龟蒙二人并称“皮陆”，他们的诗歌除了直陈时弊外，还吟咏隐逸。总体来看，他们的诗歌创作主要具备如下特征：\n\n一、突出表现避世心态与淡泊情思\n\n自咸通后期开始，唐王朝进入动乱阶段。文人在仕途上不仅较之前更难有所作为，且常有性命之虞。环境险恶，一些人把功名看得淡了，平安闲放，终老烟霞，成为他们生活上的追求目标。精神上则尽量做到不受外界干扰，一切淡然处之，努力保持内心的闲适恬静。陆龟蒙、皮日休等人的诗歌，突出地表现了这种避世心态与淡泊情思。\n\n二、抒写的是中唐以后文人那种较为近俗的闲情逸兴，带有潇洒游戏的成分\n\n皮日休咸通十年入苏州幕府，结识隐居其地的陆龟蒙，诗歌创作就此起了变化。两人诗酒唱和，题咏风物，写了六百多首诗，编为《松陵唱和集》。在唐末诗坛，别成江湖隐逸一派。皮、陆二人抒写的是中唐以后文人那种较为近俗的闲情逸兴，带有潇洒游戏的成分。与前代诗人相比，缺少陶渊明那种对社会人生的严肃思考，也缺少王维的禅悟和对自然美的深刻感受。与晚唐诗人相比，皮、陆和贾岛、姚合的追随者相对接近一些。但前者诗中体现的是“物外一以散”的情怀，诗境闲适；后者带着穷愁失意的情绪，多写荒僻幽冷之境，实有区别。至于艺术，姚、贾一流努力把五律做得工整规范，皮、陆则炫耀其翻新的本领，更是大异其趣。\n\n三、唱和诗关注个人日常生活，以身边器具等为诗料\n\n皮陆唱和，在淡于世事的同时，特别关注个人生活，多摄取日常和身边的器具、景物、人事为诗料。《渔具诗》《樵人十咏》《酒中十咏》《添酒中六咏》《茶具十咏》等等，连篇累牍地唱和，无非是酒、茶、渔钓、赏花、玩石等琐物、碎事和各种闲趣，两人又逞强争胜，夸巧斗靡，一题之下，成诗数十首，都是类似的情味，不免既繁杂而又单调，甚至给人空虚无聊之感。倒是一些似乎不大经意的小诗，写得较有情味。如《春夕酒醒》的唱和诗，皮日休原唱写酒醉醒来后见到烧残的红烛，犹如一枝珊瑚，从气氛到境象都很不错。而陆龟蒙的和诗又别开生面，不写红烛等物，不为原唱所拘，径自用闲放自\n\n然的笔调，写诗人放达潇洒的情怀和风度。“无事傍江湖”的处境中，推出一副“满身花影倩人扶”的悠然醉态，把诗人那种带世俗色彩的“江湖散人”形象表现得很逼真，既有韵致，又具皮、陆一派写日常闲适生活的特有情调。","keywords":"避世心态 淡泊情思 闲情逸兴 关注个人生活","note":"皮日休、陆龟蒙的诗歌特色便是追求避世隐逸，关注日常生活，描写的是一种文人隐士的闲情逸致，这和当时的社会现实有很大的关系，大家要注意。通常情况下，“皮陆”多以名词解释的形式出现，大家要注意一下，但也有出简答题的可能性，大家注意积累。"},{"id":"213","stars":"★★★★★","title":"试分析李商隐诗歌的创作特征","body":"李商隐诗内容丰富，艺术精湛，在当时及后世都具有很大影响。总体来看，李商隐的诗歌创作具有如下特征：\n\n一、情调幽美，诗境朦胧\n\n李商隐致力于情思意绪的体验、把握与再现，用以状其情绪的多是一些精美之物。表达上又采取幽微隐约、迂回曲折的方式，不仅无题诗的情感是多层次的，就连其他一些诗，也常常一重情思套着一重情思，表现得幽深窈渺。\n\n同时，为了表现复杂矛盾甚至怅惘莫名的情绪，李商隐善于把心灵中的朦胧图像化为恍惚迷离的诗的意象。这些意象分明有某种象征意义，而究竟要象征什么，又难以猜测，由它们结构成诗，略去其中的逻辑关系的明确表述，遂形成如雾里看花的朦胧诗境，辞意缥缈难寻。\n\n二、凄艳浑融\n\n李商隐诗歌风格凄艳。艳，有来自六朝的文学渊源，但李商隐诗艳而不靡。在他那里，艳与爱情生活的不幸，身世遭遇的坎坷，乃至与对唐王朝命运的忧思相联系，表现出“哀感顽艳”的特色。\n\n李商隐诗不仅把凄与艳融合在一起，而且由凄艳通于浑融。李诗不重意象的外部联系，同时又多用美丽的词藻与事典，同时“沉博绝丽，艳而能浑”，在艺术上表现出博大的气象和完整性。\n\n三、构思缜密\n\n李商隐诗善用象征、比兴、拟人、托物等修辞手法，表现绵邈深曲的寓意和复杂曲折的盛情，构成扑朔迷离的意境，给人“味无穷而炙愈出，钻弥坚而酌不竭”的审美享受。他的许多咏史诗，能得风人之致，深含美刺之旨，常常有案无断，含而不露，使人回味无穷。\n\n四、用典使事，精工灵活\n\n李商隐是唐代诗人中用典最多的作家。举凡史事、神话、传说，李商隐都能得心应手地驱役于诗中，或活用，或反用，或对用，表达隐曲之意，难言之情。这同样与他擅骈体、处危微、尚幽美等诸多主客观因素有关，也是构成李诗包蕴密致、沉博绵邈特色的重要原因之一。\n\n五、注重词语锤炼、句式运用\n\n李商隐的少数诗写景抒情纯用白描，绝去雕饰，更多的诗语言华艳而精炼，注意词语的锤炼。他善用叠字以增强诗歌的章乐性、节奏感，还注重句式的错综和虚词的运用。有时用顶针格，有时使句内二五字相粘，遣词错综重叠，使其诗如溅荷之珠，摇曳生姿，流走贯通。李商隐诗在组合典故时，往往得心应手地运用关联词，表达假设、反诘、递进、条件等各种复杂的关系，使他的诗无难言之情，有必达之意，而且文气既曲折顿挫，又连贯流畅。\n\n六、众体皆有佳作\n\n李商隐的乐府学长吉体，而无李贺诗的凄幽险峭。他的五七言古诗古朴苍劲，追踪杜甫、韩愈。李商隐七律，成就尤高，师承杜甫，独步当时。他的七律沉郁精炼，酷似杜甫，虽气势的海涵汪洋，笔力的雄健苍劲有所不及，而深曲婉丽则过之。李商隐七绝，寄托遥深，措辞委婉，议论警策，神韵隽永，堪称晚唐绝唱。","keywords":"情调幽美 诗境朦胧 凄艳浑融 构思缜密 用典使事 精工灵活 注重词语锤炼、句式运用 众体皆有佳作","note":"李商隐可以说是李杜之后唐代又一位集大成的诗人，在考查中出现的频率相对而言较高一些，所以我们需要重点关注一下。从考查方向来看，对于李商隐诗歌的考查比较集中于其无题诗，但也会涉及李商隐整体的诗歌创作特征，我们对此也要有所准备。"},{"id":"214","stars":"★★★★","title":"试论李商隐无题诗的艺术特征（25山东大学、26中央财经大学）","body":"最能体现李商隐高超的诗歌艺术、代表他诗歌风格的是无题诗。他的无题诗，或径以“无题”标目，或取诗的首句的前两个字为题，等同于无题。李商隐大约有六十首无题诗。这类诗篇大多题旨隐曲，颇费索解，却缠绵精致，具有高妙的艺术美感。总体来看，李商隐的无题诗具有如下特征：\n\n一、内涵上具有多义性\n\n李商隐“无题”一类境界朦胧的诗歌，在内涵上往往具有多义性。而且这种多义性难解、不可确解。李商隐的多义，往往是给读者提供多种解读的可能，构成解读上的复义。多重意旨之间可以是比较接近的，也可能是差距很远的歧解。\n\n多义性的成因来自多方面。从文字表述，亦即语言符号层面看，李商隐诗的意象、典故，以及词语意象之间的联系组合方式，都有可能导致朦胧。李诗多义性更为深层也是更为根本的原因，是由于把心灵世界作为表现对象，李商隐许多诗歌所写的不止一时一事，乃是整个心境。种种情绪，互相牵连渗透，难辨难分。其心理状态，被以繁复的意象表现出来的时候，便无法明确地用某时、某地、某事诠释清楚。\n\n二、情调幽美，诗境朦胧\n\n李商隐的无题诗情调幽美。他致力于情思意绪的体验、把握与再现，用以状其情绪的多是一些精美之物。表达上又采取幽微隐约、迂回曲折的方式，常常一重情思套着一重情思，表现得幽深窈渺。\n\n为了表现复杂矛盾甚至怅惘莫名的情绪，李商隐善于把心灵中的朦胧图像化为恍惚迷离的诗的意象。这些意象分明有某种象征意义，而究竟要象征什么，又难以猜测，由它们结构成诗，略去其中的逻辑关系的明确表述，遂形成如雾里看花的朦胧诗境，辞意缥缈难寻。李商隐诗的朦胧，并不导致接受上的隔膜。虽朦胧而情思意象仍能让人觉得亲切可感。\n\n三、迂回曲折地抒述情感，委婉细腻地刻画心理\n\n李商隐的无题诗较少采用直抒胸臆的抒情方式，而特别致力于婉曲见意。迂回曲折地抒述情感，委婉细腻地刻画心理，是李商隐无题诗抒情艺术的重要表现。李商隐的无题诗，构思上采用的是一种“剥茧抽丝”的方式，从一个意象生发出另一个意象，环环相扣，绵绵不绝，委婉曲折地把真挚的情感淋漓尽致地表达出来。曲折达意的抒述方式，同诗人缠绵悱恻的情思结合起来，便形成无题诗独特的艺术风格。\n\n【李凡关键词：多义性 情调幽美 诗境朦胧 迂回曲折 委婉细腻】","keywords":"","note":"这里大家需要注意的是李商隐“无题诗”的界定问题，以马工程版教材来看，“无题诗”指的是李商隐以“无题”为题目和题目为首句前两字的作品，袁行需版教材将无题诗归入李商隐的抒情诗之中。关于具体界定，学术界一直有争议，大家要注意这一点。但无论怎样界定，李商隐的无题诗总体来说还是表现出了本题所论述的这些特征。"},{"id":"215","stars":"★★★★","title":"李商隐诗歌多义性的成因","body":"李商隐诗歌的多义难解，不可确解。往往是给读者提供多种解读的可能，构成解读上的复义。多重意旨之间可以是比较接近的，也可能是差距很远的歧解。李商隐诗歌多义性的成因主要有以下两个方面：\n\n一、从文字表述，亦即语言符号层面看，李商隐诗的意象、典故，以及词语意象之间的联系组合方式，都有可能导致朦胧。\n\n（一）意象独特\n\n李商隐诗的多义性与其意象的独特有一定联系。一般诗人所用意象，客观性较强，能以通常的方式去感知。李诗的意象，多富非现实的色彩，诸如珠泪、玉烟、蓬山、青鸟、彩凤、灵犀等等，均难以指实。这类意象，是被李商隐心灵化了，是多种体验的复合。它们的产生，主要不是取自外部世界，而是源于内心，内涵就远较一般意象更加复杂多变。\n\n（二）大量用典，并对典故进行增殖改造\n\n典故由于内涵的浓缩性等原因，如果用得好，能在有限的字句中，包含丰富的、多层次的内容。李商隐擅长对典故的内涵加以增殖改造，用典的方式别开生面。他往往不用原典的事理，而着眼于原典所传达或所喻示的情思韵味。李商隐一生坎坷，对事物的矛盾和复杂性有充分的感受。结合其人生体验和认识，李商隐常常把典事生发演化成与原故事相悖的势态，由正到反，正反对照，把人思想活动的角度和空间大大扩展了。\n\n（三）词语意象组合\n\n李诗的多义性与诗中独特的意象组合也很有关系。其意象往往错综跳跃，不受现实生活中时空与因果顺序的限制。这种意象转换跳跃所造成的省略和间隔，便有待读者通过艺术联想加以连贯和补充。\n\n二、把心灵世界作为表现对象\n\n李商隐诗歌多义性更为根本的原因，在于把心灵世界作为表现对象。许多诗歌所写的不只一时一事，乃是整个心境，并且他的心境又非常复杂，就其所表现的多层次的朦胧境界与浓重的怅惘、迷茫、感伤的情思看，决不是一时一事就能使作者陷入那样一种心境之中。","keywords":"意象独特 大量用典 增殖改造 词语意象组合 心灵世界","note":"李商隐诗歌多义性的成因，既与其诗歌艺术有关，又与其诗歌表现内容有关，大家可以从这两个方面去切入分析。相关内容可以参考余恕诚《李商隐诗歌的多义性及其对心灵世界的表现-兼谈李诗研究的方法问题》，具体资料可以在李凡文学正版群内领取。
