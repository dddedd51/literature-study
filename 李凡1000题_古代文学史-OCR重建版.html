哲学还只是停留在社会学的层面，还未升腾到真正高度哲学意蕴的层面，一句话，王实甫的哲学意识较为匮乏，\n\n而汤显祖创作的《牡丹亭》则突出表现了艺术家主体哲学意识的自觉和强化。哲学意义上的“情”就是作为“理”的对立物而被汤氏所反复强调的。这是汤显祖创作《牡丹亭》的哲学基础。《牡丹亭》虽然写的仍然是青年男女的爱情，形式上不脱离封建社会一般才子佳人式的幽期密约，但其内蕴的深广度有了极大的拓展。它赋予人生以哲理意义，或者说，作者实际上是对爱情作了一次哲学概括。\n\n（三）对爱情萌芽因素的认识不同\n\n在《西厢记》中莺莺与张生之间的爱情是一个由情到欲的过程。崔莺莺与张生素昧平生，只是在大佛殿邂逅之后，互为对方的美艳容貌、英俊姿态所吸引，顿生“一见钟情”之感，这才有了之后的西厢幽会，以及之后发生的种种。\n\n与之相反，《牡丹亭》则是由欲到情。汤显祖把男女之间正常的情欲作为爱情的动力，杜丽娘并非先与柳梦梅有了花前月下的浪漫之情，才激发自己的欲望冲动，冲破“男女大防”的限制，而首先是因春心萌动，迫切感到青春寂寞难耐，因而自然涌发欲望冲动才在梦中与柳梦梅相会，恣一时之欢，孕育了一段生死不渝的爱情。\n\n综上所述，尽管《西厢记》和《牡丹亭》两部作品都歌颂了爱情的伟大，批判了封建婚姻制度，但在具体内容上，二者的爱情观念还是有着许多不同。","keywords":"相同点 张扬与封建传统相左的爱情观 不同点 针对的目标 哲学渗透的程度 对爱情萌芽因素的认识","note":"《西厢记》和《牡丹亭》都是爱情题材的名作，二者都歌颂了真挚的爱情，这一点是毫无疑问的，并且《牡丹亭》很明显也是受到了《西厢记》的影响。但在此基础上，我们也要明确，《西厢记》和《牡丹亭》毕竟出于二人之手，受到不同时期文学思潮的影响，二者的爱情观念必然会表现出不同。相较而言，《牡丹亭》明显更加进步一些。"},{"id":"381","stars":"★★★","title":"试分析“梦”在汤显祖《牡丹亭》中的作用","body":"梦作为一种特殊的艺术手段，在戏剧故事中起着特殊的作用，有着特殊的价值存在。就叙事文本来看，《牡丹亭》中梦境叙事的作用主要表现在以下几个方面：\n\n一、作为线索，贯穿故事\n\n在《牡丹亭》当中，虽然明确标明有梦的只有《惊梦》和《寻梦》两出，但几乎其中所有的梦意象都在整个作品结构当中担负着异乎寻常的重要作用。《牡丹亭》共五十五出，体制较为庞大，但内部结构却紧凑而有条不紊，因为“梦”始终贯穿全剧，支撑着故事情节的展开。比如全剧开场之初的“柳生梦梅”，不仅让我们知道了柳梦梅名字的由来，而且还为接下来的“游园惊梦”埋下伏笔。梦也是沟通起阴阳两界两条故事线索的枢纽，正是借助“寻梦而死”的帮助，《牡丹亭》才得以将阴间的故事与阳世的抗争统一起来。就此而言，这个梦意象无异于整个故事结构上的分界点和接合处。\n\n二、突出“至情”主题，彰显创作特色\n\n汤显祖主张“至情”，他一生的“白日梦”，便是想通过创造个崭新的世界来表达和寄托自己的愿望。当这种理想在现实中不能实现时，以梦为题材进行创作、塑造梦意象便是汤显祖愿望的最好寄托。\n\n因此，汤显祖在《牡丹亭》中塑造了“惊梦”“寻梦”等众多的梦意象，杜丽娘的感春生情、因情得梦、惊梦而死、死而复生以及和柳梦梅终成眷属，是作家的人文主义理想在无意识层次上的体现。汤显祖有感于在现实社会中许多人之为人的正常欲求无法得到实现，所以在作品中编织了一个梦的世界，让主人公杜丽娘在他建造的梦意象中实现了自己对情爱的渴望，一方面体现出作者的人文主义理想，另一方面也是对当时社会现实的一个有力的批判。\n\n三、推动性格发展，塑造人物形象\n\n汤显祖通过“梦”的意象，展示了杜丽娘的内心世界，抒发了她内心幽微细密的情感。杜丽娘的性格在五十五出戏中经历了多次变化，而且性格的形成和每一步的发展都是通过梦境叙事揭示和展现的。同时，在梦里的杜丽娘是洗尽铅华，天然去雕饰，是完全真实自我的再现。让读者为之心动的正是“梦”中之丽娘，而非循规蹈矩、遵从三从四德之丽娘。","keywords":"线索 贯穿故事 突出“至情”主题 彰显创作特色 推动性格发展 塑造人物形象","note":"梦境叙事串联起了《牡丹亭》这部剧，让杜丽娘的形象变得丰满了起来，也让作者得以抒发自己的至情理想。大家在分析《牡丹亭》中的梦意象时，也可以联系精神分析学说的相关内容进行理解。汤显祖和莎士比亚这两位剧作家因大致处于同一时代而被放在一起对比，《牡丹亭》和《仲夏夜之梦》也都涉及梦意象，这里大家也可以留意一下。相关内容可以参考单有方《＜牡丹亭）中的“梦”意象》、姚华《＜牡丹亭＞中梦意象的美学分析》，具体资料可以在李凡文学正版群内领取。"},{"id":"382","stars":"★★★","title":"谈谈你对汤显祖“临川四梦”的认识","body":"“临川四梦”又称“玉茗堂四梦”，是明代剧作家汤显祖《紫钗记》《牡丹亭》《南柯记》《邯郸记》四部剧作的合称，集中代表了汤显祖的剧作成就。\n\n一、“临川四梦”的主要内容\n\n《紫钗记》是作者对个人旧作《紫箫记》的加工、改写，表现霍小玉在爱情上的坚贞；《牡丹亭》通过杜丽娘和柳梦梅生死离合的爱情故事，热情歌颂了反对封建礼教、追求自由幸福的爱情和强烈要求个性解放的精神；《南柯记》《邯郸记》是汤显祖的晚年作品，分别取材于唐人小说《南柯太守传》和《枕中记》，写人生无常、宦海风波。\n\n二、“临川四梦”的分类\n\n整体来看，“临川四梦”可以分为两类，《紫钗记》和《牡丹亭》属于儿女风情戏，《南柯记》和《邯郸记》属于官场现形戏或日政治问题戏。这两种戏剧类型的区别，主要表现在以下方面：\n\n（一）题材内容不同\n\n儿女风情戏主要以单向型或双向型的爱情中人为描摹对象，例如霍小玉对李益是十分强烈的单向恋爱，杜丽娘与柳梦梅则是奇幻而又统一的双向恋爱。在风情戏中，女性是占主体地位的，男子则相对处于从属的地位。在政治戏中，男子则是占主要的位置。\n\n（二）审美倾向不同\n\n风情戏的主要基点是对人物发自内心地肯定，充满热情地赞颂。杜丽娘与柳梦梅的生死恋，有若金童玉女的般配，堪称青春的偶像、挚爱的化身。而政治戏的基点在于对主要人物及其所处环境的整体否定，《邯郸记》中自上而下，权贵者无一不贪婪，发迹者无一不腐败，所以政治戏始终以揭露和批判作为审丑手段。风情戏中的儿女情往往是真善美的体现，政治戏中的官僚行径则无一不是假恶丑的典型。前者寄寓着作者对人生的肯定与期望，后者则表现了对生存环境无可救药的痛心疾首。\n\n（三）哲学主张和理想皈依不同\n\n汤显祖的风情戏时刻高举真情、至情的旗帜，而政治戏则反映出矫情、无情的可憎可恶。风情戏不仅在主要人物身上体现出充沛的理想，而且这种理想和最后权威的裁决是一致的。霍、李的团圆最后还是借助圣旨的权威才得以成就，杜丽娘亦是让皇上充当了证婚人的角色。这说明汤显祖对最高统治者还抱有一定幻想。政治戏中的官僚社会整体腐败不洁，汤显祖便在很大程度上把仙佛两家的出世理想与终极权威联系了起来。\n\n（四）曲词风格不同\n\n汤显祖的风情戏妙在艳丽多姿，政治戏则显得尖锐深刻。如《牡丹亭》文辞优美典雅，神韵俱足，“袅晴丝吹来闲庭院，摇漾春如线”这样的曲辞随处可见，摇曳多姿；而《邯郸记》中则多是“人生眷属，亦犹是耳，岂有真实相乎？其间宠辱之数，得丧之理，生死之情，尽知之矣”这种直面现实的词句。\n\n三、“临川四梦”中的现实情怀\n\n在“临川四梦”之中，我们可以看到汤显祖的现实情怀：\n\n（一）探讨为官之道\n\n汤显祖在剧作中探讨了为官之道，将自己的从政理念写进剧作，于是有了《南柯记》第二十四出《风谣》所描写的政治蓝图和《牡丹亭》第八出《劝农》所塑造的官吏典范。\n\n（二）批判朝政\n\n汤显祖在剧作中对朝政进行了严厉的批判。举凡科场腐败、吏治腐败、君臣荒淫、宦官敛财、权臣威福、朋党倾轧诸世相，均在作者抨击之列。《邯郸记》中《赠试》《夺元》《骄宴》中的三首下场诗对科举舞弊和权臣结党的讽刺极为辛辣，激愤之情溢于言表。\n\n（三）展现了“人生自是有情痴”的情怀\n\n汤显祖在剧作中展现了“人生自是有情痴”的情怀。《紫钗记》《牡丹亭》自不必说，《南柯记》和《邯郸记》的梦中世界也是个痴情的世界。如《南柯记》中的大槐安国就是一个痴情之国，蚁王、蚁后爱女情深，公主对夫君痴情无限，时时替夫君着想。正因为感于蚁国情深，淳于棼才燃指超度槐安国君民往生天国。","keywords":"主要内容 分类 儿女风情戏 政治问题戏 题材内容 审美倾向 哲学主张 理想皈依 曲词风格 现实情怀为官之道 批判朝政 人生自是有情痴","note":"汤显祖的“临川四梦”可以说是名词解释中出现频率非常高的一个概念，相关内容需要重点掌握，大家要注意一下。这四部剧作虽出于一人之手，但题材各异，创作时间也不同，因而在具体特征上也有不同，总体可以分为两类。不过一以贯之的，是汤显祖的现实情怀。"},{"id":"383","stars":"★★","title":"请简述《西游记》的成书过程","body":"《西游记》的成书与《三国志演义》《水浒传》相类似，都经历了一个长期积累与演化的过程，但两者演化的特征并不一致。总体来看，《西游记》成书主要经历了以下过程：\n\n一、唐代：历史故事向俗讲、民间故事的演变\n\n唐太宗贞观初年，僧人玄奘只身赴天竺（今印度）取经。历时十七载，跋涉数万里，历尽艰险，取回佛经六百五十七部，震惊朝野中外。归国后，玄奘奉诏口述所见所闻，由门徒辑录成《大唐西域记》一书。后由其弟子写的《大唐大慈恩寺三藏法师传》，在赞颂师父、弘扬佛法的过程中，也不时地用夸张神化的笔调去穿插一些离奇的故事，为后世想象取经途中光怪陆离的神传说开了先路。于是，取经的故事在社会上越传越神，唐代末年的一些笔记如《大唐新语》等，就记录了玄奘取经的神奇故事。\n\n二、两宋：历史故事文学化、神话化，取经队伍中加入猴行者并成为主角\n\n成书于北宋年间的《大唐三藏取经诗话》，大致勾画了《西游记》的基本框架，并开始将取经的历史故事文学化。尤其值得注意的是，书中出现了猴行者的形象，这是《西游记》中孙悟空的雏形。\n\n最早把西游故事神话化，并见诸文字的是南宋的《大唐三藏法师取经诗话》。取经队伍中加入了猴行者在《诗话》流传后逐步被社会认可，这在《西游记》故事的神化过程中关系重大。\n\n三、元代：四人取经故事渐趋定型，相关戏曲创作产生\n\n唐僧、孙悟空、猪八戒、沙僧师徒四人取经故事在元代渐趋定型。元时磁州窑的唐僧取经枕上已有唐僧、孙悟空、猪八戒和沙僧师徒四人的取经形象。猪八戒首次在文学作品中出现，是在元末明初人杨景贤所作的杂剧《西游记》中。在此剧中，深沙神也改称了沙和尚。至迟在元末明初，有一部故事比较完整的《西游记》问世。这部《西游记》的故事已相当复杂，主要人物、情节和结构已大体定型，特别是有关孙悟空的描写已与百回本《西游记》基本一致，这为西游故事后来发展为一部长篇通俗小说打下了坚实的基础。取经故事在话本中逐步定型的同时，类似的戏曲创作也产生了。\n\n在上述基础上，吴承恩运用他卓越的幽默讽刺才能，冲淡了取经故事的宗教色彩，加强了现实的内容，将孙悟空取代唐僧作为中心人物来加以塑造歌颂，并大大丰富了神魔形象和故事情节，创作出《西游记》这样一部前无古人的神魔小说。","keywords":"唐代 历史故事 俗讲、民间故事 两宋 文学化 神话化 加入猴行者 元代 四人取经故事渐趋定型 相关戏曲创作产生","note":"《西游记》的成书过程和《三国志演义》和《水浒传》相似，都进行了漫长的演化过程。但不同的是，《西游记》是在玄奘取经故事的基础上，增添了大量虚幻的内容，以“幻”的形态定型。可以看到，西游故事成型的两个关键时间节点，一个是两宋时期猴行者加入取经队伍并成为主角，一个是元代四人取经故事渐趋成形，与之相关的具有标志性的作品我们要注意一下。"},{"id":"384","stars":"★★★★","title":"试分析《西游记》的思想内容","body":"一、宣扬“三教合一”化了的心学，维护当时的社会秩序\n\n《西游记》最主要和最有特征性的精神是于“游戏之中暗传密谛”，在神幻、诙谐之中蕴涵着“三教合一”的哲理。这个哲理的主体是被明代个性思潮冲击、改造过了的心学。作家主观上想通过塑造孙悟空的艺术形象来宣扬儒家的“存心养性”、道家的“修心炼性”和释家的“明心见性”，宣扬“三教合一”化了的心学，维护当时的社会秩序。\n\n心学的基本思想是“求放心”“致良知”，即是使受外物迷惑而放纵不羁的心，回归到良知的自觉境界。小说特别选用了“心猿”这一典型的比喻躁动心灵的宗教用语来作为孙悟空的别称，一些回目和诗赞也非常直接和明白地表现了这一寓意。再从全书内容的构架来看，大致由三个部分组成：一，孙悟空大闹天宫；二，被压于五行山下；三，西行取经成正果。这实际上隐喻了放心、定心、修心的全过程，这种喻意在小说中多有提示。为了表现“心猿归正”的总体设计，作品还让孙悟空不时地向唐僧直接宣传“明心见性”的主张。\n\n二、张扬了人的自我价值和对于人性美的追求\n\n《西游记》的作者在改造和加工传统的大闹天宫和取经的故事时，纳入了时尚的心学的框架，但心学本身在发展中又有张扬个性和道德完善的不同倾向，这又和西游故事在长期流传过程中积淀的广大人民群众的意志相结合，就使《西游记》在具体的描绘中，实际上所表现的精神明显地突破、超越了这一预设的理性框架，并向着肯定自我价值和追求人性完美倾斜。\n\n具体而言，假如说前七回主观上想谴责“放心”之害，而在客观上倒是赞颂了自由和个性的话，那么以第七回“定心”为转机，以后取经“修心”的过程，就是反复说明了师徒四人在不断扫除外部邪恶的同时完成了人性的升华，孙悟空最终成了一个有个性、有理想、有魄力的人性美的象征。\n\n三、表达对时政的批判\n\n《西游记》也是一部可以从政治角度加以阐释的小说，小说中的许多描写，很容易让人联想到现实政治的种种情形。如祭赛国、朱紫国、灭法国等九个人间国度，所用多为明代官职，国王又多为宠信道士的昏君，很容易让读者联想到崇信道教的嘉靖皇帝。由此看来，《西游记》的不少故事是虚构的、荒诞的，但作者的构思却是抽象于现实的；形式是幻想的，而内涵却是真实的，作者的主观创作意图并非是直接面向社会，抒写现实人生，但客观意义却是在“游戏中暗传密谛”。在作者的戏谑、幽默、嘲讽，甚至插科打诨中，对明代的时弊世俗随笔点染，旁敲侧击，指桑骂槐，无不切中时弊。这便是神魔小说《西游记》的现实意义不同于一般小说的艺术个性之所在。","keywords":"宣扬“三教合一”化了的心学 维护当时的社会秩序 张扬了人的自我价值 对于人性美的追求 表达对时政的批判","note":"《西游记》的思想内容表达得较为晦涩，整体理解起来较为困难，需要大家深入分析。总体来看，作者创作这部小说的出发点是宣扬心学，维护社会秩序。但心学中的内容又与当时的社会思潮暗合，因而在客观上顺应了人们的愿望，张扬了人的自我价值，表现了对人性美的追求。同时，这部小说在创作时又受到了当时社会现实的影响，字里行间也流露出对当时社会的批判。"},{"id":"385","stars":"★★★★","title":"试分析《西游记》中孙悟空的形象特征","body":"孙悟空是《西游记》中最光辉的形象，是最主要的英雄，这一形象，主要具有以下特征：\n\n一、强烈的个性精神\n\n孙悟空出世不久，在花果山就不想“受老天之气”，他要“独自为王”“享乐天真”，因而访师学道，学得本领，大闹地府，又两次大闹天宫。孙悟空在取经过程中，仍然保持着鲜明的桀骜不驯的个性特点，他不愿处于“为奴”的地位，从不轻易地对人下拜，一般的神灵更是不放在眼里。作为一个皈依教门的和尚，却还把闯地府、闹天宫当作光荣的历史屡加夸耀。这都表现了取经路上的孙悟空还是那样的反对束缚、尊重自我和向往自由，具有一种强烈的个性精神。\n\n二、为理想献身的精神\n\n孙悟空肩负着协助唐僧去西天取得真经的崇高使命。取经，本是一种事业，但实际上已成了他坚韧不拔地追求的一种理想的象征。为了实现这一理想，他翻山越岭，擒魔捉怪，吃尽干辛万苦，排除重重困难，从不考虑个人私利，一心以事业为重，即使在被人误解，遭到不公正的待遇甚至被唐僧念着紧箍咒、赶回花果山时，还是“身回水帘洞，心逐取经僧”。这种为理想而献身的精神，也就成了取经路上孙悟空的一个明显的性格特征。\n\n三、大智大勇的英雄精神\n\n在孙悟空身上充盈着一股饱满的生命力，洋溢着旺盛的斗志，他机智勇敢，不屈不挠，所向无敌。无论是与天庭抗礼，还是与西天路上的各种妖魔搏斗，他都无所畏惧，百折不回。在他眼里，没有越不过的险阻，没有镇不住的妖魔，凭着他的顽强拼搏，无论遇到什么都能化险为夷，逢凶变吉。在战斗中，他又能随机应变，善于斗智，常常在真真假假、虚虚实实之中，弄得敌人晕头转向，防不胜防。孙悟空的这种大智大勇的英雄精神，与其为实现理想而奋斗到底的献身精神和强烈的个性精神相结合，呈现出了独特的光彩。\n\n四、强烈的生命意识\n\n与巨大的生命能量同在的，是孙悟空对生命的珍惜。早在花果山做逍遥自在的美猴王时，他就产生了对生命的忧虑，听通背猿猴说佛、仙、神圣可以修得与天地齐寿，他就断然放弃了美猴王的生活，远涉重洋访仙求道。学成之后又大闹地府，把猴属之类的生死簿全部勾销，超越了生死的限制。孙悟空的生命意识远比三国英雄与水浒英雄强烈，但这并不是贪生怕死，孙悟空在战斗中的英勇表现就可证明。","keywords":"个性精神 献身的精神 英雄精神 生命意识","note":"孙悟空是《西游记》中最具代表性的主角形象，他的强者为尊的思想有着强烈的时代特色，无论是对自我价值的实现，还是追求个性解放与自由，都反映了明代的社会思潮，虽然封建统治地位坚定如山，但个人的自觉意识还是有所觉醒。也正因为如此，这一形象在千百年来一直受到人们的喜爱。"},{"id":"386","stars":"★★★★","title":"一位学者说孙悟空形象“自在不成人，成人不自在”，请结合《西游记》情节与相关思想文化背景对这一说法进行分析（25北京师范大学）","body":"【答题框架】\n\n“自在不成人，成人不自在”一语，源自《西游记》对孙悟空成长历程的深刻隐喻。“自在”指个体追求绝对自由的原始状态，“成人”则指融入社会秩序、承担责任的必然归宿。这一命题揭示了中国传统文化中个体自由与社会规范的辩证关系，同时呼应了明代心学思潮下对“心性”的探索。\n\n一、孙悟空的“自在”阶段：原始自由与秩序反叛\n\n作为《西游记》中最主要的英雄，孙悟空生来就是自由的，他这个天产石猴，无父无母，孕于自然的怀抱，自幼与狼虎为伴，鹿为友，在花果山福地“称王称圣任纵横”，过着“不伏麒麟辖，不伏凤凰管，又不伏人间王位所拘束，自由自在”的生活。其后，他凭着自己的一身本领，闯东海龙宫，搅阴曹地府，大闹天宫，任性而行。他不愿意自己的个性受压抑，更不能忍受欺凌和屈辱。\n\n二、孙悟空的“成人”阶段：社会规训与心性修持\n\n过于追求“自在”，主体意识的无限弘扬势必会引起自私欲念的膨胀，以导致与社会秩序的冲突和道德规范的违悖。在《西游记》中，孙悟空“只为心高图罔极，不分上下乱规箴”，就是这种情形的写照。吴承恩在肯定孙悟空主体意识的同时，力图把主体意识纳于伦理的规范，使“马猿合作心和意，紧缚牢拴莫外寻”。因而，在处理孙悟空这一形象时，又对主体意识所引起的自私欲念作了一定程度的批判。所以，孙悟空被如来佛祖压在了五行山下，之后更是戴上了金箍，受到了一层层束缚，并通过西天取经的种种磨难，以达到主体意识和伦理意识、个体人格和伦理人格的统一，实现人格的不断完善，真正地“成人”。唐僧以紧箍咒约束孙悟空，其本质是儒家“克己复礼”的象征。取经途中的八十一难，实为孙悟空的修心历程。\n\n三、从“自在”到“成人”的文化内涵：宣扬“三教合一”化的心学\n\n儒、释、道三家都有自己的心性修养理论，儒家以成圣为极诣，佛家以成佛为极诣，道家以成仙为极诣，但相互之间确有共同之处，即都致力于对欲望的克服，所谓三教合一，即建立在这一共同点之上。心学的基本思想是“求放心”“致良知”，即是使受外物迷惑而放纵不羁的心，回归到良知的自觉境界。\n\n（一）小说特别选用了“心猿”这一典型的比喻躁动心灵的宗教用语来作为孙悟空的别称。一些回目和诗赞也非常直接和明白地表现了这一寓意，回目如“灵根育孕源流出，心性修持大道生”（第一回）就是用修心炼性的术语所构成的。在诗赞中，说美猴王道：“借卵化猴完大道，假他名姓配丹成，内观不识因无相，外合明知作有形。”（第一回）这也清楚地表明了作者是把孙悟空当作人心的幻相来刻画的。\n\n（二）从全书内容的构架来看，大致由三个部分组成：一，孙悟空大闹天宫；二，被压于五行山下；三，西行取经成正果。这实际上隐喻了放心、定心、修心的全过程。这种喻意在小说中多有提示，如在前七回，孙悟空上天入地大闹乾坤，即在回目上说他是“心何足”“意未宁”；第七回被如来佛压在五行山下，就叫作“定心猿”；以后去西天取经，常称是“心猿归正”“炼魔”“魔灭尽”与“道归根”等。\n\n（三）为了表现“心猿归正”的总体设计，作品还让孙悟空不时地向唐僧直接宣传“明心见性”的主张。例如，第二十\n\n四回唐僧问悟空何时可到西天雷音，悟空道：“只要你见性志诚，念念回首处，即是灵山。”\n\n孙悟空的成长轨迹，本质是自由与规训的动态博弈。“自在不成人”揭示了个体社会化必须付出的异化代价，“成人不自在”则凸显秩序对人性的压抑。这一悖论既折射明代三教合流的思想困局，亦暗含对封建伦理的深刻批判。","keywords":"原始状态 必然归宿“自在”原始自由与秩序反叛“成人”社会规训与心性修持“三教合一”化的心学“心猿”宗教用语 内容的构架 放心、定心、修心 直接宣传“明心见性”的主张","note":"孙悟空身上最引人注目的特征，毫无疑问就是他那无拘无束的“自在”精神以及反抗精神，这也是这个角色之所以受到大家喜爱的原因。但同时我们也需要注意的是，《西游记》诞生的时代，封建制度的束缚依然存在，并且，一味地张扬自由也会适得其反，造成自私欲念的膨胀。正是在这主观与客观双重条件的作用下，《西游记》的作者为孙悟空套上了重重束缚，使其自由精神得到一定的约束，是以“自在不成人，成人不自在”。而更深一步去探寻，这种情况的出现，某种程度上正是心学影响的结果。心学讲求“致良知”，必然导致对欲望的克服，这正是孙悟空“成人不自在”的内在原因。"},{"id":"387","stars":"★★★★","title":"《西游记》中是如何将神性、人性、物性统一在一起的？请具体结合人物与故事情节说明。（华东师范大学）","body":"【答题框架】\n\n与小说在整体上“幻”与“真”相结合的精神一致，《西游记》塑造人物形象也自有其特色，即能做到物性、神性与人性的统一。\n\n所谓“物性”，就是作为某一动植物的精灵，保持其原有的形貌和习性，如鱼精习水，鸟精会飞，蝎子精有毒刺，蜘蛛精能吐丝；就是他们的性格，也往往与之相称，如猴子机灵，老鼠胆小，松柏有诗人之风，杏树呈轻佻之姿。这些动物、植物，一旦成妖成怪，就有神奇的本领，具有“神性”，从“真”转化为“幻”。然而，作者又将人的七情六欲赋予他们，将妖魔鬼怪人化，使他们具有“人性”，将“幻”与人间的、更深层次的“真”相融合，从而完成了独特的艺术形象的创造。这亦即是社会性、生物性和神异性的巧妙融合。\n\n孙悟空本是天地化育的一个石猴，具有猴子的特征，他“毛脸雷公嘴”，罗圈腿，拐子步，始终是“沐猴而冠”的神情。他喜欢跳跃攀登，性情急躁，声容神态完全是一个猴子模样。他神通广大，有七十二般变化的本领。但千变万化，往往还要露出“红屁股”或“有尾巴”的真相。他是一只神猴，却又是人们理想中的人间英雄。他有勇有谋、无私无畏、坚忍不拔、积极乐观，而又心高气傲、争强好胜，容易冲动，爱捉弄人，具有凡人的一些弱点，乃至如信奉“一日为师终身为父”，遵守“男不与女斗”的规则，等等，这都深深地打上了社会的烙印。他就是一只石猴在神化与人化的交叉点上创造出来的“幻中有真”的艺术典型。\n\n猪八戒是天神受罚而错投了猪胎，所以也与生俱来地有了猪的贪吃懒散的特点，性情粗劣莽撞，爱耍小聪明又常露馅丢\n\n丑，作者还把猪身上的贪吃爱睡、愚蠢呆板、懒惰自私等特性糅合到猪八戒形象之中，甚至连他的三十六般变化也只能变化成一些蠢笨模样。\n\n但这也是一个极可爱的形象。在他的可爱中，处处可见人性的光辉。在唐僧师徒四人之中，只有猪八戒的人性是完整的。惟其完整，也就使他显得特别可爱。他前世因调戏嫦娥而被重罚投胎下界为猪身，但本性难移，未有丝毫悔改之意。他也从不掩饰自己的好色之心。因为好色，他不知受过多少奚落，吃过多少苦头，但始终是见“色”起“意”，本色不变。西行路上，基本的物质生活都无保证，但猪八戒却在暗中攒体己，为的是有朝一日回高老庄和他那未过门的媳妇过美满的夫妻生活。他视佛门的清规戒律如耳旁风，受名“八戒”，却一戒不戒，我行我素，想吃就吃，想睡就睡，脑子里经常做着娶媳妇的梦。他的七情六欲，不遮不掩，自然而生，自然而去。应该说，猪八戒的食色之欲，是人最本质不过的欲望。猪八戒的可爱之处正在于他有这些欲望。在猪八戒的身上，蕴涵了人性的方方面面，折射出晚明倡言个性和肯定人欲的合理性的进步思想之光。\n\n总体来看，《西游记》中孙悟空、猪八戒等神话人物形象，既是我们在现实社会中遇到的人，又有经过想象夸张而出现的种种神奇色彩；既有生活于社会之中的人的特点，又有某些动物的特点。作品将他们的社会性与神话性、人性和动物性天衣无缝地融合到了一起。","keywords":"物性 形貌 习性 神性 神奇的本领 人性 人的七情六欲 社会性 生物性 神异性 孙悟空 猪八戒","note":"作答这道题，关键是解释清楚物性、神性、人性的具体内涵，并且明确这是《西游记》人物塑造的特色之一，然后结合具体人物形象如孙悟空、猪八戒进行分析就可以了。所谓物性，指的是《西游记》中的妖精本来的习性；所谓神性，就是“神奇性”，即这些妖怪表现出来的神幻色彩；人性就比较好理解了，也就是“社会性”，即这些妖怪身上表现出来的人的色彩。神性、物性和人性的统一，在孙悟空和猪八戒这两个形象身上表现得更加突出。"},{"id":"388","stars":"★★★★★","title":"试分析《西游记》的艺术特色","body":"《西游记》是一部风趣幽默、富于童话趣味、致力于展示幻想世界的神魔小说。这部小说，主要具有如下艺术特色：\n\n一、极幻与极真相结合\n\n《西游记》在艺术表现上的最大特色，就是以诡异的想象、极度的夸张，突破时空、生死和神、人、物的界限，创造了一个光怪陆离、神异奇幻的境界。\n\n作者将奇人、奇事、奇境熔于一炉，构筑成了一个统一和谐的艺术整体，展现出一种奇幻美。这种奇幻美，看来“极幻”，却又令人感到“极真”。因为那些变幻莫测，惊心动魄的故事，或如现实的影子，或含生活的真理，表现得那么入情入理。那富丽堂皇、至高无上的天宫，就像人间朝廷在天上的造影；那等级森严，昏庸无道的神仙使人想起当朝的百官；扫荡横行霸道、凶残暴虐的妖魔，隐匿着铲除社会恶势力的愿望；歌颂升天入地，寄托着挣脱束缚、追求自由的理想。这部小说就在极幻之文中，含有极真之情；在极奇之事中，寓有极真之理。\n\n二、人物塑造\n\n（一）物性、神性与人性的统一\n\n与小说在整体上“幻”与“真”相结合的精神一致，《西游记》塑造人物形象也自有其特色，做到物性、神性与人性的统一。所谓“物性”，就是作为某一动植物的精灵，保持其原有的形貌和习性，如鱼精习水，鸟精会飞，蝎子精有毒刺，蜘蛛精能吐丝；就是他们的性格，也往往与之相称，如猴子机灵，老鼠胆小，松柏有诗人之风，杏树呈轻佻之姿。这些动物、植物，一旦成妖成怪，就有神奇的本领，具有“神性”，从“真”转化为“幻”。然而，作者又将人的七情六欲赋予他们，将妖魔鬼怪人化，使他们具有“人性”，将“幻”与人间更深层次的“真”相融合，从而完成了独特的艺术形象的创造。\n\n（二）把人物置于日常的平民社会中，多色调地去刻画其复杂的性格\n\n《西游记》中的神魔形象之所以能给人以一种真实、亲切的感觉，很重要的一点是注意把人物置于日常的平民社会中，多色调地去刻画其复杂的性格。\n\n孙悟空身上也有诸多凡人的弱点，言谈中时见市井粗话、江湖术语和商人行话。猪八戒本性憨厚、纯朴，但食、色两欲，一时难以泯灭；偷懒、贪小便宜，又过多地计较个人的得失，他不忘情于世俗的享受，但还执著地追求理想；他使乖弄巧，而又纯朴天真，呆得可爱；他贪图安逸，而又不畏艰难，勇敢坚强；他不是一个高不可攀的英雄，而是一个实实在在的“人”。显然，《西游记》用多角度、多色调描绘出来的猪八戒这一艺术形象，贴近现实生活，因而也更具真实性。它无疑是中国古代长篇小说在塑造人物形象方面取得长足进步的一个重要标志。\n\n（三）戏谑性的手法\n\n吴承恩对戏谑性风格的偏爱，在塑造孙悟空和八戒时表现得格外明显。孙悟空是作者喜爱的人物，但这并不妨碍作者为他设计一副可笑的面容。小说中许多描写，着眼于悟空的外貌，经常转换视角，一方面提醒读者悟空原为猴子，另一方面又引导读者留意其外貌的滑稽之处，开心一笑。八戒的外貌和贪吃也是《西游记》多次使用的笑料。进一步，《西游记》还在性格上赋予他们喜剧性的顽皮意味。且不说八戒曾自称“痴汉”，悟空自称是“历代驰名第一妖”，即以两人热衷于恶作剧而论，也足以令读者忍俊不禁。\n\n三、喜剧色彩和诙谐气氛\n\n《西游记》采用“以戏言寓诸幻笔”的表现手法，穿插了大量的游戏笔墨，使全书充满着喜剧色彩和诙谐气氛。这种戏言，有时是信手拈来，涉笔成趣，无关乎作品主旨和人物性格的刻画，只是为了调节气氛，增加小说的趣味性，但有的戏言还是能对刻画性格、褒贬人物起到画龙点睛的作用。另外，有的游戏笔墨也能成为讽刺世态的利器。例如第四十四回写到车迟国国王迫害和尚，各府州县都张挂着御笔亲题的和尚的“影身图”，凡拿得一个和尚就有奖赏，所以都走不脱。此时忽然插进一句：“且莫说是和尚，就是剪鬃、秃子、毛稀的，都也难逃。四下里快手又多，缉事的又广，凭你怎么也是难脱。”此语看似风趣而夸张，实是对当时厂卫密布、特务横行的黑暗社会的控诉。\n\n四、结构特征\n\n（一）多个具有相对独立性的故事形成的有机整体\n\n《西游记》的情节是游记性的，行动和奇遇构成其主体部分。由于各个故事具有相对的独立性，这部作品可以说是许多短篇或中篇的串联组合，但这一百回同时又是一个有机的整体。其一，唐僧师徒四人的活动贯穿全书始终，他们一直处于故事的中心。其二，各个不同故事的主角之间存在某种联系。比如孙悟空来到火焰山前，铁扇公主之所以不肯借扇，就是因为要报孙悟空的“害子深仇”。其三，小说很注意情节的前后照应。孙悟空每次和新的对手交锋，差不多都要炫耀一番自己大闹天宫的辉煌经历。至于小说第九十九回完整地罗列九九八十一难，则是用归纳全书的方式维护这种整体感。\n\n（二）复合重叠结构\n\n《西游记》在故事的结撰上精心构思，其过程多繁复而曲折。西天取经途中，唐僧师徒每经历一难，就是一个完整的故事，共七十余故事，在大故事中又往往包括了众多的小故事段，形成了大故事中套小故事的复合重叠结构，环环相扣。作者尤喜用三段式，即将一个大故事的发展分为三个阶段完成，如三打白骨精，有时一个故事中包含有几个三段这种叙述，如车迟国斗法。故事中有故事，但个个不同，相互争奇斗艳，具有一种激发读者阅读兴趣的特殊效果。\n\n五、韵散结合的语言\n\n《西游记》的语言运用也有特色。它往往在描写人物交锋前用韵语表明双方身份，交手后用韵语渲染紧张气氛，而在一般情况下则用散文，有张有弛，颇合所谓劳逸相参的“文武之道”。其叙述、描写语言，明快诙谐，带有浓郁的作家个人色彩。其人物语言，虽然因大多数神魔被漫画化而难以做到个性分明，但主要人物孙悟空、猪八戒、唐僧、沙和尚的口吻却颇见性情。孙悟空心高气傲自称“老孙”，猪八戒“装呆”口口声声“我老实，不晓得”，唐僧的书生腔、沙和尚的老成持重，这些都可以从他们的语言中感受到。","keywords":"极幻与极真结合 人物塑造 物性、神性与人性的统一 多色调地刻画复杂性格 戏谑性的手法 喜剧色彩 诙谐气氛 结构特征 相对独立性 有机整体 复合重叠结构 韵散结合","note":"分析《西游记》的艺术特色，我们可以从其神魔小说类型去出发，联系这篇小说的具体内容进行分析。这其中，我们尤其要注意的是《西游记》中的人物塑造艺术，可能会单独被拿出来考查，大家可以结合孙悟空和猪八戒这两个极具代表性的形象进行分析。"},{"id":"389","stars":"★★★★","title":"为什么说《西游记》是一部“游戏之作”（25广东外语外贸大学）【答题框架】","body":"《西游记》之所以被认为是“游戏之作”，主要是因为其中的游戏笔墨，具体表现在以下方面：\n\n一、语言上多用谐词\n\n我国古代对文学语言的运用向有庄语、谐词之别，以说明不同的语言特色。《西游记》从头到尾几乎都是谐词，这种谐词，不仅是一种轻松活泼的情调，而且渗透着异常浓烈的调侃性和戏谑性，读起来愉悦性很高，娱乐性很强，同时还往往给人以意味隽永而深长的感觉。这就使全书形成了一股为《西游记》所特有的滑稽、风趣、诙谐的氛围，富有魅力，引人入胜。这是作者的游戏笔墨运用得最充分的表现，也是作者以文为戏的艺术技巧运用得最自如的成果。当然，小说的某些场合免不了使用庄语，但就在庄语中，作者走笔运墨往往又能使其中潜伏着巨大的调侃性和滑稽性因素。\n\n二、故事情节中多闹剧和滑稽戏\n\n《西游记》的故事情节，最重要者莫过于大闹天宫和取经所历九九八十一难。然而，若细细一想，人们不免会觉得那不过是一场接一场似真非真，如假非假的闹剧和滑稽戏而已，按照鲁迅的说法，那就是“含糊的彼此之争”，这无疑是作者以文为戏的小说观的反映。如果没有作者的游戏笔墨，不仅故事意趣索然，甚至会大大削弱内容本身的力量，直接影响情节的发展。\n\n三、人物刻画诙谐风趣\n\n有的论者往往只注意到猪八戒的诙谐风趣，其实，小说中的游戏笔墨决不仅仅限于猪长老的喜剧色彩和滑稽意味。且不说猴头身上的游戏笔墨足可与老猪比美，就是高贵如玉皇大帝、威赫如如来、尊严如老君、冰清玉洁如观音、不苟言笑如唐僧，他们的一举一动，一言一语，莫不留下戏笔勾勒的深深的痕迹。游戏笔墨，是《西游记》作者刻画人物性格的富有个性特征的手法之一。\n\n四、“游戏之中暗传密谛”的创作宗旨\n\n《西游记》的创作宗旨正如李卓吾评本中那句评语：“游戏之中暗传密谛”。而作者在表现自己的创作宗旨时，运用的是一种“无端崖”的游戏笔墨，所以挥笔洒墨特别显得无拘无束，这使得这部作品引来诸多附会之论。正如鲁迅所说：由于《西游记》“出于游戏”，所以“使三教之徒，皆得随宜附会”。当代出现的对《西游记》思想内容及其倾向的新的“随宜附会”之论之盛，倒成为该书“出于游戏”的一个有力反证。\n\n【李凡关键词：谐趣 人物思想性格 人神物统一 多种艺术结合】","keywords":"","note":"《西游记》是一部“游戏之作”，也即《西游记》“游戏说”，是现代文学史时期由鲁迅、胡适等人提出来的观点，主要指的是作者的创作动机与作品的外在形式都有“游戏”的特征。讨论《西游记》的思想艺术，就不能绕开其“游戏之作”的性质，但也不能只关注这一性质而忽视其背后的深刻内涵。相关论文可以参考方胜《＜西游记》是一部游戏之作》，具体资料可以在李凡文学正版群领取。"},{"id":"390","stars":"★★★","title":"试述《西游记》的影响与地位","body":"一、掀起了神魔小说创作热潮\n\n《西游记》之后，至明末短短的几十年间，涌现出了近三十部内容各异长短不同的神魔小说，迅速形成了与历史演义等\n\n明显不同的小说流派。这派小说主要有以下三种类型：\n\n（一）《西游记》的续书、仿作、节本，以及与其相配套的系列丛书。如《后西游记》《续西游记》《西游补》等。\n\n（二）为神仙立传型作品。明代神魔小说中有相当数量是为佛道两教以及民间流传的各类神仙立传的，其中有的是独传式，写一人为主；也有的是合传型，将数人凑在一起。这类作品大都先写传主的出身始末，后叙其降妖除害、济世渡人的故事，结构松散，形象干瘪，宗教性强，但因民间信仰所致，也有一定的市场。\n\n（三）与历史故事相交融的作品。这类作品，或将历史的故事幻想化，或将虚幻的人物历史化，历史在这里只是作为一种背景或点缀，其主色调仍是由神魔鬼怪、奇事奇境所显现出来。晚明的这类代表作有《封神演义》《三宝太监西洋记》《三遂平妖传》等。\n\n（李凡说：依据马工程版教材，神魔小说的风格类型主要有四种。\n\n1．以对立双方的斗法为主，写法宝写神通，侧重于想象的神奇。其代表作为《封神演义》。大体可以归入这一类型的还有罗懋登《三宝太监西洋记通俗演义》、无名氏《混元盒五毒全传》等。\n\n2．以发挥象征性寓意为主，借神魔题材表达人生哲理。其代表作为董说《西游补》。大体可以归入这一类型的还有《东游记》《南游记》《北游记》《扫魅敦伦东度记》《海游记》《妆钿铲传》等。\n\n3．艺术特色为玩世不恭，借题发挥，洋溢着滑稽诙谐趣味的作品。其代表作为刘璋《斩鬼传》。大体可以归入这一类型的还有惺惺居士著《精神降鬼传》、落魄道人编《常言道》、张南庄《何典》等。\n\n4．神魔小说、世情小说及其他小说类型合流的产物。其代表作为李百川《绿野仙踪》。大体可以归入这一类型的还有《桃花女阴阳斗传》《瑶华传》《狐狸缘全传》等。\n\n这四种风格类型，分别受到《西游记》不同侧面的影响。）\n\n二、流传世界，具有世界声誉\n\n《西游记》很早就传入朝鲜，受到广泛欢迎。早在朝鲜显宗十年就出现了白话文辞典《西游记语录》，有关《西游记》的翻刻本、改作本、坊刻本也颇多。1831年，日本出版了日译本《通俗西游记》。1942年纽约艾伦与昂温出版公司出版了英译本《猴》。1977-1980年间英文全译本《西游记》四卷在芝加哥和伦敦同时出版，得到西方学界的高度评价。目前已有法、德、西、朝、俄、捷克、波兰、越南等十多个语种的选译本或全译本。《西游记》是一部具有世界声誉的伟大作品。\n\n三、标志着中国神话文化的划时代转型\n\n《西游记》是一部受明代心学思潮影响的、以发掘自我生命根性去体悟天地玄奥的神话小说。《西游记》所写的取经过程可以看作是对人的信仰、意志和心性的挑战以及应战和升华的过程，它破除了三教教义的神秘性和严密性，升华出超宗教的自由心态，使小说充满了诙潜和奇趣。因此，《西游记》在中国神话文化发展中具有重要地位，它标志着中国神话文化的划时代转型，是中国神话文化的大器晚成之作。","keywords":"掀起神魔小说创作热潮 具有世界声誉 标志着中国神话文化的划时代转型","note":"《西游记》的影响在考查中出现的频率相对不高，但我们也需要有所了解。其中我们需要特别关注的是神魔小说的类型，袁行霈版教材中，将神魔小说分为三类，而马工程版教材则将其分为四类，二者的区别在于袁版教材是以题材来划分，而马工程版教材则是以风格来划分。并且袁版教材关注的是从《西游记》出现到明末这一时期的神魔小说，而马工程版教材则是梳理了《西游记》之后出现的所有神魔小说。"},{"id":"391","stars":"★★★★","title":"试分析《金瓶梅》的思想内容","body":"《金瓶梅》是明代中叶以后社会现实生活的写照，其思想内容，主要包括以下方面：\n\n一、抨击封建统治集团与新兴商人势力\n\n《金瓶梅》写世情不在于一般的描摹，而是着意在暴露。它的暴露，不但有广度，而且能在普遍的联系中把矛头集中到封建的统治集团和新兴的商人势力，从而触到了当时社会的基本矛盾，反映了当时的时代特征，因而显得具有相当的深度。小说将暴露社会黑暗的焦点集中到以皇帝为首的最高统治集团身上，抓住了腐朽的封建政治的要害，对腐朽的封建统治集团进行了不遗馀力的抨击；对于新兴的商人势力则抱着一种颇为复杂的态度来加以暴露。\n\n二、表现了社会下层弱势群体和市井无赖的精神面貌\n\n《金瓶梅》“寄意于时俗”，不只是表现在对社会生活的阴暗面作了淋漓尽致的揭露，还表现在作者以洞察隐微的目光写出了社会下层的弱势群体和市井无赖，-展现了他们的可怜、可恶、自轻自贱。这里有娼妓优伶、男奴女婢、帮闲篾片，还有僧侣、道士、尼姑、媒婆、太监、门官，他们的生活环境，他们的精神面貌，都-呈现在如实的描写中。在这里面，西门庆的纵欲对象，妓女如李桂姐、手下伙计的老婆王六儿，尽管叙写得过于直露、秽亵，但还是表现出了性爱与金钱、权势做交易而自毁人格的屈辱，宋惠莲的自杀也就成了这群被侮辱被损害者的一次觉醒。\n\n三、揭示了人性的弱点及异化\n\n在《金瓶梅》中，作者将一把冰冷的解剖刀指向了人性的弱点。作者对于财色，并非一味加以否定，对于女性的压抑和苦闷，表现了一定的同情，对于女性个体意识的萌动也流露了一定的赞美之情。这与晚明“好货好色”的人性思潮是合拍的。但与此同时，作者又以冷峻的笔触、客观的描写表明了假如仅仅以一种原始的动物本能，腐朽的感官享受，乃至无限膨胀的占有欲去向禁欲主义挑战，其结果只能是理性的淹没，人性的扭曲，乃至自身的毁灭。《金瓶梅》并不是停留在一般的道德劝惩层次上的戒贪、戒淫，而是在更深的层次上揭示了人类的本性、人性的弱点及异化。它警示世人：在人欲与天理、个体与客体的矛盾中，兽性毕竟不等于人性。","keywords":"抨击封建统治集团与商人势力 表现了社会下层弱势群体和市井无赖的精神面貌 揭示了人性的弱点及异化","note":"《金瓶梅》是对当时社会现实的真实写照，反映出了当时社会上层和下层的真实状况，并由此揭露出了当时社会中存在的种种矛盾。在此基础之上，《金瓶梅》的作者更进一步发现了人的异化，流露出了对人性弱点的思考，对此我们要有所了解。"},{"id":"392","stars":"★★★★","title":"试分析《金瓶梅》在白话小说发展上的里程碑意义","body":"《金瓶梅》的成书，与“四大奇书”中的另外三种不同，并没有经过一个世代积累的过程。至今未见一个《金瓶梅》的主要人物和主要情节曾经“世代”流传过。作为第一部文人独立创作的白话长篇小说，《金瓶梅》在艺术上虽有诸多粗疏之处，但它也在许多方面做出了历史性的贡献，具有里程碑意义。\n\n一、题材上“寄意于时俗”，贴近现实，面向人生\n\n《金瓶梅》在创作上最显著的特点，就是“寄意于时俗”，所谓“时俗”，就是当代的世俗社会。长篇小说的题材从来源于历史或神话，到取材于当代现实的社会，无疑是一个重要的转变。而《金瓶梅》所描写的现实，主要又不是朝代兴衰、英雄争霸等大事而是家庭生活中的日常琐事；人物也不是帝王将相、英雄豪杰、神仙鬼怪，而是生活中的平凡人物。小说将视角转向普普通通的社会、琐琐碎碎的家事、平平凡凡的人物，这就在心理上与广大读者拉近了距离，给人以一种身临其境亲睹亲闻之感。这标志着我国的小说艺术进入了一个更加贴近现实、面向人生的新阶段。\n\n二、立意上以暴露为主，多用讽刺手法\n\n以前的《三国志演义》《水浒传》《西游记》等长篇小说，虽也写到一些反面的角色作为陪衬，但总的立意在歌颂，热情歌颂了一些明君贤臣和英雄豪杰，直接宣扬了某种理想和精神。《金瓶梅》则着意在暴露，它用冷静、客观的笔触，描绘了人间的假、丑、恶，与之相适应的是，广泛而成熟地运用了“或幽伏而含讥，或一时并写两面，使之相形”等讽刺手法，在作者不加断语的情况下，是非立见。《金瓶梅》的这种立意和笔法，在后世的《儒林外史》《官场现形记》等小说中都有所继承和发展。\n\n三、人物塑造更进一步\n\n《金瓶梅》比之《三国志演义》《水浒传》等从“说话”的基础上发展起来的小说，在塑造人物形象方面也迈进了新的一步。\n\n（一）小说描写的重心开始从讲故事向写人物转移\n\n《金瓶梅》中的故事从传奇趋向平凡，在相对稳定的时空环境和叙事角度中精雕细刻一些人物的心理和细节。写李瓶儿病危、死亡到出葬，竟用了两回半近三万字的篇幅，仅临终一段就写了一万馀字，把西门庆、李瓶儿及众妻妾等的感情世界刻画得细致入微。小说中写了不少平淡无奇的琐事，与情节的开展没有多大关系，只是为了写心，为了刻画性格。\n\n（二）注意多色调立体化地刻画人物的性格\n\n以往长篇小说中的人物性格一般是单色调、特征化的，就是以某种性格特征为核心，其他诸多的性格元素只是用同一色调、在同一方向上加以补充。而在《金瓶梅》中，更多的形象就像生活中的人物一样有恶有善，色彩斑驳。即使是写西门庆，也并没有将这个“混账恶人”简单化，他身上还流露出了市民所赞颂的“仗义疏财，救人贫难”的精神和对李瓶儿的真情。\n\n四、从线性结构向网状结构转变\n\n《金瓶梅》从说话体小说向阅读型小说的过渡，也反映在从线性结构向网状结构的转变上。以往的长篇小说，往往是用一条线将一个个故事贯穿而成，每一个故事又大都是以时间为序纵向直线推进，且有相对的独立性。《金瓶梅》则从复杂的生活出发，全书并不是以单线发展，每一故事在直线推进时又常将时间顺序打破，作横向穿插以拓展空间，这样，纵横交错，形成了一种网状的结构。\n\n五、口语化、俚俗化的语言\n\n《金瓶梅》是文人创作的写俗人俗事的小说，与之相适应的是在语言俚俗上下工夫，用的“只是家常口头语，说来偏妙”。小说又大量吸取了市民中流行的方言、行话、谚语、歇后语、俏皮话等等，熔铸成了“一篇市井的文字”。有时写得平淡无奇，有时显得汪洋恣肆。《金瓶梅》的语言，是在富有地方色彩的家常口头语上提炼出来的文学语言，总的风貌是俚俗而不失文采，铺张而又能摹神。它不但是刻画人物“面目各异”的有力工具，而且也给整部作品带来了浓郁的俗世情味和鲜明的时代特征。以后《儒林外史》《红楼梦》刻意用“京白”来将口语净化，《醒世姻缘传》《海上花列传》之类则重在方言上下工夫，都是在不同角度上受了《金瓶梅》的影响。","keywords":"寄意于时俗 贴近现实 面向人生 以暴露为主 讽刺手法 人物塑造 描写重心向写人物转移 多色调立体化刻画人物性格 线性结构向网状结构转变 口语化、俚俗化的语言","note":"这部分内容既是《金瓶梅》在白话小说发展上的意义，也是《金瓶梅》的创作特征，一般对《金瓶梅》的考查，主要集中于这一部分，故此我们要重点掌握。相较于之前的《三国志演义》《水浒传》等小说，《金瓶梅》在成书过程和思想艺术特征等方面都表现出了很大的变化，这也预示着长篇白话小说创作的进步。25年湖南师范大学就考查到了“《金瓶梅》在中国文学史上的艺术成就与对后世小说创作影响”这道题目，可以将这道题的内容与下一道题的内容结合起来进行作答。"},{"id":"393","stars":"★★★","title":"试分析《金瓶梅》的影响","body":"《金瓶梅》不仅在思想内容与艺术手法上取得了突出的成就，而且对中国白话小说发展产生了极为重要的影响。总体来看，这部小说的影响，主要表现在以下方面：\n\n一、为世情小说发展奠定了基础\n\n《金瓶梅》为以后不论在数量上还是在质量上都占压倒优势的世情小说的发展奠定了基础，把我国长篇小说的发展划成了两个阶段。以后的世情小说主要有两大流派，一派是以才子佳人的故事和家庭生活为题材来描摹世态的，另一派是以社会生活为题材、用讥刺笔法来暴露社会黑暗的。前者如《玉娇梨》《平山冷燕》《醒世姻缘传》《红楼梦》《海上花列传》等，以《红楼梦》为代表；后者如《儒林外史》《官场现形记》《二十年目睹之怪现状》等，以《儒林外史》为代表。它们都这样或那样地表现为“深得《金瓶》壸奥”，与《金瓶梅》之间有着明显的继承和发展的关系。《金瓶梅》之后，世情小说的发展进入一个新的阶段。\n\n二、受到了外国学者的高度重视\n\n在西方，最早在1853年法国出现了节译本。日本在1831年至1847年就出版了由著名通俗作家曲亭马琴改编的《草双纸新编金瓶梅》。《金瓶梅》在1608年以前已传入朝鲜，1853年法国出版了《金瓶梅》节译本。现在的外文译本有英、法、德、意、拉丁、瑞典、芬兰、俄、匈牙利、南斯拉夫、日、朝、越、蒙等文种。美、法、日等大百科全书都给予了《金瓶梅》很高的评价。与其他几部明代小说相比，“在西方翻译家和学者那里，《金瓶梅》的翻译、研究工作是做得最好的”。\n\n三、不良影响：客观上推动了秽亵小说的泛滥\n\n《金瓶梅》中具有太多的性行为的描写。尽管这跟当时把人的生理欲望看作正常要求的进步思潮有关，例如李贽就曾对人的“好货好色”的欲望加以肯定；作品中的有些性行为的描写虽然与情节的发展或人物性格的表现有关，但很多都没有这样的作用；其有关的部分也嫌过多过滥。虽然在《金瓶梅》以前就已有秽亵小说出现，但《金瓶梅》对以后的秽亵小说的泛滥所起的作用却是不容忽视的。","keywords":"为世情小说发展奠定了基础 受到了外国学者的高度重视 不良影响 推动了秽亵小说的泛滥","note":"《金瓶梅》的影响在考查中出现的频率相对较低，但我们也要有所了解。总体来看，《金瓶梅》的正向影响主要集中于世情小说的发展上面，尤其是与《儒林外史》《红楼梦》这两部成就颇高的作品之间有着明显的继承和发展的关系。当然，我们也不能忽视这部作品的负面影响，对此大家要辩证看待。"},{"id":"394","stars":"★★★★","title":"明清世情小说的写实性倾向和文学史地位（26华南师范大学）","body":"所谓世情小说，就是以“极摹人情世态之歧，备写悲欢离合之致”为主要特点的一类小说。明清两代的世情小说，或着重写情爱婚姻，或主要叙家庭纠纷，或广阔地描绘社会生活，或专注于讥刺儒林、官场、青楼，内容丰富，色彩斑斓。世情小说的写实性倾向和文学史地位，可以从以下方面进行分析。\n\n一、明清世情小说的写实性倾向\n\n（一）人物形象去英雄化、去传奇化\n\n世情小说以普通人的日常生活为关注焦点，故事的主角，不再是“武勇智术”过人的历史英雄，豪放不羁、行侠仗义的江湖好汉，立志成佛的高僧和其徒弟，而是现实生活中随处可见的、活生生的普通人。\n\n《金瓶梅》描摹的众脚色，都是世上的凡夫俗子。其中如主角西门庆，就是当时社会中的一个“市井暴发户”的典型。他的言语举止都不脱其“本来市井面目”。至于其他“僧道尼番、医巫星相、卜术乐人、歌妓杂剧之徒”，也都是市井之俗人。小说就是“借西门庆以描画世之大净，应伯爵以描写世之小丑，诸淫妇以描画世之丑婆净婆”。小说集中描写这类俗人、小人并使之成为主角，反映了当时人们对于人的认识有所提高。\n\n（二）直面社会人生，多表现日常生活\n\n以家庭为主要活动环境，以俗事为基本故事内容，就是世情小说的一个重要特征。《金瓶梅》之所以不同于《水浒传》，就在于它主要描写家庭见闻，日用起居这类俗事，因而人物活动的环境也主要在家庭之中、市井之间。这样，就使整部小说浸透了“俗”的色彩，成为“一篇市井文字”。《儒林外史》中既没有惊心动魄的传奇色彩，也没有情意绵绵的动人故事，主要内容是当时随处可见的日常生活和人的精神世界。\n\n（三）艺术手法上多用白描\n\n与世情小说描写的对象和内容有关的，是其艺术表现手法的特点。世情小说多使用白描手法，作者不加断语，仅作客观的勾勒，而人物形象的性格特征、高下优劣等无不一目了然。如在《金瓶梅》第三十回，作者只是客观地描绘了“月娘一忙，众人一齐在屋，金莲发话，雪娥慌走几段文字，下直接‘呱’的一声，遂使生子已完”，而并没有落入“秽套”，不但巧妙地写了生子的经过，同时使“金莲妒口，又白描入骨也”。《金瓶梅》的这种“笔蓄锋芒而不露”的白描手法为后来的世情小说所继承，特别是《儒林外史》一书，对此有较大的发展。全书不靠激烈的矛盾冲突来刻画人物，而是淡化故事情节，尊重客观再现，用寻常细事，通过精细的白描来再现生活，塑造人物。如马二先生游西湖，只是按照他游西湖的路线，所见所闻，淡淡地写去，却把这个八股选家愚昧、迂腐的性格写活了。\n\n二、世情小说的文学史地位\n\n（一）拓展了小说创作的题材，增强了小说的时代感和现实感\n\n世情小说从远离现实的历史、传奇、神怪题材转向当代的社会人生，往往以家庭为切入点，广泛联系社会，即使假托历史，也依然着眼于现实人生，使小说增强了时代感和现实感。\n\n（二）反映了社会现实，增强了社会批判性\n\n世情小说产生在封建社会末期，封建专制制度运转已超千年，各种弊端已日益明显，社会人生的各种悲剧层出不穷。小说要反映世态人情，不能不接触各种社会问题。因此，从不同角度揭露、批判社会黑暗成为世情小说的主要风貌。\n\n（三）对封建观念提出了怀疑，促进了人的觉醒\n\n世情小说关注的是现实人生，而封建时代的现实人生不能不涉及封建社会各种制度和封建思想意识形态，封建的道德观、妇女观、婚姻观、人才观、教育观等。男尊女卑、功名富贵、贵贱等级、以礼节情......这些思想在以往的小说、戏曲里得到肯定和赞美，到了一些优秀的世情小说如《红楼梦》已成了怀疑、责难以至否定的话题。这在一定程度上促进了人的觉醒。\n\n综上所述，明清世情小说具有鲜明的写实性倾向，对于中国古代小说的发展产生了重要的推动作用，甚至对于当下的小说创作还有一定的启示意义。","keywords":"写实性倾向 人物形象 去英雄化 去传奇化 表现日常生活 多用白描 文学史地位 拓展题材 增强时代感和现实感 增强社会批判性促进人的觉醒","note":"世情小说的出现，是中国古代小说发展史上的一个重要事件，世情小说将焦点转向了世态人情、日常生活，必然会导致小说整体写实性的加强，这表现在人物形象、情节设置、艺术手法等多个方面。而这种转变，也与社会思潮的发展相适应，对于整体文学史的发展产生了比较重要的影响。相关内容可以参考黄霖《＜金瓶梅＞与古代世情小说》。"},{"id":"395","stars":"★★★","title":"明清之际小说中女性形象有何变化，体现出的当时何种社会观念（北京外国语大学）","body":"【答题框架】\n\n明清之际是中国社会发生深刻变革的时期，商品经济的繁荣、市民阶层的崛起以及思想文化的活跃，都为文学创作注入了新的活力。这一时期的小说创作中，女性形象发生了显著的变化，从传统的被动角色逐渐转变为具有独立人格和复杂性格的个体。这些变化不仅反映了当时社会观念的转变，也揭示了女性地位和性别关系的演变。\n\n一、明清之际女性形象的变化\n\n明清之际小说的人物选择，一般以一个男子作为贯穿全书的主线人物，领衔一批女性，作者在女性身上所费笔墨往往比男性浓得多，女性逐步地成为小说人物的主体。\n\n这一时期，作者更多地从美学角度选择、塑造、赞扬女性形象，她们是封建社会黑暗长夜中的一盏亮灯，是美好的象征，理想的化身。像是“三言”中塑造了宁为玉碎，不愿瓦全的妓女杜十娘，独具慧眼，诚挚志坚的妓女玉堂春等一大批色丽心美的优秀女性。\n\n同时，这一时期的小说对于女子才能的关注度有了明显的提升。比如才子佳人小说，虽然没有彻底摆脱男才女貌的窠日，但总的来说，许多作品已不再完全按“姿色淑令”的标准来塑造女子的形象，而是大大提高了“才”在她们身上的位置，使之成为构成她们人生价值的重要因素。歌颂女子“异能”，弘扬女子之“才”，这是才子佳人小说的主要特点。\n\n还有就是，明清之际的小说开始注重对女性心理和性格的刻画，使她们成为具有独立人格的个体。例如《聊斋志异》中的女性形象多具有超凡的能力和独立的性格。她们不再是男权社会中的附属品，而是能够主宰自己命运的个体。\n\n二、明清之际女性形象变化体现的社会观念\n\n（一）反映了当时的反理学思潮\n\n受明代新的社会思潮的影响。明代中后期王学兴起，打破了程朱理学僵化统治，有利于人的自我意识觉醒的思想文化活跃起来。后起的思想家李贽肯定人欲的合理要求，主张人际间地位平等，追求个性的自然发展，李贽在妇女问题上，提出了丰富的反封建的思想观点。他从人伦关系的角度，肯定了妇女在人类社会中的重要作用。正是在以李贽为代表的明末进步文化思潮的影响下，作为社会神经末梢的作家们，对此做出了敏锐而强烈的反应，妇女题材的作品便逐渐成为明代后期文学的主旋律，大批妇女题材与道德题材交织的作品便应运而生。出现了兰陵笑笑生、冯梦龙等一批具有先进思想的作家，写出一些以优秀女性形象为描写主体，反映妇女命运的作品。\n\n（二）反映了当时市民文化兴起以及文学世俗化思潮\n\n明中期商业经济的繁荣和城市的兴旺使市民阶层迅速扩大，文人士子也逐渐改变了不屑与商贾、市民为伍的清高态度，文人与市民的关系越来越密切，产生了一批受到市民思想、感情和趣味的熏陶，并愿意为市民阶层服务的文人士子，从而掀起了文学世俗化的思潮。市民作为新兴的社会力量，需要文学反映他们的生活、情感、愿望和要求，要求实现自由与平等，而现实社会中妇女社会地位低下，妇女意识的觉醒是现实社会平等和社会进步的重要组成部分，因此，在文学世俗化思潮中，作家抓住了女性这根社会时代的敏感神经来反映社会，女性形象塑造就成为为市民“写心”“画像”的作家创作的一种时代风尚和审美趋向，女性就自然地成为作家的重要描写对象。\n\n（三）反映了传统道德趋向解体\n\n明清社会，是封建社会走向全面衰败的时代，封建社会是以家庭为基本单位的宗法社会，封建社会的衰败在家庭中的体现就是家庭中男性权威的瓦解。封建统治者一再鼓吹女色祸国，尤物难养，而明清小说家则给我们展示的是与其恰恰相反的情景，即男子不如女性，男子不能统帅自己的臣民，这是对封建社会的无情嘲弄。所以明清小说家对女性的赞美，一方面有\n\n意和男子形成鲜明对照，同时还寄托着一种深刻的象征意义：它表现出在资本主义萌芽出现的明清之际，传统道德趋向解体的现实，以及进步文人中所滋生的一种初步民主主义妇女观。\n\n明清之际小说中女性形象的变化反映了当时社会观念的深刻变革。从传统的被动角色到具有独立人格的个体，女性形象的多样化和个性化体现了社会对女性地位和性别关系的新认识。通过对明清之际小说中女性形象的研究，我们可以更好地理解中国社会在这一时期的历史变迁和思想文化的演进。","keywords":"变化 美学角度 美好的象征 理想的化身 女子才能关注度提升 具有独立人格 社会观念 反理学思潮 文学世俗化思潮 传统道德趋向解体","note":"明清时期小说中的女性角色的地位呈现一个上升的趋势。明初，无论是《三国志演义》还是《水浒传》，都以塑造男性角色为主，女性角色只是陪衬；到了明代中后期，虽然还是以男性角色为主要线索，但女性角色的数量有了很大的提升，女性逐渐成为了小说的主体；到了清代中期，女性角色不但已经成为小说中的主要角色，其形象也越来越趋向完美，这又以《红楼梦》为典型代表。而这样一个女性地位逐渐上升的过程，正是当时社会思潮的反映，这一点，我们需要联系相关作品以及明清时期的社会状况去理解。相关内容可以参考田同旭《女性在明清小说中地位的变化》、马兴国《明清小说女性形象地位嬗变研究》，具体论文可以在李凡文学正版群领取。"},{"id":"396","stars":"★★★★","title":"试分析“三言”“二拍”的思想内容","body":"“三言”“二拍”涉猎范围极广，反映了极为丰富的社会内容，体现出了明末社会思潮的变动。总体来看，“三言”“二拍”的思想内容主要有以下方面：\n\n一、反映了明末商人迅速崛起的时代特征\n\n在“三言”中，经商买卖已被视为正当的职业，商人的地位有了明显的提高，客商凭着金钱的力量，已在百姓的心目中建立起仅次于官员的地位。“二拍”中的重商思想表现得更加明显，在金钱面前，门第与仕途已黯然失色。小说所描写的这种社会心理的微妙变化，表现了晚明时代的鲜明特点，反映了一种新的价值取向。\n\n“三言”“二拍”的编者对商人的感情也与以往传统的观念不同。“三言”中活跃的商人，多数已不是贪得无厌之徒和为富不仁之辈，而往往是一些善良、正直、纯朴，而又能吃苦、讲义气、有道德的正面形象，如《吕大郎还金完骨肉》中的布商吕玉、《施润泽滩阙遇友》中的小商人施复等，都拾金不昧，心地善良。新兴商人所获之“利”都被蒙上了传统道德之“义”而显得那么温情脉脉和天经地义。比较起来，“二拍”中的一些作品更注重描写商人的逐“利”而不是求“义”，更直接地接触到了商业活动的本质，不是从道义的角度而是直接从经商获利的角度去描写商人，去赞美他们的囤积居奇、投机冒险、积极进取的商业活动，确实更贴近经商活动的本质特点，更准确地反映了晚明商人势力迅速崛起的时代特征。\n\n二、表现了婚恋自主的精神\n\n歌颂婚恋自主，宣扬男女平等的作品在“三言”“二拍”中占有很大的比重，而且也最脍炙人口。值得注意的是，书中这种男女爱恋之情包蕴着丰富的社会内容。比如《卖油郎独占花魁》中的秦重、莘瑶琴，他们的婚姻是建立在真正相爱的基础之上，是一种相互平等、相互尊重和相互了解的关系。在“二拍”中，像《通闺闼坚心灯火》中的罗惜惜与张幼谦、《李将军错认舅》中的刘翠翠和金定，也都是经过了青梅竹马、耳鬓厮磨、相互熟悉的过程后才萌发了生死不渝的坚贞爱情。“三言”“二拍”所表现的这种婚恋自主的精神，既突破了门当户对、父母包办的陋习，也突破了一见钟情、人欲本能的冲动，而打上了新时代的印记。\n\n三、流露出男女平等的思想\n\n“三言”“二拍”在描写爱情故事时，还具有尊重女性的意识，流露了男女平等的思想。而且赞颂了女性为追求人格的尊严而进行的不屈不挠的斗争，《杜十娘怒沉百宝箱》中的杜十娘，就是一个维护女性人格尊严的典型。宋明以来的封建婚姻关系中，贞节观念是套在女性脖子上的一副沉重的精神枷锁。突破贞节观念是晚明人文思潮影响下尊重人性、妇女解放的一种表现。“三言”中的市民身上，讲究的是人生的真情实感和尊重自己爱的权利，传统的三从四德、贞操守节之类已被相对地淡化。在“二拍”中，对于女性“失节”的问题，表现得更为宽容。\n\n四、揭露了官场腐败和社会黑暗\n\n“初刻”《恶船家计赚假尸银》开头就指出当时的官吏只知道“侵剥百姓”“诈害乡民”，“将良善人家拆得烟飞星散”，这就无异于“盗贼”；而所谓“盗贼”，“仗义疏财的倒也尽有”，因而“二拍”的作者禁不住发出了“每讶衣冠多盗贼，谁知盗贼有英豪”的感慨。在暴露官吏贪酷的篇章中，特别引人注目的是《硬勘案大儒争闲气》，凌濛初在这里竟把矛头指向朱熹。这个当时被捧为“圣人”的理学大师，在小说中竟是个挟私报复，心灵卑鄙，行刑逼供，诬陷无辜的十足小人。\n\n“三言”“二拍”的作者在鞭挞奸臣、贪官、酷吏和种种社会恶势力时，主要是用一颗正直的知识分子的良心来观照的；当他们在刻画一些“清官”形象时，则往往较多地带上了市民化的色彩。那些“贤明”的“青天”往往能重视人的价值，承认人情、人欲的合理性。这些官吏显然不那么正统死板、僵化冷酷，多少体现了新兴市民的意志和愿望。\n\n五、不足：过分肯定自然本能，不适当地强化文学的教化功能\n\n“三言”“二拍”在肯定情和欲时，往往过分地描写人的自然本能，有过多直露的秽笔而遭到人们的訾病；另一方面又不适当地强化文学的教化功能，大谈忠孝节义、因果报应，散发着陈腐的气息，即使如《蒋兴哥重会珍珠衫》《杜十娘怒沉百宝箱》这样的优秀作品也打上了这样的印记。这种矛盾，“二拍”比之“三言”更为突出，因而人们往往给“三言”以更高的评价；或者说，“三言”将我国古代白话短篇小说推向高峰，而“二拍”则越过高峰而面向下坡。","keywords":"明末商人迅速崛起的时代特征 婚恋自主精神 男女平等思想 官场腐败 社会黑暗 过分肯定自然本能 不适当地强化文学的教化功能","note":"“三言”“二拍”是在明末商品经济发达、都市繁荣的背景下产生的，受到这一背景的影响，明末的社会思潮相较于之前发生了很大的变化，像是对待商人的态度、对待婚姻爱情的态度等内容都有了变化，这些因素很自然地体现在了这一时期的作品之中，大家可以从这一角度去切入理解。“三言”“二拍”在名词解释中出现的频率相当之高，要做好应对的准备，大家要注意一下。"},{"id":"397","stars":"★★★★","title":"试分析“三言”“二拍”的艺术特色","body":"“三言”和“二拍”代表了明代拟话本的成就，不仅在当时文坛上，而且对后来文学都有不小的影响。“三言”“二拍”的艺术特色，主要包括以下方面：\n\n一、“无奇之所以为奇”，在日常题材、平凡故事中显示出小说的传奇性\n\n（一）采用误会、巧合手法\n\n通观“三言”“二拍”，并不是完全没有写“牛鬼蛇神”的内容；在以“耳目之内日用起居”为题材的篇章中，也有个别情节简单、以阐发思想为主的作品。但其多数作品由于题材的平凡，就更需要用巧妙的构思、奇异的关目来激发读者的兴趣。而且从“三言”“二拍”主要供人阅读而不是诉诸听觉来看，也有条件把情节写得复杂多变。因此从总体上说，它们的故事比以往的话本小说写得更为波谲云诡、曲折多变。在表现上常常采用巧合误会的手法，把情节弄得迷离恍惚，波澜起伏。\n\n（二）运用一些“小道具”贯穿始终\n\n为了使情节巧妙多变，作者运用一些“小道具”贯穿始终，使整个故事既结构完整，又波澜迭起。如《蒋兴哥重会珍珠衫》中的一件“珍珠衫”、《陈御史巧勘金钗钿》中的“金钗钿”、《赫大卿遗恨鸳鸯绦》中的“鸳鸯绦”、《顾阿秀喜舍檀那物》中的“芙蓉屏”等等，也都是以一件“小道具”将整篇小说勾连得既一波三折，又严谨工整。\n\n（三）复线结构、板块结构和变换视角的使用\n\n“三言”“二拍”情节之“奇”，还表现在突破了单线结构的模式，而尝试用复线结构、板块结构和变换视角。如在《张廷秀逃生救父》中，一方面写赵昂夫妇害人，另一方面写张廷秀逃生救父，两条线有分有合，交叉推进将复杂丰富的生活场面交织在一起。\n\n（四）悲剧性与喜剧性的情节交互穿插\n\n悲剧性与喜剧性的情节交互穿插，创造一种“奇趣”，也是“三言”“二拍”常用的手法。冯梦龙、凌濛初显然更乐意写一个完美的结局并在作品中营造一种喜剧气氛。像“三言”中《乔太守乱点鸳鸯谱》以计中计、错中错、趣中趣相互交叉，最终又以戏剧性的“乱点鸳鸯谱”作结，皆大欢喜。在“二拍”中，同样也充满着幽默、讽刺和戏剧性。他们将悲喜的情节巧妙搭配，相互衬托，增强了小说的新奇性和趣味性。\n\n二、人物塑造\n\n（一）多用白描手法\n\n在刻画人物个性方面，“二拍”比“三言”略嫌粗糙，有类型化的倾向。但总的说来，这两部小说还是运用了传统的白描手法，塑造了许多血肉饱满、个性鲜明的人物形象，其中如杜十娘、莘瑶琴等人物的性格，写得流动变化，富有层次感。\n\n（二）细致入微的心理描写\n\n在具体表现手法上，这两部作品比以前的话本小说显得更为细腻。写环境，写动作，写对话，写细节，时见精雕细刻的笔墨，特别是细致入微的心理描写，更受人们的重视。“三言”中的《金玉奴棒打薄情郎》《金令史美婢酬秀童》《玉堂春落难逢夫》《白玉娘忍苦成夫》，“二拍”中的《转运汉遇巧洞庭红》《丹客半黍九还》等，也都有细腻精致的心理描写。\n\n这在中国古代写心传神的艺术史上，是一种新的开拓。\n\n三、供案头阅读的白话短篇小说文体\n\n冯梦龙在加工、编写“三言”的过程中，实际上已经超越了说话人的话本模式，而重塑了一种专供普通人案头阅读的白话短篇小说文体。比如，话本的“入话”只是用来稳定和招徕听众，往往与正文的内容关系松散，且比重过大；冯梦龙删繁就简，使之与正文的内容有较为紧密的联系。话本中夹杂了大量的韵文，以供歌唱或吟诵，调节听众的情绪，渲染说话的气氛；他则大幅度地加以删改，以扫除阅读时的障碍。话本结尾时，说话人用以宣告“话本说彻，权作散场”之类的套话，也被视为阅读的累赘而略去。\n\n四、语言通俗化\n\n冯梦龙、凌濛初在语言的通俗性上进一步作了努力。冯梦龙一方面从民间提炼生动活泼的谚语、比喻等，用来提高小说语言的表现力；另一方面注重使用浅俗的语言甚至完全使用口语反映生活场景，描绘人物风貌。这使“三言”容易被广大人民群众理解，进而受到感动，得到教益。","keywords":"无奇之所以为奇 误会、巧合手法“小道具”贯穿始终 复线结构 板块结构 变换视角 悲喜情节交互穿插 人物塑造 白描手法 细致入微的心理描写 案头阅读的白话短篇小说文体 语言通俗化","note":"“三言”“二拍”是明代拟话本成就的最高代表，因而在考查中出现的频率非常高，除了考查名词解释外，部分院校还会对其艺术特征作考查。“三言”“二拍”中保留着说话艺术的痕迹，但明显案头化、文人化了，我们可以从这一点去切入，领会其总体特征。这其中，我们尤其要注意的是“三言”“二拍”“无奇之所以为奇”的特征，可能会被单独拿出来考查。此外，这部分提到的“拟话本”这一概念也有可能在名词解释中出现，大家要注意一下。"},{"id":"398","stars":"★★","title":"试比较“三言”与“二拍”的区别","body":"“两拍”与“三言”齐名，在题材内容、艺术手法等方面存在不少相近之处，也都以说故事见长。至其异点，则主要表现在以下几个方面。\n\n一、创作宗旨不同\n\n冯梦龙编纂“三言”，经济利益的驱动无疑是主要因素。但他在给三部小说集命名时，却毫不迟疑地强调“喻世”“警世”和“醒世”，将教化作用放在首位。与冯梦龙强调教育作用形成对照，凌濛初则坦率地表示，经济利益才是首要的考虑：所谓“拍案惊奇”，所谓“图个好听”，都是说要以出人意料、趣味横生的故事吸引听众或读者，好让他们乐意从腰包里掏出钱来。\n\n二、对情欲肯定的程度不同\n\n“三言”和“二拍”中都有不少以男女爱情婚姻为题材的小说，“二拍”比起“三言”来，对爱情婚恋的描写更加大胆，不但对正当的情予以赞扬，甚至对正当的欲也加以肯定，对女性的情欲也明确加以肯定，在很大程度上冲决了传统的礼教大防。这既是对明中叶以来倡真情、反礼教思想的继承发扬，又是对日益强烈的市民思想、市民趣味的反映。如《酒下酒赵尼媪迷花，机中机贾秀才报怨》，写巫娘子被骗奸，但与丈夫一起既报了仇恨，亦全了声名。《姚滴珠避羞惹羞，郑月娥将错就错》，写姚滴珠被骗去当外室，其夫仍坚持与她完聚，并无讥词。\n\n三、对商人的描写角度不同\n\n“三言”中虽然写到商人与经商，但多是小商小贩，也很少把经商活动作为小说的主要内容，其中新兴商人所获之“利”都被蒙上了传统道德之“义”而显得那么温情脉脉和天经地义。“二拍”则多写富商巨贾，甚至出现大规模的海外贸易，更注重描写商人的逐“利”而不是求“义”，更直接地接触到了商业活动的本质，不是从道义的角度而是直接从经商获利的角度去描写商人，去赞美他们的囤积居奇、投机冒险、积极进取的商业活动，确实更贴近经商活动的本质特点，更准确地反映了晚明商人势力迅速崛起的时代特征。\n\n四、艺术成就不同\n\n“三言”故事情节完整曲折，长于运用巧合、悬念等艺术手法；人物性格鲜明突出；语言通俗易懂，口语化特征明显，对小说艺术的发展有着重要贡献。\n\n“二拍”的艺术成就不如“三言”，其根本原因在于只局限在拟话本的体裁中没有突破与发展，市民文学的清新通俗，泼辣俏皮的特色越来越少，而模拟又缺乏新意，缺乏激情，所以很少有曲折生动的故事情节和激动人心的人物形象。不过其叙述故事的能力较“三言”有所提高，这主要表现为如下两点：第一，能以丰富的想象力，将故事设计得生动曲折，并以较具体的描绘逐步展开情节。第二，相同或相近类型的故事能编造得各有精彩，不落窠臼。","keywords":"创作宗旨 对情欲肯定的程度 对商人的描写角度 艺术成就","note":"“三言”“二拍”毕竟出于不同人之手，在具有共同艺术特征的同时，也存在一些差异，总体来看，“二拍”的思想更加开放，而“三言”的艺术成就相对更高。不过我们要注意的是，“二拍”虽然对情欲的肯定和对商人本质的表现都较“三言”更进一步，但其因果报应、宿命论思想也较“三言”更加浓厚一些，对此要辩证地看待。"},{"id":"399","stars":"★★★","title":"简述李贽“童心说”的具体内涵","body":"一、人必有私与个性自由\n\n“私”是作为童心的主体所具有的天性。李贽将人的私欲提升到伦理层面，述其存在的合理性。穿衣吃饭便是人伦常理，自私自利乃是人的天性。即使是圣人，也是生活在人世间的凡人，追求私利之心人人皆有。他认为正是由于“私”的存在，才能为其他生产活动提供动力。只有肯定社会中追求私利的正当合理性，才有利于良性竞争社会的形成。政治层面上，李贽也认为“人皆有私”。国家的利益与个人利益相互依存，个人想要获得长久利益就得保障国家的利益，而国家利益的保障也为个人提供了追求自身利益的机会。李贽批判儒家“天下为公”的治国理念与“灭人欲”的禁欲主义。\n\n二、人人平等\n\n李贽在否定道德作为评价人尊贵卑贱的依据后，通过对“人必有私”加以整理，产生了其特有的平等观。\n\n（一）人生而平等\n\n李贽通过改良王阳明心学，打破了儒家所建立的宗法等级社会观念，并且去除了“致良知”中“良知”所带有的儒家道德属性，从天赋本能的角度肯定了平等的本体性。李贽也从佛学角度认为人人都有佛性并且生而有慧根，佛性不区别男女、圣凡，只要通过修道皆可摆脱业障体悟佛根。在道家思想中，他体悟到每个人天生都是自足的，“万物皆备于我”，老天并没有偏袒圣人而忽略凡人，从根源上肯定了人的平等。\n\n（二）肯定男女平等\n\n李贽通过将夫妻关系提升至人伦关系的首位，肯定了男女平等。李贽认为男女在才能上是一样的。男人也有小人，女人也有“大人”。他认为一些女性见识浅薄是由于生活范围狭窄，“不出闺阁”所导致的。男女在人格上是平等的，盛赞武则天是“近古之王”，肯定女性地位，认为“有女”一样可“立家”。在婚姻的选择上，李贽反对建立在虚构理念上的男女关系，鼓励自由恋爱结婚与再嫁。批判“饿死事极小，失节事极大”的贞操观与“行媒”的封建婚姻形式，注重个人的感情与幸福。\n\n三、戏曲至文\n\n在“童心说”中，李贽从发展的眼光看待文体的演变，并且将戏曲提升到“天下之至文”的位置。“童心说”是其论证戏曲价值的出发点，作为“天下至文”的戏曲“未有不出于童心焉者也”。李贽将《西厢记》提升至与六经《论语》《孟子》相同的地位，认为其价值就在于绝假存真，真实自然。儒学经典也只是符合当时社会环境的产物，而历代统治者却对经典进行改造，使之成为束缚人思想、巩固封建统治的工具，阻碍了人对真理的追求。","keywords":"人必有私 个性自由 人人平等 人生而平等 肯定男女平等 戏曲至文","note":"“童心说”的出现是受到了明末个性解放思潮的形象，它肯定出于自然的人欲，否定道德礼教，由此产生“人必有私与个性自由”“人人平等”以及提升戏曲地位的“戏曲至文”三方面内涵。“童心说”不仅开启了晚明新的哲学思潮，也为文学评论提供了新的价值标准，并且对公安派产生了极为重要的影响。“童心说”也是名词解释中经常出现的内容，大家要注意一下。"},{"id":"400","stars":"★★★","title":"试述公安派的文学主张与创作特征","body":"公安派主要人物有袁宗道、袁宏道、袁中道三兄弟，其中袁宏道的影响尤为突出，是公安派的首要人物。因他们是湖北公安人，所以人称公安派。公安派的文学主张及创作特征，主要表现在以下方面：\n\n一、创作主张：“性灵说”\n\n公安派提出了一系列体现晚明文学新价值观的理论主张。“性灵说”便是他们提出的一个著名的口号。\n\n（一）强调真实表现作者个性化的思想感情\n\n公安派推崇“独抒性灵，不拘格套”，从诗歌创作的角度，强调真实表现作者个性化思想情感的重要性，反对各种人为的约束以及“粉饰蹈袭”。做到这一点，即使作品有“疵处”，也是值得赞赏的。\n\n（二）要求摆脱道理闻识的束缚\n\n“性灵说”的思想渊源是李贽的“童心说”。“童心说”从反道学的角度，把“道理闻见”看成是“童心”（或“真心”）失却的根本原因，袁宏道则在此基础上，将“无闻无识”与“真声”做了因果联系，进而肯定人们“性灵”中蕴含的各色各样个人情感与生活意欲的合理性，将表现个体自由情性和欲望看作文学创作的重要内容。可以说，袁宏道的“不拘格套”与李贽旨在解除禁忌的哲学一脉相承，李贽破除的主要是哲学和史学领域的禁忌，袁宏道破除的则是文学领域的禁忌。\n\n（三）反对拟古蹈袭\n\n从提倡直抒“性灵”出发，公安派反对拟古蹈袭，认为文学是随着时代的变化而变化的，有各个不同的时代，即有各种不同的文学。因此反对贵古贱今，反对模拟古人。当然，他们并不是简单地反对复古，而是觉得复古如限于“模拟”或“剿☒袭”仅仅在形式上求得与古人相似，终会流于失败。\n\n二、创作特征\n\n（一）注重有感而发、直写胸臆\n\n公安派以“性灵说”作为文学主张的内核，而反映在创作上则注重有感而发、直写胸臆。比如袁宏道《戏题斋壁》一诗从不同的侧面极言为官所受的苦辛屈辱，直接倾吐了繁重而压抑的仕宦生活给诗人带来的苦闷，并流露出想要挣脱官场束缚而寄身自由自在的田园生活的愿望。\n\n（二）清新洒脱、轻逸自如、意趣横生的创作风格\n\n信手而成、随意而出的写作态度，也使得公安派作家不太喜欢在作品中铺陈道理，刻意雕琢，他们往往根据生活体验与个人志趣爱好，抒情写景，赋事状物，追求一种清新洒脱、轻逸自如、意趣横生的创作效果，读其作品，很少让人有雍容典雅、刻板凝重之感。\n\n（三）部分作品不恰当地插入大量俚语俗语，破坏了艺术美感\n\n随意轻巧的风格有时也让公安派走上另一端。一些作品因过于率直浅俗，加上作者不经意的创作态度，以至于“戏谑嘲笑，间杂俚语”，虽然没有刻意造作的腔调，但不恰当地插入大量俚语俗语，破坏了作品的艺术美感。","keywords":"创作主张 性灵说 真实表现个性化思想感情 摆脱道理闻识束缚 反对拟古蹈袭 创作特征 有感而发 直写胸臆 清新洒脱 轻逸自如 意趣横生 不恰当地插入大量俚语俗语","note":"公安派及其相关内容可以说是晚明时期最重要的一部分知识，在考查中出现的频率非常之高，尤其是在名词解释之中，部分学校也会针对其出一些论述题。在梳理公安派的“性灵说”这一主张时，注意不要忽视其与“童心说”的联系。这部分涉及的公安派、“性灵说”等重点名词解释，大家要特别关注。"},{"id":"401","stars":"★","title":"谈谈你对竟陵派的认识","body":"继公安派之后，以锺惺、谭元春为代表的竟陵派崛起于文坛，并产生较大的影响。锺、谭均为湖北竟陵人，因名竟陵派。\n\n一、文学主张\n\n（一）重“真诗”，重“性灵”\n\n在文学观念上，竟陵派受到过公安派的影响，提出重“真诗”，重“性灵”。如锺惺认为“求古人真诗所在，真诗者，精神所为也”，谭元春则表示：“夫真有性灵之言，常浮出纸上，决不与众言伍。”这些主张都是竟陵派重视作家个人情性流露的体现，可以说是公安派文学论调的延续。\n\n（二）看重向古人学习\n\n竟陵派和公安派的文学趣味还是存在着差异。公安派虽然并不反对文学复古，他们只是不满于仿古蹈袭的做法，但主要还是着眼于作家自己的创造。而竟陵派则看重向古人学习，主张“引古人之精神，以接后人之心目”，达到一种所谓“灵”而“厚”的创作境界。\n\n（三）追求幽深孤峭的文学审美情趣\n\n公安派在“信心而出，信口而谈”的口号下，不免流于率直浅俗，竟陵派则强调通过对古人“精神的接引”，在总体上追求一种幽深丰厚、静默虚寂、孤清奇峭的文学审美情趣，同公安派浅率轻直的风格相对立。\n\n二、创作成就\n\n（一）纠正了复古派拟古流弊\n\n竟陵派提倡学古要学古人的精神，以开导今人心窍，积储文学底蕴，这与单纯在形式上蹈袭古风的做法有着很大的区别，客观上对纠正明中期复古派拟古流弊起着一定的积极作用。\n\n（二）看到了公安派末流俚俗肤浅的创作弊病\n\n竟陵派较为敏锐地看到了公安派末流俚俗肤浅的创作弊病，企图另辟蹊径，绝出流俗，具有一定的胆识。\n\n三、局限性：缩小了文学表现的视野，减弱了直面人生与袒露自我的勇气\n\n竟陵派并未真正找准文学变革的路子，他们偏执地将“幽情单绪”“孤行静寄”这种超世绝俗的境界当作文学的全部内蕴和终极目标，将创作引上幽深奇峭的孤诣独造之路，缩小了文学表现的视野，也减弱了在公安派作品中所能看到的那种直面人生与袒露自我的勇气，其中的理性或退守意识为之增强，显示出晚明文学思潮中激进活跃精神的衰落。","keywords":"文学主张 重“真诗”重“性灵”向古人学习 幽深孤峭的审美情趣 创作成就 纠正了复古派拟古流弊 看到了公安派创作弊病 局限性 缩小表现视野 减弱了直面人生与袒露自我的勇气","note":"从李贽到公安派再到竟陵派的文学思想可谓是一脉相承，构成了一条完整的脉络，因而竟陵派与公安派思想有许多相同的地方，但二者毕竟有先后之分，因而也存在许多区别。相较于公安派，竟陵派整体考查频率较低，大家主要还是多做名词解释方面的准备。"},{"id":"402","stars":"★★★","title":"简述晚明小品文的特点","body":"作为晚明散文创作一大特色的小品文在这一阶段趋于兴盛，它体制短小精练，风格轻灵隽永，反映了晚明时期文人文学趣尚的变化。这些小品文大多描写文人士大夫日常生活及趣味，真实生动地表现他们新的生活情调与审美意趣，形成了个人化、生活化以及求真写实的创作特征。总体来看，晚明小品文主要具有如下特征：\n\n一、反叛传统文学观念，追求个性自觉和“自娱性”\n\n晚明小品文值得重视的重要原因在于，其敢于承认创作目的异于传统文学主流的明教载道、服务于人的理性提升，而纯粹是为了审美娱乐，通过淡化道统，抒写心声，满足人性本质中娱乐审美的需求。晚明的小品文不再追求古代圣贤“庄严整栗”的大典，宁愿欣赏并创作更能体现一己性情“短而隽异”的小品。这种对正统文学观念的反叛，既体现在将边缘性文类（如游记）推向中心，也体现在对原有文类（如尺牍之无所不能）的打破。只有到了这种境地，所谓“独抒性灵，不拘格套”才可能真正实现。也正是这一出发点的不同，成就了晚明小品文轻松活泼的风格特色。\n\n二、体制短小精炼，体裁不拘一格\n\n小品文体制较为短小精练，与“春容大篇”相区别。体裁上则不拘一格，序、记、论、跋、碑、传、铭、赞、尺牍等文体都可适用。它的兴盛与当时文人文学趣味从往日庄重古板的“高文大册”转移到了轻俊灵巧而有情韵的“小文小说”有关。\n\n三、生活化、个人化的内容题材\n\n晚明小品文内容题材上的一个显著特点是趋于生活化、个人化，不少作家喜欢在文章中反映自己的日常生活状貌及趣味，渗透着晚明文人特有的生活情调。晚明文人充满闲情逸致，对享受生活给予肯定，因此反映在作品中的生活情趣格外生机盎然。这种新的意识观念让晚明文人摆脱了传统思想的沉重枷锁，追求个性舒张，追求生活享受，自由自在，闲适淡雅成为时尚追求。除了寄情山水园林，他们更多的是将生活中的琐碎变成自己洁净清雅的精神享受。南国细雨、幽径轩窗、路旁杂耍、酒钱车夫甚至栽花饮茶都成了他们笔下的风景雅趣。\n\n四、率真直露的风格特征\n\n晚明小品文的另一个特点是率真直露，注重真情实感，不论是描写个人日常生活，表达审美感受，还是评议时政，抨击秽俗，时有胸臆直露之作。比如张岱《自为墓志铭》以袒露的笔法写出自己年轻时“极爱繁华”的生活经历，且不论这种生活态度的是与非，客观上他在作品中塑造出了一个真我的形象，不带虚浮习气。又如袁宏道《叙陈正甫会心集》阐述的“世人所难得者唯趣”，“夫趣得之自然者深，得之学问者浅”的道理，无所隐讳地表露出崇尚“无拘无缚”“率心而行”的真实心态。","keywords":"反叛传统观念 个性自觉 “自娱性”生活化 个人化 率真直露","note":"晚明小品文可以说是真正代表明代散文个性的散文类型，对此我们要认真掌握。晚明小品文诞生于明末个性解放思潮之中，追求人的个性自觉，因而必然显示出对传统文以载道思想的叛逆，从这一点出发，进而表现出了其余特征。大家可以这样去整体把握晚明小品文的创作特征。"},{"id":"403","stars":"★★★","title":"试分析张岱散文小品的创作特征","body":"张岱可以说是晚明小品文殿军，是一位杰出的散文家。他的小品文创作，主要具有如下特征：\n\n一、遥思往事，带有温情和想象\n\n张岱的《陶庵梦忆》《琅嬛文集》《西湖梦寻》这三册小书，有一个共同特点，那就是“遥思往事”。明清易代，天崩地裂，张岱的“遥思往事”，不能不带有更多的温情与想象。《自为墓志铭》中“回首二十年前，真如隔世”，一笔几乎写尽一生，文中历数自己有“七不可解”，此外又有“八可称”“八不成”“六呼之”，面对这些铺天盖地的自嘲自蔑之辞，作者表面的自暴自弃之下，是一颗伤口永远无法愈合的心灵。\n\n二、关注日常生活，描摹社会风情\n\n明清易代，很多人在写前朝遗事，而且都很动感情，因其中寄托了故国之思。张岱有点特别，追忆的不是文人雅事，更不是军国大业，而是都市里的日常生活，描摹了乡风市声、人情世态、民俗节庆，说唱杂耍等内容，并将其描绘得十分细致。就对民俗工艺，民间文化和都市风情等的理解与把握来说，张岱的文章，甚至远在许多史书与方志之上。\n\n三、温和的表达态度\n\n张岱的文章之中感觉不到徐渭、李贽那样的愤世嫉俗，历经两代浮沉，尘世繁华皆如过眼云烟，张岱已较为通达洒脱，不怎么写愤怒与孤傲。《西湖七月半》中西湖看月的五种人，尤其是前四种，显然与张岱的趣味格格不入，可下笔时，作家很有分寸，略有嘲讽，但相当温和。高雅之士而具有“平常心”，这点很难得。\n\n四、文风平淡干净，趣味内蕴\n\n张岱的文章没有刻意经营的“精彩”，甚至显得有些平淡，给人的第一印象是“干净”，碧空万里。文字干净，绝非心中无点墨，而是思维敏捷，表达准确。不过，张岱毕竟是经历过公安性灵，竟陵幽深的陶洗，表面上是“忆即书之”，无意为文，实则大有讲究，表面上平淡干净，深层则包蕴着无穷的文章趣味和洒脱的心境。\n\n五、擅长写人，注重细节刻画，具有传奇性色彩\n\n张岱擅长写人，而且以细节为主。三言两语，便足以流传千古。这种笔调，最直接的渊源，应该是《世说新语》。《陶庵梦忆》里的不少人物，包括张岱自己，都颇具晋人风韵。同时，这种笔墨的养成，也与张岱的好说书、好梨园有关系，写的多是奇人，选用的又都是传奇性的细节，干脆利落，要言不烦。","keywords":"遥思往事 温情和想象 日常生活 社会风情 温和态度 平淡干净 趣味内蕴 擅长写人 细节刻画 传奇性色彩","note":""},{"id":"404","stars":"★★","title":"试述明代小品文的整体发展脉络","body":"小品文源远流长，“小品”一词始见于晋代，作为一种文体，它兴盛于明代。明人的小品文观念奠定了后代小品文观念的基础，其创作风格也深刻地影响着后人。小品文从无一席之地到受人追捧，是明代文学先驱们赋予小品文以精神魂魄，使其名正言顺，并有如此强大的生命力和艺术魅力。明代小品文的发展可以分为三个时期。\n\n一、明代初期：健康、充实、严肃、尖锐，但基调较为传统\n\n洪武至天顺年间，是明人小品发展的第一阶段。明初作家大部分亲历过社会动乱，对于现实与人生有较深的认识。他们的作品往往能切近现实，总体上有一种比较健康、充实、严肃、尖锐的风格，对于元文坛上弥漫的纤弱缛丽而乏风骨的风气，起着扫荡作用。但明初散文无论思想内容还是表现手法，其基调是比较传统的。\n\n这一时期的小品文作家以未濂和刘基成就最高。宋濂文章从容简洁，善于变化；立意高远，字里行间颇见笔致。刘基散文内容丰富、体裁多样，写景之文优美幽秀，有唐宋文之风致。\n\n二、明代中期：由雅正端重向空灵闲适转变\n\n成化至隆庆年间，是小品文发展的一个转折时期。其总体是由明前期的雅正端重向晚明的空灵闲适的转折。然文学流派复杂，众体杂陈。\n\n（一）成化以后，台阁体的流弊益甚，引起人们的强烈不满和创作上的反拨，于是文学创作走上复古的道路。先是李东阳力图以雄浑之风去纠正台阁体冗沓平弱的弊病，前后七子继之予台阁体以致命的打击。前后七子的作品内容比较充实，与现实关系较为密切。但从小品文艺术的角度看，成就并不很高。其为文往往受到古文格套的束缚、佶屈聱牙，缺乏性灵。当然前后七子也有些优秀之作。\n\n（二）以王慎中、唐顺之、茅坤、归有光为代表的唐宋派在明代小品文的发展中起了承前启后的独特作用。他们一方面强调学习唐宋八大家的古文，一方面提倡作者要直抒胸臆，不事雕琢。尤其归有光，以抒情的笔调来叙事，把日常的生活琐\n\n事引到载道的古文之中，使古文出现生活化、口语化的倾向，风格清新亲切、大大地发展了小品文文体的美学特征。\n\n三、明代后期：小品创作进入极盛时期，个性自觉思潮兴起\n\n万历至崇祯年间是小品的极盛时期。随着商品经济的逐步发达，王阳明的“心学”以“反传统”的姿态出现于思想界。引发出否定传统绝对权威的思潮。同时、在文学领域里一种个性自觉的思想潮流悄然而起。\n\n（一）李贽是公安派的思想先驱。他认为天下的至文，都是出于“童心”，是作家真实的思想感情与个性的自然流露，而不在于形式上的追求。更不在于拟古复古，他的观点为晚明小品的发展提供了必要的思想基础。尽管他主要不是以文学家名世、但他的一些小品、摆脱古文格套，信笔而书发前人之所未发、尖锐犀利、不同凡响。\n\n（二）万历年间，以袁宗道、袁宏道、袁中道为代表的公安派起文坛。他们继承和发展了李贽的文学观点，主张文学进化、反对摹古。“性灵说”是他们的理论基础，他们推崇“独抒性灵、不拘格套，非从自己胸臆流出，不肯下笔”的创作倾向。公安三袁的小品文成就都很高、他们的作品自然、坦率、大胆、真实地流露自己的真性灵，敢言人之不敢言、愿写人之不愿写。一切文学上的拘缚和戒律都为他们所不顾。\n\n（三）当公安派风靡文坛时，又有另一异军突起，同领风骚-以锺惺、谭元春为代表的竟陵派亦反摹古，推崇性灵；然而他们的美学追求与公安派又有所不同、他们提倡以“幽深孤峭”的艺术风格来表现“幽情单绪”的内容，并创作出不少优秀的小品文。\n\n（四）张岱是晚明小品的代表作家。他在文学主张上继承了公安派、竟陵派的观点，反对复古提倡任情适性的文学。但在创作上又不囿于公安派和竟陵派，兼取各家各派之长而弃其短，可以说是晚明小品文艺术的集大成者。\n\n清代文学史","keywords":"明代初期 健康、充实、严肃、尖锐 基调传统 明代中期 雅正端重向空灵闲适转变 明代后期 小品创作进入极盛时期 个性自觉思潮兴起","note":"这一部分是对明代小品文整体发展脉络的一个梳理，在考查中出现的频率不高，但可以帮助我们将明代散文相关内容中比较重要的一些知识点，如宋濂、刘基、前后七子、公安派、竟陵派等串联起来，巩固大家的记忆，故此给大家梳理了这样一道题目。大家可以结合其中涉及的作家和流派的相关内容进行记忆。相关内容可以参考吴承学《明人小品述略》，具体资料可以在李凡文学正版群中领取。"},{"id":"405","stars":"★★★","title":"试梳理清代文学的发展脉络","body":"一、清代初期（顺治初年到康熙中年）\n\n清代初年的诗、文、小说和戏曲尚多民族意识、故国之思。总体来看，这一时期的文学，主要具有如下特征。\n\n（一）诗文具有复古倾向\n\n清初文风复古倾向是对于明末复社诸人学风复古的继承。这个时期的散文作者，一派深于史学，为学讲究经世致用，为文承史家的杂文传统，如顾炎武、黄宗羲、王夫之等；另一派是侯方域、魏禧、汪琬等，侯、魏二人都有易代之际的纵横之气，为文不甚顾忌。汪琬与侯、魏并称，而文风不同。\n\n清初诗人主要有三大群体，一是顾炎武、王夫之、吴嘉纪、屈大均等，都是遗民诗人，所作多感叹兴亡；二是钱谦益、吴伟业等，诗多感伤身世；三是宋琬、施闰章等，已是“国朝”诗人，叙事纪实，已少故国之思。此外还有国朝词人纳兰性德，叙事抒情，别有寄寓。从总的倾向来看，这时的诗歌在思想倾向上仍是保持着早期的特点。\n\n（二）小说多寄托情感，表达个人情思\n\n这一时期的小说成就较高的有《聊斋志异》《水浒后传》和《醒世姻缘录》等。《聊斋志异》假语鬼狐，以寄“孤愤”；《水浒后传》作者以“遗民”自居，其中饱含故国之思。\n\n（三）戏剧表达注重表达情感，但已有远离现实的趋向\n\n清初戏剧最著名的是李玉的《清忠谱》，也表达了故国之思；而李渔的《风筝误》诸作，远离现实，其艺术倾向，已接近于“盛世”。\n\n二、清代中期（康熙中年到乾隆晚年）\n\n（一）散文文风向多方向转变\n\n（1）桐城派\n\n适应“盛世”的政治需要，产生了以桐城派为代表的盛世之文。桐城派开创者方苞曾受《南山集》案牵连，侥幸获救，此后为文或选文，便一本皇家谕旨，“阐道翼教”“助流政教”，不遗余力。在方苞之后，有刘大櫆，再后，又有姚鼐。二人都继承了方苞的文统。尤其是姚鼐，为文主张兼义理与考证。\n\n（2）阳湖派\n\n阳湖派兴起于乾隆晚期，作者有恽敬、张惠言等。他们为文，曾受桐城影响，但思想倾向有所不同。恽敬为文，多抒怀才不遇之感。张惠言为文，对于现实，亦多不满。\n\n（3）袁枚、郑燮等富有明代小品散文风采的创作\n\n郑燮、袁枚生当乾隆盛时，正值乾、嘉学派和桐城文派并盛之际，却都不为官方经学，亦不为桐城古文。\n\n（4）骈文复兴\n\n正当桐城古文不可一世之时，又有汪中、洪亮吉、孙星衍等写作骈文。汉语文章由骈而散，又由散而骈，以规律而言，亦体现发展变化。汪中号为“狂生”，一生不遇，独以文名。\n\n（二）诗歌主张多样化\n\n（1）神韵说\n\n以王士禛为代表的“国朝诗人”的作品，已无早期的“遗民”之声，而为“盛世之音”。王士祯提倡诗之“神韵”，有如方苞之提倡文章“义法”，对于一代之诗影响亦大。与其持同一创作理念的还有朱彝尊、查慎行、赵执信等。\n\n（2）格调说\n\n沈德潜标举“格调”，提倡“温柔敦厚”的诗教。他编选《唐诗别裁》《明诗别裁》等一系列的诗歌选本，对于一代诗风，也极有影响。\n\n（3）性灵说\n\n袁枚、赵翼、蒋士铨等的理论和创作，与王士祯、沈德潜又有不同。尤其是袁枚，他提倡“性灵”，主张抒写个人情性。他的一些作品，已不似盛世之声。\n\n（4）肌理说\n\n翁方纲提倡“肌理”，以学问为诗。这样的主张，与姚之讲“以考证助文”颇为相似。\n\n（三）戏剧创作以写情为线索贯穿历史\n\n清代中期产生了两部戏剧。一是洪昇的《长生殿》，一是孔尚任的《桃花扇》。两剧都以写情为线索而贯穿历史。《桃花扇》一剧且涉及明末之史，康熙盛时，文尚不甚严，而且朝廷已在褒扬抗清的忠义之士，在这样的政治气候之下，《桃花扇》表彰史可法，寄寓兴亡之慨，也就无所违碍。\n\n（四）小说注重开掘世态人情\n\n清代中期产生了两部小说巨著。一是吴敬梓的《儒林外史》，一是曹雪芹的《红楼梦》。《儒林外史》托言明事，实写现实，对于世风士风之讽刺，是前所未有的。《红楼梦》不讳言情，实在愤世，对于世态人情，开掘之深，揭露之广，更是空前的。\n\n三、清代后期（乾隆晚年到道光二十年）\n\n从嘉庆初年到鸦片战争的几十年间，世态有大变化，文学也有变化。\n\n（一）散文发展停滞\n\n这一时期桐城派的晚辈可称者，有管同、梅曾亮、方东树、姚莹等。这些作者虽继桐城文统，但“阐道翼教”，已经没有实效了。\n\n（二）诗歌创作多感伤身世，不满现实\n\n这一时期的诗人舒位、王昙、彭兆荪等，感伤身世，更加不满现实。\n\n（三）常州词派出现，以词论世\n\n清代词人，前有陈维崧、朱彝尊、纳兰性德，后有厉鹗、张惠言，百余年间，代有作者。到了中后期，形成了常州词派。周济生当此际，以词“论世”，主张“诗有史，词亦有史”，“感慨时事，系怀君国”，不止于自伤身世而已。\n\n（四）小说创作注重学问，表现出突破传统思想的迹象\n\n清代后期小说可称者，有李汝珍的《镜花缘》。作者有意以学问为小说，颇与翁方纲之以学问为诗相似。但其书写于此际，不满现实而放言海外，于世态人情，亦多愤慨。其中尊重女权，尤能突破传统之见，这在当时也是新的思想特点。","keywords":"清代初期 复古倾向 寄托情感 表达情思《聊斋志异》清代中期 散文 桐城派 阳湖派 袁枚 郑燮 骈文复兴 诗歌 神韵说 格调说 性灵说 肌理说 戏剧《长生殿》《桃花扇》小说《儒林外史》《红楼梦》清代后期 散文发展停滞 常州词派《镜花缘》","note":"这一部分是对清代文学整体发展脉络的梳理，虽然在考查中不会出现这样的题目，但对我们掌握重点知识有很大的帮助。其中我们可以看到，对于清代文学的考查其实比较集中于清代中期，也即康雍乾时期，一些比较重要的文学主张、文学流派和文学作品都出自这一时期。此外，需要提醒大家的是，本题李凡关键词中涉及的内容如桐城派、神韵说等都很可能在名词解释中出现，大家要重点掌握。"},{"id":"406","stars":"★★★","title":"试分析清代文学的基本特征（26湖南师范大学）","body":"清人对文学传统全面继承，并将其熔炼、贯通，在此基础上，清代文学形成了自己独具的特征，具体表现在以下方面：\n\n一、集历代文学之大成\n\n（一）各类文体都拥有众多的作者，写出了大量的作品，数量之多超过以往各代。据《清人别集总目》《清人诗文集总目提要》等记载，清人别集总数要超过四万种，而《中国丛书综录》著录的唐代诗文别集仅三百馀种，宋代诗文别集六百馀种。\n\n（二）各类文体曾有过的类型、作法，历史出现过的风格，清代作者大都承袭下来，或学习效法，或独辟蹊径，达到很高的造诣。如钱谦益“以杜、韩为宗，而出入于香山、樊川、松陵，以迨东坡、放翁、遗山诸家”；朱彝尊初学唐人，后追山谷。\n\n二、古典文学再度辉煌：文学传统精神和古典审美特征的复归与昂扬\n\n（一）清诗继承和发扬了缘事而发、有美刺之功、行“兴、观、群、怨”之用的传统精神和审美艺术的特征。吴伟业的歌行诗，专取明清之际关乎兴亡之人事，诗作叙事活脱、词藻富丽、情韵悠然。王士禛的神韵诗，将传统诗歌尚含蓄蕴藉的特征推向了极致。可以说中国诗的传统精神和古典审美特征，在清代又一次获得了发扬。\n\n（二）清词复归雅道，成为彷徨苦闷中的文人委婉曲折地抒写心曲的方式，出现了地方性词人群和大型唱和活动，以陈维崧为宗主的阳羡词派、朱彝尊为领袖的浙西词派（两次）形成，呈现出“中兴”局面。陈维崧的登临怀古词，纳兰性德的出塞悼亡词，足称大观。清人词无论从规模或成就上讲，都足称大观，再次显示并发展了词的特异的抒情功能。\n\n（三）文人以骈文为寄托才情的文事，使骈文复兴，要求恢复文章艺术之美。汪中的骈文《哀盐船文》堪称代表。\n\n三、新兴文体的飞跃：雅化倾向与雅俗并存互渗\n\n（一）戏曲的创作更加活跃\n\n清代涌现出了《长生殿》和《桃花扇》两部杰作。正统文人如吴伟业、王夫之、尤侗、嵇永仁等，所作传奇、杂剧多取历史故事加以随意虚构幻化，寄托个人的情感、心迹，加重了案头化倾向；另一些作者注重戏剧性，多是利用巧合、误会、阴错阳差制造生动的情节，李渔是这类剧的能手。\n\n（二）清代小说迈入了独创期\n\n清代小说作家面对现实人生，将平凡的生活变成真实而有审美内蕴的小说世界，于是吴敬梓创作了《儒林外史》，曹雪芹创作了《红楼梦》。拟话本小说贴近了实际生活，却渗入了文人意识；讽世的气味加重了，却缺乏艺术的酿造，并且愈来愈趋向伦理道德的说教。爱情婚姻小说雅化，蜕变为才子佳人小说。","keywords":"集大成 各类文体数量超过以往各代 各类文体类型、作法大都承袭下来 古典文学再度辉煌 文学传统精神 古典审美特征 新兴文体的飞跃 雅化倾向与雅俗并存互渗","note":"清代是中国古代文学史的最后一个阶段，在此之前，中国的诗歌、散文、小说和戏剧都经历了长足的发展，具有了丰厚的历史积累，清代文学的发展就是建立在这一基础之上。大家可以从这一点出发，去理解清代文学的整体特征，其中尤其要注意的是“集大成”这一特点。"},{"id":"407","stars":"★★★","title":"试述清初遗民诗人诗歌的主要内容","body":"清初遗民诗是“不幸”时代的产物，共同的时代苦难、相似的人生处境与处世态度使遗民诗歌在主题取向上呈现出一些共同的特征，具体表现在以下方面：\n\n一、感念乱离，心系民瘼\n\n清初遗民诗人的创作生活多始于明之季年，一直持续到清朝建立之后。晚明社会政治的腐败、官吏的贪暴、赋役的繁重、兵士的扰民，以及种种天灾人祸均聚于遗民诗人笔下，在他们的如实描写与无情揭露中，我们不仅清晰地看到了晚明社会的衰亡过程，而且对于天灾人祸下老百姓饥寒交迫、流离失所的悲惨遭遇也有了深刻的了解。与此同时，清初遗民诗真实而生动地记录了明清之际的战事，尤其对清廷的残酷暴行进行了猛烈的揭露和抨击，对于普通百姓及广大士人的抗清行为给予了充分的肯定。\n\n二、眷怀故国，志在恢复\n\n明遗民诗人以故国的孤臣孽子自居，痛悼明王朝的灭亡，但这个群体中的多数成员并未因此而一蹶不振，虽然处在国亡家破的悲愤氛围之中，却绝无萎靡消沉的情绪。清初明遗民诗也因此而呈现出一种慷慨悲壮、昂扬向上的主调。他们将故国旧君看作民族文化与民族传统的象征，在亡国之恨中渗入了对华夷之辨的理性认识，这种亡国之思是在匡扶社稷的主体道德力量的支配下，深植于主体内心的一种文化情结的体现。\n\n三、流连山水，寄情怡性\n\n清初遗民于故国覆亡之后，无论游走大江南北图谋恢复者，抑或隐居家园坚守志节者，均徜徉于山水田园之中。游走大江南北，饱览各地山川风物者，如顾炎武、屈大均、阎尔梅、王弘撰等人，其山水诗中的山水景物或与怀古情思相融合，或与个人心态相联系，然描写山水并非诗人主旨。而那些足不出户或很少远行的遗民，却完全借家乡山水来陶情怡性，在他们笔下，各地山水风物均呈现出迷人的风采。\n\n四、亲情与友情\n\n清初遗民诗群的形成本就与遗民诗人间的联系与互动密切相关，战争中结下的友谊，战乱之后的同声相求，孤独晚境与流走他乡时对友情的渴求......都使中国古代文学中传统的友情主题在遗民诗中又一次引起了强烈的共鸣。而清初遗民诗中表现亲情的作品虽不多，但却极为珍贵。尤其是一些“寄内”“悼内”之作，更可见诗人情感世界之别一层面。亲情与友情，是清初遗民诗歌主题取向中最可珍视的两个方面。\n\n【李凡关键词：感念乱离 系心民瘼 眷怀故国 志在恢复 流连山水 寄情怡性 亲情与友情】","keywords":"","note":"在古代文学史中，有两个时期的遗民诗值得我们去注意，一个是宋代遗民诗，一个就是明代遗民诗。而相较于宋代遗民诗，明代遗民诗的格调相对更加昂扬一些，对王朝灭亡原因的认识也更深刻一些。相关内容可以参考张兵《论清初遗民诗群创作的主题取向》，具体资料可以在李凡文学正版群领取。"},{"id":"408","stars":"★★","title":"试分析钱谦益被称为“清诗的开山宗匠”的原因","body":"钱谦益是诗坛上风气转变的重要人物，不仅否定七子派的模拟之风，而且提出了自己的学诗主张，对于清代诗歌的发展产生了重要的影响，具体表现在以下方面：\n\n一、推动了清代诗学的建设\n\n钱谦益是诗坛上风气转变的重要人物，自觉地致力于清诗学建设，嗤点前贤，对明代复古派和反复古派进行尖锐的批判，也各有所取，对复古派取其借鉴古人精神，但不囿于“汉魏盛唐”，剔除模仿形似；对反复古派“取其申写性灵”，摒弃其“师心而妄”“轻才寡学”。他强调时代、遭遇和学问的重要性，建立起“诗有本”的真情论，以真诚的具有时代意义的感情为核心，达到性情、世运、学养三者并举。他主张转益多师，兼采唐宋，广收博取，推陈出新，对补救明七子模拟盛唐与公安、竟陵的粗疏草率、幽深孤峭，确立有清一代诗风，起了“导平先路”的作用。\n\n二、诗歌艺术取得了突出的成就\n\n（一）风格多元化\n\n钱谦益的诗歌创作在明末已基本摆脱七子派的影响，风格呈现为多元状态，带有唐、宋兼学的倾向。其中古体诗学宋的倾向更明显一些，表现为散文化的笔法和自由畅达的辞气。入清以后，钱谦益诗由以前的清婉秀丽、萧散流利一变而为沉厚凝重、凄怨悲怆。\n\n（二）各体兼擅，尤工近体，推动了七律的变革\n\n钱谦益所作诗歌叙事抒情，各体兼擅，尤工近体，七言律诗情词怆恻，沉雄苍凉，入杜堂奥，学得神髓，长篇和组诗动辄几十韵和上百韵的有数十首之多。七律在初唐只用于应制酬答，杜甫以他集大成的才力学问对这一诗体开疆拓宇，使之可以容纳广泛题材，尤长于抒发政治内容，形成七律定型后题材的一变；宋人以他们横放杰出的才能，议论风生的特点把七律渗透到社会生活的各个方面，是七律题材的再变；钱谦益用七言律诗纪史和纪传，可以说是七律诗体在题材上的第三变。\n\n三、求贤若渴、重视人才\n\n钱谦益又延引后进，奖掖新人。王士禛、施闰章、宋琬、冯班等人都是由他提携成名。曾受其亲炙的还有一批诗人。受钱谦益的影响，在其家乡常熟产生了虞山诗派。\n\n正因为钱谦益在诗歌领域取得了重要地位，所以被称为清诗的开山宗匠。","keywords":"推动清代诗学建设 艺术成就 风格多元化 各体兼擅 尤工近体 推动七律变革 求贤若渴 重视人才","note":"钱谦益的为人一直受到争议，但其在诗歌创作理论和艺术上还是取得了一定的成就，并且提携了一大批新人，是明代诗歌向清代诗歌过渡中的关键人物，这一点我们还是要稍微关注一下的。"},{"id":"409","stars":"★★★","title":"试分析吴伟业诗歌创作特征","body":"从清初开始，叙事诗的境界大开。吴伟业以不同凡响的创作开辟出清初叙事诗发展的全新局面，他的诗歌创作，主要具备如下特征：\n\n一、思想内容\n\n（一）以诗存史\n\n围绕黍离之痛，吴伟业以明末清初的历史现实为题材，反映山河易主、物是人非的社会变故，描写动荡岁月的人生图画，志在以诗存史。这类诗歌约有四种：\n\n（1）以宫廷为中心，写帝王嫔妃戚畹的恩宠悲欢，引出改朝换代的沧桑巨变，如《永和宫词》《洛阳行》《萧史青门曲》《田家铁狮歌》等。\n\n（2）以明清战争和农民起义斗争为中心，通过重大事件的记述，揭示明朝走向灭亡的趋势，如《临江参军》《雁门尚书行》《松山哀》《圆圆曲》等\n\n（3）以歌伎艺人为中心，从见证者的角度，叙述南明福王小朝廷的衰败覆灭，如《听女道士卞玉京弹琴歌》《临淮老妓行》《楚两生行》等。\n\n（4）以平民百姓为中心，揭露清初统治者横征暴敛的恶政和下层民众的痛苦，类似杜甫的“三吏”“三别”，如《捉船行》《芦洲行》《马草行》《直溪吏》和《遇南厢园叟感赋》等。\n\n（5）一些感愤国事，长歌当哭的作品，如《鸳湖曲》《后东皋草堂歌》《悲歌赠吴季子》等，几乎可备一代史实。他这种以“诗史”自勉的精神，使他放开眼界，“指事传词，兴亡具备”，在形象地反映社会历史的真实上，取得突出的成绩，高过同时代的其他诗人。\n\n（二）痛失名节的悲吟\n\n以清顺治十年出仕为标志，在灵与肉、道德操守与生命保存之间，吴伟业选择苟全性命，堕入失节辱志的痛苦深渊，让自赎灵魂的悲歌沉挚缠绵，哀伤欲绝。《自叹》《过吴江有感》《过淮阴有感》、组诗《遣闷》等，忏悔自赎，表现悲痛万分的心情。这类诗歌对我们认识在理想与现实、感情与理智的困扰与冲突里挣扎的人生悲剧，有着启迪作用。\n\n二、“梅村体”\n\n吴伟业最大的贡献在七言歌行，在继承元、白诗歌的基础上，自成一种具有艺术个性的“梅村体”。它吸取白居易《长恨歌》《琵琶行》和元稹《连昌宫词》等歌行的写法，重在叙事，辅以初唐四杰的采藻缤纷，温庭筠、李商隐的风情韵味，融合明代传奇曲折变化的戏剧性，在叙事诗里开出新境界。吴伟业的“梅村体”，主要具备如下特征：\n\n（一）叙事方式以人物为中心\n\n吴伟业的“梅村体”叙事诗通过一两个中心人物来串联众多的事件，构建一个完整的情节，人与事相得益彰。由于事件和人物按某种思路水乳交融地结合在一起，作品便显得血肉丰满、引人入胜。\n\n（二）戏剧性的结构\n\n吴伟业的“梅村体”在结构方面明显借鉴了戏剧的叙事技巧，包括情节设置悬念迭出、突然转折和感情描写悲喜交加、大起大落等。比如《圆圆曲》的开头，对男女主人公的“相见”只是稍稍一点，不细作交代，便转入陈圆圆坎坷身世的叙述。这种特点也不同程度地表现在《洛阳行》《楚两生行》《临淮老妓行》《雁门尚书行》《听女道士卞玉京弹琴歌》等作品当中。\n\n（三）“沉博瑰丽”的风格\n\n梅村体作为清初最具创变特色的诗体，其语言风格十分独特。吴伟业对前人采取了综合继承的态度，一方面力求典雅，大量运用典故；另一方面，大胆借鉴民歌的艺术手法，不避俗辞，形成了“沉博瑰丽”的独特风格。\n\n（四）严格按照史实来结撰\n\n与元、白的叙事诗内容往往掺有虚构、幻想成分有所不同，吴伟业的叙事诗严格按照历史事实来结撰，有的史学著作引用其诗证史，吴伟业亦因此而有“一代诗史”之称。","keywords":"思想内容 以诗存史 痛失名节的悲吟“梅村体”叙事方式以人物为中心 戏剧性的结构 沉博瑰丽 按照史实来结撰","note":"吴伟业诗歌最大的特色是喜欢摹拟唐人的格调，但却走出了自己的特色。他的诗歌风格，很明显可以看到唐代诗人的影子，比如白居易、李商隐等等，大家可以联系唐代相关诗人的风格特色，进行比较记忆。吴伟业的“梅村体”是名词解释中高频出现的内容，有时甚至会出大题，比如25年南京师范大学就考查到了“吴伟业‘梅村体’的艺术特征”这道题目，大家要多多关注。"},{"id":"410","stars":"★★","title":"试述纳兰性德词的创作特征","body":"纳兰性德在他的短暂生涯里，留下了三百多首婉丽秀隽，清新超逸的小令长调，字里行间灼灼真情天然流动，用情至深而又用情至真，天然清新不加雕饰，以清水芙蓉之姿荡涤清初词坛，并以自然真切之风卓立于世。他的词作，主要具有如下特征：\n\n一、以爱情词为主，善用白描，真挚自然\n\n纳兰性德论词主情，崇尚入微有致。爱情词低回悠渺，执著缠绵，是其词作的重要题材。他善于运用白描笔法，不事雕琢，运笔如行云流水，纯任感情在笔端倾泻，平常地道眼前景，真率地抒胸中情，以情节、形象的细致传神带动情感的深沉热烈，因此真挚自然，婉丽清新。不仅如此，他还吸收李清照、秦观的婉约特色，铸造出个人的独特风格。《蕙风词话》的作者况周颐甚至把他推到“国初第一词人”的位置。\n\n二、意境哀婉\n\n纳兰词以纤柔善感之词来感受世间万物，使愁情抒写成为其词的主旋律，其追念亡妻的悼亡之作哀感缠绵，其他的写情之作也夹杂了失恋或离别之苦，充满悱恻伤感的气氛。其咏怀词或叹繁华易逝，或伤飘零无依，多陈暗淡的身世之感。出塞之作悲壮苍凉，情绪低沉，包含了缠绵伤感的思家之苦和世事无常的兴亡之叹。赠友诸作也常抒发人生的失意之感，饱含酸楚之味。纳兰性德厌倦仕宦生涯，产生“临履之忧”的恐惧和志向难酬的苦闷，再目睹官场的腐败，难免宣泄抑郁的心情，如他所写的《蝶恋花·出塞》，缀景荒凉，设色冷淡。个人命运的“幽怨”和回顾历史引发的惆怅同悼亡的心灵创伤融为一体，酿成哀郁凄婉的情调，贯穿他的全部词作。\n\n三、个性鲜明、玲珑剔透的意象\n\n纳兰词意象的个性十分鲜明，作者通过独特的心灵感受创造了诸如冷雨、暮雨、烟柳、孤灯、征雁、残月、残梦、疏帘、画桥、浮萍等凄伤色彩浓厚的意象群，它们互相呼应，构成了纳兰词特有的艺术氛围。纳兰性德的独特之处还在于他没有受到世俗社会的侵染，保持了相对纯真的心胸，因此，他的意象就显得特别玲珑剔透，脱凡超俗，属于“纯任性灵”的表现。","keywords":"以爱情词为主 善用白描 真挚自然 意境哀婉 个性鲜明 玲珑剔透","note":"纳兰性德随着清词中兴之势而登上词坛，与陈维崧、朱彝尊鼎足而立，用短暂的生命发一声长叹，道尽世间凄凉失意，将清代词的创作推向繁荣与鼎盛，以“别样清幽，自然标格”之词风独树一帜，诚无愧为“满洲第一大词人”之称号，因此其相关内容虽然考查频率不高，但还是要了解一下。"},{"id":"411","stars":"★★★","title":"简要梳理清初到清中叶主要诗派的理论主张","body":"从清初到清中叶出现了众多诗派，其理论主张都各有各的特色。清初有钱谦益为首的“虞山派”，以吴伟业为首的“娄东派”，但值得重视的诗学理论有王士禛的“神韵说”，清代中叶则有沈德潜的“格调说”，翁方纲的“肌理说”，袁枚的“性灵说”。\n\n一、神韵说\n\n王士禛是清初继钱谦益之后的诗坛盟主。他论诗以“神韵为宗”。“神韵”本于唐司空图的“自然”“冲淡”之说，而又发挥了宋严羽的“妙悟”“兴趣”之说，以“不着一字，尽得风流”为诗的最高境界。用较通俗的话解释“神韵”，是指“神彩韵味”而言，就是写诗要境界清远，意味含蓄，不露人工雕琢的痕迹；往往也把那些风致清新、明丽工稳、音节自然流利的小诗所表现出来的诗情画意叫做“神韵”。王士禛反对学习盛唐激昂慷慨、豪荡雄壮、浪漫狂放的诗，认为那是自为“高华”“壮丽”“大帽子”。他所推崇的是王维、孟浩然，韦应物、柳宗元一派的作品。其理论的真正社会意义是不大的，对诗歌反映现实生活有很大束缚性。他本人的创作实践表明，“神韵说”的提出，标志着清初诗风从现实主义到形式主义的转变。\n\n二、格调说\n\n沈德潜是康熙到乾隆年间诗坛上影响较大的诗人。他论诗标榜“格调说”。他认为诗人“立言”要“怨而不怒”“温柔敦厚”，而在方法上则要讲求比兴，要蕴蓄不露。要求诗人不要揭露社会矛盾，这就脱离了中国诗歌的现实主义传统，“格调说”是康、乾盛世的产物，是一种助长脱离现实主义的诗风的理论。\n\n三、肌理说\n\n翁方纲论诗主张“肌理说”，他是嘉庆年间诗坛上的一位领袖人物。他宗法宋诗，受到了当时考据学盛行的影响，他认为“为学必以考据为准，为诗必以肌理为准”。他认为把“义理”“文理”“肌理”三者统一起来，才能够写出好诗。这一诗派是当时的考据学派统治之下的产物，这派诗人所写的诗，大都是一些学问诗。\n\n四、性灵说\n\n袁枚是一个思想比较解放的诗论家和诗人。他论诗主张“性灵说”，主张在创作中提倡写个人的“性情遭际”，写个人的灵感。根据这一标准，袁枚对各种形式的诗风进行了大胆的批判。他反对盲目的拟古，认为应以“工”“拙”为标准，不应以“古”“今”为标准；他批判“格调说”所宣扬的“温柔敦厚”的诗教是不可信的谬论；他讽刺“学问诗”是“填书塞典，满纸死气”的僵化物；他批判王士禛的“神韵说”，认为追求虚无缥缈的“神韵”必然脱离“真性情”，是“假诗”。袁枚的诗论，显然深受明末公安派的影响，但他的理论比公安派要具体、系统得多。\n\n【李凡关键词：神韵说 格调说 肌理说 性灵说】","keywords":"","note":"清初到清中叶主要诗派的理论主张，主要掌握好清中叶王士禛、沈德潜、翁方纲和袁枚等人的主要诗派及其理论主张。值得注意的是袁枚的理论主张具有深刻的思辨性，是对前三者的诗派的批判，他的思想较为解放，这与清中叶繁荣鼎盛的背景有关。这一部分涉及的这几种理论主张，都是名词解释中高频出现的内容，大家要注意一下。"},{"id":"412","stars":"★★","title":"试述王士禛的诗歌理论和创作特征","body":"王士禛是钱谦益之后的诗坛领袖，对清代诗歌的发展产生了很重要的影响，其诗歌创作理论与创作特征主要表现在以下方面：\n\n一、诗歌理论：神韵说\n\n王士禛在诗歌理论上主要接受南宋诗人严羽的影响，他提出“神韵说”，以“羚羊挂角，无迹可求”和“不着一字，尽得风流”作为诗的最高境界，这实际上是把那种比较抽象的神理韵味作为衡量诗歌好坏的唯一标准，进而提倡一种清新淡远、含蓄蕴藉的诗风。所谓神韵，是要求诗歌具有含蓄深蕴、言尽意不尽的特点。以此为宗旨，王士禛对清幽淡远、不可凑泊而富有诗情画意的诗特别推崇。此外，他编辑了《唐贤三昧集》，选录王维、孟浩然以下四十二人诗作作为范本，继承了王孟韦柳一派的诗风，主要着眼于境界的淡远和语言的含蓄，但不重视思想内容，更绝少反映社会生活。\n\n二、创作特征\n\n（一）含蓄蕴藉\n\n王士禛的诗歌创作，早年从明七子入手，“中岁逾三唐而事两宋”，晚年又转而宗唐，但是在这三次转变中，提倡“神韵说”是贯穿始终的。在他的诗作中，风神独绝的神韵诗占了主流，尤其是模山范水、批风抹月的“山水清音”，冲和淡远，风致清新，继承王维、孟浩然一派的家数，含情绵渺而出之纤徐曲折，惨淡经营却不露斧凿痕迹，词句明朗圆润，音节流利跌宕，代表了其诗的主要成就和特色，发扬了古典诗歌含蓄蕴藉之美。\n\n（二）冲融清旷，以暖色调为主\n\n由于王士禛一生仕途顺利，而且力求超越现实政治，因而他没有任何苦闷和不平，更谈不上什么愤怒。同时，他虽然企求超越现实，却并不是因为政治上失意（他本来就缺少中国士大夫那种“自比稷契”的传统意识），因而对人生充满一种愉悦心情。所以，他的诗总是“冲融”得像春天的微雨，“清旷”得像中秋的凉风，而绝对不会闪现凄风苦雨的“鬼气”。他用暖色调的画笔去模山范水，寄托逸兴。\n\n（三）注重自我表现\n\n生活在清初日臻治平的康熙盛世，又已致身通显，王士禛本应像盛唐士大夫的昂扬奋发，追求功业；如果悼念亡明与家难，则应如中唐诗人的愤激不平；然而他都没有，而是“遁入了自己的艺术”。他只沉浸在个人小天地里，吟咏着自己的恬愉与忧郁。而这种恬愉与忧郁又都是淡淡的、轻轻的。他没有政治上的追求，却沉浸在美的享受里。","keywords":"诗歌理论 神韵说 创作特征 含蓄蕴藉 冲融清旷 以暖色调为主 注重自我表现","note":"王士禛的诗歌理论主要是“神韵说”，其诗歌风格清新淡远、含蓄蕴藉，主要袭承了王孟韦柳的诗风。不过，我们在关注其诗歌创作特点的同时，也要注意他的神韵说助长了脱离现实之风，巩固了统治者的统治，这与他当时处于清政权日趋巩固的年代有关。"},{"id":"413","stars":"★★","title":"试分析李玉《清忠谱》的思想内容和艺术特征","body":"李玉的后期作品，较多的是描写历史上的政治斗争事件，或从明末苏州社会生活中取材。其代表作《清忠谱》写的就是发生在苏州的真实事件，即天启年间苏州的一次民变。这部作品的思想内容和艺术特征，主要表现在以下方面：\n\n一、《清忠谱》的思想内容\n\n（一）希望清正廉明的政治追求\n\n剧中所写之事，大约是作者早年亲身经历，故取材“俱按事实，其言亦雅驯，虽云填词，目之信史可也”。这个剧本上承《鸣凤记》，下启《桃花扇》，成为我国戏剧史上迅速反映当代社会重大政治事件的著名作品之一。\n\n剧本反映了明末尖锐的反阉党斗争，刻画了周顺昌刚直耿介、坚强不屈的性格，歌颂了颜佩韦等正义纯朴的市民群众以及他们英勇斗争和从容就义的高贵品质，对罪恶滔天的阉党表示了莫大的愤慨，从而写出了广大民众希望清正廉明的政治追求。\n\n（二）对市民群众历史地位的认识和评价\n\n剧本刻画了颜佩韦、杨念如、周文元、马杰等九位英雄形象，虽略显单薄，但把这种“一生落拓，半世粗豪，不读诗书”的市井人物，塑造成举足轻重的英雄形象，在戏曲中还是第一次。作者特别刻画了他们那种鲁莽刚直的性格和行侠仗义、惯\n\n打抱不平的作风。这种对市民英雄的热情歌颂，表明了作者对市民群众历史地位的认识和评价。这正是李玉创作思想中最值得肯定的地方。\n\n二、《清忠谱》的艺术特征\n\n（一）善于利用有限的舞台而表现广阔的民众斗争场面，善于把群众与个人、正面人物与反面人物、明写与暗写、前台与后台很好地结合起来\n\n如“闹诏”一出，就写了一般民众的愤怒情绪，也有颜佩韦等人的英勇行为，还有毛一鹭等魏党爪牙的凶恶嘴脸，并用书呆子刘羽仪的胆小怕事作为衬托，有前台的群情沸腾，也有幕后的开读诏书，眉目清晰，层次井然，使这一头绪纷繁的事件，被描述得有条不紊，表现出一种轰轰烈烈的气氛。因此，就戏曲的发展来看，能够把民众斗争场面成功地搬上舞台，这是李玉对戏剧艺术的主要贡献之一。\n\n（二）语言简朴，不假文饰，而又富有个性\n\n《清忠谱》的成功还在于将纷繁的历史事件，经过艺术的选择、提炼，着意表现人物的性格精神，构成了谨严有序、形象鲜明又有激情贯注于其中的艺术世界。","keywords":"思想内容 清正廉明的政治追求 市民群众历史地位的认识和评价 艺术特征 利用有限的舞台表现广阔斗争场面 语言简朴有个性","note":"李玉的《清忠谱》是十分具有代表性的一部作品，反映了当时市民群体的朴素愿望，并且取得了不俗的成就，可以说是苏州派戏剧创作的典型代表。需要注意的是，李玉某种程度上也属于明代遗民，其戏剧创作因此也分为前后两期，在表现内容上发生了很大的变化，相关题目可以在李凡文学正版群中查阅。清初剧坛主要有专业化剧作家、文人化剧作家以及戏剧至上主义者三类剧作家，相关题目可以在李凡文学正版群领取。"},{"id":"414","stars":"★★★","title":"试分析苏州派的艺术特色","body":"以李玉、朱素臣、朱朝佐、张大复、毕巍、丘园等人为核心的苏州派是明清之际的一个主要戏曲流派，他们既不同于吴江派的重视音律和临川派的追求词藻，更不同于骈俪派的堆砌雕琢。他们主要有以下特色：\n\n一、注重观众的欣赏需求\n\n苏州派虽没有留下戏曲理论著作，也不标榜门户，但通过他们的剧作，可知他们都崇尚本色，主张“本色填词不用文”。强调观众，特别是市民欣赏的需要，认为写戏者“要博得贤愚共赏，那怕他顾曲周郎说短长”。他们改变了“十部传奇九相思”的传统，大量写政治戏和时事戏，借传奇写作以求影响世道人心，从而提高了传奇的价值。他们把写戏当作一项严肃的工作，强调真实性，“笑有声，哭有泪，文章真率动人宜”。\n\n二、以写戏为主业，专业性强，数量丰富\n\n苏州派剧作家的身份和地位不高，既未出仕，也不是诗人或文学家，写戏不是他们的“余事”，而是他们一生的专业，故他们的剧作数量丰富。苏州派主要成员的剧作大多在数十部以上。创作虽多，但刊刻者极少，流传的大多是梨园手抄本，这证明他们生活贫困，无资刊刻。他们的生活、创作情况，近乎元代书会才人。\n\n三、舞台经验丰富\n\n苏州派剧作家大都是一些“偶倡优而不辞”的剧作家，故精通曲律，熟悉艺人，富有舞台实践经验。他们的剧本完全是场上之曲，适合舞台特点，便于搬演。对于舞台调度，过去的一些剧作家绝少考虑，而他们却能精心设计。\n\n四、注重塑造下层人物\n\n苏州派剧作家多出身下层，故注重塑造下层人物，包括奴仆的崇高形象，这些形象不可讳言宣扬了奴隶道德，但作者的命意乃在于表彰奴仆的高风亮节，为下层人物扬眉吐气。从明清易代的这一时代背景来看，苏州派作家表彰奴仆，宣扬忠义，固然反映出苏州派剧作家出身社会底层，同时多少也包含有借以反衬那些屈节降吏的腼颜事仇的意思。\n\n五、相互联系，经常合作写戏\n\n李玉的《清忠谱》就有毕巍、叶时章、朱素臣等四人“同编”，《一品爵》《埋轮亭》由李玉、朱素臣合写。《四大庆》《四奇观》也是朱佐朝、朱素臣等人合撰。李玉的《北词广正谱》、张大复的《寒山堂曲谱》都得到同派人的协助。","keywords":"注重观众欣赏需求 以写戏为主业 专业性强 数量丰富 舞台经验丰富 注重塑造下层人物 合作写戏","note":"苏州派作家出身和思想与元代书会才人作家相似，大家可以将二者联系起来共同记忆。总体来看，苏州派的戏剧创作不是文人化的、案头化的，而是市场化的，无论是从内容、形式，还是创作模式上，都与日趋壮大的市民群体联系密切，大家可以从这个角度去理解。"},{"id":"415","stars":"★★★","title":"试分析李渔对戏剧发展的贡献","body":"李渔是清初著名的戏曲理论家，提出了一系列戏曲理论，并亲身参与到戏曲创作之中，对清代戏曲发展产生了很重要的影响，具体表现在以下方面：\n\n一、揭示出了戏曲创作和表演的基本理论原则\n\n李渔在戏曲方面的贡献，尤在于所著的《闲情偶寄》一部戏曲理论，这本书系统地总结了中国有成熟戏曲以来的剧本创作和舞台表演两个方面的经验，揭示了戏曲创作和表演的基本理论原则。尤其是关于剧本创作，一改以往曲家首重词采或音律的主张，提出“结构第一”，具体原则为“立主脑”“减头绪”“密针线”等，也就是编剧最重要的是确立一个表现某种主题的主体事件，并步步扣紧这一主线展开剧情，使之成为一个前后关联、循序推演的整体。李渔的“结构第一”的理论，是针对明代传奇剧情节芜杂散漫的弊病而发，也是由于意识到了戏曲的戏剧本质特征。\n\n二、为喜剧的创作和喜剧理论的发展提供了经验材料\n\n李渔及其先行者和后继者，虽然没有作出堪称杰作的作品-他们的剧作大都是在男女风情的范围内变化翻新，格调不高，表现出媚俗的倾向-但作为明清间的一种戏曲流派，也代表了一种以娱乐为宗旨的文学倾向，是不应忽视的。在他们的难称优秀的剧作中运用了多种喜剧手法，善于发掘生活中的喜剧性，广泛使用意外性、偶然性、人物的偷换、冒充、误会、错认、逆转、突变、剧中剧等一系列喜剧手法，使情节关目出其不意，变化多端，让观众常常陷入悬念之中。同时又处处流露出幽默、滑稽、诙谐的喜剧风格，充满了笑料，使观众获得娱乐和享受。这为喜剧的创作和喜剧理论的发展提供了经验材料。\n\n三、讲求结构创作，重视宾白的作用\n\n李渔的剧本在构思布局、关目情节等方面，能够“随时更变”“变旧为新”。他的作品大多情节曲折，关目新颖，引人入胜，结构巧妙，能摆脱前人窠臼，独具一格。李渔与历来作家只重曲辞、不重宾白的做法不同，他比较强调宾白的重要地位。他确实是把宾白“当文章做，字字俱费推敲”。所以，在他的十个剧本中，宾白的比重及地位都提高了。这正如他自己所说的：“传奇中宾白之繁，实自予始。”","keywords":"揭示基本理论原则 为喜剧创作和理论发展提供经验材料 讲求结构 重视宾白","note":"如果说以李玉为代表的苏州派主要是通过实践推动了清代戏曲发展的话，那李渔就主要是从理论上为戏曲发展指明了方向，推动了戏曲的发展。同时我们也可以看到，他们具体的创作方向是一致的，如重视观众，注意舞台性，这也代表了清初戏曲发展的总体趋势。"},{"id":"416","stars":"★★★★","title":"简答《桃花扇》的思想内容和艺术特色","body":"《桃花扇》是清代文学家孔尚任创作的传奇剧本，是一出叙写南明王朝兴亡的历史剧。其思想内容与艺术特色如下：\n\n一、《桃花扇》的思想内容\n\n（一）总结明朝覆亡的经验教训\n\n《桃花扇》以复社名士侯方域与秦淮名妓李香君的爱情故事为线索，集中地反映了明末腐朽、动荡的社会现实及统治阶级内部的矛盾和斗争，即作者所说的“借离合之情，写兴亡之感”，这里的“兴亡之感”，不仅表现在哀叹南明王朝的短促命运，更表现在企图指出明朝三百年基业为何覆亡的历史经验教训，作为后人的借鉴，这是全剧的主题思想。\n\n（二）揭露南明政权的腐朽无能\n\n《桃花扇》在描述侯、李故事的同时，也展开了对复社文人与阮大铖的斗争场面的描绘，揭露了被控制在马、阮手中的南明政权的腐朽无能：他们根本无心于朝政，无意于北伐，上下唯以荒淫享乐为能事，作品由此强烈指斥了权奸祸国殃民的罪行。\n\n（三）深刻的历史思索和人生哲理\n\n《桃花扇》并不以抨击南明政权为最终目的，而是以侯、李二人大彻大悟的出家作为他们劫后重逢之后最终的人生归宿，即用苦涩和失落取代了浅薄的认识和廉价的慰藉，使剧作具有更为深刻的历史纵深感和人生哲理感，没有落入大团圆的俗套，其立意远远超出了一般的历史剧和爱情剧。\n\n（四）反映了清初文人的心态\n\n《桃花扇》一剧具有很强的社会意义。从现实来看，《桃花扇》的思想指归表现了清初文人在阅尽社会统治的沧桑巨变后对社会政治失去信心而产生的逃避心理状态；从文化传统上看，它又是长期以来个体对社会的依附关系失去平衡后，人们难以承受因而产生恐慌失落心态的反映，从而揭示出清代文学感伤思潮内趋动力的一个重要侧面。\n\n二、《桃花扇》的艺术特色\n\n（一）历史的真实与艺术的真实\n\n《桃花扇》作为一部历史剧，具有强烈的历史真实感。为此，作者特在剧前列出《桃花扇考据》，有如大事年表，历数南明旧事及所据史料。作品的历史真实感具体体现在以下几个方面：\n\n（1）对历史面貌的总体把握\n\n全剧真实地描述出南明朝廷的腐败和志士仁人的忠烈，而且对于社会下层人物的忧国忧民之心也有真切的表现。剧中虽然没有明写清兵南下的情景，但其作为一种巨大的背景，时时处处皆在，并主宰着全部剧情的发展。尽管作品中也敷演儿女情长，风花雪月，但是，笼罩全剧的氛围，则是一代兴亡的慨叹，这正反映了南明特有的悲剧时代风貌。\n\n（2）大量真实的历史人物和事件\n\n《桃花扇》虽然人物形象众多，但大都人各一面。这显示出孔尚任对历史的尊重，如实写出人物的基本面貌。比如同是武将，江北四镇都恃武逞强，但行事、结局却不同；左良玉对崇祯皇帝无限忠心，但骄矜跋扈，缺少谋略。侯方域风流倜傥，有几分纨绔气，却关心国事。这其中也反映出孔尚任对人物性格的刻画较其他传奇作家有着更自觉的意识，要将人物写活。\n\n此外，剧中涉及的君臣将领，复社文人，均见诸史籍，就是歌伎、琴师，如李香君、苏昆生等，亦史有其人。例如侯方域之《李姬传》，就是一篇记写李香君原型的文章。“剧”与“史”融为一体，遂产生了“场上歌舞，局外指点”的艺术效果。\n\n（3）艺术再现\n\n《桃花扇》既不是历史教科书，更不是“实录”，而是艺术地再现一代兴亡的传奇。因此，它虽然以史为据，但又不拘泥于历史，这方面的最明显的例子，就是《沉江》一出所敷演的史可法的沉江殉节，显然与史实（被俘就义）完全不符。\n\n孔尚任对剧中各类人物作了不同笔调的刻画，虽然忠、奸两类人物的结局加了点虚幻之笔，以达到“惩创人心”的艺术目的，但总的说，作者的褒贬、爱憎是颇有分寸的，表现出清醒、超脱的历史态度。\n\n（二）新颖的构思\n\n《桃花扇》把一代兴亡的素材组织在侯、李爱情的情节线索之中，而离合之情与兴亡之感，又具化为一柄以血痕点染而成的桃花扇。这充分显示了作品在艺术构思上的独特成就，具体表现如下：\n\n（1）借离合之情，写兴亡之感\n\n《桃花扇》写侯、李的爱情是始终紧密结合明清之际的历史形势展开的。侯方域本身就是参加过复社文人反阉党的斗争和史可法幕府的人物，他的一连串舞台活动一定程度上比较集中地反映南明王朝内部的各种矛盾。李香君是秦淮名妓，通过她，又正好从侧面反映出南明王朝的苟且偷安、腐化堕落。\n\n（2）借物传情，以物寓意\n\n小小一把桃花扇，蕴涵了无比丰富的历史内容。它既是侯方域与李香君坚贞爱情和高尚情操的象征，亦是马、阮之流迫害复社文人，追求声色之乐，败坏明代江山的铁证。借物传情，以物寓意，是中国古代戏曲的传统艺术手法，但使一把桃花扇有如此丰富的蕴涵，则无疑是孔尚任具有独创性的巧妙构思，是他艺术天才的集中体现。\n\n（3）章法新出，直抒胸臆\n\n《桃花扇》全剧四十出，分为上、下本，各两卷二十出。但作者似乎感到，剧中的情节与人物，还不足以直抒胸中块垒，于是，在四十出之外，又有新的章法。在上本第一出之前有“试一出”《先声》；第二十出之后有“闰二十出”《闲话》。一“序”一“结”，借“老赞礼”“原锦衣卫堂官”之口，介绍兴衰战乱，抒发感叹哀衷。下本第二十一出之前，又有“加二十一出”《孤吟》，为下本之“序”。第四十出之后又有“续四十出”《余韵》，则是全剧之“结”，这两出中的“老赞礼”、苏昆生及柳敬亭，作为历史的见证人，作为《桃花扇》的观者，他们的“无端笑哈哈，不觉泪纷纷”，正表达了作者对历史兴亡发自肺腑的深沉痛切的感受。显然，这独特的四出戏，完全是为作者直抒胸臆而设，它有助于表达“兴亡之感”的主题。\n\n（4）词曲与说白的配搭\n\n孔尚任特别关注作为戏曲“微观结构”的词曲与说白的配搭。他认为，说白必须“详备”：“旧本说白，止作三分，优人登场，自增七分，俗态恶谑，往往点金成铁，为文笔之累。今说白详备，不容再添一字。”关于词曲，孔尚任强调不能“浪\n\n填”，而必须与说白相配搭。他指出，只有下列两种情况，才有填词的必要：一是“胸中情不可说，眼前景不能见者，则借词曲以咏之”；二是“一事再述，前已有说白者，此则以词曲代之。”而“应作说白者”与“已有说白者”，皆不必再填词曲。这样，在作品中词曲与说白既“各司其职”，又相互配搭，共同完成叙述故事情节，表达人物情感的任务。\n\n《桃花扇》完全实践了上述主张。一般来说，描摹环境气氛，表现内心情感时，多为词曲；叙述情节，交待事实时，多为说白。正因如此，《桃花扇》每出的词曲均以少而精取胜，长出之中，最多八曲；短出之中，有的只有四曲。从总体来说，较之一般传奇都少一些。\n\n（三）悲剧的语言\n\n（1）《桃花扇》是一部“借离合之情，写兴亡之感”的作品，剧中既有儿女情长，又有兴亡感叹。因此，其语言也就形成了优美温柔与慷慨愤激的统一。《传歌》《访翠》《眠香》诸出，写儿女情长，其曲文风格以柔美为主；《哭主》《誓师》《沉江》诸出，写军政事变，许多曲文带有激越的声情。总之，《桃花扇》的语言，与剧情是完全谐调一致的。\n\n（2）《桃花扇》作为一部历史悲剧，其语言风格的主导倾向，是愤激之中蕴涵着悲凉慷慨。例如《沉江》一出中史可法唱的〔古轮台〕：“走江边，满腔愤恨向谁言？老泪风吹面，孤城一片，望救目穿。”“长江一线，吴头楚尾路三千，尽归别姓。雨翻云变，寒涛东卷，万事付空烟。”既抒发了“老泪风吹面”的悲凉之感，又表现了“尽归别姓”的悲愤之情。《桃花扇》里塑造的老赞礼、苏昆生等形象，作为历史的见证人，兴亡的经历者，对于时代风云的感受尤其深刻。他们唱的曲词，就是作者直抒胸臆之作，更具有感叹兴亡的韵味。","keywords":"思想内容 借离合之情，写兴亡之感 南明政权的腐朽无能 历史纵深感和人生哲理感 社会意义 艺术特色 真实 构思 悲剧的语言","note":"《桃花扇》确是借离合之情，写兴亡之感，使读者或观众痛恨权奸的误国，叛将的投降，惋惜复社文人的沉迷，同情下层人民的反权奸斗争和爱国将领的宁死不屈。作者在作品里从爱国思想出发所表现的爱憎也基本是分明的。然而由于本身就是清朝的官吏，加上清朝统治的严酷，作者对当时的民族矛盾就只能采取回避的态度。他不仅称赞清兵“杀退流贼安了百姓，替明朝报了大仇”，还讴歌康熙圣朝的祥瑞，回避了清兵血洗扬州的惨剧，这就不能不在一定程度上影响了作品的思想成就。25年的考查中，河北师范大学就考查到“如何理解《桃花扇》借离合之情抒兴亡之感”这道题目，湘潭大学考查到了“请谈一谈孔尚任《桃花扇》的艺术特点”这道题目，大家灵活应用这部分内容，结合自己的理解作答就可以了。"},{"id":"417","stars":"★★★★","title":"试分析《长生殿》的思想内容","body":"《长生殿》以安史之乱为背景写唐明皇、杨贵妃的爱情故事。全剧五十出，前二十五出为上卷，主要敷演李、杨的爱情以及安史之乱、马嵬之变；二十六出以后为下卷，主要表现安史之乱后李隆基对杨玉环的思念及最后的仙界“重圆”。其思想内容相当复杂，具体体现在以下几个方面：\n\n一、歌颂理想爱情\n\n洪昇作《长生殿》，旨在“言情”。但洪昇之所谓“情”，除指“古今情场”的男女之情，还有更广泛的涵义。在洪昇看来，“臣忠子孝”，也是“情”字使然。当然，《长生殿》所写之“情”，主要还是李、杨的爱情，作者丰富和发展了这个传说故事的爱情主题。在洪昇笔下，李隆基情同少年，绝无老态，李、杨之间的爱情，热烈而执着。显然，《长生殿》里的帝王与妃子的爱情，富有浪漫色彩，是作者爱情理想的寄托。\n\n作品上卷从唐明皇杨贵妃《定情》发端，描写了他们奢靡的生活和爱情的发展。从声色之好到情重恩深，爱情日益趋向真挚。《密誓》是一个转折点，马嵬之变《埋玉》，经过了生死之别，爱情又上升到一个新的高度。下卷着重描写他们的刻骨相思，寄以更多的同情和赞美。《冥追》《闻铃》《情悔》《哭像》和《雨梦》等出，集中地描写他们死抱痴情、生守前盟的精诚。最后感动天地鬼神，让他们同登仙箓，升入忉利天宫，得到一个永久团圆的结局。\n\n在作者笔下，杨贵妃是一个值得同情的悲剧人物。作者突出了她对爱情的忠贞，有意地避过她和寿王、安禄山的关系，描写了她在宫廷中争恩擅宠的生活，成功地塑造了一个宠妃的形象。唐明皇作为寄情声色的皇帝，作者是有批评之意的，但作者又认为他是帝王家少有的钟情者，值得歌颂，因此把他在政治上的失败归罪于杨国忠等人。特别是下卷，作者在幻想的世界中，美化了他们在天上人间的彼此怀恋。作者所讴歌的那种“那论生和死”的真情，显然不是封建帝王的实际生活，只是表现了作者对爱情的理想。\n\n二、反映封建社会的民族矛盾和阶级矛盾\n\n作者在《长生殿》上卷联系李、杨爱情发展的过程，描写了统治阶级内部的矛盾，和正在酝酿中的国破家亡的巨变。下卷又结合他们的生死离别，抒发了人们兴亡的感慨，同时歌颂了少数坚持民族气节的人物，狠狠鞭挞了在敌人面前摇尾乞怜\n\n的民族败类。作者对封建统治集团作了无情的揭露，他愤怒地抨击了弄权误国的杨国忠。杨国忠“外凭右相之尊，内恃贵妃之宠”，明目张胆地“卖官鬻爵”“纳贿弄权”，与唐明皇的不理朝政共同导致了安史之乱的悲剧。\n\n此外，作者从“逞侈心”“穷人欲”为祸败之源出发，进而揭示了统治者所加于人民的灾难。《进果》一出所写马踏禾苗，撞死百姓等一系列悲惨场面，都是对统治者的正面控诉。作者对安史之乱后转徙流离的人们流露了深切的同情，同时通过郭从谨献饭，李龟年弹词，表现了他自己的兴亡之感。这正是《长生殿》寄寓的“垂戒来世”的积极意义。\n\n三、驳斥“女人亡国”的陈腐论调\n\n《埋玉》一出中写陈元礼提出的杀妃“理由”，是“贵妃虽则无罪，国忠实其亲兄。今在陛下左右，军心不安”。显然，这并不能成为“理由”。在作者看来，不仅杀妃的理由不能成立，而且安史之乱的责任也不在杨玉环身上。在《弹词》一出里，作者借剧中人说：“休只埋怨贵妃娘娘，当日只为误任边将，委政权奸，以致庙谟颠倒，四海动摇。”在《私祭》一出中，又唱出了“哪里是西子送吴亡，错冤做宗周为褒丧”。很明显，作者在这里驳斥了历来的“女人亡国”的陈腐论调，点出了安史之乱的真正原因。基于这个观点，《长生殿》以《仙忆》《补恨》《寄情》诸出敷演了杨玉环自责、忏悔之后得升仙界的浪漫情节，表现了对杨玉环的宽恕。","keywords":"歌颂理想爱情 民族矛盾和阶级矛盾 驳斥“女人亡国”","note":"作者一方面通过唐明皇、杨贵妃的故事颂扬生死不渝的爱情；一方面又联系他们爱情的发展，揭开了安史之乱前后广阔的社会背景。作者批判了他们爱情生活所带来的政治后果，却又歌颂他们的爱情生活，同情他们的爱情悲剧。这就给作品的主题思想带来混乱。作者所描写的李、杨爱情包含了作者的爱情理想，有一定的民主思想因素；他联系李、杨爱情所揭露的阶级矛盾、统治阶级内部矛盾和民族矛盾，在封建社会更有普遍意义。因此作品在主题思想上虽然存在着作者所无法解决的矛盾，但这些矛盾正是和作者的创作意图相联系的，作品依然表现了进步的思想倾向。"},{"id":"418","stars":"★★★★","title":"简述《长生殿》的艺术特色","body":"《长生殿》是清代戏曲发展到成熟阶段的杰出作品，既具有戏剧文学的可读性，又具有演出实践的舞台性，在艺术表现方面取得了很高的成就，具体表现在以下几个方面：\n\n一、全景式的历史规模\n\n《长生殿》继承了《梧桐雨》《浣纱记》等通过爱情故事反映一代兴亡的手法，不仅是李、杨的爱情故事，更是一部以唐朝天宝年间故事为题材的史诗性的鸿篇巨作。全剧长达五十出，每一出的标题仅两个字，串联起来，就是唐天宝年间最大事件的史诗概括，是以宫廷为中心，以帝妃爱情为线索，波澜起伏、惊心动魄的历史画卷。作品去掉了许多枝蔓，还将在安禄山封爵时职位不高的杨国忠虚构成了宰相，让安、杨的矛盾一开始就呈现势均力敌的角斗态势，宫廷尔虞我诈，外戚与藩镇既勾结又斗争，把社会动荡，民不聊生的时代风貌，无不艺术地呈现出来。\n\n二、结构安排严谨细密\n\n（一）脉络清晰，联系紧密\n\n《长生殿》长达五十出，以唐明皇、杨贵妃的故事为主线，以朝政军国之事为副线，编织进唐以来文人记述过的、诗人咏叹过的人事，内容非常丰满，两条线交叉发展，彼此关联，脉络极清晰，组合得相当紧凑而自然。唐明皇、杨贵妃这条主线，又以定情的金钗钿盒时隐时现贯穿其中，而且每次出现都有不同的寓意：上半部开始是定情之物，马嵬殉葬是失盟的表征；下半部杨贵妃鬼魂把玩是写失情之怨，最后是用以证情，重圆结案。既使全剧的情节有着内在的联系，又体现了主人公的悲欢离合。\n\n（二）前后对立依存且相互照应\n\n《长生殿》前一部分是写实，是官廷爱情的悲剧，后一部分是写幻，是鼓吹真情。从结构上说，两者是对立的，但又是互相依存的。没有前半部分现实的悲剧，后半部分鼓吹至真之情便无从生发；没有后半部分唐明皇、杨贵妃的悔恨、重圆，则成了《梧桐雨》式的悲剧，只留下了一份历史的遗憾。\n\n全剧上下两部分虽各有侧重，但也有许多对照、呼应，如上半部写现实的悲剧，插入了幻想的《闻乐》一出，为下半部杨贵妃仙归蓬莱伏下了引线；下半部主要以幻笔写情，插入《献饭》《看袜》《骂贼》等写实场面，与上半部唐明皇的失政、安禄山的受宠信、杨氏一门的骄奢，有着明显的对照意义。《长生殿》结构细密，场面安排上轻重、冷热、庄谐参错，都是出于匠心经营，从而将传奇剧的创作推向了新的艺术高度。\n\n三、现实主义和浪漫主义相结合\n\n《长生殿》现实与幻景交错，史实与演绎结合，构思奇特。上卷以更多的批判态度揭露封建统治者的昏庸腐朽和政治上的黑暗，基本上采取了现实主义的创作方法。下卷在对爱情悲剧的处理上，通过一些幻想的形式，歌颂精诚感动天地的爱情，这又吸取了《牡丹亭》的浪漫主义手法。这种奇特的构思，符合人们对大团圆结局的追求，对真善美执着追求和希望真善美永远不朽的心理，也是对因果报应论的一种升华。这种手法是在继承《长恨歌》和《梧桐雨》的基础上，更为大胆和超乎寻常的超越。因此，作品更加浪漫、丰富而深情，更加一波三折、生动感人。\n\n四、强烈的对比艺术\n\n（一）历时的对比\n\n《长生殿》的上卷，以细腻的文笔，极写温柔富贵的宫廷生活，特别是《闻乐》《制谱》《窥浴》《密誓》诸出，把帝王和妃子的爱情，写得淋漓尽致。而第二十四出《惊变》之后，整个剧情发生“突转”，昔日的富贵欢愉，毁于一旦，李隆基从此陷入了杀妃之痛、蜀道之艰、失位之悲、思念之苦。整个作品的情节氛围、人物命运，于《惊变》之前后，形成鲜明的对比。对比使《惊变》前的宫廷欢乐和《惊变》后的离别凄苦得到了强烈的表现，突出了“弛了朝纲，占了情场”的思想和兴亡的感叹。\n\n（二）共时的对比\n\n如《进果》一出所写马踏禾苗，撞死百姓等一系列悲惨场面，与统治者的荒淫无度形成鲜明对比。李隆基和杨贵妃享受着新鲜的水果，而百姓却哭天天不应，诉地地不灵，投诉无门，痛不欲生。这种鲜明的对照，暗示着阶级矛盾的不可调和，也为后来官兵哗变种下了恶果。\n\n五、鲜明的人物形象\n\n洪昇把自己的理想熔铸在他所创造的人物形象之中，表现了强烈的感情色彩和鲜明的倾向性。他塑造了一系列正反两方面的人物形象，安禄山、杨国忠，作为叛将、权奸的典型，受到了无情的谴责；郭子仪，雷海青等，作为忠臣、义士，则得到了热情的赞美。这些形象都在不同程度上表现了作者自己的思想和爱憎。\n\n作者又善于从发展角度塑造人物，他细致地描述了唐明皇、杨贵妃爱情曲折发展的过程，从而表现了他们对爱情的忠贞。但由于作者有时离开了人物的社会环境、阶级特征来进行描绘，显得不够真实。\n\n六、浓郁的抒情气氛\n\n《长生殿》是一部抒情性的诗剧。无论是赞美爱情或感叹兴亡，都是作者内心情绪的抒发。其抒情的艺术手段有二：\n\n（一）借景抒情，情景交融。如《闻铃》一出，即以借景抒情的笔法深刻揭示了李隆基的心境：“白杨萧瑟雨纵横，此际孤魂凄冷。鬼火光寒，草间湿乱萤。只悔仓皇负了卿，负了卿！”这样的抒情，加重了悲剧的气氛，也表达了人物凄苦的心境。\n\n（二）吊古伤今，更深更广地咏叹历史上的不公、人世间的不平。例如《弹词》一出中〔南吕·一枝花〕：“那里是高渐离击筑悲歌，倒做了伍子胥吹箫也那乞丐。”像这样的抒情，在当时的历史条件下，自然更能引起广大人民群众的兴亡之慨。\n\n七、曲词清丽流畅，充满诗意\n\n《长生殿》的曲文糅合了唐诗、元曲的特点，形成一种清丽流畅的风格，叙事简洁，写景如画，在基本格调的范围里又随人物之身份、性情、情感的不同而有所变化。曲文中也较多地化用了唐诗、元曲的名句，《惊变》《雨梦》等出的曲词基本上是由《梧桐雨》的曲文脱化而来的，但融化得极妙，如同自撰之新曲。\n\n《长生殿》曲文的长处更在于具有浓厚的抒情性，能够声情兼备地表达出人物的内心感情及心理活动。如《献发》中杨贵妃因君心无定而忧苦，欲献发传情以感动君心的复杂心理，《夜怨》中杨贵妃等待唐明皇不到的焦急、苦闷心情，《闻铃》《雨梦》等出中唐明皇失去杨贵妃的烦恼、怨恨、痛苦的感情，都表达得很细腻，真切动人。《弹词》中老伶工李龟年唱的一套〔转调货郎儿〕，追述往事，凄婉动人，成为当时广为传唱的名曲。\n\n八、讲究音律\n\n洪昇深通音律，《长生殿》又得到当时专门研究音律的徐麟的订正，所以这部作品在音律方面的成就一向受到曲家的推崇。在全剧中，前一折和后一折的宫调决不重复，运用北曲、南曲的各种曲调，都有细致的安排。即使在一折剧中，对曲牌的安排也很注意。遣词用韵方面，字字审慎。故当时南北上演，盛极一时。吴舒凫序中说：“爱文者喜其词，知音者赏其律，以是传闻益远。”可见它真正做到了曲辞与音律俱佳，文情与声情并茂。","keywords":"全景式的历史规模 结构安排严谨细密 现实主义 浪漫主义 对比 人物形象 抒情 曲词清丽 充满诗意 音律","note":""},{"id":"419","stars":"★★★★","title":"试分析《长生殿》与《桃花扇》之异同","body":"【答题框架】\n\n在清初的剧作舞台上，洪昇的《长生殿》和孔尚任的《桃花扇》成就最高，不仅在当时引起了戏曲界强烈反响，也对后世的戏曲创作产生了深远影响。但二者在主题思想、艺术结构、兴亡之感等方面都各有异同，具体如下：\n\n一、主题思想比较\n\n《长生殿》与《桃花扇》都借鉴了自明梁辰鱼《浣纱记》以来“情政结合”的历史剧传统，借男女爱情的离合遭遇写家国悲痛、历史兴亡。爱情和政治这两对矛盾在两部作品中交叉出现，具有扣人心弦的悲剧效果。但两部作品有着不同的思想意蕴：《长生殿》以爱情离合为明线，以政治兴衰为暗线；《桃花扇》则以爱情离合为表象，着意于探索南明历史兴亡背后的深层原因。\n\n《长生殿》主要表现的是“情”，这段帝王与妃子的爱情发展又与时局政治紧密联系，唐明皇因“情”废“责”不理朝政，又因宠爱杨贵妃而任其兄杨国忠为相，导致朝政衰败，最终引起社会动乱。在讴歌真挚爱情的同时，洪昇对李、杨荒淫的爱情带来的社会困苦又表示无限的愤慨，指责他们是天宝之乱的罪魁祸首。《长生殿》表达的政治主题就是告诫世人：“天子一跬步，皆关民命。”对于掌握大权的君主，“情”需要“度”，只有合乎理的规范，情才能永久存在。\n\n《桃花扇》侧重表现的是政治主题。剧中侯方域和李香君的爱情主要在与外界的斗争中发展而来，他们的恋情跳出了传统才子佳人的模式，以共同的政治信仰为基础，在社会政治斗争中演绎悲欢离合，爱情与政治成为他们生命中的两部分。当政治斗争失败后，两人面对爱情与现实责任不能兼顾的矛盾，因“责”废“情”，割断情根，以入道隐居来反抗清朝统治。《桃花扇》借爱情灭亡来引发人们对历史变迁的思考，揭示其深层次的原因：爱情悲剧是政治环境下的产物，在“国不在、家不在”的前提下，爱情也不能长久，作者的目的是唤醒我们的民族大义和爱国之情。\n\n二、艺术结构比较\n\n《长生殿》和《桃花扇》不仅因曲折的故事内容、深刻的思想意蕴吸引世人，还因结构形式上的非凡成就达到戏曲艺术的高峰。\n\n（一）历史材料比较\n\n《长生殿》和《桃花扇》都取材于历史，洪昇和孔尚任正是恰当地处理历史和现实的关系，做到既尊重历史真实，又不为历史事实所拘，才能取得成功。\n\n（1）他们都让题材为主题服务，删去了与剧本主题关系不大的内容，把有利于表现作品主题的加以典型化，但又各有特色地根据不同的创作主旨，选择历史材料。洪昇在处理历史材料时采取了“净化”手法，按照审美理想和创作主旨，对李、杨爱情进行了艺术提炼，使帝妃关系由浅到深。\n\n同样，孔尚任也以剧本主旨“借离合之情，写兴亡之感”为标准来处理历史事件，把侯方域塑造成“争斗则朝宗分其忧”的爱国文人，在江山社稷灭亡后愤然入空门，走消极反抗的隐居之路。这种把主人公思想“拔高”的做法是为了更好地表达剧本的创作主旨。\n\n（2）洪昇和孔尚任都采用了移花接木的艺术方法，即将他人之事，移植此人之身，或将此人之事，移植彼人之身，以此塑造典型化的人物形象。并且，他们虚构了许多与剧中人物本来无干的但对塑造人物、表达思想又有必要的情节，又删掉了不重要的史实，保留甚至扩展反映本质的历史素材，使人物性格、品质在矛盾冲突中得到了升华。\n\n（二）结构线索比较\n\n《长生殿》和《桃花扇》两剧都是双线结构、两线交错，有主有从，但也有各自特点：\n\n（1）线索侧重不同：《长生殿》以安史之乱、国倾而复平为一线，以李、杨生死不渝的爱情为一线，明暗交际、互为因果，描写爱情一线重于反映政治一线。\n\n而《桃花扇》也有两大线索：一是明线，即“离合之情”-侯方域与李香君的爱情发展；二是暗线，即“兴亡之感”-作者在政治风云和时代混乱中流露出的苍凉、感伤之情。作者巧妙地将“离合之情”这条明线贯穿于整个剧作，以此为他所表达的“兴亡之感”服务，反映政治一线重于描写爱情一线。因此，两剧结构线索，谁主谁从，也就恰好相反。\n\n（2）定情物的见证对象不同：《长生殿》主要是要赞颂李杨的爱情，所以金钗钿盒成为李、杨爱情的见证：在太平盛世中，钗盒相依，李、杨享受到了男女之间的欢娱与情义；而在安禄山叛变中，钗盒只能埋于地底，承受黑暗，相爱的两人阴阳两隔；当平定了“安史之乱”后，钗盒才得以重见天日，完整合一，李、杨也在月宫得以重圆，重续未了缘。\n\n而《桃花扇》主要是抒发一种兴亡之感，而李、侯的爱情只是个载体，所以桃花扇主要见证的是历史变迁。当黑暗势力，反动势力占了优势时，桃花扇也落得了悲凉遭遇，甚至还遭到女主人公血溅扇面的命运。\n\n（三）布局艺术比较\n\n（1）《长生殿》和《桃花扇》都分上下两部，结构布局一致但严谨程度有区别。《长生殿》上本较下本的布局更为严谨有致。而《桃花扇》上下本均严谨周密，整体结构精严。\n\n（2）两剧交织错落地安排悲喜剧和文武场，但在设置矛盾冲突方面各有不同。《长生殿》中的男女主人公矛盾较多，而与其他人物，特别是反面人物的冲突很少。《桃花扇》则相反，剧中男女双方的矛盾较少，与反面人物的冲突却很多。\n\n三、艺术手法比较\n\n（一）虚实比较\n\n《长生殿》与《桃花扇》都运用了虚实结合的写作手法。两者在描写男女主人公的爱情和政治事件时，基本上采用了纪实的手法，很真实地再现了事情发生的缘起、经过和结果。这些被选用的材料都是流传较广，人们比较熟悉的。但是两剧为了达到各自不同的写作意图，对材料进行了加工处理。两剧在结尾时都加入了虚幻的色彩，如《长生殿》中杨玉环和李隆基的月宫团圆，和《桃花扇》中李香君和侯方域仅因张道士的一声喝而彻底大悟，各自归道，这就给人一种虚幻之感。\n\n《长生殿》中虚实成分比例相当，自从杨妃自缢马嵬坡以后，大部分都采用的是虚写的方式，李隆基的睹物思人以及蓬莱仙境的事情都为虚幻，其中的浪漫主义气息比较浓厚。而《桃花扇》中大篇幅都运用纪实手法，为实写。\n\n（二）人物塑造比较\n\n（1）人物类型基本相同，但各有特色：这两部剧作都有他们典型的人物，并且人物的类型基本相同。两剧都塑造了各自光彩夺目的主人公形象以及一系列地位低下，但不畏权势，有正义感的下层民众。同时，两剧也都塑造了一些生动逼真的乱臣贼子形象。但由于地位身份思想不同，这些人物又各具特色，如杨玉环作为一个拥有三千粉黛的帝王的妃子，更多地表现出渴望被爱，容易嫉妒的本性。相对而言李香君就淡然一些，她更重视的是对丈夫、对社会的一种责任。\n\n（2）人物关系不同：《长生殿》生、旦两人贯穿全剧，忠奸仅是穿插其中，因而人物关系较为单纯。而《桃花扇》贯穿全剧的人物除生、旦外，还有老赞礼、张瑶星等重要人物，因此，其人物关系较为复杂。\n\n四、结局比较\n\n虽然《长生殿》与《桃花扇》都属于悲剧，却有不同的结尾。邵曾祺在《试谈古典戏曲中的悲剧》中将我国传统戏曲大致分为四类：其中有一类符合“把有价值的东西毁灭给人看”的原则。这类戏曲的结尾没有皆大欢喜的“生旦大团圆”。《桃\n\n花扇》就属于这一类型。李香君与侯方域为了坚贞的爱情付出了巨大努力之后，却不能享受耳鬓厮磨的爱情生活，而是与这样的日子擦肩而过，背道而驰，被张道士一番话惊醒，各自归道，了断尘缘，留给我们的是深深的遗憾与感叹。\n\n还有一类是在“有价值”被毁灭后，挂上一条欢乐的尾巴。男女主人公即使不能“生圆”，也要“仙圆”或“梦圆”。《长生殿》正属于此类型。在结尾处它给我们挂上一条“精神不灭”式的尾巴。尽管杨玉环被迫自缢于马嵬坡，香消玉殒，芳魂消散，可是两人的浓情蜜意，不渝之情感动了上天，让他们最终在月宫团圆，虽然不能享受人间夫妻的真正情爱，但是还能够精神相依。这至少还留给我们一些希望。","keywords":"主题思想因“情”废“责”因“责”废“情”艺术结构 历史材料 结构线索 侧重 定情物 布局艺术 艺术手法 虚实 人物塑造 结局","note":"明代梁辰鱼的《浣纱记》，是传奇中首次将男女之情和国家兴亡联系在一起的作品。《长生殿》和《桃花扇》继承了这样的传奇创作模式，而且这两位剧作家把男女的离合和国家的兴亡更加完美地结合，打破了传奇只为言情的传统，在传奇的创作史上有着深远的意义。《长生殿》与《桃花扇》同中有异、异中有同，具有很强的可比性。25年的考查中，湖北大学就考查到“《长生殿》和《桃花扇》在戏剧结构上的异同”这道题目，大家灵活运用这道题中的内容，紧扣“结构”这一关键词进行作答就可以了。相关论文详见李凡文学一千题正版群。"},{"id":"420","stars":"★","title":"简述清代前中期小说整体发展状况","body":"清代是中国古典小说的全面成熟期，清代小说的整体成就也是清代文学辉煌的标志。总体来看，清代小说整体发展状况主要表现在以下方面：\n\n一、短篇文言小说在明代传奇复苏的基础上更进一步，获得了巨大成功\n\n清代初年，蒲松龄的《聊斋志异》“用传奇法而以志怪”，使花妖狐魅人格化，幽冥世界现实化，大大拓展了文言小说的叙事功能与表现功能，成为文言小说发展史上前无古人也后无来者的艺术典范。\n\n清代中期，纪昀的《阅微草堂笔记》有意与《聊斋》相抗衡，尚质黜华，追踪晋宋，雍容淡雅，天趣盎然，是清代笔记体小说的代表作品；袁枚的《子不语》记述简略，行文洒脱，表现出向六朝志怪回归的趋势。\n\n二、白话小说局部创新，自主性增强\n\n清代白话短篇小说虽不能与明代的“三言”“二拍”相匹敌，但在局部方面亦有所创新。尤其是清代初年，拟话本小说由改编转向独创，自主性大大增强，《醉醒石》《照世杯》《豆棚闲话》等各展风姿，争奇斗妍，其中李渔的《无声戏》《十二楼》最具特色。\n\n三、长篇章回体小说收获巨大\n\n清代初年，英雄传奇小说有新的收获，产生了《水浒后传》《说岳全传》等寄托民族意识，具有时代特征的作品；才子佳人小说风行一时，《好逑传》《平山冷燕》等超越世俗情欲，抒写落魄文人婚恋梦想的作品不断问世；在学步《金瓶梅》的基础上，还产生了《醒世姻缘传》《林兰香》等以家庭及社会生活为题材，描写现实人生的世情小说。\n\n清代中叶，《儒林外史》和《红楼梦》两部巨著把我国古典小说的创作推到了顶峰。《儒林外史》既是一部批判现实主义的杰作，其机锋所向，尤在士林，又是讽刺小说的典范，“戚而能谐，婉而多讽”，将讽刺艺术发展到前所未有的高度。《红楼梦》的出现，更是具有划时代的意义，它把传统的思想和写法都打破了，不仅是古代小说的最高艺术典范，而且是整个中国古典文学的最高峰。《镜花缘》《歧路灯》等长篇小说也取得了较高的成就。","keywords":"短篇文言小说《聊斋志异》《阅微草堂笔记》白话小说 局部创新 自主性增强 长篇章回体小说《儒林外史》《红楼梦》","note":"这部分内容我们了解一下每类小说的代表作和性质地位即可。这其中，特别需要注意的是以《儒林外史》和《红楼梦》为代表的长篇章回小说。这部分内容基本不会在考查中出现，放在这里是让大家对清代小说整体状况有一个大致的认识。"},{"id":"421","stars":"★★","title":"试分析《醒世姻缘传》的创作特征","body":"《醒世姻缘传》是继《金瓶梅》之后问世的一部长篇世情小说，但相较于《金瓶梅》又有了新的发展，包蕴着新的思想，具体表现在以下方面：\n\n一、以小见大的结构\n\n《醒世姻缘传》的创作没有借用旧的故事框架，没有较多地采用或改编已有的作品，而是完全取材于现实生活，虚构出全新的小说人物和生活图画，而且还有一个明确的要解释社会人生的基本问题（夫妻关系恶劣的原因）的题旨，小说的情节结构也是由此而设计的。小说叙述的重心是家庭之事，而随着主要人物的行事，叙及了那个时代的科场、官场、城乡民生，乃至京朝时事等许多方面的人事。从这个角度说，《醒世姻缘传》是最早的一部作家独创的长篇世情小说。\n\n二、荒诞与真实交织\n\n《醒世姻缘传》原名“恶姻缘”。全书依佛教的阴阳果报观念，先后叙写了两世恶劣的婚姻，写尽了荒唐的情节和无稽的说教，整部小说有着浓重的荒诞神秘的色彩。但是，当作者的笔触转向现实人生的时候，却又相当清醒，体察得很深切，在他主观编造的因果报应的故事框架的内外，描绘出相当丰富的真实而鲜活的世态人情。这部声称主旨在于明因果的小说，倒是全景式地反映出了那个时代吏治腐败、世风凉薄的面貌。\n\n三、包蕴着呼吁尊重女性、夫妻应当“相敬如宾”的现实意义\n\n《醒世姻缘传》显然是出于男性的立场，有憾于世间家庭“阴阳倒置，刚柔失调”，丈夫受妻妾的辖制、欺凌的现象而发作的，独将薛素姐写成一个狐精转世、心肠极恶的悍妇，更表现男权主义的立场。但小说中展现出来的人生图画超越了作者的思想，为揭示男性被女性欺凌的原因，追究到了男性压迫女性的人生悲剧，表现为一个循环相因的生活过程，在这个因果报应的荒谬逻辑中也正蕴含着一个现实逻辑的内核：女性对男性的欺凌，也就是对男性压迫的反抗。小说在以因果报应警世劝人的思想躯壳里，包孕着呼吁尊重女性、夫妻应当“相敬如宾”的现实意义。\n\n四、贴近生活，讽刺性强\n\n《醒世姻缘传》受《金瓶梅》的影响，写社会家庭间的寻常细事，真切细致，贴近生活原貌，对城乡下层社会的描绘更富有鲜活的生活气息。作者对人情世态，揣摩得深切，在写实的基调上，往往加些夸张之笔，显示出其人其事的滑稽可笑，形成讽刺艺术的效果。小说中出现的各类人物，无论是官员乡绅、塾师、乡约、媒婆、江湖医生、市侩商人、尼姑道婆、农村无赖，大都写出各自独具的那种卑陋的势利嘴脸，可说是写尽众生相。\n\n五、幽默诙谐的叙述风格\n\n《醒世姻缘传》通篇由一位深通人情世故的叙述者用一种讽世的口吻叙出，揣摩细致入微，时而加些嘲谑性的夸张形容显示人物行事之滑稽，鲜活生动，趣味盎然。叙述纯用北方口语，人物话语夹杂方言俗语、民间歇后语，往往依各自身份、性情而出，惟妙惟肖。叙述中还别出心裁地借用通俗小说里的人物、情节，犹如诗文用典故一样，形容所叙人事情状，增加了叙述的趣味性。许多琐碎、庸俗的事情，经过文心妙笔叙出，便不再是直观的暴露，而带有了文学反讽的审美意味。","keywords":"以小见大 荒诞与真实交织 尊重女性 相敬如宾 贴近生活 讽刺性强 幽默诙谐","note":"《醒世姻缘传》虽然本意是站在男权立场“明因果”，但在客观上却表现了当时的社会百态，并具有呼吁尊重女性的现实意义，这也是这部作品被肯定的原因。《醒世姻缘传》受《金瓶梅》的影响很大，二者很可能被放在一起对比，这一点大家要注意一下。"},{"id":"422","stars":"★★","title":"试分析李渔小说创作的艺术特色","body":"李渔作小说亦如作戏曲。他将先出的小说集题名“无声戏”，意即不演唱的戏曲，表明在其小说创作与戏曲创作一样重视故事情节的新奇有趣，也意味着他作小说要赢得读者的欢喜。所以，他摆脱了改编因袭的作法，有自觉的创造意识，锐意求新。他的《无声戏》和《十二楼》两部小说集共计30个短篇，大都是就个人的经验见闻，运用想象自行结撰的。这些小说，主要具备如下特征：\n\n一、表现生活经验和人生意趣\n\n李渔的短篇小说全是叙写世情的，展示的是社会家庭间财产、婚姻、子嗣、立身处世的问题，从题材角度说，与“三言”“二拍”中写市井生活的作品是一样的。不同的是李渔的小说不是摹写社会人生的实况，他所营造的小说世界，大都是与现实世界似是而非，所显示的不是真实的生活，而是他别出心裁的经验之论和游戏人生的意趣，如在《疗妒羹》《鹤归楼》中，李渔将个人的生活经验化作生活的图画。在白话小说创作中，李渔是最早勇敢地投入自己、表现自己的作家。\n\n二、教诲色彩减弱\n\n李渔作小说也继承了拟话本小说与生俱来的关乎名教、有裨风化的套数，篇首篇尾总要做一番说教，有少数作品径直是劝善惩恶、维持世道的内容。但是，李渔绝少在封建纲常伦理上做文章，所发的大都是别出心裁的饮食日用之道，如“惜福安穷”，儿子无论亲生或养子都要一样看待，死时不妨劝妻妾改嫁等等。在他的小说中，没有树立忠、孝、节、义的典范，\n\n乐于称赞的是诸如助人成家的贫家女云娘，家主外出杳无音讯而为之守家养子的侍婢碧莲等守妇道的妇女。这也不是从道德的角度赞美她们，对之作出的是功利主义的赞词。拟话本小说固有的教诲宗旨，在李渔的小说里完全变了味道。\n\n三、娱乐性强\n\n贯穿于李渔小说内外肌质中的是玩世不恭的娱乐主义。他曾自谓：“尝以欢喜心，幻为游戏笔。”他作小说从取材选题上便退缩到了普通人“耳目之前”的社会家庭细事和小人物的命运穷通的范围内，避开了严肃的社会问题。他写社会家庭间的纠纷、小人物的穷通，往往是轻而易举化解了矛盾，让不幸者不经过大的折磨便时来运转，获得幸运。如《美妇同遭花烛冤 村郎偏享温柔福》写的是妇女的婚姻不幸，三位美妇嫁给极其不能忍受的丑臭异常的土财主，小说极写其间的荒谬，但却轻易地让三位美妇回心转意，安于命运，结果是皆大欢喜。\n\n☒四、主观专断的叙事特征和情节的随意性\n\n李渔意识到了艺术世界和现实世界的不同，在小说创作中有着活跃的创造意识，但却过分地强调了创造的自由性，以为可以不受任何约束地“为所欲为”。所以，他的小说表现出一种主观专断的叙事特征和情节的随意性。他并不掩饰他作为叙述者的存在，总是以自己的名义和口吻进行叙述，不仅在篇前篇后絮叨地发议论，叙述故事时也会随时介入他的解释和俏皮的调侃。他很少放弃叙述，作客观的展示，他说什么就是什么，懒得去描写人物的相貌、气质和活动的场景，藉以增强故事的可信性和情节发展的合理性。他选定了一个题目，便无顾忌地摆布人物，编织故事。如在《失千金祸因福至》中，皂吏蒋成事事触霉头，人称“蒋晦气”，算命先生替他戏改了八字，便时来运转，财源滚滚，官运亨通。\n\n五、叙事圆融，饱含智慧和机趣\n\n李渔是位文艺天才，擅诗词，精通戏曲，又是园林设计师，又精于人情世故，话本小说创作在他笔下获得了最大的自由。他的几篇小说大都“取意尖新”，突破才子佳人小说的模式，圆熟的叙事中包含着他独具的智慧和机趣。如《夏宜楼》用一架当时还是稀奇的器物-望远镜作为媒介，叙写一对青年男女虽不在一处却发生了爱慕之情，经过许多波折终于喜结连理。这篇小说在叙述上运用了控制视角的方法，使情节在悬念和解说的更替中迂回发展，可谓匠心独运，别有一番情趣。","keywords":"生活经验 人生意趣 教诲色彩减弱 娱乐性强 主观专断 情节的随意性 叙事圆融 智慧和机趣","note":"明清时期的拟话本小说，在“三言”“二拍”之后，就以李渔的《无声戏》《十二楼》成就最高，影响最大。而李渔既是一位剧作家又是一位小说作家，因而其小说不可避免地显示出了戏剧创作的某些特征，大家可以将其戏剧和小说两者的特征结合起来记忆。"},{"id":"423","stars":"★★","title":"试述清代才子佳人小说的创作特征","body":"明清才子佳人小说是明末清初的一个小说创作流派，也是人情小说的一个分支和流派。这类小说主要具备如下特征：\n\n一、受到了晚明话本小说、拟话本小说和明传奇的多重影响\n\n清初的才子佳人小说是从晚明话本小说发展而来，篇幅增长了，一般在15至20回之间，多为章回式的中篇，书名也多仿照《金瓶梅》由主要人物姓名中的一个字拼合而成，如《玉娇梨》《平山冷燕》。\n\n才子佳人小说文字比较清顺、规范，中间夹有较多的诗词韵语，大多数是以诗词为主人公发生爱情的契机，有的诗词写得还颇有韵致。从这一点说，这类小说又受到了明人传奇的影响。\n\n就小说的内容说，这类小说是晚明拟话本中婚恋小说的新变。“三言”“二拍”里这一题材的小说，多是写文人的风流艳事，重在情欲的爱悦，有着浓厚的世俗色彩。清初的这类小说则是超世俗情欲的，追求理想的配偶，却严守礼教规范，井往往与才子的功名遇合纠缠在一起。二者的题旨、意趣是不一样的。\n\n二、故事模式化，内容上多为落拓文人渴求富贵的幻想\n\n才子佳人小说的作家都是断绝了科举仕途之路的下层文人，是为应对商业化的图书出版而写作的，在这些小说中，才子必定要有才貌双全的佳人为偶，乃至要外出“游婚姻之学”；才女必待才子而嫁，个人和家长乃至朝廷都要试才选婿。作者写的还是他们的“富贵风流梦”，于是其写作便只是在既定的格局中做些细部的变化，旨趣和故事模式基本相类，人物变换了姓名，却是干人一面；人事场景有所不同，却总脱不掉那种才色相慕一小人拨乱一富贵团圆的公式。\n\n三、言情而不悖礼\n\n清初才子佳人小说中明白表现了自主择婚的意识，提出了以才、貌相当为条件的爱情婚姻观，丢弃了现实中还占据着支配地位的家长包办婚姻、子女不得自主的封建观念，让所谓佳人超脱了“无才便是德”、只是做男子的附属的境地，有的小说还特别突出了佳人的才智、胆识，如《定情人》的江蕊珠。这显然是受到了晚明以来反传统礼教、反理学的社会文化思潮的影响。\n\n但是，这些小说的作者使婚恋主题雅化、淡化，甚至淘汰掉青年男女相爱的自然情欲的动因和内容，突出了诗词才情的欣赏，将男女之情引向择婚的风雅上去，自主择婚而不越出礼教设定的范围，才子佳人之间只有爱慕而没有爱情的冲动和情思，更没有幽会私奔。","keywords":"晚明话本小说 拟话本小说 明传奇 多重影响 故事模式化 渴求富贵的幻想 盲情而不悖礼","note":"才子佳人小说这一知识点是文学考研的常考知识，将才子佳人小说的模式概括起来就是：私定终身后花园，落难公子中状元，奉旨成婚大团圆。和“三言”“二拍”这样的小说相比，才子佳人小说缺乏深度，不过是作者所憧憬的富贵风流梦。除了会考查其艺术特征外，才子佳人小说这一概念还常在名词解释中出现，相关内容大家要特别关注。"},{"id":"424","stars":"★★★","title":"试分析六朝志怪小说与清朝志怪小说的不同","body":"六朝志怪小说和清朝志怪小说是中国古代文言小说发展史上不同阶段的产物，代表着不同的社会文化，反映出不同的社会面貌，也表现出不同的艺术特点。六朝志怪小说是清朝志怪小说的准备阶段，而清朝志怪小说预示着古代文言小说的成熟。六朝志怪小说与清朝志怪小说的区别表现为以下几点：\n\n一、文体方面的不同\n\n（一）六朝志怪小说大都形制短小、情节简单，缺少细腻感人的艺术魅力。\n\n（二）清朝志怪小说吸收六朝志怪小说和唐传奇两家精华，以志怪反映现实，且使用传奇手法，兼具志怪、传奇二体的特点，终至成熟。\n\n二、创作观念的不同\n\n（一）六朝志怪小说作者确实并非有意进行虚构，而是把鬼神之事当成现实之事来写，作者的创作意图在于证明“神道之不诬”，对搜集来的传说故事很少做根本性的修改。\n\n（二）清朝志怪小说有意地借鬼神故事来揭露现实、抒发情怀，借助非现实的情节反映现实。最具代表性的就是《聊斋志异》，其中多数作品通过谈狐说鬼的手法，对当时社会的腐败、黑暗进行了有力批判，在一定程度上揭露了社会矛盾，表达了人民的愿望。\n\n三、写作手法的不同\n\n（一）从故事体到人物体\n\n六朝志怪小说以叙述故事为主，基本不会对人物进行刻画；以《聊斋志异》为代表的清朝志怪小说则在人物描写方面发生了质的飞跃，人物形象鲜明生动，性格复杂，已经发展到刻画人物为主。如《婴宁》中描写的美丽少女婴宁，爱花爱笑，天真无邪。\n\n（二）环境描写\n\n六朝志怪小说中的描写比较少，清朝志怪小说发展了环境描写，并使之与刻画人物互为表里。如《婴宁》中风景美丽的山上，住着同样美丽的少女婴宁。\n\n（三）心理描写\n\n六朝志怪小说中少见心理描写，《聊斋志异》等清朝志怪小说中却不乏见到。如《聂小倩》通过写男主人公宁采臣对与鬼魂聂小倩在几个不同场合相遇，所产生的不同想法和心理变化，表现了他们关系的进展，较好地以心理描写的方法达到了艺术表现的目的。\n\n总的来说，清朝志怪小说是在继承六朝志怪小说的基础之上丰富和发展起来的，体现出了古代文言小说的成熟。","keywords":"短小简单 兼具志怪、传奇二体的特点 创作观念 环境描写 心理描写","note":"比较不同时期的同一文学形态是文学考研中的重中之重，本题是文学考研的热点，在比较不同时期的同一文学形态时可从文体、创作观念和写作手法入手。一般而言发展到后期的文学产物通常是对前期的继承和发展创新，是对前期的取长补短。"},{"id":"425","stars":"★★","title":"试分析《阅微草堂笔记》的创作特征","body":"《阅微草堂笔记》是纪昀仅存的作品集，成书于《聊斋志异》广泛流传之后，但能另辟蹊径，自创特色。其创作特征，主要表现在以下方面：\n\n一、追摹晋宋笔记小说写法\n\n纪昀不满《聊斋》用传奇法志怪的做法，有意追摹六朝志怪质朴简淡的文笔，率意命笔，行文洒脱，简淡而有理趣；篇幅短小，记事简要，重实录而少铺陈。这一方面使《阅微》这部作品显示出尚质黜华、叙述简古、天趣盎然、雍容淡雅的特色，另一方面也难免有叙事过简、描摹太少、议论说教过多的不足。所以，尽管此书确实在创作风格上有可取之处，但艺术成就远逊于《聊斋志异》。\n\n二、具有反理学倾向\n\n在思想内容方面，《阅微草堂笔记》对宋儒议论的苛察、时人见解的拘迂、道学家言行的虚伪，有着较多的揭露和抨击。如卷四有一则写两个“以道学自任”的塾师在学生面前大谈天理人欲，词严义正，背地里却谋夺寡妇财产。卷十七有一则写一个“以苛礼绳生徒”的道学家，被其生徒收买的妓女所引诱，以至当众出丑。可见纪昀对道学家的揭露是非常尖刻的。\n\n三、描摹世态，揭露官场的黑暗\n\n纪昀晚年经历了宦海浮沉，对官场内幕有深刻的理解，在《阅微草堂笔记》中也揭露了官场黑暗，记录了昏官庸吏、贪官污吏等形形色色官吏的言行，从中可以看到官场上官官相护、迎合上司、同僚间相互倾轧的复杂人际关系，对官场腐败给予了揭张。其中对于世态炎凉的描摹，也很逼真。\n\n四、本质上仍为维护封建统治服务\n\n纪昀“信圣贤不信道学”，表明他仍然信守孔孟之道。《阅微草堂笔记》记述见闻，是要“不乖于风教”“有益于劝惩”。所谓“风教”，也就是维护封建统治的封建道德教条，所谓“劝惩”，也就是鞭策人们遵守“风教”。所以全书不少作品都以故事为说理工具，或者宣传封建伦理道德，或者宣传因果报应。","keywords":"晋宋笔记小说写法 反理学倾向 描摹世态 揭露官场黑暗 为维护封建统治服务","note":"《阅微草堂笔记》的艺术成就比不上《聊斋志异》，因而在考查中也较少出现，更多时候反而会围绕纪昀对《聊斋志异》“一书而兼二体”的评价作考查。不过这部分内容还是有助于我们去认识《聊斋志异》的创作特征的，所以大家可以了解一下。"},{"id":"426","stars":"★","title":"谈谈你对《聊斋志异》“一书而兼二体”的认识","body":"《聊斋志异》全书约五百篇，其中既有如同六朝志怪小说记述奇闻异事、粗陈梗概的短章，如《瓜异》；也有如同唐人传奇小说篇幅漫长、记叙委曲的篇什，如《青凤》《婴宁》等，可以说是集志怪传奇小说之大成。纪昀曾从文体的角度，批评《聊斋志异》“一书而兼二体”，鲁迅在其《中国小说史略》里称之为“拟晋唐小说”“用传奇法，而以志怪”。具体表现在两方面：\n\n一、《聊斋志异》不是《太平广记》等事以类聚性质的书，而是兼有传奇和志怪两种题材的小说，所以说是“一书而兼二体”：\n\n《聊斋志异》之取材、作法，大致为三类。一是采自社会传说，有径直据友人口述记出或抄自友人笔记者，篇首或文末注明某人言、某人记。二是依据前人作品进行再度创作，如《种梨》是据《搜神记》里的《徐光》改写的，《续黄粱》明显脱胎于唐人传奇《枕中记》。三是基本无所假借而自行结撰故事，这便是运假想象进行虚构叙事的小说创作了。\n\n《聊斋志异》包含了众多故事，但每个故事的气质不同，当故事适宜铺陈转折的描摹，而又与此时作家的创作灵感相契合，则“描写委曲，叙次井然，用传奇法，而以志怪”，也有些“缘事极简短，不合于传奇之笔，故数行即尽。与六朝之志怪近矣”。于是书中出现了两种小说形式，一为类似于志怪的小说，简短但新奇，一为类似于传奇的小说，委曲而动人。\n\n二、《聊斋志异》如当时同类之书，不外记神仙、狐鬼、精魅的故事，但绝大部分故事却是细微曲折，娓娓道来，使人顿觉书中之状历历如在目前，“用传奇法，而以志怪”，也是“一书而兼二体”。\n\n（一）奇异色彩\n\n《聊斋志异》里绝大部分篇章叙写的是神仙狐鬼精魅故事，有的是人入幻境幻域，有的是异类化入人间，也有人、物互变的内容，具有超现实的虚幻性、奇异性，即便是写现实生活的篇章，如《张诚》《田七郎》《王桂庵》等，也往往添加些虚幻之笔，在现实人生的图画中涂抹上奇异的色彩。从这个角度说，它与六朝志怪小说同伦。\n\n（二）有意作文的态度\n\n贯穿六朝志怪小说中的神道观念及其思维模式，诸如灵魂不灭，人死为鬼；物老成精，能化人形；幽明相通，梦幻与现实世界互渗互补，都具有神秘性质。蒲松龄也因袭了这些神秘思维模式，结撰出诡谲奇丽的狐鬼花妖故事，从思维形态、方式上看并无二致，但却不完全是在原来迷信意义上的因袭，而是弃其内质而存其形态，将作为文学幻想的审美方式和表现方\n\n法用于小说创作中，从而也就摆脱了神道意识的拘束，在这个领域里获得了自由，可以随意地藉以观照现实世界，抒写人生苦乐，出脱个人的内心隐秘。\n\n唐人“作意好奇，假小说以寄笔端”，好奇之外，还为骋才。蒲松龄喜人谈鬼，兴趣而外，他还“妄续幽冥之录”，但他的心中有理想，理想在现实世界里得不到实现，他便把一腔愤怒熔铸到每个故事、每个角色的塑造中去。唐人传奇是对晋六朝小说秉笔直录的一变，《聊斋志异》保留了志怪小说的形骸而有了自己的精神内核，继承了传奇小说的创新精神。\n\n（三）情节曲折多变\n\n传统的志怪小说，大抵“粗陈梗概”，旨在“发明神道之不诬”。而《聊斋志异》，虽基本上是传记体，“不外记神仙狐鬼精魅故事”，但其写法，则如传奇之“扩其波澜，施之藻绘”，使故事情节，一波三折，委曲多变。另外，《聊斋志异》还有大量的花妖狐魅参预到现实生活中来，他们都神通广大，来去鹘突，这就进一步造就了《聊斋志异》情节倏忽变化、离奇曲折的特点。\n\n（四）“出于幻境、顿入人间”的笔法\n\n《聊斋志异》中大多数是现实主义和浪漫主义结合的作品。它们一方面把花妖狐魅和幽冥世界等非现实事物组织到现实社会生活中来，又极力把花妖狐魅人格化，把幽冥世界社会化，通过人鬼相杂、幽明相间的生活画面深刻地反映了现实矛盾；一方面充分利用花妖狐魅和幽冥世界所提供的超现实力量，突出地表现了作者理想的人物和生活境界，并给好人以美好的结果，给恶人以应得的惩罚。这种特点构成了作品想象丰富奇特，故事变幻莫测，境界神异迷人的风格。这是作者继承了六朝志怪和唐宋传奇以来，以狐鬼幽冥等超现实事物反映现实、表现理想的传统，并加以创造性的发展的结果。\n\n（五）故事结构的创新性\n\n唐人传奇在初期虽仍带有六朝志怪余风，但已有意识地在结构上进行创新。如《古镜记》便把好几个故事以一种平行的关系衔接起来，展现一个神奇的故事。到传奇兴盛的中唐时期，拼凑的痕迹消退，转而注重细节的刻画和故事的曲折，《聊斋志异》继承了这一创新精神。同时《聊斋志异》的传记体性质，决定它在结构上常常是以一个中心人物为主，故事随着这个人物的活动逐步展开，并通过他串联一些次要人物；而在情节描写上，则分别轻重，用多种多样的笔法，加以组织和交代，从而收到了主次分明、脉络贯通、叙次周密、结构谨严的效果。\n\n（六）语言的创新性\n\n传奇是因其有意为文而成为魏晋志怪小说后之一变，这个有意直接表现为小说的语言特色。鲁迅称之为“叙述宛转，文辞华艳”，区别于六朝之粗陈梗概。《聊斋志异》更是以简洁的文言，一个字或三两个词便能将一个人物的心境、精神气质展露无遗。\n\n《聊斋志异》语言描写委曲周详，而井然有序，虽写幻境，并不玄虚。这样的行文艺术，比前代的传奇笔墨，更富实感。而且，凡所藻绘，又多用白描，如风行水上，自成文理。似不经意，而涉笔成趣。故能引人入胜，览讽忘疲。此外，《聊斋志异》的叙事，一般都甚简洁，不作长语。虽写长篇，亦无冗句。有些短篇，则不仅简洁，而且含蓄，似有不尽之意。\n\n总之，《聊斋志异》出现在传奇与志怪兴盛后的清代，与后两者已不可同日而语，蒲松龄吸收了传奇的创作手法和志怪小说的题材，展现了他的胸襟和内心世界。","keywords":"纪昀 鲁迅 两种题材“用传奇法，而以志怪”奇异色彩 有意作文 情节曲折 现实主义 结构创新 语言创新","note":"在《聊斋志异》风行逾百年后，纪昀提出了“一书而兼二体”的说法，后来鲁迅“用传奇法，而以志怪”的评论以其准确性和高度概括性，被研究者奉为经典。虽时空相隔，褒贬不一，侧重点不同，但将二者原话列出作一下比较，涉及的信息却大致相同：** ”《聊斋志异》盛行一时，然才子之笔，非著书者之笔也。......今一书而兼二体，所未解也。小说既述见闻，即属叙事，不比戏场关目，随意装点；......今燕昵之词，媒狎之态，细微曲折，摹绘如生，使出自言，似无此理，使出作者代言，则何从而闻见之，又所未解也。”-纪昀 ”《聊斋志异》虽亦如当时同类之书，不外记神仙狐鬼精魅故事，然描写委曲，叙次井然，用传奇法，而以志怪，变幻之状如在目前；又或易调改弦，别叙畸人异行，出于幻域，顿入人间；偶述琐闻，亦多简洁，故读者耳目为之一新。”-鲁迅 需要注意的是，“一书而兼二体”与“用传奇法，而以志怪”并非一个概念，纪昀认为传奇是可以虚构的，是艺术，而小说便是直录，不允许虚构，现实意义要超越它的艺术价值。《聊斋志异》在不是类书的情况下一书而兼有了传奇与志怪两种体制，没有形成统一的风格，在这点上是不值得推崇的。鲁迅先生则从创作的角度分析，认为《聊斋志异》使用了传奇小 --- 说的创作手法创作志怪题材，至于小部分近似六朝志怪的篇章，则多是因为故事简短不适宜用传奇手法，且即使是这小部分的短篇，也是十分简练，让读者耳目为之一新，并不影响《聊斋志异》的整个创作倾向和成为文言小说的巅峰之作。"},{"id":"427","stars":"★★★★","title":"试分析《聊斋志异》的诗化倾向","body":"《聊斋志异》是假狐鬼花妖抒情言志，虚实相生，作者构思、运笔也往往取法诗歌崇尚含蓄蕴藉的审美特征，小说带有诗化倾向。这具体体现在以下三方面：\n\n一、以诗词入小说\n\n《聊斋志异》中有些篇目直接以诗词入小说，如《翩翩》中翩翩吟诵的诗歌、《公孙九娘》中九娘在洞房之时吟诗两首、哭诉身世，《嘉平公子》狐女所写之诗等等。这种“诗文相间”的艺术手法，一方面能够烘托氛围，使读者在阅读故事的同时又能够诗文共赏，进而增加美感；另一方面，可以表达人物的内心情感，使故事情节丰富而充满诗情。\n\n但大幅度运用诗词骈语，无疑会削弱作品主题的表达和情节的推进，在一定程度上有逞才之意，偏离小说的艺术轨道。蒲松龄显然对诗文小说这个弊病有着一定的认识，因此诗词穿插只是少量使用。诗词成为作品的内在转化，是作者另外一种艺术形式的创新表现。《聊斋志异》摒弃大量入诗词的做法，是中国文言小说自然进化的过程。\n\n二、以诗歌品格建构小说\n\n《聊斋志异》很多篇章都表现出诗的品格特征，作者一方面借助具有诗情画意的意象建构小说，使情节孕育了一种含蓄美，如《黄英》《宦娘》分别是在《诗经》的“琴瑟友之”和陶渊明的菊花意象基础上结构故事的。这类作品虽然没有诗的外形，但情节充满灵性、不搬不俗，有一种含蓄蕴藉的美。\n\n另一方面是把诗的艺术手法灵活应用到小说创作中，并且在叙事细节和结构方式上细致渗入，表现出了一种理想化、超俗的朦胧意蕴。如《婴宁》《晚霞》，婴宁是“有女郎携婢，捻梅花一枝，容华绝代......遗花地上，笑语自去”，她的笑更表达出一种情不自禁、童稚无知的纯洁品格；鬼女晚霞的舞姿以及与阿瑞幽会环境，同样都是美到极致，作者在字里行间营造了一种诗的意境，同时体味出作者理想的追求。总体看来，《聊斋志异》无疑完成了一次华丽的蜕变，不管是情节、意象，还是诗化的意境，都表现出一种“诗性美”。\n\n三、结构作品的多种功能\n\n《聊斋志异》中的诗歌，不仅可以帮助主人公显才传情，而且还具有结构作品的多种功能：《公孙九娘》中九娘洞房枕上吟诗，哭诉身世悲情，充当了全篇的主题歌。《白秋练》里吟诗是男女主人爱情生命的纽带，吟诗成为一篇之主脑。《宦娘》的爱情是以音乐为媒介，全篇的构思体现了《诗经》名句“琴瑟友之”的意蕴。《黄英》显然是就陶渊明爱菊的诗歌意象做反面文章。\n\n【李凡说：诗歌羼入小说，最早见于《穆天子传》，其后六朝小说在粗陈梗概的同时也引用了不少诗歌，比如《搜神记》就有十几首诗歌。到了唐代，诗歌入小说更是兴盛一时，而且总体水平较高，不过这一现象在宋代逐渐减少。明清时期，部分文人效仿古人，也大量在小说中羼入诗歌。《聊斋志异》只是偶尔用之，蒲松龄更多的是诗意入小说、用写诗的手法进行创作。这是《聊斋志异》与其他诗文相间的小说的最主要区别，也是一大发展。】","keywords":"以诗词入小说 诗歌品格 意象 艺术手法 结构作品","note":""},{"id":"428","stars":"★★★★★","title":"试论述《聊斋志异》的人物塑造","body":"《聊斋志异》塑造了一系列令人难忘的形象，其高超之处体现在以下几个方面：\n\n一、鲜明个性中表现社会本质\n\n蒲松龄重视人物性格特征的描写，他往往让人物所代表的一定社会本质通过鲜明的个性表现出来。因此《聊斋志异》中的人物既属于一定的社会阶层，有其社会本质，又都有鲜明的个性。例如同是年轻的女性形象，有感情缠绵，拘于叔父严训而行动谨慎的青凤，也有天真烂漫，肆意言笑，不受任何礼教约束的婴宁。有爱诗善歌，“谈词风雅”，却心境凄苦的林四娘，也有不懂世事，顽皮憨跳，乐不知愁的小谢。\n\n二、掌握妖魅原型的特点\n\n作者在描写花妖狐魅所幻化的人物时，常能掌握妖魅原型的特点，也有助于人物的个性化。如《绿衣女》中写绿衣女是“绿衣长裙”“腰细殆不盈掬”，其声“娇细”，便活画出一个绿蜂幻化的女子形象。\n\n三、个性化的人物对话\n\n蒲松龄善于通过个性化的人物对话来刻画人物的性格，并注意通过矛盾斗争来描写人物，如《席方平》中的席方平。同时，蒲松龄还利用同篇中不同人物的对比突出人物的不同性格，如《成仙》中的成生与周生，《莲香》中的莲香与李女。\n\n四、丰富的细节描写\n\n《聊斋志异》增多增细了人物活动的细节描写，充分具备了小说的素质和功能。如《促织》叙写成名在县令严刑追逼的情况下，在一座古墓旁倾注精力探寻捕捉促织、怀着惴惴不安的心情与人斗促织的两段情节，细致入微，情态并现，令读者宛如亲见，随之而动情。\n\n五、通过环境描写烘托人物\n\n《聊斋志异》还善于描写景色，不只画面鲜明，而且常常造成一种气氛、境界，更好地烘托出人物的性格。如《婴宁》写婴宁所居之处，“门前皆丝柳，墙内桃杏尤繁，间以修竹，野鸟格磔其中”“门内白石砌路，夹道红花，片片堕阶上。曲折而西，又启一关，豆棚花架满庭中”“粉壁光明如镜，窗外海棠枝朵，探入室中”。这就和婴宁天真纯洁的性格互相衬映，显得异常调和。","keywords":"鲜明个性 社会本质 妖魅原型 对话 矛盾 细节描写 环境描写","note":"上述三题合起来可以算作《聊斋志异》的艺术特征，其中“一书而兼二体”一点中包括情节、结构、风格、语言等多个方面，大家要结合起来背诵。"},{"id":"429","stars":"★★★★","title":"《聊斋志异》是一部以幻想的形式写成的社会问题小说，请分析它所反映的社会内容","body":"《聊斋志异》是蒲松龄在大半生中陆续写出来的。由于境遇的不尽一样，关心的事情有所变化，写作态度、旨趣也有抒忧愤、寓劝惩、寄闲情、写谐趣、记见闻之别，所以这近五百篇作品内容颇复杂。总体来看，《聊斋志异》反映的社会内容主要有以下几个方面：\n\n一、通过对狐鬼花妖的赞美，否定丑恶的社会\n\n《聊斋志异》最突出的特点，是写了大量的鬼狐花妖，而且一般而言，对他们都表示了赞美。在蒲松龄笔下，很多狐女形象不仅容貌美丽，而且往往具有纯洁、善良、多智、果敢的人格。作者对这些美丽、纯洁、善良而有才干的狐女形象，倾注了极深的感情。对她们的赞美，也正是对人类社会种种丑恶的否定，而这个否定，也就是对作者生活的时代乃至整个封建社会的批判，这是贯穿《聊斋志异》全书的主导思想。\n\n二、歌颂美好爱情\n\n描写爱情主题的作品，在全书中数量最多，它们表现了强烈的反抗封建礼教的精神。其中一些作品，通过花妖狐魅和人的恋爱，表现了作者理想的爱情。如《婴宁》《莲香》《香玉》中的男女主角不顾封建礼教的约束，按照自己的感情和意愿，大胆地追求心爱的人，并都获得了幸福的结局。\n\n《聊斋志异》中爱情主题的另一些作品，揭露了封建社会对青年男女爱情生活的种种阻碍，表现了他们的反抗斗争。《鸦头》《细侯》《连城》《宦娘》都是这方面的优秀作品。《鸦头》中的狐女鸦头是一个敢于反抗家长淫威的女性形象。《细侯》则揭露了富商大贾对青年幸福的破坏和妓女细侯的激烈反抗行动。《连城》写乔生和连城争取自由婚姻的斗争，尤为曲折动人。\n\n三、批判黑暗政治\n\n《聊斋志异》中有很多作品直接或曲折地揭露和嘲讽了封建社会的黑暗政治以及帝王官绅的罪恶。如《席方平》《促织》《梦狼》《红玉》等。\n\n《聊斋志异》对黑暗政治的抨击有以下几个特色：小说揭露的是整个吏治的腐败，而不是个别官吏的品德不良，这触及了封建政治的本质问题；小说不仅揭露一般官吏，还将矛头指向最高统治者皇帝，表现了作者强烈的爱憎感情；不仅无情地揭露统治者的罪恶，还借助现实或超现实的力量，使恶人受到惩罚，被压迫者过上幸福生活。此外，《聊斋志异》还在不少作品里揭露了贪官蠹役、土豪劣绅种种压迫人民的暴行。\n\n四、抨击科举制度的腐败\n\n蒲松龄长期困于场屋，强烈感受到科举弊端关键在于考官的昏庸，黜佳才而进庸劣。《聊斋志异》里许多篇章对科场考官冷嘲热讽，如《神女》《阿宝》等篇都暗示了科举考试的贿赂公行，《司文郎》《于去恶》等篇则有力地抨击了考官的有目无珠。\n\n此外，作者也反映了热衷功名的士子痛苦空虚的精神世界，他对那些只以功名利禄为念而醉心科举的人物，有着深刻的认识和批判。如《王子安》《续黄粱》分别通过梦境对王子安、曾孝廉这类士子进行了有力嘲笑。\n\n同时，作者对那些不肯向科举制度低头、不屑“易面目图荣耀”的士子，也给予了热情的赞扬。《贾奉雉》中的贾奉雉“才名冠一时，而试辄不售”。后来他“戏于落卷中，集其阘冗泛滥不可告人之句，连缀成文”“竟中经魁”。可是当他回头来看这些文章时，却“一读一汗”，自觉无颜见人，终于“遁迹丘山”而去。\n\n五、热情歌颂民众的反抗斗争\n\n《聊斋志异》塑造了一系列富有反抗性的人物形象。席方平是其中一个突出的代表，他身上有着“大冤未伸，寸心不死”的顽强斗争精神，表现了对压迫者的刻骨仇恨，也反映了我国人民传统的高贵品质。《向杲》中向果的化虎报仇也表现了同样的精神。\n\n尤为可贵的是作者塑造了许多反抗的女性形象，如梅女、侠女、商三官等。商三官的形象尤为突出。她为了给父亲报仇，竟女扮男装学做优伶，终于在仇人诞辰，登场作戏，手刃了仇人。\n\n六、热情赞颂平凡人的种种美好的品德\n\n蒲松龄在《聊斋志异》中热情讴歌了平凡人物的美好品德，包括不屈不挠地反抗精神、热情无私、诚实淳朴、勇敢机智等。如《张诚》写兄弟之爱，《娇娜》写真诚的友谊，《崔猛》写打抱不平，《宦娘》写成人之美，《田七郎》写知恩必报等。\n\n七、概括社会人生的经验教训，对世人进行教育和劝诫\n\n大半生做塾师的蒲松龄自然也很关注家庭伦理、社会风气，时而就其见闻感受，写出一些讥刺丑陋现象、颂扬美好德行的故事。由于立意在于劝诫，这类篇章多数是直写现实人生，少用幻化之笔，而且是以现实的伦理道德观念作为美刺的原则。如《画皮》教人要透过外貌看到本质，《黑兽》说明面对强暴决不可延颈受死，对封建社会被宰割的人民有一定启发意义。","keywords":"赞美狐鬼花妖 否定丑恶社会 歌颂美好爱情 批判黑暗政治 抨击科举腐败 歌颂民众反抗 赞颂美好品德 教育和劝诫","note":"《聊斋志异》是一部具有独特思想风貌与艺术风貌的文盲短篇小说集，通过幻想形式谈狐说鬼，内容却深深扎根于现实土壤，曲折反映了蒲松龄所处社会的矛盾以及民众的思想愿望，熔铸了作家的独特感受。作品的思想内容常与“狐鬼花妖”结合起来考查，大家要有所把握。需要注意的是，蒲松龄的生平经历也对《聊斋志异》的思想艺术等方面产生了很大的影响，具体题目可以在李凡文学正版群领取。"},{"id":"430","stars":"★★★★","title":"试分析《儒林外史》的结构特点","body":"中国乃至世界近代长篇小说传统的结构方式主要是由少数主要人物和基本情节为轴心而构成一个首尾连贯的故事格局。但《儒林外史》是一部对百年知识分子厄运进行反思和探索的小说，因此很难以一个家庭，或几个主要人物构成首尾连贯的故事。于是吴敬梓采取了编年和纪传相结合的方法，以时间为序，根据亲身经历和生活经验，对百年知识分子的厄运进行思考，以此为线索把“片断的叙述”贯穿在一起，写出了二三十个人物的行状，创造了一种长篇小说的独特结构。它冲破了传统通俗小说靠紧张的情节互相勾连、前后推进的通常模式，写出生活本身的自然形态，体现出以下三个特点：\n\n一、片断性\n\n《儒林外史》没有贯穿全书的中心人物和中心事件，即缺乏主干。没有主干就缺乏人物聚焦式的主要系统，多者停留数回，少者一闪即过，每个人物在作品中都很重要，难分主次，并共同构成了整体意义上的群儒景观，他们没有演绎有头有尾的悲欢离合，能够把握其作为一个人物存在的，只是其中片断性的场面和细节。如范进的活动时空，主要有三个片断：一是积数十年的屈辱挣扎，于绝望中却暮年登科的情景；二是范进周府拜见恩师的画面；三是任山东学道时的场景。这其中省略了范进从举人到进士的艰辛奋斗史，一到考中进士立即被其他纷纷上场的人物所淹没。\n\n人
