评的最高原则和方法论的内涵要求。\n\n总的看来，将美的观点和历史的观点作为马克思批评的最高原则和方法论也是经过长期批评实践检验过了的，是得到了大家公认的，二者相互联系，相互促进。", "keywords": "普遍规律 特殊规律 审美作品 历史条件下社会关系的产物 微观分析和具体评价 价值取向和方法原则 丰富性 辩证性 开放性", "note": "马克思主义文学批评提出美学的观点和历史的观点。它科学地选择和包容着各种批评形态的合理因素，也作为权威性批评话语形式指导着各种具体批评方法的运用。在中国社会主义条件下，马克思主义的文学批评，要在坚持“为人民服务、为社会主义服务”的方向和“百花齐放、百家争鸣”的方针的前提下，正确运用批评标准去推动文学的创造和消费，促进社会主义文学的繁荣发展并使自己也得到发展。", "framework": ""}, {"id": "287", "stars": 3, "title": "怎么理解思想标准和艺术标准的具体内涵及两者的关系", "body": "一、思想标准和艺术标准的具体内涵\n\n任何文学批评都是有标准的，思想标准和艺术标准是马克思主义批评的具体操作标准。思想标准和艺术标准各有其自己的内涵。\n\n（一）思想标准是衡量文学作品思想性正误强弱的尺度，是指作品题材、主题或者形象、意蕴所显示出来的社会、政治、道德、哲学、宗教等等意识形态观点及其所产生的思想力量。具体说来，体现在三个方面：\n\n（1）从作品与社会生活的关系考察其是否具有高度的真实性。这个真实应该是生活现象的真实与历史本质的真实的统一，即包含着某种必然性的那种偶然性的真实，因为只有这样的真实才能提供某种真实性的认识，才能显示出即使作家不曾认识但是却包含在作品中的客观的思想意义。\n\n（2）就作品与作家的关系考察其是否具有进步的倾向性．作品的倾向性是作家渗透在作品中的对社会生活、对人生命运、对历史发展的趋向性的理解、认识、追求和主张。\n\n（3）从作品影响人们的特殊途径考察作品是否具有积极健康的情感性。一部作品要产生其思想影响，达到思想方面的良好效果，不是靠直接的“理性”教化，而是依赖动人的情感感化。思想标准的三个基本点，在具体的批评实践中，不仅相互联系，而且是与艺术标准密切相关的。\n\n（二）艺术标准是衡量文学作品艺术性高低优劣的准绳，体现在三方面：\n\n（1）文体的评价，即对文体的外在形态、内部结构所达到的完美程度做出分析判断。真正完美的文体，语言、结构、手法都不仅是一种有意味的形式，而且富有张力和弹性，具有充分的表现力。\n\n（2）艺术形象的评价，一定的文体是表现一定的形象和情景的，因此，艺术形象的批评就成为艺术标准的又一要求。评价作品的形象和情景的高下得失，从总体上来说有四个着眼点：一是看是否具有鲜明性；二是看是否具有生动性；三是看是否具有独特性；四是看是否具有概括性。\n\n（3）意蕴的批评。意蕴是包含于文体和形象之中又超越其上的韵调、情感、思想和精神。意蕴批评就是对艺术作品深层次的“能指性”的批评，对情感内涵、哲理内涵、社会思想内涵等等的评价。一般来说，它要求有两个着眼点：一是看其是否深刻；二是看其是否丰富。\n\n二、二者关系\n\n思想标准和艺术标准虽然各有其内涵，但是二者又是紧密相连的。没有思想性的艺术作品，也没有艺术性的艺术作品。它们在具体的作品中往往侧重不同。有的作品可能思想性有余而艺术性不足，有的作品也可能艺术性有余而思想性不足，而且对作品思想性和艺术性的评价也会随着时代的变迁而改变。概括说，虽然在各个时代其有不同的侧重点，但是总体上二者总是紧密联系，相互融合的，一部真正意义上的艺术作品总是在两方面都有出色的表现的，并且达到合二为一的境界的。", "keywords": "思想性正误强弱 高度的真实性 进步的倾向性 积极健康的情感性 艺术性高低优劣 文体的评价 艺术形象的评价 意蕴的批评 紧密联系 相互融化", "note": "思想标准重在评价文学作品表现了什么样的意，艺术标准重在评价文学批评怎样表现了意。用通常的表述则为：思想标准是衡量作品思想意趣真假正误、好坏善恶的尺度，而艺术标准是评价作品艺术创造高下优劣、成败得失的准绳。思想标准和艺术标准虽然从理论上可以指出其具体内涵，但是在批评的实践应用中，由于不存在没有思想性的艺术作品，更不存在没有艺术性的艺术作品，因而两者总是相互联系并且互为条件的。", "framework": "是否具有高度的真实性 思想标准：衡量文学作品思想性正误强弱的尺度 是否具有进步的倾向性 是否具有积极健康的情感性 文学批评的 具体内涵 文体的评价 思想标准和艺术标准 艺术标准：衡量文学作品艺术性高低优劣的准绳 艺术形象的评价 意蕴的批评 二者关系：紧密联系，相互融合"}, {"id": "288", "stars": 3, "title": "分别选择一种批评模式，说明传统批评模式与现代批评模式的区别", "body": "传统批评模式和现代批评模式是以20世纪为分界线，20世纪之前的批评模式称为传统模式，主要包括伦理道德批评、社会历史批评和审美批评。20世纪之后的批评模式称之为现代批评模式，主要包括心理学批评、语言学批评和文化批评。这些批评模式同样作为文学批评模式并无本质上的区别，更多的是在特定理论背景、读解方式和效能上引起差异。下面将选取社会历史批评和语言学批评作为范例，具体分析其区别。\n\n一、理论背景方面\n\n社会批评源远流长，其形成与19世纪西方科学实证主义的思潮密不可分，社会学、历史学、民族学、民俗学的发展为其打下了鲜明的时代特色，并在马克思主义的改进和变革下日趋走向成熟。\n\n而语言学批评伴随着20世纪西方哲学与美学界发生的一次语言学转向，以语言问题而取代原来的理性问题的批评模式。它的出现与语言学本身的发展和哲学的语言学转向是密不可分的。语言学批评又与俄国形式主义、英美新批评派、结构主义等等有着密切的联系。\n\n二、解读方式方面\n\n社会历史批评更关注作品和社会历史的关系，在乎文学作品的社会认识功能和历史意义。因而会通过对作品的文学批评转向对社会历史的批评，视野非常广阔。\n\n而语言学批评则认为文学作品是一个独立自足体，是一种有组织的符号结构，强调作品的意图只需从其内部去寻找。语言的语境、语义、能指性、信息作用是构成形象、形成结构的重要因素。\n\n三、批评效应方面\n\n社会历史批评更多地关注作品的思想内容，更在乎文学作品的认识功能和批判功能。\n\n而语言学批评则更看重文学自身，是“内向型”批评模式，从而对文学作品的语言魅力给予了充分的关注。\n\n由此可见，传统批评模式和现代批评模式的差异主要体现在理论背景、解读方式和批评效应上面，但是二者并不存在本质的差异，都是围绕着文学作品展开的，而且在具体情况下也可以相互交叉、互相借鉴。", "keywords": "20世纪为分界线 伦理道德批评、社会历史批评和审美批评 心理学批评、语言学批评和文化批评 理论背景 解读方式 批评效应 相互交叉、互相借鉴", "note": "传统批评模式与现代批评模式并没有截然的时限区分，也不意味着两者不可相容。传统的批评只意味着它兴起较早，运用较久，因而也比较成熟和相对稳定；而现代批评模式，则意味着它兴起较晚，运用较新，因而正处于发展之中。", "framework": ""}, {"id": "289", "stars": 2, "title": "如何理解伦理道德批评", "body": "无论在西方还是在中国，伦理道德批评都是兴起最早而又影响深远的一种批评模式。所谓伦理道德批评，往往以一定的道德意识及其由之而形成的伦理关系作为规范来评价作品，以善、恶为基本范畴来决定对批评对象的取舍。这种批评着重于对文学作品的道德意识性质和品位的评价，实现作品的伦理价值及道德教化作用。\n\n由于道德是一个历史的范畴，伦理关系是一种历史的关系，因而在不同的社会发展阶段、不同的民族地域、不同的阶级阶层中，道德意识、伦理关系、善恶标准都会有不同的甚至相互对立的具体内涵，这样就使文学的伦理道德批评呈现出如下几个鲜明特点：\n\n一、历史久远性\n\n由于各阶级、各民族、各社会形态都需要道德来规范人们的意志行为，建立人与人、人与社会、人与国家或群体的伦理关系，以维护其生存和发展，因此伦理道德批评具有历史的久远性。在历史的整个发展过程中都存在伦理道德批评这种模式，在西方，不仅是新古典主义以前有，在中国，也不仅是魏晋以前才突出。实际上，文艺复兴时期，人道主义作为一种道德原则和理想用于文学批评其实就是伦理道德批评，而我国宋明理学的文学批评也是伦理道德批评。时至今日，无论在西方还是东方，伦理道德批评模式依然发挥着不小的作用。\n\n二、流动变化性（多样性）\n\n由于伦理道德批评的道德内涵和道德标准随着社会发展和社会关系的变化而发展变化，并因阶级、民族的不同而有差异，因而伦理道德批评模式在形式上似乎是恒定的，而在内容上则是流动变化的，这使伦理道德批评作为一种模式也具有了多样性，即使在同一时代、同一民族，甚至同一阶级，由于道德理想的差异，伦理道德批评也是多样的。\n\n三、差异性\n\n由于伦理道德批评的历史性和多样性，它在评价作品“道德”或“不道德”时便有了明显的差异性甚至敌对性。例如将《水浒传》视为“海盗”之作还是视为“义归山林”之作，正是道德评价的冲突性的一种突出表现。", "keywords": "道德意识 伦理关系 善、恶 道德意识性质和品位 道德教化 历史的久远性 多样性 差异性甚至敌对性", "note": "①伦理道德批评在实践时应该看到伦理道德在文学作品中存在形态的差异。首先应该看到有的伦理道德内容实际上是一直隐含地存在并主宰着文学作品中的人物命运，事件的发生、发展趋势的，它并不能代表作家的伦理道德理念。第二个层次是要分清叙述人的道德理念，不能将这种伦理道德评价等同于作者的道德评价。第三个层面才是作者的道德观念。一般说来，作者的观念大体和叙述人的观念接近。②从本题开始，下面的几道题都是文学批评流派的考查，建议大家也多看看前面马工程版本的1000题，起到补充作用。", "framework": ""}, {"id": "290", "stars": 2, "title": "如何理解社会历史批评", "body": "社会历史批评是产生较早、影响较大的一种批评模式。这种批评强调文学与社会生活的关系，认为文学是再现生活并由一定的社会历史环境所形成的，因而文学作品的主要价值在于它的社会认识功用和历史意义。其基本的原则是：分析、理解和评价作品，必须将作品产生的时代背景、历史条件以及作家的生活经历等与作品联系起来考察。\n\n这种批评，在我国先秦思想家中以孟子的概括最为简明，如其“以意逆志”和“知人论世”，即了解作家并联系作品产生的社会历史状况。这种批评观点，也深刻地影响到后世的批评。中国的批评传统中重视三个方面：考据、义理、辞章。考据求信，义理求善，辞章求美。所谓考据，就是求作品的“本事”，作品再现了什么样的真实生活，然后再求其“义理”，即真正的认识价值和历史意义。其实，直到鲁迅、瞿秋白等批评大家，他们的批评也主要是社会历史批评。\n\n西方社会历史批评，最初是与伦理道德批评结合在一起的，或者说在伦理道德批评时注意到了作品与社会生活的关系，柏拉图、亚里士多德、贺拉斯都有这种情形。法国的圣佩韦和丹纳，都是社会历史批评的著名人物。狄德罗强调艺术与社会生活的联系，要求真实地表现生活中的环境，人物的身份、性格，落脚点在于强调艺术的教育作用；斯达尔夫人在其《从文学与社会制度的关系论文学》中完全实践了社会历史批评，圣佩韦和丹纳则在实证哲学的基础上，完善了社会历史批评的理论，形成了有影响的批评学派和批评形态，而丹纳在更广阔的视野上展开了他的社会历史批评，他在其名著《＜英国文学史＞序言》《艺术哲学》等书中，提出了影响深远的决定文学创作和文学发展的“三因素”说，即种族、环境、时代，其中又特别强调了时代作为后天动量的巨大影响和作用。他认为一个作家应该去“表达整个民族和整个时代的生存方式”。\n\n社会历史批评给当代的文学批评以很多有益的启示和重大的影响。由于“新批评”的兴起，社会历史批评逐渐出现衰微之状，尽管他们还承袭着丹纳和圣佩韦等人的理论，但视野偏于狭窄。不过，在个别批评中，仍不乏精细深刻的见解，这是值得注意的。", "keywords": "社会生活 再现生活 社会历史环境 中国社会历史批评 西方社会历史批评", "note": "①无论在中国还是在西方，社会历史批评几乎伴随着文学批评的整个发展进程。从中国早期在文学评价活动中自发地探讨文学和社会的关系，到西方社会学影响下产生的社会学批评，再到19世纪俄国革命民主主义者的文学批评，社会历史批评经历了多种形态。②社会历史批评认为文学不是凭空创造的，而是一定社会历史条件的产物。社会历史批评一直强调文学的盛衰和发展的根源存在于社会历史之中，是社会诸要素推动或者妨害了文学的发展。③丹纳的社会历史批评在马工程版本的1000题有详细介绍，大家自行翻阅即可。", "framework": ""}, {"id": "291", "stars": 5, "title": "如何理解审美批评", "body": "审美批评往往着眼于文学作品的美的构造及其审美价值，着重强调作品的“畅神”“移情”效果和娱乐、愉悦作用，把文学作品看作是在真善基础上又超越了真善，因而是“超功利”的一种审美对象。认定美是文学的本质属性之一。审美批评在西方流派众多，很难找到比较共同的术语，而在中国比较有影响的审美批评说是“滋味”“妙悟”“空灵”“神韵”之类。审美批评作为一种批评模式，其特点大体可以归纳为三点：\n\n一、审美批评首先是一种情感性评价，它着眼于作品以什么样的情感并在多大程度上得到了成功的表现和引起了读者的心灵震荡与情感激动。这是因为文学作品是“情动于中而形于外”的产物，是“哀乐之心感，歌吟之声发”的结果。另一方面正如康德所说的：纵使审美判断（像一切判断那样）也含有悟性，但它却只是联系于主体（它的情感），依照着这表象对主体的关系和主体的情绪来把握和评价。\n\n二、审美批评又是一种体验与超越矛盾统一的批评，这种批评往往具有“超功利”的性质。这是因为文学作品并不是直接的现实，它不过是一个虚构的想象世界。人们在阅读文学作品时一方面要联系社会生活和自身实践加以领会，另一方面也要保持一种静观状态和适当的距离去感受和评价它，超越一般的功利欲望。\n\n三、审美批评还常常是一种形式或者形象的直觉批评，这是因为文学作品是一种特殊的形式表现或形象构成，能直接作用于人们的五官感觉，因而审美判断也意味着对形式的直觉性判断，即形式是否和谐、完美，形象是否鲜明、独特。", "keywords": "美的构造及其审美价值 “畅神”“移情”娱乐、愉悦作用“超功利”情感性评价 体验与超越矛盾统一的批评 形式或者形象的直觉批评", "note": "审美批评不是单纯的形式批评，文学作品的审美性不是只能由作品的艺术形式派生。审美批评是整体性批评，它不是先把对象分成几部分然后再综合起来，而是自始至终把对象作为整体对待，从整体与部分相互依赖、相互结合、相互制约的关系中揭示对象的审美特征。审美批评的诸因素都从艺术作品的整体要求上着眼，看它各方面的搭配结合是否富有生命力并能产生最优化的审美效果。", "framework": ""}, {"id": "292", "stars": 2, "title": "如何理解心理学批评", "body": "心理学批评主要是指运用现代心理学的成果来对作家的创作心理及作品人物心理进行分析，从而探求作品的真实意图，以认识其真实价值的批评。心理学批评立足于作品人物的心理分析，进而试图找出作者创作的心理机制与意识或无意识动机，然后再对作品为什么要用这样的形式技巧、语言符号作出解释。\n\n文学艺术现象始终是人类精神活动、心灵活动的过程和结果，体现了人生和人性的丰富内涵，而这些恰恰又是心理学始终关注的对象。正因为这样，从心理学的意义上探讨文学艺术的奥秘，从来是一个引人入胜的课题。在西方古代文论中有关心理批评的比较著名的学说有柏拉图的“迷狂说”，亚里士多德的“净化说”，贺拉斯的“体验说”等等。在中国古代也有许多著名的心理批评学说，比如“虚静说”“言意说”和“教化说”。\n\n现代文学心理学批评是由西方启动的，其发展与西方现代心理学密切相关。比较有影响的比如冯特的内部经验与文学，詹姆斯的意识流与文学，弗洛伊德的精神分析与文学，荣格的原始意象与文学，拉康的结构精神分析与文学以及阿恩海姆的格式塔与文学。心理批评的主要方法有个案分析的方法、心理发生学的方法、话语报告的方法、观察的方法以及精神病理学的方法。其批评形态可以是传记式批评，也可以是原形批评，或者是结构主义精神分析批评。心理批评经过漫长的历史年代，在今天面对人类社会的重大转折，面对人类精神生活中遭遇的种种困境，心理学批评依然保留自己一定的发展空间。", "keywords": "创作心理 作品人物心理 真实价值 人生和人性的丰富内涵 西方现代心理学", "note": "广义的心理学批评就是指依据心理学的基本理论和原则来研究文学现象的批评方法；狭义的心理批评是指把弗洛伊德的批评理论融入文学汲取心理学成果，立足于艺术作为精神活动的特殊性，对艺术家创作过程中的心理现象和艺术作品中包含的心理现象以及接受者的欣赏心理进行分析的批评方法。", "framework": ""}, {"id": "293", "stars": 2, "title": "如何理解语言学批评", "body": "在20世纪的西方哲学界与美学界发生了一次语言学转向，语言问题从而取代了原来的理性问题而成了许多思想者关注的中心。20世纪的语言哲学主要关注“我们如何表述我们所知晓的世界的本质”。以这样一种视角来打量20世纪西方所出现的诸多批评流派（如象征主义、形式主义、新批评以及结构主义等），就会发现它们都热心于语言问题，甚至狂热地关心过语言问题，并试图从语言或形式的层面入手来对文学作品进行分析，因此，它们的理论主张首先有许多相似之处。\n\n一、它们都认为文学作品是一个独立自主的整体，是一种有组织的符号结构，作品的意图只需要从文本中去寻求而无需借助于外部因素加以说明。语言的语境、语义、能指性、信息作用是构成形象、形成结构的极其重要的因素，因而，只有通过对文本的语言分析，才能探求到作品的意图。\n\n二、这些批评流派相互之间又有着干丝万缕的联系，一些批评流派的人物如象征主义的托·斯·艾略特，同时又具有英美新批评派的观点，并且也属于这一派别；俄国形式主义的代表人物罗曼·雅各布森，又可以说是开结构主义理论先河的人物之一。实际上，从俄国形式主义到新批评再到结构主义，它们之间存在着历史的内在联系。从广义上讲，它们都可以叫做形式主义或结构主义，都可以划归形式学派。而实际上，它们又都是主要运用语言学来研究和批评文学，所关心的是语言结构及其在结构中的能指性、转换性、象征性。\n\n总之，语言学批评是从俄国形式主义到新批评再到结构主义共同看重的批评模式，其间虽各有其特点甚至各有不同的术语范畴，但抓住文学语言开展批评却是相似的。\n\n语言学批评有其可取之处，在探讨语言在文学作品中的功能、含义、技巧方面，在对文学语言与非文学语言的区分方面，在对语言表意层次的探究方面，以及文学作品中语言的所谓反讽、悖论、张力、隐喻、象征和普通语言如何在文学作品中被强化、扭曲、拖长、颠倒等特点的揭示方面，还有关于“奇特化”或“陌生化”手法方面，都显示了它的精细性和明晰性。尤其是新批评的“细读法”，在纠正文学批评中所存在的粗疏、简单陋习方面更是功不可没。\n\n但是，语言学批评又常常太“语言学化”了，它们把文学文本当成了一个封闭的自足体，既切断了与社会历史的关联，又回避了内容的分析，这样也就抽掉了文学中活生生的人文内涵；同时，它们也往往混淆语言学与文学的界限，将文学批评变成了枯燥、繁琐、抽象的语法分析、结构分析与技巧分析。所有这些，都可以看做语言学批评的致命弱点。\n\n在中国古代文学批评中，实际上也存在着一种语言批评。这种批评集中表现为讲究语言表现的张力、弹性和效能，例如讲究“意在言外”“以少总多”、推敲，注重“诗眼”“词眼”“文势”和“气韵”等。中国古代的语言批评与20世纪西方的语言学批评是两个不同的范畴，其思路、切入作品的方式和批评的操作方法都有着明显的不同，这是需要特别予以注意的。", "keywords": "语言学转向 独立自主的整体 符号结构 流派间联系 俄国形式主义 新批评 结构主义 可取之处 太“语言学化”中国古代文学批评不同", "note": "语言学批评是一种把审美文本的语言状况置于中心地位的批评方式。19世纪末20世纪初西方美学发生的“语言论转向”，似一股巨大的潮流带给美学领地以强烈的震惊。对“语言”的重新发现促成了现代语言观，语言符号作为审美代码在分析文本时得到突出重视，语言以压倒性的身份占据了批评的首席。受此影响，中国当代美学也出现了语言学形态。它从艺术理论和批评中破土而出，进而在美学批评界发起了强大攻势，形成颇具影响力的语言学批评方式。", "framework": ""}, {"id": "294", "stars": 3, "title": "如何理解文化批评", "body": "从严格的科学意义上说，文化批评不是一种如其他批评模式那样成型的流派或模式；从文学批评的实践上说，文化批评也不是现代才出现的批评意向和批评形式。文化学或文化社会学、文化政治学意义上的批评，其实古已有之，孔子在讲到诗的功用时，提出“迩之事父，远之事君”，曹丕把文章看做“经国之大业，不朽之盛事”，也是文化批评。我国长期以来“文以载道”的衡文主张，也是文化批评。\n\n现代意义上的文化批评，就西方而言，前有20世纪30-40年代德国的法兰克福学派大众文化批判理论开其先河，后有20世纪60年代英国的文化研究进一步跟进，如今已呈燎原之势。无论是法兰克福学派的大众文化批判理论，还是英国的文化研究，都意味着文学研究与文学批评发生了重大的转向，即由文学自身的内部研究转向文学与外部广泛联系的研究。现代意义上的文化批评，就中国的发展来说，出现于20世纪90年代，风生水起，渐涨渐热，文学理论研究和文学批评趋之如潮。\n\n从西方的文化研究到中国的文化批评，如果统称之为文化批评，那么，可以发现，它既不是囿于文学文本或单纯文学的批评，也不是单纯的“外部”批评，而是在解读甚至审读文本的前提下，“联系”文学外部或跨越文学边界于诸文化现象之中的批评，尤其是联系权力与文化关系的批评。文化批评首先关注文化生产者的话语权力。从西方文化研究或文化批评的实践情况看，它关注文化生产者的话语权力，又特别强调工人阶级、平民大众、妇女和种族中的弱势群体等的话语权力。所以，文化批评不像其他批评模式那样主要关注历史经典、精英文化、主流文化，而是注重当代文化、大众文化、被主流文化排斥的边缘文化和亚文化，如工人阶级文化、女性文化、被压迫民族的文化，等等。并且，文化批评所注重的文化对象，往往有着消解主流文化、对抗文化霸权的指向。这种对象和指向，也使文化批评在态度和方法上有别于传统研究或传统批评，例如，文化批评更注重保持与社会尤其是社会底层的密切联系，提倡用多学科、跨学科、超学科乃至非学科的学识结构和活跃思维来展开批评，把文化意识贯穿到底。\n\n由此可以看出，文化批评是一种泛文学的批评，又是一种泛学科的批评。所谓泛文学，是指它的对象不局限于文学，而是涉及广泛的文化现象，文学只是文化中的一种表现；所谓泛学科，是指它批评的理论背景绝不只局限在文学学科，而是多学科甚至非学科，凡文化范畴内的知识、学问、学科，都可以用于批评。而凡此种种，均使文化批评具有了明显的批判色彩、对话色彩和平民色彩，从而拓宽了不同话语的共存空间。从这个意义上说，文化批评比之原有的文化学意义的批评是崭新的，开辟了文学批评的全新视野。\n\n文化批评的全新视野，需要用丰富的阅读实践、宽泛的学科知识、厚实的生活阅历、鲜活的创造性思维来充实和保障。中国的文化批评，除了在学术性层面的探讨中各抒己见，有一定的理论建树外，在泛文学的批评实践中，也显示了它独特的活力和生气。因此，文化批评既有助于拓宽人们的研究视野，也有助于人们对当代文化（尤其是大众文化）的批判性认识。", "keywords": "古已有之 文学与外部广泛联系 当代文化、大众文化 边缘文化和亚文化 消解主流文化、对抗文化霸权 泛文学 泛学科 批判色彩、对话色彩和平民色彩", "note": "文化批评是一种从文化的角度来看待文学艺术的批评模式，它也可以称之为文化研究。文化批评的出现是与20世纪出现的俄国形式主义、英美新批评、结构主义等各种文本批评的“向内转”趋势相对应的，强调对作品的研究和作品之外的社会文化联系起来的“向外转”的趋势的表现。其主要代表有德国的法兰克福学派、英国的文化研究等等。", "framework": ""}, {"id": "295", "stars": 1, "title": "立足中国的社会历史语境，简析文化批评出现的必然性与合理性", "body": "现代意义上的文化批评，就我国的发展来说，兴起于20世纪90年代，它出现的必然性和合理性主要体现在以下三个方面：\n\n一、市场经济发展兴起的现实，带来了文学和文化的巨大变化，其中最突出的是所谓美文学的式微，俗文学的兴起，从而使文学批评的视野不能再局限于文学传统的狭小圈子里面，而需要走出去，面对现实。从这个意义上来看，文化批评是对重新组合的文学格局的具体跟进。\n\n二、西方的文化研究以及后现代文化思想的全球性传播，使改革开放多年的中国文学批评和文学理论，以其应有的敏锐，快速接受了其中的创见性成分和有效性方法，在介绍中接受，在接受中研究，在研究中实践，逐渐形成了中国文学文化批评的热潮。\n\n三、中国的文学研究、文学理论和文学批评，自20世纪50年代以来，自身的根底比较薄弱，先是受到苏联批评理论、批评模式的影响，80年代起又受西方批评思想、批评理论的影响，而且通常都当做“前沿”来对待，因而往往是带有文化批\n\n评性质的社会历史批评。\n\n总体而言，文化批评是现代中国适应历史潮流的产物。但是在实践上还有待深入，从而避免对低俗文学的过分热情和讨好。", "keywords": "市场经济发展兴起 走出去 西方的文化研究 后现代文化思想 根底比较薄弱 适应历史潮流", "note": "①在中国社会历史语境下，文化批评的出现虽然已是不争的事实，并且有一定的必然性和合理性，但是也存在若干值得商榷的问题。②这个题当做背景了解一下就好。", "framework": ""}, {"id": "296", "stars": 2, "title": "谈谈你对文学批评的实践以及学院批评的认识", "body": "一、文学批评的实践及分类\n\n在文学活动中，文学批评既是一种基础理论，又具有突出的应用性和实践性，这意味着文学批评主要并非高头讲章，而是要近距离地介入文学现场，围绕文学活动中出现的文学作品、文学现象、文学事件等进行解读和评析，发出自己的声音。这样，文学批评就成为运用相关的批评理论、批评方法和批评模式所进行的一项实践活动。作为实践活动，文学批评会涉及很多内容，但限于篇幅，这里仅从批评样式入手，考察其实践功能，分析其实践品格，确认其实践的正负价值。\n\n结合中国当下文学批评的现状，我们可把文学批评的样式一分为三：学院批评、媒体批评和读者批评。之所以如此划分，是因为文学批评发展至今，确实已呈三分天下的格局：学院批评依然是其主流，但媒体批评发展迅猛，读者批评也轰轰烈烈。\n\n二、学院批评\n\n学院批评被叫响的时间是20世纪90年代，随着文学批评进入正规的学术话语机制之中，其印象主义气息逐渐淡薄，实证和学理的意味则越来越浓，文学批评开始学术化了。正是在这一意义上，我们可以把学院批评界定如下：它是以学院（高校、学术研究机构）中的文学教师、研究人员为批评主体，以作家作品、文学思潮、文学现象等的学理化解读为主要批评对象，以文学意义或价值的生产与呈现为基本宗旨，以专业的批评符码与表意策略为批评追求，在学术话语的规则中加以运作并在专业的学术期刊得以发表的批评样式。\n\n（一）特点\n\n（1）印象式批评看重个人的主观感悟和对作家作品的整体印象，学院批评则注重学理的呈现。后者常常把批评对象还原到其生成的语境当中，在历史的追问中展开，在逻辑的思考中推进，强调占有材料，追求言之有据，故所进行的批评显得扎实、稳健、厚重。\n\n（2）学院批评常常能体现出明显的角度意识和方法意识，从而使自己的解读与阐释显得与众不同。因此，方法与角度往往成为学院批评的常规武器。\n\n（3）学院批评一般行文朴实，语言规范，不求辞藻之华美，但求论述之严谨，说理之透彻。论文体而不是随笔体常常成为其文体和语体风格。\n\n（二）不足与缺陷\n\n（1）体制化带来的问题。文学批评进入学院之中即意味着进入一种学术体制之中，成为了知识传授和知识生产的组成部分，从而丧失了批评的激情、生机和活力。尤其是学院批评演变为某种申报课题或在研项目后，又意味着它必须接受学术体制的规训。“规定动作”一多，就必然会挪用或挤占“自选动作”的空间。结果，学院批评变得越来越知识化、学术化和规整化，批评因此被削弱了激进的思想锋芒，批评家也丧失了提出重大问题的能力。\n\n（2）专业化带来的问题。在专业分工越分越细的今天，与文学现场构成互动关系的学院批评几乎已被当代文学专业垄断。为了积累或巩固这一专业的文化资本，学院批评家往往借助于自己的专业优势和话语权力，为一线作家的所有作品叫好，为“当代文学经典化”造势，从而丢失了客观、冷静、公正的学院批评立场。\n\n（3）圈子化带来的问题。圈子化可以从两个层面进行理解，其一是通过学院教师的“传帮带”，致使学院批评形成一个个的“神圣同盟”。盟主与其成员心往一处想，劲往一处使，生产话题，集体攻关。但这种话题常常远离文学现实，只是圈内人玩的话语游戏。更有甚者，其话题经“高大上”的概念术语包装之后，行文晦涩，文风怪异，渐成某种“学术黑话”，成为大多数人看不懂，甚至业内人士也颇费猜测的“密码语言”。其二是通过邀请学院批评家参加种种“研讨会”，使其进入“人情批评”和“红包批评”的圈子。在这种情况下，学院批评家就变成了为作品涂脂抹粉的美容师，学院批评也变成了为圈子服务的广告词。有人指出，如今的研讨会已沦为歌颂会、表彰会和炒作会，所带来的负面影响不容低估。\n\n学院批评既然存在着以上问题，那么如何改进便成为摆在学院批评家面前的头等大事。而由于历史惯性，我们也要充分认识到改进的长期性、艰巨性和复杂性。", "keywords": "应用性和实践性 学理的呈现 角度意识和方法意识 行文朴实 语言规范 体制化 专业化 圈子化", "note": "学院批评是当下文学批评实践中最重要的一部分内容，它的主要特点是批评的主体文学素养较高，整体专业性较强，但也因为体制化、专业化和圈子化暴露出了一些问题，大家要好好把握。", "framework": ""}, {"id": "297", "stars": 2, "title": "谈谈你对当下文学批评实践中媒体批评的认识", "body": "媒体批评（亦有“传媒批评”“传媒文艺评论”之说）并非一个很严谨的概念，但由于它频频被人使用，且已有了约定俗成的含义，我们便有了面对它的充分理由。简言之，媒体批评是媒体与文学批评形成密切联系的一种实践形式，指的是在大众传播媒介（如报纸、网站）上发表的对文学作品、文学事件和文学现象等进行评说的批评文字，它具有新闻性、尖锐性、大众性等特点。\n\n一、弊端\n\n媒体批评及其实践形式的成型与愈演愈烈显然伴随着大众传播媒介发展壮大的进程。20世纪90年代以来，中国的大众传媒迅速扩张，其表征之一是各种地方性的晚报、晨报、都市报纷纷出现。世纪之交以来，随着互联网进入千家万户，各类网站也随之诞生，新媒体又成为一个传播信息的巨大平台。无论是报纸还是网站，它们都需要大量新闻性、娱乐性的内容加以填充，这样，“失去轰动效应”的文学便再度成为媒体所关注的对象。\n\n在批评实践中，媒体批评常常被视为学院批评的对立面。媒体批评一经出现，便遭到了学院批评家的指责。他们认为，媒体批评以短小凶悍的批评文字为主，捕风捉影、夸大其词、惹事生非、制造事端是其主要的批评策略和话语风格，而这类批评文字恰恰为地方小报所青睐，因为它们可借此吸引眼球，扩大销路，招徕读者，其结果是导致了批评的“媒体化”。\n\n而媒体批评之所以弊端重重，主要在于其批评初衷并非从文学的基本价值和利益出发，而是主要着眼于媒体自身的利益需要。于是，文学批评不再遵循批评规范和学理内涵，转而成了媒体的同谋。\n\n二、产生弊端的原因\n\n（一）媒体批评主要由“新闻场”“娱乐场”管辖却不受“文学场”和“学术场”控制，因此，更多的时候它遵循的是新闻逻辑或大众文化的生产逻辑，文学批评的学术逻辑则被置之度外。这样，追求“语不惊人死不休”的轰动效应，制定“一招致命”的战略战术，便成为媒体批评的基本策略。\n\n（二）如果说在20世纪八九十年代文学批评的话语权还掌握在作家与批评家手里，那么随着媒体批评的出现，媒体记者和专栏作者则逐渐开始瓜分这种话语权。而他们一旦成为批评主体，其切入角度、行文方式、话语风格等也就不可能不发生重大变化。\n\n三、积极意义\n\n（一）媒体批评的出现打破了原来学院批评一言堂的格局，形成了批评民主化的局面。无论从哪方面看，这都是一件好事情，不宜一味抹杀。\n\n（二）媒体批评固然有耸人听闻的一面，但许多时候也恰恰是它说出了学院批评不敢说、不愿说和不会说的事实真相。而这一点，尤其值得学院批评反思和学习。\n\n（三）在当下的批评处境中，媒体批评恰恰为学院批评家提供了占领并重新打造大众传媒的历史契机。倘若他们能放下身段，进驻媒体批评，进而让学院批评与媒体批评互通有无，一种既犀利感性又平和理性的批评样式才能出现。而人为制造媒体批评与学院批评剑拔弩张的紧张关系，或者固守学院批评而把媒体批评拱手相让，都是很难让文学批评有更大出息的。\n\n正因如此，媒体批评理应成为当今文学批评实践中的一项重要内容。对待它的正确态度可能是改造之、完善之，而不是或者简单否定，或者拒之门外。\n\n【李凡关键词：大众传播媒介 学院批评的对立面 新闻逻辑 媒体记者和专栏作者 民主化 历史契机】\n\n【李凡说：和学院批评相比，媒体批评由于其批评的动机和主体的不同，显示出了不同的特征，暴露出了许多问题。但它并不是一无是处，除了作为学院批评的补充之外，它还为学院批评家进入大众视野提供了契机，大家要辩证地看待。】", "keywords": "", "note": "", "framework": ""}, {"id": "298", "stars": 2, "title": "谈谈你对当下文学批评实践中读者批评的认识", "body": "首先需要明确的是，读者批评并非读者反应批评。后者是20世纪60年代兴起于美国的一种批评理论。该理论认为：“作品是读者浏览他们眼前的文本书页时，持续进行的精神活动与反应。”我们所谓的读者批评是指对文学作品、文学现象和文学事件发言评说的一种实践形式。读者批评古已有之，但时至今日，读者身份以及读者批评的速度、规模、所依据的平台等\n\n都已发生了重大变化。\n\n一、变化\n\n（一）读者身份的变化\n\n以往读者批评的主体可以说是“高级”读者，他们是极少数有地位、有身份或同样有写作才能的人。而从18世纪开始，随着阅读公众的大量出现，普通读者开始成为读者批评的主体。他们原来聚集于咖啡馆等现实场所中，如今则活跃于网络这个虚拟的世界里。\n\n（二）批评形式的变化\n\n在蒂博代那里，读者批评被看做一种自发的批评，但它们大都是口头批评，出现在日常的谈话里。它们之所以有迹可寻，是因为后来变成文字的通信、日记和私人手记等对它们有所记载。而这些文字往往是事过境迁之后才公诸于世，实际上它们已是“马后炮”，只具有史料价值，却往往难以对当时的文学现象构成影响。如今，读者批评虽依然可以通过口头批评进行，但更重要的是通过互联网和自媒体（如博客、微博、微信等）所产生的文字批评。它们既可以是长篇大论，也可以是以跟帖方式出现的只言片语，其批评形式灵活多样，且往往是现场的快速反应。\n\n（三）批评规模的变化\n\n在传播媒介不发达的时代，阅读主要是读者的事情，而批评则主要是专家的事情。造成这种局面的原因是，即便读者有想法，有看法，供其发声的渠道也少之又少（报纸可以通过“读者来信”的方式选登部分稿件，但毕竟有限）。这样，读者批评的规模就受到了很大限制。如今，读者发声的渠道十分便利且畅通无阻，其批评规模、数量、频次等已今非昔比。而一旦他们聚焦于文学作品或文学事件，便会生发出巨大能量，甚至出现“群选经典”的景象。所谓群选经典，是指读者大众大规模地参与文学经典的重估活动。他们置专家学者的意见于不顾，靠自己的投票、点击、购买、阅读和评论，遴选出属于自己的经典来。如路遥的《平凡的世界》，很大程度上就是通过这种方式使其进入经典化的进程的。\n\n二、影响\n\n读者批评的优势在于，由于其批评主体往往是在不吐不快的状况下发言的，所以他们常常能做到不顾情面，不畏权势，不管种种禁忌，我手写吾口，我口述吾心，从而把最真实的看法呈现出来。因此，好的读者批评就像原生态唱法那样，不事修饰，不讲技巧，自然朴实，绝假纯真。如果读者兼有较高的文化素养和上乘的文字表达功夫，那么这种批评便会脱颖而出，成为真正的评论文章。\n\n与此同时，我们也要看到读者批评所存在的问题。由于匿名发帖可减除心理负担，甚至出现“人一上网，马上就变得厚颜无耻，马上就变得胆大包天”的情况，所以，读者批评便时常会呈现出情绪化、粗鄙化等特征。而一旦攻讦、谩骂、拍砖等因素进入读者批评，也就必然会影响到它的气质和品质，致使其扭曲、变形，沦为一种话语暴力。网上的读者批评声名不佳，往往与其话语风格有关。此外，感悟有余，理性思考不足；表达短平快，缺乏系统性，等等，也是读者批评需要解决的问题。\n\n当然，我们也应该意识到，无论读者批评存在着怎样的问题，这种可以真正付之实践、变成文字的批评样式都是以往任何一个时代所无法比拟的。而且，种种迹象表明，它也正在对媒体批评乃至学院批评构成一种潜在的影响。因此，学院批评家正视读者批评的存在，并让它在文学批评的大家庭中发挥积极作用，读者善待自己发言的机会、吐槽的权利并让自己的声音有效地进入文学公共空间，很可能才是双方应该采取的姿态。", "keywords": "读者身份 批评形式 批评规模 原生态唱法 话语暴力", "note": "伴随着互联网的发展，读者批评这一自古有之的文学批评实践呈现出了新的变化，并取得了越来越重要的影响。但它也有其弊端所在，我们也要辩证地分析。", "framework": ""}];

function starStr(s){if(!s)return '';const c=(String(s).match(/[★☆]/g)||[]).length;return c?'★'.repeat(Math.min(c,5)):'';}
function isSectionHead(t){return /^[一二三四五六七八九十]+[、．.]/.test(t)||/^[（(][一二三四五六七八九十]+[)）]/.test(t)||/^[（(]d+[)）]/.test(t);}
function renderAnswer(body){if(!body)return '<p class="ans-p">（本题 OCR 未识别到答案，可能为扫描遗漏）</p>';let h='';for(const p of body.split(/\n\n+/)){const t=p.trim();if(!t)continue;if(isSectionHead(t)){h+='<p class="ans-head no-indent">'+escHtml(t)+'</p>';}else{h+='<p class="ans-p">'+escHtml(t.replace(/\n+/g,' '))+'</p>';}}return h;}
function renderFrame(fw){return fw?'<div class="frame"><b>答题框架：</b>'+escHtml(fw)+'</div>':'';}
function renderKw(kw){return kw?'<div class="kw"><b>李凡关键词：</b>'+escHtml(kw.replace(/\n+/g,' '))+'</div>':'';}
function renderNote(nt){return nt?'<div class="note"><b>李凡说：</b>'+escHtml(nt.replace(/\n+/g,' '))+'</div>':'';}
let curKw='',curStar=0;const list=document.getElementById('list'),stat=document.getElementById('stat');
function render(){const kw=curKw.trim().toLowerCase();const items=DATA.filter(d=>{if(curStar&&(starStr(d.stars).length!==curStar))return false;if(!inEra(d))return false;if(curType&&qType(d)!==curType)return false;if(kw){const hay=(d.id+' '+d.title+' '+d.keywords+' '+d.body).toLowerCase();if(!hay.includes(kw))return false;}return true;});if(!items.length){list.innerHTML='<div class="empty">没有匹配的题目</div>';stat.textContent='匹配 0 题';return;}list.innerHTML=items.map(d=>{const miss=!d.body&&!d.keywords&&!d.note;return '<div class="q"><div class="qhead" onclick="this.parentNode.classList.toggle(\'open\')"><span class="num">'+escHtml(d.id)+'</span><span class="qt">'+(miss?'<span class="missed">':'')+escHtml(d.title)+(miss?'</span>':'')+'</span><span class="st">'+starStr(d.stars)+'</span><span class="arrow">▶</span></div><div class="body">'+renderFrame(d.framework)+'<div class="answer">'+renderAnswer(d.body)+'</div>'+renderKw(d.keywords)+renderNote(d.note)+'</div></div>';}).join('');stat.textContent='匹配 '+items.length+' / '+DATA.length+' 题'+(curEra>=0?(' · '+ERAS[curEra].name+(curType?(' · '+curType):'')):'');}
document.getElementById('search').addEventListener('input',e=>{curKw=e.target.value;render();});
document.getElementById('stars').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;curStar=parseInt(e.target.dataset.s,10);[...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target));render();});
const fsP=document.getElementById('fs-plus'),fsM=document.getElementById('fs-minus');
function getFs(){return parseFloat(localStorage.getItem('lifan_fs')||'17');}function setFs(v){v=Math.max(13,Math.min(30,v));localStorage.setItem('lifan_fs',v);document.documentElement.style.setProperty('--fs',v+'px');}
setFs(getFs());fsP.onclick=()=>setFs(getFs()+1);fsM.onclick=()=>setFs(getFs()-1);
const ERAS=[{"name": "总论与马克思主义文论", "start": 1, "end": 9}, {"name": "文学的本质与属性", "start": 10, "end": 18}, {"name": "文学价值与功能", "start": 19, "end": 29}, {"name": "文学创作过程与心理", "start": 30, "end": 45}, {"name": "文学语言·形象·象征", "start": 46, "end": 53}, {"name": "文学体裁", "start": 54, "end": 65}, {"name": "文学风格·流派·思潮", "start": 66, "end": 73}, {"name": "文学接受与批评", "start": 74, "end": 95}, {"name": "文学的发生与发展", "start": 96, "end": 115}, {"name": "文学理论的性质与形态", "start": 116, "end": 124}, {"name": "文学活动与文学起源", "start": 125, "end": 136}, {"name": "文学的含义与意识形态", "start": 137, "end": 145}, {"name": "社会主义文学活动", "start": 146, "end": 156}, {"name": "文学创造与精神生产", "start": 157, "end": 163}, {"name": "文学创造的主体与过程", "start": 164, "end": 190}, {"name": "文学创造的价值追求", "start": 191, "end": 205}, {"name": "文学作品类型与层次", "start": 206, "end": 215}, {"name": "文学形象·典型·意境", "start": 216, "end": 228}, {"name": "叙事与抒情", "start": 229, "end": 250}, {"name": "文学风格", "start": 251, "end": 259}, {"name": "文学消费与传播", "start": 260, "end": 266}, {"name": "文学接受", "start": 267, "end": 283}, {"name": "文学批评", "start": 284, "end": 298}];
function qType(d){const t=(d.title||'');if(/填空/.test(t))return '填空';if(/名词解释/.test(t))return '名词解释';return '问答题';}
let curEra=-1,curType='';
function inEra(d){if(curEra<0)return true;const e=ERAS[curEra],n=parseInt(d.id,10);return n>=e.start&&n<=e.end;}
const tocPanel=document.getElementById('tocPanel'),tocMask=document.getElementById('tocMask'),tocBtn=document.getElementById('tocBtn');
function openToc(){tocPanel.classList.add('show');tocMask.classList.add('show');}
function closeToc(){tocPanel.classList.remove('show');tocMask.classList.remove('show');}
if(tocBtn){tocBtn.onclick=function(){tocPanel.classList.contains('show')?closeToc():openToc();};}
if(tocMask) tocMask.onclick=closeToc;
var tocClose=document.getElementById('tocClose'); if(tocClose) tocClose.onclick=closeToc;
function buildToc(){
  const body=document.getElementById('tocBody'); if(!body) return;
  let h='<div class="toc-all" data-all="1">显示全部 '+DATA.length+' 题</div>';
  ERAS.forEach(function(e,i){
    const inR=DATA.filter(function(d){const n=parseInt(d.id,10);return n>=e.start&&n<=e.end;});
    const types={};
    inR.forEach(function(d){const t=qType(d);types[t]=(types[t]||0)+1;});
    let subs='';
    Object.keys(types).forEach(function(t){
      const on=(curEra===i&&curType===t)?' on':'';
      subs+='<span class="toc-sub'+on+'" data-era="'+i+'" data-t="'+t+'">'+t+' '+types[t]+'</span>';
    });
    h+='<div class="toc-item"><div class="toc-era'+(curEra===i?' on':'')+'" data-era="'+i+'">'+
       '<span class="idx">'+(i+1)+'.</span><span class="nm">'+e.name+'</span>'+
       '<span class="cnt">'+inR.length+'</span></div><div class="toc-subs">'+subs+'</div></div>';
  });
  body.innerHTML=h;
  if(tocBtn) tocBtn.classList.toggle('on', curEra>=0);
}
document.getElementById('tocBody').addEventListener('click',function(e){
  const all=e.target.closest('.toc-all');
  if(all){curEra=-1;curType='';buildToc();render();closeToc();return;}
  const sub=e.target.closest('.toc-sub');
  if(sub){curEra=parseInt(sub.getAttribute('data-era'),10);curType=sub.getAttribute('data-t');buildToc();render();closeToc();return;}
  const era=e.target.closest('.toc-era');
  if(era){const i=parseInt(era.getAttribute('data-era'),10);curEra=(curEra===i&&!curType)?-1:i;curType='';buildToc();render();closeToc();return;}
});
buildToc();

render();
</script><script>
/* deep-link support: #era=N 预选时代, #qID 定位题目（自动追加，勿删） */
(function(){
  if(window.__dlPatched) return; window.__dlPatched=1;
  function assignIds(){
    var q=document.querySelectorAll('.q');
    for(var i=0;i<q.length;i++){
      var n=q[i].querySelector('.num');
      if(n && !q[i].id) q[i].id='q'+n.textContent.trim();
    }
  }
  var _render=window.render;
  if(typeof _render==='function'){
    window.render=function(){
      _render();
      assignIds();
      var m=(location.hash||'').match(/q(\d+)/);
      if(m){
        var el=document.getElementById('q'+m[1]);
        if(el){ el.classList.add('open');
          setTimeout(function(){ el.scrollIntoView({block:'start'}); },60); }
      }
    };
  }
  var em=(location.hash||'').match(/era=(\d+)/);
  if(em && typeof ERAS!=='undefined' && ERAS && ERAS.length){
    try{
      curEra=Math.max(0,Math.min(parseInt(em[1],10),ERAS.length-1));
      curType='';
      if(typeof buildToc==='function') buildToc();
    }catch(e){}
  }
  if(typeof window.render==='function') window.render();
})();
</script>
<!-- deep-link-patch --><script>
/* 深链：支持 页面.html#q<题号>，从《百日冲刺计划》一键跳到当天要背的那道题 */
(function(){
  var tries = 0;
  function jump(){
    var m=(location.hash||'').match(/^#q(\d+)$/); if(!m) return true;
    var id=m[1], nodes=document.querySelectorAll('#list .q .num');
    for(var i=0;i<nodes.length;i++){
      if(nodes[i].textContent.replace(/\s/g,'')===id){
        var card=nodes[i].closest?nodes[i].closest('.q'):null;
        if(!card) return true;
        card.classList.add('open');
        card.style.boxShadow='0 0 0 3px #c8902a';
        if(card.scrollIntoView) card.scrollIntoView({block:'center'});
        setTimeout(function(){ card.style.boxShadow=''; }, 2600);
        return true;
      }
    }
    return false;                       /* 还没渲染出来，稍后重试 */
  }
  // 大页面的 load 事件很慢，改用 DOMContentLoaded + 重试，最多约 8 秒
  function run(){ if(jump()) return; if(++tries > 40) return; setTimeout(run,200); }
  if(document.readyState === 'complete') setTimeout(run,60);
  else document.addEventListener('DOMContentLoaded', function(){ setTimeout(run,60); });
  window.addEventListener('hashchange', function(){ run(); });
})();
</script>
<!-- back-to-plan-patch --><script>
/* 返回计划：从《百日冲刺计划》跳来的页面右下角会出现返回按钮 */
(function(){
  var qs = location.search || '';
  if(!/[?&]from=plan/.test(qs)) return;
  var m = qs.match(/[?&]d=(\d+)/);
  var href = '百日冲刺计划.html' + (m ? '?d=' + m[1] : '');

  function go(){
    if(window.opener && !window.opener.closed){
      try{ window.opener.focus(); }catch(e){}
      try{ window.close(); }catch(e){}
      if(window.closed) return;          /* 关掉了：原来那个标签就停在出发那天 */
    }
    location.href = href;                /* 关不掉就本标签跳回去 */
  }

  function draw(){
    if(document.getElementById('__backPlan')) return;
    var st = document.createElement('style');
    st.textContent =
      '#__backPlan{position:fixed;right:16px;bottom:16px;z-index:99999;font-family:inherit;'+
      'font-size:14px;font-weight:700;line-height:1;color:#fff;cursor:pointer;border:none;'+
      'background:linear-gradient(120deg,#9a3b2e,#c8902a);padding:12px 18px;border-radius:99px;'+
      'box-shadow:0 6px 20px rgba(154,59,46,.34);letter-spacing:1px;'+
      'transition:transform .15s,box-shadow .15s}'+
      '#__backPlan:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(154,59,46,.44)}'+
      '#__backPlan:active{transform:translateY(0)}'+
      '#__backPlan small{font-weight:400;opacity:.86;font-size:12px}'+
      '@media print{#__backPlan{display:none}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.id = '__backPlan'; b.type = 'button';
    b.innerHTML = '\u2190 返回计划' + (m ? ' <small>D-' + m[1] + '</small>' : '');
    b.onclick = go;
    document.body.appendChild(b);
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', draw);
  else draw();
})();
</script>
