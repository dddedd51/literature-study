欧也妮·葛朗台》《高老头》等都是长篇小说的杰作。\n\n当然，中篇小说与短篇小说、长篇小说之间的界限并非泾渭分明，有时一部中篇小说作品更接近短篇小说，有时则更接近长篇小说。此外，20世纪后期还兴起了一种比短篇小说篇幅更短的微型小说或小小说，这类小说用点睛之笔，在极尽浓缩的文学世界中表现生活的一鳞半爪，给读者带来或出乎意料或引发深思的阅读体验。随着不同文学体裁之间的相互影响与融合，还出现了纪实性小说。", "keywords": "短篇小说 中篇小说 长篇小说", "note": "短篇小说、中篇小说和长篇小说的区别在形式上主要体现在篇幅、结构、情节等方面，而在内容上则主要体现在反映社会生活的广阔程度上，大家可以从两个角度去思考。需要注意的是，三种小说的界限并非泾渭分明，并且当下的小说类型还有新的变化。", "framework": ""}, {"id": "59", "stars": 3, "title": "试分析剧本的艺术特征", "body": "剧本是一种通过人物台词和舞台提示营造戏剧情境、集中反映矛盾冲突的文学体裁。剧本为戏剧表演提供文学脚本，属于戏剧艺术的文学部分，同时剧本也可以作为脱离戏剧演出而独立存在的文学作品。剧本的艺术特征可以从下列几个方面理解：\n\n一、尖锐激烈的戏剧冲突\n\n戏剧冲突指戏剧中由对抗性力量造成的能够推动剧情发展的矛盾冲突，它是戏剧性最高和最集中的形式。戏剧冲突是剧本的灵魂，没有冲突就没有戏剧。戏剧冲突体现了剧本的叙事性和这种叙事必须适应舞台演出要求的特点，也是戏剧叙事不同于一般叙事之处。\n\n戏剧情境是促成戏剧冲突爆发并向前推进的契机，是戏剧情节形成及发展的基础，是人物产生特有动作、心理和形成特定性格的客观条件。戏剧情境主要由人物活动的具体环境、对人物性格或人物关系产生影响的突发事件和人物之间的关系构成，其中最重要、最有活力的因素是人物关系。\n\n二、高度集中的戏剧结构\n\n戏剧结构又称“布局”，指戏剧情节构成与铺展的方式。由于实际生活中时空的无限延展性与舞台演出上时空的严格限制之间存在矛盾，剧本要最大限度地展示出丰富的生活内容，就需要在地点的选择、人物及人物之间的关系以及情节进展等方面高度集中。\n\n剧本结构的外在形态，主要体现在分幕分场上。幕是戏剧情节发展的大段落，场是戏剧情节的小段落，一幕可以有若干场，也可以仅一场。幕场之间的切割省略了事件的过程，从而使情节更为集中紧凑，减少了头绪和枝蔓。场幕的划分一般利用场景的置换来体现。有些现代戏剧借鉴中国戏曲的手法，采用写意的虚拟方式表现场景的转换。\n\n三、以对话为主的戏剧语言\n\n戏剧语言在戏剧中具有构成戏剧的话语情境、展开剧情、推进戏剧冲突的作用。剧本的叙事主要由人物语言即台词来完成，具有性格化、动作性和富于潜台词等特点。\n\n性格化是指人物语言要符合人物的身份、年龄、职业、思想、感情等。如老舍所说，要“闻其声，知其人”，鲜明地体现人物个性。\n\n动作性是指人物语言要表现其欲望、意志及内心的冲突，并使这些内心状态通过语言转化为外部动作，体现为人物的姿态、表情、手势、形体等。戏剧通过人物行为而展开冲突，人物内在的心理与情绪只有转化为外部的行为、转化为具体冲突，才最终成为舞台上的动作。\n\n潜台词为人物语言的言外之意，“话中有话”，或“言在此而意在彼”。富于潜台词的人物语言往往会引起对方的反应，暗示某种意蕴和引发新的矛盾冲突。", "keywords": "尖锐激烈的戏剧冲突 高度集中的戏剧结构 以对话为主的戏剧语言", "note": "剧本是一种通过人物台词和舞台提示营造戏剧情境、集中反映矛盾冲突的文学体裁。我们可以通过曹禺的《雷雨》的辅助记忆-《雷雨》通过写一天之内在周公馆（布局铺展的方式）爆发的几组激烈的冲突，分四幕（外在形态：分场分幕）上演主要人物之间的复杂关系。主要通过对话刻画人物的形象，鲁侍萍的凄苦、周朴园的霸道、繁漪的反叛性（性格化）都跃然纸上；鲁大海的行动（动作表现内心）表现他内心的愤怒慷慨，还有繁漪和周萍、周朴园和鲁侍萍之间大量的潜台词，通过言外之意暗示读者他们的复杂关系。", "framework": ""}, {"id": "60", "stars": 1, "title": "试从矛盾冲突性质、价值取向和审美差异的角度划分戏剧的类型", "body": "依据不同的标准，剧本可以有不同的分类。根据场次可以分为独幕剧和多幕剧，根据表演方式可分为话剧、歌剧、舞剧、影视剧等。而根据矛盾冲突性质、人物命运表现出来的价值取向和审美差异来看，剧本可以划分为悲剧、喜剧和正剧。\n\n一、悲剧\n\n悲剧多指冲突中正义的一方失败或毁灭而引起人们的悲痛、怜悯并由此产生崇高感的戏剧作品。悲剧产生于“历史的必然要求和这个要求实际上不可能实现”之间的矛盾。鲁迅提出，“悲剧将人生的有价值的东西毁灭给人看”。悲剧又分为命运悲剧、性格悲剧和社会悲剧。近代以来的悲剧也可以表现普通人物的内心和精神世界。中国古典悲剧《窦娥冤》《桃花扇》《赵氏孤儿》以及古希腊悲剧《被缚的普罗米修斯》《安提戈涅》《俄狄浦斯王》等都是悲剧经典作品。\n\n二、喜剧\n\n喜剧一般以讽刺、幽默、夸张的手法表现人物的可笑之处。由于艺术家在表现对象的处理上有不同的态度和方式，因而喜剧呈现出不同的审美属性和审美价值。讽刺喜剧是对有性格缺陷或丑陋、庸俗的主人公加以讽和揶揄“将那无价值的撕破给人看”；幽默喜剧体现了一种乐观自信的精神，它肯定和赞美喜剧人物所追求的目的的合理性，并在制造笑料的过程中体现出某种睿智。元代关汉卿的《救风尘》、现代陈白尘的《升官图》以及莎士比亚的《威尼斯商人》、果戈理的《钦差大臣》等都是喜剧佳作。\n\n三、正剧\n\n正剧，又称悲喜剧，它兼有悲剧和喜剧两种成分。18世纪法国戏剧家狄德罗将介于喜剧和悲剧之间的“中间地带”的戏剧称为“严肃”戏剧。这种“严肃”戏剧可以说是后来的正剧的一种预示。在正剧中，悲剧与喜剧两种形式“完善地结合在一起，一种形式中的诸种因素可以融汇在另一种形式中”。正剧与悲剧、喜剧的主要区别在于人物命运、事件结局的完满性。一般而言正剧更近似现实生活，题材内容更广泛，人物性格塑造更丰满和复杂。", "keywords": "悲剧 命运悲剧 性格悲剧 社会悲剧 喜剧 讽刺喜剧 幽默喜剧 正剧", "note": "从矛盾冲突性质、价值取向和审美差异的角度来看，剧本的类型主要有悲剧、喜剧和正剧三种，这三个概念都比较容易理解。不过，具体来看，根据表现内容的不同，悲剧可以分为命运悲剧、性格悲剧和社会悲剧；而根据作家创作态度的不同，喜剧又分为讽刺喜剧和幽默喜剧。这些我们都有必要了解一下。", "framework": ""}, {"id": "61", "stars": 3, "title": "试述散文的基本特征", "body": "散文这个概念在不同时期有不尽相同的含义。古代把除韵文、骈文之外的文体都称为散文。新文学运动以来，散文与诗歌、小说、戏剧文学并列，成为文学体裁中的一种。散文的基本特征，主要表现在以下方面：\n\n一、感受新颖，情感真挚\n\n作为一种表达内心体验和抒发情感的文学样式，散文一般有感而发，感受新颖睿智，抒情真诚真切。散文特别强调性情，要求情感真挚，所表达的感受须出自作者的内心，源于生活的启发，而且这种感受的抒发要自然、自由，不虚假、不伪饰。\n\n与小说将感受、感悟隐含在故事中不同，散文直接抒发真情实感，具有强烈的“自我”色彩，大多记叙“我”的所见、所闻、所感、所想，抒写对自然、社会、人生的真情实感与哲理感悟，因而更能体现作者的个性和风格。\n\n二、题材广泛，内容丰富多彩\n\n散文的书写领域是广阔的，写人、叙事、咏物、怀旧，古往今来、天上地下都可以进入散文创作的视野，生活中的一切有意义的事物和情感，都可以作为散文的题材，在散文中得到反映。题材广泛也为散文样式的多样创造了条件，随笔、小品文、速写、特写、报告文学、游记、访问记、回忆录等均进入了散文的空间。鲁迅的《阿长与山海经》描写了下层劳动妇女长妈妈的形象，真切生动，表达深深的怀念之情；沈从文的《湘西散记》则在湘西山水与普通人生活中表现人性之美，乡土气息浓郁。\n\n三、形式自由，形散神聚\n\n散文在写作对象上没有一定之规，结构和行文也没有严格的限定和固定的模式。散文讲求“形散神聚”，在题材选择材料组织、篇章结构以及表现方式上，纵横捭阖、自由挥洒，但无论是委婉曲折还是直抒胸臆，是旁敲侧击还是一针见血，看似“散”的形式，又都围绕表现特定的生活感受、生命之思这一中心，并与后者融合成一个有机的艺术整体。\n\n四、语言自然优美\n\n散文一般不以故事情节取胜，而是在短小精悍的篇幅里，用自然、简洁、优美的语言，表达作者所见、所闻、所思、所感。散文的语言清新自然，既不像诗歌那样讲求合辙押韵，也不像剧本那样强调对话性，是最具文学性的语言。一些散文大家有很强的美文意识，表述洒脱自如讲究理趣、情趣和文采。如鲁迅、郁达夫、冰心、朱自清等，他们的散文作品都极富文辞美、音韵美，是散文写作的范例。\n\n【李凡关键词：感受新颖 情感真挚 题材广泛 内容丰富多彩 形式自由 形散神聚 语言自然优美】\n\n【李凡说：将散文作为一种独立的文学体裁，是与中国文学的实际情况相符合的。相较于小说、诗歌和剧本等对结构的强调，散文整体形式十分自由，不过在情感上，散文却有着一个统一的中心思想，这也是散文的独特性所在，在考查之中，这四种文学体裁的特征可能会放在一起进行对比，大家要注意一下。】", "keywords": "", "note": "", "framework": ""}, {"id": "62", "stars": 1, "title": "试从表达方式和表现对象的角度划分散文的类型", "body": "由于散文创作自由多样，因而其种类繁多。依照不同的标准和角度，可以将散文分成多种类型。一般根据散文的表达方式和表现对象，分为记叙性散文、抒情性散文和议论性散文三大类\n\n一、记叙性散文\n\n记叙性散文以叙事记人写景为主，表达方式侧重于叙述、描写。记叙性散文的叙事、记人和写景不同于小说，结构不要求完整连贯，往往只截取生活中的某些片断或几个侧面，在写作中多以第一人称“我”为线索将这些片断连缀起来。记叙性散文在描述中善于抓住事物的情状、人物的神采和景物的特色，其间也有抒情议论的成分。\n\n二、抒情性散文\n\n抒情性散文以抒发作者的思想情感为主，情感在抒情性散文中占有重要地位。情感的表达可以是写景抒情，如朱自清的《荷塘月色》；也可以是咏物感怀，如茅盾的《白杨礼赞》；还可以是直抒胸臆，如巴金的《解剖自己》。优秀的抒情性散文总是以情感为中心调遣材料，以情为线索安排结构。\n\n三、议论性散文\n\n议论性散文侧重说理，表达作者对生活的看法和抒发某种关于人生的审美感受。议论性散文区别于一般议论文之处在于，普通议论文主要采用理论观点和事实依据说理，而议论性散文的说理是借助具体事实、运用文学语言和通过文学意象进行的，因而是一种具象的、以情感人的说理。汉代晁错的《论贵粟疏》《言兵事疏》、贾谊的《过秦论》《治安策》都针对当世社会，以秦为喻议论时事，是古代议论散文名作。议论性散文包括小品文、随笔、杂文等，它们或富于情思、寓意隽永，或随想随论、抒发生活感悟，或针砭时弊一针见血。鲁迅的《坟》《热风集》《二心集》《华盖集》等都是杂文中的经典作品。", "keywords": "记叙性散文 抒情性散文 议论性散文", "note": "对于散文的类型，我们主要也是以了解为主，认识到了三种散文的表现内容和表达方式的特点就可以了。这一部分涉及的四种文学体裁都有可能以名词解释的形式考查，大家要注意一下。", "framework": ""}, {"id": "63", "stars": 3, "title": "结合具体例子分析文学体裁的融合现象（25湖北大学）", "body": "不同文学体裁的交融在文学创作中早已有之，如散文诗、诗剧等。在当今，文学体裁的融合更为突出，并有扩大的趋势，不仅体裁之间互相补充和互相建构，而且非文学因素也进入文学之中，形成不同话语形态之间的张力。特别是随着视听文化的异军突起，使得以文字为载体的文学因获得新的传播方式而拥有了新质。这些变化应该引起从事文学创作和文学教学的人们的关注和研究。当代文学体裁的融合，主要表现在以下方面：\n\n一、不同语域的混用\n\n文学体裁中语域的混用在文学创作中尤其是小说创作中并不鲜见。由于小说是一种最能表现生活广度的体裁，使得它能够从容地从其他文体语言中吸取有用的成分，来满足其全面表现社会生活的需要。不过，这里所说的不同语域的混用与以往不完全相同，它更侧重文学的有意识跨界，表现为不同语域的交织和并置。例如交通标志、广告用语、法律用语乃至数学和物理公式等出现在文学文本中，所有这些语域的混用或者扩容被布迪厄称为“被压制者的回归”，即从某种意义上说，文体的杂糅使文学回到了原初时代。\n\n二、不同艺术媒介的融合\n\n文学体裁的边界还由于不同艺术媒介的融合而不断延展。应该说，无论中外，不同艺术媒介及门类的相互借鉴和相互交融源远流长。如今画面、声音等其他媒介径直进入文学，成为小说或诗歌作品的组成部分，从而为读者带来多方位感受。\n\n比如当下声音的加入已经成为文坛的又一道风景。尽管听书传统在我国由来已久，宋元民间艺人的说书就是一种听书形式，不过有声书则是电子时代的产物，它以数字音频的方式呈现。当人们打开音频应用软件进入“听书”模式时，在数字化听觉空间中即刻产生一种“在场”的幻觉。就文学类而言，有声书除了语音和文字同步外，还有一种类似于舞台剧由不同角色扮演的类型。由于声音本身具有可塑的情感属性，不同声音的传递会给听者造成更为丰富的感觉。并且，数字音频制作的有声书所具有的移动性还契合了当代碎片化生活的境况，获得不少年轻人的青睐，戴着耳机听书成为人们行走中的一种选择。", "keywords": "体裁之间 非文学因素 不同语域的混用 不同艺术媒介的融合", "note": "当下文学体裁的融合，在体裁之间表现为不同语域的混用，非文学因素的介入则体现为不同艺术媒介的融合。这部分内容重点考查的可能性不大，大家作为拓展知识，对当下文学体裁的融合有所了解即可。", "framework": ""}, {"id": "64", "stars": 1, "title": "当代文学体裁发生了哪些新变", "body": "随着数字技术的普及和社会生活的快速变化，文学体裁尤其是小说类叙事性作品面临着更大的冲击。数字文学创造了新的创作方式与传播方式，它不仅改变了文学内部的结构形态，而且带来新的阅读体验和审美体验。与此同时非虚构纪实作品的流行给文学体裁的边界造成了新的动荡。\n\n一、数字文学的问世\n\n数字文学是文学与数字技术结合的产物，它通过计算机软件或超链接生成。数字文学与网络有密切的关系，离开网络就不可能生成。数字文学不同于纸质文本，也不同于以纸质文本为来源的视听文学。纸质文本和视听文本都内含时间因素，即使所讲的故事和人物表现出某种空间化和交错的性质，但其书写、阅读和聆听仍暗含一种线性秩序。数字文学则完全颠覆了这一秩序，在线技术的交互性使数字文学具有非线性和无序化的性质。人们借助计算机的链接功能，通过关键词在不同的文本形式（文本、声音、图像等）间产生关联，在词语、图像乃至随意浏览的文档间转换。这种频繁的交互性所带来的文本的不稳定性，使文学作品的创作始终处于进行时状态中。\n\n交互性是数字文学的一个重要特征，数字文学的类型正在增加，除超文本小说外，崭露头角的机器人写作已成为一个新的焦点。数字文学的这些类型在促使文学文本的结构方式和传播方式发生变化的同时，也改变了文学的性质和呈现方式。数字文学是否成功还有待时间检验，但这些新的文本所充盈的对常规或秩序的反抗和对读者创造性的召唤，必然为文学体裁带来新质并引发更多的可能性。\n\n二、非虚构文本的出现\n\n非虚构文本的出现是文学范式的一次转型。非虚构主要指采用纪实而非纯想象的方式写作的文本。虽然非虚构本身并非文学体裁，但它对文学虚构性质的排斥在一定程度上造成了对体裁的解构。\n\n非虚构文本的产生与纷繁复杂的现实生活有关。面对瞬息万变、异彩纷呈的当代社会现实，人们感到想象中的故事已黯然失色，开始寻求另一种言说方式。于是，回到生活及其事实本身的非虚构写作便应运而生。而读者阅读中所表现出的对真实事件的偏好也对非虚构的出现起到了推波助澜的作用非虚构文本具有“在场”“介入”和立足个人体验等特征。非虚构文本要求作者进入“现场”并“介入”生活，直面现实问题，并通过“在场”增加作品的说服力，获得社会效应。非虚构文本主要从个人视角入手，通过对事件的描述，将个人的观察和体验写出来。其间作者所辑录的见证者的声音也不完全是中立的，这些个人往往带着自身的经验、情感和价值观，在述说他（她）们所身处的世界。在优秀的非虚构作品中，作者个人的体验往往能引起绝大多数普通人的共鸣，并且不同的体验者或观察者对事件的叙述叠加也会使社会景象更为丰满逼真。这些特性又恰是非虚构文本的文学性的体现。\n\n非虚构文本用“虚构／非虚构”的划分方式打破了原有的诗歌、散文、小说、戏剧的文学分类格局，它试图站在虚构的对立面，重新建立文学与世界的联系，促使人们不得不重新审视体裁的特性，并引发对审美标准的再思考。当然，建立在个人经验基础上的非虚构文学仍无法完全否认虚构的存在，非虚构文本也主要存在于叙事作品中，非虚构文本的持续发展还有于进一步的创作实践和理论研究。", "keywords": "数字文学 文学与数字技术结合 非虚构文本 转型“在场”“介入”立足个人体验", "note": "当下文学体裁的新变，主要体现为数字文学和非虚构文本这两种与以往文学体裁迥异的，适应当下社会潮流和数字技术发展的崭新体裁的出现。其中，随着当下AI写作成为一个热门话题，数字文学相关内容可能在考查中出现，对此大家要特别注意一下。", "framework": ""}, {"id": "65", "stars": 3, "title": "试论文学体裁的变与不变（谈谈什么是正确的文学体裁观，25武汉大学、26江西师范大学）", "body": "当今文学创作的新变使得已有的体裁理论面临严峻挑战，需要正视和研究文学体裁的这些新类型，在吸收中国传统文思想和国外体裁理论的基础上，守正创新，以更好地把握文学发展的趋向及其规律。每一种文学体裁既有其内在核心要素，又具有包容性和开放性。正是这些体裁各自相对的稳定性和连续性，成为文学体裁分类的基础。同时，若文学体裁固守它的疆界，那又将是它的死亡。面对当下文学体裁的变与不变，我们需要秉持以下观点：\n\n一、大体须有\n\n一般来讲，每种文学体裁应具有与其他体裁相区别的基本要素所构成的整体性特征，即在长期文学实践中逐步形成并约定俗成的基本构成因素和表现形态，有各自相对的稳定性。所谓相区别指“一种体裁的众多特征比之于另一种体裁的众多特征可能有迥然之别”，例如小说、诗歌、戏剧文学这些体裁，它们彼此拥有不同的基本要素和表现形态。同时，这些相区别的基本要素和表现形态又不是单一的存在，而是多要素的整合，由此构成了不同文学体裁的整体性特征。\n\n古往今来，文学体裁虽然时有创造、代有更新，但即使发生了很大变化的作品仍然可以被纳入固有的体裁名称中，因为它们在性质和结构上具有某种可重复性的东西，并且读者的期待视野所形成的理解习惯，也对文学体裁的基本构架有限定作用。读者在阅读或评判一部作品时，一方面努力发现作品的独特或奇异之处，另一方面，他又必然持有“什么是小说”“什么是诗歌”等观念来看待作品。再则，在划分标准上，文学体裁的这种相区别的整体性特征不以时间、时代、地域、民族语言为标准，且无论是东方还是西方，尽管拥有不同的文化背景和文学传统，但均有相应的诗歌、小说等文学体裁，这些普遍性再次证明了文学体裁的大体须有。\n\n简言之，正是由于文学体裁的结构方式和构成要素所内含的普遍性和规范性，故其得以在一定程度上超越了历史、疆域乃至媒介的限制而延续至今，而文学体裁的这种超越性也是千百年来文学体裁虽不断变化但“常有其体”的根基。\n\n二、定体则无\n\n文学体裁又绝不是固守不变的。任何一种体裁的规则和边界，都有可能遇到来自文学活动内部或外部的冲击。各种文学体裁总在不断发展变化，因而要在它们之间划分出一条截然的、固定不变的界限是不可能的。\n\n纵观文学发展史，文学体裁始终处在动态的变化过程中。小说就是“一种在其发展的每一个阶段都必须重新进行创造的混杂形式”。体裁变化另一个有趣的现象是边缘向中心的移动。从创作实践上看，中外文学史上经常出现文学体裁的现存规则与创作实践的冲突。作品既受到体裁规范的制约又突破体裁规范的限制，这正是优秀作品的价值和文学体裁的生命力所在。\n\n关于文学体裁的未定性，除了考察文学自身的发展和作家的自觉追求外，社会的、技术的条件也是新兴文学类型产生的重要推动力。比如互联网环境下的文学创作显然与传统的文学创作有了很大区别，个人有限的经验将通过浩瀚的互联网得到校正和充实。大数据正在全方位地改变人们的思维方式和运作方式，在不远的未来，大数据支撑下新的文学样式将会不断涌现。\n\n简言之，文学活动的实践证明，文学体裁从来就不是常规的固定的形式，而是一个不断更新的领域，探索和变化乃文学体裁的存在方式。关于文学体裁的理论探讨也处于不断调整中。文类是一个像大学或国家那样的运行中的活跃的公共机构，而不是一经建成就矗立在那里的凝固的建筑物，人们可以在文学体裁这个“机构”中工作和表现，同时又可以不断对这些机构加以调整，使之适应新的环境的需要。", "keywords": "大体须有 整体性特征 可重复性 普遍性和规范性 定体则无 动态的变化", "note": "“大体须有，定体则无”是金代文学家王若虚对文学体裁问题的见解，这对于我们树立正确的文学体裁观有重要的借鉴意义。文学体裁的变与不变，其实便是文学体裁在保有与其他文学体裁迥异的普遍性和规范性特征的基础上，不断地进行更新发展。而正确的文学体裁观，就是要正视这些内容，构建更为开放的文学体裁观念。", "framework": ""}, {"id": "66", "stars": 5, "title": "谈谈文学风格的特征（26武汉大学）", "body": "不同于文学作品的体裁类型和文体方式，文学风格主要指的是文学作品中呈现出来的作家创作个性。创作个性是作家的气质、人格、人生观、审美趣味、艺术才华、语言敏感等个体素质在艺术表现中形成的独特性。“伟大的艺术家始终是他自己，一个鲜明的、独特的个性，但同时，他却反映出深刻的社会过程”。创作个性在文学风格的形成和显现中具有核心作用。作为文学中体现作家创作个性的东西，文学风格一般具有如下特征：\n\n一、独创性\n\n文学风格的独创性，是指风格体现出作家独一无二的艺术个性和创造性。优秀作家无不拥有自己的独特风格，李白的清新飘逸，杜甫的沉郁顿挫，都是风格独创性的表现。独创性是文学风格的最根本和突出的特征，是衡量作家创作个性及其文学价值最重要的尺度之一.18世纪法国博物学家、文学家布封曾留下“风格就是人本身”（或译“风格即人”）的名言。他认为作品所传达的“知识、事实与发展”等诚然有用，但真正能够影响乃至决定作品“风格”的还是“人本身”。尽管他没能就“人本身”的内涵作准确界定，从而引发过种种争议，但毕竟敏锐地一语道破了风格与“人”的根本性关联。确实，在今天看来，只有人和人的独创性，是形成和理解文学风格的关键因素。谈论文学风格，最要紧的还是从文学作品中发现人的独创性。\n\n二、稳定性\n\n文学风格的稳定性，是指作家的风格从形成时起会在一定时间里保持基本稳定和延续。有的作家即使不断调整和变化，也常能让读者识别出一脉相承的内在联系。这是由于人的性格和在此基础上形成的创作个性往往具有一定的稳定性和持续性。\n\n鲁迅在白色恐怖下频繁变更笔名，仍能被人们分辨出他的独特风格：“夜里又做一篇，原想嘻皮笑脸，而仍剑拔弩张，倘不洗心，殊难革面，真是呜呼噫嘻，如何是好。换一笔名，图掩人目，恐亦无补。”鲁迅创作风格的稳定性，体现在他自己也意识到即使“换一笔名”也难掩自身的独特风格，这种风格正是贯穿他创作始终的独创性所在。\n\n当然，风格的稳定性不是绝对的，而是相对的。一个作家的风格也是可以变化的。\n\n三、多样性\n\n文学风格的多样性，主要是指由不同作家的不同风格形成的总体上的风格差异性和丰富性。这首先是因为作家的创作个性各个有别。多种独创风格的共存，合起来恰恰演奏出文学风格多样性的奇妙交响曲。\n\n文学风格的多样性，往往是一个时代文学发展与繁荣的重要标志。提起诗歌上的“盛唐气象”，不能不归结到文学风格的多样性。明代高棅谈到盛唐文学时说：“开元、天宝间，则有李翰林之飘逸，杜工部之沉郁，孟襄阳之清雅，王右丞之精致，储光羲之真率，王昌龄之声俊，高适、岑参之悲壮，李颀、常建之超凡，此盛唐之盛者也。”这里就列数了10位诗人的不同风格。\n\n文学风格的多样性也可能会体现在一些探索不止的优秀作家身上，优秀的作家、诗人总是自觉地探索多样的风格。杜甫从青壮年到老年，在其漫长的诗歌创作历程就一直不停顿地尝试多种不同的风格。而与此同时，人们能从这种多样性中辨析出杜甫的主导性风格-沉郁顿挫，这也体现了其风格的稳定性。", "keywords": "独创性 稳定性 多样性", "note": "文学风格主要指的是文学作品中呈现出来的作家创作个性。创作个性是作家的气质、人格、人生观、审美趣味、艺术才华、语言敏感等个体素质在艺术表现中形成的独特性。", "framework": ""}, {"id": "67", "stars": 3, "title": "试述文学风格的形成过程及其功能", "body": "一、文学风格的形成过程\n\n文学风格的形成，主要取决于两方面的构成要素。一方面是来自作家的主体要素，另一方面受制于文学作品的客体要素。\n\n（一）风格的主体要素与客体要素\n\n（1）风格的主体要素是指作家在生活和创作实践中所养成的相对稳定的个人气质、审美趣味、艺术才华、写作习惯等。\n\n（2）风格的客体要素是指文学作品的体裁、情节、结构、表达方式、修辞技巧等形式要素及题材、主题等内容要素。\n\n风格存在于主体要素和客体要素高度交融所形成的整体风貌中。\n\n（二）风格的主题要素与客体要素如何统一\n\n构成风格的主体要素与客体要素，是通过动态创作过程统一在一起的。\n\n（1）风格的生成，始于作家感知世界方式的独特性。作家的创作动机和创作激情。与其心理气质、天赋才能、审美心理积淀等广泛地联系着。诸种内在主体因素使作家在感知现实世界时形成某种具有个性特点的心理定向，这种心理定向组成了作家感知世界的主导色调，成为作家确立风格的内在动力。\n\n（2）风格的确立，关键在于作家自觉地去寻找一种与其创作个性相匹配的言语基调。风格正是在通过对言语创造性的改变所形成的深层结构中具体实现的。\n\n（3）风格的成熟，源于作家的认识力度。当作家的独特感受与特定的语感结合起来时，一种创造性地认识、把握世界的独特方式就形成了。作品风格与作者把握世界的深度和广度密切相关。\n\n二、文学风格的功能\n\n正确认识文学的风格，有助于增进对于文学多样性的认识和理解，既提高文学品味，又推动文学的创新和发展。其功能可以从两个方面来说。\n\n（一）风格的创造功能\n\n从创作角度看，作家对独特风格的追求可以激发起艺术创造的内驱力。从读者欣赏的角度看，文学作品的独特风格，其色泽、语调是引起读者审美兴趣的重要因素。缺乏独特的风格，往往是作品平庸的标志，很难引起读者阅读的审美兴趣。独特风格的成型乃是一个作家走向成熟的重要标志。\n\n（二）风格的历史功能\n\n风格由自发。到自觉、由单一到多样化的发展，不但促进文学创作不断走向成熟，而且标志着文学发展的历史趋向。", "keywords": "形成过程 主体要素 客体要素 统一 感知世界方式的独特性 言语基调 认识力度 功能 创造功能 历史功能", "note": "文学风格的形成，一方面要从作家的角度去考虑，另一方面要从作品的角度去考虑，两相结合才形成了文学风格，而一种文学风格的形成，往往要经历一个漫长的过程。文学风格一旦形成，对文学创造和文学史发展都有着重要的意义。", "framework": ""}, {"id": "68", "stars": 3, "title": "谈谈文学风格的分类", "body": "文学风格的分类，古今之间有一定的变化。在古代，文学风格分类主要有三种：\n\n一、二分法。这是较早出现的分类方式。曹丕有“气之清浊有体”说，刘勰有“气有刚柔”，清代姚鼐发展为“阳刚”与“阴柔”之说。与此相关，在词学领域有“豪放”与“婉约”二分。其实，不但我国古代如此，西方也如此。西方美学重要范畴“崇高”与“美”或“壮美”与“优美”，其实也可以视为两种不同艺术风格\n\n二、八分法。刘勰《文心雕龙·体性》篇提出“八体”，实际上是指八种风格，刘勰又把这八体概括为两两相对的四种类型：“雅与奇反”“奥与显殊”“繁与约舛”“壮与轻乖”。\n\n三、九分法。宋代严羽《沧浪诗话》把诗之品分成九种：高、古、深、远、长、雄浑、飘逸、悲壮和凄婉，然后又概括为“优游不迫”与“沉著痛快”两类。这是多分法与二分法的结合，对今天的风格分类研究仍然有启发作用。\n\n四、现代文学风格分类\n\n现代的文学风格分类，往往不同于古代多根据直觉判断所做的风格分类，现代分类更多注意分类的逻辑严密性。陈望道沿用《文心雕龙·体性》篇中的术语“体性”，把风格分为四组八种：第一组由内容和形式的比例，分为简约和繁丰；第二组由气象的刚强和柔和，分为刚健和柔婉；第三组由作品中辞藻的多少，分为平淡和绚烂；第四组由检点功夫的多少，分为谨严和疏放。\n\n文学风格的形态是复杂多样的，不可能找到一种绝对完善的分类法。而且，分类永远是相对的，有些类型在同一作品中还可能交叉渗透。因此，应该根据具体作品的审美特点去灵活把握。", "keywords": "二分法 八分法 九分法", "note": "这部分内容大家了解一下就可以了，文学风格的分类在古代有二分、八分、九分，但分类永远是相对的，有些类型在同一作品中还可能交叉渗透。", "framework": ""}, {"id": "69", "stars": 3, "title": "举例分析文学流派是如何形成的", "body": "文学流派，主要是指一定时期里有着相近艺术追求和思想倾向的作家汇聚而成的文学群体。文学流派的形成原因，与多方面因素有关。大体说来，有如下几方面。\n\n一、相近的社会身份和社会阶层。南宋的“九僧诗派”成员就是一批诗题相投、相互唱和的诗僧。相近的社会地位与身份往往能塑造出相近的人格类型及相应的艺术观、审美趣味等要素。\n\n二、相近的文学观念和主张。近现代文学社团的“宣言”常常成为文学流派的旗帜。当然，相近的理论主张只有与实际创作相结合，并真正体现作家们共同的审美情趣，才能成为流派形成的真正原因。\n\n三、相近的题材。宫体诗派、山水田园诗派、边塞诗派等就是根据相近的取材而分的。第一次世界大战后出现在美国的一个文学流派“迷惘的一代”，其取材范围大都与战争有关。\n\n四、相近的艺术风格和相应的文体。宋词中的豪放派和婉约派，就是直接以不同的风格特点命名的。流派风格又与文体密切相关，如最能体现王、孟山水田园诗派恬淡空灵风格的往往是五言古诗、五言绝句，而七言歌行体则使高、岑边塞诗派悲壮慷慨的风格表现得淋漓尽致。在西方，最能体现现实主义流派风格的文体主要是小说，而浪漫主义、象征主义流派风格则在诗歌中有突出表现。\n\n五、相近的艺术方法和技巧。“三一律”是古典主义戏剧的标志，而白描等艺术方法，往往为现实主义文学流派所常用。对理想意象苦心孤诣地寻觅和营造，是意象派的特征，而对无意识心理和自由联想的展示，则是意识流小说的看家本领。\n\n六、自觉结成的文学社团。文学社团的形成与相同的地位及文学家之间的交往等相关。我国古代文学史上的公安派、竟陵派、桐城派等都与地域相关，现代文学史上的“京派”与“海派”也是如此。现代文学流派更是以结社形式为主，如创造社、文学研究会、新月社等。\n\n七、大众传媒和现代教育。在现代社会，大众传媒和学校教育在流派形成中往往起到至关重要的作用。文学研究会于1921年1月4日在北京正式成立，发起人主要有郑振铎、沈雁冰、叶绍钧、许地山、王统照等，这显然与《小说月报》1921\n\n年全面革新内容密切相关。\n\n除此之外，文学流派的形成还与时代和民族等状况有关。", "keywords": "相近的社会身份和社会阶层 相近的文学观念和主张 相近的题材 相近的艺术风格和相应的文体 相近的艺术方法和技巧 自觉结成的文学社团 大众传媒和现代教育 时代和民族等状况", "note": "古今中外文学流派有多种多样的存在。在现代社会，文学流派的多样性更显明晰。文学流派影响一个时代文学的发展与走势。文学流派常常有众多作家和作品，他们相近或相同的思想倾向和艺术追求形成某种浩大的声势，产生巨大的影响，引领了那个时代文学的走势。比如唐代诗歌的繁盛，在相当程度上与文学流派的影响有紧密联系。不同文学流派的相互竞争推动文学的发展。在同时代，观点或倾向不同的文学流派之间既可能相互对立，也可能相互竞赛，这往往成为促进文学发展的一种动力。比如宋代出现的婉约词派和豪放词派共同推动了宋词的发展，而作为现代文学重要流派的文学研究会和创造社，也大大丰富了中国文学园地，促进了现代文学的繁荣和发展。不同的流派带来不同的流派风格，也带来文学风格上的争奇斗艳，此间的竞争有利于文学的发展。这在中西方现代文学中表现得尤其明显。", "framework": ""}, {"id": "70", "stars": 2, "title": "文学流派多样性的意义", "body": "古今中外文学流派有多种多样的存在。在现代社会，文学流派的多样性更显明晰。文学流派多样性的意义，主要包括以下内容：\n\n一、文学流派影响一个时代文学的发展与走势\n\n文学流派常常有众多作家和作品，他们相近或相同的思想倾向和艺术追求形成某种浩大的声势，产生巨大的影响，引领了那个时代文学的走势。唐代诗歌的繁盛及其时代变化，相当程度上与文学流派的影响有紧密联系。\n\n在西方，意象派或意象主义是20世纪初出现的现代主义诗歌流派之一，它由庞德等于1909年前后在英国伦敦倡导成立，后被引入美国诗坛。它自觉接受中国古典意象诗歌的影响，主张诗人以鲜明、含蓄和凝练的意象去描写事物，将诗人的瞬间体验和思想感情融化在诗行中，反对以议论或感叹入诗。意象派对美国现代诗歌的发展影响巨大，并为英美现代主义诗歌的发展揭开了新的一页。\n\n二、不同文学流派的相互竞争推动文学的发展\n\n在同时代，观点或倾向不同的文学流派之间既可能相互对立，也可能相互竞赛，这往往成为促进文学发展的一种动力。在中国现代文学史上，“文学研究会”和“创造社”作为两个不同的文学流派，在反帝反封建的政治方向上是一致的，但其文学创作却颇多不同。文学研究会强调文学“为人生”，关注社会，关注底层，面向大众，偏重现实主义地描绘和剖析社会现实。而创造社则偏重自我表现，直抒胸臆，坦露自我，对现实社会中的丑恶现象大胆诅咒和强烈抗议，浪漫主义倾向明显。作为现代文学两大流派，它们大大丰富了中国现代文学园地，对促进现代文学的繁荣和发展发挥了不同而又重要的作用。\n\n不同的流派带来不同的流派风格，也带来文学风格上的争奇斗艳，此间的竞争有利于文学的发展。在中国现代诗歌领域，就有诸多诗派：以郭沫若为代表的创造诗派，有狂飙突进的抒情风格；以汪静之、应修人等为代表的湖畔诗派，表露出一种青春期的天真；以徐志摩为代表的新月诗派，倾向唯美；李金发、穆木天等人的象征诗派，偏好朦胧晦涩；蒲风、杨骚等人的无产者诗派具有平民化和鼓动诗的特点；戴望舒、卞之琳等人为代表的现代派，多以现代诗形和词藻为特色；胡风等人为代表的七月诗派，富有战斗精神和散文化倾向；冯至为代表的校园诗派，展现吸纳中西文化后的沉潜。以上种种诗派，百花齐放，令现代诗坛洋溢活力。", "keywords": "时代文学的发展与走势 相互竞争推动文学的发展", "note": "文学流派多样性的意义，一是在于不同时期的不同文学流派影响时代文学的发展，二是不同流派之间的竞争推动文学的发展和风格的多样化，这些内容大家稍作了解即可。", "framework": ""}, {"id": "71", "stars": 4, "title": "分析文学思潮的形成以及多样性，以西方文学与中国现代文学思潮为例", "body": "文学思潮，主要是指透过文学作品而呈现的在情感态度、审美原则、创作思想及社会观念等方面有着共同倾向的文学潮流。\n\n一、文学思潮的形成\n\n文学思潮与时代风云和社会思潮的激荡攸切相关。一般而言，基于特定历史时空环境中，由于时代的物质生活变化推动，社会的哲学、政治、经济、伦理、日常生活方式等思潮发生相互激荡和渗透，一些世界观、人生观及艺术情趣相近的文学艺术家，会在共同或相近的文艺思潮影响下，以共同或相近的题材及表现手法，创作出一批艺术风格相近的文艺作品。这些作品不仅具有鲜明的时代和个人特色，而且在社会上产生广泛影响，形成了某种相互共生的思想倾向和潮流，有时甚至是文学运动。于是，人们往往便称它为文学思潮。\n\n在中外文学史上，文学思潮持续时间长短不一，具体内涵不尽相同。在西方，不少时代的社会变化都受重大思潮影响，文化变迁与文学思潮在社会变革中往往起到先导作用。\n\n二、文学思潮的多样性\n\n在中外文学史上存在着多种多样的文学思潮，进入现代以来，更是呈现出多样性。\n\n（一）西方文学思潮\n\n在西方，持续时间较长、影响较大的现代文学思潮有浪漫主义、现实主义、现代主义和后现代主义等。\n\n（1）浪漫主义是18世纪末兴起于西欧的一种崇尚想象、自然、象征和神话的文学思潮，其基本特征主要有：第一，崇尚想象。浪漫主义作家总是喜欢在作品中张扬主体的想象、幻想以及相伴随的情感，表现了鲜明的主体意识，从而透露出强烈的主观性。第二，主张回到自然。他们大都把自然视为一个有机整体，主张回到自然、回到中世纪的田园牧歌生活。同时，他们认为人不仅是有机体，而且本身也是一件艺术品。第三，常用象征与神话。他们大量采用象征手段，使平凡、粗俗的现象作为生活整体而进入文学的象征系统中；同时，广泛引入古代神话传说、民间故事、异国情调等，使文学作品跌宕多姿，体现出浓烈的地方色彩。\n\n（2）现实主义是19世纪中期兴盛于欧洲的注重客观性、典型性和批判性的文学思潮，其基本特征有：第一，客观性。从文学观念来说，现实主义文学不再像浪漫主义那样强调主体的想象，而是主张按照客观生活的本来面目去加以描写，再现客观事物及人与人之间的社会关系，以达到艺术反映的内在真实性的要求。第二，典型性。从文学形象来说，它注重创造典型，即文学形象系统中显出特征且富于魅力的性格。《红与黑》中的于连，《高老头》中的高里奥、拉斯蒂涅、鲍赛昂夫人，《复活》里的玛丝洛娃等，都是文学史上富于特征和魅力的艺术典型。第三，批判性。从与现实的关系来说，它总是致力于大胆暴露社会问题，体现了强烈的批判性。\n\n（3）现代主义是在西方19世纪末至20世纪上半叶兴起的多种文学思潮和流派的统称，包括后期象征主义、意象派、意识流、表现主义、超现实主义、存在主义及荒诞派等。现代主义往往具有如下特征：一是常常追求形式和文体上的创新，探索无人问津或隐晦不明的主题，或以支离破碎的话语，追求暗示的效果；二是着力刻画个体心理现实，如“意识流”“超现实”等；三是致力于揭示个体生存的“荒诞”性；四是以其抽象化、不连贯性和剧烈震荡等新型写作模式而显现出较强的先锋性，曲折地传达出对西方社会危机的拯救意图。同时，现代主义虽然五花八门，不同流派之间有很大不同，但或多或少都表达了对社会现实的关切和诊治意图，可以说，追求深度模式和意义呈现，是它们大体上的共同特征。\n\n（4）后现代主义。作为文学思潮，后现代主义与消费社会和大众文化密切相关。后现代主义往往具有以下突出特征：一是平面化。传统的作品意义消失，深度模式被削平。二是断裂感。割裂传统，去历史化，显示出“精神分裂症”式的当下性。三是零散态。人在此被描写成为非中心化、非身份化的主体。四是复制性。随着大众文化工业带来形象的复制，艺术成为类象，即没有原本的摹本，审美距离遭到冷落。\n\n（二）中国现代文学思潮\n\n在中国，从古至今文学思潮波澜起伏。从近代到现代，中国也出现了几种影响较大的文学思潮。\n\n（1）“小说革命”潮\n\n这是指1902年由梁启超首倡而兴起的将小说提升为文学的最高体裁并赋予社会启蒙重任的文学思潮，代表作家有李宝嘉、吴趼人、刘鹗、曾朴等。梁启超一改中国古典的正统诗文观，破天荒地把历来视为低俗体裁的小说奉为“文学之最上乘”，认为“今日欲改良群治，必自小说界革命始，欲新民，必自新小说始”。不同于昔日传统小说的才子佳人、公案讲史、志怪神魔故事，作家们直面晚清社会黑暗而没落的现实，创作了大量直接反映当时社会真实状况并呼唤社会变革的文学作品。他们以开启民智为目的，积极倡导白话文写作，并广泛采纳代表现代文明的声光化电等新事物与新名词。\n\n（2）“五四”文学潮\n\n这是指1917年前后兴起的崇尚民主与科学启蒙、倡导进化论历史观、推崇白话文写作的文学思潮，代表作家有陈独秀、胡适、鲁迅、郭沫若等。这一文学思潮致力于运用白话文向民众宣扬科学与民主理念，对社会面貌及其根源作深刻的历史与文化反思，并对以“鸳鸯蝴蝶派”为代表的传统文学创作理念进行了坚决的批判。随着第一篇白话小说《狂人日记》、第一部白话诗集《尝试集》及富有影响力的白话诗集《女神》等的出现，新文学运动有力地带动了新文学的现代变革潮流。\n\n（3）左翼文学潮\n\n这是指20世纪30年代逐渐兴起并发生演变的，弘扬无产阶级革命、重视民族独立与人民解放的文学思潮，代表作家有蒋光慈、茅盾、丁玲、周立波、赵树理等。这一文学潮以自觉的无产阶级革命意识作指导，努力描绘中国社会走向革命的必然性，对人民群众的命运和未来生活理想有着积极的关怀和丰富的刻画。作家们自觉地从工农兵群众的日常生活中汲取语言养分并加以提炼，努力创造出适合工农兵群众阅读的新的大众语言。\n\n（4）新时期文学潮\n\n在20世纪，中国文学还曾受多种现代文学思潮的复杂影响，激荡起新的浪潮。特别是中华人民共和国成立以来，中国文学基于中国人民的革命斗争、社会主义建设以及人民群众的社会生活实践，以人民群众喜闻乐见的语言和形式，塑造了一大批社会主义新人形象，呈现出新的发展气象。\n\n在此基础上，20世纪70、80年代改革开放以来文学迅猛发展、繁荣兴盛，出现了引人注目的新时期文学潮。新时期文学潮，主要是改革开放时代以来陆续出现的文学复苏勃兴和大发展的若干文学潮流的统称。这主要包括在70年代末和整个80年代先后出现的“伤痕文学”“反思文学”“改革文学”“寻根文学”乃至“先锋文学”等诸多潮流。这其中的作品大都以奔涌的激情、青春的气息、浪漫的想象或冷峻的现实关怀，力图理解历史变迁，面对现实问题，挖掘民族活力，抒发个人情志、民族忧思和时代关怀。新时期文学潮极大影响和塑造了改革开放以来中国民众的精神气质。", "keywords": "西方文学思潮 浪漫主义 现实主义 现代主义 后现代主义 中国现代文学思潮“小说革命”潮“五四”文学潮 左翼文学潮 新时期文学潮", "note": "文学思潮与时代风云和社会思潮的激荡攸切相关。时代思潮概念虽然主要指向学术思想及时代的自我意识问题，但如果从大量文学作品出发，不拘泥于作品和作家，而扩展到社会和时代，则可见文学思潮其实也应包含在时代思潮之中，是时代思潮的一部分。", "framework": ""}, {"id": "72", "stars": 3, "title": "说明文学思潮的特征", "body": "文学思潮，主要是指透过文学作品而呈现的在情感态度、审美原则、创作思想及社会观念等方面有着共同倾向的文学潮流。文学思潮主要有如下特征：\n\n一、文学思潮往往具有弥漫性\n\n一种新的思潮一经产生，就会在更广大的时空内扩散，并产生深刻的影响。古代希腊、古代中国、古代印度等文明都产生了伟大的思想家，他们提出的思想原则塑造了不同文化传统，并一直影响着人类生活。随着社会现代化、经济全球化的不断推进，这种弥漫性不断被加强。文学艺术更是如此。近代以来，欧洲国家之间由于地界紧相毗连，历史、文化差异不大，再加上资本的跨国流动，在一国产生的一种思潮往往会迅速向其他国家传播，彼此呼应，相互激荡，形成声势浩大的世界性文艺思潮和文艺运动。在世界文学的现代化进程中，文学思潮由发达国家或地区向不发达地区流动的现象又特别明显。在中国现当代文学中，也可以见出世界性文艺思潮的弥漫轨迹。\n\n二、文学思潮具有兼容性\n\n越到当代，诸多思潮越发呈现出多样化、同时又交叉互渗的趋向。文学思潮的多样化突出地表现在现代主义创作中，其中所谓“表现主义”“超现实主义”等在重视主观心理等方面显然与传统的浪漫主义、象征主义等存在相通之处。从总体上看，文学思潮的多样化和交叉互渗，有利于文学的发展。\n\n三、文学思潮具有多样性\n\n在中外文学史上存在着多种多样的文学思潮，进入现代以来，更是呈现出多样性。\n\n（一）西方现代文学思潮\n\n在西方，持续时间较长、影响较大的现代文学思潮有浪漫主义、现实主义、现代主义和后现代主义等。\n\n（二）中国现代文学思潮\n\n在中国，从古至今文学思潮波澜起伏。从近代到现代，中国也出现了几种影响较大的文学思潮，比如有：“小说革命”潮、“五四”文学潮、左翼文学潮、新时期文学潮等。（李凡说：这个多样性就是上一道题目，考试如遇到可详细展开）", "keywords": "弥漫性 兼容性 多样性", "note": "文学思潮要与社会思潮对比而观，文学归根到底来源于社会生活，同时在思考文学思潮之所以为思潮的时候，要认识到它的弥漫性和兼容性，然后多样性别忘记展开。", "framework": ""}, {"id": "73", "stars": 4, "title": "简要论述文学流派和文学思潮的关系（26中央民族大学）", "body": "文学流派是一定时期里有着相近艺术追求和思想倾向的作家汇聚而成的文学群体。文学思潮是在情感态度、审美原则、创作思想及社会观念上有着共同倾向的文学思想潮流。文学流派与文学思潮之间存在密切的关系。既有联系，也有区别。\n\n一、联系\n\n文学流派和文学思潮的联系在于两者都是通过作品和作家而产生影响力，并从文学界延展到社会和历史之中，两者常出现重叠交叉，指称多有混同的现象。\n\n如西方现代派，一般称现代主义，是西方19世纪末、20世纪初兴起的多种文学思潮和流派的统称，包括后期象征主义、表现主义、意象派、意识流、超现实主义、存在主义及荒诞派等。此中各种文学运动既有流派的具体现实性，但大体上也体现出时代和社会的整体上的趋向性或不自觉的共同纲领。所以，现代主义思潮也时常被称为现代派。\n\n二、区别\n\n一般而言，文学思潮体现出特定历史时空中的整体性趋向，透露一定的理念支配性，传达出某种合目的性或合规律性的东西，思潮概念本身的比喻-“潮”，也强调了文学活动的某种整体性和系统性取向。\n\n而文学流派，强调的是“派”，往往只是追踪和厘清创作领域中的特定作家群体，虽然其生成因素体现出在思想、实践和成果方面的某种趋同性，但从总体上来说，流派概念强调的是作家的集合。例如讲中国现代文学的“山药蛋派”，总得具体落实到赵树理、马烽这些作家以及他们的作品上。也就是说，文学思潮突出了某种合规律性、合目的性的思想体系，而流派只涉及作家的派别，其形成的基础和聚合的标志主要还是作家集合的流派风格。", "keywords": "群体 思想潮流 作品和作家 多有混同 整体性趋向“潮”“派”特定作家群体", "note": "在解释这个问题的时候，要将两部分的知识点进行联系和组合，最好能够援引一些例证，使案例可以同时融合文学流派和文学思潮两方面的知识点。而在说明区别的时候，也能够举出相应的例子，使整体的答题脉络看上去更清楚。", "framework": ""}, {"id": "74", "stars": 3, "title": "简述文学接受的构成", "body": "文学接受的构成包括读者与作品的交互性关系，也包括读者与作者的交流。在文学接受过程中，读者构成阅读活动的主体，作品和作者是主体所涉及的具体对象。主体与对象之间的接触，也就是读者与作者、作品之间的关系，构成了文学接受的基本结构。\n\n一、读者与作品的互动\n\n在文学接受这种精神实践活动中，直接的参与者是读者，其阅读对象是文学作品。作品形成了阅读的客观规范与限制，读者在阅读中逐步实现自己的期待视野与作品的期待视野的融合，从而实现读者与作品的互动。\n\n（一）读者与作品的互动关系体现为作品对阅读的规范和召唤。\n\n作品是第一位的，读者的阅读和理解是第二位的。作品之“精”直接决定阅读的效果，没有优秀作品，就不能真正深入读者的精神世界、引起共鸣及至触及灵魂。优秀的文学作品震撼读者的心灵，把读者从日常生活的经验提升到自我意识的自由境界，引导读者对社会与人生的真切体悟与认知，有意识或无意识地对阅读接受形成客观规范。文学作品的思想情感的深度与性质限制读者的接受，形式与媒介又规定读者的阅读条件。\n\n当然，文学作品并非是绝对独立的客观存在，而是始终为他者或者读者而存在的。文学作品的创造和形成过程本身就隐含着对理想读者的呼吁。这种虚构的理想读者“具有引起现实读者注意的功能”。接受美学认为优秀的文学作品本身具有一种“召唤结构”，它邀请读者进入作品，不断地向读者提出需要回答的问题，召唤读者积极参与欣赏。宗白华认为中国文艺作品注重空灵与虚实，赋予作品生命感召力，有助于激发欣赏者的想象，因为“一个艺术品，没有欣赏者的想象力的活跃，是死的，没有生命的”。因而优秀的作品对读者具有引导和召唤作用。\n\n（二）没有被接受的文学作品只是潜在的存在，它需要读者通过阅读获得现实性，从客观的物的存在转变为审美的具体存在。\n\n文学作品未被读者阅读欣赏之前，它的价值还处于睡眠状态，还只是存在于物质载体（如书、报、杂志等）中的一个物，与其他物并无不同。如果把杜甫的诗集束之高阁，那么就“存在物”这一点而言，它与阁楼存放的桌椅板凳并没有什么差别。有经过读者的阅读、欣赏，潜在的文学作品的意义才能被唤醒，成为“活”的文学作品。文学作品只有依靠读者的阅读、理解和鉴赏，才能变成“活”的现实的文学作品。读者在文学接受中尽力理解或还原作家赋予作品的意义。进一步说，文学作品潜在的艺术魅力及其思想感情的深刻性、艺术上的微妙性，也只有靠读者积极的领悟、玩味，才能得以实现。只有通过读者的鉴赏和体味，语言符号构筑的作品内蕴的“美”才得以显现，潜在作品才转化为现实作品。读者的人生经验、文化传统、审美趣味直接影响具体的文学世界的形成。文学接受活动是读者参与阅读而形成的。\n\n（三）文学作品具有不确定性，具有含蓄性，留有空白，等待读者去解释与填补\n\n文学作品对于读者而言，不同于学术著作、新闻报道或产品说明，因为后者用的是“解释性语言”，而文学作品为了反映有血有肉的生活和活生生的情感，一般用的是“描写性语言”，包括大量的气氛的渲染、情调的表现、节奏的变化、色泽的润饰、比喻的运用、象征的描写等，这就必然要留下空白。小说里的人物，如《红楼梦》里的晴雯、尤三姐，《西厢记》里的红娘，《警世通言》里的王娇鸾，《聊斋志异》里许多被作者肯定的女性，她们的性格在小说里已经描写得很鲜明，可是这些性格鲜明的人物的外形却不像图画里那样描绘得很具体，更不像舞台上的表演那样生动直观。读者在想象时总不那么容易把握她们的外形，在读者头脑中可以说是不太稳定的，所以读者可能把自己在实际生活里所见所闻的印象与这些人物形象联系起来，来填补作品语言描写留下的空白，形成读者脑海中具体的艺术形象。\n\n现象学美学家罗曼·英加登认为，文学作品作为纯粹意向性客体具有不确定性，它是未完成的，“总是要求不断地得到补充”，而且这种补充是永远不断展开的。文学作品存在的不确定性，为读者在接受过程中的再创造与解释提供了空间。\n\n二、读者与作者的交流\n\n文学活动的整个过程，如刘勰所说，“缀文者情动而辞发，观文者披文以入情”。“缀文者”即作者，“观文者”即读者。这表明，读者的接受离不开作者的创作，接受是读者与作者的情感沟通与心灵契合。\n\n（一）一方面，读者与作者之间存在相互联系。\n\n读者和作者都需要文学语言的中介，需要对词语、句子、语篇的理解。作者需要用语言作为中介来“缀文”，读者阅读也需要语言的媒介进入丰富多彩的文学世界之中。而且，读者与作者作为文学活动中的重要主体，作为具有心灵性和精神性的存在者，皆是有情之人，没有情感就谈不上文学创作，也进入不了文学阅读的状态之中。文学接受事实上是读者与作者的情感交往，形成人与人之间的情感纽带，甚至到达“同声相应，同气相求”的共鸣状态。\n\n在现代文学接受中，读者与作者的知音关系受到了挑战，也出现所谓的陌生化的疏离或者间离效果。这也不能脱离作者，只是读者与作者的关系更为复杂。在网络文学接受中，读者与作者的关系又发生了变化，不仅情感交往向欲望满足转变，而且读者与作者的界限模糊，交互性更为便捷、亲密。\n\n（二）另一方面，读者与作者也是有区别的。\n\n（1）读者与作者所面对的对象不同。作者是直接面对历史或现实的生活世界与情感状态，读者则面对作者创作的语言文字作品，这是抽象的符号对象。读者只有通过阅读作品，才有可能间接地接近作者所描写的生活世界与情感状态。\n\n（2）读者与作者的审美方式不同。作者通过对世界的审美体验，完成艺术形象的构思，并把它通过语言文字表达出来，形成文学作品，即所谓“情动辞发”；读者则是通过阅读文学作品唤起审美体验并进行形象重构，使潜在的文学作品转化为具体的文学作品与文学世界，即所谓“披文入情”。", "keywords": "读者与作品 规范和召唤 获得现实性 解释与填补 读者与作者 相互联系 区别", "note": "①本题字数很多，大家记住关键字句即可，适当辅助以各类实例以具体说明之。②本题还有另外一种表述形式：试述文学接受中的读者、作者与作品之间的关系。可以联系艾布拉姆斯的《镜与灯》进行分析。", "framework": ""}, {"id": "75", "stars": 4, "title": "试分析文学接受的作用", "body": "一、读者的阅读、理解和鉴赏活动，彰显文学作品的现实价值，同时赋予文学作品以新的创造与发现\n\n读者的阅读行为不仅是被动接受，而且是一个主动参与过程。对于同一部作品，不同的读者可以作不同的理解。汉代儒家学者董仲舒提出的“诗无达诂”说就是这样一种观点。我国古代很多诗论家并不要求读者的理解与作者的本意相一致，而是肯定不同的读者面对同一首诗可以有不同的理解。作者有他自己的用意，但是读者各有自身不同的境遇和心理状态，二者相遇之时，必然会产生丰富的理解，从而赋予文学作品新的内容和意义。\n\n二、读者的阅读欣赏是对作品价值的检测与评价，在一定程度上影响作者的文学创作与生产\n\n文学接受是传统文学经验和新的文学经验的中介，它借助于大众与读者群体的阅读，建立新的作品的审美价值与文学历史的联系，构建新的作品与已有作品的对照关系，从而对新作品进行价值检验和价值判定。文学活动作为系统，其各要素之间存在密切的相互关联。作为对作者创作的反馈，读者的阅读反应通过各种渠道的传播为作者所了解，使作者对自己的创作的影响作出相应的自我评定，并在一定范围内调整创作思想和方法，从而影响其新的创作。接受成为文学创新发展的重要推手，在接受中打破陈规，找到文学创作的新的解决办法。\n\n三、文学接受是读者进行文学欣赏、理解，满足自身审美需要的过程，对读者的审美情趣培养、人格塑造、人生引导起着重要作用\n\n文学接受的主体是读者，文学的阅读欣赏是读者自我价值实现的重要途径。中国古人读诗，孔子则日兴、观、群、怨；阅读小说，梁启超则认为，可以拥有熏、浸、刺、提四种力，从而提升境界，促进新民与群治。品读经典文学作品，可以增长见识，凝练语言，陶冶情操，增长意志，调节身心，净化心灵，移风易俗，从个体影响到社会。文学的阅读、欣赏、理解是美育的具体过程，是发挥文学价值与功能的根本途径。\n\n优秀的文学作品本身隐含着人民大众的理想读者，而大众读者在阅读接受的自我实现中确证文学作品的价值，既传承文学传统又更新文学传统，从而推动文学本身的历史进步。", "keywords": "彰显现实价值 新的创造与发现 作品价值检测评价 影响创作与生产 审美情趣培养 人格塑造 人生引导", "note": "文学接受的作用，可以从生产和消费的角度去进行理解。文学接受就有点像是商品消费，消费者的喜好、购买意愿会对生产端起到反作用，并且也会影响消费者的消费习惯。文学接受也是如此，读者的解读、接受对于文学创造以及读者自身都会产生非常重要的作用。", "framework": ""}, {"id": "76", "stars": 5, "title": "谈谈文学接受的过程", "body": "文学接受的过程可以大致分为阅读前的素养储备、审美感受、审美评价三个阶段。\n\n一、阅读前的素养储备\n\n读者的素养与接受动机是文学接受活动得以进行的前提条件，也是文学接受过程的第一阶段，这构成了文学接受的“前理解”，是形成读者的期待视野的基础。\n\n（一）读者的素养\n\n作为文学接受的主体，读者接受能力的形成和提高，来自生活体验的积累和文化教育等方面的素质养成。\n\n（1）生活体验与文学接受密切相关。一般来说，读者喜欢的文学题材、风格、思想内涵都与自己的生活领域、阅历和命运有联系，读者在文学接受中总是联系自己经历的生活、思考和情感。读者生活经验的积累越丰富，对文学的理解也就越深刻。\n\n（2）文学艺术修养是进行更高层次文学接受的基础和条件。专门的文学教育，大量的文学阅读经验，乃至亲身从事过文学创作活动的经历等，对文学接受活动都具有不同程度的促进作用。提高文学艺术修养、增强对文学的感性经验和理性认识，是进行更高层次文学鉴赏的基础。\n\n（二）接受动机是推动读者阅读并接受文学作品的心理需求，可以分为审美动机、娱乐动机、求知动机、受教动机、借鉴动机和批评动机等。\n\n（1）审美动机是文学阅读的根本动机，是读者通过文学阅读获得审美享受和艺术感悟的需要。\n\n（2）在大众阅读中，娱乐动机往往是初始动机，通过文学阅读，接受主体在得到娱乐、消遣的同时也获得了不同程度的审美享受。\n\n（3）试图通过阅读文学作品丰富自己的生活、社会、宗教、科学、文化等方面的知识，构成求知动机。\n\n（4）出于获得某种人生启迪、精神鼓舞或道德教育等目的而进入文学活动，形成受教动机。\n\n（5）为学习作家文学创作的艺术手法和技巧而进行阅读，构成借鉴动机。\n\n（6）批评家试图通过对文学作品的阅读获得对文学规律更深刻的认识，对文学作品作出理性的分析和演绎，则构成批评动机。\n\n此外，处于某种欲望的替代性满足、从众心理等都会构成不同的接受动机。上述接受动机在具体的阅读过程中往往交叉出现、相互转化。\n\n获得愉悦是绝大多数读者阅读文学作品的初始动机，但在文学接受的过程中读者的动机也可能会发生转换，或者相互交织。如读者初读长篇小说《红岩》时，往往会被小说中的传奇人物及其传奇故事所吸引，而实际上，读者在阅读过程中，会不知不觉地走进作者精心构筑的艺术世界，去认识江姐、许云峰、齐晓轩、成岗、华子良这些英勇无畏的革命者，被他们的崇高品格深深感染。这样，尽管他们是从娱乐的接受动机出发，实际上也在无形中受到了教育，接受动机也在阅读的过程中发生了转换。\n\n二、审美感受\n\n拥有一定文学接受能力的读者，在接受动机驱使下开始文学阅读过程，并在其间抚卷流连，体味人生悲欢，领悟生命真谛。这便是文学接受的第二个阶段-审美感受阶段。\n\n审美感受是读者的期待视野与作品的视野的动态性融合，这个融合过程是动态的、复杂的。读者在对作品阅读和理解的过程中，不仅是在解读语言文字的意义，更是在重构作家所创造的艺术形象，即通过审美理解和创造性想象，重新建构出与作品中的艺术形象不完全相同的新形象。读者在重构饱含审美情感的艺术形象时，实质上已进入文学接受活动的审美感受过程。\n\n在阅读中，始终伴随着审美体验。在文学接受中，读者自身储存的经验与作品所表现的经验之间产生呼应与共鸣，在这种状态之下，读者发现了自己在生活中未曾留意的生活经验的意义与内涵，现实的经验由此得到超越，具有了某种难以言传的韵味，普通的经验转化为深刻的审美体验。\n\n同雕塑、绘画等空间性艺术相比，文学形象是在读者的精神世界中存在的。文学作品所提供的对象并不直接诉诸视觉和听觉，而需要读者在理解语言文字符号的基础上，以自身的理解去发现并填充空白，重构浸染着自己个性特征的文学形象。同时，由于语言文字符号自身负载着的理性和历史性内容，对文学阅读而言，没有相当的文化素养、自觉的参与和创造性的投入，文学作品的内在意义和审美潜质是无法得到真正实现的。因此，文学媒介的特性使得文学的感受和体验呈现出更大的创造性和自由性，这也体现了文学接受本身的独特价值。\n\n三、审美评价\n\n在阅读文学作品、重构文学形象并进行审美感受和体验的基础上，读者往往会进一步思索其思想艺术意义，追问作品的艺术和审美特征，并对其审美价值做出判断。这样，文学接受活动就进入审美评价阶段。\n\n实践活动的认识一般分为感性认识和理性认识两个阶段。理性认识以感性认识为基础，并超越感性认识，达到对于规律、本质的认识。从文学接受的过程来说，第二阶段的感受、体验以感性心理为主，而第三阶段的审美评价则理性因素更多。\n\n审美感受和审美评价相互交织，但又有所不同。审美感受是文学接受的初级阶段，在这一阶段，读者主要在感性的层面对文学作品进行感知、领悟和体验，其结果是感性的文学形象的形成。审美评价则是文学接受活动的高级阶段，读者是在前一阶段审美感受的基础上，凭借一定的尺度或标准，对文学作品的思想性、艺术性、审美价值等作出比较理性的判断和评价，但往往不脱离具体的审美感受。\n\n每一个读者在文学接受的过程中，总是具有通过文学教育和阅读经验等途径确立的审美标准，总是能够根据这个标准对文学作品作出自己的审美评价。普通读者的审美评价往往是随机的、感想式的、零碎的，但也是他们对作品最直观的理解、最真切的感受；批评家所作的评论是审美评价的高级形态，往往是对一般读者审美评价的进一步提升。\n\n上面将文学接受活动分为阅读准备、审美感受、审美评价三个阶段，但实际的文学接受活动并非是一个单纯循着这三个阶段的顺序进行的活动，往往是相互交织、难分先后。审美评价甚至可以在最初阅读作品时就出现，当读者开始阅读作品时，主观的评价系统就发挥作用，而审美感受也在作品的阅读过程中渐次发生。同时，审美评价也影响着审美感受，促进着读者审美能力和素养的提高，为以后的审美感受、审美评价奠定基础。", "keywords": "阅读前的素养储备 素质养成 生活体验 文学艺术修养 接受动机 交叉出现、相互转化 第二个阶段 审美体验创造性和自由性 审美价值判断 相互交织", "note": "①阅读接受的过程包括阅读前、阅读中、阅读后。在阅读之前，需要有素养的准备，一是读者有什么，二是读者为什么。在阅读时，读者解读语言文字，重构艺术形象，即通过审美理解和创造性想象，重新建构出与作品中的艺术形象不完全相同的新形象。在阅读后，既有普通读者对作品作出评价，也有专业的读者，即批评家对作品作出评价。②本题中的三个阶段均可单独命题。", "framework": "生活体验的积累和文化教育等方面的素质养成 审美动机 娱乐动机 阅读前的素养储备 求知动机 接受动机 受教动机 文学接受的过程 借鉴动机 批评动机 审美感受 审美评价"}, {"id": "77", "stars": 4, "title": "什么是审美评价", "body": "在阅读文学作品、重构文学形象并进行审美感受和体验的基础上，读者往往会进一步思索其思想艺术意义，追问作品的艺术和审美特征，并对其审美价值作出判断。这样，文学接受活动就进入审美评价阶段。\n\n一、审美评价的特点\n\n实践活动的认识一般分为感性认识和理性认识两个阶段。理性认识以感性认识为基础，并超越感性认识，达到对于规律、本质的认识。从文学接受的过程来说，第二阶段的感受、体验以感性心理为主，而第三阶段的审美评价则理性因素更多。\n\n审美感受和审美评价相互交织，但又有所不同。审美感受是文学接受的初级阶段，在这一阶段，读者主要在感性的层面对文学作品进行感知、领悟和体验，其结果是感性的文学形象的形成。审美评价则是文学接受活动的高级阶段，读者是在前一阶段审美感受的基础上，凭借一定的尺度或标准，对文学作品的思想性、艺术性、审美价值等作出比较理性的判断和评价，但往往不脱离具体的审美感受。\n\n二、一般读者的审美评价\n\n普通读者的审美评价往往是随机的、感想式的、零碎的，但也是他们对作品最直观的理解、最真切的感受。因而，不管是对于作家还是批评家，都具有重要的参考价值。普通读者的审美评价反馈给作家，往往能够帮助作家调整、改进、丰富、提高文学作品。\n\n三、批评家的审美评价\n\n批评家所作的评论是审美评价的高级形态，往往是对一般读者审美评价的进一步提升。批评家往往能对文学创作方法、技巧和思想有深入的了解和研究，因而在文学接受的过程中，从阅读到鉴赏，从审美感受到审美评价，都比一般读者理解得更为独到，提炼得更为准确，概括得更为全面，对普通读者的阅读具有更强的指导作用。", "keywords": "思想艺术意义 艺术和审美特征 审美价值 判断 特点 理性因素 高级阶段 一般读者 随机的 感想式的 零碎的 批评家 创作方法、技巧和思想 指导作用", "note": "审美评价是文学接受的第三阶段，以理性因素为主，侧重于对文学作品的思想性、艺术性、审美价值等作出比较理性的判断和评价。审美评价是对审美感受的提升和超越，而审美感受是审美评价的基础。在具体的文学接受过程中，二者往往是相互交织的。", "framework": ""}, {"id": "78", "stars": 5, "title": "怎样理解文学接受活动过程中的“二度创造”（25渤海大学）", "body": "文学接受活动并不仅仅是对作品原义的还原，而且是在作家创作文学作品的基础上进行的新一轮创造性活动。二度创造是文学接受活动的重要特点。\n\n一、二度创造的定义\n\n二度创造是指读者在阅读作品过程中在心理层面展开的再创造活动。\n\n二度创造强调读者在整个文学接受过程中的能动作用。由此对作家作品的意义进行再发现，对艺术形象进行再创造。按照二度创造的观点，文学的创造性事实上既包括作家的创造性，也包括读者的创造性。\n\n二、二度创造的内容\n\n读者二度创造活动的内容，主要有文学形象的重构和文学审美意蕴的再创造两方面。\n\n（一）重构文学形象。文学作品往往充满着空白和不确定点，这种不确定和空白构成了文学形象巨大的阐释空间，为审美想象力的发挥提供了可能，使得文学接受活动更具创造性和自由性。在这种重构过程中，读者可能会根据自己的现实生活体验、经历或阅历，对作品加以联想幻想甚至是比附，从而在头脑里再造出打上个人印记的文学形象世界。\n\n（二）是开掘深层的意蕴世界。在重构文学形象的基础之上，开掘、升华出深层的审美意蕴世界，是二度创造的又一内容。\n\n三、二度创造的形式\n\n读者二度创造活动的形式，主要有个体感悟、人际交流、生活追求以及学习借鉴等。读者可能首先手捧书卷伏案阅读，产生个体感悟，进而与他人交流自己的阅读体会；当然也有可能先是从他人处获取作品信息而开始阅读。读者在获得个体感悟后，很可能会自觉或不自觉地在自己的生活中加以借鉴，例如像自己喜爱的主人公那样生活、奋斗。一些喜爱文学创作的读者，还可能会因此走上文学创作道路。\n\n四、二度创造的意义\n\n当读者通过“二度创造”展开了作家作品的生命，一次具体的文学活动就暂告一个段落了。但这是一个开放的、动态的过程，作品的生命随着新的阅读创造而延伸。\n\n第一，开放与持续的文学接受活动。经历了从作家首度创造到读者“二度创造”的动态过程，一次具体的文学活动便基本完成。但需要说明的是，这里的“完成”只具有相对意义，只是就一次具体的接受活动而言。更宏观地看，一次接受的完成其实又是另一次接受的起点。\n\n第二，“二度创造”的历史继承和发展。一部文学作品的接受史，就是被不断阅读、不断发掘的历史，就是一部不断经历二度创造的历史。读者的二度创造过程也是某部具体作品意义不断累积的过程，因为对某部文学作品的接受效果实质上都在一定程度上既受到前人理解的影响、又会对后人理解产生新影响。\n\n这样看，文学的接受史其实与整个文学史的构成有关。姚斯认为：“文学史是一个审美接受和审美生产的过程。”这表明，文学的审美接受史本身就构成文学史的重要组成部分。", "keywords": "新一轮创造性活动 再创造活动 内容 文学形象的重构 文学审美意蕴的再创造 开放的、动态的过程 开放与持续 历史继承和发展", "note": "文学接受活动是具有创造性的人类活动，文学接受在某种程度上就是一种“二度创造”。“二度创造”是指读者在阅读作品过程中在心理层面展开的再创造活动，是对文学作品的再认识以及在作品基础之上的新发现。理解“二度创造”的内容和意义，对于我们理解文学接受的共通性和文学经典的形成有很重要的作用。", "framework": ""}, {"id": "79", "stars": 2, "title": "谈谈二度创造与文学活动的完成", "body": "当读者通过二度创造展开了作家作品的生命，一次具体的文学活动就暂告一个段落了。但这是一个开放的动态的过程，作品的生命随着新的阅读创造而延伸。\n\n一、开放与持续的文学接受活动\n\n经历了从作家首度创造到读者二度创造的动态过程，一次具体的文学活动便基本完成。但一次接受的完成其实又是另一次接受的起点。从文学史来看，审美价值愈高的艺术作品，在读者心中存留的时间愈长，即使在特定时间和特定条件下它们可能会被遗忘，但在另外的情境下，这种感动还会被触发并继续对读者发生作用。\n\n文学接受活动不仅是由个体来完成的，还由其读者群来实现。对于经典性作品而言，通过历史的传承，这一读者群有不断扩张的趋势。从某种意义上来说，读者群的大小或可作为衡量一部文学作品审美价值高低的一个参照标尺。从整个文学接受历史来看，只有那些伟大的作品才能超越历史，在不同的时代都成为人们接受的对象。不同历史时期的读者通过对作品的解读、交流和对话，使作品的潜在意义和价值也由此得到进一步的延展。\n\n二、二度创造的历史继承和发展\n\n一部文学作品的接受史，就是被不断阅读、不断发掘的历史，就是一部不断经历二度创造的历史。读者的二度创造过程也是某部具体作品意义不断累积的过程，因为对某部文学作品的接受效果实质上都在一定程度上既受到前人理解的影响、又会对后人理解产生新影响。\n\n这样看，文学的接受史其实与整个文学史的构成有关。姚斯认为：“文学史是一个审美接受和审美生产的过程。”这表明，文学的审美接受史本身就构成文学史的重要组成部分。作为个体的读者而言，由于文学作品蕴含的复杂性和丰富性，更由于主体自身对创造性的无限诉求，对一部优秀文学作品的阅读和理解往往不是一次就完成了的，而是要经过历代读者的多次的阅读和不断的再创造。在这种不断的创造、再创造活动中，历代读者不仅接力式地共同完善了对具体的文学作品的创造性阅读，而且其阅读经验的积淀又形成读者相对稳定的审美文化心理。同时，随着人类历史的不断发展和文明的演进，人类主体性（包括审美文化心理）的生成相应地具有无限延伸的可能性，因而对文学作品二度创造的空间和可能性同样也是无限的。", "keywords": "开放与持续的文学接受活动 感动 被触发 个体 读者群 进一步的延展 历史继承和发展 不断阅读、不断发掘的历史 审美文化心理 无限性", "note": "可以借助这段话来帮助理解：在阅读过程中，永远不停地发生着从简单接受到批评性的理解，从被动接受到主动接受，从认识的审美标准到超越以往的新的生产的转换。（［德］H.R.姚斯、［美］R.C.霍拉勃：《接受美学与接受理论》，金元浦、周宁译，辽宁人民出版社1987年版，第24页）", "framework": ""}, {"id": "80", "stars": 4, "title": "说说文学接受的差异性与共通性（26四川师范大学）", "body": "由于读者在文学接受活动过程中存在着二度创造，所以在不同的读者那里对同一作品的接受就会存在着一定的差异；当然由于面对的是同一作品，接受时也必定存在着一定的相同、相通之处。这就构成了文学接受的差异性与共通性。\n\n一、差异性与共通性的表现\n\n一方面，文学接受活动中的不同读者或同一读者在不同的时间和心境下对同一作品的阅读都会产生不同的阅读效果，有时这种差异还相当大。这一现象正是文学接受过程的差异性。\n\n另一方面，不同读者对同一作品的接受又往往存在着稳定的，超越时代、地域和民族差异的一致性，这种审美现象即所谓的接受活动的共通性。文学接受的共通性主要表现在以下几个层面：\n\n（一）对文学语言的把握具有共通性。文学作品是以语言作为媒介的，语言符号作为人类信息交流工具，具有普遍的抽象性和约定俗成的特征，具有普遍认可的语法规则。同时语言符号又是人们从小开始学习获得的一种社会性符号，与社会生活有着密切的联系，本身具有稳定性、集体性和时间的继承性。文学语言虽然具有含混性特征，并不一定像词典的释义那样中规中矩，但是，它毕竟具有约定俗成的语音、语法和意义，不同的读者对此的认识基本是一致的。\n\n（二）对文学形象的把握具有共通性。文学的形象是语言符号的展现，语言符号的确定性使得文学形象有一定的通约性，从而促进接受的共通。而且文学形象是典型的形象，超越了纯粹个人的限制，具有审美的规律性，这促进了审美感性的相通。再者，文学形象不是纯粹的虚构，而是根本上来源于社会生活或者宇宙自然，因此有着现实的原型。因此，处于社会和历史的读者能够理解作者创造的文学形象，也能够出现文学形象接受的类似性。\n\n（三）对文学的意蕴诠释和价值评价具有共通性。审美判断具有人类共通感的基础，不是孤立的而是可以传达和交流的。文学意蕴同一定时代的思想文化、同读者的主体性领悟相关，在整个文学结构中，对文学意蕴的解读是差异性最为明显的一个层次。但是，即使在这一层面，也依然存在着共通性。由于人类本性有共通性，民族文化有共通性，阶级、阶层的文化有共通性等，所以不同国度的读者，不同历史时期的读者，对同一文学作品的体验理解常常是基本一致的；同时，同一民族的读者，同一阶级、阶层的读者，对同一文学作品意蕴的体验与评价，也常常有共通性。\n\n二、共通性与差异性的关系\n\n文学接受活动中的共通性和差异性是对立统一的关系。一方面，由于文学作品的媒介符号的确定性，每一读者面对的作品是一致的，而作品对一切阅读有着最终的规定和制约作用；另一方面，在一定的共同范围（如同一时代、同一国家、同一民族、同一文化传统、相同或相近的审美时尚和趣味等）内，读者的接受必定存在着相当程度的共通性乃至共同性。然而，在这种共通性的基础上，差异性更为普遍地存在。因为即使围绕着同一部具体的文学作品的是同一时代具有某种共通性的读者群，其中每个读者个体的阅读能力、趣味也还是千差万别。不同的读者群和同一读者群内的不同读者必然会从不同角度切入具体的作品，从而造成文学接受的差异性。从整个文学接受来说，共通性是有条件存在的，差异性的存在则是绝对的；但两者是互相对立又互相依存的，差异性建立在共通性之基础上，共通性则现实地存在于差异性之中。\n\n总之，共通性保证了文学阅读的有效性和交流的可能性；差异性则是文学生命延展的动力和表现，是读者阅读准备同作品自身所展现的形式、内涵与价值的凝聚和融合。二者相互依存而又相互影响，缺少共通性，文学接受无法达成；缺少差异性，文学接受将逐渐走向衰落。", "keywords": "迥异的理解与诠释 多种不同的解读 共通性 一致性 语言的把握 形象的把握 意蕴诠释 价值评价 对立统一", "note": "回答这道题目，我们首先要明确文学接受中的共通性和差异性具体是什么，然后再总结出二者具体的表现，重点 是共通性的表现。最后，我们再阐述二者的对立统一的关系。对于相关的概念与关键词语，我们要牢固掌握。", "framework": ""}, {"id": "81", "stars": 5, "title": "谈谈你对文学经典的认识（26西南交通大学）", "body": "文学经典是文学接受活动的重要对象，从总体上讲，经典其实也是在读者千百年的文学接受过程中生成的。一部文学作品能否成为经典，不仅取决于其内容和表达形式对读者的适应和满足程度，而且取决于一代又一代读者对其理解、诠释、选择以及再认识、再选择的程度。\n\n一、文学经典的定义\n\n一般认为，文学经典是指在文学史上具有独创性，蕴含社会与历史意义，凝聚着很高的审美价值，具有长久生命力的典范作品，是思想精深、艺术精湛、制作精良的传世之作。文学经典是文学创作的借鉴对象，也是文学批评的重要参照标准，更是文学接受的宝贵资源。\n\n中国古代作家很早就有了“经典”的意识。《文选》《河岳英灵集》等作品选集的遴选过程实际上就是树立那个时代“文学经典”的尝试。不同时代的经典标准是不同的，对于经典的评价和选择也是不同的。陶渊明的诗歌在锺嵘《诗品》中仅列中品，从唐代开始被重视，再经宋代苏轼等人的评析和鼓吹，确立了在中国古代诗歌中一流经典的地位。\n\n希腊单词“kanon”指的是一种度量标杆或度量尺，被引申用来指代列表或目录，后来指被宗教权力机构确立为真正神圣经文的《犹太教圣经》和《新约》中的书目目录。后来“canon”（经典）一词又被用来指真正由某位作家创作的、又经专家认可的世俗作品的书目，如莎士比亚经典等。“经典”一词既指圣经又指世俗作品，从而模糊了这两者之间的显要区别。相对圣经而言，文学经典是非官方的、非确定性的公众共识的产物，是默认的而非明确的，范围模糊，入选作品往往可做更改。\n\n二、文学经典的形成\n\n文学经典的出现，是读者意识的反应，是历史选择的结果。一部作品的优劣高下，彰显于世还是湮没无闻，根本上还是靠历代普通读者、专业批评家的阅读和文学史家的遴选。其中，文学批评家和文学史家对推出文学经典所起的作用最为直接。人民群众是文学最普遍的阅读者，是文学的鉴赏家和批判者，他们的选择是文学经典最终确立的决定性的因素。同时，意识形态对文学经典的形成也有着相当重要的作用。\n\n三、文学经典对于文学接受的影响\n\n文学经典一经形成，就会受到社会的更多推崇，从而拥有更多的读者，获得历史继承的优先性，成为被阅读和阐释的焦点，对以后的文学接受活动产生广泛、深远的影响。\n\n文学经典的积极影响集中表现为对读者心理结构的塑造、改进、丰富和完善，使读者的灵魂经受洗礼，去发现自然的美、生活的美和心灵的美。文学经典的形成依靠创造性的文学接受活动，而文学经典一经形成也会对新的文学接受产生重要影响。文学接受和文学经典互相推动，共同促进着文学活动的演变。", "keywords": "独创性 社会与历史意义 审美价值 长久生命力 借鉴对象 参照标准 读者意识 历史选择 普通读者 文学批评家 文学史家 意识形态 文学接受活动 广泛、深远的影响", "note": "无论是在文学理论、古代文论还是西方文论之中，“文学经典”都无疑是一个热点且具有争论性的问题，有一个非常好的考题：“经典是永恒的艺术体现还是权力建构的产物？”我们可以结合中西方关于经典的论述，援引福柯的“话语建构”理论进行论述。", "framework": ""}, {"id": "82", "stars": 4, "title": "谈谈文学经典是如何形成的", "body": "文学经典的出现，是读者意识的反应，是历史选择的结果。一部作品的优劣高下，彰显于世还是湮没无闻，根本上还是靠历代普通读者、专业批评家的阅读和文学史家的遴选。具体来说，文学经典的出现，主要由以下因素影响：\n\n一、文学批评家和文学史家的遴选\n\n文学批评家和文学史家对推出文学经典所起的作用最为直接。文学经典在文学史上具有独创性甚至里程碑的意义，这种意义并非直接呈现，而是需要熟悉文学史的专业读者通过比较、发掘才可以显现。更为重要的是，具有创造性的文学作品以其与众不同的思想内涵和创作风格呈现在读者面前，缺少丰厚文学阅读经验的普通读者往往很难辨别这种创新的意义和价值。有的文学作品传播范围极小，很难进入普通读者的视野。于是，对这些作品的评价、阅读，专业的文学批评家和文学史家就承担着主要的责任。文学史家还承担着将某些文学作品遴选入文学史的工作，并使之以教材形式纳入学校的课程教育体系。这种文学教育的传承性保证了文学经典谱系的延伸，也保证了文学经典在未来被接受的可能性。\n\n二、人民群众的选择\n\n人民群众是文学最普遍的阅读者，是文学的鉴赏家和批判者，他们的选择是文学经典最终确立的决定性的因素。从较长的时间段来审视，普通读者在两个方面最终影响着文学经典的命运：一是专业读者所推荐的经典如果长时间得不到普通读者的响应和认同的话，其经典地位就会逐步丧失；二是普通读者集体认同并赋予其较长久生命力的作品，往往会反馈、影响和最终决定专业读者对经典的选择。\n\n三、意识形态影响\n\n意识形态对文学经典的形成也有着相当重要的作用。文学是具有倾向性的艺术，在一定的意识形态条件下，某些作品会因为表达了社会主流意识形态或与社会主流意识形态暗合而被推升为某一时代的文学经典，但如果这类作品仅具意识形态合法性而审美价值不高的话，它最终也会丧失其“经典性”。\n\n在文学经典的形成过程中会出现一种“伪经典”现象，即在特定历史时期出于非文学原因将某部作品人为拔高，使之一度获得本应只有真正的文学经典才可能获得的影响和地位。究其原因，仍然是文学接受活动出了问题，偏离了审美的追求。“伪经典”常常是商业炒作造成的，这种偏离现象很不利于文学的健康发展，这种现象在网络文学接受中是比较突出的。", "keywords": "读者意识 历史选择 文学批评家 文学史家 人民群众 决定性的因素 意识形态 伪经典", "note": "经典之所以能够成为经典，其中必然含有隽永的美、永恒的情、浩荡的气。经典通过主题内蕴、人物塑造、情感建构、意境营造、语言修辞等，容纳了深刻流动的心灵世界和鲜活丰满的本真生命，包含了历史、文化、人性的内涵，具有思想的穿透力、审美的洞察力、形式的创造力，因此才能成为不会过时的作品。", "framework": ""}, {"id": "83", "stars": 3, "title": "试论文学经典的特征和意义（26吉林大学）", "body": "文学经典是文学接受活动的重要对象，从总体上讲，经典其实也是在读者千百年的文学接受过程中生成的。一部文学作品能否成为经典，不仅取决于其内容和表达形式对读者的适应和满足程度，而且取决于一代又一代读者对其理解、诠释、选择以及再认识、再选择的程度。\n\n一、文学经典的特征\n\n一般认为，文学经典是指在文学史上具有独创性，蕴涵社会与历史意义，凝聚着很高的审美价值，具有长久生命力的典范作品。它是文学创作的借鉴对象，也是文学批评的重要参照标准，更是文学接受的宝贵资源。\n\n二、文学经典的意义\n\n文学经典一经形成，就会受到社会的更多推崇，从而拥有更多的读者，获得历史继承的优先性，成为被阅读和阐释的焦点，对以后的文学接受活动产生广泛、深远的影响。\n\n文学经典的积极影响集中表现为对读者心理结构的塑造、改进、丰富和完善，使读者的灵魂经受洗礼，去发现自然的美、生活的美和心灵的美。\n\n《诗》在文学接受过程中被视为所有“诗”之“经典”，即《诗经》，又反过来对后世诗歌乃至所有文学的接受史奠定下规范性基础，在一定程度上引导读者关注、欣赏和再创造，从而参与促进文学的繁荣发展，塑造读者的诗性情怀与精神境界。杨沫的《青春之歌》以“九一八”事变到“一二·九”运动为历史背景，以学生运动为主线，描绘了当时我国各类青年知识分子的精神面貌和道路选择，塑造了众多人物形象，他们中有坚定的共产党员卢嘉川、林红、江华等，有经不住敌人引诱而变节的戴愉，有自私自利、平庸、狭隘的余永泽，还有思想空虚、贪图享乐、沦落为玩物的白丽萍等。小说通过突出塑造林道静的形象，展示了一个小资产阶级知识分子成长为共产主义战士的曲折历程，揭示出知识分子只有投身革命洪流才有光明前途的必然性。这部描写青春、讴歌青春的作品，一经出版就深得读者喜爱，给许许多多青年知识分子的人生道路选择以深远的影响，甚至对他们的情感、趣味及人格的塑造都产生重要的感染效果。事实上，《钢铁是怎样炼成的》《家》《平凡的世界》等文学经典，其故事、其人物，对一代代进步青年的心理产生了极大的影响，甚至直接引导他们走上了追求光明和正义的道路。\n\n文学经典的形成依靠创造性的文学接受活动，而文学经典一经形成也会对新的文学接受产生重要影响。文学接受和文学经典互相推动，共同促进着文学活动的演变。", "keywords": "重要对象 独创性 典范作品 文学接受活动 广泛、深远的影响 读者心理结构 文学活动的演变", "note": "②文学经典的形成依靠文学接受活动，而它又反过来对新的文学接受产生影响，促进文学活动的演变，这就是文 学经典的意义所在。一些重点定义和关键名词，大家要仔细把握。②文学经典的意义，教材上仅仅一两段话，但是那些带文学评论写作科目的院校，常常针对文学经典出题，大家一定注意多延伸。", "framework": ""}, {"id": "84", "stars": 3, "title": "说说文学批评的含义和性质", "body": "一、文学批评的含义\n\n文学批评，与现代汉语中对“批评”一词的日常用法不同，并不是简单地指对文学中的负面因素进行否定性的批判。汉语中的“批评”一词在明清文学理论与批评活动中已出现。在李贽、金圣叹等人的小说评点中，“批评”主要是对文学作品进行批注评点，同时也包含了今天文学批评所强调的分析和评价是非优劣的内涵。作为现代通行学术术语的“文学批评”，是在晚清到五四时期从西方译介过来的。英国诗人艾略特主张，“我说的批评，意思当然指的是用文字所表达的对于艺术作品的评论和解释”。这比较符合文学批评的现代通常用法。\n\n在当代，文学批评也称文学评论，是指对具体文学现象的分析、阐释和评价。换言之，文学批评就是在具体的文学文本鉴赏基础上产生的带有评论性质的活动。\n\n文学批评相对理论来说，更关注文学实践活动。文学理论作为对文学现象的普遍规律的分析和判断，当然要经历从特殊上升到普遍的过程；文学批评是运用特定的文学理论，致力于文学现象的分析和判断，并从这种分析和判断中提炼出具有普遍性的理论观念。文学批评也正由于是文学理论的具体运用，因而处于不断变化中。文学批评的完成既需要通过文本实践，又需要通过文学理论。但同时应当看到，文学批评又常常跨越文学理论学科界限而延伸到哲学、社会学、语言学、心理学、文化学等相关学科领域中。在当代，它还常常成为大众传媒和社会舆论关注的焦点和领域。\n\n二、文学批评的性质\n\n关于文学批评性质，主要有两种观点：\n\n一种观点认为批评带有艺术的性质。文学批评应当与通常的文学创作一样，需要批评家的艺术素养、想象力和语言才能等，只有通过艺术方式才能更好地去批评艺术。这种观点正确地看到了文学批评与文学创作的联系，即需要艺术素养、想象力和语言才能，但却容易忽略两者之间具体分工和侧重点的微妙而重要的差异。\n\n另一种观点主张批评具有科学性质。这是说批评应当具有科学属性，需要冷静和理智。此说突出了文学批评中的理性成分，有其合理性；不过应当看到，文学批评也与通常的科学表述不同，需要一定的艺术素养、想象力和语言才能，从而在艺术发现基础上做出科学的评判。\n\n上面两种观点从各自不同的侧面揭示了文学批评的性质，但各执一端，难免有失偏颇。对于文学批评的性质，应当综合地和辩证地予以把握：文学批评可以视为文学理论的特定领域之一，是在文学阅读基础上对于文学现象的理性阐释和评价。这样的文学批评是科学性、艺术性和意识形态性的统一.第一，文学批评是对于文学现象的科学分析（科学性）\n\n科学地揭示文学创作、文学作品、文学接受等过程及其相关现象中蕴藏的规律性和特点，是文学批评不容推辞的任务。正如毛泽东所指出的：“文艺家几乎没有不以为自己的作品是美的，我们的批评，也应该容许各种各色艺术品的自由竞争；但是按照艺术科学的标准给以正确的批判，使较低级的艺术逐渐提高成为较高级的艺术，使不适合广大群众斗争要求的艺术改变到适合广大群众斗争要求的艺术，也是完全必要的。”第二，文学批评具有一定的艺术性这并不是说批评家必须用诗歌、小说、散文等语言艺术的方式去批评文学现象，而是说他们在批评中应当充分地体现自己独特的艺术眼光，或多或少地表现出自己的艺术灵性或适当运用艺术化语言，因为这样有助于他们更充分地把握和揭示文学作为语言艺术的成就、中国古代文论善于运用艺术化的方式评论诗文，刘勰《文心雕龙·才略》评价曹丕“魏文之才，洋洋清绮”，就用流水和丝织品来比喻曹丕才力充沛而文采清丽，这种喻象式批评耐人品味。\n\n第三，文学批评具有意识形态性这是说文学批评总是或明或暗地传达出特定个人、集团、阶层、阶级或民族的情感、愿望、思想、意志或利益，是特定个人话语与社会发生关联的活动。文学批评的意识形态性在于，一方面，作为批评对象的文学作品本身或明或暗地蕴含有意识形态性；另一方面，作为批评主体的批评家本人也难免有意识或无意识地流露出个人的意识形态倾向。正是这两方面决定着文学批评必然对文学作品的意识形态价值作出评价。\n\n我们的文学批评要坚持实事求是，全面辩证，与人为善，以正面引导为主。要倡导正确的创作思想，热情介绍优秀作品，帮助人们提高鉴赏水平。对有缺点的作品，要秉笔直书，真诚帮助。对有错误的观点，要敢于批评，以理服人。那种淡漠“为人民服务、为社会主义服务”方向和远离群众实践的倾向，那种迎合低级趣味、“一切向钱看”的倾向，那种鄙薄革命文艺传统、推崇腐朽文艺思潮的文学批评倾向，都是错误的，应该坚决反对。", "keywords": "含义 性质 科学分析 艺术性 意识形态性", "note": "①文学批评是文学活动的一个重要组成部分，相关概念中会涉及一些重要名词，需要大家牢记。②在谈论文学批评的性质时，对于那些较为偏颇的观点，我们要有所了解，但更重要的是，了解文学批评的科学性、艺术性和意识形态性，做到三者的统一。", "framework": ""}, {"id": "85", "stars": 1, "title": "如何理解文学批评的美学的和历史的原则（25江西师范大学、26华南师范大学、山东师范大学）", "body": "文学批评的原则是指文学批评所遵循的基本价值评判尺度。中外文学史上曾有过形形色色的文学批评原则，但马克思主义为文学批评提供了最根本和最重要的文学批评原则：“美学的和历史的”原则。\n\n一、“美学的和历史的”原则强调，文学是对社会生活的一种“诗意的裁判”，因而要求文学批评运用同样的“诗意”的或审美的尺度。它的核心在于文学批评是“美学的”，如马克思所说，按照“美的规律”，就是把文学作品作为审美的现象去对待，并按照美学的观点去加以分析和评价。对于文学批评而言，文学首先是一种审美对象。文学毕竟不是经济学或政治学教科书，而是审美的创造，因而其审美属性才是首要的和直接的。这就要求批评家对作品采取审美态度，以获取艺术感受或审美体验为动机，着力体会作品的语言特色、艺术形象、审美意蕴等，产生感动和发现，由此起点进入批评并将之贯穿于全过程。\n\n二、“美学的和历史的”原则还强调，文学与在历史中演进的社会意识形态具有不可分割的联系，反映着人类历史的生活，必须从根本上把文学这一审美现象当作历史过程的必然产物去对待。对于文学批评而言，文学在其审美特性中必然蕴含着具体的历史内容，应致力于透过审美形式把握其历史内涵。文学作品的审美的、艺术的或形式的特征不是与现实社会无关的，与其融为一体的内容总是或明或暗地激荡着某种社会风云。这需要把文学放在特定的历史条件下考察，对其作历史的、具体的分析，看其在历史上是否有进步意义，是否有利于促进人的全面发展，是否给人类增加了精神财富。\n\n三、“美学的和历史的”原则是审美过程与历史过程的辩证统一。美学的原则是历史的原则得以推演的基础，而历史的原则是美学的原则的指导、深化和提升，两者缺一不可。对于文学批评而言，文学的审美感染力总是服务于传达或隐或显的时代思潮和个人的思想、情感倾向，因而审美分析与历史分析应当综合地和辩证地运用。按照这一原则开展的文学批评，既是艺术形式的批评，也是思想内容的批评，既是审美的批评又是社会的、历史的批评。\n\n四、作为“美学的和历史的”原则在新时代的当代传承，有“历史的、人民的、艺术的和美学的观点”。“要以马克思主义文艺理论为指导，继承创新中国古代文艺批评理论优秀遗产，批判借鉴现代西方文艺理论，打磨好批评这把＇利器”，：三好文艺批评的方向盘，运用历史的、人民的、艺术的、美学的观点评判和鉴赏作品。”这就在“美学的和历史的”原则中增加了“人民的”“艺术的”原则内涵，强调了人民在社会主义文艺中的地位，以及文艺自身的艺术发展规律。", "keywords": "基本价值评判尺度 诗意的裁判 社会意识形态 辩证统一 当代传承", "note": "文学批评的原则是“美学的和历史的原则”，分别强调了文学批评的审美过程和历史过程，我们要在把握文学美学性质和意识形态性质的基础上，掌握这二者的辩证统一关系，明确文学批评的基本原则。", "framework": ""}, {"id": "86", "stars": 3, "title": "说明文学批评的思想标准", "body": "文学批评的思想标准是指批评家据以评价文学现象的思想或情感内涵的价值尺度，具体体现为对文学作品思想情感的真实性、倾向性等作评判。\n\n一、文学作品要真实地反映社会生活\n\n这是就文学作品对社会生活的客观再现而提出的要求，是评判文学作品在艺术地再现社会生活时所达到的逼真程度。但文学的这种真实并不等于对社会生活中实际发生事件的照相式记录，而是指作家在文学的审美世界中创造的与社会生活的历史本质相一致或接近的那种逼真度或逼真感。这样的真实能够在艺术再现中提供一种真理性认识。文学作品的真实性本质上是一种艺术再现中的逼真性。这种真实性是作家创造出来的，他在创造这种艺术真实的过程中融入了自己的个体生命体验、情感评价和社会关怀等主体性因素。\n\n二、文学作品总会流露出作家的特定倾向\n\n这是就文学作品对作家的社会立场和思想意向的传达而提出的要求，是指文学作品隐含或流露的作家对各社会利益相关方的偏向程度。作家并不一定要直接表露他自己的立场和思想，但作为社会的一员，他所属的家庭、家族、集团、阶层、阶级、民族、国家乃至性别等社会团体利益及其立场，总会或明或暗地显现在他创作的作品中，直接或间接地支配着他对笔下人物、景物、情感、情节等的艺术构想，影响他对所属的社会层级的感情。在当前社会主义社会，文学作品的倾向性会有更丰富多样而又复杂的呈现，需要具体分析。但无论这些倾向性如何表现，都需要社会主义核心价值体系的引领和指导。\n\n无论如何，文学作品的倾向性都不应该简单地直露或服从于先入为主的概念，而必须通过文学的艺术世界间接地流露出来。这就提出了一个原则：文学作品的倾向性必须在艺术再现中自然流露而不能特别指点。总之，文学作品是通过创造艺术世界间接地流露作家的思想倾向的。由于倾向性往往以不同方式渗透在艺术描写中，就需要批评家按照“美的规律”去鉴赏、分析和评价，深入挖掘和把握文学作品积极的社会意义。\n\n马克思主义文学批评强调作品要有进步的倾向性，就是要求作家在艺术地把握世界时能以先进的世界观作指导，反映历史发展的必然趋向，引导人们抛弃落后而走向进步。在当前，文学批评对于倾向性的揭示，正是要坚持辩证唯物主义和历史唯物主义的世界观、方法论，大力发展先进文化，支持健康有益文化，努力改造落后文化，坚决抵制腐朽文化，积极地为巩固和发展社会主义经济基础和精神文化服务，即以艺术的审美方式，通过影响人们的精神世界而热情地肯定、赞美和促进和谐社会的发展。\n\n三、文学作品总会表现作家的情感\n\n这是对作家的情感态度的传达而提出的要求，是说文学作品不会仅仅满足于真实地反映社会生活、流露特定的社会立场和思想意向，而是同时也会表达作家的个人情感或情绪体验。一部作品要产生其思想影响，达到思想方面的良好效果，不是靠直接的说教，而是依赖个性化的情感的感染。传情才可能晓理，情真才可以动人，因而“以情动人”总是文学作品的首要选择。\n\n在艺术加工过程中，不同的文学流派处理文学情感和社会生活的方式往往有着巨大的差异。作者情感的流露也并不意味着创作主体可以为所欲为，完全不顾及作品的客观性，作者不能完全强迫作品按照作者本人的愿望和臆想去行动。\n\n当然，衡量一部文学作品的思想性的优劣高低，最终还是要看它的社会效果，要看它是否能够在特定的社会读者中产生共鸣，从而成为时代精神与呼声的集中表达。", "keywords": "思想或情感内涵 真实地反映社会生活 特定倾向 进步的倾向性 作家的情感 社会效果", "note": "①文学批评的思想标准，简单理解就是评价文学现象思想内涵的价值尺度，具体来说则是体现为对文学作品思想感情的真实性、倾向性的评价，那么，理解文学作品的真实性与倾向性，就是十分重要的一点，大家要好好把握。②原则和思想标准也可以一起出题。", "framework": ""}, {"id": "87", "stars": 4, "title": "说明文学批评的艺术标准", "body": "文学批评的艺术标准是指批评家据以衡量文学作品的艺术性的价值尺度。艺术性是指文学作品的语言形式、艺术形象、阅读余味等所展现的美学成就及艺术魅力，主要体现为语言形式的创造性、艺术形象的概括性和阅读余味的醇厚性。\n\n一、语言形式的创造性\n\n语言是文学的第一要素，如何把语言组织起来完成“创造形象、典型和性格”等任务，这种语言形式的创造性问题对判定文学作品的优劣十分重要。因而，文学批评在运用艺术标准时，总是要考虑对文学作品的语言形式的评价。这就要求文学批评注重把握文学作品的语言形式的创造性，即对语言的组织方式的艺术创造力及其审美水平作出分析、判断。语言形式包含语词选择与组合、文体构造、结构设计乃至抒情与叙事方式等方面，而创造一词也包含了由内向外的表现、从无到有的创新、别具匠心的独创等多重内涵。\n\n批评家的重要任务之一，就是发现并揭示作品语言的创造性及其特色所在。优秀的作品往往通过独特的语言，让读者产生目击身历的感受。\n\n二、艺术形象的概括性\n\n一定的语言形式总是服务于塑造一定的艺术形象的，这使得艺术形象的批评成为艺术标准的又一要求。评价艺术形象可以集中关注其概括性。艺术形象的概括性是指艺术形象以其丰富、鲜活和独特的风貌，达到对社会生活的概括的目的。评价艺术形象的概括性，一看艺术形象是否丰富，就是看能否以有限的描绘呈现出社会生活图景的多样性和复杂性；二看艺术形象是否鲜活，就是看是否能把社会生活或心理图景鲜明、生动地描绘出来；三看艺术形象是否独特，就是看是否是独一无二的、自无而有的创造。这样做，就是要以丰富、鲜活和独创的艺术形象体现以一含多、以个别展现一般、以有限蕴含无限的艺术概括力。艺术形象的概括性，标志着文学作品所能达到的艺术高度。\n\n三、阅读余味的醇厚性\n\n就中国文学传统来说，艺术标准还涉及一个重要方面，就是从阅读效果角度注重作品余味的醇厚。阅读余味的醇厚性是指文学作品在读者阅读中产生余意深厚与绵长的效果。中国文学历来把余味醇厚作为衡量文学作品艺术成就的重要尺度，强调文学作品要让深厚的文辞既含蕴丰富而又多彩多姿，把言外之余味尽量蕴蓄其中。", "keywords": "价值尺度 语言形式的创造性 艺术形象的概括性 阅读余味的醇厚性", "note": "①对成功的文学作品来说，思想性和艺术性是统一的。不过，在具体的千姿百态的文学作品中，思想性与艺术性之间有时却不一定完全协调，或者只是某方面突出而某方面平庸。②对于这两种评价标准，我们要重点掌握，有时还会将二者结合起来考查，需要大家灵活应对。另外，对于这两道题，大家可以进行对比联系记忆。", "framework": ""}, {"id": "88", "stars": 2, "title": "试论文学批评的功能", "body": "文学批评在整个文学活动中有着积极的功能。“要加强和改进文艺理论和评论工作，褒优贬劣，激浊扬清，更加有效地引导创作、推出精品、提高审美、引领风尚”。具体地看，文学批评的功能主要体现在三方面：\n\n一、文学批评对文学创作具有一定的建议或引导作用\n\n这是从文学批评与作家的关系来说的，是社会对文学作品的主要反馈形式之一。文学批评家拥有职业素养并能熟练地掌握批评标准，因而一定程度上可以代表一定的读者群，他的批评可以代表一定的社会共识，及时地反馈来自读者的声音。这样，批评家对文学作品的思想和艺术特色的独特阐发，对作家创作动机和意图以及艺术成就的精辟评价，尤其是对作品及作家的尖锐批评，都可能对作家创作起到一定的确认、总结、建议、劝导等作用。优秀的批评家，从来都是作家的知音和诤友。\n\n二、文学批评可以影响读者对作品的理解，并对其文学价值观产生一定的影响与塑造作用\n\n这是从文学批评与读者的关系来说的。文学作品的种类特色可谓千姿百态，品质参差不齐，普通读者接受起来有时可能会存在一定的难度。至于那些艺术形式新颖、思想内涵深刻、超出读者阅读经验或需要特定背景知识才能把握的作品，读者接受时更容易产生理解或欣赏上的障碍。文学批评往往引导着读者的阅读，文学批评在作品与读者之间充当一种中介，建立起一座沟通的桥梁，通过推荐优秀作品、剖析文艺思潮、甄别美丑高下等帮助读者树立正确的和健康的文学观，提高读者的文学鉴赏水平。对于有害的作品或作品中的消极因素，文学批评也能起到预警与防范的作用。\n\n三、文学批评对文学作品具有一定的甄别功能，它对文学作品的分析与评价表达出特定的价值观念与理想，由此对社会产生直接或间接的影响\n\n这是从文学批评与社会的关系来说的。文学批评通过作品分析、作家评价，表达出批评家所主张的特定价值观念与理想，从而启迪读者，通过影响读者而对社会产生间接的影响。批评家在分析评价作家、作品和其他相关文学现象时，总是要提出自己的文学理念和观点，这些理念和观点又总会牵扯出一定的学说依据与理论支撑，闪耀着思想火花，丰富了思想文化积累。读者在阅读文学作品时又接触了这些批评论著，总会受到一定程度的影响；这些影响如同文学阅读的效果那样，会潜移默化地作用于读者的社会行为。\n\n总之，文艺批评是文艺创作的一件利器、一面镜子、一剂良药，是引导作者、读者和社会思潮的重要力量。", "keywords": "建议或引导作用 文学价值观 影响与塑造 对社会产生直接或间接的影响", "note": "文学批评是一种在文学阅读基础上，对具体文学现象进行理性分析、阐释和评价的实践活动。文学批评的功能，主要体现在他对作家、对读者和对社会的影响，体现在文学创作和文学接受之中，大家要仔细把握。", "framework": ""}, {"id": "89", "stars": 2, "title": "文学批评的类型（25云南师范大学）", "body": "文学批评类型是指文学批评论著所体现的评价取向形态，包括鉴赏型批评、认知型批评、功用型批评、新闻逸事型批评等。这是从文学批评反映批评家动机和体现其社会功能的具体方式来说的。\n\n一、鉴赏型批评：鉴赏型批评是一种侧重于鉴定和欣赏文学作品的人文思想、审美情趣和语言韵味的批评类型。从事这类批评的批评家往往具有较高的艺术修养和审美鉴赏水平，集中关注文学作品的审美品位和艺术成就。这类批评对文学作品\n\n的社会意义当然不会全然不顾，但相比起来，更注重从批评者自身的审美直觉出发展开批评，力求对作品的审美特征和艺术成就予以赏析，甚至会尽力还原对于作品的审美直觉。这种批评类型的主要特色就是文学现象的艺术鉴赏。\n\n二、认知型批评：认知型批评是一种侧重于从学理角度评析文学现象、体现认知冲动的批评类型。由于从事这类批评的主要是职业批评家、学者，故又称专家批评。这些批评家往往从特定的学术背景、学科路径或艺术见解出发去阐发文学现象的意义，并力求在阐发中提出和论证新的理论或批评观点。这类批评的主要特色就是展现批评家高于普通读者的艺术敏感和理论洞察力。鲁迅的《中国小说史略》、朱光潜的《诗论》、钱锺书的《谈艺录》等著述，在这方面提供了突出范例。\n\n三、功用型批评：功用型批评侧重于从社会效果来评论文学现象、适应社会大众的主流价值需求。它往往根据一定的道德意识、公众利益去评价作品，强调作家的社会责任感、作品在提供审美享受时要体现正确的价值导向。古罗马时期的“寓教于乐”说，我国先秦的“美善相乐”说，体现了这类批评的特点。孔子《论语·为政》这样评《诗经》：“诗三百，一言以蔽之，曰：思无邪。”这里的“无邪”，就是说《诗经》在社会道德上不背离统治者的主流的规范，合乎善的标准。功用型批评在艺术鉴赏中体现对社会效果的追求，如果忽略了艺术鉴赏，仅仅用单一的思想标准和道德准则，就会把“寓教于乐”变成“重教轻乐”。\n\n四、新闻逸事型批评：侧重于报导或分析文学的相关新闻逸事，迎合读者的消遣和休闲需要。文学性的新闻逸事往往在媒体的文化娱乐版、时尚杂志、文娱频道和栏目中出现，时效性强，针对性强。这虽然不属于传统的严格意义上的“文学批评”，但在客观上起到了文学批评的作用，成为紧密沟通作家与读者的日常渠道。这类文学批评在当前比其他批评类型拥有更多的普通读者，潜移默化地养成他们的文学阅读倾向，并使他们获得休闲的满足，同时帮助推销作品。但是，这种批评往往容易受到商业机构和出版商追逐利润的动机的影响，有可能出现媚俗、庸俗的追捧，误导读者。", "keywords": "评价取向形态 鉴赏型批评 认知型批评 功用型批评 新闻逸事型批评", "note": "文学批评四种不同的类型，其实是体现出了文学评论时的评价取向形态的不同，按照评论家在评价时关注的重点不同进行分类，大家对此需要有所了解。", "framework": ""}, {"id": "90", "stars": 3, "title": "说说文学批评的方法", "body": "批评家在从事实际的文学批评的过程中，会自觉或不自觉地选取特定的分析视角去观察，根据自身兴趣和特定思路而展开阐释，以及按照特定的价值标准作出评价。在文学批评的实践中，形成了多种批评方法，主要有以下几种。\n\n一、传记批评方法\n\n传记批评方法是最古老、最有影响的文学批评方法之一，它是指注重探寻作品与作者经历和人格的联系的批评方式。这种批评在中国有着悠久的历史传统。以作家传记方式展开文学批评，创自汉代司马迁。在《屈原贾生列传》中，司马迁紧密结合屈原的生平经历，对其作品《离骚》做了评论。他关于“忧愁幽思而作离骚”或“怨”而生《离骚》的判断，至今仍有其影响力。在西方，真正全力运用传记批评方法并在文学批评中获得正式地位的，是法国19世纪批评家圣伯甫。他受当时的实证主义思潮影响，主张批评的任务首先不在于论说文学作品本身，而在于实证地发掘和研究文学作品的“自然史”，这其中最重要的方面就是作家在作品生长过程中所起的多方面的实际作用。他以大量精力悉心搜集作家回忆录，向作家的亲属、朋友做调查，在此基础上撰写传记批评文字。\n\n二、社会历史批评方法\n\n社会历史批评方法是产生较早、影响较大并至今仍有影响力的批评方法之一，它是指通过考察作品产生的社会历史条件而评价作品的批评方法。它强调文学是一定的社会历史环境的产物，因而文学批评的主要任务在于阐释文学作品的社会历史原因及社会影响。意大利维柯、法国斯达尔夫人和泰纳是社会历史批评的代表人物。斯达尔夫人在《从文学与社会制度的关系论文学》（简称《论文学》）中，主要从社会制度（如宗教、风俗、法律、地理、民族性格等）的差异，考察不同民族文学的差异。泰纳在其《艺术哲学》等著述中，把实证哲学原理运用到文学批评中，致力于实证地追踪文学作品的发生过程，提出了影响深远的决定文学创作和发展的“三因素”说，即种族、环境、时代。这种批评方法在中国文学批评史上曾占有重要地位，孟子“知人论世”说、《文心雕龙·时序》篇等就是要求文学批评考虑时代因素。\n\n三、感兴批评方法\n\n感兴批评方法是中国古代独具特色的批评方法，侧重挖掘和鉴赏作家在作品中的艺术直觉和审美体验。在中国古代，从孔子的“兴于诗”到叶燮的“兴起”，感兴批评经历了漫长的发展演变历程，逐渐形成了自身的模式。到了唐代，感兴早已成为文学的一种被普遍认可的属性，而杜甫则是标举“感兴”“诗兴”并取得成功的杰出诗人。\n\n一般说来，以“感兴”为核心的中国古代文学批评体现了如下独特传统：\n\n第一，文学是对“志”“情”“兴”的表达，即是对个人的独特的生命体验的表达；\n\n第二，文学创作依赖于作者从生活中获取“感兴”并“伫兴”；\n\n第三，文学作品是“兴象”的结晶，通过语言创造出充满感兴的活生生的形象；\n\n第四，读者阅读要以“兴会”去感悟作者寄寓其中的独特感兴；\n\n第五，文学批评不应是逻辑式或推论式的，而应是“感兴”式的，因为只有“感兴”的方式才可能保持或还原作家的原初“感兴”。\n\n这种古典感兴批评方法的关键点在于从文学作品中寻求感兴的表现，并且力求在批评文字中复原这种感兴。这种感兴批评方法在中国古代文论中有鲜明的体现，人们在具体运用时往往形式多样，有的作诗进行评论，有的以眉批或夹注进行评论，有的则在序跋中进行评论，短小的表述中往往蕴含着真知灼见，体现了批评者独特的艺术见解。\n\n四、形式批评方法\n\n形式批评方法也称语言批评方法，是指依托现代语言学而发展起来的关注文学的语言组织及其在文化中的功能的批评方法。这种批评方法具体包括四条发展线索：\n\n其一，20世纪初期以关注“文学性”及“陌生化”等为特色的俄国形式主义；\n\n其二，20世纪20-50年代注重文本语言分析的英美“新批评”；\n\n其三，20世纪50-70年代运用语言学模型从事文学的语言结构分析的法国结构主义；\n\n其四，20世纪60-80年代致力于文本“解构”的法国和美国的后结构主义或解构主义。\n\n把文学批评重心从作家转到作品，从作品思想内容转向作品语言构造，或者尝试运用现代语言学模型去加以分析，是这种批评方法的主要特色。\n\n五、心理分析批评方法\n\n心理分析批评方法是指20世纪欧洲由弗洛伊德开创的发掘作品中的无意识语言及其作用的批评方法，主要代表人物还有荣格、拉康等。这种批评方法认为文学创作不是人的意识的产物，而是个人无意识或集体无意识的升华的结果。根据弗洛伊德的观点，文学创作正是以性欲为核心的无意识欲望（包括童年记忆、俄底浦斯情结等）的化装形式。他把自己发现的无意识理论经过改造后移植到文学批评领域，形成一种独树一帜的批评方法。由此看，文学批评的任务正是透过作品表面的“显意”而发现深层被压抑的无意识“隐意”，进而指出显意与隐意之间的“化装”关系。\n\n心理分析批评方法主要包括三条线索：一是弗洛伊德所代表的泛性欲主义的心理分析批评，二是由荣格所改造和创造的注重集体无意识的神话原型批评，三是拉康的后期心理分析批评。\n\n六、读者反应批评方法\n\n读者反应批评方法，是指以读者接受为重心的批评方式，强调文学批评的任务就是揭示读者对文学作品的阅读、接受或反应及其在文学活动中的主动作用。它反对作者中心论或作品中心论，认为读者对作品的意义、内涵、影响以及作家创作的实现等具有决定性作用；认为文学作品不只是由作家创造的，而是由作家与读者共同创造与完成的。这种批评在德国也被称为“接受美学”。在我国，对读者的重视早已形成了传统，20世纪三四十年代的进步文学、革命文学批评就特别强调把是否描写人民群众、是否为人民群众所接受所喜爱作为文学批评的重要标准。写人民、为人民，做到为不同阶层、不同群体的人民所喜爱，不仅是文学创作的努力方向，而且是我们的文学批评始终坚持的标准。\n\n七、意识形态批评方法\n\n意识形态分析方法在这里主要是指“西方马克思主义”的注重文学的意识形态特性和社会政治效果的批评方法，其代表是德国的“法兰克福学派”、法国的阿尔都塞、美国的詹姆逊、英国的伊格尔顿等。这种批评方法注重审视现代资本主义的社会现状和生存境遇在文学上的反映。尤其是以阿尔都塞及其后继者詹姆逊和伊格尔顿为代表，他们借鉴现代语言学成果，在文学作品的语言学模型中重新发掘文学的意识形态蕴含及其政治性，由此重建文学与后现代文化、晚期资本主义历史状况等之间的微妙而必然的联系。\n\n八、文化批评方法\n\n文化批评通常被用来指称多种不同的对象，这里的文化批评方法仅仅是指20世纪90年代流行于西方的注重文学的文化特性的批评方法，它包括新历史主义、女性主义、后现代主义、后殖民主义和大众文化批评等理论内容及方法。这些理论及方法共同促成文学批评的重大转向：利用语言学模型和跨学科研究构架成果，从作品语言研究重新转向文学与社会历史的复杂多样的联系。在这种新的转向与回归氛围中，文化批评方法把文学看作更大的文化过程或文化实践的一部分，更关注文学所具有的大众文化、民间文化等文化类型的性质，对作品进行跨学科的文化分析，揭示文学与经济、政治、文化等之间的密切联系。\n\n进入20世纪后期以来，文化表征理论的兴起突破了以往的文学批评范式。其中，英国学者斯图亚特·霍尔被认为是这一领域的代表性人物。表征型批评认为文本是一种“文化表征”，注重文本背后的非文本内容，特别强调文学文本与社会文化之间的复杂联系，这些联系通过“文化表征”叙述出来。与传统鉴赏型批评不同的是，表征型批评认为，一定时代的文本是社会结构和文化的表征。表征理论关注意义被生成和解释的途径，这就将文学批评拓展到了文学社会学领域。", "keywords": "传记批评方法 社会历史批评方法 感兴批评方法 语言批评方法 心理分析批评方法 读者反应批评方法 意识形态批评方法 文化批评方法", "note": "文学批评方法包括8种，这其中有的批评方法历史悠久，比如传记批评方法、社会历史批评方法；有的批评方法则显得新潮，比如文化批评方法。但无论何种批评方法，我们都要批判性地借鉴，根据实践的需要，做出新的探索和创造。", "framework": ""}, {"id": "91", "stars": 3, "title": "什么是泰纳的“三要素”说", "body": "“三要素”是文学批评用语，由19世纪法国文艺理论家泰纳提出。泰纳认为种族、环境、时代三要素是决定文学艺术的根本力量。“种族”指天生的和遗传的倾向，是“内部主源”；“环境”包括自然环境和社会环境，是“外部压力”；“时代”则是“后天动量”。三者形成合力，决定了文学艺术的面貌和发展方向。\n\n在第一部著作、博士论文《拉·封丹及其寓言》中，泰纳就提出了他日后将要发展的思想原则。他以拉·封丹的出生地香巴涅的地理条件、生活环境与当时的社会风气为依据，考察了拉·封丹和他的寓言。在《英国文学史》序言里，系统地提出“种族”“环境”“时代”是决定文学的三种根本要素的理论主张。而其代表作《艺术哲学》则对三要素决定论作了更具体、透彻的阐释。\n\n一、关于种族\n\n泰纳认为：“我们所谓的种族，是指天生的和遗传的那些倾向。”在《艺术哲学》中，泰纳把种族性看做是民族“永久的本能”，是“不受时间影响，在一切形势一切气候中始终存在的特征”。在同一种族中，即使时代不同、命运有别，仍然可以从深部发现原始印记所包含的几个显著的特征来。如古老的阿利安人，散布在从恒河到赫布里底（苏格兰西部的群岛）的地带，定居于具有各种气候的地区，生活在各个阶段的文明中，经过三十个世纪的变革而起着变化，然而在它的语言、宗教、文学、哲学中，仍然显示出血统和智力的共同点。\n\n泰纳主张种族特性是一种天生的遗传性，这是从生理特征而不是从社会文化特征角度来界定种族特性的。他认为种族与民族的区别在于：种族性格是不变的，而民族性格则是变动的。这种观点切断了种族与民族的联系，使种族成为抽象的、没有具体文化内容的生物特征，具有明显的反历史性。\n\n二、关于环境\n\n泰纳所指的“环境”有时是指地理环境、气候条件，有时是指政治和社会条件。\n\n以日耳曼民族为一方面和以希腊民族、拉丁民族为另一方面，二者之间所显示出的深刻差异，主要源于生存的地理环境。前者住在寒冷潮湿的地带，濒临惊涛骇浪的海岸，人们被忧郁或过激的感觉所缠绕，倾向于狂醉贪食，喜欢战斗流血的生活；后者住在可爱的风景区，站在光明愉快的海岸上，人们向往航海或商业，没有强大的胃欲，而倾向于发展精神方面的事业，如雄辩术、科学发明、文学、艺术等。\n\n社会条件是指国家政策、政治格局、军事战争、宗教信仰等。比如在英国，政治秩序的建立已有八个世纪之久，它使人们正直而可敬，自立而服从，习惯于在法律的威权下进行联合斗争。精神文化的产生也受社会环境的制约。如法国古典主义悲剧的出现，恰好是君主政体在路易十四统治下确立了规矩礼法，提倡宫廷生活，讲究优美的仪表和文雅的起居习惯的时候。当贵族社会和宫廷风气被法国大革命一扫而空的时候，法国古典主义悲剧也就不存在了。\n\n三、关于时代\n\n时代的概念十分庞杂，包括民族和时代的思想情感、社会制度、政治文化等因素，泰纳称之为“精神的气候”，“有一种“精神的”气候，就是风俗习惯与时代精神，和自然界的气候起着同样的作用”。他的时代概念与环境概念中的社会文化环境因素基本上是重合的，这样，三要素实为两要素-种族和环境。\n\n其中，环境又包括地理环境（没有时代性）和社会文化环境（有时代性）。那么，精神气候是如何对艺术产生作用的呢？\n\n首先是时代的精神状态对艺术家起着作用。艺术家不是与世隔绝的人，他的思想情感要受时代社会的决定；而且，艺术家还有一种特殊气质，他感受时代的精神气候要比一般人更细致更全面。\n\n其次，艺术家创作一件艺术品，除了艺术家本人的苦功与天才外，还包括周围的群众以及前几代群众的苦功与天才。艺术家头脑中有一个观念，好比一粒种子发芽开花，要从周围人们的精神世界中汲取养料。\n\n再次，艺术家从事创作，必然希望受到大众的赏识和赞美。风俗习惯与时代精神对于群众和艺术家来说都是相同的，艺术作品只有表达整个民族和整个时代的生存方式，表达群众所理解的情感和思想，才能在自己的周围招致整个时代和整个民族的共同情感。", "keywords": "种族、环境、时代《艺术哲学》永久的本能 地理环境、气候条件 政治和社会条件 精神的气候", "note": "关于种族、环境、时代三要素的关系，泰纳认为，种族、环境、时代是构成精神文化的三个要素，也是艺术创造的三个原始力量。“种族是内部主源，环境是外部压力，时代为后天动量。”由此构成一个有机的整体。泰纳最重视的还是种族因素，把它当成文学艺术发展中最根本的原因和动力。", "framework": ""}, {"id": "92", "stars": 2, "title": "怎么理解文学批评与文学理论的关系", "body": "文学批评类型和方法，从来就不是独立存在和固定不变的，而是从文学理论与文学批评的长期的互动实践中总结出来的。韦勒克发现在文学“本体”的研究范围内，对文学理论、文学批评和文学史三者加以区别，是最重要的。但他也注意到了文学理论、文学批评和文学史三者之间不可或缺的关联：“文学理论不包括文学批评或文学史，文学批评中没有文学理论和文学史，或者文学史里欠缺文学理论与文学批评，这些都是难以想象的。”文学批评诚然属于文学理论的一部分和具体应用形态，但实际上与文学理论形成互动关系。\n\n这种互动关系具体地表现为文学理论对文学批评的指导作用和文学批评对文学理论的促进作用。一方面，文学理论通过提供特定的学术氛围、理论观点和研究方法，拉动和引导文学批评前进。另一方面，文学批评反过来促进文学理论的发展：一是从对新的文学现象的批评中作出的新发现被总结和提炼成新的文学理论；二是文学批评向旧的文学理论观念发出挑战；三是文学批评的活跃促使文学理论家把注意力投向当下具体的文学现象批评，从而出现理论的批评化转向；四是当代文学批评对于语言学、美学、哲学、社会学、人类学、政治学、历史学等跨学科理论与方法的积极运用，推动了文学理论的跨学科研究新趋势的出现。\n\n需要看到，进入新时代以来，文学批评与文学理论的互动作用，特别是文学批评对于文学理论的促进作用，已经逐渐加强并成为文学研究中的一种普遍现象。文学批评家一面运用理论武器去开展批评，一面更加自觉地把来自批评实践中的新认识及时地提炼成新的理论，从而促使文学理论发生变化，尤其是当代文学批评的创新意识的强化，使得文学批评与文学理论之间的互动更为经常地发生，形成更丰富多样的文学理论风景。\n\n还需要看到，文学批评的上述演变在很大程度上也与当代电影和电视批评在文学批评中的比重迅速上升和影响持续扩散有关。随着《红楼梦》《三国演义》《西游记》《水浒传》《钢铁是怎样炼成的》等中外文学名著以及新著不断被改编成电影和电视剧，公众中激发出新的文学经典阅读热潮，并进而引发新的文学创作和文学接受潮流。正是文学同影视的这些新关系及其引发的新变化，吸引着文学批评家越来越多地关注和探讨，这必然会给文学批评提供新的话题、对象乃至带来相应的方法转变，同时又会对文学理论产生影响。\n\n关于当代文学批评的新变化，美国电视批评家罗伯特·C.艾伦揭示了从传统批评到当代批评的四方面演变轨迹：一是从关注艺术的自主性到关注作品与艺术惯例的关系，二是从以作家、艺术家研究为中心到以文化产品的制作与传播环境为中心，三是从认定作品自然具有意义到认为读者参与意义建构，四是从意义和经典等级的确定不变到重新审视现成文学准则并拓展文学研究范围。这些认识当然有其特定的针对性，同我国的文学批评与文学理论现状不尽相符，但毕竟对把握文学批评的新变化及其与文学理论的互动关系有着一定的借鉴作用。", "keywords": "互动关系 指导作用 促进作用 普遍现象 当代电影和电视批评", "note": "文学批评是文学理论的一部分和具体应用，但它也反过来对文学理论产生影响，二者由此形成了一种互动关系。而这种互动关系，在当下的文学环境中有了新的变化和发展，大家要好好体会。", "framework": ""}, {"id": "93", "stars": 3, "title": "文学批评者需要有什么主体条件（26吉林大学）", "body": "文学批评的主体是指文学活动中的批评者或批评家角色。批评者或批评家并非天生如此，而是读者向批评者发生角色转变的结果。批评者当然也是读者，但在整个文学活动中可比一般读者发挥更自觉、更专业的作用。文学批评者的主体性集中体现在，批评者具有不依附于被评论作家、作品的自主品格，通过具体的文学批评行为展现出富于独特个性的人格魅力。要实现这种主体性，批评者需要具备以下主体条件：\n\n一、审美感受力\n\n批评者需要具备良好的审美感受力。普列汉诺夫说得好：“只有那种兼备极为发达的思想能力跟同样极为发达的美学感觉的人，才有可能做艺术作品的好的批评家。”李健吾认为批评是在“一个相似而实异的世界旅行”，首先是报告批评家自己的阅读感受，而不是为了从作品中抽取或证明先在的理论，因此，他的批评在很大程度上注重传达批评家的独特的审美受力，尽可能将鲜活的感受记录下来。他形容“叶紫的小说始终仿佛一棵烧焦了的幼树”“挺立在大野，露出棱棱的骨干，那给人茁壮的感觉，那不幸而遭电殛的暮春的幼树”，生动而有力地传达出他对于叶紫作品的独特感受。\n\n二、理性分析能力\n\n批评者需要具备理性的眼光和洞见以及学理把握的能力。对于鲁迅及其作品，很多批评家都从不同角度作过分析解剖，每一个批评角度都体现了批评家对批评对象深入的理论研究和卓越的学理把握能力。我国第一部成体系的鲁迅研究专著《鲁迅批判》，从理想人格的独特角度对鲁迅作品展开了理性分析，称赞鲁迅的《伤逝》“有对于女性最深切的了解，有对于自己最明晰的自剖”，并断言“像《阿Q正传》可以代表鲁迅写农民的故事似的，《伤逝》可以代表鲁迅的一切抒情的制作”。作者的这些见解得到了鲁迅本人的肯定。从这个文学批评实践中，我们不仅可以感受到批评者过人的艺术才华，更可以体会到理性分析能力对批评者的重要性。\n\n三、文学史眼光\n\n批评者应具有建立在宽厚的文学史知识基础上的艺术见识。鲁迅把魏晋时期的文学放在整个文学史中加以客观评价，得出了““师心”和‘使气”，便是魏末晋初的文章的特色”的结论。在此基础上，鲁迅又深入分析，另选出“药”和“酒”来作为评价魏晋文学的叙述引线，进一步揭示魏晋文学独特的风格是由当时特殊的政治生态、生活方式、士人风尚等所决定的。鲁迅自觉运用历史唯物主义原理与中国传统的“知人论世”方法去研究魏晋文学的结果，体现了一种独特而深刻的文学史眼光。\n\n四、社会关怀意识\n\n批评家当然首先应关注文学本身，对文学现象展开分析和评论，但是，这种关注应或明或暗地渗透着批评家的社会责任感和历史情怀。这就常常表现在，批评家在具体的批评过程中，处处坚持文学来自社会而又影响社会的观点。在古代文学史上，“文以载道”之所以能成为士人广泛推崇的批评标准，在于它承载着强烈的社会责任意识，关注文学对社会和人生的意义。在当代文学史上，对于赵树理的创作，周扬以马克思主义文学批评家的高度敏感和社会关怀意识，给予了及时的肯定和赞扬。他称赞《小二黑结婚》是“反映农村斗争的最杰出的作品，也是解放区文艺的代表之作”，周扬的文学批评反映了批评家本人对解放区人民群众翻身斗争的热切关注，对解放区文艺服务于这种翻身斗争的热情呼唤。", "keywords": "批评者 批评家 自主品格 人格魅力 审美感受力 理性分析能力 文学史眼光 社会关怀意识", "note": "从实践上看，文学批评终归是一个实践问题，依赖于批评者面对具体文学现象的实际批评工作。这首先要求批评主体具备良好的审美感受力、细腻的理性分析能力、透彻的文学史眼光和鲜明的社会关怀意识。", "framework": ""}, {"id": "94", "stars": 3, "title": "文学批评的文体类型", "body": "文学批评实践总要凝聚为具体的批评性作品，这就是文学批评著述，分为文章和著作。而文学批评著述总是按照特定的文体类型写成的，这就有文学批评文体类型的选择问题。文学批评文体类型是指文学批评著述的具体体裁样式。常见的批评文体主要有六种：以诗论诗式、评点式、评传式、序跋式、随笔式、论文式。\n\n一、以诗论诗式\n\n以诗论诗式指一种以诗歌方式传达批评意见的批评文体。其特色在于以诗的语言尽量还原诗的阅读感兴。在中国，杜甫的《戏为六绝句》开创了以诗论诗的批评文体。杜甫以诗的方式评论了庾信、初唐四杰等诗人和古今、风雅等文学问题，传达了杜甫本人的独特诗歌美学主张，从批评文体到批评标准等都对后世影响很大，使得以诗论诗成为中国古代文学批评的一种重要方式。在外国，古罗马贺拉斯的《诗艺》、法国古典主义者布瓦洛的《诗的艺术》也属诗歌体。\n\n二、评点式\n\n评点式又称点评式。它是指一种以简洁语句表达批评意见的批评文体。它通常表现为言简意赅的评析诗词小说戏曲等作品，其高妙者直指心尖，揭示玄机，点到即止，不必详细论证和阐发。宋代刘辰翁对《世说新语》的评点是中国古代评点式批评的开拓之作，在明清时期，小说批评形成一时风气，金圣叹评点的《水浒传》、毛宗岗评点的《三国演义》和脂砚斋评点的《红楼梦》，都是小说评点的优秀之作。\n\n三、评传式\n\n评传式是指一种以作家传记方式传达批评意见的批评文体。这种批评文体在为作家立传过程中展开批评，传中有评，评传结合，有助于形成对作品与作家的相互阐释。\n\n在中国，司马迁最早为作家立传，《屈原贾生列传》正是这类批评文体的范例。他从屈原的生平经历中提炼出《离骚》生于“怨”的独特观点，并作出“推此志也，虽与日月争光可也”的高度评价。随后的《汉书》《三国志》也曾为司马相如、曹植等立传。在欧洲，19世纪法国批评家圣伯甫是传记批评的开创者，他为许多作家立传，产生了广泛影响。\n\n四、序跋式\n\n序，指序文，一般是指写在一部作品的前边的文字；跋，指跋文，是指附写在一部作品后的文字。序跋式批评文体是指一种以作品的序文或跋文的方式传达批评意见的批评文体。其特点是长短不拘，表述灵活，往往以所为之作序跋的作品为依托而发表批评见解。这也是中国古代文学批评中的一种重要方式。中国古代，萧统的《文选序》总结文学发展历史，点评各种文体，表达了对“事出于沉思，义归乎翰藻”的文学作品的崇尚；在现代，鲁迅曾为“奴隶丛书”三种（即叶紫《丰收》、萧军《八月的乡村》和萧红《生死场》）作序，阐发了自己的批评见解。英国浪漫主义诗人华兹华斯为《抒情歌谣集》1800年版和1815年版分别作序，这两篇序言也成为文学批评史上以序言方式表达批评洞见的名作。\n\n五、随笔式\n\n随笔式是指一种以随兴落笔的方式去传达批评意见的批评文体，即文艺随笔。它通过似乎随兴而至的灵活议论或抒情传达批评意见，可以叙中带议，寓理于事，小中见大，令人感觉生动、有启迪、有趣味。美学家宗白华就擅长以这种文体快评新诗以及品评文艺经典，如他的《艺术生活》《新诗略谈》等短章。\n\n六、论文式\n\n论文式是指一种以论辩、论证方式和规范的格式去传达批评意见的批评文体，是当代文学批评中应用最广泛和最重要的文体。论文式往往选取特定的理论视角，以严谨的论证程序和充分的例证去表达批评观点。通常重要而复杂的文学批评问题，总采用这种文体去讨论和阐释；同时，高等学校中文专业学生总采用这种文体去训练文学研究的基本技能。论文式可长可短，可以有多种不同种类，如作品专论、人物专论、综论等。就当前的论文式批评文体来看，其明显特征有：第一，结构规范而完整，一般包括摘要、关键词、引言、本论、结语和注释等部分；第二，观点有新意或有新的发现；第三，论证严谨有据；第四，文本分析具体而细致；第五，注释规范。\n\n以上类型还不可能涵盖全部的批评文体，例如书信也是人们表达文学见解的一种文体，书信体的方式有时可分别归入以上各种类型。同时，同一批评家可能根据不同需要而选择不同文体。批评文体的选择取决于多重因素，如批评家的理论思路或立场、现实需要以及作品特色等。", "keywords": "以诗论诗式 评点式 评传式 序跋式 随笔式 论文式", "note": "批评主体应依据批评目的、对象和风格，选择特定的文学批评文体，如以诗论诗式、评点式、评传式、序跋式、随笔式和论文式。批评主体还应认真阅读文本，获得艺术发现，选取切入角度，提炼核心观点，进而对之进行条理化布局和表述。", "framework": ""}, {"id": "95", "stars": 2, "title": "谈谈文学批评的写作步骤", "body": "批评者在完成文学批评文体的大致选择后，可以进入写作阶段。无论选择何种批评文体，以下写作步骤都是共同的和不可缺少的：\n\n一、阅读文本，获得艺术发现\n\n文学批评写作要求批评者反复阅读被批评对象-文本及其他相关材料（如作家经历、创作意图或时代语境等），在此基础上加以复述，以便寻找其艺术上、美学上的独特建树或闪光点。哈比布认为，文学批评因为坚持“细致的、批判性的和广泛的阅读”这些策略而显出特色。反复阅读有助于进一步发现文本的含义及特色、独创性因素或特定疏漏，而复述的过程同时也就是初步概括、归纳或集中的过程。批评者只有从作品中获得艺术发现，才能真正体会出作品的独特，而这是从事文学批评写作的第一个关键步骤。为了保持批评写作的严谨性，批评者需要脚踏实地地履行这第一步。\n\n二、选取批评切入点，提炼核心观点\n\n一部文学作品总是一个丰富的审美创造，涉及若干方面；一次批评过程或一篇批评文章的写作，不可能包罗万象，只能涉及该作品的某些方面。因此批评写作一般无需面面俱到，而是要求选取特定突破点切入，逐层展开，由点及面，力争由此把握其中的一个或几个方面。突破点的选择取决于若干因素，如批评者的阅读体验、理论视角或立场，作品的艺术形式或思想内容的特色，作品的社会效果等。面对纷繁复杂的文学现象，重要的是懂得选取一个主攻方向，集中火力实施突破。而要从特定切入点实施突破，批评者还应当尽力提炼出自己的核心观点。没有核心观点的批评，算不上成型的批评。核心观点可以是新的独特创见，也可以是略有新意的评说，还可以是在已有见解基础上的新的综合。形成核心观点是批评写作的一个关键步骤，直接关系到整篇批评文字的生命力和活力。核心观点出彩，文学批评才能出彩。\n\n三、条理化布局及文字表述\n\n条理化布局是从批评文字的安排来说的，就是在上述过程的基础上，形成合理而有序的文字表达格局，使批评意见成型和趋于成文。对于如何从总体上把握作品，刘勰《文心雕龙·知音》指出要从文体、遣词造句、继承与创新、奇与正两种创作手法、事类和音律六个方面进行分析。《文心雕龙》系统地论述了文体论、创作论和批评论等问题，本身就是文学批评的典范之作，被清代章学诚评价为“体大而虑周”。由此看，文学批评写作在成文时也需要以“六观”的精神去加以条理化和成文，使整个批评文字具有整体感及表达力。具体而言，文学批评的文字表述过程主要包括确立文章构架、讲究行文章法、注重学术规范等方面。这要求在反复阅读与复述的基础上，把拥有突破点、条理化布局和核心观点的批评构想再用合适的文字表述出来并最终成文，因而属于批评写作的最后步骤。这里包括根据所选择批评文体类型的要求和特点，对批评文字予以反复修改和润色。文字表述终究是服务于批评者的独特观点与个性化的表达。", "keywords": "艺术发现 核心观点 条理化布局 文字表述", "note": "①文学批评写作步骤主要分为三步，首先是在仔细阅读批评对象的基础上获得艺术发现，然后选取恰当的切入点，提炼出自己想要表达的观点，最后要考虑的则是整体的布局与表述。学习理解这部分内容，对我们的写作大有裨益。②以上仅仅是从文学理论这一学科去谈，实际上的文学批评可能会比这复杂许多，需要具体情况具体分析。", "framework": ""}, {"id": "96", "stars": 4, "title": "谈谈你对游戏说和巫术说的理解", "body": "关于原始艺术的发生有许多说法和解释，影响较大的主要有游戏说、巫术说等。\n\n一、游戏说\n\n游戏说认为文艺发生于人类的游戏活动，主要代表有康德、席勒、谷鲁斯等。最早从理论上阐述游戏说的是德国哲学家康德，他认为艺术与手艺不同，因为“好像它只能作为游戏，即一种本身就使人快适的事情而得出合乎目的的结果（做成功）”，所以应叫做“自由的艺术”。\n\n这一学说被德国美学家席勒系统地继承并加以发挥。席勒认为，人的“过剩精力”是文艺与游戏产生的共同生理基础。动物有时发出一些无谓的嘶吼，是为了发泄身体多余的精力，这是动物的游戏。而人不同于动物的地方在于，动物的游戏还局限在身体运动的方式，而人还有想象力的游戏，艺术活动就是这类游戏。人有“感性冲动”和“形式冲动”（也即理性冲动），这两种相互对立的冲动，前者“使我们身内的必然转化成现实”，后者要“使我们身外的现实服从必然的规律”，因此人必须依靠“游戏冲动”才能使被现实分离的这两方面重新达到统一。正是在游戏里，感性冲动和理性冲动的统一才能使人恢复自由。游戏冲动的对象是活的形象，即广义的美。在审美游戏里，人成为了自由而完整的人。\n\n德国学者谷鲁斯随后也沿用游戏说，但又认为“过剩精力”难以解释人在游戏类型上的选择性和专注程度。他认为，游戏有隐含的实用目的，如小女孩喂洋娃娃是模仿和练习做母亲，男孩玩枪是模仿和练习打仗等，而艺术活动可以归结为内模仿的心理活动，其本质上与游戏相通。一个人看跑马时，不会真的放弃座位去跟着马跑，而是心领神会地模仿马的跑动，享受这种内模仿的快感。内模仿就是一种最简单、最基本也最纯粹的审美欣赏。\n\n二、巫术说\n\n巫术说认为，艺术发生与原始人类的巫术活动有关，其主要代表有泰勒、弗雷泽等。英国人类学家泰勒在《原始文化》一书中提出，原始人所描绘的史前洞穴壁画，在当时是出于一种巫术的动机。随后，弗雷泽认为，原始部落的一切风俗、仪式和信仰，都与巫术相关。他提出两条巫术原理，第一是“同类相生”或同果必同因，第二是“物体一经互相接触，在中断实体接触后还会继续远距离的互相作用”。前者可称之为“相似律”，后者可称作“接触律”或“触染律”。\n\n巫师根据第一原则即“相似律”引申出，他能够仅通过模仿就实现任何他想做的事；从第二个原则出发，他断定，他能通过一个物体来对一个人施加影响，只要该物体曾被那个人接触过，不论该物体是否为身体之一部分。\n\n巫术说并非主张文学直接来源于巫术，而是揭示巫术意义的生产过程对文学的发生有重要影响，甚至巫术仪式还可为某些文学类型提供直接的借鉴。古希腊悲剧源于酒神节上的原始巫术仪式酒神颂，后来又逐渐加入演员的表演、朗诵等，进而形成悲剧诗。由此，从人类学视角出发形成的巫术说，成为现代西方颇有影响的一种关于艺术发生的学说。\n\n这两种观点对原始艺术发生的奥秘进行了探索，为认识原始艺术的发生提供了重要参考。但是这些说法也都有明显的局限性，即简单地从特定的人类活动、社会目的或者心理因素中寻找艺术原始发生的动因，没有将艺术视为一个整体的人类文化实践过程，所以未能从根本上揭示原始艺术发生的真正原因。", "keywords": "人类的游戏活动 自由的艺术 人类的巫术活动 巫术意义的生产过程 重要参考", "note": "文学活动经历了漫长的历史演变。探讨文学的发生、发展以及文学继承与创新的关系，有助于认识文学的历史与现实以及文学对人类社会文明史的意义，有助于理解当代中国文学发展之路。这其中，游戏说和巫术说是比较流行的两种观点，为我们认识原始艺术的发生提供了重要参考，大家要有所了解。", "framework": ""}, {"id": "97", "stars": 4, "title": "谈谈劳动与原始艺术发生的关系", "body": "劳动是原始艺术发生的根本动因。这可以从人类为何创造艺术以及怎样创造艺术的历史中去理解。\n\n首先，劳动为原始艺术的发生准备了生产主体。人类社会与自然界得以区分的最重要因素在于社会劳动的出现。劳动作为“整个人类生活的第一个基本条件”，为人的生存活动提供了物质基础。相应地，劳动为原始艺术的发生创造了生理条件。远古人类在从猿到人的转变过程中，最先是形成了直立行走的习惯。随之，手得以解放出来，逐渐开始从事其他各种活动。在这一过程中劳动也创造出超越于动物感觉器官之上的“有音乐感的耳朵”“能感受形式美的眼睛”，从而为人类创造出从事艺术的主体条件，“五官感觉的形成是迄今为止全部世界历史的产物”。\n\n其次，劳动为原始艺术的发生准备了生产工具。在劳动过程中，随着人对自然界接触范围的扩展、制造工具技术的进步，劳动也为艺术的发生准备好了生产工具。也正是在劳动以及由此发展起来的各类技术的基础上，人们从事艺术具备了客体方面的物质条件。到后来，比如古典时代的文字、纸笔和书籍，近现代以来的机器印刷以及包括报刊、广播、电影、电视在内的大众传媒，在当代社会还有基于互联网技术的网络科技等，都是从事人文艺术的生产工具，这些都是基于人类劳动和相应物质条件而生成的。\n\n再次，劳动为原始艺术的发生提供了主体需要。正是劳动实践推动人的自我意识的觉醒，人因此逐渐有了自我意识，有了主体的艺术需要，即有了运用艺术方式去表达现实生活的欲望。\n\n最后，劳动为原始艺术创造了形式与内容的早期范型。早期的艺术常常是歌、乐、舞结合的形式，这种结合可以被看作是劳动的一种移植形式。原始艺术在其形式与内容上，与劳动实践有着多重密切关联。贯穿歌、乐、舞的一个重要因素“节奏”，就直接与劳动活动相关。原始初民在劳动中发现节奏，喜爱节奏，并且按照它的拍子唱起歌来，而在富于节奏的劳动中，他们发现比较省力，可以减轻劳动的重负，这又进一步促进他们喜欢节奏并更自觉地运用节奏。为了保持和重复这种省力且愉悦的节奏感，他们在劳动之余就会模仿那些富于节奏感的劳动动作，这种劳动之外对劳动动作的模仿也就成为游戏。舞蹈艺术的发生显然与这种对劳动动作模仿的游戏密切相关。正是劳动从形式和内容上都为原始艺术提供了早期范型，从而促进了原始艺术的发生。", "keywords": "根本动因 生产主体 生产工具 主体需要 早期范型", "note": "劳动与原始艺术发生的关系，本质上其实就是原始艺术发生的原因。劳动是原始艺术发生的根本动因，为原始艺术的发生提供了内在和外在的必要准备，这些内容大家要仔细掌握。", "framework": ""}, {"id": "98", "stars": 2, "title": "简析劳动、语言、原始思维与文艺发生之间的关系", "body": "劳动推动了原始艺术的发生，但劳动本身毕竟与专门的文学形态尚有一定的距离。正是在劳动中产生和发展了语言和审美意识，才为文学的发生提供了更为直接的推动力量。\n\n一、劳动对语言的作用\n\n劳动对于语言的作用，主要表现在如下方面。\n\n（一）劳动训练了人的发音器官和大脑思维。劳动不仅创造了人的双手和五官感觉，更训练了与语言诞生直接相关的人体生理机能。从猿类不发达的喉头，到音调抑扬顿挫的有意识发音，发声器官得到了缓慢的改造，人逐渐能够发出清晰的音节。同时，大脑思维也在劳动中得到训练，“猿脑就逐渐地过渡到人脑”。\n\n（二）劳动的实践需要促进了语言的产生。随着劳动的发展，人与人之间开始有了劳动协作关系，产生了语言交际的愿望和语言行为。正如鲁迅所说：“我们的祖先的原始人，原是连话也不会说的，为了共同劳作，必需发表意见才渐渐的练出复杂的声音来。”\n\n二、语言能力与文学的萌芽\n\n语言诞生以后，伴随着劳动实践的日益进步，人的思维更加成熟，语言得到进一步发展，便开始出现文学的萌芽。\n\n（一）文学萌芽状态的语言同音乐、舞蹈交融在一起。早期文学存在于歌、乐、舞等混合性艺术活动中，这时的语言同音乐、舞蹈等艺术因素混融在一起，不能分离。\n\n（二）文学萌芽状态的语言以口头语言的形式存在。早期文学的语言往往表现为咒语、巫唱、说事、神话、传说等口头形式。人类文字的历史只有几千年，而人类口头有声语言的历史则要久远得多，文学即首先蕴藏在口头的有声语言中。语的产生，对人类文明的发展影响巨大。\n\n三、审美意识与文学的发生\n\n随着语言的发展，特别是文字的出现，文学从萌芽状态进一步生长。但要形成专门的语言艺术作品，还依赖于自觉的审美意识的成熟。而审美意识的成熟，则经历了由非自觉阶段到自觉阶段的演变。\n\n（一）非自觉的审美意识阶段\n\n这是萌芽中的审美意识与原始人的思维交融一体的阶段。这时的审美意识还具有原始思维所具有的那些特征，这可以原始神话中较为集中地看到。原始神话在思维上具有以下两个主要特征。\n\n其一，主客交融性。这是说原始神话思维具有主体与客体相混合的特征。这种主体与客体、人与万物乃至神灵混沌不分的原始意识状况，在历史上持续的时间极为漫长。\n\n其二，强烈的形象性与情感性。这是说原始神话思维通常指向事物的具体性，并赋予事物以人的情感特征。原始语言往往都与事物的具体特征有关，而缺乏抽象概括性。原始人的拟人化思维赋予对象以人性，使其具有人的感情、情思。人在神话里不仅描写自己的感情、心理，同时也描绘那些被夸张、神秘化了的人的感情和心理。\n\n（二）自觉的审美意识阶段\n\n在这个阶段，原始初民逐渐形成审美意识上的自觉以及对文学形式的自觉。\n\n首先表现为文学创作的自觉化。屈原《九歌》中的诸神与原始神话中的诸神好像都是神，其实差异很大。原始神话是初民的集体创造，并将之等同于现实，而《九歌》则已改变了其原始形态，成为一种经过文人自觉加工的文学形态。\n\n再表现为审美情感的社会化。这是指审美意识走向自觉，使原初的自然感情升华，在人的喜怒哀乐中沉积了更为丰富的社会性内容，甚至使之带有社会集团的特性。还表现为美感特征的个性化。早期的诗歌、故事、传说是人民的一种集体创作，而作为文学自觉形式的诗歌则开始走向个人创造，出现具有诗人个性特征的美感效果。\n\n总之，正是通过创作手法、审美情感与美感特征这些方面，审美意识逐步从非自觉走向了自觉，获得一种属于文学审形式的质的规定性，文学的早期形态得以树立。", "keywords": "产生和发展 发音器官和大脑思维 语言的产生 非自觉的审美意识阶段 自觉的审美意识阶段", "note": "劳动推动原始艺术的发生，经历了一个过程。在劳动中诞生了语言，语言的诞生促进了文学的萌芽，之后审美意识诞生并从非自觉走向自觉，最终文学的早期形态得以树立。", "framework": ""}, {"id": "99", "stars": 2, "title": "谈谈你对文学早期形态的认识", "body": "社会分工为文学早期形态的出现创造了客观的社会条件。等到文字发明以后，人类文学发展出现伟大转折，其早期形态也逐渐生成。\n\n一、文学早期形态形成的社会条件\n\n社会分工为文学早期形态的出现创造了客观的社会条件。原始社会后期经历了“两次社会大分工”，一是畜牧业与因之而起的农业同渔猎活动的分离，二是手工业与农业的分离。正是第二次社会大分工之后，出现了简单的商品生产，“随着新的分工，社会又有了新的阶级划分”，原始社会解体，人类至此进入奴隶社会，即告别“蒙昧时代”“野蛮时代”而进入“文明时代”。“文明时代巩固并加强了所有这些已经发生的各次分工”，“创造了一个不再从事生产而只从事产品交换的阶级-商人”，而“文明时代是学会对天然产物进一步加工的时期，是真正的工业和艺术的时期”。正是在“文明时代”产生了不从事生产的商人阶级之后，才能够进一步出现专门从事艺术活动的“少数特权分子”。这种专门从事艺术的“少数特权分子”同“从事单纯体力劳动的群众”的分工，就为文学的早期形态提供了客观的社会条件。正是社会分工，使脑力劳动从体力劳动中分离出来，给不劳动阶级提供了“自由时间”“用于发展不追求任何直接实践目的的人的能力和社会的潜力（艺术、科学等等）”。\n\n二、从口头语言到文字作品\n\n文字的发明，标志着人类文学发展进程的一次伟大转折。《淮南子·本经训》记载：“昔者仓颉作书，而天雨粟，鬼夜哭。”世界其他民族也往往把文字的发明归功于具有特异功能的文化英雄，或者直接归功于神灵。先民以神话传说的方式，曲折地表达了他们对文字发明重要性的认识。\n\n从口头神话传说到文字记载的诗歌，历时久长。文字的出现，使早期口头文学逐渐获得越来越系统的整理和加工。文字功能的多向发展，使拟人化功能和表情达意、虚构、幻想的功能，逐渐与记事、叙事的功能分化，进而也使艺术审美化的语言呈现出与科学理论化的语言愈相分离的趋势。随着社会生活和文化实践的发展，文学与其他门类的艺术也开始逐渐分离。六朝时期“四声”的发现和自觉运用，可视为汉语诗歌节奏韵律“语言化”的最终完成，虽然从那时起，汉语古典诗歌与音乐之间还是不断地相互影响，但诗歌作为语言艺术，再也不完全依附于音乐了。\n\n三、文学早期形态的特点\n\n早期文学仍然具有文学与非文学相杂糅的文体特征和多重功能。\n\n（一）早期文学呈现多种功能相融合的特点，如认识、教化、交往和审美等交织在一起。《周礼·春官·大司乐》说：“以六律、六同、五声、八音、六舞，大合乐，以致鬼、神、示，以和邦国，以谐万民，以安宾客，以悦远人，以作动物。乃分乐而序之，以祭、以享、以祀。”在这里，审美功能与社会功能、宗教功能乃至外交功能、礼仪功能是难以分开的。\n\n（二）就文体而言，早期文学与其他作品也不是截然分开的。例如，作为哲理性著作，《老子》多用韵语，《庄子》多用寓言，它们的文学性都很突出。", "keywords": "客观的社会条件 社会分工 文字的发明 伟大转折 文学与非文学相杂糅 多重功能", "note": "文学早期形态的出现与社会分工，商人阶级出现有很大的关系，而文字的发明是文学早期形态的一次伟大转折，文字功能的发展，使文学产生了新的变化。从总体上看，文学早期形态仍然显现出与非文学杂糅的文体特征和多重功能，这些内容大家要注意。", "framework": ""}, {"id": "100", "stars": 3, "title": "试论影响文学发展的因素", "body": "文学发展和繁荣最深刻的根源与最强大的动力，在于人民群众的历史创造活动。千百年来，中国各族人民在改造自然、改造社会的过程中，在共同抵御外侮的斗争中，相互帮助，增进友情，融汇为统一的、团结的中华民族，创造了灿烂的中华文明。每一块砖瓦、每一捧泥土，都记载着祖先们的勤劳、智慧和创造。所有这些都是中国文学发展的丰富资源，也是推动中国文学不断前进的强大动力。从《诗经》，到五言、七言律诗，再到以后的宋词和元曲，从《左传》和《史记》开始的史传文学，到唐传奇、宋元话本，再到明清小说，中国文学史上无数优美的文学佳作都凝结着社会历史的变迁和人民群众的智慧创造，形成了源远流长、奔流不息的文学发展长河。\n\n文学作为上层建筑中的意识形态，其发展无论多么丰富，都“必须从物质生活的矛盾中，从社会生产力和生产关系之间的现存冲突中去解释”。也就是说，社会发展或迟或早都会影响和制约文学的发展。文学的这种随社会生活变化而变化的特性，可以从文学内容与形式两方面的演变来看。\n\n一、不同的社会历史阶段或形态中产生的文学，往往有着不同的内容。人类文明经历了几个大的阶段，文学也相应发生了明显变化。如在原始社会，社会还是以共同的群体关系来构成，既无清晰的社会分工，也没有明确的阶级划分。这个阶段的文学艺术的内容必然反映这种共同的群体生活，表现原始人对世界的共同理解和感受。今天还可以通过《弹歌》和《山海经》等了解先民共同狩猎和劳动的场面和故事，这是与原始社会形态相适应的文学艺术世界。《诗经》中的《硕鼠》《伐檀》等所表现的内容，反映了奴隶社会中阶级对立的生活情境，显示了社会变化对文学作品内容的影响。此后的社会形态变化都在文学中有所反映。\n\n二、物质生产及社会历史的发展推动文学形式的演变。物质生产和社会生活对文学形式的影响，主要表现在两个方面：\n\n一是社会生活的发展变化促进文学题材的变化，文学题材的变化要求有新的文学形式（包括文学样式、文学体裁、文体等）同它相适应。原始先民对自然的神奇力量无法真正了解，只有依靠丰富的想象力去创造能够主宰一切的神，于是产生了神话。这说明，神话这种文学样式只能发生在原始人类理性认识能力相对低级的时代。随着人类支配自然的能力不断提高，人类对自然有了一些认识，便开始对人本身和人所创造的神有了新的认识，于是神话创作力越来越弱。\n\n二是物质生产和社会生活的发展为文学形式的演变提供了条件。原始巫术仪式虽然包含一定的戏剧因素，但那时的社会条件还不足以产生戏剧。真正的戏剧繁荣有赖于城市文明的兴起。我国戏曲萌芽甚早，但真正意义上的戏曲诞生在宋代，正是由于那时有了较之以往更为发达的城市文明。市民阶层渴望找到满足他们的社会交往和情感需求的艺术体裁，而城市里出现的文化娱乐活动场所又确实能够提供这种条件，于是产生了杂剧和南戏这些中国戏曲的表现形式。\n\n三、还应当看到，一定的文学媒介的兴盛总是取决于科学技术发展水平。据研究，在中国早期，竹、帛、金、石以及器物曾是文学最为基本的媒介，文字正是基于这些媒介而被记录的，上述材料成本相对昂贵，一定程度上限制了人们思想的表述。公元三四世纪时，纸逐渐取代了竹简和缣帛，书籍可以被大量地抄写和传播。在印刷术发明之后，雕版印刷业促进了明清时期长篇小说的繁荣。当今电子信息技术的兴起，促进了网络文学的产生和发展。", "keywords": "根源与最强大的动力 人民群众 社会发展 社会历史阶段 文学形式的演变 文学媒介", "note": "影响文学发展的最根本因素是人民群众的历史创造活动，它的发展，受到了社会历史发展变化的影响，这体现在它的内容、形式、题材和传播媒介的发展变迁，这部分内容，我们要仔细掌握。", "framework": ""}, {"id": "101", "stars": 2, "title": "谈谈你对文学发展平衡性和不平衡性的认识（26沈阳师范大学）", "body": "诚然，文学发展的根本动力在于人民群众的历史创造活动，在于以物质生产及以之为基础的社会发展，但要看到其中的丰富性和复杂性。这突出地表现在，文学发展与社会发展之间具有总体上的平衡性和局部的不平衡性。\n\n一、文学发展与社会发展之间具有平衡性\n\n这是指文学发展与社会发展在总体上具有一致性。从总体的社会形态来看，人类社会经历了原始社会、奴隶社会、封建社会、资本主义社会和社会主义社会等不同形态，这些不同的社会形态在相应的文学形态上打下了深刻的印迹。\n\n中外文学史的诸多事实表明，社会的变革推动文学的变革，如西方的文艺复兴、启蒙运动，中国的五四运动，其标志都首先是社会的现代转型，这种社会转型又促进了文学的现代转型，产生了文学的现代形态。文学的历史风貌与社会政治运动有着密切的关联，而某一历史时期文学的发展状况与该时期的经济发展程度也密切相关。这一点，意识形态的其他领域也大体如此。总体上来说，文学发展的历史脉络与社会发展的历史轨迹息息相关，中外文学史分期与社会历史分期基本上一致，也充分表明了这一点。\n\n二、文学发展与社会发展之间又具有不平衡性\n\n这是指文学发展与物质生产发展之间在局部也会出现不一致。具体地看，文学发展与社会发展之间的这种“不平衡”有两种典型表现：第一种情况是，某些文艺体裁只能在生产发展相对低级的阶段兴盛，而随着生产力的发展，它的繁荣阶段也就成为了过去。第二种情况是，艺术生产与物质生产的发展水平并不总是同步的，经济落后的国家或地区可能在文学艺术上反而领先。文学发展与物质生产发展之间出现局部“不平衡”的原因是多方面的，其中最主要的有两方面。\n\n（一）文学发展在受到物质生产的根本性制约的同时也会反过来对其产生一定的作用，并体现出一定的独立性。在承认经济基础的决定作用时，不应否认文学艺术对社会历史的积极作用。实际上，文学艺术等上层建筑因素对一个社会的经济、政治的发展也有着重要的促进作用，而且它们自身的发展也具有一定的独立性。从这方面看，文艺往往是“时代前进的号角最能代表一个时代的风貌，最能引领一个时代的风气”。\n\n（二）物质生产和社会生活对于文学发展的推动，要经过一些复杂的中介环节。在诸多中介环节中，有四方面尤其重要政治状况、社会心理、文化变革和各民族文学的相互交流。\n\n首先，政治状况以及政风变化往往直接地影响作家的创作和读者的接受，并且还会反映到文学作品中。中国古代典籍《乐记·乐本》说：“治世之音安，以乐其政和；乱世之音怨，以怒其政乖；亡国之音哀，以思其民困。声音之道，与政通矣。”\n\n其次，特定时代的社会心理，以及与之相应的社会风尚、群体心态、社会思潮等，是在特定的物质生产和社会生活中生成的，它们会给予作家创作和读者接受以直接的影响。魏晋士人心态和生活方式对于建安七子、正始名士、竹林七贤、陶渊明等的文学创作的影响显然是直接的。\n\n再次，特定时代的文化变革浪潮会激烈地冲击既有文学规范，推动文学变革。从晚清到民初直至“五四”前后，中国发\n\n生了剧烈的文化变革。数十年间的文化变革浪潮不啻对传统文化的大革命。\n\n最后，一个民族的文学不会是封闭发展的，而总是在与其他民族的文学和文化的交流与相互影响中发展的。佛教对魏晋以来文学的影响，外国文学对中国近现代文学的影响，以及中国古典文学对周边国家如日本的文学的影响，都说明了这一点。文学的发展既受到文学史自身内部因素的纵向推动，也受到外来民族文学与文化的横向影响。\n\n应当看到，影响文学发展的因素远不止这些。宗教、哲学、道德等其他意识形态总是给予文学发展以深刻的影响，其他艺术门类如音乐、戏剧、绘画、舞蹈、建筑、书法等也不断为文学提供丰厚的养料。\n\n总之，文学发展与社会发展之间存在着总体上的“平衡”与局部的“不平”两种关系，是符合历史实际的，是一种带有规律性的文学现象。物质生产或经济生活归根到底在文学发展中起着最终的支配作用，是决定文学发展的最根本因素。", "keywords": "总体上的平衡性 局部的不平衡性 一致性 不一致 独立性 政治状况 社会心理 文化变革 各民族文学的相互交流", "note": "文学发展与社会发展的平衡性与不平衡性，本质上就是社会发展对文学发展的决定性和文学发展对社会发展的能动作用之间的关系，其中，影响文学发展不平衡性的一系列因素，需要我们重点关注。", "framework": ""}, {"id": "102", "stars": 4, "title": "谈谈文学发展中继承与创新的关系（26云南师范大学）", "body": "文学的历史发展，还存在着继承与创新的关系问题。古今中外，闻名于世的文学大师，脍炙人口的传世之作，无一不是善于继承、勇于创新的结果。百花齐放，推陈出新，推动中华优秀传统文化的创造性转化、创新性发展，是当代文学的发展和繁荣的关键。\n\n一、以继承为基础\n\n文学的发展有自己的历史继承性。中外文学史的事实表明，各民族的文学都不是凭空创造出来的，都有一个继承借鉴与革新创造的历史过程。与哲学的发展相近，文学的发展同样要以从它的先驱者那里承继下来的条件作为创造的前提和进一步发展的出发点。\n\n文学发展的历史继承性表现在优秀文学传统直接影响作家的审美理想和审美方式方面，也表现在文学作品的内容和形式的发展上。在思想内容方面，古往今来历史上反映人民生活、表达人民愿望和思想感情的作品，从题材、主题的开掘，到人勿形象的塑造，都有一定的继承性。在艺术形式方面，每个时代的作家也总是自觉不自觉地继承过去时代所形成的文学传统和创作经验，特别是进步的创造方法和高超的艺术技巧。\n\n文学传统本身是一个动态、开放和不断的发展系统，它肇始于过去，积淀于现在，影响着将来。在中外文化和文艺史上，每当社会大变革之时，总要出现某种反传统的思潮，来打破传统文化中的僵化思维和艺术方式，进而以新的文化观念和思想体系来取代旧的文化观念和思想体系。可以说，传统与反传统是社会在变革时代文学活动的历史发展中出现一种带有必然性和规律性的现象。\n\n除了上面列举的来自历史的纵向演变外，在文学的发展和创新的方面，还有一个横向借鉴问题。在这方面，中外文学及其文论史有不少的经验和教训。继承是创新的基础，文学发展必须在继承基础上进行创造。\n\n以继承为基础，就是要加强对中华优秀传统文化和作品的挖掘、阐发与继承，推动中华文明和文学传统创造性转化、创性发展。只有激活传统的生命力，使中华民族最基本的文化基因同当代中国文化相适应、同现代社会相协调，才能跨越时空，超越国界，展现永恒魅力，才能使具有当代价值的文化精神弘扬起来，激活诸多文化传统内在的强大生命力，让中华文七同各国人民创造的多彩文化一道，为人类提供正确精神指引。\n\n二、以创新为导向\n\n推进文学发展，基础在继承，关键在创新。继承和创新，是一个民族文化生生不息的两个重要力量。不善于继承，就没有创新的基础；而不善于创新则缺乏继承的活力。在继承基础上的创新，往往是最好的继承。离开创新与继承中的任何一方，文学都不可能取得今天这样辉煌的成就。\n\n中华文化重视继承和创新的统一，高举复古旗帜的初唐诗人陈子昂，就大力倡导“汉魏风骨”。这其实是对离初唐最近在当时流行的南朝萎靡诗风的尖锐批评和大胆革新。所以这种“复古”实际上恰恰是一种“革新”，而这种继承与创新的统一，显然是促使盛唐诗登上中国古典诗歌高峰的重要原因。\n\n创新是文艺的生命。当代中国正经历着我国历史上最为广泛而深刻的社会变革及实践创新。就当代文学而言，既需要薪火相传、代代守护，延续着国家和民族的精神血脉，更需要在此基础上以创新为导向，把创新精神贯穿文艺创作全过程，增文艺原创能力。文艺工作者应大胆探索，锐意进取，在提高原创力上下功夫，在拓展题材、内容、形式、手法上下功夫，推动观念和手段相结合、内容和形式相融合、各种艺术要素和技术要素相辉映，让作品更加精彩纷呈、引人入胜。应把提高作品的精神高度、文化内涵、艺术价值作为追求目标，让目光再广大一些、再深远一些，向着人类最先进的方面注目，向着人类精神世界的最深处探寻，同时直面当下中国人民的生存现实，创造出丰富多样的中国故事、中国形象、中国旋律，为世界贡献特殊的诗情和意境、展现特殊的声响和色彩。\n\n三、百花齐放与推陈出新\n\n在中国漫长的历史过程中，出现了许许多多的文艺珍品，涌现出许多堪称世界第一流的诗人、剧作家、小说家、文艺理论家和美学家。他们的文学活动都既善于继承，又勇于创新，其文学成就都来自于继承与创新的统一。\n\n毛泽东针对民族戏曲改革发展问题，先后于1942年和1951年题词“推陈出新”和“百花齐放，推陈出新”，并于195年在中共中央政治局扩大会议上正式提出在科学文化工作中实行“百花齐放，百家争鸣”的方针。关于“百花齐放”，他“出：“艺术上不同的形式和风格可以自由发展，科学上不同的学派可以自由争论。”至于“推陈出新”，强调的则是“推陈”和“出新”两个方面。前者即立足于当代，扬弃那些不适合今天需要的东西；后者即对传统文化进行清理和提炼，并积极创造新的内容和形式，赋予其新的生命力。只有在既继承又发展、既扬弃又创新的辩证统一运动中，中国文学的发展才会有巨大生命力。\n\n我国社会主义文艺发展的正反两方面的经验和教训，都有力地证明，百花齐放、百家争鸣，辩证取舍、推陈出新，古为今用、洋为中用，是完全符合社会主义文学艺术发展规律的，也是发展社会主义文学事业的正确道路。在当代，应结合中特色社会主义新时代的新特点，传承和弘扬中华优秀传统文化，重点做好创造性转化和创新性发展，使之与现实文化相融通。创造性转化，是要按照时代特点和要求，对那些至今仍有借鉴价值的内涵和陈旧的表现形式加以改造，赋予其新的时代内涵和现代表达形式，激活其生命力。创新性发展，是要按照时代的新进步新进展，对中华优秀传统文化的内涵加以补充拓展、完善，增强其影响力和感召力。按照这样的方针推进文艺事业，有助于传统文化及文艺遗产与当代现实文化及文艺新需要实现融通。\n\n还应当看到，推动中华优秀传统文化及文艺的创造性转化、创新性发展不是对传统文化及文艺的简单重复和模仿，而是结合当前、面向未来的创新、创造和再生。这样说来，既继承民族文化及文艺，又根据新时代的审美需要，进行文化及文艺革新，勇于创造，这是当代中国文化及文艺发展的使命和任务。", "keywords": "历史继承性 审美理想 审美方式 横向借鉴 继承和创新的统一 百花齐放，推陈出新 社会主义文学艺术发展规律正确道路", "note": "这部分内容比较庞杂，其中，文学的继承，文学的创新，以及百花齐放，推陈出新这三部分内容都有可能独立命题，大家要注意灵活应对。总而言之，我们要在继承的基础上创新，而创新是为了更好地继承。", "framework": ""}, {"id": "103", "stars": 4, "title": "试论当代文学生产与文学消费的新变化", "body": "从生产和消费的视角看，文学不仅是一种源于个人的灵感、想象和才华的个体活动，而且是一种制度化的和社会化的活动。当代文学生产不同于传统的文学创作，文学消费也不再等同于过去的艺术欣赏，具有新的时代特点，文学生产与文学消费的关系也出现了一些重要变化。\n\n一、当代文学生产的新特点\n\n（一）当代文学生产规模和受众群体日趋扩大。从历史上看，由于古代社会生产力水平较低，专门从事文学生产、以文学为业的人还比较少，文学生产的规模和数量也极为有限。在文字只能书写在简、帛之上的时代自不必说，即使是在发明了纸张之后，书籍的出版规模和印制数量也难以同现代相比。中国古代社会讲到某部作品畅销时常用“洛阳纸贵”来形容，这是因为当时还没有发明印刷术，文学传播还要依靠抄写这种方式，耗费较大，这也说明了当时大规模的文学生产是不可能的.在当代，物质生产空前发达，社会资本巨量积聚，为文学产品的大规模生产奠定了厚实的物质基础。当代科技的发展，譬如激光照排技术和远程网络信息传输技术的发展，也为书籍和期刊的大规模印制和传输提供了前所未有的技术保证。特别是网络技术的发达，拓宽了文学的物质载体，使文学生产变得更自由、更广泛，网络小说的字数动辄上百万，其更新速度和篇远远超过了以往的纸质小说。\n\n（二）当代文学需要依托文化产业和文化市场运作。当代的文学生产在整体上属于文化产业的组成部分，需要顾及受众和文化市场的反应和趣味，受众和市场对作家的创作发挥着比以往更大的影响和引导作用。\n\n文化市场是指文化商品、文化服务以及文化资源营销活动的场所。当代的文化产业是在市场经济的大背景下发展起来的，文化产业的发展催生了文化市场，而文化市场的建立又为文化产业的发展提供了更为便利的条件和开拓出更广的需求空间。例如，中国当下的网络作家的收入由网络连载、实体书出版、游戏、漫画、影视改编等多种形式的稿费与版税构成，比传统作家的收入来源要更广泛，也更丰厚。在市场的竞争中，文学作品也有更好的条件提高质量和水平，获得更强的生命力。\n\n（三）文学生产的组织化和制度化倾向日益明显。文学作为一种社会实践和生产活动，受到了各种力量的共同影响，是历史合力的结果。职业作家群、稿酬制度、文学社团、作家组织、学校、受众群体、批评家、媒介（出版机构、报刊、书店、网站等）、文艺政策、文学奖和文学会议等，这些看似在文学文本之外的诸多因素，日益明显地影响着当代文学的发展，决定着文学的生产和消费的过程和特点。\n\n在组织化和制度化的保障或制约下，文学创作的主体既是作家，也是文学生产者；文学作品的受众既是读者，也是消费者。也由于如此，文学生产和消费的整个过程，包括作家、作品、作品产生的物质条件和生产关系、传播过程、消费模式等，都应该被纳入文学活动及其研究的范围。将组织化过程和制度研究纳入文学活动的研究之中，人们能够发现更丰富的文学史细节。\n\n当代文学生产的这些新特点，既有利于满足人民群众多方面的精神文化需求，又由于市场的逐利本性而可能给文学发展带来负面影响。所以，文学生产既需适应自身产业发展的需要，更应注重文学作品的社会效果，积极反映改革开放和当代社会现实生活，讴歌人民群众创造历史的奋发精神，引导人们追求真、善、美，激励人们投身于中国特色社会主义建设的伟大事业。\n\n二、当代文学消费的新特点\n\n（一）文学消费的扩张性和快餐化日趋明显。随着社会生产力的发展，不断增长的物质财富和服务需求构成了当代消费景观，消费成为了社会生活和生产的主导动力和重要目标。消费者不断贪求新鲜的、即时的诱惑，“大批量的生产指向消费、闲暇和服务，同时符号商品、影像、信息等的生产也得到急速的增长”。在当代，人们的生活节奏加快，获得信息的途径增多，文化消费方式更加多样，加上大众传媒推波助澜，使那些阅读容易、接受便捷、符合时尚追求的文学作品越来越受到人们的喜爱。这种快餐化趋向消解了传统文学作品所具有的高雅韵味，加剧了人们文学鉴赏趣味的单一化。\n\n（二）文学消费出现“夸示式消费”现象。“夸示式消费”主要是指消费者为炫耀身份和地位而进行的文学消费。匈牙利学者豪泽尔说，上层阶级中有相当一部分人对文化产品进行“夸示式消费”，其目的是为了炫耀自己的社会地位。尽管他们本来没有对艺术的内在审美需要，也从未打算去阅读那些文艺作品，甚至对所收藏的艺术经典名著一无所知或知之甚少，但为了装点门面附庸风雅，显示自己既富且贵，还是时常购买和引人注目地摆设一些豪华精美的文学经典名著，以营造一种所谓有教养的文化环境。\n\n面对当代文学消费的这些新特点，文学生产者应加强研究，既设法满足人民群众多样化的精神文化需求，又注意积极引导文学消费趋向，提倡健康的文学消费。\n\n三、当代文学生产与文学消费的关系变迁\n\n各个时代的文学生产和文学消费的状况，都是与当时社会的生产方式相适应的，受当时社会生产力和生产关系制约。精神生产如此，精神文化产品的消费也是如此。当代文学生产和文学消费的关系也出现了一些新的变化。\n\n（一）文学生产与文学消费的关系日益密切。古代社会的文学生产与消费同物质生产与消费之间是明显分离的。通常情况下只有少数人有资格并且有经济能力和文化教育条件去消费文学。近代以来，随着生产力水平的提高，社会分工进一步细化，文化的普及和识字人口的数量空前增加，文学生产规模大为扩张，以文学创作和文学传播为职业的人群数量增多，文学消费不再限于少数读书人和上层统治者范围，而是开始面向社会各阶层的广大受众。文学生产与消费同现代社会生产方式相适应，文学作品也像物质生产的产品一样成为可以自由买卖的商品，能够同别的产品进行交换，同时具有了使用价值和交换价值，需要付费购买。至此，古代社会中文学生产与消费同物质生产与消费之间相分离的状况，被市场经济的力量消解了。相应地，文学生产已被体制化地纳入商品生产和文化产业的链条之中，成为工业生产的一个部门，文学生产的重要目的就是为了满足消费，能够盈利。进入互联网时代，既是消费者又是生产者的“产消者”或“生产型用户”日益增多，从而构成了新的文学生产和文学消费形态，也使得作者和读者的关系更为密切。\n\n（二）在消费文化的影响下，当代文学生产的主导动力和重要目标正在发生变化。文学消费对文学生产的反作用越来越大。随着文学生产规模扩大，文学资源匮乏、文学产品短缺的现象日益减少，文学生产对于文学消费的绝对主导趋势渐渐被逆转，文学生产正越来越多地受到文学消费时尚的引导。如果文学生产不能很好地适应文学消费的变化，就可能出现产能过剩、供过于求、经济亏损的情况。同时，当代文学的生产也越来越受到消费社会的审美趣味的影响。一些作家为了满足消费者的需要，为了追逐利润和收入，其作品日趋时尚化，追逐当下趣味，丧失了创新性和先锋性，也失去对现实的敏感性和深\n\n刻的再现，从而陷入畅销、流行一大批量生产一因新的阅读趣味产生而被迅速遗忘的恶性循环。这种单纯为了满足时尚消费而从事的文学生产，由于忽视了更高的精神追求，无法确保文学生产和消费之间处在良性循环的轨道上，因而从根本上无法化解人民日益增长的文学审美需求与粗制滥造或低水平重复的文学产品供给之间的矛盾。", "keywords": "生产规模和受众群体日趋扩大 依托文化产业和文化市场运作 组织化和制度化 扩张性和快餐化 夸示式消关系日益密切 主导动力和重要目标", "note": "在马克思、恩格斯看来，文学艺术不仅具有商品属性，更具有意识形态属性，具有一般商品消费与精神享受以意识形态再生产的二重性质。而在当代，随着文学创作的形态发生变化，文学生产与文学消费的关系也发生了很大的变化.这部分内容中的三大点每个都可能单独命题，大家要仔细掌握，灵活应对。", "framework": ""}, {"id": "104", "stars": 3, "title": "谈谈文学生产和文学消费的两重性", "body": "文学生产的两重性，是指当代文学生产同时具有精神属性和商业属性的状况。当代文学生产作为精神生产活动，创造满足公众审美文化需求的精神产品，具有物质生产所不可替代的社会价值；同时，市场经济条件下的文学生产活动也具有产业属性或商品属性，能够为文学产品的创作者、出版发行者带来商业利润。这使得当代文学生产与文学消费难免具有两重性.这种两重性使当代文学生产既作为社会精神生产的文化事业而存在，同时也作为社会商品生产的文化产业而存在。\n\n一般来说，文化事业是代表国家意志和社会主流意识形态，由政府投入并由政府控制或由政府机关的文化政策予以扶持的那些文化产品的生产与服务活动。文化产业是与文化事业既有联系又有区别的文化活动，是按照市场运行规则从事文化产品生产和提供文化服务的经营性行业。作为文化事业，文学生产承担着为社会提供精神文化产品的职责，追求的是精神价值和社会效益；而作为文化产业，文学生产活动则主要是一种经营活动，在追求精神价值和社会效益的同时，需要适当考虑商业价值、经济效益及扩大再生产。改革开放以来，随着我国经济和政治体制改革的发展，特别是文化体制改革的推行，大力发展文化产业、充分利用市场机制繁荣文学生产已经成为一种客观趋势。在当代中国，文化生产发挥着创造和传播社会主义先进文化、弘扬社会主义核心价值体系的重要作用，同时作为商业性经营活动，在经济社会发展中扮演着越来越重要的角色.但无论如何，文化产业也应当像文化事业一样，始终把追求社会效益与经济效益的统一放在首位，而绝不可片面追逐经济效益。\n\n与当代文学生产的两重性相应，当代文学消费也具有精神消费与物质消费的两重性。一方面，文学产品作为精神产品，能够使消费者受到精神感染和教育。另一方面，文学产品具有一般物质产品的特点，需要通过购买或其他方式拥有才能实现消费。这里的其他方式包括政府免费发放和社会赠予等。就购买行为来说，文学产品与其他的“物品”没什么分别，也具有“物”的性质。不过，文学消费毕竟还是不同于一般的物质消费。一般物质消费在于物品使用本身，文学消费在于精神享受，使消费者获得认识、教育、审美、娱乐等精神价值。更重要的是，任何文学商品都不允许与社会主义核心价值观相抵触。文学消费中文学作品的使用价值反映的不仅仅是人与物的关系，更重要的是物质载体内凝聚着的精神文化价值，既包括文学创作者心灵世界的反映，也包括消费者从阅读和鉴赏中获得的审美体验。", "keywords": "精神属性 商业属性 文化事业 文化产业 精神产品 物质产品", "note": "文学生产的两重性，指的是当代文学生产同时具备精神属性和商业属性，文学生产具备两重性，导致文学消费也具有两重性。而文学生产的两重性在当下中国的具体表现，就是文化事业和文化产业。这些内容，大家要仔细理解。", "framework": ""}, {"id": "105", "stars": 3, "title": "谈谈如何处理当代文学生产的社会效益与经济效益的关系", "body": "当代文学生产与文学消费具有两重性，这决定了文学生产要注重社会效益与经济效益的统一。\n\n文学生产不仅要讲究一定的利润回报，更要十分重视文学产品的社会价值，这就存在着社会效益与经济效益如何统一的问题。\n\n文学生产要把社会效益放在首位。改革开放以来，随着社会生产力的解放和发展，文学生产与消费的新格局形成了。文学生产一方面要努力满足人民群众多方面的文学需求，提供多样化的精神消费选择，另一方面又要兼顾产业的自身发展，这提出了经济效益与社会效益如何协调的问题。文学生产作为精神文化价值的社会生产活动，其产品深刻地影响人的精神世界，因此所追求的效益首先应该是社会效益，而不是经济效益。一部优秀的作品，应该是把社会效益放在首位，同时也应该是社会效益和经济效益相统一的作品，应该是经得起人民评价、专家批评、市场检验的作品。生产更多更好的优秀文学作品，满足人民大众的审美文化需求，提高人民大众的文学和文化素养，振奋人民的精神，是我国文学为人民服务、为社会主义服务的宗旨在文学生产领域的体现。\n\n不过，就实际情形而言，文学的社会效益与经济效益有时是统一的，有时也可能是相互矛盾的。“当两个效益、两种价值发生矛盾时，经济效益要服从社会效益，市场价值要服从社会价值”。正由于如此，文艺应当以社会效益引领经济效益。“文艺不能当市场的奴隶，不要沾满了铜臭气。优秀的文艺作品最好是既能在思想上、艺术上取得成功，又能在市场上受欢迎。要坚守文艺的审美理想，保持文艺的独立价值，合理设置反映市场接受程度的发行量，收视率、点击率.票房收入等量化指标，既不能忽视和否定这些指标，又不能把这些指标绝对化，被市场牵着鼻子走”。如果片面地追求经济效益，急功近利，为了经济效益而不惜粗制滥造，甚至诲淫诲盗，就不仅会误导创作，使低俗作品大行其道，造成劣币驱逐良币现象，对文艺造成伤害，也会对社会精神生活造成伤害，对读者造成精神上的污染和毒害，产生消极的社会影响。因此，文学生产的参与者以及政府文化管理部门，应正确认识文学生产的精神文化属性与产业属性的关系，正确对待和处理文学生产的社会效益与经济效益的关系，既要充分重视文学艺术的精神生产特殊性，始终将社会效益放在首位，同时又要做到社会效益与经济效益相统一，积极扶持和引导文学产业的发展，使文学生产与市场的关系步入良性互动的轨道。", "keywords": "社会效益 经济效益 社会价值 精神生产特殊性 社会效益与经济效益相统一", "note": "①在文学生产中，我们要把社会效益放在首位，但这并不代表着罔顾文学生产的经济效益，要做到社会效益与经济效益的统一。由此，我们引申出，如何对待当下的文学生产，以及文化管理部门应该如何去做。②如提问：当代文学生产的社会效益与经济效益的关系，则把本题和前一题进行融合。", "framework": ""}, {"id": "106", "stars": 3, "title": "谈谈传播媒介对文学发展的作用（26山东师范大学）", "body": "媒介对文学活动的重要性主要体现在如下几个方面：\n\n一、文学媒介是文学传播的物质载体，构成了文学的感性存在方式\n\n与建筑、雕塑、绘画、电影和电视及音乐等艺术相比，文学同物质媒介的关联并不明显。这是因为，人们一般只把语言视为文学的媒介，而语言的符号性不像建筑中的大理石、绘画中的颜料等那样更具有物理属性。但事实上，文学作为语言艺术，记录语言的文字总是依托于一定的物质媒介并借此得以流传，不论这种媒介是声音、甲骨、钟鼎、简牍、缣帛，还是印刷的书籍或电脑网络。\n\n二、文学媒介对于文学的创作与欣赏、生产与消费有着重要的塑造与规范作用\n\n媒介不单纯是传达信息、知识、内容的载体和工具，它对信息、知识、内容有着强烈的反作用，影响着信息的内容构成和结构方式。同样，文学媒介也不仅仅是传达文学信息的工具，它对文学的题材内容、风格特征、接受特点以及生产规模等均有着重要的影响。一种新媒介可能会催生一种新文学或新文明，如《荷马史诗》和《诗经》、基督教文学和中国诗赋的出现和兴起，就分别与口语媒介、文字媒介（羊皮纸、纸帛等）的出现和兴起有着密不可分的关系。\n\n三、文学媒介是文学生产与传播能力的延伸\n\n这种延伸作用主要体现在两个方面：一是文学媒介特别是文字、印刷媒介和电子媒介的产生与发展，使得文学对于人类生活世界的反映愈加丰富广阔，对人类内心世界的表现更加及时与直接；二是文学媒介的发展特别是现代电子传媒的发展，使人类的文学传播突破了早期的时空界限，比以往的传播规模更大，传播速度更快，传播范围更广。", "keywords": "物质载体 感性存在方式 语言 塑造与规范 反作用 生产与传播能力的延伸", "note": "文学生产规定着文学消费的方式，不同的传播媒介会带来不同的文学消费方式。文学消费活动使文学生产、文学传播、文学产品的价值与目的得以最终达成。而从文学生产到文学消费，其中最重要的桥梁便是传播媒介。", "framework": ""}, {"id": "107", "stars": 3, "title": "试论传播媒介的演进与文学发展", "body": "人类历史上的文学传播媒介大致经历了四个发展阶段，叫口语媒介阶段、文字书写媒介阶段、印刷媒介阶段、电子媒介阶段。在每一个媒介发展阶段，特定的物质媒介都制约着文学的生产、传播与消费方式，影响文学的发展进程。\n\n一、口语媒介阶段\n\n口语媒介是文学传播媒介的第一个发展阶段。口头语言的兴起被称为人类传播体系的第一次媒介形态变革，它为文学的产生提供了直接的媒介，至此文学作为一种新的艺术形式逐渐产生和发展起来。运用口语媒介的最早文学种类是神话、传说和原始民歌，较晚一点还有各民族通过口头传唱方式流传下来的民族史诗。口语媒介的文学传播具有情境性强、富于感染力和互动性良好的特点。但以口语为媒介的文学其传播空间和范围有限，同时口语转瞬即逝，其传播依赖于人的记忆力，也造成了以口语为媒介的文学难以保存、在传播过程中易于发生讹误乃至失传的问题。\n\n二、文字书写媒介阶段\n\n人类传播史上的第二次媒介形态变革是文字的出现。文字克服了口头语言的转瞬即逝性，能够使文学作品更长久地保存下来，传至后世。文字媒介不需要信息的作者和受者同时在场，打破了口头文学传播的距离限制，能够使文学作品传播到更遥远的地方。文字对于语言的固化作用，使此后的文学具有了拥有著作权的“作者”。更重要的是，文字的产生加大了人类的知识和经验的储存和积累数量，从而使文学创作不再简单地依赖于当下的生存经验和有限的记忆，而是比口语时代具有了更为丰富多样的生活容量和人生内蕴。\n\n三、印刷媒介阶段\n\n伴随着造纸术和印刷术的发明，文学的发展进入了印刷媒介阶段。在印刷媒介阶段，书籍、报纸、杂志成为传播知识、交流信息的主要渠道，文学也借助于这些传播渠道更加快速地发展起来。印刷术的发明特别是机械印刷事业的发展，使文学的大规模生产和大批量复制成为可能，文学创作不再是少数精英的事业，文学的接受群体也日渐扩大；同时，印刷媒介阶段的文学生产逐渐走上了商业化的道路，与普通民众的接受能力与欣赏趣味相适应，长于叙事的小说逐渐产生并繁荣发展起来，日渐取代了长于抒情的诗歌，成为占据文坛主流地位的文学形式。\n\n四、电子媒介阶段\n\n电子媒介对于信息的传播呈现出三个全新的特点：其一，电子媒介实现了信息的远距离超时空快速传输，同时其复制、储存与传播信息内容的能力也比印刷媒介阶段更为强大。其二，由原来的单一媒介传播走向多媒体全息传播。这不仅对生活.事物的反映具有高度的逼真性与现场感，而且传者与受者在信息的交流与共享方面具有即时性、共在性的特点。其三，对于受众文化水平的要求相对较低，其传播具有极大的广泛性和普及性。", "keywords": "物质媒介 口语媒介阶段 情境性 互动性 难以保存 文字书写媒介阶段 长久保存 打破距离限制 印刷媒介阶段 大规模 商业化 叙事 电子媒介阶段 共在性 广泛性", "note": "补充一点关于大众传播媒介的知识。大众传播媒介指的是用于大众传播的物质媒介和技术手段。大众传播是由一些专业机构或群体运用现代科技手段与媒体，向为数众多、各不相识而又分布广泛的受众传递信息的传播方式。大众传播使用印刷媒介，如书籍、报纸、杂志等，和电子媒介，如广播、电影、电视以及电脑网络等大量收集、复制和传播信息。大众传播媒介具有大范围播布、传递迅速和单向扩散或互动交流等特点。", "framework": ""}, {"id": "108", "stars": 4, "title": "说说电子媒的传播特点以及对文学的影响", "body": "虽然人类已进入了电子媒介时代，但口语和文字仍是文学赖以生成和生存的两种基本媒介，书籍、报刊网站等共同构成了文学传播的基本渠道。20世纪初叶以来，随着现代电子技术的空前发展，广播、电影、电视等电子媒介日渐成为现代文化的主要传承形式。\n\n一、电子媒介的传播特点\n\n20世纪初以来，随着现代电子技术的空前发展，广播、电影、电视等电子媒介日渐成为现代文化的主要传承形式。电子媒介对于信息的传播呈现出三个全新的特点：\n\n（一）电子媒介实现了信息的远距离超时空快速传输，同时其复制、储存与传播信息内容的能力也比印刷媒介阶段更为强大。\n\n（二）由原来的单一媒介传播走向多媒体全息传播。这不仅对生活、事物的反映具有高度的逼真性与现场感，而且传者与受者在信息的交流与共享方面具有即时性、共在性的特点。\n\n（三）对于受众文化水平的要求相对较低，其传播具有极大的广泛性和普及性。\n\n二、电子媒介对当代文学发展的影响\n\n（一）广播文学、电视文学，特别是网络文学等新的文学形态或多媒体文艺样式的兴起，改变着传统上以纸质印刷媒介为主要载体的文学存在形式，使文学的传播方式和存在形式发生了很大的变化，使文学大家族变得更加丰富多样。\n\n（二）文学与其他艺术载体，如电影、广播文艺、电视艺术等的互动进一步增强，如将历史上流传下来的文学作品改编成为广播文艺、影视作品等，使之以新的文学形态或文艺样式进行传播，产生了新的接受效果。\n\n（三）文学的社会功能逐渐向休闲娱乐方向偏移。传统社会中文学的雅、俗之分以及现代社会中文学的审美取向与非审美取向之间的区分逐渐消解。\n\n（四）伴随着广播、电影、电视日渐成为当代的主导媒体，以这些媒体为依托的艺术样式也在当代艺术生产与消费的总体格局中越来越占据有利的主导性的位置，而文学在艺术活动以及社会文化总体结构中的位置相对来说被边缘化了.\n\n可见，电子媒介对于文学的发展犹如一把双刃剑，既有其积极的有利的一面，也有其消极的不利的一面。\n\n媒介对于当代文学的发展发挥着重要的影响，但绝不是关键的影响力量，不能撇开时代的经济和政治状况来孤立地谈媒介对于文学发展的作用，从而走向媒介决定论。", "keywords": "传播特点 远距离超时空快速传输 多媒体全息传播 广泛性和普及性 影响 文学存在形式 互动进一步增强休闲娱乐 边缘化 双刃剑", "note": "随着科技的进步与社会的发展，文学传播方式发生着历史的变化并趋向多样化，由此也引起文学消费的日益大众化与世界化。总的来说，文学传播经历了口语媒介、文字书写媒介、印刷媒介、电子媒介四个阶段，而当下我们正处于电子媒介时代，电子媒介对当下文学的形式和特点都产生了极为重要的影响。", "framework": ""}, {"id": "109", "stars": 3, "title": "图像化转向对当代文学发展的影响有哪些", "body": "文化创造领域的图像化转向和日常生活的审美化，对当代文学发展既有积极作用又有消极影响。\n\n一、积极影响\n\n作为电子媒介时代文化生产的一种新趋向，图像化已经改变了文学的生存环境和生产样态。\n\n（一）对视觉盛宴的追求，极大地改变了当代人的文化阅读与接受方式，即由过去以书籍报刊为主导媒介的文化接受，更多地转向以电视电影为主导媒介的文化接受。\n\n（二）文学通过与图像文化的结合而寻求新的发展。文学与图像化的结合，适应和满足了读者大众对审美文化的需求，文学借助于新媒体丰富了自身的表现方式与手段，拓展了自身的发展空间，这对于当代文学的生存、繁荣和发展有积极意义。\n\n二、消极影响\n\n应该看到，媒体文化生产的图像化及相关的日常生活审美化，也是当代消费主义文化的一种表征，其背后隐藏着资本逐利的目的。媒体对图像化的推波助澜和出资人用审美因素来打扮现实，常常只是为了实现某种经济上的谋划与策略，并☒不关心真正的文化精神和审美价值。德国美学家沃尔夫冈·韦尔施将这样一种审美状况称为“浅表审美化”，并认为“在表面的审美化中，一统天下的是最肤浅的审美价值：不计目的的快感、娱乐和享受”。现实生活和文化创造领域里的这种“浅表审美化”的泛滥，将导致文学的理性精神与深度美感的缺失，造成人性的片面发展与人文精神的匮乏。\n\n不过，文学与图像化的结合虽然表现出了当代社会的图像化对文学活动的影响，但并不表明以语言文字阅读为基础的文学创造和欣赏活动的终结。文学是语言的艺术，语言的内视性等特点常常是图像无法达到的，语言文字的组织创造和审美阅读依然是当今时代文学生成和存在的基础。因此，如何在文学的创造中寻求语言与图像的有益结合，已成为摆在当代文学生产者面前的一项时代性课题。", "keywords": "新趋向 生存环境 生产样态 电视电影为主导媒介 寻求新的发展 当代消费主义 资本逐利", "note": "近年来，随着“图像时代”的到来以及图像观念对文学研究的巨大冲击，文学图像化或图像文学俨然成为一种发展趋势。对于这个问题，我们需要辩证地看待。一方面不得不承认，图像化转向确实给我们的生活、阅读、理解、记忆带来了一定程度的便利，但是另一方面也要认识到，图像化对文学在某种方面是一种侵入，也会造成人们对文字的钝感。", "framework": ""}, {"id": "110", "stars": 3, "title": "网络文学的特点（26辽宁大学）", "body": "在网络出现之前，文学作品的发表、出版、流通均需经过一定的审查等必要的程序，这实际上设定了跨入文学界的种种门槛。而在网络中，文学生产和传播的门槛可以轻易地被跨越，传统的等级秩序对自由进出网络的人来说已失去了以往的制约作用。从这个意义说，网络文学显现出新鲜、活跃、年轻、民间的状态，具有以下重要特点：\n\n一、突出的类型化特征\n\n（一）题材方面\n\n中国网络小说的类型大致可以划分为玄幻、奇幻、仙侠、科幻、盗墓、穿越、架空、游戏、悬疑、灵异、二次元和同人等。这些类型小说有的受益于西方奇幻故事；有的脱胎于中国古典文学或近现代通俗小说，如传统武侠小说的行侠仗义、快意恩仇等套路依然以多种变异的方式存在于其中，具有东方化的、中国式的故事内核；有的则是中国文学史上从未出现过的新类型，如“无限流”“佛本流”“技术流”“种田流”“凡人流”“随身流”等类型，拓展了中国文学的类型或体裁疆界。\n\n一定程度上，类型文学是网络文学写作和阅读（“悦读”）的必然。也就是说，网络文学的类型写作既可以满足读者的需求（作品要好看，要有“爽文”的属性），也可以满足普通作家的需求（作品具有程式化的特点，易于扩大再生产），也有可能满足优秀作家的需求（作品要雅俗共赏，具有超越性、典范性）。\n\n（二）语言风格及其艺术追求方面\n\n新型的网络交往和网络文学的类型化发展带来了新的审美意识和言语生活形式，也为网络文学带来了新的独特的修辞风格。根据网络文学的语言风格及其艺术追求的不同，目前的中国网络小说大致可以分为“小白文”和“文青文”两种。“小白文”的特点是：语言浅显直白，通俗易懂，人物形象简洁明了，故事情节重复单一。“文青文”显现出与“小白文”相对的文学风格，是具有某种情怀、表现出某种创新性诉求、文学性和思想性俱佳的网络作品，多追求精英文学的博雅精纯的审美风格和诗意表达。当然，在“小白文”和“文青文”之外，不同类型的网络文学的风格还存在着广阔的展示和发展空间。\n\n二、令人痴迷的虚拟性\n\n网络文学的作者充分利用网络空间的虚拟性，摆脱具体时空的限制，在作品中构思出穿越、架空、重生、分身、升级、随身系统等常见设定，拓展出直接源于网络或带有深深的网络印记的时空观念，重构了自身与生活世界的关系，在人机交互中虚构出亦真亦幻的文学场景与人物，创造出不同于现实世界的“第二世界”或虚拟世界。\n\n网络文学的虚拟性还体现在网络文学的
