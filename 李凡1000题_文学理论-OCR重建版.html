狂欢精神之中。网络的虚拟性和相对匿名性（网络作家所起的千奇百怪的笔名就是例证之一）将人们带入了一个仿佛是相对自由的、狂欢的世界。与日常生活不同狂欢化的网络生活暂时取消了等级、权力、差别、隔阂和禁锢，其主要特点是无等级性、大众性、宣泄性、颠覆性、坚持对话、崇尚变革，具有狂欢式的笑的双重性：“它既是欢乐的、兴奋的，同时也是讥笑的、冷嘲热讽的，它既否定又肯定，既埋葬又再生。”\n\n三、明显的游戏性\n\n网络文学和游戏有着深厚的渊源。游戏小说是网络文学的重要类型之一，它们或者源于某种游戏，或把游戏当作创作背景，游戏直接构成了小说的主要叙事内容和主体部分。玄幻、仙侠、修真、穿越、重生等幻想类小说本身虽然不是来源于游戏，但也受到了游戏的深刻影响，分享着游戏式的结构和要素，显示出强烈的二次元世界的游戏特点。\n\n幻想类小说的场景组合、任务设定、人物塑造、世界想象、现实时空与异时空的二元结构、叙述方式，都有明显的游戏性和动漫的痕迹，经常包含着网络游戏的基本要素（如设定、升级、地图、对决、装备、副本、数据、存档等），有着升级、打怪、夺宝等常见的情节设置。（李凡说：比如《斗破苍穹》）\n\n四、便捷的互动性\n\n网络上的言说行为具有作者与读者的双向属性，两者身份随时可以交换。“网络世代的文化核心就是互动”。在网络文学的生产、传播过程中，读者在网站的书评区、帖吧等平台和作者、书友进行交流通过收藏、订阅、投月票、打赏、留言、跟帖、组织粉丝活动等方式，深度介入作品的创造过程中，和作者进行对话交流，对作品进行诠释、改写甚至重写，成为具有创造力和生产力的粉丝群体，成为积极的消费者。这种交流往往带给作家莫大的鼓励和动力。一些网络作家为了提高点击量和订阅数量，获得读者的认可，重视与读者的沟通，经常根据读者的反馈和偏好对作品进行修改，如增设人物、改变情节等，有时甚至直接在作品中吸收读者的创作。\n\n网络文学写作的互动性在“同人”作品、“接龙小说”和“跟帖小说”等网络文学中表现得尤为明显。在一些网络小说的创作过程中，作者和读者的角色是相同的，地位是平等的，经常保持着互动状态，互相激发着对方的灵感和文思，从而打破了传统出版物的作者唱独角戏的写作模式。", "keywords": "类型化 虚拟性 游戏性 互动性", "note": "①随着时代的发展，网络文学的重要性已经越来越突出，近年来的命题频率有所增加，大家要进行全面掌握。②这道题目具有跨学科属性，已不再属于单纯的文学理论题目，具体也可参考李凡文学1000题中的当代此类题目。", "framework": ""}, {"id": "111", "stars": 3, "title": "网络文学的影响和作用", "body": "应当看到，网络文学作为新兴的文学形态，对当代文学和艺术的发展起到了一定的推动作用，具体来说，网络文学对于当代文学、艺术和文化的影响和作用，主要表现在以下方面：\n\n一、开拓文学活动的共享空间（李凡说：谁共享，共享什么）\n\n在网络时代，传播媒介已经转变为交互时代的“读写”多媒体，“大众的自我出版在今天变得并非不可想象了”。网文学建构出一种“参与性文化”，创造了网络时代的共享空间。\n\n网络作家和编辑、批评家共享着文学的生产与传播。作家可以不再像印刷媒介时代那样只是依赖文学期刊、出版社、批评家、文学奖项和文学选本的选择、认可和肯定，而是可以直接面对读者和市场，迎接受众的褒贬和及时的市场评价。（李凡说：减少了中间环节）\n\n作家和读者共享着文学的创作。网络文学创作具有“产销者劳动”和“生产者用户”的特征，网络文学的很多读者（书友、粉丝）对文本的投入是主动的、热烈的、狂热的、参与式的，他们既是文化消费者，也是“文化生产者”。读者的阅读包含分享、表达和争论，这个过程也是创造的过程，通过各种互动平台，读者特别是粉丝群体可以直接参与到文本创作的过程中来，文学的生产、传播、评论、分享几乎是同步进行的，读者对小说人物的评论、对情节走向的预测、对作品的鼓励和建议有时会直接影响文本的呈现结果。有学者分析：“粉丝文化是如此富有生命力而多产，不断处于实验和创新过程。粉丝圈并不是需要我们保护的脆弱物件，它一直处于转变过程中，一直对社会文化有着阔大的包容力和渗透力。粉丝一直的关注中心就是创造力、合作、社群和版权。”网络和读者在一定程度上改变了文学创作的生态，促成了网络文学的繁荣。\n\n二、有助于满足多样化的文学需求\n\n网络文学的类型异常丰富多样，可以从不同层面反映或实现当代人形形色色的白日梦或心理期待，满足其多样化的文化需求。幻想类网络小说凭借着汪洋恣肆、天马行空的想象力，构建出雄奇瑰丽的虚拟世界和游戏空间。“禁制”“封印”“结界”等非凡的时空状态或生存状态经常带给读者新奇感，让读者产生代入感，让他们在虚拟世界中“过关斩将”“建功立业”，获得现实中难有的某种成就感和愉悦感，也满足了娱乐需求。一些作品还打破世界与自我的设定，改变线性的、不可逆的历史，超越个体生命的有限性，满足读者对精神、身体、空间等领域的自由的需求。（李凡说：这一点主要说明的是“幻想类”的网络文学）\n\n现实类的网络文学则致力于全方位地把握和呈现社会生活，重视细节的真实、可感，保持着对当下社会的热情和对此岸世界的关注，暴露和展示出当代中国的复杂、矛盾、焦虑和希望，表现了人们真实的生存体验，在文学与现实、现实与理想之间建立起了广泛而密切的联系。不仅可以适应读者的娱乐需求，也可以满足他们观照现实与自我的需要。（李凡说：这一点主要说明的是“现实类”的网络文学）\n\n三、对当代文化产业的繁荣有一定的促进作用\n\n网络文学充分利用网络技术条件和空间的便利，丰富和活跃了文学创作与接受，拉动了其他艺术门类的发展，构建起“网络文学＋”的商业体系，成为当下图书出版、影视、游戏、漫画等业态的“富矿”，从而在一定程度上促进了当代文化产业的繁荣发展，特别是拓展了当代文学对其他艺术门类的影响力。这也可以视为网络文学对文学和其他艺术的当代发展的一份贡献。\n\n传统作家的收入主要来自稿酬或版税，而网络作家的收入除了稿酬和版税（读者付费订阅网络连载、购买纸质书）之外，还包括增值部分（读者打赏、移动终端阅读、有声阅读、广告，以及影视、动漫、游戏的改编及其他衍生品收入等）；实现了网络作家和文化产业收入的多元化。有号召力的网络作家其作品往往涵盖在线阅读、有声读物、影视剧、舞台剧、游戏、动漫、纸质书等多种版权。不少网络文学IP（知识产权）奠定了良好的口碑和受众基础，吸引了大量资金的投入，衍生出多种艺术产品，创造了价值惊人的产业。近年来，由网络文学改编而来的影视剧和动漫产品屡次掀起播映热潮，有的甚至形成了“现象级”文化热点。", "keywords": "共享空间 多样化的文学需求 文化产业繁荣", "note": "本题承接上题而来，还是在论述网络文学。网络文学相关内容是马工程版教材相较于童庆炳版教材新添加的内容，部分院校会专门针对这一部分知识点出题，大家对此要多多掌握。", "framework": ""}, {"id": "112", "stars": 4, "title": "结合具体实例，探讨网络文学存在的问题", "body": "网络文学在对深切的生存体验、高远的想象力、积极正向的价值观取向和深沉的独创性的开拓等方面，存在严重的缺失，显露出了一些深刻难解的问题：\n\n一、在文学与社会生活的关系上，一些网络文学流露出远离现实、逃离社会的偏向\n\n在当代网络文学中，幻想类小说占据了很大的市场份额，其去现实化的倾向明显。一些网络作家一味沉溺于虚拟时空的书写，即使写的是现实题材，也往往形真实幻，缺乏正视社会现实的勇气，无意揭示社会的真实，更不愿去探究社会发展的真理。其主人公要么借助重生、穿越而成为先知，一次次趋利避害，轻而易举地改变世界，要么意外地获得异能或作弊系统，在解决现实问题时，通过超现实的神奇手段获得成功，既缺乏合乎情理地表达现实经验的能力，也缺乏直面现实的勇气和魄力，其作品也难免被评价为“伪现实”和“伪历史”。\n\n二、在文学价值与功能上，一些网络文学作品过于强化商业化、娱乐性而忽视思想性、艺术性\n\n受网络文学市场化的影响，网络文学的更新和作家收入有直接关系，网络作家特别看重点击率、收藏量等指标，越来越把写作变成了“码字比赛”，有的网络小说总字数甚至高达两三千万，连载长达十多年（李凡说：比如《校花的贴身高手》）。可以说，有的网络小说家的一两部作品，基本上和一个传统作家终身的创作量相当。网络文学如此浩大的篇幅和更新速度，虽然有利于满足读者永无止境的阅读渴求，但也导致许多作品出现“注水”、量大质劣、低级重复和套路固化等严重问题，容易引发阅读疲劳甚至厌倦。庞大的生产规模和体量也导致当代文艺创作存在着有数量缺质量、抄袭模仿、千篇一律等问题。还有的网络作家一味追求“快”“长”“爽”和快乐叙事，引发“阅读拜物教”式的点击率，致使所谓“鸿篇巨制”比比皆是。这些都会造成网络文学表面繁盛、实质荒凉的景象。\n\n三、一些网络文学作品格调低俗、立意单薄、价值观错乱\n\n由于网络写作门槛较低，有些网络写作滥用了网络的开放性和自由空间，滥用了匿名写作机制，过于追求个人化与情感化表达，将网络当成了暴露私密与宣泄欲望的场所，从而展示出低俗、庸俗、粗俗甚至是恶俗趣味，表现出对社会主义核心价值观的某种偏离，如推崇丛林法则，信奉强者为王、金钱至上、权谋至上的思想，把丰富多变的生活窄化和扭曲了，缺乏弘扬正能量的志向和追求。\n\n网络文学在发展中所显露出的问题，有可能消解或损毁文学应有的人文精神和艺术品格，从而加重当代文学的精神危机。对此，应当采取正面引导、团结和吸引的方针，即需要在鼓励和推动网络文学发展的同时，更加主动有力地加强对网络文学发展的引导，完善网络传播的有关法律法规并注重网络著作权维护，严格文学网站的规范管理，抓好网络文学的队伍建设，鼓励优秀作家介入网络文学创作以提高网络文学创作的整体水平，同时改进在场的网络文学批评，建立网络文学的评判机制与约束机制，在创作与批评的良性互动中将网络文学的发展引向更高的艺术境界。", "keywords": "远离现实 逃游社会 忽视思想性、艺术性 格调低俗、立意单薄、价值观错乱", "note": "①网络文学在发展中所显露出的问题，有可能消解或损毁文学应有的人文精神和艺术品格，从而加重当代文学的精神危机。对此，应当采取正面引导、团结和吸引的方针，即需要在鼓励和推动网络文学发展的同时，更加主动有力地加强对网络文学发展的引导，同时改进当前的网络文学批评，建立网络文学的评判机制与约束机制，在创作与批评的良性互动中将网络文学的发展引向更高的艺术境界。②这道题目具有跨学科属性，已不再属于单纯的文学理论题目，具体也可参考李凡文学1000题中的当代此类题目。", "framework": ""}, {"id": "113", "stars": 3, "title": "说说全球化语境下民族文学发展面临的机遇与挑战（25云南师范大学）", "body": "经济全球化时代，文化的发展存在两种不同的现实走向：一种是西方文化借助于其在经济全球化进程中积累的巨大资本和对于全球信息流通的主导性掌控而极度扩张，谋求西方文化的全球一体化或由西方文化为主导的文化趋同化；另一种是全球各民族多元文化之间的和谐共存、平等交流与相互吸收，在保持文化多样性的基础上实现全球文化资源的共享与各民族文化的共同繁荣发展，这是发展中国家人们的愿望。这两种走向及其支撑力量相互作用，形成了当今时代文化发展的现实潮流和各民族文化与文学发展的现实语境。\n\n一、民族文学发展面临的挑战\n\n（一）文学是民族精神的重要价值载体，当民族国家的权力以及由之维护的特殊价值被削弱甚至被抹平的时候，其文学也就失去了作为民族文学的内在精神支撑的作用。在全球化语境下，民族文学的发展面临着严重的挑战和冲击。在经济全球化进程中，某些发达资本主义国家凭借其经济、政治和军事上的硬实力，将由他们自己设定的价值标准和交往规则在世界范围内强力推行，对于欠发达民族国家的权力和价值理念进行削弱和压制。\n\n（二）世界文化贸易与文化交流中的不对称格局，对弱小民族国家的文化发展乃至生存也形成了严酷的挤压，发达国家可以凭借其强大的经济实力将其艺术和文化产品向弱势民族国家大量倾销，而后者的艺术和文化产品却难以反向流动，甚至连自身赖以生存的基本文化空间都被前者挤占甚至塞满。\n\n（三）文学是语言的艺术，文学的民族特性是与民族特有的语言分不开的。而信息全球化的发展却使少数几种语言成为全球信息流通领域里的“硬通货”，互联网上的信息绝大部分是由英语传播的，同时许多的民族语言却在不断走向消亡，许多尚无消亡之忧的民族语言也面临着来自于英语的压力。语言是文学的媒介，民族语言不存在了，民族文学也必然面临新的问题。\n\n二、民族文学发展面临的机遇\n\n民族文学面临的上述种种不利境况并不意味着民族文学必然陷入死地。相反，全球化语境也给民族文学的发展带来种种新的机遇。\n\n（一）以一定的疆域为界，拥有共同的语言、共同的历史传统和共同的生存处境的民族国家共同体依然存在，它是抵制文化西方化企图的有力制衡力量，从而是民族文学存在与发展的基本依托。\n\n（二）只要植根于民族生存的现实处境，真正与民族同呼吸共命运，与民族的发展同步伐，民族文学就一定不会失去内在的民族血脉，一定会根深叶茂地发展壮大起来。\n\n（三）置身在信息流通的全球化和文化的全球性传播的便利条件下，民族文学更有可能从其他民族的文学中获得借鉴和营养，从而为自己的发展注入新的活力，也更有可能使民族文学突破区域性疆界的限制而逐渐走向世界。\n\n（四）经济全球化进程带来的危及各国人民生存与发展的共同性问题（如生态环境恶化、全球气候变暖、荒漠化及恐怖主义等）使得各国作家的文学创作有了共同的主题，这些共同主题又使各国民族文学之间的交流更易产生共鸣，从而有利于民族文学走向世界，为世界人民所接受。", "keywords": "挑战：民族精神 不对称格局 语言的艺术 机遇 民族国家共同体 民族血脉 借鉴 共同主题", "note": "①世界文学在形成的过程中，当然并不是要取消民族文学，相反各民族文学更应在汲取其他民族文学养料的基础上，进一步发展本民族文学的民族特色，正如鲁迅所说：“有地方色彩的，倒容易成为世界的。”因此，各民族文学只有保持和发扬自己民族的独特性，才能使世界文学园地更加绚丽多彩。②此题还有另外一种提问：全球化语境下民族文学发展的双刃剑模式。", "framework": ""}, {"id": "114", "stars": 3, "title": "谈谈全球化与文学的跨文化交流", "body": "民族性与世界性是文学理论的一对重要范畴。它的提出与“民族文学”和“世界文学”理念的形成相关联。\n\n一、文学的民族性与文学的世界性\n\n由于民族生活和民族文化的差异，民族文学自然会在内容和表现形式上体现出自己鲜明的民族风格与民族特点，这种民族风格与民族特点就是文学的民族性。特定的民族生活与民族精神是形成文学民族性的源泉与动因，而文学民族性的形成又反过来作用于民族生活的过程与民族精神的培育，制约和影响民族文学的发展。\n\n在一个民族内部，文学的民族性是一个揭示普遍性或共同性的概念，它标志着一个民族的文学共同具有的文化身份属性；而超出这一民族的范围，它又是一个揭示差异性的概念，文学的民族性总是在与其他民族的文学相互比较中才显现出来的。\n\n文学的民族性与文学的世界性都是对文学存在特性的揭示，区别在于前者着重于说明一个民族与其他民族在文学发展方面的特点和差异，后者则重在说明各民族文学之间的共同点和类似之处，并且包含了各民族优秀的文学具有为世界人民共享、能够作为全人类的遗产在世界文学史上占有地位的意义。\n\n二、“世界文学”理念与文学的跨文化交流\n\n“世界文学”理念产生于19世纪的欧洲。歌德首次将“民族文学”与“世界文学”的概念并提。“民族文学”与“世界文学”是一对具有关联性的范畴，但二者之间并不必然构成一种矛盾对立的关系。民族文学概念建立在近代以来民族意识觉醒与各民族国家文学的发展基础之上，是基于对民族和民族性的认知而形成的文学概念。世界文学概念也是对文学发展现状的概括，但更多地体现了对于文学发展前景的展望，隐含着对于世界文学理想发展形态的期待。在民族国家林立的当前，“世界文学”指的不是一种无差别的文学实体，而是指各民族文学打破闭关自守状态而走向彼此的交流与共生。民族文学的发展仍然是基本前提，是世界范围内文学交流的主体，同时各个国家优秀的民族文学又是构成“世界文学”的组成部分。就此而言，优秀的民族文学，是民族的也是世界的，是世界的也是民族的。\n\n三、跨文化文学交流的目的\n\n跨文化文学交流的目的，不仅是为了增进中外文学之间的相互了解，更主要是通过交流来学习、借鉴他人的优点和长处，促进本民族文学的发展，并在民族文学繁荣发展的基础上促进世界文学与文化多样性格局的形成。\n\n四、基于上述目的，我国文学的跨文化交流应当坚持如下文明交流基本原则\n\n第一，文明间多彩原则。文明是多彩的，人类文明因多样才有交流互鉴的价值。第二，文明间平等原则。文明是平等的，人类文明因平等才有交流互鉴的前提。第三，文明间包容原则。文明是包容的，人类文明因包容才有交流互鉴的动力。\n\n五、跨文化文学交流的态度\n\n（一）相互理解，彼此尊重，在平等交流和对话中扩展民族文学的国际视野。在相互理解、彼此尊重的平等交流中，参与交流的各方都能够发现并且乐于发现其他民族文学中优秀的东西，从而使各民族的优秀文学创作真正成为人类的共同财产，为各国人民共同欣赏，并成为各国民族文学创作有益的参照与借鉴。\n\n（二）以我为主，合理选择，在开放与引进中坚持应有的批判态度和主体立场。当代文学的开放性发展与文学的跨文化交流，并不意味着来者不拒和毫无选择地接收。对于那些腐朽颓废的文学，有害于我国文学和社会健康发展的文艺思潮、文学观念和文学作品，都理应进行批判与抵制。\n\n（三）借鉴吸收，融合创新，在跨文化交流中推进民族文学的繁荣发展。在文学的跨文化交流过程中，我们一方面要对外国优秀的文学有兼收并蓄的胸怀，另一方面要善于将学来的东西吸收消化，融会贯通于自身的文学创造之中。", "keywords": "民族性 世界性 目的 原则态度", "note": "①这道题目本质是谈文学的民族性和世界性，注意层层展开。②最早提出民族文学与世界文学这对文艺学范畴的是歌德，他强调诗是人类的共同财富，各民族都有自己的长处，有自己的民族特性，但不能因此而固步自封，夜郎自大；只有通过各民族文学之间相互交流、相互学习、相互对话，才能使“世界文学”的时代早日到来，从而以自己民族文学的独特性，走向世界文学的新时代。", "framework": ""}, {"id": "115", "stars": 2, "title": "我国跨文化文学交流的目的、原则、态度是什么", "body": "一、跨文化文学交流的目的\n\n跨文化文学交流的目的，不仅是为了增进中外文学之间的相互了解，更主要是通过交流来学习、借鉴他人的优点和长处，促进本民族文学的发展，并在民族文学繁荣发展的基础上促进世界文学与文化多样性格局的形成。\n\n1956年，毛泽东提出，中国人的文艺创造总要有自己的民族形式、民族风格与民族特色，因而一定要尊重民族的欣赏习惯和民族的艺术传统；与此同时，中国的文艺创造也不能死守传统，也应该发展，对于外国的好的东西、能够体现艺术的基本原理的东西也要好好学习，接受外国的长处，会使自己的东西有一个跃进。根据这一基本思想，毛泽东又明确地提出了“古为今用，洋为中用”这一对待中外文化遗产的八字方针。“洋为中用”四个字言简意赅，点明了进行中外文学和艺术跨文化交流的目的所在，在当前经济全球化进程中仍然有指导意义。\n\n二、基于上述目的，我国文学的跨文化交流应当坚持如下文明交流基本原则\n\n第一，文明间多彩原则。文明是多彩的，人类文明因多样才有交流互鉴的价值。第二，文明间平等原则。文明是平等的，人类文明因平等才有交流互鉴的前提。第三，文明间包容原则。文明是包容的，人类文明因包容才有交流互鉴的动力。\n\n三、跨文化文学交流的态度\n\n（一）相互理解，彼此尊重，在平等交流和对话中扩展民族文学的国际视野。由于各民族文学都有各自的民族传统与民族价值立场，因此文学的跨文化交流，就需要充分尊重和理解各民族文学的历史传统与文化观念。在相互理解、彼此尊重的平等交流中，参与交流的各方都能够发现并且乐于发现其他民族文学中优秀的东西，从而使各民族的优秀文学创作真正成为人类的共同财产，为各国人民共同欣赏，并成为各国民族文学创作有益的参照与借鉴。\n\n（二）以我为主，合理选择，在开放与引进中坚持应有的批判态度和主体立场。当代文学的开放性发展与文学的跨文化交流，并不意味着来者不拒和毫无选择地接收。对于那些腐朽颓废的文学，有害于我国文学和社会健康发展的文艺思潮、文学观念和文学作品，都理应进行批判与抵制。\n\n（三）借鉴吸收，融合创新，在跨文化交流中推进民族文学的繁荣发展。学习外国的东西，必须加以中国化，要把学来的东西转化到自己的创作上来。文化上的交流要落实于民族自身的创造，落实于自我创新。只有不断创新，才能使我们的民族文学在相互交流与交往中赢得尊重，也才能在相互竞争或冲突中赢得主动。因此，在文学的跨文化交流过程中，我们一方面要对外国优秀的文学有兼收并蓄的胸怀，另一方面要善于将学来的东西吸收消化，融会贯通于自身的文学创造之中。\n\n只有这样，中国文学才能既不落伍于世界文学的潮流，又能保持和发扬民族的风格和特色，以自己的民族文学的独特性，走向世界文学的新时代，在绚丽多彩的世界文学大花园里展现出自己特有的魅力。\n\n童庆炳《文学理论教程》部分", "keywords": "目的：增进了解 促进本民族文学的发展 文化多样性格局 古为今用，洋为中用 原则：多彩 平等 包容 态度：相互理解彼此尊重 以我为主合理选择 借鉴吸收融合创新", "note": "①我们的文学理论必须是现代的，吸收古今中外优秀的理论成果，具有创新性，建设具有自我特色的体系，面向 世界、面向未来，与不同的文化交流对话。②这道题目其实是上道题目的一个详细方面的展开，大家要学会按题目要求去灵活应对。", "framework": ""}, {"id": "116", "stars": 3, "title": "试从学科的归属、对象任务和学科品格三个角度，说明文学理论的性质", "body": "一、学科归属：一般性、普遍性、理论性、宏观性\n\n文学理论是文艺学中三个分支之一，它与其他分支（文学批评和文学史）有着极其密切的联系，它通过对文学问题的审视，侧重于研究文学中带一般性的规律，它力图指导制约着其他分支的研究，但它本身又必须建立在对具体的作品、作家和文学现象的研究基础上。文学理论作为文艺学的一个重要分支，以文学的普遍规律为其研究范围。它虽然也涉及具体的作品、作家和文学现象，但一般是作为例证出现的。它以哲学方法论为总的指导，从理论的高度和宏观视野上阐明文学的性质、特点和规律，建立起文学的基本原理、概念、范畴以及相关的方法。\n\n二、对象任务：整体性、复杂性、包容性\n\n文学不是以成品这种形式而存在的，而是以活动的方式存在的。美国当代文艺学家M.H.艾布拉姆斯提出了文学四要素的著名观点，他认为文学作为一种活动，总是由作品、作家、世界、读者四个要素组成的。我们认为，文学理论所把握的不是这四个要素中孤立的一个要素，而是四个要素构成的整体活动及其流动过程和反馈过程。\n\n文学理论研究的客体是文学活动，而文学活动是一个复杂的系统，它本身又从属于社会生活这个大系统，对文学活动中复杂关系的探讨与阐释，需要借助多重视角、多种方法、多个形态。这一客体的不同方面、侧面、层次、因素、阶段、关系，都可以作为研究对象。目前为止，任何一家的文学理论都没有囊括全部对象。这样使得文学理论显得庞杂而具有很强的包容性。\n\n由此，不难发现文学理论所规定的五个方面的任务：\n\n（一）文学活动作为人类的一种精神活动，它有一个历史的发展过程，它是随着时代的发展而发展的，从而显示出不同历史阶段的不同特征，这就构成了文学活动发展论。\n\n（二）文学作为人类的一种特殊的精神活动，必然与人类的其他活动不同，在性质上必然有其独特之处，而从总体上来研究文学活动区别于其他活动的特殊性质，这就形成了文学活动本质论。\n\n（三）“世界”就是我们所指的社会生活，社会生活是一切种类的文学艺术的源泉，但社会生活本身还不是文学，社会生活的原料必须经过作家的艺术创造，才能变成文学文本，而研究作家如何根据生活进行艺术创造的过程和规律，这就形成了文学创作论。\n\n（四）作家创作出来的文学文本在阅读、研究和批评中变成了作品，文学作品是一个复杂的结构，其中体裁、题材、形象、语言、结构、风格和手法等都是作品构成中的重要方面，而研究作品的构成因素及其相互关系，这就形成了作品构成论。\n\n（五）作家笔下的文字作为文本如果被束之高阁，不跟读者见面，那还是死的东西，还不是活的审美对象，文本一定要经过读者的阅读、接受、鉴赏、批评，才能变成有血有肉的活的生命体，才能变成审美对象，而研究读者接受过程和规律，就形成了文学接受论。\n\n三、学科品格：实践性、发展性、真理性、综合性、对话性、人民性、科学性、现代性、民族性\n\n（一）文学理论作为一门理论形态的学科，是从长期的、多种多样的文学实践中总结出来的。它的出发点和基础只能是文学活动的实践。先有文学活动的实践，然后才会有文学理论的概括。而且，实践是检验真理的标准，真正科学的文学理论不但在于这些学说形成之时，同时在于尔后为文学实践所印证之日。所以文学理论的实践性品格，不但在于它来源于文学活动的实践，而且也在于它必须经得起文学活动的实践的检验。\n\n（二）由于文学理论具有实践性品格，所以它总是随着文学运动、文学创作、文学接受的发展而发展，它永远是生动的、变化的，而不是僵化的、静止的。由此可见，文学理论的实践性品格决定了文学理论是一门生气勃勃的科学。随着我国现代化建设中改革开放、思想解放的深入，随着社会生活的变革，文学的内容和形式都将出现新的深刻的变革，文学理论这门学科也就不可避免地要去研究新问题，进行新的探索，扩大学科的边界，实现理论创新。因此，我们决不能用僵死不变的、形而上的态度对待文学理论。\n\n（三）文学理论既然是文学实践经验的总结，那么文学理论家在总结实践经验时，总是要依据一定的哲学、政治、道德、美学观点等，从而体现出一定的价值取向。文学理论也是一种意识形态。某种文学理论肯定什么作品，否定什么作品，赞括什么文学现象，批判什么文学现象，提倡什么艺术趣味，反对什么艺术趣味，都应该具有明确的价值取向。就马克思主义文\n\n学理论而言，它作为无产阶级的意识形态就具有鲜明的价值取向，即体现了无产阶级和劳动人民的审美理想和审美趣味，它公开宣布为繁荣和发展人民大众和社会主义文学服务。\n\n马克思主义是在人类丰富的知识成果的基础上产生出来的，马克思主义文学理论的一个重要来源，就是吸收了古代和外国文学理论的优秀成果。马克思主义文学理论之所以能够具有真理性，其重要特点之一就是它的综合性和对话性。它以马克思主义的世界观和方法论综合古今中外一切经过实践检验后被认为是有益和有用的东西，形成对话的局面。\n\n（四）文学理论的价值取向必须是人民民主的，即以提倡广大人民的审美趣味和审美理想为依归，以人民引领文学，而不能以少数人的审美趣味和审美理想为依归。\n\n（五）我们的文学理论必须是科学的，科学形态的文学理论要通过摆事实讲道理，揭示文学活动的规律，总结出文学创作和欣赏的经验，具有深厚的学理性，不是一味迎合某种政治的需要。\n\n（六）我们的文学理论必须是现代的，在当代中国，发展文学理论，就必须面向现代化、面向世界、面向未来，我们的社会已经向现代化迈进，我们的文学理论也必须实现现代性的创新。\n\n（七）我们讲文学理论的现代性品格，并不是不要民族性品格。我们的社会主义文化必须保持中华民族的个性，必须是民族的，体现我们民族文化的优良传统的。", "keywords": "包容性、实践性、价值取向的多样性 学科归属、对象任务和学科品格 文艺学领域 文学活动 实践性 实践的检验 人文性 阶级性 科学性 规律性认识 其他观点 伊格尔顿 政治性 概念范畴的系统性 内容的社会历史性", "note": "文学理论的性质是：以文学活动为研究对象，系统阐述文学活动的审美特征和文学发展的历史规律；反过来，对文学活动具有认识和实践的双重意义，为文学批评和文学史研究提供系统的价值体系和方法体系。与其他分支学科有着密切联系。以文学基本原理，概念范畴以及相关的科学方法为研究对象。文学活动的四要素（世界，作家，作品，读者）规定了文学理论五个方面的任务：发展论、本质论、创作论、作品论、接受论。", "framework": ""}, {"id": "117", "stars": 3, "title": "分析文学理论与文学评论、文学史之间的联系与区别（25复旦大学）", "body": "目前，国内外文学理论界一般把文艺学区分为文学理论、文学批评和文学史三个分支，这三个分支在研究的范围、对象、任务、功能上都所不同。它们之间的联系与区别，主要表现在以下方面：\n\n一、区别\n\n美国当代著名学者韦勒克认为，在文学研究中区分文学理论、文学批评和文学史非常重要：“首先，在两种文学观点之间存在着区别：一种观点将文学视为一种共时序列；另一种观点将文学主要视为一系列按编年顺序编排的作品，并将其视为历史进程的不可或缺的组成部分。其次，在文学原理和文学标准的研究与具体的文学作品的研究之间，也存在着进一步的区别，不论我们对这些作品的研究是孤立的，还是按编年顺序进行的。“文学理论＇是对文学原理、文学范畴、文学标准的研究；而对具体的文学作品的研究，则要么是“文学批评”，要么是“文学史’。”总的来看，文学史是对文学发展史的研究，文学批评是对当前具体文学现象（作家、作品、文学思潮等）的评论，文学理论是对有关文学的基本范畴和基本问题的探讨。\n\n一般来说，文学理论是整体的研究，是对古今中外文学现象的概括和总结，它揭示的是一般的、普遍的规律。而文学批评、文学史属于个案研究，是对特殊性的揭示，它是文学理论的基础。比如研究加西亚·马尔克斯的生平，介绍他的主要作品，这是文学史；对他的创作特点进行分析，探讨某个或某些作品（如《百年孤独》）的成就得失属于文学批评；文学理论则研究魔幻现实主义的特征，它与其他创作方法（如超现实主义）的区别，魔幻现实主义说明了文学与社会生活是怎样关系，一般不对具体的作家、个别作品进行全面深入研究。\n\n二、联系\n\n文学理论和文学评论、文学史同属于文艺学，都以文学活动为研究对象，属于审美意识形态，它们之间相互贯通，相互渗透。\n\n（一）文学理论要以文学史所提供的大量材料和文学批评实践所取得的成果为基础。如果文学理论不植根于具体文学作品的分析和文学发展历史的研究，文学理论所概括的文学基本原理、概念、范畴和方法，也就成了“空中楼阁”，失去了存在的依据。\n\n（二）反过来，文学史、文学批评又必须以文学理论所阐明的基本原理、概念、范畴和方法为指导。离开这种指导，文学史、文学批评就失去了活的灵魂，成为材料的堆砌和随心所欲的感想的拼凑。实际上，文艺学这三个分支，常常是“你中有我，我中有你”，互相包容、互相切入、互相渗透。", "keywords": "区别 共时序列 编年顺序 原理范畴 具体的文学作品 整体的研究 个案研究 联系 文艺学 文学活动 审美意识形态 相互贯通渗透 基础 指导", "note": "这里引用了韦勒克的《文学理论》中关于文学理论、文学批评和文学史的评论。我们可以基本建立起三者的互动关系框架，那就是三者有所区别，而同时又是相互联系、不可分割、互相渗透的一个整体。", "framework": ""}, {"id": "118", "stars": 3, "title": "文学理论的对象与任务是什么", "body": "一、研究对象\n\n文学理论是一门研究文学特性和普遍规律的人文学科。他有自己独特的研究对象、性质和方法。文学理论的对象是文学现象，具体说来，它研究文学的本质，文学的基本特征，文学的功能，文学作品的创造与接受等问题，它研究文学现象的一般规律，建构文学活动的一般原理，阐释与文学有关的范畴、概念，介绍研究文学的方法。这些都是文学理论研究的对象。\n\n文学理论研究的客体是文学活动，而文学活动是一个复杂的系统，它本身又从属于社会生活这个大系统，对文学活动中复杂关系的探讨与阐释，需要借助多重视角、多种方法、多个形态。这一客体的不同方面、侧面、层次、因素、阶段、关系，都可以作为研究对象。目前为止，任何一家的文学理论都没有囊括全部对象。这样使得文学理论显得庞杂而具有很强的包容性。美国当代文艺学家M.H.艾布拉姆斯提出了文学四要素的著名观点，他认为文学作为一种活动，总是由作品、作家、世界、读者四个要素组成的。我们认为，文学理论所把握的不是这四个要素中孤立的一个要素，而是四个要素构成的整体活动及其流动过程和反馈过程。\n\n二、研究任务\n\n（一）文学活动作为人类的一种精神活动，它有一个历史的发展过程，它是随着时代的发展而发展的，从而显示出不同历史阶段的不同特征，这就构成了文学活动发展论。\n\n（二）文学作为人类的一种特殊的精神活动，必然与人类的其他活动不同，在性质上必然有其独特之处，而从总体上来研究文学活动区别于其他活动的特殊性质，这就形成了文学活动本质论。\n\n（三）“世界”就是我们所指的社会生活，社会生活是一切种类的文学艺术的源泉，但社会生活本身还不是文学，社会生活的原料必须经过作家的艺术创造，才能变成文学文本，而研究作家如何根据生活进行艺术创造的过程和规律，这就形成了文学创作论。\n\n（四）作家创作出来的文学文本在阅读、研究和批评中变成了作品，文学作品是一个复杂的结构，其中体裁、题材、形象、语言、结构、风格和手法等都是作品构成中的重要方面，而研究作品的构成因素及其相互关系，这就形成了作品构成论。\n\n（五）作家笔下的文字作为文本如果被束之高阁，不跟读者见面，那还是死的东西，还不是活的审美对象，文本一定要经过读者的阅读、接受、鉴赏、批评，才能变成有血有肉的活的生命体，才能变成审美对象，而研究读者接受过程和规律，就形成了文学接受论。\n\n【李凡说：文学理论就是通过上面五个任务的研究，概括和总结古今中外文学活动的规律，阐明文学的基本原理，文学与社会生活的关系，文学与其他意识形态的联系与区别，作者创造文学作品的心理机制，文学作品的构成要素，内容与形式的关系，文学接受的性质、接受者心理特征、文学批评的方法，从而建立一套理论体系，构建一系列的概念范畴，全面阐释文学现象。】", "keywords": "文学特性和普遍规律 文学现象 文学活动 文学四要素 文学活动发展论 文学活动本质论 文学创作论 作品构成论 文学接受论", "note": "", "framework": ""}, {"id": "119", "stars": 2, "title": "试述文学理论的基本形态", "body": "（一）从文学创作一文学作品一文学接受这一流动系统看：\n\n1．文学创作是对社会生活的反映，作品论、接受论中也有不少哲学层面的问题，反映论这个马克思主义的哲学视角，是揭示文学活动的基本视角，因此以反映论为基础的文学哲学是文学理论的一个基本形态。\n\n2．创作一作品一接受过程，这是一个心理转换过程。无论是文学创作还是文学接受，都是特殊的心理行为，因此采用心理学的视角，建立起文学心理学才能切入这些特殊的心理行为进行研究，文学心理学是文学理论的又一重要形态。\n\n3．创作一作品一接受的过程，又是一个符号化的过程，这样符号学的视角对文学理论来说就变得极为重要，而文学符号学也理所当然地成为文学理论的一种基本形态。\n\n4．创作一作品一接受系统又是特殊的信息系统，从创作到作品发表，是特殊信息的传播，文学接受则是特殊信息的接收，从文学接受再到文学创作则是信息的反馈。这样一来，从信息学的视角来研究文学活动必然会形成一个新的学科-文学信息学。\n\n（二）从文学生产-作品价值一文学消费这一流动系统看：\n\n1．从文学生产到文学消费是一个组织起来的社会文化过程，这一过程不能不受一定的社会关系的制约，而浸润着社会思潮，反映着社会风貌，直接或间接地回答社会问题。因此，社会学的视角无疑是一个重要的视角，文学社会学无疑是文学理论一种重要的形态，而且在所有的形态中具有特别重要的地位。\n\n2．文学生产到文学消费的过程，又是文学艺术价值的产生、确立和确证过程。文学作品显然对人具有特殊的意义，因此它具有价值；这种价值一般不是指实用价值，而是一种特殊的艺术价值；这种艺术价值在文学生产中产生，在文学作品中得以确立，在文学消费中得以确证。因此，由价值学视角所形成的文学价值学可以、也必然成为文学理论的一种形态。\n\n3．把各种视角和方法融合在一起的理论，这就是文学文化学。这种形态的文学理论以“泛文学”作为研究对象，可以说是最古老的文学理论。但是随着时代的变化和各门科学中综合倾向的发展，人们又在一个更高的层次上去实现对文学活动的多视角的协同和综合的研究，在某种意义上是又回归到文学文化学的路子上去了。因此文学文化学又可以说是一种最新的文学理论形态。\n\n【李凡关键词：文学创作一文学作品-文学接受 文学哲学 文学心理学 文学符号学 文学信息学 文学生产-作品价值一文学消费 文学社会学 文学价值学 文学文化学】\n\n【李凡说：文学理论的基本形态共七种，分为两个流动系统，而这两大流动系统的区分是因为文学活动在意向上可以理解为两个过程，七种形态的出现则是因为采用不同学科的知识（如信息学、心理学等）来审视这两大流动系统。大家可以结合这两个图表理解记忆。这部分内容出论述题的可能性不大，很可能以名词解释的方式出现，但我们还是要有所掌握。】", "keywords": "", "note": "", "framework": ""}, {"id": "120", "stars": 3, "title": "马克思主义文学理论的基石是什么？试作简要的说明", "body": "马克思、恩格斯主要是在批判地继承德国古典哲学、美学、文艺学的基础上，结合当时的创作实践，创立马克思主义文学理论的。马克思主义文学理论的基石是文学活动论、文学反映论、艺术生产论、文学审美意识形态论和艺术交往论，马克思主义文学理论的根基是历史唯物主义和辩证唯物主义。\n\n一、文学活动论（艺术活动论）\n\n马克思实际上把文学艺术看成是人的活动，即人的生活活动。马克思主义把文学艺术的创造和欣赏归结为人的生活活动归结为对象化活动，旨在强调文学艺术与人的本质力量的关系。“文学活动”论可以说是马克思主义文学理论的逻辑起点。马克思主义关于人的活动的论点启示我们，文学活动作为主体的人的能动的创造，其出发点、联结点和归宿点是人和人性，人和人性是文学的核心，文学是人性的延伸，是人性这辽阔的土地所开出的美丽的花朵，没有人和人的生活活动，文学就不可能出现。而人也正通过文学活动从一个独特的方面实现了人的本质力量的对象化。也正是从这个意义上，人们把文学说成是“人学”。\n\n二、文学反映论（艺术反映论）\n\n马克思主义从哲学的存在与意识的关系出发，把文学活动看成是一种人的主体对于客体的认识与反映。他们都认为，不是社会意识决定社会存在，而是社会存在决定社会意识。\n\n马克思和恩格斯所阐述的这个辩证唯物主义原理被运用于文学活动的性质的解说，首先是列宁，他用“反映”这个词说明了文学是对于生活的反映，提出艺术和艺术家应当反映生活的观点。在列宁的论述中不但强调文艺反映生活，同时也肯定文艺的反映不是刻板的，而是主动的，经过改造的，同时文艺也反作用于生活。\n\n其次，文学反映论的观点在毛泽东那里得到了更直接的鲜明的表述。毛泽东在充分肯定文艺是社会生活的反映后，同时也强调这种反映是一种艺术的反映。\n\n马克思主义的文学反映论把文学看成是主体对于客体的能动的认识，这是有根据的。文学创作的实践证明，没有生活，没有对生活的能动的反映，就没有文学。文学的题材、内容、形式，甚至艺术手法，无不从社会生活中来，或受到社会生活的启发、启迪、暗示和诱导。反映论是马克思主义文学理论的一个基石。\n\n三、艺术生产论\n\n文学活动作为人的活动之一，在一个很长的时间里，是人们自由表达自己的思想和感情的结果，就像春蚕吐丝那样，与商品、市场无关。但是，随着社会进入资本主义社会，这种情况改变了。于是文学不能不进入现代资本运行的轨道，成为了一种艺术生产活动。\n\n马克思的“艺术生产”概念具有多种意义，第一种意义是把物质生产与作为精神性的艺术生产相比较，并不专指某一特定历史时期的艺术现象；同时论述物质生产与艺术生产的不平衡关系，认为艺术的一定繁盛时期不一定与社会的一般发展或比例。第二种意义是指实际的艺术创作过程。第三种意义，专指在资本发展时期，一切艺术生产是为资本创造价值，一切艺术品都具有商品的属性。\n\n我们更应从第一种和第三种意义来理解马克思的艺术生产论，因为这种理论强调了文学艺术不是孤立的存在，它的发是与社会的政治经济形态的发展变化密切相关的，我们必须归根到底，从社会物质生产和精神生产的实践中，从生产、消费.分配、交换的关系中，才可能获得对文学艺术最终的解释，这样就给我们揭示文学发展变化的奥秘寻找到一个更宽阔的视野.事实证明，当我们的国家走上市场经济的道路以后，一切“艺术生产”都差不多被纳入商品运转的法则。一本书、一件艺术品、一部电影、一场演出就是一件商品，具有商品的属性，而作家、艺术家也不能不跟出版商、经营商等打交道，很难逃出市场运转的规律。这充分证明了马克思的艺术生产论在今天更具有针对性，更具有现实的意义。马克思的艺术生产论理所当然地成为马克思主义文学理论的又一基石。\n\n四、文学审美意识形态论\n\n马克思、恩格斯没有把“艺术生产”仅仅局限于生产、消费、分配、交换的商业流程中考察，而是高屋建瓴地把文学艺术纳入他的整个社会结构理论中，他明确指出，文学艺术是生产关系总和构成的社会经济基础的上层建筑，是上层建筑中的一种社会意识形态形式。同时，马克思、恩格斯都充分地注意到了文学艺术作为一种社会意识形态形式的特殊性。他们在谈到文学艺术这种意识形态形式的时候，总是强调作家对于世界的掌握是“艺术精神的”掌握，并提出“艺术方式加工”，强调作家对于生活的评论是“诗意的裁判”，强调古希腊艺术中的“想象”“幻想”和“形象化”，强调艺术鉴赏中的“艺术享受”和“儿童的天真”，强调对作品的批评应掌握“美学的历史的”尺度，等等。这些都说明了马克思、恩格斯意识到文学作为一种意识形态形式的审美特征问题。\n\n把文学艺术看成是“审美意识形态”，意味着文学艺术是社会意识形态的变体形式，它既具有意识形态的性质，又具有审美的性质，是这两者的有机结合。\n\n五、艺术交往论\n\n马克思在其政治经济学著作中，关于“交往”的思想就被突出地提出来了。特别是在论述生产、消费、分配、交换的相互关系中，强调人与人之间的互动关系。文学作为一种语言符号的艺术，更是主体与主体之间对话与交往的理想之域。这里以作品为中心构成了作家与作家、作家与此岸世界、作家与读者、作家与彼岸世界的交往关系。这样，文学活动就是由世界、作家、作品、读者所构成的一个交往结构。\n\n联系到接受美学的基本理念，更可以看到它受马克思的生产、消费、分配、交换互动关系理论的启示。一部文本如果没有被读者阅读，没有被读者理解和“具体化”，它只是可能的潜在的文学作品，而不是现实的审美的对象，不是现实的文学作品。读者意识是马克思主义文学理论的一个基本点，非常重要。\n\n这五种观念相互联系、相互贯通，构成马克思主义文学理论的基石。", "keywords": "文学活动论 人的生活活动 文学反映论 反映生活 艺术生产论 资本生产 文学审美意识形态论 上层建筑艺术交往论 主体之间对话交往", "note": "马克思主义的文学理论是马克思主义整体中的一个有机的组成部分，它的理论基石是：文学活动论、文学反映论、艺术生产论、文学审美意识形态论和艺术交往论。而这些又和文学的本质、读者、作者、作品、世界相互对应，构成了童版文学理论的框架。", "framework": ""}, {"id": "121", "stars": 3, "title": "为什么说“文学是人学”（25中国社会科学院大学）", "body": "关于文学的本质问题，目前尚未有明确定论，但仅就文学理论方面来看，我们认为，文学的本质是人学。\n\n一、人是文学的对象和目的\n\n社会、文化、语言、艺术等不仅是人所创造的，也是为了人而存在和发展的，而文学自身也是人以一种特有的方式所创造的一种特有的价值。所以，我们认为，如果说有必要给文学的根本属性做一个界定，那么，这个界定的最恰切、最简洁的表述就是“文学是人学”。这主要体现在三方面。\n\n（一）文学的表现对象主要是人\n\n如果说文学有永恒的主题，那就是人。文学可以不描写其他的一切事物，但是不能不描写人。历史上所有时代的文学都描写人，所不同的只是采用不同的方法描写出不同的人。\n\n文学固然也描写人之外的事，但文学中所有这些人之外的事都是人的象征，是人的本质力量的对象化。古希腊神话中的那些神的形象都反映着人的理想或理想的人。基督教文学中的上帝也是按照人的形象创造出来的。\n\n总而言之，一切国度、一切时代的文学都表现着它那个国度、那个时代的人的状况、人的处境、人的遭遇、人的命运以及人的整个精神面貌。\n\n（二）文学的目的最终是为了人\n\n文学可以有各种各样的目的，但所有这些目的都直接或间接地与人有关。柏拉图说文艺是为了使人“培养起对于美的爱好”，培根认为诗歌“可以使人提高、使人向上”，列夫托尔斯泰认为“艺术家的目的”是为了“使人热爱生活”。所有这些说法都道出了同一个意思：文学的最终目的是为了人。\n\n人类原始时代的文艺有些是用来“娱神”的，但这种娱神的文艺同时也可以娱人，而且娱神的目的也还是为了人。中世纪的文学公开宣称为了上帝，但实质上依然隐含着为人的目的，即为了用基督教精神影响人、引导人，使人心甘情愿地做上帝忠顺的臣仆，尽管这也有不利于人的发展的方面。至于以揭露社会丑恶、反映人生困难为己任的批判现实主义文学，其为人的目的就更加明显了。现代主义文学以展示人性之丑为其特点，表现出漠视人甚至敌视人的态度，但这并不意味着现代主义文学已经放弃了为人的目的，透过冷漠而残忍的外表，我们依旧可以看到现代主义文学对人的命运的关切和对正常的人的生活的企盼。\n\n（三）文学是人的自我认识\n\n文学的认识当然是多方面的，但主要的认识内容还是人。一个时代的文学可以反映这个时代的政治、经济、文化等各个方面的状况，这各个方面的状况其实都是人的状况，文学成为人用来反照自身的镜子。从这个意义上看，文学的历史就是人的自我认识的历史。\n\n总之，文学是表现人和为了人的，文学认识的主要内容也是人，这一切都使我们有理由认为：文学是人学。\n\n二、文学作为人学的特殊性\n\n人学是指有关人的一切学问，因此人学的领域相当广阔，除文学外，还包括其他许多有关人的学科。而文学作为人学有区别于其他人学的特殊性，这同样体现在三方面。\n\n（一）文学表现整体的人\n\n人最初是自然的产物，是生物进化的一个成果，人的存在和发展都离不开自然界，因而人具有自然属性。人总是联结成社会，每个人都在一定的社会中生活，每个人都在社会中占有一定的地位，因而人又具有社会属性。此外，人自身有外显的形体、相貌以及各种行为和活动，这一切形成了人的外在特征。内隐的各方面的心理活动和精神过程又构成了人的内在特征。人的这诸多的属性和特征是有机地统一在一起的，这就形成了人的整体或整体的人。文学作为人学的一个首要特点，就是表现这种有着内在统一性的整体的人。\n\n同文学相比，其他的人学都不反映整体的人，而是从整体的人的身上抽取出某一方面的属性和特征进行专门研究。如生理学、病理学等研究人的自然属性，历史学、社会学等研究人的社会属性，形体学、骨相学等研究人的外在特征，心理学、哲学认识论等研究人的内在特征。尽管也有些人学，如文化人类学、人的哲学等，对人的多方面的属性和特征进行综合研究，但从它们各自的学科使命看，都不是为了表现完整的人。可以说，在所有的人学中，只有文学肩负着表现完整的人的任务。\n\n（二）文学表现具体的人\n\n文学作品中的人物，都是活动于特定的时间和地点，有着特定的形貌和个性的非常具体的人。文学表现具体的人，这是文学的形象性特点所决定的。文学的形象直观性使文学必须描写一个具体的人，通过这种描写暗示出某种社会品格怎样体现在这个人身上。如果文学描写的人不是具体的、个别的、活生生的人，文学所应有的艺术魅力也就荡然无存了。\n\n需要指出的是，文学描写具体的人并不意味着文学不必或不能揭示人的普遍性。但是，文学对人的普遍性的揭示不是抽象地说明，而是具体地显示。在文学中，没有人的具体性，也就没有人的普遍性，普遍性是寓于具体性之中的。\n\n（三）文学表现人时总是融进文学家的情感因素\n\n其他人学在研究人时必须保持一种冷静客观的态度，不能有主观情感因素的渗入。与此相反，文学家对他所描写的人物不仅充满情感，而且还要把这种情感投射到人物身上去，这是因为其他人学主要是以理服人，而文学则需以情动人。伟大的作家笔下的人物无不饱含着作家们的爱憎情感，折射出他们崇高的人道情怀。\n\n【李凡说：认为文学的根基是人，其理由主要在于文学的目的是为了人，其再现和表现的主要对象和内容是人。文学作为人学有其明显的特点，如文学反映的是具体的活生生的整体的人，文学以感性直观和情感体验的方式反映人等等。】", "keywords": "人学 对象和目的 表现对象主要是人 目的最终是为了人 自我认识 特殊性 整体的人 具体的人 情感因素", "note": "", "framework": ""}, {"id": "122", "stars": 0, "title": "重申“文学是人学”在当代有何价值", "body": "重申“文学是人学”，可以有效遏制当下文学的“物化”趋势，缓解当代文学面临的主要问题。\n\n一、当代文学面临的主要问题：物化\n\n文学的当代境遇并不乐观，就目前情况看，当代文学所面临的主要问题就是它日益严重的物化趋势。\n\n（一）什么是物化\n\n“物化”是相对于“人化”而言的。文学本属于“人化”，始终以人为主体，以人为核心。但是，在当代历史条件下，文学却越来越趋向于物化了。人的因素越来越被物的因素所取代，人的主体地位越来越受到异化和颠覆。\n\n（二）造成文学物化趋向的原因\n\n造成文学物化趋向的主要原因有两点。\n\n（1）在后工业社会的背景下，知识经济突起，文化产业领先，文学也随之加速了商品化的进程。文学的商品化推动了大众流行文学的发展，但也对人在文学中的主体地位构成了威胁。无论是创作主体还是接受主体，都受到了经济利益的驱动，并陷入大众传播媒介的主宰和掌控之中。写什么，读什么，怎样写，怎样读，不再出于作者、读者的创造，而是以出版商、书商的意志为转移。作者和读者双双从创造主体的位置跌落下来，越来越沦为文学生产程序中的一个组件。于是，作品异化\n\n为产品，创造主体异化为生产工具，人异化为物。\n\n（2）在后工业社会的背景下，高科技的发展不仅拉动了物质生产的突飞猛进，也深刻地影响到精神生产，大大提升了精神生产的技术含量。在一定的限度内，技术促进精神生产，如文学借助于网络传播而出现了网络文学。但总体上看，技术作为一种既定的操作程序是限制甚至遏制人的自由创造的，而精神生产本质上又依赖于人的自由创造力的充分发挥。现今，电子技术尤其是电脑技术已越来越多地运用到艺术产品的制作中，出现了数字化的绘画（“动漫”设计）、数字化的音乐（电脑合成的流行乐），甚至还有为文学写作而设计的软件和数据库。文学艺术创作的数字化倾向无疑对文学主体的自由创造力的发挥构成了严重威胁，大有以技术取代艺术、以程序取代创造、以机器取代人之势。\n\n总之，商品化和技术化是导致当代文学趋向物化的两个主要原因。\n\n因此，文学本质上是人的创造还是物的制作，是精神的追求还是物质的获取，一句话，文学本质上是“人化”的还是“物化”的，在当代就成为一个关系着文学的前途命运的严峻问题。\n\n二、扭转当代物化趋势的主要手段：重申文学是人学\n\n我们认为，要扭转当代文学的物化趋势，在理论上所能作出的最大努力，就是重申文学是人学。文学本质上是什么，我们可以暂且不论，但是文学的根基是人，这一点恐怕是永恒不变的，过去是这样，现在也是这样，将来还会是这样。\n\n重申文学是人学，就是要大力弘扬文学的人学根基。这种人学的根基性就体现在，文学可以伴随着社会的政治、经济、文化、语言、艺术、科技的变化而变化，可以不断出现种种前所未有的形态和样式。但有一点是不会改变的，文学是人为了人而创造的，是为了不断提高人的自我认识、提升人的生存状态和精神境界而存在和发展的。", "keywords": "主要问题 物化 原因 商品化 精神生产的技术含量 主要手段 重申文学是人学", "note": "重申文学是人学，主要就是为了应对当下文学发展中的物化，也即物质因素对文学影响越来越深入的状况。当代文学史上90年代的人文精神大讨论，就与当下文学的物化状况有着联系。而为了应对这种状况，就需要重申人在文学中的地位，重申文学是人学，这正是这一理论的意义所在。", "framework": ""}, {"id": "123", "stars": 2, "title": "“艺术生产”的概念是怎样提出的", "body": "随着社会进入资本主义社会，文学也不能不进入现代资本运行的轨道，成为了一种艺术生产活动。资本是如此强大，社会生活的各个方面无不受资本的影响。不但物质的生产方面受资本的制约，精神创造也无形中受到资本的制约。以至于精神也成为一种生产。马克思在考察资本主义时发现了这一点，因此马克思就随着时代的发展把文学活动理解为“艺术生产”活动，这是马克思在考察资本主义经济的发展后，主要从经济学的观点来看待文学艺术活动的结果。\n\n马克思早在《1844年经济学一哲学手稿》中就提出了“艺术生产”的概念，他指出：“全部人的活动迄今都是劳动，而宗教、家庭、国家、法、道德、科学、艺术等等，都不过是生产的一些特殊的方式，并且受生产的普遍规律的支配。”马克思和恩格斯在《德意志意识形态》中又一次指出：“支配着物质生产资料的阶级，同时也支配了精神生产的资料。”在这部书中，还有“关于意识的生产”“语言中的精神生产”等提法，在《共产党宣言》中直接提出“精神生产”说：“精神生产随着物质生产的改造而改造。”马克思在《“政治经济学批判”导言》中，提出了人类对世界的四种重要的掌握方式问题，其中就包括对世界的艺术掌握方式问题。与此密切相关，马克思正式提出了“艺术生产”的概念，他在指出“物质生产的发展同艺术生产的不平衡关系”之后还说：“关于艺术，大家知道，它的一定的繁盛时期决不是同社会的一般发展成比例的，因而也决不是同仿佛是社会组织的骨骼的物质基础的一般发展的。”", "keywords": "资本主义社会《1844年经济学-哲学手稿》《德意志意识形态》“精神生产”《“政治经济学批判”导言》正式提出", "note": "在《德意志意识形态》中，马克思、恩格斯就把艺术活动称作“艺术劳动”，后来马克思又在《《政治经济学批》导言》中称之为“艺术生产”。艺术生产是从经济学的角度来分析文学活动，把生产、分配、交换、消费看成一个循环的生产过程，从而揭示文学的价值生成过程。", "framework": ""}, {"id": "124", "stars": 3, "title": "建设中国当代的文学理论应注意几个方面的问题", "body": "要建设具有时代精神和中国特色的当代马克思主义文学理论，就必须解决指导思想、中国特色和当代性三个问题。\n\n一、以马克思主义作为理论指南\n\n马克思主义包含着深刻的哲学观和丰富的历史知识，是人类经验的总结。毫无疑问，中国当代的文学理论建设必须以马克思主义为指导思想。这包含两层意思：\n\n（一）以马克思主义作为指导思想，就是要以马克思主义的世界观和方法论作为指导。世界观、方法论是根基，它比某些现成的结论更为重要。这是因为马克思等经典作家的某些论点是针对一定历史条件下的具体问题而发的，时过境迁，某些论点可能过时，这是毫不足怪的。但他们所确立的世界观和所使用的方法-历史唯物主义和辩证唯物主义-则是经过科学检验的，是永远不会过时的。我们可以而且应该用马克思主义提供的世界观和方法论，去考察新情况，回答新问题，作出新结论。马克思主义绝不是教条，而是行动的指南。这才是对待马克思主义的正确态度。\n\n（二）必须以马克思、恩格斯所创立的，由列宁、毛泽东和一些学者丰富、发展了的马克思主义文学理论为指导。坚持那些已被长期的文学实践所检验过的基本原理、原则，毫不动摇地贯彻到对各种文学问题的考察和研究中去。\n\n总而言之，我们把马克思主义文学理论理解为辩证的与开放的体系，既要坚持，又要发展。在坚持中发展，在发展中坚持。\n\n二、中国特色\n\n中国当代的文学理论应当具有中国特色。如同马克思主义只有同各国的具体实际相结合才能发展一样，马克思主义文学理论只有同世界各国的民族文化相结合，才能生根、发芽、成长。马克思主义文学理论中国化的问题是建设中国当代文学理论无法回避的问题。在这里有两点是必须加以注意的。\n\n（一）必须以中国特有的历史文化和现实经验作为土壤去培植马克思主义文学理论，使马克思主义的普遍真理能够同中国的生动的实际相结合。离开中国的历史和现实来谈文学理论建设，必然会使国际性的内容与民族性的形式相割裂，经验证明，这是无法完成真正的理论建设的。\n\n（二）必须吸收中国传统的文学理论遗产，寻求马克思主义文学理论与中国传统文学理论的结合点。显然，我们做的工作不是仅仅让马克思主义文学理论披上中国人喜欢的外衣。应该看到，中国不仅有灿烂辉煌的古典文学，而且，中国古典文论、诗论、词论、小说论、戏剧论等也是世界文学理论史上的瑰宝，其中有许多观念、范畴都达到对文学的普遍规律的深刻揭示，是很有价值的。它在经过重新审视和筛选之后，在经过“古今对话”之后，在经过“现代转化”之后，形成“新质”，完全可以而且应该融入中国当代马克思主义文学理论的体系中去。这样做既可以使马克思主义的理论表述具有中国特性，又可以丰富其内涵，增强其活力。\n\n三、当代性\n\n建设中国当代的文学理论，当然要具有当代性，体现时代精神。可以从三个方面来理解。\n\n（一）必须在研究中国当代文学发展情况的基础上，概括当代社会主义文学实践的新经验，回答当代社会主义文学运动提出的新问题。中国当代文学的发展错综复杂，文学思潮此起彼伏，文学创作中提出了各种各样的难题，中国当代文学理论的建设不能无视这种种新情况、新问题，应该改变那种只能背诵教条、简单应付而无力解释种种复杂情况和问题的状况。这样，文学理论才会具有当代性并具有时代精神。\n\n（二）必须面对20世纪西方文论的挑战。20世纪被称为“批评的世纪”，在刚过去的这个世纪，西方文论得到了惊人的发展，这种发展大致上取人本主义和科学主义两条路线。马克思主义文论要面对20世纪西方文论中人本主义文论和科学主义文论，中国当代文学理论建设不能不正视20世纪西方文论的这种挑战。当然，挑战并不意味着对抗，我们对西方20世纪以来的文论流派应进行具体的科学分析，对其中合理的因素应加以批判地吸收，变成丰富和发展马克思主义文论的有用材料。\n\n（三）随着科学的发展，20世纪出现了许多新的学科，诸如符号学、解释学、现象学、价值学、信息论等。这些新学科反映了20世纪科学的新成果。这些新兴的学科，作为理论都可以转化为方法，用以研究文学现象，从而创建文学理论新的分支，这样才能把文学理论提高到当代科学的水平上来。\n\n总而言之，在马克思主义的指导下，密切结合中国独特的历史文化、现实经验，充分借鉴传统文学理论的精华，敢于面对当代文学发展的复杂现实，敢于面对20世纪西方文论的挑战，敢于采用一些新的方法，具有中国特色的当代形态的文学理论就一定能够健康地建立并发展起来。", "keywords": "以马克思主义作为理论指南 世界观和方法论 被实践检验 中国特色 中国特有的历史文化和现实经验 中国传统的文学理论 当代性 中国当代文学 20世纪西方文论 新的学科", "note": "要建设具有时代精神和中国特色的当代马克思主义文学理论，需要在坚持马克思主义文学理论的基础上，吸收借 鉴当代各种哲学、美学、文艺学流派和思潮的新成果，回答当代出现的新问题，使文学理论与时俱进，沿着马克思主义指明的方向健康发展。", "framework": ""}, {"id": "125", "stars": 4, "title": "文学活动与生活活动是怎样的关系？文学活动在生活活动中处在什么位置", "body": "一、文学活动与生活活动的关系\n\n生活活动是以生产活动为基础的人类生存、繁衍和发展的活动系统的总称。人类的生活活动既是社会发展的前提，也是人类得以发展、延续的基础，具有社会性和实践性。人的生活活动是文学活动的前提，导致人与对象之间的诗意情感关系，导致人的自觉能动的文学创造，并使文学成为人的本质力量的确证。\n\n文学活动是人的一种精神活动，是人所从事的文学创作、接受、研究等活动的总称、它本身是一个包含诸多方面的复杂系统，同时又是作为人的整个社会活动的一个子系统而呈现出来。文学作为一种活动，是人类社会所特有的现象。与人类的其他活动相比，既有共性，又有特性。\n\n人的生活活动是文学活动的前提，主要表现在以下几个方面：\n\n（一）生活活动导致人与对象之间的诗意情感关系\n\n人作为与自然相对的一方，其感觉可以同对象保持一种自由的关系。人的某些感觉能力可能不及动物，但人可以根据自身所处的条件自由地选取感觉事物的角度。与动物感觉事物的单一角度相比，人感觉事物的角度是多样化的。由于人的感觉可以与对象保持一种自由的关系，对事物有多种选择的可能，所以人的感觉不会被束缚在本能感觉的范围内。人的感觉不但可以同对象发生功利的、伦理的、道德的关系，而且还可以发展成为一种诗意情感关系，文学艺术正是人的感觉中这种诗意情感高度发展的产物。\n\n（二）生活活动导致人的自觉能动的文学创造\n\n动物的感觉只能是出于所属的种的尺度去建造，因此它是遗传技能赋予的感性的感觉；人的感觉除此之外还与后天的学习、思考、锻炼相关，它在具有感性形式的同时又积淀着理性的内容。同时，人的感觉作为感性活动，它不是被动的、消极的，而是积极主动、富于创造性的。文学作为人的一种活动形态，它不是被动的、消极的，而是一种合目的性与合规律性的自觉能动的创造，在这种创造中，可以达到感性与理性的统一，也就是达到全面地表现人的本质特征的目的。\n\n（三）生活活动使文学成为人的本质力量的确证\n\n人的生活活动，无论是物质的还是精神的，由于人的主体能动的参与，既使对象被改变得符合人的要求，又使对象呈现出人的本质力量。人的生活活动作为对人的本质力量的确证，实际上是审美产生的基础。在审美活动中，人在直观的层次上是审“对象”，而在深蕴的层次上，却是通过对象来间接地审“自己”。只有在先在的本质力量对象化的过程中，才能实现自然成为具有人的本质力量的对象。与此相应，文学活动作为一种审美活动，也是人的本质力量的确证。通过创造和欣赏文学，人的本质力量可以尽情地展现出来。\n\n二、文学活动在生活活动中的位置\n\n人的生活活动是一个复杂的多层次系统。马克思将其概括为两大基本层次：物质实践活动和精神活动。物质实践活动，是直接满足人的生存需要的生产活动，是一切其他活动的基础。精神活动是指人的意识领域的活动，它是在物质实践活动的基础上产生和发展的，一方面决定于物质实践活动，另一方面也对物质实践活动具有能动的反作用。文学活动基本上属于精神活动的范畴。\n\n精神活动又可以按与物质经济基础的关系划分为非意识形态的精神活动和意识形态的精神活动。非意识形态的精神活动，主要是指自然科学，它们与物质经济基础没有必然的联系，可以为不同的经济基础服务，也不随经济基础的改变而改变。而意识形态性的精神活动，则是建立在一定的物质经济基础之上，并为该经济基础服务的，所以也称为观念性的上层建筑，如政治、法律、道德、宗教、哲学、文学艺术等。其中政治、法律、道德等距离物质经济基础较近，可以直接为经济基础服务；而宗教、哲学、文学艺术等，与物质经济基础的联系具有间接的性质，所以恩格斯称之为“更高的即更远离物质经济基础的意识形态”。总之，文学活动作为一种审美精神活动，在人的生活活动中处于重要地位，并且具有意识形态特征。", "keywords": "生活活动是文学活动的前提 诗意情感关系 自觉能动的文学创造 人的本质力量的确证 物质实践活动 精神活动 非意识形态的精神活动 意识形态性的精神活动", "note": "文学活动来源于生活活动，又高于生活活动。文学活动能够引导生活活动更加有质量。生活活动具有以下几点内涵：它体现为人和自然交换的过程，它具有合目的性与合规律性相统一的特性，并且它是对人本质力量的确证。文学活动作为生活活动的一个方面，它以意识形态话语的方式来描述生活；同时，它本身也是生活的一部分，创造出人们审美的和想象 的世界。", "framework": ""}, {"id": "126", "stars": 4, "title": "简述生活活动所具有的美学意义", "body": "人的生活活动是文学活动的前提，对此，我们可以从三个方面来说明：\n\n一、生活活动导致人与对象之间的诗意情感关系\n\n（一）人的生产活动是人的生活活动的基础，它是在人和自然之间展开的一个过程。在生产劳动中，人改造了自然，使自然变成了人化的自然；同时，人在改造自然的过程中也改造了自己，丰富了自己。这就是所谓的人的本质力量对象化的过程。在人与自然的交换过程中，人以自身的本质力量作用于自然，使自然不仅脱离不适宜于人生活的原始的粗糙状态，而且在这种被改造过的自然中展现人的肉体和精神的力量；而自然又提供了一个场所，使人得到锻炼，进一步充实了自身的本质力量。\n\n（二）人的生活活动的美学意义在于，人作为与自然相对的一方，其感觉可以同对象保持一种自由的关系。人的某些感觉能力可能不及动物，但人可以根据自身所处的条件自由地选取感觉事物的角度。与动物感觉事物的单一角度相比，人感觉事物的角度是多样化的。由于人的感觉可以与对象保持一种自由的关系，对事物有多种选择的可能，所以人的感觉不会被束缚在本能感觉的范围内。人的感觉不但可以同对象发生功利的、伦理的、道德的关系，而且还可以发展成为一种诗意情感关系，文学艺术正是人的感觉中这种诗意情感高度发展的产物。\n\n二、生活活动导致人的自觉能动的文学创造\n\n（一）人的生活活动是合目的性与合规律性的统一。所谓合目的性，是指人的活动是有意识、有目的、有计划、根据一定的需要而设计的。而所谓“合规律性”，则是指人的生活活动不是主观随意的，而是合乎或遵循一定规律的。人由于具有自觉意识，而在活动的合规律性上与动物有了质的不同。人活动的合规律性体现着人的自觉意识，从而使得合规律性与合目的性两者在人身上有机地统一起来。\n\n（二）人的活动的美学意义在于：动物的感觉只能是出于所属的种的尺度去建造，因此它是遗传技能赋予的感性的感觉；人的感觉除此之外还与后天的学习、思考、锻炼相关，它在具有感性形式的同时又积淀着理性的内容。同时，人的感觉作为感性活动，它不是被动的、消极的，而是积极主动、富于创造性的。文学作为人的一种活动形态，它不是被动的、消极的，而是一种合目的性与合规律性的自觉能动的创造，在这种创造中，可以达到感性与理性的统一，也就是达到全面地表现人的本质特征的目的。\n\n三、生活活动使文学成为人的本质力量的确证\n\n（一）人的生活活动是对人“本质力量”的确证。人的生活活动，无论是物质的，还是精神的，由于人的主体能动的参与，既使对象被改变得符合人的要求，又使对象呈现出人的本质力量。\n\n人的生活活动作为对人的本质力量的确证，实际上是审美产生的基础。在审美活动中，人在直观的层次上是审“对象”，而在深蕴的层次上，却是通过对象来间接地审“自己”。只有在先在的本质力量对象化的过程中，才能实现“审己”。即使在自然这一审美对象面前，人也是通过“自然的人化”，才使得自然成为具有人的本质力量的对象。人的感觉与思维和意志相结合，体现了造型、组织、想象等各种自由创造的能力。\n\n（二）文学活动作为一种审美活动，也是对人的本质力量的确证。通过创造和欣赏文学，人的本质力量可以尽情地展现出来。借助想象的翅膀，人可以邀游于审美的王国，在诗意的世界中流连忘返，从而使人的本质力量显现出来，使人能更深切地体会到自身的存在价值。", "keywords": "人与对象之间的诗意情感关系 人的自觉能动的文学创造 人的本质力量的确证", "note": "文学活动和生活活动是紧密联系着的，文学来自于生活，作家在生活中所积累的经验成为文学创作的素材，“来源于生活而高于生活”，这句话正是点明了文学活动与生活活动之间的关系。", "framework": ""}, {"id": "127", "stars": 5, "title": "试述文学四要素", "body": "根据美国当代文论家艾布拉姆斯的观点，文学活动应由四个互相依存的要素构成：世界、作者、作品和读者。这四个要素在文学活动中形成相互渗透、相互依存和相互作用的整体关系。\n\n一、世界\n\n世界是文学活动的基本要素之一，在这里主要是指文学活动所反映的客观世界和主观世界。客观世界包括自然万物与社会的历史与现实；主观世界既包括人的思想情感，也包括宗教信仰意义上的超验世界。不论是作为主观世界，还是作为客观世界，人是文学所反映的“世界”的中心。客观的自然作为文学活动的构成世界，必须经过人的观察、体验、分析、研究等，与人的思想感情发生这样那样的关系，最终成为文学活动所反映的世界。即便主观想象的超验世界、魔幻世界、科幻世界等，也都是人对客观世界不同形态的折射。\n\n二、作者\n\n作者，同样是文学活动的基本要素之一。在文学活动中，作者也通过文学创作来表达他的感受和感情，并试图以此唤起读者相应的感受和感情，因而，文学活动也是作者的表现活动。\n\n中国古代很早就重视这一观点。“诗言志”“诗者，志之所之也，在心为志，发言为诗”等，都表达了文学作品是由作者创造出来的思想。不过，在中国，这种“作品是作者情志表现”的观点，与“作品是世界反映”的认识往往和谐共存。钟嵘认为“感伤诗”就是“事物牵于外，情理动于内，随感遇而形于叹咏者”。这里的内和外就分别是指客观的世界和主观的作者。应该指出，文学的表现活动与日常生活中的表现活动是有区别的，后者可能是率性而为，而文学表现要想取得成功，则要经过深思熟虑。\n\n三、作品\n\n文学反映的世界并不等于世界本身，同时，文学表达的情感也不同于作者内心的实际感受，这两种不同终究要在作品中显现出来。因此，作品是文学活动的又一基本要素。作品显现出的与现实的差异，是其短处，也是其长处。从根本上讲，其短处在于艺术描写并不能达到丝毫不差、原原本本地再现现实，所谓“画饼不能充饥”；但也由于这一差异，艺术描写才充分显示出文学的独特长处：可以超越事物的本真形态，去创造更具有普遍性的、更深层的意蕴。作者在作品表达上的创新，不只是一个作品是否“好看”的问题，在某种程度上讲，也是一种新的观照事物、观察人生的方式，因而使得作品具有了超越具体内容表达的独立价值。\n\n四、读者\n\n文学活动不只是作者创作的活动，它还应包括文学读者进行阅读鉴赏的活动。只有经过读者阅读鉴赏，作者创作的文本才能实现其价值。因此，读者是文学活动的又一个基本要素。读者阅读文学作品，既是从作品中了解作者的思想，了解作品中描写的人情世态的活动，同时也是读者在自己的生活经验、文化修养的基础上，运用想象、联想而使作品内涵在头脑中具体化的活动，是文本含义的具体化和再创造过程。", "keywords": "世界 作者 作品 读者", "note": "①艾布拉姆斯的《镜与灯》中提到的文学活动四要素非常重要，许多问题只是问法不同，只要稍稍灵活变动一下答题的思路和顺序就可以，其实大体内核和框架都是一样的。②此题后面还跟了几道类似题目，大家也要注意不同的切入角度。", "framework": ""}, {"id": "128", "stars": 5, "title": "文学活动四要素之间的关系如何？", "body": "作家、作品、读者同属文学活动的四要素，在文学活动中形成相互渗透、相互依存和相互作用的关系。\n\n按照哈贝马斯的理解，任何两个具有言语和行为能力的主体都可以用符号（语言）作为中介达成一种对话关系。文学作为一种语言符号系统，是交往理性得以展开的理想场所。具体来说，围绕着作品这个中心，作者与世界、读者建立起一种话语伙伴关系。其中，分别构成了若干对主体间性关系，包括自我与自我（作者与作者）、自我与现实他者（作者与此岸世界，包括自然和社会）、自我与超验他者（作者与彼岸世界）以及自我与潜在读者（作者与读者）彼此展开对话。\n\n因此，文学活动系统是由世界、作者、作品、读者构成的一个交往结构。文学作为一种话语活动，这四个基本要素不是彼此孤立或静止存在的，而是相互依存、相互渗透、相互作用的，它们共同构成一个有机的活动系统。围绕着作品这个中心，作者与世界、读者之间建立起来的是一种话语伙伴关系。\n\n其中，人类的生活世界是文学活动产生、形成和发展的客观基础，它不仅是作品的反映对象，也是作者与读者的基本生存环境，是他们能通过作品产生对话的基础；作者则是文学生产的主体，他不单是写作作品的人，更是参与建立文学规范并把自己对世界的独特审美体验通过作品传达给读者的主体；至于读者，作为文学接受的主体，不仅是阅读作品的人，而且是与作者生活于同一世界的主体，双方通过作品进行潜在的精神沟通；而作品，作为显示客观世界的“镜”和表现主观世界的“灯”，作为作者的创造对象和读者的阅读对象，是使上述一切环节成为可能的中介。作品既是作者本质力量对象化的显现，也是读者本质力量对象化的显现。因此，在文学活动中，主体和对象的关系始终处于发展与变化之中。一方面是主体的对象化，另一方面又是对象的主体化，正是在主体对象化和对象主体化的互动过程中，才生动地显示出了文学所特有的社会的和审美的本质属性。", "keywords": "相互渗透、相互依存和相互作用 语言符号系统 交往结构 作者 文学生产的主体 读者 文学接受的主体 作品中介", "note": "以上先为大家列举了相关理论说明，具体可以结合艾布拉姆斯的作品《镜与灯》来回答这个问题。《镜与灯：浪漫主义文论及批评传统》以18世纪美学为主要参照，对19世纪浪漫主义文论及批评传统作了深刻论述，并对西方文论史作了全面回顾与总结，该书将西方文学批评概括为模仿说、实用说、表现说和客观说四种理论；把作品、世界、作家和读者概括为批评的四种要素，这些观点已经被世界文艺理论和批评界广泛接受和认可。", "framework": ""}, {"id": "129", "stars": 5, "title": "文学活动的四种理论视角的各自理论依据是什么？请简述之，并指明它们的片面性", "body": "美国当代文论家M.H.艾布拉姆斯在《镜与灯-浪漫主义文论及批评传统》中提出了文学活动四要素说：世界、作家、作品、读者。他认为文学作为一种活动，总是由作家、作品、世界、读者四个要素组成的。文学理论所把握的不是这四个要素中孤立的一个要素，而是四个要素构成的整体活动及其流动过程和反馈过程，这四个要素在文学活动中形成相互渗透、相互依存和相互作用的整体关系。文学活动的四种理论视角分别是世界视角、作者视角、作品视角、读者视角。从上述每一个要素视角出发，都会看到文学的一个重要方面。但如果只从任何一个视角看文学，也都会暴露片面性。\n\n一、世界：世界即现实世界、社会生活\n\n文学与生活密切相关，文学中的客观材料与主观情思来源于社会生活，生活是文学艺术的唯一源泉。从古希腊的“模仿说”，到近代的“再现论”，再到我国解放后的“反映论”都大体表达了这样的认识，都强调文学与生活世界的联系。其理论依据是：文学是一种意识反映行为，没有反映对象，就没有反映；文艺起源于对自然的摹仿；文学作品中确实包含着现实世界的影子。这也是其合理性之所在。\n\n不过，如果只看到文学与生活世界的联系，看不到二者的区别，看不到文学同时也是一种作家的主观表现，就具有片面性。\n\n二、作者：文学是作者创作的\n\n作者通过创作文学作品，表达自己的生活感受，并试图唤起读者的相应感受，因此，文学也是一种作者的表现活动。从中国古老的“诗言志”“诗缘情”到西方的“心灵表现论”，都认为文学是作者心灵与情感的表现。其理论根据是：文学是作家“情动”与要表达情感的产物，文学中也确实包含着作者主观的思想情感与理想。当然，作品中的情感同生活中原初的情感在强度与指向上都有区别，它趋于高尚。\n\n不过，倘若只把文学看作作者情感的表现，而看不到文学与生活的联系，看不到作品有其自足性，也是片面的。\n\n三、作品：作品是文学的最终表现形式\n\n即反映生活也好，表现作者思想情感也好，最终都要表现为文学作品。不过，作品并不原本地再现生活和表现作者生活中的情感，这是其短处，也是其长处，即它是按美的规律改造了生活与情思。它可以超越事物的本来形态，创造出更具普遍性的审美世界，包含更深广的意蕴。这说明文学作品确实有其审美的独立自足性。\n\n但如果过分强调了这一点，而割断了文学作品与生活、与作者的联系，也是片面的。20世纪俄国的形式主义与英美新批评就是这样，一味强调作品本身的形式价值，提出了“文学本体论”，认为文学活动的本体只在于作品而不是外在的世界与作者。其所说的作品不指内容与形式的统一体，而仅指作品形式的隐喻、语境、反讽等语言学因素。从而表现出片面性。\n\n四、读者\n\n文学只有经过读者的阅读，文本的价值才能实现，而读者的阅读，既是对作品人情世态与作家思想感情的了解与“复原”，又是一种“再创造”，即根据自己的生活经验与文化修养对作品意义进行具体化的理解，其结果必然与作品原意有所重合，也有所不同。\n\n20世纪60年代兴起的接受美学与读者反应批评强调文学欣赏与接受不是被动的，而是主动的、创造性活动，认为作品由作家与读者共同创造的，有其积极意义。但他们太夸大了文学接受中的再创造，宣布文本一经写出，“作家就死了”，作品任由读者去理解，有否认作品“原意”的意向，暴露出片面性。", "keywords": "世界 密切相关 来源于社会生活 作者 作者的表现活动 作品 最终表现形式 读者 主动的、创造性", "note": "①从某种意义而言，这四个要素基本是文学理论这一科目的全部支撑，命题概率相当之大，必须全面掌握。②这四个要素是相互联系、相互作用，不断循环，构成了文学活动，我们的文学理论是对这四要素构成的整体进行研究，单独拿出哪一点都是有所偏颇的。", "framework": ""}, {"id": "130", "stars": 3, "title": "关于文学起源有几种学说，试简述和评论", "body": "关于文学的发生，影响较大的主要有四种学说，即巫术发生说、宗教发生说、游戏发生说、劳动说。\n\n一、巫术发生说\n\n所谓巫术，就是一套约定俗成的有目的和意义的行为方式系统，也可以说是一套前文明的世界观。其特点是总要采用一定仪式，使巫师由人过渡为神或具有神性的人的表征。\n\n巫术发生说认为文学并非直接来源于巫术，而是认为巫术的生产过程对文学创作有某种启发意义。甚至，巫术活动的仪式化还为某些文学类型提供了直接的借鉴，比如在金枝传说中，杀“国王”的仪式就已经有了戏剧艺术的胚芽。\n\n二、宗教发生说\n\n宗教发生说认为文学源于宗教，在历史上，宗教与文学有着相当密切的关系，文学艺术受到宗教的影响，这点集中表现在欧洲中世纪，当时的欧洲文艺主要反映宗教题材，其发展也受到基督教的制约。\n\n三、游戏发生说\n\n游戏发生说代表人物是康德，他认为艺术活动是人类想象力的游戏，是一种“自由的游戏”，其本质特征就是无目的的合目的性或自由的合目的性，换言之，艺术作为自由的游戏，就是合目的性和无目的性、有意图性和无意图性、艺术和自然的统一。席勒和斯宾塞发展了康德这一思想，提出了过剩精力这一概念，认为生产力发展到一定水平后，人类除了满足自身的物质需要外，还有多余的时间和精力，人们打发多余时间和精力的方式就是游戏。\n\n四、劳动说\n\n劳动说认为劳动是文学发生的起点。首先，劳动提供了文学活动的前提条件，人要满足基本生存需要后才能从事其他活动，人就是在这种生产活动中生成的，劳动创造了人本身。其次，劳动产生了文学活动的需要，在史前人类的集体劳动中，为了协调行动，交流情感与信息，减轻疲劳等，从而产生了语言和最初的文学。再次，劳动构成了文学描写的主要内容，远古时代遗存的作品中大都描写了当时人们劳动生活的内容，而舞蹈动作中多以采集种子等劳动活动为反映对象。最后，劳动制约了早期文学的形式，早期文艺中，诗、乐、舞三位一体实则是劳动过程中这几种艺术形式的萌芽因素（劳动动作、劳动号子的呼喊、劳动时发出的声音和节奏）统一在一起的反映。\n\n这几种文学观念虽存在着分歧，但也有某种共识，即各种文学观都涉及了文学的审美性，都意识到了文学的存在和发展与人类的审美活动有关，都承认文学具有想象和虚构的特点。随着文学的发展、成熟和独立，中外文学理论都开始越来越强调文学的特殊性，强调审美、想象、情感、形象、虚构以及语言等等因素对文学的规定，于是逐渐形成了狭义的即审美的文学观。审美文学观的出现，说明人们对“什么是文学”有了更进一步的理解和把握。", "keywords": "巫术发生说 宗教发生说 游戏发生说 劳动说", "note": "历来的研究者对文学的起源众说纷纭。其中起源于游戏和起源于宗教魔法等观点影响较大。马克思主义认为，文学最初起源于人类的劳动实践。劳动实践不仅创造了原始人灵巧的手、发达的头脑和语言，给人类从事文学艺术创作活动提供了物质前提，而且还给最初的文学艺术提供了“范本”。因此说，劳动创造了人，也创造了文学。", "framework": ""}, {"id": "131", "stars": 4, "title": "简述关于艺术起源问题的“劳动说”", "body": "马克思认为，文学起源于人的生产劳动，最早的文学艺术作品产生于人类的劳动过程。把劳动作为文学发生的起点，主要有以下几方面的原因：\n\n一、劳动提供了文学活动的前提条件\n\n人类的生产活动是一切其他基本活动的前提，这一方面在于人要满足基本生存需要后才能从事其他活动，另一方面在于人就是在这种生产活动中生成的。人并不是本来就优于其他动物的，只是在漫长的进化过程中，人通过劳动锻炼了自己的大脑，并且在劳动中把前肢从行走任务中解放出来，演变为灵巧的双手，又在劳动中为了需要而创造出具有丰富表意功能的语言系统，这样，人才从一般动物界中分离出来。因此恩格斯说，劳动“是一切人类生活的第一个基本条件，而且达到这样的程度以致我们在某种意义上不得不说：劳动创造了人本身”。\n\n二、劳动产生了文学活动的需要\n\n人的活动都伴随着一个自觉的目的，而这一目的又是为某种需要而设定的。史前人类在集体进行的劳动中，为了协调行动、交流情感与信息、减轻疲劳等，就由这些需要产生了语言和最初的文学。\n\n三、劳动构成了文学描写的主要内容\n\n远古时代遗存的作品中大都描写了当时人们劳动生活的内容。在原始民族中，狩猎部落都以动物作为图腾，而且其舞蹈也大多是模仿动物的动作。反之，种植部落则可能以植物花朵作为偶像，其舞蹈动作中多以采集种子等劳动活动为反映对象。\n\n四、劳动制约了早期文学的形式\n\n各民族最早的文学体裁是诗，而诗在当时是必须吟唱的，而且它以载歌载舞的方式来传达。因此早期的文艺是诗、乐、舞三位一体的结合体。这种早期文艺的形式同劳动过程直接相关，原始人将劳动动作和被狩猎的动物的动作衍化为舞蹈，劳动时的号子与呼喊发展为诗歌，而劳动时发出的各种声音和体现的节奏，则为原始人提供了音乐的灵感。诗、乐、舞三位一体，实则是劳动过程中这几种艺术形式的萌芽因素统一在一起的反映。", "keywords": "提供前提条件 产生需要 构成主要内容 制约了早期文学的形式", "note": "“劳动说”即“艺术起源于劳动说”的简称，所谓“艺术起源于劳动”，通常意义是说艺术来源于劳动，艺术是劳动的产物，它伴随着劳动而产生。但在实际中，“劳动说”的内涵远比“艺术起源于劳动说”要宽泛，凡是强调艺术与劳动之间关系的，劳动对艺术的作用的，都属于“劳动说”。这里，“劳动”的概念是非常宽泛的，它可以简单地替换成“社会实践”。为了论述的方便，我们把前者称为“狭义劳动说”，后者称为“广义劳动说”。", "framework": ""}, {"id": "132", "stars": 3, "title": "谈谈你对文学起源的“劳动综合论”的认识", "body": "所谓劳动综合论，就是把劳动看做文学发生的起因，以劳动为中心，并结合其他因素来说明文学起源的过程。这一理论是对模仿论、游戏论、巫术论、劳动论的一种综合，因而包含着更多的合理性。劳动综合论主要包括两个要点：\n\n一、把劳动看做文学产生的起因，是文学产生的最深刻的根源\n\n这方面的观点可以归纳为以下几条：\n\n（一）劳动是人类其他一切活动的首要前提。历史唯物主义的一个基本原理就是承认物质生产劳动是整个人类生活的基础。人的其他一切活动最初都是融合在生产劳动之中，只是随着劳动的发展，它们才逐渐从劳动中分化和独立出来。因此，离开了劳动这个根基，人类的政治的、法律的、宗教的、文化的以及艺术的活动就不可能得到科学的解释。因此，我们认为，只有劳动才是文艺的起因。\n\n（二）人们所强调的文学起源的其他因素，如摹仿、巫术、游戏等，它们的萌芽形态最初也是孕育在劳动之中的，因而这些因素本身也都需要通过劳动才能得到科学的说明。正是在劳动中，原始人为了达到某种预期的效果，就必须对自然有所了解和认识，由此产生了人的最初的摹仿行为。\n\n正是在劳动中，原始人一方面由于感受到自身的力量而激发起对自然的更强的征服欲，另一方面又由于感受到自然的巨大威力而滋生出对自然的敬畏心，这种征服欲和敬畏心的交合就构成了巫术赖以产生的心理基础，而这一心理基础又是在长期的劳动中积淀而成的。也正是在劳动中，原始人或许因为狩猎的成功而禁不住相互追逐、嬉戏和手舞足蹈，这大概就是人类最初的游戏活动。这种游戏活动其实就是原始人对自己取得劳动成果的庆贺，对自己在自然中显示出来的本质力量的欣赏和肯定。\n\n总之，劳动催生了人类的摹仿、巫术、游戏等活动的最初的萌芽，也当然是产生文学的所有动因的动因。\n\n（三）劳动创造了人本身，也创造了能够从事文学活动的主体本身。文学创作要求创作主体具备两大条件，即一定的思维能力和语言能力。一定的思维能力是指能够把人自身从自然界中区分出来的能力。一定的语言能力也是文学创作的必要前提，没有一定的语言能力也就无所谓文学创作。而文学创作所必需的思维和语言能力以及审美能力都是劳动的产物，没有劳动，任何意义上的文学创作都是不可能的。\n\n二、在承认劳动是文学发生的唯一起因的前提下，也对其他因素的作用给予充分的重视\n\n尽管劳动在文学起源中的作用是根本性的，但并非总是直接的，在更多的时候是通过许多的中间因素而间接地表现出来，在这种情况下，这些中间因素就成为必不可少的了。因此，不仅是劳动，人类生活的各个方面都可能对文学起源过程发生重要的影响。\n\n例如，维系着一个群落得以繁衍下去的性爱活动，关系着一个部族的生死存亡的战争活动，寄托着原始人的全部幻想和愿望以至于成为他们的精神支柱的巫术活动，以及给他们带来娱乐和休息的游戏活动，反映了他们的知识水平的摹仿活动，等等，所有这些活动都与原始的文学活动交织在一起，都不可能不在原始文学中留下或多或少的痕迹，也不可能不对原始文学的发生和发展起到或大或小的促进作用。无视这些作用，或者以劳动取代这些作用，都是不正确的。\n\n总之，劳动综合论既反对把文学起源简单地归结为劳动一个因素，也反对把劳动混同于一般的因素。它的核心思想是，在承认劳动为唯一起因的前提下坚持多因素论，在承认劳动的根本作用的前提下坚持多因素的综合作用论。", "keywords": "劳动 起因 最深刻的根源 首要前提 萌芽形态 孕育在劳动之中 创造了人本身 创造了主体本身 其他因素充分的重视", "note": "所谓劳动综合论，既是从综合的角度审视劳动及其他要素在文学发生中产生的作用。这其中，毫无疑问要坚持劳动起源论，将劳动视为文学产生的最深根源，同时又要重视其他因素在文学发生中的作用，不能只关注劳动而不关注其他因素。总之，就是要辩证地进行分析看待。", "framework": ""}, {"id": "133", "stars": 4, "title": "试辩证说明文学发展的各种原因", "body": "历史上就文学发展的动力问题曾有不同的理论阐述。有的认为文学发展的动力是社会风气的变化；有的认为文学的发展与时代的变化密切相关；有的学者从文学内部来探求文学发展动因，认为文学的发展就像自然界运行一样，只在于它的内在动因；还有学者认为文学的发展只是文学固有因素的不同组合引起了形态变化。我们认为，文学发展的原因是多方面。\n\n一、文学发展的根本力量仍然是生产劳动\n\n文学伴随生产劳动而产生，并随着生产劳动的发展而发展，其发展的根本力量是生产劳动。但文学发展的进程也有特殊的情况，就是它的发展同经济发展并不总是同步的，有时显得快些，有时来得慢些，有时甚至同生产呈反方向的发展。这就是马克思所说的物质生产与艺术生产发展的“不平衡关系”。这种“不平衡”有两种典型的体现：一种情况是某些文艺类型只能兴盛在生产发展相对低级的阶段，随着生产力的发展，它的繁荣阶段也就过去了，如古希腊神话和史诗。另一种情况是艺术生产与物质生产的发展水平并不是呈正比例的，经济落后的国家或地区可能在文学艺术上反而领先，如18世纪的德国和19世纪的俄国。\n\n但在总体的方面看，或者我们从相当长的历史阶段来分析，那么文学发展的水平就在经济发展水平的曲线上左右摆动，二者之间总是大致平衡的。因此，物质生产或者说经济基础是文学发展中起“最终的支配作用”的东西。\n\n二、上层建筑\n\n起“最终的支配作用”的因素并不等于唯一的因素，影响文学发展的除了经济基础以外，还有作为上层建筑的政治、道德、哲学、宗教等观念以及一些涉及文学发展的制度、政策、设施，它们甚至会对文学发展产生更直接的影响。一般而言，政治、法律开明或失控时文学繁荣。这正是文学与经济发展不平衡的原因。\n\n三、自身规律\n\n文学艺术内部也受自身规律的影响，新的内容的发现，新的形式的探讨与成型，需要一个过程。\n\n从这些论述可以推断，在根本上应说是经济因素决定了文学发展，但在直接意义上往往是上层建筑各部门的相互影响制约文学的发展。考察文学的具体变化，要全面认识。", "keywords": "生产劳动“不平衡关系”“最终的支配作用”上层建筑 自身规律", "note": "文学发展的原因既要考虑外在的因素，也要考虑内在的因素。文学自身的发展是有规律的，以古代的各种文体为例，诗词文赋都有它们的发展起落，内容和形式有变化和革新，对于整个文学也是如此。", "framework": ""}, {"id": "134", "stars": 3, "title": "谈谈你对马克思物质生产与艺术生产发展的“不平衡关系”论述的理解和体会", "body": "马克思指出“就某些艺术形式，例如史诗来说，甚至谁都承认：当艺术生产一旦作为艺术生产出现，它们就再不能以那种在世界史上划时代的、古典的形式创造出来；因此，在艺术本身的领域内，某些有重大意义的艺术形式只有在艺术发展的不发达阶段上才是可能的。”马克思这一段话主要指出了物质生产与艺术生产发展的“不平衡关系”。\n\n一、不平衡关系的体现\n\n文学伴随着生产劳动而产生，并随着生产劳动的发展而发展，但文学发展的进程也有特殊的情况，就是它的发展同经济发展并不总是同步的，有时显得快些，有时来得慢些，有时甚至同生产呈反方向的发展。这就是马克思所说的物质生产与艺术生产发展的“不平衡关系”。这种“不平衡”有两种典型的体现：\n\n一种情况是某些文艺类型只能兴盛在生产发展相对低级的阶段，随着生产力的发展，它的繁荣阶段也就过去了，如古希腊神话和史诗；\n\n另一种情况是艺术生产与物质生产的发展水平并不是呈正比例的，经济落后的国家或地区可能在文学艺术上反而领先，如18世纪的德国和19世纪的俄国。\n\n二、文学发展与经济发展的平衡关系\n\n其实，“不平衡关系”只是说明了文学发展与经济发展关系的一个方面，而这一关系的另一方面则是两者发展上的平衡关系。就是说，经济的物质生产的活动的发展水平会最终制约文学发展水平。例如，法国经济发展不及英国，德国经济又不及英法两国，而经济相对落后的一方在文学与哲学上却有更大成就，这一比较显示出不平衡关系；但是法、德两国在文学与哲学上的成就又与当时各自经济的高速发展的状况是适应的。\n\n三、不平衡与平衡共存\n\n进一步说，不平衡与平衡两者共存于文学与经济发展的关系之中，从局部的情况，或者从某一历史时期的情况看，不平衡关系确实是存在的，但在总体的方面看，或者我们从相当长的历史阶段来分析，那么文学发展的水平就在经济发展水平的曲线上左右摆动，二者之间总是大致平衡的。因此，物质生产或者说经济基础是文学发展中起“最终的支配作用”的东西。", "keywords": "“不平衡关系”两种典型的体现 生产发展相对低级 不是呈正比例 平衡关系共存", "note": "物质生产的发展决定了文学的发展，但并不是文学发展的唯一因素。文学发展还会受到许多其他因素的影响。正是在这些因素的影响下才会出现不平衡的现象。但文学发展从总体看，还是大体平衡的，不平衡多半存在于局部，在短的时期内出现。平衡与不平衡共存于文学发展与物质生产发展的关系中。", "framework": ""}, {"id": "135", "stars": 3, "title": "谈谈你对经济基础与文学艺术之间所存在的各种“中介”，“变量”及“不平衡性”等的理解", "body": "一、文学活动的地位\n\n（一）物质实践活动、精神活动\n\n人的生活活动是一个复杂的多层次系统。马克思将其概括为两大基本层次：物质实践活动和精神活动。物质实践活动，是直接满足人的生存需要的生产活动，是一切其他活动的基础。精神活动是指人的意识领域的活动，它是在物质实践活动的基础上产生和发展的，一方面决定于物质实践活动，另一方面也对物质实践活动具有能动的反作用。文学活动基本上属于精神活动的范畴。\n\n（二）精神活动又可以按与物质经济基础的关系划分为非意识形态的精神活动和意识形态的精神活动\n\n非意识形态的精神活动，主要是指自然科学，它们与物质经济基础没有必然的联系，可以为不同的经济基础服务，也不随经济基础的改变而改变。\n\n而意识形态性的精神活动，则是建立在一定的物质经济基础之上，并为该经济基础服务的，所以也称为观念性的上层建筑，如政治、法律、道德、宗教、哲学、文学艺术等。其中政治、法律、道德等距离物质经济基础较近，可以直接为经济基础服务；而宗教、哲学、文学艺术等，与物质经济基础的联系具有间接的性质，所以恩格斯称之为“更高的即更远离物质经济基础的意识形态”。\n\n总之，文学活动作为一种审美精神活动，在人的生活活动中处于重要地位，并且具有意识形态特征。\n\n二、经济基础与文学艺术之间的“中介”“变量”及“不平衡性”\n\n（一）文学作为意识的形态，一方面最终决定于社会的经济基础，也就是说，对于文学的情形归根到底要由经济基础来说明；另一方面，它与经济基础的关系不是直接的，而是间接的有距离的，它往往要与上层建筑中政治、法律等中介的环节\n\n与经济基础发生联系，而经济基础对于文学的作用也不是直接的，也要通过政治等中介环节才能发生支配性的作用。因此文学活动的发展往往会和经济发展呈现出不平衡的状态。\n\n（二）文学伴随生产劳动而产生，并随着生产劳动的发展而发展，但文学发展的进程也有特殊的情况，就是它的发展同经济发展并不总是同步的，有时显得快些，有时显得慢些，有时甚至同生产呈反方向的发展。这种不平衡有两种典型体现：一种情况是某些文艺类型只能兴盛在生产发展相对低级的阶段，随着生产力的发展，它的繁荣阶段也就过去了，如古希腊神话和史诗；另一种情况是艺术生产与物质生产的发展水平并不是呈正比例的，经济落后的国家或地区可能在文学艺术上反而领先，如十八世纪的德国和十九世纪的俄国。\n\n（三）实际上，不平衡关系只是说明了文学发展与经济发展关系的一个方面，而这一关系的另一方面则是两者发展上的平衡关系，就是说，经济的、物质生产活动的发展水平会最终制约文学发展水平。十八、十九世纪的德国、俄国虽然经济发展相对落后，但在文学与哲学上的成就又与当时各自经济的高速发展的状况是适应的。进一步说，不平衡与平衡两者共存于文学与经济发展的关系之中。从局部的情况，或者从某一历史时期的情况看，不平衡关系确实是存在的，但在总体的方面看，或者我们从相当长的历史阶段来分析，那么文学发展的水平就在经济发展水平的曲线上左右摆动，二者之间总是大致平衡的。因此，物质生产或者说经济基础是文学发展中起“最终的支配作用”的东西。", "keywords": "精神活动 意识形态性的精神活动 意识形态 普遍属性 特殊属性 经济基础 生产劳动 大致平衡 最终的支配作用", "note": "这道题主要是讲文学发展的动力问题，经济基础起决定作用，经济基础处于社会结构的最下层，文学艺术处于社会结构的最上层。它与经济基础的关系不是直接的，而是间接的，它们之间的联系必须通过其他意识形态的中介。而政治道德哲学等就属于影响文学发展的变量，正是因为这些变量的存在，才导致了物质生产与艺术生产发展之间的不平衡性。", "framework": ""}, {"id": "136", "stars": 1, "title": "谈谈文学与政治的关系", "body": "文学艺术最终是受经济基础决定的，同时又受其他意识形态的影响，在这些影响中，政治对文学的影响最大最直接。具体地说，这种影响因政治表现形态的不同主要体现在两个方面：\n\n一、政治制度、设施和方针政策对文学的影响\n\n作为制度、设施和方针政策，政治体现了统治阶级的意志，所以带有强制性，它使政治可以干预社会的文学活动，对文学产生直接的作用。中外文学的发展历程都表明，凡是政治比较开明的统治阶级，都会把文学艺术活动视为调节社会正常动作不可缺少的组成部分，并实行有利于文化繁荣的政策，文学的发展就比较顺利，甚至出现文学繁荣的局面；相反，凡是政治黑暗，思想禁锢的统治阶级，当权者都会实施文化专制的高压政策，包括文学活动在内的整个文化生活都会冷落凋零，文学创作也会停滞不前，甚至出现衰落倒退现象。我国新时期文学的蓬勃发展，唐代文学的繁荣，以及意大利十六世纪佛罗伦萨的文艺复兴，都体现了政治对文学的发展所起的积极作用。\n\n二、作为意识形态的政治思想对文学活动的影响\n\n与政治制度和政治设施不同，政治意识形态对文学的影响一般来讲不带有强制性，它是以人们接受某种政治思想，认同某种意识形态的方式作用于文学活动。因此，政治意识形态对文学的影响就有了更为内在、更为隐蔽的特点。它既可能以旗帜鲜明的政治观点出现，在更多的情况下，也可能以潜移默化的方式浸透在文学活动之中，而表现在作家、作品的思想倾向或情感态度上。\n\n对于作家来说，特定的政治意识形态往往会影响他的审美理想的建构，会成为他观照、理解和表现社会生活的一种尺度或标准，进而制约着他对生活材料的取舍和艺术形象的创造。在中国历史上长期处于优势的儒家政治思想就对古代文学的发展产生了深远的影响，甚至在一些优秀作家的身上，也不难发现这种“怨而不怒”的儒家美学的规范和儒家政治思想的束缚。\n\n政治思想对于文学接受活动的影响就更为常见也更为明显了，其主要体现在读者以政治的观点和方式来理解、解释文学文本的意义和价值，从而发掘了文本所隐含的意识形态内容。", "keywords": "受经济基础决定 其它意识形态 政治影响最大最直接 政治制度、设施和方针政策 强制性 作为意识形态的政治思想 更为内在、更为隐蔽", "note": "在今天，受政治观念支配的意识形态对文学的影响已经超出了国界，成为一种全球性的文化现象。有人称之为“文化帝国主义”，有人称之为“后殖民主义”，它以潜移默化的方式影响甚至改造着他国的本土文化，其中当然也包括文学。文化的后殖民现象说明了政治意识形态对文学活动的影响，会随着政治、经济的全球化日益加剧也日益复杂。", "framework": ""}, {"id": "137", "stars": 2, "title": "当前在文学含义和属性问题上有哪些代表性观点？教材把文学视为话语蕴藉中的审美意识形态，它表现在哪几点上", "body": "一、文学的含义\n\n文学被视为美的“语言艺术”，至少有着两种不同含义：广义的文化含义和狭义的审美含义。\n\n（一）文学的文化含义\n\n文学有理由被视为文化。在中外文学史上，文学最初并不是指今天所谓的“语言艺术”或“美的艺术”，而是泛指广义的文化过程。文学是指一切口头或书面语言行为和作品，包括今天的文学以及政治、哲学、历史、宗教等一般文化形态，这正是文学的文化含义。文化含义上的文学包括带有情感性、形象性的非文学。\n\n（二）文学的审美含义\n\n文学的审美含义是指文学是一种审美形态，是具有审美属性的语言行为及其作品，包括诗歌、小说、剧本、散文等。这是从文学的广泛的文化含义中分离、独立出来的狭义文学观念。文学不再指代用语言或文字传输的所有文化现象，而仅仅指其中富有审美属性的那一部分。这样，文学就成为与政治、哲学、历史、宗教等一般文化形态不同的特殊审美形态了。\n\n二、文学的属性\n\n关于文学本质属性的观点有许多：\n\n（一）模仿论：古希腊人认为：文学是自然的模仿。\n\n（二）言志论：古中国人认为：文学是表达情感的工具。如“诗言志，诗缘情”。\n\n（三）表现论：18世纪西方许多资产阶级学者认为：文学是自我表现。至于表现的内容，不同的人有不同理解：托尔斯泰认为表现情感，弗罗伊德等认为主要表现下意识。日本人厨川白村认为表现苦闷：文学是苦闷的象征。\n\n（四）再现论：19世纪俄国民主主义文论家别林斯基等认为：文学是生活的再现。\n\n（五）形式主义论：现代西方形式主义认为：文学就是文学，文学是一个独立自足体，其意义只在形式，与生活、与作家的心灵、与读者等毫无关系。\n\n（六）反映论：解放后，我国的教材从苏联移植了“文学是社会生活的反映”的反映论，后来逐步达到如下共识：文学是以语言为工具，用形象的方式反映社会生活的审美意识形态。\n\n（七）感受论：《感受论文艺学》认为文学是以语言为符号，以形象的方式表达生活感受，从而反映社会生活的意识形态。\n\n三、文学是话语蕴藉中的审美意识形态\n\n（一）文学的审美意识形态属性\n\n这一属性是指文学的审美表现过程与意识形态相互浸染、彼此渗透的状况，表明审美中浸透了意识形态、意识形态巧借审美传达出来。具体地说，文学的审美意识形态属性表现在，文学成为具有无功利性、形象性和情感性的话语与社会权力结构之间的多重关联域，其直接的无功利性、形象性、情感性总是与深层的功利性、理性和认识性等缠绕在一起。如果从目的、方式和态度三方面来看，文学的审美意识形态属性表现为无功利性与功利性、形象性与理性、情感性与认识性的相互渗透状况。\n\n（二）文学的话语蕴藉属性\n\n文学作为话语，与日常话语、哲学话语、政治话语、科学话语、新闻话语等一般话语不同，它作为社会性话语活动蕴涵着丰富的意义生成的可能性，具有“蕴藉”特点，从而具体的表现为话语蕴藉。进一步看，文学作为话语蕴藉，有两层意思：第一，整个文学活动都带有话语蕴藉属性。文学活动是由创作、作品、接受和批评等环节组成的整体，无论其中心任务或目的如何，都必须依据具体的语言活动构成的话语系统。第二，在更具体的层次上，被创造出来以供阅读的特定文本带有话语蕴藉属性。文本是特定的，但文本的意义似乎是无限丰富的。这两层意思在文学中是统一起作用的。整体的文学话语蕴藉活动需要沉落为具体文本的话语蕴藉，而文本的话语蕴藉也应当纳入完整的社会话语蕴藉实践中去阐明。", "keywords": "文化含义 审美含义 模仿论 言志论 表现论 再现论 形式主义论 反映论 感受论 审美意识形态属性 话语蕴藉属性", "note": "文学是一种语言艺术，是话语蕴藉中的审美意识形态。文学是一门艺术，是主要表现人类审美属性的语言艺术， 包括诗歌、小说、散文、剧本等文类。与此含义不相符的哲学、历史学、科学、宗教学、伦理学等其他文化形态，当然就不属于文学范畴，而被划分到非文学。", "framework": ""}, {"id": "138", "stars": 4, "title": "文学有哪两种含义，现在通行的文学含义是什么", "body": "文学被视为美的“语言艺术”，至少有着两种不同含义：广义的文化含义和狭义的审美含义。\n\n一、文学的文化含义\n\n文学有理由被视为文化。在中外文学史上，文学最初并不是指今天所谓的“语言艺术”或“美的艺术”，而是泛指广义的文化过程。文学是指一切口头或书面语言行为和作品，包括今天的文学以及政治、哲学、历史、宗教等一般文化形态，这正是文学的文化含义。\n\n在中国，文学最初是泛指文章和博学，这正体现了文学的广义的文化含义。在西方18世纪之前，文学也往往是在文化含义上使用的，即文学属于一般文化，没有被称为美的“艺术”，可见，无论在中国还是西方，最初居于主导地位的是文学的文化含义。一方面，文学还没有从历史、哲学、演讲术等一般文化现象中分离出来独立发展；另一方面，它所包含的某种特殊审美属性也已经被觉察到了，尽管到后来才被明确地突出出来。\n\n二、文学的审美含义\n\n文学的审美含义是指文学是一种审美形态，是具有审美属性的语言行为及其作品，包括诗歌、小说、剧本、散文等。这是从文学的广泛的文化含义中分离、独立出来的狭义文学观念。文学不再指代用语言或文字传输的所有文化现象，而仅仅指其中富有审美属性的那一部分。这样，文学就成为与政治、哲学、历史、宗教等一般文化形态不同的特殊审美形态了。\n\n三、文学的通行含义\n\n现代文学理论界通行的还是文学的审美含义：文学主要被视为审美的语言作品。文学的审美含义在现在通行，是由多方面因素造成的，主要有两方面。\n\n（一）人类活动的持续发展，促进了人类符号表意能力的发展与丰富，使得文学这类专门的审美表现领域得以从一般文化形态中独立出来。\n\n（二）现代性在全球的扩展，推动了世界文化、学术、学科的分类机制的建立与健全，而在各种人类活动的合理化分工机制中，文学被划分到审美一表现领域，专门承担以符号形式表现审美体验的任务。审美-表现领域是关于人类的审美活动的符号表意领域，通常包括文学、音乐、戏剧、绘画、雕塑等门类。与审美一表现领域相对的两个领域是：关于人类的认知与工具活动的认识一工具领域，关于人类的社会行为与协调活动的道德一实践领域。\n\n由于人类活动的长期发展和现代分类机制的合理化作用，文学的通行含义形成了：文学是艺术门类之一，是主要表现人类审美属性的语言艺术，包括诗歌、小说、散文、剧本等体裁。文学的文化含义无疑有其合理处：文学虽然直接呈现审美景观，但毕竟长期以来就是文化的一部分，折射出文化的风云变幻，并且与哲学、历史、政治、宗教等具体文化形态形成相互渗透的复杂关系。因此，应当指出：文学诚然是一种审美-表现活动，但实际上无法与社会的文化过程分离开来。", "keywords": "狭义的审美含义 一切口头或书面语言行为和作品 审美形态 分离、独立 通行含义 审美含义 审美-表现活动 社会的文化过程", "note": "文学，是一种用口语或文字作为媒介，表达客观世界和主观认识的方式和手段。当文字不单单用来记录，而被赋予其他思想和情感，并具有了艺术之美时，才可称为文学艺术，属于语言艺术。诗歌、散文、小说、剧本等不同体裁，是文学的重要表现形式。文学以不同的形式即体裁，表现内心情感，再现一定时期和一定地域的社会生活。", "framework": ""}, {"id": "139", "stars": 2, "title": "判断文学与非文学的标准是什么？文学与非文学之间的关系是怎样的？", "body": "判断文学与非文学的标准在于文学的语言富有独特表现力，文学总是要呈现审美形象的世界，总是在历史中不断变更的。所以要历史地、具体地对待文学的含义。事实上，文学的含义常发生复杂的演变，正是在这种演变中，通常意义上的非文学有可能会变成文学，这正显示了文学含义的不确定性与不断变化的特点。\n\n判断文学与非文学的标准并不简单地在于分行排列，而是更为多样：第一，文学的语言富有独特表现力，例如让日常语言富于韵律感；第二，文学总是要呈现审美形象的世界，这种审美形象具有想象、虚构和情感等特性；第三，文学传达完整的意义，本身构成一个整体；第四，文学蕴含着特殊而无限的意味。\n\n文学的含义往往在具体的文学活动中发生演变，尤其是把通常的非文学移位成新的文学。其实，这一点正突出了文学与文化的密切联系：文学本来就是文化的一部分，从文化中既汲取资源又回头施加影响。尤其是现代先锋作家，往往突破现有陈规陋习，从纷纭反复的文化世相中寻求新文学生长的因子，这就可能使文学的含义出现新的变数。某些先锋文学群体也可能以新的文学观去向权威挑战，形成与现成规范不同的文学新“惯例”。同时，每个时代都有自己的文学观念，人们常常会按这种观念去创造新的文学，或者把以往的非文学解读为文学、非经典阐释为经典。可见，文学的含义总在演变中，需要历史地和具体地对待。", "keywords": "不确定性 不断变化 语言富有独特表现力 呈现审美形象的世界 传达完整的意义 蕴含着特殊而无限的意味文学与文化", "note": "③文学的定义是复杂多变的，其会随着具体的文学活动发生改变。而文学本身就是文化的一部分，其从纷纭繁复的文化世相中吸取资源，寻求文学得以生长的因子，这更加加深了文学定义的复杂多变性。定义复杂多变，即可以定义文学和非文学的标准复杂多变。非文学在一定情况下可转化为文学，文学有时候也被解读为非文学。以上三条是判定文学与非文学相对持久恒定的判断准则。②本题也可以话语蕴藉中的审美意识形态等角度切入。", "framework": ""}, {"id": "140", "stars": 3, "title": "谈谈你对文学与意识形态的关系的认识", "body": "文学从本质上说是意识形态。作为意识形态，文学具有普遍的属性，也具有特殊的属性。文学的普遍属性在于，它是一般意识形态；文学的特殊属性在于，它是审美意识形态。\n\n一、文学作为一般意识形态的形式\n\n社会的经济基础是与一定的物质生产力相适应的、由社会关系的总和构成的、社会赖以生存和发展的现实物质基础。上层建筑就是由经济基础影响和制约的各种制度及情感、信念、幻想、思想方式和世界观的总和，包括法律、政治、宗教艺术、哲学等“意识形态的形式”。显然，文学作为语言艺术，其基本属性就在于“意识形态的形式”。文学作为意识形态的形式，一方面最终决定于社会的经济基础，另一方面，它对经济基础具有能动作用。\n\n二、文学作为审美意识形态的形式\n\n意识形态的具体形式多种多样，简要地说，就有哲学、政治、法律、道德和审美等。审美意识形态是意识形态的多样形式之一，而文学正是这样一种审美意识形态的形式。\n\n（一）审美意识形态的形式，是指与现实社会生活密切缠绕的审美表现领域，其集中形态是人们的文学、音乐、戏剧、绘画、雕塑等艺术活动。审美意识形态在意识形态的形式中具有特殊性：它一方面被看做意识形态的富于审美特性的形式，但另一方面又渗透着社会生活以及其他意识形态的形式的因子，与它们复杂地纠缠在一起。因此，审美意识形态不是审美与意识形态的简单相加，而是指在审美表现过程中审美与社会生活状况相互浸染、彼此渗透的情形。\n\n（二）文学作为审美意识形态的形式，是要在具体的语言组织中显示特定社会生活的种种情状。由字、词、句、段、篇等组成的具体文学语言系统，看起来只是一次远离社会生活的个体审美事件，但归根到底总是社会生活复杂的想象性再现。文学的审美意识形态属性，是指文学的审美表现过程与意识形态相互浸染、彼此渗透的状况，表明审美中浸透了意识形态，意识形态巧借审美传达出来。文学作为审美意识形态，在无功利性、形象、情感等审美因素中包含着功利、理性与认识等非审美的意识形态因素，因而具有审美与社会意识形态的双重属性。", "keywords": "普遍属性 一般意识形态 特殊属性 审美意识形态 上层建筑 审美意识形态的形式 文学作为审美意识形态的形式", "note": "文学与意识形态是互动的关系，也是相互依存的关系。首先，文学本身就是意识形态的产物，文学作品和文学创作过程，都离不开特定的社会意识形态，都折射出所属意识形态的色彩和特质；其次，文学作品又反作用于意识形态，将作者和创作主体的意识形态通过作品传播，影响所处的社会意识形态。", "framework": ""}, {"id": "141", "stars": 3, "title": "谈谈你对“文学是一种审美意识形态”这种观点的认识", "body": "意识形态的具体形式多种多样，简要地说，就有哲学、政治、法律、道德和审美等。审美意识形态是意识形态的多样形式之一，而文学正是这样一种审美意识形态的形式。\n\n一、审美意识形态的形式，是指与现实社会生活密切缠绕的审美表现领域，其集中形态是人们的文学、音乐、戏剧、绘画、雕塑等艺术活动。审美意识形态在意识形态的形式中具有特殊性：它一方面被看做意识形态的富于审美特性的形式，但另一方面又渗透着社会生活以及其他意识形态的形式的因子，与它们复杂地纠缠在一起。因此，审美意识形态不是审美与意\n\n识形态的简单相加，而是指在审美表现过程中审美与社会生活状况相互浸染、彼此渗透的情形。\n\n二、文学作为审美意识形态的形式，是要在具体的语言组织中显示特定社会生活的种种情状。由字、词、句、段、篇等组成的具体文学语言系统，看起来只是一次远离社会生活的个体审美事件，但归根到底总是社会生活复杂的想象性再现。\n\n三、文学的审美意识形态属性，是指文学的审美表现过程与意识形态相互浸染、彼此渗透的状况，表明审美中浸透了意识形态、意识形态巧借审美传达出来。具体地说，文学的审美意识形态属性表现在，文学成为具有无功利性、形象性和情感性的话语与社会权力结构之间的多重关联域，其直接的无功利性形象性、情感性总是与深层的功利性、理性和认识性等缠绕在一起。如果从目的、方式和态度三方面来看，文学的审美意识形态属性表现为无功利性与功利性、形象性与理性、情感性与认识性的相互渗透状况。\n\n（一）从目的看，文学的审美意识形态属性表现在，文学不带有直接功利目的，即是无功利的，但这种无功利本身也隐含有某种功利意图。文学虽然主要是具有无功利性，但它由于在其话语结构中显示了现实社会关系的丰富与深刻变化，因而间接地也体现出掌握现实社会生活这一功利意图。确切地说，无功利性是直接的，功利性是间接的，直接的无功利性总是实现间接功利性的手段。这一点正从目的层面显示了文学的审美意识形态属性。\n\n（二）从方式看，文学的审美意识形态属性表现在，文学处处以形象感人，但也含有某种理性。文学是形象的，这是由文学直接的审美感性特征决定的；同时，文学又蕴含某种理性，即文学创作、阅读及形象本身都可能与某种间接的或深层的理性考虑有关，这是由文学的人类活动属性本身决定的。总之，文学是形象的，但在深层又具有某种理性。这是文学的审美意识形态属性在表现方式层面的显现。\n\n（三）从态度看，文学的审美意识形态属性表现在文学富于情感性，但也带有某种认识性。文学是情感的。情感这里指审美情感，往往是一种超越个人利害得失而具有人类普遍性的情感。同时文学作为意识形态，必然包含认识因素。认识在这里意味着客观的、理智的反映。文学不仅表达主观情感评价，而且也表达客观理智认识。文学通过审美形象表现作者的主观评价态度，同时也表达其客观理智认识。在文学中，审美情感是直接的，理智认识则是间接的。直接的审美情感的深层往往隐伏着间接的理智认识。\n\n【李凡关键词：审美意识形态 文学作为审美意识形态的形式 文学的审美意识形态属性 目的 无功利性 功利性 方式 形象理性 态度 情感性 认识性】", "keywords": "", "note": "文学作为审美意识形态是一般意识形态的特殊形式，是审美与意识形态的复杂组合形式，从目的看，文学既是无功利性的也是功利性；从方式看，文学既是形象的，也是理性的；从态度看，既是情感的，也是认识的。", "framework": ""}, {"id": "142", "stars": 5, "title": "谈谈你对文学的审美意识形态属性的认识（26浙江工商大学、闽南师范大学）", "body": "文学可以被视为一种审美形态。文学是指具有审美属性的语言行为及其作品，包括诗、散文、小说、剧本等。这正是文学的审美含义。文学的审美意识形态属性，是指文学的审美表现过程与意识形态相互浸染、彼此渗透的状况，表明审美中浸透了意识形态、意识形态巧借审美传达出来。具体地说，文学的审美意识形态属性表现在，文学成为具有无功利性、形象性和情感性的话语与社会权力结构之间的多重关联域，其直接的无功利性形象性、情感性总是与深层的功利性、理性和认识性等缠绕在一起。如果从目的、方式和态度三方面来看，文学的审美意识形态属性表现为无功利性与功利性、形象性与理性、情感性与认识性的相互渗透状况。\n\n一、目的层面：无功利与功利\n\n从目的看，文学的审美意识形态属性表现在，文学不带有直接功利目的，即是无功利的，但这种无功利本身也隐含有某种功利意图。审美的无功利性表现在，审美并不寻求直接的实际利益满足。也就是说在文学活动中，无论作家还是读者在创作或欣赏的状况中都没有直接的实际目的，并不企求直接得到现实利益。由于是无功利的，文学才能是审美的。\n\n（一）文学的这种无功利性集中体现在作家的创作活动和读者的阅读过程中。刘勰《文心雕龙·神思》讲“是以陶钧文思，贵在虚静，疏瀹五藏，澡雪精神”，正是强调创作中要舍弃直接的功利考虑而以淡泊、宁静之心对待。读者也需要保持无功利目的才能进入文学的审美世界：“中国人看小说，不能用赏鉴的态度去欣赏它，却自己钻入书中，硬去充一个其中的角色。所以青年看《红楼梦》，便以宝玉、黛玉自居；而年老人看去，又多占据了贾政管束宝玉的是身份，满心是利害的打算，别的什么也看不见了。”所谓“满心是利害的打算，别的什么也看不见了”，是指读者抱有实际功利目的，致使无功利的审美距离消失，从而无法欣赏小说的美。\n\n（二）文学直接地是无功利的，但间接地或内在地却又隐伏着某种功利性。这一点可从文学作为作家和读者的社会话语活动、作为再现现实社会生活的话语结构两方面看。\n\n第一，作为作家和读者的话语活动，文学虽然与直接的功利目的无关，但间接地仍旧有深刻的社会功利性。这种功利性诚然不同于商人对森林财富的占有欲和科学家对森林科研价值的探究欲，但却显现为审美地掌握世界这一深层目的。\n\n第二，作为再现现实社会生活的话语结构，文学的功利性在于，它把审美无功利性仅仅当作实现其再现社会生活这一功利目的的特殊手段。\n\n（三）文学虽然主要是具有无功利性，但它由于在其话语结构中显示了现实社会关系的丰富与深刻变化，因而间接地也体现出掌握现实社会生活这一功利意图。如此看来，文学是无功利的，但这种无功利又间接地指向某种功利。确切地说，无功利性是直接的，功利性是间接的，直接的无功利性总是实现间接功利性的手段。这一点正从目的层面显示了文学的审美意识形态属性。\n\n二、方式层面：形象与理性\n\n从方式看，文学的审美意识形态属性表现在文学处处以形象感人，但也含有某种理性。形象，这里是指审美形象，即由文学的文本结构所呈现的富于意义的审美感性形态，它是文学的特有存在方式。\n\n（一）与人们认识活动中的感性形象不同，审美形象既具有感性特征，同时又渗透想象、虚构或情感等精神过程；与科学活动中的理性概念不同，文学中的审美形象总是假定的、不确定的或模糊的，而概念则是抽象的，要求确证、确定或明晰。\n\n（二）此外，从意识形态角度看，文学仍然必须依赖理性。只不过，理性在这里是以特殊形式存在的。形象被置入文学、成为文学的直接存在方式，这本身就常常依赖另一种力量-这就是理性的力量。更进一步讲，文学的艺术形象本身就蕴含着某种理性。诚然，文学是由艺术形象构成的世界，但这一世界不是无理性的，而是蕴含理性的。艺术形象充满了活生生的感性直觉，这表面看来超越于理性过程之上，但实际上可能把人导引或提升到一个通常感性和理性都无法达到的至高的理性境界，在这里，人通过对艺术形象的品味而深切地领悟到自身的存在价值。\n\n（三）综上，文学是形象的，这是由文学直接的审美感性特征决定的；同时，文学又蕴含某种理性，即文学创作、阅读及形象本身都可能与某种间接的或深层的理性考虑有关，这是由文学的人类活动属性本身决定的。总之，文学是形象的，但在深层又具有某种理性。这是文学的审美意识形态属性在表现方式层面的显现。\n\n三、态度层面：情感与认识\n\n从态度看，文学的审美意识形态属性表现在文学富于情感性，但也带有某种认识性。\n\n（一）文学是情感的。情感，这里指审美情感，是凝聚在审美形象中的主体态度，如好恶、喜怒、肯定与否定、欢乐与痛苦等。审美情感往往是一种超越个人利害得失而具有人类普遍性的情感。同时，审美情感已不只是单纯情感而是情感的形式或形式的情感。\n\n（二）文学作为意识形态，必然包含认识因素，认识在这里意味着客观的、理智的反映。文学不仅表达主观情感评价，而且也表达客观理智认识。诚然，这种认识往往并不直接呈现于审美形象世界中，但无可否认，它总是可以被归纳出来。\n\n文学的情感性和认识性应当联系起来考察。文学通过审美形象表现作者的主观评价态度，同时也表达其客观理智认识。在文学中，审美情感是直接的，理智认识则是间接的。直接的审美情感的深层往往隐伏着间接的理智认识。", "keywords": "情感性 基本特征 形象性 重要体现 精神境界 心灵自由", "note": "文学具有审美意识形态属性，这实际上告诉我们，文学的属性不是单一的，而是双重的：审美与意识形态复杂地缠绕在一起。由此看，文学具备审美与社会的双重属性：既是审美的又是社会的。", "framework": "无功利 目的 功利 形象 文学的审美意识形态属性 方式 理性 情感 态度 认识"}, {"id": "143", "stars": 3, "title": "结合具体作品论述文学中形象与理性的关系", "body": "一、文学特有的存在方式-审美形象\n\n从方式看，文学的审美意识形态属性表现在，文学处处以形象感人，但也含有某种理性。形象，这里是指审美形象，即由文学的文本结构所呈现的富于意义的审美感性形态，它是文学的特有存在方式。而理性是由概念、判断和推理等所构成的思维过程，它通常被认为与形象方式相对。\n\n与人们认识活动中的感性形象不同，审美形象既具有感性特征，同时又渗透想象、虚构或情感等精神过程；与科学活动中的理性概念不同，文学中的审美形象总是假定的、不确定的或模糊的，而概念则是抽象的，要求确证、确定或明晰。\n\n二、文学中的理性\n\n此外，从意识形态角度看，文学仍然必须依赖理性。虽然无论作家创作还是读者欣赏都主要依赖形象，但是在创作中，理解时代的意识形态氛围，分析素材，构思主题、情节、人物关系，预测读者反应和批评界态度等，常是掺杂在作者的理性过程中的。理性在这里是以特殊形式存在的。\n\n形象被置入文学、成为文学的直接存在方式，这本身就常常依赖于理性的力量。更进一步讲，文学的艺术形象本身就蕴含着某种理性。诚然，文学是由艺术形象构成的世界，但这一世界不是无理性的，而是蕴含理性的。艺术形象充满了活生生的感性直觉，这表面看来超越于理性过程之上，但实际上可能把人导引或提升到一个通常感性和理性都无法达到的至高的理性境界，在这里，人通过对艺术形象的品味而深切地领悟到自身的存在价值。\n\n例如陶渊明的《饮酒》表达出诗人有关归隐田园的理性意图。然而，这种理性意图却不是由哲学推理方式展现，而是通过活生生的形象描绘去实现的。诗人的归隐田园的理性意图往往隐藏在活的形象的审美直觉中。\n\n三、形象与理性\n\n可见，文学是形象的，这是由文学直接的审美感性特征决定的；同时，文学又蕴含某种理性，即文学创作、阅读及形象本身都可能与某种间接的或深层的理性考虑有关，这是由文学的人类活动属性本身决定的。总之，文学是形象的，但在深层又具有某种理性。这是文学的审美意识形态属性在表现方式层面的显现。", "keywords": "方式 审美形象 感性形象 理性概念 依赖理性 特殊形式 深层理性", "note": "文学是形象的，这是由文学的直接审美感性特征决定的；同时文学又蕴含某种理性，即文学创作、阅读及形象本身都可能与某种间接的或深层的理性考虑有关，这是由文学的人类活动属性本身决定的。", "framework": ""}, {"id": "144", "stars": 3, "title": "谈谈对文学话语的认识", "body": "话语（discourse）是与语言、语言系统、言语和文本等存在联系和区别的概念。语言（language）是人类最重要的社会交际工具，话语则是其具体的社会存在形式。文学是一种话语，但有自己的特殊性。\n\n一、文学话语的特点\n\n文学作为具有审美属性的语言艺术，是特定社会语境中人与人之间从事沟通的话语行为或话语实践。把文学不是简单地看做语言或言语，而是视为话语，正是要突出文学这种“语言艺术”的具体社会关联性、与社会权力关系的紧密联系。\n\n意识形态是话语与现实社会生活的复杂联结场，是指人们的社会话语与人们所身处其中的现实社会关系的具体而又复杂的联结方式。这样的意识形态概念包含两方面内容：第一，它是人们所说所写的话语；第二，这种话语与现实社会生活之间存在紧密联系。\n\n文学作为“话语”，应当被理解为一种以“审美意识形态”方式运行的社会实践。\n\n二、文学话语五要素\n\n（一）说话人。是体现在文学中的叙述者或抒情者角色和作家因素，这是话语活动的两个主体之一。\n\n（二）受话人。是阅读文本的接受者角色和读者因素，这是话语活动的另一个主体。\n\n（三）文本是供阅读以达到沟通的特定言语系统（有时也称话语系统），这是话语活动的符号形式。\n\n（四）沟通。是说话人与受话人之间通过文本阅读而达到的相互了解或融洽状态，这是话语活动的目的。\n\n（五）语境（context，又译上下文），是说话人和受话人的话语行为所发生于其中的特定社会关联域，包括具体语言环\n\n境和更广泛而根本的社会生存环境。\n\n文学作为包含五要素在内的话语行为，正体现了文学的基本属性：它绝不只是个人所有物，而是人与人之间的社会活动；绝不只是个人言语行为，而是人与人之间的社会话语实践。", "keywords": "特点 “审美意识形态”方式 社会实践 五要素 说话人 受话人 文本 沟通 语境", "note": "文学话语的特殊性，主要是由于其审美意识形态属性。文学的话语属性中掺杂着意识形态因素，与具体社会和社会权力紧密联系，被视为一种社会实践。文学话语这五个因素的具体内涵和它在话语活动中的地位，我们一定要对应清楚。", "framework": ""}, {"id": "145", "stars": 3, "title": "什么是话语蕴藉，怎样理解文学话语蕴藉属性，话语蕴藉的典范形态有哪些", "body": "一、话语蕴藉\n\n话语蕴藉概念，是将现代“话语”与我国古典文论术语“蕴藉”相融合的结果。“蕴藉”在用于品评人物时，多指人物品性的宽容和富于涵养。而在文学艺术领域，它是特指汉语文学作品中那种意义含蓄有余、蓄积深厚的状况。\n\n二、文学的话语蕴藉属性\n\n文学作为话语，与日常话语、哲学话语、政治话语、科学话语、新闻话语等一般话语不同，它作为社会性话语活动蕴涵着丰富的意义生成的可能性，具有“蕴藉”特点，从而具体地表现为话语蕴藉。\n\n在考察文学话语的特点时，蕴藉是个有用的概念。蕴藉可以被赋予较为宽泛因而更具包容性的含义：一种内部包含或蕴含多重复杂意义，从而产生多种不同理解可能性的话语状况。这样，蕴藉就可以用来描述文学话语的如下特殊状况：文学总是以一定的话语形态去蕴含多重复杂意义，或是把多重复杂意义蕴含在一定的话语形态之中。所以，文学直接地就总是以话语蕴藉的形态而存在。而无论是作者还是读者，都只能通过这种话语蕴藉而参与到文学活动之中，只不过，作者主要创造话语蕴藉，而读者则力求阅读和理解作者创造的这种话语蕴藉。进一步看，文学作为话语蕴藉，有两层意思：\n\n（一）整个文学活动都带有话语蕴藉属性。文学活动是由创作、作品、接受和批评等环节组成的整体，无论其中心任务或目的如何，都必须依据具体的语言活动构成的话语系统。从创作来看，任何表达意图，任何社会权力关系的纠缠都必须蕴含到话语系统中，通过话语系统去显现。从阅读和批评来看，处于社会语境中的读者对文学意义和属性的任何理解，都必须根据这种话语蕴藉。离开话语系统的蕴藉便不存在文学活动。文学活动作为话语蕴藉，主要是指文学的属性和意义存在于特定话语系统的创作和接受过程中，仿佛具有无限的生成与阐释的可能性。\n\n（二）在更具体的层次上，被创造出来以供阅读的特定文本带有话语蕴藉属性。文本，即有待于阅读的具体对象，毫无疑问是由话语系统的蕴藉构成的。离开话语系统的蕴藉便无所谓文本。文本作为话语蕴藉，则是指文本内部由于话语的特殊组合，仿佛包含有意义生成的无限可能性。这就是说，文本是特定的，但文本的意义似乎是无限丰富的。\n\n这两层意思在文学中是统一起作用的。整体的文学话语蕴藉活动需要沉落为具体文本的话语蕴藉，而文本的话语蕴藉也应当纳入完整的社会话语蕴藉实践中去阐明。\n\n三、话语蕴藉的典范形态\n\n（一）含蓄\n\n含蓄是文本的话语蕴藉的典范形态之一，指在有限的话语中隐含或蕴涵仿佛无限的意味，使读者从有限中体味无限。简单来说，就是以少寓多、小中蓄大，令读者品味再三。\n\n（二）含混\n\n含混（也称歧意、复义或多义），是文本的话语蕴藉的典范形态之一，指看似单义而确定的话语蕴蓄多重不确定的意义，令读者回味无穷。简单来说，就是读者阅读文本时可能感到其中含蕴着多重不同意义，有多种“读法”。\n\n比较而言，含蓄突出地的是表达上的“小”中蓄“大”，含混偏重的是阐释上的“一”中生“多”。但两者在实质上一致共同揭示了文学文本的话语系统具有丰富的意义生成可能性即话语蕴藉属性。", "keywords": "“话语”“蕴藉”含蓄有余、蓄积深厚 整个文学活动 特定文本 典范形态 含蓄 含混", "note": "话语蕴藉是对文学语言与意义状况的概括，指文学作为社会性话语活动蕴含着丰富的意义生成的可能性。不仅单个的文本，而且整个文学活动都带有话语蕴藉性质。文学的话语蕴藉特点集中表现在文本“含蓄”与“含混”两种修辞形态。", "framework": ""}, {"id": "146", "stars": 2, "title": "简述社会主义时期文学活动的性质和主要特征", "body": "社会主义时期的文学活动，是建立在社会主义经济基础之上的上层建筑，社会主义的意识形态性是它的最一般的社会属性。客观存在着的社会主义初级阶段的历史条件和文化环境，决定着我国社会主义时期文学活动的基本性质和主要特征。\n\n一、马克思列宁主义、毛泽东思想和有中国特色社会主义理论体系是我国社会主义时期文学活动的指导思想\n\n这是区别社会主义意识形态性和非社会主义意识形态性的首要标志。我国社会主义时期的文学活动，只有坚持马克思列宁主义、毛泽东思想和有中国特色社会主义理论体系的指导，才能取得更大发展和繁荣；反之，社会主义的文学活动就受到挫折或失败。\n\n二、坚持工人阶级及其先锋队共产党的领导地位\n\n我们是社会主义国家，中国共产党是中国特色社会主义事业的领导核心。党的正确领导，这是社会主义时期一切文学活动能否得到发展的根本保证。\n\n社会主义国家的执政党-共产党既支配着社会物质资料，全面领导着物质生产建设，又支配着精神生产资料，领导着社会主义物质文明、政治文明、精神文明、社会文明、生态文明建设。党的正确领导，决定着社会主义时期文学活动的性质、任务和方向。当然，党对文艺事业的领导，不是单纯用行政方式发号施令，不是随意干预作家的创作，不是要求文艺从属于临时的、具体的、直接的政治任务，而是要根据文学的特征和规律，帮助文艺工作者不断在实践中提高思想和艺术水平，充分发挥自己的聪明才智和独创性，努力创作出无愧于我们伟大时代、伟大人民的优秀作品。\n\n三、维护和巩固社会主义经济基础\n\n如果社会主义时期的文学活动不为社会主义经济基础和建设中国特色社会主义的宏伟目标服务，那它就会丧失其社会主义意识形态的属性。作为社会主义意识形态的文学活动，它的上层建筑性质，决定了它对维护和巩固社会主义经济基础的功能和作用。当然，文学活动同经济基础、同社会物质生活活动并不是直接发生联系，而是通过许多中介而发生间接联系的。它与政治、伦理、哲学等意识形态相互渗透、相互作用，共同为巩固和发展社会主义经济基础服务。", "keywords": "马克思列宁主义 毛泽东思想 有中国特色社会主义理论体系 指导思想 工人阶级 先锋队共产党 领导地位维护和巩固 社会主义经济基础", "note": "我国社会主义文学的性质和主要特征取决于我国处于社会主义初级阶段的历史条件和文化环境。而我国社会主义文学的性质和主要特征主要表现在指导思想、由谁领导、经济基础三方面，大家要结合政治相关知识准确理解。", "framework": ""}, {"id": "147", "stars": 2, "title": "社会主义时期文学活动的特点", "body": "一、主导性\n\n社会主义时期文学活动的主导部分和主导方面，应该具有鲜明的社会主义意识形态。惟其如此，我们的整个文学事业，才能成为社会主义精神文明建设的一部分，才能与社会主义经济基础相适应，起到维护和巩固社会主义经济基础的作用。\n\n在社会主义时期各种不同层次的文学活动中，社会主义的文学活动居于主导地位，因为它具有鲜明的社会主义意识形态性。它以无产阶级的阶级性、党性与人民性、民族性、人性的高度统一；共产主义的理想性与艺术的真实性、典型性、独创性的统一；革命的思想内容与民族形式的统一；深刻的哲理性与强烈的艺术感染性的统一为其主要特征。因而它能以巨大的艺术魅力给人以美的享受，成为人民精神生活中不可或缺的珍贵食粮。\n\n社会主义文学活动的主导地位并不排斥其他那些有益无害的文学活动，应采取包容态度。我们提倡有益的，容许无害的，反对和禁止一切有害的文学活动。对于那些思想不健康、有明显政治反动倾向、艺术水平低劣粗俗的文学活动，我们要毫不动摇地加以反对、批判和禁止。\n\n二、层次性\n\n由于社会生活本身具有主导性和层次性，这就决定了作为社会意识形态的文学活动，在我国社会主义初级阶段，其具体的社会属性也可以而且应该是多层次的。只要有某种进步意义和审美价值，也允许其存在和发展。\n\n对于社会主义时期文学活动的层次性，我们可以从不同的视角和侧面去认识。从文学活动与社会主义经济基础的关系看，有基本相适应的社会主义的文学活动，有益无害的文学活动，有害的文学活动。对于有害的文学活动，理所当然应该加以排斥。从政治思想倾向看，有具有鲜明的无产阶级党性的文学活动；有某种具有民主性、人民性、革命性的文学活动；有不同色调的爱国主义、人道主义的文学活动；有并无明显政治倾向性的、以写山水花鸟为主的文学活动，等等。从审美价值和艺术性看，自然也有高低、粗细、文野的不同层次。总的说，我们主张从美学的和历史的、思想内容和艺术形式相统一的观点来看社会主义时期文学活动的层次性。\n\n例如20世纪40年代毛泽东提出“阳春白雪”要与“下里巴人”统一，做到雅俗共赏。近代都市盛产言情、侠义、侦探等被称作“消费文学”“畅销文学”“大众文学”的通俗文学，虽然其文学性不及纯文学作品，但也能满足读者的阅读需求，起到愉悦休闲的作用。由此可见，多层次有利于文学繁荣丰富。\n\n三、多样性\n\n社会主义时期的文学活动不应单调划一，不能搞模式化、概念化、公式化，而应是主导性、层次性和多样性的统一。在社会主义时代，文学创作的题材、思想、人物、形式、风格和艺术方法与表现手法等都应该而且多样化。我们提倡文学反映人民群众为社会主义现代化而进行的创造性的劳动和斗争，反映中国共产党领导中国革命和建设的光辉历程；同时，我们也要鼓励作家以各种文学形式、体裁和各自不同的风格，描写其他各种历史题材和现实题材，塑造各种各样的人物，帮助人民群众扩大视野，增长智慧，提高审美能力。树立民族自豪感和自信心。历史已经证明并将继续证明，没有多样化的文学活动的发展，就不能充分调动起来作家的积极性和创造性，就不能满足人民群众日益增长的多样化和审美需要，促进社会主义文艺事业走向新的更大的繁荣。仅以80年代后期的小说创作为例，就有“寻根文学”“先锋小说”“新写实小说”“女性文学”等诸多潮流产生，社会主义时期文学的多样性得到充分体现。", "keywords": "社会主义的文学活动居于主导 包容态度 层次性 繁荣丰富 多样性 拒绝单调划一", "note": "社会主义时期文学应是主导性、层次性、多样性相统一，社会主义的文学活动居于主导地位，引领着这一时期文学的发展走向，同时也要允许其他有价值的文学的存在，允许文学的多层次、多样化现象的出现，但对于一切有害的文学活动都要严加批判，强烈禁止。", "framework": ""}, {"id": "148", "stars": 4, "title": "你怎样看待和评价大众文学（通俗文学）日趋繁荣的现象", "body": "通俗文学是不同于高雅文学、探索文学的一种文学类型，其审美特征具有特殊性。通俗文学特殊的审美特征就规定了它必然是易于满足大众，日趋繁荣的。\n\n一、通俗文学的通俗性易为群众接受\n\n日趋繁荣的通俗文学还有许多别名，如俗文学、大众文学、消遣文学、消费文学、娱乐文学、畅销文学等，从名称上看虽然略含贬义，但却充分体现了其通俗性。所谓“通俗”，不能片面理解为仅仅通俗易懂。“俗”的根本属性就是它的“大众性”“平民性”和“民间性”。当然，通俗文学的通俗性并不排斥文学性，通俗并不等于庸俗。它的通俗性主要体现在以下几方面：\n\n（一）内容通俗\n\n通俗文学的通俗性首先表现在它的内容是通俗的，例如爱情、侦探、传奇、武侠等题材较多，可见通俗文学的内容是与人民大众密切相关的。通俗文学对于读者的文化修养要求相对较低，因此通俗文学极易为群众接受，从这个角度说，通俗文学的繁荣无疑符合社会主义时期文学活动的层次性、多样性特征，有益于文学的广泛普及。\n\n（二）表现形式和语言通俗\n\n其次，通俗文学在表现形式和语言特点上也是通俗的。其结构形式清楚明了，通俗易懂。通俗文学的语言是在群众语言的基础上提炼加工而来的，保留了群众语言生动、活泼、通俗、平实、口语化、个性化的特点，尤其是俗语的大量应用，生活气息相当浓郁。\n\n二、通俗文学的传奇性适应读者审美要求\n\n通俗文学的另一个特点是富于传奇性，主要表现为故事情节的传奇性。为了适应读者的审美要求，满足读者的猎奇心理，通俗文学往往故意提高故事情节的传奇性，使情节的发展以奇致胜，以奇取胜。\n\n三、通俗文学的娱乐性满足大众的娱乐心理\n\n通俗文学的又一个特征是娱乐性。通俗文学所担负的使命主要是娱乐，满足读者“娱心”的消费观念，使人们短暂地从烦恼琐屑的人生中超脱出来，获得心理愉悦。因此，惊险、刺激、悬疑、浪漫的通俗文学往往为大众喜闻乐见。不过，强调通俗文学的娱乐性不能忽略思想性、教育性。“娱心”之外还需“劝善”，将娱乐性与思想性、教育性统一起来。\n\n总之，我们既要遵循通俗文学自身的发展规律，充分发挥其普及作用，同时也应该看到市场经济对通俗文学产生的种种不良影响，要引导其健康发展。", "keywords": "通俗性 内容 表现形式 语言特点 传奇性 娱乐性", "note": "通俗文学除了包括历史上的民间文学以外，还包括现实创作的通俗化、大众化作品，具有较高的商业价值，以满足一般读者消遣娱乐的主要目的，又称大众文学、俗文学。", "framework": ""}, {"id": "149", "stars": 3, "title": "如何从社会主义市场经济看通俗文艺", "body": "一、社会主义市场经济为通俗文艺提供发展空间\n\n通俗文学的首要特征便是通俗性，体现在它的内容、表现形式和语言特点都是通俗的。通俗文学对于读者的文化修养要求相对较低，因此通俗文学极易为群众接受，有益于文学的广泛普及。社会主义初级阶段的市场经济决定了文学活动必然具备层次性和多样性，这为通俗文艺的存在和发展提供了充足空间。另一方面，要最大限度地满足人民群众日益增长的审美需要，自然也需要一个发展过程。这是一个雅与俗、高雅艺术与通俗艺术双向运动的发展过程。\n\n二、社会主义市场经济容易导致部分通俗文学走向畸形\n\n在市场经济条件下，受市场利益地蛊惑，文学的商业性也越来越强，这在很大程度上不可避免地导致部分通俗文学走向彻底的媚俗乃至低俗、恶俗，例如专以偷窃隐私、情色暴力、奢靡生活为题材的通俗读物，在引导人民群众的审美情趣上就起到了一定的负面影响。通俗文学的通俗性并不排斥文学性，通俗并不等于庸俗。有些作家以畅销为目的，为占领市场、争当明星作家而写作，为此甚至不惜牺牲作品的文学性，内容缺乏深度，语言庸俗低劣，刻意追求通俗文学的传奇性和娱乐性，还导致许多通俗文学作品离奇古怪、不着边际，丧失了文学的真实性。因此，通俗文学不能偏离社会主义时期文学活动的主导性，忽略思想性与教育性，应将娱乐性与思想性、教育性统一起来。\n\n总之，在社会主义市场经济条件下，尽管通俗文艺往往趋新追奇，具有一定的广泛性、较强的商业性和娱乐性，有的也不免掺杂一些低级、庸俗、色情等不健康的成分，但界限仅是相对的，往往是俗中有雅，雅中有俗，并且随着时间的流变和接受者的不同而有所变化。对于通俗文学，我们要正确对待，积极引导，从满足人民群众日益增长的审美需要出发，在大力发展高雅、严肃艺术的同时，又要重视引导通俗文艺的健康发展，将我国社会主义文艺推向一个更高的水平。", "keywords": "层次性 多样性 提供发展空间 走向畸形 商业性 牺牲文学性 结合思想教育 俗中有雅，雅中有俗", "note": "在社会主义市场经济条件下，通俗文艺往往趋新追奇，具有一定的广泛性、较强的商业性和娱乐性，但有的也不免掺杂一些低级、庸俗、色情等不健康的成分，应坚决摒弃和剔除掉。我们要辩证地看待通俗文学，在社会主义文学的引领下，将其发展壮大。", "framework": ""}, {"id": "150", "stars": 2, "title": "说说通俗文学的审美特征和艺术特点", "body": "一、审美特征\n\n（一）创作主体的审美理想\n\n通俗文学的兴盛意味着一个文学思潮的转移，随之而起的是一种新的审美趣味、价值取向、交流模式、权力话语，它表现在一定时间内对长期处于主导地位的纯文学的否定怀疑、批判和抛弃。通俗文学的创作主体首先打破了纯文学所追求的个体实验，摒弃了深度模式，在世俗化、趣味化原则的牵引下，并不是一味地制造情感幻觉，而是更加贴近生活事实，强化生活情感的真切性，以一种为大众所喜闻乐见的、雅俗共赏的形式出现在读者面前。从创作主体的追求看，由于既存在着普遍的对现实的纯文学观念的信仰危机和价值危机，又丧失了深厚的民族文化根蒂，呈现出一种类似海德格尔所谓的“被抛”状态。于是在文化的认同上便自然而然地倒向大众文化，极力地迎合大众接受者的普遍心理需求，努力地表现日常生活中的艺术情趣，促使生活艺术化，艺术生活化，营造一种有趣味的生活化的审美意向。在具体的创作中呈现出追求轻松、潇洒、感性、刺激、宣泄、游戏等态势。\n\n另一方面，通俗文学的主体在创作中相当看重并力图实现作品的市场价值，更加注意市场即大众的需求，而不是着重追求自己的个性，对个性的追求变为对共性的追求。而且，创作主体也从过去注重教育功能和认识功能等很快地转向重视审美、娱乐功能了。从作品所追求的审美效应看，虽然说通俗文学是作为一种亚文化类型而出现，不能作为民族文化的典型象征，只能是次要的、从属的和边缘的，但它以追求“可读”“好读”“可视”“可理解”作为自身的风格而备受广大读者青睐。其审美趣味是中国传统固有的、代代相传的。其艺术逻辑的起点是顺应大众的审美习性，并以满足大众的审美心理需要为艺术经营的最终目的，因而极易和读者形成某种默契和心理沟通，作品本身则牢牢把握住读者的心理状态、爱好趣味、情感脉络，并对此作出迅速及时的艺术反响。\n\n（二）接受主体的审美选择：复杂而微妙的审美心理需要\n\n现代都市社会的机械性、程式化、自动化、个人对共同生活方式不知不觉的适应，导致了人与自然、人与人、人与自身的疏离。人们感到普遍的陌生和孤独，这种心理只有在大规模地互相认同和效仿的活动中才能摆脱。通俗文学正迎合了这一社会集体无意识活动。可以这样说，大众微妙的心理需要呼唤出通俗文学，促使通俗文学向自我非理性方向衍化，而通俗文学的这种倾向又为大众提供着心灵的依附，于是人们躲进通俗文学中彼此认同。\n\n二、通俗文学的艺术特点\n\n（一）通俗性。通俗文学的主要艺术特点即是它的通俗性。所谓“通俗”，不能片面理解为仅仅通俗易懂。“俗”的根本属性就是它的“大众性”“平民性”和“民间性”。文学作品的价值和作家的艺术才能，艺术功底并不表现在作品表达的莫测上，重大的题材、深邃的思想、典型的人物并不一定非得用艰涩费解的结构不可。鲁迅曾深刻指出：“文艺本应该是并非只有少数的优秀者才能够鉴赏，而是只有少数的先天的低能者所不能鉴赏的东西。”通俗文学的通俗性，其深刻根源，在于它表达、巩固强化了我们头脑中已有的审美经验、价值观念，是对于既定艺术规范的运用，因此它自然而然地把读者牢牢拴住。贯穿于通俗文学中的伦理道德观念、价值取向等都呈平民化趋势，题材内容更接近下层百姓。当然，通俗文学的通俗性并不排斥文学性，通俗并不等于庸俗。它的通俗性主要体现在以下几方面：\n\n（1）内容通俗\n\n通俗文学的通俗性首先表现在它的内容是通俗的，例如爱情、侦探、传奇、武侠等题材较多，可见通俗文学的内容是与人民大众密切相关的。通俗文学对于读者的文化修养要求相对较低，因此通俗文学极易为群众接受，从这个角度说，通俗文学的繁荣无疑符合社会主义时期文学活动的层次性、多样性特征，有益于文学的广泛普及。\n\n（2）表现形式和语言通俗\n\n其次，通俗文学在表现形式和语言特点上也是通俗的。其结构形式清楚明了，通俗易懂。通俗文学的语言是在群众语言的基础上提炼加工而来的，保留了群众语言生动、活泼、通俗、平实、口语化、个性化的特点，尤其是俗语的大量应用，生活气息相当浓郁。\n\n（二）传奇性与故事性\n\n通俗文学的另一个特点是富于传奇性，主要表现为故事情节的传奇性。光有语言的通俗流畅和形式的简单、单一，是不足以引起读者兴趣的。通俗文学最重要的是故事性。为了适应读者的审美要求，满足读者的猎奇心理，通俗文学往往故意提高故事情节的传奇性，使情节的发展以奇致胜，以奇取胜。因此，有人把通俗文学又称为“情节小说”。\n\n（三）娱乐性\n\n通俗文学的又一个特征是娱乐性。通俗文学所担负的使命主要是娱乐，满足读者“娱心”的消费观念，使人们短暂地从烦恼琐屑的人生中超脱出来，获得心理愉悦。因此，惊险、刺激、悬疑、浪漫的通俗文学往往为大众喜闻乐见。不过，强调通俗文学的娱乐性不能忽略思想性、教育性。“娱心”之外还需“劝善”，将娱乐性与思想性、教育性统一起来。", "keywords": "审美特征 创作主体的审美理想 接受主体的审美选择 艺术特点 通俗性 内容 表现形式 语言特点 传奇性与故事性 娱乐性", "note": "中国近现代通俗文学是指以清末民初大都市工商经济发展为基础得以滋长繁荣的，在内容上以传统心理机制为核心的，在形式上继承中国古代小说传统为模式的文人创作或经文人加工再创造的作品，面向的是以广大市民阶层为主的读者群。", "framework": ""}, {"id": "151", "stars": 3, "title": "试分析通俗文学与纯文学之间的区别", "body": "文学巨树拔地参天，在它的母本上，又分叉为“雅”“俗”两大支干，双双生长繁衍。雅文学固然枝繁叶茂，而俗文学亦郁郁苍苍。在当下，“雅文学”和“俗文学”更应该以“只是精英文学”和“大众通俗文学”来进行称呼，它们是相对应而存在的。其各自的特色，主要表现在以下方面：\n\n一、知识精英文学重探索性、先锋性，重视发展性感情。而大众通俗文学作家则满足于“平视性”，也即站在市民的立场上“平视”芸芸众生中的民间民俗生活的更序变迁\n\n知识精英文学对世界风云的变幻、阶级关系的趋向政局的动荡更迭以及社会大势对各阶层的感情上的冲击，特别是知识分子的敏感反馈等态势，是特别感兴趣的，并常常在这个大前提下找寻自己的题材落脚点。\n\n而大众通俗文学作家不善于像茅盾一样去高屋建瓴、高瞻远瞩地探索“中国向何处去”等大问题，以其先锋性写出《子夜》这样的作品。通俗作品往往是市民集体心理在情绪感官上的自娱、自赏与自我宣泄。他们崇仰人的基本欲求。他们也并非不写社会政局等大事，但他们往往偏重于平民百姓在这大动荡中备尝的酸甜苦辣，有时在他们的作品中能曲折地看出这些大动荡之所以发生的民间深层动因。他们小说中的“国计”往往是通过“民生”来呈现的。他们的作品以“食色”等人性的基本欲求作为他们社会小说和言情小说的母题。\n\n二、知识精英文学重自我表现，主体性强；而大众通俗文学则是一种贴近读者一消费者的期待视野的文学\n\n在20世纪80年代，文坛上为了给“纯文学”下定义，流传过一句“名言”：纯文学就是作家在写作时脑子里没有读者的文学。用这样的话去强调重自我表现，作家的主体性极强是无可厚非的，但以此来概括知识精英文学的特色，未免只及一点而不及其余了。知识精英文学作家重视倾听时代的呼声，因这呼声中就凝聚和饱含着广大读者的企求，而作家响应这时代呼声的召唤也就是与广大读者心心相印了。\n\n至于通俗小说，作为一种商品性文学，当然要深知读者的希求，要应答读者的期待，只有这样，才能有风行一时的发行量，因此，通俗小说作家特别注意读者的反馈信息，特别关心文化市场的行情，再结合自己的特长之所及，看看对读者能贡献些什么体裁或什么题材的作品，以满足读者的胃口。当时虽还没有什么排行榜，但书商约你写何种稿件，或书商正在大量收购何种类型的题材，愿出价钱的大小，这些作品对读者的魅力能维持多久.......凡此种种，都是一种测评他们的文化商品是否紧俏的指数。这样去透视通俗作家，并不意味着他们可以任意或廉价出卖自己的灵魂。现代通俗作家有着自己的道德规范和行为准则，他们在民族大节大义面前，是毫不含糊的。我们认为，在大多数的情况下，过去的知识精英作家可比作是“志愿军”，他们可以为自己的信仰奉献出自己的辛劳，甚至可以为自己的主义牺牲自己的生命；但大众通俗文学作家则是“职业兵”，他们的写作是一种职业行为，靠发表自己作品的多寡和质量优劣换取稿费与版税，去养活自己和全家，他们是中国第一代职业作家。\n\n三、知识精英文学作家是时时企望作品能有一种前所未有的创新，文体和语言的实验性是他们要攀登的制高点。但大众通俗文学则是模式化的\n\n鲁迅在小说创作中就显示了他是知识精英文学文体语言实验性方面的最有创意的典范。例如他在谈及《狂人日记》创作时，就提到“格式特别”和“优愤深广”这两点，说明他在内容和形式上皆在创新方面下功夫。鲁迅的小说，一篇有一篇的设计，一篇有一篇的韵味。\n\n而大众通俗文学虽然有多种类型：社会言情、武侠、侦探......但它们皆不同程度上去遵循一个模式。它们只是在某一模式的框子中显示自己对故事的独特构思。例如，在侦探小说中，曾经盛行的一个程式是“发案一侦查一歧途一破案一总结”的情节链，在人物结构上是“福尔靡斯一华生”式的主从搭档结构。而在言情小说中，也有几种模式，如“才子佳人”一”小人拨乱”-“大团圆”结局；或者是“三角选择”-“时代风云”-“离散悲剧”等等的排列组合。但正如张恨水所说：“世界上之情局，犹如世界上之山峰。山峰千万万，未有一同者。情局千万万，亦未有一同者。”所以通俗小说即使是模式化的，但作家还是有着自己的回旋余地。我们经过两相对比后，知道知识精英文学很注意叙述形式上的创新，而有些知识精英作家认为娱乐、故事、悬念等等不过是小技而已；但大众通俗文学则视趣味性、情节性等等是自己作品的生命线。它们的叙述形☑式虽是流于模式，但却善于制造叙述内容上的陌生化效果，也即故事要出奇制胜，情节要别出心裁。\n\n四、知识精英文学崇尚永恒，而大众通俗文学祈盼流通\n\n因为知识精英文学重永恒，所以他们往往（特别是他们中间的现实主义作家）以塑造典型作为自己创作中不倦的追求目标-要塑造出文学史画廊中不朽的典型。阿Q是中国现代文学史上的典型，因此鲁迅的小说是伟大的，《阿Q正传》是永恒的。\n\n通俗作家笔下也有成功的典型人物，可是通俗作家并不以塑造典型为自己的追求目标。他们所追求的是作品的“趣味性”能对读者产生强大的不可抗拒的磁场，要使读者对他们的作品达到痴迷的程度，天天要读他们刊载在报上的连载小说，一天不读，就会产生一种失落感。读者中有《啼笑姻缘》迷《金粉世家》迷，张恨水成为家喻户晓的作家。一部《春明外史》在报上连载了57个月，许多市民形成了“天天读”的习惯。至于读后是否引起深沉思索，或举反三地去认识世界，他们倒是不大顾及的。\n\n总之，知识精英文学看重“塑造典型”，大众通俗文学则偏爱“叙事传奇”，正如《文心雕龙》所说：“然俗皆爱奇”。可见，知识精英文学与大众通俗文学各有自己的审美要求。可是这种审美要求也决不是划分雅俗的精确界线因为精英文学有时在“塑人”过程中也道出了千古奇事，而通俗文学在“传奇”时也塑造出能百世流传的“典型”。叶昼对《水浒传》的人物的评点，就是对它的典型性的高度评赞：“描画鲁智深，千古若活，真是传神写照妙手。且《水浒传》文字妙绝千古，全在同而不同处有辨。如鲁智深、李速.......等众人都是性急的，形容刻画来各有派头，各有光景，各有家数，各有身份，一毫不差，半些不混！读去自有分辨，不必见其姓名，一睹事实，就知某人某人也。”上述分析的是知识精英文学与大众通俗文学的各自的特点，就各自的特色来看，它们的界线是基本上可以分清的；但是此二者在其本质又皆是文学，因此也有其相通之处。比如张爱玲，就是公认的出入于雅俗之间的作家。所以，雅与俗并不是相互对立的，而是相互依存、相互转化的。", "keywords": "探索性 先锋性 发展性感情 平视性 自我表现 主体性强 贴近读者一消费者的期待视野 创新 实验性 模式化 崇尚永恒 祈盼流通", "note": "雅与俗、通俗与先锋、阳春白雪与下里巴人，对于雅与俗的讨论一直贯穿我们文学创作和文学理论始终，因此，我们有必要在纯文学和通俗文学之间划出一条界限。但同时我们也要注意到，这条界限不是绝对的，雅与俗是可以相互转化的。", "framework": ""}, {"id": "152", "stars": 2, "title": "试述作家、艺术家与新时代的人民群众的关系", "body": "一、文学活动要满足人民的审美需要\n\n社会主义时期的文学活动，要满足人民群众日益增长的审美需要，作家、艺术家就应该走一条不同于旧时代作家、艺术家的道路。这就是学习马克思主义、学习社会，与新时期人民群众相结合的道路。\n\n二、作家反映的内容要高于现实\n\n世界文学史上无数事实表明：任何一个世界著名的文学家，往往又是他那个时代的伟大的思想家。作家以什么样的世界观和方法论去观察生活、观察文学艺术，影响甚至决定着作家对生活认识的深度和广度，影响着作品的思想内容和艺术表现。\n\n因此，社会主义时代的作家，不仅要反映现实，而且要上升到高于现实的地方，在思想上、生活上和创作上，都必须高瞻远瞩，只有站在时代的高峰，才能看清历史发展的过去、现在和未来，才能发现新的性格，摸到时代跳动着的脉搏，揭示新人的内心世界和感情世界的奥秘。\n\n三、文学要表现人及其关系\n\n文学要表现人及其关系，要表现和描绘人民的情感、情绪、思想、性格和命运，第一位的工作是了解人、熟悉人的工作。为此文艺工作者就应该深入生活、深入群众，向生活学习，向群众学习，就应该深入观察、体验人民的生活、思想和感情，了解不同时期不同场合下人与人之间关系的复杂曲折的变化，弄清哪些社会力量是阻碍历史前进的，哪些是属于未来的新的成分和幼芽。\n\n四、作家要不断学习探索\n\n对作家来说，视野越广阔，知识越丰富，对创作就越有益。作家要整体地把握住生活的底蕴，体验到人民的感情、情绪的变化，就必须走出“象牙之塔”，认真学习和领悟社会这部无限生动丰富的“无字书”，不能搞“沙龙社会主义”，坐在客厅里谈社会主义，关在房子里写文章。我们强调作家学习马克思主义，并不意味着可以忽视其他知识的学习。一个优秀的作家，应该像鲁迅那样，学贯中西、融会古今，生命不息、学习不止，探索不止；要在实践中不断地学习探索文学活动的特点和规律；要学习各方面的知识，使自己的知识结构更加完整而丰富。因此，作家对中外文化，哲学、历史、宗教、民俗、心理学以及自然科学的知识都应该学一点。\n\n五、作家要同人民永远保持血肉联系\n\n最根本的、第一位的事情，还是作家同人民永远保持血肉的联系。人民需要艺术，艺术需要人民。忘记、忽略或是割断文学活动同人民之间的血肉联系，作家的艺术生命就会枯竭。根深才能叶茂，作家、艺术家只有投身于沸腾的变革现实的洪流，把自己永远植根于人民的生活沃土之中，同人民群众的思想感情打成一片，自觉地从人民的生活中汲取题材、主题、情节、语言、诗意、画意，才能使审美的主客体真正统一起来，不断创造出无愧于伟大时代的优秀文学作品。", "keywords": "审美需要 上升到高于现实的地方 高于现实 表现人 不断学习 联系人民", "note": "五四以来，“平民文学”的提出，“大众化”问题的争论，“到民间去”的呼吁，都表现了文学界试图使作家与人民大众的关系进一步密切起来的努力。但是，由于没有找到这一问题的症结所在，而且客观环境也还没有提供解决这一问题的充分条件，所以为人民大众也只是停留在口头上，还不能成为广大作家和文艺批评家的实际行动。", "framework": ""}, {"id": "153", "stars": 4, "title": "谈谈继承与革新的关系", "body": "一、文学活动的发展有自己的历史继承性\n\n中外文学史的事实表明，各民族的文学都不是凭空创造出来的，都有一个继承、借鉴与革新、创造的历史过程。文学活动的发展，要以从它的先驱者那里承继下来的条件作为创造的前提和进一步发展的出发点。文学活动的历史继承性，不仅表现在优秀文学传统直接影响作家的审美理想和审美方式方面，而且表现在文学作品的内容与形式的发展上。\n\n从思想内容来说，历史上反映人民生活、表达人民的愿望和思想感情的作品，从题材、主题、人物形象塑造等方面，都有一定的继承性。从艺术形式来讲，每个时代的作家也总是自觉不自觉地继承过去时代所开成的文学传统和创作经验，特别是进步的创作方法和高超的艺术技巧。比如唐代诗歌的繁荣，无论从思想内容还是艺术形式，都是《诗经》、楚辞、乐府、魏晋六朝诗歌的直接继承与发展。齐梁时期讲究声律对偶，对于唐诗中律诗格律的形成，无疑起了一定的作用。\n\n二、文学活动的革新要求在批判中继承\n\n（一）中国是世界文明古国之一，在漫长的历史文化中，涌现出许多世界一流的诗人、剧作家、小说家和文艺理论家、美学家，因此积累了无比丰厚的文学传统和遗产。它肇始于过去，积淀于现在，影响着未来。需要注意的是，继承古代的优秀遗产、弘扬优秀的民族文化传统并不意味着“全盘继承”，而应该批判地继承，这里所说的“批判”不是否定一切、横扫一切的所谓“大批判”，而是运用马克思主义的立场、观点和方法，加以整理、区分、思考、分析，弃之糟粕、取其精华。因此，我们只有对过去的文学遗产予以马克思主义的批判总结，才能正确地继承和借鉴，才有可能在继承优秀文学传统的基础上，根据新时代的审美需要，进行艺术的革新和创造。\n\n（二）由于文学传统本身是一个动态的、开放的、不断发展的系统，因此传统与反传统是社会大变革时代文学发展出现的一种带有必然性、规律性的现象。钱钟书先生所提示的相反相成、传统与反传统的现象，是世界文学艺术发展过程中的一条重要规律。它要求我们与时俱进，不断地解放思想，打破种种旧的条条框框的束缚，在继承中批判，在批判中继承、革新和创造。对于一些古代优秀作品，我们要以美学的和历史的观点给这类作品以马克思主义的科学阐释，批判其消极的成分。比如《红楼梦》是一部封建社会百科全书似的艺术杰作，它以贾宝玉、林黛玉的爱情悲剧为中心，真实地描绘了贾、史、王、薛四大家族的衰亡史，表现了封建社会“死而不僵”的时代特征。但是作者在作品中流露出的“色”“空”观念和“补天”思想，则是明显的消极成分。因此，运用马克思的历史主义原则加以具体分析，批判地继承，显得尤其重要。总而言之，继承并不意味着因循守旧，墨守成规；革新也不是全部抛弃，从零开始。而要既讲变革又讲继承，创新以继承为基础，继承以创新为目的。", "keywords": "历史继承性 革新和创造 批判地继承 传统与反传统", "note": "文学的发展离不开继承，同样也离不开革新。继承与革新是辩证的统一。继承是革新的基础和前提，革新是继承的目的和要求，继承是一个有批判有吸收的扬弃过程，它需要我们分清精华与糟粕；革新反映了时代和现实生活的需求，它必须有借鉴有创造。真正的继承已包含着部分的革新因素，而革新在摆脱文学传统的束缚时一定程度上又总与传统保持着血缘的继承关系。文学的继承与革新既互相渗透又互相转化，既联系又互相区别，共同推进着文学的发展。", "framework": ""}, {"id": "154", "stars": 2, "title": "论述弘扬优秀民族文化传统对于建设有中国特色的社会主义新文学的意义", "body": "一、文学活动的历史继承对社会主义新文学的重要性\n\n文学活动的发展，要以从它的先驱者那里承继下来的条件作为创造的前提和进一步发展的出发点。文学活动的历史继承性，不仅表现在优秀文学传统直接影响作家的审美理想和审美方式方面，而且表现在文学作品的内容与形式的发展上。从思内容来说，历史上反映人民生活、表达人民的愿望和思想感情的作品，从题材、主题、人物形象塑造等方面，都有一定的继承性。从艺术形式来讲，每个时代的作家也总是自觉不自觉地继承过去时代所形成的文学传统和创作经验，特别是进步的创作方法和高超的艺术技巧。\n\n中国是世界文明古国之一，在漫长的历史文化中，涌现出许多世界一流的诗人、剧作家、小说家和文艺理论家、美学家。在中国文学史上，诗歌、小说、戏剧等各种艺术形式的发展，也都经历了由简到繁、由粗朴到精致、由不够完美到逐渐完的过程，因此积累了无比丰厚的文学传统和遗产。学习、继承古代优秀文学遗产，弘扬民族的优秀文化传统，不仅可以使们更深刻地认识中华民族光辉灿烂的文学史，激发各族人民的爱国主义感情，提高民族自信心和民族自豪感，而且对于发和繁荣民族的社会主义新文学，也是必不可少的重要条件。\n\n比如通俗文学中的章回小说是由话本小说发展而来的，它们之间的继承关系就很明显；蒲松龄的《聊斋志异》和诸多笔小说都承继了先秦寓言、六朝志怪的审美特色；二十世纪80年代中国小说界出现的“寻根文学”就建立在广泛而深厚的文化开掘”之中，许多作家认为只有开掘拥有五千年文明史的这块古老土地中的“文化岩层”才能与“世界文学”对话，学创造只有根植于悠久而深厚的民族文化土壤之中，从中国文化中寻找有生命力的东西，并以“现代意识”来重新观照传才能在真正意义上走向现代。汪曾祺的短篇《受戒》《大淖记事》，贾平凹的“商州系列”都被视作重视民族文化底蕴优秀作品。\n\n二、批判继承\n\n当然，继承古代的优秀遗产、弘扬优秀的民族文化传统并不意味着“全盘继承”，而应该批判地继承，运用马克思主义的立场、观点和方法，加以整理、区分、思考、分析，弃之糟粕、取其精华。只有对过去的文学遗产予以马克思主义的批判总结，才能正确地继承和借鉴，才有可能在继承优秀文化传统的基础上，根据新时代的审美需要，进行艺术的革新和创造。\n\n综上所述，批判地继承本民族的文化传统，是发展社会主义文艺的基础和前提，建设有中国特色的社会主义新文学，必须弘扬优秀的民族文化传统。", "keywords": "人民生活 人民的愿望 文学传统 创作经验 发展繁荣 批判地继承 弘扬优秀的民族文化传统", "note": "优秀的民族文化既是民族振兴的精神动力，又是建设先进文化的重要基础。在经济全球化和发展社会主义市场经济的背景下，弘扬优秀的民族文化，并结合时代特点加以创新，建设有中国特色的社会主义新文学的必经之路。", "framework": ""}, {"id": "155", "stars": 2, "title": "谈谈民族文学与世界文学的相互关系", "body": "一、概念的提出\n\n最早提出民族文学与世界文学这对文艺学范畴的是歌德，他强调诗是人类的共同财富，各民族都有自己的长处，有自己的民族特性，但不能因此而固步自封，夜郎自大；只有通过各民族文学之间相互交流、相互学习、相互对话，才能使“世界文学”的时代早日到来，从而以自己民族文学的独特性，走向世界文学的新时代。继歌德之后，马克思、恩格斯于1848年《共产党宣言》中，进一步提出和论述了世界文学的问题：“民族的片面性和局限性日益成为不可能，于是由许多种民族的和地方的文学形成了一种世界的文学”。\n\n二、优秀民族文学是人类共同财富\n\n由于世界市场的形成和科学技术的迅速发展，各民族的优秀文学逐渐成了人类共同的精神财富。比如，中国古代的优秀文学作品，由于长期自然经济带来的自给自足和闭关自守状态，一般局限在亚洲地区发生影响，直到18、19世纪才逐渐影响到全世界。灿烂的中华民族文化在对世界文化的发展做出巨大贡献的同时，也批判地汲取和借鉴一切外来文化的有益成分，如印度的佛教文化，欧洲的启蒙主义文学，积极浪漫主义、批判现实主义和苏联的社会主义现实主义文学，都对中国文学的发展产生过深刻的影响。可见，由民族文学走向世界文学，这是人类文学活动发展的历史趋向。每个民族艺术家创造的优秀的艺术作品都是人类共同的精神财富，要使民族的珍品成为世界的财富，就必须加强民族文学艺术的相互对话、交流活动，取长补短，共同繁荣。\n\n三、世界文学发展要依靠各民族文学的特色\n\n从另一个角度说，世界文学在形成的过程中，当然并不是要取消民族文学，相反各民族文学更应在汲取其他民族文学养料的基础上，进一步发展本民族文学的民族特色，正如鲁迅所说“有地方色彩的，倒容易成为世界的。”因此，各民族文学只有保持和发扬自己民族的独特性，才能使世界文学园地更加绚丽多彩。\n\n四、社会主义文学要求“古为今用，洋为中用”\n\n文学活动是一种最具个人创造性的精神活动，最忌千篇一律、模式化、概念化，同时，文学活动又需要一个有利于充分发挥作家、艺术家的积极性与创造性的自由民主的文化氛围和社会环境。在发展社会主义文学活动的过程中，如何处理古与今、中与外的关系，毛泽东总结了我国文艺实践的经验教训，提出了“古为今用，洋为中用”的主张。近半个世纪以来，我国社会主义时期文学艺术活动的正面经验和反面教训，都有力证明：百花齐放，百家争鸣，推陈出新，古为今用，洋为中用，是完全符合社会主义文学艺术发展规律的，也是我们发展社会主义文学事业的正确道路。", "keywords": "歌德 马恩 人类共同的精神财富 发展本民族文学特色 古为今用，洋为中用", "note": "各民族文学之间的相互影响和相互促进，是中外文学发展史上的客观事实，也是文学发展的内部规律之一。在世界范围内，不同国家、不同民族之间的相互交流，是促进文学全球化的不可或缺的重要条件。各民族文学一经形成，不仅是自己民族的，更是人类共有的精神财富，迟早要成为世界文学的一员。", "framework": ""}, {"id": "156", "stars": 3, "title": "结合中国近年文艺创作现实，试论文艺作品的民族性与现代性之间的关系", "body": "文艺作品的民族性与现代性看似矛盾，实则相互依存、辩证统一。文学的现代性要求各民族文学之间加强交流与沟通，相互学习，取长补短。在由民族文学走向世界文学这个借鉴吸收的过程中，文艺作品的民族性必然受到挑战，从而与现代性发生矛盾。因此，如何在继承本民族优秀文化传统的基础上，通过借鉴吸收世界文学中的先进成分来进行革新创造，使本民族文学具备现代性，是处理好文艺作品的民族性与现代性关系的关键。\n\n一、保持民族性是现代性的基础\n\n文学活动的发展有自己的历史继承性，这不仅表现在优秀文学传统直接影响作家的审美理想和审美方式方面，而且表现在文学作品的内容与形式的发展上。一个民族的文学不可能完全适应另一个民族的审美心理，因此文艺作品要走向现代化，绝不能以牺牲民族性为代价。80年代中国小说界出现的“寻根文学”，其代表作家及评论家就认为，中国文学应该建立在广泛而深厚的“文化开掘”之中，开掘这块古老土地的“文化岩层”才能与“世界文学”对话。这体现了作家对于追求借鉴西方现代文学流派的一种反思，于是他们主张以“现代意识”来重新观照传统，从中国文化中寻找有生命力的东西，文学创造只有根植于悠久而深厚的民族文化土壤之中，才能在真正意义上走向现代。汪曾祺的短篇《受戒》《大淖记事》，贾平凹的“商州系列”都被视作重视民族文化底蕴的优秀作品。可见，保持文艺作品民族性乃是现代性的基础。\n\n二、现代性是民族性的发展趋势\n\n由于文学传统本身是一个动态的、开放的、不断发展的系统，这要求我们必须与时俱进，不断地解放思想，打破种种旧的条条框框的束缚，在继承中批判，在借鉴中革新。文学的现代性意味着创新，只有创新才能使文学突破陈规、自由开放，从而适应现实需要，具有时代气息。继承并不意味着因循守旧，墨守成规；借鉴也不意味着盲目崇拜、照搬抄袭。我们反对文学上的民族保守主义和排外主义，消化、吸收、与本民族的文学传统相结合，是接受外来影响的关键。例如莫言构筑的《红高粱家族》系列，极富浑实奔放的东北民俗特色，小说既有中国古典文学的意蕴，同时深受魔幻现实主义和福克纳现代派的影响，可以说在讲究民族性的基础上，通过借鉴、吸收西方优秀作品中的先进经验使其作品具有了现代性。可见，文艺作品的现代性是民族性的发展趋势。", "keywords": "相互依存 辩证统一 民族性是基础 现代性是趋势 批判中继承 借鉴中革新", "note": "现代性和民族化就像一对难分难解的同胞兄弟，成为中国新文学发展的具体要求。同时，它们也像一对苦大仇深的冤家，由于内涵有交叉而外在边界模糊，时常在解构对方中强化自身。只是人们常常忽视二者的兄弟情谊而突出了冤家情结。对于二者的关系，我们应该明白是相互依存，辩证统一的。", "framework": ""}, {"id": "157", "stars": 3, "title": "说说精神生产与物质生产的内涵和关系（25西安外国语大学）", "body": "一、内涵\n\n（一）物质生产\n\n所谓“物质生产”指的是人类为取得生存所必需的物质资料而进行的对于自然界的物质改造活动。物质生产是“人类生存的第一个前提”，也是“一切历史的第一个前提”。人类为了创造历史，必需能够生活；而为了生活，首先必须解决吃、喝、住、穿等问题，因此，人类的“第一个历史活动就是生产满足这些需要的资料，即生产物质的生活本身”。可见，物质生产是人类最基本的生产形式，是社会存在的基础，也是历史发展的基本动力。\n\n（二）精神生产\n\n精神生产作为与物质生产相对的人类社会生产活动的两种基本形式之一，指的是人类为了取得精神生活所需要的精神资料而进行的对于自然、社会的观念活动。科学、哲学、政治、法律、道德、宗教和艺术等活动都属于精神生产范畴。\n\n二、关系\n\n（一）精神生产以物质生产为前提\n\n精神生产的产生和发展始终是以物质生产为前提和基础的。人类并非一开始就具有纯粹的意识，也并非一开始就存在着纯粹的精神生产，它“最初是直接与人们的物质活动，与人们的物质交往”交织在一起的。\n\n事实证明，原始社会时期，精神生产没有取得独立的地位，尽管那时已经有了意识的初级形式，逐渐产生了原始形态的宗教、神话、艺术等，但这些精神生产的初级形式都是和物质生产交织为一体，并从属于物质生产或直接为物质生产服务的。\n\n随着生产力发展，精神生产作为一个独立的部门发展起来，艺术作为一种精神生产真正独立，但这并不意味着它脱离了物质生产，相反，物质生产不仅是精神生产产生的“始因”，而且在精神生产获得独立之后仍然并始终是精神生产发展的“动因”。例如，物质生产在原始社会瓦解之后，经历了奴隶制、封建制、资本主义和社会主义等四种历史形态，相应地，精神生产也随之经历了这四种形态，表现出不同的特征。精神生产的历史发展和变化，不同历史形态下精神生产的不同性质和特征，从根本上说是被物质生产决定的。\n\n（二）精神生产具有相对独立性\n\n精神生产一旦从物质生产中分化出来，就具有了相对的独立性。这种独立性表现在：\n\n（1）精神生产与物质生产发展不平衡\n\n精神生产的繁荣发展并非与物质生产绝对同步。精神生产与物质生产之间存在着不平衡现象，也就是说，精神生产的发展具有相对的独立性。这是因为，物质生产对精神生产的作用是间接的（必须以思想关系为中介），影响精神生产发展的因素是多方面的；而就精神生产本身而言，它们都有自己的历史继承性，都是在继承前人积累下来的精神资料的基础上发展的；同时，它又有自己特殊的社会历史文化条件，深受这种条件的影响，这样，精神生产就有了“自己的独立的发展道路”。\n\n（2）精神生产反作用于物质生产\n\n精神生产的独立性还表现在，它一旦从物质生产中独立出来，就反过来对物质生产发生作用。例如，科学的每一次进步，都会引起生产技术、生产工具的革命，从而推动物质生产的发展。如17世纪科学革命的顶峰人物牛顿关于近代物理学的三大定律和万有引力定律的发现，以及近代科学的奠基性巨著《自然科学的数学原理》的出版，都极大地推进了欧洲乃至世界的工业生产的发展。科学如此，文化艺术的生产也不例外：美学的研究和艺术样式的发展变化，也会促进工业和其他物质生产在技术和审美方面的完善统一。", "keywords": "物质必需的物质资料 精神生活所需的精神资料 物质生产是前提 精神生产具有相对独立性 不平衡现象 反作用", "note": "人类社会生活从总体上可以划分为物质生活与精神生活两大部分。为了满足这两种生活所分别进行的生产活动，就叫做物质生产与精神生产。物质生产是为了满足人们的物质需要，它的成果构成了人类的物质文明。精神生产是为了满足人们的精神需要，它的成果构成了人类的精神文明。艺术生产作为一种特殊的精神生产，则是为了满足人们的审美需要，它的成果构成了人类光辉灿烂的艺术文化宝库。", "framework": "“物质生产”指的是人类为取得生存所必需的物质资料 而进行的对于自然界的物质改造活动 内涵 “精神生产”指的是人类为了取得精神生活所需要的精神资料 精神生产与物质生产 而进行的对于自然、社会的观念活动 的内涵和关系 精神生产以物质生产为前提 关系 精神生产与物质生产发展不平衡 精神生产具有相对独立性 精神生产反作用于物质生产"}, {"id": "158", "stars": 3, "title": "文学创造作为一种精神生产与物质生产的关系如何", "body": "文学创造作为一种精神生产与物质生产存在着辩证统一的关系。\n\n一、文学创造由物质生产所决定\n\n文学创造作为一种精神生产，它的历史发展和变化、不同历史形态下文学创造的不同性质和特征，从根本上说都是被物质生产所决定的。物质生产是人类最基本的生产形式，是社会存在的基础，也是历史发展的基本动力。文学创造作为一种精神生产总是受着物质生产的普遍规律的支配，并“随着物质生产的改造而改造”。\n\n二、文学创造具有相对独立性\n\n文学创造作为一种精神生产一旦从物质生产中分化出来，它就具有了相对的独立性。这种独立性表现在：\n\n（一）文学创造与物质生产发展不平衡\n\n文学创造的繁荣发展并非与物质生产绝对同步。以文学创造这种精神生产为例，比如古希腊和文艺复兴时代的物质生产发展水平远远落后于近代资本主义，但希腊人和莎士比亚的艺术成就却是近代所不可企及的；19世纪70至90年代的俄国，农奴制度的残余仍然渗透于俄国整个经济之中，但文学方面却群星灿烂，成绩斐然，普希金、果戈里、屠格涅夫、列夫·托尔斯泰、契诃夫在这一时代创造出了非凡的作品；中国春秋战国时期科学、哲学、文学的大繁荣就发生于物质生产水平远远落后于后世的时代，而且那种繁荣局面在此后两千年的封建社会中也很少出现过。\n\n（二）文学创作反作用于物质生产\n\n文学创造的独立性还表现在，它一旦从物质生产中独立出来，就反过来对物质生产发生作用。例如五四时期鲁迅批判封建制度吃人本质的战斗檄文，就激发了无数青年的觉醒意识，在一定程度上推动了社会进步。另外优秀文学作品对于人性的深刻挖掘，对社会生活的沉重反思，同样通过影响读者进而影响到社会文化及其他方面的发展。", "keywords": "物质生产的决定作用 相对独立性 不平衡 反作用", "note": "马克思从社会生产活动的角度，把艺术活动称作“艺术生产”，将其与科学、哲学、政治、法律、道德、宗教等活动一起列入“精神生产”的范畴。因此，文学创作作为一种艺术生产活动，属于精神生产的范畴，因而它与物质生产的关系也就是精神生产与物质生产的关系。但注意作答时所举的例子要都换为文学方面的例子。", "framework": ""}, {"id": "159", "stars": 5, "title": "精神生产的特殊性有哪些", "body": "精神生产和物质生产作为人类两种基本的生产方式，有着共同的性质和规律。首先，两种生产都作为人的生活活动，具有人的生活活动的一般特点，即自由自觉和创造性。其次，两种生产都是人的本质力量的对象化活动。\n\n但是，精神生产作为“特殊的生产”，又有不同于物质生产的特征。\n\n一、精神生产观念地创造对象世界\n\n在物质生产中，人与对象世界的关系是一种物质实践的关系；人们要想获取物质生活资料，必须通过实践对外部世界进行物质性的改造。因此，物质生产是在物质领域实际地改造对象世界和创造新的物质世界的生产；而精神生产则根源于人的精神需要，如对知识、真理、道德、信仰和审美的需要。人与对象世界的关系是一种精神关系，它只通过意识活动对外部世界进行观念性的体验或思索，在此基础上创造一个观念世界。一句话，精神生产是在精神领域中观念地改造对象世界，并创造新的观念世界的生产。\n\n二、精神生产以符号活动来创造观念世界\n\n任何生产都必须借助于一定的手段。物质生产的手段是工具，而精神生产的手段是符号。工具和符号都是人类特有的创造物。工具体现了人类科学技术的水平和物质生产的能力；人类进行物质生产必须借助于工具。在精神生产中，人们凭借的工具是符号。符号是标示事物的代码，如文字、语言等。文字、语言作为建构观念世界的工具，既是人思考世界的手段，又是表述科学思想、塑造文学形象的材料。总之，精神生产以符号为手段，因而它实质上就是一种创造观念世界的符号活动。\n\n三、精神生产是富于个性的自由创造活动\n\n物质生产始终受到物质世界的客观规律即必然性的制约，受到生产力发展水平和工具科学化程度的限制，即使是在生产力水平和工具科学化水平较高的阶段也是如此，如大工业时代，由于生产手段机械化、生产方式群体化，作为生产主体的个体因此受到生产群体、生产工具、规范化生产程序等的制约和束缚，产品的个体风格往往被淹没，较少出现富于个性的自由创造。而精神生产却始终保持着“精神的自律”，表现为“精神个体性的形式”，有利于个体的自由创造，因而马克思称之为“自由的精神生产”。尤其在马克思所说的“真正自由的劳动”的艺术中，这一特征表现得更为突出。精神生产的上述特征，是理解文学创造特征的一个重要层次。", "keywords": "共同性质和规律 特殊的生产 物质实践关系 实践 物质性改造 精神关系 意识活动 观念性体验 工具 符号物质生产受制约 精神生产个性自由", "note": "文学创造作为一种特殊的精神生产，具有与物质生产不同的特征：人与世界的关系是精神关系，是在精神领域中观念地改造对象世界和创造新的观念世界的生产；精神生产是以符号为创造观念世界的媒介，而不是运用物质工具去改造世界的活动；精神生产富于个性和自由性。", "framework": ""}, {"id": "160", "stars": 3, "title": "文学创造作为一种特殊的精神生产与科学、宗教的本质区别是什么", "body": "从精神生产领域看，文学创造及其他艺术创造与科学、道德、宗教等精神生产活动，都是人对于世界的意识活动。但是，它们都有各自的特殊规律。\n\n一、文学创造与科学的区别\n\n科学活动的特点是提示客体的真实本质，它通过理性思维力求如实地把握世界的客观规律，是把直观和表象加工成概念、范畴的活动，目的在于获取关于客观世界的真理，以满足人的理性需要。各种理论研究如哲学、经济学、法学等就是偏于科学反映的、以揭示对象的客观规律为己任的精神生产，其成果呈现为一定的概念体系。如马克思的《资本论》、爱因斯坦的《相对论》等就是科学生产的成果。\n\n文学活动则是通过人对世界的情感体验、感受、评价，力求表达主体对世界的主观感受和认识，并将这种感受和认识传达给别人，以满足自己和他人的情感需要，其生产成果主要体现为人的情绪、情感的形象形态。进一步说，文学创造是人对世界的审美掌握，文学产品正是在此基础上形成的具有话语蕴藉的审美意识的物化形态。文学当然包含着科学认识的因素，但这种认识因素在文学创造及其作品中已经被情感化、诗意化，即审美化了，这正是文学作为一种审美意识形态生产区别于科学生产的特质。\n\n二、文学创造与宗教的区别\n\n文学创造与宗教活动存在着不少相似性，它们都是对世界的情绪、情感体验，都具有直观性、想象性、幻想性、形象性等特点。从历史渊源看，这两种精神活动也常常若即若离，你中有我，我中有你。例如《圣经》充满了诗，《荷马史诗》则充满了宗教。\n\n但是，文学创造与其他艺术创造是人对世界的审美活动，是一种具有话语蕴藉的审美意识形态的生产，它建立在对现实世界的真实感受的基础上，以审美情感去体验和发现世界的美，并创造出美的精神世界，让人从中受到美的陶冶，使人发现世界、认识世界、回归世界；它关心人，热爱人，总是力图揭示人的丰富性，弘扬人的价值。因此，它要拥抱能充分地体现人的本质力量的现实世界。\n\n宗教却建立在对世界颠倒的认识和虚幻的唯心主义臆想的基础上，以虚无的情感去祈求彼岸世界的幸福；它通过对神和虚无世界的歌颂把人引向不可知的彼岸，使人忘却现实世界和否定人自身的价值。显然，宗教是人的本质的异化形态，它虽然常常要借助于审美形式去征服人，但实质上是要导向超验的彼岸世界。而文学创造作为一种具有话语蕴藉的审美意识形态生产，则是要导向能充分地体现人的本质力量的现实世界。", "keywords": "科学：客观规律 文学活动：主观感受 文学：现实世界 真实感受 审美情感 体验和发现 宗教：世界颠倒 唯心臆想 虚无情感 祈求 彼岸世界", "note": "文学创造作为一种特殊的精神生产，与科学、宗教的本质区别是在于文学创造是补充人的精神生活，满足人的审美需求，而宗教则是为了满足人对于欲望和恐惧的精神需求。", "framework": ""}, {"id": "161", "stars": 3, "title": "为什么说文学创造是一种更加自由、更富于个性的创造", "body": "一、文学创造的相对独立性更明显\n\n从物质生产与精神生产的内涵和关系来看，文学创造作为一种特殊的精神生产，从根本上说虽然与其他精神生产一样决定于物质生产，但具有更多的独立性，也就是说文学创造与物质生产的不平衡关系更加明显。文学创造在面对物质生产时表现出了更大的自由。例如古希腊和文艺复兴时代的物质生产发展水平远远落后于近代资本主义，但希腊人和莎士比亚的艺术成就却是近代不可企及的。\n\n二、文学创造主观性更强\n\n从文学创造本身的特征来看，它在精神生产领域中更加自由、富于个性。文学创造是人对世界的审美活动，它建立在对现实世界的真实感受的基础上，作家对生活的体验是一种审美的体验，而审美体验主要是一种情感体验，情感体验比任何别的体验都更具主观性。这种主观性、情感化在科学研究中是不允许的。另外，文学作为审美意识形态，与宗教相比，作家拥有相对宽松自由的创作环境，同时，好的作家都会在创作中形成自己独特的艺术风格。\n\n三、文学创作所运用的语言更富艺术性\n\n从文学创造作为特殊的精神生产来看，文学创造作为一种精神活动当然要运用一定的符号，文学以语言为符号。但是，文学创造中所运用的既不是语法意义上的“语言”，也不是日常的“言语”，而是具有话语蕴藉的“话语”，即作者个人的言语行为，其中包括人物的独白、对话等。文学创造就是以话语为原料的生产活动。\n\n文学话语不同于一般的科学言语和日常言语，例如科学论文、研究报告、技术资料等采用的科学言语，强调严谨的逻辑和语法结构，要求说理清楚、概念明确、不注重个人色彩和风格，显得素材单纯、千篇一律。日常言语由于发生在具体交往中，受现实人际关系和具体语境的影响，较富于感情色彩和个人风格，但总的来说还是服从于说明的需要。文学话语则往往突破了语法结构和逻辑要求，强调个人感情色彩和风格。它一般不作为说明的手段，而是作为描写、表现、象征等形式来反映外部世界，表达主体的情思，甚至刻意追求使用阻拒性言语，因此文学言语比科学言语和日常言语都更富于艺术性、技艺性、个体风格，同一种民族语言在不同的作家手里，在不同语境中，其运用都是千变万化的，富有创新的。", "keywords": "相对独立性更明显 主观性更强 宽松自由的创作环境 文学言语 艺术性 技艺性 个体风格", "note": "自然科学创造依托的是物质规律；人文科学创造依托的是哲学规律；文学创造依托的是美学规律。美是一种主观对于客观的认知，美的主观性特点更加鲜明。而在所有的美学创造中，文学又是最自由的。这是因为文学创造纯粹依托于一种抽象的工具-语言（文字），这种工具比乐谱、颜色、形象等更加灵活自由。通过文学这种形式，我们可以创造出一切我们能够想象出来的人物、环境、情节等。我们还能在文学中嵌入我们的思想，这种嵌入比其他的艺术形式看起来更加明晰。文学可以折射人类生活的一切方面。", "framework": ""}, {"id": "162", "stars": 5, "title": "文学话语与科学言语、日常言语有什么区别？为什么说文学话语是一种创造性的语言", "body": "文学以语言为符号，从这个意义上说，文学是一种语言艺术。但是，文学创造中所运用的既不是语法意义上的“语言”，也不是日常的“言语”，而是具有话语蕴藉的“话语”，即作者个人的言语行为，其中包括人物的独白、对话等。这是文学审美价值的重要构成要素。文学创造就是以话语为原料的生产活动。\n\n一、文学话语与科学言语、日常言语的区别\n\n（一）科学论文、研究报告、技术资料等采用的科学语言，强调严谨的逻辑和语法结构，要求说理清楚、概念明确、不注重个人色彩和风格，显得素材单纯、千篇一律。\n\n（二）日常言语由于发生在具体交往中，受现实人际关系和具体语境的影响，较富于感情色彩和个人风格，但总的来说还是服从于说明的需要。\n\n（三）文学话语则往往突破了语法结构和逻辑要求，强调个人感情色彩和风格。它一般不作为说理的手段，也与普通的言语有一定程度的背离，是一种创造性的语言。\n\n二、文学话语的创造性\n\n（一）文学话语艺术性强，包含着无限意蕴\n\n作为叙述、表现、象征的符号体系，文学话语采用隐喻、暗喻、转喻、暗示、象征等形式，来反映外部世界，表达主体的情思，因此，文学作品中言语的指涉意义往往不是能一眼看穿的，而且相对于指称明确的科学语言而言，文学话语常用来表达或激发情感和态度。例如，杜甫的“恶竹应须斩万竿”中的“竹”，李商隐的“寒梅最堪恨”中的“梅”，彭斯的“红红的玫瑰”中的“玫瑰”，等等，都寄寓着深沉强烈的情感和人格象征；骆宾王的“露重飞难进，风多响易沉”，毛泽东的“俏也不争春，只把春来报”，等等，其含义必须通过联想或想象才能领悟。文学言语与科学言语有较大差别，也比日常言语更富于艺术性、技巧性、个体风格，同时也更含蓄、多义、模糊，往往有限的言语中包含着无限的意蕴。\n\n（二）阻拒性话语的使用\n\n文学话语甚至使用“陌生化的语言”产生不同的艺术效果。普通的语言被强化、凝聚、扭曲、缩短、拉长、颠倒，这些阻拒性的话语迫使我们对语言产生强烈的意识，使对象更加具体“可感”，从而更新对那些日常言语的习惯性反应，更新这个语言所包容的生动的世界。\n\n（三）虚构性\n\n文学语言的虚构性常常制造某种处在变化中的情境，这种叙述会出现多种可能性。\n\n总之，文学语言是一种“舞蹈”的语言，而其他的语言是一种“走路”的语言。文学语言是不断创新的。同一种民族语言在不同的作家手中，在不同语境中，其运用千变万化。所以，文学创造不仅以言语为材料，而且旨在创造新的“话语”，创造具有“话语蕴藉”的文本来塑造文学形象。可见，文学言语是一种创造性的语言。", "keywords": "科学语言 严谨 干篇一律 日常言语 服从说明需要 文学话语 强周个人感情色彩和风格
