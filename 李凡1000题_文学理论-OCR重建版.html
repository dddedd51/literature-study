创造性 艺术性强 无限意蕴 阻拒性话语 陌生化的语言 虚构性 千变万化", "note": "文学语言具有模糊性和暗示性；文学语言中的词语具有特定的含义；文学语言表达的是作者的主观感受，思想价值观。文学语言不同于日常用语，它有着自己鲜明的特色、独特的审美特征。", "framework": ""}, {"id": "163", "stars": 5, "title": "试述文学语言的根本特征以及文学语言与普通语言的不同", "body": "文学语言作为描写、表现、象征的符号体系，常常通过对语言学用语的背离，采用隐喻、暗喻、转喻、暗示、象征的形式来反映外部世界，表达主体的情思。它具有含蓄、多义、模糊的特征。日常语言较富于感情色彩、个人风格和艺术意味，但总的说还是服从说理的需要，以表意明确为主旨。文学语言则明显突破了语言系统的语法结构和逻辑要求，强调个人感情色彩和风格，一般不作为说理的手段。与日常语言相比较而言，文学语言具有内指性，心理蕴含性和阻拒性。\n\n一、文学言语是内指性的，普通言语是外指性的\n\n普通言语指向语言符号以外的现实世界，它必须符合现实生活逻辑，经得起客观生活的检验，并且必须遵守各种形式逻辑的原则。\n\n文学言语则是指向文本中的艺术世界，它不必符合现实生活的逻辑，而是要求与整个艺术世界氛围相统一。例如杜甫的诗句“感时花溅泪，恨别鸟惊心”和“月是故乡明”，明显地违反客观现实，但它指向诗中特定的情境，因此只要符合艺术世界的诗意的逻辑就行了，不必经过现实生活的检验。\n\n二、文学言语侧重表现功能从而具有心理蕴含性，普通言语则侧重指称功能\n\n语言符号一般有两种功能，即指称功能与表现功能。普通言语侧重于它的指称功能，而文学言语则把它的表现功能提到更加重要的位置。文学言语中蕴含了作家丰富的知觉、情感、想象等心理体验，因而比普通言语更富于心理蕴含性。文学言语中的词语，虽然表面上与普通言语一样，但实际上已被赋予不同寻常的心理内涵。雪莱在《西风颂》中写道：“如果冬天来了，春天还会远吗？”这里的“冬天”，“春天”都已被诗人那种希望、神往、憧憬的情绪浸泡过，与普通言语中的意义大不相同，更富于心理蕴含性了。\n\n三、文学言语具有阻拒性，普通言语则是“自动化”语言\n\n文学言语具有阻拒性，这是俄国形式主义者提出来的，对语言进行陌生化处理后达到的效果，它针对的是“自动化”语言，即那些过分熟悉的不再能引起人注意的言语。比如用“弹指间”表示时间过得快，一开始显得很生动形象，但在被大量重复使用后，人们只把它当作一个干巴巴的符号，而不再有新鲜感。文学言语就是要力避这种言语的“自动化”现象，设法把普通言语加工成陌生的，扭曲的，对人具有阻拒性的言语，这种言语可能不合语法，打破了人们理解的常规，甚至不易被人理解，但却能引起人们的注意和兴趣，在延长感知时间，增加感知难度的情况下，反而增强了它的审美效果，形成了文学言语的一大特色。如“表盘上的数字涂上了一种在黑夜闪光的绿色物质”显然是荧光粉。但阻拒性言语不能使用得过滥、过多，要恰到好处。", "keywords": "含蓄 多义 模糊 内指性 外指性 指称功能 表现功能 心理蕴含性 阻拒性 自动化", "note": "文学言语是特殊的言语系统，与一般言语有明显的不同，除了形象性，生动性，凝练性，音乐性等特点外。文学言语还具有内指性，指向文本中的艺术世界，更具有心理蕴含性，更注重表现功能，因而具有阻拒性。", "framework": ""}, {"id": "164", "stars": 1, "title": "试述客体即“自然”说，并谈谈你的看法", "body": "一、客体即“自然”说\n\n客体即“自然”说认为，文学的客体是独立于人之外的自然。这里的“自然”最初指的是客观存在的自然界，后来泛指社会生活。从文学与世界的联系来看待文学活动，在中西方都形成了悠久的模仿论传统。\n\n在西方，最初确立这种观念的是古希腊人，集中体现在“艺术模仿自然”的艺术观中。模仿论的基本观点在于：文艺起源于人对宇宙或世界的模仿。\n\n德国学者奥尔马赫认为，古希腊的模仿论只是西方文艺思想史上的一条线索，与之相对还有另外一个传统，即希伯莱传统或《圣经》传统的模仿论，前者强调文学模仿的对象是此岸世界，后者则着力反映超验世界，因此形成了两种不同的模仿文体，两者的源头分别为《荷马史诗》和《圣经》。\n\n中国古代关于艺术反映论的思想同样自成传统，源远流长。如《周易·系辞（下）》提出“观物取象”说，清代诗论家叶燮在《原诗》中说：“文章者，所以表天地万物之情状也。”这是文论对“观物取象”说的继承与发展。\n\n二、看法\n\n客体即“自然”说把独立于人之外的自然作为文学的客体，显然是不够具体，也过于狭隘了，另外，“模仿”这一概念本身含有轻视主体创造性的色彩，它强调的是艺术家观察、复制自然的能力，轻视了作家、诗人的个体性，从而忽略了文学创作的自主性和创造性。在文学创造活动中，如果作家完全是被动的，或成为自然的奴隶，或他的活动完全从属于别人，那么，他就是“自身的丧失”，就不是真正的文学创造主体，文艺理论史上那种把文学主体归结为单纯的“模仿者”的观点，其根本缺陷就在这里。\n\n【李凡关键词：文学客体独立于人之外 自然界 社会生活 古希腊 艺术模仿自然 此岸世界 希伯莱传统或《圣经》传统 超验世界 中国“观物取象”说 狭隘 轻视主体创造性】", "keywords": "", "note": "“客体即自然”归根结底是艺术反映论的一种表现，而文学表现的客体显然并不仅仅局限于自然，我们应当将更多因素纳入考虑的范围之中。客体即“自然”说这一派的观点可以概括为：文学的客体是独立于人之外的自然。需要注意的是，教材把有些主张文学反映社会生活的观点（如莱辛、巴尔扎克）也归入“自然”概念之中，所以“自然”前面加上“独立于人之外”的限制，因为不仅自然界的自然可以独立于人之外，人类社会生活也可以说是独立于人之外的。", "framework": ""}, {"id": "165", "stars": 1, "title": "试述客体即“情感”说，并谈谈你的看法", "body": "一、客体即“情感”说\n\n与客体即“自然”的文学观相对立的一种理论认为，文学是人的内心世界的表现，文学客体即人的心灵。其中有的认为文学客体是人的思想、理性、意志、抱负、无意识等等，影响最大的是“文学客体即情感”说。\n\n“文学客体即情感”说早在古希腊时代就存在，如柏拉图说艺术模仿“情欲”，但主要盛行于18世纪启蒙主义、感伤主义和19世纪浪漫主义思潮兴起之后。这些思潮的代表人物认为，艺术的职责不是模仿自然，而是表现心灵，表现情感。\n\n20世纪以来，西方关于“文学艺术的对象是情感”的观点被进一步强调和系统化。例如，符号学家苏珊·朗格认为艺术就是把情感呈现出来，就是情感的物化形式，是象征着人类情感的形式之创造。\n\n在中国古代文论中，强调文学艺术是情感表现的观点像一条醒目的红线贯穿始末，如《尚书·尧典》记载的“诗言志”，《乐记》所说的“情动于中，故发于声”，《毛诗序》说的“情动于中而形于言”，西晋陆机《文赋》提出“诗缘情而绮靡”的见解，严羽的《沧浪诗话》也说：“诗者，吟咏情性也”，等等，这些说法实际上就是把情感确认为文学艺术的客体。\n\n二、看法\n\n客体即“情感”说把人的情感列为文学艺术的表现对象无可非议，因为文学艺术对世界的把握主要是一种情感体验的方式，它在反映作家、艺术家体验生活的同时也必然表现作家、艺术家对生活的体验和由之形成的特定情感，但是，如果把文学客体归结为情感，以此否定客观世界作为文学的根本对象，或割断个人情感与社会生活的联系，则是唯心主义的。中国古代的“缘情”说，一般都肯定情产生于对“物”的感受，即“本在人心之感物”，这是辩证的。而西方一些理论家往往把情感与社会生活隔离开来，作为文学的本源和惟一客体，这无疑是错误的。把文学归结为“自我表现”的观点，正是导源于这种错误认识。", "keywords": "客体即人的心灵 艺术模仿“情欲”表现心灵，表现情感“诗言志”客观世界是根本对象 唯心主义", "note": "这一学说认为，文学是人的内心世界的表现，文学客体即人的心灵。与客体即“自然”的文学观相对立的，这一派文学客体观念，具体的主张很多，但可以笼统概括为：文学客体即人的心灵。至于文学反映人的心灵中的什么方面，有的侧重主张反映思想理性，有的侧重主张反映人的意志抱负，有的侧重主张反映人的无意识，等等。其中主张文学反映人的情感，这种意见比较普遍，影响较大，教材着重阐述的是这一种见解。", "framework": ""}, {"id": "166", "stars": 3, "title": "谈谈你对文学创造的客体及其特殊性的认识", "body": "一、文学创造的客体\n\n文学创作的客体是特殊的社会生活，只有社会生活才是文学创造的客体和唯一源泉。\n\n文学艺术作为一种意识活动，它既可以把物质世界作为创造的客体，也可以把客观存在着的特定社会意识、社会心理、文化氛围、历史情境和作家个人对生活的体验等作为创造的客体。这恰恰是文学创造作为一种意识活动与物质交换形式的实践活动的重要区别。意识活动几乎可以反映与人发生关系并被意识到的一切，它们都是意识活动的客体。总之，文学创作的客体是物质生活和精神生活相统一的社会生活。\n\n在文学创造中，无论是侧重于社会物质生活的反映，还是侧重于社会精神生活的揭示；无论是侧重于作家内心生活的抒写，还是侧重于外部生活的描绘，归根到底都是社会生活的反映。一切文学作品都有社会生活的根源，社会生活是文学创造的源泉，也是唯一的源泉。\n\n二、文学创造客体的特殊性\n\n社会生活是文学创造的唯一源泉，但是作为文学创造客体的社会生活有其自身的特殊性。\n\n（一）文学创造的客体是整体性的社会生活\n\n文学艺术和科学认识所反映的社会生活的差异首先在于：前者是整体的社会生活，后者是某一方面或某一层次的社会生活。科学固然要捕捉生活现象，但这不是它的根本目标，它总是力图透过事物干奇百怪的现象，追寻生活的本质和规律，可见，科学反映的生活既是一方面的生活，又是本质的、一般的生活，而不是整体性的生活。\n\n所谓整体性的生活，是指既不局限于某一方面，也不局限于某一层次，而是多方面生活的交融、渗透，是现象与本质、具体与一般相统一的社会生活。文学艺术反映的生活就具有这种整体性。\n\n（二）文学创造活动的客体是具有审美价值的或经过审美提炼而具有审美价值的社会生活\n\n所谓具有审美价值的生活，指的是那些本身就具有美的属性的生活，如社会美、自然美。文学在反映生活时，一般地说，总是努力去发现和表现那些本身就具有审美价值的事物，而对那些不具有任何社会意义和审美价值的丑的事物总是摒弃的。\n\n然而，这决不等于说文学不能反映丑的生活，或者说，丑的生活不是文学的现实客体。现实中的丑本身不具备审美价值，不能引起人们的美感，但是，丑的事物，经过艺术家、作家的揭露和批判塑造成艺术形象，也就具有审美价值了。\n\n然而科学显然不同，科学对研究对象的选择并不以对象是否具有或是否可以转化为具有审美价值的事物为原则，而是以对象是否具有认识价值为原则，科学关心的始终是现象底下的本质规律，而不关心这些现象的美丑。再丑的现象，也可以成为科学研究的对象，只要这种研究对人类有益。\n\n（三）文学创造的客体是作家体验过的社会生活\n\n文学创造的客体是整体性的、具有审美价值的或可以转化为审美价值的特殊生活，但是，这种特殊生活当它还处于自在状态时，仍不能成为文学创造的真正的现实客体。因为没有人对客体的感觉，客体就不能现实地成为人的客体。同样，当某种生活不与作家发生关系，作家没去体验它，即感受、体味、思索、与之发生情感交流时，它就不会成为作家描写和表现的对象。曹雪芹如果没有对封建社会晚期青年男女不幸命运的熟悉、体验，那些不幸青年男女的生活就不会成为《红楼梦》的反映对象；钱锺书如果没有对旧式知识分子的生活和心态的体验，那群处于“围城”状态的知识分子又怎么能成为作家创作的现实客体呢？可见，只有经过作家体验过的生活，才是文学创造的实际客体。", "keywords": "特殊的社会生活 客体 唯一源泉 整体性的社会生活 审美价值 具有美的属性 作家体验过的社会生活", "note": "社会生活作为人的物质生活和精神生活的总和，极为丰富和宽广，而作家所感受、体验到的生活总是有限的。即使如此，能成为作家创作对象的，或者说，能成为文学创作的现实客体的，也只能是作家所感受、体验过的生活（当然，间接感受、体验的生活仍可以写）。", "framework": ""}, {"id": "167", "stars": 2, "title": "谈谈你对文学创造的主体即“模仿者”与“创造者”的理解与评价", "body": "一、文学创造的主体是“模仿者”与“创造者”\n\n西方的艺术模仿说认为，如果艺术是对自然的模仿，那作家、艺术家就是“模仿者”。不过，持这种观点的许多文艺理论家、艺术家在具体理解上存在着差异。\n\n（一）在柏拉图看来，艺术家作为模仿者是缺少“真知识”的无能的人，因为他们不能直接模仿“理念”，只会制造出一些和“理念”（真理）相隔甚远的影像。因此，他认为艺术家作为模仿者也只是机械的临摹者，“影像”的复制者。\n\n（二）亚里士多德则认为，诗人对自然的模仿并非依样画葫芦的被动者，而是不同于历史学家的主动创造者。“历史学家与诗人的差别......在于前者叙述已发生的事，后者描述可能发生的事。”持这一观点的理论家强调艺术家、诗人的创造性，强调通过想象、虚构，把理想与现实结合起来。\n\n（三）18世纪以后，艺术“模仿说”受到冲击，特别是在18世纪末叶和19世纪初中叶浪漫派对“模仿说”的批驳中，人们普遍强调艺术的想象与创造的本质，强调艺术家、诗人作为创造者的主体地位，如浪漫派诗人华兹华斯响亮地宣称，艺术家就是创造者。这种观点不断为后人所重申。\n\n二、看法\n\n（一）“主体即模仿者”的说法并不妥帖，“模仿”这一概念本身含有轻视主体创造性的色彩，它只强调艺术家观察、复制自然的能力，而没有揭示人的主动性、能动性、创造性，容易把艺术家引向依靠技术临摹自然的道路上去，从而把艺术家降低为复制物品的工匠。\n\n（二）“主体即创造者”把艺术主体看作创造者，肯定了人的生命活动的突出特征，是完全正确的，艺术家的天才就表现在他的创造才能上。但是，任何艺术创造都不是随心所欲的，都要受到客体对象的制约，正如席勒所说，艺术创造“在保留自由地处理历史事件的权力下，依然需要遵守严格的自然的真实性的法则”。因此，以往的“创造者”说并未能辩证地揭示艺术主体作为创造者的全部内涵。", "keywords": "柏拉图 复制者 亚里士多德 创造性 浪漫派 创造者的主体地位 模仿者不妥 创造者正确 客体对象制约", "note": "文学创造的主体是存在于艺术生产活动中的艺术生产者，即作家这种特殊的生产者。人并非任何时候都可以称为主体，只有当人处于与特定客体的特定关系中并对客体的主动、主导地位具有主体性时，人才是真正的主体。", "framework": ""}, {"id": "168", "stars": 2, "title": "谈谈中外文艺理论史上对于文学创造的主体即“旁观者”与“移情者”的阐释，并作出你的评价", "body": "一、文学创造的主体即“旁观者”与“移情者”\n\n（一）文学创造主体是“旁观者”\n\n西方有的理论家从审美的角度，认为艺术主体是生活的“旁观者”。古希腊哲学家毕达歌拉斯就认为，那些能获得审美愉快的人包括艺术家，就是处于游离于现实利害关系之外的“旁观位置的人”。后来的康德、叔本华、闵斯特伯格、布洛都把艺术主体看作与现实无利害关系、无须理会对象功利价值、与对象保持一定心理距离的审美者，即生活的旁观者。\n\n中国古代老庄哲学中的“虚静无为”说、苏轼的“游心物外”说等，都间接或直接地说明了艺术主体超然于现实功利的特征。\n\n（二）文学创造主体是“移情者”\n\n西方另一些理论家认为，艺术主体实质上是移情者。德国心理学家费舍尔父子、立普斯、伏尔盖特等都是这种观点的代表人物。立普斯说，人们在对周围世界进行审美观照时，不是主观地被动感受，而是自我意识、自我感情以至整个人格的主动移入；通过“移入”使对象人情化，达到物我同一，“非我”的对象成为“自我”的象征，自我从对象中看到自己，获得自我的镜像，从而产生美感，由此他认为，艺术家等审美主体（包括欣赏者）就是移情者。伏尔盖特进一步把审美移情说用于说明艺术问题，认为艺术创造和艺术欣赏一样，都是移情活动，都是把自我感情投射到外在对象上去，因此，艺术主体实质上就是主观感情的给予者。\n\n二、看法\n\n（一）“主体即旁观者”的说法，指出了艺术家在创作中的非功利心理状态，是有一定道理的，但它走向极端，把艺术家描述为不食人间烟火、超现实超历史的世外人，无疑是不切实际的。艺术家作为审美者，有超脱个人功利心理的一面，但作为有思想、有情感、有血肉的人，必然以一定的功利眼光去审视世界、投入现实，不可能作为纯粹的“旁观者”。\n\n（二）“主体即移情者”的说法，在说明艺术家于创作活动中情感活动的某些特点和客体人格化的原因方面，也不无道理，但它把移情看作艺术创作的普遍规律，把主体归结为移情者，就过于简单化了；进一步说，它把艺术作品仅仅看作主体情感的外射，否认了客体的根本意义，也是不可取的。", "keywords": "审美的角度 旁观者 虚静无为 游心物外 移情者 非功利心理状态 极端 功利眼光 客体人格化 简单化", "note": "中国古代文论是重视创作主体研究的，但侧重于主体的人品、精神气质、知识修养等方面的研究，研究的方法是感悟性的，具有总体的朦胧性；西方美学注重主体审美心理的功能结构研究，现代西方美学注重深层心理研究，但这种研究具有唯心主义倾向和形而上学性质，其片面性和非理性的局限是明显的。", "framework": ""}, {"id": "169", "stars": 3, "title": "谈谈你对文学创造的主体的认识", "body": "一、文学创造的主体是存在于艺术生产活动中的艺术生产者\n\n文学创造的主体首先必须存在于文学创造活动中，并创造文学产品。在文学创造活动中，如果作家完全是被动的，或成为自然的奴隶，或他的活动完全从属于别人，那么，他就是“自身的丧失”，就不是真正的文学创造主体，文艺理论史上那种把文学主体归结为单纯的“模仿者”的观点，其根本缺陷就在这里。因此，只有处于文学生产活动中并具有主体性的即自由自觉的创造者，才是真正的文学创造的主体。\n\n二、文学创造的主体是美的体验者、评价者和创造者\n\n文学活动属于价值判断的活动，更具体地说，属于审美价值判断的领域。文学创造的过程必然包含主体对客体的认识与评价。在文学活动中，主体对客体的活动是一种观念活动，但与科学认识不同，他主要通过对具有审美价值的客观事物即审美客体（包括物质客体和观念客体）的直观感受、情感体验，对对象作出审美判断和评价，并在这个基础上运用文学话语创造出具有审美价值的艺术世界。因此，文学创造的主体既是美的体验者、判断和评价者，又是美的创造者-艺术创造的主体与其他创造者的主要区别就是这里。\n\n三、文学创造的主体是具体的社会人\n\n文学创造的主体作为艺术生产者、审美者，既是具体的个体，又是社会的个体，是具体的社会人。\n\n（一）文学创造的主体都是具体的个体。这里的“个体”固然首先指在文学创造中的作家、诗人都是一个个具体的“单个人”，但还包含着深一层的意义，即指文学活动作为一种意识活动必然都是个体的活动。否定作家、诗人的个体性，也就否定了文学创作的自主性和创造性。\n\n（二）人又是现实的人、社会的人，我们既不能抹煞人的个体存在，又不能把个别的人从社会关系中孤立出来，变成超现实、超历史的抽象物，而应该从社会和社会关系中来理解人的个体存在。实际上，任何个别的作家、诗人不可能是生活在社会和一定社会关系之外的孤立的个体，他们对生活的审美感受、审美体验、审美判断和评价以及运用文学语言反映生活的技艺、风格，都受到时代精神、社会意识、公共心理、民族特性、阶级意识等因素的影响。\n\n总之，作为文学创造的主体，任何作家、诗人都是具有社会生命、社会灵魂的“单个人”，或者说，都是具体的、个别的社会人。", "keywords": "存在于艺术生产活动 主体性 美的体验者、评价者和创造者 具体的社会人", "note": "文学创造的主体具备多种属性，但其首先必须存在于文学创造活动之中，具有主体性。同时，文学创造的主体还是美的体验者、评价者和创造者，并且是具体的社会人，所以说文学创造的主体是特殊的艺术生产者。", "framework": ""}, {"id": "170", "stars": 2, "title": "能否说“凡是写作的作家就是文学创造的主体”？如何理解“作家是美的体验者、评论者和创造者”", "body": "一、处于文学生产活动中并具有主体性的作家才是文学创造的主体\n\n所谓文学创造的主体指的就是作家这种特殊的生产者即是艺术创造者，但这并不意味着凡是写作的作家就是文学创造的主体。因为“主体”这个概念是有特定涵义的，人并非任何时候都可以称为主体，只有当人处于与特定客体的特定关系中并对客体的主动、主导地位具有主体性时，人才是真正的主体，文学创造的主体首先必须存在于文学创造活动中，并创造文学产品。没有文学创造也就没有文学创造的主体。然而，在文学创造活动中，如果作家完全是被动的，或成为自然的奴隶，或他的活动完全从属于别人（例如在资本主义社会，某些作家一开始就从属于资本），那么，他就是“自身的丧失”，就不是真正的文学创造主体，文艺理论史上那种把文学主体归结为单纯的“模仿者”的观点，其根本缺陷就在这里。文学创造的主体属于精神生产者，一旦作家从属于资本，被他人如书商所雇佣，以赚钱为目的，他就丧失了部分主体性，就不是文学创造的完整主体了。因此，并非凡是写作的作家就是文学创造的主体，只有处于文学生产活动中并具有主体性的即自由自觉的创造者，才是真正的文学创造的主体。\n\n二、作家是美的体验者、评论家和创造者\n\n人类掌握客观世界的活动可以分为物质实践、科学认识和价值判断（评价）三种方式，相应地，人在这三种活动方式中也就分别扮演着物质实践主体、认识主体和价值判断的主体三种角色。\n\n文学活动属于价值判断的活动，更具体地说，属于审美价值判断的领域。文学创造的过程必然包含主体对客体的认识与评价，作为审美判断，文学活动虽然不等于认识，却离不开对生活的认识，否则文学作品就不能深刻地反映生活和揭示生活的某些本质规律；文学作品之所以能在给人以美的享受的同时也给人以真的启示，善的教育，正是由于审美判断中包含主体对生活的深刻认识。在文学活动中，主体对客体的活动是一种观念活动，但与科学认识不同，他主要通过对具有审美价值的客观事物即审美客体（包括物质客体和观念客体）的直观感受、情感体验，对对象作出审美判断和评价，并在这个基础上运用文学话语创造出具有审美价值的艺术世界。因此，文学创造的主体既是美的体验者、判断和评价者，又是美的创造者-艺术创造的主体与其他创造者的主要区别就是这里。", "keywords": "处于生产活动 主体性 审美价值判断 对生活的认识 情感体验", "note": "在对某些观点或评论发表意见时，如果这个观点表达得过于绝对，我们就要提高警惕，因为这样的观点往往是片面的。回答类似的问题，我们首先要给出自己的判断，然后结合所学知识进行辩证分析。", "framework": ""}, {"id": "171", "stars": 1, "title": "举例分析文学创作活动中创作主体与生活对象之间的关系", "body": "文学创造活动中创作主体有着相应的规定性，这种规定性表现为受动性和能动性。\n\n一、受动性\n\n受动性是指作家要受到他所生活的时代的历史条件和社会关系的制约，作家不可能任意地选择自己所喜欢的历史条件和社会关系，作家的生活、经验、情感、见解、心理结构和审美智能结构，归根到底都是由一定的历史条件和社会关系决定的，不可能超越一定的历史条件和社会关系。鲁迅选择阿Q这样的人物，与当时辛亥革命的失败和国民心灵普遍麻木的社会生活情景密切相关。再如文化大革命后“伤痕文学”的出现，也与否定“文化大革命”这一“历史悲剧”的时代背景有关。\n\n由此可见，作家总是生活在一定的社会环境、一定的文化传统中，他选择何种生活为创造的具体客体，都必然受到社会生活这个“一般客体”的规定的制约，创作主体的一切创造性活动，包括虚构、想象、情感投射，观念移注等，都不可能离开具体客体进行纯粹任意的胡编乱造和情感发泄。因此作家必须深入生活，积累丰富的生活经验和材料。假如高尔基青少年时期没有在伏尔加河流浪，没有在船上当过厨子，没有在码头当过搬运工，没有当过面包师，是不可能写出《童年》《在人间》《我的大学》等作品的。不仅创作类似《童年》等这样叙事性的作品需要丰富的生活积累，创作以抒发情感为主的作品同样需要丰富的生活积累，因为情感、思想只能来自生活积累，没有亲身体验，就很难作出准确真实的评价，也就很难引起读者共鸣。如陈子昂的《登幽州台歌》，寥寥几句却引千古感慨，这与他个人的经历、抱负是分不开的。\n\n二、能动性\n\n能动性是指作家的创作以及审美智能结构和心理结构虽然受制于一定的历史条件和社会关系，但这并不意味着作家是被动地接受，而是通过作家的能动选择接受的。生活在一定历史条件下和社会关系中的作家都有自己的主体意识，可以主动地去选择、接受生活对象。任何生活对象，也只有在进入作家主体意识后才有文学意义，例如中国古代诗人同是写月亮，就有成百上千的意象，“人有悲欢离合，月有阴晴圆缺”，“共看明月应垂泪，一夜乡心五处同”，“露从今夜白，月是故乡明”等等。\n\n综上所述，在文学创造活动中，作家既要受到一定生活对象的限制，又可以发挥主观能动性，通过情感体验和感性直观在作品中创造出全新的形象。", "keywords": "规定性 受动性 能动性", "note": "作家生活和创作之间的关系，正如我们经常所说：艺术来源于生活，高于生活。比如大家熟知的曹雪芹先生和《红楼梦》，没有真实的生活体验，是写不出荣国府和宁国府中那些生活场景的；如果杜甫没有切身的感受，不会创作出《三吏》 《三别》那样的诗作。这就是生活给了作家创作的素材和艺术的源泉。", "framework": ""}, {"id": "172", "stars": 5, "title": "如何理解文学创造中主客体关系的特点", "body": "文学创造作为一种审美活动，其主客体关系实质上就是一种审美价值关系，文学创造的主体-作家首先是审美者，是审美价值的评价者和创造者，而客体（包括物质客体和精神客体或两者的统一）首先是作为主体的审美评价对象，作为审美的价值客体。文学创造的主客体关系就是审美主体与审美客体所构成的审美价值评价关系。其特征如下：\n\n一、创作主体对客体审美价值的评价以情感体验为心理特征\n\n在文学创造活动中，主体对客体的审视总是以情观物，在这种情感体验中去发现自身与对象的情感关系，对于那些与人的情感不相干的客体，作家是不会去关心它的，一旦客体与主体发生某种诗意情感联系时，主体就会对它倾注全部热情，即所谓“登山则情满于山，观海则情溢于海”。于是，“人有悲欢离合，月有阴晴圆缺”，“共看明月应垂泪，一夜乡心五处同”，“露从今夜白，月是故乡明”；于是一江春水，寄托着人生几多愁，几竿修竹，看似有情有爱也有乐。......这就是情感体验而非理性思考的结果。\n\n二、创作主体对客体审美价值的把握以感性直观为思维特征\n\n文学创作作为一种审美活动，主要是一种感性活动，主体不以概念为中介而是以形象为中介去连接客体，并始终不扬弃客体的个别性，不粉碎客体的个别形式，客体始终以具体形象向主体展现自身，所以，创作主体对客体的把握始终是一种感性直观的思维方式，而作为主客体统一产物的艺术作品也必然呈现为一种具体生动的形象，所以创作主体与创作客体之间是以感性真理为联系的。\n\n总之，情感体验和感性直观是文学创造中主体把握客体的特殊心理活动形式。换言之，在文学创造中，主体的情感体验和感性直观是连接主客体关系的纽带。这就是文学创造的主客体关系的特殊性。", "keywords": "审美主体 审美客体 审美价值关系 情感体验 感性直观", "note": "文学创作的主体是作家，即审美者，也称审美价值的评价者和创造者。文学创作的客体，即物质和精神客体，也称审美的评价对象和精神客体。而文学创作的主客体关系，就是审美主体与审美客体所构成的审美价值评价关系。", "framework": ""}, {"id": "173", "stars": 4, "title": "如何理解文学创造中主客体的双向运动", "body": "马克思的“生产”理论有一个重要的内容，生产是主客体之间的相互作用、相互生产；主客体的关系不是主体对客体的单向运动，而是主客体之间的双向运动。文学创造作为一种生产也不例外，其主客体关系建立的过程就是创作主体和创作客体双向运动的过程。文学创造中主客体的双向运动，主要表现在以下方面：\n\n一、文学创造客体“主体化”\n\n主体能动地、审美地反映客体，即主动地选择客体和加工处理客体的有关信息；并通过情感体验，把自我的意识、情感对象化，即将客体“主体化”，在观念中创造出源于客体又超越客体的审美形象。在这个过程中，创作主体始终处于主导性、主动性的地位并显示出能动创造的特征。这是因为人是一种有意识的生命存在，能依照自己的需要、目的和意志去衡量对象和进行生产。这就是创作主体之所以始终处于主导性地位和具有主观能动性、创造性的根本原因。创作主体的主导性、能动性、创造性表现在两个方面：\n\n（一）体现在对创作客体的选择上，文学创造的客体是特殊的社会生活，文学创造要反映的对象总是具体的，即社会生活中的某个方面、某个事物，我们称之为“具体客体”，那么，文学创造反映社会生活，主体就必须能动地选择“具体客体”作为反映对象，例如鲁迅主要选择“病态社会”的“病态人生”为“具体客体”。\n\n（二）体现在实际创造过程中对“具体客体”的剪裁、缀合、概括、综合、虚构、想象和情感化、观念化上，也就是对客体进行变形、情感投射和观念移注，在这个过程中，客体被主体重新塑造，受到主体心灵的“洗礼”，而转化为表征一定意义的客观形式，转化为一种有意味的生动符号。就是说，通过创作主体的能动创造，按照作家“内在的尺度”即作家对生活的认识和审美需要、审美目的、审美理想，将生活客体转化为主客体统一的艺术品。\n\n二、文学创造主体“客体化”\n\n在文学创造的主客体关系中，客体处于非主导的、被动的地位。但是，主体从选择具体客体开始到对具体客体的重塑整个过程，都要从生活出发，以生活为依据，也就是说，始终受到客体的规定和制约。\n\n例如创作主体选择何种具体客体为反映对象，就不仅仅取决于主体“内在的尺度”，也取决于外部“种的尺度”，即客体的尺度，包括政治的、经济的、文化的和社会心理、社会意识等多种生活因素的规定和制约。鲁迅选择阿Q这样的人物，与当时辛亥革命的失败和国民心灵普遍麻木的社会生活情景密切相关。再如文化大革命后“伤痕文学”的出现，也与否定“文化大革命”这一“历史悲剧”的时代背景有关。\n\n由此可见，作家总是生活在一定的社会环境、一定的文化传统中，他选择何种生活为创造的具体客体，都必然受到社会生活这个“一般客体”的规定的制约，创作主体的一切创造性活动，包括虚构、想象、情感投射，观念移注等，都不可能离开具体客体进行纯粹任意的胡编乱造和情感发泄。有时主体甚至因为客体的制约和影响而改变原先的构思，从这个角度说，文学创造中，客体也使主体“客体化”了。\n\n总之，文学创造是一种主客体的双向运动，一方面是客体的“主体化”，另一方面是主体的“客体化”，这两个方面的统一就实现了主客体的统一，文学作品就是创作主体与创作客体的统一并对主客体双重超越的产品。\n\n【李凡说：文学创作中主客体的双向关系包括两个方面，一是主体的“客体化”，即把自我意识情感对象化，二是客体的“主体化”，即对客体的变形、情感投射。】", "keywords": "客体“主体化”主体 能动审美 主导性 主体“客体化”客体 非主导 规定制约 客体主体化", "note": "", "framework": ""}, {"id": "174", "stars": 2, "title": "作家获取材料的途径有哪些？具体怎样", "body": "作家获取材料的途径有两种分法，一种是无意获取和有意获取、一种是实践获取和书本获取。\n\n一、无意获取和有意获取：按作家精神专注的趋向和程度而划分\n\n（一）无意获取\n\n无意获取是作家从小在社会生活和实践中所接收到的大量刺激。对于这些刺激，他虽然没有有意地记忆或着意地思索，但它们却作为连续不断的信息流悄悄地进入大脑，有些甚至会在长期记忆中扎根。作家，只要生活在社会中，就有各种刺激和信息（或普通或特殊）不断地“侵犯”他，“骚扰”他，其中必然包含着可用来从事文学创造的大量材料。例如，法国著名作家普鲁斯特，一生除家乡小镇伊利耶和首都巴黎之外没去过任何地方。35岁以后，他更是“终年生活在一间门窗经常不打开的房间中”。但这并不妨碍他写出世界名著、七卷本的《追忆似水年华》。普鲁斯特从事文学创作的材料，主要就是通过无意识获取的途径得到的。\n\n（二）有意获取\n\n有意获取，是指作家出于某种理想冲动，或为了完成某一个创作任务，而围绕一个中心，并采用有意记忆（或笔记、摄影等）的方式，去有意接受刺激或积累信息的途径。例如，罗曼·罗兰、纪德到十月革命后的苏联采访，巴金到朝鲜战场考察，都属此类。但必须说明的是，处于这种境况的作家，虽可能被热情所驱使，然而心灵深处却无法摆脱一种无意识定位，即把自己视为短暂的投身者、参与者或局外人。这导致他们往往不自由地以两种极端眼光-或批判、或挑剔-来看待所接受的那些刺激和信息。\n\n二、实践获取和书本获取：按作家获取材料的渠道来划分\n\n（一）实践获取\n\n实践获取，主要指作家主动（或被迫）投身某一生活领域（或某种社会实践）去感受刺激，并获取信息的途径，这种材料又叫作直接材料。例如，司汤达从军，凯尔泰斯被投入“奥斯威辛”，王蒙遭流放，陀思妥耶夫斯基、索尔仁尼琴、从维熙、张贤亮进监狱......都属此类。很明显，这种日复一日的既单调而又严酷的生活实践，对本人来说，并非易事，而是一种无奈的求生，但却丰富了这些作家的记忆储备，直接获取了许多难忘的文学创作材料。\n\n（二）书本获取\n\n书本获取，则是指由于文学的意识形态性质，它常常要依据前代或古人传递下来或同代人所提供的思想材料来从事创作，所以又叫作间接材料。例如，凡尔纳一生创作的100多部幻想小说，其材料大部分都是从法国国立图书馆的书刊中获取的。", "keywords": "无意获取 有意获取 精神专注的趋向和程度 实践获取（直接材料）书本获取（间接材料）获取材料的渠道", "note": "著名散文作家秦牧说：“一个作家应该有三个仓库：一个装生活中得来的材料；一个装间接材料的仓库，即装书籍和材料得来的材料；另一个就是日常收集的人民语言的仓库。”", "framework": ""}, {"id": "175", "stars": 4, "title": "艺术发现的心理特征是什么？它在文学创造的过程中有什么作用", "body": "一、心理特征\n\n（一）艺术发现是作家心灵的蓦然领悟。在产生此一发现之前，作家都有相对长久地沉思于某一事物的心理经验，所谓“用志不分，乃凝于神”。蓦然领悟的发生，只不过是内心经验酝酿后从阈限下的破土而出。\n\n（二）艺术发现是作家独特眼光和非凡观察力的结合，体现着深层的心理内容。对作家来说，这种独特眼光和非凡的观察力不是外在于他的东西，也不是某种技巧、方法，甚至也不仅是天才，而是和他的内在蕴藉有关的深层的心理内容的外射。他们之所以能在此事物中发现别人不能发现的东西，是彼时彼境的需要、情绪、态度、价值观和凝聚成团的早先经验等许多因素综合作用所产生的无意导向。\n\n（三）艺术发现虽然是对外在事物一种独特的把握，但在这种把握中，外在事物常常只是一个机缘，是这个机缘的某一突出之点与作家个人内心体验的契合。从物理世界看，手指活动只是有机体机械力的运动，当茨威格由此而发现赌徒正在挣扎的灵魂的时候，便融进了自己的内在体验。\n\n（四）艺术发现并不改变原来的事物，而只是把透过独特眼光所看到的成分注入其中，从而在知觉中出现一个新的创造物。这个创造物灌注着作家的内心经验，近似原物实际却是世上从来没有过的东西。例如周敦颐所礼赞的莲花，其外表并没有超出它在自然界的植物性状，但蕴含着士君子高雅情操的莲花却是独特的“这一个”。\n\n艺术发现是作家在内心积累了相当多的感性材料的基础上，无意识地依据自己认识生活和评价生活的思想原则和审美趋向，对外在事物进行观察和审视时所得到的一种独特的领悟。\n\n二、艺术发现在文学创造过程中的作用\n\n（一）艺术发现是文学创造活动发生的最早契机\n\n虽然生活是文学的惟一源泉，材料是文学创造的起点，但艺术发现却是文学创造赖以发生的根由。没有艺术发现，没有启迪，没有爆出思想火花，没有从外在事物或现象中看出宇宙或人的生命的本质，并借此唤起能量，作家就不能进入创造过程的大门。艺术发现像一盏灯塔，照亮了主体积储在记忆中的有关材料，并使其在短暂的瞬间，围绕此种发现进行有序的排列组合，从而进入创造过程。\n\n（二）作家依靠艺术发现找到事物的新特征\n\n有了艺术发现，作家能从习见的事物中独具慧眼地看出某种新成分或新特征，从别人熟视无睹的现象上察觉出潜藏于其下的非凡意蕴，从极平凡、极平淡的旧形式之间寻找到不同的排列组合方式-一种异乎寻常的新形式。此时，不管发现多么微小，但正是“所发现”的这一点，迅速成为作家从事文学创造的突破口。正因为如此，艺术发现被称为“艺术家的眼睛”。例如，周敦颐从莲花见出君子的本色，鲁迅从车夫透视出自己的“小我”，茨威格从手指活动中窥测到青年赌徒灵魂的挣扎和搏斗。显然，正是作家的艺术发现，使这些原来常见的事物以一个新面貌、新形式出现在读者面前，成为蕴含着作家张显人生本质、透视灵魂的独特的“这一个”。\n\n（三）作家依靠艺术发现创造出独创性作品\n\n艺术发现对整个文学创造过程也具有重要作用。没有艺术发现，作家创造不出独创性的文学作品。因此，作品的独特风貌及其内在灵性，一般都是以艺术发现中那不同寻常的“发现”为基础进行独特开掘而形成的。", "keywords": "心理特征 蓦然领悟 独特眼光和非凡观察力的结合 机缘的某一突出之点与作家个人内心体验的契合 知觉新的创造物 最早契机 新特征 独创性", "note": "艺术发现是作家由内心积累得相当多的感性材料所引发，并与作家当前由于某种“关注”而形成的心理趋向、优势兴奋中心相联系，突然间向外在事物、事件、现象的投射。因此，艺术发现是作家在内心积累了相当多的感性材料的基础上，无意识地依据自己认识生活和评价生活的思想原则和审美趋向，对外在事物进行观察和审视时所得到的一种独特的领悟。", "framework": "作家心灵的蓦然领悟 体现着深层的心理内容 心理特征 机缘的某一突出之点与作家个人内心体验的契合 艺术发现的 把透过独特眼光所看到的成分注入其中，从而在知觉中出现一个新的创造物 心理特征和作用 艺术发现是文学创造活动发生的最早契机 作用 作家依靠艺术发现找到事物的新特征 作家依靠艺术发现创造出独创性作品"}, {"id": "176", "stars": 3, "title": "谈谈你对创作动机的认识", "body": "创作动机是驱使作家投入文学创造活动的一股内在动力。在文学创作中，创作动机常常是暗中支配和决定作家搜集材料范围及其艺术发现方向的潜在操纵力量。创作动机的有无，不但是作家所有文学活动能否实现的枢纽，而且也是他每一具体的文学创造过程能否完成的关键。\n\n一、创作动机的生成\n\n创作动机的生成，总的说来，是由现实生活所暗示的，但具体加以研究就会发现，创作动机作为文学创造活动的内驱力，它的产生和运动其实是作家极为复杂的生理和心理现象在文学创造过程中的表现。创作动机的动态轨迹可作如下描述：“作家（艺术家）的创作动机是由内部需要或外部的刺激所引发的，在体内失衡的情况下形成易感点，并经外在触媒的碰撞而突发的带有极强的行动力量，且对整个创作过程起支配作用的隐的或显的意念或意图。”在每一具体的文学创造的发生阶段，创作动机的触发与外在机缘有密切关系。外在机缘即外在刺激物，它能使作家的内在蕴藉和奔突的热情找到倾泻的渠道，使原先焦躁不安的盲目驱力变为明确而坚定的意图，并把现实生活中获得的有用材料和艺术发现贯穿起来，使文学创造由意图变为行动。\n\n二、创作动机的类型\n\n文学创作动机可以分为远景动机与近景动机、主导动机与非主导动机、高尚动机与卑下动机、有意识动机与无意识动机等多种类型。\n\n三、创作动机的作用：文学作品是在动机冲突下完成的\n\n文学活动中复杂的创作动机一旦被触发，作家内心便开始了激烈的子动机冲突。子动机冲突所造成的每一具体作品的创造过程的多样化，所造成的个体创造行为、创造模式的多样性，都将给最终成型的物态化的文学产品打下深刻的印记。\n\n可以说，不同的文学创造过程都存在着不同样式和不同程度的动机冲突，一切文学作品都是在程度不同的动机冲突中完成的。", "keywords": "内在动力 暗中支配和决定 潜在操纵力量 生成 类型 作用", "note": "理解创作动机的内涵时，我们可以从定义（内在动力、潜在操纵力量）、重要性（关键）、来源（表现）、触发点（外在机缘）、分类（多种类型）几个层次进行理解记忆。这部分内容多以名词解释的形式出现，大家在作答时，记得将这几个要点都回答出来，并且要作适当地展开。", "framework": ""}, {"id": "177", "stars": 3, "title": "请简述回忆与沉思这一心理现象", "body": "艺术构思时的心理机制是十分纷繁复杂的，回忆与沉思是其中常见的重要的心理现象。\n\n一、回忆\n\n（一）回忆就是积极地和有意义地从记忆中提取信息\n\n回忆是艺术构思的重要机制。有时作家有一个很好的创作意念，却苦于无法下笔，这并不是因为他缺乏材料，而是因为大脑中一时回忆不起来有关的信息，或暂时无法在意念与信息之间建立联系。在艺术构思中，回忆常常是由外在刺激或内部需要在特殊情况下激活了某一意念而发生的。人在记忆时往往自发地将信息压缩为一簇簇的集合体，一个集合体就是一组内☑部联系紧凑的信息项，它能够像一个单词一样被记住。当外在的刺激或内在的需要与某一创造意念挂钩时，神经传导活动便迅速把它传到大脑的相关区域，此时，创造主体便可以在那些集合体中扫描，并找出所需要的信息。\n\n（二）回忆方式\n\n作家在艺术构思中常用的回忆方式有：直接回收法，即把那些对自己刺激最强（或最熟）的信息直接与中心意念挂钩；挨次扫描法，即对记忆的所有有关内容反复而有系统地搜寻，直到找出所需要的信息；按层次推论法，即作家把所需回忆的信息按类别、分层次地在头脑中搜查，并不断地与中心意念相联系、比较，以提取最准确、最能符合意念的信息。\n\n应该指出的是，回忆所提取的信息不是对记忆材料的机械重现，而是在理性思维的参与下对以往经验的筛选，被筛选出来的材料也不可能原模原样进入作品，还需经过加工、改造和情感的浸润。\n\n二、沉思\n\n（一）沉思是在寂静和孤独中对内心某个形象或某种意念的深沉思索\n\n沉思往往是从对于某个形象或意念的追忆开始，慢慢地越走越远，以致偏离原形象或意念，甚至不经意间已经跨入其他领域时，所得到的意外收获。回忆开始时，作家可能被某物所触而有意地沉潜于与某个形象或某种意念有关的思索中。但由于思考往往像野马一样狂奔乱跑，因而有时思索的主线会脱离原来形象的启示及其轨道，而无意中将思考的重心转移到其他方向。对此，作家一般是茫然无知的，他漫无目的，听之任之。然而，也许就在此时，一种新的发现或一种创造的闪光出现了.例如，奥地利作家茨威格写作《命运攸关的时刻》，就是由深度沉思而得到的，并获得了世界性的声誉。\n\n（二）沉思的又一心理功能是对沉思的对象从事二度体验，使之成为富有诗意的东西\n\n一般地说，未经沉思或二度体验的对象，其客观性很强。由于没有受到主体精神的濡染、驯化，这些对象往往不具有诗意的性质，也不能给人以审美的享受。而经过沉思或二度体验（即使是痛苦的、悲哀的）之后，由于对象的多余部分被作家的独特眼光所剔抉，而不足部分则被填充、改造、丰满、升华，又被其感情所濡染、浸透，无形中便具有了某种可让人玩味的盎然诗意，进而带来审美愉悦。许多作家都喜欢“朝花夕拾”，就是这个道理。例如，苏轼在妻子逝世十年后，才提笔写出意味隽永的“悼亡词”，就是在二度体验中所获取的诗意成果。\n\n沉思之所以最善于发挥创造力，是因为作家在孤独、寂静中比平时更能向内挖掘，更能倾听内心的呼唤，因而新形象、新意念更容易浮现，也更容易被连缀起来。", "keywords": "回忆 记忆提取 沉思 深沉思索 二度体验 诗意", "note": "艺术构思本质上是一种艺术思维：即借助于再现想象，尤其是创造性想象所从事的思维。确切地讲，艺术构思是作家在材料积累和艺术发现的基础上，在某种创作动机的驱动下，通过回忆、想象、情感等心理活动，以各种艺术构思方式，孕育出完整的呼之欲出的形象序列和中心意念的艺术思维过程。", "framework": ""}, {"id": "178", "stars": 4, "title": "如何认识文艺创作中的灵感现象", "body": "灵感是创造性思维过程中认识发生飞跃的心理现象，是作家在内心长期积累、比较、分析材料并艰苦地思索之后，突然在无意之间获得的对所思主题（意念或形象）的一种顿悟。它具有三个特征：\n\n一、非预期性\n\n它是突如其来的，出于作者自己的意料之外，如李德裕在《文章论》中所说：“文章之为物，自然灵气，恍惚而来，不思而至。”而且它来的时间也不确定，或夜深人静睡熟之际，或百思不得其解将要放弃之时，或干其他事情时受到触发或刺激......灵感来时无影，去时也无踪。它是一种“长期积累、偶然得之”的结果，不及时捕捉，就会消失，转瞬即逝。所以当灵感来临时，就是牺牲寝食也要及时捕捉，并尽可能记下全部轮廓。过后，再以“语不惊人死不休”“字字看来都是血”的精神，仔细地从头到尾修改定型。\n\n二、亢奋性\n\n获得灵感的创作主体，往往高度兴奋，有时甚至出现一种迷狂状态，这是主体心理积淀、心理潜流被激活的结果。在灵感状态中，作家往往浮想联翩，内心幻象迭出，情感因之激动不可抑制，有时甚至像犯病一样。\n\n三、创造性\n\n处于灵感状态的作家，思维高度活跃，储备于大脑中的各种材料信息会得到充分运用，这样，极易进入佳句纵横、新意迭出之境界。\n\n从灵感的特征，我们可以看出，灵感对于文艺创作质的提升具有重要意义。但还需说明的是，灵感的降临并不是如古时柏拉图所说是神的功劳，而是主体经过艰苦的艺术构思、苦思冥想的结果。唐代皎然《诗式》云：“有时意静神至，佳句纵横，若不可遏，宛若神助。不然，盖由先积精思，因神至而得乎。”他断然否定了“神助”说，归功于“先积精思”，应该说这是很深刻的见地。清人王国维曾引用柳永的“衣带渐宽终不悔，为伊消得人憔悴”句来形容构思之艰辛，可谓生动形象。总之，对于文艺创作中的灵感现象要辩证地分析，既要看到这些现象，也要认识这些现象之所以产生的根由。", "keywords": "认识发生飞跃 艰苦思索之后 无意之间 顿悟 非预期性 亢奋性 创造性", "note": "灵感，是人们在艺术构思探索过程中由于某种机缘的启发，而突然出现的豁然开朗、精神亢奋，取得突破的一种心理现象。灵感给人们带来意想不到的创造，然而它的产生却是突然而来、倏然而去，并不为人们的理智所控制，具有突然性、短暂性、亢奋性和突破性等特征。", "framework": ""}, {"id": "179", "stars": 4, "title": "直觉在文学创作中的作用是什么", "body": "一、对某事物或现象的瞬间把握\n\n作家对某一独特事物（或现象）的瞬间把握，往往是由直觉得来的。有时，作家对闯入眼、耳、鼻、舌、身等感官的某一毫不起眼的事物（或现象）-可能是一个人、一件事、一朵小花、一株青草，甚或一团暗影、半个字形等-突然着迷，一下子意识到其中有某些东西可“写”。虽然他一时半会讲不出什么道理来，却可能由此出发，逐渐建构起一篇作品。对此，巴尔扎克有很好的体会。他说，有时对一个细节、一个字的洞察就可能唤起一整套意念，再从这些意念的滋长、发育和酝酿中，诞生出一场场显露匕首的悲剧，或妙趣横生的喜剧，-那简直是“你想要什么，就有什么。”英国女作家伍尔夫的著名小说《墙上的斑点》，便是从“第一次”看见客厅墙上的斑点，突然萌生出一连串思绪开始的。\n\n二、作家独有的内蕴发掘\n\n作家第一次听到某故事（或某现象）时，能发觉背后某种异乎寻常的发人深省的内蕴，而这一内蕴就好像是为他准备、为他所见而别人毫无察觉的。这也是直觉的功能之一。例如，1887年6月，阿·费·柯尼把自己从监狱女看守长那里听到的有关罗查利的故事讲给了托尔斯泰。托尔斯泰听了这个故事后，立刻直觉到它背后似乎蕴藏着某种待发掘的东西，马上请求别人把这个故事让给自己。按说是柯尼先听到这个故事的，可为什么它到托尔斯泰手里，才变成了具有警世意义的小说《复活》呢？这说明，柯尼只把查利之事当作轶闻或笑料随便讲讲，而托尔斯泰则从这个故事中“直觉”到一种无法言传的魅力。\n\n由此可见，直觉主要是作家凭借过去的知识积累，过去的经验，已有的、炉火纯青的判断能力和推理能力，并与目前所专注的思想趋向、情绪趋向等相结合，对某种事物（或现象）做出的突破性顿悟。", "keywords": "瞬间把握 内蕴发掘 突破性顿悟", "note": "艺术直觉是文艺家在创作活动中直接、敏锐、迅速地感受、捕捉具有审美价值的形象的一种特殊心理能力。艺术 直觉是凭感官直觉得到的客观对象最初的主观映像，所以它既不完全是感性认识，也不是无意识。其表现形态是感性的、不自觉的、非逻辑的和非功利的，而本质内涵又常是和理性、逻辑、功利目的有内在联系的。它看似先天的本能，实为后天的再造，是以审美主体长期的实践积累、经验积淀、思想修养为内在依据的。艺术直觉在审美判断、艺术创造中有不可忽视的独特功能。", "framework": ""}, {"id": "180", "stars": 4, "title": "试述灵感的特点，并尝试与直觉比较", "body": "一、灵感\n\n灵感是创造性思维过程中认识发生飞跃的心理现象，是作家在内心长期积累、比较、分析材料并艰苦地思索之后，突然在无意之间获得的对所思主题（意念或形象）的一种顿悟。灵感的特点是：\n\n（一）非预期性\n\n它是突如其来的，出于作者自己的意料之外，如李德裕在《文章论》中所说：“文章之为物，自然灵气，恍惚而来，不思而至。”而且它来的时间也不确定，或夜深人静睡熟之际，或百思不得其解将要放弃之时，或干别的事情时受到触发或刺激......灵感来时无影，去时也是无踪的。它是一种“长期积累、偶然得之”的结果，不及时捕捉，就会消失，转瞬即逝。所以当灵感来临时，就是牺牲寝食也要及时捕捉，并尽可能记下全部轮廓。过后，再以“语不惊人死不休”“字字看来都是血”的精神，仔细地从头到尾修改定型。\n\n（二）亢奋性\n\n获得灵感的创作主体，往往高度兴奋，有时甚至出现一种迷狂状态，这是主体心理积淀、心理潜流被激活的结果。在灵感状态中，作家往往浮想联翩，内心幻象迭出，情感因之激动不可抑制，有时甚至像犯病一样。\n\n（三）创造性\n\n处于灵感状态的作家，思维高度活跃，储备于大脑中的各种材料信息会得到充分运用，这样，极易进入佳句纵横、新意迭出之境界。\n\n二、直觉\n\n直觉是指作家凭借过去的知识积累，过去的经验，已有的、炉火纯青的判断能力和推理能力，并与目前所专注的思想趋向、情绪趋向等相结合，对某种事物（或现象）做出的突破性顿悟。其特点是推理过程的省略和事物本质的直接揭示。这是一体化的两个方面。“省略了”推理过程，不是“不要”推理过程，恰恰相反，直接认知和洞察事物，不但要依据过去积累的一切知识和经验，而且这些知识和经验还要烂熟于胸，并经过平时反复多次的推理、判断和使用。只有这样，当某一事物初次呈现在面前时，才能从整体上迅速猜测、洞察、并一跃而抓住其背后隐藏的奥秘。\n\n三、二者区别\n\n（一）灵感是长久思索、艰苦劳动之后的成果；而直觉却是从整体上对事物作出的突兀判断。\n\n（二）灵感发生在久思不得其解之后；直觉却往往发生在第一次碰头之时。\n\n（三）灵感是获取成熟的答案；直觉却是得到推测性的洞察。", "keywords": "非预期性 亢奋性 创造性一突破性顿悟 推理过程的省略 事物本质的直接揭示 长久思索一突兀判断 久思不得其解一第一次碰头 成熟的答案-推测性洞察", "note": "灵感指的是大脑处于创作兴奋状态时一种特殊思维现象，这时它能将不连贯的信息联系起来，达到顿悟。直觉是指一种直接的领悟，不经逻辑思维，不费多少周折的突然发现，突然领悟。", "framework": ""}, {"id": "181", "stars": 4, "title": "在文学创造中，理智与感情的关系怎样", "body": "理智是指作家心理中有意识的、理性的认知（思维）。感情分为情绪和情感，前者指有机体的需要是否获得满足而产生的生理与心理反应，后者指对外在事物或现象的态度、评价及其体验。\n\n一、感情是动力，理智约束动力\n\n感情在艺术构思中是动力因素，而理智则是约束、规范这些动力的嚼勒。对于完整的文学创造过程来说，它们都不可缺少。古人认为：“为文尤须放荡，但又须随时以嚼勒制之”，便很好地道出了它们之间的关系。在文学创造中，两者缺一不可：没有感情徒有理智，理智便有束缚想象力的负作用；失去理智而徒有感情，感情也有将作家推向不知所往的可能。\n\n二.任何理性因素都携带着情感因素\n\n理智与感情之间是冲突还是相互促进，往往被作家当下心理状态所决定。对艺术构思来说，信息在大脑中的储存不单纯是一个个消极的符号，也不是波澜不惊的死板材料，相反，任何信息（符号、材料）都携带着一定的情绪能量或情感因子。这就是说，作家对内心有关刺激、信息、符号、材料的积累，实质上也是情感的积累。例如，当“母亲”这个符号被唤醒，并作为表象浮现于大脑之时，对她的“爱”也同时进入（并留存那里了）。这种表象复现时所携带的情感，是作家的需要、态度和价值取向等内在的因素不断向符号、材料进行浸染、渗透的结果。\n\n事实上，其他心理材料的复现，也都掺杂着主体的是非判断和感情判断。在艺术构思时，许多表象、材料在心头翻滚，许多是非、感情也在翻滚，理智和感情的冲突可能愈演愈烈。因此，要想顺利地完成构思，必须很好把握理智、把握感情，并很好地调节双方的关系。", "keywords": "有意识 理性 情绪和情感 动力因素 约束规范 理性因素 情感因素 心理材料的复现 感情判断", "note": "感情和理智在文学创造的过程中是缺一不可的，作者在创作一个作品的时候，需要对世界、对创作的客体有清晰的认识和缜密的逻辑思辨，而同时，充沛的情感和感染力也是一个好作品不能缺乏的重要因素。", "framework": ""}, {"id": "182", "stars": 4, "title": "意识和无意识在文学创作中的意义何在", "body": "一、意识与无意识\n\n在文学创作中，意识是指作家以清晰的理智有意地调动、分析和综合材料，使之成为有机的、能表达一定意义的整体作品的心理能力。无意识是指潜伏于作家意识之下的、有活力的，但因受到某种压抑而未进入意识的一些观念和心理能力。\n\n二、关系与意义\n\n在艺术构思时，意识和无意识这两种心理能力既有主从之分，又是相互补充的。所谓“主从之分”，是指意识对无意识可能起着某种控制、压抑或引导、解禁作用。所谓“相互补充”，是指意识所提出的某些任务、目标等，往往要靠主体调动无意识的功能，并促使其积极活动、碰撞、组合来完成。\n\n这就是说，一切有关形象、情节、结构、语言的确定，以及材料的分析、综合、比较、归纳、演绎等全部工作的规划、蓝图，一般经由意识机制来完成；但除此之外，文学创造过程中作家有时没有想到却出现了的问题，乃至令作家焦虑不知如何是好，好像是“细枝末节”，但不解决又无法逾越的问题等，都需要发挥无意识的作用。另外，承认意识对无意识的制约作用，还有如下考虑：\n\n（一）无意识在组合材料时所遵循的主导线索可能是意识提供的\n\n在艺术构思过程中，无意识有在暗中组合材料的功能，这已被许多理论家和艺术家证实。但无意识在发挥自身功能时选择、组合材料所遵循的线索是从哪里来的呢？有时还是意识提供给它的。\n\n（二）无意识活动的方向要靠意识指引\n\n首先，无意识的活动程序来源于意识。无意识是一种习惯性的和自动化的思维方式，这种方式是由主体无数次有意识有理性的行为的叠加、积累而形成的。艺术构思中的许多“细枝末节”问题都是由无意识来解决的，但作家通常察觉不到这暗中工作的另一个“自我”，总以“习惯”来搪塞。其实，无意识的习惯就来源于意识的理性行为的反复进行。\n\n其次，无意识中材料的安排和组合方向也靠意识指引。在构思时，无意识总是主动与意识配合来完成某一任务的。例如，每一个细节的处理，可能都由意识把新的资料反馈进长期记忆，并指定给无意识，由其加工。待无意识加工成熟以后，再将新的启迪提供给意识。意识再馈入新一轮材料给无意识加工，成熟后再交与意识理性。如此这般前进，艺术的构思就不断深化。\n\n由上可见，意识在艺术构思中虽起主要作用，但无意识在艺术构思中也承担着大量工作。不承认意识的主导作用，将走向艺术构思的不可知论；而不承认无意识的深层加工作用，又可能将艺术构思简单化。\n\n【李凡说：无意识作为一种心理能力，是在作家没有明显地觉察到的情况下，暗中对意念的整合、形象的构思、情节的发展、主题的开掘、意境的渲染、情调的烘托等，一句话，对各种心理材料的排列、组合发生作用。无意识不是一种异在力量，它和意识共存于同一文学创造过程之中。】", "keywords": "意识 清晰理智 无意识 潜伏 主从之分 相互补充 主导线索 活动的方向 主导 深层加工", "note": "", "framework": ""}, {"id": "183", "stars": 2, "title": "谈谈你对荣格“集体无意识”说的认识", "body": "无意识是指潜伏于作家意识之下的、有活力的，但却因受到某种压抑而未进入意识的一些观念和心理能力。无意识作为艺术构思的一个辽阔而又深沉、活跃而又内隐的心理领域，对整体的文学创作有相当重要的作用。王作家没有明显地觉察到的情况下，它暗中对意念的整合、形象的构思、情节的发展、主题的开掘、意境的渲染、情调的烘托等各种心理材料进行排列、组合。它是一种潜伏于心灵深处的力量，作家意识不到它，但它能暗示写出连作家自己都不相信的东西来。\n\n“集体无意识”说是荣格理论的核心部分。集体无意识是无意识的深层结构，相对于无意识表层结构的个体无意识，其内容是“原型”或“原始意象”，即过去人类历史进程中的集体经验，比如，再生原型、死亡原型、受难原型、魔鬼原型等等。\n\n一、集体无意识理论有助于我们理解创作动机\n\n荣格认为，作家是集体无意识的代言人，而艺术创作则是由一种原始意象的无意识活动所组成。他说：“艺术是一种天赋的动力，它抓住一个人，使他成为它的工具。艺术家不是拥有自由意志，寻求实现其个人目的的人，而是一个允许艺术通过自己实现艺术目的的人。”并进一步指出，艺术创作的动力来自无意识中的“自主情结”，而艺术创作是一种自发活动，这种活动“无情地奴役艺术家去完成自己的作品，甚至不惜牺牲其健康和普通人的幸福。”荣格的这种创作动力源于集体无意识的理论，虽然过分强调了集体无意识的力量，有失偏颇，但对于我们理解创作动机还是有很大帮助的。\n\n二、集体无意识理念有助于我们研究创作动机\n\n另一方面，集体无意识理论对于我们研究创作动机也有一定的助益。由于创作主体的个体差异、创作时空的变化及作品本身功能的多样，创作动机显得异常复杂，对它的研究也极为困难。荣格关于人格类型内倾与外倾的划分及艺术家大都属于“内倾直觉型”的典型的强调，对于我们了解作家的创作动机是很有启发意义的。", "keywords": "无意识的深层结构“原型”或“原始意象”原始意象的无意识活动“自主情结”“内倾直觉型”", "note": "①荣格说的“集体无意识”指由遗传保留的无数同类型经验在心理最深层积淀的人类普遍性精神。所谓集体无意识，简单地说，就是一种代代相传的无数同类经验在某一种族全体成员心理上的沉淀物，而之所以能代代相传，是因为有着相应的社会结构作为这种集体无意识的支柱。荣格认为“集体无意识”中积淀着的原始意象是艺术创作源泉。一个象征性的作品，其根源只能在“集体无意识”领域中找到，它使人们看到或听到人类原始意识的原始意象或遥远回声，并形成顿悟，产生美感。这需要我们对心理分析批评方法有一定的了解。", "framework": ""}, {"id": "184", "stars": 3, "title": "什么是突出？请简述其实现的途径", "body": "一、突出\n\n突出是指作家在构思时从纷繁芜杂的思绪中抓住一个形象（或意念），调动各种材料和加工手段为其服务，使之明确、清晰、与众不同的构思方式。\n\n二、实现途径\n\n（一）浓涂重抹\n\n作家为了达到某种意图，故意抓住某个形象身上某一个最显著特征，通过添加与此特征有关的肖像、行为、心理等细节描写，把这个特征连同这个形象，强调到令人过目不忘的地步，以产生强烈的艺术效果。例如鲁迅对阿Q及其头上的痢疮疤的突出，即是如此。\n\n（二）淡化背景\n\n在某一场景中通过巧妙地移动某事物来牵动观者视线，能使该事物成为前台现象，这时候，该场景中本来地位上基本平等的其他事物被降到了背景地位。例如，安娜是小说《安娜·卡列尼娜》的主人公，但托尔斯泰却让她在小说第1部第18章才姗姗出场。小说开头写奥布浪斯基一家的忙乱，就是为了提供一个类似于客厅的场景。在读者的殷切期待中，让安娜这个“不祥的女人”在“不祥的时刻”一出现，就成为前台现象，成为人们注目的焦点，从而达到“突出”安娜这个人物形象的效果。淡化背景暗含着人类的内视觉思维规律。淡化背景不是拿掉背景中的所有东西-那就没有背景了，而是使背景中的事物“多”起来，甚至显得杂乱无章，这样一来，当主体巧妙地调动某一事物时，它就会拉动读者内视觉的注意力，自然而然成为前台现象。", "keywords": "纷繁芜杂 抓住一个形象 浓涂重抹 淡化背景", "note": "突出的含义是作家以一个形象（或意念）为底稿，然后寻求与之密切相关的、更有效、更传神的材料，使之有机地融合，达到立体、生动的效果。", "framework": ""}, {"id": "185", "stars": 4, "title": "请说说陌生化与变形以及他们的异同", "body": "一、变形\n\n变形的含义是作家在构思中极大地调动想象力与创造力，以违反常规事理来创造形象的方式。通过变形，作家常常能获得独创性的形象。变形的方法包括：\n\n（一）扩大和缩小：即把形象变大或缩小，使之成为畸形，这个形象虽然还有常人的思维和欲望，但可以做常人做不到的事。\n\n（二）黏（粘）合：把某一形象用半人半怪的方式予以黏合，使之既有人的属性，又有怪的特点。\n\n（三）漫画：有意改变形象的思维方式，使其在振振有词或荒唐可笑的诡辩中，道出世事的昏暗或常人不敢言说的真理。\n\n（四）夸张：赋予形象一种相当突出的相貌或精神特征，这特征不仅影响其性格，而且支配其处世方式，既真又幻，既幻又真。\n\n（五）幻事：不改变人物形象的客观性，而将这个形象所生活于其中的“世事”予以变形，使常人在奇世旅行，可给人以奇异感受和深刻启发。\n\n二、陌生化\n\n陌生化是指将作者或人物习见的事物，以陌生的眼光描写，消解“套板反应”，使读者产生某种新奇感的构思方式；是在观察描写事物时，摆脱日常生活中的“自动化”“习惯化”，用事物给人的第一次新奇反应为基础来展开描写，以此调动、激发读者的想象力的一种构思方式。\n\n三、陌生化与变形的异同\n\n（一）相同之处\n\n陌生化（又译“反常化”）与变形有联系。它们都是使习见事物换一种样式出现，来获取一种“新奇”的艺术效应。\n\n（二）不同之处\n\n（1）变形着重于从整体上“改变”一个事物的常形，陌生化则倾向于不用习见的“称谓”。例如《红楼梦》“刘姥姥一进大观园”，曹雪芹以一位从未见过挂钟的农村老妪刘姥姥的陌生眼光来写王熙凤堂屋里的挂钟，就收到了陌生化的效果。陌生化的心理基础是，摆脱日常的“自动化”的感觉，而用事物给人的第一次新奇反应为基础展开描写，来调动、激发读者的想象力。\n\n（2）一个事物被变形后，将被赋予变形后那个事物的特征和属性，而一个事物被陌生化时，该形象只以作者或读者似乎都未见过（实际上作者已见过，读者也可能见过），不得不以“第一次”见到时的新奇形状和新奇感受去描写它的方式呈现出来。\n\n（3）变形更多作为一种艺术手法（或一种构思方式）被使用，而陌生化除作为手法和方式之外，它还是作家观察生活和表现生活的一个总原则。按照什克洛夫斯基的说法，艺术之所以需要陌生化，有两个目的：一是抵制审美疲劳并消解日常生活的“机械性”，二是增加艺术感受的难度进而延长这种感受。", "keywords": "想象力创造力 独创性的形象 扩大和缩小 黏（粘）合 漫画 夸张 幻事 陌生化 未见过 陌生眼光 换一种样式 改变常形 称谓 新特征和属性 新奇形状和新奇感受 艺术手法 总原则", "note": "①变形着重于“改变”事物常形，陌生化倾向于不用习见的“称谓”，以消解“套板反应”。②本题也可以联系俄国形式主义文论家什克洛夫斯基关于“陌生化”的说法。", "framework": ""}, {"id": "186", "stars": 3, "title": "把形象（或意念）从“心”（形之于心）转化到“纸”（形之于手）上，是一个十分艰难的过程，其间最常见的问题是什么", "body": "将文学形象从心转化到纸上，就是从创作的构思阶段发展到物化阶段。在此过程中会出现很多问题。\n\n一、创作意图有时不适应人物性格的发展逻辑\n\n创作意图是作家心中指向性很强的某种目标预期，但他有时并不符合逐渐成熟起来的那一个个活生生的人物性格的自然发展。当人物成熟起来时，他必然按照自己的性格轨道行进，而无法迁就作家原来的意图。此时，作家要么违背他，要么顺从他，似乎没有其他道路可走。\n\n（一）顺从人物自由发展\n\n在文学史上，我们经常见到的情况是，成熟作家大多采用顺从人物自由发展的方法，而不是相反。常常被人们津津乐道的安娜卧轨，渥伦斯开枪，聂赫留朵夫放弃结婚，美谛克逃跑等许多事例，便属此种情况。列夫·托尔斯泰说：“他们（指人物）做那些理想生活中应该做的，和现实生活中常有的，而不是我愿意的。”即便是通过脑中倏忽闪现的思绪来勾勒人物形象的意识流大师乔伊斯，也不得不遵从人物性格的发展逻辑，以保持其内在的一致性。例如，在《尤利西斯》中，斯蒂芬满脑子想的都是抽象的思维和深奥的哲理，摩莉成天想的不外乎饮食男女，布鲁姆则喜欢有骚味的羊腰子，连在博物馆看到裸体女神像也要想入非非。\n\n（二）遵从人物性格逻辑的自由发展而改变原来的设想，是一种成功的方法。因为，这样能使人物有活泼泼的内在生命力，其由性格所支配而产生的各种悲欢离合行为，能产生极强烈的真实感。这种情形的发生，常常是创作进入某种境界的标志。\n\n二、作家创作动机的中途转换\n\n开始构思时，作家大体上都有一种动机，可是在物化过程中，由于某种外在刺激的作用，或从材料中发现了新东西，作家会产生一种新动机。有时，后起的动机甚至还可能取代原先的动机而支配物化过程。由于动机暗换是内在的，有时还是无意识的，因而作家的理智并没有觉察到这种改变，反而误认为是作品的物化过程逸出了原来的设想。\n\n例如，鲁迅创作《不周山》，本想借用弗洛伊德的理论严肃地演绎人类和艺术的起源，但写作中途在报章上看见有人攻击情诗，心里颇为愤怒，原来的动机不由自主发生了改变。于是，他便在女娲两腿间“油滑”地添加了一个身着古衣冠、满口讲着“仁义道德”的小丈夫。对此，鲁迅当时并未意识到，过后极为后悔，也承认小说《不周山》的这一变化与原先的想法悖谬，以致“毁坏”了整个后半部。需要指出的是，由于动机暗换打破了原来的构思，悄悄地赋予了作品以作家未曾明确的意识，无意中反倒增加了作品的内涵。所以，当作家为此懊悔不已时，在读者或评论家那里仍将该作品奉为佳作。显然，动机暗换所造成的冲突，既使作品内容一波三折，也使主要人物形象的性格更为丰富、复杂。\n\n由上可见，在物化阶段出现的意图与人物性格的冲突、创作动机的中途转换等问题，对于文学创作来说，似乎不是阻力和影响质量的因素，反而可能是作品质量得到提高的一个契机。", "keywords": "不适应人物性格发展 目标预期 自由发展 创作动机中途转换 新动机 契机", "note": "结合马工程版本，其实形之于心到形之于手就是一个语言呈现的过程。语言呈现是作家将构思成熟的艺术形象用语言表达出来的过程，这是创作过程的最后阶段。王国维提出“隔”与“不隔”之论，就是要探讨诗歌创作如何既要借助语言，又要超越语言的限制的方法。", "framework": ""}, {"id": "187", "stars": 3, "title": "如何看待作品与创作意图的冲突", "body": "在文学创造的过程中，作品常常与意图发生冲突，创作意图是作家心中指向性很强的某种目标预期，但它有时并不符合逐渐成熟起来的那一个个活生生的人物性格的自然发展。当人物成熟起来时，他必然要按照自己的性格轨道行进，例如安娜（《安娜·卡列尼娜》）卧轨可以说是情非得已的结局，司汤达的小说提纲，常常没写几页就被人物的行动打破。这体现了文学创造的主体与客体的辩证关系。\n\n在文学创造的主客体关系中，客体处于非主导的、被动的地位。但是，主体从选择具体客体开始到对具体客体的重塑整个过程，都要从生活出发，以生活为依据，也就是说，始终受到客体的规定和制约。例如创作主体选择何种具体客体为反映对象，就不仅仅取决于主体“内在的尺度”，也取决于外部“种的尺度”，即客体的尺度，包括政治的、经济的、文化的和社会心理、社会意识等多种生活因素的规定和制约。\n\n鲁迅选择阿Q这样的人物，与当时辛亥革命的失败和国民心灵普遍麻木的社会生活情景密切相关。再如文化大革命后“伤痕文学”的出现，也与否定“文化大革命”这一“历史悲剧”的时代背景有关。\n\n由此可见，作家总是生活在一定的社会环境、一定的文化传统中，他选择何种生活为创造的具体客体，都必然受到社会生活这个“一般客体”的规定的制约，创作主体的一切创造性活动，包括虚构、想象、情感投射，观念移注等，都不可能离开具体客体进行纯粹任意的胡编乱造和情感发泄。\n\n有时主体甚至因为客体的制约和影响而改变原先的构思，例如托尔斯泰的《安娜·卡列尼娜》先将安娜写成一个轻浮浪荡的女性形象，但越写越被安娜的悲剧命运所感动，终于改变了原先的构思，把安娜塑造为一位美丽、追求自由的令人同情的女性形象。从这个角度说，文学创造中，客体也使主体“客体化”了。", "keywords": "目标预期 自然发展 主客体辩证关系 客体规定制约 主体“客体化”", "note": "在文学创造的物化阶段，作者通过语言、文字、纸张等媒介，把精神性的艺术构思转化为物质性的文本，但在这个从行之于心到行之于手的过程中，往往会出现心手不一的现象，即出现创作意图与作品的冲突。", "framework": ""}, {"id": "188", "stars": 3, "title": "文学技巧运用时所依据的原则是什么", "body": "技巧运用主要指巧妙采用各种写作手法，例如，肖像、行动、心理的描写，顺叙、倒叙、插叙的安排，烘托、对比的运用等。其所依据的原则如下：\n\n一、技巧运用要为物化主要形象（或意念）的内在物理服务\n\n内在物理，即某种事物的内在规定性（或本质、规律）。人物也一样，也有其内在之理-即基本思想倾向、基本性格和基本的处世原则等。当作家需要将构思中初步成熟的事物、人物形象等，采用某种技巧，予以呈现时，必须顺其内在物理，才能形神兼备。人物形象的活动是独特的，多种多样的，但任何条件下的任何活动都必受其基本的思想倾向、性格和处事原则等的支配。作家在将构思成熟的人物形象用语言、文字定型在纸张上，能否选用合适的写作技巧把已经揣摩到的内在之“理”呈现出来，是非常重要的。\n\n例如，《红楼梦》第27回，曹雪芹对黛玉葬花行为的描写以及《葬化词》内容的叙述，都采用贾宝玉视角和侧面描写的方法。这种视角和方法，不仅回应了她恐惧却不敢表露的痛苦，也为后来“质本洁来还洁去”的死作了一个铺垫；更重要的是，还呈现了林黛玉这一形象多愁善感、寄人篱下、整日以泪洗面又无处诉说，痛苦与恐惧相交织的内在之“理”。如果换用其他视角或其他手法，就会大煞风景，无法收到震撼人心的效果。\n\n二、技巧要为作家通过形象所要表达的中心意念服务\n\n中心意念是作家企图通过作品告诉读者的他对生活的感受、体验、理解和评价，是他的思想和认识的结晶。在物化中，作家调动各种技巧把形象物化在纸上时，必须注意传达自己的中心意念。有的作品虽提供了逼真的形象画面，却不能成为佳作，就因为他没有运用技巧把自己的中心意念表现出来。\n\n总之，物化过程中的技巧运用，既要准确传达主要形象的内在物理，又要将主体内心的中心意念不露痕迹地体现出来。如果一味炫耀技巧，就会南辕北辙。", "keywords": "写作手法 内在物理 基本的思想倾向、性格和处事原则 中心意念", "note": "在文学史上，文学技巧，也就是文学在形式上的进步是很有话说的，我们可以举出自古至今不同文体形式发展的例证，使答案更为丰满。", "framework": ""}, {"id": "189", "stars": 2, "title": "为什么说即兴不是凭空出现的", "body": "即兴是作家因受某一外在刺激或内在冲动的作用，兴会来临，在文字操作过程中迅速地创造出某作品的状况。兴会来临时，文思泉涌，势不可遏，笔落惊风雨，诗成泣鬼神。但即兴不是凭空出现的。\n\n一、即兴需要足够的材料储备和情感积累\n\n王勃铺排大量典故，李白诗歌中丰富的社会和人生经验，都是长期积累和有意储备的。任何酣畅淋漓的即兴创作，都是作家调集平生的记忆信息，厚积薄发形成的。\n\n二、即兴创作需要气氛和契机\n\n即兴的刹那似乎容易，实际上兴会的来临极难。没有气氛和契机，即兴无由发生。王勃拥被而卧，李白饮酒，巴尔扎克喝黑咖啡，便都是借此来制造某种刺激情境，以待兴会到来。\n\n三、即兴是作家长久酝酿的产物\n\n即兴的外在表现是突发性和一泻千里的冲动，但实际上却是作家综合心力的集中爆发，是长久酝酿的产物。司汤达写《巴马修道院》虽只用53天，但其准备和酝酿却花了6年。\n\n四、即兴不是理智选择的\n\n即兴不是作家的理智所选择的，它与天赋、气质等先天因素以及后天所掌握的本领、技巧有关。\n\n【李凡说：即兴就是事先没有任何准备，根据当时的感受所做出反应的意思。即兴发挥就是说在没有准备的条件下随意表达自己。纵然如此，即兴发挥也需要作家在生活的实践和经验中有审美感受的长期积累，才能使灵感在一瞬间爆发。】", "keywords": "材料储备 情感积累 气氛和契机 长久酝酿 不是理智", "note": "", "framework": ""}, {"id": "190", "stars": 2, "title": "请结合实例说说推敲在文学创作中的运用", "body": "推敲是指作家在语言和文字符号操作过程中反复选择单词、调动语序，以求准确、妥帖地把形象或意念具体化的操作手段，它表现为词句的精选、细节的提炼、人物的安排、章节的转换、意境的合成等等。由于文学创造的工具和媒介都是语言文字，因此，所有的推敲也都以语、词为主来进行。\n\n古人的“吟安一个字，捻断数茎须”“两句三年得，一吟双泪流”“爱好由来着笔难，一诗千改始心安”等表达作诗体会的句子，无不记录了“推敲”这一技巧的运用。今人徐志摩在其诗集《猛虎集》序也表达了类似的体验，他说自己作诗，从一点意思的晃动到一篇诗的完成，没有一次不经过“唐僧取经”似的苦难。\n\n这里，以王安石的《泊船瓜洲》一诗中的“绿”字为例，看看推敲技巧在文学创作中的运用。该诗第三句“春风又绿江南岸”的“绿”字的选用颇让诗人煞费苦心。其最初为“到”字，“到”字有停止的意思，春风是流动的，不会停息，“到”字显得太死，表达不出春风的活力。于是改为“过”字，还是觉得不够好，“过”字有了活力，比“到”字生动些但还是不恰当，没有表达出春风驻留江南的意思。于是改为“入”，春风已入江南，自己何时还乡？从表达思想感情来看，“入”字比“过”字又好一些，但仍觉不满意。“入”字显得太直，没有意境，诗意不够浓，显不出江南到处生机勃勃的景象。又改为“满”字，春风满江南，思乡之情倍增，但仍觉得不够形象，没有描绘出春意盎然的图景。终改为“绿”字，把春意盎然、生机勃勃的景象尽显眼前，才使得“心安”。从这个例子，可以看出推敲在文学创作中的运用是一个十分艰难的操作过程，但另一方面，推敲能够使心象、意念精确鲜明丰富，使外化于文本的与内心欲呈现的趋向一致，从而增强作品表现力，取得最好的艺术的效果。", "keywords": "形象或意念具体化《泊船瓜洲》“绿”字 使心象、意念精确鲜明丰富 外化于文本的与内心欲呈现的趋向一致", "note": "在教材上，关于“推敲”的知识阐述得并不多，但我们知道“推敲”一词典出贾岛，他身为苦吟诗派的代表诗人，“两句三年得，一吟双泪流”。作家在创作过程中对语句和词语的把握，是语言呈现中一个不可或缺的环节。", "framework": ""}, {"id": "191", "stars": 3, "title": "怎样理解“真、善、美”及其统一是文学创造的审美价值追求？在文学创造中“真、善、美”与“艺术真实”“情感评价”“形式创造”是什么关系", "body": "当人们面对世界和人生的时候，普遍追求的价值就是真善美。真是对人的认识理性的要求，善是对人的实践和社会活动的要求，而美则体现了人对形式感觉的要求。人类对真善美这三种价值的要求贯穿在生活的方方面面，但是在不同的活动领域，主导性的要求则有所不同：在科学和思想领域，“真”是最重要的价值；在实践活动领域，“善”是最主要的价值；而在艺术领域，“美”是衡量审美对象的主要标准。文学活动，既包括审美，同时又与人类的认识和实践密切相关，因此文学并不仅仅只突出某一个方面的价值，而是强调真善美三者的统一和协调。\n\n一、文学创造作为认识活动要追求“真”\n\n文学创造是理解、反映和阐释对象世界的认识活动。认识活动的价值取向是以“历史理性”求“真”。真的并非都是善的和美的，然而善的和美的却一定是真的，没有“真”，“善”和“美”就失去了根据和依凭。\n\n实践证明，作家对对象世界的理解、反映和阐释，只要合情合理，他的作品就会具有“真实性”的品格；而具有“真实性”品格的作品，才能让读者产生信任感及认同感，并因其与“善”“美”相统一而为之所吸引感动，从而获得思想上的启迪和精神上的享受。简而言之，“真”乃是文学的审美价值追求实现的基础。\n\n二、文学创造作为社会实践要追求“善”\n\n文学创造还是情感地评价对象世界的社会实践。其价值取向的核心是向“善”，体现为“人文关怀”。鲁迅在谈到“真善美”作为文学批评的美学标准时，曾把“善”置换成“前进”一词，即有利于社会前进或进步的意思。这就把“善”的内涵具实化了，意味着情感评价作为“善”的价值追求具有高尚品格和功利取向。前者是指作家对社会生活作出的“裁判”，蕴含着对美好事物、美好情操、美好生活和美好理想的守望与追求，以及对丑恶、腐朽和阴暗事物的拒斥；后者则是指所作出这一“裁判”具有助益社会人生的功利性。这些都是文学审美价值创造的必然要求。因为“美”不仅根植于“真”，它还源于“善”。\n\n三、文学创造作为审美活动要追求美\n\n文学创造还是审美活动，要按照美的规律进行形式创造，境界是呈“美”，体现为“文体升华”。当艺术真实的创造及其蕴含的情感评价成为“真”与“善”的统一时，这统一便构成文学创造追求的审美价值。然而这个“美”尚处于内容状态，还需要相应的形式创造予以外化与体现，使之成为艺术文本。因此，形式创造是文学审美价值追求的最后完成。但在实质上，形式创造是贯穿于文学创造活动的始终的，即从艺术构思到作品诞生的全过程，作家对内容的孕育创造本身也是对形式的孕育创造，就蕴含着一个“文体升华”或“形式美”的问题。所以，“美”是与“真”“善”一体化的，它附丽于“真”“善”，又使“真”“善”得以升华，更有力量。\n\n三者统一，更好地实现了文学的审美价值追求。就三者在文学创造中与“艺术真实”“情感评价”“形式创造”的关系而言，是三位一体相互融通的，“艺术真实”主要与真相关，“情感评价”主要与善相关，“形式创造”主要与美相关。", "keywords": "认识活动“真”社会实践“善”审美活动“美”三位一体", "note": "文学创造追求的是以真善美为内涵的审美价值标准，真善美是文学创造活动中“三位一体”的价值结构，它们相互融通，属于人类三个根本的精神世界：认识、伦理和美学。“真”是基础，“美”是手段，“善”是灵魂，三者相辅相成、缺一不可。“真善美”的高度和谐统一，是文学艺术产生强大生命力的根本原因，因而也永远是一切进步的文学艺术家们争相攀登的艺术高峰。", "framework": ""}, {"id": "192", "stars": 3, "title": "谈谈你对艺术真实的理解（25中央民族大学、浙江师范大学、26西安外国语大学）", "body": "一、艺术真实以假定性情境表现对社会生活内蕴的认识和感悟\n\n凡是历史上出现过和现实中存在的一切事物与现象，都是生活真实。生活真实为文学创造提供了原型启示，是取之不尽用之不竭的源泉，然而艺术真实是对生活真实的超越，它以“历史理性”对社会生活的本质及其必然性的揭示，作为自己的审美价值取向，并表现在假定性情境之中。从这个侧面上说，艺术真实是内蕴的真实、假定的真实。\n\n（一）内蕴的真实\n\n艺术真实是作家对社会生活的认识和感悟的产物。认识是理智的体察，感悟是直觉的把握。文学创造正是在既有理智体察又有直觉把握的心理机制和思维活动中，以“历史理性”的眼光，透过生活真实的表层对社会生活的内蕴作出艺术的揭示和表现。正如列宁所说：“如果我们看到的是一位真正伟大的艺术家，那么他在自己的作品中至少会反映出革命的某些本质方面。”因此，讲究“历史理性”，发现和反映社会的本质，遂成为文学创造的“价值”要求，而为艺术家和美学家所看重。\n\n（二）假定的真实\n\n如果说表现社会生活中某些本质性东西的价值取向是艺术真实的内在要求，那么艺术情境的假定性则是艺术真实的外部特征。这是由于，文学既然不是对生活真实的照抄照搬，作家就必然会从自己的认识和感悟出发，对生活真实进行选择、发掘、提炼、补充、集中、概括，通过想象和虚构予以重组、变形及再塑。浪漫型和象征型作品的艺术情境的假定性显而易见：它们或者把现实形象与幻想的非现实形象融会成一个荒诞不经的情境世界，或者完全抛开现实的形象而以虚拟的形象世界取而代之。前者如《西游记》里的人神妖魔共处的神话世界，后者如寓言、童话中的拟人化的动植物世界，神话、传说中的神仙、鬼怪世界等等。现实型作品保留着社会生活的原生态，形象是写实的，但是其艺术情境也是虚构的、假定的。如曹禺的《雷雨》，剧本让两个家庭八个人物之间的矛盾发生在两个场合（周家客厅与鲁家住宅）及一昼夜之内，冲突又那么集中而强烈，这在实际生活中是根本不可能出现的，因而是假定的。\n\n二、艺术真实对客体世界的反映具有主观性和诗艺性\n\n与科学真实不同，艺术真实对客体世界的反映具有主观性和诗艺性。就揭示和表现客体世界内蕴（本质性规律性的东西）的价值追求而言，文学创造与科学活动是相通的；然而文学反映客体世界的审美特征具有主观性和诗艺性，这就使它与科学真实区别开来。从这个侧面上说，艺术真实是主观的真实，诗艺的真实。\n\n（一）艺术真实对客体世界的反映具有主观性\n\n作为人类的一种活动，科学的目的是揭示事物的本质和规律，力求客观性，文学创造则不然，它是站在人的生命体验与审美感受以及对社会生活给予人文关怀的立场上，因而对客体世界的认识、感悟与表现带有主体性或主观性。例如，天体运行本是不以人的意志为转移的宇宙现象，所谓“日出日落”不过是人在自己生命活动中的生存感受和主观把握而已。然而在文学史上，不只是古人写下了许多脍炙人口的歌咏“日出日落”的诗句，诸如陶渊明的“日入群动息，归鸟趋林鸣”，王之涣的“白日依山尽，黄河入海流”等，就是今人也还在无视哥白尼学说而描绘着主观化的“日出日落”景观，如刘白羽在《平明小扎》中对日出的个性化的绚丽的描绘。\n\n（二）艺术真实对客体世界的反映具有诗艺性\n\n文学创造对自然界如此，在描绘社会生活时也是这样，它所提供的“真实”都是主观化、心灵化的真实，是体验的真实。文学按照主观化方式把握客体世界，以激发人们的审美情感为目的价值取向，使它必然要讲究“诗艺”。“诗艺”即艺术手段和艺术技巧。运用艺术手段和艺术技巧创造的艺术真实，能够使其价值取向得到理想的表现，产生强烈的感染力和震撼力。如“春风又绿江南岸”“人比黄花瘦”“燕山雪花大如席”“感时花溅泪，恨别鸟惊心”“山，倒海翻江卷巨澜。奔腾急，万马战犹酣”等等，或炼字炼句，使语言陌生化，背离语言的一般规范，或运用比喻、夸张、拟人、变形、反讽、暗示、象征等“诗艺”，创造出有别于科学真实的生动情境。可见，“诗艺”对于艺术真实的生成是很重要的：假定性情境、主观性真实都是在“诗艺”中生成的，没有“诗艺”的运用便没有艺术真实。\n\n综上所述，艺术真实是内蕴的真实、假定的真实、主观的真实、诗艺的真实。它既不像生活真实那样与生活本身是同一的，也不像科学真实那样能够验证和还原。", "keywords": "假定性情境 社会生活内蕴 主观能动性 主观性和诗艺性 艺术手段和艺术技巧 内蕴的真实 假定的真实 主观的真实 诗艺的真实", "note": "艺术真实不是生活真实的自然主义摹本，而是对它的反映。反映具有主观能动性，就是说，艺术真实是作家对社会生活的认识和感悟的产物。", "framework": ""}, {"id": "193", "stars": 3, "title": "诠释艺术概括的价值意义", "body": "一、艺术概括及其价值\n\n（一）所谓艺术概括，简括地说，就是作家依据自己的体验和认识，以主体的审美价值追求的能动介入的方式，对富有特征的事物给予独特艺术处理，从而在主体和客体相统一的基础上，创造既具有鲜明的独特个性又具有相当普遍意义、体现着一定审美价值取向的艺术形象之方法。\n\n它是文学创造实现其求“真”审美价值取向的基本途径。其价值就在于它能够使文学作品由特殊见出一般、借表象张显本质、以有限表达无限，产生巨大的艺术效应。\n\n（二）作为认识活动，文学以创造艺术真实来反映社会生活并达到对社会生活本质的揭示，从而实现其求“真”的价值取向，但社会生活本身是复杂的、粗糙的、零乱的，其发生也带有很大的偶然性、随意性，这时它们作为生活素材还不能进入文学作品，需经作家用艺术发现的眼光来寻找其“闪光点”-富有特征的、本质性的东西，而后围绕此点，点染、生发、补充、改造、提炼、概括，使其成为独特的能够显示出一般的“这一个”。\n\n如《红楼梦》，叙说的虽然是一个贵族家庭由盛而衰的故事及这个故事中的爱情悲剧，然而其创造的艺术世界触及社会生活的方方面面，包括政治的、经济的、文化的、道德的、法律的、宗教的、风俗的等等，几乎成为人们认识中国封建社会的“百科全书”。由此，可见出艺术概括的巨大价值。\n\n二、艺术概括的特征\n\n鲁迅的这段话简练地指出了艺术概括的特征：\n\n（一）“个别”与“一般”的统一\n\n艺术概括是以对特殊的即富有特征的事物的观照和描述为途径的。作家对富有特征的事物的发掘与描绘使其显出丰富且深刻的意义，进而取得从特殊中显出一般的效果。所谓“有一点见过或听到过的缘由，但决不全用事实”就是说只取有“特殊”意义的“一点”，如果“全用事实”则会导致复制生活、罗列现象，进而本质不分、意义难辨，这样，也就丧失了文学作为认识活动所追求的求“真”的价值。\n\n（二）其统一是艺术提炼的过程\n\n尽管艺术概括是在对富有特征的事物的观照和描述中实现的，但并非意味着作家对这些事物可以不作提炼、加工和改造。这是由于“特殊”虽然因其富有特征而较之其他事物更多地与“一般”相联系，但是无论怎样“特殊”，其体现的“一般”都不可能是完全的，充分的；要让“特殊”在“个别”与“一般”的统一中真正地成为真实而完整的“小世界”，则有赖于作家充分调动自己的生活经验与情感经验，对其所观照与描述的“特殊”进行开掘、提炼、补充和改造。这也就是鲁迅所说的“只采取一端，加以改造，或生发开去”的意思。李渔在《闲情偶记》里说，“欲劝人为孝者，则举一孝子出名，但有一行可纪，则不必尽有其事，凡属孝亲所有者，悉取而加之。”就是说，为了审美理想的实现，围绕一点“缘由”或“一行”，尽可以“生发”“改造”或“悉取加之”，如此，“特殊”的“这一个”更容易成为一个完整的“小世界”，以映照生活这个“大世界”。", "keywords": "独特个性 普遍意义 审美价值取向 社会生活本质的揭示“个别”与“一般”的统一 艺术提炼的过程", "note": "艺术概括是文学创造的基本原则之一，要求作家依据自己的体验和认识对个别或特殊的事物加以独特处理，在主体与客体统一的基础上，创造出具有鲜明个性和普遍性的艺术形象。", "framework": ""}, {"id": "194", "stars": 2, "title": "谈谈情感评价的诚挚情态及艺术呈现之含义", "body": "诚挚情态与艺术呈示是情感评价的实现方式。\n\n一、诚挚的情态\n\n所谓诚挚的情态，是指文学作品的情感评价属真情而非假意，不是“无病呻吟”。真情还是假意，关乎着情感评价的价值追求能否实现。情感诚挚，作品才会动人，其尚“善”的价值取向就能在富于感染力的情境中潜移默化地为读者所认同和接受，产生共鸣。反之，作家的价值追求再高尚再有意义，读者也会在矫饰之情面前无动于衷，甚至产生反感。\n\n情感的诚挚性与反映生活的真实性是联系在一起的。诚然，徒有真情，文学创造未必一定能创造出艺术真实，然而要使文学作品具有反映生活的真实性，真情则是不可或缺的元素和条件。真实与真诚融为一体，文学创造才能实现其审美价值追求。\n\n真情或者说诚挚的情态，并不是由艺术技巧造就的，它来自于作家对生活的深刻体验。体验是情感产生的根基，没有对生活的真切体验便没有情感的诚挚状态。这是追求真善美价值的作家的共同的认识。冈察洛夫说他只写自己“体验过的东西”，“思考过和感觉过的东西”，“爱过的东西”，“清楚地看见和知道的东西”。鲁迅则告诉人们：“现在有许多人，以为应该表现国民的艰苦，国民的战斗，这自然并不错的，但如自己并不在这样的漩涡中，实在无法表现，假使以意为之，那就不能真切、深刻，也就不成为艺术。”\n\n二、艺术的呈现\n\n“善”的价值与情感的表达，在文学作品里不是教义式的赤裸裸的直白，而是艺术方式的呈示，即把情感寄寓于具体形象的创造之中，并与理性的思索与反省相交融。恩格斯当年曾批评同时代德国社会民主主义作家敏·考茨基的小说《新与旧》有席勒化倾向，指出“倾向应当从场面和情节中自然而然地流露出来，而无需特别把它指点出来”。列夫·托尔斯泰也说过同样的观点：“每一种富有诗趣的情感，都得有抒情风格、场面、人物、性格或大自然的描写等等流露出来”，“不要议论”。\n\n这就是说，文学作品是通过“境”（典型、意境、意象）的创造寄寓价值评价和价值取向的。情是内在的，境是外在的，两者一表一里，融为一体。总之，艺术的呈现是文学审美价值实现的方式，其情与境的融合，让读者从中获取的不仅是思想上的教益，同时还有精神上的享受。", "keywords": "诚挚的情态 真情 生活的深刻体验 真实与真诚 艺术呈现 情感寄寓“境”实现方式", "note": "情感是基于人的需要、观念等思想意识而对事物产生的主观态度和评价。文学在创造艺术真实时运用“内在的尺度”，实际已把情感评价融入其中，因此，艺术形象都是理智与情感的统一，情感评价是文学创造的本质属性。文学创造正是以这一本质属性，在向人们展现真理的同时，也向人们呈示着意义-尚“善”的审美价值追求。", "framework": ""}, {"id": "195", "stars": 3, "title": "谈谈你对“诗意的裁判”这一概念的认识", "body": "“诗意的裁判”是恩格斯评价巴尔扎克时使用的一个概念。所谓“诗意的裁判”就是善与美的统一，它既是对情感评价的价值品格内容的规定，也说明了情感评价的实现方式。其具体内涵，主要表现在以下方面：\n\n一、价值追求\n\n情感的价值取向，体现为真、善、美。情感与善的价值追求，主要包括以下两点：\n\n（一）高尚的品格。所谓品格高尚，蕴含着对美好事物、美好情操、美好生活和美好理想的守望与追求，以及对丑恶、腐朽和阴暗事物的拒斥。文学本身的善的价值不是说它只能表现善的人与事，而是文学作品在描写善恶的时候所体现出的伦理判断，以及它所激发的感情符合善良的人性。\n\n文学创造能否以高尚的情感态度去“裁判”社会生活，最终取决于创造主体的人格。人格是指一个人的各种心理特征的综合或基本精神面貌，它是为人的各种需要决定的。在人的种种需要中，像爱、尊重、认知、审美等高层次的需要，规定着人的本质，决定着一个人的人格。文学创造中对社会生活的伦理判断和情感表现，实际上就是作家的人格投放，是在其创造的艺术世界中能动地、现实地复现自己人格的过程。\n\n（二）利他的取向。人的实践活动是有功利性的，文学作品常常会表现社会中的人面对功利的种种态度。善的功利性恰\n\n好是与自私的功利性相对立，是利他而非利我，体现在克服自我欲望，成就他人和群体。\n\n对社会生活的情感评价所隐含的功利性质，是文学审美价值创造的必然要求。从一定意义上说，“美”不仅根植于“真”，它还源于“善”而“善”是对社会人生有着实际意义的价值取向。文学的功利取向，因作家评判生活的着眼点不同而存在着许多层面，阶级社会里的作家，由于所处社会地位之不同，其对生活的情感态度还会带上阶级性。但是无论怎样，对于尚“善”的文学作品而言，它们的功利价值追求是与对生活本质规律的深刻揭示联系在一起的。\n\n二、具体表现\n\n（一）诚挚的情态（真）。情感诚挚，作品才会动人，其尚“善”的价值取向就能在富于感染力的情境中潜移默化地为读者所认同和接受，产生共鸣。\n\n（1）情感的诚挚性与反映生活的真实性是联系在一起的。要使文学作品具有反映生活的真实性，真情则是不可或缺的元素和条件。\n\n（2）真情或者说诚挚的情态，来自于作家对生活的深刻体验。体验是情感产生的根基，没有对生活的真切体验便没有情感的诚挚状态。\n\n（二）艺术的呈现（美）。“善”的价值与情感的表达，在文学作品里不是教义式的赤裸裸的直白，而是艺术方式的呈现，即把情感寄寓于具体形象的创造之中，并与理性的思索与反省相交融。艺术的呈现，是文学审美价值实现的方式，其情与境的融合，让读者从中获取的不仅是思想上的教益，同时还有精神上的享受。", "keywords": "价值追求 高尚的品格 利他的取向 具体表现 诚挚的情态 艺术的呈现", "note": "这部分内容在作答时我们首先要明确其是由恩格斯提出来的，具体包括善与美的统一，即是某种规定，也是实现方式。在作答时，要注意将这部分内容与其具体内涵等联系起来作答。情感与善的价值追求，是“诗意的裁判”内涵的一个方面，包括高尚的品格和利他的取向两个层次。其中，能否以高尚的品格评判社会，取决于创作主体的人格；利他的取向，则是文学审美价值创造的必然要求。善与情感的表现方式是“诗意的裁判”内涵的另一个方面，包括诚挚的情态和艺术的呈现两部分。有了诚挚的情态，“善”才更容易被人接受；而让“善”艺术的呈现则让读者既有收获，又有享受。以上这三部分内容，统摄于“诗意的裁判”这一知识点中，大家要注意联系起来作答。", "framework": ""}, {"id": "196", "stars": 3, "title": "为什么说人文关怀是“善”的终极价值体现", "body": "人文关怀是一种崇尚和尊重人的生命、尊严、价值、情感、自由的精神，它与关注人的全面发展、生存状态、独立人格及其命运、幸福相联系。人文关怀是古往今来一切优秀文学作品的总主题，它是“善”的集中体现，其与历史理性共同筑起文学的真善美功能价值体系。\n\n一、人文主义是文学“与生俱来”的\n\n认定人和人的价值在世上各种事物中具有首要意义的人文主义，虽然肇始于14世纪的欧洲文艺复兴时代，但是其强调的“以人为本”的人文关怀，对文学而言，既是主宰它审美价值追求的灵魂又是它的存在根据，因而是“与生俱来”的。\n\n二、作家天生是人类命运的关注者和社会文明进步的促进者\n\n当文学进入作家时代之后，人文关怀遂成为他们的自觉的价值追求和神圣的社会职责。举凡各个民族各个时代优秀的作家作品，都无不高扬人文精神。他们对社会生活把握和反映的方式尽管异彩纷呈，有的是写实的，有的则是虚幻或象征的，然而其共同点则是：他们在对生活的富有历史精神的肯定与否定、赞美与贬斥、同情与厌恶乃至于困惑、无奈的情感态度中，寄寓着艺术家们特有的“悲天悯人”的情怀。\n\n在现代文学史上，鲁迅小说的人文精神最为深厚，透过那冷峻的笔调，从麻木的闰土、愚昧的华老栓、不幸的祥林嫂.....尤其是那个寄寓着作家“哀其不幸，怒其不争”的忧愤情感的阿Q身上，人们看到的正是一个具有高度社会责任感的作家炽热的人文关怀。\n\n三、人文关怀从来就是也应该是文学创造的永恒主题，是其尚“善”的终极价值追求\n\n现在，人类历史已经进入21世纪。面对着20世纪高科技的迅猛发展而带来的经济的高速增长，人们在享受日新月异物质文明的同时，也遭遇到了新的生存危机，诸如环境污染，拜物主义与拜金主义盛行，人的尊严和价值被冷落，等等。在这种情势下，“以人为本”的呼声日益高涨，人文关怀已超越文学领域而成为全人类全社会的共同命题。无疑，文学这块人文绿地应该更加自觉地肩负起弘扬人文精神的神圣使命。", "keywords": "总主题“善”的集中体现 人类命运的关注者 社会文明进步的促进者 悲天悯人 社会责任感 文学创造的永 恒主题 全人类全社会的共同命题", "note": "人的一切精神创造（物质创造也是如此）都是从人的需要出发的价值活动，体现着人的尺度和目的，因而“以人为本”的价值理念就成为人类一切创造活动的出发点和归宿。", "framework": ""}, {"id": "197", "stars": 2, "title": "谈谈你对文学作品中的人文关怀与历史理性之间关系的理解", "body": "一、人文关怀与历史理性\n\n人文关怀是一种崇尚和尊重人的生命、尊严、价值、情感、自由的精神，它与关注人的全面发展、生存状态、独立人格及其命运、幸福相联系，它追求“善”的终极价值；历史理性是人们对全面促进社会的经济、政治、文化进步力量的肯定评价，是认识活动的一种价值取向，它追求“真”的价值功能。\n\n二、二者关系\n\n（一）就人文关怀与历史理性的关系来说，作家是在对社会生活的规律性的认识和描述中寄寓人文关怀的，因而其对人的生命、尊严、价值、生存状态及未来命运的深情关注，同历史理性血肉般地联系在一起。两者你中有我，我中有你。“历史理性存在着人文的维度，人文关怀存在着历史的维度”，是“真”与“善”两个价值取向的交会。\n\n（二）作家的使命毕竟不同于历史学家、政治学家和社会学家，人们只能期待他们的人文精神同社会人生的某些本质的有意义的东西相联系，而不应该向他们提出诠释社会规律的非艺术要求。文学的价值在于对真善美的追求，真善美固然需要历史理性的支撑（它们不是没有社会历史内容的言语外壳），然而作家各有自己的艺术个性，历史理性又是一个多侧面多层次的巨大的意蕴空间，在文学创造中，作家完全有权利根据自己的艺术个性让人文精神在特定的历史视点上展现。文学不是整齐划一的精神领域，更不应该成为某种廉价的时尚观念（打着理性旗号）的形象演绎。\n\n例如，同是关注人类命运的伟大艺术家，面对着资本主义制度登上历史舞台的现实，巴尔扎克深刻地揭示了封建贵族阶级在庸俗的充满铜臭的暴发户威逼下走向堕落和灭亡的必然过程，而将未来社会的希望和理想寄托在“共和主义者”身上；列夫·托尔斯泰则看重新生的资本主义制度给农民大众造成的深重苦难，他以不可遏制的愤怒，对俄国资产阶级政府、法庭等国家机器的虚伪、暴虐与无耻，给予了无情的揭露和鞭挞。显然两人把历史理性的视点放到了不同的侧面，而且又各有自己的局限性（前者的社会理想属于乌托邦，后者对过去流露着落伍农民式的留恋）；然而他们的艺术描写中的情感评价，不仅蕴含着丰厚的人文关怀的价值意义，而且其体现的历史理性也得到了马克思主义经典作家们的高度评价：一个是“现实主义的最伟大胜利之一”，一个是“最清醒的现实主义”。\n\n因此可以看出，作家的人文关怀是建立在对社会生活的规律性认识和描述中的，他们作品的价值是建立在人文与历史的交会上，而不是单一观念的宣传与演绎。", "keywords": "“善”“真”你中有我，我中有你 多侧面多层次 规律性认识和描述", "note": "人文关怀与历史理性二者对于人的发展都是必需的，历史理性的强调能促进人和社会的发展，人文关怀的重视能使人和社会的发展更健全、更丰富、更和谐、更健康。顾此失彼或顾彼失此都是不好的。", "framework": ""}, {"id": "198", "stars": 1, "title": "为什么说形式创造对文学审美价值的实现具有“生死攸关”的意义", "body": "当艺术真实的创造及其蕴含的情感评价成为“真”与“善”的统一时，这种统一便构成文学创造追求的审美价值。然而这个“美”尚处内容状态，还需要相应的形式创造予以外化和体现。可见，形式创造是文学的真善美价值追求的最后完成。\n\n任何精神作品都有它的存在形式，否则它的内容就无以体现。然而相对艺术作品而言，非艺术的精神作品，其形式与内容之间的联系却不若艺术作品密不可分，有的甚至可以做到一定程度上的剥离。如一条法律条文，可以用话语方式表述，也可以用连环画的形式演示，内涵基本不变。文学则不然，它的形式和内容“两个实体，活在一起，永远谁也离不开谁”，就像黑格尔所说的：“内容非他，即形式之转化为内容；形式非他，即内容之转化为形式。”“没有无形式的内容，正如没有无形式的质料一样......内容所以成为内容是由于它包括有成熟的形式在内。”这表明，内容与形式是融合为一体的，我们既不能离开内容来说形式，也不能离开形式来说内容。当年有人向列夫·托尔斯泰讨教他的小说主题时，他的回答是：“艺术品的完整的基本内容只能由那艺术品本身表现出来”，要让他说明自己作品的主题，他就得按照小说的表现方式从头到尾地再叙述一遍。可见，形式创造对于文学审美价值的最终实现是多么重要。这一重要性从20世纪初期兴起来的俄国形式主义及后来的法国结构主义、英美新批评等理论中也可以见出。例如，俄国形式主义认为，文学之所以为文学且与其他精神创造物相区别的一个根本特征就是它的文学性，而文学性存在于形式（主要指语言形式）之中，不是在作品的思想内容里，与作品中的社会历史内容也无关系。很显然，俄国形式主义是极其重视形式而完全抹杀内容的，他们把形式提高到了本体地位，认为形式本身就是美与审美之所在。对于这一理论本身的得失与影响这里不必论及，但从一个侧面我们可以看到形式创造对于文学作品及其审美价值实现的重要意义。", "keywords": "审美价值 形式创造 最后完成 融合为一体 审美价值实现", "note": "艺术价值从来都存在于作品中，表面看或许会随着时代的变化而变化，但其内在与外在的相互融合永远都存在于作品中。文学之所以带给人审美享受，是因为在形式上有其文学之为文学的理由和表现，一部好的作品，必然是内容与形式相得益彰的。", "framework": ""}, {"id": "199", "stars": 3, "title": "谈谈你对审美理想的认识", "body": "一、审美理想的内涵\n\n审美理想也称美的理想，是指审美主体在长期社会实践和审美活动中形成的、由个人审美经验和人格境界所肯定的，并融合了特定历史文化传统的关于美的理想观念或范型。\n\n审美理想的形成深受文化传统、社会语境和阶级身份的影响，因此具有鲜明的民族和阶级特征；审美理想又与个体的秉性、经历和修养密切相关，因此具有显著的个体差异。\n\n审美理想形成于具体的艺术实践和审美活动之中，但是一旦形成，又会对审美主体的艺术创作和审美活动产生有力的引导和制约作用。在文学创作中，审美理想同样是引导作家创造艺术美的重要内部动因和力量。\n\n二、审美理想的特征\n\n（一）审美理想是以理念形式存在的鉴赏的原型和最高典范。审美理想是所有经验之美的最高范型，融合了众多经验之美的最典型、最具表现力的特征，体现了审美主体对美的最高向往和期待，是审美主体选择美、鉴赏美和创造美所依据的最高典范，并作为“原型”蕴含于审美主体鉴赏的各种审美对象和创造的各种美的形态之中。\n\n（二）审美理想是直观形象与理性观念的结合。在审美理想中，感性与理性各得其所，各极其致，集真、美、善于一身，合知、情、意于一体。\n\n（三）审美理想是个体性与群体性的统一。审美理想的产生具有鲜明的个体性，它植根于个体的艺术素养和审美经验，经由个体心灵的内化和表现，并只能存在于个人的意识之中。但是，审美理想又在有意无意之间表达了民族、阶级，甚至整个时代审美经验。这种群体经验是一种集体无意识的积淀，保存着一个民族最悠久、最深厚的审美趣味。\n\n三、审美理想的意义\n\n（一）在文学创作中，审美理想是作家进行审美评价的最高标准。文学作品所表现的一切，美或丑，崇高或卑下，悲或喜，都需要接受审美理想的观照；也不管是否自觉，作家创作总离不开审美理想的引导和调节。\n\n（二）审美理想对生活的观照和评价功能特别体现在作家对生活丑的艺术表现中。在审美理想的照耀和穿透下，对丑的表现和否定同时又可以确证美。作家对丑的描写是否成功，关键在于对丑的对象的准确的审美评价。如果我们看到了丑，又能深人地了解它，正确地评价它，那就意味着我们是从美的理想的高度来理解和感受它。", "keywords": "内涵 理想观念 范型 特征 理念形式 原型 最高典范 直观形象 理性观念 个体性 群体性 意义 最高标准观照和评价", "note": "这部分内容可以说是“审美理想”这个概念的具体内容，主要分为三个层次，首先是对其概念作一个定义，然后讨论其形成过程中的影响因素，最后是其对审美主体的能动作用。审美理想是传统审美观的积淀，是以理念形式存在，其中理性与感性相互掺杂，共同存在，其产生于个体意识之中，但个体又属于整个社会，受到社会、历史等的影响，所以审美理想是个体性与群体性的统一，大家要注意综合掌握。", "framework": ""}, {"id": "200", "stars": 3, "title": "阐释“内容形式化”与“形式内容化”的审美创造内涵", "body": "形式创造是文学审美价值追求的最后完成，是一个内容形式化与形式内容化的互动过程，也是一个互相生成、互相彰显的过程。文学内容与形式之间是相互规定的：一方面，一定的材料和内容要求并规定着相应的文学形式；另一方面，文学材料和内容又必须达到充分地形式化融入文学形式之中。在文学之美的创造过程中，形式对材料和内容的表现（也即材料和内容的形式化）具有更重要的意义。\n\n一、内容形式化\n\n（一）传统的文学理论认为，内容决定形式，从内容的表现需要出发，创造艺术形式，是这些作品取得成功的奥妙所在。这一认识无疑有它的真理性。然而应该指出，仅仅停留在空泛强调“内容决定形式，形式是依据内容表现的需要而创造的认识层面”，尚不足以构成对文学创造中艺术形式形成过程的真实揭示，而且还容易导致认识上的误区：仿佛文学创造就是内容同既定的现成的艺术形式之间的结合。\n\n（二）形式创造并非如此，它是内容形式化的过程。对此，别林斯基曾作过深刻的诠释。他说：对文学作品而言，“它的形式对它并不是外在的，而是它自己所特有的那种内容的发展”；因而在文学创造中，当内容显化为形式并为作家组织起来的时候，内容就“消逝、消失在它里面，整个儿渗透在它里面”。简而言之，内容形式化过程就是内容转化为形式的过程，它体现为内容的有序组织和有形呈现。在此基础上，作家还要运用各种艺术表现手法，把在艺术构思中产生的“作品的轮廓”进一步外化或传达为文学作品。至此，文学的形式创造才算走完了它的全过程。\n\n二、形式内容化\n\n它是指形式创造具有塑造内容或者帮助其生成的作用。其实，文学创造并非在物化阶段作家才运用艺术表现手法进行形式创造。实际上艺术构思即文学创造之初，甚至是体察生活阶段，形式创造已经开始。\n\n在艺术构思阶段，诚如19世纪法国美学家狄德罗所言，当作家“神游物外的时候，他完全接受艺术的支配”。所谓“艺术的支配”，就是作家的艺术思维是以审美价值取向的情感为动力，充分调动自己的生活经验，在想象中对素材进行生发、改造、整合。显然，这种想象体现着艺术家特有的融入了各种表现手法的创造性思维。莎士比亚说，艺术家的这种想象甚至“会把不知名的事物用一种形式呈现出来，诗人的笔再使它们具有如实的形象”。\n\n在实践中，我们不难发现，由于形式的生成作用，内容的确能得到深化或升华乃至于产生审美新质。如鲁迅的《药》塑造的中国资产阶级民主主义者夏瑜的形象，自始至终用的都是侧面描写。小说从他被害的余波写起，选取几个富有特征的场面，通过一些不理解、不同情乃至仇恨革命的人物的议论予以表现。显然，正是这种叙述视角，与作家冷漠的叙述语调相匹配，让读者心底透出一片冰凉，仿佛空气都因夏瑜与周围社会环境的隔膜而变得稀薄了，从而使读者强烈地感受到了中国资产阶级旧民主主义革命脱离群众的悲剧凄冷氛围。如果换上另一种叙述方式，其体现的艺术内容就不一样了。", "keywords": "传统文学理论 内容决定形式 内容形式化 内容转化为形式 形式内容化 塑造内容 深化或升华 审美新质", "note": "艺术的形式和它所体现的内容完全处于合一的状态，形式是内容的从属，是内容的载体和容器，二者不可分割。在文学作品呈现的具体情境中，内容是它的这一形式的内容，形式是它的这一内容的形式，两者互为存在的条件和依据。文学审美价值的最后完成，形式创造的基本内涵：内容形式化和形式内容化正体现了两者的完全融合。", "framework": ""}, {"id": "201", "stars": 4, "title": "谈谈你对“有意味的形式”这一概念的理解", "body": "一、有意味的形式\n\n这一概念是由英国文艺批评家克莱夫·贝尔在其著作《艺术》一书中提出的，他说，“在各个不同的作品中，线条色彩以某种特殊方式组成某种形式或形式的关系，激发我们的审美感情。这种线、色的关系和组合、这些审美的感人的形式，我视之为有意味的形式。有意味的形式就是一切艺术的共同本质。”总起来说，形式之所以是“有意味”的，是因为它能唤起人们的审美情感。\n\n二、错误理解\n\n克莱夫·贝尔的形式主义理论，对我们认识形式美的问题是很有借鉴意义的，但这一理论的本质是否定艺术同现实人生、生活情感等相联系的纯粹的形式主义理论，对这一点我们应该有清醒的认识。\n\n三、科学内涵\n\n如果我们把所谓形式的“意味”置于人类的审美经验基础之上，那就可以赋予“有意味的形式”这一概念以科学的内涵。可以这样诠释：“形式”所以“有意味”，是因为它们内蓄着一定的社会历史内容和人类的审美情感。在长期的社会实践中，自然现象和社会事物的形式不断地作用于人们的生活，人们也在不断地认识它们的过程中把它们主观化、情感化、心灵化，久而久之，这些形式就成为人类情感与意识的较为固定的表现；因此，当它们从现实的具体事物身上分化出来而成为独立的、具有稳定的审美对象时，尽管它们与自己曾经拥有的社会功利内容及目的之间呈现出明显的分离状态，然而它们都由于能与人们在长期社会实践中形成的审美经验和审美心理结构相对应，因而依然能给人们以“有意味”的审美感受从而达到情感上的交流。这一诠释在我国传统戏曲的程式化表演上可以得到充分的确证。如曹操的白脸脸谱让人想起奸诈，关云长的红脸脸谱是忠义的象征，等等。所以，“形式”而“有意味”是因为“形式”本身包含着一定的社会历史内涵或人类的情感蕴藉，它是有内容的，而不是形式主义者所认为的空洞无所指的纯粹形式。", "keywords": "克莱夫·贝尔《艺术》审美情感 纯粹的形式主义 审美经验基础 社会历史内容 人类的审美情感", "note": "有意味的形式是从艺术的本质对艺术的定义。有意味的形式突出了艺术的审美本质方面，比表现说更进一步，但是把“意味”及“审美纯形式”与一切现实完全切断，抽象地谈论审美情感和有意味的形式，则陷入了形式主义和神秘主义。", "framework": ""}, {"id": "202", "stars": 5, "title": "简论文学形式的相对独立性和能动性", "body": "内容决定形式，形式有相对的独立性，并反作用于内容。这一哲学原理同样适合于文学领域。\n\n一、相对独立性\n\n（一）从文学创作的角度看\n\n从文学创作的角度看，形式的相对独立性是很明显的。所谓内容决定形式，只是说形式必须适应内容的需要。适应一定内容需要的形式，并不限于一种。每一种形式都有其自身的特点、规律，即相对的独立性。凭此，它既可以服务于这样的内容，也可以服务于那样的内容，并不成为某种内容的专利品。即便服务于某种内容之时，其自身的独立品格也依然存在。相同或相似的内容，可以用不同的文学样式来表现。同时，同一种文学体裁，又可以用来表现不同的内容。比如，某一部作品移植、改编为另一体裁的作品；诗歌可以抒情，可以叙事，也可以画人绘景、裁古论今等。这充分说明了文体作为艺术形式的相对独立性。结构、语言、表现手法等也是如此。\n\n（二）从文学史的角度看\n\n从文学史的角度看，文学作品的形式一经形成，就具有相对的稳定性。形式为适应内容的需要而产生。但一经产生，就具有了相对的独立性。它有自身的特定构成及特点、规律，并因而形成自身发展的继承性。这主要表现为形式与内容发展不平衡的现象。有时候，具体的生活内容发生了很大的变化，但在对形式的适应性要求上，并未产生多少变异，甚至基本未变。这是一种经常的带有普遍性的现象。还有一种是形式对总体内容有所超越的现象。总之，这种不平衡现象的存在，说明文学作品的形式具有相对的独立性。\n\n二、能动性\n\n文学形式的能动性主要表现为内容的生成和塑造作用。事实上，作品形式的优劣高下，直接影响内容的表达。与内容相适应的较完美的形式，可以增强作品的艺术力量，充分实现内容的价值；反之，则会损伤内容的艺术体现。一切真正优秀的名著，其之所以具有经久不衰的艺术魅力，不仅在于其内容能超时空地吸引读者，给予人们启示和教益，还在于与之相适应的艺术形式，使有益的内容得到了充分的体现和艺术的强化，从而不仅尽其所有地发挥了内容固有的积极作用，而且使人得到了艺术的熏陶和审美的享受，因此，文学形式尽到了其所能的生成和塑造作用。", "keywords": "文学创作角度 形式不限于一种 文学史角度 不平衡现象 能动性 内容的生成塑造", "note": "形式的相对独立性表现为不仅同一艺术形式可以表现多种内容，而且不同的艺术形式可以表现相同的内容。形式对内容具有反作用，适合于内容的艺术形式，既有利于表现作品的内容，也有利于增强其艺术感染力，而不适合于内容的低劣的形式，则会妨碍作品内容的表达，削弱它的艺术感染力。", "framework": ""}, {"id": "203", "stars": 1, "title": "有人说文学作品是不可转译的（包括各民族语言及古今语言之间），你认为有道理吗？为什么", "body": "与其他艺术创造相区别，文学创造的工具和媒介都是语言文字。从创造过程来看，它的三个阶段-发生、构思、物化都是离不开语言文字的。\n\n一、转译丢失了语言的体验性色彩\n\n语言是思维的物质外壳，它是文学的“第一个要素”。作为一种形式，语言在文学创造中具有重要的作用，它能够使内容得到深化或升华，产生许多只可意会不可言传的新意、韵味。如“红杏枝头春意闹”和“云破月来花弄影”两个诗句。清末学者王国维说，这一“闹”-“弄”“境界全出”，意思是说这两词的运用使这两个诗句陡然生出更丰富更耐人寻味的审美内涵。这就是语词运用得准确所产生的魔力。\n\n而这个秘密在于语言不仅具有准确达意之功能，更具有体验性之色彩。作家并不是把意思表达完整就心满意足了，他还把自己的情绪、情感融入于字里行间，使读者在阅读时也能感受到这种情绪、情感甚或氛围。这种情感和氛围是与语言密切联系在一起的，离开了特定的语言，它们就会大打折扣。\n\n不同语言之间进行翻译，意义是能准确传出的，而这种体验性是很难传递的。如海明威的作品，有眼光的专家曾指出，“他的作品译成其他语言后就大大走样，因为他的诗化的文字意境一方面来自当代活活泼泼的美国口语，另一方面则可能与《圣经》的语体有关，而这两种特点的结合在翻译中几乎全部丧失了，因而也就很难使读者真正体验到作家的情绪色彩。”各民族语言本身在自身形成和发展中都会形成不可替换的潜在情绪，而每位有个性化风格的作家也会形成带有自己情绪色彩的语言表达方式，这些都是在翻译中会走失的东西。\n\n二、转译丢失了语言的音乐性特征\n\n文学语言具有音乐性特征。这一点在诗歌中尤为明显，而在古文中更是如此。它的音响、节奏、韵律等音乐性特征特别突出。古人对怎样学习理解文章多有论及，如姚鼐说“放声疾读，久之自悟”，曾国藩讲“非高声朗读则不能得其雄伟大概，非密咏恬吟则不能探其深远之趣”。这些虽是谈学习古文，但从一个侧面也可以印证上述音乐性之特征。虽然古文的语法与今文的不太一样，存在着省略、倒装等特点，我们翻译时可以把它补充完整予以排序，但是那种音乐性是翻译不出来的。如被推崇为干古绝唱的美文-欧阳修的《醉翁亭记》，全文用了21个“也”字，一气呵成，一波三折，极尽曲折迂回之美，译成现代汉语之后，韵味不如原文了，美感不那么强烈了。若从欣赏的角度考虑，有些古文不适宜译成现代汉语。\n\n【李凡说：成功的转译文学作品要求对两种语言文字以及文化背景都有较好的积淀。转译成中文的文学作品有很多成功范例，但是中国文学作品翻译成外文有很多失其精华。一方面，汉语词汇量很大，一个词语可以有很多近义词，这样翻译出来的作品词汇量就很大，显得作家很博学；另一方面，中国创作传统中有炼字一说，很多人愿意去花时间找到一个最贴切的词语，而转译之后会失其韵味。】", "keywords": "语言文字 物质外壳 “第一要素”准确达意 体验性 语言表达方式 音乐性", "note": "", "framework": ""}, {"id": "204", "stars": 1, "title": "文学的审美性与以丑为表现对象是否矛盾，为什么", "body": "文学的审美性与以丑为表现对象是不矛盾的。\n\n文学与生活的关系是建立在人与现实的审美关系之上的，审美是文学价值取向的内在规定。但是，肯定文学具有审美的属性并不是说它只能表现美的对象，不能写丑的东西；而是说文学是从审美关系上来把握社会生活的。正像人们在现实人生中经常可以观察，甚至经历过的那种生活情景一样，人的价值和人生的意义往往是在矛盾与斗争中才能获得鲜明而丰富的显现，因而真与假、善与恶、美与丑的对抗、斗争和比照，实际上具有更高的审美价值。\n\n在这个意义上说，丑的东西能够也应该成为文学的对象。丑本身不可能成为美，然而美与丑的斗争，却能够使丑成为审美的对象；充分显示了丑的本质，或者对丑的表现达到了神似境界的艺术形象，也因此有可能获得极高的审美价值，成为不朽的艺术形象。即使像悲剧，表现了丑暂时地压倒了美，它也能因为唤起了人们对美的追求与向往而取得审美的意义。\n\n现实中的丑本身不具备审美价值，不能引起人们的美感，但是，丑的事物，经过艺术家、作家的揭露和批判塑造成艺术形象，也就具有审美价值。所以，一部文学作品是否具有审美的价值，并不取决于它是否写了丑的东西，而是取决于作家是否从审美关系上去认识和表现这种对象。\n\n【李凡说：审丑是西方现代主义一个重要的文学观念，也是现代主义文学思潮的主要艺术特征。对人性中丑恶因素的描写，是西方现代主义文学人性批判的主要方式。20世纪80年代，随着西方“丑学”理论的引入，中国作家们掀起了审丑文学创作的热潮。】", "keywords": "不矛盾 审美关系 对抗斗争 更高的审美价值 艺术形象", "note": "", "framework": ""}, {"id": "205", "stars": 1, "title": "试描述俄国形式主义的基本理论，并作简要评论", "body": "俄国形式主义是1914至1930年在俄罗斯出现的一种文学批评流派，于1930年代中期，遭斯大林主义的压迫而停止在俄罗斯的发展。它是西方文学史上重要的文艺思潮之一，对后来的结构主义与符号学，乃至英美新批评派的形成，都有着很大影响。\n\n一、主要理论\n\n（一）文学作品是“意识之外的现实”。形式主义者指出，他们研究的是作为客观现实的艺术作品，而不管作者和接受者的主观意识和主观心理如何。因为艺术作品中的每一个句子不可能是作者个人感情的简单反映，任何时候都只是一种构造和游戏。\n\n（二）文学创作的根本目的在于审美过程。形式主义理论家们分析了审美感知的一般规律。他们认为，人们感知已经熟悉的事物时，往往是自动感知的。这种自动感知是旧形式导致的结果。要使自动感知变为审美感知，就需要采取“陌生化”\n\n手段，创造出新的艺术形式，让人们从自动感知中解放出来，重新审美地感知原来的事物。作家应该尽可能地延长人们这种审美感知的过程。所谓“陌生化”就是要使现实中的事物变形。这一概念是俄国形式主义理论中的一个重要组成部分。\n\n（三）文学批评的任务是要研究文学之所以成为文学的内部规律，即文学性，也就是要着重研究艺术形式，要深入文学系统内部去研究文学的形式和结构。形式主义者认为，既然文学可以表现各种各样的题材内容，文学作品的特殊性就不在内容，而在语言的运用和修辞技巧的安排组织，因此文学性仅存在于文学的形式。形式主义也由此得名。\n\n（四）现代语言学的研究方法是文学批评可以运用的主要方法之一。这一方法能够科学地揭示文学作品的形式结构，把握文学创作的规律。形式主义者按照索绪尔的办法，把文学研究也划分为内部研究和外部研究，并着眼于以形式分析为主的内部研究。在他们看来。共时性的语言学研究方法是文学科学化研究的理想方法。\n\n二、评价\n\n从理论上来说，俄国形式主义者从形式的角度来规定文艺的本质，把文艺创作视为一种表现形式。认为文艺创作有自己独特的目的性，即为人提供感受与体验。欣赏文艺的人直接得到的首先是一种审美感受与审美体验；从批评实践上来看，俄国形式主义的理论主张与批评实践并不完全一致。就本质而言，它还没有超出唯美主义的范围，是19世纪唯美主义的延续。在具体文学作品的研究中，他们一边强调唯艺术形式的分析，一边又不得不涉及作品的内容，直到后来的结构主义、符号学派，批评才真正开始摆脱内容，走上语言学、语义学批评的道路。\n\n俄国形式主义在文学批评的研究对象、研究方法上都有自己独特的见解，他们对文学批评的原则、功能等问题的看法带有强烈的反传统色彩。俄国形式主义虽存在的时间比较短暂，但影响是深远的。他们不仅对法国结构主义文学批评的影响显而易见，而且在新批评乃至布莱希特的“间离效果”中也可以看到俄国形式主义的先驱意义。", "keywords": "“意识之外的现实”审美过程“陌生化”文学性 现代语言学 形式的角度 理论实践不一致 唯美主义的延续 反传统色彩 先驱意义", "note": "俄国形式主义是1915至1930在俄国盛行的一股文学批评思潮，其组织形式有以雅克布森为首的“莫斯科语言学学会”和以什克洛夫斯基为首的“彼得堡诗歌语言研究会”其成员大多为莫斯科大学和彼得堡大学的学生。", "framework": ""}, {"id": "206", "stars": 4, "title": "文学作品有哪些类型？各有哪些特征", "body": "根据文学创造的主客体关系和文学作为意识形态对现实的不同反映方式，把文学作品分为现实型、理想型和象征型三种类型。\n\n一、现实型文学\n\n现实型文学是一种侧重以写实的方式再现客观现实的文学形态，基本特征是再现性和逼真性。\n\n（一）再现性\n\n再现，指对外在客观现实状况作如实刻画或模拟。它要求文学立足于客观现实，面对现实，正视现实，忠实于现实生活，而不是绕开现实，躲避现实。现实型文学偏重于对客观现实的冷静观察和理智分析，直接揭示现实矛盾，触及人生。\n\n现实型文学在再现现实时严格遵循客观规律，反对主观随意性。在人物塑造方面，力求揭示人物性格形成的客观原因。现实型文学作品中的人物形象，不是超时空的、理想化的，而是存在于特定时代社会的具体环境之中的。其人物性格具有非常具体、确定的社会内容。社会环境对人物性格的发展变化起到极大的制约作用，成为人物行动的重要依据。\n\n现实型文学作为一种文学反映形态，同样包含着对现实生活的情感评价。不过，与理想型文学直抒胸臆式的表现不同，现实型文学的主观情感态度融会在客观再现之中，渗透在情节、场面、人物的描绘刻画之中。作家不直接出面在作品中表露自己的主观倾向，是现实型文学创作的重要原则。\n\n（二）逼真性\n\n逼真，是指以写实的方法，按生活中各种事物的本来面目进行精细逼真的描绘。客观事物感性状貌和细节的真实，是它的特色。现实型文学对事物感性状貌、细节的具体刻画，逼真地再现出特定历史时代的生活环境，给读者以身临其境之感，大大地增强了作品的真实性。由于重视生活画面的逼真再现，所以现实型文学以描写见长。\n\n现实型文学从现实生活实际出发，描写生活里本来就有的事物，从社会生活中汲取创作材料，反映客观存在，表现作者真切的现实感受。现实型文学中的人物形象，在现实原型的基础上经过作家加工塑造，成为读者眼中的“熟悉的陌生人”。出现在现实型文学作品中的，几乎全都是现实社会中的人情世态和日常生活中普通人的生活命运，绝少有虚幻离奇的神仙妖怪和超尘脱俗的英雄豪杰。\n\n二、理想型文学\n\n理想型文学是指一种侧重以直接抒情的方式表现主观理想的文学形态，其基本特征是表现性和虚幻性。\n\n（一）表现性\n\n理想型文学超越现实，突出表现性，具有明显的理想主义色彩。表现，指把内在主观世界状况（如情感、理想、想象、幻想等）以形象呈现出来。显然，在理想型文学中主观理想具有高于一切的地位。现实型文学反映人类社会实际存在的现实生活，理想型文学则艺术地创造出一个理想的世界，表达作家超越现实的主观愿望。\n\n理想型文学的主观理想精神，在文学反映方面体现为对现实矛盾的情感评价的侧重。理想型文学与注重客观再现的现实型文学不同，它极大地突出了文学的抒情表现功能。理想型文学的情感态度常常是以直抒胸臆的方式表达出来的，而不像现实型文学那样不动声色地将情感隐藏在对事物的描绘之中。这也正是现实型文学与理想型文学作家之间论争的一个焦点。\n\n（二）虚幻性\n\n理想型文学充分运用夸张、变形、虚构的方法，不求外表的真实，而遵循情感的逻辑，追求情感的真实。理想型文学并非完全不从现实生活中汲取素材，但这种素材经作家的处理，便具有了独特的夸张、变形的色彩。\n\n理想型文学塑造的多是作家理想中的英雄。由作家超越现实的主观理想所决定，现实中的人物很难符合他们的要求。于是，神话、传说、历史故事、民间传奇等便成了理想型文学创作的重要素材。由于现实中难以提供其所需要的理想的表现对象，理想型文学便大胆地发挥想象、幻想的能力，虚构出现实中不存在的形象，既不受生活真实的约束，也不为时间、空间所限制，只要能充分表现主观理想，符合情感的要求，任何奇幻的事物都可以创造。为了塑造作者理想的英雄人物，理想型文学往往为他们构造出奇幻的情节，让人物在特殊的环境中展示超凡的智慧和本领。\n\n三、象征型文学\n\n象征型文学是一种侧重以暗示的方式寄寓审美意蕴的文学形态。这种意蕴或侧重客观，或侧重主观，但都具有某种超出具体现象、个别事物的抽象性、概括性。它的基本特征是暗示性和朦胧性。\n\n（一）暗示性\n\n暗示是象征型文学寄寓意蕴的方式。暗示，指词语寄寓某种超出本义的内涵。这表明，现实型与理想型文学的意义就在其形象自身，而象征型文学突出文学形象的意义的超越性。\n\n象征型文学偏于以间接的方式去暗示客观规律和主观感受，不直接说出事物而是暗示事物，以激发某种审美感受。象征型的文学作品中有观念，但观念必须依赖各种象征意象，曲折地、独特地表现出来，并要求读者通过直觉与情感进一步加以理解。也可以这样说，这是一种表达思想和情感的艺术，但不直接去描述思想和情感，也不通过与具体意象明显的比较去限定思想和情感，而是暗示这些思想和情感是什么，运用未加解释的象征使读者在头脑里重新创造它们。象征型文学反对直接性的表现，强调只有暗示性的象征才能体现艺术的创造精神。\n\n（二）朦胧性\n\n象征型文学的间接表现的暗示方式，使它具有一定的朦胧性。朦胧，指词语含有多层不确定的意义。象征是抽象之物与具体之物之间的比较，其中的意义是纯粹暗示出来的。并且由于象征经常是单独存在的，读者又很少得到何物被象征化的暗示，因此，象征主义的作品不可避免地具有某种内在的朦胧性。象征型文学的暗示不能用单一的确定的意义去概括，因为它具有超出个别现象的更宽泛的意义。象征型文学为读者留下了无穷的想象的空间，要求读者去积极地思考、探寻丰富的“象外之象”“象外之意”“言外之意”。\n\n象征型文学为了暗示某种深远、普遍的哲理、意蕴和主观情思，在文学意象的塑造中，对客体形象进行加工处理，使其成为变形化、拟人化的假定性意象。这种文学意象已经超越了其自身的具体、个别的现实属性，不确指生活中某一真实事物，而是概括性、虚拟性很强的假定事物。\n\n总之，现实型文学着重描写生活中的事物，并以写实的方式达到细节的真实，力求如实地再现现实。理想型文学偏于塑造生活中不存在的虚幻的形象，以夸张、虚构为其主要表现手段，力求表现超越现实的主观理想。象征型文学或直接取材于现实事物，对它们进行变形化、拟人化的处理，或凭借想象虚构出非现实性的事物，从而塑造出具象与抽象、个别与一般、现实与超现实统一的寓意性形象。\n\n【李凡关键词：现实型文学 再现性 逼真性 理想型文学 表现性 虚幻性 象征型文学 暗示性 朦胧性】\n\n【李凡说：文学按照不同的标准可以分出不同的类别，从内容形式上答题可以分为现实型文学、理想型文学、象征型文学。对应到中西文学史上，大致是现实主义、浪漫主义、象征派等等，在文学发展史上还可以分化得更细。】", "keywords": "", "note": "", "framework": ""}, {"id": "207", "stars": 4, "title": "有关文学作品体裁的分类有哪些，各自特征是什么", "body": "由文学作品话语系统的不同结构形式所决定，文学作品形成诗、小说、剧本、散文和报告文学等基本体裁。\n\n一、诗\n\n诗是一种语词凝练、结构跳跃、富有节奏和韵律、高度集中地反映生活和抒发思想感情的文学体裁。诗可以分成抒情诗与叙事诗、格律诗与自由诗等。诗的基本特征是：凝练性、跳跃性、音乐性。\n\n（一）凝练性\n\n诗具有凝练性，体现在用高度概括的艺术形象、极其精练的文学语词最集中地反映社会生活和表达思想感情。一切样式的文学作品都是现实生活的集中反映，但诗的概括性更为突出。它反映生活不是以广泛性和丰富性取胜，而是以集中性和深刻性见长。它吟咏的是使人最激动的生活事件。它要求精选生活材料，抓住感受最深、表现力最强的自然景物和生活现象，用极概括的艺术形象达到对现实的审美反映。即使是偏于情节叙述的叙事诗，其叙述内容也不能像小说那样铺展。\n\n（二）跳跃性\n\n诗在结构上具有突出的跳跃性特征。它遵循想象、情感的逻辑，常常由这一端一跃而到另一端，或由过去一跃而到未来，超越了时间的樊篱、空间的鸿沟。诗的跳跃多由两个或两个以上的动作构成，动作之间没有持续性，只被同一个情感线索维系着。在动作、形象、图景之间的跳跃性结构方式，以断续表现连贯，以局部概括整体，给读者驰骋想象留下了开阔的领域。诗的跳跃性有多种结构形态，主要有时间上的、空间上的、时空综合的、由客观动态向主观动态的、关联式的、平行式的、对比式的跳跃等。而采用何种跳跃式结构，则由诗人所要反映的生活和表达的思想感情而定。\n\n（三）韵律性\n\n在各种文学样式中，诗是最强调韵律性的。诗的节奏主要指诗句中长短、强弱不同的音有规律地变化。如果各诗句停顿次数均匀，就会形成鲜明的节奏。调配声调也有助于加强节奏感。有规律地搭配安排平声与仄声，便形成起伏交替的节奏。由音节长短以及音步多少构成的不同长短的句子，表现出不同情感的缓急节奏。诗的韵律，也称押韵，是指同韵母的字在相同位置上有秩序地重复出现。诗的押韵，一方面可以加强诗的节奏感，达到和谐整齐的感官审美效果；另一方面则主要是为了促进情感的抒发和意境的创造。\n\n二、小说\n\n小说是一种侧重刻画人物形象、叙述故事情节的文学样式。小说可以分为长篇小说、中篇小说与短篇小说，文言小说与白话小说，等等。小说的基本特征主要是：深入细致的人物刻画、完整复杂的情节叙述、具体充分的环境描写。\n\n（一）深入细致的人物刻画\n\n描写人物，是小说的显著特点。着重刻画人物形象是小说走向成熟的标志。同其他文学样式相比，小说在人物刻画上拥有更丰富的表现手段，可以从各个方面深入细致地塑造性格复杂的人物形象。在小说中，既有人物言语，也有叙述人言语，而且往往以后者为主。小说可以具体地描写人物的音容笑貌，也可以展示人物的心理状态，还可以通过对话、行动以及环境气氛的烘托等多种手段来刻画人物。\n\n（二）完整复杂的情节叙述\n\n情节是与人物密切相关的，是人物性格发展的历史。小说一般篇幅较长，容量较大，可以更广泛全面地描绘多方面的社会生活，反映多种多样的矛盾冲突，并在生活事件的发展过程中刻画人物性格。小说可以突破相对固定的时空限制，容纳更复杂丰富的情节，反映更广泛的生活内容。因为要充分叙述完整的情节，即使是短篇小说和小小说，长度也必须足以容纳一个较完整的情节。\n\n（三）具体充分的环境描写\n\n环境描写是衬托人物性格、展示故事情节的重要手段。小说中人物的活动和事件的发生发展，都不能离开一定的时代、社会和自然的环境。人物性格的形成和发展，也是受特定环境制约的。只有充分地描绘环境，才可能具体、真实地揭示出人物活动和矛盾冲突的现实根据。小说在篇幅和时空上的自由，使其可以充分地发挥环境描写的艺术功能。它可以对社会环境作全面的介绍，又可以对具体的生活场景作细致详尽的描绘。历史环境可以写上下几千年，自然环境可写纵横几万里。它可以随时变换场景，为人物活动和情节展开提供自由灵活的时间与空间范围。\n\n三、剧本\n\n剧本是一种侧重以人物台词为手段、集中反映矛盾冲突的文学体裁。剧本可以分为悲剧、喜剧与正剧；按场次划分，还可分为独幕剧与多幕剧等。它的基本特征是：浓缩地反映现实生活；集中地表现矛盾冲突；以人物台词推进戏剧动作。\n\n（一）浓缩地反映现实生活\n\n受舞台表演时间、空间的限制，剧本对现实生活的反映具有高度的浓缩性。为了使舞台这块小天地尽量多地容纳社会生活繁复广阔的内容，剧作家必须把生活写得高度浓缩、凝练，用较短的篇幅、较少的人物、较简省的场景、较单纯的事件，将生活内容概括地、浓缩地再现在舞台上。剧本再现生活的浓缩性要求情节结构单纯、集中。只有使剧情高度集中、概括，才能充分发挥戏剧的表现功能，在有限的时空中表现丰富的内容。\n\n（二）集中地表现矛盾冲突\n\n没有集中的矛盾冲突就没有戏剧，这已成为一条公认的定理。相比小说，剧本更要把矛盾冲突高度集中，使之达到尖锐、剧烈的程度。剧本要集中地表现矛盾冲突，是由戏剧艺术的时空特征决定的。它必须一开始就抓住事件的起点，然后通过一些必要层次的发展，把事件尽快地推向高潮。如果冲突不集中、不剧烈，剧情的发展必然会缓慢。矛盾冲突的集中展开，也为展示人物性格提供了充分的条件。戏剧是直接面向观众的艺术，如果没有尖锐剧烈的矛盾冲突，舞台上必然会出现“冷场”，不能唤起观众的审美注意力。因此，集中地表现现实生活的矛盾冲突，是戏剧文学的基本特征。\n\n（三）以人物台词推进戏剧动作\n\n在剧本中，剧中人物的言语（台词）是用来塑造形象、展示矛盾冲突的基本手段。剧本不允许作者出现，一般不能有叙述人的言语，只能靠人物自身的言语塑造形象。离开了台词，就没有了戏剧文学。戏剧人物的言语、对话要足以推进戏剧动作。台词的动作性，即人物言语要以矛盾冲突为基础并能促进事件、冲突的发展。戏剧矛盾冲突由产生到激变，就是由一系列戏剧动作来推动的。各个戏剧动作由人物的形体活动和言语活动来体现，其中对话、独白是更重要的。\n\n四、散文\n\n散文有广义的散文与狭义的散文。广义的散文既包括诗歌以外的一切文学作品，也包括一般科学著作、论文、应用文章。狭义的散文即文学意义上的散文，是指与诗歌、小说、剧本等并列的一种文学样式，包括抒情散文、叙事散文、杂文、游记等。文学散文是一种题材广泛、结构灵活，注重抒写真实感受、境遇的文学体裁。它的基本特征主要是：题材广泛多样，结构自由灵活，抒写真实感受。\n\n（一）题材广泛多样\n\n散文选择题材有广泛的自由。它可以写人、叙事、写景、咏物、怀友、访旧，也可以描写风土人情，展示国际风云，细摹花鸟虫鱼。地方风习、街头景色、往事回忆、感情述怀，以及天上地下、古往今来，无所不可。而其他文学样式则不同。一般说来，只有比较完整的生活事件和人物形象才可以入小说，只有含有集中的矛盾冲突的生活现象才可以入戏剧。散文则不需要以某个人物为中心，也不需要叙述完整的故事情节，而往往摄取生活中的一个片段、一个侧面，抒写作家特定的感受和境遇。\n\n（二）结构自由灵活\n\n散文也是一种结构自由的文学样式。灵活、随意，是它的长处。散文之“散”，较突出地体现了它的结构特征。散文之“散”，是形散神不散，散而有序，散而有凝。“形散”指散文运笔自如，不拘成法。散文作者在平素的生活中有所感触，于是随手拈来，生发开去，时而勾勒描绘，时而倒叙联想，时而抒情言志，时而侃侃议论。“神不散”，指中心明确、主题突出。零零散散、信笔所至的描写内容都贯穿在精深的思想感情的主线上，虽然落笔似不经心，却紧扣主题。\n\n（三）抒写真实感受\n\n散文更是最接近生活真实的文学样式。记人叙事，状物写景，“有感而发”“有为而作”，抒写作家真实的现实感受和真实的生活境遇是散文的一大特点。散文中写的是实人、实事、实物、实情。诚然，单纯记录一件实事或摹写一个实物，并不能称之为文学散文。散文必须写出作者对现实生活的真实的切身的感受，抒发真挚的情怀。散文的写实并非对生活的机械摹写，它也要运用剪裁、取舍、提炼和比喻、拟人、象征等方法，但这都要建立在描写真情实感的基础上。\n\n五、报告文学\n\n报告文学是一种在真人真事基础上塑造艺术形象，及时反映现实生活的文学体裁。它的基本特征是：及时性、纪实性、文学性。\n\n（一）及时性\n\n报告文学往往像新闻通讯一样，善于以最快的速度，把生活中刚发生的激动人心的事件及时地传达给读者。报告文学之所以受读者欢迎，就在于它能把握时代的脉搏，把群众关心的现实情况迅速地反映出来，发挥“文学轻骑兵”的作用。报告文学的重要价值正在于它的及时性、新闻性。特别是有些报告文学的内容属于突发性事件，时间界限比较明确，如果发表不及时，就削弱了它们的新闻价值和社会效用。\n\n（二）纪实性\n\n报告文学不能像小说那样虚构人物、情节，它必须以现实生活中的真人真事为描写对象，写真纪实是它的重要特征。一般来说，报告文学要写真人真事，但不是任何真人真事都能成为报告文学描写的对象。报告文学要追踪事实，但并不是任何事实都值得它们去报告，而是要有所选择和提炼。有的报告文学虽然也写了真人真事，但由于没有选取跳动着时代社会脉搏的人物与事件，结果缺乏时代感。\n\n（三）文学性\n\n报告文学的艺术价值体现在文学性上。报告文学不能像新闻报道那样，只有事件梗概，它必须塑造丰满的人物形象，必须有生动的形象化的细节。人物特写必须在介绍人物事迹中努力刻画人物，即使在以写事为主的作品中也离不开写人，如果能生动地刻画人物形象，必然会大大加强感染力。报告文学还可以吸收小说的描写技巧、戏剧的对话艺术、电影分镜头的叙述方法以及诗歌的跳跃手法等。", "keywords": "结构形式 诗 凝练性 跳跃性 韵律性 小说 深入细致的人物刻画 完整复杂的情节叙述 具体充分的环境描写剧本 浓缩地反映现实生活 集中地表现矛盾冲突 以人物台词推进戏剧动作 散文 题材广泛多样 结构自由灵活 抒写真实感受 报告文学 及时性 纪实性 文学性", "note": "①一切文学作品的思想内容都要通过这样或那样的体裁来表现，没有体裁的文学作品是不存在的。这犹如人们做衣服，必定要量体裁衣，选择一定的样式。在文学发展的历史上，出现了多种多样的文学体裁。这些名目繁多的文学体裁的产生和演变，都有一定的社会根据和它本身的发展规律。②这道题目字数很多，但其实是按体裁进行的分类，大家掌握好每一种的体裁的特点就好。", "framework": ""}, {"id": "208", "stars": 3, "title": "谈谈象征型文学与现实型、理想型文学的区别", "body": "一、现实型文学侧重再现客观现实，理想型文学侧重表现主观理想，而象征型文学侧重寄寓某种审美意蕴。这种意蕴或侧重客观，或侧重主观，但都具有某种超出具体现象、个别事物的抽象性、概括性。\n\n二、现实型文学和理想型文学的再现与表现都具有直接性。再现是通过对生活现象直接描绘以反映现实；表现是以直抒胸臆表达某种情感态度。而象征型文学则以暗示的方法间接地传达某种观念、意味。\n\n三、现实型文学和理想型文学的思想内容、情感意义是相对明确的，而象征型文学的审美意蕴则是朦胧、多义、含蓄的。\n\n四、现实型文学侧重从现实中取材，逼真地描绘客观事物，强调感性状貌和细节的真实；理想型侧重从神话、传说、历史故事、民间传奇中取材，并充分运用夸张、变形、虚构的方法，不求生活的真实，而遵循情感的逻辑；象征型文学则从现实中取材，或虚构事物形象，但这些都经过加工处理，成为概括性、虚拟性很强的假定性形象。\n\n五、在表现手段上，现实型文学注重写实，理想型文学偏于夸张虚构，象征型文学则以主观变形的方法使其具有超越自身的内涵，如形象本身（人物，场景，物件等等）的变形，形象之间关系（人与人，人与物等等）的变形。", "keywords": "客观现实一主观理想一审美意蕴；直接性一间接暗示；相对明确一朦胧多义含蓄；现实中取材 感性状貌和细节真实-神话传奇中取材 夸张变形一现实中取材 加工处理；注重写实一夸张虚构一主观变形", "note": "现实主义关注现实，作品注重现实描绘更加沉重深刻，有着浓浓的时代风气；理想主义来源于生活但更超脱，有较多的想象成分；象征主义取材于生活一景一物，描绘时加上自己感受，即所谓的借物抒情，它更灵活，既有现实又有思想高度。", "framework": ""}, {"id": "209", "stars": 5, "title": "象征型文学的特征", "body": "象征型文学是一种侧重以暗示的方式寄寓审美意蕴的文学形态，这种意蕴或侧重客观，或侧重主观，但都具有某种超出具体现象、个别事物的抽象性、概括性。它的基本特征是暗示性和朦胧性。\n\n一、暗示性\n\n暗示是象征型文学寄寓意蕴的方式。暗示指词语寄寓某种超出本义的内涵，它不同于现实型的再现和理想型的表现，现实型文学和理想型文学的再现与表现都具有直接性。再现是通过对生活现象的直接描绘反映现实；表现是以直抒胸臆表达某种情感态度。而象征型文学则以暗示的方法间接地传达某种观念、意味。通过暗示的方法，象征型文学更突出了文学形象的意义的超越性。\n\n二、朦胧性\n\n朦胧指词语含有多层不确定的意义。象征型文学的暗示不能用单一的确定的意义去概括，其审美意蕴是朦胧、多义、含蓄的。象征型文学从现实中取材，或虚构事物形象，但这些都经过加工处理，成为概括性、虚拟性很强的假定性形象。在表现手段上，不同于现实型文学的注重写实，理想型文学的偏于夸张虚构，象征型文学常常以主观变形的方法使其具有超越自身的内涵。如形象本身（人物，场景，物件等等）的变形，形象之间关系（人与人，人与物等等）的变形。这种变形使审美理解更具有了突出的非明确性。", "keywords": "以暗示寄寓审美意蕴 抽象性 概括性 暗示性 超越性 朦胧性 非明确性", "note": "以上文字为教材原话，如在考试中遇到，可以再举出一些例证，如卡夫卡的《变形记》、贝克特的《等待戈多》、朱熹的《泛舟》、余光中的《夸父》、海明威的《老人与海》、尤涅斯库的《秃头歌女》、舒婷的《致橡树》、莫言系列等均是象征型文学代表作品。", "framework": ""}, {"id": "210", "stars": 5, "title": "试比较现实主义、自然主义、浪漫主义、现代主义在文学的真实观上的差异", "body": "一、现实主义真实观\n\n注重真实性是现实主义的基本特征之一。现实主义强调关注现实、正视现实、忠于现实，提倡客观地观察生活、描写生活、反映生活，力求真实地再现典型环境中的典型人物，以此实现源于生活又高于生活的目的。可以说，现实主义的真实是一种本质的真实、底蕴的真实，它通过对生活选择、提炼、改造、补充、加工、假定等创造一个更高意义上的现实世界的复本。巴尔扎克用现实主义文学成为法国社会的“书记”，托尔斯泰也凭现实主义文学成为“俄国革命的镜子”，原因是他们真实地描绘了现实生活，写出了一个真实的时代，当然，也流露了自己的真情实感。总之，现实主义的真实观是侧重于对生活摹写的真实。\n\n二、自然主义真实观\n\n自然主义和现实主义是密切相关的。自然主义就是根据观察、按照科学的方法对生活的真实描写。真实是自然主义的最高品质，是自然主义的基本出发点与前提。在这一点上，自然主义与现实主义文学一脉相承。两者的不同在于自然主义要求有更大范围与程度更为彻底的真实，它追求无所不包的真实，绝对的真实，严酷的真实，不带任何粉饰的真实，更注重表面与细节的真实。具体说来，现实生活中任何范畴里的事物都应真实地加以描写，即使是卑污、肮脏，甚至使人感到尴尬、道德感有所难堪的事物，自然主义文学都应该加以描写。由于有了自然主义，文学才超出了沙龙、舞会、林荫道、乡间别墅的天地，而有了矿井、坑道、小酒店、贫民窟、洗衣坊、工场里的车间、农村里的集市、大城市中的菜市场......这些都不是作为背景被粗略地加以勾勒，而是作为作品的内容被加以细致详尽的描写。因此，自然主义是文学写实主义原则的又一次发展。\n\n三、浪漫主义真实观\n\n与现实主义的客观写实相比，浪漫主义的一个突出特征在于向往理想的文学精神。与现实主义的关注现实、正视现实、忠于现实不同，浪漫主义以一种超越现实的文学精神特别执著于对理想的向往和追求，用主观理想代替客观现实，竭尽全力表现人应有的生活图景，它的真实性更大地体现在情感的真诚上。正如席勒所说，浪漫主义“试图用美丽的理想去代替那不足的真实”。它不追求生活的真实、细节的真实，而是竭尽全力表现理想。为此，在诗人笔下，人可以死而复生，鬼可以丽而多情，白发长是“三千丈”，六月可以飘风雪......显然，浪漫主义文学所创造的艺术世界已不是生活原有的样式，它变幻无穷，丰富而多端，是一个心灵化的、情感化的空间，充斥着作者的主观感受、感情，张扬着作者的个性、灵性。所以，在真实观上，浪漫主义是迥异于现实主义的，它遵循情感逻辑，理想化原则，而不是像现实主义那样摹写生活，精雕细琢，对现实生活求“形似”。\n\n四、现代主义真实观\n\n现代主义文学反对摹仿、再现现实，反对按客观生活的本来面目反映生活，追求个体主观感情不受限制的充分表现。它不重视外在的客观现实，而强调非理性的现实、心理化的现实、梦幻的现实、超现实。表现主义文学倾向于对人的心理与精神的向内转、内心的外化。新小说派的纳塔丽·萨洛特认为，旧小说不能展示心理现实，对现代主义作家来说，小说的兴趣中心是要揭示新的“心理要素”。超现实主义力图把现实与梦幻结合成“超现实”，它的实际效应是使现实融入了梦幻之中，使现实梦幻化。现实梦幻曾是浪漫主义的一种表现手法，以实现在现实中无法实现的理想。超现实主义把梦幻视为对象本身，把虚幻的、无意识的心理因素引入文学，力图从中寻找“最高真实”。现代主义作家不重视现实的整体性，而强调它的碎裂，把微观世界绝对化，认为文学的任务就是描述人的心理要素，把文学归结为自我表现。\n\n总而言之，由于产生的历史背景、哲学基础及自身发展的原因，这四种文学类型或文学思潮在真实观上是有差异的，显出了各自的特征，但它们之间也有联系，比如现实主义与自然主义之间，浪漫主义与现代主义之间等。\n\n【李凡关键词：现实主义：客观 真实 生活摹写；自然主义：更为彻底 绝对真实；浪漫主义：主观理想 情感真诚；现代主义：非理性 梦幻 超现实】", "keywords": "", "note": "回答这个问题，需要对现实主义、浪漫主义、现代主义、自然主义都有一个基本的了解，可以结合中国古代、现当代文学史以及外国文学史，举出典型作家和作品作为例证。", "framework": ""}, {"id": "211", "stars": 2, "title": "简述现实主义文学在19世纪法国和20世纪中国的发展历程并简要勾勒它的基本艺术手法和美学特", "body": "一、19世纪法国的现实主义文学\n\n法国是欧洲现实主义文学的发源地。19世纪30~40年代的法国现实主义文学以描写封建贵族与新兴资产阶级的矛盾以及资产阶级内部矛盾为主，在表现出对现实强烈的批判性和揭露性的同时，也流露了对封建时代的依恋之情。司汤达和巴尔扎克是法国现实主义的奠基人。1830年，司汤达的长篇小说《红与黑》实践了现实主义创作原则，它的发表，标志着现实主义文学的形成。巴尔扎克的《人间喜剧》使现实主义从理论到创作都臻于完善，它代表了西欧现实主义的最高成就。\n\n从50年代起，法国现实主义强调科学精神，表现出客观冷峻的风格，早期现实主义的社会批判精神有所削弱。这种创作风格的倡导者和代表人物是福楼拜，他是法国19世纪后期现实主义的重要代表。小仲马和都德紧跟其后，继续推动着现实主义文学的发展。而19世纪中后期出现的巴黎公社文学，是一种新颖的现实主义文学，又称无产阶级文学。它真实地反映了无产阶级和广大劳动人民的斗争生活，表现了无产者为理想而奋斗的革命激情。其中最有代表性的有欧仁·鲍狄埃、路易丝·米雪尔等。鲍狄埃创作了不朽的无产阶级战歌《国际歌》。路易丝米雪尔是公社的著名诗人和社会活动家，有“红色圣女”之称，她写过许多充满革命激情的诗歌，著名的有《红石竹花》。巴黎公社文学为20世纪世界无产阶级文学的发展奠定了基础。\n\n二、20世纪中国的现实主义文学\n\n20世纪的中国是一个经历着社会和思想巨大变化的国家，封建社会的灭亡和西方文明的入侵带给人们一系列的冲击，社会形态的剧烈变化给文学发展带来了巨大的契机。以鲁迅为代表的五四文学高举现实主义大旗，出现了一大批杰出的作家和作品。五四以后的十多年间，乡土派小说、社会分析小说、京派小说、七月派小说等文学流派的产生推动了中国现实主义文学的发展。以茅盾、叶绍钧、王统照、冰心等为代表的一大批作家用朴素的写实手法探索着生活的意义和出路。解放后，出现了一大批反映农村阶级斗争和生产实践的优秀作品。柳青的《创业史》，周立波的《暴风骤雨》等均是佳作。这时期出现的“红色经典”小说更是生动地再现了革命岁月。“文化大革命”后，“伤痕小说”“反思小说”的出现继续着现实主义对人的关注的精神。80年代改革开放以来作家们把目光投向了由此而出现的诸多新问题。与此同时，对下岗工人、农民工的关注成为二十世纪末现实主义文学的聚集点。\n\n三、现实主义文学的基本手法和艺术特征\n\n（一）关注现实的文学精神\n\n这种文学精神具体表现为按照作家自己观察到、感受到、把握到的生活的本来面目进行创作。关注现实、正视现实、忠于现实，按照生活的本来面目进行描写，是现实主义的基本特征。\n\n（二）富于真实感、真实性\n\n这是与现实主义文学按照生活的本来面目再现和表现生活相适应的。现实主义文学的真实是一种比生活表面更高的真实，是表现和揭示了隐藏在生活表面现象之内的底蕴的真实。\n\n（三）注重写实白描的艺术手法\n\n是现实主义文学类型的又一个特征。这样，才能显得真实，才能忠于生活的本来面目。\n\n【李凡关键词：批判性 揭露性 依恋之情 司汤达 巴尔扎克 科学精神 客观冷峻 福楼拜 巴黎公社文学 无产阶级文学 鲁迅五四文学 文学流派 反映农村 红色经典 伤痕小说 反思小说 关注工人 关注现实 真实感真实性 注重写实白描】", "keywords": "", "note": "②从本题开始的下面几道题目，都是介绍外国文学流派的，如果你本身考外国文学，那么这部分你需要结合外国文学1000题来进行一下深化，如果你不考外国文学，那么此部分你只需要简单了解一下即可。②在此基础上进行分析，多联系作家和作品，以流派来划分，会使整体的脉络梳理得更加清晰。", "framework": ""}, {"id": "212", "stars": 2, "title": "以雨果的《巴黎圣母院》和巴尔扎克的《人间喜剧》为例，分析浪漫主义与现实主义在创作方面的区别", "body": "一、创作精神不同：关注现实与向往理想\n\n浪漫主义的突出特征在于向往理想的文学精神，现实主义则崇尚关注现实的文学精神。\n\n浪漫主义以一种超越现实的文学精神特别执着于对理想的向往和追求，用主观理想代替客观现实，竭尽全力表现人应有的生活图景。浪漫主义在表现现实上，强调主观与主体性，侧重表现理想世界，把情感和想象提到创作的首位，常用热情奔放的语言、超越现实的想象和夸张的手法塑造理想中的形象。\n\n雨果的作品气势恢宏，具有强烈的理想主义色彩，表现了对中下层人民群众的深厚同情，是法国也是欧洲浪漫主义文学的杰作。《巴黎圣母院》中的加西莫多虽然面貌丑陋，但是他心地善良，品格高尚。在他的身上寄托了作家对理想人物的向往和对理想生活的追求。\n\n与浪漫主义作家不同，现实主义作家偏重于精确描绘客观现实生活的图画，而不是直接抒发自己的主观理想和情感。他们主张作家要像镜子那样如实地反映现实，他们的社会理想和道德激情往往是通过对生活的具体的、历史的真实描绘而自然地流露出来的。\n\n二、人物塑造不同：典型化和理想化\n\n现实主义注重在深入细致地观察、体验现实生活的基础上，对客观事物加以典型化，强调从人物和环境的联系中塑造典型性格。而浪漫主义注意人物理想化而忽视客观环境影响，具有很强的主观性，强调人是社会环境的产物。巴尔扎克的《人间喜剧》不但真实地描绘了法国社会各阶层的生活和风貌，而且通过塑造资本主义社会形形色色的典型形象，“给我们提供了一部法国‘社会”特别是巴黎‘上流社会’的卓越的现实主义历史”。\n\n三、题材选择不同：歌颂大自然与抨击黑暗社会\n\n在题材上，浪漫主义的明显特征是对大自然的极力歌颂。浪漫主义崇尚大自然的壮丽景色，把大自然作为主要的表现对象。\n\n现实主义扩大了文艺题材的范围，使它成为综合反映整个时代各阶层的生活风尚和错综复杂的历史事件的广阔社会历史画面。特别注重描绘社会的黑暗现象，具有强烈的批判性或揭露性。他们反对浪漫主义逃避现实、偏爱用历史题材或异域情调来寄托主观理想的做法，主张文学抛弃专写伟大人物和伟大事迹、追求曲折离奇的情节的俗套，有意识地描写社会下层人物和日常生活习俗。巴尔扎克在自叙《人间喜剧》的创作意图时，就明确地宣布：“法国社会将是一个历史家，我只能当它的书记。”他立志“完成一部19世纪法国的作品”，“写出许多历史家所遗忘了的历史，即人情风俗的历史”。\n\n四、艺术手法不同：具体、心理、讽刺与幻想、夸张\n\n在艺术手法上，在人物刻画方面，现实主义作家不但善于通过环境和生活细节的具体描写来烘托、突出人物的性格特征，而且注重人物的心理描写，力求深入细致地揭示出人物内心的矛盾变化。这种追根究底地探索人的复杂内心世界的心理描写，构成了现实主义在艺术上的特征之一。现实主义的另一艺术特色，是充分运用讽刺手法，以加强批判揭露的力量。\n\n而浪漫主义则更多地运用大胆的幻想、异常的夸张等艺术手法，以超现实的情节、浓郁的色彩、华丽的语言，把历史传说、神话故事、自然奇观、异域风情等有机结合起来，编织出不同寻常的理想世界。", "keywords": "创作精神：向往理想-关注现实；人物塑造：典型化一理想化；题材选择：歌颂大自然-抨击黑暗社会；艺术手法：具体描写 心理描写 讽刺-幻想 夸张", "note": "浪漫主义和现实主义都是反映社会现实问题，其区别主要在于反映的方式不同。现实主义按照本来如此的面目再现生活，浪漫主义按照应当如此的愿望表现生活。两者都是各自时期文学特点的代表与总结。", "framework": ""}, {"id": "213", "stars": 3, "title": "现代主义文学的类型特征是什么", "body": "现代主义严格说来并不是一种文学类型，也不是一种统一的文学流派，它指的是西方从近代文学向现代文学转变与发展中涌现的诸多文学观点、文学流派综合而成的颇为庞杂的具有世界影响的文学思潮；是西方现代文学的一个组成部分，包括象征主义文学、意识流小说、超现实主义、表现主义、存在主义、荒诞派、新小说、黑色幽默等。现代主义有着鲜明的特征：\n\n一、对传统采取否定的态度，在文学观念与文学创作上都注重标新立异.\n\n二、在处理文学与现实的关系上，它认为一切真实都只能是主观的真实、心理的真实。强调主观性和自我表现。\n\n三、在塑造人物形象上，现代主义文学不注重塑造个性鲜明、性格典型的人物形象，而着重表现人的全面异化，因此，现代主义文学作品中的人物大多是非英雄、反英雄，是被社会扭曲了的卑微、孤独、无所作为的弱者。\n\n四、现代主义文学不同程度地继承和发展了浪漫主义和象征主义文学的某些因素，是理想型和象征型文学的多向演变形态。其主要特征是：\n\n（一）主观性\n\n现代主义文学反对模仿、再现客观现实，追求个人主观情感不受任何限制的充分表现，强调非理性的、心理化的、梦幻的现实。\n\n（二）虚幻性和假定性\n\n它大量运用变形、荒诞、象征等表现出了虚幻性和假定性。作品中充满非常态的变形形象、极度的夸张、朦胧的象征和荒诞的情节等。\n\n所以，在现代主义文学作品中，我们不难看到古怪的形式，颠倒错乱的时空，离奇的情节，复杂的结构和艰涩的语言。作为西方现代社会的产物，现代主义文学作品所表现的思想内容对人们认识西方现代社会及其弊端有一定的意义，但是它一味地表现人的变形、人的异化、人的被扭曲的心理，乃至表现人的隐秘，甚至表现那些下意识的东西，则需要辨析；就艺术表现手法来说，现代主义文学所用的心理独白、自由联想、时空颠倒、多层结、多角度叙述等丰富了文学的艺术表现手法，可以作为我们发展当代文学的借鉴；但是，现代主义文学的所谓自动写作、梦境记录、无标点等等，则违背了文学创作的艺术规律，有损文学创作的艺术形式。", "keywords": "文学思潮 标新立异 自我表现 全面异化 主观性 虚幻性 假定性", "note": "现代主义文学又称现代派或先锋主义，是本世纪初以来，西方资本主义发展到垄断时代，陆续出现的各种文学流派的总称。它包括象征主义、未来主义、超现实主义、意识流小说，存在主义文学、荒诞派戏剧、新小说派，黑色幽默等等流派。它是深受尼采、弗洛伊德、柏格森、萨特等人哲学思想或心理学理论的影响的产物。", "framework": ""}, {"id": "214", "stars": 2, "title": "联系文学思潮，论述文学类型在现代的多向演变", "body": "人类文学活动发展到20世纪，文学作品的类型形成了新的结构形态，产生了多向的演变。\n\n一、批判现实主义文学继续发展，深化了现实型文学。\n\n20世纪批判现实主义文学一方面保持了现实主义原则的基本核心，同时又吸收了现代主义不同流派的某些手法，大大地丰富了自己。对社会生活事件大幅度地审美概括，不断地深入事件的动因的各个层次，关心人的命运，为其艰难的处境而焦虑不安，以及探究人的内心最隐蔽的欲望的源泉，成为批判现实主义的普遍特征。主要代表作家有高尔斯华绥，托马斯·曼，罗曼·罗兰等。\n\n二、出现了“社会主义现实主义”和“革命的现实主义”与“革命的浪漫主义”两结合型的文学，使现实型与理想型文学在社会主义条件下得以综合发展。\n\n随着社会主义的产生与发展，社会主义现实主义文学在20世纪成为重要的文学思潮。它把革命的政治倾向性与艺术描写的真实性高度统一起来，从革命现实出发，展现胜利的明天，鼓舞人们为实现伟大的理想而奋斗，这是社会主义现实主义文学与其他现实主义文学的重要区别之一。其主要代表作品有高尔基的《母亲》，法捷耶夫的《毁灭》，奥斯特洛夫斯基的《钢铁是怎样炼成的》等。\n\n而在中国革命和建设时期出现的“两结合”型文学则既注重现实，又注重理想，二者相辅相成。它以革命的现实主义为础，以革命的浪漫主义为主导，从题材的摄取，形象的塑造，情节的安排，细节的描写，直至创作的全过程，都把现实与想有机地统一起来，用革命理想激励人们前进。毛泽东的诗词以及《红旗谱》《红岩》《红日》《青春之歌》《创业史》都是这类文学的代表作。\n\n三、在浪漫主义和现实主义文学基础上兴起的现代主义文学思潮，使理想型与象征型文学发生了衍化。\n\n在19世纪象征主义文学的基础上，相继出现了后期象征主义，表现主义，超现实主义，存在主义，荒诞派，新小说派文学流派，汇成了一股现代主义文学思潮。现代主义文学反对模仿、再现现实，反对按客观生活的本来面目反映社会生活，求个体主观情感不受限制的充分表现。它强调非理性的现实、心理化的现实、梦幻的现实、超现实。认为文学的任务就是述人的心理要素，把文学归结为自我表现。主要代表作品有卡夫卡的《变形记》《审判》等。现代主义文学不同程度地继和发展了浪漫主义和象征主义文学的表现性，虚幻性和假定性特征，使理想型和象征型文学发生了多向的流变。", "keywords": "批判现实主义文学 现实型文学 社会主义现实主义 革命的现实主义 革命的浪漫主义 现实型与理想型文学综合发展 现代主义文学思潮 表现性 虚幻性 假定性", "note": "对某一概念内涵的理解不应用静态的目光看待，而应把它作为一种大视域，一种永远向前推进的地平线，对其来龙去脉做认真的梳理，找到它的源头，考察它的传播过程，寻绎它在文学理论发展史上的轨迹，然后再分析这一概念在文学史流变的各种理论基础。", "framework": ""}, {"id": "215", "stars": 3, "title": "列出你所知道的几种文学文本层次理论，指出你认为相对合理的方式，并作具体阐述和论证", "body": "文本指由作者写成而有待于阅读的单个文学作品本身，文学文本的构成通常被看成是一个由表及里的多层次审美结构。\n\n一、“言，象，意”\n\n中国古代的《周易·系辞》在探讨人类思想的表达问题时，曾提出“书不尽言，言不尽意”和“圣人立象以尽意”的观点。这里提出的“言、象、意”问题，虽然是就非文本而言，其实也可以理解为广义（包括文学与非文学）文本构成的三个要素。后来，三国时期的经学家王弼在对《周易》进行诠释时，则更为详明地理清了三者之间的关系。在王弼看来，“言、象、意”是一个由表及里的审美层次结构。人们首先接触的是“言”，其次窥见的是“象”，最后才能意会到由这个“象”所表示的“意”。三个因素都是重要的，缺一不可。虽说王弱所讲的还不是现代意义上的文学作品，但对理解文学作品的审美层次的构成也具有启示意义。\n\n二、“意蕴说”\n\n在西方，黑格尔提出了“意蕴说”。他认为一件艺术作品，我们首先见到的是它直接呈现给我们的东西，然后再追究它的意蕴和内容。黑格尔把“直接呈现给我们的东西”称为“外在形状”，它的作用是“能指引到一种意蕴”，而“意蕴”是一种内在的东西，“一种内在的生气、情感、灵魂、风骨和精神”。黑格尔虽然已经朦胧地意识到“形状”与“意蕴”的关系，可惜他对“象”并没有王弼那样有清晰的认识。不过他将歌德提出的“意蕴”说用于文本层次的探讨，也是一个重要的贡献。\n\n三、英伽登的四层论\n\n进入现代，波兰现象学派理论家英伽登把文学作品的文本由表及里地分成四个层面：第一个层面是字音及其高一级语音组合，这属于文学文本的最基本层面；第二个层面，即意义单元，是由字音及其高一级语音组合所传达的意义组织，是文学文本的核心层面；第三个层面是多重图式化面貌，是由意义单元所呈现的事物的大略图影，包含着若干“未定点”而有待于读者去具体化。第四个层面是再现客体，即通过虚拟而生成的“世界”。英伽登的这种理论，把内容与形式融为一体，每个层面层层深入、互相沟通、互为条件，几乎是对王弼“言、象、意”理论的补充与完善。但是他把“声音”单列一个层面，似无必要，一般在文学中字音和意义是无法剥离的。\n\n四、文学言语层、文学形象层、文学意蕴层\n\n综合古今中外对文本层次的探讨，我们从总体上可以将文本分为三个大的层次：文学言语层面，文学形象层面和文学意蕴层面。\n\n文学言语层指文学文本首先呈现于读者面前，供其阅读的具体言语系统。这个系统中的言语和一般言语有明显的不同，它具有内指性，心理蕴含性和阻拒性。\n\n文学形象层是读者在阅读文学言语系统过程中，经过想象和联想而在头脑中唤起的具体可感的动人的生活图景，它是主观与客观的统一，是假定与真实的统一，是个别与一般的统一，又是确定性与不确定性的统一。\n\n文学意蕴层是指文本所蕴含的思想，感情等各种内容，属于文本结构的纵深层次，由于形象具有指向性和包孕性，就使意蕴层面呈现出多层次的丰富意蕴，一般又分为三个不同层面：历史内容层，哲学意味层和审美意蕴层。", "keywords": "“言，象，意”“意蕴说”英伽登四层论 文学言语层面 文学形象层面 文学意蕴层面", "note": "需要就中西方的文学理论展开阐述，主要可以提到王弼和英伽登，两人对于文本层次的理论是能够受到比较普遍的认可的。", "framework": ""}, {"id": "216", "stars": 3, "title": "试举例阐述文学语言的基本特征（26北京大学、南昌大学）", "body": "一、文学言语是内指性的\n\n文学言语是内指性的，普通言语是外指性的。普通言语指向语言符号以外的现实世界，它必须符合现实生活逻辑，经得起客观生活的检验，并且必须遵守各种形式逻辑的原则。文学言语则是指向文本中的艺术世界，它不必符合现实生活的逻辑而要求与整个艺术世界氛围相统一。例如杜甫的诗句“感时花溅泪，恨别鸟惊心”和“月是故乡明”，明显地违反客观现实，但它指向诗中特定的情境，因此只要符合艺术世界的诗意的逻辑就行了，不必经过现实生活的检验。\n\n二、文学言语具有心理蕴含性\n\n语言符号一般有两种功能，即指称功能与表现功能。普通言语侧重于它的指称功能，而文学言语则把它的表现功能提到更加重要的位置。文学言语中蕴含了作家丰富的知觉、情感、想象等心理体验，因而比普通言语更富于心理蕴含性。文学言语中的词语，虽然表面上与普通言语一样，但实际上已被赋予不同寻常的心理内涵。雪莱在《西风颂》中写道：“如果冬天来了，春天还会远吗？”这里的“冬天”，“春天”都已被诗人那种希望、神往、憧憬的情绪浸泡过，与普通言语中的意义大不相同，更富于心理蕴含性了。\n\n三、文学言语具有阻拒性\n\n文学言语具有阻拒性，这是俄国形式主义者提出来的，对语言进行陌生化处理后达到的效果，它针对的是“自动化”语言，即那些过分熟悉的不再能引起人注意的言语。比如用“弹指间”表示时间过得快，一开始显得很生动形象，但在被大量重复使用后，人们只把它当作一个干巴巴的符号，而不再有新鲜感。文学言语就是要力避这种言语的“自动化”现象，设法把普通言语加工成陌生的，扭曲的，对人具有阻拒性的言语，这种言语可能不合语法，打破了人们理解的常规，甚至不易被人理解，但却能引起人们的注意和兴趣，在延长感知时间，增加感知难度的情况下，反而增强了它的审美效果，形成了文学言语的一大特色。如“表盘上的数字涂上了一种在黑夜闪光的绿色物质”显然是荧光粉。但阻拒性言语不能使用得过滥、过多，要恰到好处。", "keywords": "内指性 艺术世界的诗意 心理蕴含性 表现功能 阻拒性", "note": "文学言语层，这里指的是文学文本首先呈现于读者面前，供其阅读的具体言语系统。文学言语除了人们经常提到的形象性、生动性、凝练性、音乐性等特点外，还具有内指性、心理蕴含性、阻拒性。", "framework": ""}, {"id": "217", "stars": 5, "title": "试论述文学形象的特征（26青岛大学）", "body": "一、文学形象是主观与客观的统一\n\n中国古典文论对形象的这一特征早有所把握。清代文论家章学诚就明确地把形象分为两种，一种是“天地自然之象”，即物象，是自然存在的，不是人类构造出来的，是客观的；一种是“人心营构之象”，即作品中的形象，这是人创造出来的，或者说是主观创造的产物。这种形象虽是人们有意为之，不是天生自然之物，但最终还是客观物象曲折的反映。所以章学诚在《文史通义·易教下》中认为“人心营构之象亦出于天地自然之象也”。这就是说，形象既是主观的产物，又有客观的根据，是主观与客观的统一。这一见解是十分辩证的。\n\n二、文学形象是假定与真实的统一\n\n文学形象，一方面是假定的，不是生活本身，有的甚至与生活本身的逻辑也不一致，另一方面，它又来自生活，能使人联想起生活，使人感到比生活还真。因此在文学作品中，但丁可以目睹地狱之苦，孙悟空可以大闹三界，草木虫鱼可以说话，这就是文学形象假定性与真实性相统一的特征。\n\n这中间虚拟性和假定性是文学形象的前提性条件，那么，怎样使它与真实性统一起来呢？这就要假定得合情合理。所谓“合理”，是指文学形象真实性的客观规定性，也就是指生活的本质和规律，不管读者面对着多么荒诞虚妄的文学形象，他都可以用自己生活中体验到的“理”加以衡量，如读者觉得合理，就是真实，否则就是不真实。当然，“合理”有时也意味着合乎理想，凡是合乎读者理想的形象，读者也会认可。所谓“合情”，是指文学形象必须反映人们的真实感受和真挚感情。而合理与合情相比，“合情”的因素往往比“合理”更有能动性：一是可以把看来不真实的细节升华为艺术真实，如李白写道：“高堂明镜悲白发，朝如青丝暮成雪”；二是当客观真理与主观情感发生矛盾时，艺术的原则是牵理就情，总之，文学形象是在“合情合理”的尺度上实现假定性与真实性的统一。\n\n三、文学形象是一般和个别的统一\n\n文学形象总是具有“以少总多”，“万取一收”的艺术效果，又称文学形象的概括性。马致远《天净沙》展示给我们的是一个落魄天涯的失意文人的形象，但它却概括了整个时代千千万万个知识分子前途茫茫、归宿不定的痛苦，充分显示了文学的概括性。\n\n四、文学形象是确定与不确定的统一\n\n由于文学是一种语言艺术，它的形象不是直观的而是想象的，它形成可感的艺术形象主要靠读者的想象来完成。因此，作品首先要为这种想象提供一种限制性要素，使想象在一定范围，按一定的性质和方向去发展，这就形成了文学形象确定性的一面；同时，在上述前提条件的制导下，文学作品还必须为读者的想象提供一种可发挥性要素，这就形成了文学形象不确定性的一面。如《红楼梦》中的林黛玉，作者通过对她的描写，告诉了我们许多仅属于她的特征：她的身份，她的美丽都是确定的；但她具体怎样美丽，具有怎样的相貌，怎样的气质神韵，作者的描写又是不确定的，只给读者留下想象的空间，留待自己去补充。\n\n【李凡关键词：主观与客观的统一 假定与真实的统一 虚拟性和假定性 合情合理 一般和个别的统一 概括性 确定与不确定的统一】", "keywords": "", "note": "文学形象是指文本中呈现的具体的、感性的、具有艺术概括性的、体现着作家的审美理想的、有着审美价值的自然的和人生的图画。它是在作家审美经验的基础上按照合情合理的原则产生的具有一定概括性的形象，记住四个统一。", "framework": ""}, {"id": "218", "stars": 3, "title": "谈谈你对文学形象“合情合理”的理解", "body": "文学形象是假定与真实的统一。其中的虚拟性与假定性是有一定限度的，文学形象的假定性必须与真实性结合起来。就是说，文学形象要“合情合理”。\n\n一、合理\n\n（一）合乎客观规定性\n\n所谓“合理”，是指文学形象真实性的客观规定性，也就是指生活的本质和规律，或指人类社会的现实关系，文学形象所使用的一切虚拟性，假定性手段都要为表现或揭示这种“现实关系”及其本质规律服务。因此，不管读者面对多么荒诞虚妄的文学形象，他都可以用自己在生活中领悟到的“理”加以衡量，如果合理，就是真实，否则就是不真实。\n\n（二）合乎理想\n\n所谓“合理”，还意味着合乎理想。任何积极健康的理想都不同程度地反映了社会生活本质的发展规律，表达了人民群众真诚而美好的愿望。所以，一旦文学形象虚拟性和假定性用来表达某种积极美好的理想时，文学形象也获得了艺术的真实性，具有了艺术生命。\n\n二、合情\n\n所谓“合情”，是指文学形象必须反映人们的真切感受、真挚感情和真诚意向。与合理相比，“合情”的因素往往更具魅力：一是可以把看起来不真实的细节升华为艺术真实，如李白写道：“高堂明镜悲白发，朝如青丝暮成雪”；二是当客观真理与主观情感发生矛盾时，艺术的原则是牵理就情。总之，文学形象是在“合情合理”的尺度上实现假定性与真实性的统一.【李凡说：文学形象一方面是假定的，它不是生活本身，有的甚至与生活本身的逻辑也不一致；另一方面，它又来自生活，使人感到比现实生活更加真实。从这个意义上来说，文学形象是假定与真实的统一。】", "keywords": "假定与真实的统一 生活的本质和规律 合乎理想 真切感受 更具魅力 升华为艺术真实 牵理就情", "note": "", "framework": ""}, {"id": "219", "stars": 4, "title": "文学意蕴层的特点", "body": "文学意蕴层是指文本所蕴含的思想、感情等各种内容，属于文本结构的纵深层次。由于形象具有指向性和包孕性，就使意蕴层呈现出多层次的丰富意蕴，一般又可以分出三个不同的层面：\n\n一、历史内容层\n\n有的形象本身就包含了一定的历史内容。如《水浒传》，它描写了北宋时期一次声势浩大的农民起义，展示了农民阶级与封建统治阶级之间波澜起伏的斗争画卷，其历史内容就直接包含在作家创造的形象和形象体系之中。这样的小说的文学意蕴中包含着丰富的历史内容自不待言。有的文学作品的形象，虽然本身不含历史内容，却暗示了一定的历史内容。如李商隐的《乐游原》：“向晚意不适，驱车登古原。夕阳无限好，只是近黄昏。”此诗所描写的形象是乐游原上黄昏时节的夕阳景色，但它却暗示出值得留恋的大唐帝国已日薄西山的历史内容。\n\n二、哲学意味层\n\n文学的哲学意味早已被亚里士多德发现。他在《诗学》中说：“写诗这种活动比写历史更富于哲学意味。”不少诗人，以表现哲学意味为最高艺术追求。\n\n什么是“哲学意味”呢？大家知道，哲学是人对宇宙人生的普遍规律的最高一级的思考与概括，它属于形而上的层次，是抽象的；“意味”则是一种不可言传、只可意会的感知因素，它属于形而下的层次，是具象的。二者通过形象引发的联想在深层意蕴中的有机结合，便是人们所说的哲学意味。\n\n陶渊明的《饮酒》诗中虽然也有历史的内容，然而诗人着重渲染的是这种闲适避世生活的情趣，其中“欲辨已忘言”的“真意”，更富哲学意味。这种哲学意味可以说是一种难以形诸笔墨的“象外之象”“味外之味”和“言外之意”。\n\n三、审美意蕴层\n\n并非只有历史内容、哲学意味俱全的作品才算上乘之作。有些文学作品的意蕴比较单纯，甚至仅有审美意蕴这个层次，也可能成为脍炙人口的佳作。请看苏轼的《海棠》：东风袅袅泛崇光，香雾空濛月转廊。只恐夜深花睡去，故烧高烛照红妆。\n\n此诗的意蕴单一而醇美，仅表现由海棠花的香艳所引起的诗人的兴奋和他那孩童般天真的爱美之情。这在现代诗文中也不乏例证。可见，“意蕴”之中，还应包括审美意蕴这个层面。\n\n一般来说，文本首先呈现的是审美意蕴层，其次才是历史意蕴层或哲学意味层，从而使文本的意蕴显得层层深入，美不胜收。\n\n总之，文学作品的文本就是这样，从外到内，层层溢美流芳，共同形成了它的“召唤结构”和特有的艺术魅力。", "keywords": "历史内容层 哲学意味层 审美意蕴层", "note": "文学意蕴层很好理解，如考试遇到可多加几个例子。需要注意的是，在考查中可能会让大家结合某部作品进行分析，对此大家要有所准备。", "framework": ""}, {"id": "220", "stars": 5, "title": "结合作品，论述文学典型及其美学特征", "body": "作为文学形象的高级形态之一，典型是文学言语系统中显出特征的富于魅力的性格。它在叙事性作品中，又称典型人物或典型性格。就内涵而言，“特征”具有两种属性：其一，它的外在形象极其具体、生动、独特；其二，它通过外在形象所表现的内在本质又是极其深刻和丰富的。\n\n典型通常有如下美学特征：\n\n一、文学典型的“特征性”\n\n（一）具有能贯穿其全部活动和统摄其整个生命的总特征。凡是世人公认的典型，无不具备这个总特征。如阿Q的“精神胜利法”，林黛玉的“多愁善感”便是别人所不具备的特征。\n\n（二）文学典型必须通过局部特征，反映和形成总特征。也就是要调动言语的特征性、细节的特征性、场景的特征性、事件的特征性等，为反映和形成总特征服务。陆游的《示儿》临终的一句遗言，契诃夫笔下“打喷嚏”的一个细节，杜甫的《兵车行》的一个场景，都由于特征化而成为了传世之作。\n\n二、文学典型的艺术魅力\n\n文学典型的艺术魅力，同样来自两个方面：\n\n（一）文学典型的艺术魅力，应当是来自性格的一种生命的魅力。这种“生命的魅力”，首先在于典型人物的生命所呈现的斑斓色彩，即性格侧面的丰富多彩。如林黛玉的性格里既有贵族少女的孤傲乖张，又有着世俗女子的软弱和小性儿。这样的性格使她的叛逆和反抗多存在于心灵的领域，并很难冲破封建礼教的规范，因而只能是无济于事的仅以眼泪和生命相拼的反抗。然而，正是这种性格中世俗性与非世俗性的矛盾拓展了生命的张力，使人物形象显得更有血有肉，丰富多彩。文学典型呈现的精神世界就是如此丰富，往往令读者叹为观止。\n\n（二）典型性格的艺术魅力更来自它所显示的灵魂的深度。“灵魂的深度”，是作家艺术家的慧眼所在，是他们超越群\n\n侪的标志，更是文学典型的必备品格。它大致可以从三个方面去理解：首先，要看文学典型在何种程度上表达了人类解放自身的要求和改变现存秩序的愿望。其次是要看所显现的历史真实的程度。最后是要看性格和灵魂是否合乎理想。例如，林黛玉所具有的对爱情自由的憧憬，对个性解放的追求，正与人类解放自身的要求相统一，但她的爱情追求明显地包含着反叛性内容，具有与封建社会格格不入的民主化色彩。\n\n此外，在人物的身上还折射出作家人格的真诚。阿Q的形象之所以感人至深，是因为他的背后站着一个爱恨交织的鲁迅。由于作家的至诚至真与人物的形象交织在一起汇为一种摄魂夺魄的真实性与深刻性，从而使得人物形象辐射出无穷的艺术魅力。", "keywords": "特征性 性格特征 总特征 局部特征 富于艺术魅力 生命的魅力 灵魂的深度", "note": "①文学典型是写实性文学形象的高级形态，是人类创造的艺术至境的基本形态之一，也是中西文论共同发现和阐释的符合审美理想的范型模式之一，不过西方文论对它研究得更充分，理论更成熟。②文学典型及其美学特征包含特征性和艺术魅力两部分，每部分均可单独命题。", "framework": "贯穿其全部活动和统摄其整个生命的总特征 文学典型的“特征性” 通过局部特征，反映和形成总特征 文学典型及其美学特征 是来自性格的一种生命的魅力 艺术魅力 来自它所显示的灵魂的深度"}, {"id": "221", "stars": 5, "title": "请叙述典型人物与典型环境，以及二者关系", "body": "一、典型人物（文学典型）\n\n作为文学形象的高级形态之一，典型是文学言语系统中显出特征的富于魅力的性格。它在叙事性作品中，又称典型人物或典型性格。（李凡说：此处详细展开参见上题）\n\n二、典型环境\n\n关注人物与环境的关系，并非自马克思、恩格斯开始，18世纪法国启蒙思想家狄德罗也注意到了这一问题，自然主义者左拉也论述过“环境”，黑格尔所说的环境，是由绝对理念转化而成的一般世界情况和具体自然环境。他们都是历史唯心主义者，不能正确地阐明人物与环境的真正关系。\n\n马克思、恩格斯第一次以历史唯物主义的观点科学地提出了“真实地再现典型环境中的典型人物”的命题。\n\n所谓典型环境，不过是充分地体现了现实关系真实风貌的人物的生活环境。它包括以具体独特的个别性反映出特定历史时期社会现实关系总情势的大环境，又包括由这种历史环境形成的个人生活的具体环境。\n\n（一）所谓“社会现实关系的总情势”，包括两方面的内容，一是现实关系的真实情况，二是时代的脉搏和动向。这种“总情势”往往不是直接的、公开呈现的，而是一种隐匿的、潜伏的客观存在，只有到了社会矛盾激化的阶段才会明朗。因此，作家能否抓住它而且如实地表现出来，才最见其功力。它直接牵涉一位作家的思想水平和洞察生活的能力。《城市姑娘》成书后不久，伦敦街头就爆发了大规模的工人运动。这说明哈克奈斯的环境描写不够真实。在哈克奈斯深入伦敦街头和写小说期间，那里一定潜伏着某些革命的潜流，由于哈克奈斯仅能以人道主义的同情和空想社会主义的眼光观察生活，自然捕捉不到现实关系的真实情况和时代的脉搏，因此她笔下的环境描写也就失去了典型性。\n\n值得说明的是，我们要求典型环境要充分体现现实关系，并不等于说典型环境只能有一种模式、一种风貌。由于上述“现实关系总情势”的隐匿性而它所联系的现象又无比丰富，所以作家完全有可能选择富有特征性的细节场面和场景，加工成独特的典型环境。\n\n（二）其次，每个时代的现实关系，都是通过个别的、具体的社会环境体现出来的。比如辛亥革命时期的现实关系，可以在广州反映出来，也可以在北京反映出来；可以通过市民生活环境反映出来，也可以如鲁迅那样通过中国南方农村的一个村庄反映出来。\n\n具体环境的个别性和特殊风貌，也会加强典型环境的个性特色。因此，所谓典型环境，也是特定的“这一个”是富有特征的个别性和概括性的有机统一，任何公式化、概念化的描写都不算是典型环境。\n\n三、典型人物与典型环境的关系\n\n（一）典型性格是在典型环境中形成的\n\n所谓环境，就是那种形成人物性格、并促成他们行动的客观条件，人物性格往往是环绕着他的典型环境的产物，典型环境不仅是形成人物性格的基础，而且还逼迫着人物的行动，制约着人物性格的发展变化。人总是在一定的环境中生活，在一定的关系条件下形成其思想、情感、行为和作风的，所谓“近朱者赤，近墨者黑”就是环境影响人的一般表述。因此，孤立于典型环境的典型人物是不存在的。\n\n（一）典型人物对典型环境具有反作用\n\n典型人物也并非永远在环境面前无能为力，在一定条件下，他又可以对环境发生反作用。这种现象在无产阶级英雄典型那里表现得尤其充分通过人物的努力可以把法庭变成讲台（如高尔基《母亲》），把监狱变成战场（如《红岩》），可以改变穷山恶水，可以带来周围人物思想和精神面貌的巨大变化，甚至推动历史的前进。\n\n（三）典型环境与典型人物相互依存\n\n典型环境与典型人物又是互相依存的关系，失去一方，另一方也就不复存在。典型人物的刻画是离不开典型环境的，典型环境是典型人物赖以生存发展的现实基础。没有典型环境，典型人物的言谈、行动甚至心理都失去了依据，便成了无源之水，无本之木。反过来，典型环境是以典型人物为中心的社会关系系统，如果失去了典型人物，这个系统便失去了中心，失去了联系的纽带，环境便成了一盘散沙，也失去了存在的意义和形成的可能。典型人物与典型环境是相互影响、相互作用、相辅相成、相得益彰的。\n\n总之，典型是显示出特征的、富有艺术魅力的人物性格。作为文学形象的高级形态，它一般包含着更为丰厚的历史内容，成为人类通过文学认识生活的方式之一，所以，它常常是叙事文学的至高的美学追求，是人物塑造达到艺术至境的标志。", "keywords": "典型人物 典型环境 关系", "note": "在回答类似的题目时，我们要根据题目设问的内容，依次分点作答，注意不要遗漏。典型人物的美学特征有总体和局部之分，而其魅力有生命和灵魂之分。至于典型人物与典型环境的关系，则是互相依存，大家全面作答即可。", "framework": ""}, {"id": "222", "stars": 5, "title": "结合具体作品，谈谈怎么理解文学意境的特征", "body": "意境是指抒情型作品中呈现的那种情景交融、虚实相生的形象系统及其所诱发和开拓的审美想象空间，它同文学典型一样，也是文学形象的高级形态之一。其特征有：\n\n一、情景交融\n\n情景交融是意境创造的表现特征，意境创造就是把二者结合起来的艺术。由于它直接关系着意境的生成，所以古人在这方面研究得十分深透。这里主要有三种情景交融的类型：\n\n（一）景中藏情式。在这一类意境创造中，作家藏情于景，一切都通过逼真的画面来表达。虽不言情，但情藏其中，往往更显得情深意浓。如李白《送孟浩然之广陵》表面句句写景，而实际处处抒情，真可谓“一切景语皆情语”。\n\n（二）情中见景式。这种意境的创造方式，往往是直抒胸臆。有时不用写景，但景却历历如见，如陈子昂的《登幽州台歌》虽然重心在写情，但此情却令人想象到丰富而复杂的历史情景和个人境遇。\n\n（三）情景并茂式。这一类是以上两种方式的综合型，抒情与写景在这里达到了浑然一体的程度。如杜甫《闻官军收河南河北》一诗抒情和写景并举，情与景如水乳交融，浑然天成。\n\n二、虚实相生\n\n这是意境创造的结构特征。意境包括两个部分：一方面是“如在目前”的较实的因素；一方面是“见于言外”的较虚的部分。意境从结构上看，正是二者的结合。所以后人干脆提出了“全局有法，境分虚实”的主张，把意境中较实的部分称为实境，较虚的部分称为虚境。\n\n实境是指逼真描写的景、形、境，又称真境、事境、物境等；而虚境是指实境诱发和开拓的审美想象的空间，它一方面是原有画面在联想中的延伸和扩大，另一方面是伴随着这种具象的联想而产生的对情、神、意的体味与感悟，即所谓言不尽意，所以又称神境、情境、灵境等。\n\n虚境是实境的升华，它体现着实境创造的意向和目的，体现着整个意境的艺术品位和审美效果，制约着实境的创造与描写，处于意境结构中的灵魂和统帅的地位，因此才有神境、灵境的别名。\n\n南宋诗人叶绍翁《游园不值》一诗描写诗人游一座花园，但园中无人，在怅惘之际，忽见一枝红杏怒放，伸出墙外，这是实境。但诗人不得进门的遗憾，由一枝红杏引起的怦然心动的愉悦，以及由此引起的对满园春色的推测与联想则是由实境开拓的审美想象空间，便是虚境。\n\n三、韵味无穷\n\n这是意境的审美特征，是指意境中所蕴含的那种回味不尽的美的因素和效果，它包括情、理、意、趣、味等多种因素，因此有情韵、韵致、兴趣、兴味等多种别名。而所谓“韵味”，就是由物色、意味、情感、事件、风格、语言等因素共同构成的美感效果。如李白的《忆秦娥》气势博大，意境苍凉沉郁。在历史的与现实的许多同类事物的对比中抒发了世事沧桑、社稷飘摇的慨叹，情韵极其丰富。\n\n司空图不仅发现了意境的这一特征，而且还提出了所谓“韵外之致”“味外之味”的命题。也就是说，他认为意境的韵味是多层次的，不仅有韵内之韵、味内之味而且还有“味外味”“韵外韵”，所以意境不仅富于韵味，还能让人咀嚼不尽。\n\n意境的这三种基本特征集中地表达了中华民族抒情文学的审美理想，从而使它具有与典型、意象不同的相对独立性，成为二者不可代替的人类审美理想的表现形态之一。", "keywords": "情景交融：表现特征 景中藏情式 情中见景式 情景并茂式；虚实相生：结构特征 如在目前 见于言外；韵味无穷：审美特征回味不尽", "note": "文学意境：文学作品中由对文学意象（审美物象）的具体描写及其所暗示的广阔深邃的艺术空间和含蓄蕴藉的丰富情思所构成的艺术境界，是由特定的审美物象规范指引而形成的能够诱发想象和思索的艺术境界。它是中国文学作品，特别是古代抒情作品的一种艺术境界。", "framework": "实境 景中藏情式 虚实相生 虚境 情中见景式 情景交融 文学意境的特征 情景并茂式 韵味无穷"}, {"id": "223", "stars": 2, "title": "阐明文学形象与文学意象的关系", "body": "一、文学形象\n\n文学形象是读者在阅读文学言语系统过程中，经过想象和联想而在头脑中唤起的具
