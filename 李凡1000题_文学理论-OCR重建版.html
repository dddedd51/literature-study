<script>
const DATA=[{"id": "1", "stars": 1, "title": "简述文学理论的研究对象", "body": "文学理论有自己独特的研究对象、性质和方法。文学理论的研究对象是文学，具体地说，是处于社会生活中的文学活动的规律和特性。具体来说，包括以下内容：\n\n一、以文学作品为中心的各个要素、环节及其相互联系（文学活动）\n\n文学是以文学活动的方式存在的。这里说的文学活动是一个由社会生活、作家、作品和读者等多种要素构成的多环节活动。社会生活是文学的源泉，它的变化总是对文学产生各种各样的影响，而文学又以自身的多环节活动的方式反映社会生活的变化信息。作家是文学创作的主体，诗歌、小说、戏剧和散文等构成文学的基本体裁，读者和批评者是文学的接受者、鉴赏者、再创造者。作家根据其生活素材而创作出文学作品，经过读者和批评者的阅读和接受后文学活动的整个过程才完成。\n\n理解文学或文学活动，还应把握它与人的本质力量的联系。文学是人创造的，是人的本质力量的对象化。在文学活动中，作家把自身物质的、精神的力量投入其中，创造出让千万人感动和思考的文学作品。文学“力量”的来源是作家所处的社会生活，正是基于现实社会生活体验，作家才能创造性地运用词语虚构、想象和理解其特定的社会生活感受。因此，从这个意义上说，文学是一种只有人类才有的能够集中展示，来源于社会生活的人的主体力量的精神活动。\n\n可见，文学理论不是要孤立地研究文学作品、作家创作过程或读者的接受活动，而是要分析上述以文学作品为中心的各个要素、环节及其相互联系，考察文学活动中出现的各种思潮、流派等诸多问题，进而揭示文学活动的规律和特性。\n\n二、文学活动的普遍规律和特性\n\n文学理论不只是局限于个别文学现象的研究，而是要从文学现象中抽象出带有普遍性的规律和特性来。文学的普遍性，是指个别文学现象中存在着所有文学现象的共通性质。文学理论要运用特定的理论和方法研究个别文学现象，但在此过程中，不是仅仅满足于研究它本身，而是从中抽取在其他许多个别文学现象中也能找到的共通性质，并加以概括和总结，上升为理论认识。那些个别文学现象，例如可以分别归属于诗歌、小说、散文、报告文学或剧本等文学体裁的文学作品，各有其特殊性或个别性，固然需要做个别的研究，但文学理论的研究方式的侧重点在于，运用特定的理论和方法，从文学现象中抽象出有普遍性或共通性的特征，通过概括和总结，形成有关文学的规律和特性的新的理论认识，并且再回到文学实践中加以检验，乃至对新的文学活动产生某种规范或引导作用。因此，确切地说，文学理论的研究对象是处于社会生活中的文学活动的普遍规律和特性。", "keywords": "文学活动 普遍规律 特性", "note": "这部分内容基本不会在考查中出现，只是作为背景知识供大家了解。所谓文学理论研究，是通过对文学活动的分析，揭示文学活动的规律和特性，因此文学理论研究的对象便是文学活动及其规律和特性，大家可以试着这样去理解。", "framework": ""}, {"id": "2", "stars": 1, "title": "试分析文学理论的性质与特征", "body": "一、文学理论的性质：研究文学的普遍规律和特性的理论型学科\n\n文学理论的性质在很大程度上是由文学理论的研究对象本身的特殊性所决定的。由于不是停留在个别文学现象的个别的或实证的方式上，而是致力于从中抽取出在其他文学现象中也普遍适用的规律和特性，文学理论主要运用概念、判断和推理的方式去研究，这种方式决定了文学理论主要具有理论型学科的性质。\n\n二、文学理论的特征\n\n作为运用概念、判断和推理等方式研究文学的规律和特性的理论型学科，文学理论具有实践性、科学性和人文性等多种特征。\n\n（一）实践性\n\n文学理论是依据一定的思想立场和观念从文学活动的实践中总结和提炼出来的，具有鲜明的实践性。文学理论的实践性，主要体现为它既来自以文学创作和文学接受为主的文学活动实践，又回到这种实践中经受检验。文学理论虽然属于理论型学科，但毕竟来自文学活动实践，假如没有具体的文学创作、阅读和接受实践，也就没有文学理论。从有文学活动开始就有对这些活动的评论，而且随着文学活动的深入发展，这些评论也变得愈加系统，形成文学理论。文学理论并不是固定的、静止的和僵化的，而总是生机勃勃的开放创新的，随着文学活动的实践发展而发展。文学理论正确与否，是否符合文学发展的规律，关键要看其是否根植于文学活动的实践并经受了这个实践的检验。\n\n（二）科学性\n\n文学理论揭示的是文学活动的客观规律和特性，故具有科学性。文学理论的科学性，要求坚持马克思主义的世界观和方法论，研究分析和科学总结文学活动的实践，透过复杂繁多的文学现象而把握其内在本质，从中提炼出规律性认识。文学理论的科学性不同于自然科学所要求的实验化、数量化和精确化，它是从既有文学活动的事实出发，通过观察、感受和研究，借助概念、判断、推理等概括过程，揭示文学活动的规律和特性，从而建立相应的知识系统。文学理论是否具有科学性，必须接受文学活动实践的检验，只有被实践证明是正确的文学理论，才能发挥科学的指导作用。文学理论的科学性还要求其知识系统与时俱进，在解释文学活动的新情况和新问题中不断更新和发展。\n\n（三）人文性\n\n文学理论还要对文学的人文性予以研究和评价，体现人文性的特征。文学的人文性是指文学活动具有指向人的精神或灵魂状况的特性。在这方面，文学与历史学、哲学等人文学科相近，致力于关怀人类的精神或灵魂的当前状况及其归宿问题。文学作品具有人文性，这与作为研究和评价的文学理论之间形成了互动关系，从而使得文学的人文性不能不渗透进文学理论中，后者因此而体现出浓郁的人文性。在当代，文学理论人文性的最重要体现就是坚持以人民为中心，即以人民的根本利益为本，把是否有利于满足人民群众精神文化需求、提高国家文化软实力、促进人的全面发展、增强文化自信和培根铸魂，作为文学价值判断的根本标准。", "keywords": "性质 普遍规律和特性 理论型学科 特征 实践性 科学性 人文性", "note": "这部分内容主要也是以了解为主，文学理论理论型学科的独特性质，致使其有了实践性、科学性和人文性，同时，文学理论的性质和特征也对文学理论的发展做出了规范，如文学理论的科学性就要求其知识系统与时俱进，在解释文学活动的新情况和新问题中不断更新和发展，这些我们也应该有所了解。", "framework": "性质：研究文学的普遍规律和特性的理论型学科 文学理论的性质与特征 实践性 特征 科学性 人文性"}, {"id": "3", "stars": 1, "title": "试述马克思恩格斯文艺理论的主要贡献", "body": "马克思恩格斯虽然没有留下文艺理论专著，但在其哲学、政治经济学、科学社会主义、历史学著作和大量的书信、手稿、笔记中，有着十分丰富而深刻的文艺和美学思想，做出了如下贡献：\n\n一、为文学理论确立唯物史观基础\n\n马克思对唯物史观的基本原理作了经典表述：物质生活的生产方式制约着整个社会生活、政治生活和精神生活的过程。不是人们的意识决定人们的存在，相反，是人们的社会存在决定人们的意识。文学艺术作为“意识形态的形式”之一，必须被放到社会存在这一基础上去认识。这就精辟地阐明了唯物史观的基本思想，为文学理论奠定了崭新的世界观和方法论基础。\n\n二、科学地论述文学的社会地位和作用\n\n马克思恩格斯对文学艺术与社会生活以及文学艺术与政治经济的关系等问题作了科学论述。\n\n（一）应当辩证理解文学艺术与经济社会发展的关系，在承认经济基础对上层建筑具有决定和制约作用的同时，看到上层建筑对经济基础具有反作用。\n\n（二）正确认识社会心理与文学艺术的关系，明确经济基础与上层建筑之间有一定的“中介”或“中间环节”，例如人\n\n们的社会心理。\n\n（三）深入把握文学艺术与经济社会发展的平衡和不平衡关系，有助于深刻认识和把握这种关系的复杂性，充分尊重文学艺术发展的规律，更好地发挥其在社会发展中的积极作用。\n\n三、重视文学艺术的特点\n\n马克思恩格斯在研究文学艺术时，不仅科学地阐明了文学艺术在社会历史中的地位和作用，而且进一步探讨了文学艺术的特点，为马克思主义文学理论体系的建构开辟了广阔空间。文学艺术作为一种社会意识形态，作为人类精神掌握世界的一种方式，有自己的特殊性。人类精神掌握世界的方式至少有四种，即理论的方式、艺术精神的方式、宗教精神的方式和实践精神的方式。与其他三种掌握世界的方式相比较，文学作为艺术精神的方式之一种即语言艺术方式，其掌握世界的手段主要有充分发挥想象力的作用、努力塑造典型的艺术形象、重视文学语言的特殊性质等特点。\n\n四、为文学理论提供独特的人学思想\n\n马克思恩格斯关于人的学说，作为唯物史观的重要部分，为打开文学殿堂大门、正确认识文学的对象、探讨文学的本质和规律提供了一把钥匙。\n\n（一）从现实的人出发，构成文学理论乃至一切人文科学的根本出发点。\n\n（二）把自由自觉的活动视为人区别于动物的一般特征。\n\n（三）对人的本质作出科学阐释：“人的本质不是单个人所固有的抽象物在其现实性上，它是一切社会关系的总和。”\n\n（四）强调人民群众是历史的创造者。人民群众不仅是物质财富和精神财富的创造者，又是社会主义文学表现的主体。\n\n（五）将人的自由全面发展与文学的未来联系起来。只有实现了人的自由而全面的发展，才能充分发挥每个人的独创性和个性，从而为文学艺术的繁荣创造空前有利的条件。\n\n五、从“美的规律”出发，阐明文学的创作原则和批评标准\n\n马克思从社会实践观点出发，提出了“人也按照美的规律来构造”的科学命题。这一命题对文学艺术的创作和批评具有重要的指导意义。“美的规律”反映的是客观存在的美的事物的组合关系，具有客观性。“美的规律”的表现形式又是变化的、相对的，因时间、空间和事物性质以及创作主体、评价主体的不同而表现为不同的形式。正是从这种“美的规律”出发，马克思恩格斯阐明了文学创作的现实主义原则、典型环境中的典型性格、“莎士比亚化”，主张坚持“美学的和历史的”批评原则等。\n\n马克思恩格斯科学地总结文学发展规律，批判地继承人类优秀文学成果创立了马克思主义文学理论体系，也为马克思主义文学理论在全世界的传播与发展，开辟了无限广阔的前景。", "keywords": "唯物史观基础 文学的社会地位和作用 文学艺术的特点 人学思想 创作原则和批评标准", "note": "马克思和恩格斯虽然没有系统的文学理论著作，但他们的文艺思想和美学思想却通过多种方式流传了下来，对文学理论发展做出了巨大贡献，像是我们之后会学到的内容，如文学的价值与功能、文学创作的批评标准这些都来源于这两位。所以这部分内容虽然基本不会考查，我们也要有所了解。", "framework": ""}, {"id": "4", "stars": 1, "title": "试述列宁对马克思主义文艺理论的发展", "body": "列宁在帝国主义和无产阶级革命的时代，创造性地发展马克思主义，在文学理论方面，继承和弘扬俄国革命民主主义的文学传统，科学地总结列夫·托尔斯泰和高尔基等文学创作实践的新鲜经验，丰富和发展了马克思主义文学理论。\n\n一、明确文学发展的根本方向\n\n为什么人服务的问题是文学创作的根本问题，关系到文学发展的根本方向。列宁在继承欧洲特别是俄国文学界有关“人民性”的优秀思想传统基础上，第一次提出文学事业“为千千万万劳动人民”服务的口号。他认为，社会主义文学的任务，就是要为社会主义革命事业服务。新的文学就要努力去反映革命的历史经验，反映人民群众当前的革命斗争和社会生活经验。这些宝贵思想为社会主义文学艺术的发展指明了方向。\n\n二、阐述党对文学事业的领导与创作自由的关系\n\n在社会主义革命时代，文学创作事业应当成为整个无产阶级事业的一部分，成为由整个工人阶级先锋队所开动的一部巨大的革命机器的“齿轮和螺丝钉”。因而，写作事业应当接受无产阶级政党的领导。但同时，也“绝对必须保证有个人创造性和个人爱好的广阔天地，有思想和幻想、形式和内容的广阔天地”。这些思想为马克思主义政党领导文学事业提供了基本原则。\n\n三、号召接近工农群众、创造典型形象\n\n列宁认为，作家艺术家在新的社会制度下获得了解放和健康成长的条件，可以为人民群众而自由创作。只有深入观察、体验生活，才能创作出人民群众喜闻乐见的好作品。\n\n四、对批判继承优秀的文化遗产与建设社会主义文化的关系作了辩证回答\n\n列宁从社会主义文化建设的高度，强调发展社会主义文化不能割断历史。在如何继承人类的文化遗产问题上，列宁提出了“两种民族文化”的观点：一种是反动阶级所代表的腐朽、反动的文化，另一种是具有民主主义和社会主义成分的先进文化。对过去的文化遗产必须用批判的态度加以分析。社会主义文化建设，必须继承和发扬传统民族文化中的优秀成果。列宁关于批判地继承优秀文化遗产的理论，进一步丰富和发展了马克思主义文化观和文学理论。\n\n五、树立马克思主义文学批评的典范\n\n列宁继承马克思恩格斯所开创的美学的和历史的文学批评传统，并结合俄国文学的实际，创造性地将其运用于对列夫托尔斯泰作品的批评之中，连续写了七篇批评论文，从不同视角和层面对其作品进行了批评，为开展文学批评树立了榜样。\n\n列宁的文学思想是马克思主义文学理论的重要构成内容，其批评实践充分体现了马克思主义文学批评的原则和特点，当代马克思主义文学理论和批评必须创造性地继承这笔珍贵的理论遗产。", "keywords": "明确根本方向 阐述党的领导与创作自由的关系 提供基本原则 接近工农群众 创造典型形象 批判继承优秀的文化遗产 建设社会主义文化 辩证回答 树立马克思主义文学批评的典范", "note": "列宁对马克思主义文学理论的发展起到了重要的承上启下的作用，不仅指导和规范了马克思主义文学理论的发展方向，同时还以亲身实践为马克思主义文学理论的应用做出了典范。这部分内容整体也是以了解为主，不过要重点注意列宁第一次提出文学事业“为千千万万劳动人民”服务的口号，部分考查填空题的学校可能会针对这一点进行考查。", "framework": ""}, {"id": "5", "stars": 1, "title": "试简述毛泽东文艺思想的基本内涵", "body": "毛泽东文艺思想形成于我国新民主主义革命时期，发展于社会主义建设初期。毛泽东文艺思想的形成是中国近现代历史发展的必然，是对中国优秀文化传统与新文艺经验的科学总结。\n\n一、确立文艺为人民大众服务的根本方向\n\n毛泽东《在延安文艺座谈会上的讲话》提出，文艺“为什么人”的问题“是一个根本的问题，原则的问题”。他要求把文艺“为什么人”的问题作为首要的和中心的问题提出来，解决好文艺工作者与人民群众相结合的问题。\n\n（一）文艺工作者要树立无产阶级的立场、世界观，应当把自己的立足点和思想感情转移到工农兵群众方面来。\n\n（二）文艺工作者应当深入到人民群众生活中去，向社会学习，向人民群众学习，理解、熟悉各种人和各种事情。\n\n（三）文艺工作者应当从人民群众的实际思想水平和精神需要出发，正确处理文学艺术的普及与提高的关系，在普及的基础上提高，在提高的指导下普及。\n\n二、阐明文艺与社会生活的关系\n\n毛泽东从辩证唯物主义反映论的基本原理出发，论述了文艺与社会生活的辩证关系。毛泽东明确指出，“人民生活......是一切文学艺术取之不尽、用之不竭的唯一的源泉”。毛泽东还具体阐述了文艺的“源”与“流”的关系。作家艺术家可以而且应当对过去优秀的文学艺术遗产加以继承和借鉴，但这并不能代替自己的创造，也不能代替生活的源泉，因此真正的艺术家还是应当更多地从现实生活中汲取营养。并且，文艺既源于生活而又高于生活，“文艺作品中反映出来的生活却可以而且应该比普通的实际生活更高，更强烈，更有集中性，更典型，更理想，因此就更带普遍性”。这就深刻阐明了文艺与生活的辩证关系，既为文学艺术的创作提供了正确方法，又为鉴赏和评价文艺作品提供了美学原则。\n\n三、揭示文艺的社会本质和社会功用\n\n毛泽东及时地回答了文艺的社会作用方面的重要问题，回答了文艺与社会、文艺与政治、文艺与革命事业的关系等重要问题。在文艺与社会政治和经济的关系上，毛泽东认为，“一定的文化（当作观念形态的文化）是一定社会的政治和经济的反映，又给予伟大影响和作用于一定社会的政治和经济”。特别是在文艺与政治的关系上，主张“文艺是从属于政治的，但又反转来给予伟大的影响于政治”。在文艺与革命事业的关系上，指出“无产阶级的文学艺术是整个革命事业的一部分”。要继续推进革命事业，建设民族的、科学的、大众的新民主主义文化和社会主义文化，就必须大力发展革命的文学艺术。\n\n四、强调文艺作品思想内容与艺术形式的统一\n\n毛泽东在论述文艺问题时，强调尊重艺术规律。文艺作品应当是思想内容与艺术形式的统一。“我们的要求则是政治和艺术的统一，内容和形式的统一，革命的政治内容和尽可能完美的艺术形式的统一。缺乏艺术性的艺术品，无论政治上怎样进步，也是没有力量的。”这就阐明了作品的思想内容与艺术形式的辩证关系，揭示了文艺创作和文艺事业发展的基本规律。在文艺批评标准上，认为“文艺批评有两个标准，一个是政治标准，一个是艺术标准”，强调在政治标准第一、艺术标准第二的认识基础上，坚持两者相统一的原则，但不能把政治标准与艺术标准的关系绝对化，更不能对政治标准作狭隘的理解。\n\n五、提出“百花齐放、百家争鸣”和“推陈出新”的方针\n\n“百花齐放、百家争鸣的方针”（“双百”方针）的提出，是充分认识和尊重文学艺术和科学发展规律的必然，符合文学艺术的发展规律。依据“双百”方针，艺术和科学中的是非问题，应当通过艺术界科学界的自由讨论去解决，通过艺术和科学的实践去解决，而不应当采取简单的强制的方法去解决。\n\n如何正确对待传统文化，是发展社会主义文学艺术必须解决的又一个重大问题。为此、毛泽东提出了“推陈出新”的方针。这一方针的基本精神是要在批判继承文学艺术遗产的基础上创造新时代的文学艺术，这是毛泽东关于文化继承和文化创造辩证关系思想的具体运用，也是对文艺发展规律的科学总结。", "keywords": "文艺为人民大众服务 根本方向 文艺与社会生活的关系 文艺的社会本质和社会功用 思想内容与艺术形式的统一“百花齐放、百家争鸣”“推陈出新”", "note": "毛泽东文艺思想是马克思主义文学理论中国化的重要成果，对中国文学的整体发展产生了非常重要的影响，我们需要有所重视。思考这个问题，我们可以结合现当代文学发展过程中提出的一系列文艺思想方面的方针，同时结合《在延安文艺座谈会上的讲话》的内容。", "framework": ""}, {"id": "6", "stars": 1, "title": "试述中国特色社会主义理论体系中的文艺思想", "body": "改革开放以来，与中国特色社会主义伟大实践相伴随，先后形成了邓小平理论、“三个代表”重要思想、科学发展观。这些重大理论成果所包含的丰富的文艺论述，回答了改革开放新时期一系列重大的文艺理论与实践问题，是马克思主义文艺理论的重要创新发展。\n\n一、明确提出“文艺为人民服务、为社会主义服务”的“二为”方向\n\n坚持文艺反映人民生活、为人民群众服务，是马克思主义文艺理论的一贯主张。邓小平以解放思想、实事求是的精神，在总结历史经验教训的基础上，明确提出“文艺为人民服务、为社会主义服务”，准确概括了社会主义文艺的基本性质，确立了新时期文艺的根本方向。江泽民、胡锦涛毫不动摇地坚持“二为”方向并结合新的实践需要不断充实“二为”方向的具体内容。“二为”方向与“双百”方针是紧密结合而不能分割的。\n\n二、进一步丰富文艺为人民服务的内涵\n\n在人民与文艺、文艺工作者的关系上，继续坚持毛泽东提出的文艺为人民大众服务的思想，并赋予其新的时代内涵，突出了人民群众在历史创造活动中的决定性作用、在改革开放和现代化建设中所建立的丰功伟业，强调人民创造历史的活动是文艺创作的丰厚土壤和源头活水，是检验文艺作品的最终仲裁者。\n\n三、倡导弘扬主旋律与提倡多样化的统一\n\n这里的主旋律并不是指某种题材，而是指作为时代社会发展主流的、以爱国主义为核心的民族精神和以改革创新为核心的时代精神。社会主义文艺一定要有重点，有主调，又处于主导地位的方面。在弘扬主旋律的同时，也要提倡多样化，以满足人民群众日趋多样的精神文化需求。邓小平强调，对人民负责的文艺工作者，要始终不渝地面向广大群众，力求把最好的精神食粮贡献给人民。要在坚持正确方向的前提下，在艺术创作上提倡不同形式和风格的自由发展，在艺术理论上提倡不同观点和学派的自由讨论。江泽民从发展社会主义先进文化的要求出发，明确提出要弘扬主旋律，提倡多样化，而且要将两者有机地统一在文艺事业的发展实践中。胡锦涛进一步将弘扬主旋律、提倡多样化与建设社会主义核心价值体系联系起来，要求把社会主义核心价值体系融入文艺创作各方面，满足人民群众多层次、多样化、多方面的精神文化需求，促进全社会形成积极向上的共同精神追求。\n\n四、在批判地继承和吸收借鉴的基础上推动文艺创新\n\n针对改革开放初期文艺观念僵化和文艺创作模式化的问题，邓小平强调在继承前人的基础上敢于创新。他希望文艺工作者认真钻研、吸收、融化和发展古今中外艺术技巧中一切好的东西，不断丰富和提高自己的艺术表现能力，创造出具有民族风格和时代特色的完美的艺术形式。江泽民阐述了发扬传统与开拓创新的辩证关系，提出文艺工作者要“努力继承和发扬中华民族的优秀文化传统，继承和发扬五四运动以来形成的革命文化传统，积极学习和借鉴世界各国人民创造的一切先进文明成果，坚持古为今用、洋为中用，与时俱进，推陈出新”。胡锦涛指出，推进文学艺术发展，基础在继承，关键在创新，“我们不仅要继承和发扬前人的文化创造，而且要勇于在新的时代条件下进行新的文化创造”。为此“要全面认识祖国传统文化，取其精华，去其糟粕，使之与当代社会相适应与现代文明相协调，保持民族性，体现时代性”。这些思想丰富了马克思主义关于文艺继承与创新的理论，为改革开放新时期文艺发展注入了新的精神动力。\n\n五、加强党对文艺工作的领导\n\n邓小平明确指出，党对文艺工作的领导，不是发号施令，不是要求文学艺术从属于临时的、具体的、直接的政治任务，而是根据文学艺术的特征和发展规律，帮助文艺工作者获得条件来不断提高文学艺术水平，繁荣文学艺术事业。写什么和怎样写，只能由文艺家在艺术实践中去探索和逐步求得解决。同时要帮助文艺家树立社会责任感，充分认识到文艺事业是一项崇高的事业。江泽民指出，要加强和改善对文艺工作的领导，文艺部门的领导干部首先要向文艺家们学习，努力成为行家里手，用符合文艺规律的办法来领导文艺。胡锦涛要求各级党委把加强和改善党对文艺工作的领导作为提高党的执政能力的重要内容，不断提高领导文艺工作的能力和水平。", "keywords": "“二为”方向 丰富文艺为人民服务的内涵 弘扬主旋律与提倡多样化的统一 批判地继承 吸收借鉴 推动文艺创新 加强党对文艺工作的领导", "note": "中国特色社会主义理论中涉及的文艺思想是马克思主义文学思想与中国现实紧密结合后的又一次向前推进，并且在许多方面都是在新时期社会现实的基础上对毛泽东文艺思想的新发展，大家对此应该有所了解。", "framework": ""}, {"id": "7", "stars": 1, "title": "试述习近平新时代中国特色社会主义理论中的文艺思想", "body": "习近平新时代中国特色社会主义思想，是当代中国马克思主义、21世纪的马克思主义，其中包含着一系列文艺方面的重要论述。这些论述立足社会主要矛盾发生变化、文艺实践发生深刻变革的时代背景，系统回答和论述了事关文艺繁荣发展的带有根本性、方向性的重大理论与实践问题，体现了党对文艺工作的新思想、新判断、新要求，对新时代文艺事业发展具有重要的指导意义。\n\n一、进行无愧于时代的文艺创造\n\n中国特色社会主义进入新时代，对文艺提出新的更高要求。实现中华民族伟大复兴，必须高度重视和充分发挥文艺和文艺工作者的重要作用。文艺是时代前进的号角，最能代表一个时代的风貌，最能引领一个时代的风气。推动文艺繁荣发展，最根本的是要创作出无愧于时代、无愧于人民、无愧于民族的优秀作品。文艺工作者应该把创作视为自己的中心任务，以作品为自己的立身之本。文艺创作应以扎根本土、深植时代为基础，在观念和手段结合上、内容和形式融合上进行深度创新，把提高作品的精神高度、文化内涵、艺术价值作为追求，坚持思想精深、艺术精湛、制作精良三者的统一，努力书写中华民族新史诗，创造“扛鼎之作、传世之作、不朽之作”，为“筑就中华民族伟大复兴时代的文艺高峰”而奋斗。\n\n二、坚持以人民为中心的创作导向\n\n以人民为中心，是新时代中国特色社会主义文艺应当坚持的马克思主义立场。一部作品是否优秀，是否有价值，就在于它是否代表人民的利益，传达人民的心声，得到人民的认可和认同。人民是社会主义现代化建设的主体，是历史的创造者，也是历史的见证者。文艺坚持以人民为中心的创作导向，就是要热爱人民，深入生活、扎根人民，为人民而创造。热爱人民不应只是一句口号，而应有深刻的理性认识和具体的实践行动。文艺工作者不仅应当“身入”，更要“心入”“情入”，真切感受和反映人民生活的波澜壮阔、酸甜苦辣、欢乐忧伤。要坚持服务人民，用积极的文艺歌颂人民，以强烈的现实主义精神和浪漫主义情怀，观照人民的生活、命运、情感，表达人民的心愿、心情、心声，创作出在人民中传之久远的精品力作，努力为人民创造文化杰作、为人类贡献不朽作品。\n\n三、中国精神是社会主义文艺的灵魂\n\n文艺是铸造灵魂的工程。要发挥文艺在培育和弘扬社会主义核心价值观方面的独特作用，把社会主义核心价值观生动活泼、活灵活现地体现在文艺创作之中，真正起到凝神聚气、培根铸魂的作用，增强做中国人的骨气和底气，提高全民族的文化自信。当代文艺要把爱国主义作为文艺创作的主旋律，引导人民树立正确的历史观、民族观、国家观、文化观。追求真善美是文艺的永恒价值，优秀的文艺作品理应承载着真善美，传递真善美，传递向上向善的价值观，引导人们增强道德判断力和道德荣誉感。\n\n文艺创作不仅要有当代生活的底蕴，而且要有文化传统的血脉，大力弘扬中华优秀传统文化中的思想道德精髓，传承和弘扬中华美学精神，在继承基础上实现创造性转化和创新性发展。同时，要认真学习借鉴世界各国人民创造的优秀文艺，坚持洋为中用、开拓创新，中西合璧、融会贯通，努力创作更多坚守中华文化立场、传承中华文化基因、展现中华审美风范、传播当代中国价值观念、符合世界进步潮流的优秀作品。文艺家应当把文艺创作当作灵魂的创作来做，坚持用明德引领风尚，以文化人，以文育人，以文培元，明大德、立大德，让文艺真正成为民族之魂。\n\n四、加强和改进文艺理论和文艺评论工作\n\n文艺批评是文艺创作的一面镜子、一剂良药，是引导创作、多出精品、提高审美、引领风尚的重要力量。应以马克思主义文艺理论为指导，继承创新中国古代文艺批评理论优秀遗产，批判借鉴现代西方文艺理论，打磨好批评这把“利器”，把好文艺批评的方向盘，运用历史的、人民的、艺术的、美学的观点评判和鉴赏作品，在艺术质量和水平上敢于实事求是，对各种不良文艺作品、现象、思潮敢于表明态度，在大是大非问题上敢于表明立场，倡导说真话、讲道理，营造开展文艺批评的良好氛围。文艺批评要的就是批评，就是要发扬“批评精神”，褒优贬劣、激浊扬清。应当坚持与时代、与实际相融合，因势而变，创新评论载体、传播方式、评论内容、评论文体，不断增强文艺评论的针对性和实效性。\n\n五、切实加强和改进党对文艺工作的领导\n\n党的领导是社会主义文艺发展的根本保证。要紧紧依靠广大文艺工作者，尊重和遵循文艺规律，“用符合文艺规律的方式领导文艺事业”。通过深化改革、完善政策、健全体制，形成不断出精品、出人才的生动局面。尊重文艺工作者的创作个性和创造性劳动，营造有利于文艺创作的良好环境，诚心诚意同文艺工作者交朋友，关心他们的工作和生活，倾听他们心声和心愿。重视文艺阵地建设和管理，坚持守土有责，绝不给有害的文艺作品提供传播渠道。把文艺队伍建设摆在更加突出的重要位置，努力造就一批有影响的各领域文艺领军人物，建设一支宏大的文艺人才队伍，培养大批德艺双馨的文艺名家。坚持发扬学术民主、艺术民主，“尊重差异，包容多样，提倡不同学术观点、不同风格学派相互切磋、平等讨论”，鼓励思想碰撞、学术争鸣。", "keywords": "无愧于时代的文艺创造 以人民为中心的创作导向 中国精神是社会主义文艺的灵魂 加强和改进文艺理论和文艺评论工作 切实加强和改进党对文艺工作的领导", "note": "有强烈时政色彩的题目在文学理论的真题考察中占比并不算大，这样的题目一般稍加阅读作为基本了解即可，但前提是要熟悉目标院校的真题，若真题对这样的题目考察得较多，则需要多花些精力进行掌握。", "framework": ""}, {"id": "8", "stars": 2, "title": "请谈谈你对当下中国特色文艺理论发展方向的认识", "body": "一、当前从事文学理论的学习和研究，应当以马克思主义为指导，善于融通古今中外各种资源，主要需把握三方面资源：马克思主义文学理论、中华优秀传统文学理论和国外文学理论中的积极成果。\n\n（一）马克思主义文学理论\n\n马克思主义文学理论，既是文学理论的指导思想，又是文学理论的最宝贵的思想资源。这一思想资源由马克思主义经典作家文艺思想、马克思主义文学理论中国化的成果，特别是习近平新时代中国特色社会主义思想关于文艺的重要论述等构成，是当前文学理论的主体内容。马克思主义文学理论是随着时代文艺发展而发展的开放的文学理论体系，把坚持和发展马克思主义文学理论统一起来，结合新时代文艺实践不断作出新的理论创造，才能永葆马克思主义文学理论的生机与活力。\n\n（二）中华优秀传统文学理论\n\n中华优秀传统文学理论构成了文学理论的又一重要思想资源。中华民族文学传统源远流长。与此同时，文学理论也在不断发展，留下了丰富的文学理论遗产。中国传统文学理论、晚清特别是“五四”以来在民主和科学精神的引领下奠定的现代文学和文论传统、中华人民共和国成立以来的众多文学佳作和文学理论硕果，汇成了一条长流不息的江河，传承中华民族的精神血脉，滋养中华民族的心灵，提升中华民族的精神品质，成为当前文学理论发展的丰厚资源。有理由相信，善于“综合全世界古今的艺术理想，融合贯通，求美学上最普遍的原理而不轻忽各个性的特殊风格”的中华优秀传统文论，将对未来世界文论作出自己的贡献。\n\n（三）国外理论中的优秀成果\n\n国外（这里主要是指西方）文学理论中的积极成果构成了文学理论的又一不可忽视的思想资源，这也应当成为当前中国文学理论的有益滋养。世界各国也创造了无数优秀的文学作品和文学理论成果。在文学理论领域，柏拉图、亚里士多德、贺拉斯、维柯、布瓦洛、莱辛、康德、席勒、黑格尔、别林斯基、车尔尼雪夫斯基、杜勃罗留波夫、普列汉诺夫等人的文学思想都产生了重大影响。进入20世纪以来，又陆续出现了一系列有影响的文学理论与批评流派，今天，这些来自国外的文学和文学理论遗产也都是应当加以研究和批判地借鉴的重要思想资源。\n\n当前，文学理论需要在马克思主义指导下，坚持古为今用、洋为中用，通过上述各种思想资源的融通，为构建新时代中国特色文学理论学科体系、学术体系和话语体系而努力。\n\n二、深入文艺实践\n\n为了推进中国特色主义文艺理论的发展，还应密切关注来自当前全球化语境下文艺实践的新挑战。与中国大地上正持续进行的空前伟大的变革实践相伴随，当代中国文艺实践会在其蓬勃发展过程中不断涌现出新现象和新问题，这要求文学理论作出及时的回应和解答。而这些回应和解答将会成为中国特色文学理论学科体系、学术体系和话语体系建设和创新的重要动力。正如毛泽东所指出的那样，真正的文学理论应当是从文艺实践中概括和总结出来的、能够在文艺实践中得到证明并且还能对文艺实践起到一定的促进和引领作用的理论。\n\n总之，通向未来的中国特色文学理论，应当是马克思主义指导下的、古今中外各种思想资源高度融通的、从当代文艺实践中来又能在其中检验并产生引导作用的文学理论。", "keywords": "马克思主义文学理论 中华优秀传统文学理论 国外理论中的优秀成果 深入文艺实践", "note": "中国当下的文艺理论发展，要注意古今中外的结合，既要放在全球化的语境之下，又要考虑当前的国情和文学及文学理论发展的实际。总体来看，这道题的政治色彩相对较强，总结下来就是坚持以马克思主义为指导，继承传统，推陈出新，面向世界，博采众长，从实践中来，到实践中去。", "framework": ""}, {"id": "9", "stars": 1, "title": "请谈谈你对文学理论的研究方法和研究分支的认识", "body": "一、文学理论的研究方法\n\n在研究方法上，文学理论应以马克思主义为指导。马克思主义要求以辩证唯物主义和历史唯物主义为基本的世界观和方法论，有分析、有批判地吸纳和借鉴古今中外一切科学的文学研究方法中的积极成果，全面地、历史地和辩证地分析文学现象，把握文学创作、文学批评、文学接受等的规律。由于研究的具体对象及其内容不同，加上所借鉴的相关学科手段不同，文学理论还形成了若干具体研究方法：\n\n（一）从文学理论的思维方式看，可以有偏于理论思辨的研究，偏于实证的研究，以及理论思辨与实证结合的研究等。\n\n（二）从文学理论著述的文体呈现看，有对话体、散文体、韵文体、论文体和著作体等。\n\n（三）从文学理论的研究对象看，有联系作家的人生经历和创作过程等去理解作品的传记研究方法，着重发掘作品与社会现实和历史传统的联系的社会历史研究方法，倾力分析作品语言形式的形式研究方法，长于把握文学人物的心理特点及作家创作心理的心理研究方法等。\n\n二、文学理论的研究分支\n\n当一些研究方法与相关学科紧密交叉，逐渐生成为相对稳定的带有明显的学科交叉特点的研究路径时，就产生了文学理论的研究分支：\n\n（一）文学和文学活动中有哲学（包括美学）问题，如主观与客观、现象与本质、个别与一般、偶然与必然、形式与内容、美与丑、真与假等问题，当以哲学方法去研究，就形成了文学哲学。\n\n（二）文学和文学活动中有社会学问题，如文学与社会、文学与自然、文学与时代、文学与政治、文学与环境、文学与社会心理等，当以社会学方法去研究，就形成了文学社会学.\n\n（三）文学和文学活动又涉及心理学问题，如情感与理性、体验与认识、想象与灵感、回忆与幻想、意识与无意识等，当以心理学方法去研究，就形成了文学心理学。\n\n（四）文学以语言符号来表现人与社会，不能不涉及与文学密切相关的语言或符号问题，如韵律与节奏、语体与修辞等，当以语言学方法去研究，就形成了文学语言学（或文学符号学）。\n\n应当看到，这些具体研究方法和研究分支都分别从某个特定角度去处理文学问题，既有其优势也有其局限。无论选择哪种具体研究方法和研究分支，文学理论都应当以马克思主义的辩证唯物主义和历史唯物主义为总的指导思想和研究方法，从整体上分析、总结文学和文学活动的规律。", "keywords": "研究方法 思维方式 著述的文体 研究对象 研究分支 文学哲学 文学社会学 文学心理学 文学语言学（或文学符号学）马克思主义 总的指导思想和研究方法", "note": "这部分内容主要还是作为拓展知识进行了解，马工程对于这一部分整体处理得比较散乱，大家可以看看童庆炳版教材第一章第二节，将这些内容做成了两个流程图，整体更加有条理一些。", "framework": "思维方式 研究方法 著述的文体呈现 研究对象 文学理论的研究方法 和研究分支 文学哲学 文学社会学 研究分支 文学心理学 文学语言学"}, {"id": "10", "stars": 4, "title": "文学作为社会意识形态有哪些主要特征", "body": "文学作为一种社会意识形态，是作家依据一定的立场、观点和方法对社会生活进行的艺术创造，具有认识性、倾向性和实践性。\n\n一、文学具有认识性\n\n文学的认识性是指文学帮助人们认识自然、社会和精神世界的特性。\n\n（一）文学是客观世界在作家主观世界中反映的产物。文学作为一种社会意识形态，不管内容和形象多么丰富，表现方式多么曲折，距离现实多么遥远，总可以在社会生活中找到历史和现实根源。\n\n（二）文学作品蕴含着作家对社会生活的认识。作家会透过多样而又多变的社会现象，把握其内在的发展规律和推动力量，并用合乎艺术规律的方式表达他对社会生活的认识和观点。\n\n（三）文学通过艺术形象对社会关系进行整体把握。文学对社会生活的认识属于马克思所说的艺术掌握世界的一种方式。这种认识和掌握世界的方式能够超越一般意识形态如政治意识形态、法律意识形态、哲学意识形态等的局限，对社会生活情状进行最为真切、丰富、完整的反映。\n\n二、文学具有倾向性\n\n文学的倾向性是指文学在反映特定社会生活时表现或流露出来的价值取向。它是作者一定的三观自觉不自觉地显现，包括政治和思想的、道德的、民族的、宗教的等倾向。\n\n（一）政治和思想倾向性是文学倾向性的主要体现。其中包含两个因素：一是作家所具有的特定的阶级立场、思想感情和价值取向；二是社会生活所包含的政治和思想内容。\n\n（二）文学的政治和思想倾向性必须与文学的真实性相统一。文学的政治和思想倾向性应该以符合艺术规律的形式体现出来，应该是建立在文学真实性基础上的倾向性。文学的真实性源于生活又高于生活，作家既不能脱离社会生活进行主观臆造，也不能对社会生活进行自然主义式的照抄。只有把倾向性与真实性统一起来，才能创造出成功的文学作品。\n\n三、文学具有实践性\n\n文学作为一种社会意识形态，既是对人类社会实践的反映，又能够通过其特殊方式对人类社会实践产生能动的影响。文学的实践性，就是指文学反映社会实践而又通过影响读者心灵而能动地作用于其社会实践行为的特性。\n\n（一）文学对政治实践的影响。文学与政治都属于社会意识形态，因此相对于对经济基础的作用而言，文学对政治实践的影响更为直接。不过，文学的这种政治实践性并不意味着作家需要在作品中直接发表其政治主张。文学是要通过独创的人物形象及其他艺术形象去含蓄地体现其政治实践性。\n\n（二）文学对经济、社会变革的影响。文学与经济发展、社会实践之间存在着深刻而复杂的辩证联系。一方面，文学是在以经济为基础的社会生活之中发展起来的。另一方面，文学也给予经济和社会发展以能动影响。\n\n（三）文学对人的精神和观念的影响。文学的实践性有其特殊的实现途径和方式，它不像政治、法律、道德、宗教等其他意识形态那样以明确的规范性条文和观念来指导和约束人们的现实实践和具体行为，而通常是借助于审美化的文学形象和艺术手段，通过激励和提升人的精神来实现的。在弘扬民族精神和时代精神方面，文学确实可以发挥独特而重要的作用。", "keywords": "认识性 自然、社会和精神世界 倾向性 价值取向 政治和思想 真实性 实践性 能动作用 政治实践经济、社会的变革 精神和观念", "note": "关于文学是意识形态的三点，我们可以用口诀来辅助记忆：认（认识性）清（倾向性）事（实践性）实（社会意识形态）。再用一句话来连缀关键词：文学和经济基础的区别，在于它作为意识形态，就是在认识世界、体现出一定的倾向，并影响作用于实践。", "framework": "总可以在社会生活中找到历史和现实根源 认识性 蕴含着作家对社会生活的认识 通过艺术形象对社会关系进行整体把握 政治和思想倾向性 文学作为社会意识形态 倾向性 与文学的真实性相统一 文学对政治实践的影响 实践性 文学对经济、社会变革的影响 文学对人的精神和观念的影响"}, {"id": "11", "stars": 3, "title": "如何理解文学的认识性", "body": "文学的认识性，是指文学帮助人们认识自然、社会和精神世界的特性。它通过创造艺术形象，以不同于科学和逻辑的方式反映社会生活。\n\n一、文学是客观世界在作家主观世界中反映的产物\n\n文学作为一种社会意识形态，不管内容和形象多么丰富，表现方式多么曲折，距离现实多么遥远，总可以在社会生活中找到历史和现实的根源。孔子称“诗可以观”，即认为诗歌可以反映社会的盛衰，民风的好坏。巴尔扎克也把文学作品看作是映现一个民族生活和思想的“镜子”。\n\n一般来说，那些具有鲜明现实主义风格的文学作品，是对时代真实社会状况比较直接的反映。比如杜甫的“三吏”“三别”，以“诗史”的形式艺术地再现了“安史之乱”中唐王朝下层社会的惨景。\n\n另一方面，文学史上很多着重表现人类的幻想、想象和理想的文学作品，同样是社会存在在文学艺术中的曲折反映。比如李白的《梦游天姥吟留别》，尽管写的是梦境，表达的却是他对现实政治的不满和傲视权贵的风骨。\n\n二、文学作品蕴含着作家对社会生活的认识\n\n社会生活是纷繁复杂的客观存在。作为现实生活中的个人，作家和普通人一样处在复杂的社会关系网络之中，但作家又有别于普通人，他会透过多样而又多变的社会现象，把握其内在的发展规律和推动力量，并用合乎艺术规律的方式表达他对社会生活的认识和观点。\n\n在创作中，有的作家能够以先进思想为指导，深入体验生活，了解生活，洞察社会生活的发展情势，把握社会历史的发展规律，在表现社会生活的丰富性和复杂性的同时，传达出符合社会进步趋势的意识形态倾向，如高尔基的《母亲》、鲁迅的《阿Q正传》。\n\n有的作家虽然没有自觉地以科学世界观为指导，但由于能够真诚地面对现实，依然能够反映出现实社会的真实面貌和发展方向，表现出一定的进步意识。巴尔扎克就是这样的一位作家。在现实社会中，巴尔扎克是一位“保皇派”，他的阶级立场属于封建贵族，但强烈的现实主义精神，促使巴尔扎克在文学作品中对资产阶级必然战胜封建贵族这一历史发展趋势有着非常清醒的认识。\n\n三、文学通过艺术形象对社会关系进行整体把握\n\n文学对社会生活的认识属于马克思所说的艺术掌握世界的一种方式。这种认识和掌握世界的方式能够超越一般意识形态如政治意识形态、法律意识形态、哲学意识形态等的局限，对社会生活情状进行最为真切、丰富、完整的反映。俄国作家列夫·托尔斯泰通过描绘上层贵族的各种日常生活，把当时俄国最基本的社会关系和社会性质表现得淋漓尽致，特别是表现出了与贵族对立的俄国农民的思想和情绪。如《复活》描写的是上层贵族和地主的生活，但是在这些统治阶级人物身上仍折射出农民的身影、意识和情绪。文学要发挥其社会意识形态作用，不能回避描写社会的重要矛盾冲突，这就要求文学以独特的艺术形象描绘出社会生活的整体关系，帮助人们认识社会历史的真实面貌。", "keywords": "自然 社会 精神 客观世界 主观世界中反映 社会生活 面对现实 艺术形象 整体把握", "note": "在记忆知识点的时候，我们可以用一句话将关键词进行串联，有属于自己的逻辑梳理。例如本题，文学的认识性是指文学帮助人们认识自然（外）、社会（中）和精神（内）世界的特性。文学用艺术形象表现主观反映的整体把握的客观世界，达成对生活的认识，或表达观点，或体现意识形态，或只是简单地反映。", "framework": ""}, {"id": "12", "stars": 3, "title": "如何理解文学具有倾向性", "body": "文学的倾向性是指文学在反映特定社会生活时表现或流露出来的价值取向。它是作者一定的三观自觉不自觉地显现，包括政治和思想的、道德的、民族的、宗教的等倾向。\n\n一、政治和思想倾向性是文学倾向性的主要体现\n\n文学的政治和思想倾向性主要与两个因素有关：一是作家所具有的特定的阶级立场、思想感情和价值取向，二是社会生活所包含的政治和思想内容。在社会生活中，政治集中体现了不同阶级、阶层、集团在经济、社会、文化等方面的权力关系及其矛盾和斗争，因此，文学在反映社会生活时，总会以不同方式表现与政治的联系，文学总是或隐或显地具有一定的政治和思想倾向。\n\n政治和思想倾向性是文学的一种较为普遍的属性。恩格斯认为，不存在某种毫无倾向性的诗歌，倾向性是文学的一种普遍的本然的性质；文学的阶级倾向性非但不会与文学的艺术性相对立，而且是理想艺术的重要特征。历史上很多伟大的文学作品，总是能够创造性地深刻传达出特定社会、特定阶级的利益、情绪、观念、愿望和理想，并因此具有珍贵的历史价值和美学价值。\n\n在阶级社会中，文学的政治和思想倾向性很大程度上表现为阶级性。在社会主义社会，文学的政治和思想倾向性更多地表现在对待人民的态度上。\n\n二、文学的政治和思想倾向性必须与文学的真实性相统一\n\n文学具有政治和思想倾向性，但是文学并不能因此变成时代政治的概念化的宣传工具。文学的政治和思想倾向性应该以符合艺术规律的形式体现出来，应该建立在文学真实性基础之上。文学的真实性是指文学要真实、生动、具体地反映社会生活的本来面目，并艺术地揭示社会生活的某些本质规律和特性。真实性是伟大文学作品的重要品质。\n\n倾向性的观念化表达并非难事，但是倾向性的艺术化表现需要作家对艺术创作规律予以尊重和真正在行。从场面和情节中自然流露出倾向性，更符合艺术表现规律，也更易深入人心，更能影响社会和生活。\n\n文学的真实性源于生活又高于生活，作家既不能脱离社会生活进行主观臆造，也不能对社会生活进行自然主义式的照抄。只有把倾向性与真实性统一起来，才能创造出成功的文学作品。", "keywords": "价值取向 政治和思想倾向性 阶级立场 思想感情和价值取向 政治和思想内容 与文学的真实性统一 符合艺术规律", "note": "文学的倾向性，顾名思义，就是文学作品反映出来的某种价值取向，具体方向有很多，但最重要的是政治和思想倾向性。相较于认识性，文学的倾向性整体出简答题较少，而多以名词解释的形式进行考查。", "framework": ""}, {"id": "13", "stars": 3, "title": "如何理解文学具有实践性", "body": "文学作为一种社会意识形态，既是对人类社会实践的反映，又能够通过其特殊方式对人类社会实践产生能动的影响。文学的实践性，就是指文学反映社会实践而又通过影响读者心灵而能动地作用于其社会实践行为的特性。\n\n一、文学对政治实践的影响\n\n文学与政治都属于社会意识形态，因此相对于对经济基础的作用而言，文学对政治实践的影响更为直接。在中国文学史上，《诗经》很早就被视为考察政治得失的镜鉴，诗三百篇成为表达政治情绪、施行政治教化的重要手段。在西方文学史上，法国作家雨果的《巴黎圣母院》《悲惨世界》等对当时资产阶级法律的残暴和不公正展开了激烈的批判。\n\n不过，文学的这种政治实践性并不意味着作家需要在作品中直接发表其政治主张。文学是要通过独创的人物形象及其他艺术形象去含蓄地体现其政治实践性。\n\n二、文学对经济、社会变革的影响\n\n文学与经济发展、社会实践之间存在着深刻而复杂的辩证联系。一方面，文学是在以经济为基础的社会生活之中发展起来的。纵观中外文学的发展历史，各个民族、各个时代的文学创作之所以具有不同的思想内容和风格特点，正是由其各不相同的社会生活实践所造成的。《诗大序》里所谓“治世之音安以乐，其政和；乱世之音怨以怒，其政乖；亡国之音哀以思，其民困”，也可以从这个角度去理解。\n\n另一方面，文学也给予经济和社会发展以能动影响。这一点在生产关系和社会制度急剧转型时期的文学艺术中表现得尤为明显，如斯托夫人以19世纪美国南方黑奴生活为题材的小说《汤姆叔叔的小屋》，深刻揭露了南方农奴制度的罪恶，坚定了美国政府和民众废除这种落后的经济和政治制度的决心。\n\n三、文学对人的精神和观念的影响\n\n文学的实践性有其特殊的实现途径和方式，它不像政治、法律、道德、宗教等其他意识形态那样以明确的规范性条文和观念来指导和约束人们的现实实践和具体行为，而通常是借助于审美化的文学形象和艺术手段，通过激励和提升人的精神来实现的。\n\n在弘扬民族精神和时代精神方面，文学确实可以发挥独特而重要的作用。文学有利于人的感情的激发、愿望的表达、信心的培养等，不仅能对个人精神生活的养成和心灵世界的成长产生潜移默化的影响，而且能够经由人的主体精神的改变，渐进缓慢却又深入持久地影响着社会生活的整体发展。", "keywords": "政治实践 经济、社会的变革 改变人的精神和观念", "note": "所谓文学的实践性，就是文学的能动作用，简单直白点来说，就是文学对其他领域的影响，这主要表现在政治、经济、社会和人的精神观念等方面。总体来看，文学的能动作用，是首先作用于人的精神，进而影响政治、经济和社会等方面。", "framework": ""}, {"id": "14", "stars": 4, "title": "文学的审美属性具体表现在哪些方面", "body": "文学作为一种社会意识形态有其特殊的审美属性，是社会意识形态和审美艺术的统一。文学作为审美艺术，其特征主要体现为情感性、形象性和超越性，是指文学通过艺术想象和审美理想提升人的精神境界，使人获得心灵自由的特性。\n\n一、文学具有情感性\n\n文学的情感性，是指文学表达情感并以此激发读者共鸣，促进社会情感交流的特性。\n\n情感性是文学审美活动的基本特征。审美是人类特有的活动。美从根本上说是事物的一种价值属性，反映的是对象与主体之间的一种价值关系。因此，美不是某种外在于人的客观自然之物，只能存在于人类各种具体的审美活动之中，是人在审美活动中对审美对象的一种价值判断。这种价值判断，从审美主体方面来看，主要体现为情感评价。而从审美价值评价的特征可以看出，情感构成了审美活动的心理基础。文学的主要目的是表达情感、以情动人。情感因素在文学中具有主导性质，因此，情感性成为文学作为审美艺术的重要特征。\n\n二、文学具有形象性\n\n文学的形象性，是指文学创造具体生动的艺术形象以反映社会生活的特性。\n\n（一）形象性是文学艺术之美的重要体现\n\n文学之所以美，很重要的一点在于它的形象可感性。人们通过阅读文学作品的语言文字，首先想象和感知到的往往是具体生动的文学形象；文学作品的艺术价值，也主要凝结在作家创造的各具生气的文学形象之中。艺术反映现实生活，反映现实生活的真实，必须诉诸直观可感的形象，这也是文学这门艺术的基本要求。\n\n（二）文学形象是有创造性、有生气、有意蕴的形象\n\n文学形象主要是作家的艺术心灵创造的产物，是具有高度创造性的精神活动的结晶。文学形象比社会生活中的真实形象更集中、更典型，更能体现人类生活和精神的多样性、深刻性和创造性。文学形象不仅是具体可感的，而且是生动灵活、意蕴丰富的；不仅能够细致再现对象的外部特征，更擅长深入表现对象的精神世界。\n\n三、文学具有超越性\n\n文学的超越性，是指文学通过艺术想象和审美理想提升人的精神境界、获得心灵自由的特性。优秀的文学无不在其富有想象力的创造中寄寓或投射着人们的社会理想、人生理想和审美理想，而理想总是面向未来的，是对某种当下现实或人生处境的超越。因此，人们在创作和鉴赏文学作品的过程中，其心灵能够在摆脱和超越各种现实关系后获得一种精神自由状态，这种心灵自由的状态具体表现为对人与自然、人与社会现实关系以及自我的超越。", "keywords": "社会意识形态 审美艺术 心灵自由 情感性 形象性 超越性", "note": "文学既具备社会意识形态属性，又具有审美属性，所以这部分内容可以与前面一部分的内容结合起来进行理解，也可以与童庆炳“文学的审美意识形态属性”的相关内容结合起来理解。这两部分内容在考查中出现的频率都非常之高，大家一定要重点关注。", "framework": "情感性：文学审美活动的基本特征 形象性是文学艺术之美的重要体现 文学的审美属性 形象性 文学形象是有创造性、有生气、有意蕴的形象 超越性"}, {"id": "15", "stars": 2, "title": "什么是文学的情感性", "body": "文学的情感性，是指文学表达情感并以此激发读者共鸣、促进社会情感交流的特性。\n\n一、情感性是文学审美活动的基本特征\n\n（一）审美评价主要体现为情感评价\n\n审美是人类特有的活动。美从根本上说是事物的一种价值属性，反映的是对象与主体之间的一种价值关系。因此，美不是某种外在于人的客观自然之物，只能存在于人类各种具体的审美活动之中，是人在审美活动中对审美对象的一种价值判断。这种价值判断，从审美主体方面来看，主要体现为情感评价。\n\n（二）情感构成了审美活动的心理基础\n\n与实用价值评价，科学价值评价相比，审美价值评价有三个特征。\n\n（1）审美是一种非实用而又使人产生情感愉悦的活动。审美活动关注的不是审美对象可供消费和利用的物质性和材料性，而是其外在的形式和表象。\n\n（2）审美是一种非概念而又能引起情感与认知的自由协调运动的过程。\n\n（3）审美是一种个体的同时又可以普遍传达和交流的内心情感体验。\n\n由审美价值评价的上述特征可以看出，情感构成了审美活动的心理基础。文学的主要目的是表达情感、以情动人。情感因素在文学中具有主导性质，因此，情感性成为文学作为审美艺术的重要特征。\n\n二、情理交融是文学审美活动的现实表现\n\n审美活动对应的主要是人类的情感领域，但在实际上，很多美的事物和艺术不仅与情感有关，而且会涉及认知和道德。审美艺术是人类在一定思想观念指导下的创造活动，其中既表现了创造者的感性直观和情感体验，也融合了创造者的知性认只和理性观念，因此是直观与认识、情感与理性的相互统一。在文学中，情感与理性的统一应遵循文学创作的特殊规律，不是简单拼凑和机械相加，而应该达到水乳交融、浑然无间的状态。\n\n三、文学情感性表现形式多样，但都要发乎真情实感\n\n在文学活动中，文学情感性的具体表现形态多样：可以是对美好事物的由衷向往和赞美（狭义的“审美”），也可以是对丑恶现象的无情暴露和批判（“审丑”）；可以是对崇高力量和精神的礼拜和敬仰（“审崇高”），也可以是对卑下者的鄙夷和唾弃（“审卑下”）。在这些主要情感形式之外，还有对平凡生命和普通事物的关注、珍惜和同情，以平凡贴近平凡，让普通感动普通。文学情感性的表现形式尽管有不同，但都要发乎真情实感，不能无病呻吟。", "keywords": "基本特征 情感评价 心理基础 情理交融 现实表现 表现形式多样 发乎真情实感", "note": "文学的情感性是文学表达情感、激发共鸣、促进情感交流的特性，在考查中，可能会给出一些古代文论的内容，如“诗可以群、可以怨”等让大家去分析，大家要注意灵活应对。文学的情感性这一概念可能在名词解释中出现，大家要关注一下。", "framework": ""}, {"id": "16", "stars": 3, "title": "什么是文学的形象性", "body": "文学的形象性，是指文学创造具体生动的艺术形象以反映社会生活的特性。\n\n一、形象性是文学艺术之美的重要体现\n\n文学之所以美，很重要的一点在于它的形象可感性。人们通过阅读文学作品的语言文字，首先想象和感知到的往往是具体生动的文学形象；文学作品的艺术价值，也主要凝结在作家创造的各具生气的文学形象之中。艺术反映现实生活，反映现实生活的真实，必须诉诸直观可感的形象，这也是文学这门艺术的基本要求。与哲学主要用概念、科学主要用定理和公式抽象地反映客观世界不同，文学主要是用感性具体的艺术形象反映客观与主观世界。\n\n二、文学形象是有创造性、有生气、有意蕴的形象\n\n文学的形象的创造性、生气和意蕴可以从文学形象与各种日常形体和人工图形的比较中清晰地体现出来。\n\n（一）文学形象具有创造性\n\n生活中的真实形象诚然在任何时候都是文学形象的鲜活素材，但不同的是，文学形象主要是作家的艺术心灵创造的产物，是具有高度创造性的精神活动的结晶。文学形象不仅可以保留现实形象（包括社会形象和自然形象）本身具有的外部特征和情感、智慧、个性、理想等人性内涵，还可以并应该在形象创造中投入作家本人的艺术趣味、情感态度、人格精神和社会理想等。文学形象是一个双面镜，可以同时映照出社会的真实状况和作家的丰富心灵。因此，文学形象比社会生活中的真实形象更集中、更典型，更能体现人类生活和精神的多样性、深刻性和创造性。\n\n（二）文学形象具有生气和意蕴\n\n相对于那些精细、逼真的教学挂图和科技模型，文学形象的不同主要在于它内在于形象的鲜活生气和深厚意蕴。教学挂图和科技模型是一种纯粹的代替性符号，其目的在于提供准确、客观的知识和信息，因此制作得越逼真越好。但是一幅医学人体教学挂图，即使它逼真到皮肤毛发、肌肉骨骼甚至毛细血管都历历在目，也无法传达人的独特情感、个性和精神。文学形象不仅是具体可感的，而且是生动灵活、意蕴丰富的，不仅能够细致再现对象的外部特征，更擅长深入表现对象的精神世界。比如在一幅海燕、海鸥、海鸭、企鹅的教学挂图上，人们看到的只会是它们的动物分类学特征，但在高尔基的散文《海燕》中，它们却充满了生命气息和情感色彩。", "keywords": "形象性 艺术之美的重要体现 有创造性 有生气 有意蕴", "note": "文学的形象性是文学创造具体生动的艺术形象以反映社会生活的特性。文学形象因为表面形象可感和深层输出道理而体现艺术之美，用富有创造性的笔触去表达人性内涵和作家态度、描写外部特征和精神世界。相较于文学的情感性，形象性的考查频率相对较高，大家需要重点关注一下。", "framework": ""}, {"id": "17", "stars": 3, "title": "什么是文学的超越性，包括哪几个方面（25吉林大学、26中南财经政法大学）", "body": "文学的超越性，是指文学通过艺术想象和审美理想提升人的精神境界，获得心灵自由的特性。人们在创作和鉴赏文学作品的过程中，其心灵能够在摆脱和超越各种现实关系后获得一种精神自由状态，这种心灵自由的状态具体表现为对人与自然、人与社会现实关系以及自我的超越。\n\n一、对人与自然现实关系的超越\n\n文学的超越性首先表现为通过想象等文学手段实现对人与自然关系的精神超越。人本来是自然的一部分，不得不受制于自然的规律，但文学可以使人在审美的瞬间暂时超越自然规律的束缚，达到心灵自由的境界。\n\n（一）人在文学中能够能动地刻画自然并表达自身的感受。\n\n（二）人在文学中实现对自然状况的精神超越。文学可以赋予人以想象的翅膀，使人能动地驾驭大自然。同时，文学还可以调动人的幻想，使人在幻想中实现对自然的精神超越。\n\n（三）人在文学中能够同自然结为知己。文学可以传达人对自然的亲如知己的体验，由此实现人在精神上对自然的能动超越。\n\n二、对人与社会关系的超越\n\n文学的超越性还表现为在艺术世界里对人与社会现实关系的超越。与人在现实生活中总是受到社会关系的支配不同，文学审美使人在想象中摆脱现实社会关系的束缚，实现一定程度的精神超越。\n\n人们常常在文学中寻找理想、追求理想。优秀的文学在帮助人树立远大理想、超越现实局限和苦难时可以发挥巨大作用。比如说高尔基一生致力于改变社会不公和建立理想社会，而文学则是引导他走上这条道路的一个重要力量。\n\n三、对人自我的超越\n\n文学审美是心灵的自由活动。在文学审美中，审美主体的各种心理要素相互结合，相互促进，形成一种自由协调的精神活动，从而产生心灵的愉悦。这种审美体验会使人的感觉异常敏锐，表象纷至沓来，想象层出不穷，情感激越飞扬，心智豁然贯通，整个心灵得到舒展和解放。因此，美的文学可以陶冶性灵，启发幽思，拓展心胸，塑造人格，完善人性。\n\n文学追求完美人性和理想社会的人生信念，是对社会道义的弘扬。社会道义浸透在文学中，在阅读的快意里自然能感受到道义的力量。文学的审美愉悦在人的整体意识里扩展开来，会激发起心灵世界追求自我完善的深层冲动，人的灵魂由此得到洗涤和净化。\n\n文学审美活动具有的精神超越性，可以潜移默化地促进人的感性与理性、能力与志趣、道德精神与审美情趣的多方面协周发展，有利于使文学成为陶冶人们道德情操、抒发人类美好理想、丰富人们艺术享受、推动社会发展进步的一个重要领域。", "keywords": "艺术想象 审美理想 心灵自由 自然现实关系 社会关系 自我", "note": "文学的超越性，某种程度上可以看作是文学的理想性，指的是文学可以让人摆脱现实的各种关系，达到理想的精神自由的境界，具体体现在人与自然、人与社会和自我三个方面。在文学的审美属性之中，文学的超越性这一部分整体考查频率最高，大家需要重点关注。", "framework": ""}, {"id": "18", "stars": 4, "title": "文学作为语言艺术具有什么特点", "body": "语言的媒介性质，为文学艺术的生成提供了物质符号基础。作为文学的媒介，语言深刻、全面地影响着文学活动的每一个环节，使文学呈现出有别于其他艺术的间接性、精神性和蕴藉性。\n\n一、间接性\n\n文学的间接性，又可称为非直观性，是指文学不能像绘画、舞蹈、戏剧、影视艺术等其他艺术门类那样直接模拟呈现现实世界的物象、声音、行动与事件等，而必须通过语言符号在头脑里展开想象和联想，从而间接地加以呈现。文学所使用的吾言文字是一种抽象符号，在创作和接受中，人们需要将语言符号表现的事物转化为一系列内心形象，通过内在的感官来感受这些形象，形成相应的心理表象和情感体验。\n\n文学语言在表现形象上的间接性，使文学艺术形象具有较多的不确定性，但同时也可以为读者插上纵情想象或幻想的翅旁，留下更加自由的创造空间。\n\n二、精神性\n\n文学的精神性，是指文学具有通过语言符号而传达人类精神的丰富性和深刻性的特性。“语言是思想的直接现实”这一特点，给文学带来了其他艺术难以比拟的精神深刻性。\n\n文学的精神性充分体现在文学作品的心理描写之中。借助语言，文学可以将人们所能体会和认识到的各种心理活动描述出来，喜怒哀乐、爱恨情仇、深谋远虑、钩心斗角、心忧天下、宁静致远等各种心理状态都可以在作家的笔下纤毫毕现。借语言，作家可以自由出入每一个人物的内心。在文学创作中，作家往往灵活运用各种修辞方法，通过外貌描写、神态描写、心理描写、动作描写、环境描写等，同时借助幻想、梦境、变形等手段，赋予文学形象十分深刻的精神内涵。\n\n三、蕴藉性\n\n文学的蕴藉性，是指文学具有在富有艺术意味的语言符号运用中含而不露地表达深长意味的特性。中外优秀作家的一个共同特征，就是能够充分发挥语言符号的审美表现潜力，在有限的语言符号中含蓄而不直露地表达主观情志与生命之思，而且其表达的意味或者说文本的内在蕴涵往往又是具有复义性、多样性的，难以用直白明晰的语词加以概括，甚至还给人以含混难解的印象。\n\n文学语言的蕴藉性赋予文学作品耐人寻味的魅力。只有认识和把握文学的蕴藉性特征，跳出语言符号的直接性现实指涉和明确性概念所指，在对文学语言的领悟和赏析中幻化言内之象、品味韵外之致和味外之旨，方能真正进入文学审美的境界，享受到文学审美的滋味与乐趣。\n\n【李凡关键词：物质符号基础 间接性 精神性 蕴藉性】", "keywords": "", "note": "文学与经济基础的区别在于它是一种社会意识形态，与其他社会意识形态的区别在于它是一种审美艺术，而与其他种类艺术的区别则在于它是一种语言艺术。这部分在考查中出现的频率非常高，除了论述题之外，这部分涉及的一些小点，如文学语言的间接性、蕴藉这些概念都有可能在名词解释中出现。同时，文学的社会意识形态属性、文学的审美属性和文学作为语言艺术的特征结合起来就是“文学的性质”这道题的答案，这里就不再赘述了。", "framework": ""}, {"id": "19", "stars": 3, "title": "何谓文学价值？文学价值是如何生成的？", "body": "一、文学价值的定义\n\n文学价值是文学作品满足人和社会需要的属性。文学之所以存在，就在于它能够为人们提供独特的精神力量。一部好的文学作品之所以能够具有巨大的精神魅力和对社会的推动力量，就是因为人们可以从中得到心灵的震撼和美的享受，并将沙种精神力量用于现实的社会实践。\n\n二、文学价值的生成\n\n文学价值是作家和读者共同创造的，因而文学价值的生成包含两个重要环节，即文学价值的创造和文学价值的实现。”家在其创作的作品中，通过对特定社会生活的艺术表现和评价，创造出一定的文学价值；而读者在其对作品的传播和接受过程中，又会根据自身情况对作品所表现的社会生活和作者的价值立场作出自己的选择和评价，完成文学价值的实现和再创造。\n\n（一）文学价值首先来自作家的创造，是主客观统一的产物\n\n（1）从客观方面讲，文学价值根源于生活的价值，植根于社会生活沃土之中，是社会生活的价值的集中表现与升华。社会生活丰富多彩，无论是平凡小事还是重大历史事件，都有其特定的意义即价值，从而都是文学价值的源泉。\n\n（2）从主观方面讲，文学是人类艺术地掌握世界的一种方式，是一种高层次的精神活动，从而意味着文学活动是对生活价值加以转化和提升。文学价值除了来自表现对象的价值外，还体现了艺术创造活动本身的价值，其中既包含着作家对社会生活的感知、认识和评价，也包含着作家的审美创造能力。\n\n现实生活价值与作家的艺术创造共同构成了文学价值的来源。\n\n（二）文学价值的最终实现，是通过读者阅读和接受完成的\n\n读者在阅读过程中，通过对作品符号的解读进入作品的内在空间，认识到作品所反映的社会生活关系，理解和体验到作者的审美趣味、思想观点和道德立场，赏析作品的艺术手法，读者由此或认识生活，或受到感染与教育，或获得身心愉悦，作品的潜在价值通过阅读接受而成为一种显性的存在。\n\n读者的阅读是主动参与的过程，读者的价值观往往会影响对文学作品价值的认识和判断。在阅读过程中，读者总是以自己的生活经验、审美趣味与文化水准作为“前理解”来感受作品、理解形象，完成文学的“二度创造”。\n\n【李凡关键词：定义 满足人和社会需要的属性 生成 来自作家的创造 主客观统一 最终实现 读者阅读和接受】\n\n【李凡说：文学价值指的是文学满足人和社会需要的属性，它的生成，则需要通过作家和读者两方面的努力，其中作家在这一过程中发挥的作用很容易理解，而读者在文学价值生成中的作用常常会被忽视，对此大家可以结合之后文学接受的相关内容进行理解。】", "keywords": "", "note": "", "framework": ""}, {"id": "20", "stars": 2, "title": "试分析文学评价的作用", "body": "一、文学评价影响文学价值的生成\n\n文学价值既具有客观的和相对不变的特性，又具有随接受者及其阅读语境变化而发生变化的特性。文学作品作为文学价值的载体，是作家对社会生活进行艺术反映与表现的产物。曹雪芹撰写《红楼梦》时，“披阅十载，增删五次”，当这部小说诞生后，其中所蕴含的文学价值具有了相对的稳定性。\n\n但是，同一部作品，由于不同时期、不同读者的解读不同，其价值的呈现也会有明显不同。这表明，接受者的文学评价也会对作品文学价值的构成产生影响。如同是一部《红楼梦》，“索隐”派将它视为有清信史，“考证”派把它看成曹雪芹的“自叙传”，王国维从中读出“示人生之真相”的“悲剧中之悲剧”，毛泽东则从中看到了“封建社会”的“很细致的、很精细的社会历史”。\n\n由此可见，接受者基于个人思想或趣味而产生的文学评价，对作品的价值生成也有重要意义。不论是从创作角度还是从阅读角度来说，文学价值都是主体对生活对象和作品进行审视、对话和评价的结果。\n\n二、文学评价催生了文学观念，进而产生了审美理想\n\n在文学活动的各个环节中，不同的主体对文学价值的需求和看法、评价是不一样的。由于这种需求和看法、评价同其他因素相联系，就产生了不同的文学观念。文学观念涉及文学主体精神和心理的多个层面，如审美理想、道德追求、情感愿望、兴趣爱好等。其中，审美理想在文学观念中有着统领地位。\n\n（一）审美理想是指人们在特定社会历史和文化语境中形成的、由个人审美经验和人格境界所肯定的关于美的基本观念和规范。\n\n（二）审美理想具有社会性。它不是一己的私见，而是对人类社会历史和文学的过去、现在、未来的总认识与总追求，鲜明地烙有时代和社会的印记，同时它也保留着在历史传统中积淀下的人文追求与社会理想。\n\n（三）审美理想是烛照现实和艺术的火炬，任何一个作家和读者在进行文学活动时，都会自觉不自觉地遵循自身审美理想的要求。没有审美理想，作家的一切叙述描写会死如枯木，情感抒发也会失去动人的魅力；没有审美理想，读者则难以接纳和整合作家的想象与创造，也难以潜移默化地接受作家价值观的影响。所以，培养审美理想，对作家和读者来说都是十分重要的。", "keywords": "影响文学价值的生成 催生文学观念 产生审美理想 基本观念和规范 社会性 烛照现实和艺术的火炬", "note": "与文学评价密切相关的，一个是文学价值的产生，一个是文学观念，而在文学观念之中，又以审美理想最为重要。这里要提醒大家，虽然文学评价基本不会在考查中出现，但审美理想这一概念很可能在名词解释中出现，对于其内涵、特征和作用我们都要有所掌握。", "framework": ""}, {"id": "21", "stars": 3, "title": "谈谈你对文学价值的多样性与主导价值的认识", "body": "文学价值是一个相互联系的系统，包含多层次、多方面的价值因素和价值内容，具有多样性。其中，总有一种价值居于主导地位，成为主导价值。\n\n一、文学价值的多样性\n\n文学价值的多样性，既包括文学作品本身价值的多样性，也包括文学作品在读者接受中所展示的多种价值。文学价值的多样性，主要归结于以下原因：\n\n（一）人类社会生活丰富多彩\n\n人类社会生活是丰富多彩的，反映社会生活的文学作品也必然是丰富多彩的。这是文学价值多样性的客观依据。\n\n（1）就具体内涵而论，文学价值可分为人文价值、伦理价值、审美价值、文化价值、交往价值、科学价值、商业价值等。\n\n（2）就价值的意义和效果而论，文学价值又可分为正面价值和负面价值、积极价值和消极价值、短暂价值和长久价值、现实价值和未来价值、显在价值和潜在价值等。\n\n（3）文学作品的要素与内容不同，其价值也会有相应的差异。小说的认识价值可能突出一些，诗歌的审美价值可能会更加明显，道德戏剧侧重于讽喻劝诫，寓言重哲理启迪，笑话则侧重情感宣泄。\n\n（二）时代变迁与读者审美需求的变化\n\n文学价值的评判尺度随着时代的变迁和读者审美需求的变化而发生变化。所以，文学价值在不同时代呈现出明显的多样性和差异性。东晋陶渊明的诗，在问世后长期仅获得萧统等少数人的欣赏，钟嵘《诗品》也只把陶诗列为“中品”。到了唐代，他的影响逐渐扩大高适、李白、杜甫等诗人纷纷赋诗称颂其诗品与人品。自宋代起，陶诗的巨大价值被进一步发掘，评价越来越高。\n\n（三）文学价值在具有多样性的同时也具有动态稳定性\n\n尽管在不同时代和读者那里，对一部文学作品的价值判断存在着差异性与不确定性，但总体说来，那些经典作品往往具有价值上的动态稳定性。这种动态稳定性来自经典作品本身所蕴含的价值再创造的强大潜力。这种再创造的潜力就源于其内容的丰富性、思想的深刻性和形式技巧的独特性、创造性。\n\n二、主导价值\n\n文学的主导价值，是指文学作品多样性价值中总有一种占主导地位的价值。一般来说，文学的思想，伦理、认识等价值常常居于主导地位，它要和审美、语言、艺术等价值融合起来，才能体现它的主导作用。文学作为一个总体概念，其主导价值就是一定时代和国家的主流意识形态的体现。如“文以载道”是中华民族的优秀传统。历史上，尽管人们对“道”的含义认识不同，但用“文”来承载民族精神和美好理想的愿望是相同的。文学必须既反映人民精神世界，又引领人民精神生活。", "keywords": "多样性 人类社会生活丰富多彩 时代变迁 读者审美需求 主导价值", "note": "文学价值的多样性，从文学价值的来源来看，是社会生活的丰富多彩；从文学价值的实现来看，是时代变化和读者审美需求的变化，大家可以从这两个方面去理解。只有在文学价值多样性的前提下，才会有主导价值的出现，这二者的关系大家也要注意一下。", "framework": ""}, {"id": "22", "stars": 1, "title": "请你谈谈如何体现当下中国文学的主导价值", "body": "在当代中国，文学的主导价值是社会主义核心价值观的反映。体现当代中国文学的主导价值，需要做到以下几点：\n\n一、体现当代中国文学的主导价值，首先要倡导正确的文学价值取向\n\n文学的价值取向关系到文学“为什么人”这个根本问题。中国共产党历来重视文学的主导价值，强调文学要坚持正确导向、弘扬社会正气、反映时代精神、引领社会进步。如新民主主义革命时期，中国共产党把鲁迅作为中国新文化的旗手。鲁迅在新文学运动中历史地位的确立，有力地促进了中国的文学革命和新民主主义文化的发展。“大力弘扬以爱国主义为核心的民族精神和以改革创新为核心的时代精神，大力弘扬中华优秀传统文化，大力发展社会主义先进文化，不断增强全党全国各族人民的精神力量”，则是现阶段我国文学发展的价值主题。要牢牢把握社会主义先进文化的前进方向，建设社会主义核心价值观，弘扬民族优秀文化传统，借鉴人类有益文明成果，进一步形成全社会共同的理想信念和道德规范，打牢全国各旅人民团结奋斗的思想道德基础。\n\n二、体现文学的主导价值，要遵循文学自身的规律\n\n体现文学的主导价值，要坚持文学发展的正确方向和方针，遵循文学发展的艺术规律，在文学价值的多样性中体现主导性，把弘扬主旋律与提倡多样化统一起来，在文学创作上提倡不同形式和风格的自由发展，在文学理论上提倡不同观点和学派的自由讨论。从作家方面来说，作家在对现实生活作出价值评判时，需要掌握时代精神，把握先进文化的前进方向。同时，要充分地重视文学的艺术特征和审美特性，用艺术的方式回答时代的问题。历史经验表明，文学事业“最不能作机械划一，强求一律，少数服从多数”，它“必须保证有个人创造性和个人爱好的广阔天地，有思想和幻想、形式和内容的广阔天地”\n\n三、体现文学的主导价值，要正确处理市场经济的影响\n\n在市场经济条件下，随着市场这只“看不见的手”影响着文学活动的方方面面，文学价值取向的分化与失衡现象会时发生。人们对文学的精神追求、审美追求同各种利益之间发生矛盾和冲突，在个别时候、个别作品中，文学以外的因素对文学的价值取向甚至起到主导作用，把文学当作追逐利润的“摇钱树”、感官刺激的“摇头丸”、泄私愤或谋私利的手段和工具等。对这些新的问题和矛盾，需要认真加以研究和解决，文学要“在市场经济大潮面前耐得住寂寞、稳得住心神，不为一时之利而动摇、不为一时之誉而急躁，不当市场的奴隶，敢于向炫富竞奢的浮夸说‘不’，向低俗媚俗的炒作说‘不’，向见利忘义的陋行说＇不’”。", "keywords": "倡导正确的文学价值取向 遵循文学自身的规律 正确处理市场经济的影响", "note": "当下考查中可能会出现像这样的与时政联系较为密切的题目，需要大家有所准备。回答这道题目，要在把握文学主导价值的内涵和特征的基础上，密切联系中国当下文学发展的现实。所以对于向下一些比较重要的文学现象，大家还是要留意一下。", "framework": ""}, {"id": "23", "stars": 2, "title": "试述文学真、善、美价值的具体内涵", "body": "追求真、善、美，这是人类最鲜明的特性，也是人类不断发展进步的体现，文学承载着并在精神世界中实现着人类这种美好理想。文学价值，就要体现追求真、善、美。这是精神价值中的三种基本形式，也可以称作认识价值、道德价值和审美价值。人们接受文学作品，主要也是从这三种价值着眼的。\n\n一、文学价值的真\n\n文学价值的真，是指文学要通过合乎艺术规律的方式，将社会的真实状况、人生的真正面目、作家的真诚体验等表现出来。也就是在认识客观事物的本质和规律的基础上反映真实，表现真情，追求真理。文学的“求真”，所求的是一种从人的角度逼近生活的真。尽管它有时对反映的事物进行夸张或变形，但那往往是为了凸显事物的特征，仍会具有鲜明的认识价值并且构成其他价值的基础。\n\n二、文学价值的善\n\n文学价值的善，是指文学要反映对生命的尊重，对人性健康发展的追求对人类和平、幸福的向往，以及对人类与自然和谐关系的珍惜等。也就是在追求真理和进步的过程中与人为善，尊重、理解、关心和爱护人。文学中假如缺少了“善”，就难以感动人，而其潜移默化的教育价值也就无从谈起。文学的价值指向，一般来讲是不违背人类基本的“向善”“求真”的原则的。\n\n三、文学的价值的美\n\n文学有了真和善的内涵，再加上充沛的情感、形象的言说、创造性的形式和技巧等，便形成了一种更高形态的美-文学的艺术美。文学价值的美，是指文学在真和善相统一的基础上，满足人们对美的追求和需要，给人精神上的愉悦。它通过作家创作和读者接受的过程，具体地体现为语言美、形象美、精神美、意境美和形式美等。文学的美不但不违背现实美感中本来就有的情感愉悦、心境娱乐或生理快感，反而会有力地给予强化，使之成为人类精神活动的主要方式之一，产生巨大的精神与文化价值。\n\n不同时代、阶级和流派对文学真、善、美价值具体内涵的理解有所不同，马克思主义所肯定的文学真、善、美，反映着人类历史发展的进步方向，体现着广大人民群众的文化审美需求。", "keywords": "认识价值 道德价值 审美价值 反映进步方向 体现文化审美需求", "note": "从认识价值上来说，文学需要合乎规律、反映真实，因此要“真”；从道德价值上来说，要尊重生命、追求健康的发展，因此要“善”；从审美价值上来说，要真善统一、拥有精神的愉悦，因此要“美”。文学的真、善、美的内涵在不同时代有着不同的理解，我们谈论的是马克思主义所肯定的真、善、美。", "framework": ""}, {"id": "24", "stars": 2, "title": "谈谈你对文学中真、善、美价值统一的认识", "body": "文学中的真、善、美三者在本质上是一致的，是一个相互联系、渗透的整体。在马克思主义文学价值论中，文学的真、菩、美价值被真正统一起来。\n\n一、文学追求真、善、美价值统一的原因\n\n文学价值的追求，从根本上说源自人对自由自觉活动价值的追求。文学价值之所以吸引读者，恰是由于其中蕴含着人类对“自由发展”“自由个性”等社会生活价值的向往和追求。文学活动和人的其他历史性活动一样，其自由追求必定体现出真、善、美的一致。尽管在具体的文学创作和接受中，其价值取向可能有所侧重，但文学价值结构的宏观形态始终是真、善、美统一的。\n\n因为，文学活动假如机械地、过分地、不经艺术处理地一味求“真”，就容易呆板、坐实，太实则死，没有灵气；假如教条地、脱离生活实际和接受可能地一味求“善”，充当政治或道德的传声筒，就流于空洞的说教，缺乏魅力；若单纯、片面、不问其他价值因素地一味求“美”，一味玩弄技巧，作品就容易变得苍白无力，流于形式、丧失精神。\n\n可见，“真”“善”“美”三者虽然各具独特价值取向，但是又不可能完全相互脱离而独立。对于杰出的文艺作品而言尤为如此，应努力实现以美启真，以美储善，以美育人。\n\n二、如何做到真、善、美价值统一\n\n在马克思主义看来，文学真、善、美的价值评判，文学是否做到了真善美价值的统一，不能靠少数人的主观好恶，而要接受广大人民群众的评判，要接受历史实践的检验，要把人民作为文艺审美的鉴赏家和评判者。\n\n一部作品要做到真、善、美价值的统一，要对社会关系作了切近而深刻的反映，要以合乎人性的情感化心理体验去表现现实的内容，要以纯洁高尚的境界来净化和塑造读者的灵魂。同时，还要看它是否真正实现了文学在艺术技巧上的创造、虚构想象上的开拓、情感体验上的推进。一部做到真、善、美价值统一的作品，不仅仅是历史进程的参与者，而且还具有一定的批判意识和前瞻意识。对于今天的文学来说，一部作品要做到真、善、美价值的统一，要体现人民本位观，呈现出中国特色、中国风格、中国气派。", "keywords": "相互联系、渗透 原因 自由追求 真、善、美的一致 实现方法 人民本位观 中国特色 中国风格 中国气派", "note": "文学真、善、美价值可以说是与当下社会实际联系比较密切的一个考点，不过马工程对此论述比较简单，无论是真、善、美价值的内涵，还是三者的统一，都只是一笔带过，如果大家想要更深入了解这部分内容的话，可以去参考童庆炳版教材中文学创造的价值追求这一章。", "framework": ""}, {"id": "25", "stars": 3, "title": "试述文学的基本功能及其之间的关系", "body": "一、文学的基本功能\n\n文学的功能有很多，最基本的有认识功能、教育功能、审美功能和娱乐功能，此外还有凝聚功能、益智功能、心理补功能等。\n\n（一）文学的认识功能\n\n文学的认识功能，是指文学具有帮助人了解一定时代和民族的社会生活状况，获得社会和人生知识，加深对人和社会解的功能。文学是社会、历史和人生的“百科全书”，是人们获得社会生活知识的重要渠道。文学不仅可以通过“再现现实而充当“生活的教科书”，还可以帮助人们观风俗、晓人情。\n\n（二）文学的教育功能\n\n文学的教育功能是指文学作品具有影响思想情感、净化心灵世界、增强生活勇气和信心的功能。广义地讲，文学的教育功能还包括文学具有政治的、社会的、伦理道德的启蒙和教化功能。\n\n文学的教育功能，实质上就是一种提升和净化人的心灵的功能。正是在这一意义上才可以说，文学是疗治社会与心灵的良药，它使人向“完整的人”和“丰富的人”的方向迈进。我们强调文学的教育功能，目的就是要使作家和读者都产生社责任意识和自我提高意识。\n\n（三）文学的审美功能\n\n文学的审美功能，是指文学具有沟通文学活动中主体与客体的美感和情感需求，使人获得精神对现实的超越、实现审理想，推动促进个性和才能的自由而全面发展的功能。作为一种语言艺术，文学主要是为了满足人的审美需求而存在和发票的，因此，从根本意义上讲，审美是文学最基本的功能。由于语言的智慧与韵味、形式的别致与优雅、情感的真挚与动人.形象的杰出与光彩等因素，文学可以让人产生直接的审美感受。\n\n（四）文学的娱乐功能\n\n文学的娱乐功能指的是文学可以给人带来身体快适、心情愉悦、精神自由的功能。文学的娱乐功能和文学的认识、教育和审美功能不仅不矛盾，而且是相互贯通、相互影响的。读者阅读一首诗歌或一部小说，主观动机并不在于直接获取某一门类的知识，也不是为了接受作家的训诫，而往往是为了获得身心的愉悦和心理的满足。作家在创作中也存在游戏、娱乐的动机。\n\n二、文学基本功能之间的关系（文学功能的整体性）\n\n文学的功能不是孤立存在的，各种功能都相互联系、相互渗透，具有整体性，体现在文学对人的情感、理想、信念、道德、人格等方面潜移默化的影响。文学的认识、教育、审美和娱乐功能的区分，只是从相对的意义上讲的。实际上它们并不截然分离和单独发生作用。文学的各种功能是相互关联着的，有时候相互促进，有时候相互冲突，有时则相互转化，共同成了一个繁复的文学功能系统。\n\n（一）文学的审美功能是文学功能的核心。这可以从两个方面加以理解：\n\n（1）文学的审美功能实际上是文学实现其他功能的中介。因为无论是认识、教育功能，还是娱乐及其他的功能，在文学中都是通过读者不同程度的审美体验才能得以实现的。文学提供给读者的不是抽象的概念系统，而是动人的情感世界和具体的文学形象，这就内在地决定了读者从一开始就必须采取与之相适应的美感接受方式。这样，审美就成了读者把握文学形象及思想内涵的主要通道，成了将作家对人生的体验和感悟转化为读者精神财富的必经之途。\n\n（2）文学的审美功能是以情感为中心的整体性概念，它是文学各种功能协调统一的重要条件。\n\n因此说，文学的审美功能不仅表现在其他各种功能在内容上都渗透和蕴含着情感体验的审美因素，具有审美的意义与征，而且表现在其他各种功能都统一于审美，都要以审美为旨归。\n\n（二）文学教育功能需要通过文学审美和娱乐功能实现\n\n我们强调文学的教育功能，但要防止片面性。那种纯粹从道德意义上看待文学的观点，有其片面性。一味地强调道德化功能，对文学作品的自由想象会起到阻碍的作用。重要的是，文学作品的任何教育功能都必须通过文学的审美和娱乐功去实现。\n\n文学的道德教育与一般的道德教育是有区别的。文学借助人物形象赋予道德内容，除了要对道德进行美感审视以外，还须将道德理性成功地情感化，并使之转变为形象，这涉及一些重要而复杂的创作环节。但转化之后，道德的说服力就由直接变为间接，由急切的规约变为潜在的感化，也只有这样，文学的道德教育功能才能得以很好地实现。\n\n（三）文学的娱乐功能有助于文学其他功能的实现\n\n文学价值的实现不能靠强制的手段。所以，好的文学作品常常是“寓教于乐”，就是把文学的教育功能渗透在娱乐功能与审美功能当中，如通过富有吸引力的人物形象和故事情节使人获得认识，受到教育。", "keywords": "基本功能 认识功能 教育功能 审美功能 娱乐功能 整体性 审美功能 核心 中介 重要条件 文学教育功能需要通过文学审美和娱乐功能实现 文学的娱乐功能有助于文学其他功能的实现", "note": "文学功能这部分内容是在考查中出现频率相对较高的一部分内容，其中文学的四个基本功能都有可能出名词解释，大家可以结合后面的内容进行准备。相较而言，文学功能的整体性这一部分在考查中出现的频率更高，并且往往会结合孔子“兴观群怨”的论述出题，大家对此也要有所准备。", "framework": ""}, {"id": "26", "stars": 2, "title": "谈谈你对文学认识功能的认识", "body": "文学的认识功能，是指文学具有帮助人了解一定时代和民族的社会生活状况，获得社会和人生知识，加深对人和社会理解的功能。文学是社会、历史和人生的“百科全书”，是人们获得社会生活知识的重要渠道。文学不仅可以通过“再现现实”而充当“生活的教科书”，还可以帮助人们观风俗、晓人情。\n\n一、文学认识功能的特征\n\n文学的认识功能主要不在于探求客观真理，而在于用艺术的形式实现对人与世界真实关系的把握。文学认识有自己的特点，它不是概念化和抽象的。文学所有的知识性因素都含寓于形象与情感深处，比较含蓄、丰富、细腻，须经过品味和思考去感受和体验，而非直接的认知。这种经由品味思考得到的对人生感悟、社会规律的体认，往往又由于人的阅历不同而呈现多样化，富于开放性。\n\n二、文学认识功能的实现途径\n\n（一）就作家方面来说，文学的认识功能是通过作家在饱含情感的审美状态中进行文学创作来实现的。文学认识功能往往是在审美知觉、情感状态下发生和实现的。\n\n（二）就读者方面来说，文学的认识功能是通过读者在审美活动中获得的体验来实现的。由于文学用艺术形象来反映、表现社会人生，比其他社会意识形式展示世界的方式更具体、细致、丰富和心灵化，所以，对人的认识作用也往往更直观和深入。尤其是现实主义的作品，能够提供特定社会生活的具体生动的完整画面，能使读者犹如身临其境地认识自己熟悉的或未曾亲历过的人生图景，这种认识不一定具有社会科学的系统性，但具有社会科学所没有的实在、生动、形象和丰富性。\n\n三、文学认识功能的意义\n\n优秀的文学作品往往能够透露出社会变革的信号，其认识意义常常在于能把某一时代的特定社会历史内容和未来趋势从艺术上加以吸收和改造，从而概括出时代的本质。在此意义上可以说，“在人类发展的每一个重大历史关头，文艺都能发时代之先声、开社会之先风、启智慧之先河，成为时代变迁和社会变革的先导”。“春江水暖鸭先知”，作家往往能用敏锐的艺术感，让不易觉察的东西被觉察，使习以为常的东西显得不凡，由不被注意的东西引发思索，促使人们在生活的量的缓慢积累中认出质的变迁。", "keywords": "特征 含蓄、丰富、细腻 多样化 开放性 实现途径 作家 文学创作 读者 审美活动 意义 概括时代的本质", "note": "文学的认识功能就是要获得对世界的认识、加深对世界的理解，不仅再现生活，还能高于生活，用艺术的形式实现对人与世界的把握；作家则饱含情感地创作，读者则进行审美活动并获得美的体验，最后呈现出来的作品或许还是社会变革的信号。", "framework": ""}, {"id": "27", "stars": 2, "title": "谈谈你对文学教育功能的认识", "body": "文学的教育功能是指文学作品具有影响思想情感、净化心灵世界、增强生活勇气和信心的功能。广义地讲，文学的教育功能还包括文学具有政治的、社会的、伦理道德的启蒙和教化功能。\n\n一、文学教育功能的目标\n\n文学的教育功能，实质上就是一种提升和净化人的心灵的功能。正是在这一意义上才可以说，文学是疗治社会与心灵的良药，它使人向“完整的人”和“丰富的人”的方向迈进。强调文学的教育功能，目的就是要使作家和读者都产生社会责任意识和自我提高意识。因为作家在文学作品中，总是寄托一定的社会理想与审美观念，表现出自己对生活的态度与评价。一个优秀的作家要通过自己的文学作品，向读者展示什么是好的，是值得赞美的；什么是坏的，是应该批评的人生态度和文学观念。\n\n二、文学教育功能的表现\n\n从一定意义上看，文学是人类生存、活动、交往和展示自己的充满情感的“教科书”。文学的教育功能表现在道德、伦理、教化、政治、美育、人生等多个方面。它可以“补察时政”“泄导人情”；可以“托事以讽”“有补于国”。这是由文学的社会意识形态属性所决定的。文学理论上的“劝谕说”和“教训说”等，就是基于文学的教育功能而提出的。\n\n三、文学教育功能的实现\n\n（一）文学教育功能需要通过文学审美和娱乐功能实现\n\n我们强调文学的教育功能，但要防止片面性。那种纯粹从道德意义上看待文学的观点，有其片面性。一味地强调道德教化功能，对文学作品的自由想象会起到阻碍的作用。重要的是，文学作品的任何教育功能都必须通过文学的审美和娱乐功能去实现。\n\n文学的道德教育与一般的道德教育是有区别的。文学借助人物形象赋予道德内容，除了要对道德进行美感审视以外，还须将道德理性成功地情感化，并使之转变为形象，这涉及一些重要而复杂的创作环节。但转化之后，道德的说服力就由直接变为间接，由急切的规约变为潜在的感化，也只有这样，文学的道德教育功能才能得以很好地实现。\n\n（二）需要对道德的历史性和时代局限性有审视能力\n\n道德是一个历史范畴，具有时代性。文学作品要想通过打动读者实现一定的道德教育目的，就要求它对道德的历史性和时代局限性有审视能力。如汤显祖的《牡丹亭》就在某种程度上唱出了女性的自我觉醒和人性自由的赞歌。这种超越于历史局限之上的道德眼光，使《牡丹亭》具有震撼人心的教育力度。\n\n（三）植根于文学与生活之间的内在联系\n\n文学的教育功能与文学表现的内容应当是一致的。如爱国主义教育是文学作品的一个永恒主题。我国历代诗人、作家，描绘祖国河山的壮丽，人民的勤劳，歌颂那些抵抗异族侵略、为国家民族自由独立而献身的英雄，表达对人民、对民族光荣历史的挚爱以及对未来美好理想的追求，就是文学中爱国主义的集中表现。\n\n文学的教育功能植根于文学与生活之间的内在联系，主要有两方面：一方面在于文学反映和表现的对象本身具有教育意义，另一方面在于文学对生活的反映和表现中渗透着作家爱憎臧否等思想感情倾向与审美判断，自然形成对读者的影响力和吸引力。", "keywords": "目标 社会责任意识 自我提高意识 表现 多个方面 实现 通过文学审美和娱乐功能实现 对道德的历史性和时代局限性有审视能力 植根于文学与生活之间的内在联系", "note": "文学的教育功能，指的是文学的启蒙和教化功能。对于文学教育功能的重视，是在中国文学史上绵延了许久的一个文学传统，从孔子的“诗可以兴”到白居易的“补察时政”“泄导人情”再到现代文学史上鲁迅等人将文学作为启蒙的工具，都可以体现出对文学教育功能的认识。", "framework": ""}, {"id": "28", "stars": 2, "title": "谈谈你对文学审美功能的认识（25华南师范大学）", "body": "文学的审美功能，是指文学具有沟通文学活动中主体与客体的美感和情感需求，使人获得精神对现实的超越、实现审美理想，推动促进个性和才能的自由而全面发展的功能。作为一种语言艺术，文学主要是为了满足人的审美需求而存在和发展的，因此，从根本意义上讲，审美是文学最基本的功能。由于语言的智慧与韵味、形式的别致与优雅、情感的真挚与动人、形象的杰出与光彩等因素，文学可以让人产生直接的审美感受。\n\n一、文学审美功能的特征：历史性\n\n文学的审美功能具有历史性，是一个历史的范畴。这是因为文学审美意识和审美心理的特征不是固定不变的，而是发展变化的。审美在本质上是自由的、变化无穷的，因而也就决定了文学审美功能在历史上是多种多样的，决定了文学审美功能在不同时期和不同的人群中会有不同的表现。\n\n二、文学审美功能的作用\n\n（一）文学功能的核心\n\n文学的认识、教育、审美和娱乐功能的区分，只是从相对的意义上讲的，实际上它们并不截然分离和单独发生作用。文学的各种功能是相互关联着的，有时候相互促进，有时候相互冲突，有时则相互转化，共同构成了一个繁复的文学功能系统。其中，文学的审美功能往往发挥更基本、更核心的作用。这可以从两个方面加以理解：\n\n（1）文学的审美功能实际上是文学实现其他功能的中介。因为无论是认识、教育功能，还是娱乐及其他的功能，在文学中都是通过读者不同程度的审美体验才能得以实现的。文学提供给读者的不是抽象的概念系统，而是动人的情感世界和具体\n\n的文学形象，这就内在地决定了读者从一开始就必须采取与之相适应的美感接受方式。这样，审美就成了读者把握文学形象天思想内涵的主要通道，成了将作家对人生的体验和感悟转化为读者精神财富的必经之途。\n\n（2）文学的审美功能是以情感为中心的整体性概念，它是文学各种功能协调统一的重要条件。\n\n因此说，文学的审美功能不仅表现在其他各种功能在内容上都渗透和蕴含着情感体验的审美因素，具有审美的意义与特征，而且表现在其他各种功能都统一于审美，都要以审美为旨归。\n\n（二）促进人的审美发展\n\n文学作品能满足人的审美需要，其原因在于它是作者按一定的审美理想和美的规律对来自现实生活中的素材加工改造的产物，文学形象相较于现实事物更集中、更独特、更典型、更普遍、更有情感性，当人们欣赏文学作品的时候就会获得更为强烈、更为丰富、更为深刻、更为迷人的审美感受，就会得到更大的精神上的愉悦和满足。文学审美功能对提高人的审美能力、丰富审美情趣、健全审美观念、升华精神境界、优化心理结构，发挥着十分重要的作用。", "keywords": "特征 历史性 作用 文学功能的核心 中介 重要条件 促进人的审美发展", "note": "文学的审美功能是指文学可以满足人的审美需求，使人获得精神的超越，实现审美的理想，促进个性和才能的自由全面发展的功能，是文学最基本的功能，发挥着最核心的作用。审美是实现其他功能的中介，是以情感为中心的整体性概念，有助于文学各种功能的协调统一。", "framework": ""}, {"id": "29", "stars": 2, "title": "谈谈你对文学娱乐功能的认识", "body": "文学的娱乐功能指的是文学可以给人带来身体快适、心情愉悦、精神自由和情欲宣泄的功能。\n\n一、文学娱乐功能的主要特点是让接受者产生生理和心理的快乐感\n\n文学的娱乐功能和文学的认识、教育和审美功能不仅不矛盾，而且是相互贯通、相互影响的。读者阅读一首诗歌或一部小说，主观动机并不在于直接获取某一门类的知识，也不是为了接受作家的训诫，而往往是为了获得身心的愉悦和心理的满足。作家在创作中也存在游戏、娱乐的动机。文学在它的源头上就与娱乐有着不解之缘。\n\n二、文学娱乐功能的内涵\n\n在文学的功能系统中，娱乐功能的内涵是多方面的。\n\n（一）文学的娱乐功能具有生理满足的意义，并主要是一种想象化的满足。一般来说，富于细节的生活体验的真切表达，就能达到这种效果；巧妙地运用形式因素，通过和谐的音韵、节奏、幽默俏皮的语言、引人入胜的结构等，也能产生这种效果.\n\n（二）文学的娱乐功能有着益智的特点。那些注重娱乐功能的成功作品，往往建立在某种独特的生活“技能”层面之上，展示一种接近甚至超过专业水平的技能，如武术、侦探、推理、谋略、车技、棋艺、画法等，这是娱乐益智的重要内容。某些式侠小说之所以获得一定的文学地位，既与其“俗中有雅”的特点以及厚实的文化背景有关，也与其武侠武艺方面的娱乐益智性赢得广大读者喜爱有关。\n\n（三）文学的娱乐功能有助于文学其他功能的实现。文学价值的实现不能靠强制的手段。所以，好的文学作品常常是“寓教于乐”，就是把文学的教育功能渗透在娱乐功能与审美功能当中，如通过富有吸引力的人物形象和故事情节使人获得认识，罗幻教育。\n\n（四）文学的娱乐功能最终应该指向精神的陶冶。文学作品如果始终徘徊于生理和心理的浮泛满足，便会堕入哗众取宠、令人生厌的境地。当然，文学作品的娱乐性与文学作品的严肃性，不是截然对立的。经过恰当的艺术处理，娱乐性完全可以寓于严肃性之中。文学的娱乐性与严肃性巧妙结合乃至水乳交融，恰是一种精湛的艺术境界。", "keywords": "主要特点 快乐感 内涵 生理满足 想象化满足 益智 有助于其他功能实现 指向精神的陶冶", "note": "文学的娱乐功能指的是文学使人身心愉悦的效果，需要提醒大家的是，在当下“娱乐至死”的环境之中，文学的娱乐功能显然被放大了，因此在考查中可能会让大家结合当下的文学现状谈谈该如何正确对待文学的娱乐功能，对此大家要有所准备。", "framework": ""}, {"id": "30", "stars": 4, "title": "试梳理文学创作的过程", "body": "文学创作，是指作家从产生创作动机和创作冲动到完成艺术构思和艺术传达的过程。这也是一部文学作品从内在心理体验到外在形式的形成过程。这一过程，主要包括以下环节：\n\n一、创作动因\n\n创作动因是指作家生活体验积累到一定程度时产生的创作内驱力，包括创作动机和创作冲动，这是文学创作的开端。\n\n（一）创作动机\n\n在文学理论中，创作动机是指作家从事具体创作活动的目的。作家或有某种思想感情需要传达，或要赞美、批评某种现存事物，或要呼唤某种新的社会变革等，心中有所郁积或触动，不吐不快，于是产生了创作动机。创作动机不仅仅起到激励作家进入创作过程的作用，而且在整个创作过程中都起着重要影响，甚至左右着作品的风格与基本价值取向。\n\n（二）创作冲动\n\n创作冲动是作家进入创作过程的迫切愿望和心理躁动。创作冲动与创作动机既有联系又有区别。一位作家怀有某种创作动机，但可能许多年也没有产生创作冲动，未能将创作动机实现为创作行为；创作冲动则不能离开创作活动而长时间存在下去，它常常稍纵即逝，倏忽来去。正是创作冲动推动着作家进行文学创造活动，没有创作冲动也就不会产生文学创作活动。\n\n二、艺术构思\n\n艺术构思是指作家在创作动机的指引和创作冲动的驱使下，运用艺术概括手段塑造艺术形象、构织故事情节、形成完整的艺术世界的思维过程。\n\n（一）艺术构思的过程\n\n艺术构思是文学创作过程中的核心环节。在大多数作品特别是叙述作品中一般都有如下过程：\n\n（1）形成作品整体构架。\n\n（2）设计具体艺术形象。\n\n（3）安排情节的演变。\n\n（二）艺术构思的主要方式\n\n艺术概括是指创作主体对选定的材料进行艺术加工从而形成艺术形象的过程，是生活素材上升为艺术形象的必经之途。艺术概括包括艺术综合、艺术简化和艺术变形三种方式。\n\n三、语言呈现\n\n语言呈现是作家将构思成熟的艺术形象用语言表达出来的过程，这是创作过程的最后阶段。经过作家的精心构思，艺术形象与整个艺术世界已初具规模，只不过它还是作为作家的“内在世界”而存在。它要成为可供读者欣赏的文学作品，还需要用语言呈现出来。在此过程中，主要涉及语言传达的功夫。概括来说，文学创作中的语言运用需要考虑下列几点：\n\n（1）恰如其分。\n\n（2）富有表现力。\n\n（3）追求独创性。", "keywords": "创作动因 创作动机 创作冲动 艺术构思 过程 主要方式 语言呈现", "note": "文学创作这一过程在考查中出现的频率不低，除了会直接考查之外，还可能会结合文论或某些作家的观点让大家进行分析，这一节涉及的文论或文学观点大家要注意一下，这一部分中涉及的内容在之后都会详细展开，所以这里写得较为简略，大家可以结合后边的内容进行掌握。", "framework": "创作动机 创作动因 创作冲动 艺术构思的过程 艺术构思 文学创作的过程 艺术构思的主要方式 恰如其分 语言呈现 富有表现力 追求独创性"}, {"id": "31", "stars": 3, "title": "谈谈你对创作动机的认识", "body": "在文学理论中，创作动机是指作家从事具体创作活动的目的。作家或有某种思想感情需要传达，或要赞美、批评某种现存事物，或要呼唤某种新的社会变革等，心中有所郁积或触动，不吐不快，于是产生了创作动机。\n\n一、创作动机的构成因素\n\n作家既是个体的人又是社会的人，既是个体言说者又是某种社会力量的代言人。因此创作动机的构成因素主要分为两种。\n\n（一）创作动机的个体性因素\n\n创作动机的个体性因素是指驱使作家创作的那些个人生活经历或心理体验需求。对于作家的创作而言，个人的童年经历、精神创伤、阅历与见闻等都可以成为重要的动机因素。\n\n需要注意的是，仅仅从单一动机出发从事文学创作的情况大约是极少的。即使是个体性创作动机，也不是单一因素，而是由许多因素综合构成的，这其中既有精神性因素也有实用性因素。这些因素交织在一起，构成促使作家进行创作活动的强大的心理驱力。\n\n（二）创作动机的社会性因素\n\n创作动机的社会性因素是指驱使作家创作的那些非个人需求。文学创作诚然是独立性很强的个体精神活动，但由于作家无不生活在社会关系的网络中，受到社会制约，这就使得创作动机除了个体性因素外，还具有社会性因素。文学创作实际上是一种由个体性面貌呈现的社会性行为。在某些社会状态下作家会挺身而出，明确表示要代表社会言说，充当社会的“良心”或某个社会集团的代言人。\n\n二、创作动机对创作过程的影响\n\n创作动机不仅仅起到激励作家进入创作过程的作用，而且在整个创作过程中都发挥着重要的影响，甚至还左右着作品的风格与基本价值取向。\n\n（一）影响文学作品的内容\n\n一部作品内容的深广程度，具有什么样的价值取向，一定程度上取决于作家的创作动机。以商业利益为主导动机的作家，所写作品往往尽力迎合读者趣味从而能够增加销量。以文化启蒙或改造世界为己任的作家，则常常意在歌颂真理和革命的力量，从而在作品中展示出深刻的历史与现实内容。\n\n（二）影响作家对创作技巧的选择\n\n创作技巧是在创作动机指导下选择和运用的。不同的创作动机会导致作家选择和锤炼不同的创作技巧。如果一位作家的创作动机主要在于建构新的创作风格，那么，他就会在形式方面绞尽脑汁，力求对前人有所突破。\n\n（三）影响文学作品的风格\n\n如果作家的创作动机是揭露社会丑恶现象，对不合理的现实进行控诉，那么作品就常常表现出凝重、悲凉或深沉的风格，如杜甫在“安史之乱”之后的诗歌。如果形式上的独创性成为作家创作的主导动机，他的作品就力求给人以新奇之感，西方和中国现当代的“先锋派”作家都是如此。", "keywords": "构成因素 个体性因素 社会性因素 影响 内容 创作技巧的选择 风格", "note": "在这里大家首先需要明确一下创作动机与日常生活中的动机的区分。创作动机主要受到作家个人和社会两方面的影响，并且对文学的创作过程产生了重要的作用。这一概念是名词解释中常出的内容，此外，创作动机对创作过程的影响这部分可能单独出题，大家也要注意一下。", "framework": ""}, {"id": "32", "stars": 2, "title": "谈谈你对创作冲动的认识", "body": "一、创作冲动的定义\n\n创作冲动是作家进入创作过程的迫切愿望和心理躁动。创作冲动与创作动机既有联系又有区别。一位作家怀有某种创作动机，但可能许多年也没有产生创作冲动，未能将创作动机实现为创作行为；创作冲动则不能离开创作活动而长时间存在下去，它常常稍纵即逝，倏忽来去。正是创作冲动推动着作家进行文学创造活动，没有创作冲动也就不会产生文学创作活动。\n\n二、创作冲动的主要特征\n\n创作冲动的特征可以从三个方面来理解：\n\n（一）创作冲动是一种具有主导性的朦胧的情绪体验\n\n宗白华对城市“喘息”之声的感觉，是那一刻占据他心灵的朦胧情绪所造成的纯粹主观感受，类似于幻觉。这种朦胧的情绪体验来源于诗人的心灵深处，诗人只能体验到它们的存在，却无法说出它们从何处来，向何处去。\n\n（二）创作冲动是一种复杂的和升华了的情绪\n\n创作冲动并不是某种单一的情绪，而是一种综合性的复杂情绪。它“似惆怅，又似喜悦，似觉悟，又似恍惚”。作家在处于现实的愤怒或痛苦的情感中时，心理状态会与常人毫无二致。当这种愤怒或痛苦情感转化成创作冲动时，它们已经发生了根本性的变化：它们不再是现实的日常情感，而成了被再度体验的情感了。这一对情感再度体验的过程就像净化器一样，使这些情感得到升华，而且这种情感还与其他情绪记忆相混合，从而成为宗白华所体验到的那种朦朦胧胧、似真似幻的情感，这也就是所谓艺术情感，\n\n（三）创作冲动总是指向作家的内心世界\n\n按照宗白华描述的创作经验，在创作冲动产生后，他的全部注意力实际上都集中于自己的内心。他所提到的“大城”并不是纯客观存在，而是他内心世界的意象。创作冲动将作家的注意力引向自己的心理现实，从而使他按照一种内在逻辑思考、体验。创作冲动的这种内在性使整个创作过程都成为一个作家自我体验的过程。外部世界的一切人和事都要经过作家的体验才能进入文学创作乃至其作品之中。", "keywords": "定义 迫切愿望 心理躁动 主要特征 主导性的朦胧的情绪体验 复杂的和升华了的情绪 指向作家的内心世界", "note": "在这里大家首先需要明确一下创作动机与创作冲动的区别，简单来说，创作动机是创作活动的目标，总体是明确的；而创作冲动是一种情感，是朦胧而无法把握的。前者持续时间很长，而后者常常是稍纵即逝。前者的作用是对创作过程产生重要影响，而后者的作用则主要是开始创作过程。在考查中可能会将二者放在一起对比，大家可以结合这两部分的具体内容进行分析。创作动因是指作家生活体验积累到一定程度时产生的创作内驱力，是文学创作的开端，创作动机和创作冲动都是创作动因的重要组成部分。", "framework": ""}, {"id": "33", "stars": 4, "title": "谈谈你对艺术构思的认识", "body": "艺术构思是作家在创作动机的指引和创作冲动的驱使下，通过艺术直觉、情感、想象、理解等心理活动，以艺术综合、简化、变形等构思方式，孕育艺术形象序列或意念心境、构织故事情节、形成完整的艺术世界的思维过程。\n\n一、艺术构思的过程。\n\n（一）形成作品整体构架\n\n艺术构思有时可能是一个“由小到大”“由局部到整体”的过程，有时则可能是“由大到小”“由整体到局部”的过程。作家最初往往先对作品整体面貌有个大致设计，形成一个大体轮廓。当然，首先出现的整体情景不可能很清晰，而多是朦胧的感觉或意象，直到作品完成后才趋于清晰。\n\n（二）设计具体艺术形象\n\n当整体上有了大致构思后，具体的艺术形象设计就是最重要的了。如在叙事作品中，主要就是人物形象的设计。他的肖像、衣着、动作、性格如何，甚至有何癖好，都应有详细的构想。在这里经常出现的情况是，作家首先注意的是人物的某种特征，然后再围绕这一特征来想象他的言行举止。当然，最初设计的人物形象及命运有时会随着创作上的深入而发生较大变化，甚至是根本性改变。\n\n（三）安排情节的演变\n\n在叙事作品中，当人物形象已经有了大致眉目后，所要做的就是让他行动起来，即场面与情节的形成。在情节构思中作家最为关心的不仅仅是故事情节本身是否合情合理的问题，更重要的是这情节是否能够与他所设计的人物的性格相吻合的问题。在最初构思中，故事情节已有了大致的梗概，这时则需要填补细节了。故事情节的突然改变也是常有的事情：作家改变初衷，以一种新的方式安排情节。不过，这种情况一般都是基于对人物形象设计的重要改变或对主题的深入挖掘而发生的。\n\n在实际的文学创作过程中，艺术构思的这三个步骤是紧密相连而难以分解的，并不一定有先后次序。而在某些抒情类文学作品中，也不见得定要有艺术形象或情节的演变，而很可能是一时心境或情绪的表达。\n\n二、艺术构思的主要方式：艺术概括\n\n艺术概括是指创作主体对选定的材料进行艺术加工从而形成艺术形象的过程，是生活素材上升为艺术形象的必经之途。一般来说，艺术概括包括艺术综合、艺术简化和艺术变形三种方式。\n\n（一）艺术综合\n\n艺术综合是作家对各种材料进行重新组合从而形成完整艺术形象的过程。作家很少完全如实地记录生活经验，而是要通过艺术综合去创造出既有普遍性又有个性特征的艺术形象来。艺术综合还表现在，一些作家常常将生活中在许多人身上发生过的事情集中在一个人物身上，使之更具代表性。\n\n（二）艺术简化\n\n艺术简化是作家对材料进行简略化处理的过程。作家对所写事件和人物有时只用寥寥几笔就将其特征勾勒出来，而对大量无关紧要的细枝末节则几乎完全省略。艺术简化是一切文学艺术创作都必不可少的手段，因为任何创作都不可能将生活中发生的一切全部写进作品中，只能是抓住重点，突出特征。作家往往根据不同的需要，对有些事件人物的描写浓墨重彩，文字密度很大，而对另一些事件、人物的描写就十分简略，只是勾勒出大体轮廓而已。\n\n（三）艺术变形\n\n艺术变形是作家有意将描写对象用不同于生活常态的变异形式表现出来，以达到某种艺术效果的过程。变形是现代派文学的主要创作手法之一。实际上，由于作家创作出的审美世界不会也不能简单照搬生活常态，多少都会做变形处理，所以艺术变形也是文学构思的基本方式之一。", "keywords": "过程 形成作品整体构架 设计具体艺术形象 安排情节的演变 主要方式 艺术概括 艺术综合 艺术简化 艺术变形", "note": "艺术构思的过程是用艺术概括的方法，例如综合、简化、变形等等，先形成框架，再设计形象，最后让形象活动起来，串联成场面和情节。艺术构思的过程和主要方式都有可能单独出题，大家要注意灵活应对。同时，这部分涉及的一系列概念，像是艺术概括、艺术综合这些，都可能在名词解释中出现。", "framework": ""}, {"id": "34", "stars": 3, "title": "谈谈你对文学创作过程中语言呈现的认识", "body": "语言呈现，是作家将构思成熟的艺术形象用语言表达出来的过程。这是创作过程的最后阶段。经过作家的精心构思，艺术形象与整个艺术世界已初具规模，只不过它还是作为作家的“内在世界”而存在。它要成为可供读者欣赏的文学作品，还需要用语言呈现出来。在此过程中，主要涉及语言传达的功夫。概括来说，文学创作中的语言运用需要考虑下列几点：\n\n一、恰如其分\n\n作家心中之情、眼中之景都要靠文字呈现于作品，故而选词觅句就显得十分重要。如何才能找到最恰当的词语来表情达意是作家们苦思冥想的事。福楼拜认为，写作的才能主要看选择词语，因为对于表现一个动作或事物来说，只有一个词是最恰当的，好的作家就善于找到这个词语。他写作长篇小说《包法利夫人》，用了近五年的时间推敲每一个字句，可谓不厌其烦、精益求精。选择词语也不仅仅是语言与所表现之物是否相符的问题，而且还是词语在读者心目中能够产生怎样效果的问题。高明的诗人善于利用词语在读者心中激发起某种他所希望的情绪或感觉，从而构成一种既定的艺术效果。\n\n二、富有表现力\n\n语言的恰如其分本身还不是作家的终极目的所在。作家寻词觅句，最终目的还是将自己内心世界中经过再度体验的情感、朦朦胧胧的意象，以及某种意念等完整而准确地向读者表现出来。读者的日常情感由此受到激发，升华为审美情感。古人把诗人内心世界的蕴涵比喻为“鱼”，把语言技巧比喻为“筌”，提倡“得鱼忘筌”，也正是指语言不是目的，通过语言使内心世界得到表现并激发读者的审美情感才是目的。无论采取怎样的方式，能够使人从词语形式和技巧中直接体验到（或者说产生出）某种意味或情感蕴涵，是作家们在文学创作中所普遍追求的目标。\n\n三、追求独创性\n\n语言表达要有自己的特色，给人以新奇感，是作家在创作中的普遍追求。杜甫说“语不惊人死不休”，讲的就是这个道理。古今中外凡是称得上优秀作品的，其文学语言无不既有独特性又富于表现力。如李白的《梦游天姥吟留别》：“脚著谢公屐，身登青云梯。半壁见海日，空中闻天鸡。”诗语清奇，如珠落玉盘；想象瑰丽，若仙游山海，集中体现出李白特有的豪放诗风。在看似豁达、疏放的意境中，潜含不甘苟且的精神追求。", "keywords": "恰如其分 追求表现力 独创性", "note": "文学创作中的语言呈现这一部分内容相较于文学创作的前两个环节，整体在考查中出现较少，不过我们需要注意 一下这一部分课本中涉及的文论，无论是王国维的“隔”与“不隔”，还是苏轼的“胸有成竹”，都有可能在考查中出现，让大家去综合分析，这两个文论探讨的是文学创作中语言呈现这一环节，对此大家要明确一下。", "framework": ""}, {"id": "35", "stars": 4, "title": "谈谈你对艺术直觉的内涵及其与科学直觉、创造灵感关系的认识", "body": "一、艺术直觉的内涵\n\n在哲学和心理学中，直觉是指一种不依靠逻辑推理而获得知识的思维方式或能力。在美学和文学理论中，它常常被加上限制词，构成诸如“创造性直觉”“诗性直觉”“审美直觉”“艺术直觉”等概念。艺术直觉是指创作主体在瞬间直接把握客体审美意蕴的思维方式或能力。人们用这个概念来指称那种在艺术活动中区别于逻辑思维的独特的艺术思维。\n\n二、艺术直觉与科学直觉的异同\n\n（一）相同点\n\n科学直觉主要表现在一般认识活动与科学研究过程中。科学直觉的最大特点是不依靠概念、判断和推理的逻辑思维过程而能直接把握认知对象的性质和规律，它的结果常常是知识或科学发现，如牛顿从苹果落地感悟到万有引力。科学直觉具有直接的、无逻辑推理过程的、创造的等特征。作为艺术创造重要方式的艺术直觉也同样具有这些特征，在心理机制上与科学直觉有诸多相近之处。\n\n（二）不同点\n\n艺术直觉和科学直觉的差异，主要表现在三个方面：\n\n（1）科学直觉主要把握事物内在的特质或规律，艺术直觉则把握事物蕴含的审美价值。\n\n（2）科学直觉排斥个人偏见，艺术直觉则带有明显的个人主观色彩。科学直觉的任务是揭示对象的固有的客观属性，在这里个人偏见会破坏主体对对象的正确把握。艺术直觉则面对事物的审美价值，对不同的人来说，一件事物的审美价值是不尽相同的。\n\n（3）科学直觉较少带有情感色彩，艺术直觉则有着强烈的情感性。艺术直觉由于主要是对事物审美价值的把握，属于一种在情感而不是逻辑思维推动下的心理活动，所以它的发动必然以情感为基础。\n\n三、艺术直觉与创作灵感的联系与区别\n\n（一）艺术直觉与创作灵感的联系\n\n创作灵感，是创作主体在创作过程中情绪、想象力和创造力都极为活跃的特殊思维状态。创作灵感与艺术直觉有着十分密切的联系。创作灵感到来之时也就是艺术直觉能力充分展现之时。此时的创作主体浮想联翩，文思泉涌，下笔如有神助。\n\n（二）艺术直觉与创作灵感的区别\n\n艺术直觉与创作灵感有重要区别：艺术直觉是一种思维能力，是创作主体经过长期社会生活积累、文化知识学习创作实践锻炼而形成的艺术洞察力，具有较强的稳定性；创作灵感则是一种情绪与想象力的瞬间勃发状态，正如朱光潜先生所说：“灵感大半是由于在潜意识中所酝酿成的东西猛然涌现于意识。”【李凡关键词：内涵 瞬间直接把握客体审美意蕴 艺术直觉与科学直觉 相同点 直接的 无逻辑推理过程的 创造的 不同点特质或规律 审美价值 排斥个人偏见 个人主观色彩 较少带有情感色彩 强烈的情感性 艺术动机与创作灵感 联系 充分展现 区别 稳定性 瞬间勃发】\n\n【李凡说：艺术直觉这一概念是在名词解释中出现频率非常高的概念，大家在把握其特征时，可以将其与科学直觉和创作灵感进行对比，总体来看，艺术直觉和科学直觉一样，具有直接的、无逻辑推理过程的、创作的特征。同时，艺术直觉注重把握审美价值，具有主观色彩和强烈的情感性，此外还具有较强的稳定性。在考查中，科学直觉与艺术直觉的联系与区别可能单独出题，大家也要注意一下。】", "keywords": "", "note": "", "framework": ""}, {"id": "36", "stars": 4, "title": "试述艺术情感与日常情感的区别及其在文学创作中的作用", "body": "艺术情感是指作家在艺术创作过程中产生的、作为艺术创作动力和表现对象的态度和体验。艺术情感被很多作家视为文学创作及文学作品的灵魂。\n\n一、艺术情感与日常情感的关系\n\n人们在日常生活过程中产生的喜、怒、哀、乐等情感体验，可以称为日常情感。艺术情感与日常情感有联系也有区别。\n\n（一）艺术情感与日常情感的联系\n\n艺术情感是日常情感的升华，没有日常情感的基础也就不可能有艺术情感。\n\n（二）艺术情感与日常情感的区别\n\n艺术情感是“智慧的情绪”，不像日常情感那样使人全身心沉浸其中并与主体的个人利害得失直接相关，而是能够超越其束缚而上升到“智慧”的高度。所以，艺术情感虽然可能包含痛苦的因素，但归根结底还是一种审美的愉悦，是情感更集中、更强烈、更典型的体验，是作家、艺术家跨越实际生活的现实条件束缚而产生并升华了的、具有精神意蕴的情感。\n\n二、艺术情感在文学创作过程中的作用\n\n艺术情感在文学创作中的作用主要体现在如下三个方面：\n\n（一）艺术情感的表达需求构成了文学创作的重要动力\n\n从心理学角度看，人们的情绪必须经常得到释放，这是人的一种自我保护的本能。艺术创作本质上乃是一种情感宣泄与传达，是情感积累必然导致的结果。在这个意义上，同样可以说，没有情感宣泄就没有文学艺术创作发生。所不同的只是文艺创作与欣赏活动中的审美情感不能简单地通过日常情感的方式来宣泄。\n\n（二）情感的再度体验构成文学创作的核心\n\n作为艺术情感生成的重要环节，情感的再度体验是指主体对以往情感积累（情绪记忆）的唤醒、复现、回味和观照的过程。经过情感的再度体验，作家才把自己的日常情感转化为具有普遍性的艺术情感。所以，对情感积累的再度体验可以说构成文学创作的核心。\n\n（三）艺术情感是艺术形象的重要构成成分\n\n文学创作是作家将再度体验的情感转化为文学作品中具体形象的过程。艺术形象的形成是三种因素的组合：一是感性形式，它直接诉诸人们的感官；二是情感，即经过作家再度体验的艺术情感；三是理性因素，即作家的政治、伦理、宗教等意识形态观念及其他知识系统。在艺术作品中，情感、感性形式和理性是不可分拆的有机整体。在艺术创作过程中，由情感积累到艺术情感的升华是一条主线，其他因素都是围绕这条主线展开的。不能不说，情感在艺术创作中具有统摄作用。", "keywords": "艺术情感与日常情感 联系 升华 区别 具有精神意蕴 作用 重要动力 文学创作的核心 艺术形象的重要构成成分", "note": "和艺术直觉一样，艺术情感也是名词解释中经常出现的一部分内容，对此大家要重点掌握。对于艺术情感与日常情感的区别，我们主要是以了解为主，目的是明确艺术情感的产生原因及其特征。而艺术情感在文学创作过程中的作用这部分则可能单独出题，我们要重点掌握。", "framework": ""}, {"id": "37", "stars": 2, "title": "谈谈你对艺术想象的认识", "body": "艺术想象是文学创作的一个不可或缺的重要心理因素。按照心理学的解释，想象是指以原有表象或经验为基础创造新形象的心理过程。艺术想象是指文艺活动主体调动过去积累的记忆表象，通过艺术加工而创造艺术形象的心理过程。\n\n一、艺术想象的基本特征\n\n艺术想象的基本特征可以从以下两个方面来理解：\n\n（一）艺术想象具有超越时空的特性\n\n所谓“故寂然凝虑，思接干载；幽焉动容，视通万里”，即是说想象可以在活动的瞬间突破现实时间和空间的限制，纵览古今，驰骋内外。不过，任何想象总是以现实为基础。\n\n（二）艺术想象是形象与情感相互交织的过程\n\n一般来看，超越时空的自由不仅是艺术想象的特征，也是科学想象的特征。但与科学想象地趋于理智与客观不同，在艺术想象中，形象的再现、连接、改变和创造，总是与情感相互交织，如影随形。想象的发生缘于情感的驱动，想象的内涵受情感影响，想象的目的则是情感的表达。\n\n艺术想象是一个不断发展、变化的过程，并不是一蹴而就的。其间既有勃发，也有沉潜；既有热烈，也有平淡。从艺术想象的形象层面来说，需要不断地增减损益，以求形象鲜明、特征突出。从艺术想象的内涵层面来说，需要不断地提炼深化，以求涵蕴丰富、耐人寻味。\n\n二、艺术想象的类型\n\n艺术想象的分类可以从不同角度进行。根据想象活动的心理特点，可以分为有意想象和随意想象；根据想象内容，又可分为再现性想象与创造性想象。这里主要根据艺术想象在创作过程中所起的作用，分为三大类：再现性想象、创造性想象、相似性想象。\n\n（一）再现性想象\n\n再现性想象是主体对过去积累的记忆表象进行回忆的过程。这是艺术创作中最基本的心理能力。在进入创作过程之后，作家一般首先要极力调动记忆储备，将过去曾经亲眼所见的人和事重新在脑海里复现出来，从中寻找富有特征的、有表现价值的东西作为自己将要创造的艺术世界的基本材料。鲁迅对少年闰土的形象和活动的描写就是对沉潜于自己心灵深处数十年的美好记忆的复现，是再现性想象的产物。\n\n（二）创造性想象\n\n一般说来，作家完全依靠再现性想象创造艺术形象的情况是比较少见的。普遍的情形是，在再现记忆表象的基础上，作家还要对它们进行加工改造、重新熔铸，从而创造出不同于其生活原型的艺术形象来，这就是创造性想象。创造性想象是作家对再现性想象加工熔铸而产生新的艺术形象的过程。\n\n（三）相似性想象\n\n相似性想象是作家由一物触发而想到另一物的心理过程。它在心理学上的依据是联想，也有人将这种想象称为类比性想象。作家最常用的修辞手段如比喻、象征、拟人等，都是以这种想象类型为心理依据的。在运用这类修辞手法的作品中，词语与词语的排列不是由词语指涉物的时间或空间关系决定的，而是由与词语指涉物相似的那个东西决定的。看似毫无联系的词语常常被诗人们神奇地连在一起，产生独特的表现力。", "keywords": "重要心理因素 心理过程 基本特征 超越时空 形象与情感相互交织 类型 再现性想象 创造性想象 相似性想象", "note": "艺术想象这一概念相较于之前的艺术情感和艺术直觉，整体在考查中出现得较少，所以这部分内容我们主要也是以了解为主。不过这一部分涉及许多文论内容，如果报考学校考查文论知识的话，可以看看这部分内容作为拓展。", "framework": ""}, {"id": "38", "stars": 1, "title": "试分析《文心雕龙·神思》中的这一段话", "body": "古人云：“形在江海之上，心存魏阙之下。”神思之谓也。文之思也，其神远矣。故寂然凝虑，思接千载；悄焉动容，视通万里；吟咏之间，吐纳珠玉之声；眉睫之前，卷舒风云之色；其思理之致乎！故思理为妙，神与物游。神居胸臆，而志气统其关键；物沿耳目，而辞令管其枢机。枢机方通，则物无隐貌；关键将塞，则神有遁心。\n\n-刘勰《文心雕龙·神思》在这段话之中，刘勰讨论的是艺术想象的相关内容。艺术想象是文学创作的一个不可或缺的重要心理因素。按照心理学的解释，想象是指以原有表象或经验为基础创造新形象的心理过程。艺术想象是指文艺活动主体调动过去积累的记忆表象，通过艺术加工而创造艺术形象的心理过程。刘勰的这一段话，揭示了艺术想象拥有如下特征：\n\n一、艺术想象具有超越时空的特性\n\n所谓“故寂然凝虑，思接千载；幽焉动容，视通万里”，即是说想象可以在活动的瞬间突破现实时间和空间的限制，纵览古今，驰骋内外。不过，任何想象总是以现实为基础。\n\n二、艺术想象是形象与情感相互交织的过程\n\n艺术想象是情感与形象交织的过程，“神与物游”，其中总是包含着移情现象。一般来看，超越时空的自由不仅是艺术想象的特征，也是科学想象的特征。但与科学想象地趋于理智与客观不同，在艺术想象中，形象的再现、连接、改变和创造，总是与情感相互交织，如影随形。想象的发生缘于情感的驱动，想象的内涵受情感影响，想象的目的则是情感的表达。\n\n艺术想象是一个不断发展、变化的过程，并不是一蹴而就的。其间既有勃发，也有沉潜；既有热烈，也有平淡。从艺术想象的形象层面来说，需要不断地增减损益，以求形象鲜明、特征突出。从艺术想象的内涵层面来说，需要不断地提炼深化，以求涵蕴丰富、耐人寻味。\n\n三、语言在想象中起着重要作用\n\n所谓“物沿耳目，而辞令管其枢机”“枢机方通，则物无隐貌”，要将通过艺术形象所形成的形象表达出来，使之成为可供读者欣赏的文学作品，还需依赖于语言呈现。可以说，语言呈现是艺术想象得以完成的一个重要环节。\n\n【李凡说：文学考研中的题目是干变万化的，具体到文学理论部分，有些题目可能会让大家分析某一段话，或根据某一段话论述某一知识点，回答这样的题目时，要仔细分析选文所讨论的知识点，并将二者有机结合起来。这道题可供大家参考。】", "keywords": "超越时空 形象与情感相互交织 语言在想象中起着重要作用", "note": "", "framework": ""}, {"id": "39", "stars": 2, "title": "试述艺术理解在文学创作过程中的重要作用", "body": "艺术理解，是指创作主体融合了形象和情感的理性思维活动。在整个创作过程中，艺术理解始终发挥着重要作用。艺术理解的内涵和作用可以通过如下几个问题表现出来。\n\n一、艺术理解推动创作目的的落实\n\n在创作动机方面，艺术理解要解决的是作家如何落实创作目的的问题。作家产生创造动机，一方面固然需要情感的抒发与生活经验的触发，但另一方面，这种触发总是与理解交融在一起并发挥重要作用的。没有艺术理解的参与就不可能有效地进行艺术创作。白居易创作“新乐府”诗，是为了“惟歌生民病，愿得天子知”。这种动机渗透着他对人民的深切理解和同信，情与理融为一体，因而也是一种艺术理解。在作家创作过程中，艺术理解一旦形成，就会贯穿作家整个创作过程，对作品的形象、情节、主题乃至形式诸因素都产生重要影响，并引导着创作过程向着既定的目标前进。当然，在成熟的艺术家创作出的作品中，理解因素常常是隐蔽或含蓄地呈现的。\n\n二、艺术理解是判断生活材料有用性的主要途径\n\n选材是指作家在大量的生活经验储备中挑选准备表现的材料的过程。怎样的生活材料最适合表达作家的创作意图呢？这就需要运用艺术理解来分析判断。列夫·托尔斯泰之所以选择一个妓女被判刑的事件作为长篇小说《复活》的基本情节，是因为他朦胧地感到这一情节适合表现其道德上自我完善的主张。鲁迅选择一个落魄书生的故事来创作《孔乙己》，就是因为他感到整个故事能够表现他对科举制度的深刻批判。可见，选材固然离不开艺术直觉与艺术想象的帮助，但同时更离不开艺术理解的作用。在这里，艺术理解是判断生活材料有用性的主要途径。\n\n三、艺术理解推动人物形象和情节安排合情合理\n\n构思是作家调动各种心理机能将纷乱的材料组织成有序的艺术世界的过程。在艺术构思过程中，从性格刻画到情节安排，都离不开艺术理解的帮助。作家在描写人物形象和编织情节时常常要思考如何才能使其合情合理，这就离不开理解。没有理解的帮助，文学创作的构思过程是无法进行的。列夫·托尔斯泰曾谈到构思《复活》时理解所发挥的重要作用，他具体讲述了在构思《复活》时是如何运用艺术理解来调整思路的。作家的经验之谈说明了艺术理解对创作具有不可替代的重要作用。", "keywords": "融合了形象和情感 理性思维活动 推动创作目的的落实 判断生活材料有用性的主要途径 推动人物形象和情节安排合情合理", "note": "艺术理解，指艺术活动中对艺术客体的内容、形式、意义、相互联系及其规律的认识和把握。艺术理解可以说融汇在文学创作的整个过程之中，对创作动机、艺术构思等等方面都产生了重要影响。这一概念在名词解释中也经常出现，大家要留意。", "framework": ""}, {"id": "40", "stars": 2, "title": "文学创作的心理机制包括哪些内容", "body": "文学创作是一种复杂的创造性精神活动。在文学创作过程中，主要包括以下心理要素：\n\n一、艺术直觉\n\n艺术直觉是指创作主体在瞬间直接把握客体审美意蕴的思维方式或能力。艺术直觉和科学直觉一样，都具有直接的、无逻辑推理过程的、创造的等特征。而科学直觉主要把握事物内在的特质或规律，艺术直觉则把握事物蕴含的审美价值。科学直觉排斥个人偏见，艺术直觉则带有明显的个人主观性。\n\n二、艺术情感\n\n艺术情感是指作家在艺术创作过程中产生的、作为艺术创作动力和表现对象的态度和体验，被很多作家视为文学创作及文学作品的灵魂。\n\n艺术情感是日常情感的升华，但又是“智慧的情绪”，虽然可能包含痛苦的因素，但归根结底还是一种审美的愉悦，是情感更集中、更强烈、更典型的体验，是作家、艺术家跨越实际生活的现实条件束缚而产生并升华了的、具有精神意蕴的情感。在文学创作过程中，艺术情感的表达需求构成了文学创作的重要动力，是艺术形象的重要构成成分，情感的再度体验构成文学创作的核心。\n\n三、艺术想象\n\n艺术想象是文学创作的一个不可或缺的重要心理因素。按照心理学的解释，想象是指以原有表象或经验为基础创造新形象的心理过程。艺术想象是指文艺活动主体调动过去积累的记忆表象，通过艺术加工而创造艺术形象的心理过程。\n\n艺术想象具有超越时空的特性，是形象与情感相互交织的过程。从艺术想象在创作过程中所起的作用来看，艺术形象主要包括再现性想象、创造性想象、相似性想象三种类型。\n\n四、艺术理解\n\n艺术理解，是指创作主体融合了形象和情感的理性思维活动。在整个创作过程中，艺术理解始终发挥着重要作用。在创作动机方面，艺术理解要解决的是作家如何落实创作目的的问题。在选材方面，艺术理解是判断生活材料有用性的主要途径。在艺术构思过程中，从性格刻画到情节安排，都离不开艺术理解的帮助。", "keywords": "艺术直觉 艺术情感 艺术想象 艺术理解", "note": "相较于文学创作的过程，文学创作的心理机制以整体形式作考查的概率较小，通常都是针对某一具体的心理机制出一些名词解释和论述题，但也不排除部分学校会另辟蹊径，所以这里给大家整理了一道题以供参考。这部分内容在前面都已经详细论述过了，所以整体较为简略，大家可以结合前面的内容进行理解。", "framework": ""}, {"id": "41", "stars": 1, "title": "为什么说生活体验对文学创作具有重要意义", "body": "一、生活体验的内涵\n\n生活体验是指个人对社会生活的亲身体察与感受。人人都有生活体验，但是作为作家，他的生活体验不仅是丰富的、深刻的，而且是自觉的，也就是说，作家可以自觉地觉察并捕捉这种体验。一般说来，作家的生活体验越丰富，他对生活的理解就越深刻，这对他的创作就越有利。\n\n二、生活体验的作用\n\n按照毛泽东关于社会生活是“一切文学艺术的取之不尽、用之不竭的唯一的源泉”的论述，假如离开社会生活，一切文学创作都无从谈起。所以，优秀的作家必须深入生活，对生活有着深刻而独到的体验。历史上一切优秀的文艺作品，都是反映人民最深刻的心灵呼唤和时代最迫切的前进要求的作品，都是动人的艺术魅力与现实社会进步相结合的结晶，都是文学艺术家们的思想感情与创作灵感为时代和生活深刻感召的产物。正因为如此，历史上一切文艺巨匠的作品连同他们的名字世代相传，乃至不朽。\n\n南宋诗人陆游说：“盖人之情，悲愤积于中而无言，始发为诗，不然无诗矣。苏武、李陵、陶潜、谢灵运、杜甫、李白，激于不能自己，故其诗为百代法。”这是说那些有大成就的诗人都是有着极为深刻的人生体验的人。\n\n鲁迅的人生经历和独到体验是他写小说的前提条件。作为晚清破落家庭出身的人，鲁迅目睹了旧式文人的迂腐不堪及其对科举的热衷，如此才能入木三分地刻画出孔乙己这样不朽的文学形象。他曾经生活在农村，接触过生活在社会底层的农民，对他们的处境有着深刻的了解与同情，如此才可以塑造出祥林嫂、闰土、七斤、阿Q这样栩栩如生的人物形象来。\n\n现代作家、“山药蛋派”的开创者赵树理在小说创作中取得成功的一个重要原因，就是长期植根在晋东南这片热土中，获得了丰富而深厚的生活体验。他熟悉农村，热爱那里的人民，从而才可能在作品中大量而细致地描写晋东南农民生活与民俗百态，包括劳动、饮食起居、婚丧嫁娶、民间宗教信仰等。他把它们或作为故事发生的民俗背景，或作为塑造人物性格的手段加以运用，展示出生动感人的农村风俗画卷，使整个作品洋溢着鲜明的地域特色和创作个性。", "keywords": "内涵 亲身体察与感受 作用 有大成就的诗人 鲁迅 赵树理", "note": "本题为教材上的一个课后题，但整体内容较为简单，在考查中出现的可能性也不高，放在这里主要是希望大家了解一下，对生活体验的相关内容有一个认识。", "framework": ""}, {"id": "42", "stars": 3, "title": "试述文学创作对作家素养的要求", "body": "一、提升作家的思想道德及人格修养\n\n由于作家面向社会读者言说，他创作的是能够影响人的文学作品，因此作家可以说是人类灵魂的铸造者，社会就有权要求作家具有较高的思想道德及人格修养。思想道德及人格境界不高，也就难以创作出能打动人的好作品来。更重要的是，如果作家思想道德及人格修养不高，其作品非但不能惠及社会和人群，反而会起到污染灵魂的坏作用。当代中国作家需要严肃认真地考虑自己作品的社会效果，传播先进文化弘扬人间正气，塑造美好心灵，为人民奉献最好的精神食粮，努力以自己的作品丰富人民群众的精神生活，提高人民群众的精神境界。\n\n二、提升作家的文化艺术素养\n\n作为从事精神生产活动的人，作家无疑应该有较好的文化艺术素养。这种文化艺术素养除了作家应该具备的人格修养之外，主要还包括丰富的文学艺术修养和人文、社会科学及自然科学知识积累三个方面。\n\n（一）作家应有丰富的文学艺术修养。除了大量进行文学作品阅读之外，由于文学创作与其他艺术门类的创作有许多相通之处，一些作家也很注意绘画、音乐等艺术方面的修养，甚至有些作家本身也是画家、音乐家。\n\n（二）作家要有较好的人文与社会科学知识基础。这有助于培养作家的独创性思想，不但可以让作家从日常琐碎的事实中走出来，发现有价值的东西，更能有助于他们创造出一个新颖的艺术世界。\n\n（三）作家要有包括自然科学知识在内的比较广泛的兴趣和爱好。文学作品特别是小说一般都要涉及许多生活领域，所以也要掌握除人文、社会科学之外的自然科学文化知识，这样，在写各种生活场景的时候才会得心应手。\n\n受个性、爱好、环境等因素的影响，作家对各种文化知识的掌握难免有所侧重。但显而易见的是，作家根据自己的兴趣偏好等实际条件，积累的文化知识越广博，文化、文学艺术的素养越高，其创作武库的贮藏就越加丰富，写出的生活画面也会愈发生动逼真。\n\n三、保持作家的独特素质\n\n作家除了高尚的人格修养和文化素养外，还需要一些独特的素质。\n\n（一）经常保持创作激情状态。一般人也会经常被生活中的事物感动，有的人还具有讲故事、编故事的天分，却很少想到要将这些事物写下来。作家往往处在写作的冲动与兴奋之中，写作能将这种冲动和兴奋平息下来。若想激发、保持这种创作激情，自然需要作家对文学的热爱和浓厚的兴趣，没有这些，他们非但没有创作激情，也很难专注下来，成为作家。\n\n（二）对生活中那些具有特征的隐含重要意义的事物有敏锐的观察力。作家的这种观察力是自觉和不自觉训练的结果，但也的确有天赋的因素在内。他敏锐的观察力使其很容易分辨哪些是有意义的事件与人物，一旦发现就绝不放过。\n\n（三）对语言有超常的敏感与驾驭能力。他们善于捕捉语言中细微的变化，善于将一件旁人看来很平常的事绘声绘色地叙述出来，善于发现并掌握生活中那些有特色的、富于表现力的言语。", "keywords": "提升思想道德及人格修养 提升文化艺术素养 保持独特素质", "note": "作家的独特修养是一个比较细小的点，但近年来一些院校考查的频率有所上升，可以多加关注。其中，我们需要重点关注的是文化艺术素养和作家独特素质这两方面的内容，尤其是文化艺术素养这一部分，就曾经在23年的考查之中出现过。", "framework": ""}, {"id": "43", "stars": 3, "title": "在文学创作过程中如何坚持以人民为中心的创作导向", "body": "以人民为中心的创作导向，从文艺创作角度去理解，主要是要求在文艺创作的性质、意图、源泉、态度及品格等方面，切实把人民的需求放在中心地位。这需要做到以下几点：\n\n一、在文艺创作宗旨上，坚持为社会主义服务、为人民服务。社会主义文艺是人民的文艺。文艺为社会主义服务，就是为人民服务。这是对文艺的要求，更是对人民重要性的强调。毛泽东之所以肯定鲁迅的创作，原因有很多，但“后者横眉冷对千夫指，俯首甘为孺子牛”的精神，无疑是其中最为重要的一点。\n\n二、在文艺创作目的上，应为人民而创作，满足人民的日益高涨的文艺审美需要。作家只有真正了解并满足这些需求，表达出民众的心声，才有创作出伟大作品的可能。作品与人民大众的命运无关，不能触动他们的灵魂，满足他们对生活的期盼，就得不到他们的喜爱，这样的作品自然也不会有市场。\n\n三、在文艺创作的源泉上，坚持深入生活、扎根人民。文艺需要人民，需要从人民的波澜壮阔的生活中吸取源头活水。无论哪个时代的作家，关在象牙塔里独善其身，是写不出伟大作品的。只有深入生活，感动于其中，才会得到灵感和材料，创作才会具备生命力。\n\n四、在文艺创作的态度上，文艺家应当热爱人民，切身体验人民的喜怒哀乐、人民生活的酸甜苦辣。柳青多年和农民生活在一起，对他们的音容姿态、爱恨梦想等都十分熟悉，情感上也有深切的共鸣。正是因为对人民真挚的热爱，他的创作才在身入、心入的同时，做到了情入。\n\n五、在文艺创作的品格上，应有高尚的精神追求，自觉体现社会责任感。文艺不能当市场的奴隶。为人民大众创作，首先要考虑的是社会价值，考虑的是作品构成的审美世界，是否反映了人类进步的精神追求。\n\n以人民为中心的创作导向，绝不是以牺牲作家的个性与自由为代价。作家通过提高自己的人格修养和文化素养，使这种责任感成为自己的内在使命而不是外在强制，使自己的人格理想与社会进步的趋势相一致，使自己的个人利益与人民大众的社会利益相一致，这时候，二者在作家那里会自然而然统一起来。", "keywords": "宗旨 为社会主义服务 为人民服务 目的 满足人民文艺审美需要源泉深入生活扎根人民态度热爱人民 品格 高尚的精神追求 社会责任感", "note": "以人民为中心的创作取向是在当下环境中对文学创作的重要要求，近年来在考查中出现的频率越来越高，需要大家重点关注一下。大家在作答时，可以从性质、意图、源泉、态度及品格五个方向进行具体分析，同时还可以联系相关的作家作品。", "framework": ""}, {"id": "44", "stars": 1, "title": "试分析文学创作主体条件和追求的具体内容", "body": "文学创作虽然是享有高度自由的个体精神活动，但其产物即文学作品又是具有广泛社会影响的文化消费品。这就要求作家具有良好的思想文化修养和高度的社会责任感，具有丰富的生活积累和鲜明的创作个性。\n\n一、文学创作的主体条件\n\n（一）生活体验\n\n生活体验是指个人对社会生活的亲身体察与感受。人人都有生活体验，但是作为作家，他的生活体验不仅是丰富的、深刻的，而且是自觉的，也就是说，作家可以自觉地觉察并捕捉这种体验。一般说来，作家的生活体验越丰富，他对生活的理解就越深刻，这对他的创作就越有利。历史上一切优秀的文艺作品，都是反映人民最深刻的心灵呼唤和时代最迫切的前进要求的作品，都是动人的艺术魅力与现实社会进步相结合的结晶，都是文学艺术家们的思想感情与创作灵感为时代和生活深刻感召的产物。\n\n（二）作家思想道德修养与文化艺术素养\n\n（1）作家的人格修养\n\n由于作家面向社会读者言说，他创作的是能够影响人的文学作品，因此，社会就有权要求作家具有较高的人格修养。人生境界有层次高低的不同，有些人永远只看到自己的利害得失而不顾及他人，有的人则能够胸怀天下苍生，有的人只对有实际用途的东西感兴趣，有的人则能对一切美的事物产生美感。\n\n（2）作家的文化素养\n\n①作家应有丰富的文学艺术修养。除了大量进行文学作品阅读之外，由于文学创作与其他艺术门类的创作有许多相通之处，一些作家也很注意绘画、音乐等艺术方面的修养，甚至有些作家本身也是画家、音乐家。\n\n②作家要有较好的人文与社会科学知识基础。这有助于培养作家的独创性思想，不但可以让作家从日常琐碎的事实中走出来，发现有价值的东西，更能有助于他们创造出一个新颖的艺术世界。\n\n③作家要有包括自然科学知识在内的比较广泛的兴趣和爱好。文学作品特别是小说一般都要涉及许多生活领域，所以也要掌握除人文、社会科学之外的自然科学文化知识，这样，在写各种生活场景的时候才会得心应手。\n\n（3）作家的独特素质\n\n作家除了高尚的人格修养和文化素养外，还需要一些独特的素质。第一，经常保持创作激情状态。第二，对生活中那些具有特征的，隐含重要意义的事物有敏锐的观察力。第三，对语言有超常的敏感与驾驭能力。\n\n二、文学创作的追求：以人民为中心的创作导向\n\n以人民为中心的创作导向，从文艺创作角度去理解，主要是要求在文艺创作的性质、意图、源泉、态度及品格等方面，切实把人民的需求放在中心地位。\n\n在文艺创作宗旨上，坚持为社会主义服务、为人民服务。在文艺创作目的上，应为人民而创作，满足人民的日益高涨的文艺审美需求。在文艺创作的源泉上，坚持深入生活、扎根人民。在文艺创作的态度上，文艺家应当热爱人民，切身体验人民的喜怒哀乐，人民生活的酸甜苦辣。在文艺创作的品格上，应有高尚的精神追求，自觉体现社会责任感。\n\n以人民为中心的创作导向，绝不是以牺牲作家的个性与自由为代价。作家通过提高自己的人格修养和文化素养，使这种责任感成为自己的内在使命而不是外在强制，使自己的人格理想与社会进步的趋势相一致，使自己的个人利益与人民大众的社会利益相一致，这时候，二者在作家那里会自然而然统一起来。", "keywords": "主体条件 生活体验 思想道德修养 文化艺术素养 创作个性与独特性 追求 以人民为中心的创作导向", "note": "文学创作的主体条件和追求以整体形式进行考查的可能性不高，这里给大家做一个梳理，主要是让大家区分一下这一部分的主体条件和追求两方面的具体内涵，并对这一章节的整体框架有一个认识。其中我们重点关注的还是作家的修养和以人民为中心的创作导向这两部分内容。", "framework": ""}, {"id": "45", "stars": 5, "title": "试分析文学语言与日常语言、科学语言的区别（25上海大学、26华南师范大学）", "body": "文学作品的语言是作家对日常语言进行精心选择和加工、用来创造艺术世界、具有艺术魅力的语言。日常语言是人们在一般日常生活中使用的比较自然朴素的语言，而文学语言与科学语言、哲学语言等一样，都是在日常语言基础上根据不同目的、运用不同方法加工、修饰和提炼而成的专业语言。因此，文学语言一方面呈现出与日常语言不同的审美特征，另一方面也与其他专业语言如科学语言、哲学语言等有明显区别。与日常语言及其他专业语言相比，文学语言主要体现出如下特殊性质：\n\n一、表达目的不同\n\n日常语言和科学语言等主要用于使用者与外在世界的交往，其语言行为如议论、陈述、抒情等一般指向现实世界。文学语言的直接目的是构筑虚拟的艺术世界，艺术世界是一种假定和虚拟的存在，是如黑格尔所说的“诉之于心灵”和“经过心灵化”的东西。文学语言是通过艺术世界而间接反映和作用于现实世界的，因此，它与现实世界的关系比日常语言和科学语言等与现实世界的关系更为间接而又复杂多样。\n\n二、服从的真实标准不同\n\n日常语言一般要服从于现实世界和日常生活的真实性，有真假正误之分；文学语言则服务于艺术世界的虚拟性，因而作家在创作过程中可以根据内心真实感受和体验进行虚构。文学作品的语言主要以体验的真实为标准，不能用生活事实或物理事实去刻板地要求它。如李白有诗句“君不见，高堂明镜悲白发，朝如青丝暮成雪”。一日白头，不一定是生活真实，但是诗句艺术地表达了李白关于人生短暂而岁月易逝的真实心理体验，是对心理时间的真实表达。杜甫说“月是故乡明”，道出他情感中的月亮形象，虽不合乎物理事实，却发乎思念故乡的真实体验。\n\n三、语言意义生成的方式不同\n\n日常语言和科学语言等往往以意义的表达和接受的畅通为基础，基本要求是准确、鲜明。在日常生活及科学活动中，一个人如果想向别人表达什么意思，他必须准确无误地表达；如果他想旁敲侧击，也必须以别人能够领会为度。所以，日常语言和科学语言等一般遵循的是语义逻辑，意义比较单一、直接。文学语言意义的生成方式多是间接的，文学语义往往并不直接产生于语言的词典意义和语法规则，而是生成于特定语境中的文学语言所构造的艺术形象世界，读者需要从文学作品的语言和艺术形象整体中，逐渐领悟其全部意义。", "keywords": "提炼与加工 表达目的 真实标准 意义生成的方式", "note": "文学语言虽然是在日常语言的基础上加工而来的，但它与日常语言、科学语言之间已经出现了很明显的区别，在比较之中，大家可以明确文学语言的基本特质。文学语言与日常语言的区别这部分内容是在考查中出现频率非常高的一部分内容，大家一定要重点把握。", "framework": ""}, {"id": "46", "stars": 5, "title": "试述文学语言的特征（25华南师范大学）", "body": "文学作品的语言是文学作品最基本的层次，是一种具有表现目的和个性特征的整体性语言构造。文学作品用语言构筑形象生动的艺术世界，语言在这里不仅可以创造生动感人的艺术形象，帮助人们认识和体验生活，而且本身也溢美流芳、令人回味。从众多的优秀作品中，可以概括出文学语言的如下特征：\n\n一、自指性\n\n文学语言的自指性是指文学语言在表意的同时又通过呈现语言自身的手法、结构和特征以引起读者注意的特殊性质。文学是语言艺术，文学创作是一种高度自觉的语言创造活动，因此文学语言必然会超越日常实用语言的媒介性和工具性，其自身也会成为作家审美观照和艺术表现的对象。文学语言的这种性质在诗歌文体中体现得最为突出。诗歌中常见的押韵、平仄、对仗、用典、隐喻、反讽以及化用陈言、锻炼新语等手法，实际上都会加强文学语言的自指倾向。\n\n二、新异性\n\n文学语言的新异性是指文学语言所追求的与表意相统一的不同于日常语言的新颖性以及有别于其他文学作品语言的特异性。韩愈主张“惟陈言之务去”，贾岛感叹“两句三年得，一吟双泪流”，莫不反映了这些诗人力求文学语言不断超越平庸、超越前人以及超越自己的巨大努力和辛苦付出。\n\n三、生动性\n\n文学语言的主要目的是创造具有生命形式的文学作品。作家在遣词造句时，总是追求如生命一般的自然浑成和生气灌注。\n\n中国古典诗歌向来不乏生动传神的佳篇名句，如人们比较熟悉的谢灵运“池塘生春草，园柳变鸣禽”中的“生”和“变”，王维“泉声咽危石，日色冷青松”中的“咽”和“冷”等。有些诗作尽管用语平常，也同样写得生气流动。文学语言的这种生动性可以用一个“活”字来概括。\n\n四、韵律性\n\n文学的韵律性，是指作家艺术地运用语言使之具有节奏美和声韵美的特性。韵律是语言的固有特征，它是由语言自身的音节、声调、长短等相互呼应、对比所形成的有规律的现象。文学是语言的艺术，因此文学语言是一种艺术性语言，相对于各种实用语言来说，文学语言具有更强的节奏和声韵之美。", "keywords": "自指性 新异性 生动性 韵律性", "note": "文学语言的特征整体在考查中出现的频率非常高，大家一定要重点关注。在各种文学体裁之中，以诗歌语言最能体现文学语言的特征，大家在作答时，也可以集合诗歌之中的例子去分析文学语言的特征。文学语言的这几个特征中，以自指性最难理解，这一概念其实是指文学语言在表情达意之时具有审美价值，大家可以这样去理解。", "framework": ""}, {"id": "47", "stars": 5, "title": "试分析文学形象的特征（25中南财经政法大学）", "body": "与日常生活中常见的图画或画面及科技文献中的插图或图表等可感形貌相比，文学形象有自身的基本特征：\n\n一、主观与客观的交融\n\n文学形象是作家精心塑造和想象的产物，寄托着作家的主观情思，因此具有主观性。那些直接吟咏情性、寄托怀抱的抒情诗和抒情散文自不待言，即使是那些强调细节真实、以再现自然和记录历史为主的叙事性小说，也同样会自觉或不自觉地流露出作者的主观倾向和情感态度。同时，文学形象又总是源于社会生活，作家塑造文学形象必须有一定现实根据，因此文学形象又具有一定的客观性。\n\n二、虚构性与真实性的结合\n\n虚构是文学形象生成的重要途径。但文学形象的虚构性必须与真实性结合，换言之，文学形象的虚构性要合情合理。所谓合理，是指文学形象要符合客观规定性。这个“理”，是指现实世界中的本质性和规律性的东西。不论读者面对多么荒诞虚妄的文学形象，仍然可以用自己在现实世界体悟到的“理”加以衡量。如果合乎“理”，这个文学形象就是真实的，否则便不真实。“合理”还意味着合乎理想。当文学形象以它的虚拟性和假定性表达了某种美好理想的时候，这个文学形象也就具有了艺术的生命力。\n\n艺术形象还必须“合情”，即文学形象必须反映人们真切的感受、真挚的情感和真诚的意向。在塑造文学形象时，要求情与理的统一；而当情与理发生矛盾时，就要牵理就情。文学形象就这样在“合情合理”的尺度内，实现了虚构与真实的统一.\n\n三、确定性与不确定性的并存\n\n文学形象是用语言塑造的，不是直观的而是想象的，不是直接的而是间接的。因此，文学形象具有确定性与不确定性相统一的特征。一方面，文学形象必须具备一些确定的因素，成为读者理解文学形象的基本依据；另一方面，文学形象也必须具备不确定的想象空间，让读者从不确定中去想象丰富多样的艺术世界。\n\n四、个别性与概括性的统一\n\n科学概括往往是摒弃个别，直取一般；而作为艺术概括的文学形象，则始终不离个别，而且还要强化、突出个别性，从而更显著、更充分地表达出“一般”，元代作家马致远的《天净沙秋思》通过对一个失意文人凄苦心境的描写，表达了那个时代整个知识阶层前途渺茫、归宿不定的痛苦，充分体现了文学形象个别与一般相统一的特点。", "keywords": "主观与客观的交融 虚构性与真实性的结合 确定性与不确定性的并存 个别性与概括性的统一", "note": "文学形象的特征，总体看下来就是对立统一，而文学形象之所以具有这样的特征，与文学的性质息息相关。文学具有审美意识形态属性，既来源于社会客观现实，又融入了作家的主体情感，两方面的因素共同作用于文学形象。这部分内容在考查中出现的频率非常之高，除了考查论述题外，还会以名词解释的形式考查。", "framework": "主观与客观的交融 虚构性与真实性的结合 文学形象的特征 确定性与不确定性的并存 个别性与概括性的统一"}, {"id": "48", "stars": 3, "title": "试述文学象征的主要特征（26辽宁大学）", "body": "象征艺术是人类最古老的艺术形式。文学象征是以表达观念和哲理为目的，以暗示为基本艺术手段，具有荒诞性和审美求解性的艺术形象。文学象征的特征主要表现在三个方面：\n\n一、暗示性\n\n文学象征的暗示性是指文学象征所具有的非直接的表义特征。读者通过作者所提供的语词构造而猜想出其中隐藏的深意，就是暗示性。黑格尔说：“象征一般是直接呈现于感性观照的一种现成的外在事物，对这种外在事物并不直接就它本身来看，而是就它所暗示的一种较广泛较普遍的意义来看。因此，我们在象征里应该分出两个因素，第一是意义，其次是这意义的表现。”黑格尔这里所说的“不直接就它本身来看”的“意义的表现”，就是暗示。这种“意义的表现”或者是现实存在的具体事物，如中国古诗中的松竹兰桂等；或者是作者虚拟的形象，如现代派代表诗人艾略特《荒原》中的荒原等。无论哪种形象，本身都不是文学象征的主要目的，它们的作用主要在于启示人们透过表层形象去思索、领悟更深远的意义和观念.\n\n二、哲理性\n\n正像中国古代将象征看成是表达“至理”的手段一样，古代和现代文学的许多作品，都以表达哲理作为创造文学象征的目标。中国古代神话《精卫填海》，其形象是象征，在象征形象背后所寓含的却是以小持大、奋斗不息的哲理。《变形记》就是通过一个由商品推销员变成的大甲虫的象征性形象，表达了作者关于现代人性异化的哲理思考。\n\n三、多义性\n\n文学象征往往是作家个人创造的象征，与作为惯例存在的公众象征有所不同。公众象征的意义是文化赋予的，比较明确。如十字架在基督教文化中的象征意义、龙在中国文化中的象征意义等。作为作家“个人的象征”，文学象征往往是在一种文学形象中蕴含着多重意义空间。有的是作家将原有公众象征重新赋予了特殊的意义，如龚自珍《病梅馆记》中的“病梅”形象，有的则是作家新创的象征性形象，其表义方式已经完全个人化了，如小说《透明的红萝卜》中的“红萝卜”形象。为了追求多义效果，作家往往又故意隐去了本义和思路，使得很多文学象征成了意指不明的“多解方程”。如李商隐的《锦瑟》就是典型的千古“诗谜”。", "keywords": "暗示性 哲理性 多义性", "note": "文学象征是以表达观念和哲理为目的、以暗示为基本艺术手段、具有荒诞性和审美求解性的艺术形象，其主要特征有暗示性、哲理性和多义性。作为中国古代文论中比较常出现的概念，文学象征在文学理论中整体出题的频率不高，即使出题也多考查名词解释。不过如果考查古代文论的话，可以将这部分内容作为补充。", "framework": ""}, {"id": "49", "stars": 5, "title": "谈谈你对文学意境的认识", "body": "文学意境主要是指抒情性作品中呈现的情景交融、虚实相生的形象系统及其生发的审美想象空间。\n\n一、意境概念的生成与发展\n\n意境概念是中国抒情文学和抒情理论高度发达的产物，中国古代文论中的“意境”一词有两种用法：一是指“意之境”，如相传为王昌龄所作《诗格》中的“三境”说将“物境”“情境”“意境”三个概念并列，分别表示由景物、情感、心意所构成的艺术空间。二是指“意与境”，即表示内在情感心意与外在景物的融合和统一。后世及现代评诗论文所用的主要是第二种意义上的“意境”。\n\n晚唐司空图在《与王驾评诗书》中提出的“思与境谐”，已经是对“意境”概念的具体描述，他在《与极浦谈诗书》中提出的“象外之象”和“景外之景”，在《与李生论诗书》中提出的“韵外之致”和“味外之旨”等，是对“意境”内在结构和特征的进一步规定。至此，意境论的基本内容和理论构架已经成型。此后，意境逐渐成为我国诗学、画论的一个基本范畴，历代学者对其都有补充和发展。\n\n二、文学意境的艺术特征\n\n文学意境的特征主要表现在以下三个方面：\n\n（一）情景交融\n\n情景交融是文学意境的表现特征。情景交融的方式分为三种：\n\n（1）景中含情式。在这类意境创造中，作家藏情于景，一切都通过逼真的画面来表达，虽不言情，但情含景中，更显得情真意浓。\n\n（2）情中见景式。这类意境的营造方式往往是直抒胸臆。有时不用写景，但景象却历历如现。\n\n（3）情景并茂式。在这种意境中，抒情与写景达到浑然一体的程度。\n\n（二）虚实相生\n\n宋人梅尧臣把意境分为两个方面：一方面是“如在目前”的较实的因素，即实境；另一方面是“见于言外”的较虚的部分，即虚境。具体说，实境是指意境中逼真存在的景、形、境，因此又称“真境”“事境”“物境”。虚境是指由实境诱发和开拓的审美想象空间：一方面是原有画面在联想中的延伸和扩大，即所谓“象外之象”“景外之景”；另一方面是伴随这种具象联想而产生的对情、神、意等虚境的体味和感悟，即所谓“不尽之意”。所以虚境又称为“神境”“情境”“灵境”。\n\n实境是艺术表现的重心，所谓“真境逼而神境生”；虚境是实境的升华，体现着意境创造的意向和目的。这就是意境“虚实相生”的原理。\n\n（三）韵味无穷\n\n“韵味”是指意境中所蕴含的咀嚼不尽的艺术之美。它包含着情、理、意趣、韵、味等多种因素，因而有情韵、韵致、理趣、意味、兴趣、兴味、趣味等多种别名。刘勰、钟嵘提倡的“余味”“滋味”，晚唐司空图提出的“味外之旨”和“韵外之致”说，宋代梅尧臣提出的“含不尽之意，见于言外”说，都是对意境的这一审美特征的理论总结。在中国古典诗歌和现代诗歌中，意蕴丰富、韵味无穷的佳作不胜枚举。\n\n总之，意境具有情景交融的表现特征、虚实相生的结构特征和韵味无穷的审美特征。\n\n【李凡说：文学意境同样是从中国古代文论中生发出来的一个关键概念，但与文学象征不同的是，无论是在文学理论部分还是古代文论部分，文学意境在考查中出现的频率非常之高，比如在25年的考查中，南京师范大学、江南大学都考查到了文学意境的特征，并且名词解释和论述题中都会出现，其中意境的特征更是几乎每年都有好几所学校进行考查，所以对于这部分内容及相关文论，我们一定要重点掌握。】", "keywords": "生成与发展 情景交融 藏情于景 景中含情 情中见景 情景并茂 虚实相生 韵味无穷", "note": "", "framework": ""}, {"id": "50", "stars": 5, "title": "谈谈你对文学典型的认识（25辽宁大学、26天津师范大学）", "body": "文学典型，主要指叙事作品中塑造的显出性格特征的富有魅力的人物形象。\n\n一、典型概念的生成与发展\n\n典型是产生于西方文论的一个概念。它在西方的发展大致经历了三个阶段。\n\n（一）18世纪前，西方典型观基本上是类型说，强调典型的普遍性和类型性。\n\n（二）18世纪后，开始由重视类型向重视个性转变，形成了个性典型观占主导的时期，黑格尔便是这种典型观的代表。他认为，典型是一种达到理想境界的人物形象，“不仅要显现为普遍性，而且还要显现为具体的特殊性”。后来，俄国的别林斯基又提出了“似曾相识的不相识者”（又译“熟悉的陌生人”）的命题，这一命题既强调了典型的创新性和独特性，又强调了典型的“普遍性”品格，丰富发展了典型论。\n\n（三）马克思主义文艺理论也很重视典型问题。恩格斯阐明了塑造典型的基本要求：第一，典型应该是现实生活的反映，属于现实主义文学的特定范畴；第二，注意细节真实，是典型塑造的显著标志；第三，典型只有在“典型环境中的典型人物”的意义上才能成立，也就是说，只有达到环境的典型性与人物的典型性有机统一时，这个人物形象才能成为典型。\n\n二、文学典型的美学特征\n\n（一）文学典型具有突出的个性特征\n\n文学典型的特征性可以从两个方面来理解。一方面，文学典型必须具有贯穿其全部活动的、统摄其整个生命的主要特征。阿Q的“精神胜利法”、林黛玉的“多愁善感”、薛宝钗的“世故圆滑”、王熙凤的“心狠手辣”等就是这样的主要特征。人物的每一行动，都与这个主要特征息息相关。另一方面，文学典型还必须通过局部特征反映和形成主要特征。《红楼梦》中的黛玉葬花就是一个具有特征性的事件，以独特的方式反映了林黛玉“多愁善感”的主要特征，这是大观园中其他女孩子不会做的事。文学要利用每个富有特征性的语言、细节、场面和事件，为反映和形成主要特征服务。\n\n（二）文学典型具有生命的斑斓色彩\n\n18世纪以前，西方的典型塑造一般关注类型化，人物性格往往是单色调的。到了19世纪，随着现实主义文学创作达到顶峰，人物性格的描写也由简单到复杂，写实文学发展到以性格复杂丰满的“圆形人物”为美的阶段。中国古典小说中也不乏这类典型人物形象。如在林黛玉性格的内在丰富性和矛盾性，就拓展了其生命的张力，使得她的性格更显得有血有肉、丰富多彩，具有无穷的艺术魅力，也增添了其命运的悲剧美。\n\n（三）文学典型具有灵魂深度\n\n优秀的文学典型应当呈现灵魂的深度。所谓“灵魂的深度”，主要表现为人物性格在何种程度上表达了人类解放自身的要求和改变现存不合理秩序的愿望。如俄国作家陀思妥耶夫斯基在西方现实主义小说发展到顶峰之际，将艺术眼光从广阔的社会现实转向人物的内在灵魂，在《罪与罚》《卡拉马佐夫兄弟》等一系列小说中，把人物置入生与死、善与恶的极端冲突之中，冷峻地刻画着人物灵魂的颤抖与挣扎，拷问与忏悔，向世人展示了另一个生命维度的真实和深刻。\n\n（四）文学典型蕴含深刻的历史真实\n\n文学典型的创造以真实性为基础。恩格斯就曾要求通过“卓越的个性刻画”体现出“对现实关系的真实描写”，表达出“自觉的历史内容”，从而引起读者对人物命运的强烈共鸣。所谓“现实关系”，在恩格斯的原意里是指人们在一定的生产关系基础上形成的社会联系，以及由它派生的人与人之间的精神关系。文学更注重描写的是后者。", "keywords": "生成与发展 典型环境中的典型人物 美学特征 突出的个性特征 生命斑斓色彩 灵魂深度 蕴含深刻历史真实", "note": "与文学象征、文学意境主要来源于中国古代文论不同，文学典型这一概念主要来自西方文论，在典型概念的发展过程之中，我们尤其要注意恩格斯“典型环境中的典型人物”这一概念，在考查中经常通过这一概念考查文学典型的相关内容。对于典型环境与典型人物的关系，马工程版教材没有深入论述，大家可以参考童庆炳版教材第十章第二节的内容作为补充，童庆炳部分我们也设置了相关题目，大家可以参考一下。文学象征、文学意境和文学典型都是文学形象的理想形态，如果有类似的题目可以将这三部分内容综合起来作答。", "framework": ""}, {"id": "51", "stars": 2, "title": "试分析文学作品意蕴的层次（25湖北大学）", "body": "文学作品的意蕴，是指由文学语言和文学形象所传达的意义，属于文学作品结构的最深层次。意蕴也称意，是中外文论常用的一个范畴。“意”或“意蕴”是有多层次的，总体来看，可以分为三个主要层次：\n\n一、审美情韵层\n\n审美情韵，是指由作品的形象和情境中流溢出来的美的情感和韵致。由于文学作品首先必须是一种审美对象，所以每一部作品都要有审美情韵层。例如苏轼《海棠》主要表现由海棠花的香艳所引起的诗人的兴奋和他那孩童般天真的爱美痴情，意蕴单一而醇美，传唱千古，仍馀香满口。即使在意蕴丰厚的作品中，首先引人入胜的也往往是其审美情韵层。一部文学作品可以没有其他意蕴，但至少应具有审美意蕴。\n\n二、历史内容层\n\n文学的历史内容是指文学作品所反映的历史真相、趋势和意义等历史意蕴。《红楼梦》通过贾、王、史、薛四大家族的兴衰史，形象地展现清代封建社会由盛转衰的历史。《水浒传》描写的是北宋时期一次声势浩大的农民起义，展示了起义的英雄们与封建官僚恶霸之间波澜起伏的斗争画卷，也是那个时代历史的真实反映。梁斌的长篇小说《红旗谱》通过冀中平原两家农民三代人和一家地主两代人的尖锐矛盾、斗争，以“反割头税”和“二师学潮”为中心事件，生动展示了20世纪二三十年代北方农民革命运动的历史图景。在这些作品中，充满性格魅力的人物形象构成的审美情韵层，直接呈现了丰富的历史意蕴。\n\n三、哲学意味层\n\n作品意蕴的最深层一般是哲学意味层。亚里士多德说：“写诗这种活动比写历史更富于哲学意味，更被严肃地对待，因为诗所描写的事带有普遍性，历史则叙述个别的事。”所谓“带有普遍性”，即具有某种带规律性的道理，其中包含“哲学意味”。“哲学意味”不是干巴巴的道理，而是融合了生动形象和真挚情感的道理，蕴含在感性、具体的场景和氛围中，只可意会不可言传。如陶渊明“采菊东篱下，悠然见南山”诗境中的“真意”，《白鲸》蕴含的“人与自然将同归于尽”的警告，《犀牛》暗示的难以抗拒异化的人类命运等。", "keywords": "审美情韵层 历史内容层 哲学意味层", "note": "文学作品的意蕴层次这部分内容相对比较简单，理解起来也比较容易，在考查中往往会以填空和名词解释的形式考查，此外还可能让大家集合某部作品去分析其意蕴层次。", "framework": ""}, {"id": "52", "stars": 1, "title": "试划分《白鹿原》的审美意蕴层次", "body": "文学作品的意蕴是指由文学语言和文学形象所传达的意义，属于文学作品结构的最深层次。《白鹿原》是陈忠实历时六年完成的一部“扛鼎之作”，其艺术水准有目共睹，作品中的意蕴也十分丰富。\n\n一、审美情韵层\n\n从审美情韵层来看，《白鹿原》具有丰厚的审美意蕴。审美情韵是指由作品的形象和情境中流溢出来的美的情感和韵致。由于文学作品首先必须是一种审美对象，所以每一部作品都至少具有审美情韵层。在《白鹿原》中，“白鹿”意象是白鹿原地域符号的代表，它隐含了自然崇拜、神灵崇拜、祖先崇拜、英雄崇拜等神话意识，体现了人与自然、人与人、人与社会和谐统一的生态审美观念。此外，小说所描写的具有地域色彩的农耕文化、祠堂文化，以及具有传承性的岁时节庆礼仪、艺术文化民俗，也体现出文化形态层面的审美意蕴。\n\n二、历史内容层\n\n从历史内容层来看，《白鹿原》具有厚重的历史底蕴。文学的历史内容是指文学作品所反映的历史真相、趋势和意义等历史意蕴。《白鹿原》以关中平原上的白鹿村为历史舞台，以白、鹿一族两支的人物为主人公，将半个世纪以来重大的历史事变，诸如晚清危机、辛亥革命、军阀混战、抗日战争、解放战争以及关中所经历的霍乱、瘟疫、饥荒、匪患等天灾人祸都投放到这个舞台上，写出了白鹿村人在长达半个世纪的自然和社会事变中的挣扎、奋斗、困惑和苦恼，以及自然本性和社会道德的冲突、文化遗传和现实变革的交战。\n\n三、哲学意蕴层\n\n从哲学意蕴层来看，《白鹿原》具有悲剧色彩，引发哲学思考。在白鹿原上，儒家仁义是民间最为实用的生活原则。它建立在悠久厚重的土地上，以儒家的仁爱哲学为基础性文化，是家与国统一在一种道德规范下的文化。而小说在极力张扬宗法制度下的仁义精神时，又往往难以逃离其中非仁义的一面。在白鹿村一场又一场革命和欲望风暴的冲击下，儒家文化所建构的宗法制度和人伦规范一步步走向没落，就连白鹿原的“精魂”朱先生也无法挽回这一文化颓势。作者把他的深刻体验及悲剧意识熔铸于作品之中，写出了人在历史进程之中的生存困境，展现出历史的悲剧性。", "keywords": "审美情韵层 白鹿 文化形态层面 历史内容层 现代乡土历史小说 哲学意蕴层 历史的悲剧性", "note": "回答有关作品的问题，或者需要联系作品的问题的时候，需要对文学作品有一定的了解，这就需要我们在平常的学习生活中多积累一些阅读量，广泛地开展阅读，尤其是鸿篇巨著，一定要有一些基本的了解。在作答时既要联系基本的文学理论知识，也要立足于作品本身，做一些简明扼要的文本分析。", "framework": ""}, {"id": "53", "stars": 2, "title": "试举例说明意蕴层次的有机系统性与丰富性", "body": "一、意蕴层次有机系统性\n\n由于整个文学作品及其艺术世界是作为有机的生命形式存在的，所以作品的意蕴也构成由表及里的有机系统。如李商隐的《乐游原》直接呈现的是那晚霞丽天的美景和对其转瞬即逝的惋惜，构成了此诗的审美情韵情；进而在乐游园的今昔对比中，由此情此景让人联想到大唐帝国江河日下、日薄西山的历史境况，这是诗歌的历史意蕴层；最后，艳丽晚霞的转瞬即逝又会引人沉入哲理的遐思：美好的东西为什么总是这样短暂？这难道是一种不可抗拒的规律？于是诗歌就呈现了它的哲理意味层。\n\n二、意蕴层次的丰富性\n\n一般来说，意蕴的每个层次又可以作多层次分析。小说《骆驼祥子》的哲学意蕴就是很丰富的。\n\n（一）作者通过祥子的悲剧将批判与反思的触角指向了当时中国的社会现实和奋斗中的底层人物自身的局限性。祥子买车的愿望朴素而切实，根据其自身条件和品格，实现这一愿望并不是很难的事情，但这一切近的理想却由于社会的动荡和黑\n\n暗而变得遥不可及。然而，作者在批判现实社会的动荡、窳败与黑暗的同时，也指出了祥子个人奋斗的局限性。在祥子为理想的奋斗过程中，他始终是一个孤独者，他不合群，没有任何朋友。也正因如此，老舍在小说的结尾较鲜明地批评了祥子不仅是“自私的，不幸的，社会病态里的产儿”，同时更是“个人主义的末路鬼”。\n\n（二）老舍通过祥子“堕落”的叙述对都市文明病也进行了独特的批判。小说中，祥子生命的旅程，从一定程度上来说是不断走向“堕落”的过程，且这精神与肉体的双重堕落是在城市空间里发生和完成的。生命在城市畸形文明里逐渐委顿，体面的、要强的、好梦想的、健壮的、伟大的祥子变成了堕落的、自私的、无耻的游手好闲之徒。很显然这其中寄寓着作者对城市文明病的批判与反思。\n\n（三）在祥子的悲剧性生命旅程中，也寓含着作者对人性和命运的省思。“小说写祥子的一个个不幸遭遇，蕴涵着一个不断向自我的和人类的内心探究的旅程结构”。在这一心灵探寻的旅程结构中，小说为我们揭示了美与善的毁灭和人蜕变为“兽”的悲剧。而在对祥子一再拼力活下去而不能的叙述中，作者表现出对命运的思考和探寻。祥子不断堕落的过程，在某种程度上来说也是他抗争命运而不断失败的过程。", "keywords": "有机系统性 丰富性", "note": "对于类似的举例分析的题目，我们一方面要准确把握文学理论相关基础知识，另一方面要注意结合作品，所以需要将文学理论与文学史相关内容结合起来。这部分的例子，可以与课本上举出的例子结合起来共同参考。", "framework": ""}, {"id": "54", "stars": 2, "title": "谈谈你对文学体裁分类方法的认识", "body": "文学体裁是指在结构形态和话语表达上具有明显可辨特征的文学作品类型，它对读者感受和理解文本起规范作用。按照不同的分类标准，可以对文学体裁作不同的分类。\n\n一、“两分法”\n\n我国古代学者对文类的划分名目繁多，但大体上把所有的文章分为韵文和散文两大类，属于“两分法”。这种分类方法在形式上很清楚，但也有局限：一方面主要囿于诗文范围，而骈文、戏曲、小说以及其他形式的俗文学很少涉及；另一方面，由于对“文学”缺乏明确的界定，“文”中常含有按今天的文学观念来说属于非文学的文章。\n\n二、“三分法”\n\n“三分法”是根据文学作品的性质和表现方式的不同，把文学分为叙事文学、抒情文学和戏剧文学三种类型。“三分法”是欧洲文学史上传统的分类方法。可以追溯至古希腊。亚里士多德的《诗学》确立了“三分法”基本原则，后由黑格尔等发展成为比较完善的理论体系，西方当代文论家遵循了亚里士多德的分类原则，并进一步细分为不同小类，如叙事文学又分为神话、史诗、小说、寓言、童话、叙事诗等，其共同特点是叙述故事，塑造人物形象；抒情文学含抒情诗和抒情散文，以抒发作者的情感为主要特色；戏剧文学是供舞台演出的脚本，以人物自身的行为动作和台词来表现社会人生。\n\n“三分法”着眼于情感体验和艺术表现方式的不同，其划分标准具有“类”的概括性和逻辑性，但相对忽视了文学作品语言形式方面的特点，诗歌中的抒情诗被归于抒情文学，而叙事诗则被归于叙事文学。\n\n三、“四分法”\n\n我国自五四运动以来借鉴西方“三分法”，并适当补充，将文学分为诗歌、小说、戏剧文学（剧本）和散文四类。“四分法”的主要依据是文学作品的外在形态、语言运用和表现手法等方面的特征。“四分法”的提出与小说的兴盛有关，将散文单列一类，也比较符合中国文学史的实际情况。\n\n“四分法”从文学作品的整体形态出发，关注它们的体式、语言方面的不同，分类明了、易于把握；散文被单独划分为一类，突出了体裁特点，但也存在分类交叉的问题，像散文诗、诗体小说等就难以归类。\n\n“三分法”和“四分法”是目前常见的两种文学分类方法。", "keywords": "“两分法”韵文 散文 “三分法”叙事文学 抒情文学 戏剧文学“四分法”诗歌 小说 戏剧 散文", "note": "文学体裁是指在结构形态和话语表达上具有明显可辨特征的文学作品类型，它对读者感受和理解文本起规范作用。文学体裁是文学发展到一定阶段的产物，中西方文学体裁观念源远流长。文学体裁分类有“两分法”“三分法”“四分法”。其中，“两分法”是中国古代流行的分类方法，而目前使用最多的是“三分法”和“四分法”，这两个可能在考查中单独出现，大家要注意。“三分法”和“四分法”一个着眼于情感和艺术表现，一个着眼于形式、语言，重视一个方面，就难免忽视另一个方面，因此二者既有优势也有不足，对此我们也要有所认识。", "framework": ""}, {"id": "55", "stars": 3, "title": "试分析诗歌的艺术特征（25郑州大学、26华南师范大学）", "body": "诗歌是一种以富有韵律的语言和丰富的想象来表情达意的文学体裁，同时也是文学史上出现最早的一种文学体裁，在中国和西方都有着悠久的历史。诗歌的艺术特征，主要表现在以下方面：\n\n一、强烈的情感\n\n抒情性是诗歌最根本的特征，也是诗歌的内在要求。不同体裁的文学作品都饱含情感，但是诗歌对于情感的要求“更集中，更强烈”。无论是抒怀，还是咏物，或是绘景写人，诗歌都饱含情感。情感在诗歌中居于核心地位。诗歌以情感作为主要对象，并以情感表现作为判断自身价值的尺度。\n\n诗歌表达的强烈情感并不是无病呻吟，而是根植于深厚的生活土壤之中。英国诗人华兹华斯说：“一切好诗都是强烈情感的自然流露。”诗歌的情感表现是多种多样的，或强烈而浓郁，或缠绵而悠长。即使是叙事诗，诗人也是满怀激情地吟唱一个故事。当然，诗歌的情感表现要避免矫揉造作，其表达情感的手段有多种选择，可以直抒胸臆、酣畅淋漓，可以融情于景，通过想象和营造意境来委婉含蓄地表达，也可以兼而有之。\n\n二、跳跃性的言语结构\n\n跳跃性的言语结构这一特征与诗歌的抒情性所体现的不受时空限制的强烈情感和丰富想象有关。诗歌言语结构的跳跃性有多种形态，或是时间上“观古今于须臾”，或是空间上“挫万物于笔端”，天马行空，自由伸缩。\n\n诗歌跳跃性的言语结构也与诗歌文体的形式有关。诗歌创作讲究章法，特别是中国古典诗词，要求平仄、对仗和起承转合等；自由诗看似不拘一格，其实也有重复、回旋等形式上的要求。这种文体形式使诗歌不可避免地出现省略、颠倒等，从而形成了诗歌语言结构的跳跃性。\n\n三、富有音乐美的语言\n\n诗乐同源，诗歌要求具有类似音乐的韵律和节奏。格律诗有严格的字数、行数、平仄、对仗、押韵等格律方面的要求，自由诗同样有内在的韵律和节奏。诗歌语言讲究韵律和节奏，不仅仅是为了纯粹的形式美，而且是为了更好地抒发情感。\n\n诗歌又是一种语言高度概括、凝练的文体。诗人对每个词都要推敲，以赋予语言充分的表现力。诗人在创作中还采用比喻、隐喻、反讽、双关等多种修辞手段以形成诗歌语言的多义，或运用典故在新的语境下获得新的意蕴，或创造一些背离日常语言的陌生化语言，激起人们对诗歌语言和情感的新鲜感。\n\n四、凝练的意象\n\n诗人在诗歌中要表现的不是那些物象的实在面貌，而是它们在主体心中所激起的情感和内心活动。因此，诗人的审美感受和体验不会停留在客观物象的表层，而是通过丰富的想象以变形的方式将物象的某一特征凸显出来，创造出包含浓郁情感的鲜明、凝练的意象。不止如此，诗人还可以将自己的心境投射到物象上，产生“感时花溅泪，恨别鸟惊心”（杜甫《春望》）似的移情效果。诗人主观情思的“意”与客观情景的“象”和谐交融、辩证统一，或是单独创造一个意象，或是多重意象叠加、并置。中国诗歌创造了大量丰富生动意味隽永的意象群。\n\n【李凡说：诗歌是一种以富有韵律的语言和丰富的想象来表情达意的文学体裁。我们可以借助白居易的“根情、苗言、华声、实意”来记忆。在诗歌强烈的情感性这一部分之中，我们需要注意华兹华斯“一切好诗都是强烈情感的自然流露”这一观点，很可能在名词解释中出现，大家要注意一下。】", "keywords": "强烈的情感 跳跃性的言语结构 富有音乐美的语言 凝练的意象", "note": "", "framework": ""}, {"id": "56", "stars": 1, "title": "试述诗歌的主要类型", "body": "诗歌按抒情与叙事元素的比重不同，可分为抒情诗与叙事诗。按照格律规范，又可以分为格律诗、自由诗和歌谣体诗等。\n\n一、从抒情与叙事元素比重不同划分\n\n（一）抒情诗\n\n抒情诗是直接抒发情感的诗歌体裁。抒情诗的主要特点是抒发诗人的思想感情，追求诗人情感表达的真实、真切。如戴望舒的《萧红墓畔口占》一诗，诗人就是通过意象、对比、隐喻等手法，寥寥四行表达了诗人对于生死、对于生命的深沉叹喟。抒情诗主要包括情诗、颂歌、哀歌、牧歌、田园诗、山水诗、讽刺诗、咏史诗等。\n\n（二）叙事诗\n\n叙事诗的特点是由诗人采用有韵语言述说一个相对完整的故事，如《孔雀东南飞》《木兰辞》等。与叙事类小说相比，叙事诗不作详细铺叙，而是选取最具特征性的形象来吟唱，重在抒发诗人内在的情感。\n\n二、以格律规范划分\n\n（一）格律诗\n\n格律诗是一种有着固定格式和韵律的诗歌样式。中国古代诗歌中的绝句、律诗、词、曲等格律体诗对篇、句、行、字数和平仄、押韵等都有具体规定，西方的“十四行诗”在形式和韵律上也有严格的要求。\n\n（二）自由诗\n\n自由诗是相对于格律诗而言的。它没有固定的篇幅和句式、字数的限制，节奏和音韵也比较自由，适应情感表达的需要。此外，散文诗也属于自由诗的一种，它兼具散文与诗歌的特点，感情充沛，想象丰富，语言自由，又讲求诗的韵律和节奏，要求营造诗的意境。\n\n（三）歌谣体诗\n\n歌谣体诗在音韵和篇幅上没有格律诗严格，但为了便于诵记和合乐，一般有一定的韵脚。在结构上，歌谣体诗每节大体一致，末节一般反复咏唱。歌谣体诗包括民歌、流行歌曲及各种小调的歌词。歌谣体诗贴近生活，语言多具有口语化特点，是一种富有生命力的民间文化文本。民歌体长诗《王贵与李香香》就借鉴陕北民歌“信天游”的形式以及比兴的手法，以群众喜闻乐见的语言形式，讲述了陕北乡村青年王贵与李香香的爱情故事，展示了陕北地区农民闹革命的生动景象。", "keywords": "强烈的情感 跳跃性的言语结构 富有音乐美的语言 凝练的意象", "note": "本质上来说，诗歌类型的划分有形式与内容两个方面的分类标准，诗歌按抒情与叙事元素的比重不同，可分为抒情诗与叙事诗。按照格律规范，又可以分为格律诗、自由诗和歌谣体诗等。这部分内容在考查中出现的可能性不高，我们主要是以了解为主。", "framework": ""}, {"id": "57", "stars": 3, "title": "试分析小说的基本特征（25山东师范大学、26湘潭大学）", "body": "小说是一种用散文形式写成的叙事性虚构作品。叙事性，指小说大多要讲述故事。虚构则指小说不是简单地摹写生活实事，而是经过艺术加工，创造出有别于生活的人物和事件。当然，后来也出现了以摹写实事为主的纪实小说。总体来看，小说的基本特征主要表现在以下方面：\n\n一、叙事性\n\n叙事性是小说最基本的特征。所谓叙事，即叙述者按照一定的叙述方式来结构事件。不同的叙事决定了小说不同的性质和面貌，关注时间和叙述是现代小说的重要特征。\n\n小说的叙述方式具体包括叙述角度、叙述者、叙述时间、叙述话语等方面。叙述者从什么角度观察故事，怎样叙述故事，都将直接关涉小说语言的表达，情节的组织，意义的揭示乃至整个作品的成败。即使处理同一素材时，若从不同的侧面，采用不同的编排方式，或运用不同的语气，也必然会出现风格迥异的小说。叙事时间的处理也直接关系到叙事的效果。叙述者在叙述中将哪些部分置前，哪些部分推后，哪些交叉，以及何处概述、何处省略等，不仅构成各具特色的叙述风格，而且表达出不同的意蕴。从某种意义上讲，古往今来，主题为爱情、死亡、痛苦、追求等的小说数不胜数，而使它们异彩纷呈的重要原因之一就在于叙述方式的千变万化。\n\n二、故事性\n\n故事性指小说的结构形态和构成因素，一般包括人物、情节和环境。故事性就是在这三者的相互作用和相互关系中产生的。\n\n人物是小说必不可少的要素之一。小说在人物形象塑造方面具有其他文学体裁无法比拟的优势，它拥有多方面细致刻画人物的手段。\n\n情节也是小说的基本要素之一，不仅人物形象的塑造主要通过情节实现，而且在充实故事、丰富故事和使故事具有可读性和吸引力等方面情节也具有重要作用。小说一般要求具有相对完整复杂的情节，即使一些篇幅较短的作品，也不可能完全没有情节和故事要素。现代小说有“情节淡化”的趋向，但这些作品只是淡化了对外在事件的描述，并不缺少由心理活动构成的情节。\n\n环境作为小说的又一重要因素，主要指故事背景和人物活动的具体环境。环境既是人物活动和情节展开的场所，又是人物、情节获得真实性、合理性和可能性的条件。小说在描绘环境特别是对场景细节的精细刻画上有得天独厚的条件。\n\n随着小说叙事方式的不断探索和创新，人物、情节和环境作为小说的基本要素的观点不断受到质疑和挑战，并受到一定程度的消解。但总的来看，故事性仍然是大多数小说的基本特征。\n\n三、虚构中的现实\n\n小说是虚构的叙事作品，小说叙述的故事是作家想象的结果，是对现实的幻想和抗争。虚构是小说叙事区别于新闻报道等文体的重要特征。\n\n小说在强调虚构性的同时又追求艺术的真实感。与其他体裁相比，小说更侧重对日常生活和普通人思想感情的描写，这种描写追求细节的具体和真实同时，小说叙事又以作者对人生的经验和对现实生活的观察、体会和理解为基础。这种虚构中的现实正是小说的特别之处。\n\n四、文体的杂糅性\n\n小说是一种最能表现生活广度的体裁，也由于它是文学家族中的后起之秀，所以，小说能够从容地从其他文体中吸取有用的成分来满足表现社会生活的需要。小说可以包容诗歌、散文和戏剧的某些片段，也可以采用书信、新闻、论文等实用文体的语汇。小说与其他文学体裁的结合，还可以产生不同的小说类型：与诗歌结合形成诗体小说，与散文结合形成散文体小说，等等。", "keywords": "叙事性 故事性 虚构中的现实 文体的杂糅性", "note": "小说是一种以散文形式写成的叙事性虚构作品。我们可以通过《红楼梦》来辅助记忆-《红楼梦》通过写清朝时期（叙事时间）贾史王薛四大家族的衰败（叙事角度），写出了作者的“一把辛酸泪”（叙事者）。这个故事通过黛玉进府、刘姥姥进大观园、宝玉挨打、抄检荣国府（情节：具体过程）等重要事件结构全篇（结构形态），以宝黛钗（人物主体）的爱情贯穿，写出了清王朝封建大家族（环境：具体情境）的没落衰败。《红楼梦》虽然是曹公创作出（虚构）的故事，但是其中刻画了当时真实的社会情景（现实）。内容中还融合了一些诗歌判词（其他体裁）和食材、药材（其他文体语汇）等名目。", "framework": ""}, {"id": "58", "stars": 1, "title": "试着从小说叙述范式和容量的角度划分小说的类型", "body": "小说的类型复杂多样，根据不同的分类标准可作出不同的区分。根据小说的语言特点可分为白话小说、文言小说；根据小说的结构体式可分为章回体小说、日记体小说、书信体小说和自传体小说等；而根据小说的叙述范式和容量的差异可分为短篇小说、中篇小说和长篇小说。\n\n一、短篇小说\n\n短篇小说一般篇幅短小、选题严格，情节单一明了、结构严密巧妙、场面集中，多叙述一个事件或事件片段，描绘一个或几个人物形象，通过揭示社会某一侧面来反映社会生活某些本质。鲁迅的《孔乙己》和《故乡》、茅盾的《春蚕》以及契诃夫的《变色龙》、莫泊桑的《项链》、欧·亨利《麦琪的礼物》等，都是文学史上的短篇小说佳作。\n\n二、中篇小说\n\n中篇小说介于短篇小说和长篇小说之间。中篇小说中的人物数量及其相互关系没有长篇小说复杂，故事情节也相对更为集中，一般也不铺张宏阔的时代背景，主要是以鲜明的人物、精练的故事情节，较丰满地反映某个具体时间段内的社会生活，如沈从文的《边城》、老舍的《月牙》、加缪的《局外人》、川端康成的《雪国》以及康拉德的《黑暗的心》等。\n\n三、长篇小说\n\n长篇小说是一种可以表现广阔生活内容的小说样式，故事情节复杂，人物形象众多，可分为若干章节，有的还可分为部、卷、集等。茅盾的《子夜》、巴金的《激流三部曲》、老舍的《骆驼祥子》、丁玲的《太阳照在桑干河上》等中国现代长篇小说都再现了深广的社会现实。巴尔扎克《人间喜剧》中的《
