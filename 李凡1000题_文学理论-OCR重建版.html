体可感的动人的生活图景。文学形象有三种高级形态：文学典型、文学意境和文学意象。文学形象是主观与客观的统一，是假定与真实的统一，是个别和一般的统一，又是确定性与不确定性的统一。\n\n二、文学意象\n\n文学意象指审美意象，是文学形象的高级形态之一，是以表达哲理观念为目的，以象征性或荒诞性为基本特征的达到人类审美理想境界的表意之象，它有四种基本特征：哲理性、象征性、荒诞性和抽象性。\n\n三、二者关系\n\n中西文论中，都有“意象”一词，并在文艺学、心理学、语言学等学科中有着广泛的用途。归纳起来，主要有四种：分别是心理意象、内心意象、泛化意象和观念意象及其高级形态的审美意象。其中泛化意象，是文艺作品中出现的一切艺术形象或语象的泛称，基本上相当于“艺术形象”或“文学形象”这个概念，简称“形象”；而观念意象及其高级形态的审美意象，则是我们常说的意象或文学意象。由于泛化意象的含义太宽泛，容易引起混淆，所以我们通常就直接称其为文学形象，而弃置这种泛化意象观，转而复活“意象”一词的古义，用它专指一种特殊的表意性艺术形象或文学形象。\n\n文学形象，当其在表现人类审美理想方面取得突出成就时，就达到了艺术至境，具有了自己的高级形象形态。人类创造的艺术至境形态即文学形象的高级形态通常有三种：文学典型、文学意境和文学意象，统称艺术至境三美神，分别简称典型、意境和意象。可以说，文学意象是文学形象的高级形态之一。", "keywords": "文学形象 具体可感 文学意象 哲理象征 泛化意象 观念意象及其高级形态的审美意象 高级形态之一", "note": "意象在古代最初是一个哲学概念，后来逐步用于对诗歌和其他文学艺术样式的评论及美学研究中。文学意象是一种特殊形态的意象，它指的是文学作品特别是诗歌中那些蕴含着独特意念而让读者获得言外之意的艺术形象。", "framework": ""}, {"id": "224", "stars": 3, "title": "结合具体作品，谈谈文学意境的基本表现", "body": "文学意境是文学形象的高级形态之一，是抒情型作品中呈现的那种情景交融、虚实相生的形象系统及其所诱发和开拓的审美想象空间。\n\n文学意境的主要表现特征是情景交融。意境创造就是把二者结合起来的艺术。由于它直接关系着意境的生成，所以古人在这方面研究得十分深透。有了三种情景交融的不同类型：\n\n一、景中藏情式\n\n在这一类意境创造中，作家藏情于景，一切都通过逼真的画面来表达。虽不言情，但情藏其中，往往更显得情深意浓。如李白的《送孟浩然之广陵》全诗都是对客观景物的具体描写，字面上一点也没有透露出对友人的态度，但从那烟花三月、黄鹤楼头的美好景色中，已透露出对友人的祝福，诗中也没有直抒对友人依依不舍的眷恋，而是通过孤帆消失，江水悠悠和久伫江边若有所失的诗人形象，表达得情深意挚。表面上这首诗句句都是写景，实际上却句句都在抒情，真是一切景语皆情语。这类作品在现代诗歌和散文中也并不少见，朱自清的《荷塘月色》、鲁迅的《秋夜》等均属这一类。\n\n二、情中见景式\n\n这种意境的创造方式，往往是直抒胸臆。有时不用写景，但景却历历如见，如陈子昂的《登幽州台歌》虽不见景物描写，但当了解了陈子昂写诗时的险恶处境和痛苦心情之后，你的面前便会出现一幅闪耀着血泪之光的图画：一片浩渺无际的天宇，一座兀然耸立的高台，一位独立苍茫的诗人。在诗人的悲怆中，仿佛会看到昔日燕昭王在此招贤纳士的历史画面；会推想到唐王朝武氏专权的可怕世态，更会体味到诗人报国无门的悲愤和天才末路的痛苦。而且这些历史的和现实的、宇宙的和人生的因素，都会随诗人情感的喷发变成感人的色彩和旋律，弥漫整个空间。这也就是诗人开创的那个审美想象的空间，在这个空间中，一切都成了有形的图画。李白的《月下独酌》《行路难》，陆游的《示儿》等名篇，都是通过这种方式创造了意境。\n\n三、情景并茂式\n\n这一类是以上两种方式的综合型，抒情与写景在这里达到了浑然一体的程度。如杜甫《闻官军收河南河北》一诗欢畅明快，一气贯注：诗人为收复蓟北的消息激动得老泪纵横，妻子和儿子都消失了愁容。诗人胡乱卷起诗书，欢喜若狂，又放歌纵酒，手舞足蹈，畅想回家的路线，浑然不知自己已像一个天真烂漫的儿童。诗中处处情态毕现，情景并茂，自然天成。苏轼的《念奴娇·赤壁怀古》，毛泽东的《贺新郎》（赠杨开慧）、《沁园春·长沙》，都属于这一类。", "keywords": "情景交融 景中藏情式 情中见景式 情景并茂式", "note": "①意境的界说：意境是指抒情作品中呈现的那种情景交融、虚实相生、活跃着生命律动的韵味无穷的诗意空间；如果典型是以单个形象而论的话，意境则是由若干形象构成的形象体系，是以整体形象出现的文学形象的高级形态。②这个题目是上个题目中的一个小点的展开，大家要注意文学理论中的这种题目形式。", "framework": ""}, {"id": "225", "stars": 2, "title": "在文学文本中，语言有哪些审美功能", "body": "一、传达审美信息\n\n语言是一种传达信息的媒介，不同文本传达不同的信息，文学文本的语言所传达的是审美信息。由于要传达审美信息，文学文本要运用多种修辞方式以使审美信息的传达更加圆满、完美。为了达到给人新鲜的审美感受，常常需要在艺术上创新。而“陌生化”正是推陈出新的重要手段。\n\n二、造型性\n\n文本语言层对审美意蕴的传达，是通过文学形象的创造来实现的，但仅仅用语言来呈现形象美的每一个细部，以求达到绘画美的逼真，这并不是文学语言之长。因此，文学语言的造型性主要表现为通过诱发读者的审美想象，来帮助读者建构审美意象。在《伊利亚特》中，荷马并不直接写海伦的美，只写当为这个女人所引起的长达十年的战争结束后，海伦出现在特洛亚长老们面前时所引起的惊赞，通过美所产生的暗示来激发读者的审美想象，从而完成了艺术形象的创造。\n\n三、对独具特色的不同言语风格的显示\n\n对于一个独具创作特色的作家来讲，对言语的独创性、个性化的追求使得他的作品必然体现出鲜明的语言风格。而正是不同的语言风格，使不同的作家、作品得以相互区别，从而获得了自身存在的意义和价值。", "keywords": "传达审美信息 造型性 对独具特色的不同言语风格的显示", "note": "由于文学艺术以语言作为媒介和手段，使得语言艺术形成了许多自身独具的审美特征，还可以从间接性与广阔性、情感性与思想性、结构性与语言美等几个方面进行思考。", "framework": ""}, {"id": "226", "stars": 3, "title": "简述实境与虚境的关系并举例", "body": "意境包括两个部分：一方面是“如在目前”的较实的因素；另一方面是“见于言外”的较虚的部分。意境从结构上看，正是二者的结合。所以后人干脆把意境中较实的部分称为“实境”，把其中较虚的部分称为“虚境”，二者既相互区别，又相互联系。\n\n一、区别\n\n实境是指逼真描写的景、形、境，又称“真境”“事境”“物境”等；而虚境则是指由实境诱发和开拓的审美想象的空间。它一方面是原有画面在联想中的延伸和扩大，另一方面是伴随着这种具象的联想而产生的对情、神、意的体味与感悟，即所谓“不尽之意”，所以又称“神境”“情境”“灵境”等。\n\n二、联系\n\n（一）虚境是实境的升华\n\n虚境是实境的升华，它体现着实境创造的意向和目的，体现着整个意境的艺术品位和审美效果，制约着实境的创造与描写，处于意境结构中的灵魂和统帅的地位，因此才有神境、灵境的别名。\n\n以南宋诗人叶绍翁《游园不值》为例，此诗具体描写的园外之景，就是实境。而诗人不得进门的遗憾，由一枝红杏引起的怦然心动的愉悦，以及由此引起的对满园春色、百花盛开的推测与联想，则是由实境开拓的第一层审美想象的空间；由于红杏的探头墙外，紧闭的园门与联想中的满园春色，又构成了新的矛盾关系，从而把人引入哲理的思考，得出美好的东西总是关锁不住的结论，这是由实境开拓的第二层审美想象空间。\n\n（二）虚实相生\n\n虚境不能凭空而生，核心并不等于艺术表现的重心。在意境创造过程中，一切还必须落实到实境的具体描绘上。也就是说，再好的虚境，也要由实境得来。虚境与实境看似两个部分，但一到艺术表现时，功夫全要落实到对实境的描写上。对于如何通过实境的描写完美地表达出虚境，古人总结出“真境逼而神境生”“实者逼肖，虚者自出”，道出了意境创造的奥秘。然而“实者逼肖”，并非是照抄生活，而是要在设想中的虚境指导下对生活物象进行选择、提炼和加工。这种选择、提炼和加工，都是以更好地表达或开拓虚境为目的，既求形似，又求神似，而且后者更为重要。总之，虚境要通过实境来表现，实境要在虚境的统摄下来加工。\n\n【李凡说：实境就是客观外在世界，它是艺术创造的基础，但实境是死的，无情无趣、不能动人的。而虚境是在实境的基础上，经由作者主观改造后的心灵景象，这样的文学景象才能真正地打动人。】", "keywords": "实境 逼真描写 虚境 审美想象空间 虚境是实境的升华 虚实相生", "note": "", "framework": ""}, {"id": "227", "stars": 5, "title": "“审美意象”与一般的意象有何不同？审美意象的基本特征是什么（26南京师范大学）", "body": "一、审美意象与一般意象\n\n一般的意象主要有四种：心理意象、内心意象、泛化意象、观念意象及其高级形态的审美意象。其中，泛化意象是文艺作品中出现的一切艺术形象或语象的泛称，基本上相当于“艺术形象”或“形象”这个概念。本书所讲的“审美意象”则指的是以表达哲理观念为目的，以象征性或荒诞性为其基本特征的，在某些理性观念和抽象思维的制导下创造的具有求解性和多义性的达到人类审美理想境界的“表意之象”。它不仅是观念意象的高级形态，也与典型、意境一样，属于艺术至境的高级形象形态之一。\n\n二、审美意象的基本特征\n\n（一）审美意象的本质特征是哲理性\n\n中国古代把意象看成是表达“至理”的手段，二十世纪现代派文学艺术也把表达哲理和观念看作是意象创造的目的和最高审美理想。这就决定意象从本质上讲，就是“表意之象”，用形象直接表达哲理的文学艺术作品，往往就是意象艺术，这就使它与以再现生活为目的的典型和以抒情为目的的意境区别开来，形成了人类审美理想表现形态的又一类型。\n\n（二）审美意象的表现特征是象征性\n\n这里所说的象征是一种狭义的象征。也就是说，意象实际上已成为某种“意义”的载体。这种形象并不直接就它本身来看，而是就它所暗示的一种较广泛、较普遍的意义来看。于是象征也成了一种判定一个艺术形象是否为审美意象的尺度。\n\n（三）审美意象的形象特征是荒诞性\n\n中外文论都已揭示了审美意象往往是一种有悖常规的形象，它外在形态的荒诞奇怪和内在事理的有悖常理构成了“荒诞”的双重内涵。审美意象一般都是通过形象上的“愈出愈奇”和事理上的“不可思议”引起人们的思考。即使有的意象不具有外在的荒诞性，也必然含有某种内在的荒诞性，如《等待弋多》等。\n\n（四）审美意象的思维特征是抽象思维的直接参与\n\n由于意象在本质上是以表达哲理为目的的“表意之象”，所以它的创作思维过程是从抽象到具象的。如艾略特所说的那样要为思想寻找“客观对应物”。而物象的选择和形象的设计是受抽象思维即“意”的制约的。事实上，生活中的客观物象与主观的抽象思维完全对应的情况是非常少见的，因此作家、艺术家在创造意象时就必须对客观物象进行选择、改造，包括嫁接、组合和重新设计等，由于意象的设计要与所表之“意”取得对应，生活物象本来的样子便被打破，从而形成奇辟荒诞的形象形态。严格地说，它已不是什么“客观对应物”，而是一种“人心营构之象”了，这种主观性在抽象型意象中往往会发挥到极致。\n\n（五）审美意象的鉴赏特征是求解性和多义性\n\n由于在创造意象时抽象思维的直接参与，便使意象鉴赏思维的特点变成了审美“求解”的过程。即从对具体形象的揣摩、思考达到对哲理观念的领悟。人们的审美心理也变成了猜测的过程。\n\n但是好的象征意象，又往往使人始终也难得出最为确切的结论，好像有无数个“解”。这是因为一方面作家有意隐藏自己的立意，以求神秘含蓄；另一方面是作家选择的象征物，对于作家来说虽是他为思想创造的“对应物”，但是读者并不了解作者的思路，而只能凭自己的知识、经验和智慧去猜想，这样，不同的读者便会猜出不同的意义来，有的甚至南辕北辙。这便是审美意象多义性的原因。", "keywords": "心理意象 内心意象 泛化意象 观念意象及其高级形态的审美意象 本质特征是哲理性 表现特征是象征性 形象特征是荒诞性 思维特征是抽象思维的直接参与 鉴赏特征是求解性和多义性", "note": "文艺创作过程中意象又称为“审美意象”，是想象力对实际生活所提供的经验材料进行加工生发，而在作者头脑中形成的形象显现。", "framework": ""}, {"id": "228", "stars": 4, "title": "审美意象是怎样分类的", "body": "审美意象的分类是在观念意象的高级形态中进行的，从表意的方式这一角度着眼，可以把审美意象分为两种，即寓言式意象和符号式意象。\n\n一、寓言式意象\n\n所谓寓言式意象，是指通过一则故事显示一种哲理或观念，而这正是这则故事的主旨。寓言式意象的显著特征就在于有故事情节，哪怕是最稀薄淡化了的故事情节。此类意象常见于叙事性作品，以叙事诗、小说和戏剧的形式，通过有情节的整体形象系统来实现某种观念的表达。寓言作为一种文体在中国先秦诸子散文中十分发达，说明这种意象是人类创造和使用的最古老而又最普遍的艺术形式之一。\n\n二、符号式意象\n\n所谓符号式意象，是指不具有情节性的整体意象和单个意象。这类意象以它整体的或单个的形象特征，直接暗示和象征着某些观念或哲理，其作用从本质上看，不过是一种表意的符号，所以称为符号式意象。符号式意象又可分为两类：一类是抽象型，一类是具象型。\n\n（一）抽象型符号式意象在建筑、绘画、雕塑等视觉艺术中比较发达，而在语言艺术中比较少见。所谓抽象型，是指你找不出适当的自然物体概念来描述它的形态，而只有借助于某些抽象的概念、术语去表达它。比如埃及的金字塔，你只有用巨大的“方锥体”这个概念来描述它，某些现代雕塑，你不好说出它的形态，而只能用“S形”“不规则图形”等来描述它。西方现代抽象雕塑和抽象绘画也属于这一类，但立意隐晦。\n\n（二）具象型符号式意象，一般是由自然物体的变形、夸张和拼接组合而成。不论在哪一门艺术中都是符号式意象占主要形态。比如我国的龙凤图像，我国的国徽，埃及的狮身人面像，黄河边上的雕塑《哺育》等。在文学中，这种形象也很常见，如闻一多的《死水》《红烛》，郭沫若的《骆驼》，臧克家的《老马》等等。", "keywords": "寓言式意象 故事 叙事性作品 符号式意象 不具有情节性 抽象型 具象型", "note": "审美意象即对象的感性形象与自己的心意状态融合而成的蕴于胸中的具体形象。该词原为哲学概念。从表达方式这一角度着眼，可以把审美意象分为两种，即寓言式意象和符号式意象。所谓寓言式意象，是指通过一则故事显示一种哲学或观念。所谓符号式意象，是指不具有情节性的整体意象和单个意象。", "framework": ""}, {"id": "229", "stars": 3, "title": "试分析文学叙事的基本特征", "body": "叙事性作品是文学作品中同抒情性作品相区别的一种基本的话语类型。在文学发展的漫长历史过程中，文学作品的样式与形态发生了巨大的变化，越来越趋于丰富、复杂和多样化。尽管如此，我们还是可以在一大批文学作品中发现同早期神话与史诗的某些基本特征相似的东西。简单地说，文学叙事就是用话语虚构社会生活事件的过程。文学叙事的基本特征包括两个方面：\n\n一、叙事的内容是社会生活事件过程，即人的社会行为及其结果\n\n叙事的对象是社会的人，这是一切文学作品的共同现象。叙事性作品不同于抒情性作品和表意性作品的基本特点在于，它着重表现的不是主观的思想情感，而是客观的事件。文学都是对现实的把握，但把握的角度不同：抒情表意文学所要把握的是社会现实的精神或情感意义，这是作者的主观感受、领悟与认识，因而其内容主要是对内在的思想情感的表现；叙事文学则是讲故事，即通过对外部事件的描述来把握社会现实本身。叙事的兴趣不在于静止的人或物，而在于动态的事件，即人的行为及其造成的后果，它的认识价值就在于显示了社会生活的发展变化过程及其意义。\n\n二、叙事是话语的虚构\n\n文学叙事是一种特殊的话语系统，同一般话语有一个重要的区别，即所指对象不同。一般话语的所指对象是在话语之外的世界中，叙事文学是用话语来虚构艺术世界。叙事是话语的虚构，只要符合生活与情感的逻辑就行，无须到生活中去求证，但却可能在更深刻的层次上揭示人生与现实社会的本质。\n\n叙事作为话语的虚构而同客观的现实之间产生距离，这是叙事从街谈巷闻或实用记事转化为艺术的关键。一部小说如果不能使读者根据小说中世界的逻辑去思考和感受，而总是使人把它当作实际中已经发生过的人和事，读者的兴趣便从书中转移到了身边的现实。只有当读者仅仅被叙述逻辑的合理性以及描写、抒情和解释所吸引时，才会具有文学的审美价值。优秀的叙事文学能够反映现实生活的真实，然而又超越了个别的，已经发生的偶然事实，是用话语重构的世界。这个话语的世界虽不等于现实本身，但却可能在更本质的层次上解释社会现实的内在意义。", "keywords": "社会生活事件过程 人的社会行为及其结果 动态的事件 话语的虚构 同客观的现实之间产生距离", "note": "关于叙事的特征，我们需要从正反两个方面去理解。一方面，叙事是现实社会的反映，另一方面，叙事对现实的反映是主观的，能动的，叙事与现实之间存在的差距。理解这一点，需要我们联系文学的意识形态属性。叙事与抒情的区别在考查中也会出现，大家也要注意一下。", "framework": ""}, {"id": "230", "stars": 3, "title": "试分析文学叙事审美意识形态本质对文学叙事的影响", "body": "文学是一种审美意识形态形式。文学叙事的审美意识形态本质既制约着叙事的内容，也制约和影响着叙事的形式。\n\n一、文学叙事的审美意识形态本质制约着叙事内容\n\n从叙事的内容来看，任何叙事都是对现实世界的某种解释。从最早的叙事作品-神话、史诗、英雄传奇来看，所讲述的事件多出自想象和附会，目的是为了对当时人们还无法解释的宇宙、人类、民族的起源或灾变等自然现象做出解释。\n\n叙事对世界的解释与一般哲学、伦理学、历史等意识形态话语的不同之处在于，它的解释不是概念，而是对历史事件发展过程的体验和情感态度。比如巴尔扎克的《人间喜剧》中包含着对法国大革命以后社会文化的解释，然而这种解释是通过生动的生活场景和人物性格的描绘而感染读者，让人产生对社会历史的审美体验、感动和领悟。这就是说，叙事内容中所包含的是审美意识形态。\n\n二、文学叙事的审美意识形态本质制约着叙事方式\n\n从叙事方式来看，一定的叙事写作方式形成一定的写作风格，而种种风格背后的制约要素之一就是审美意识形态。例如，在19世纪的西方叙事观念中兴起了“写实”的主张，追求客观、冷静的写作风格，试图表现事物本来的“真实”面目。当时法国作家从司汤达到左拉，都倡导这种看起来似乎没有意识形态倾向的主张。然而，写实主义所主张的客观与真实，恰恰典型地代表了19世纪西方资本主义文化的意识形态特征。再如20世纪，新的叙事观念崛起，19世纪客观观察描写、无所不知的叙述人、严密的故事逻辑都受到挑战，其叙事观念被斥为矫饰、不真实，而“意识流”等主观化的叙事风格表现的内容才被认为是地道的心理真实。虽然叙事由客观走向主观，但并未因此而从意识形态走向真实，不过是一种新的审美意识形态-现代主义在反抗工业文明中形成的以幻灭感、唯我主义、非理性为核心的审美观念-在叙事中的表现而已。\n\n总之，叙事的内容与方式都体现着一定的审美意识形态特征。但同时也应当注意到，在具体的叙事行为中，审美意识形态性质的表现是很复杂的。意识形态性质在叙事中的体现应当从叙事活动的整体去把握，对具体的叙事行为应当用辩证的方法作具体分析，而不应简单化。", "keywords": "制约着叙事内容 制约着叙事方式", "note": "由于文学本质上是一种审美意识形态，因而特定的文学叙事行为也必然会渗透进特定的意识形态。所以，叙事具有意识形态本质。意识形态既制约着叙事的内容，也制约着它的形式。从叙事的内容来看，任何叙事都是对现实世界的某种解释，必然带有时代、民族等意识形态的印记。从叙事方式来看，一定的叙事写作方式形成一定的写作风格，而种种风格背后的制约要素之一就是审美意识形态。", "framework": ""}, {"id": "231", "stars": 1, "title": "试分析叙事的构成", "body": "法国叙事学研究者热奈特提出，人们谈论的叙事学中的“叙述”这个词，实际上包括了三个不同的概念：一个是所讲述的故事内容，一个是讲述故事的语言组织，还有一个就是叙述行为。具体来说，文学叙事主要由以下要素构成：\n\n一、叙述内容\n\n叙述内容指构成一段叙述话语主题的故事内容，即被讲述的故事，包括事件、人物、场景等。传统的叙事文学创作中常常有意无意地假定同接受者之间有一种默契，要求读者相信所叙述的内容是真实的。原始氏族的人们传诵的史诗、神话与英雄传奇，尽管内容多是诡谲怪异的虚构，却被当作真正发生过的历史事实而被本氏族人民传承下来。后代的叙事文学沿袭了这一心理传统。例如我国唐代文人撰写的神奇荒诞的传奇故事，往往在篇末说明是作者从何处得知，有时甚至还要介绍作品中人物的近况如何，等等，显然是希望读者把这些离奇的故事当做真实的事实来接受。\n\n二、叙述话语\n\n叙述话语即叙事作品中讲述故事的语句。如果认为叙事的全部目的就在于向读者告知一些生活事件，而这些生活事件本身的存在与否不取决于叙述话语，那么叙述话语就只不过是传达故事内容信息的被动载体，不会具有能动的意义。但事实上，话语不仅影响叙述内容，而且影响着对叙事的接受。同一个生活事件是这样“说”，还是那样“说”，其效果可能是完全不同的。\n\n三、叙述动作\n\n叙述动作即产生出叙述话语的“叙述”活动本身。比如鲁迅的小说《故乡》的叙述动作可以这样概括：小说中第一人称叙述人向读者回忆和评述他某次回故乡时的见闻与感受。叙述内容跟叙述话语有着极为密切的关系；而叙述话语又始发于叙述动作。没有叙述动作，便没有叙述话语。传统的叙事所制造的“真实”幻觉掩盖了叙述动作的重要性，而在现代叙事作品中，叙述动作的意义则鲜明地凸显了出来。", "keywords": "叙述内容 叙述话语 叙述动作", "note": "文学叙事主要由叙述内容、叙述话语、叙述动作三个部分构成，其中，叙述内容是叙事文学中最先被关注到的内容，但在近现代以来的文学作品之中，叙述话语和叙述动作这两个要素越来越被凸显了出来，因而研究者对这两个要素的关注度也越来越高。", "framework": ""}, {"id": "232", "stars": 2, "title": "试分析叙事内容的具体成分", "body": "叙事就是讲故事，从这个意义上讲，叙述内容的基本成分就是故事。只要是叙事，它的叙述内容就必然是某种“事件”-在某种环境中的某个或某些人身上发生了些什么，因此，叙事内容主要包括事件、情节、人物和场景四个部分。\n\n一、事件\n\n事件由所叙述的人物行为及其后果构成，一个事件就是一个叙述单位。作品中的事件由若干层次构成。\n\n任何事件在作品中都承担着一定的作用。但每个事件在故事中的关系和作用是不完全相同的。我们可以根据这些事件在故事进展中的作用而划分出两大类别：第一类事件的作用是推动故事情节的发展。另一类事件的作用是塑造生动的形象。这类事件通常并不参与推动故事情节的发展，只是使故事的意义显现和丰富化。\n\n这两类事件在故事中的作用是相辅相成的：缺少了推动情节的事件，故事的连续性就会被破坏；缺少了塑造形象的事件，故事的生动性和意义内蕴都会受到损失。有些作品中推动故事情节发展的事件居于突出地位，因而故事情节进展快、悬念迭出，这就是情节性强的故事；有些作品中故事情节不是很紧张，叙述以塑造形象的事件为主，故事中的情境具体、性格生动，或心理描写细腻。\n\n当然，在具体分析事件时还应注意到，一个事件在故事中可以同时兼具几种作用。\n\n二、情节\n\n情节是按照因果逻辑组织起来的一系列事件。情节性叙事作品中的世界作为对现实世界的反映，是作者从自己的思想感情倾向出发对生活现象加以组织的结果，其中体现着作者的主观能动性，当然也不可避免地带着作者的局限和偏见。\n\n并不是说任何按因果逻辑组织起来的事件都会成为叙事作品中的情节，只有在事件的发展中表现出人物行为的矛盾冲突，由此揭示人物命运的变化过程，才真正算得上是情节。\n\n三、人物\n\n叙事作品中的人物是事件、情节发生的动因。叙事作品中人物具有二重性的特点。一方面，人物具有“行动元”特征，是推动故事情节发展的行动要素。另一方面，人物具有“角色”特征，即使情节离奇的作品，其中的人物也可以被塑造成生动具体的形象而被读者当作“真的”、完整的人格。\n\n人物同时具有“行动元”和“角色”两重特性，但这两重特性并不总是相互吻合的，有时一个“行动元”可以由几个角色担任，反过来，一个角色也可能包括几个行动元。行动元与角色的二重特性使人物在作品中的地位和意义变得复杂起来。\n\n四、场景\n\n叙述内容中具体描写的人物行为与环境组合成为场景。一部叙事作品在叙述故事中必须有场景，也就是说，故事的进展要把人物的行动放在具体的环境中构成场景，才能显现为生动具体的艺术形象。没有场景的作品尽管也可以有完整的故事线索，但在读者的理解和想象中，如果只有抽象的过程而构不成生动的形象画面，就无法产生艺术感染力和审美价值。\n\n场景在作品中的安排并非千篇一律。多数作品包括若干不连贯的场景，由概略叙述或省略跳跃的方式联系起来。一般叙事作品中场景的详细叙述同概略叙述是交替出现的：需要重点表现的情节高潮出现在场景的详细叙述中，而无关紧要的过渡性情节则用粗线条概略叙述。", "keywords": "事件 情节 人物 场景", "note": "叙事内容的基本成分就是故事，换句话说，叙述就是讲故事。而在叙述内容之中，事件是最基本的叙述单位，除此之外，还需要情节、人物、场景等将事件组织串联起来，构成一部完整的作品。对于这些要素，大家可以结合小说三要素进行理解记忆。", "framework": ""}, {"id": "233", "stars": 3, "title": "谈谈叙事作品中人物自身二重性特点的认识", "body": "叙事作品中的人物是事件、情节发生的动因。但在不同作品中，人物和情节的关系不尽相同。性格与情节的主次地位问题是叙事理论史上的一个争议点，产生这种分歧的根源在于叙事作品中人物自身的二重性特点：行动元与角色。\n\n一、人物具有“行动元”特征\n\n人物具有“行动元”特征的意思就是说，人物是推动故事情节发展的行动要素。有许多叙事作品，尽管其中的人物姓名、身份，故事发生的时间、地点都不相同，却给人以相似甚至雷同的感觉，这是因为其中的人物虽然名称、身份变来变去，其实不过是同一类型的行动元，就是说他们的行动目的、意义与基本方式相似。\n\n比如许多才子佳人小说，尽管人名、地点、时间都不同，却总是由与《西厢记》相似的几个主要行动元构成：故事最终结局的追求者（才子，如张生）、追求对象（佳人，如崔莺莺）、促进者（朋友、侠客等，如红娘）、反对者（有权势的人物，如老夫人），竞争与破坏者（小人，如郑恒）。\n\n二、人物具有“角色”特征\n\n“角色”是指具有生动具体的形象和性格特征的人物。传统叙事理论对人物作为角色特征的研究十分重视。西方早在贺拉斯的《诗艺》中，就开始强调按照人物的年龄、身份等特点写出合情合理的人物。到了近代，黑格尔明确提出性格是艺术表现的真正中心，突出了表现人物形象特征的重要性。现代的马克思主义文学理论更强调塑造人物形象时，要在鲜明生动的个性中包含具有普遍意义的共性，揭示出社会生活中某种本质和规律，因而可产生特殊的认识与审美价值。这种“角色”就是上一章所说的“典型人物”。中国传统叙事理论对人物的研究同样注重“角色”的生动性。\n\n即使情节离奇的作品，其中的人物也可以被塑造成生动具体的形象而被读者当作“真的”、完整的人格，即具有“角色”特征。\n\n三、人物两重特性的关系\n\n人物同时具有“行动元”和“角色”两重特性，但这两重特性并不总是相互吻合的，有时一个“行动元”可以由几个角色担任，如《西游记》中的许多妖魔，虽是不同角色，具有不同的性格特点，但对情节发展而言，都属同一行动元，即唐僧取经的阻碍者；而唐僧师徒四人则构成一个行动元：取经人。反过来，一个角色也可能包括几个行动元，如猪八戒、沙僧、白龙马，都是由阻碍者变成取经人的。行动元与角色的二重特性使人物在作品中的地位和意义变得复杂起来。\n\n行动元是情节的动因，表现为人物“做什么”；而角色是形象的基础，表现为人物“怎样做”。我们在分析叙事作品中的人物时，必须注意这二重特性的作用及其区别。", "keywords": "行动元 行动要素 角色 生动具体的形象和性格 关系 并不总是相互吻合的", "note": "叙事作品中的人物，一方面是故事的有机组成部分，通过自己的行动推动故事情节的发展；另一方面又具有具体的形象和性格特征。评论家们在讨论性格与情节的关系时，分别注意到了人物这二重特征的一个方面，因而产生了分歧。在考查中，可能会给出某位评论家的相关论点让大家去分析，这样的题目大家要有所准备。", "framework": ""}, {"id": "234", "stars": 1, "title": "谈谈你对叙事作品结构的认识", "body": "叙述内容的基本成分是故事，而内容的存在形态则是结构。叙事作品的结构是指作品中各个成分或单元之间关系的整体形态。叙事作品是一种话语系统，它的内部结构可以从两个向度进行分析：首先是历时性向度，即根据叙述的前后顺序研究句子与句子、事件与事件之间的关系，一般文艺理论中所讲的结构主要是指这种历时性向度的结构关系，称为表层结构。其次是共时性向度，研究内容各个要素与故事之外的文化背景之间的关系，称为深层结构。\n\n一、表层结构\n\n从叙述层面来分析作品的结构，首先应当确定最小叙述单位。从句法分析的角度可以把叙述内容化简为一系列基本句型，最小的单位叫做叙述句。一个故事中可包容若干基本事件，每个基本事件的结构特征可以通过句法关系而显示出来。\n\n当我们把故事化简到极致，有时可用一个单句来概括一个故事。一般情况下，对故事结构化简提炼的结果是形成若干叙述句，这些句子之间是不可任意错乱的结构关系，即序列。很多作品中的序列远为复杂，不仅表现为叙述句的多少，更重要的是若干序列的组合。比如在一个基本序列中嵌入一个或若干个次级序列，故事套故事；或一个序列接一个序列，形成连环；还可以几个序列交织并行，等等。重重组合方式使故事结构复杂化，从而给阅读活动带来更多的乐趣。\n\n二、深层结构\n\n深层结构就是作品潜含的文化意义，植根于一定文化中的深层社会心理，因而往往呈现为多义的状态，造成译解的困难和歧义。因此，对同一部作品深层结构的分析常常会得出不同层次、不同角度的多种结果。\n\n深层结构存在的依据，是相信具体的叙述话语同产生这些话语的整个文化背景之间，存在着超出话语字面的深层意义关系。当代法国人类学家列维·斯特劳斯在研究神话叙事的意义时采用一种打乱叙述顺序，而将各个神话要素按照某种相似特征重新组合的方式进行译解，从中寻找支配具体话语的深层文化关系。", "keywords": "历时性向度 表层结构 共时性向度 深层结构 叙述句 潜含的文化意义 多义状态", "note": "所谓表层结构，就是作品叙述层面所呈现出来的历时性结构，像是叙述的前后顺序、句子之间的联系这些；而所谓深层机构，就是故事各个要素与故事之外的文化背景联系所呈现出来的共时性结构，像是现实思潮对故事结构的影响这些。这部分内容基本不会在考查中出现，但要我们有所了解。", "framework": ""}, {"id": "235", "stars": 3, "title": "谈谈你对叙事行动的认识", "body": "行动是推动事件进展的直接原因，对于叙事内容的分析有重要意义。\n\n一、行动逻辑的基本形式：三段式序列。\n\n（一）可能性。一个行动将要发生，或具有了发生的条件。\n\n（二）变为现实。即行动开始进行。这是故事内容的主要部分。这一阶段也可能以否定的形式出现：行动由于某种原因而被阻止或取消，没有变为现实，从而导致故事发展方向的改变或出现新的序列。一个情节曲折的故事常常通过行动被阻断或否定来打破读者的期待，从而造成悬念。\n\n（三）取得结果。这可以是行动成功，达到目的；也可以是行动失败，没有达到目的。总之一个行动在此阶段结束全过程。\n\n二、行动序列的典型形式\n\n一个故事中的行动常常可能是几个行动序列的复合，最典型的形式有如下几种。\n\n（一）首尾接续式。一个行动的结果成为另一个行动发生的可能性，从而形成一环接一环的情节链，使故事得以一直延续下去。传统的章回小说往往用这种形式把相对独立的故事串联成长篇小说，说书人便以此来吸引听众的兴趣。当代许多武侠小说也使用这种形式，甚至可以把几部长篇小说用这种首尾接续的形式组织成一个长长的复合系列，从而使读者保持长时\n\n间的期待。\n\n（二）中间包含式。一个行动的展开过程中又包含着作为手段的次一级行动序列，在这次一级序列的展开中还可以再包含更次一级行动序列，依此类推。这就是大故事里面套小故事、总的情节线索里面再细分出更具体的行动细节的复合方式。实际上，除了情节简单的民间故事、寓言或微型小说外，一般叙事文学作品叙述中的情节过程通常都要在大的行动序列中包含更多的行动细节，这样才能使故事中的行动具体化而不是成为抽象的过程。\n\n（三）左右并连式。同一事件序列中的行动可能通过变换角度而形成平行对应的两个序列。武侠或惊险样式叙事作品常常使用这种组织行动的方式，这种行动序列更容易造成紧张感，所以情节紧张的叙事样式使用这种方式较多。\n\n一般说来，一部小说，尤其是有相当大容量的长篇小说，不可能只有一种简单的行动模式，通常都是由几种复合序列综合形成的更为复杂的行动序列。", "keywords": "直接原因 基本形式 可能性 变为现实 取得结果 行动序列典型形式 首尾接续式 中间包含式 左右并连式", "note": "关于行动，我们需要重点掌握的，一个是行动逻辑的基本形式，一个是比较基础的三种行动序列的复合形式。其中，行动逻辑的基本形式可以大致理解为开端、发展、结局，而行动序列的典型形式，我们则可以结合一些具体的作品进行理解。", "framework": ""}, {"id": "236", "stars": 3, "title": "试分析故事时间与文本时间的关系", "body": "所谓“故事时间”，是指故事发生的自然时间状态；而所谓“文本时间”（也可以称为“叙事时间”），则是叙事文本的顺序和长短等时间状态。前者是故事内容中虚构的事件之间的前后关系，而后者是作者对故事内容进行创作加工后提供给读者的文本秩序。文本时间和故事时间之间的关系主要从三个方面表现出来，就是时序、时距和频率。\n\n一、时序\n\n叙事作品中的时序是文本时间顺序与故事时间顺序相互对照形成的关系。所谓文本时间顺序是文本中展开叙述的前后顺序，即叙述者讲述故事时从开头到结尾的次序。而故事时间顺序是故事内容从开始发生到结束的自然发展顺序。\n\n（一）顺叙（顺时序）\n\n通常人们相信，自然的叙述顺序应当是文本时间序列与故事时间序列一致。编年史式的故事（如典型的史传文学）明显地体现出这种一致性来：叙述的前后顺序就是故事内容的前后顺序。这样的叙述就是顺时序叙述，也叫“顺叙”。\n\n（二）逆时序\n\n文本时间序列与故事时间序列之间还存在种种不一致的形式，即一般所说的逆时序。逆时序的叙述由于违反了人们理解的事物发展顺序，因而容易产生吸引人注意力的效果。逆时序的叙述方式在很古老的叙事作品中就已出现了。逆时序叙述的一种表现方式是“倒叙”。另一种逆时序叙述方式是插叙。\n\n在故事中叙述次序是可以变换的，既可以从顺叙变换为倒叙或插叙，也可以在倒叙或插叙中又转入顺叙。叙述次序的变换会造成故事情调、节奏等方面的改变。\n\n二、时距\n\n时距也可称为叙述的步速，是故事时间长度与文本时间长度相互比较对照所形成的时间关系。两种时间长度相互一致的时间关系可以算做一种匀速叙述的关系。当然，由于文本时间长度事实上是无法精确计量的，所以所谓“速”只不过是一种概念意义上而非测量意义上的匀速。以这种“速”叙述为基准，就可以区分出不同叙述速度的各种时距。\n\n简单地说，不同的时距可以影响叙事速度向两个方向变化：一是变快，故事时间长而文本时间短，即用相对简短的话语叙述较长时间里发生的事件。二是变慢，就是用较长的文字来叙述很短时间里发生的故事。\n\n三、频率\n\n频率是指一个事件在故事中出现的次数与该事件在文本中叙述的次数。不同的叙述频率会形成不同的阅读效果。比如讲述发生过若干次的事就会形成重复的效果，如海明威的《老人与海》中一再叙述重复出现的事件。一次又一次地讲述反复发生的事件，这种重复的效果是使不断发展、流逝的生活事件中某些东西有节奏地重复显示，从而提示出一种恒定的意义或产生某种象征意蕴。《老人与海》中对重复发生的行动重复叙述，就是在突出老人强韧的意志。\n\n【李凡说：在这一部分中，我们首先要明确故事时间和文本时间这两个比较关键的概念，前者是一种自然的时间状态，而后者则是一种文本秩序。二者之间的关系，主要从时序、时距和频率这三个方面展现出来，对于这三个概念我们也要明确。这一部分中涉及的这些重要的名词解释，大家也要关注一下。】", "keywords": "时序 顺叙 逆时序 倒叙 插叙 时距 两个方向变化 频率 在文本中叙述的次数", "note": "", "framework": ""}, {"id": "237", "stars": 2, "title": "谈谈你对时序的认识", "body": "叙事作品中的时序是文本时间顺序与故事时间顺序相互对照形成的关系。所谓文本时间顺序是文本中展开叙述的前后顺序，即叙述者讲述故事时从开头到结尾的次序。而故事时间顺序是故事内容从开始发生到结束的自然发展顺序。\n\n一、顺叙（顺时序）\n\n通常人们相信，自然的叙述顺序应当是文本时间序列与故事时间序列一致。编年史式的故事（如典型的史传文学）明显地体现出这种一致性来：叙述的前后顺序就是故事内容的前后顺序。就拿《三国演义》来说，每一回都按照故事内容的次序前后衔接，故事就这样随着事件的发展一步一步地讲下去。这样的叙述就是顺时序叙述，也叫“顺叙”。\n\n二、逆时序\n\n文本时间序列与故事时间序列之间还存在种种不一致的形式，即一般所说的逆时序。逆时序的叙述由于违反了人们理解的事物发展顺序，因而容易产生吸引人注意力的效果。逆时序的叙述方式在很古老的叙事作品中就已出现了。\n\n（一）倒叙\n\n逆时序叙述的一种表现方式是“倒叙”。如古希腊的悲剧《俄狄浦斯王》就是一部以倒叙的方式讲述的叙事作品。这种倒叙的方式由于打乱了事件发展的顺序使人猝不及防地进入故事发展的紧要关头，从而给读者造成强烈的悬念，使故事更加惊心动魄、扣人心弦。这种倒叙的方式在近代以情节的紧张刺激为特色的故事中很常见。也有一些采用倒叙方式的叙事作品并不追求悬念，比如普鲁斯特的长篇小说《追忆似水年华》开始时叙述的是自己最近的情况，然后叙述的进展逐渐如梦如烟地从现在返回到过去。这种倒叙的方式造成了一种与叙述者所处的语境相疏离的忆旧情调，与《俄狄浦斯王》式的悬念故事完全不同。\n\n（二）插叙\n\n另一种逆时序叙述方式是插叙。这是在顺时序叙述的过程中插入一段或几段与上下文的时间、因果关系不连属的故事内容，使主要的故事进程造成暂时的中断和延宕。《水浒传》中在叙述宋江两次攻打祝家庄之后插入了解珍、解宝的一段故事就是一种插叙。在有的故事中插叙的内容反客为主，成了故事的基本内容，而顺时序的叙述则降到次要的地位，成为插叙内容的框架和向导。如美国当代小说家海明威的小说《乞力马扎罗的雪》中，顺叙的内容是一个人在非洲打猎时得了坏疽病后垂死时的情境。\n\n在故事中叙述次序是可以变换的，既可以从顺叙变换为倒叙或插叙，也可以在倒叙或插叙中又转入顺叙。叙述次序的变换会造成故事情调、节奏等方面的改变。", "keywords": "顺叙（顺时序）逆时序 倒叙 插叙", "note": "理解时序，我们主要是去梳理时序的层次。首先，我们要明确时序指的是一种时间顺序对照关系，因而出现顺时序和逆时序两种情况，顺时序的叙述方式即顺叙，而逆时序的叙述方式中又有倒叙和插叙两种情况。在理解时，大家可以结合具体的作品。", "framework": ""}, {"id": "238", "stars": 2, "title": "试分析叙述视角的类型及其各自的特征", "body": "在实际作品中，人称和叙述视角是作品中对故事内容进行观察和讲述的角度，根据叙述者观察故事中情境的立场和聚焦点而区分。法国学者热奈特用“聚焦”这个概念来分析不同的叙述视角。他将聚焦分为“零聚焦”“内聚焦”和“外聚焦”三种类型。\n\n一、零聚焦叙述\n\n“零聚焦”指无固定视角的全知叙述，它的特点是叙述者说出来的比任何一个人物知道得都多。这通常是从与故事无关的旁观者立场进行的叙述。这类叙述的特点是无视角限制。叙述者如同无所不知的上帝，可以在同一时间内出现在各个不同的地点，可以了解过去、预知未来，还可随意进入任何一个人物的心灵深处挖掘隐私。总之，这种叙述方式由于没有视角限制而使作者获得了充分的自由。\n\n二、内聚焦叙述\n\n“内聚焦”的特点是叙述者只叙述某个人知道的情况，即从某个人的单一角度讲述故事。内聚焦叙述的作品往往采用第一人称叙述，叙述者通常是故事中的一个角色，叙述焦点因此而移入作品中，成为内聚焦。这种叙述角度有两个特点：\n\n（1）这个人物作为叙述者兼角色，他既可以参与事件过程，又可以离开作品环境面向读者进行描述和评介，这双重身份使这个角色不同于作品中其他角色，他比其他角色更“透明”、更易于理解。\n\n（2）他作为叙述者的视角受到了角色身份的限制，不能叙述本角色所不知的内容，这种限制造成了叙述的主观性，如同绘画中的焦点透视方法，可产生身临其境般的逼真感觉。近现代侧重于主观心理描写的叙事作品，往往采用这种方法。\n\n三、外聚焦叙述\n\n“外聚焦”叙述的特点是叙述者知道的比人物所知道的要少。从人称而言，这也是一种第三人称叙述，但与“零聚焦”叙述者的无所不知相反，他像一个不肯露面的局外人，仅仅向读者叙述人物的言语和行为，但不进入任何人物的意识，也根本不想对他的所见所闻做出合情合理的解释，他自己一无所知，甚至表现得似乎什么也不想知道。现代一些小说家为了对抗“全知全能”的传统叙述方式，往往刻意采用这样一种冷漠的旁观者式的叙述方式。", "keywords": "立场和聚焦点 零聚焦叙述 无固定视角 内聚焦 单一角度讲述故事 外聚焦 叙述者比人物知道的少", "note": "叙述视角的三种类型，主要是从叙述者所知内容与人物所知内容多少的区别来划分的，其中，零聚焦叙述多在古典小说中出现，而内聚焦叙述和外聚焦叙述则在近现代小说中比较常见，在考查中可能会让大家分析某一时期的叙述视角的特征，所以这些内容大家要关注一下。", "framework": ""}, {"id": "239", "stars": 1, "title": "试分析叙述视角与叙事人称的关系", "body": "传统的叙事视角研究一般根据叙述人称来划分。法国学者热奈特用“聚焦”这个概念来分析不同的叙述视角。他将聚焦分为“零聚焦”“内聚焦”和“外聚焦”三种类型。人称与叙述视角的关系是极为复杂的，主要表现在以下方面：\n\n一、第一人称叙述方式\n\n（一）内聚焦叙述\n\n内聚焦叙述的作品往往采用第一人称叙述，叙述者通常是故事中的一个角色，叙述焦点因此而移入作品中，成为内聚焦。这种叙述角度有两个特点：\n\n（1）这个人物作为叙述者兼角色，他既可以参与事件过程，又可以离开作品环境面向读者进行描述和评介，这双重身份使这个角色不同于作品中其他角色，他比其他角色更“透明”、更易于理解。\n\n（2）他作为叙述者的视角受到了角色身份的限制，不能叙述本角色所不知的内容，这种限制造成了叙述的主观性，如同绘画中的焦点透视方法，可产生身临其境般的逼真感觉。近现代侧重于主观心理描写的叙事作品，往往采用这种方法。\n\n（二）零聚焦视角\n\n叙述者所担任的角色在故事中的地位不同：有的作品中的叙述者“我”就是故事主人公，故事如同自传，比如鲁迅的《狂人日记》。这类作品中叙述视角限制最大。当然这并不是说叙述视角同故事中人物的视角必须完全重合。因为这类作品一般是以过去时态叙述的，那么叙述者仍有可能以回忆者的身份补充当时所不知的情形。\n\n（三）外聚焦视角\n\n许多作品中的叙述者只是故事中的次要人物或旁观者。这样的叙述往往较为客观一些，较为极端的例子如普希金的《驿站长》，叙述者“我”同主要故事几乎不发生任何关系，仅仅是个旁听者而已，这样的第一人称叙述便接近于外聚焦的视角了。\n\n二、第三人称叙述方式\n\n（一）零聚焦视角\n\n传统的第三人称叙事作品采取零聚焦叙述方式很普遍。所谓零聚焦叙述，指的是指无固定视角的全知叙述，它的特点是叙述者说出来的比任何一个人物知道得都多。这种叙述方式由于没有视角限制而使作者获得了充分的自由。但也正由于作者获得了充分的叙述自由，这种叙述方式容易产生的一种倾向，便是叙述者对作品中人物及其命运，对所有事件可完全控制、任意摆布，剥夺了接受者的大部分探索、解释作品的权力，因而受到许多现代小说批评家的非难。\n\n（二）内聚焦视角\n\n现代的第三人称叙述作品有一类不同于“全知全能”式叙述的变体，作者放弃了第三人称可以无所不在的自由，实际上退缩到了一个固定的焦点上。如英国女作家伍尔夫的小说《达罗卫夫人》，读者实际上是从达罗卫夫人的角度观察世界的。这种第三人称实际上已属于内聚焦的叙述视角。\n\n（三）外聚焦视角\n\n现代一些小说家为了对抗“全知全能”的传统叙述方式，往往刻意采用一种冷漠的旁观者式的叙述方式，也即外聚焦叙述方式。从人称而言，这也是一种第三人称叙述，但与“零聚焦”叙述者的无所不知相反，他自己一无所知，甚至表现得似乎什么也不想知道。", "keywords": "第一人称 第三人称 传统 现代", "note": "这部分内容基本不会在考查中出现，放在这里是为了提醒大家叙述视角不能简单地与叙事人称画等号，并不是说第一人称的作品就都是内聚焦视角。在判断某一作品的视角类型时，主要还是看叙述者所知内容与人物所知内容相比是多还是少。", "framework": ""}, {"id": "240", "stars": 3, "title": "谈谈你对叙述声音的认识", "body": "一、叙述声音的定义\n\n故事中叙述者的存在不仅表现于叙述的内容以及叙述话语本身，而且表现于叙述的动作，即用什么口气或什么态度叙述，这就是叙述者的“声音”。\n\n二、叙述声音的作用\n\n（一）准确、生动表情达意\n\n从叙事的本来意义而言，叙述声音的功用只是传达内容意义，声音的表情特点也只是为了更准确、生动地表达内容的情感意蕴。\n\n（二）凸显叙述者，增加作品魅力\n\n有些叙事作品中，叙述者的声音会脱离叙述的故事内容而凸显出来，声音本身变成了被关注的对象。叙述者声音的凸显把叙述者从故事的幕后推到了前台，使叙述者也成为读者欣赏的对象，换句话说是被戏剧化了。这种戏剧化的叙述者在话本中出现得很普遍，因为话本是供说话艺人表演用的，叙述者通过叙述声音所显示的个人魅力也是说话艺术中不可或缺的一个成分。\n\n三、叙述声音对叙述方式的影响\n\n在叙事作品中，无论叙述者的声音是否戏剧化地凸显出来，它总归是存在于作品中的。与叙述者的声音相对应，作品中还存在着其他的声音。这就是故事中人物的声音，即发出人物对话、独白、心理活动等人物语言的声音。而对这两类声音关系的不同处理，会导致以下不同的叙述方式：\n\n（一）“独白”式叙述\n\n在经典的叙事文学中，作品中人物的情绪、态度、观点都是由叙述者所控制和安排的，无论作品中有多少人物、多少个声音，都是来自同一个叙述者的安排。作为叙述者以直接引语或间接引语的方式所表达的内容，归根到底是同一个叙述者声音的不同部分。这种发自一个声音的叙述方式可以称之为“独白”式的叙述方式。\n\n（二）“复调”式叙述\n\n在现代的某些叙事作品中，还可以看到另一种不同的叙事方式。如19世纪俄国作家陀思妥耶夫斯基等人的作品中，人物往往具有强烈的自我反思与心理矛盾倾向。在陀思妥耶夫斯基的小说《罪与罚》中，大学生拉斯柯里涅科夫在谋杀放高利贷的老太婆前后，就始终被矛盾的念头困扰，最终导致了精神崩溃。这一类叙事方式中叙述者的声音与主人公的声音之间存在着矛盾，主人公似乎总是在叛离叙述者的理性意图，按照自己的怪诞念头行动，就好像不是叙述者在控制着主人公的行动，而是叙述者在与主人公对话，有时叙述者只能听凭主人公随心所欲地行动。在这里，作者把自己内心的矛盾、困惑通过叙述者声音与主人公声音的对立而表现了出来。\n\n这样在同一个叙事中并行着两个甚至更多的声音的叙述方式，可以借用音乐术语称之为“复调”式叙述。“复调”式叙述的出现，不仅是叙事艺术的发展，在某种程度上也是作为叙事语境的社会文化、社会心理出现危机的一个征兆。", "keywords": "定义 口气 态度 作用 准确、生动表情达意 增加作品魅力 分类 “独白”式叙述“复调”式叙述", "note": "所谓叙述声音，简单理解就是叙述者叙述时的态度和口气。叙述声音在文本表情达意和艺术魅力方面都发挥着重要的作用，而作品叙述发自同一声音和并行着多种声音的两种情况，由此出现了两类不同的叙述方式。这部分内容中，“叙述声音”“复调”这些概念都有可能在名词解释中出现，其中“复调”相关内容可以结合外国文学史进行理解。", "framework": ""}, {"id": "241", "stars": 1, "title": "谈谈你对隐含的接受者的认识", "body": "一、隐含的接受者的定义\n\n作者在作为叙述者讲述故事时，心目中必然要有一个潜在的叙述接受者。作者在作为叙述者讲述故事时，心目中必然要有一个潜在的叙述接受者，这意味着叙述是个双向的活动：一方面叙述者在讲述，另一方面在接收故事的信息时读者产生预期的反应。离开了叙述接受者的特定条件，这种双向活动就不会发生，作者所期待的阅读活动也就落空了。这种由作者所设定的叙述接受者只是作者心目中的理想接受者，即隐含的接受者。\n\n在中国古代的话本和拟话本之类的小说中，叙述接受者是明确的，如明代拟话本小说《蒋兴哥重会珍珠衫》中开篇的几句话，就明确地指出了叙述接受者-“看官”，故事的语境和道德意义只有对这个合乎作者要求的“看官”来说才是真正有意义的。又如18世纪德国诗人歌德的《少年维特之烦恼》在前言就对接受者提出了明确的要求：“至于你，善良的灵魂呀，你正在感受像他那样的苦恼，从他的悲痛中汲取安慰吧。如果由于命运或者你自己的过错，无法找到一个更亲密的知己，那就让这本小书做你的朋友吧。”，这里歌德所要表达的是这首诗的读者应当是钦佩和爱慕维特品格的，为他的遭遇而伤感的“善良的灵魂”；说到底，应当是一个具有“狂飙突进”式热情、敏感乃至脆弱、孤芳自赏的人。\n\n二、隐含的接受者的局限性\n\n实际阅读作品的读者很难符合作者理想化的要求，尤其是不同时代、不同民族的读者由于语境的差异，就与理想的接受者之间存在更大距离。\n\n三、隐含的接受者与现实读者之间差异的影响\n\n现实中的读者与理想的接受者之间的差异导致了对作品误读的可能，因此读者必须尽可能地向理想的接受者靠拢才有可能比较正确地理解作品。当然，不同语境中的读者几乎不可能真正达到作者所要求的理想接受者的水平，因而形成了对文本理解的多样性。", "keywords": "定义 潜在的叙述接受者 理想接受者 局限性 很难符合作者理想化要求 影响 误读", "note": "所谓隐含的接受者，即是作者在创作过程中预设的理想的叙述接受者。这部分内容基本不作考查，但对于我们理解“隐含的读者”这一概念有很大的帮助，大家可以联系伊瑟尔的文本空白、召唤结构和姚斯的期待视野理论进行分析。", "framework": ""}, {"id": "242", "stars": 2, "title": "试分析抒情与现实的关系", "body": "一、抒情是现实的特殊反映\n\n抒情作为一种主观表现，并不脱离现实，而是对现实生活的反映与评价。感情源于对现实的感受，没有真实的生活感受，便没有真正有价值的抒情。对现实感受的深浅，又往往取决于对现实认识的深浅程度。所以，抒情总包含着对现实的反映。不过，抒情又是一种特殊的反映方式。\n\n（一）抒情反映的对象主要是社会生活的精神方面。现实生活并不只是物质生活，它还包括现实存在着的精神生活。文学抒情主要从一个侧面反映了特定的社会心理、精神状态与时代精神。\n\n（二）情感反映了主体与对象之间的特定关系，所以，抒情对客观世界的反映具有主观性。“情人眼里出西施”，如果作为一种客观的科学反映是不真实的，但如果作为特定主客体关系的反映却是真实的。抒情诗人虽然未必都是热恋中的情人，却必定是情感丰富而强烈的有情人。所以，抒情反映必带有主观色彩。\n\n（三）抒情反映具有评价性。情感又是一种主观态度，对事物产生喜怒哀乐的情感体验包含着对事物的主观评价。抒情中所表现出来的赞美、歌颂、向往、同情、憎恶、厌烦等情感倾向都不同程度地含有对现实的价值判断。\n\n二、抒情也是对现实的一种意识中的改造\n\n通过创造性想象，抒情主体把现实之物转化为贯注了主观情思的形象，使外在世界成为一个与内心世界协调融洽的审美世界，用中国美学的术语来说，是“化实为虚”。“实境”就是客观外在世界，它是艺术创造的基础，但实境若无情无趣，不能动人。唯有抒情主体凭着主观想象与情思，用一定的艺术话语，“化景物为情思”，才能生产出生机勃勃、情意盎然的抒情性作品来。“化实为虚”得力于创造性想象的虚化功能，它可以打破客观世界原有的物理结构，创造出一个可以充分寄寓和象征情感的心理空间。\n\n综上所述，文学抒情一方面受到特定现实生活和社会观念的制约，另一方面却具有较高的心灵自由度。与叙事相比，抒情更少受对象的客观性制约，心灵更加自由。抒情心灵摆脱了客观物理的束缚，反而能动地把对象转化为“一己之性情”的表现。因此时间可以逆溯超前，空间可以移动流转，时空可以交错，抒情者的心灵凭着情感的驱使和想象的驰骋，忽而上天入地、天南海北，忽而追怀古人、遥想未来。这种超越时空的自由是抒情最根本的特性。", "keywords": "特殊反映 精神方面 主观性 评价性 意识中的改造 超越时空的自由", "note": "文学抒情是对客观世界的一种表现，无法摆脱客观现实的制约，但如何去反映现实，反映怎样的现实，呈现在作品中的态度，则是完全自由的、主观的，并不受到社会现实的制约，因而才说文学抒情具有一种超越时空的自由。对此，大家可以结合文学的性质的相关内容去理解。", "framework": ""}, {"id": "243", "stars": 2, "title": "试分析抒情的社会属性", "body": "一、抒情具有社会属性的原因\n\n（一）文学抒情作为自我表现，包含着普遍的社会内涵\n\n在文学活动中，抒情总是抒情主体的情感表现。与偏重于客观再现的叙事相比，抒情更富于主体性的自我色彩，所以读者能在抒情性作品中更多地感受到作者内心的声音。在这个意义上，抒情可以说是一种自我表现。\n\n然而，人是社会性的存在，个性自我的形成是以特定的社会关系和文化传统为条件的。各种社会关系都会对个性自我发生影响。所以，自我不是与社会截然对立的，而是既有密切联系又有各自的特殊性。这是一种辩证关系。抒情自我，作为一个独一无二的个性，是由丰富的生活经验和精神素养以独特方式构成的。它充分地吸收人类共同的精神财富，并使之与个性气质融为一体，从而形成了独特的感受世界、认识世界和表现内心情感的艺术方式。所以，文学抒情作为一种自我表现，同时也包含着普遍的社会内涵，可以引起普遍的社会共鸣。\n\n（二）抒情性作品的创造是一种社会性生产\n\n自我表现的社会属性还可以从抒情性文学作品的创造过程中见出。文学创造是一种社会性生产，抒情性作品的创造也不例外。抒情是一种社会交流，作者表现自我的感受同时意味着向隐含的读者进行心灵的交谈。于是，读者的各种经验、趣味、素养和理想等就会对抒情产生制约性影响。因此，文学抒情不是一种完全自我孤立的文学事件，而是与某些社会成员（读者）发生内在联系的。一方面，抒情主体的自我表现会对其他社会成员发生独特的影响；另一方面，社会成员的某些观念意识、接受习惯、理解能力等也会或多或少、或明或暗地转化为抒情性作品中的有机因素，给作品打上社会的烙印。\n\n二、抒情社会属性的表现：与一定社会意识形态相联系\n\n抒情自我与社会的联系最突出地体现为与一定社会意识形态的联系。抒情具有意识形态性质，在审美化的情感反映和评价中，抒情自我总是要么维护和加强、要么反抗和削弱特定的经济基础和上层建筑，而从属于某种社会意识形态。当然，抒情不是说教，在具体的抒情性作品中，意识形态内容并不是以完整的观念体系和概念形式出现的，而是体现为某种感受、评价、信仰和表现的模式。在这些模式背后，却潜藏着一定的观念体系和价值规范。", "keywords": "原因 自我表现 包含着普遍的社会内涵 社会性生产 表现与一定社会意识形态的联系", "note": "抒情具有社会属性，指的是抒情中自我与社会的联系。这一点我们可以从抒情的本质和抒情性作品的创造这两个方面进行理解。而这一属性的表现主要是抒情与一定的社会意识形态联系起来，对于这一点，大家可以联系《牡丹亭》对明代新型市民阶层朦胧的意识形态的反映这一实例去理解。", "framework": ""}, {"id": "244", "stars": 2, "title": "试分析抒情与宣泄的区别", "body": "在古汉语中，“抒”字的本义是“挹”，汲出、舀出的意思。抒情也就是情感的宣泄。但是，文学抒情并不只是非理性的情感宣泄，而是一种审美表现，需要适度的意识控制与思维参与，需要创造有序的话语组织形式，这正是文学抒情区别于普通情感宣泄的主要特征。抒情与宣泄的区别，主要表现在以下方面：\n\n一、抒情既是情感的释放，又是情感的构造\n\n抒情主体是把自己的内心体验作为一个对象来表现的。他不完全是即兴式地有感而发，而是从原发的情感状态中超越出来，把它作为一个对象来重新认识、体验、评价和组织。抒情诗人所表现的感情是对感情经验的再体验，而且这种再体验伴随着一种反省似的“沉思”。诗人的沉思是一种诗意的“思”，返回内心的“思”，不同于理论的思考。通过这种沉思，抒情诗人对情感经验进行重新的理解和组织，赋予它一定的组织形式，使之成为一种丰富而有序的情感经验。\n\n因此，文学抒情既是情感的释放，又是情感的构造，抒情主体既沉浸在情绪状态之中，又出乎情绪状态之外，意识到所表现的内容和表现过程本身。宣泄的情绪是杂乱无序的，只有释放，没有构造；宣泄者完全被淹没在混杂的情绪海洋之中，没有自我意识。抒情主体虽也有受情绪左右的被动性，但他首先是主动的沉思者和创造者，他是自由的。宣泄者却不是完全自由的，因为那种貌似自由的、梦呓般的任意放纵的宣泄是被本能欲望和冲动情绪驱使的盲目活动。\n\n二、文学抒情是创造具有审美价值的文学作品的活动\n\n与内心情感经验的重解与重组相适应，抒情作者还要创造适合于表现这种情感的感性形式。美国美学家苏珊·朗格指出：“艺术品是将情感（指广义的情感亦即人所能感受到的一切）呈现出来供人观赏的，是由情感转化成的可见的或可听的形式......艺术形式与我们的感觉、理智和情感生活所具有的动态形式是同构的形式。”抒情诗人要运用特殊的话语形式，把各种感觉材料组织起来，巧妙而自然地构造有序的形象组织，创造出直接表现内在情感运动形式的审美形式。因此，抒情不仅意味着传达内心活动，而且意味着创造性地选择和组织抒情话语来表现，意味着创造审美价值，这也是一般的情感宣泄所不具备的。", "keywords": "审美表现 情感的释放 情感的构造 创造具有审美价值的文学作品的活动", "note": "抒情也是情感的宣泄，但它并不是非理性的情感宣泄，而是一种审美表现。换句话说，抒情并不是由本能欲望和冲动情绪驱使的，而是抒情主体对自己情感的体验与再创作，这种再创作既包括情感经验，又包括形式，抒情是主动的，而不是被动的。", "framework": ""}, {"id": "245", "stars": 2, "title": "试述抒情性作品的构成要素及其之间的关系", "body": "抒情性作品是通过特殊的话语组织形式来表现情感的。抒情内容和相应的抒情话语是构成抒情性作品的两个基本要素。\n\n一、抒情内容\n\n抒情内容是指文本所表现的某种特定的情感过程和意义。它往往是一种体验，一种感悟，一种心境，既是稍纵即逝的，又是复杂微妙的，不像客观事物的外在形态或理论思维过程那样可以用语词相对确切地表述，而往往是只可意会，不可言传的。所谓“不可言传”是指不能用普通的话语系统、单靠语义来传达的情感活动。别林斯基强调了抒情内容的朦胧与宽泛所导致的对抒情话语形式的直接依赖，抒情内容的表现必须借助一种特殊的话语系统，而读者想要把握抒情性作品的内容也只有直接去感受其抒情话语。\n\n二、抒情话语\n\n抒情话语是一种表现性话语。它具有象征性地表现情感的功能，通过类似音乐的声音组织和富有意蕴的画面组织来体现难以言传的主观感受过程。抒情话语与普通话语的区别，主要表现在以下方面：\n\n（一）一般来说，普通的话语系统是一种通信系统，它通过意义相对确定的词句来报道事实。“桃花红了”“柳叶青了”是报道客观事物，“我饿了”“我很痛苦”虽是报道主观感受，但仍把感受作为确定的客观事实来报道。抒情话语系统虽然也保留了话语的这种通信功能，但更加突出了话语的表现功能。它主要突出了直接呈示情感运动形式的功能，具体表现为强调话语声音层和画面层的象征功能。\n\n（二）作为一种通信系统，普通的话语几乎不考虑词句组合而形成的音响关系，但是在抒情话语中，声音层被凸显出来造成一种高低、快慢、长短有规律的音响组织形式，直接象征着情感运动的形式。\n\n（三）在普通的话语系统中，由词义诉诸想象而产生的视觉形象是客观事物的实在色彩和形状，在抒情话语中，画面不仅再现了事物的外表，而且转化为一种主观的、感受之中的色彩和形状，象征性地表现了感受过程。\n\n三、抒情话语与抒情内容的关系\n\n抒情话语和抒情内容是一种直接融合的关系，抒情内容直接投射和转化在抒情话语的声音与画面形象的组织形式之中，不可分离。因而话语的组织形式也就受到抒情诗人异乎寻常的关注，抒情诗也成为“最典型的语言创作”。在文学接受过程中，读者直接接触的也是抒情话语，他通过抒情话语才得以体悟抒情内容。", "keywords": "抒情内容 情感过程和意义 抒情话语 表现性话语 关系 直接融合", "note": "抒情性作品的构成要素主要是抒情内容和抒情话语，二者之间是直接融合的关系。这部分内容在论述题中基本不会出现，我们需要注意的是抒情话语和抒情内容这两个概念可能在名词解释中出现。此外，对于抒情话语与日常话语的区别，我们也要留意一下。", "framework": ""}, {"id": "246", "stars": 1, "title": "试分析抒情性作品中如何做到声与情的统一", "body": "一、注重字音和声调的和谐\n\n抒情话语的最小声音单位是字音，字音之间变化而有序的组合形成了和谐的音调。在汉语中，音调由平、上、去、入四声的不同搭配构成。四声又分两类，称为平仄，平是平声，仄是上、去、入三声。一般古代诗文中的声调和谐是指平仄的协调组合。\n\n作为一种声调的分别，平仄有高低、长短之分。虽然目前学术界对平仄的解释存有分歧，但把平仄看做字音上高低和长短的分类，是比较合乎实际的。不过，在抒情诗文中，声调的长短之分往往随词义而变化不定，而高低的差异却相对稳定和明显。所以，平仄的协调组合主要是指字音高低的有规律搭配。\n\n字音不仅可以组合成优美的声调，而且字音和声调还可以加强词语的抒情效果。例如，郭沫若的《凤凰涅槃》中，有这样的诗句：“我们新鲜，／我们净朗！／我们华美，／我们芬芳！......翔！翔！／欢唱！欢唱！”这是用了响亮昂扬的“ang”韵，结合着诗句的含义，就有高昂舒畅、活泼健朗的情调。\n\n二、格律的音调与诗的情调相协调\n\n为追求声调和谐，人们在总结了字词声调组合规律的基础上，创造了诗的格律。格律是抒情话语的声调组合规范，其基本原则是寓变化于整齐之中。刘勰曾提出“同声相应”“异音相从”的声律观点，前者讲整齐，后者讲变化把有差异的字音按一定规律组合搭配，就形成了优美的声调。格律对于抒情话语的组织具有积极意义，但它并不是固定不变的，而是随着表现情感的不同需要而发展变化。格律的音调应与诗的情调相协调，才能创造出声情并茂的好诗。\n\n三、讲求节奏，声情并茂\n\n节奏是抒情性作品的重要表现手段，它是指一种有规律的、连续进行的完整运动形式。所谓“有规律”就是有序，不杂乱，这种规律性在连续展开的话语中以反复、对应等形式体现出来。有规律的运动形式构成一定的节奏型把各种变化的因素组织成前后连贯的整体。\n\n抒情诗中的节奏是一个多层组合的运动组织。在声音层，音调抑扬的组合，字、词、句之间的停顿和反复，押韵，等等，构成了声音的节奏；在画面层，景物的承续、流转和跌宕等，构成了画面的节奏；在情感层，情感活动的起伏、强弱和转折等，构成了情感运动的节奏。抒情诗通过听觉和视觉的节奏给情感节奏赋予外形，将它直接有力地传达出来。", "keywords": "字音和声调的和谐 格律的音调与诗的情调相协调 讲求节奏 声情并茂", "note": "“诗歌”，顾名思义，“诗”和“歌”是密不可分的，好诗的诞生激发了音乐的多样化，它们就是这样相辅相成地陪伴着。音乐不仅对我国诗歌的内容、题材、形式和风格的形成有着深远的影响，对中国历代诗歌的生成、传播以及发展也起到了重要的推动作用。而要做到声与情的统一，就需要我们对字音、声调、格律和节奏等做出规范。", "framework": ""}, {"id": "247", "stars": 1, "title": "谈谈你对“诗中有画，画中有诗”的认识", "body": "所谓“诗中有画，画中有诗”指的是诗画相通。借描绘景物来抒情，是抒情诗的一个普遍特点。所以，中外文论中均有诗画相通的说法。在欧洲，很早就有“诗是有声画，画是无声诗”的说法。中国宋代文人张舜民则认为，诗是无形画，画是有形诗。苏轼更是曾评论王维的诗与画是“诗中有画”“画中有诗”。\n\n一、“诗中有画，画中有诗”有其合理之处，这在中国古代诗与画的关系中表现得十分明显。例如，中国画并不按照严格的焦点透视原理来造型，而是采用散点透视的方法来布局，于是，空间排列与“面面观”“步步移”的观赏时间结合在一起。而且，中国画一向讲究“神似”，追求传达出景的精神气韵，一般不屑于作静态的逼真的客观描绘。在这方面，中国诗与中国画是一致的。\n\n另外，诗也有各种类型。叙事诗的再现功能比较强。在中国，赋是较长于状物的诗体，本来应该更近于画但是，中国画追求抒情写意，反而与抒情诗更近。\n\n二、“诗中有画，画中有诗”这一观点也有其局限性，这一点也在中国古代诗与画关系中体现了出来。细分起来，诗画是有别的。诗是语言艺术，以时间性的表现为主；画是造型艺术，以空间性的再现为主。虽然中国的诗与画有许多相通之处，但二者仍有重要的差异。\n\n（一）中国画诉诸视觉，写景更直观；中国诗诉诸听觉，景物描写是凭借想象的，直观性差，但时空更加自由，抒情写意相对便利。\n\n（二）中国画的媒介是线条、形状与色彩，抒情内涵比较朦胧；中国诗的媒介是语言，抒情内涵比较确定。\n\n（三）中国画虽然采用散点透视，却仍以多样统一的视觉形式为抒情话语，所以讲究写景的结构布局；中国诗虽也要讲布局，但这只是抒情话语的一个层面，它与声音、语义等构成了综合性的知觉形式；通过想象，还可以描摹触觉、嗅觉、味觉等，所以，意义更丰富。", "keywords": "诗画相通 合理之处 局限性", "note": "①“诗中有画，画中有诗”是中国古代文论中比较常出现的一个观点，它的意思就是诗画相通，相较于西方诗歌尤其是西方近现代诗歌，中国古代诗歌与中国画的联系无疑是更加密切，但二者仍有重要差异。对于这些内容，我们需要认识到。②此题也可以从文学史角度切入，具体可以参看李凡文学1000题古代文学部分。", "framework": ""}, {"id": "248", "stars": 2, "title": "谈谈你对抒情性作品中景与情之间关系的认识", "body": "一、情与景不可分离\n\n情与景是中国传统诗学中的一对重要概念。诗中之景，不是原本的自然景物，而是由抒情话语组织和表现出来的，被赋予了情感内涵的画面。诗中景有灵有性，情趣盎然。诗中之情，也不是空洞和概念之物，而是由景象征性地表现出来的具体情感过程。诗人的内心活动既千变万化，又细微幽渺，无法用一般的词语直接表现，所以，常常借具体的景物描写，写出独特而微妙的感受过程，达到情感的表现。由此可见，情与景原是不可分离的，情景相生、情景交融就是有意境，这是中国古典抒情诗所追求的最高境界。\n\n二、诗中之景的特征\n\n（一）诗人写景，可以创造想象中的绘画美。杜甫《绝句》开头两句：“两个黄鹂鸣翠柳，一行白鹭上青天。”以翠绿的杨柳衬托娇黄的鹂鸟，以青的天空衬托雪白的鹭鸶，色彩极为鲜明艳丽。中国画注重传神写意，有时不一定着力于对事物的色、形的真切描绘，而更强调抓住事物的某些特征，来构筑视觉形象，以一当十地来加以表现。中国诗也常常采用这种方式创造画境。例如王维《使至塞上》中有两句诗：“大孤烟直，长河落日圆。”特定的自然景物被加以精心组织，构成两个极富特征性的画面来表现塞外风光。\n\n（二）抒情诗人写景，意在言情。所以，诗中的画面往往比绘画具有更多主观色彩。例如，王维《过香积寺》中有“泉声咽危石，日色冷青松”两句，除了“咽”和“冷”之外，都是写景。“咽”状动作，“冷”状感觉，都是诗人主观感受的表现，用这两个词来联系无生命的事物，就赋予了它们情感经验，这就是“化景物为情思”。通过一些感觉化、情感性的词义赋予景物主观色彩，正是诗中画的特点。\n\n三、处理情与景关系的原则：真与幻的统一\n\n文学的真实是艺术的真实，文学作品往往通过变形、虚构和象征等手段真实地反映生活。抒情性作品重在主观情感的表现，所以，诗的真实，主要不是指客观的真实，而是指主观感受的真实、情感逻辑的真实。\n\n中国诗画都要求表现事物的精神，唯有传神，才能写出真景物。把握事物的精神不仅靠观察，更要靠体验，靠心领神会。由此而把握到的事物之“神”已不是事物固有的属性，而是心与物契合的结果。这就叫“缘情体物”。所以，景物的真是主观经验中的真。抒情诗中的真与幻是辩证统一关系，有时违背客观事实的幻，恰恰表现了感觉经验的真，倘若不能表现真诚的感受，“幻”就是假了。", "keywords": "情与景不可分离 诗中之景的特征 创造想象中的绘画美 主观色彩 原则 真与幻的统一", "note": "抒情性作品中情与景是密不可分的，借景抒情是抒情性作品尤其是诗歌中十分重要的一种抒情方式。也正因此，诗歌中的景物也有自己的特征，它是理想化的、具有主观色彩的。而要正确处理情与景的关系，正确塑造抒情性作品中的景色，最重要的是做到真与幻的统一。", "framework": ""}, {"id": "249", "stars": 3, "title": "谈谈你对抒情话语的修辞方式的认识", "body": "抒情话语的修辞方式是指抒情作者在抒情写意时的用语方法。抒情话语的修辞方式很多，常见的主要有以下几种：\n\n一、比喻\n\n比喻是借他物（喻体）来表现某物（喻本）的修辞方法。根据喻本和喻体的不同组合方式，比喻又可分为明喻、隐喻和借喻三种。明喻表明喻体与喻本的相类关系，一般用“若”“如”“似”“像”等喻词来联系喻体与喻本。隐喻表明喻体与喻本的相合关系，不用喻词。借喻则既无喻本，又无喻词，只有喻体。\n\n一般地说，比喻是一物类比另一物，但有时也会以多物类比一物，如贺铸的“试问闲愁都几许？一川烟草，满城飞絮，梅子黄时雨”，就是连用三个形象来喻愁，这种比喻方法叫博喻。用比喻的手法来抒情便会造成抒情性作品的含蓄风格，意味隽永。\n\n二、象征\n\n象征（狭义）是以具体事物（形象）间接表现思想感情。抒情诗多以声音和画面来表现情感，所以，象征是抒情话语最常见的修辞方式。司空图说：“不著一字，尽得风流。语不涉己，若不堪忧。”从修辞学角度看，就是说不写一个“忧”字，却以象征的方式表现了忧愁。马致远的《天净沙·秋思》中并不直说愁苦，却借几组景语表现浪迹天涯人的愁苦情怀。\n\n象征形象由于反复使用，便渐渐带上了相对稳定的象征意义。例如，中国诗词中的“月亮”就是一个含有哀思、别情、思乡的象征形象，在西方抒情诗中，玫瑰常常象征爱情，也有稳定的意义。这种象征意象的运用，可以使抒情话语更加简洁，内涵更为丰富。用象征的手法来抒情便会造成抒情诗的含蓄风格，由此可以传达曲折微妙的内心活动，给读者留下更多的想象余地，耐咀嚼，有余味。\n\n三、倒装\n\n倒装是诗句在语法上的错置，是惯常词序的颠倒。在格律诗中，有些倒装句是为了迁就格律或加强某一意象，有些是为了强调某一形象，加强语气、音节，突出话语的表现力。既照顾到格律，又增强了抒情效果，这是最理想的。\n\n由于词序被打乱，自然流动的句子突然被切割开来，从而使某些词语获得了相对的独立性。这些独立的词语所呈现的往往是一些感觉化的形象，所以倒装往往可以大大强化诗句的感觉效果。\n\n四、歧义\n\n当一句诗中并存两种或更多的语法结构时，这个诗句就有可能被读者以不同的方式来解读，从而产生不同的意义。这种一个诗句包含多重意义的情况就是歧义。\n\n由于汉语的句法关系本来就比较宽松，而且抒情诗人常常为了创造表现性话语而有意超越语法规范，所以，歧义成为中国古诗（特别是格律诗）的一个普遍现象，歧义造成语义的含混、复杂，丰富了抒情话语的情感内涵，是抒情诗产生“余味”的重要源泉之一。\n\n五、夸张\n\n夸张是运用想象和变形，夸大事物的某些特征，写出激昂之语，极为强烈地表现诗人非同寻常的感受。夸张的写法不合客观事实，如“春风不度玉门关”，玉门关外再荒凉，春天还是会到来的。但是，这种不合事理的写法却突出了对象的特征，极为强烈地表现了诗人非同寻常的感受。\n\n六、对比\n\n对比是把在感觉特征或寓意上相反的词句组合在一起，形成对照，强化抒情话语的表现力。如杜甫的名句“朱门酒肉臭，路有冻死骨”，就是以两幅截然不同的画面来反映现实矛盾，有力地表达了诗人对社会的批评。以对比的方式来组合情与景，可以更强烈地表现情感体验。此外，对比的运用可以使诗人的主观态度以比较婉转的方式表现出来，从而形成含蓄的风格和反讽的意味。\n\n七、借代\n\n借代是有关系的事物之间的相互替换，或用一物代另一物（如写女性，用“红楼”“闺阁”“玉阶”等与女性有关的东西来指代），或用部分代全体（如用“蛾眉”“红裙”等写女性），运用借代的方法可以写出新颖别致的佳句。\n\n八、用典\n\n用典又叫“用事”，是在诗词中借用故事来造句表义，它分为神话典故、历史典故和文学典故三类。典故的容量比较大，所以，用典会使抒情话语简洁经济，内容丰富。典故又多涉及历史，所以用典可以使诗词的文化内涵更为深广。另外，用典也是一种替代的表达方式，可以使话语更为含蓄。", "keywords": "比喻 象征 倒装 歧义 夸张 对比 借代 用典", "note": "这部分内容在考查中作为论述题进行考查的可能性不大，但这其中涉及的这些修辞手法很可能以名词解释的形式进行考查，所以放在这里让大家了解一下。", "framework": ""}, {"id": "250", "stars": 2, "title": "谈谈你对抒情角色的认识", "body": "抒情角色是指抒情作家在抒情性作品中表现情感时所处的地位。常见的抒情角色有三种类型：一种是作者作为第一人称出现，作品中的“我”即作者自我；另一种是作者以代言的第一人称出现，或代人抒情，或托人抒情；还有一种是作者作为叙事者，在讲述事件的过程中抒情。\n\n一、第一人称的抒情方式\n\n（一）分类\n\n（1）直抒胸臆\n\n第一人称的抒情是作者直接表现自己内心生活的一种抒情方式。在这类抒情性作品中，“我”就是作者自我，如李白的《梦游天姥吟留别》中，“我欲因之梦吴越”“湖月照我影，送我至剡溪”“安能摧眉折腰事权贵，使我不得开心颜”。有的抒情诗虽没有“我”字，但也是一种直抒胸臆的写法。例如汉乐府民歌《箜篌引》就是诗人直接的呼号，直接对人对事发出感叹。\n\n（2）借景抒情\n\n许多抒情诗虽采用第一人称的抒情方式，却不直接倾诉自我的感受，而是借景抒情。中国古典山水诗大都属于这种情况，例如柳宗元《江雪》，抒情自我在字面上不露一点痕迹，只是用精心构造的图画来象征。\n\n（二）抒情效果\n\n两种第一人称的抒情类型也造成了不同的艺术效果。\n\n（1）从抒情的角度看，直抒胸臆造成诗作的直率风格，常常具有震撼人心的感人力量；借景抒情造成诗的含蓄风格，情感意味悠长。\n\n（2）从阅读的角度看，直抒胸臆的诗，抒情诗人的主观自我十分突出，读者直接把诗人的心灵作为对象来体验和认识；借景抒情的诗，抒情诗人的主观自我比较隐蔽，但我们却可以从引发诗人感受的景物中去分享诗人的感受过程，从而体验和认识诗人的主观自我。\n\n二、代言的抒情方式\n\n（一）分类\n\n（1）以他人口吻抒他人之情\n\n在有些抒情性作品中，作者作为代言人，以他人的口吻来抒情。代言的抒情是戏曲歌词的基本抒情方式，但在诗词中也不少见。例如李白的《春思》采用女子的口吻，写丈夫远戍燕地，妻子留居秦中，对着春景抒发相思之苦。最后两句，是思妇对春风的反诘，极见真情。\n\n（2）以他人口吻抒自己之情\n\n除了以他人口吻抒他人之情外，还有一种代言的抒情方式是借他人之口来抒发作者的思想感情。例如，杜甫的《兵车行》中，诗人借役夫的口来抒发对抽丁拉夫的不满和对人民疾苦的同情\n\n（二）作用\n\n代言的抒情方式造成了抒情内涵的双重性：抒情性作品中主人公的抒情是外抒情层；作者的情感表现是内抒情层。在《春思》中，这两个方面是相异的，一为相思，一为同情。在《兵车行》和《窦娥冤》的［滚绣球］中，这两个方面有重合之处，同时，也表达了作者对役夫、对窦娥的同情。因此，代言的抒情可以产生较丰富的意义。\n\n【李凡关键词：第一人称的抒情方式 直抒胸臆 借景抒情 代言的抒情方式 以他人口吻抒他人之情 以他人口吻抒自己之情产生较丰富的意义】", "keywords": "", "note": "这部分内容中，我们主要需要注意的是抒情角色这一概念，可能会以名词解释的形式进行考查。对于抒情角色三大类型及其每种类型中的每一小类，我们可以结合相关的作品进行理解记忆，题目中涉及的具体作品，我们要注意一下。", "framework": ""}, {"id": "251", "stars": 3, "title": "谈谈你对文学风格基本内涵的认识（25南开大学）", "body": "所谓文学风格，是指作家的创作个性在文学作品的有机整体中通过言语组织所显示出来的、能引起读者持久审美享受的艺术独创性。\n\n一、创作个性是风格形成的内在根据\n\n创作个性是作家气质禀赋、思想水平、审美趣味、艺术才能等主观因素综合而成的习惯性行为方式，是在日常个性的基础上经过审美创造的升华而形成的独特的艺术品格，是文学风格的内在根据，支配着文学风格的形成和显现。\n\n创作个性属于文学风格的主观方面，在与客观方面结合之前，它潜在于作家的内心，表现为独特的个性气质人格精神、艺术情趣、审美追求和文学才能等。当它付诸实践并与客观方面相结合，便成为文学风格的有机组成部分。日常个性必须通过审美创造的升华转变为创作个性，才可能在作品中形成独特的艺术风貌。创作个性是位于日常个性和文学风格之间的中间环节。题材对象方面的特点、体裁类别方面的要求、技巧形式方面的规则等相对客观的因素，也都必须由作家的独特的审美个性所把握、浸润、渗透点化和整合，才能成为文学风格的构成要素。可以说，风格是作品的内容和形式经创作个性的有机整合后所显现的独特的艺术风貌和格调，创作个性是风格的灵魂。\n\n二、主体与对象、内容与形式的统一是风格存在的基本条件\n\n用自己的风格去写，表露自己的精神面貌是作家的权利，作家在发挥自己精神个体性时，还须遵循客观规律，必须“用事物本身的语言来说话，来表达这种事物的本质的特征”，“使事物本身突出”而不是突出作家自己。文学风格就是作家在用客观事物本身的语言表达和突出客观事物的本质特征的同时，通过对象表现自己的精神个性的形式和方式。\n\n三、语言组织和文体特色是风格呈现的外部特征\n\n创作个性有待外化、形式化到具体作品中，才能形成风格。独特的言语组织和文体特色是风格呈现的外部特征。只有在具体的作品中，在特定的文体或言语组织中，风格才得以展现。在这个意义上，言语组织和文体是风格的载体。\n\n文学是语言的艺术，作品都是由言语组织而成的，中性的语言素材经过编码后，不但传递了信息而且带有感情色彩，从而体现了风格特征。风格必须落实到具体的体制、样式、类型中，只有在恰当的文体中才能呈现出作家的创作个性。这里所说的文体主要是体裁、语体和风格三个层次。恰当的体裁是风格得以生成的基础，富有个性的语体是风格的有机组成部分，而风格是文体的最高范畴和最高体现，是作家长期匠心独运的结晶。", "keywords": "创作个性 内在根据 主体与对象、内容与形式的统一 基本条件 语言组织 文体特色 外部特征", "note": "所谓文学风格，就是作家创作个性与具体话语情境造成的相对稳定的整体话语特色，它是主体与对象、内容与形式的特定融合，是一个作家创作趋于成熟、其作品达到较高艺术造诣的标志。作家作品风格是文学风格的核心和基础，但也包括时代风格、民族风格、地域风格、流派风格等内涵。文学风格这一概念可能在名词解释中出现。此外，关于文学风格的特征，大家可以参考马工程版本的教材进行补充。", "framework": ""}, {"id": "252", "stars": 3, "title": "谈谈你对创作个性的认识", "body": "一、创作个性的内涵\n\n日常个性是人在日常生活中表现出来的人格结构方面的独特性，而创作个性是作家气质禀赋、思想水平、审美趣味、艺术才能等主观因素综合而成的习惯性行为方式，是在日常个性的基础上经过审美创造的升华而形成的独特的艺术品格，是文学风格的内在根据，支配着文学风格的形成和显现。\n\n二、创作个性与日常个性的区别\n\n日常个性人皆有之，如心理性格、气质情性、禀赋才能、处世态度、思维习惯表达方式等，人格是在伦理学意义上的道德人格，指个人的尊严、价值和道德品质等。创作个性却并非人所尽有，它是在创作实践中逐渐形成和发展起来的。\n\n所以，一般而言，日常个性是作家在世俗生活中表现出来的习性，世俗生活往往为俗世功利所困扰，而创作个性是作家在精神活动中体现出来的习性，精神的想象活动往往具有审美的超功利性。日常个性部分来自先天的遗传基因，另外缘自后天环境中的习得而创作个性则是在日常个性的基础上，进一步在创作实践中养成并体现在作品中的个性特征。\n\n三、创作个性与文学风格的关系\n\n（一）创作个性是文学风格的有机组成部分\n\n创作个性属于文学风格的主观方面，在与客观方面结合之前，它潜在于作家的内心，表现为独特的个性气质人格精神、艺术情趣、审美追求和文学才能等。当它付诸实践并与客观方面相结合，便成为文学风格的有机组成部分。\n\n创作个性不能单方面决定和构成风格，风格的形成离不开题材、主题甚至体裁等的影响。比如，题材本身所蕴含的社会的、伦理的、美学的属性或意义会影响作品的风格。再比如，体裁对风格也有影响。\n\n（二）创作个性是日常个性与文学风格的中间环节\n\n日常个性必须通过审美创造的升华转变为创作个性，才可能在作品中形成独特的艺术风貌。创作个性是位于日常个性和文学风格之间的中间环节。作家的人格修养、生活个性并不能直接转化为风格，这种人格修养、生活个性必须在与作家的审美素质有了内在的适应性，并接受审美素质的改造、转换后，才能成为创作个性的有机构成因素，然后通过创作个性的作用，才能转化为风格。\n\n（三）创作个性是文学风格的灵魂\n\n题材对象方面的特点、体裁类别方面的要求、技巧形式方面的规则等相对客观的因素，也都必须由作家的独特的审美个性所把握、浸润、渗透点化和整合，才能成为文学风格的构成要素。可以说，风格是作品的内容和形式经创作个性的有机整合后所显现的独特的艺术风貌和格调，创作个性是风格的灵魂。", "keywords": "内涵 独特的艺术品格 区别 日常个性 世俗生活 创作个性 精神活动 关系 有机组成部分 中间环节 灵魂", "note": "创作个性是一种独特的艺术品格，它从日常个性的基础上升华而来，并对文学风格产生了重要的影响，是二者之间的桥梁。大家可以通过将其与日常个性对比，明确创作个性的特征。创作个性这一概念常在名词解释中出现，此外，创作 个性与文学风格的关系这一部分可能会单独考查，大家要注意灵活应对。", "framework": ""}, {"id": "253", "stars": 2, "title": "风格存在的基本条件是什么", "body": "主体与对象、内容与形式的和谐统一是风格存在的基本条件。\n\n首先，精神个性的差异是文学风格形成的重要方面。18世纪法国学者布封提出“风格即人”的观点，“风格是当我们从作家身上剥去那些不属于他本人的东西，所有那些为他和别人所共有的东西之后所获得的剩余和内核。”布封强调的是作家风格的重要性、独特性和不可替代性。事实上，精神个性的差异是文学风格形成的重要方面。\n\n同时，风格与作家描写的对象也联系密切，因此，风格是主客观的统一。比如歌德认为，“单纯的模仿”以心服从于物，“作风”则相反，是用心去支配物，甚或强迫物，而“风格”则是主客观的统一，从而达到情景交融、物我交会、人与事的和谐。由此，歌德认为风格是艺术所能企及的最高境界。黑格尔也认为，风格说到底是主体与对象的契合：“从一方面看，这种独创性揭示出艺术家的最亲切的内心生活；从另一方面看，它所给的却又只是对象的性质，因而独创性的特征显得只是对象本身的特征，我们可以说独创性是从对象的特征来的，而对象的特征又是从创造者的主体性来的。”马克思将布封的“风格即人”的观点引入了唯物辩证法的轨道，既肯定了文学风格的“真理占有我”的客观属性，又强调了风格的“精神个体性”的核心特征。马克思要求一方面把用自己的风格去写，把表露自己的精神面貌看做是作家的权利，另一方面他又明确要求作家在发挥自己精神个体性时，还须遵循客观规律，必须“用事物本身的语言来说话，来表达这种事物的本质的特征”，“使事物本身突出”而不是突出作家自己。文学风格就是作家在用客观事物本身的语言表达和突出客观事物的本质特征的同时，通过对象表现自己的精神个性的形式和方式。", "keywords": "主体与对象 内容与形式 和谐统一 精神个性的差异 作家描写的对象 客观属性 精神个体性", "note": "①文学风格的形成，首先受到了精神个性的影响，这一点是毋庸置疑的。但同时，风格又与作家所描写的对象相联系，像是杜甫所写的《闻官军收河南河北》就显然与其一贯的“沉郁顿挫”的风格不太相符，这是因为这首诗所表现的是作者听闻官军收复失地之后的激动心情。很明显，作品所描写的对象影响了作品的风格。②“风格即人”也非常有可能出论述题，具体请见提升版。", "framework": ""}, {"id": "254", "stars": 2, "title": "风格的载体是怎样的", "body": "创作个性有待外化、形式化到具体作品中，才能形成风格。独特的言语组织和文体特色是风格呈现的外部特征。只有在具体的作品中，在特定的文体或言语组织中，风格才得以展现。在这个意义上，言语组织和文体是风格的载体。\n\n一、言语组织\n\n文学是语言的艺术，作品都是由言语组织而成的。整体来看，言语活动是多方面的、性质复杂的，同时跨着物理、生理和心理几个领域，它还属于个人的领域和社会的领域。现代风格学认为，语言本身作为未经使用的素材整体是一种中性的代码，而经过作家之手在作品中使用的语言是活的言语，已经是编码或超码（超级编码）的结果。换言之，中性的语言素材经过编码后，不但传递了信息而且带有感情色调，从而体现了风格特征。\n\n二、文体\n\n风格必须落实到具体的体制、样式、类型中，只有在恰当的文体中才能呈现出作家的创作个性。这里所说的文体主要是体裁、语体和风格三个层次。恰当的体裁是风格得以生成的基础，富有个性的语体是风格的有机组成部分，而风格是文体的最高范畴和最高体现，是作家长期匠心独运的结晶。\n\n（一）体裁是风格得以生成的基础\n\n一方面，体裁是风格的基础，不同的体裁要求与之相应的风格，选择特定的体裁也就规定了相应的风格。了解体裁特点是文学写作的必由之路。另一方面，对于同样的体裁，风格又因人而异，因时而异，所谓“定体则无，大体则有”。文章的体裁和样式是大体固定的，而具体的文辞、体势和风格却是无定的。具有非凡才情的作家和具体的创作过程各不相同，文学创作总是多有损益，与时变化的。\n\n总的说来，要在端正“体制”和“通变”体裁的基础上进行文体和风格的创造。\n\n（二）语体是风格的有机组成部分\n\n所谓语体，是作家根据对各方情势的研判和理解后，在大体确定的体裁中，进一步地通过语言、艺术手法和各类技巧设计体现出来的更具特征性的体式或体势。语体受到体裁等传统惯例方面的规定，但它并非如形式主义者所理解的是现有体裁的重组，而是在当下作品所欲表现的现实之“利”和“自然”的具体规定下，与作者对现实的理解及其相关的表现才能相磨合而形成的。可以说，语体是体裁所内含的历史、传统、惯例和当下作品所欲表现的具体情势以及作者自身的更为具体的权衡、处置、选择、安排的结合体。\n\n语体可以说是体裁的具体化，它需要融入作家对具体情势的理解和把握，并在作品中体现出来。这里必然包含着作家如何在特定体裁的基础上灵活把握和自由创造的问题。选择体裁只是作家表现客观对象时的初步把握，而只有作家在根据更具体的情势和自身情性，自由地实现了“因情立体，即体成势”之后，作品才真正体现了作家的创作个性，语体才实现了对体裁的具体化。“因情立体，即体成势”使作家的个性得到充分外化是创作个性在语言格调上的自然流露。因此，语体可以视为风格的有机组成部分。\n\n（三）风格是文体的最高范畴和最高体现\n\n作家只有“因情立体，即体成势”，既顺应和包容对象，又充分发挥自己的个性，才有可能形成文学风格。但风格不等同于语体，也不等同于体裁，它使文体焕发出作家个性的光彩，以其独创性使读者感到亲切和惊异；它给某一文体的僵硬躯体里贯注进盎然生机，使之获得了艺术生命。所以文学风格是文体的最高范畴和最高体现。", "keywords": "言语组织 编码 带有感情色调 文体 体裁 基础 语体 有机组成 风格 最高范畴和最高体现", "note": "风格的载体是作品的言语组织和文体，简单来说，作家的风格需要通过作品的语言和文体才能体现出来。就比如杜甫的“沉郁顿挫”，我们一方面要从他的诗歌语言的层面进行考查，一方面要从他的诗歌声韵、格律等角度去考查分析，大家可以这样结合事例去理解。这道题可能以“风格呈现的外部特征是什么”的形式进行考查，大家要注意灵活应对。", "framework": ""}, {"id": "255", "stars": 1, "title": "如何正确评价风格的审美价值", "body": "一、正确认识风格多样化\n\n雄浑刚劲的风格可以壮人胸怀，清新俏丽的风格可以舒人心脾，飘逸疏野的风格可以养人性情，沉着含蓄的风格可以启人思力。不同的文学风格，给人以不同的审美享受。所以，文学风格各有各的审美价值，一般不分轩轾。由于人们的审美心理基础不同，也有特定的语境或心境，可以对风格美有不同的偏好和选择，这是不足为奇的。但不可以主观随意地褒此而贬彼。风格欣赏中的偏好，归根结底是因为读者与作者通过风格的纽带达到了个性间的相互吸引，灵魂与灵魂的相通、相合，不可勉强。\n\n风格的批评不妨推崇某种风格，也可批评另一种风格，这本来无可厚非，只要言之成理，持之有故就行。但是如果把自己所欣赏的风格奉为主桌，把个人不欣赏的弃如敝屣，那就失之偏颇，也不符合风格多样化的规律。\n\n二、认识到风格美是可以超越时代地域和阶层的限制的\n\n过去时代形成的风格类型，其审美价值并不随时代的变化而消逝。古今中外凡有独特风格的作家作品，都以其不可重复的艺术独创性，不仅在文学史上取得应有的地位，而且在艺术世界得到千万读者的回响。在这个意义上，历史和未来都属于拥有独特风格的作家。\n\n三、认识到风格美同时受时代价值取向的影响制约\n\n风格的审美价值虽然可以超越时代，但它在多大程度上得到实现，却往往又受到时代的价值取向的影响和制约。它不取决于少数人的选择，而取决于时代、民族、阶级等的选择。一个抗争的阶级、苦难的民族、悲剧的时代，可能更激赏慷慨悲凉、沉郁顿挫的风格，而冷落闲适恬淡或华艳绮丽的风格，但这种风格尽管被冷落鄙视，也自有其审美价值。沈从文小说中的原始淳朴，钱锺书小说中的机智冷峭，张爱玲小说中的苍凉幽暗，都各有审美价值，至今也仍然会有相应的读者群。", "keywords": "正确认识风格多样化 超越时代地域和阶层的限制 受时代价值取向影响制约", "note": "正确评价风格的审美价值，首先需要我们对文学风格的多样性有一个清醒正确的认识，要明确各个风格之间并没有优劣之分，各有各的价值，这是我们做出正确评价的基础。在此基础上，我们要对风格美的特征有清晰的认识，要明确其在具有超越性的同时又受到制约。", "framework": ""}, {"id": "256", "stars": 3, "title": "如何理解文学的时代风格", "body": "不同时代有不同的文化，作家生活于时代之中，不能不深受时代气息的感染。作家的文学风格必然要渗入时代文化的因素，表现出时代性。文学风格总是这样或那样反映时代文化的特点，形成文学的时代风格。\n\n一、时代风格的定义\n\n所谓文学的时代风格，就是作家作品在总体特色上所具有的特定时代的特征，它是该时代的精神特点、审美要求和审美理想在作家作品中的表现。\n\n二、影响时代风格的因素\n\n（一）时代精神\n\n时代风格主要是指从历史和社会高度把握的、只属于这个时代而不属于其他时代的文学的总体特征，是时代精神的产物。先秦诸子散文感情激越、设想奇特、辞采绚烂，富有论辩性，与当时群雄割据、学派林立、百家争鸣、富有创造力的时代特征密切相关。当然，文学的时代特点不是时代印记的被动的承受物，它既是时代精神的产物，又是时代精神的发酵剂和催化剂。时代风格又总是发展的，随着时代的变化而变化，从而形成不同的时代风格。比如在欧洲曾此起彼伏地盛行过的古典风格、哥特式风格、文艺复兴风格和巴洛克风格，都具有鲜明的时代特点。\n\n（二）文学自身发展规律\n\n时代风格的形成，受时代情境和语境的影响，也离不开文学自身的发展规律。比如，唐代中后期的古文运动所造成的新文风和时代风格，既是一群古文家的有意识的努力创造，也是文学发展的自然规律。唐初文风承六朝骈俪旧习，成为束缚思想内容的桎梏，文学发展受阻。因此一些先行者逐渐要求反对骈文，提倡古文。到德宗贞元间，韩愈号称上继三代两汉，以自己奇句单行的散文与“俗下文字”（即骈文）相对立，逐渐有众多文人追随。至宪宗元和间，又有柳宗元大力支持，于是声势更大。古文言之有物，具有批判锋芒，一度压倒了骈文，开创一代新文风。\n\n（三）作家个人经历\n\n风格的时代性差异也完全可能体现在同一个作家身上。这在一些跨世纪跨时代的作家身上体现得尤为明显。特别是当时代发生动荡、革命、战乱，改朝换代，或社会政治制度和经济体制出现重大的变更转型，都会使作家的世界观、人生观、价值观、创作视野、艺术趣味乃至情调语调发生重大的变化，从而导致个人风格的时代性转变。", "keywords": "定义 特定时代的特征 影响因素 时代精神 文学自身发展规律 作家个人经历", "note": "任何作家的作品既是个人的创作，又是时代的产物。文学风格也是受时代因素影响的。其具体表现是：在同一或大致相同的历史时代里，处于相同或相近的社会地位，置身于类似的矛盾斗争，面临相同的社会问题，受到相近的时代精神影响的作家，他们的作品在内容与形式，思想和艺术等方面，必然表现出某些共同的基本特色。文学的时代风格这一概念可能在名词解释中出现，大家要关注一下。", "framework": ""}, {"id": "257", "stars": 1, "title": "如何理解文学的民族风格", "body": "不同的民族有不同的文化传统，作家生活于民族传统文化中，不能不受民族文化传统的影响，作家的风格必然渗入民族文化传统的基因，表现出民族性。风格总是这样那样地反映民族文化的特点，从而形成文学的民族风格。\n\n一、民族风格的表现\n\n在好的文学译作中，尽管一民族的语言转换成另一民族的语言，我们仍然可以看到原作的民族特点，这是因为民族风格不仅见诸作品的语言，而且体现在一切方面，如题材、主题、气质、韵味，以及作品所包含的民族精神。比如普希金，他本人就是俄罗斯文学的民族风格的杰出代表，“在他身上，俄国大自然、俄国精神、俄国语言、俄国性格反映得这样明朗，这样净美，正像风景反映在光学玻璃的凸面上一样。”一个伟大作家骨子里渗透的民族精神，很大程度上使得他的作品在自己的祖国内具有向心力和凝聚力，在国外具有吸引力和感染力。\n\n二、如何正确对待文学的民族性与文学的民族风格\n\n在文学的民族性和民族风格的问题上，鲁迅认为，要注意摆脱两重桎梏，一重是“古国的青年的迟暮之感”，“世界的时代思潮早已六面袭来，而自己还拘禁在三千年陈旧的桎梏里”，另一重是对外国的顶礼膜拜：“文艺史界中人，则舍了用惯的向来以为是“永久’的旧尺，另以各时代各民族的固有的尺，来量各时代各民族的艺术，于是向埃及坟中的绘画赞叹，对黑人刀柄上的雕刻点头，这往往使我们误解，以为要再回到旧日的梏里。”鲁迅认为，用新的、具有时代感的方法写出自己的世界，在作品中保留着自己民族的灵魂，这便是民族性。鲁迅本人就是新文学以来最具有民族性，同时又最具有世界性的伟大作家。鲁迅是把民族和世界、传统和现代结合得最好的作家，是最懂得国民性的弱点，并在予以鞭挞的同时，高扬民族的脊梁和精神的作家。无论在文学内容还是在文学形式上，他的作品都有伟大的民族风格和独特的个性风格。\n\n【李凡关键词：民族性 表现 语言 题材 主题 气质 韵味 民族精神 如何正确对待 变革创新】", "keywords": "", "note": "各不同民族的作家，他们的创作素材、思维方式、语言习惯、社会心理都带有自己民族的特色。他们作品的风格，也会受到该民族语言、地域、经济生活和文化心理这个共同体的影响，使之具有民族性。正因为如此，人们才能从作家的“写作的风格认出一个意大利人，一个法国人，一个英国人”。", "framework": ""}, {"id": "258", "stars": 1, "title": "试分析文学地域风格的成因", "body": "不同地域有不同的文化，作家总是生活在一定的地域中，不能不受到地域文化气息的影响，所以作家的文学风格必然会渗入地域文化的因素，表现出了鲜明的地域性。地域风格的形成，主要受到以下因素的影响：\n\n一、自然环境\n\n法国作家、批评家斯达尔夫人认为，自然环境在文学风格的形成过程中起着决定性的作用。南方气候清新，大自然形象丰富，人们感到生活的乐趣，感情奔放，大都不耐思考，与女性交往很少拘束，比较安于奴役，却从气候的美和艺术的爱中得到补偿。北方土地贫瘠，气候阴沉多云，人们较易引起生命的忧郁感和哲学的沉思，但具有独立意识，不能忍受奴役，并尊重女性，而盛行于北方的基督教更有助于人性的培育。因此，南方文学比较普遍地反映民族意识和时代精神，而北方文学则较多地表现个人的性格。不仅是法国南北气候的不同导致法国南北文学不同，中国南北自然环境的不同也使中国的文学产生了鲜明的南北之分。\n\n二、社会环境\n\n地域文化除了与自然环境密切相关外，当然与在此自然环境中发展起来的社会环境，即生产力、生产关系、社会制度等同样密切相关。说明地域风格及其成因，必须把自然环境和社会环境的影响综合起来考虑。以《楚辞》为例，在长期独立的发展过程中，两湖及长江两岸地区形成了非常独特的楚地文化，在宗教艺术、风俗、习惯等方面都有自己的特点。同时在与北方诸国的频繁交流中又吸收了中原文化，形成了以楚文化为基础的南北合流的文化形态，这正是《楚辞》产生的文化渊源。还有楚地巫风土俗盛行，《九歌》原是民间祭神的乐歌，更是与巫术神话不可分割。与此相关的是，《楚辞》还深受地域音乐即巫音的影响，其中不少篇章都有“乱”辞、“倡”或“少歌”，它们都是乐曲的组成部分。楚文化属于南方文化系统，老子、庄子、列子的哲理散文也属于南方文化系统，所以，老、庄、列、骚有着更多的共通之处。\n\n【李凡关键词：地域性 自然环境 社会环境】\n\n【李凡说：文学的地域风格，指的是文学风格表现出了明显的地域性。而地域性的成因，需要从自然环境和社会环境两个方面去考虑，因此，文学地域风格的成因也需要从这两个方面去考虑。对此，大家可以结合一些具体事例去思考。】", "keywords": "", "note": "", "framework": ""}, {"id": "259", "stars": 3, "title": "谈谈你对文学流派风格的认识", "body": "一、流派风格的定义\n\n流派是一定时期里有着相近艺术追求和思想倾向的作家汇聚而成的文学群体。文学流派的形成有自觉和不自觉两种情况，前者是自然形成的，既无组织，也无纲领，甚至可能是跨时代、跨国界的。如豪放派和婉约派就是跨时代的，写实派、浪漫派、现代派就是跨国界的。后者是以结社的形式出现的，有组织，有纲领，甚至有刊物和出版社，这是严格意义上的文学流派。同一个流派的作家，既有个人的独立风格，又有流派的共同风格。\n\n流派风格是指一些在思想感情、文学观念、审美趣味、创作主张、取材范围、表现方法、语言格调方面相近的作家在创作上所形成的共同特色，是一种群体文化的表现。流派风格体现了文学风格个体性与群体性的高度统一。\n\n二、流派风格的意义\n\n流派风格的多样化，往往是文学繁荣的一个重要标志。比如唐代诗歌极其繁荣，就与流派纷呈大有关系，如宫体诗派、王孟诗派、田园诗派等等。而宋代是词这一文体样式特别繁荣的时代，词在长期的发展过程中又形成了“婉约派”和“豪放派”这两种双峰对峙、二水分流的风格流派，两者势均力敌，像双子星闪耀在宋代文学的长空，相得益彰，绵延不断。在中国的现代文学史上同样出现过众多的风格流派，促进了新文化的进程，影响深远。\n\n文学流派常常影响一个时代文学的发展与走势，推动文学的发展。流派并出造成了多种多样的流派风格，形成了风格竞争的格局，这无论是对文学的繁荣，还是对大众的审美选择，都是有百利而无一害的。多样性是自然界的规律，也是艺术的规律。如中国现代文学史上同样出现过众多的风格流派，仅诗歌领域，就先后出现过以郭沫若为代表，具有狂飙突进抒情风格的创造社诗派；以徐志摩为代表，倾向唯美风格的新月诗派；以戴望舒、卞之琳等人为代表，以现代诗形与现代词藻为特色的现代派；以胡风为代表，富有战斗精神和散文化倾向的七月诗派。这些流派风格的竞争，推动了中国现代诗歌的繁荣。", "keywords": "流派 自觉和不自觉 自然形成 结社 流派风格 共同特色 群体文化 意义 多样化 文学繁荣标志 推动文学的发展", "note": "文学流派的相关内容，是考查中较为频繁出现的一个内容，这里主要探讨的是文学流派风格的定义及意义，而对于文学流派这一概念，我们也要有足够的认识，相关内容可以参考马工程版教材中文学流派的这一部分。", "framework": ""}, {"id": "260", "stars": 2, "title": "谈谈你对文学消费的认识", "body": "一、文学消费的定义\n\n（一）广义的文学消费\n\n广义的文学消费是指人们用文学作品来满足自己的精神需求的过程，也即文学阅读或文学欣赏。广义的文学消费概念与文学生产、文学传播概念并列，均指广义文学生产或文学活动整体流程中的一个环节。任何时代的文学活动都离不开文学的生产、传播和消费，因而广义的文学消费可以贯通古今成为文学活动整体流程的一个重要阶段，也是人们观察和研究整个文学活动的一个重要视角。\n\n（二）狭义的文学消费\n\n狭义的文学消费则是指进入近代商品社会和近代科技手段兴起等特定语境下出现的历史新现象，是在商品经济充分发展、印刷报刊出版等传播媒介广泛运用、文学成为一种特殊商品的历史条件下人们对文学作品的消费和阅读。这种狭义的文学消费，深深打上了商品消费的印迹（尽管它不完全等同于一般商品消费，同时还具有精神享受的属性）。\n\n二、文学消费的作用：将观念形态的作品转化为具体消费对象\n\n文学消费在整个文学活动流程中占有极为重要的地位。这是因为，作家创作出来的文学作品还只是一种观念形态（或曰本体形态）的作品，要使之转化为可供广大读者消费的对象，还有赖于一个将其观念形态的文本加以媒介化和物态化的过程，即经由编辑、出版、印刷或电子数字化（比特化）等阶段使作家观念形态的作品变为批量制作和广泛传播的文学书籍，并进入文化市场（如书店、书市、书亭等），被读者购买并阅读。这样，文学活动过程才构成一个相对完整的周期。\n\n三、影响文学消费的因素\n\n（一）文学生产\n\n文学生产为文学消费提供消费的对象-文学作品（文学产品），规定着文学消费的方式，规定着文学消费的需要，生产着新的消费者。\n\n（二）文学媒介\n\n文学媒介的发展变化影响着文学消费的特征。如进入电子化时代之后，文学媒介也随之发生了深刻变化，新的大众文艺传播媒介如广播、电影、电视以及互联网的出现使文学消费呈现出新的特色。\n\n（三）文学传播\n\n现代文学传播方式作为作家创作与读者消费之间的中介和桥梁，不断抹去传统意义上的文学消费与文学生产的固定边界，对文学生产和文学消费的双方已经或正在产生深刻的影响。", "keywords": "定义 广义的文学消费 满足自己的精神需求的过程 狭义的文学消费 对文学作品的消费和阅读 作用 将观念形态的作品转化为具体消费对象 影响因素 文学生产 文学媒介 文学传播", "note": "文学消费有广义狭义之分，在文学活动中具有重要的作用，并且受到了多种因素的影响，这些内容我们都要认识到。这一部分在考查中出现的可能性不高，但可以作为框架帮助我们了解这一部分整体的内容，故此给大家梳理了这样一道题目。", "framework": ""}, {"id": "261", "stars": 4, "title": "谈谈你对文学传播的认识", "body": "一、文学传播的定义\n\n作家创造出来的文本在未经物态化生产之前，只是一种观念形态的作品或者说是一堆涂满墨迹的手稿。要使这种涂满字迹的手稿转化为文学消费者的消费对象，还需要将其物化为文学书籍或其他媒体的文学读物即经过文学的出版、制作和发行活动，这也就是我们所说的文学传播活动。\n\n二、文学传播方式的发展\n\n（一）口头文学传播\n\n在历史上，最初的文学传播工作是由作者本人担任的。那时候，作家在公开场合宣读自己的作品。后来，出现了一些专门的职业说书人，他们往往说唱别人创作的作品。虽然口头文学传播方式至今仍未丧失其全部功能，但随着印刷术的发明，它早已让位于文学书籍传播方式。\n\n（二）文学书籍形式传播\n\n文学书籍形式自身也有其特殊的历史沿革，开始是数量很少的手抄本，而后是手工作坊印刷的石印本或木刻本，其数量也很有限。随着资本主义大工业生产方式的出现，机械印刷等近现代印刷术先后问世，文学书籍得以迅速地大批量地机械复制。这种把作家创作的手稿印刷成文学书籍的印刷，是通常所称的真正现代的出版活动。文学书籍的出版、印刷、发行这一传播方式的出现，具有重大意义，它意味着一部依附于作家的观念形态的文学作品开始取得了物质外壳，与它的作者分离。此后对作品的阅读、理解、阐释、评价，主要听命于它的新的主人-广大文学读者。在现代社会，批量复制的文学书籍和刊物已成为最广泛运用的文学传播方式之一。\n\n（三）多种传播方式并存渗透\n\n20世纪20年代以后，情况进一步变化，随着广播、电影、电视、电脑、互联网等新的大众传播媒介的出现，当代文学传播方式呈现出口头传播、书籍传播、视听传播及电子网络传播等多种方式并存和相互渗透的态势\n\n三、文学传播的作用\n\n文学传播方式的现代化进程是与整个人类社会历史的现代化进程相吻合的，现代文学传播方式作为作家创作与读者消费之间的中介和桥梁，不断抹去传统意义上的文学消费与文学生产的固定边界，对文学生产和文学消费的双方已经或正在产生深刻的影响。", "keywords": "定义 文学的出版、制作和发行活动 发展 口头文学 书籍形式 多种传播方式并存渗透 作用 中介 桥梁 抹去固定边界", "note": "文学传播是文学活动中的一个重要环节，起着沟通文学生产与文学消费的重要作用。随着社会的发展，文学传播方式也在不断地发展，并对当下的文学生产与文学消费产生了十分重要的影响。理解这部分内容，有助于我们更好地去探讨文学生产与文学消费之间的关系。", "framework": ""}, {"id": "262", "stars": 5, "title": "试分析文学生产与文学消费之间的关系", "body": "在现代技术社会的大众传播媒介的冲击下，文学消费与文学生产之间形成了一种辩证的互动关系。一方面，文学生产规定着文学消费，另一方面，文学消费也制约着文学生产。\n\n一、文学生产规定着文学消费\n\n（一）文学生产为文学消费提供消费的对象-文学作品（文学产品）\n\n文学消费作为一种对文学产品的阅读欣赏活动，必须有一定的文学产品为对象。没有消费对象的“消费”是不存在的。因此，文学消费对象受文学生产规定，这是不言而喻的。并且，文学消费者究竟消费到何种类型的文学，是现实主义文学还是现代主义文学，是高雅文学还是大众文学，是手抄本读物还是印刷本读物，是纸质文学图书还是电子文学图书，是呕心沥血创造出来的优秀作品还是粗制滥造出来的文学赝品等等，无一不受到作家的文学生产的规定。\n\n（二）文学生产规定着文学消费的方式\n\n传统意义上的文学阅读通常是一种文字阅读，但在文学生产的方式发生深刻变化和电子传播媒介普及的今天，文学消费不仅指文字阅读和纸质文学消费，而且也包括对广播影视文学的视听阅读和电子网络文学的视屏阅读，出现了所谓读图时代的文化消费方式。又比如，创作说唱故事和剧场演出的时代是群体围坐在一起共同消费的时代，生产文学书籍的时代则是个人阅读的时代。随着电影生产时代的到来，消费者又必须聚集到一起。而在电视文学和网络文学问世之后，消费者则可坐在家里进行文学消费。\n\n（三）文学生产规定着文学消费的需要，生产着新的消费者\n\n马克思指出：“艺术对象创造出懂得艺术和具有审美能力的大众，-任何其他产品也都是这样。因此，生产不仅为主体生产对象，而且也为对象生产主体。”一个社会或一个民族的文学消费者的文化层次、艺术修养、审美趣味和精神追求往往是通过文学产品创造出来的。扶持和生产优秀的严肃文学作品往往能“创造”出高品位、高境界的文学读者，而任由低劣庸俗的文学作品的泛滥则可能“创造”出趣味庸俗的读者。\n\n二、文学消费也同样反作用于文学生产，对文学生产起着重大的制约作用\n\n（一）文学产品在消费中才得到最后实现\n\n一个完整意义上的文学生产周期并非以作家创造出一部作品为终结。一部作品，无论写得如何精彩，倘若未能出版，或印出来后却未被读者购买和阅读，那么，它就只是一部潜在的作品，它的艺术价值和社会价值将无法得到实现，其认识、审美、交流等文化属性也不能得到体现。只有经过读者大众的消费，文学产品才成为现实的产品，文学生产才真正完成。在这个意义上讲，文学消费是文学生产过程中最后一个重要环节，缺少这个环节，文学生产就还未真正完结。也正是在这种意义上，现代接受美学家们才强调，文学作品有赖于作者与读者共同完成。\n\n（二）文学消费制约着文学生产的方式和规模\n\n文学生产如何进行？生产什么？生产多少？都要受到文学消费的制约。比如，文学消费者的文字阅读的消费方式，决定着文学作品的作者对语言文字技巧的重视，以及对文学形象、典型和情节等的关注；而读者大众对视听文学的消费，则决定了其作者不仅仅注意语言文字的运用，同时还要考虑到如何与表演、色彩、音响等因素配合。不仅如此，读者大众的审美要求、审美品位也是有层次的，这就决定了高雅文学生产和通俗文学生产的生产规模有所区别。一般说来，不同层次的文学产品的生产规模与不同层次的文学读者在数量上呈现着相互对应的比例关系。\n\n（三）文学消费体现了文学生产的目的和动力\n\n文学消费体现了文学生产的目的和动力，是文学消费对文学生产的制约作用中最为重要的一条。正是读者大众的文学消费需求决定和刺激着文学生产。如果脱离了读者的精神文化消费的需求，文学生产就失去了终极目的和意义。文学是人学，满足人的情感需求，是文学生产不竭的动力和源泉。", "keywords": "辩证的互动关系 文学生产规定文学消费 提供消费对象 规定文学消费方式 规定文学消费需要反作用于文学生产 制约作用 文学产品在消费中才得到最后实现 制约着文学生产的方式和规模 体现了文学生产的目的和动力", "note": "文学生产与文学消费的辩证关系，我们可以与之相关的生产和消费的关系进行理解。生产创造消费的对象，消费反过来制约生产，这一规律同样也适用于文学生产和文学消费。文学生产与文学消费的关系是马克思主义文艺理论十分重要的一个内容，大家一定要重点背诵。", "framework": ""}, {"id": "263", "stars": 4, "title": "谈谈你对文学消费二重性的认识（25南京师范大学、26西安外国语大学、贵州师范大学）", "body": "一、文学消费是一般商品消费\n\n自近代社会以来，随着物质生产方式的变化，文化产品的生产方式也相应地发生了变化。最为明显的就是文化传播工业的出现和文化流通市场的形成。这种情境使文学生产者与文学消费者发生了某种分离。在这种情况下，文学生产者与消费者之间的联系要借助于文化市场这个中介环节来实现。可见，从文化流通环节来看，文学产品具有明显的商品性质，文学消费也随之深深烙下了一般商品消费的印迹。由于文学产品的创造不仅凝聚了作家的智慧和心血，而且作为物态化生产过程的产品，还凝聚了其他劳动者所付出的劳动消耗，因而具有一定的交换价值或价格。\n\n文学消费作为一般商品消费，对于作者、出版者、发行者以及广大读者有着重要的各具特色的作用和影响。在商品经济发达和不发达的社会里，文学消费的商品属性的表现有强弱轻重的不同。我国正在建设有中国特色的社会主义市场经济，与此相适应，社会主义社会的文化产业和文化市场也正在走向繁荣和健全，广大人民群众对文化产品的多样化需求不断得到相应的满足。\n\n二、文学消费是特殊的精神产品消费\n\n在马克思、恩格斯看来，文学艺术不仅具有商品属性，更具有意识形态属性，具有认识和审美等精神属性。因此，马克思、恩格斯一方面承认文学产品属于一般商品消费，同时又注意到文学消费是一种特殊的商品消费，即它是一种特殊的精神产品消费，具有一般商品消费与精神享受以及意识形态再生产的二重性质，并主张必须维护文学产品的认识价值和审美价值。文学消费之所以不能完全等同于一般商品消费，其理由在于：\n\n（一）与一般物质产品评价标准不同\n\n一般物质产品主要满足人们的物质生活需要，而文学产品作为一种特殊的精神产品，主要满足人们的精神生活需要。因此，一般商品的消费价值对消费者来说是相同的并有同样的衡量标准，而文学产品的消费价值对不同的消费主体来说会有不同的效果，因而具有不同的评价标准。\n\n（二）价值无法定量评估\n\n一般物质商品的交换价值是严格依据等价交换的原则进行的，而文学消费者所支付的货币往往与凝聚在文学产品的物态化生产过程中的劳动消耗相等价，而与其中寓含的作家的创造性劳动难以等价，对后者的独特价值则往往难以作定量评估，尤其是伟大的文学作品常常是独创的、不可重复的。\n\n（三）具有超时空性\n\n一般物质商品的消费是一种纯粹的价值耗损，其使用价值随着消费中的有形损耗与无形损耗，有一个必然被淘汰的过程。但是，尽管大量文学产品也存在着被淘汰的可能，然而，各个时代的优秀文学产品却具有超时代性，它们以其永久的艺术魅力而为历代读者所共享。因此文学产品的消费具有超时空性，伟大的经典文学名著甚至具有价值增值性。\n\n（四）具有再创造性质\n\n一般商品消费是名副其实的消费，而文学产品的消费不仅仅是一种商品消费，更是一种文化信息的传播与接受，并且往往具有再创造的性质，它要求消费者本人的积极参与。", "keywords": "一般商品消费 商品性质 特殊的精神产品消费 意识形态属性 认识和审美等精神属性 精神生活需要 不同的评价标准 评价标准 无法定量评估 超时空性 再创造性质", "note": "文学消费的商品属性，是近代以来生产方式变化之后逐渐凸显出来的，并得到了大多数评论的肯定。但文学除了商品属性还有意识形态属性，这导致它并不能与一般商品完全划等号。这部分内容在考查中出现的频率比较高，其中文学消费与一般商品消费的区别可能单独出题，具体可以参考下一题。", "framework": ""}, {"id": "264", "stars": 3, "title": "试分析文学消费与一般消费的区别（26中国矿业大学）", "body": "文学消费之所以不能完全等同于一般商品消费，主要是文学消费具有以下特质：\n\n一、与一般物质产品评价标准不同\n\n一般物质产品主要满足人们的物质生活需要，而文学产品作为一种特殊的精神产品，主要满足人们的精神生活需要。因此，一般商品的消费价值对消费者来说是相同的并有同样的衡量标准，而文学产品的消费价值对不同的消费主体来说会有不同的效果，因而具有不同的评价标准。\n\n二、价值无法定量评估\n\n一般物质商品的交换价值是严格依据等价交换的原则进行的，而文学消费者所支付的货币往往与凝聚在文学产品的物态化生产过程中的劳动消耗相等价，而与其中寓含的作家的创造性劳动难以等价，对后者的独特价值则往往难以作定量评估，尤其是伟大的文学作品常常是独创的、不可重复的。\n\n三、具有超时空性\n\n一般物质商品的消费是一种纯粹的价值耗损，其使用价值随着消费中的有形损耗与无形损耗，有一个必然被淘汰的过程。无论在什么时代，无论技术多么进步的物质产品，最终都要被性能更先进的产品取代。它们当中的个别物品可能转化为文物被博物馆收藏，但绝大多数物质产品要退出消费领域。但是，文学产品则不然，尽管大量文学产品也存在着被淘汰的可能，然而，各个时代的优秀文学产品却具有超时代性，它们以其永久的艺术魅力而为历代读者所共享。例如中国古代的《诗经》、楚辞、唐诗、宋词以及古希腊神话、史诗和悲剧等至今仍为人们所喜爱。可见文学产品的消费具有超时空性，伟大的经典文学名著甚至具有价值增值性。\n\n四、具有再创造性质\n\n一般商品消费是名副其实的消费，而文学产品的消费不仅仅是一种商品消费，更是一种文化信息的传播与接受，并且往往具有再创造的性质，它要求消费者本人的积极参与。作为文学生产者的作家，应该有高度的社会责任感，应该创造出思想内容健康的、艺术性很强的作品，传播到文学消费者手中。为了赚钱而迎合少数读者的不健康的趣味，是完全错误的。", "keywords": "评价标准 无法定量评估 超时空性 再创造性质", "note": "①文学消费是特殊的精神产品消费，这是因为文学消费显示出了许多一般商品消费所没有的特征，因而不能与一般商品消费完全划等号。而文学消费的这一特征，实质上还是与文学自身的特征联系在一起的，像是超时空性、再创造这些性质都与文学的特殊性密切相关。②此题是上一题其中一个方面的展开，之所以把这道略显重复的题目也单独拿出来，是想让大家知道命题方式与角度确实很多元，在考试中遇到一定要学会变通。", "framework": ""}, {"id": "265", "stars": 1, "title": "谈谈你对文学消费意识形态性的认识", "body": "一、文学消费意识形态属性的来源\n\n文学消费总是与特定的社会民族、阶级、阶层以及集团的利益相关，文学消费作为一种意识形态消费，历来起着肯定或批评特定的社会关系、社会结构的深刻作用。文学消费过程中产生的潜移默化的影响，实质上总是在传播和再生产着特定的意识形态观念。简言之，文学消费与接受就是文学生产者通过文学产品被读者阅读欣赏，以传播和再生产某种特定的意识形态观念。在这种文学阅读过程中，维系或变革一定社会关系和社会结构所需要的某种意识形态观念被再生产出来，并进一步转化为接受者的日常生活意识。\n\n二、文学消费意识形态属性的表现\n\n尽管文学消费和接受无不渗透着特定的意识形态观念，但它们的具体表现却非常复杂，或隐或显，或轻或重。但是，即便被认为是纯审美、纯娱乐的文学消费，也往往是自觉不自觉地与意识形态有关。声称文学消费与意识形态无关，本身就是一种意识形态观念。一般来说，在社会矛盾激化的动荡时期，文学消费的意识形态性质往往表现得比较鲜明；而在社会矛盾缓和的情况下，文学消费的意识形态性质则表现得比较间接和隐蔽。文学消费对意识形态的反应大约有以下几种解码方式：\n\n（一）自上而下的灌输。文学消费直接为某种体制和社会结构服务传播和再生产着现行某种政治、经济制度所需要的意识形态；\n\n（二）是自下而上的反抗。文学消费为抵制和批判现行政治和经济制度服务，传播着批判现行制度不合理性的意识形态观念；\n\n（三）既非自上而下的灌输，也非自下而上的反抗，而是某种协商和谈判，是某种权威意识观念和边缘意识形态价值之间的妥协和杂糅。\n\n（四）还有一种文学消费的解码方式声称文学消费与政治无关，声称文学远离某种政治、经济制度或超越主流的意识形态观念，即所谓非意识形态化。\n\n实际上，文学消费的意识形态性是不可能回避超越的。在这种情况下，文学消费的意识形态性质往往显得较为隐蔽，即使意在传播和宣扬某种别样的意识形态，也常常打着“为艺术而艺术”的旗帜，致使人们在漠视其意识形态作用时不经意地受到影响。总之，我们要对文学消费解码方式及意识形态效果多样性和复杂性有充分的认识。\n\n三、文学消费意识形态属性的特征：潜移默化\n\n文学消费的意识形态性与政治理论宣传或哲学伦理思辨是不同的，它不是以概念形式的意识形态观念直接灌输给消费者，而是寓思想观念于艺术形式的审美结构和艺术娱乐的审美效果之中，往往是以潜移默化的形式影响或更新消费者的艺术感受力和艺术领悟力，进而影响其对整个世界的感受力和领悟力。", "keywords": "来源 传播和再生产 特定的意识形态观念 表现 自上而下 自下而上 协商和谈判 非意识形态化 特征 潜移默化", "note": "文学消费的意识形态性，是与文学的意识形态性联系在一起的。读者在选择消费、阅读和阐释作品的时候，难以避免地具有某种意识形态性。这一部分在考查中出现的频率也比较低，我们主要还是以了解为主。", "framework": ""}, {"id": "266", "stars": 5, "title": "试分析文学消费与文学接受的区别和联系", "body": "一、文学消费与文学接受的区别\n\n文学消费和文学接受虽同属于现代文艺理论术语，但二者的含义也有所不同。文学消费和文学接受之间的区别主要有以下几点。\n\n（一）文学消费具有物质消费和精神消费二重性，而文学接受则纯属一种精神文化范围内的活动\n\n“文学消费”属社会精神产品消费，它是现代大众日常生活中不可缺少的一部分，是一种普遍存在的社会性消费。这是因为，作为精神产品，文学作品已成为每一个人身心健康发展过程中必然接受的一种精神养料，并日益成为当代社会最重要的大众消费品之一。对每一个消费者来说文学消费是他个人所有消费项目中的一个重要项目；而对于整个社会而言，文学消费也是整个社会经济消费行为中的一个组成部分。总之，文学消费一方面满足人们的精神生活需要，给人带来精神享受；另一方面，为获得这种享受，消费者又必须付出相应的货币，因而文学消费兼具物质消费和精神消费二重性。\n\n“文学接受”概念则不然，当我们说“文学接受”时，可以不考虑他的文学书籍是买来的、借来的或别人赠送的，而仅仅关注接受者对文学作品的阅读这种精神活动本身。\n\n（二）文学消费既包括阅读行为，也包括未含阅读活动的消费行为；而文学接受则一定是一种阅读或欣赏的精神活动\n\n“文学消费”固然主要指文学阅读，但也不尽然。有的文学消费者买来文学书籍，并不打算或并未进入阅读而只是为了收藏、摆设或炫耀。这种不阅读的文学消费包括在文学书籍生产和消费的经济周期内，因而对于文学消费研究来说，也是不能忽视的。\n\n“文学接受”则不包括这种占有式的外在享用活动，文学接受活动只是对进入了具体的文学阅读过程的读者而言的。\n\n（三）文学消费与文学接受的主客观条件不同\n\n欲使文学消费得以顺利进行，除了要求文学消费者具备必要的文化知识、阅读能力及消费心理等主观条件之外，还要求文学消费者具备必要的经济能力、闲暇时间和适当的空间等客观条件。\n\n文学接受的主客观条件则有所不同。就文学接受的主观条件而言，除了前面所说的阅读能力等之外文学接受研究更关注接受者的个性、气质、性别、年龄、职业、经历、人生观、文化修养、审美趣味、美学理想、艺术经验、期待视野及阅读心境等。文学接受的客观条件则主要指接受的对象（文本）以及接受者所处的历史时代背景等。由此可以看出，文学消费和文学接受的主客观条件各有侧重。\n\n（四）文学消费研究具有综合的多视角的特点，而文学接受研究则侧重于读者接受机制这一独特视角\n\n文学消费研究既要涉及文艺社会学和文艺经济学领域，同时也要涉及哲学、美学、心理学等多种角度。它关注的是整个文学大生产周期（生产、出版、流通及消费）中的最后一个环节，尤其重视对文学生产与文学消费之间的互动关系的研究。文学消费研究虽然也涉及消费心理，但主要是研究文学消费前的消费偏爱、兴趣或时尚，并不进入具体的阅读过程的审美考察。\n\n而文学接受研究则着重从文学文本学和美学心理学角度来探讨整个文学活动过程（创作、作品及阅读）中的最后一个环节，着重考察接受主体的文本解读与文学作品的文本价值实现之间的辩证关系。文学接受研究关注具体的阅读过程、阅读心理和阅读条件，关注接受过程的发生、发展和高潮等各个阶段，探讨文学作品是如何经由文学接受活动而由潜在的文本变成具体的审美对象，研究文本意义的形成过程，等等。\n\n二、联系\n\n尽管文学消费和文学接受有以上种种含义上的区别，但作为现代文艺学的两个重要术语，既然都有文学阅读这个共同的所指，因此它们的基本意思还是相通的，二者存在着紧密的联系。文学消费是初级状态的或者说低层次的文学接受，而文学接受则是高级状态的或者说高层次的文学消费，二者共同指向的核心均为文学欣赏或审美鉴赏这个文学阅读活动的最高层次。", "keywords": "二重性 精神文化范围 阅读行为 消费行为 阅读或欣赏的精神活动 主客观条件 综合的多视角 读者接受机制文学欣赏或审美鉴赏", "note": "文学消费与文学接受的区别，主要在于一个指向的是“消费”这一过程，一个指向的是“接受”这一过程，二者的属性、条件和所属领域都有不同，因而表现出了许多区别。不过，二者都可以指代文学欣赏，因而也有一定的联系。文学消费和文学接受的关系在考查中经常出现，二者的区别更是会单独出题，大家一定要重点关注。", "framework": ""}, {"id": "267", "stars": 2, "title": "怎样理解文学接受是一种审美体验活动", "body": "文学作品作为一种特殊的精神文化形态和话语产品，其最基本的属性是审美的价值属性，文学的审美价值是文学艺术显著地区别于其他意识形态的特质之所在。因此，文学接受首先表现为审美活动。从文艺美学和文艺心理学角度看，文学接受的审美价值属性意味着文学接受给读者带来了令人愉悦的审美体验，读者能在文学作品中获得审美体验的原因如下：\n\n一、文学作品审美属性的来源\n\n（一）文学作品并非对客观社会生活的机械描摹，而是深深地渗透着作家本人对社会生活的情感态度。一般说来，当作家把他在生活中感受和体验到的真善美诗意地描写到文学作品中时，就会激起读者肯定性的情感评价，唤起人们对美好事物\n\n的热爱和追求；而当作家把生活中的假恶丑揭露在作品中，并给予批判性或否定性的情感评价时，则会相应地引起读者的对丑恶事物的厌恶、憎恨、愤怒等情感态度，并由此唤起对真善美的渴望与憧憬。\n\n（二）文学作品的艺术形式本身也是文学审美价值的重要来源之一。文学作品中叙述角度的独特、安排故事情节的机智、悬念设置的奇妙、抒情意象的奇特、文学结构的精巧，以及遣词造句的形式美等，都可能为作品增添美的魅力，给读者带来美的享受。\n\n（三）文学的审美价值属性最根本的来源是文学作品中内容与形式辩证统一所造成的既源于现实又不同于现实的艺术世界或艺术境界，为满足读者的审美需要、审美趣味、审美理想提供一种其他意识形态不能替代的处所。在阅读文学作品的瞬间，读者既可以由于沉浸到虚构的文学世界中而忘怀现实，从而获得一种精神上的愉快感、自由感和解放感，同时也可由于意识到现实生活与文学世界的某种差异而震惊，而警醒，从而产生一种振聋发聩、耳目一新的审美震撼和情感体验。\n\n二、文学接受审美属性的层次\n\n文学的审美属性规定了文学阅读可以而且应当是一种审美方式的阅读。事实上，充分地接受、欣赏文学的审美价值，正是文学读者最为常见的阅读动机之一。而在这种表层心理动机下，潜伏着更为深刻的心理背景。在众多读者中，有的是为了满足一种补偿和宣泄的渴望；有的则意味着对生活的积极介入，意味着充实自己的精神生活，提升自己的心灵境界，培养健全的人格结构，增强自己的生活智慧、力量和信念。因此，文学消费作为一种审美娱乐和审美享受，既可以抚慰读者失衡的心灵世界，也可以唤起读者崇高的审美理想。\n\n因此，文学接受的审美价值属性本身也是分层次的，大多数美学家们都赞同把它们概括为悦耳悦目、悦心悦意、悦神悦志等相互联系又有所区别的三个层次。它们分别指接受者对作品艺术形式的审美感知及其所引起的感性快适、对作品中人物性格的审美体验及其带来的情感和想象的愉悦，以及对作品中关于宇宙、历史和人生的深邃思想意蕴的领悟及其所带来的超越感、升华感和自由感。\n\n三、文学审美属性的意义\n\n文学的审美属性是文学活动的其他各种文化属性赖以存在的基础，人们之所以愿意以文学来丰富自己的生活知识、启迪自己的人生智慧、增进自己的人际交往，是因为文学接受能给读者带来美的享受，具有审美体验的价值和审美享受的属性。文学接受的审美价值使文学接受的其他价值获得了独特的形式和载体。", "keywords": "审美的价值属性 情感态度 艺术形式 内容与形式辩证统一 层次 悦耳悦目 悦心悦意 悦神悦志 意义 基础", "note": "这一部分可以联系中西方的文学接受美学进行思考。前面我们已经认识到，文学接受不等于文学消费，文学接受在于“接受”，在于对文学作品有所体察和感受，而这种感受是具有审美属性的，因为文学作品本身是具有审美性的，而审美的过程可以看作是对作者表达内容的游历过程，即文学接受是一种审美体验活动。", "framework": ""}, {"id": "268", "stars": 2, "title": "怎样理解文学接受是一种审美认识活动", "body": "文学作品作为一种社会性话语产品，认识属性是其古老而又基本的文化属性之一。因此文学接受也表现为一种具有审美特性的审美认识活动。这是因为，文学在一定意义上起源于人类模仿和求知的本能。文学作品通过生动的艺术形象，反映社会生活的各个方面，揭示自我人性的丰富本质，因而具有一种为读者提供认识社会生活、认识人类自身本质的价值属性。\n\n一、文学作品社会认识价值的特征\n\n（一）主要揭示“人化的自然”\n\n在对人的外部世界的揭示方面，文学艺术主要以细节描写、形象塑造和环境描写的方式反映社会生活，反映一定历史时期的政治、经济、文化、社会心理、社会时尚民情风俗以及日常生活等，致力于通过人物命运、性格与心理的描写来揭示社会生活中人与社会之间、人与生存环境之间、人与人之间（如个体之间、家庭之间、性别之间、阶层之间等）的各种社会关系，并以此暗示人类社会生活的某种发展趋势。\n\n（二）具有深度和广度\n\n文学作品的社会认识价值不同于人文社会科学著作的认识价值，它是以形象或形象体系来整体地反映五光十色的社会生活，它所达到的深度和广度，往往为那些分门别类地反映现实的科学著作所难以企及，因而伟大的经典文学名著常常被人们称为史诗或百科全书。\n\n二、文学作品认识价值的具体表现\n\n不同文学作品的认识价值的具体表现不同。\n\n叙事性文学作品往往通过讲故事即叙述主人公的活动事件、描写人物命运或人物性格变化的方式来反映社会生活。写实类叙事作品还要通过塑造文学典型来体现其深厚的认识价值。抒情性文学作品则往往通过对抒情主人公形象的诗意塑造和情感抒写，反映某一社会、某一时代或某一民族的精神风貌。\n\n此外，不同层次和形态的文学作品，认识价值的高低也往往不同。相对来说，严肃高雅的经典文学作品具有醒世的功能，其认识价值要高于流行的大众文学作品。\n\n三、文学接受认识属性的意义\n\n（一）帮助读者认识客观世界\n\n文学作品的认识属性，为广大读者提供了一条了解客观世界、丰富生活经验、洞悉人生真谛的有效途径。由于人的生存时空的局限，每一个读者的生活知识和生活阅历都是有限的，然而生活本身却是无限的，文学作品正可以帮助读者认识丰富的社会生活。从文学接受中读者既可以感受当下，又可以了解过去，还可以洞察未来。不仅如此，即便是生活在某种境遇中的人们，也不一定真正了解自己的真实处境，可谓“不识庐山真面目，只缘身在此山中”。文学作品则把人类社会生活描写出来并呈现在读者面前，从而帮助读者认识社会现实，把握历史规律，增长生活知识，满足认知需求，洞悉人生真相。\n\n（二）帮助读者认识主观世界\n\n文学是人学，文学是写人的、为人而写的，文学作品渗透了作家本人的人格、精神和情感评价，文学艺术使人直面人生、拷问自我，认识到“我是谁？我从何处来？我到何处去？”读者通过阅读往往能加深对人类自身特性和本质的洞悉，增进对人性复杂性的理解与宽容。在文学接受活动中，读者自我灵魂深处的假、丑、恶的卑劣因素得以烛照、荡涤或升华，真、善、美的人性种子得以滋润、培育和发扬，人的胸襟得到扩充和提升。从一定意义上讲，文学接受可谓读者与作家一道参与对人性奥妙或生命真谛的探索和揭示。", "keywords": "特征 人化的自然 深度和广度 文学作品 具体表现 意义 认识客观世界 认识主观世界", "note": "文学接受是一种审美认识活动，主要原因是文学具有认识价值，相较于科学著作等其他领域的著作，文学更深更广地反映了社会生活，反映了客观世界与主观世界，因此，通过文学接受，人可以更清楚地认识客观世界和主观世界。这部分内容，可以联系文学的认识性进行理解。", "framework": ""}, {"id": "269", "stars": 3, "title": "谈谈你对文学接受作为价值阐释活动的理解", "body": "文学是一门语言艺术，而语言是文化媒介和载体，因而文学作品蕴含着极为丰富的文化信息。文学作品作为一种文化内涵丰富、文化信息密集的文化产品，无论是对于创作者抑或是对于读者，都关乎他作为生命主体的生存价值和意义，因此，读者在阅读文学作品时，可以从中探索某种文化价值和意义。换言之，文学接受具有一种多方面满足读者进行文化价值阐释、品味或品评之兴趣的属性。文学的文化阐释价值是文学属性中最为古老又最为现代、最为深厚也最为广泛的文化属性。文学接受因而表现为文化价值的阐释活动。\n\n一、文学价值阐释属性的来源：文学作品独特的人文品格和深刻的人文关怀\n\n文学与科学不同，科学研究本身无所谓人文关怀，而文学则向来被称为人学具有与生俱来的人文向度。在反映现实的时候，文学作品与自然科学著作在对象、主体、方式、旨趣等诸多方面均为不同，它所反映的对象恰恰是人类自己创造的文化世界、价值世界或意义世界，创作主体在写作过程中不可能也无需排除主观意志，其创作方式则是运用各种虚构、梦幻、象征、比拟、隐喻等艺术技巧，写出作家自己对人生的独特体验和深刻理解，其创作目的则是探寻某种人生的价值、意义和真谛。文学与科学之间有无人文属性的区别决定了文学接受的价值阐释属性。\n\n二、文学作品的文化阐释价值内涵\n\n（一）基础价值：民俗学和人类学价值\n\n文学作品的文化阐释价值是多方面的，最常见的是通过解读一部文学作品，阐释其中所反映的某个时代、地区、民族的生活习俗，具有一定的民俗学和人类学价值。文学作品的民俗学价值是文学的文化阐释价值中的基础价值。\n\n（二）社会学、历史学、政治学价值\n\n文学作品中所包括的社会学、历史学、政治学价值等内涵，也是文学常见的文化阐释价值，这些文化价值在纪实性的各类文学作品中最为丰富。\n\n（三）宗教价值\n\n文学作品中所蕴含的宗教价值，是文学的文化价值中较为重要、较为深层的阐释价值。\n\n三、文学价值阐释方法\n\n读者作为作品的文化价值的接受主体，就是文化的阐释者。从理论上讲一切读者都是与自然人相对的文化人，都可以是文化价值的阐释者。当然，更有代表性的是那些自觉地从事文化阐释的文化哲学家和文化批评家。\n\n文化阐释活动的特点和方法，既不等同于认识，也不等同于审美。如果说审美者主要是一位情感的体验者，认识者主要是一位理智的觉察者，那么，阐释者则主要是一位文化内涵、文化意义、文化意向的理解者、解释者、评价者、对话者甚至是质疑者、诘问者。阐释的要义是，阐释主体站在自己的文化视野上，以自己的文化意向去与作品中所蕴含的文化意向进行对话与交流.", "keywords": "来源 人文品格 人文关怀 内涵 民俗学 人类学 社会学 历史学 政治学 宗教 方法 读者 接受主体 阐释者文化视野 对话与交流", "note": "文学接受是整个文学活动系统中一个必不可少的环节，对于作品审美价值和社会功能的实现，激励作家的创作，推动文学事业的进一步繁荣发展都具有重要的意义。理解文学交流的文化阐释属性，需要我们从文学价值阐释属性入手去分析，包括其来源、内涵和阐释方法我们都要掌握。", "framework": ""}, {"id": "270", "stars": 1, "title": "怎样理解文学接受是一种交流活动", "body": "文学作品作为一种审美的社会化话语作品，具有增进人们彼此了解、沟通与交流的属性。因此，文学消费和接受也表现为一种特殊的即审美的交流活动。文学并不仅仅是为了供人们娱乐和享受，也负有教化与交流的使命，并且，通过交流而产生润物无声、潜移默化、移风易俗的作用。\n\n一、文学接受具有审美交流属性的原因\n\n人是具有社会属性的人，也是各种社会关系的总和。文学活动作为一种社会性话语活动，作为人类确证自我生命存在的文化活动交往属性成为文学的重要属性之一。文学的消费、接受和欣赏固然要通过个人来实现，固然是一种极为个性化的活动，固然有自我娱乐和游戏的成分，但从深层次来说，一切文学艺术活动乃是人们彼此交流的重要方式之一，是社会群体、民族乃至全人类相互交流思想情感、传授生活经验的重要途径之一，因而文学接受是确保社会整体得以维系、社会价值得以建构、历史传统得以绵延的基本文化活动。文学接受可以在不同的社会成员之间架起理解和沟通的桥梁，把他们从情感上结为一体。\n\n二、文学交流的特征：平等对话\n\n文学交流源于人类的日常交流，但文学交流与人们日常生活中的日常交流有着诸多不同。日常交流有可能是单向度的非对称的，有可能是强制性的、说教性的，也有可能是枯燥的抑或是误解的，甚至是虚假的、不诚实的。但这一切都难以发生在文学交流之中。这是因为，文学读者不是消极被动地接受作家作品发出的信息，而是以对话者、诠释者、再创造者甚至是批评者的身份出现。文学接受主体是一个自由的主体，读者总是积极、主动、有选择地进行文学欣赏和阅读，他可以拒绝购买和借阅文学作品，也可以随时放下手中的作品，作者或其他人没有强行干预、命令和指挥读者非读不可或非这样读不可。文学交流因而具有平等对话的性质。\n\n三、文学交流的作用：帮助人们扩大其社会交际或人际交往的范围\n\n文学接受作为文学交流活动，类似于日常交流中的理想状态：真诚、忠实、平等、亲密而自由。文学接受活动中的读者与作者、读者与作品中的人物，甚至是读者与读者之间，往往类似于精神、气质、情感上彼此投缘和亲近的朋友式的关系，属于理想的人际交流状态。限于种种条件，人们在现实生活中不可能有很多挚友，而文艺阅读这种交流活动，正好帮助人们扩大其社会交际或人际交往的范围。它使人们摆脱时空的桎梏，与彼时、彼地的作家、艺术角色和其他读者成为朋友。", "keywords": "原因 彼此交流的重要方式之一 特征 平等对话 作用 扩大交往范围", "note": "文学接受的交流属性是指文学作为一种审美的社会化话语作品，具有加强人们彼此间了解、沟通与交流的属性。而文学接受之所以具有这一属性，与文学艺术活动的交流属性是相联系的。这部分内容在考查中出现的可能性不大，但对于文学交流的特征和作用我们还是要了解一下。", "framework": ""}, {"id": "271", "stars": 5, "title": "如何理解期待视野", "body": "在文学阅读之先及阅读过程中，作为接受主体的读者，基于个人与社会的复杂原因，心理上往往会有既成的思维指向、审美趣味与观念结构，会有对于文学接受客体的预先估计与期盼。读者这种据以阅读文本的既定心理图式，叫做阅读经验期待视野，简称期待视野。\n\n一、期待视野的层次\n\n在具体的文学阅读活动中，这种期待视野主要呈现为文体期待、形象期待与意蕴期待这样三个层次。\n\n（一）文体层的期待视野。即读者由文学作品的某种类型或形式特征而引发的期待指向。这种指向，意味着读者希望体味到某种文体所可能具有的特定艺术韵味和魅力。比如面对一部以再现为基本手法的长篇小说，读者会期待着波澜起伏的故事情节和血肉丰满的人物形象的塑造；面对一首诗歌，读者会期待节奏、韵律以及某种抒情意境的出现等。\n\n（二）形象层期待视野。即读者由于作品中的某种特定形象而引发的期待指向。这种指向，意味着读者希望从初次接触到的形象和情景中，看到某种符合人物性格特征或符合某种特定情绪的氛围的展示与渲染。例如，当我们在作品中看到“青松”“寒梅”“白莲”“岩石”之类的形象时，会期待着作者对那种冰清玉洁、坚忍不拔的人格精神的赞美。\n\n（三）意蕴层的期待视野。即读者对作品的较为深层的审美意味、情感境界、人生态度、思想倾向等方面的期待指向。实践表明，在具体的文学阅读活动中，读者总会自觉不自觉地期待着作品能够表现出切合自己意愿的审美趣味和情感境界，总会期待着作品表现出一种合乎自己理想的人生态度，流露出一种与自己相通的思想倾向等等。\n\n此外，诸如作家的姓名，作品的篇名、题记、开本以及装帧设计等，也会在一定程度上影响读者的期待视野。\n\n二、期待视野的形成\n\n（一）由生活实践和文化教养形成的世界观与人生观，即读者在长期的社会生活中形成的审美趣味、情感倾向、人生追求、政治态度等，所有这些，都会影响读者期待视野的形成。比如一个有着积极向上的人生追求的读者，会期待着文学作品更富于豪迈乐观的情调，能够更为充分地展现那些不畏艰险、奋勇进取的人生故事。\n\n（二）其次是一定的文学艺术素养，即读者对各种文学体裁、文学发展史、文学发展现状、文学自身的技巧、手法、创作规律、艺术特征的熟悉和了解。只有在此基础上，才能形成与之相关的文体层、形象层、意蕴层期待视野。\n\n（三）特定的生理机制，即读者的性别、年龄、气质类型等生理特征，所有这些，也会影响读者的期待视野。从性别来看，男性与女性会有不同的生理特点。表现在文学阅读中，女性读者往往期待细致入微的情绪感受，男性读者会更期待粗犷不羁的情感宣泄。\n\n从年龄特征来看，儿童们天真活泼、善于想象；青年人勇于追求、敢想敢干；老年人则往往处事冷静、喜欢多思，等等。表现在文学阅读中，孩子们会期待着看到以花、鸟、虫、鱼为主角的童话故事；青年人会对传奇故事、爱情小说更感兴趣；老年人则会希望看到对人生哲理的冷峻揭示，对世态炎凉的描写刻画等。\n\n总之，从整体上来看，正是由这些源于世界观、人生观、文学艺术素养和特定生理机制的先在欲求、先在经验，逐渐形成了读者阅读活动中的某种心理图式，这便是期待视野。\n\n三、期待视野的类型\n\n文学阅读活动中的期待视野，按其接受主体的状况划分，又可分为以下两种：\n\n（一）普通读者的期待视野，即一般读者凭依个人兴趣在阅读某一具体作品过程中体现出来的期待视野。\n\n（二）专业读者的期待视野，即专门从事研究和批评的特殊读者所拥有的期待视野。\n\n相比而言，后者要比前者宏阔深广，会有某种广泛的社会共通性。此外，还应看到，不论一般读者的期待视野，还是专门读者体现的期待视野，都不是一成不变的，而是会随着生活阅历的增加、接受范围的扩大、艺术修养与理论水平的提高，不断发展变化的。", "keywords": "既定心理图式 文体期待、形象期待与意蕴期待 世界观与人生观 文学艺术素养 生理机制 普通读者 专业读者 发展变化", "note": "“期待视野”这个概念不仅是横向的起中介的作用，而且也会随着时代的发展而变化。当既定的“期待视野”与一部新作品不一致时，就产生了一种所谓审美的距离，这是一种打破平衡的情况；审美距离的克服，则是新平衡的建立。旧的平衡不断打破，新的平衡不断建立，就形成了“期待视野”的变化。姚斯将这一过程称为“视野改变”。期待视野这一概念在考查中出现的频率非常高，除了论述题以外，还会考查名词解释的内容。", "framework": ""}, {"id": "272", "stars": 2, "title": "试分析接受动机的主要类型", "body": "由于期待视野不同以及期待视野自身的发展变化，在文学接受活动中，读者的动机是不一样的。概括起来，主要有以下几种。\n\n一、审美动机\n\n审美动机也就是人们通常所说的怡情悦性的娱乐动机，即是读者希望通过接受文学作品而获得情感愉悦并感到自由、轻松、平衡、协调的阅读期待。人永远有着向往自由、积极进取、追求完美的天性，有着力图超越自身而趋向崇高的欲望。优秀文学作品中潜在的无限想象空间，真挚的情感境界，美妙的人生理想，正可以满足读者的这种期待心理。因此，人们在忧郁不安、悲伤失意之际，或在繁忙工作之余，总喜欢阅读文学作品，以期进入一个超越自身、超越现实的想象境界，使情感得以调节，使精神得以舒张，使心灵得以振奋和净化。其中所体现的，即是文学接受的审美动机。\n\n二、求知动机\n\n求知动机是人们力图通过文学作品认识历史规律、社会本质，熟悉人类某种生活状态，了解各类知识的动机。如马克思、恩格斯、列宁、毛泽东等许多革命领袖在阅读文学作品时，更注意的是作品中涉及的与当时的政治斗争、革命斗争有关的内容；某些领域的研究者，有时也借助文学作品来研究不同国家、不同时代的典章制度、民俗风情、文化变迁、医药农工等有关知识。\n\n三、受教动机\n\n受教动机是人们力图通过作品中的故事情节、人物形象、思想感情得到人生启迪、道德教育、精神鼓舞的动机。在现实生活中，有不少人在自己的人生道路上曾力图从优秀的文学作品中探寻生活的航向，求索人生的答案树立正确的人生态度，以求成人成才，其中体现的便是这样一种受教动机。\n\n四、批评动机\n\n批评动机主要表现在从事文学研究、文学批评、文学教育的专业工作者身上。与普通读者不同，这些专业读者在阅读文学作品时，除获得审美享受之外，会更专注于把握作品的内涵，分析作品的意义，探讨艺术创作的规律以期对文学作品进行科学的评价。\n\n五、借鉴动机\n\n借鉴动机要表现在作家，尤其是初学写作者的阅读过程中。这些读者，常常是为了模仿借鉴他人的艺术技巧，提高自己的创作质量，而积极投身阅读的。因此，对于自己特别崇拜的作家的作品，他们往往会反复阅读，仔细揣摩，甚至摘录抄写，记忆背诵。\n\n接受动机不同，必然导致读者不同范围的阅读选择；即使面对同一部作品，读者的着眼点也会不同。但是，接受动机的不同，并不意味着它们之间是彼此无关的。在实际的阅读活动中，不同的阅读动机有时又是相互联系的。", "keywords": "审美动机 求知动机 受教动机 批评动机 借鉴动机", "note": "所谓接受动机，其实就是进行文学接受时的出发点和最终目的。按照具体动机的不同，可以分为五类。大家要注意的是，这些接受动机之间并不是孤立的，而是相互联系的，在记忆时可以联系一些具体事例进行分析。", "framework": ""}, {"id": "273", "stars": 2, "title": "谈谈你对接受心境的认识", "body": "一、接受心境的定义\n\n在现实生活中，人们总处于一定的情绪状态。在文学阅读活动开始时，这种生活中的情绪状态不可能截然中断，会伴随读者进入阅读过程，影响阅读效果。读者的这种影响阅读的情绪状态，就叫接受心境。\n\n二、接受心境的分类\n\n从基本特征来看，文学接受心境主要有欣悦、抑郁与虚静这样三种情况。\n\n（一）欣悦心境是指主体进入阅读活动时所具有的振奋、欢快、乐观的情绪状态。\n\n（二）抑郁心境是指主体进入阅读活动时所具有的失意伤感、郁闷压抑之类的情绪状态。\n\n（三）虚静心境则超脱于欣悦与抑郁，其情绪状态呈现为冲淡平和、清静自然。\n\n三、接受心境与阅读效果的关系\n\n（一）接受心境影响阅读效果\n\n接受心境对阅读效果的影响是明显的。当读者处于欣悦的情绪状态时，一部平常之作，也有可能激起一定的阅读兴趣，得到惬意的审美享受。当处于抑郁的情绪状态时，即使面对优秀作品，也有可能因心烦意乱而难以进入其中的艺术境界，难以真正体味到其中的奥妙。实际上，面对一部作品时，读者只有摆脱纷繁俗务的干扰，才能凝神贯注，用情专一，才能真切地看清作品中描写的对象，从而进入一种设身处地、心醉神迷的想象之境。否则，便难以充分体味作品的内涵和旨趣。接受心境之于阅读效果的影响还表现在，即使面对同一作品，由于情绪状态不同，也会导致不同的阅读境界。\n\n（二）阅读效果影响接受心境\n\n在实际阅读过程中，由于作品本身的情感作用，读者的接受心境也会随阅读过程的展开而得以改变。一位心情抑郁者，面对悲剧形态的作品，有可能得到情感的宣泄和精神的宽慰；或通过阅读某些昂扬奋进之作，而得到精神的振奋和鼓舞。相反，一位心情欣悦者，在读那些哀怨伤怀之作时，也会为其感染，暂时陷入抑郁的心理境界。一位心境虚静者，在文学阅读活动中，也会在作品的导引下掀起各种各样的情感波澜。\n\n读者的接受心境与作品之间的关系是复杂的，二者是相互发生作用的。只有明确了这一点，才能正确地分析接受心境之于文学阅读的影响。", "keywords": "定义 影响阅读的情绪状态 分类 欣悦 抑郁 虚静 关系 相互发生作用", "note": "接受心境的形成，取决于多方面因素：社会生活状况、个人境遇、个人的生理状况如健康、生病或疲劳、民族文化传统等会影响接受心境。", "framework": ""}, {"id": "274", "stars": 3, "title": "隐含的读者是怎样形成的", "body": "所谓“隐含的读者”是相对于现实的读者而言的，是指作家本人设定的能够把文本加以具体化的预想读者。也就是说，是作者预想出来的他的作品问世之后，可能出现的或者应该出现的读者。这种预想有时是自觉的，有时可能是不自觉的。其形成主要有以下三个方面的因素：\n\n·一、作家的创作动机会决定文本中隐含读者的存在如白居易就是秉着诗可以怨的思想，提出了自己的文论观。在其著作《与元九书》中写道：“仆志在兼济，行在独善，奉而始终之则为道，言为发明之则为诗。”白居易重视诗歌的社会批判功能，不主张歌功颂德，提倡暴露时弊，反映民间疾苦，呼吁统治者体察民情：“惟歌生民病，愿得天子知”。显然在这里白居易在特定的创作动机的指导下的隐含读者主要是能够读懂自己的诗歌并且能从中体察民情的统治者。\n\n二、作家赋予文本的思想内涵会决定隐含的读者的存在\n\n中国当代作家刘绍棠曾力倡“乡土文学”，他的小说大多取材于京东平原十八里运河滩上的农民生活，这便决定了他文本中隐含的读者主要是农村广大劳动群众。爱尔兰现代派小说家詹姆斯·乔伊斯，在作品中广泛运用了“意识流”手法和梦幻笔调，语言也往往晦涩难懂。在这样的文本中，隐含的读者主体便不可能是普通群众，而是学者型读者。\n\n三、作家的选材及文本特征决定隐含的读者的存在\n\n法国作家罗曼·罗兰认为他的《约翰·克利斯朵夫》表现的是“快要消灭的一代的我毫无隐蔽地暴露了它的缺陷和德性，它的沉重的悲哀，它的混混沌沌的骄傲，它的英勇的努力，和为了重新缔造一个世界、一种道德、一种美学、一种信仰、一种新的人类而感到的沮丧。-这便是我们过去的历史”。正是与文本的思想内涵相关，罗兰曾宣称：“我的《约翰·克利斯朵夫》并不是写给文人们看的.......但愿它直接接触到那些生活在文学之外的孤寂的灵魂和真诚的心。”", "keywords": "具体化 预想读者 作家的创作动机 作家赋予文本的思想内涵 作家的选材及文本特征", "note": "伊瑟尔指出：隐含读者不是实际读者，而是作者在创作过程中预期设计和希望的读者，即隐含的接受者。它存在于作品之中，是艺术家凭借经验或者爱好，进行构想和预先设定的某种品格。并且，这一隐含读者业已介入创作活动，被预先设计在文艺作品中，成为隐含在作品结构中的重要成分。显然，这个“隐含读者”排除了许多干扰因素，更符合作者的“理想”，甚至可以说，是第二个作者，即作者自言自语时的聆听对象。隐含的读者这一概念虽然基本不会以论述题的形式考查，但经常在名词解释中出现，对此我们要注意一下。", "framework": ""}, {"id": "275", "stars": 1, "title": "谈谈你对文学接受过程中再创造的认识", "body": "接受美学认为，文学作品完成之后，在没有和读者发生关系之前，还不能算是真正的作品，而只能被称为“第一文本”。经由读者阅读之后，文学作品才能摆脱孤立的“自在”存在状态，成为“自为”的存在，即作为审美对象的“第二文本”而存在。由此可见，“第二文本”是在“第一文本”的基础上，经由读者再创造的结果。关于这一点，中外文论中都有许多论述：\n\n英伽登把再现客体没有被文本特别确定的方面或成分称为“不定点”，并认为阅读的过程就是读者凭借自己的经验去“填补不定点”的过程。在此基础上，德国接受美学理论家伊瑟尔进而指出，文学文本只是一个不确定性的“召唤结构”，那里面包含着某些“空白”，只有读者才能填充这些“空白”。与之相近，德国阐释学理论家伽达默尔也早已指出，艺术存在于读者与文本的“对话”之中。文本是一种吁请、呼唤，它渴求被理解；而读者则积极地应答，理解文本提出的问题，这就构成了“对话”，中国古代文论中强调的“兴味”，实际也已包含着与英伽登的“填补不定点”、伊瑟尔的“召唤结构”、伽达默尔的“对话”相近的见解。\n\n不论英伽登的“填补不定点”说、伊瑟尔的“召唤结构”说，还是伽达默尔的“对话”说，以及中国古代的“兴味”观，所揭示的都是文学作品阅读接受过程中的再创造特征，所指明的正是文学作品构成审美价值的固有方式和特征。从文学作品本身而言，造成文学接受过程中再创造的原因主要表现在以下方面：\n\n一、与其他艺术门类相比，读者看到的文学作品只是抽象性文字符号的系列组合，而不是可以直接构成审美对象的物质形态的形体、色彩、线条之类。文学文本中的文字符号，只有经由读者的理解、想象、体验，才能还原为可以构成审美对象的形象，而这种“还原”过程必会伴随读者的再创造成分。\n\n二、与其他科学著作相比，文学作品主要使用的是描述性语言，有着明显的模糊性和不确定性，不可能像科学著作那样准确、严密和清晰。因此，文学作品的接受，只有伴随着读者在文字符号基础上展开的想象才能进行。“满园春色关不住，一枝红杏出墙来。”这句诗看起来虽是形象可感的，但实际上却隐含着文字符号难以尽述的无数“空白”：园中究竟是怎样的春色？枝头盛开着多少杏花？花儿开到怎样的程度？墙用什么建成？有着怎样的高度？诗句中包含着作者什么样的思想感情？有着怎样的审美意义？所有这些，都必须经由读者自己去“填空”，去“对话”，去“兴味”", "keywords": "英伽登 填补不定点 伊瑟尔 召唤结构 伽达默尔 对话 中国古代文论 兴味 抽象性文字符号系列组合 描述性语言", "note": "这部分内容基本不会在考查中以论述题的形式出现，但需要注意的是，像是召唤结构、兴味等这些关键概念会以名词解释的形式进行考查，对于这些概念所指向的内容，我们要有所掌握。", "framework": ""}, {"id": "276", "stars": 2, "title": "文学接受活动中的异变表现在哪些方面", "body": "一部文学作品完成之后，作家的精神创造和情感体验便凝定于某一文本。读者阅读文学作品的过程，本应是一个在特定语词序列的导引下，还原作家心目中的形象、情感体验和思想见解的过程。但实际上，由于“填空”“对话”“兴味”的介入，阅读过程中的彻底还原又是不可能的。经由读者阅读产生的“第二文本”中，虽然包含着被“还原”的客体内容，但同时又充满着读者个人的再创造，因此，与“第一文本”相比，“第二文本”必然是千差万别的异变产物。文学接受过程中的异变，包括以下三个方面。\n\n一、作品形象的异变\n\n在文学阅读活动中，当读者根据特定文本“还原”人物或其他有关形象时，总要把自己熟悉的人物或事物，附着到作品中的形象上；总要根据自己的思想观点和兴趣爱好，对文本潜含的形象进行个人情感色彩的加工。鲁迅曾说看《红楼梦》而在脑海中推测黛玉的形象会受到梅艳芳剧照和《红楼梦图咏》的影响，正是文学阅读过程中形象异变的特征。\n\n二、情感的异变\n\n在某一特定文本中，作家融进的情感虽是确定的，但在具有不同心理状态、人生经历与文化教养的读者那儿，却会唤起不同程度或不同性质的情感体验。对于一位生活充实畅顺、富于豪情壮志和乐观主义精神的读者来说，即使阅读李清照“寻寻觅觅，冷冷清清，凄凄惨惨戚戚”之类的辞章时，恐也不一定会像作者那样沉入一种苦闷至极、忧郁难遣的情感境界。即使同一个读者面对同一部作品，在不同的时空条件下，也会产生不同的情感体验。一位不谙世事的少年，在初读《红楼梦》时，对贾宝玉、林黛玉等人一起游戏玩乐的情景会更感兴趣；待至青春时代，尤其在经历了男女情场的体验之后，贾宝玉、林黛玉及薛宝钗之间的爱情纠葛会更易引起激动；及至老年，在饱经了人生的失意与忧患之后，对其家世兴衰、世态炎凉、人生莫测等描写会更易引起共鸣。也许正是缘此，英伽登曾经这样断言：每一次新的阅读都会产生一部全新的作品。\n\n三、思想观念的异变\n\n作家在创作过程中，总要赋予作品一定的思想内涵。然而读者在阅读过程中，对作品内涵的把握却并非一定与作者的本义相合。美国作家麦尔维尔的长篇小说《白鲸》，表现的是人与自然的对立以及人走向自我毁灭的悲剧命运。但国外有的批评家则从弗洛伊德的精神分析理论出发，认为小说主要反映了“本我”“自我”与“超我”三者之间激烈的矛盾斗争，以及“本我”无节制的冲动所造成的可怕后果。", "keywords": "作品形象 情感 思想观念", "note": "所谓异变，通俗一点来理解，就是作家想要表现或表达的内容与读者所理解到的内容之间的偏差，是“第二文本”与“第一文本”之间的差异。这种差异，主要表现在作品形象、情感和思想观念三个方面。异变这一部分整体在考查中出现 频率不高，我们主要还是以了解为主。", "framework": ""}, {"id": "277", "stars": 2, "title": "文学接受活动中为什么会产生异变", "body": "文学接受过程中的异变，除了由于文学语言本身不确定性而导致的“空白”之外，便主要是由读者不同的个性化的期待视野所致。这突出表现在以下几个方面：\n\n一、某些政治观念会导致异变\n\n我国《诗经》中的《关雎》，本不过是一首表现男女之恋的情歌，但在从维护封建道德出发的经学家那儿，却被认定是对“后妃之德”的赞美。唐代诗人白居易《赋得古原草送别》中的“野火烧不尽，春风吹又生”，本来主要是用自然景物来指称人事变化，表达送别友人时的祝愿之情。但在后世许多读者那儿，则常常从某种期待视野出发，从中读出了新生力量不可战胜、希望终将战胜失望、光明必将战胜黑暗之类的意蕴。\n\n二、某些预定文化观念会导致异变\n\n关于麦尔维尔的《白鲸》，有的批评家之所以会从中看出“本我”“自我”与“超我”三者之间的激烈矛盾斗争，便正因批评家是从弗洛伊德的精神分析学说出发进行阅读的结果。\n\n三、文化视野会导致异变\n\n不了解春秋战国时代楚国迫近危亡的历史背景，不了解屈原因关心祖国命运而遭谗谄的读者，在接触《离骚》时，可能会在神话的天地里展开想象，而很难由香草幽花联想到诗人高洁的人格，由美人联想到楚国的君主，由众女联想到奸邪小人。\n\n四、个人经验会导致异变\n\n宋代词人辛弃疾《青玉案·元夕》原是写在一个火树银花的元宵之夜，一位青年男子追寻一个幽独的美人的情景，清代学者王国维则由此而联想到了治学或艺术创作的经验，将其视为“古今之成大事业、大学问者”必须经历的三种境界之一。这种异变，还突出表现在人们对某些作品的复读过程中。有的读者，往往对童年时代最早接触的某一文学作品毕生保持着兴趣，每次复读，总会感到一种超出其他优秀作品的欣悦，即使最早接触的是一部平庸之作。这是因为，在复读过程中，除了文本唤起的想象之外，某些关于童年生活的附带联想，也悄然融入了阅读想象之中。\n\n五、文学欣赏能力会导致异变\n\n如杜甫有一首诗《古柏行》，写诸葛亮庙里的古柏，本来是以文学常用的夸张手法极写古柏之高大，宋人沈括却在《梦溪笔谈》中这样责怪道：四十围是径七尺，高二千尺，“无乃太细长乎”。沈括虽是著名学者，但他的言论，过于拘泥于生活真实而忘掉了艺术真实，违背了艺术欣赏的规律与特点，从而导致了对作品的不正确的评价。", "keywords": "政治观念 预定文化观念 文化视野 个人经验 文学欣赏能力", "note": "文学接受活动之中会产生异变，与读者期待视野有很大的联系，而读者期待视野的形成，则受到了政治观念、文化观念等多方面的影响，不同的人生经历、生活体验，不同的知识素养等都会让读者对作品的理解发生偏差，进而产生异变，对此我们要有所了解。", "framework": ""}, {"id": "278", "stars": 2, "title": "谈谈你对文学期待过程之中误解的认识", "body": "一、误解的定义\n\n文学接受的过程也是读者对某一作品阅读理解的过程。其中，既包括对作品某一人物形象、艺术技巧、语言结构的认识，也包括对作品整体价值的把握与探寻。在这种认识、把握与探寻过程中，由于期待视野的存在，读者之于作品，必然会有一种先入为主的成分，此即阐释学理论所指出的“前理解”。\n\n“前理解”与作者的创作动机、作品的意蕴以及作品的艺术价值之间彼此一致，可称之为“正解”。“前理解”与作者的创作动机、作品的意蕴以及作品的艺术价值之间相悖，可称之为“误解”。\n\n二、误解的分类\n\n在具体阅读现象中，误解又可分为如下“正误”与“反误”两种情况。\n\n（一）正误\n\n正误，是指读者的理解虽与作者的创作本意有所抵牾，但作品本身却客观上显示了读者理解的内涵，从而使得这种“误解”看上去又切合作品实际令人信服。比如从《红楼梦》中，读者的确可以感到揭示了封建社会走向崩溃没落的趋势，但在曹雪芹的创作意图中却未必有这种认识。另如赵树理在《小二黑结婚》中，对于那位徐娘半老犹风流的三仙姑，本是持讥讽否定态度的，但在一些当代读者看来，则会认为这个人物身上体现了值得肯定的反封建的个性解放精神。这虽与作者初衷相悖，但从现代进步的文化视角来看，这种“误解”又是有道理的，由此可见，文学接受过程中的这种“误解”是正常的。在文学阅读活动中，这种“正误”现象是非常普遍的，对于文学作品价值的实现也是有重要意义的。古今中外，许多文学作品之于人类社会的意义，便正是通过这样一种“误解”而实现的。\n\n（二）反误\n\n反误，是指读者自觉不自觉地对文学作品进行的穿凿附会的认知与评价，包括对作品非艺术视角的歪曲等。唐人韦应物“独怜幽草涧边生，上有黄鹂深树鸣”的诗句，本意是抒发对优美自然风光的赞叹之情，元人赵章泉却不顾全诗的整体结构，将其说成是“君子在下小人在上之象”，诸如此类穿凿附会的误解，显然是脱离作品实际的。这类“反误”不仅有害于文学阅读，在特定背景条件下，甚至会酿成人间惨剧。\n\n反误的另一种情况是对文学作品的非艺术视角的曲解。明代学者杨慎曾指责杜牧的《江南春》即属此类情况。与不失为一种值得肯定的有效阅读方式的“正误”相比，“反误”显然只能导致对文学艺术的损伤乃至粗暴践踏。", "keywords": "阅读理解的过程 前理解 正解 误解 正误 反误", "note": "从前理解到正误反误是一个逐层递进的过程，先是有“前理解”，这之中又有正解和误解，而误解之中又有正误和反误。其中，正误虽然属于误解的范畴，但对于文学作品价值的实现有其积极意义，而反误则只能导致对文学艺术的损伤，这几个概念的属性我们需要明确。", "framework": ""}, {"id": "279", "stars": 3, "title": "试分析期待遇挫与艺术魅力的关系", "body": "在文学阅读过程中，读者的期待视野与文本之间，常常呈现出顺向相应与逆向受挫两种情况。\n\n当一部作品中的人物性格、情节发展、意境指向等，与读者期待视野中的预先测定完全一致时，即是顺向相应。表现在小说阅读中，那就是，当人物一出场，就会判定其性格趋向；当情节一开端，就能猜到结局。表现在诗歌阅读中，那就是，有许多作品，往往只看见题目，就可以大致不差地判定诗中的意境、立意之类。\n\n其次便是逆向遇挫。所谓逆向遇挫，指的是阅读过程中期待指向的受挫。以小说而论，凡古今中外的优秀之作，无论是人物性格的发展，还是情节的变化、主题的呈现，常常出人意料地造成期待遇挫。有时候，由于文本的内涵完全超出了读者的期待视野，令人难以介入其间，这种情况，我们可以称之为期待指向的“完全遇挫”。\n\n如果一部作品只有顺向相应，那么在阅读过程中，由于文本所提供的想象空间没有超出读者的期待视野，因此，这样的作品，必会被视为平庸陈旧、缺乏艺术魅力。在这样的阅读过程中，读者固然会得到一种先见之明的满足，欣赏过程也十分轻松，却会因期待指向的畅通无阻而感到兴味索然会因文本经验的平常而窃笑作者的低能。而如果一部作品完全超出读者的期待视野的，比如某些过于晦涩、令人难以捉摸的“先锋诗”，某些过于随意、无迹可循的“意识流”小说等，有的尽管有着很高的创新价值，但因阻绝了读者的介入，其价值往往又难以实现。\n\n真正赢得大多数读者喜爱的作品，往往既有顺向相应又有逆向受挫。一方面，由于作品中总会贯穿着某些共通的生活逻辑，文本不时唤起读者期待视野中的预定积累，读者会不时体验到顺向相应的轻松，同时又在不断设法打破读者的期待惯性，以出其不意的人物、情节或意境牵动读者的想象，从而诱使读者进入一个超越于自己期待视野的新奇的艺术空间之中。在这样的阅读过程中，读者可能会因期待指向的暂时受遏而不适，但很快又会为豁然开朗的艺术境界而振奋，会因扩充和丰富了期待视野而欣悦。“山重水复疑无路，柳暗花明又一村”，读者就是在这样一种遇挫与开释交替出现的精神活动中，体验到文学作品的艺术魅力。", "keywords": "顺向相应与逆向受挫 完全遇挫 既有顺向相应又有逆向受挫 遇挫与开释交替出现", "note": "期待遇挫与艺术魅力总体上来看是一种相辅相成的关系。一般而言，一部较为优秀的作品往往伴随着期待遇挫。对于期待遇挫，既有顺向顺应又有逆向遇挫，而如果一部作品想要真正让读者感受到艺术魅力，就要将顺向相应与逆向受挫结合起来。这一部分内容在考查中经常出现，大家一定要注意。", "framework": ""}, {"id": "280", "stars": 3, "title": "试分析文学接受中的共鸣产生的原因", "body": "共鸣是文学接受进入高潮阶段的重要标志，指的是在阅读文学作品时，读者为作品中的思想感情、理想愿望及人物的命运遭际所打动，从而形成的一种强烈的心灵感应状态。\n\n一、共鸣产生的原因\n\n文学接受活动中“共鸣”现象的产生，主要有以下原因：\n\n（一）作品本身具有深刻丰富的思想感情和强烈的艺术感染力。\n\n（二）读者的期待视野中必须含有与作品相同或相似的思想见解与情感体验。具体说来，就接受主体而言，共鸣的产生，主要有以下三方面原因。\n\n（1）由于读者期待视野中的思想观念与作者或作品中人物的思想观念相通而产生共鸣。如唐代诗人杜甫的“朱门酒肉臭，路有冻死骨”曾引起了历代无数读者的共鸣，就是因为诗句反映了人民大众的心声，深刻地揭露了封建剥削制度的腐朽和黑暗。\n\n（2）由于读者期待视野中的情感经验与作者或作品中人物情感经验的相同或相似而产生共鸣。《红楼梦》第二十三回《牡丹亭艳曲警芳心》中写道：当黛玉听到《牡丹亭》中的戏文：“原来姹紫嫣红开遍，似这般，都付与断井颓垣”，“良辰美景奈何天，赏心乐事谁家院”时，心痛神痴，潸然泪下，产生了深深的共鸣。这正是因为黛玉与杜丽娘之间有着相同的情感体验之故。\n\n（3）读者期待视野中的意志愿望与作者或作品中人物意志愿望相近，也会使读者产生共鸣。比如现代的年轻读者虽然没有经历过战争，但读着田间的诗：“假使我们不去打仗，／敌人用刺刀／杀死了我们，／还要用手指着我们骨头说：／看，这是奴隶！＇”仍会热血沸腾，灵魂震动。因为读者和作者，尽管处于不同的时代，有着不同的经历，但在追求民族独立，保家卫国的愿望方面，是完全一致的。\n\n（三）共鸣的产生与一定的社会环境是密切相关的。读者期待视野形成的特定历史处境如果与一定作品所反映的历史状况有某种相通相类之处，也会引起强烈的共鸣。例如抗战时期，我国人民面临生死存亡的处境，在读者的期待视野中，自然包含了对民族精神、民族气节、民族英雄等方面的心理渴求，于是，像“岳飞戏”“文天祥戏”等，就特别易于引起人们的强烈共鸣。\n\n二、共鸣的作用\n\n（一）文学接受活动中的共鸣，是文学作品自身价值实现的重要途径，也就是说，文学作品只有通过引起众多读者的共鸣，才能真正发挥审美、认识、教育等作用。\n\n（二）文学接受活动中的共鸣，也是判定一部作品价值高低的重要尺度。一般说来，一部作品引起读者共鸣的程度越强烈，范围越广大，其价值往往也就越高。但因共鸣的产生取决于读者期待视野与作品内涵的关系，这便又决定了共鸣作为作品价值标志的复杂性。有些“阳春白雪”之作，由于受制于读者的期待视野，有可能导致“曲高和寡”。也有一些作品，思想艺术层次不高，但因在某些方面契合了读者的期待视野，也可能在一定的读者范围内引起共鸣。", "keywords": "原因 丰富的思想感情 强烈的艺术感染力 相同或相似的思想见解与情感体验 一定的社会环境 作用 自身价值实现的重要途径 价值高低的重要尺度", "note": "文学接受活动中的共鸣，是文学接受进入高潮的重要标志，与文学价值的实现和评价息息相关。在文学接受的高潮这四个环节中，共鸣是考查频率相对较高的一个概念，并且多数情况下是以论述题的形式进行考查。其中，共鸣产生的原因这一部分可能会单独考查，大家要注意一下。", "framework": ""}, {"id": "281", "stars": 3, "title": "谈谈你对文学接受中净化的认识", "body": "一、净化的定义\n\n净化是文学作品审美价值得以实现的另一重要标志，是文学接受进入高潮的又一表现。“净化”一词，最早见于亚里士多德的《政治学》。在《诗学》中，亚里士多德还进一步指出：悲剧“激起哀怜和恐惧，从而导致这些情绪的净化”。我们认为，文学的净化就是指读者在阅读文学作品时，继共鸣之后而不由自主地达到的调节精神、排遣情绪、去除杂念和提升人格的状态。概括地说，所谓净化，就是读者通过阅读作品而达到的一种“杂念去除，趋向崇高”的自我教育效果。\n\n二、净化的作用\n\n文学接受过程中的净化作用主要表现在以下两个方面。\n\n（一）读者可以进入某种虚幻的艺术境界，而暂时忘却世俗的困扰和人生的烦恼，以维持心灵的平衡。\n\n恩格斯在论述德国“民间故事书”的作用时曾这样指出：“它的使命是把工匠的作坊和可怜的徒工的简陋阁楼变幻成诗的世界和金碧辉煌的宫殿。”中国春秋时代的思想家管子认为：“止怒莫若诗，去忧莫若乐。”说的也是文学接受过程中的这种净化作用。这些见解表明，在文学接受过程中，文学具有使读者得到情感净化、维持心理平衡的效果。\n\n（二）由于作品中某种情感力量的震撼，可使读者的某种情绪得以宣泄，使畸变的心态得以矫正，使扭曲的人格变得纯\n\n正，法国启蒙运动时期的思想家狄德罗在谈论戏剧艺术时指出：“只有在戏院的池座里，好人和坏人的眼泪才融会在一起。在这里，坏人会对自己可能犯过的恶行感到不安，会对自己曾给别人造成的痛苦产生同情，会对一个正是具有他那种品性的人表示气愤。当我们有所感的时候，不管我们愿意不愿意，这个感触总是会铭刻在我们心头的；那个坏人走出包厢，已经比较不那么倾向于作恶了，这比被一个严厉而生硬的说教者痛斥一顿要有效得多。”显然，在这一论述中，揭示的亦是文学接受活动所具有的净化作用。\n\n从内在关联来看，文学接受活动中的净化，实质上是共鸣的进一步发展，是读者为作品中的情感打动之后，所实现的一种人格提升。这种人格提升，说到底，正是文学作品发挥审美教育作用的独特方式。即既不是以理服人的说教，也不是直截了当的劝谕，而是凭依情感的沟通或震撼，激发人的心灵中潜在的向往真善美和追求自由的天性，以令其挣脱物欲或私利的束缚，不由自主地进入一种超凡脱俗、高尚纯洁之境。这种经由净化而实现人格提升的方式也就是人们寻常所说的审美教育的特征。", "keywords": "重要标志 艺术境界 某种情绪得以宣泄 进一步发展", "note": "文学接受中的净化，是共鸣的进一步发展，是文学接受进入高潮的重要标志和表现。文学净化这一概念在考查中出现的频率相当之高，尤其是文学净化的作用这一部分，经常以论述题的形式进行考查，尤其是非常容易与亚里士多德的“净化说”结合起来考查，所以大家要重点关注一下。", "framework": ""}, {"id": "282", "stars": 2, "title": "谈谈你对文学接受中领悟的理解", "body": "领悟，是指读者在阅读文学作品时，继共鸣和净化之后而进入的一个更高阶段，具体包括潜思默想、体悟人生真谛、提升精神境界等状况与过程。与共鸣和净化相比，领悟有如下两大特征。\n\n一、基于理解的体味\n\n共鸣是建立在读者与作者或作品中人物的思想情感沟通的基础上的，净化则主要是作品中的强烈情感震撼并感染了读者心灵的结果，而领悟则必须以读者对作品内涵的主动思索和深刻理解为前提。读着朱自清的《荷塘月色》，我们首先会为作者向往“自由独处”，赞美“荷塘月色”的情感所深深打动，这便是共鸣。同时会陶醉于作者所描绘的明澈幽静的荷塘月色之中，得到一种超凡脱俗、心灵解放的快慰，这是净化。继而，联系特定的时代背景，经过思索，读者会进一步体味到：在“出污泥而不染的荷花”和“高寒孤洁的明月”中，寄寓着作者不甘与黑暗现实同流合污的思想感情，表明了一位正直的中国知识分子的人生态度。这种基于思索理解的体味，便是领悟。\n\n二、基于体味获取人生教益\n\n共鸣常常只是建立在读者对作者或作品中人物思想情感一般认同的基础上，净化主要表现为读者精神的舒畅和心灵的矫正，往往不能直接产生新的人生指向，不能有效地丰富和扩充读者的期待视野。领悟则不同了，由于领悟以思索和理解为前提，其结果，必会有效地丰富和扩充读者的期待视野，使读者主动生发出一种积极的人生向往。读罢刘禹锡的诗句“晴空一鹤排云上，便引诗情到碧霄”，会使我们体味到诗人虽处逆境却不悲观消沉，依然乐观旷达的精神，从而增强我们搏击人生的勇气和信心。读了苏东坡的《题西林壁》会使我们体味到：要从不同的角度全面地观察事物，研究问题。读罢歌德的《浮士德》，会使我们体味到：只有不懈地开拓生活，才能不断地享受生活，从而激起我们自强不息的奋斗精神。这种体味，这种伴随着体味而得到的人生教益，便是文学接受活动中的领悟。\n\n由此可见，领悟是文学接受活动的最高境界。所以，从文学史上看，那些饱含诗情又深蕴哲理，能够诱人进入领悟之境的作品，往往是最具艺术魅力的优秀之作。那些在诗意盎然的作品中充分凝铸进哲理意蕴的作家，也往往会被人们视为伟大的作家。", "keywords": "更高阶段 理解的体味 人生教益 最高境界", "note": "文学接受中的领悟，是文学接受活动中的最高境界，是共鸣、净化之后的更高阶段。但是我们也应该注意到，这三者并不是截然分开的，而是互相纠缠，给读者以复杂的感受。", "framework": ""}, {"id": "283", "stars": 2, "title": "谈谈你对余味的认识", "body": "一、余味的内涵\n\n在文学接受活动中，当我们读完一部小说，或一首诗歌之后，其作品中的人物、场景还会萦绕脑际，其思想情感仍会波动于心间，其情趣、意境会引起我们再三回想，甚至会在相当长的时间内，或显或隐地影响着我们的道德情操、言谈举止和审美追求，这种情况，体现的即是文学接受过程中的余味现象。\n\n实际上，所谓余味，就是文学接受进入高潮阶段之后的一种心理延续和留存状况，是指文学作品在造成读者的共鸣、净化和领悟之后，其相关情感意绪仍在继续对读者产生影响的特征。\n\n二、余味概念的发展\n\n把“味”“余味”等与审美接受相提并论，在古人那里已多有述及。如春秋时期的孔子把“肉味”同由于欣赏音乐而得的快乐感受联系到一起并以自己的切身体验证明：与给人生理快感的“肉味”相比，艺术作品给人的审美体味，要更为令人心醉神迷，其“余味”，，也更为悠长久远。在我国文论史上，大量引入“味”之概念，始于魏晋而兴于齐梁时期。比如，刘勰在《文心雕龙》中就大量使用“味”来说明文学的美。而在刘勰之后，钟嵘则进一步突出了“味”在文学中的地位。他认为“使味之者无极，闻之者动心”是“诗之至”。其后，“味”便成为中国古代文论与美学中的一个重要概念。\n\n三、余味的作用\n\n阅读实践表明，余味不仅体现为读者对作品的含英咀华及一时思想情感的变化，还体现在作品对读者审美趣味、精神气质以及人格规范的潜移默化的久远影响。鲁迅正因其特别倾心于19世纪末俄国作家安特莱夫的作品，所以在《药》的结尾出现了“安特莱夫式的阴冷”。此外，在现实生活中我们还会看到，有不少人只因读了一部有益的作品，就挣脱了懒散失意的情绪，振作起来，奋发向上，改变了自己的人生格局。或因读了某些消极有害之作而变得消极颓废，甚至误入人生歧途。这显然也与文学作品的余味影响有关。\n\n由此可见，余味除了形成审美效应之外，还会产生直接的社会效应。余味时间的长短以及余味效果的性质，也是判定一部作品价值高低的重要尺度。", "keywords": "心理延续和留存状况一时思想情感的变化 潜移默化的久远影响 审美效应 社会效应", "note": "“余味”这个概念由来已久，它是文学接受活动进入高潮之后的一种心理延续和留存状况，就具体表现来说，它对读者既有一时的影响，也有长久的潜在影响，同时具备审美效应和社会效应，我们要好好体会。", "framework": ""}, {"id": "284", "stars": 5, "title": "如何理解文学批评", "body": "文学批评是对以文学作品为中心兼及一切文学活动和文学现象的理性分析、评价和判断。\n\n一、以文学作品为中心进行评价，意味着文学批评的主要对象是文学作品，与文学创造密切相关。这主要体现在以下两个方面：\n\n（一）文学创造的现状和走向以及作品的存在价值和社会影响，是批评的基本着眼点。因此，不同的文学批评，都会按照各自的理论主张和价值取向，对现实的文学创造和具体的文学作品进行褒贬是非、抑扬臧否的分析和评价，企图影响文学创造的走向和文学作品的效能，使之按照自己的主张去发展，其中的批评主潮会产生巨大的影响力，甚至影响某种文学的兴衰。这样，文学批评制约着文学创造，也筛选着文学作品。\n\n（二）文学创造是一种个体性很强的精神活动，文学作品是一种非常具体的个别存在，因此文学批评的对象也常常是具体的作品和作家的个体性创造。但这并不意味着批评只着眼于具体和个别，而是要在对具体与个别的分析评价中，从其利弊得失中总结经验，并力求把个别的经验上升为具有某种普遍性的理论，推动文学创造总体上的繁荣、发展和进步。在不断的文学批评实践中，其部分内容有可能成为科学的理论成果而构成文学批评的基本原理，长期而普遍地影响文学的创造活动。文学批评既离不开对宏观的文学创造现象进行评价，也离不开对微观的具体作品进行解析。有分量、高质量的文学批评，既需要开阔的文学视野，又需要精细的文学眼光。否则，就不能说它与文学创造文学作品密切相关，而只能是自觉或不自觉的疏离。\n\n二、以文学作品为中心进行评价，又意味着文学批评是在接受文学作品的基础上进行的活动，是接受活动的一种形式或一部分，因而文学批评与文学接受有着内在的深刻关系。这种关系也主要体现在两个方面：一方面是部分与整体的关系，一方面是层次间的分工协调关系。\n\n（一）从部分与整体的关系而言，文学接受是读者面对文学文本进行阅读并加以填补、创造或破解的种种活动的统称。从文学接受的性质状况来看，总体上可以分为鉴赏性接受、诠释性接受和批评性接受。文学批评不过是读者接受活动的一种形式或接受活动整体的一部分而已。这种关系表明：文学批评要受文学接受的一般规律的制约，要体现文学接受的一般性质。但文学批评是一种相对独立的接受形式，有别于其他接受形式。从根本上说，它在接受活动中更看重其对读者和社会以及文学自身发展所显示的价值、意义，更重视社会性接受。\n\n（二）从层次间的分工协调而言，文学鉴赏与文学批评构成文学接受的不同层次。两者的基本关系是：鉴赏是批评的基\n\n础，批评则不仅是鉴赏的提高，也是对鉴赏的指导。文学鉴赏之所以通常也称为文学接受，是因为实现作品的价值或社会功能，最终都要通过个体性鉴赏来完成，因此，狭义而言，文学批评与文学接受的关系，也就是文学批评与文学鉴赏的关系。\n\n三、文学批评兼及文学活动的各种现象，其中也包括对文学批评自身的评价和判断。这意味着文学批评既是对文学创造的超越，也是对文学接受的超越，它本身就是一门学科或一种科学。作为一门学科，它有自己的理论原则和历史发展过程，与文学理论、文学发展史、文学理论发展史、文学批评史一起共同构成狭义文艺学。作为一门科学，它面对一切文学现象，力图总结和概括出其本质和规律。与文学理论、文学发展史等邻近的学科或科学相比，文学批评具有更鲜明的倾向性和现实针对性，或者说，它的意识形态性更强。因此可以把文学批评看做是文艺科学中应用性、实践性最强的一个学科，也可以视为一种特殊的意识形态评价方式。", "keywords": "以文学作品为中心 理性分析、评价和判断 现状走向 价值影响 具体个别 普遍性 接受活动的一部分 受制约相对独立 不同层次 鉴赏是基础 批评是提高和指导 文学批评自身", "note": "文学批评是文学活动的一个重要组成部分。狭义的文学批评通常考察一部作品或者一个作家的若干作品，广义的文学批评可以与“文学研究”一词互换-涉及文学话语的所有因素。按照现今的研究范式，这些因素往往划分为三个部类：作家、作品、读者。成熟的文学批评通常包含对作品的阐释和评判。作为阐释和评判赖以展开的理论依据，不同的文学批评学派分别拥有各自独特的轴心概念，例如道德、现实、典型、审美、无意识、形式等。", "framework": ""}, {"id": "285", "stars": 4, "title": "怎样理解文学批评的意识形态性质", "body": "文学批评是以文学作品为中心而兼及一切文学作品和各种文学现象的理性分析、评价和判断，这已经充分表明了它作为意识形态评价的普遍社会属性。这种社会属性从根本上来说体现在两个方面：\n\n一、从对象上来看，作为主要对象的文学作品，不论是诗歌还是散文、小说、戏剧，都是精神创造的产物，都是一种意识形态话语。正是文学作品的规定性决定了文学批评必须对文学作品的意识形态作出评价，从而也决定了文学批评必然以一种意识形态评价方式而对文学及社会生活特别是社会意识形态产生深刻的影响。尽管文学作品的意识形态价值并不是唯一的价值，但不论是美学的还是历史的、文化的价值，都与意识形态价值密切相关，或者自己本身就是一种意识形态。\n\n二、从文学批评的效能来看，文学批评也表现为一种意识形态评价。这种效能的意识形态性主要体现在三个方面：\n\n（一）文学批评是一种与一定社会意识形态深刻联系的批评话语，它运用这种话语来判断文学作品的意识形态价值，从而决定相应的态度。这种话语的运用，除以一定文学理论为依据外，还总是与政治、道德、宗教、法律等意识形态密切相关。\n\n（二）文学批评通过对文学思潮、文学运动的评估，对文学批评自身的检讨，以及对其他文学现象的衡定，也表现出它作为意识形态评价的效能。对文学现象的这种评价，实质上是一种意识形态的论争，是主张什么、反对什么的交锋，具有一种尖锐的对抗性。这种尖锐的对抗性往往是社会政治斗争、思想斗争在文学批评活动中的反映。\n\n（三）文学批评作为意识形态评价的效用，还表现在它通过这种评价所确定的价值取向影响和造就文学新人，扶持有利于确立一定意识形态领导地位的创作和批评队伍，特别要使批评者成为具有一定权威的人，以尽可能发挥其在意识形态评价上的作用。\n\n总之，文学批评既是一门学问，也是一门学科，具有一定的学科性，但是它的实践性、倾向性、争论性和社会性却不容忽视。因而从实质上讲，文学批评是在一定的社会历史条件下与一定意识形态息息相关的意识形态评价方式，它通过批评话语对意识形态产生巨大影响。", "keywords": "对象 精神创造的产物 意识形态话语 效能 意识形态评价", "note": "文学批评的对象是文学和文学现象，而文学本身就拥有意识形态性质，同时，作为文学批评的主体，批评家也是社会中的人，在进行文学批评时也会受到政治斗争、思想斗争等社会性因素的影响。也正因如此，文学批评具有意识形态性质，大家可以这样去理解。", "framework": ""}, {"id": "286", "stars": 4, "title": "为什么说美学的观点和历史学的观点是马克思主义批评的总原则和方法论", "body": "之所以将美学观点和历史学观点作为马克思批评的总原则和方法论在于两个方面的原因：\n\n一、美的观点和历史的观点作为马克思批评的总原则和方法论，从根本上讲在于它们既反映了文学作为意识形态的普遍规律，又体现了文学这种特殊的意识形态，即审美意识形态的特殊规律。\n\n（一）一切文学作品都应该是审美作品，应该是如马克思所说的那样“按照美的规律造型的”结果，因而应当用美学的\n\n观点加以审视和评价，看它是否符合审美创造的规律，是否具有美的结构形态和形式韵味，能否充分地显示美的本质、特征和魅力。同时一切文学作品又都是一定历史条件下社会关系的产物，是建立在一定经济基础之上的社会意识形态，把握作品有没有较大的思想深度和历史内容，从而确定作品的历史作用和历史价值，这就必须要有历史观点。\n\n（二）对一切作品的微观分析和具体评价，只有在美学的和历史的宏观视野下才可能达到应有的尺度，发挥批评应有的效能。\n\n（三）美学的观点和历史的观点作为批评的方法论和基本原则，制约着各种具体批评中的价值取向和方法原则。\n\n二、按照马克思主义文学批评的实践，美学的观点和历史学的观点作为方法论思想和基本原则是有其丰富的、辩证的、开放的内涵。\n\n（一）就其丰富性而言，美学的观点在具体手法、文体特征、人物性格、典型环境等等方面都有提出要求。而历史的观点则要求把作品放在具体的历史条件下，看它与历史的或明或暗的关系。\n\n（二）辩证性是指美的观点和历史的观点并不是矛盾的，而是相互联系，辩证统一的。美的观点是在一定历史条件下的观点，并随着历史的变化而变化；历史的观点也不能脱离对文学作品美的审视。\n\n（三）开放性是指美的观点和历史的观点是相互促进的，二者作为宏大的批评视野，对其他的批评模式也采取兼容并包的态度。以上种种特性都说明美的观点和历史的观点，具有作为马克思批
