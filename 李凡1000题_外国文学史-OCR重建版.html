批判倾向\n\n19世纪末20世纪初，西方社会处在急剧的文化转型时期。世界的混乱、战争的恐怖、社会道德的衰败，使人们深感失望与不安，作为西方精神支柱的传统文化观念开始崩溃。尼采提出的“上帝死了”“打倒偶像”“一切价值重估”等口号，深深地影响了20世纪现代主义作家。\n\n他们不再坚守传统的理性原则，不相信人道主义的理想，也不寄希望于“理性王国”的实现，而是站在生命本体论的立场，思考世界与人类的前途，对人类文明的发展进行深刻的反思。\n\n例如，未来主义主张扫除以往的一切艺术遗产和现存文化，他们的创作中表现出一种强烈的破坏欲；表现主义着力探索现代社会中人的苦闷与焦虑，对文明发展的意义采取怀疑与否定态度。\n\n（二）现代主义文学突出地表现异化主题\n\n20世纪高度发展的西方现代文明使人处于严重的异化之中，现代主义文学对文化与文明的批判，正基于西方人力图摆脱异化走向自然的愿望，因此，异化也就成了现代主义文学的重要主题。这种异化主题，主要从自然与个人、社会与个人、个人与个人、个人与自我的关系这四方面表现出来。\n\n（1）自然与人的关系的异化主要是物质世界对人的异化，表现了物质与精神的对立\n\n在现代主义文学中，物质世界往往成了人类生存危机的制造者，大自然也是丑的与恶的，物质文明造成了人类精神的虚无感、威胁感与恐惧感。如艾略特的《荒原》就描写了物质世界使人的精神世界毁灭的可怕情景；奥尼尔的《毛猿》表现了物质文明发达的现代社会使人的价值等于甚至低于禽兽。这些都表明了人与自己的生存环境的对立，说明人被物质世界所制约而走向异化。\n\n（2）社会与人的关系的异化主要是社会对个体的人的异化，表现了整体的人与个体的人的对立\n\n人结成群体的社会后，给个体的人以安全感，但社会力量又在有形无形中制约着人，尤其是科学化的西方现代社会，人在强大的社会面前显得渺小无力，个性丧失，这是社会对人的异化。卡夫卡的小说中，社会像一个强大而又无形的魔掌，掌握着个人的命运，个人成了软弱无力、惶惶不可终日的“甲虫”。现代主义作家对社会的这种批判，具有形而上的特征，写出了人性的变形和个人对社会及意识形态的不信任与反抗。\n\n（3）人与人的关系的异化就是他人对个人的异化，表现了人与人之间的对立关系\n\n现代主义文学展示的，常常是一幅幅人与人之间充满敌意的可怕图画，如斯特林堡的《鬼魂奏鸣曲》描写了人与人之间的彼此残杀；卡夫卡的小说描写了人与人之间的无法沟通。这类描写在50年代后的现代主义文学中得到了进一步发展。\n\n（4）人与自我的关系的异化主要指人的个性的异化、自我的消失，表现出现代主义作家对自我的稳定性和可靠性的怀疑\n\n现代心理学认为，人的自我的核心是潜意识和本能，它是飘忽不定、变化莫测的。现代主义作家从这种观念出发，力图在作品中表现受他人与社会压抑下的人的自我和个性。他们笔下的人物的特点是没有激情、没有自己的思想和表达方式、趋于非个人化或社会化。如伍尔夫的小说《波浪》中6个人物从不同角度讨论着“自我是什么”的问题；美国黑人作家艾里森《隐身人》的主人公因找不到自我而成为他人看不见的“隐身人”。对自我问题的探讨，表现了现代主义作家对现代社会中人的命运与前途的思考。\n\n二、艺术特征\n\n（一）现代主义文学强调表现内心生活和心理真实，具有主观性和内倾性特征。\n\n19世纪末、20世纪初现代哲学和心理学的发展，打破了传统的思维模式，人们开始把目光从客观物理世界转向主观心理世界。\n\n如表现主义作家力图展示“本质的东西和藏在内部的灵魂”，即使写具体的人物和物景，也只是将其作为精神现象的外壳与形式，写物的目的不在物本身，而在与之对应的精神力量。意识流小说家往往把人的意识流动状态作为客观现实生活加以描写，把转述人的变化的、不可知的、难下定义的精神世界看成自己的主要任务。现代主义对主观真实和内倾性的刻意追求，拓展了文学表现的领域，改变了传统的艺术思维模式\n\n（二）现代主义文学普遍运用象征隐喻的神话模式，追求艺术的深度模式\n\n出于表现内心生活和心理真实的需要，现代主义作家不注重对社会生活的表象作直观的再现，而往往用非纪实性、时空颠倒与变形、结构错乱等手段，构建一个象征性的神话式艺术世界以揭示生活中更深刻、更广泛的意蕴。\n\n艾略特的《荒原》用古代繁殖神性能力丧失而造成的土地荒芜、庄稼枯死来建构一个象征体“荒原”，全诗大量运用人类学、神话学、圣经故事和西方古典名著故事，形成一个庞大的象征框架，意象重叠、意蕴纷呈而艰深。\n\n卡夫卡的小说往往故事背景模糊，主人公无名无姓，是某种观念、思想、意志的代表，他用象征隐喻的思维方式创造了一个个与现实世界相统一的神话世界。\n\n此外，普鲁斯特、里尔克、乔伊斯的创作也往往把读者置于意义的深渊之中，只有通过不断的阐释和发掘，才能获得审美的意义。现代主义文学借助象征隐喻的神话模式，使文学对生活的描写从表象走向本质，从表层走向深层，从现实走向超现实，从所指走向能指，形成一种文学艺术的深度模式。\n\n（三）现代主义文学提倡“以丑为美”“反向诗学”，大量描写丑的事物\n\n现代主义文学对死亡、黑夜、堕落、犯罪、畸形、变态、疯狂、瘟疫、尸体......的描绘，大大超过传统文学，表现出“以丑为美”“反向诗学”这一新的美学倾向。不过，现代主义作家的“以丑为美”不是把生活中的丑作为美来肯定，而是企图在丑的自我暴露、自我否定中肯定美，使丑升华为美；他们无情地解剖、否定现实与自我的平庸，通过与丑的厮斗来表达对美的追求，正如波德莱尔所说，“发掘恶中之美”。\n\n因此，在这种美学追求的背后，蕴含着对人生的严肃而崇高的爱。但是，也有一些现代主义作家对人性和人类前途的认识是悲观主义的，他们热衷于表现丑，而看不到人性的美与崇高，这样的“以丑为美”是不无消极成分的。\n\n（四）现代主义文学热衷于艺术技巧的革新与实验\n\n（1）意识流手法的运用\n\n①内心独白与自由联想：意识流作家强调对人物内心世界的深入挖掘，通过内心独白和自由联想来展现人物的意识流动。如乔伊斯的《尤利西斯》，作者通过大量的内心独白，展现了主人公布卢姆在柏林一天的生活经历，其思绪自由跳跃，从现实场景联想到历史、神话等各种内容，打破了传统的叙事顺序和逻辑，使读者能够直接进入人物的内心世界，感受到其复杂而微妙的情感和思想变化。\n\n②时空交错：伍尔夫的《墙上的斑点》也是意识流文学的经典之作。作品以主人公看到墙上的一个斑点为触发点，引发了她一系列的联想和回忆，时间和空间在她的意识中不断交错和转换。读者随着主人公的意识流动，在不同的时间和空间中穿梭，感受到了意识的无边界性和流动性，这种手法打破了传统文学中线性的时空观念，更加真实地呈现了人类意识的复杂状态。\n\n（2）荒诞与象征手法的创新\n\n①荒诞情节的设置：卡夫卡的《变形记》中，主人公格里高尔·萨姆沙一觉醒来变成了一只巨大的甲虫，这一荒诞的情节成为整个故事的开端。这种荒诞的设定打破了现实世界的逻辑和常规，使读者产生强烈的震惊和困惑。然而，在荒诞的表象之下，却蕴含着深刻的现实意义，通过格里高尔的变形，揭示了现代社会中人性的异化、生活的压力以及人与人之间关系的冷漠。\n\n②象征手法的深化：《等待戈多》是贝克特的代表作，剧中的戈多是一个具有多重象征意义的神秘人物，他象征着希望、救赎、未知的命运等。两个流浪汉弗拉季米尔和爱斯特拉冈一直在等待戈多的到来，但戈多始终没有出现。他们的等待是一种荒诞的行为，象征着人类在荒诞的世界中对未来的迷茫和不确定，以及对某种拯救力量的期待。这种象征手法的运用，使作品具有了深刻的哲理和寓意，引发了读者对人类生存状态的深入思考。\n\n（3）叙事视角的多元化\n\n①有限视角的运用：现代文学中常常采用有限视角来叙事，即通过故事中某个人物的视角来展开情节，使读者只能了解到该人物所知道的信息和感受到的情感。如凯瑟琳·曼斯菲尔德的一些短篇小说，常常以某个特定人物的视角来叙述故事，这种有限视角增加了故事的悬念和真实感，让读者更加贴近人物的内心世界，同时也促使读者通过自己的思考来填补故事中的空白，参与到作品的意义构建中。\n\n②多角度叙事：福克纳的《喧哗与骚动》采用了多角度叙事的手法，分别从康普生家族的四个不同人物的视角来讲述同一个故事。通过不同人物的视角，读者可以看到同一个事件的不同侧面，以及每个人物独特的内心世界和价值观。这种多角度叙事不仅丰富了故事的内容和层次，也揭示了人性的复杂性和多样性，使读者对故事的理解更加全面和深入。\n\n（4）语言风格的实验性\n\n①语言的碎片化：一些现代文学作品故意打破传统语言的规范和逻辑，采用碎片化的语言来表达思想和情感。如美国诗人E·E·卡明斯的诗歌，常常将单词拆分、重组，使用奇特的标点符号和排版方式，使语言呈现出一种破碎、不连贯的状态。这种碎片化的语言风格反映了现代社会中人们破碎的生活体验和混乱的精神状态，同时也为读者带来了全新的阅读体验和思\n\n考方式。\n\n②语言的陌生化：俄国形式主义提出的“陌生化”理论在20世纪西方现代文学中得到了广泛应用。作家们通过对日常语言进行变形、扭曲，使其变得陌生和奇特，从而引起读者对语言本身的关注。例如，詹姆斯·乔伊斯在《芬尼根的守灵夜》中创造了大量的新词汇和独特的语言表达方式，使读者在阅读过程中感受到语言的新奇和神秘，同时也通过这种陌生化的语言揭示了潜意识和梦境中的世界。\n\n20世纪西方现代文学的突破，本质上是人类对自身境遇的追问与反抗，作家们以形式革命回应世界的断裂。这些艺术手法不仅是技巧创新，更是现代性危机的症候-当上帝退场、理性崩塌、意义消散，文学成为最后的见证：在废墟中，我们仍能以词语的微光，照亮存在的深渊。\n\n也许，这正是文学不断发展的意义。","keywords":"思想特征 文化批判 异化主题 物质与精神 整体的人与个体的人 人与人之间 对自我的稳定性和可靠性的怀疑 艺术特征 主观性 内倾性 神话模式 深度模式 以丑为美 反向诗学 艺术技巧 革新与实验 意识流手法 内心独白 自由联想 时空交错 荒诞与象征 荒诞情节 象征手法 叙事视角 有限视角 多角度叙事 语言风格 碎片化 陌生化","note":"①本题的概念异常宏大，想要在有限的时间内做有效的回答实则是非常难的，这就考验了同学们平时的阅读积累，本题的前三点在相关教材上有完整梳理，其中，郑克鲁版本论述较为充分，蒋承勇版本亦有补充，本题答案结合两版教材而来，并参考了五篇学者论文，在前辈基础之上，形成第四点答案。②仅在23年就有北京大学、扬州大学、东南大学、上海大学、中山大学、广东外语外贸大学等多所院校同时考查了“现代主义文学的特征”这一考点，24年华东师范大学、同济大学、西安外国语大学也对这一考点作了细致考查，可见这是外国文学学习中的重中之重，需要大家结合具体作品重点把握。"},{"id":"256","stars":"★★★","title":"现代主义文学如何表现异化主题","body":"文化是人的外化与象征，也是人类文明发展的标志。现代主义文学倾向于文化批判，本质上是基于对人的生存状况、人的本质问题的探索。人类创造了文明，但文明在本质上与追求人性自由、追求自然的人相对立。20世纪高度发展的西方现代文明使人处于严重的异化之中，现代主义文学对文化与文明的批判，正基于西方人力图摆脱异化走向自然的愿望，因此，异化也就成了现代主义文学的重要主题。这种异化主题，主要从自然与个人、社会与个人、个人与个人、个人与自我的关系这四方面表现出来。\n\n一、自然与人的关系的异化主要是物质世界对人的异化，表现了物质与精神的对立。现代主义作家怀疑物质财富的创造对人类所起的进步作用，认为物质文明有抑制人的生命本体、扼杀人性甚至毁灭人类的危险。在现代主义文学中，物质世界往往成了人类生存危机的制造者，大自然也是丑的与恶的，物质文明造成了人类精神的虚无感、威胁感与恐惧感。\n\n二、社会与人的关系的异化主要是社会对个体的人的异化，表现了整体的人与个体的人的对立。人结成群体的社会后，给个体的人以安全感，但社会力量又在有形无形中制约着人，尤其是科学化的西方现代社会，人在强大的社会面前显得渺小无力，个性丧失，这是社会对人的异化。\n\n三、人与人的关系的异化就是他人对个人的异化，表现了人与人之间的对立关系。非理性主义的本体论哲学认为，人是受欲望驱使的，生命的本能是利己的，这就从人性的本质上指出了人与人之间互相残害的丑恶现象。现代主义作家从这种主观唯心主义观念出发，认识并表现资本主义社会中人丧失固有的行为准则后完全根据与他人的利害关系来调整自己行为的现象。现代主义文学展示的，常常是一幅幅人与人之间充满敌意的可怕图画。\n\n四、人与自我的关系的异化主要指人的个性的异化、自我的消失，表现出现代主义作家对自我的稳定性和可靠性的怀疑。现代心理学认为，人的自我的核心是潜意识和本能，它是飘忽不定、变化莫测的。现代主义作家从这种观念出发，力图在作品中表现受他人与社会压抑下的人的自我和个性。他们笔下的人物的特点是没有激情、没有自己的思想和表达方式、趋于非个人化或社会化。","keywords":"自然与个人 社会与个人 个人与个人 个人与自我","note":"“异化”实际上是西方文学中的一个永恒的主题，西方现代主义文学的异化问题也就是西方文学中这一永恒主题在20世纪西方文学艺术中的深化。上述四点主要是从内容方面进行分析，如果是从文学形式上分析。那么这一主题则主要是通过荒诞和变形等手段表现出来，比如卡夫卡的《变形记》主要是通过将人变成虫来表现异化，这些在后边题目中都会有具体体现，大家可以结合起来灵活作答。"},{"id":"257","stars":"★★★★★","title":"试比较现实主义文学与现代主义文学的异同","body":"20世纪现代主义文学与19世纪现实主义文学在衰落和兴起的时间上相承接，二者既有联系又有区别：\n\n一、二者的联系\n\n一些现实主义作家在19世纪进行的创新性写作，奠定了20世纪现代主义文学的基础。\n\n（一）现实主义文学奠定了现代主义文学叙事艺术的基础\n\n现实主义文学一直存在着重视剖析人物心理的倾向，例如斯丹达尔、托尔斯泰和哈代等作家的文学创作都具有浓厚的主观性色彩。19世纪中期法国现实主义文学开始发生转化，其中福楼拜的小说创作追求中立、客观的叙述，讲究语言与形式的美，奠定了20世纪现代主义文学叙事艺术的基础，并开启了追求形式美的先河。\n\n（二）现实主义文学与现代主义文学在文化精神上的共同性\n\n19世纪后期的现实主义文学在对人性和传统文化的认识与表现方面，呈现了与现代主义文学在文化精神上的共同性，这一文学现象突出地反映在陀思妥耶夫斯基和哈代的创作中。陀思妥耶夫斯基的《罪与罚》和哈代的《还乡》都将心理真实的表现推进到人物内心的非理性层面，更深层次地描写了资本主义发展过程中个体遭遇的灵魂与精神痛苦，表现出对传统文化的毫不妥协的批判精神，也在一定程度上流露了对人类前途和命运的悲观失望情绪。\n\n二、二者的区别\n\n（一）在描写内容和表现主题上的不同\n\n现实主义文学受自然科学和社会学的影响，以客观现实为依托，关注社会风俗和历史的变化发展，将反映现实提升到批判社会政治、经济制度的层面。巴尔扎克的《高老头》是这方面的代表作。\n\n现代主义文学受非理性哲学和现代心理学影响，以人的主观世界为依托，关注人的内心世界，尤其是内心隐秘的冲动与欲望等非理性的精神活动，进而对压制人性的传统文化展开了批判。例如萨特的《禁闭》表现他人即地狱的存在主义哲学思想，宣扬超越自我的人道主义伦理道德观。\n\n（二）在艺术追求上的不同\n\n现实主义文学追求文学的真实性与历史价值，强调观察与分析，重视调查研究，注重细节真实的描写，以获得真实客观的效果。巴尔扎克的《高老头》中高老头是巴尔扎克塑造的典型环境里的典型人物，体现了特定历史时期社会关系的本质特征。\n\n现代主义文学致力于追求艺术的超功利性，致力于探求更为本真的内心世界，强调对非理性精神活动的审视与追踪，重视创作者的艺术创新，主张通过象征、隐喻来揭示人物内心隐秘的精神世界。卡夫卡的《变形记》通过人变成甲虫的荒诞故事，富有创造性地表现了现代人异化的存在状态和绝望的精神世界。\n\n（三）在创作方法上的不同\n\n现实主义文学通过刻画真实的细节、塑造典型环境中典型人物，获得真实客观的效果。托尔斯泰的《战争与和平》特别注重真实细节的刻画和人物形象在特定场景中的刻画。\n\n现代主义文学强调形式就是内容，主张求新求变，打破物理时间框架，淡化情节和结构的逻辑性、完整性，而且创造了自由联想、意识流、蒙太奇、镶嵌画等新的表现方法，在语言上大胆革新，表现出强烈的先锋性和精英意识。如乔伊斯《尤利西斯》通过人物的身心感受，逼真细腻地反映了都柏林人的日常生活和精神状态，表现了他们道德和精神生活的瘫痪麻痹，以及内心难以排遣的痛苦。\n\n总之，现代主义文学纵然是对现实主义文学创作手法的反叛和颠覆，但作为现实主义这一成熟创作流派的后来者，不得不接受现实主义的影响，因此二者具有干丝万缕的联系。当然，现代主义文学伴随社会的发展以及多种思潮的影响必然展现出独特的风貌，这也是西方文人不断追求不断思考的进步表现。","keywords":"叙事艺术的基础 文化精神上的共同性 描写内容和表现主题 艺术追求 创作方法","note":"现实主义文学揭示社会矛盾，批判社会现实。现代主义文学强调集中表现自我，在艺术手法上反传统。大家在分析时，可以联系二者的具体特征，以及代表作家作品。在答题时，可以从内容、艺术手法等方面进行分析。"},{"id":"258","stars":"★★★","title":"西方现代派文学与传统文学之间的本质区别是怎样的，原因何在","body":"一、本质区别\n\n西方现代派文学与传统文学的本质区别在于世界观和文化精神的不同，这种不同导致二者在描写内容和表现主题上呈现差异：\n\n传统现实主义文学受自然科学和社会学的影响，以客观现实为依托，关注社会风俗和历史的变化发展，将反映现实提升到批判社会政治、经济制度的层面。\n\n西方现代主义文学受非理性哲学和现代心理学影响，以人的主观世界为依托，关注人的内心世界，尤其是内心隐秘的冲动与欲望等非理性的精神活动，进而对压制人性的传统文化展开了批判。\n\n二、原因\n\n（一）科学技术的飞速发展和两次世界大战的爆发\n\n欧美科学技术的飞速发展和两次世界大战的爆发，极大地冲击了西方延续了两千年的基督教文化传统，动摇了西方近代理性主义文化价值体系，进而引发人们质疑整个资本主义现代文明。例如，《荒原》用象征的笔法，将伦敦视为现代西方的象征，描写了这个城市的衰败、荒芜，揭示了生活其中的人们的空虚与堕落，反映了诗人深刻而冷峻的荒原意识，以及对西方人失去宗教信仰之后的担忧。\n\n（二）西方非理性主义哲学思潮与现代心理学的发展\n\n西方非理性主义哲学思潮与现代心理学的发展，加剧了文学的非理性主义和悲观主义色彩，同时将人、人的意志、人的自我活动和生命存在的形式与本质等问题置于关注中心，刷新了人们对自我、社会和世界及其关系的重新认识。叔本华的唯意志论、尼采的权力意志论、柏格森的直觉主义和弗洛伊德的精神分析学说，成为非理性主义文化大潮的主要支流。\n\n（三）文学自身的发展，为现代主义文学的出现准备了内在的条件\n\n早在19世纪初期的浪漫主义文学那里，现代主义文学的端倪就已经开始显露，而后期浪漫主义的一些作家与诗人，例如爱伦·坡和波德莱尔等，其创新性的文学表现就已经具有现代主义文学的特征，而现实主义文学在19世纪后期的发展，也具有了向内转的趋势，对社会的批判也开始呈现出从制度层面深入到文化层面的转向。","keywords":"世界观和文化精神 科学技术的飞速发展 两次世界大战 非理性主义哲学思潮 现代心理学 文学自身的发展","note":""},{"id":"259","stars":"★★★★","title":"试析现代主义各个流派的特点","body":"一、后期象征主义\n\n流行于20世纪20-40年代的后期象征主义继承并发展了前期象征主义的传统，使象征主义更趋完美，内涵更深广，更富有现代主义的特征。后期象征主义仍然坚持以象征暗示的方法表现内心“最高的真实”，反对过多强调主观精神的自由与无限，以至走向过分抽象化，也反对过于强调客观事物的形象、具体而走向平淡无意蕴，同时又反对前期象征主义的隐晦艰深，主张情与理、主观与客观、有限与无限的统一，从而形成了自己的独特性。后期象征主义跳出个人情感的小圈子，努力表现社会与时代的总体精神。在创作方法上，从简单象征发展到意象象征，从个别象征发展到普遍象征，以揭示普遍的真理，从情感象征发展到情感与理智并举，具有思辨性与哲理性。后期象征主义在文学上的主要成就是诗歌创作。\n\n二、表现主义\n\n表现主义于20世纪初产生于德国，而后蔓延到欧美各国，是一个具有广泛影响的现代主义文学流派。表现主义文学善于透过事物表象，展现内在本质，从人的外部行为揭示内在的灵魂；善于直接表现人物的心灵体验，展现内在的生命冲动。表现主义对注重外在客观事实描写的现实主义和自然主义的反叛精神对其他现代主义流派产生了直接而深远的影响。\n\n三、未来主义\n\n未来主义是20世纪初从意大利流行到欧洲各国的现代主义文学流派。它的基本特征是：否定传统文化，主张彻底抛弃艺术遗产和传统文化；歌颂机械文明和都市混乱，赞美“速度美”和“力量”，主张打破旧有的形式规范，用自由不羁的语句随心所欲地进行艺术创造。未来主义有明显的文化虚无主义倾向，但它的创新性试验却丰富了文学创作的艺术表现手法。\n\n四、超现实主义\n\n超现实主义是两次世界大战期间从法国流行到欧美的现代主义文学流派。超现实主义从达达主义发展而来，试图将文艺\n\n创作从理性的樊篱中解放出来，使之成为一种自发性的心理活动过程。超现实主义文学一般具有下列这些特征：强调表现超理性、超现实的无意识世界和梦幻世界；主张用纯精神的自动反应进行文学创作，广泛使用“自动写作法”和“梦幻记录法”进行创作，具有晦涩艰深的风格；追求离奇神秘的艺术效果。超现实主义对后来的荒诞派、黑色幽默和魔幻现实主义产生了重大影响。\n\n五、意识流小说\n\n意识流小说是20世纪二三十年代流行于英、法、美等国的一种现代主义文学流派。意识流小说不重视描摹客观世界，而着力于表现人的内心真实，特别是着力于表现人的意识流程，从而打破了传统小说的叙事模式和结构方法，用心理逻辑去组织故事。在创作技巧上，意识流小说大量运用内心独白、自由联想和象征暗示的手法，语言、文体和标点等方面都有很大创新。这种创作方法被现代作家广泛采用，成了现代小说的基本创作方法之一。","keywords":"后期象征主义 表现主义 未来主义 超现实主义 意识流小说","note":"2023年辽宁大学考研真题中出现“现代主义文学是20世纪初在世界风行的多种反叛传统，质疑资本主义现代文明，反思现代人的命运和价值的流派总称，请选择其中四种并对其内容进行概述”这道题目，大家可以任选这部分内容中提到的四个流派进行作答。现代主义虽非一个统一的文学流派，但他们都有共同的倾向。他们追求个人生存状态的内心体验的真实呈现，反对传统，批判现实。各个流派也有各自的特色，大家在识记时，可以结合具有代表性的典型作品进行理解。另外，上述几个流派都会考查名词解释，大家要积累一下。"},{"id":"260","stars":"★★★","title":"叙述意识流小说的特点（25扬州大学）","body":"意识流小说是20世纪二三十年代流行于英、法、美等国的一种现代主义文学流派。意识流小说家认为，文学的使命不是反映客观现实，而是揭示人类的心理意识结构。小说应该直接展示人物原生态的意识，尤其是潜意识流动的轨迹。其特征主要包括以下内容：\n\n一、现代主义小说的特征\n\n意识流小说作为现代小说的典型代表及诸种形态的极端化表现，具有现代主义文学的典型特征。（详见“现代主义文学有哪些基本特征★\"）\n\n二、以心理时间为时间结构\n\n小说借助于“心理时间”而不是传统小说中的客观时间展开，采用过去、现在和未来时空颠倒或互相渗透的手法，以一种看似杂乱，实际上有其内在连贯性的结构来渲染人物内心变幻莫测的心理活动。在这种时间观念下小说的结构也就与传统小说大相径庭。\n\n三、注重人物心理描写\n\n意识流小说注重表现人物意识活动本身，作家退出小说，着力描写人物心理的种种感受，开掘深层的意识来展露隐蔽的灵魂和内心世界。小说应有的逻辑性不存在了，剩下的是毫无逻辑性、奔腾跳跃、片断零碎的意识的流动。意识流小说以表现人物的心灵活动为主，很少描写人物的体貌特征和所作所为，人物的性格是通过直接展示他的内心精神活动而塑造出来的。人物缺乏发展和变化，人物的丰富性淹没在纷至沓来的无穷感触和对周围环境与人的种种反应里。\n\n四、情节淡化\n\n淡化情节以至取消情节，事件极其微小。环境再也不是呈现主题和塑造人物形象的帮助：它要不就是对物质时间和空间的提醒，要不就是小说中人物心中感慨的诱因，要不就是为了突出人物的心理感受而成为象征与意象的承载物。在这种理念下，小说中生活的本质意义只是从人物的内心世界在日常的经验和感情中透露出来。\n\n五、创作技巧创新\n\n意识流小说大量运用内心独白、象征和隐喻、语言的碎片化、时间与空间的跳跃、多重视角等手法，语言、文体和标点等方面都有很大的创新。\n\n（一）内心独白：意识流小说经常使用第一人称或第三人称的内心独白，让读者直接进入人物的内心世界。这种内心独白可以是连续的，也可以是断断续续的，以表现人物思维的跳跃性和无序性。\n\n（二）象征与隐喻：意识流小说常常使用象征和隐喻来表现人物的内心世界。这些象征和隐喻可以是具体的物体、事件或者场景，也可以是抽象的概念和情感。\n\n（三）语言的碎片化：意识流小说的语言往往具有碎片化的特点，模仿人类思维的真实过程。句子可能不完整，语法结构可能混乱，以表现人物思维的复杂性和多变性。\n\n（四）时间与空间的跳跃：意识流小说不受时间和空间的限制，可以自由地在过去、现在和未来之间穿梭。作者可以通过人物的回忆、幻想和梦境等手法，展现人物在不同时间和空间的心理活动。\n\n（五）多重视角：意识流小说可以采用多重视角，让不同的人物分别讲述自己的故事。这种手法有助于展现不同人物的心理特点，以及他们在故事中的地位和关系。","keywords":"现代主义小说 心理时间 心理描写 情节淡化 技巧创新","note":"关于这部分内容，23年浙江大学、西南交通大学都有过考查。这道题目还可以用来回答“意识流小说对传统小说观念与小说艺术的革新”这类题目。意识流小说是现代主义文学中十分重要的一个流派，它的相关特点，我们可以抓住代表作品如普鲁斯特的《追忆似水年华》等进行准确把握。"},{"id":"261","stars":"★★★","title":"谈谈《荒原》的晦涩","body":"《荒原》的晦涩费解是人尽皆知的。这首诗最初发表时，几乎无人能懂。后来艾略特给诗加了50多条注释，但是这些注释依旧不好理解。造成这种现象的原因其实是可以理解的：\n\n一、时代决定\n\n1920年前后是人类自己也无法理喻的时代。第一次世界大战不仅在物质上对欧洲造成毁灭性的破坏，而且从精神上埋葬了人们心中的上帝。对理性科学的怀疑、对传统道德文化的失望、对大规模战争的恐惧、对经济危机的焦虑、对现代化生产中人被异化的担忧......这一切汇合成一股汹涌澎湃的潮流，荡涤着一切，冲击了人们所有的观念、信仰、思考和结论。在这一片神秘莫测的荒漠面前，人们什么也不能理解。\n\n二、艾略特的哲学思想决定，即直觉主义认识论和悲观主义的不可知论\n\n艾略特是柏格森的崇拜者。柏格森认为，理智是不可靠的，只有直觉的方式才是绝对的、内在的，才能把握生命的本源。因此，文学作品井不总是可以依据理智来理解。桑塔亚纳的哲学思想也对艾略特影响极大。桑塔亚纳认为，认识的内容与认识的对象并不是一个东西，它是认识主体通过抽象概念的中介认识客体的过程。由于中介的歪曲，人的认识不仅有可能产生错误，而且根本不可能获得客体的真相，因此，世界根本就是不可认识的，作为客观世界的反映的文学自然也就不可理解了。\n\n三、艾略特的文艺观决定\n\n艾略特的“客观对应物理论”将诗看成是一种象征。人们要理解作品，不能只限于理解字词的意义，而应该掌握事物的场景的象征意义。在艾略特看来，诗中的意义不过是一个骗局，而当人们不理解这一骗局时，自然是以某种无意识的方式理解了诗；反之，当人们自以为把握了诗的意义时，也就是误入圈套而不自知的时候。\n\n以上既是对《荒原》一诗写作背景的概括，也是对这首诗总体精神的一般把握。《荒原》展示了战后西方文明的危机和传统价值观念的失落，反映了整整一代人理想的幻灭和绝望。“荒原”一词已超出了文学的范围，它已成为西方现代文明的象征。","keywords":"时代决定 哲学思想 直觉主义认识论 悲观主义的不可知论 文艺观 客观对应物理论 西方现代文明的象征","note":"《荒原》的晦涩是多种因素共同造成的，首先是当时的社会环境，其次是艾略特的哲学思想和文艺观。但是，这种晦涩却正突出了《荒原》的主题，通过“荒原”象征当时的西方现代文明，传统的价值观已经失落，一代人的理想也已经幻灭，恰似处于一片荒原中。相关内容可参考罗吉·塞尔、张秀成《＜荒原＞的“晦涩”文体》，资料可在李凡文学正版群中获取。"},{"id":"262","stars":"★★★★★","title":"《荒原》有哪些艺术特征","body":"《荒原》是一首典型的现代主义诗作，它独树一帜的艺术特征主要表现在以下几个方面：\n\n一、蒙太奇的剪接手法和拼贴技法\n\n长诗把远古的神话和传说、宗教人物和说教、古典文学和历史故事，以及现代西方的生活片断等，奇妙地剪接在一起，把看似互不相关的戏剧性场面拼贴在一起，把表面上风马牛不相及的意象组合在一起，共同纳入一个以荒原为中心的象征结构，使这些看似无关的场面和意象获得了内在的联系。诗的每一个细部都是碎片，但正是这些碎片共同构成了诗的主题。\n\n二、丰富复杂的象征\n\n艾略特引经据典，旁征博引。这首诗涉及东西方56部作品，35个作家，6种语言。长诗以“圣杯”“渔王”等故事为基本框架，神话学、人类学为诗人提供了整套的象征语言。其中一些基本的意象在不同的层面上还具有不同的意义，譬如“水”\n\n这个意象就具有双重象征意义：水既是土地肥沃、农业丰收的根本保证，又是由繁殖神崇拜引申而来的、以性欲为代表的人类各种欲望的象征。这种象征闪烁着辩证法的光辉：希望不可无，否则荒原永无生机；欲望忌太滥，否则同样会溺毙生命。\n\n三、跨越时空界限\n\n长诗时间无前后，空间无界限，各类人物混杂其中，共同表现主题。诗中意象时而跳跃，时而重叠，场面之间衔接突兀。诗人将现代的伦敦、古老的神话、历代的英雄壮举熔为一炉，用零碎的片断组合成一个有机的整体。比如在诗的第一节，诗人通过代词“我们”的变化，展示了人类几千年的历史变迁。随着代词的意义变得越来越窄，越来越小，人的价值也在逐渐贬值，逐渐失落。\n\n四、意象新奇怪诞\n\n艾略特常用异常怪诞的意象来表现惊世骇俗的主题。长诗起首第一行，“四月是最残忍的一个月”，就给全诗定下了反传统的基调。另外像“太阳的鞭打”“白骨碰白骨的声音”“种在花园里的尸首”等被战争、死亡、残酷扭曲了的意象也都令读者毛骨悚然。\n\n五、语言复杂多变\n\n《荒原》里有口语、书面语、古语、土语和外国语。诗中既有像“这年头人得小心啊”这样的大白话，又有模仿莎士比亚等古代艺术大师的古奥英语。诗人还注意到词语在不同的层面上具有不同的象征意义，譬如“水”和“火”的双重意义。","keywords":"蒙太奇的剪接手法和拼贴技法 丰富复杂的象征 意象新奇怪诞 语言复杂多变","note":"《荒原》在艺术上的成就超过现代派的其他诗作，是一首具有借鉴价值，值得认真研究的杰作。这首抒情长诗风格多样，表现手法不拘一格，糅合了象征主义、意象主义和玄学派的一些特点。诗中陈述与咏叹，抒情与讽刺，描绘与警句，庄严典雅的诗句与滑稽可哂的市井俗语，交织穿插为五彩缤纷的景象。大量的典故、比喻、暗示、联想、对应等象征主义手法及意象叠加，时空交错等现代诗歌表现手段，诗人用来得心应手。他甚至大胆采用了象征里套象征、神话里面套神话、神话和现实交错、古与今杂糅、虚与实融汇的手法，使得诗歌高度的抽象化、哲理化有机地统一起来，极大地丰富了诗歌的表现手段，拓展了诗歌的思想内容。"},{"id":"263","stars":"★★★★","title":"艾略特《荒原》的贡献与价值","body":"《荒原》是继波德莱尔的《恶之花》之后以西方现代社会为中心内容的著名诗篇，它把神话、人类学、基督教和东方宗教等诸多意象结合在一起，用诗的方法表现第一次世界大战后整个西方世界的精神危机，用象征和暗示的艺术手法凸显西方现代世界的腐朽没落和人类的精神空虚，在艺术中为现代的“荒原”困境探索精神和道德上的出路。\n\n《荒原》作为一个庞杂的艺术集合体，蕴藏着丰富的思想内涵。诗人用象征的手法描写贫瘠的荒原、冰冷的岩石、灰暗的城市、凄凉的钟声、淫乱的狂笑和慈母的哭泣，诗中出现的这些意象是现实社会的真实写照。艾略特在描写现代荒原世界的同时，又赋予精神贫乏和道德堕落的现代人以可感的形象，使环境和人物紧密结合在一起，增强了象征性的表现力。作者用伦敦象征现代世界，描写这个荒原的颓败、荒芜、没落，描写人失去了宗教信仰、精神支柱、正义和理性，像动物一样充满盲目的欲望，变得疯狂、麻木、堕落。因此，艾略特在诗中象征性地概括了西方一代人的精神幻灭。\n\n《荒原》除了写实和象征的意义外，还有神话传说的意义。《荒原》不断提到原始的繁殖仪式，并把它和圣杯传说及基督的故事联系起来，在神话的基础上揭示西方现代社会的现实，并企图在古老的神话中寻找医治“荒原”的道路。\n\n无论从思想、感情还是从意象上看，《荒原》的内容都是十分丰富的。它突破了传统的诗歌题材，进一步发展和丰富了象征主义的艺术手法，扩展了诗歌艺术的表现力，为象征主义诗歌提供了经典范例。\n\n艾略特描绘的荒原景象震撼了西方世界，他寻求拯救的探索引发了人们的思考。艾略特试图以恢复宗教信仰来拯救西方的荒原世界，这是不切实际的，也是不可能的。但他的努力尤其是他对诗歌艺术的探索与革新，使他当之无愧地成为20世纪最重要的诗人之一。","keywords":"西方世界的精神危机 现实社会的真实写照 写实和象征 神话传说的意义 象征主义诗歌经典范例","note":"艾略特的《荒原》，运用象征的手法，表现出了一战结束后西方社会的真实状况和精神危机，同时，《荒原》也为象征主义诗歌提供了经典范例，推动了象征主义诗歌艺术的发展，这便是《荒原》的主要贡献，大家要有所掌握。"},{"id":"264","stars":"★★★★★","title":"谈谈卡夫卡创作的艺术特征（25中南财经政法大学）","body":"奥地利小说家卡夫卡是西方现代主义文学奠基者之一，他的创作体现着现代主义作家的典型特征，具体来说，可以从主\n\n题、思想和艺术手法三个维度进行分析：\n\n一、创作主题\n\n（一）表现宗法时代的极权统治\n\n父子冲突的“代沟”是表现主义文学创作的普遍主题。卡夫卡也不例外。《失踪者》第一章《司炉》写的是父子关系。《在流放地》也与宗法制时代的极权统治有关。短篇小说《判决》涉及的是宗法家长制的权威统治对人的生存构成了致命的威胁。\n\n（二）以具备人的心理活动的动物为主人公\n\n卡夫卡的不少短篇小说以动物为主人公，但它们的心理活动仍与人一样。卡夫卡认为，动物没有被文明粉饰过，它们更单纯、更具原生性，因而更能表现真实。\n\n（三）描绘内心的“庞大世界”\n\n卡夫卡同情下层劳动阶级，对于父亲苛待店里职工表示愤慨；他同情社会主义，对君主统治下社会的法律状况有透彻的了解，并深感不满；卡夫卡所属的犹太民族的处境给卡夫卡的心理以很深的刺激，使他感到自己是个失落身份的异乡人，一个精神漂泊者。他的种种观点与倾向，都表现在他的作品中。比如《城堡》的主人公奋斗终生，也未能进入城堡，就强烈地反映了一个无家可归的异乡人的悲剧性追求。\n\n二、思想内容\n\n卡夫卡要求“法”的绝对合理性，因此他心目中的世界与现实世界相去太远。这样的哲学思考导致他对人类社会异化现象的发现。在他看来，人类文明的发展，反而导致了人类生存的本来面貌的丧失。对异化的洞见和体验，使他形成一种悖谬的思维习惯，甚至生存态度。这种思维和行为方式构成了卡夫卡的二重人格和复杂的思想。主要体现在：\n\n（一）孤独意识\n\n在日常生活中，卡夫卡是个平易近人、经常开怀大笑的人，但他的内心却十分孤独。他的作品描写父子、家人、亲属、世人的不能沟通。孤独不仅是他的境况，也是他的追求。\n\n（二）恐惧意识\n\n对卡夫卡来说，“安宁永远都是不真实的”。他甚至说：“我的本质就是恐惧。”因为“我的生命、我的存在都是由这种地下的威胁构成的”。\n\n（三）障碍意识\n\n卡夫卡眼中的世界是个障碍重重的世界，他感到“一切障碍都在摧毁我”。\n\n（四）负罪意识\n\n卡夫卡认为自己“生活在一个罪恶的时代”，而“我们都应该受到责备，因为我们都参与了这个行动”。他自审意识很强，既控诉环境，也控诉自己。\n\n三、艺术手法\n\n卡夫卡成功地掌握了现代语言艺术，革新了文学观念。他独到的艺术手段包括：\n\n（一）悖谬。卡夫卡常常把它变成美学概念，构成悲喜剧或黑色幽默的审美情趣。《城堡》中的K耗费毕生精力也办不了户口，却在弥留之际，突然被准予在村子里住下，极具悲剧性效果。\n\n（二）图像，或者象征。卡夫卡的思想或意念常常通过图像来暗示，因为他“总想传达某种不可言传的东西，解释某种难以解释的事情”。例如作为官府的城堡高高矗立在山丘上，但接近它比登天还难，这喻示帝国的权力机构与老百姓之间存在着一条不可逾越的鸿沟。\n\n（三）譬喻，或者寓言。同是喻示，但与上两点不同之处在于，一是通过形象的物体，一是通过寓言性的故事。如《诉讼》中牧师对主人公K所讲的“法的守门人”的故事。\n\n（四）荒诞。关于事件的大框架是荒诞的，而具体细节描写却是真切的。如城堡，看得见而走不到，这是荒诞的，但进城堡的情节中细节描写却是具体真切。\n\n（五）梦幻。卡夫卡的日记里常见到梦的记录。《司炉》《乡村医生》都用了梦幻笔法。\n\n（六）怪诞。卡夫卡认为艺术应该“给人以另一副眼光”而不能像“照片”那样成为让人看不见“真实”的“铁制的窗板”。怪诞即改变事物原来的形态，使之怪异，以引起人们的惊异感和距离感，达到使人深思的目的。\n\n（七）神秘性。卡夫卡的世界是一个神秘的世界，因为他把现实推向了极端，使人“陷入某种沉闷的奥秘之中”。卡夫\n\n卡认为写作“是一只从黑暗中伸出的、向美探索的手”“是一种奇特的、神秘莫测的......慰藉”。\n\n（八）多义性。例如对于《城堡》的主题，不同的读者会得出不同的结论，种种解释又都能成立，这赋予卡夫卡的作品以深邃性和丰富性。\n\n（九）自传性。卡夫卡的自传性不同于现实主义者那样以自己的经历为经纬，也不同于浪漫主义者那样直抒胸臆，他写的是主观情感激起的幻想，笔下的主人公与作者既像又不像。\n\n（十）朴素性。卡夫卡的笔法属于“《圣经》方式”：只专注于与主旨有关的事件，可有可无的繁文缛节一律砍去，于是形成了他特有的冷峻、简洁、朴素的风格。","keywords":"宗法时代 以动物为主人公 内心的“庞大世界”孤独意识 恐惧意识 障碍意识 负罪意识 悖谬 图像，或者象征 譬喻，或者寓言 荒诞 梦幻 怪诞 神秘性 多义性 自传性 朴素性","note":"24年复旦大学、贵州师范大学对卡夫卡的创作特点进行了考查。卡夫卡在美学上，通过将虚幻与现实相结合，无限延伸了小说的世界。相对于过去，虚幻就像羽翼一般将小说带离了地面，转而迷失在一个更为广大的时空里。在某种意义上，正因如此，小说获得了前所未有的表现力及对人性的洞察力甚至是破坏力。这部分内容比较庞杂，其中主题、思想内容和艺术手法三部分各自都有可能单独设题，大家要注意灵活应对。"},{"id":"265","stars":"★★★","title":"卡夫卡体现了现代派的哪些创作特色","body":"现代主义作为一个由多种流派组成的文学思潮，其观念演变和价值取向是多元的和复杂的，但它总体上显露出一些基本特征。在卡夫卡的创作中，集中体现了现代派某些创作特色：\n\n一、具备强烈的文化批判倾向\n\n现代主义文学更倾向于文化批判。现代主义作家在“一切价值重估”中不仅批判了西方资本主义制度，也批判了西方的传统文化观念。\n\n卡夫卡的创作，集中批判了宗法时代的父权文化。《失踪者》第一章《司炉》写的是父子关系。《在流放地》也与宗法制时代的极权统治有关。短篇小说《判决》涉及的是宗法家长制的权威统治对人的生存构成了致命的威胁。\n\n二、突出表现异化主题\n\n现代主义文学对文化与文明的批判是基于西方人力图摆脱异化走向自然的愿望，因此，异化就成了现代主义文学的重要主题。这种异化主题，主要从自然与个人、社会与个人、个人与个人、个人与自我的关系这四方面表现出来。\n\n在卡夫卡的小说中，社会像一个强大而又无形的魔掌，掌握着个人的命运，个人成了软弱无力、惶惶不可终日的“甲虫”。现代主义作家这种形而上的社会批判写出了人性的变形和个人对社会及意识形态的不信任与反抗。\n\n三、强调表现内心生活和心理真实，具有主观性和内倾性特征\n\n现代主义作家视客观实体为非真实，认为心灵世界才是唯一真实的世界；认为艺术的使命是非写实的、泛表现的，文学创作应表现内心世界的真，追求超现实、抽象、形而上的真。\n\n卡夫卡在《变形记》中描写人变成虫不是让人们去接受这一事实，而是去体察和领悟其超现实意义上人的精神状态和深层心理，去寻找荒诞中的本质之真。人变成甲虫不过是人类精神世界的象征，而非实指的客观外在世界。\n\n四、热衷于艺术技巧的革新与实验，创作具有形式主义倾向\n\n现代主义作家信奉艺术本体论，认为形式即内容，追求“艺术的非人格化”。他们对艺术形式和技巧进行大胆的革新与创造，表现出反传统特征。现代主义文学大量采用时空倒错、意识流、象征等表现手法，对语言、符号、结构等形式因素格外重视，追求“有意味的形式”。\n\n卡夫卡成功地掌握了现代语言艺术，革新了文学观念。他独到的艺术手段包括：悖谬；图像，或者象征；譬喻，或者寓言；荒诞；梦幻；怪诞；神秘性；多义性；自传性；朴素性。卡夫卡的艺术手段集中体现了现代主义作家对艺术技巧的探索。","keywords":"文化批判倾向 异化主题 表现内心生活和心理真实 艺术技巧的革新与实验","note":"23年上海外国语大学，24年北京语言大学都对卡夫卡的现代派作品特征进行了细致考查，回答这道题目，需要我们对现代派艺术特征和卡夫卡创作特征都有准确的把握，可以结合上边两道题的答案来回答。"},{"id":"266","stars":"★★★★","title":"结合具体作品谈谈卡夫卡小说表现与探索的主题有哪些","body":"一、卡夫卡的短篇小说揭示了现代人所面临的普遍的存在困境；其表现和探索的主题在现代派小说中具有代表性，主要\n\n包括以下内容：\n\n（一）卡夫卡的短篇小说揭示了社会现实的荒诞、非理性，探索了人类存在的痛苦感和原罪感\n\n这方面《判决》和《乡村医生》具有典型性。《判决》不仅表现了对“原父”的恐惧感，也表现了对家长制的奥匈帝国的不满；与此同时，卡夫卡通过这个奇怪的故事，还揭示了人类生活的荒诞、非理性。《乡村医生》把现实的与非现实的、合理的与荒诞的结合起来描写，同样造成一个非理性的气氛，象征着人类在现实社会中所处的地位：人的自我存在的痛苦和原罪感。\n\n（二）卡夫卡的短篇小说表现了资本主义社会中人在重重压迫下掌握不了自己的命运以致“异化”的现象\n\n《变形记》是反映这个主题的重要代表作。卡夫卡通过变形这个象征的手法，揭示了一个普遍的真理：在资本主义社会中，人所创造的物，如金钱、机器、生产方式等，作为异己力量同人对立，它们操纵着人，把人变成了奴隶，并最终把人变成了“非人”。卡夫卡通过受压抑的小职员变成一只甲虫后的思想和活动，深刻地揭露了资本主义社会里人与人之间赤裸裸的利害关系。《骑桶者》《饥饿艺术家》等也都是描写异化现象的杰作。\n\n（三）卡夫卡的短篇小说深刻反映了资本主义社会中小人物找不到出路的孤独、苦闷情绪和无能为力的恐惧感\n\n《老光棍布鲁姆费尔德》和《地洞》等都是反映这一主题的代表作。老光棍布鲁姆费尔德孤独一人，生活十分乏味，他心烦意乱，希望能有一个不需要太多操心的伴侣，但无论是宠物狗还是赛璐珞小球亦或其他事物都无法满足他。这种找不到出路，担惊受怕的恐惧感在《地洞》里描述得更是淋漓尽致。作者通过对小动物心理状态的描述，惟妙惟肖地写出了现代社会中小人物终日战战兢兢、难以自保的恐惧处境。\n\n（四）卡夫卡的短篇小说还深入探讨了现代社会的运转机制及其内在的暴力性和官僚色彩\n\n《在流放地》讲述了流放地军官和他的杀人机器的故事，以隐喻的方式探讨了现代社会机制中无所不在的暴力和惩戒现象。深刻反映了现代社会暴力机器和惩戒机制的非人性化和对人的异化。《中国长城建造时》通过对建造万里长城的描绘，以近乎荒诞的笔触揭露了帝国内部运转机制的复杂性和官僚化。\n\n（五）卡夫卡的部分短篇小说还表现了其对现实的民族国家问题的关注\n\n《往事一页》假借一个游牧民族占领某国京城后的情况，反映卡夫卡的爱国主义思想。特别是描写该游牧民族的饮食起居、生活习惯同当地居民迥然不同所引起的反响，从另一个角度揭示了祖国被外族侵占后造成的悲剧。《女歌手约瑟芬或耗子民族》也是这一主题的代表作。\n\n二、卡夫卡的3部长篇小说《美国》《审判》和《城堡》，更突出地贯穿着社会批判的主题\n\n以《美国》为例，小说所写的实际上是卡夫卡虚构的普遍化了的资本主义世界，诸如资本主义社会的贫富悬殊、劳资对立、工人结社、罢工游行、党派斗争等情景都跃然纸上，基本上是采用现实主义的手法。\n\n总之，卡夫卡的语境是与人类的历史境域相契合的，无论他的艺术表现形式多么的超现实、夸张和变形，但是其主题意义所指向的依然是“上帝之死”后的人处于荒诞的世界中，被异化为“物（动物）”的生存境域，他开启了存在主义文学的先河，无论是萨特、加缪还是荒诞派戏剧，都可以找到卡夫卡的影子。","keywords":"普遍的存在困境 荒诞、非理性 痛苦感和原罪感 人的“异化”现象 小人物找不到出路 现代社会的运转机制暴力性和官僚色彩 民族国家问题 社会批判","note":"卡夫卡小说表现与探索的主题，其实也就是卡夫卡小说的思想主题。根据思想主题的不同，卡夫卡的众多小说创作被分成了几个类别。要注意的是，卡夫卡小说创作以短篇为主，所以有时候会只提问“卡夫卡的短篇小说根据思想内容不同应如何分类”，大家要注意灵活应对。"},{"id":"267","stars":"★★★","title":"请分析卡夫卡作品中的“譬喻”，结合具体文本，谈谈“譬喻”对后世作家的影响（25南京大学）","body":"卡夫卡的譬喻不同于传统象征主义的确定性，而是将现实与梦境、逻辑与荒诞编织成一张无法穿透的网，迫使读者直面存在的荒谬本质。这种独特的譬喻体系，塑造了现代文学的美学范式，至今仍在文学殿堂中回响。\n\n一、卡夫卡式“譬喻”的特征\n\n（一）荒诞与现实交织\n\n卡夫卡常常将荒诞离奇的元素与现实生活场景相融合。在《变形记》中，主人公格里高尔·萨姆沙一觉醒来变成了甲虫，这一荒诞的情节是故事的起点。然而，卡夫卡却在这个荒诞的框架下，细腻地描绘了格里高尔变形后的生活细节以及家人的反应，如家人对他的逐渐厌恶、格里高尔对自己无法再承担家庭经济责任的焦虑等，这些都是现实生活中人们可能会面临的家庭关系、经济压力等问题的写照。这种将荒诞的譬喻置于现实背景中的手法，使读者在感受到强烈的冲击和困惑的同时，也能深刻地体会到现实生活中的无奈和困境。\n\n（二）象征意义丰富\n\n卡夫卡作品中的譬喻往往具有多重象征意义。以《城堡》为例，城堡这一意象象征着多个层面的意义。它既可以代表着遥不可及的权力中心，主人公K拼尽全力想要进入城堡，却始终无法如愿，反映了个体在面对庞大的权力机构时的渺小与无力；同时，城堡也象征着一种理想或目标，K的不懈追寻暗示了人类对理想的执着追求以及在追求过程中所遭遇的重重困难。此外，城堡还可能象征着人类内心深处的某种神秘力量或未知领域，它充满了不确定性和神秘色彩，让人既向往又畏惧。这种丰富的象征意义使卡夫卡的作品具有了深邃的思想内涵和广阔的解读空间。\n\n（三）强调个体的孤独与异化\n\n卡夫卡式譬喻常常用于展现个体在社会中的孤独与异化状态。在《审判》中，主人公约瑟夫·K被无端指控，却孤立无援，无法理解自己为何被审判，也无法找到有效的途径为自己辩护。他在整个审判过程中，始终处于一种与周围世界格格不入的状态，周围的人似乎都与他为敌，或者对他的遭遇无动于衷。这种孤独与异化的譬喻深刻地反映了现代社会中人与人之间关系的冷漠以及个体在社会体制下的无助和迷茫，凸显了个体在面对强大的外部力量时的渺小和脆弱。\n\n（四）模糊性与不确定性\n\n卡夫卡的譬喻往往具有模糊性和不确定性，不给出明确的解释和结论。在《变形记》中，格里高尔变成甲虫的原因始终没有明确说明，读者只能从字里行间去推测可能的原因，但无法得到一个确切的答案。这种模糊性和不确定性增加了作品的神秘色彩和解读难度，同时也迫使读者去思考和探索作品背后更深层次的意义。卡夫卡通过这种方式，让读者置身于一个充满不确定性的世界中，就像现实生活中人们常常面临各种无法解释和难以预料的情况一样，从而引发读者对人生、世界的本质等问题的深入思考。\n\n（五）多样化的讽刺\n\n（1）对社会体制的讽刺\n\n在《审判》中，主人公约瑟夫·K被无端指控，却不知道自己的罪名是什么，整个司法程序充满了神秘和荒诞的色彩。法院看似庄严，实则混乱无序，法官们行事随意，审判过程毫无公正可言。例如，K试图寻找律师为自己辩护，但律师的态度模棱两可，只是在拖延时间，而法院的各种繁文缛节和官僚作风让人感到窒息。卡夫卡通过对这一司法体制的描写，讽刺了现实社会中司法系统的腐败、低效以及对个体权利的漠视。\n\n（2）对人性弱点的讽刺\n\n在《变形记》中，格里高尔变成甲虫后，他的家人一开始还试图照顾他，但随着时间的推移，他们的态度逐渐发生了变化。格里高尔虽然意识到自己给家人带来了负担，但他仍然抱有一丝希望，希望家人能够理解他、接纳他。然而，他的家人最终还是抛弃了他。格里高尔的这种自我欺骗，以及他对家人不切实际的幻想，讽刺了人类在面对困境时往往不愿意正视现实，而是选择自我安慰和逃避的弱点。\n\n二、卡夫卡式“譬喻”对后世作家的影响\n\n（一）对荒诞派作家的影响\n\n卡夫卡的荒诞譬喻为荒诞派作家提供了重要的启示。例如，贝克特的《等待戈多》中，两个流浪汉等待永远不会到来的戈多，与卡夫卡《城堡》中K等待进入城堡有着相似的荒诞性。这种譬喻方式被荒诞派作家广泛运用，他们通过展现人类生活的荒诞和无意义，揭示了现代社会中人们的生存困境和精神危机。荒诞派作家们也像卡夫卡一样，用诗意的方式展现人的异化，如贝克特在作品中用一些意象象征着人的精神和物质层面的分离，让读者深刻感受到现代社会对人性的扭曲。\n\n（二）对存在主义作家的影响\n\n卡夫卡作品中关于个体在荒诞世界中的孤独、自由意志和对存在意义的探索等譬喻，对存在主义作家产生了深远影响。虽然卡夫卡本人未直接标识为存在主义者，但他的作品探讨了存在主义的核心主题。例如加缪在《局外人》中，塑造了默尔索这样一个对周围世界漠不关心的人物形象，他对母亲的去世、自己的杀人行为等都表现出一种冷漠和无所谓的态度，这与卡夫卡作品中所展现的个体在荒诞世界中的孤独和迷茫有相似之处。存在主义作家们受到卡夫卡的启发，更加关注个体在世界中的存在状态，以及个体如何在荒诞的世界中寻找自己的存在意义和价值。\n\n（三）对魔幻现实主义作家的影响\n\n马尔克斯《百年孤独》：丽贝卡吃泥土、蕾梅黛丝乘床单升天等情节，实为卡夫卡式日常魔幻的拉美变奏。\n\n富恩特斯《阿尔特米奥·克罗斯之死》：垂死者的意识流如同《乡村医生》中时空扭曲的马车，将个人记忆与民族历史缝合为存在主义寓言。\n\n（四）对后现代主义作家的影响\n\n博尔赫斯《小径分岔的花园》中迷宫般的时空结构，受《审判》多层司法系统的启发，将卡夫卡的制度性迷宫转化为知识论层面的智力游戏。\n\n品钦《万有引力之虹》中V-2火箭的毁灭性轨迹，延续《在流放地》对技术暴力的批判，以更大尺度的譬喻网络揭示军事工业复合体的疯狂。\n\n（五）对亚洲文学的影响\n\n村上春树《海边的卡夫卡》直接以卡夫卡为名，主人公田村卡夫卡的弑父预言与自我放逐，重构《审判》中“无名之罪”的现代宿命，将西方存在主义嫁接于东方玄学传统。\n\n阎连科《受活》中的残疾人表演团，以身体残缺譬喻社会畸形，其黑色幽默与卡夫卡《饥饿艺术家》的自毁式表演形成跨时空对话。\n\n2024年卡夫卡逝世百年之际，其譬喻艺术依然如同《城堡》中那座永不熄灭的灯塔，在晦暗的现代性迷雾中，为探索人类精神边疆的作家们提供着永恒的坐标。","keywords":"特征 荒诞与现实 象征意义 孤独与异化 模糊性 不确定性 讽刺 社会体制 人性弱点 影响 荒诞派 存在主义 魔幻现实主义 后现代主义 亚洲文学","note":"①要解决这道题目，卡夫卡的作品可以多说一些，除了《变形记》，还有《审判》《城堡》《在流放地》《法的门前》等。每部作品中的譬喻元素需要具体分析，以体现文本的重要性。②第二部分的影响，以上仅仅是从流派入手，还可从语言、风格、叙事、象征等细微方面入手，二者殊途同归，大家结合自己实际即可。"},{"id":"268","stars":"★★★","title":"谈谈卡夫卡《诉讼》的思想内涵","body":"《诉讼》开始创作于1914年，1919年基本完成，它是“卡夫卡式”小说形成的标志，被公认为卡夫卡最优秀的作品，最能代表卡夫卡的创作思想和艺术手法。作品内涵深刻而富有哲理色彩，在貌似荒诞不经的故事背后体现了卡夫卡对现代世界的深刻认识和理解，反映了卡夫卡个人复杂的内心和精神世界。其思想内涵如下：\n\n一、小说通过一个公民因莫须有罪名被逮捕，最后被处死的故事，揭露了现代社会官僚机制和司法制度的冷酷性和非人性\n\n小说中，主人公无辜被捕，在诉讼过程中，处处碰壁，一筹莫展，精神上受到压力，心灵上受到摧残，却无人问津，无人关心。任何公民一旦被这个官僚制度和司法机器网罗进去，就终身无法摆脱。正如K所说的：“法院一经对某人提出控诉，它就坚信这个被告有罪，如果要消除这种信念，那真是困难万分。”在卡夫卡看来，这种非人性的官僚制度和审判机制是对现代人的巨大威胁。\n\n二、小说深刻反映了现代社会制度本身的非理性色彩以及由此导致的现代人的不安全感\n\n在卡夫卡看来，高速发展的现代社会已经脱离了人本身的控制，社会机器犹如一匹失去控制的野马，肆意奔跑。人只能被动跟随社会的非理性运转，且随时可能被社会机器的荒诞模式粉碎。\n\n三、从小说中我们也可以看到卡夫卡内心深处深刻的焦虑和恐惧\n\n卡夫卡本人一直生活在对现实权威和精神权威的巨大恐惧中，他的大量小说都描写了权威的力量和主人公面对权威时的无能为力。小说中K的无辜受审，似乎正反映了作家精神世界中对无所不在的权威的深刻焦虑和恐惧。《诉讼》艺术手法高超，卡夫卡没有正面描写现代社会的种种弊端，而是运用象征的、夸张的艺术手法，通过主人公内在情绪的发展变化和小说情节的非理性发展，别具匠心地达到揭示现代社会内在症结的目的，可谓意味深长。\n\n总而言之，《诉讼》通过K的命运、个别人与资产阶级司法机构的关系，表明了现代资本主义社会中日趋严重的异化现象，并且最早在长篇小说中表现了异化的人。所以，从某种意义上说，《诉讼》不单单是揭露了现代资本主义社会对人的折磨和摧残，更重要的是从哲学（当然是唯心主义的）角度暴露了扭曲的西方社会，探讨了人与社会、人与自我的相互关系问题，所以，《诉讼》成了卡夫卡“最伟大的作品”，在二十世纪西方现代文学中占有十分重要的地位。","keywords":"官僚机制和司法制度的冷酷性和非人性 社会制度本身的非理性色彩 现代人的不安全感 焦虑和恐惧","note":"《诉讼》荒诞不经的故事背后，隐含着作者对这个社会的批判和对当代人生存困境的思考。大家可以从这两点出发，结合作品内容，去探讨卡夫卡描述了怎样的社会现实，批判了哪些东西，作出了哪些思考。"},{"id":"269","stars":"★★★★★","title":"《变形记》的思想主题","body":"中篇小说《变形记》是卡夫卡最著名的作品。它通过人变成大甲虫的荒诞故事，展现了现代人丧失自我，在绝望中挣扎的精神状态。变形记的思想主题，主要包括以下内容：\n\n一、表现现代人自我价值与个性丧失的悲剧\n\n格里高尔既没有自由，也谈不上自主与个性，在外他是被公司强行驱使着机械地运转的机器，在内他是一家人的经济支柱。为此他忙忙碌碌，对家人忠诚，对公司尽责。在作者笔下，正是这种为每天的面包所感到的忧虑改变并毁坏了一个人的性格，生活就是如此。现代人的个性已淹没在群体中，在这个世界上他们并不能主宰自己的命运，一如古代的那个俄狄浦斯。在这个意义上，卡夫卡通过《变形记》重新奏响了远古时代的人与命运抗争的神话主题，而且还增添了比古代人更浓重的悲哀、凄苦与绝望。\n\n二、表现人与人之间互相视为异类的异化状态\n\n小说在写人变成甲虫之后，又用许多笔墨写了变形后的格里高尔被遗弃的境遇和悲哀凄苦的心灵世界，这进一步让我们看到了西方现代世界中人与人之间因无法沟通造成的孤独、冷漠与悲凉。在现实生活中，人自然不会有甲虫的外壳，甲虫自然也不会有人的心态。但透过这种表象，我们可以发现许多场合中人们都戴着面具扮演种种角色，互相企求理解而又各自把内心隐秘深深埋藏。如此看来，格里高尔的变形折射了西方现代人在另一层面上的生存状态：人与人之间的隔膜和由隔膜造成的孤独，这是人与人之间互相视为异类的异化状态。\n\n《变形记》中表现的人生观念基本上体现了存在主义的思想，认为人是有罪的，人生在世界上是痛苦的，人的命运无常，世界的本质是荒诞和不可知的。因此，这个作品呈现出悲观主义的色彩，但小说通过个人内心体验所表现出来的西方现代人的精神世界是真实的。","keywords":"自我价值与个性丧失的悲剧 人与人之间互相视为异类的异化状态","note":"《变形记》是现代主义文学创作的典型代表，它的思想主题，主要包括两个层面：一是现代人自我价值与个性丧失，二是人之间关系的异化。这些思考，体现了现代主义文学思潮整体的倾向，这些内容，我们要仔细掌握。"},{"id":"270","stars":"★★★★★","title":"《变形记》的艺术特色（25湖南大学、26扬州大学）","body":"一、神话象征模式\n\n故事的整体框架是借助于一个神话象征模式构建起来的，即人变成虫的逻辑结构本身是非真实的，它只是用来寄寓人在哲理意义上的生存状态；作者不是让人们去接受人变成虫这一客观存在的事实，而是去体察和领悟其超现实意义上人的精神状态和深层心理，去寻找荒诞中的本质之真。人变成甲虫不过是人类精神世界的象征，而非实指的客观外在世界；不在真实的摹写中追求再现式的逼真，而以象征式的表现追求真实中的荒诞、荒诞中的真实，这正是《变形记》在艺术上的最突出特\n\n点，也是“卡夫卡式”小说的基本特征之一。\n\n二、以喜剧形式表现悲剧内容\n\n（一）用荒诞因素消解悲剧冲突。格里高尔厌倦了推销员这种恼人的工作，但作为生活中肢体和思维健全的人，作为家庭经济责任的承担者，不去工作是难以想象的，甚至一时的耽误也是不被容许的。这种矛盾构成了自我意志与社会意志冲突的可能性。事实上小说中将这种可能性推向了现实的边缘：要搭乘五点钟火车的格里高尔竟一觉睡到近六点三刻，门外，父母和妹妹的敲门声此伏彼起，不久，公司也派人来查询。按传统小说的情节逻辑，一场冲突势所难免。但卡夫卡让主人公变成了一只甲虫，冲突在将至未至之际悄然消解了。\n\n（二）把人物推入悲惨境遇与表层心理认知的巨大反差之中。人变为虫是超出常人心理承受能力的灭顶之灾，但格里高尔的反应却超乎想象的平静，他没有惊恐万状，没有痛不欲生，也根本不去揣想虫身意味着什么，将带来怎样的后果。一开始，他只是觉得不习惯这庞大的躯体，着恼于那许多只细腿不听使唤，不容易让它们的动作协调起来；接下去，他考虑起如何下床的技术性问题，执着于各种姿势各种方式的尝试，设想落地后不伤及脑袋的最佳方案；当不得不应答门外的问话时，他为声音已变得叽叽喳喳无法让人听清而苦恼；即使以虫形现身吓住他人以后，他最急迫的念头乃是安慰、说服秘书主任，以便保住自己在公司的位置。主人公可怕灾变的事实与心理知觉之间形成的巨大落差，接近于黑色幽默，这是反讽。\n\n三、内视角叙述\n\n《变形记》的叙事视角与其多数作品一样，采用内聚焦，也就是内视角或人物视角。小说中，叙述者隐身于人物之后，与人物共用一个头脑、一双眼睛，叙述者叙述的一切，仅限于人物心里所能感知、视野所能企及的范围之内，人物无法知悉的，叙述者不作交代。如格里高尔变成甲虫后仰卧在床上，“他稍稍一抬头，便看见自己那穹顶似的棕色肚子分成了好几块弧形的硬片”，而背部，他只能感觉到“坚硬得像铁甲一般”，摔到地板上“后背也比他想象得更富有弹性”；再如，家庭成员的活动、公寓其他地方的情形，叙述者仅通过主人公贴着门去听、透过门缝去看。这种叙事，掩蔽了作者的声音和情感，不提供作者的价值参照，而启发读者自己去捕捉和处理信息，这也造成了作品拥有多种解读、多种判断的可能的原因之一。\n\n四、意识流手法\n\n卡夫卡往往用意识流手法，通过内心独白、回忆、联想、幻想等，表现人的精神世界，从而揭示小说的主题。《变形记》的内在主线就是格里高尔变成甲虫后的心理一情感流动的过程，主人公变成甲虫后的内心感受和心理活动是小说的主体。而这个“甲虫”的内心世界是丰富而庞杂的。他的心理活动是从变成甲虫后的此时出发，去感受周围的一切，去回忆、联想过去和今后的事；有来自现实的真实感受，也有由恐惧、焦虑、痛苦与绝望而生的幻想、幻觉，与自由联想相伴的时空倒错、逻辑混乱、随意性与跳跃性比比皆是，明显具有意识流的特征。","keywords":"神话象征模式 以喜剧形式表现悲剧内容 内视角叙述 意识流手法","note":"浙江财经大学在24年对这部作品进行了细致考查。在分析《变形记》的艺术手法时，我们可以联想卡夫卡所用的现代主义艺术手段，结合作品内容，作具体分析。要注意的是，《变形记》里面涉及的这些艺术手法，也体现了现代主义的特征。相关内容可参考王祎凡《浅析卡夫卡＜变形记》的主题思想》，资料可在李凡文学正版群中查看。"},{"id":"271","stars":"★★★★★","title":"《变形记》如何体现表现主义的艺术特征","body":"《变形记》是卡夫卡最著名的作品，它通过人变成大甲虫的荒诞故事，展现了现代人丧失自我，在绝望中挣扎的精神状态，集中表现了表现主义文学的艺术特征：\n\n一、融合对立的元素\n\n表现主义认为有时经过变形的生活反而更贴近生活的真实。在小说《变形记》中，无论是现实与非现实的场景，合理与荒诞的事物，还是正常人与非人都可以共存于作品当中。这些看似矛盾的元素和谐地融为一个统一体。矛盾各方并不消除对立关系，却在对立状态中互相抗衡、冲击、比较、映衬，使读者产生新奇的审美感受。小说虽然描写了人变成甲虫的荒诞故事，但表现了作者对现代西方社会和人们生存与精神状态的清醒认识。借由大量真实的细节描写，小说将这个荒诞的故事叙述得真实可感。\n\n二、揭示事物的本质和最真实的面貌\n\n表现主义文学善于透过事物的表象，展现内在的本质，从人的外部行为揭示内在的灵魂；善于直接表现人物的心灵体验，展现内在的生命冲动。卡夫卡通过一系列现象的展示，毫不客气地揭露了当时社会中异化的人格。他所揭示出的人与人之间的关系是最可怕的，却又是最真实的。人与人之间的情感在卡夫卡笔下似乎是靠价值和利益建构起来的。在这样残酷的世界\n\n里，格里高尔充满了孤独感、危机感、恐惧感，这也是许多人普遍具有的心理症状。\n\n三、展开丰富的想象，扩展表现的思想情感\n\n表现主义文论认为艺术是一种经验形式，它的实现要借助于想象活动，这种想象活动是一种审美活动，在想象之中，原始的情感会转变成一种理想化的情感，这就是想象要完成的任务。表现主义作家常以抽象化的时空环境和抽象化的人物形象，以夸张、变形、荒诞、象征、梦幻等手法表现具有普遍意义的哲理和主题。在《变形记》中，作者让格里高尔不可思议地变成了一只巨大的甲虫。卡夫卡想象格里高尔去适应甲虫的躯体的艰难过程，别样地传达出了主人公的无助感、危机感，更加深刻地展示了人生存的困境。","keywords":"融合对立的元素 现实与非现实 正常人与非人 合理与荒诞的矛盾组合 事物的本质 最真实的面貌 丰富的想象扩展表现的思想情感","note":"《变形记》把荒诞放在日常生活之中，把它当作丝毫也没有什么可怪之处的东西加以表现。用现实主义的语言叙述非现实主义的内容，运用简洁平淡的语言风格，使荒诞离奇的事件显得“比真正的生活真实还要现实”。相关内容可参考安小鸥《从表现主义分析卡夫卡的《变形记》》，资料可在李凡文学正版群中获取。"},{"id":"272","stars":"★★★★","title":"奥尼尔戏剧的创作特征","body":"一、思想特征\n\n（一）直面社会底层人们的生活和悲剧\n\n奥尼尔自创作之初就直面惨淡的人生，他成功地将社会底层人们的生活、理想等搬上了舞台，“在似乎是最卑下低贱的生活中找到悲剧中那种使人理想化的崇高品质”。他打破了外国戏剧长期垄断美国剧坛及戏剧商业化的局面，又使美国戏剧从粉饰现实的虚假乐观中摆脱出来，走向了独立和成熟。\n\n（二）揭示生活本质，肯定人的精神\n\n奥尼尔认为“戏剧就是生活”，戏剧反映生活，揭示生活的本质并传达给观众。而“生活是一出悲剧”，悲剧在于人类超越存在与自我时所产生的苦难与剧痛，以及失败，但人的精神不会被征服。人的理想、追求、奋斗，使人生充满意义并富于美。这美即悲剧的崇高。就在这种对生活的悲剧性的否定中，人的价值与意志、人的追求与抗争都得到了充分的肯定。\n\n（三）基本主题是对人生意义、自我价值和生活理想的追求与幻灭\n\n奥尼尔试图超越一切物质基础，超越具体的社会问题，从生死对立的角度，去探索人与神之间的关系，追寻人存在的终极意义，为这无价值的人生重建价值，以拯救痛苦的灵魂及失却灵魂的芸芸众生。因此，他常将具体的社会问题抽象化，作形而上的探讨。他的创作广泛触及了美国的社会现实，表现了美国生活的悲剧性，对美国社会进行了批判。人生意义的探索与社会问题的研究无法分离，两者的结合构成奥尼尔戏剧的基本内容。20世纪初美国普遍出现的对人生意义、自我价值和生活理想的追求与幻灭，是奥尼尔悲剧的基本主题。\n\n二、艺术特征\n\n（一）主观色彩与象征性\n\n奥尼尔的剧作不完全是对社会生活的客观模仿，机械再现，而是带有较强的主体意识，较浓的主观色彩，它铸进了作者对生活的体验、思索和理解，蕴含着深邃的哲理。奥剧传达哲理意蕴的最常见方式是象征。象征性是奥剧的突出特点。奥剧的象征从不脱离剧中的人、物、场景及意象等具体事物，在鲜明的形象中使抽象观念得到完满的体现。\n\n（二）重在表现人物的心理真实\n\n奥尼尔认为现代戏剧是“灵魂的戏剧”。因此，他不很重视事物的外部真实，而重在表现人物的心理真实。因而总是淡化人物的外部动作、表面冲突和戏剧情节，少用悬念、突转等传统手法，立足于从寻常生活中摄取片断，着力于人物情感思绪的捕捉。人物自身及相互间情绪的矛盾、灵魂的搏斗成为戏剧冲突的主要内容。故奥剧结构的统一常建立在戏剧冲突的内在性上。\n\n（三）舞台时空常具双重性\n\n奥剧的舞台时空常是外部空间与思维空间并存，物理时间与心理时间共驻。在剧作时间纵向发展的同时，作者横向切入人物的内心世界，展览人物心态，直至潜意识深层。为达到预期效果，奥尼尔创造了一系列新的表现手段，并改造利用旧有形式，如：心理活动具象化，分隔演区，两个演员同演一个人物，运用面具、独白、旁白等。这样，奥剧中常常是幻觉与现实并陈。\n\n求与幻灭 艺术特征 主观色彩 象征性 心理真实 舞台时空双重性】","keywords":"","note":"奥尼尔的戏剧创作手法和他的思想是息息相关的，他的戏剧创作特色，其实是他美学思想与人生观的体现，大家可以从这一点出发，将这些内容串联起来进行记忆。"},{"id":"273","stars":"★★★","title":"谈谈《毛猿》中扬克这个形象的意义","body":"一、美国现代产业工人的代表\n\n扬克的遭遇反映了现代资本主义社会中劳动人民的悲惨处境。扬克开始时自以为了不起地自我肯定，是建筑在一种自我误解之上。他误认为自己是资本主义社会物质力量的代表，因而否定资产阶级，也否定“社会主义的救世军”。其实真正代表资本主义物质力量的是资产阶级。扬克作为物质财富的创造者，除了被奴役被支配，创造财富供他人享乐外，在现代西方社会根本无立足之地，他等于甚至低于毛猿。\n\n二、人的象征\n\n“扬克就是你自己也是我自己，他是所有的人”，这是作者的本意。扬克从开始自认为是能在地狱里工作的好汉，是个极重要的角色，到意识到自己地位低下，被人蔑视并无足轻重，经历了一个幡然醒悟的过程。“本来我是钢铁，我管世界。现在我不是钢铁了，世界管我啦”！一切“全都颠倒了”！扬克不能不感到震惊和猛醒。作者把扬克醒悟的过程视作人类终于从幻想回归现实的过程。\n\n一旦醒悟，扬克便反复思考自己的地位与处境，寻找自己在社会中的位置。扬克的抗争表现为反对现存社会秩序，反对资产阶级。但他的努力抗争，他的寻找探索都以失败而告终，醒悟之后的扬克又陷入了迷惘。从本质上说，扬克的抗争代表着人与命运，人与异己力量的斗争，他寻找归属而无结果，则象征着现代人寻找自我、追寻人类的生存价值却终不可得。自我的失落、自由的得而复失是现代人所面临的共同问题，由此而引发了现代人内心的苦闷、烦躁、困惑和迷惘。\n\n三、反映人类生存状态\n\n在现代物质文明高度发展的时代，人类虽在征服自然界方面卓见成效，却又为人造自然所困扼。人更大程度地丧失了自我支配能力，被异化成了物的奴隶，成了非人、机器；财富、资本主义生产方式则异化为统治人、与人敌对的力量。扬克及工人们机械地工作着，处于领导地位的资产阶级也是木偶般地动作着。人与人之间疏远、隔膜，相互对立。人孤独而空虚。人与大自然失去了昔日的和谐，又陷入新的不安宁中。这就是现代人，就是他们的可悲境遇。作者将扬克等人的处境扩展为人类的普遍生存状态，展示出作者关注整个人类命运的宏大气魄。\n\n总之，扬克的悲剧，揭示了现存资本主义制度的不合理，现代人的异化，人与自己生存条件的疏离，人面对强大的外界力量无能为力的困惑、悲愤，人寻找归属而不可得的幻灭感，人在现存的资本主义社会中日益深重的精神危机。人的异化、追求及精神幻灭是作品的主题。扬克失败的过程给人以启迪：人正是在徒劳无望的追求与反抗中重获人的尊严，建立并实现人生价值。同时，倒退是没有出路的，从野蛮走向文明是人类社会发展的必然。这是作品的积极意义之所在。","keywords":"美国现代产业工人的代表 人的象征 人类的普遍生存状态","note":"扬克首先是美国产业工人的代表，同时是人的象征。扬克的探索与寻找反映了人类的反叛与抗争，扬克的生存状态代表着人类普遍的生存状态。作者塑造扬克这样一个形象，目的就是为了揭示资本主义制度的不合理，揭示现代人的异化、人与自然关系的异化。"},{"id":"274","stars":"★★★★","title":"《毛猿》的艺术特色","body":"一、注重将人物的心理活动表现于外，使思想感知化\n\n《毛猿》是奥尼尔的表现主义代表作之一。表现主义注重将人物的心理活动表现于外，使思想感知化。该剧也不例外。整个剧作演示的是扬克精神危机产生发展的全过程：从自信到怀疑到失落到绝望。戏剧冲突主要是扬克自身的内心冲突，他与米尔德丽德的冲突只是一个引子，此后的情节顺乎扬克的心理逻辑而展开，外部情节则被淡化。第四、五、六场以及第八场既是剧情的自然发展，更是扬克心路历程的展示。作者善于把人物的思想、情绪、意念等转化为视觉形象，淋漓尽致地呈现于观众眼前。\n\n不仅如此，作者还用外界音响来表现人物的内心奥秘，把人的意识外化为声音，诉诸观众的听觉，使观众获得更真切更深刻的体验。如第四场，扬克感觉受了侮辱，陷入沉思，内心由痛苦愤怒而几近疯狂。作者安排周围工人齐声鼓噪嘲笑，这些喧闹声，实际上是扬克内心苦闷惶惑、狂躁不安情绪的外化。\n\n二、擅长使用独白\n\n作者不排斥独白这一古老的戏剧表现手法，将其进一步发展并有所创新。他的独白既是人物内心情感的表白，又是人物思维过程的外露，而这一过程常是无意识的、无逻辑的、跳跃性的，人物的独白常触及人物的潜意识深层。如整个第八场便是扬克一人的独白：扬克向动物园中的毛猿诉说衷肠，倾诉中时而清醒，时而糊涂，或愤慨，或悲哀，有实感，有幻觉，但最根本的是对现代资本主义文明的抗议和控诉。\n\n三、着重突出主人公的性格\n\n《毛猿》侧重于开掘扬克的主观世界，因此在人物的设置上也有其独特之处，可以说是主人公扬克的独角戏。作者又从对比的角度设置几个与扬克不同的配角，以突出主角扬克。其他则是些无名无姓的人物，如米尔德丽德的姑妈、轮机师二副、烧火工人们等等。这类人物只是根据剧情发展的需要而随时出现或消失。还有一类则是人物表上没有列入的，如七嘴八舌的声音、大伙、话音等，他们类似古希腊悲剧中的合唱队，几乎作为背景而存在。扬克及其配角各具性格特征，其他人物则谈不上什么性格特征。欧洲戏剧的发展从重情节到重性格再到重心理，奥尼尔的创作正代表着重心理的发展趋势，并完成了这个由外向内转的过程。\n\n四、浓厚的象征色彩\n\n《毛猿》这部作品又是一出象征主义戏剧。贯穿全剧的毛猿是人的象征。剧本一开始，我们看见的工人，个个都是长臂，小眼，眼露凶光，低而后削的额头，毛茸茸的胸脯，且力大无穷，极像人猿，扬克是他们的代表。在静下来思考问题时，扬克的外形“恰像罗丹的《沉思者》”。而在最后一场中，笼子里蹲着的大猩猩的姿势也很像罗丹的《沉思者》。扬克、沉思者和毛猿，这一组形象融合一体。毛猿就是现代人，现代人一如古代毛猿，皆为环境所困。\n\n与毛猿密切相关的是剧中一系列的笼子意象。邮船的前舱是“被白色钢铁禁锢的一条船腹中的一个压缩的空间。一排排的铺位和支撑着它们的立柱互相交叉，像一只笼子的钢铁结构，天花板压在人们的头上。他们不能站直”。除笼子般的船舱外，还有监狱里关人及动物园里关兽的笼子，而在世界产联工人协会那一场里，密集的建筑物包围着窄窄的街道，人的整个生存空间也像个笼子，笼子就是现代人生活环境的象征，扬克正是穿梭于这些笼子之间。笼子是钢铁所造，钢铁正是现代工业文明的标志。全剧是人类陷于资本主义文明的困境中，又渴望摆脱困境的象征。\n\n五、对比手法\n\n《毛猿》中对比手法的运用也非常突出，除了前面提到过的人物的对比、时代的对比外，还有环境的对比。工人们挤压在狭小黑暗、空气污浊的前舱或炉膛口，米尔德丽德和她姑妈则闲躺在宽敞明亮、阳光明媚、空气清新的甲板上，而邮船是行驶在蔚蓝的大海上。船下、船上、船里、船外，社会底层人民与上层资产阶级的生活，自然的美与社会的丑等恰好构成强烈的反差，也传达出丰富的内涵。\n\n奥尼尔执着地表现严肃的人生，其戏剧以独到新颖的内容和形式启迪着后世的人们。","keywords":"表现主义 心理活动表现于外 外界音响 独白 人物设置 独角戏 象征主义 对比手法","note":"美国悲剧奠基人奥尼尔的剧作《毛猿》不论从艺术手法上还是从主体思想上看，都无愧是现代主义的经典作品，同时也是一出象征主义戏剧，作者通过现代主义手法揭示人物的内心世界，剖析主人公扬克悲惨命运的社会根源，从而表现了在西方高度发达的工业社会里，孤独和绝望是人不可改变的宿命这一主题。"},{"id":"275","stars":"★★★★","title":"简述奥尼尔《毛猿》的表现主义特征","body":"表现主义注重将人物的心理活动表现于外，使思想感知化。具体来说，《毛猿》的表现主义特征主要表现在以下方面：\n\n一、强调人物的主观精神\n\n整个剧作演示的是扬克精神危机产生发展的全过程：从自信到怀疑到失落到绝望。戏剧冲突主要是扬克自身的内心冲突，他与米尔德丽德的冲突只是一个引子，此后的情节顺乎扬克的心理逻辑而展开，外部情节则被淡化。作者善于把人物的思想、情绪、意念等转化为视觉形象，淋漓尽致地呈现于观众眼前。不仅如此，作者还用外界音响来表现人物的内心奥秘，把人的意识外化为声音，诉诸观众的听觉，使观众获得更真切更深刻的体验。\n\n二、象征、怪诞手法的大量运用\n\n贯穿全剧的毛猿是人的象征。米尔德里德小姐漂亮的白衣服和烧炉工人们污浊的黑身躯象征着脆弱的幻想和丑恶的现实之间极端的对立。剧中的大油船既象征了现代生活，同时又象征了远古的野蛮生活。大炉间象征牢笼，也是现代人所处的尴尬与窘况的象征。象征手法的广泛应用，赋予《毛猿》一剧浓厚的寓言色彩。此外，剧作通过舞台造型和灯光布景的变换以及强烈的音响效果来渲染气氛和突出表现形式。\n\n作者在本文中把主人公扬克作为毛猿这一怪诞的人物形象来写，更形象地突出了现实生活中的人被扭曲的痛苦变态心理。无论是扬克这一人物外形、语言、行动、还是他所处的周围环境，都无疑是适合猿的，而不是人应有的。还有全剧开始的场景描写就明确无误地点明了人是“铁笼中的毛猿”这一题旨。在这座“铁笼”之中，人们光着脊梁，打着赤膊，裸露出毛茸茸的胸脯。他们都快烂醉如泥，却像疯子一样仍然野蛮贪婪地狂饮，边喝边大声叫喊、咒骂和哄笑。所有这些疯狂的喧嚣都膨胀、汇集成一个声音即囚禁在牢笼中的困兽所发出的“迷惑、愤怒和闷声闷气的怒吼”。这个用表现主义的变形手法加工出来的“怪诞”场面为扬克的悲剧提供了令人惊骇的、阴森恐怖的场景。\n\n三、表现人物类型化\n\n《毛猿》中的人物只是某种抽象观念的代表，目的在于揭示一类人的本质、揭示整个社会的矛盾。扬克是美国现代产业工人的代表，他的遭遇反映了现代资本主义社会中劳动人民的悲惨处境。扬克开始时自以为了不起地自我肯定，是建筑在一种自我误解之上。他误认为自己是资本主义社会物质力量的代表，因而否定资产阶级，也否定“社会主义的救世军”。其实真正代表资本主义物质力量的是资产阶级。扬克作为物质财富的创造者，除了被奴役被支配，创造财富供他人享乐外，在现代西方社会根本无立足之地，他等于甚至低于毛猿。\n\n四、内心独白\n\n表现主义剧作家通过内心独白揭示人物的动作和内心活动，从而找到了另一种新的、有效的挖掘人物意识和潜意识的方法。在《毛猿》里，奥尼尔也不排除使用内心独白。不仅如此，他还发展并对内心独白作了改进。奥尼尔的内心独白既是人物内心情感的表达，也是他们的思想过程的外化。然而，这种思想过程通常是无意识的、不合乎逻辑的，并且也是不连续的。人物的内心独白通常会触及他们的深层意识。第八场看上去像是一个对话，但是这决不是扬克和那只猩猩之间的正常对话，因为虽然扬克对猩猩说话，猩猩也做出了反应，扬克也认为猩猩的反应是恰当的回答，但是猩猩并不是真的回答扬克的问题。整个的第八场实际上是扬克的内心独白，表达了他的沮丧、痛苦、无助和无可奈何的心情。\n\n五、音响效果\n\n在《毛猿》里，作者用音响效果这一手法来表达人物的心理活动。在第一场里，扬克对自己总是很自信，认为自己有力气，有优越感。他瞧不起坐在头等舱里的有钱人，认为他们不顶事，只不过是臭皮囊。在其他的烧火工人喝酒、喊叫、咒骂时，扬克坐在远离他们的地方，他在思考。其他的烧火工人们重复着“思考”这个词，嘲笑他，这些人就像古希腊戏剧中的合唱队，用一种公式化的、毫无变化的声音说话，这种音响效果很显然是一种表现主义的手法，目的是要表明这些烧火工人们已被非人化了，他们只不过是一些机器而已。\n\n扬克的悲剧，揭示了现存资本主义制度的不合理，现代人的异化，人与自己生存条件的疏离，人面对强大的外界力量无能为力的困惑、悲愤，人寻找归属而不可得的幻灭感，人在现存的资本主义社会中日益深重的精神危机。","keywords":"强调人物的主观精神 象征 怪诞 表现人物类型化 内心独白 音响效果","note":"本题为2023年南昌大学考研真题。回答这道题，需要我们对表现主义和《毛猿》的特征都有一个整体的认识，需要将二者结合起来。作者在追求戏剧的象征意义时没有主观臆造象征物，而是从现实生活中抽取某种具有象征意义的事件和人物来构成剧本。此外，剧中的基本情节如米尔德里德小姐去机舱时的场面和扬克在“产联”的经历等也是按生活的本来面目加以描写的。相关内容可参考王伟《试析＜毛猿》中的表现主义手法》、牛应《尤金·奥尼尔的（毛猿＞之表现主义特征》。资料可在李凡文学正版群中查看。"},{"id":"276","stars":"★★★","title":"普鲁斯特的美学思想有何特色","body":"普鲁斯特虽然受到柏格森的直接影响，但他的哲学思想属于客观唯心主义。他认为“任何印象都是双重的，一半包裹在客体之中，另一半延伸到我们身上”。他没有完全取消客体，也即承认客观世界的作用。这是普鲁斯特的美学思想的基础。\n\n普鲁斯特从二元论出发强调真实和真实性。一方面他认为真实出自艺术家的本能，另一方面他又指出：“不管生活给我们留下的是怎样的概念，它的物质外形，它给我们留下的印象痕迹，依然是它必不可少的真实性的保证.....心灵倘能从中释出真实，真实便能使心灵臻于更大的完善。”真实与生活彼此相连，密不可分，它的痕迹虽难以捕捉，但这恰恰是真实性所依附的东西。\n\n需要指出，普鲁斯特所理解的现实是指人的内心世界，是指声音或触觉等在人的思想深处所产生的反应。他认为现实分两部分，一是外界事物给人们带来的感觉，二是对这些事物的回忆。两者往往结合在一起，而重点是回忆：“（记忆）感受才构成我们的思想、我们的生活和对我们而言的现实.....真正的艺术......其伟大在于重新找到、重新把握现实，在于使我们认\n\n识到这个离我们的所见所闻很远的现实。”他反对直接描写外界事物，不愿直接记录生活事件，反对实录。他对历史事件是从侧面去表现的。\n\n实际上，普鲁斯特强调的是“心理真实”。回忆、意识的细微变化、思想的深层活动、通感、各种情感的表现、梦幻，等等，就是“心理真实”所包含的内容。他认为作家要“返回隐藏着存在过却又为我们所不知的事物的深处”，“我的大脑是蕴含丰富的矿床，那里有大面积品种繁多的珍贵矿脉”，内心储存的印象就像“负片”一样，需要作家去照射，才能“辨认出所感事物的面貌”。这是内宇宙的新天地，“有多少个标新立异的艺术家，我们就能拥有多少个世界”。世界呈现在人们的头脑里，会产生千差万别的影像，“这种复杂如斯的艺术正是唯一生气勃勃的艺术”。他断言：“我发现这部最重要的书，真正独一无二的书，就通常意义而言，一位大作家并不需要杜撰，既然它已经存在于我们每个人身上，他只要把它转译出来。作家的职责和使命就是笔译者的职责和使命。”他明确提出，作家要表现“自我”，从自我中提取心理真实。他认为写心理真实更难，因为外界事物在内心留下的痕迹不易觉察出来。","keywords":"客观唯心主义 美学思想基础 二元论 强调真实和真实性 人的内心世界 强调的是“心理真实”","note":"从客观唯心主义出发，普鲁斯特承认客观的作用，强调真实和真实性。但他所理解的“现实”是人的内心世界，强调的是“心理真实”。大家从普鲁斯特的美学思想出发，可以更好地理解他的作品，所以对此大家要有所了解。"},{"id":"277","stars":"★★★★","title":"《追忆似水年华》的艺术成就何在","body":"一、作品结构\n\n普鲁斯特认为小说各卷的融合和一致是一种“大师手艺”，他追求的是陀思妥耶夫斯基的多声部方式。回忆往事将作品前后串联起来，而作品每一卷都有自身的内部结构，又与其他部分相连。其中有标题的对称，有叙述的对称，也有地方的对你。\n\n二、人物描写\n\n（一）普鲁斯特认为，生活中的人会变化，所以在他笔下，人物是不定型的、发展的、复杂的，不能以传统的道德标准去衡量他们。小说中写了4代人，这4代人构成继巴尔扎克《人间喜剧》之后，生活在第三共和国的一个人物画廊。\n\n（二）小说绝大部分篇幅以第一人称来叙述，其中，“我”不是作家本人，但又包含了作家某些因素。普鲁斯特对第一称的叙述有重大发展。一是叙述者经常将打听到的事回忆出来，时而叙述多年以后发生的事，时而在回忆中预想今后可能生的事。二是根据后来得知的情况叙述两个同时发生的事，事件见证人的视角代替了叙述者的视角，解决了叙述者不能分的难题。三是以引号等方法展现同一场面中他人的心理活动，弥补叙述者无法洞悉他人心理的困难。四是小说由一个连续声音说出长篇内心独白。\n\n三、时间概念\n\n时间概念在《追忆似水年华》中起着重要作用。（详见“结合具体作品理解 ＇现代文学的核心问题是时间问题＇这句话★★”)\n\n四、意识流手法\n\n普鲁斯特运用了多种多样的意识流手法去挖掘人的内心，倾力表现人物的内心世界，这是一种“复调心理”。\n\n（一）普鲁斯特力图抓住情感的无限丰富性，将各种感觉意念所产生的实感捕捉住，并由此展现由无数个不同时刻的心活动组成的人的一生。这种意识流手法是从味觉、嗅觉、视觉、听觉、触觉出发的，然后产生联想，运用的是通感手法。\n\n（二）采用时序颠倒的手法。普鲁斯特特别喜欢用望远镜来比喻观察往事，他看到的是彼此分开的星星，它们之间似乎有联系，但其实共处于一个整体中。这是柏格森的“各个时刻相互渗透”概念的运用。\n\n（三）抓住不同层次的意识。普鲁斯特认识到人的情感的多样性，他认为人的意识就像平静的大河底下有着回流、漩涡、流，小说家应该挖掘出“最值得我们珍视的”内心意识。\n\n（四）写出意识的自发状态，发现难以表达的心理活动。这种心理带有哲理、宗教色彩，是一种抽象的感受，是客观事在一定情景和条件下引起人们头脑联想和思维的产物。它经常不由自主地产生，却转瞬即逝，不易抓住，需要感觉非常敏的小说家才能把它记录下来。\n\n（五）普鲁斯特善于描写人物在某些特定情形中的状态，如嫉妒、半睡半醒、等待做梦、孤独、离别，还有恋人、孩童特定情绪也都纤毫毕现；同时他能以生动的比喻来描写抽象的情感：用章鱼触手写敏感，用邪恶的鬼怪写醋意，用眼罩写路受到妨碍......；作者的观察也很独到：写斯万盼望奥黛特死去，却不愿她有痛苦；怕别人看到他们俩流泪，这个别人却是「己，以惊人之笔写出了情人极为隐蔽的意识。\n\n（六）写梦。普鲁斯特认为梦与生活相连，是生活必不可少的一部分。他还认为梦境起到象征、回忆和再现现实的作用。他将梦提高到第二个缪斯的地位，可见其重视的程度。\n\n五、语言和句式\n\n（一）普鲁斯特善于把繁复重叠的长句与和谐多彩的句型结合起来，前者为他的风格的主要特色，后者如同众星捧月，起着平衡和多变化的辅助作用。长句与细腻曲折的感情宣泄相适应，和谐多彩的句子则与优美、柔和、自然、机智的表达方式相合拍。与此相应，普鲁斯特喜欢长段落，几页不分段是常见的。\n\n（二）普鲁斯特特别吸收了福楼拜在语言上的创新，他喜欢将3个名词、形容词或动词并列，产生一种节奏美，表现人物的感受逐层深入的过程。他常将关键性的词置于意料不到的地方，产生舒缓起伏、回荡不已的效果。他经常选用严格对称的词组，造成平衡、匀称的语言美。他还在章节和段落的开头或结尾精心构造一些句子，达到意想不到的效果。\n\n（三）普鲁斯特的语言风格具有深刻的文化内涵。它反映了20世纪人们复杂的思维方式。非理性主义的流行促使文学挖掘人复杂的精神世界，于是出现了风格繁复而深奥的作品。这种作品符合知识阶层对高雅、闲适趣味的要求。","keywords":"作品结构 人物描写 时间概念 意识流手法 句式风格 语言创新 节奏美","note":"《追忆似水年华》这部长篇巨著被誉为二十世纪最重要的文学作品之一，它以出色的心灵追索描写、宏大的结构、细腻的人物刻画以及卓越的意识流技巧而风靡世界。这部分内容较为庞杂，其中普鲁斯特的人物描写、意识流手法、时间概念、句式和语言特色都有可能单独命题，大家要灵活应对。"},{"id":"278","stars":"★★★","title":"结合具体作品理解“现代文学的核心问题是时间问题”这句话","body":"意识流小说是20世纪初在西方兴起的一个现代主义文学流派，它不重视描摹客观世界，而着力表现人的内心真实，尤其是人的意识流动，常利用心理时间来组织叙事，大量运用象征暗示、内心独白、自由联想等艺术手法来追踪人的意识流程，展示人迷离恍惚的精神世界。\n\n普鲁斯特的《追忆似水年华》是意识流小说的开山之作。时间概念在其中起着重要作用。除了历史事件不可更改以外，普鲁斯特对时间的处理相当灵活：\n\n一、人物年龄的不确定\n\n《追忆似水年华》中人物年龄前后有出入。阿尔贝蒂娜1897年是17岁，在1908-1909年年龄不变。奥黛特一下子变成50岁。人物年龄的模糊性在小说中随处可见，甚至自相矛盾，但这正是普鲁斯特的用意所在。他认为作家要表现“自我”，从自我中提取心理真实。他认为写心理真实更难，因为外界事物在内心留下的痕迹不易觉察出来。\n\n二、年表改变\n\n阿尔贝蒂娜出现以后，《追忆似水年华》采用了另一种年表，产生了无数日期谬误。除了历史事件没办法更改外，其他事件的发生都存在于作家自己心中。作家利用心理时间来组织叙述，展示人迷离恍惚的精神世界。\n\n三、时态的运用方面\n\n普鲁斯特在时态的运用上煞费苦心。《追忆似水年华》大量用未完成过去时，作用之一等于讲述中的现在时，作用之二是使情节变得真实可信。普鲁斯特又时而插入现在时，使叙述者重新看见、体验时间。现在时的出现将读者抛进了时间里，这是叙述起始的时间，不再是人物经历其现在时的时间。\n\n四、采用时序颠倒的手法\n\n普鲁斯特在《追忆似水年华》中采用时序颠倒的手法，例如斯万的恋爱本来是叙述者听说的事，发生在他出生之前，但这个故事叙述在前，叙述者后来得知，因此被放到后面去叙述。小说时而讲述盖尔芒特家的事，时而跳到无关的事上去，然后又回到正文上来。这种叙述方法表现了无逻辑的回忆。","keywords":"人物年龄的不确定 年表改变 时态的运用 时序颠倒的手法","note":"理解“现代文学的核心问题是时间问题”的实质是让我们解释意识流小说中常常起重要作用的时间概念，而这其中最具有代表性的作品就是《追忆似水年华》，大家可以结合普鲁斯特及《追忆似水年华》相关知识，仔细解释。"},{"id":"279","stars":"★★★★★","title":"《尤利西斯》的艺术探索表现在哪些方面","body":"乔伊斯在《尤利西斯》中进行了广泛、新颖的艺术探索，使其成为西方现代小说中最具实验性、影响最大的杰作之一，这些探索主要表现在以下方面：\n\n一、神话模式\n\n《尤利西斯》这部小说在框架结构、故事情节和主要人物上都同荷马史诗《奥德修纪》形成了一种巧妙的对应关系。（详★★见谈谈《尤利西斯》的神话模式及其寓意★★★★）★★\n\n二、突破传统小说的规范\n\n《尤利西斯》把生活在都柏林的芸芸众生极其真实地呈现在读者面前。为了制造逼真的生活气氛，乔伊斯几乎在小说的每一章中都不厌其烦地提到人物经过的街道。尤其在第十章，作者对主要人物的叙述暂停了一下，放眼都柏林的生活，任意捕捉了一些活生生的镜头，让生活以原生的形态出现在小说中，和传统现实主义小说的典型环境有很大的不同。\n\n和环境与情景一样，小说主要人物的活动（除了第十五章斯蒂芬酒后闯妓院的那部分外）也都普普通通，全不符合传统现实主义小说中典型人物的规范。在传统小说中，是主人公具有明确目的的行动推动了情节的发展，但在《尤利西斯》中，这种情况显然已被一连串在时间上先后承续却很少逻辑联系的日常生活的碎片所淹没、消解，可以说没有任何戏剧性。\n\n三、意识流\n\n意识流小说的叙述焦点已由外部彻底转向内部，即人物的意识，但是人物的意识流不是与外部世界隔绝的、封闭的。一方面，人物过去的经历、感受都零乱地、时断时续地出现在“此时”的意识流中；另一方面，人物的意识流正是由眼前的外部世界引发出的。同时，这种意识流又和传统小说中条理化、逻辑化的内心历程显然有别，它所追踪的是人物意识活动的原始状态，人们的意识流动飘忽不定，不受时间、空间和逻辑的制约。因此，《尤利西斯》既反映了在现代心理学成就启发下人们对自身意识活动的更深入认识，在文学上又是对传统小说心理描写的一个重要突破。总之，在《尤利西斯》中，人物的意识流是在特定的情景下人物内在特征的外化，在跳跃性、随意性之中，处处显露出人物过去的经历、教养、气质。\n\n四、作家“退出”\n\n小说人物仿佛越过了作家而“直接”展示在读者面前。乔伊斯受法国作家杜雅丹《月桂树被砍倒了》的启发，大量地、成功地运用了直接引语。自由直接引语的特点，一是直接，在表面上它抹去了小说叙述人存在的一切痕迹，好像人物的内心语言未经任何中介而直接外显；二是自由，它没有引述句和引号。正是由于直接引语“自由”，小说中的意识叙述和行为叙述就容易融为一体，从而使“故事”和人物的意识活动之间无间断，更为逼真。\n\n五、充分发挥文体的潜在功能\n\n乔伊斯在小说中充分发挥了文体的潜在功能。如第七章有意模拟报纸标题，把整个叙述分割成许多小块，各小块中又常有省略和突如其来的段落，隐喻了报社的气氛；第九章故意采用呆板、迂腐的文体来喻指它所描绘的学术讨论；第12章以浮华夸张的笔调模拟荷马史诗的写法，来写爱尔兰中、下层社会的粗鄙和狭隘，意在取得一种与字面意义相反的效果，这是“夸大陈述”的一个范例。\n\n六、语言知识丰富\n\n作者在小说中除了运用英语以外，还用了法文、意大利文、希腊文、拉丁文、阿拉伯文、梵文等多种文字，并掺杂了不少方言、俚语。作者并非要卖弄自己的语言知识，而是想创造一种真实的生活和文化气氛。","keywords":"神话模式 深刻寓意 突破传统小说的规范 典型的意识流小说 作家退出小说 文体的潜在功能 语言知识丰富","note":""},{"id":"280","stars":"★★★★","title":"谈谈《尤利西斯》的神话模式及其寓意","body":"所谓“神话模式”，就是在创作一部文学作品时，有意识地使其故事、人物、结构，大致与人们熟知的一个神话故事平行发展。《尤利西斯》这部小说在框架结构、故事情节和主要人物上都同荷马史诗《奥德修纪》形成了一种巧妙的对应关系。\n\n一、《尤利西斯》“套用”了荷马史诗《奥德修纪》的框架\n\n小说分为3部，作者最初为它们分别拟订的标题是《忒勒玛基亚》《尤利西斯的漂泊》《回家》，3部共18章。各章最初也有标题，井和《奥德修纪》的部分内容-对应。\n\n二、小说的三个主要人物分别和荷马史诗《奥德修纪》的主要人物比照\n\n作者把现代人布卢姆和他在现代城市都柏林的18个小时的游荡与古代英雄奥德修斯及他在特洛伊战争后回乡途中的十年海上漂泊相比照，两人都是父亲，都四处漂泊、饱经挫折，但是，奥德修斯是一名英雄，历经波折，终于与家人团聚，而\n\n布卢姆则是一个碌碌无为的庸人，面对的是名存实亡的家庭；精神困惑、“失去”了父亲的青年艺术家斯蒂芬和勇往直前寻找父亲的帖雷马科比照，两者都寻找父亲并获得成功，但是，帖雷马科忠于母亲，机智英勇，斯蒂芬却背叛母亲，精神空虚，找到的既不是血缘上也不是精神上的父亲；放纵情欲的玛莉恩和对爱情忠贞不渝的潘奈洛佩对照，潘奈洛佩忠贞机智，而玛莉恩不安于室，过着寻欢作乐的生活。\n\n三、小说的内容、情节也和《奥德修纪》遥相呼应\n\n如第十七章原题为《伊塔刻》，在《奥德修纪》中，伊塔刻是奥德修斯的故乡，奥德修斯在海上经历干难万险乔装回到宫廷后，与那些觊觎他王位和妻子的“求婚者”比箭术，把他们统统杀死，和儿子一起洗雪了仇恨；但是在《尤利西斯》这一章里，布卢姆带上“儿子”斯蒂芬回到他的“伊大嘉”后，虽看到有玛莉恩的情人来过的迹象，但他不仅没有英勇雪耻的行为，反而委曲求全，只能卑微地把偷情者从心中排遣出去了事，等斯蒂芬告辞后，他上楼与妻子交谈了几句就酣然沉入梦乡。\n\n小说中的神话模式体现了作者的深刻寓意。乔伊斯把这部小说定名为《尤利西斯》，意在把它写成一部规模巨大的现代史诗，只不过作者让我们看到，远古神话已变成了平凡、乏味、庸俗、肮脏的都市生活；史诗中的英雄也早已被或者平庸、猥琐，或者精神畸形的人物所取代。布卢姆等现代西方人的心态、行为在古代史诗主人公英雄业绩的对照下显得更为平庸、卑微和渺小。作者还借用古代史诗中丰富的隐喻和象征，使它们成为表现现代社会和现代人的艺术手段，大大加深了这部现代小说的思想和艺术内涵。","keywords":"框架 主要人物 内容、情节 丰富的隐喻和象征","note":"2023年杭州师范大学考研真题中出现”《尤利西斯》戏仿了哪一部古希腊作品”这道题目，可以用这部分知识进行作答。《尤利西斯》借用《奥德修纪》中的同名英雄（罗马名）作为书名，把古希腊英雄在海上漂泊十年，最后终于返回家乡的故事予以现代化表现，并反其意而用之，主要是为了形成一种反差。将远古神话变得平凡，让史诗中的英雄被平庸、猥琐的人物所取代，这样更突出地批判了现代社会和现代人。"},{"id":"281","stars":"★★★★★","title":"《喧哗与骚动》有哪些艺术特点","body":"《喧哗与骚动》通过对康普生家族的分崩离析和行将灭亡命运的描写，真实地展现了美国南方社会的现状。其艺术特点如下：\n\n一、多角度的叙述方法\n\n福克纳采用了多角度的叙述方法，让三兄弟即班吉、昆丁与杰生各自讲一遍自己的故事，随后又自己用“全能角度”，以迪尔西为主线讲剩下的故事。故事表面很乱，实际却有内在秩序。（详见“以《喧哗与骚动》为例分析福克纳小说的＇多★★重叙述＇技巧★★★”）★★\n\n二、“意识流”\n\n《喧哗与骚动》前三章就是用一个又一个的意识的呈现来叙述故事与刻画人物的。福克纳采取与传统现实主义通过外表描写逐渐深入人物内心相颠倒的方式。他首先提供给读者的是混沌迷乱的内心世界，然后逐步带引读者穿过层层迷雾，最终走到明朗、清晰的客观世界里来。这样的印象自有其新鲜、独特之处。\n\n福克纳之所以大量采用意识流表现手法，除受乔伊斯等现代作家的影响外，主要还因为这样做能够更好地表达他所写的社会生活，能够更好地刻画他笔下的特殊人物。他所写的是南方一个世家的没落，这里充斥着一种颓败的气氛，理性的思维与清醒的行为反倒是罕见的例外。小说前3章的叙述者都是心智不健全的人。作者通过展现他们不正常的思想活动，反而写出了一系列相当鲜明、饱满的人物形象。\n\n三、“神话模式”\n\n所谓“神话模式”，就是在创作一部文学作品时，有意识地使其故事、人物、结构，大致与人们熟知的一个神话故事平行发展。在《喧哗与骚动》中，第一二三四章的标题都与基督受难的4个主要日子有关联。不仅如此，从每一章的内容里，也都隐约可以找到与《圣经·新约》中所记基督的遭遇大致平行之处。在这里，福克纳似乎有意以基督的庄严、神圣来反衬康普生家子孙的猥琐，而他们的自私、得不到爱、受挫、失败、互相仇视，也说明了“现代人”违反了基督死前对门徒所作的“要你们彼此相爱”的教导。福克纳运用这样的神话模式手法，除了给他的作品增添一层反讽色彩外，也有使他的故事从日常琐事中突破出来，成为一个探讨人类命运问题的寓言的意思。","keywords":"多角度的叙述方法“意识流”手法“神话模式”","note":"《喧哗与骚动》采用多角度叙述方法、意识流手法和“神话模式”，很容易让我们想到了乔伊斯。很明显，福克纳《喧哗与骚动》的创作是受到了乔伊斯等现代主义作家影响的，二人身上体现着现代主义作家的共同特征，所以大家可以将二者比较记忆。"},{"id":"282","stars":"★★★","title":"以《喧哗与骚动》为例分析福克纳小说的“多重叙述”技巧","body":"《喧哗与骚动》典型地体现出了福克纳多重叙述的现代派叙事手法。\n\n一、《喧哗与骚动》前三部分通过康普生家庭三个儿子的视角，从其各自所思、所想、所看、所感等方面向读者提供了一些感性零碎的材料以及模糊不清的家族琐事，但三个叙述者的声音都集中在这个家庭的女儿凯蒂身上，反映了其生活的经万以及与周围的人之间的关系。\n\n班吉的叙述随其意识的流动随时切换，重点在于他和姐姐的深厚情感以及失去姐姐后感到无法满足的愿望和无法解脱的痛苦。\n\n昆丁的叙述时间跨度比较小，主要是在其妹妹凯蒂失贞后、结婚前后和自杀前的心理之间的跳动。\n\n杰生的叙述不像前面两部分那样朦胧和晦涩，大多条理清楚和合乎逻辑。\n\n二、福克纳又用“全能角度”，以迪尔西为主线讲剩下的故事，叙述了康普生家庭的后续故事，增强了小说的层次感和透明度，填补了前三部分因意识流造成的空白，使无序混乱、支离破碎的故事情节显得完整协调。\n\n故事表面上很乱，实际上却有内在的秩序。福克纳采用“CABD”这样的方式，使4个部分的叙述者出现的时序错乱。但他们所讲的事却合乎正常的时序，而且衔接得颇为紧密。班吉“讲”的是康普生家孩子童年时的事。昆丁“讲”的是1910年6月2日的事与不久前的事。杰生“讲”的是他当家后康普生家的情况。而迪尔西所“讲”的纯粹是“当前”的事。4个叙述者各自描绘了他们印象中各个人物的形象，同时也自然而然地刻画了自己的形象。\n\n读者在读作品时把这众多的图景“组装”起来，形成一个全景图，这幅图画不是作者强加给读者，而是读者自己经过一定的艺术再创造后获得的，已掺进读者自己的理解和想象，自然也更为读者本人所接受。\n\n★★283．吴晓东在《从卡夫卡到昆德拉》中评价《喧哗与骚动》中的班吉为“伟大的白痴”，阐释这部作品的“白痴叙事”（26江南大学）★★★★★★\n\n《喧哗与骚动》的开篇，作家运用了最有创新意义的白痴叙事，以一个只有三岁智商的白痴来讲述故事。这无疑是一种新颖而冒险的尝试，但也使得开篇叙事取得了巨大的成功，成为《喧哗与骚动》中最为学界称道的创新文本。\n\n一、“白痴叙事”的表现\n\n（一）印象主义的叙述笔法\n\n班吉是康普生的小儿子，一个先天性白痴。他的生理条件决定了其“意识流”的特殊个性：一个由完全处于被动状态的脑所记录下来未经消化的感官印象片断，杂沓地并列堆砌在一起。他不是在理智地叙述故事，而是像一部摄像机似的将所见所闻录制下来，不加任何个人因素。福克纳在表现班吉这个现代小说史上罕见的人物时，别出心裁地模仿一个精神病患者的感觉方式，用印象主义的叙述笔法向读者展示出一个混乱无序的精神世界，从而更加生动、真实地刻画了人物。\n\n（二）自由联想的结构方式\n\n班吉由于“愚钝到了白痴的边缘”，无法与别人交流，他的语言能力不超出直观表象的范围，用语极为浅近而简单，直接与所见所闻所嗅相关联。句子结构多是叙述式、直陈式，连反问句都没有。有的是从一个思想意识活动跳到另一个思想意识活动，还包括潜意识、下意识活动。福克纳无视逻辑思维和语言表达的基本规律，故意用自由联想的方式将不同时间和不同空间内发生的事件混为一体，使作品显得万花筒般的纷繁与杂乱。\n\n二、“白痴叙事”的效果\n\n福克纳在小说开篇的“班吉部分”采用了“白痴叙事”，取得了非常优秀的效果，具体有以下方面：\n\n（一）“班吉部分”实际上是小说较为客观的故事展开部分。33岁的白痴班吉不会讲话，也不会主动记忆和理解，更没有分辨因果等逻辑关系的能力，因为他的智力水平只相当于一个3岁的孩子，他对外部世界的“观察”是被动接受，不含任何主观判断和评论。他只是像部摄像机似的，用令人惊异的准确性，几乎纯客观地录下他周围发生的一切。而心智正常的昆丁和杰生，在他们的意识流中，给读者提供的却是被各自的主观意念大大歪曲了的事物印象。其结果是，“班吉部分”读起来，更接近无所不知、无所不在的作者从全能角度叙述的故事：所不同的是，按常规应该用第三人称“他”的地方，被作者换上了第一人称“我”。这样，读者一开始就能对这个家庭所发生的一切得到一个较为客观的印象，因而对故事中的人和事作出比较不带偏见的判断。\n\n（二）班吉的意识流“录示”了康普生家族故事中几乎所有的重要事件，如30年前他的改换名字、后来祖母的死、姐姐凯蒂的失贞、结婚、哥哥昆丁和父亲的相继去世等等，直到“目前”-1928年4月7日侄女小昆丁的私奔。与班吉比起来，昆丁和杰生的意识流只分别反映了家族没落史中相对小的部分。昆丁已于1910年自杀，因此他的意识流不可能反映他死后18年来康普生家发生的变化；杰生是个实利主义者和虐待狂，他的意识流几乎全被积聚钱财、诅咒别人和报复泄愤占据了一这又大多发生在1912年他当家以后。因此，只有“班吉部分”包含了较长时期的、因而也较全面的家庭故事，所以它比昆丁或杰生的意识流更适于放在全书之首，以便使读者一开始就得到较为完整的故事线索。\n\n（三）在任何人的眼里，班吉-这个又高又壮的白痴，成天不是哼哼唧唧，就是吼叫哭闹，再不就是淌口水，实在是个令人恶心的形象：而凯蒂-这个沉沦到靠卖淫来赚取女儿的赡养费，最后成了一名纳粹将军的情妇的女人，也似乎不可能取得人们的同情与理解。然而，福克纳让读者一开始就通过班吉的眼睛来看周围的世界，使读者体会到他失去姐姐凯蒂的关怀之后所“感到”的悲哀，这样，就使读者不带任何先入之见地对这两个人物产生作者所期望的同情和较为积极的看法。\n\n（四）将“班吉部分”作为小说的第一部分，对结构的平衡和对称，也起着很大的作用。因为，“班吉部分”与作者从全能角度叙述的第四部分-“迪尔西部分”在客观性上更为接近；而夹在这两个客观部分中间的第二、三部分则是分别被昆丁和杰生的个人意念所扭曲了的极其主观的内心独白。这样，小说在结构上就取得了“客观部分一主观部分一主观部分一客观部分”这种巧妙的平衡与对称，也称为“对位式结构”。\n\n《喧哗与骚动》中班吉篇的意识流创作艺术，无疑是福克纳艺术生涯的一个亮点，从而也使他当之无愧地赢得了文学史上的超然地位。\n\n后现代主义文学","keywords":"多角度叙述展开故事情节 内在的秩序 合乎正常的时序 为读者本人所接受\n表现 印象主义的叙述笔法 自由联想的结构方式 效果 较为客观“录示”重要事件 同情和较为积极的看法结构的平衡和对称","note":"本题为2023年北京外国语大学考研真题。多重叙述是福克纳现代派手法中比较重要的一个特征，在《喧哗与骚动》中主要体现在通过多角度叙述展开故事情节。要注意的是，虽然是多角度展开，但不同叙述内容之间有其内在的秩序。运用多重叙述，可以显示世界的复杂多样性，也可以使作品更容易为读者所接受。\n回答这道题，需要我们对《喧哗与骚动》这部作品的内容和特点有着非常深入的认识才可以。所谓“白痴叙事”，其实就是指小说开篇以班吉的视角展开叙述。与之类似的还有“疯癫叙事”等。相关内容可以参考傅俊《痴人说梦-“喧哗与骚动”中意识流主体》。"},{"id":"283","stars":"★★★★","title":"吴晓东在《从卡夫卡到昆德拉》中评价《喧哗与骚动》中的班吉为\"伟大的白痴\"，阐释这部作品的\"白痴叙事\"（26江南大学）","body":"《喧哗与骚动》的开篇，作家运用了最有创新意义的白痴叙事，以一个只有三岁智商的白痴来讲述故事。这无疑是一种新颖而冒险的尝试，但也使得开篇叙事取得了巨大的成功，成为《喧哗与骚动》中最为学界称道的创新文本。\n\n一、“白痴叙事”的表现\n\n（一）印象主义的叙述笔法\n\n班吉是康普生的小儿子，一个先天性白痴。他的生理条件决定了其“意识流”的特殊个性：一个由完全处于被动状态的脑所记录下来未经消化的感官印象片断，杂沓地并列堆砌在一起。他不是在理智地叙述故事，而是像一部摄像机似的将所见所闻录制下来，不加任何个人因素。福克纳在表现班吉这个现代小说史上罕见的人物时，别出心裁地模仿一个精神病患者的感觉方式，用印象主义的叙述笔法向读者展示出一个混乱无序的精神世界，从而更加生动、真实地刻画了人物。\n\n（二）自由联想的结构方式\n\n班吉由于“愚钝到了白痴的边缘”，无法与别人交流，他的语言能力不超出直观表象的范围，用语极为浅近而简单，直接与所见所闻所嗅相关联。句子结构多是叙述式、直陈式，连反问句都没有。有的是从一个思想意识活动跳到另一个思想意识活动，还包括潜意识、下意识活动。福克纳无视逻辑思维和语言表达的基本规律，故意用自由联想的方式将不同时间和不同空间内发生的事件混为一体，使作品显得万花筒般的纷繁与杂乱。\n\n二、“白痴叙事”的效果\n\n福克纳在小说开篇的“班吉部分”采用了“白痴叙事”，取得了非常优秀的效果，具体有以下方面：（一）“班吉部分”实际上是小说较为客观的故事展开部分。33岁的白痴班吉不会讲话，也不会主动记忆和理解，更没有分辨因果等逻辑关系的能力，因为他的智力水平只相当于一个3岁的孩子，他对外部世界的“观察”是被动接受，不含任何主观判断和评论。他只是像部摄像机似的，用令人惊异的准确性，几乎纯客观地录下他周围发生的一切。而心智正常的昆丁和杰生，在他们的意识流中，给读者提供的却是被各自的主观意念大大歪曲了的事物印象。其结果是，“班吉部分”读起来，更接近无所不知、无所不在的作者从全能角度叙述的故事：所不同的是，按常规应该用第三人称“他”的地方，被作者换上了第一人称“我”。这样，读者一开始就能对这个家庭所发生的一切得到一个较为客观的印象，因而对故事中的人和事作出比较不带偏见的判断。\n\n（二）班吉的意识流“录示”了康普生家族故事中几乎所有的重要事件，如30年前他的改换名字、后来祖母的死、姐姐凯蒂的失贞、结婚、哥哥昆丁和父亲的相继去世等等，直到“目前”-1928年4月7日侄女小昆丁的私奔。与班吉比起来，昆丁和杰生的意识流只分别反映了家族没落史中相对小的部分。昆丁已于1910年自杀，因此他的意识流不可能反映他死后18年来康普生家发生的变化；杰生是个实利主义者和虐待狂，他的意识流几乎全被积聚钱财、诅咒别人和报复泄愤占据了一这又大多发生在1912年他当家以后。因此，只有“班吉部分”包含了较长时期的、因而也较全面的家庭故事，所以它比昆丁或杰生的意识流更适于放在全书之首，以便使读者一开始就得到较为完整的故事线索。\n\n（三）在任何人的眼里，班吉-这个又高又壮的白痴，成天不是哼哼唧唧，就是吼叫哭闹，再不就是淌口水，实在是个令人恶心的形象：而凯蒂-这个沉沦到靠卖淫来赚取女儿的赡养费，最后成了一名纳粹将军的情妇的女人，也似乎不可能取得人们的同情与理解。然而，福克纳让读者一开始就通过班吉的眼睛来看周围的世界，使读者体会到他失去姐姐凯蒂的关怀之后所“感到”的悲哀，这样，就使读者不带任何先入之见地对这两个人物产生作者所期望的同情和较为积极的看法。\n\n（四）将“班吉部分”作为小说的第一部分，对结构的平衡和对称，也起着很大的作用。因为，“班吉部分”与作者从全能角度叙述的第四部分-“迪尔西部分”在客观性上更为接近；而夹在这两个客观部分中间的第二、三部分则是分别被昆丁和杰生的个人意念所扭曲了的极其主观的内心独白。这样，小说在结构上就取得了“客观部分一主观部分一主观部分一客观部分”这种巧妙的平衡与对称，也称为“对位式结构”。\n\n《喧哗与骚动》中班吉篇的意识流创作艺术，无疑是福克纳艺术生涯的一个亮点，从而也使他当之无愧地赢得了文学史上的超然地位。","keywords":"表现 印象主义的叙述笔法 自由联想的结构方式 效果 较为客观“录示”重要事件 同情和较为积极的看法结构的平衡和对称","note":"回答这道题，需要我们对《喧哗与骚动》这部作品的内容和特点有着非常深入的认识才可以。所谓“白痴叙事”，其实就是指小说开篇以班吉的视角展开叙述。与之类似的还有“疯癫叙事”等。相关内容可以参考傅俊《痴人说梦-“喧哗与骚动”中意识流主体》。"},{"id":"284","stars":"★★★★★","title":"后现代主义文学的基本特征（25浙江大学）","body":"后现代文化是一种没有中心的多元文化，它宽容各种不同的标准。后现代文学实践和后现代的理论表述者们的理论逻辑也存在明显矛盾。但整体来看，也可以归纳出一些基本特征：\n\n一、反传统，“反文学”\n\n后现代主义把现代主义本来就很激进的反叛推向了极端。它不但从根本上否定“旧”传统，而且要摒弃现代主义的“新”规范。后现代主义文学被视为一种“缺乏公认的父母亲的文学”，“无论死去或活着的都没有”，它试图对小说、诗歌和戏剧的传统形式乃至“叙述”本身进行解构；因而，后现代主义文学必然是一种无视任何既定规范的、极度自由的“破坏性”文学，是“反小说”和“反戏剧”，即某种意义上的“反文学”。\n\n二、不再追求终极价值\n\n后现代主义不再追求终极价值，在他们看来，一切传统意义上对崇高事物的信念都是话语的短暂产物，不值得“真诚”“严肃”地对待它们；客观世界和人自身都被异化了，历史失去了方向和意义，社会体系不可改变；他们不愿意对重大的社会、政治、道德、美学问题进行严肃认真的思考，他们不仅无视对这些问题的关切，而且无视这些问题本身。他们不再试图给世界以意义。\n\n三、“零度写作”\n\n后现代主义反对现代主义关于深度的“神话”，拒斥孤独感、焦灼感之类的深沉意识，将其消解或平面化；它怀疑乃至否定文学的价值论和本体论。在它看来，写作消失了内容，转向中立性，即所谓“零度写作”，换句话说，写作转向了它自身，作家只能把话语、语言结构当成他们为所欲为的领地，在形式上不断花样翻新，作家的创作和读者作为“创作”的阅读都是为了享受创作（阅读）带来的欢悦，是一种表演、操作。\n\n四、“不确定性”\n\n如果现代主义毕竟还把世界看成是一个整体，那么后现代主义则干脆视世界为“碎片”；如果现代主义作品中还有一种中心意义和为这种中心意义服务的结构，那么后现代主义则否定这种中心和结构的存在。不但如此，后现代主义作家还蓄意让作品中各种成分互相分解、颠覆，让作品无终极意义可以寻求。在后现代主义小说中，结构扑朔迷离，“故事”前后矛盾，难知究竟，人物的行为缺乏说得通的动机，这就是人们常说的后现代主义的“不确定性”。\n\n五、向大众文学的靠拢\n\n后现代主义要打破精英文学和大众文学的界限，出现了明显的向大众文学和亚文学靠拢的倾向；有的作品干脆以大众化的文化消费品的形式出现，并试图模糊文学与非文学的界线。\n\n六、两种不同趋向的写作原则和风格\n\n后现代主义的写作原则和风格显现出两种十分不同的趋向：一种是抛弃现代主义作家的艰深文学实验，从通俗文学、科幻小说、美国西部小说以及其他一些被看成是亚文学的体裁和作品中汲取养料，试图填平精英文学和大众文学之间的鸿沟；另一种是继续推进现代主义的文学实验并且超越它，常见的情况除前所述外还有：矛盾、交替、不连贯性和任意性、极度、短路、反体裁、话语膨胀。冷漠性也是后现代主义风格的重要特征。\n\n七、对西方整个的思想和文化传统及社会机制提出了尖锐的责难\n\n从现实的、文学的层面说，后现代主义虽然具有偏激、广泛的文化否定主义和虚无主义倾向，但当不少西方人陶醉于第二次世界大战后西方社会的繁荣、复兴和文学领域中现代主义的成就时，作为一种“颠覆性”的思潮，后现代主义却对此井进而对西方整个的思想和文化传统及社会机制提出了尖锐的责难，在后现代作品表面的冷漠和玩世不恭的后面，人们不难觉察到后现代人精神上的迷茫、紊乱和痛苦，引发人们去思考西方后现代社会的各种问题，这是不可忽视的。\n\n取。此外，“后现代主义、零度写作”等名词要注意积累。】","keywords":"反文学 不再追求终极价值 零度写作 不确定性 向大众文学的靠拢 写作原则和风格的两种趋向 尖锐的责难","note":""},{"id":"285","stars":"★★★★★","title":"谈谈现代主义与后现代主义的关系","body":"后现代主义虽与现代主义有密切的联系，但它又是与现代主义显然有别的新的文化倾向和文学思潮。现代主义与后现代主义的关系，主要表现在以下方面：\n\n一、联系\n\n（一）后现代主义文学继承了现代主义文学反传统的特征\n\n现代主义文学是激烈反传统的，后现代主义则把现代主义本来就很激进的反叛推向了极端。就某种意义说，正是现代主义孕育了后现代主义，后者是由前者脱胎而来。\n\n（二）后现代主义继续了现代主义的文学实验\n\n后现代主义的写作原则和风格显现出两种十分不同的趋向，其中一种是继续推进现代主义的文学实验并且超越它。常见的情况有：矛盾、交替、不连贯性和任意性、极度、短路、反体裁、话语膨胀。冷漠性也是后现代主义风格的重要特征。\n\n二、区别\n\n对文学的本质、社会与美学价值、艺术形式，许多后现代主义作家、批评家作出了与现代主义文学观念不同的阐释，主要表现在以下方面：\n\n（一）哲学基础不同\n\n后现代主义深受各种非理性主义的影响，这和现代主义是相似的，但进一步看又有很大不同。现代主义的哲学基础是叔本华、柏格森、尼采、弗洛伊德等人的思想和学说，而后现代主义主要受存在主义，特别是海德格尔哲学的影响，并和后结构主义合流。\n\n（二）反传统的目的和程度不同\n\n现代主义文学是激烈反传统的，但现代主义文学在摒弃传统文学（主要是现实主义文学）的创作原则之后还试图建立起自己的规则和范例，后现代主义则把这本来就很激进的反叛推向极端。它不但从根本上否定“旧”传统，而且要摒弃现代主义的“新”规范。后现代主义试图对小说、诗歌和戏剧的传统形式乃至“叙述”本身进行解构，是一种无视任何既定规范、极度自由的“破坏性”文学，是“反小说”和“反戏剧”，即某种意义上的“反文学”。\n\n（三）对待终极价值的态度不同\n\n过去时代的杰出的作家、思想家们在把原有的神圣事物“非神圣化”的同时，还力图创造出另一种神圣，例如用新的教义代替旧的教义，以自由、平等、博爱代替旧的社会信念，这种情况一直持续到现代主义时代。在某种意义上，现代主义是在“上帝死了”以后处于“荒原”中的作家要创造出新的神圣来所做的努力；但后现代主义作家则不同。后现代主义不再追求终极价值，在他们看来，一切传统意义上对崇高事物的信念都是话语的短暂产物，不值得“真诚”“严肃”地对待它们；客观世界和人自身都被异化了，历史失去了方向和意义，社会体系不可改变；他们不愿意对重大的社会、政治、道德、美学问题进行严肃认真的思考，他们不仅无视对这些问题的关切，而且无视这些问题本身。他们不再试图给世界以意义。\n\n（四）写作态度不同\n\n现代主义文学作品具有深沉的内容，存在一种隐藏在表面之下的意义，吁请读者理解，而且可以被理解。后现代主义反对现代主义关于深度的“神话”，拒斥孤独感、焦灼感之类的深沉意识，将其消解或平面化；它怀疑乃至否定文学的价值论和本体论。在它看来，写作消失了内容，转向中立性，即所谓“零度写作”，换句话说，写作转向了它自身。作家只能把话语、语言结构当成他们为所欲为的领地，在形式上不断花样翻新，作家的创作和读者作为“创作”的阅读都是为了享受创作（阅读）带来的欢悦，是一种表演、操作。\n\n（五）对待中心和结构的态度不同\n\n如果现代主义还把世界看成是一个整体，那么后现代主义则干脆视世界为“碎片”；如果现代主义作品中还有一种中心意义和为这种中心意义服务的结构，那么后现代主义则否定这种中心和结构的存在。不但如此，后现代主义作家还蓄意让作品中各种成分互相分解、颠覆，让作品无终极意义可以寻求。\n\n（六）对待大众文学的态度不同\n\n现代主义文学的精英意识和优雅的形式使它和通俗文学泾渭分明，而后现代主义文学则要打破精英文学和大众文学的界限，出现了明显的向大众文学和亚文学靠拢的倾向；有的作品干脆以大众化的文化消费品的形式出现，并试图模糊文学与非\n\n文学的界线。","keywords":"联系 反传统的特征 文学实验 区别 哲学基础 反传统的目的和程度 对待终极价值的态度 写作态度 对待中心和结构的态度 对待大众文学的态度","note":"23年北京大学，24年同济大学、西安外国语大学都对相关内容做了考查。后现代主义是在现代主义的基础上发展起来的。但是，后现代主义显示出了对现代主义的“叛逆”，二者实质上已经是两种不同的文学创作倾向。通过对二者的比较，我们可以更好地把握其各自的特征。"},{"id":"286","stars":"★★★","title":"谈谈后现代主义的哲学基础","body":"后现代主义深受各种非理性主义的影响，这和现代主义是相似的，但进一步看又有很大不同。现代主义的哲学基础是叔本华、柏格森、尼采、弗洛伊德等人的思想和学说，而后现代主义主要受存在主义，特别是海德格尔哲学的影响，并和后结构主义合流。\n\n一、存在主义\n\n存在主义哲学反映了西方现代人对存在的困惑，它还试图赋予处于荒诞世界中的人以崇高的意义。人的存在先于本质、存在的荒诞性、自由选择的意义等是存在主义的基本命题。海德格尔认为，个人的存在是与一般的存在物的存在根本不同的，前者是主动的、积极的，因为人（个体的人）能从自己内心体验中领悟到自己是如何在一个流动、变化、生成的过程中存在的，后者则是被动的，只能听任外界的摆布。海德格尔不再把理解视为一种认识方法，而把它看成是人的存在方式本身，它不但是主观的，而且受制于先在的理解，即“前理解”（它们又是一系列主观性产生的先验图式），因而理解不可能是客观的，不具有客观有效性。他还对技术的本质作了深入的思考。他认为出于对自然的畏惧，人要依靠技术的保护，但到头来技术却又加深了人的无根无家的无保护状态。\n\n二、解构主义\n\n解构主义试图借用结构主义的术语和概念来推翻结构主义的理论基础，是一种彻底的怀疑主义和彻底的虚无主义。它要消解几千年来的西方传统的哲学观念，否定一切终极永恒的东西，连历史、真理都被它视为“话语”（权威）“生产”出来的；它否定整体性、确定性、目的论一类的概念，拒绝一切试图重设深度模式的哲学和重设中心的企图，主张无限制的开放性、多元性与相对性。关于文学，它否定作品在它们使用的语言范畴内可能确立自己的结构、整体性和含义。\n\n三、后结构主义\n\n后结构主义的理论家认为，在文学研究中，结构的观念是目的论的产物，因为结构被看成是由某种特定的目的或中心确立并为它们服务的构造，是使目的呈现于作品全过程的一种手段，是目的和中心建立并组织起结构；人们必须先行假定有某种终极原因或意义，才能发现结构；他们认为这种先行的假定是“人为的、有限的语言游戏的概念”，是出自需要，反映了一种追求绝对真理和超验意义的欲望。后结构主义的代表人物雅克·德里达一方面承认作品表达出意义，因而是可读的，但另一方面又认为任何作品都包含着不可调和的矛盾，从而使作品的意义捉摸不定；只要通过后结构主义的阅读方法，人们不难发现一切作品在事实上都是在自我解构，而批评家们之所以侈谈结构，是因为他们无视事实，无视文学作品中往往存在着许多构造、格局，它们于目的和中心无补，甚至破坏了作品自身的基础和整体性而被“目的”和“中心”所摒弃。后结构主义试图以不断创新的、快意的阅读代替对文本的不断回顾，这样，文学批评的目标从阐释结果就移向了活动本身。","keywords":"非理性主义 存在主义哲学 解构主义 后结构主义","note":"后现代主义文学的哲学基础是存在主义、解构主义和后结构主义，这些思想影响了后现代主义作家的文学创作。通过对这些哲学思想的分析，我们可以更好地掌握后现代主义文学的特征。"},{"id":"287","stars":"★★★★","title":"描述后现代文学的流派，主要特征和代表作品","body":"一、存在主义文学\n\n存在主义文学是在存在主义哲学的基础上形成的文学流派，第二次世界大战前夕产生于法国，战后盛行于整个西方世界。存在主义文学总表现出对人的生存状态的深切关注，其基本主题是揭露世界和人的存在的荒诞性，肯定人的存在先于人的本质，表现人在荒诞、绝望的境况中的精神自由和自由选择；这是存在主义文学在思想内容方面的最突出的特点。\n\n存在主义者抽出社会现象的历史性，对它们作架空的、抽象的、超历史的推论；他们把人的自由绝对化，否定人的思想和行为要受外部世界和客观规律性的支配与制约，这正是历史唯心主义和主观唯心主义的表现；但存在主义关于世界是荒诞\n\n的这一论定，显然又包含着对西方社会的清醒认识。存在主义还反对宿命论，它并不只是要人意识到自己陷入了精神的绝境，还试图以自我选择给在荒诞中苦苦挣扎的人们指出一条出路。这是它的积极意义所在。\n\n法国的让-保罗·萨特、阿尔贝·加缪是存在主义文学的最重要的代表作家。加缪著有《局外人》《鼠疫》。德波伏瓦的《女客》《他人的血》和《一代名流》，以及理论著作《第二性》，诺曼·梅勒的《白色黑人》和《一场美国梦》都是存在主义的重要作品。法国的雷蒙·盖夫、莫里斯·梅尔洛-蓬蒂和美国的索尔·贝娄、英国的戈尔丁等也是具有存在主义倾向、色彩的作家。\n\n二、荒诞派戏剧\n\n荒诞戏剧派是第二次世界大战后不久产生于法国，而后流行于许多西方国家的戏剧流派。荒诞派戏剧使荒诞本身戏剧化，使戏剧形式荒诞化，它的主要特点是：它是“对某些存在主义和存在主义之后的哲学概念的艺术吸收”，揭示了世界、人的处境和人自身的生存状态的荒诞性；它突破了传统戏剧的一切基本规律，如完全丢弃了在传统戏剧中必不可少的情节和结构，以破碎的舞台形象代替性格鲜明生动的人物，以荒诞的甚至语无伦次的“梦呓”代替传统戏剧中机智的应答和犀利的对话等。从这个角度说，荒诞派戏剧也是存在主义在舞台艺术上的变体。\n\n法国的欧仁·尤内斯库和塞缪尔·贝克特是荒诞派戏剧的主要代表。尤内斯库著有《秃头歌女》《椅子》《犀牛》，贝克特著有《等待戈多》。让·热奈的《女仆》、阿瑟·阿达莫夫的《弹子球机器》，英国哈洛尔德·品特的《生日晚会》，美国的爱德华·阿尔比的《美国之梦》等均是重要作品。\n\n三、新小说\n\n新小说形成于50年代的法国，是一个没有统一美学纲领的松散的俱乐部式的文学团体。新小说家们贬低文学的思想性和倾向性，对文学的社会意义和道德功能没有兴趣，他们关切的是技巧和表现手法。他们对小说和小说技巧的看法、文学实验都是激烈反传统的，他们要彻底打破传统小说模式，全面革新小说艺术。对此，他们进行了多方面的探索：如取消人物在小说中的中心地位；情节往往含混不清，甚至互相矛盾，难以确定；完全打乱传统小说中那种井然有序的结构；在人称、视点上进行各种新颖的实验；有的甚至把绘画的原则应用到小说创作中，要把小说由“时间的艺术”变为“空间的艺术”，等等。\n\n新小说家对“真实”的看法完全不同于传统作家。以萨洛特为代表的一些作家主张写人物意识深处的、原始状态的真实，以及以此为基础的人与人之间的敏感的感应关系；而以罗伯-格里耶为代表的“视觉派”则强调写外在的真实，热衷于对“物”作细致的描绘，为此还特别注意运用表明视觉的和纯描写性的词汇进行写作，有“物本主义”的倾向。他们还大胆进行各种语言革新。\n\n娜塔丽·萨洛特、阿兰·罗伯-格里耶、米歇尔·布托尔、克洛德·西蒙是最重要的新小说家。萨洛特的论文集《怀疑的时代》被人们视为新小说的宣言书，她的代表作是《无名氏肖像画》。罗伯-格里耶的《橡皮》《窥视者》，布托尔的《变》，西蒙的《弗兰德公路》等都是最重要的新小说。\n\n四、“垮掉的一代”\n\n“垮掉的一代”在第二次世界大战后出现于美国，这是一群松散地结合在一起的年轻人，他们唯一共同之处是他们对社会公认的一切都抱背道而驰的态度。它的基本特征是：在思想倾向上，“垮掉的一代”深受欧洲存在主义的某些观念的影响，他们关心的中心问题是个人在当代社会中的生存状态，抗议社会对他们的压抑，但往往以颓废、堕落、犯罪来表现他们的“脱俗”，与传统的价值和行为规范抗衡；在艺术上，他们标榜“以全盘否定高雅文化为特点”，追求无节制的自我放纵，作品的结构无拘无束乃至杂乱无章，语言粗糙甚至粗鄙。\n\n“垮掉的一代”虽然包含了大量不健康的因素，但这些作家要从新的角度重新认识世界，通过他们对美国社会的反叛和他们焦灼、寻求、迷茫、悲凉的眼光，我们可以加深对当代美国社会的理解；它的粗犷自然的风格在当代美国文学中也留下了一定的影响。\n\n杰克·凯鲁亚克的《在路上》、艾伦·金斯堡的《嚎叫》是“垮掉的一代”的代表作。此外，威廉·巴罗斯和格雷戈里·柯尔索也是有影响的“垮掉的一代”作家。\n\n五、黑色幽默\n\n黑色幽默是六七十年代主要流行于美国的文学流派。它的基本特征是：在思想上，它深受存在主义的影响，大多数黑色幽默作家都关注现实，对现实的荒诞有一种深沉的痛苦和恼怒。所谓黑色幽默，就是阴郁的幽默、绞刑架下的幽默。它以表面上轻松、调侃、玩世不恭，实则无可奈何的语调，叙述沉郁而可怖的故事，从而产生荒诞不经、滑稽可笑的喜剧效果。它既是一种带悲剧色彩的喜剧，也是以喜剧形式“上演”的悲剧；小说的主人公往往是性格乖僻的“反英雄”，作者既同情他\n\n们的处境，又对他们加以适度的嘲弄；情节结构具有非逻辑性，作者甚至有意识地突出情节中各种不可调和的矛盾，作为小说寓意的基础。\n\n约瑟夫·海勒和小库尔特冯尼格特是黑色幽默的代表作家。冯尼格特著有《第五号屠宰场》《顶呱呱的早餐》。托马斯品钦的《万有引力之虹》、约翰·巴思的《烟草经纪人》都是重要的黑色幽默小说。\n\n六、魔幻现实主义\n\n魔幻现实主义形成于拉丁美洲，60年代以后取得了辉煌的成就。魔幻现实主义作家以“印第安人的灵魂”自命，将印第安人的传统观念和拉丁美洲“神奇的现实”熔为一炉，同时他们又受到欧洲现代主义文学，特别是超现实主义文学的影响。它既是民族的又是世界的。\n\n魔幻现实主义作家一般都很关心祖国和人民的命运，他们的作品具有丰富的社会内容，这在当代文学中显得十分突出。魔幻现实主义作品的基本题材都来自现实生活，但被作家改变了本来面目而披上一层神秘色彩；同时，作家又大量引入各种超自然的力量，从而创造出一种扑朔迷离的新现实，但他们在小说中变现实为魔幻却又不失其真。魔幻现实主义作品的深刻寓意、非凡的艺术造诣、鲜明的民族色彩和广泛的群众性，使它做到了高雅和大众化的奇妙结合。\n\n哥伦比亚的加西亚·马尔克斯是最重要的魔幻现实主义代表作家。危地马拉的米格尔·安赫尔·阿斯图里亚斯的《玉米人》、古巴的阿莱霍·卡彭铁尔的《人间王国》、墨西哥的胡安·鲁尔弗的《佩德罗·帕拉莫》，都是魔幻现实主义的重要作品。","keywords":"存在主义文学 荒诞派戏剧 新小说“垮掉的一代”黑色幽默 魔幻现实主义","note":"本题为2023年杭州师范大学考研真题。后现代主义既不是指称一个具体的作家或批评家的群体，也不存在被广泛认同的纲领、宣言；不仅如此，后现代文化是一种没有中心的多元文化，它宽容各种不同的标准。所以，后现代主义中包含着众多流派。这些流派都会以名词解释的形式进行考查，大家要注意积累。"},{"id":"288","stars":"★★★","title":"拉丁美洲文学爆炸的原因","body":"拉丁美洲文学爆炸是指20世纪60年代至20世纪70年代初拉丁美洲文学优秀作品大量涌现的现象。其“爆炸”原因有下：\n\n一、拉美文学自身发展到成熟阶段的结果\n\n进入20世纪以来，拉丁美洲小说经历了巩固、发展直至繁荣兴盛的过程，即从“大地文学”到拉美“新小说”的过程。\n\n（一）在20世纪最初的三十年里是“大地文学”的发展时期。由于民族民主革命的高涨，许多作家以现实主义的态度反映社会上的大变化，从而产生了许多优秀作品，如《底层的人们》《青铜种族》《旋风》等。这些作品散发着浓郁的乡土气息，人与自然的矛盾成为主要描写对象。从创作手法上看，它们虽然仍旧沿袭欧洲的传统，但是在内容方面却发生了根本性的变化，即具有拉丁美洲各国自己的民族特色了。\n\n（二）1930年以后，“城市小说”开始兴起。现代社会中的城市生活成为描写对象。在技巧上，这派小说家开始摒弃传统手法，大胆地进行各种试验，同时吸收欧美“先锋派”小说的特点，诸如：意识流小说和法国新小说等。这一派的代表人物便是米盖尔·安赫尔·阿斯图里亚斯、路易斯·博尔赫斯等人。正是因为有他们探索在先，才有“爆炸”产生于后。\n\n因此可以这样认为：二十世纪30-40年代是“大地文学”发展到高峰阶段与“城市小说”问世的交错时期。40年代是城市小说的全盛时期，50年代则是巩固其成果的阶段。实际上，从50年代开始，一批年轻的新小说家已经加入文学队伍中来，如：胡利奥·科塔萨尔、奥古斯托·罗亚·巴斯托斯、卡洛斯·富恩特斯、胡安·鲁尔弗、玛利亚·阿尔盖达斯、胡安·卡洛斯·奥内蒂等人。这时他们在拉美文坛上已有所建树。所以到60年代前夕，当代拉美文学（尤其是小说）已经积蓄了足够的能量，具备了“起爆”的全部条件。\n\n二、古巴革命的影响\n\n1959年古巴革命成功以后，拉丁美洲民族主义情绪空前高涨起来。独立与解放之声响彻在新大陆上空。由于拉美各国的进步政党和有志之士都纷纷企图效法古巴的榜样，从而推动了“拉丁美洲意识”的觉醒。表现在文学艺术方面就是讴歌反帝、反封建的斗争精神，抨击社会的不公正，抗议军事独裁统治。总之，他们要把这个风雷激荡的时代的真实面貌忠实地生动地描绘出来，使人们感到有“山雨欲来风满楼”之势，认识到或预感到这种社会非变革不可。\n\n三、坚实的物质基础\n\n在经济方面，拉美文学评论界认为从60年代开始，拉美的经济发展进入现代化时期，城市规模急剧扩大，人口也开始上升，科技、教育事业得到迅猛发展，通讯联络和交通运输工具有较大改善，从而为文学创作的繁荣打下了坚实的物质基础。\n\n四、出版部门的积极推动\n\n欧美各国对拉丁美洲的关注很快就被敏感的出版部门发现了。阿根廷的南美出版社，墨西哥的经济文化基金出版社，西班牙的赛依斯巴拉尔出版公司立刻筹措资金积极为新小说家们出版作品。此外，它们还举办书展、讲座、情况交流会，大力介绍新人新作。不久，墨西哥的华金·莫尔第斯出版社、时代出版社、二十一世纪出版社，乌拉圭的阿尔卡出版社，委内瑞拉的蒙特·阿维拉出版社，古巴的美洲之家等也相继行动起来。仅以加西亚·马尔克斯的《百年孤独》为例，在十年之中，拉美各国出版社的印刷量高达500万册之多。在这些出版社的推动下拉丁美洲文学的繁荣时期来到了。","keywords":"自身发展 古巴革命 物质基础 出版部门","note":"本题为2023年北京大学外国语学院真题。类似这种分析某一文学现象出现的原因的题目，虽然考查频率较低，但我们也不应该忽视。所以，对于外国文学整体的发展脉络及各个区域文学发展状况，大家要有所了解。"},{"id":"289","stars":"★★★","title":"举例说明十九世纪欧洲批判现实主义和二十世纪拉丁美洲魔幻现实主义的共性与差异","body":"一、批判现实主义文学与魔幻现实主义文学的共性\n\n（一）以现实生活为题材来源\n\n现实主义把文学作为分析与研究社会的手段，为人们提供了特定时代丰富多彩的社会历史画面，具有很高的认识价值。如巴尔扎克力求写出被许多历史学家所遗忘了的历史，即人情风俗史。他的《人间喜剧》分为“风俗研究”“分析研究”和“哲学研究”三大类，对法国19世纪上半期的社会生活作了细致的分析与研究。\n\n魔幻现实主义作品的基本题材都来自现实生活。如马尔克斯以“魔幻”的方式观察生活，把神奇的事物作为日常生活的一部分来描写。他的小说世界源于现实，但又以夸张的手法渲染拉美生活中的神奇性。\n\n（二）坚持人道主义思想\n\n现实主义以人道主义思想为武器，深刻地揭露与批判社会的黑暗，同情下层人民的苦难，提倡社会改良。如在《人间喜剧》中，巴尔扎克描写了一幕幕惨剧，这些惨剧围绕金钱争夺而展开，体现了作家对金钱异化人性这一问题的深刻思考，具有人性的光辉。\n\n魔幻现实主义作家一般都很关心祖国和人民的命运，他们的作品具有丰富的社会内容，这在当代文学中显得十分突出。如马尔克斯以农村生活为题材的小说，往往在扑朔迷离的神秘魔幻的色彩中，反映哥伦比亚和拉美国家在独裁统治下的愚昧、落后和贫困的现实，表现拉美人民不屈不挠地与各种天灾人祸作斗争的意志与愿望，也表达了作者对人类现实处境与未来命运的理性思考。\n\n（三）以叙事文学为主，长篇小说为主要体裁\n\n现实主义以叙事文学为主，小说创作特别是长篇小说走向了成熟与繁荣。在作家们的共同努力下，19世纪现实主义小说在叙事艺术、情节结构和人物描写方面都比以往的小说更成熟，它以前所未有的辉煌成就成为这一时期文坛最重要的艺术形式。\n\n魔幻现实主义文学也以长篇叙事小说为主要载体。如马尔克斯也热衷于对小说叙事方式进行探索。在《家长的没落》中，马尔克斯用“多人称独白”的手法叙述故事，时空倒错，在结构上呈立体形态。\n\n二、批判现实主义文学与魔幻现实主义文学的差异\n\n（一）对现实生活的表现方式不同\n\n由于现实主义作家把文学作为研究社会的手段，且要描写社会的风俗史，因而，他们就格外重视艺术描写的客观真实性，认为作家应该“按照生活本来的样子去反映生活”，使作品的文本内容与现实生活内容具有同构性，从而使文学具有科学真理的精确性。\n\n魔幻现实主义作品的基本题材都来自现实生活，但被作家改变了本来面目而披上一层神秘色彩；同时，作家又大量引入各种超自然的力量，从而创造出一种扑朔迷离的新现实，但他们在小说中变现实为魔幻却又不失其真。\n\n（二）思想基础不同\n\n从文化史的角度看，崇尚写实的19世纪现实主义文学正是19世纪欧洲科学主义思潮的产物。黑格尔的辩证法、费尔巴哈的“人本学说”和孔德的实证哲学等都是19世纪现实主义文学的理论基础。\n\n后现代主义主要受存在主义，特别是海德格尔哲学的影响，并和后结构主义合流。魔幻现实主义文学作为后现代主义文学的一支，也有着相似的哲学基础。\n\n（三）探讨的主题不同\n\n现实主义文学反映了西方资本主义文明发展的历史进程中出现的种种反人性的弊病，探讨的是关于人的自由与解放的问题。\n\n魔幻现实主义作家以“印第安人的灵魂”自命，将印第安人的传统观念和拉丁美洲“神奇的现实”熔为一炉，反映的是“拉丁美洲的现实”。","keywords":"题材来源 人道主义思想 叙事文学 表现方式 思想基础 探讨主题","note":"本题为2023年北京大学外国语学院真题。这道题考查的两个知识点在时间和空间上跨度非常大，需要我们对两个知识点都有比较全面的掌握。可以以相关作家为例进行论述，通过对比，明确二者的共性与差异。"},{"id":"290","stars":"★★★★","title":"谈谈萨特的思想倾向、文学主张与艺术风格","body":"一、思想倾向\n\n萨特存在主义文学的思想倾向，主要是表述存在主义的人学主张。存在主义重在探讨个人的主观性质，最重视个人的行为选择，所以更具有文学性特征。文学与人学的结合，在这个流派身上体现得特别鲜明。可概括为一个总论点和三个分论点。\n\n总论点是“存在先于本质”。这是说世界上首先有人，有个人的主观性，有自由选择的行动，然后才能给人下判断，作结论。萨特认为：人不是上帝创造的，没有先验的性善、性恶之分。每个人只能根据不断选择自己、超越自己而给自己下定义，每个人都处在动态的行为选择中。所以，每个活人的存在，只是一种实现本质的可能性，即他并不能在结论性的意义上存在，只能在可能性的意义上存在。\n\n三个分论点是总论点的具体化。萨特的作品大都是这些分论点的形象表述。第一，他的客体观是“自在的存在”，认为世界荒谬，人生孤独。第二，他的主体观是“自为的存在”，主张自由选择，不断选择。第三，他的责任观，是自由和负责相联系，自由选择必须承担责任。第一点是自由选择的客观条件，第二点是自由选择的核心内容，第三点是自由选择的基本依据。可见自由选择是萨特人学的精髓所在。\n\n二、文学主张\n\n萨特的文论主张，是他的创作论，也是他的美学观，归根到底，是他的人学观点在文学理论上的表现。他以“主观性真实”为根据，主张文学介入社会斗争，干预人类生活。他从创作和阅读两相对应的辩证角度，对之作了深入阐述。\n\n（一）萨特认为：创作是为阅读而设的引导。因为创作过程是作者主观性发挥作用的过程。因此，和读者不能进入作家的创作过程一样，作家也不能进入读者的阅读过程。读者的阅读过程，是面对词语，不断预测和臆断，而作家的创作则不预测也不臆断，只作谋划、等待灵感，创造未来。但是，作家在“写作行动里包含着阅读行动”，即“准阅读过程”（近似值），这就是他为什么把创作称作“为阅读而设的引导”的原因。没有“引导”条件，读者的阅读就成为不可能。\n\n（二）萨特认为：阅读是引导下的创作。阅读过程不只是一个预测和期待的过程，而且是根据词语的引导，不断揭示、不断创造的过程。它绝不是消极被动的机械行动，像胶卷感光那样，只感应接受符号，而是积极主动的创造行为。作家做的是前创作阶段的工作，读者做的是后创作阶段的工作。作家引导读者进入思考和审美领域，绝不能限制和代替读者思考和审美。文学作品作为精神产品，只有在作家和读者的联合努力下才能实现完整的价值。西方学术界把萨特视为接受美学的先驱。\n\n三、艺术风格\n\n萨特的艺术风格，主要体现在以下两个方面。\n\n（一）极限境遇\n\n萨特作品的环境描写，是要表述存在主义人学的基本观点：世界荒谬，人生孤独。他认为每个自为的人身处自在的世界中，常常遇到的是障碍、限制和奴役，感受的是反感、恶心和孤独。萨特把这种作品中的环境条件称为“境遇”描写。因为作为主体的人，只有在特殊境遇中，才能作“自由选择”。他称自己的剧作为“境遇剧”，视之为一种戏剧新品种。\n\n（二）自由选择的人物\n\n萨特笔下的人物，都是自由选择的正反面人物。萨特认为，尽管每个人都是荒谬世界中痛苦而孤独的个人，但个人不是任凭摆布和无能为力的。每个人都有独立意志，能够通过行为选择，走自己的道路，把握自己的命运，创造自己的未来。此外，自由选择也不能一次完成，而是要不断选择。人从摇篮到坟墓，是一个不断自由选择的行为系列。萨特把这种自由选择的人物称为“真实人物”。\n\n文学主张和艺术风格。这部分内容中的三个部分都有单独命题的可能，大家要注意灵活应对。】","keywords":"存在主义文学 人学主张 自由选择 消极因素 积极因素 创作是为阅读而设的引导 阅读是引导下的创作 极限境遇自由选择的人物","note":""},{"id":"291","stars":"★★★★","title":"谈谈你对“他人就是地狱”这句话的认识","body":"“他人就是地狱”是萨特的名言，出自萨特的代表作《禁闭》，正确理解这句话，是准确把握和科学评价《禁闭》这部作品的要害所在。根据萨特的解释，“他人就是地狱”这句话中，主要含有3层意思。\n\n一、如果你不能正确对待他人，那么他人便是你的地狱\n\n即倘若自己是恶化与他人关系的原因，自己就得承担地狱之苦的责任。《禁闭》中3个角色都是罪人，都是败坏与他人关系的罪魁祸首，生前都给他人造成过痛苦。加尔散说“我是下流胚”，伊内丝说“我是该入地狱的人”，艾丝黛尔说“我是堆垃圾”。萨特通过三个已死的“死活人”，正是要点醒许多在世的“活死人”来认识这个道理。\n\n二、如果你不能正确对待他人对你的判断，那么他人的判断就是你的地狱\n\n他人的判断固然重要，但也只能参考，不能依赖，不可看作最高裁决，更不是自己行为的最终目的。凡以追求他人对自己赞美为目的的人，必定陷入精神困苦之中。加尔散正是如此。他从不自察内省、改变自己的思想和行为，他耿耿于怀的，总是别人会怎样给自己作结论，甚至死后仍然争取艾丝黛尔相信他不是胆小鬼。他认为求助于她一人的认可便可得救，但艾丝黛尔对此并无兴趣。他失望后又去找肯动脑筋的伊内丝，然而得到的回答正好相反，这使他更加痛苦，因而陷入精神地狱之中。\n\n三、如果你不能正确对待自己，那么你也是自己的地狱\n\n人生旅途，每出差错，人们很容易去找社会原因、客观原因和他人原因，往往看不到自己的原因，正确对待自己常为我们所忽略。《禁闭》提出这一问题，其深层意蕴正在这里。叔本华曾把唯我论者称作“关在攻不破的堡垒里的疯子”，《禁闭》描写的正是关在攻不破的堡垒里的、永受煎熬的三个疯子。\n\n正是在上述三层意义的基础上，萨特呼吁“争取自由”“砸碎地狱”，就是要唤醒人们不应作恶，以免扭曲与他人的关系；就是要唤醒人们，不要依赖别人的判断而作茧自缚，制造樊笼，成为“活死人”；就是要唤醒人们，严肃认识自己，超越自己，鼓励人们以自己拥有的自由权利为武器，去砸碎这种精神地狱，冲破人为的灵魂牢笼，为自由的心灵开拓出一片新天地来。","keywords":"不能正确对待他人 不能正确对待他人对你的判断 不能正确对待自己","note":"“他人就是地狱”是萨特《禁闭》中的名言，是理解《禁闭》这部作品的关键。根据萨特的解释，“他人就是地狱”主要包含三层含义。而萨特说这句话的目的，就是为了警醒人们不应作恶，不要依赖别人的判断，正确严肃地认识自己，超越自己，获取精神自由。"},{"id":"292","stars":"★★★★","title":"《禁闭》的艺术特色","body":"一、题材的荒诞性\n\n萨特从人生的非理性和社会的荒诞性出发，以地狱为场景，以鬼魂为对象，使题材具备荒诞色彩。《禁闭》旨在写现实之魂，关注的是悲剧人生，然而选取的却是非现实题材，全部描写都是地狱罪人的矛盾纠葛。作者通过荒诞场景和荒诞情节，形象而奇特地写出了一批荒诞人物在荒诞处境中的真实感受。萨特由阳通阴，以阴写阳，这种奇特新鲜的超现实感，便形成了浓郁的荒诞色彩。\n\n二、境遇的极限性\n\n萨特剧作的具体境遇，往往是特殊条件下的极限境遇。他只给主人公留下两条出路：或生或死，或成或败，或冲出牢笼或永远负罪。这是一种两难选择的极限境遇，给人物造成极大的压迫性和恐惧感。极限的具体境遇迫使人物必须选择，人物选择的可能性只能在极限范围内，这便为展现戏剧矛盾和刻画戏剧人物提供了充分基础。这种悲剧，同古希腊悲剧一样，在原始故事即将结尾处开始剧情，第一幕就把人物抛入冲突的中心，在真切自然之中使人高度紧张，具有鲜明的形而上的严峻性质，很容易唤醒观众和读者的参与意识，因而产生震撼灵魂的巨大力量，具有很强的艺术魅力。\n\n三、哲理的深刻性\n\n萨特最善于把人学哲理化为具体的戏剧冲突。《禁闭》中的阴曹地府分明是反面人生的深刻揭示，展露出来的人际关系就是人间地狱关系，三个鬼魂就是那种扭曲了的畸形关系中的你、我、他。一部《禁闭》就是那种畸形社会关系的缩影。《禁闭》原名为《他人》，《他人》旨在通过他人与自我的对应关系强调个体的重要性，《禁闭》则是对肉体或精神不自由的束\n\n缚。由此可见，萨特思想当中所蕴含的自我意识以及自由意识是十分强烈的。","keywords":"题材的荒诞性 境遇的极限性 哲理的深刻性","note":"《禁闭》作为萨特的重要代表作品，体现出了萨特本人的艺术风格，十分具有典型性。在具体分析时，大家可以联系萨特的文学主张和艺术风格，结合作品内容理解。"},{"id":"293","stars":"★★★","title":"萨特的戏剧《苍蝇》体现了他的哪些戏剧创作特点（25湖北大学）","body":"保罗·萨特的戏剧《苍蝇》创作于1943年，改编自古希腊俄瑞斯忒斯的复仇神话。这部作品不仅是存在主义哲学的戏剧化表达，也集中体现了萨特戏剧创作的核心理念和艺术特点。\n\n一、存在主义哲学的表达\n\n（一）自由选择与责任：《苍蝇》通过俄瑞斯忒斯的故事，展现了存在主义中关于自由选择和责任的核心观念。俄瑞斯忒斯选择承担起为父报仇的责任，这一选择是他自由意志的体现。萨特认为，人是自由的，但在做出选择时必须承担相应的责任，俄瑞斯忒斯的选择引发了一系列后果，他必须面对并承受这些结果，这深刻地反映了存在主义中自由与责任的紧密联系。\n\n（二）摆脱荒诞与异化：剧中描绘了阿耳戈斯城被复仇女神纠缠的荒诞场景，人们生活在恐惧和迷茫中，这象征着世界的荒诞和异化。而俄瑞斯忒斯的行动，是对这种荒诞秩序的反抗，他试图通过自己的选择和行动，为世界重新赋予意义，体现了萨特存在主义中强调的人要在荒诞的世界中寻找自我、确立存在意义的观点。这一结局也凸显了萨特的核心观点-“人注定自由”。\n\n二、象征手法的深度运用\n\n核心意象“苍蝇”的双重隐喻\n\n（一）集体悔恨的精神枷锁\n\n剧中苍蝇群象征阿尔戈斯城民因长期纵容罪行而产生的集体负罪感。这种悔恨如同苍蝇般腐化心灵，使民众沉溺于自我谴责而丧失行动力，映射战后法国社会普遍的道德瘫痪状态。\n\n（二）极权统治的心理操控工具\n\n统治者刻意豢养苍蝇，利用其带来的恐惧与压抑维持权力。苍蝇的密集存在成为权力规训的具象化符号，暗示极权体制通过制造精神恐慌禁锢自由意志。\n\n三、戏剧本身的艺术特点\n\n（一）顺承“三一律”\n\n遵循了法国传统的戏剧结构原则即以古典主义“三一律”来结构戏剧，集中凝练地表现戏剧冲突。\n\n（二）在尖锐的矛盾冲突中，表现人物的痛苦抉择和复杂的心理活动。\n\n（三）具有很强的戏剧性和可观赏性，常常出现出人意料的剧情逆转，造成震撼人心的强烈艺术效果。\n\n（四）古典题材的现代重构\n\n借古希腊悲剧外壳（如《俄瑞斯忒亚》故事原型），注入存在主义内核，实现神话叙事与当代哲学命题的融合。\n\n（五）辩论式对白的哲思张力\n\n角色间的对话充满哲学思辨（如俄瑞斯忒斯与朱庇特的交锋），通过语言逻辑的碰撞揭示自由意志与宿命论的冲突。\n\n（六）人与神的对立\n\n在此剧中，萨特还特别设置了一种人与神的对立。如果说在这个世界上存在着一种让人不能成为人的最大障碍，那就是神的存在了。人只有摆脱对神的依附才能获得自己。在第三幕的第二场里，人与神终于有了一场面对面的直接交锋。在这里，我们可以看到人如何从神那里赢得自己（俄瑞斯忒斯）和失去自己（厄勒克特拉）。俄瑞斯忒斯最终战胜了悔恨与怯懦，不向神灵悔，勇敢地承担自己的责任。\n\n四、境遇剧的叙事框架\n\n（一）极限境遇设定\n\n萨特通过构建极端情境（如阿尔戈斯城被悔恨与苍蝇笼罩的压抑环境），迫使人物直面自由选择的紧迫性。俄瑞斯忒斯必须在“复仇”与“逃避”之间做出抉择，这种境遇设计直接服务于存在主义哲学的核心命题：人在特定环境中如何通过行动定义自我。\n\n（二）自由选择驱动情节\n\n戏剧摒弃传统命运决定论，强调人物自主性。例如，俄瑞斯忒斯明知弑母会带来道德谴责，仍选择行动，以此宣告“人是自由的”这一存在主义信条。\n\n（三）空间意象的哲学化\n\n阿尔戈斯城的封闭环境与俄瑞斯忒斯最终离开的开放结局形成对比，暗喻从“他者定义存在”到“自我创造存在”的转变。\n\n五、现实批判与介入精神\n\n（一）战时意识形态隐喻\n\n创作于二战期间的《苍蝇》，以“苍蝇”象征纳粹的精神压迫，通过俄瑞斯忒斯的反抗呼吁民众打破沉默、争取自由。\n\n（二）对“悔恨文化”的解构\n\n萨特批判统治者利用集体负罪感维持权力，主张以行动而非忏悔实现精神救赎，呼应存在主义“存在先于本质”的核心理念。","keywords":"存在主义 自由选择与责任 摆脱荒诞与异化 象征手法 集体悔恨 极权统治 艺术特点 三一律 矛盾冲突 戏剧性 可观赏性 古典题材 辩论式对白 人与神的对立 叙事框架 极限境遇 自由选择驱动情节 空间意象 现实批判 介入精神 战时意识形态 悔恨文化","note":"郑克鲁版本的教材上主要介绍了《禁闭》，马工程版本教材主要介绍了《苍蝇》，但也仅局限在介绍作品的主要内容，艺术特点并未详细展开，此题我们正好可以作为补充，同时，我们可以把这两个作品，进行对比记忆。"},{"id":"294","stars":"★★★","title":"《禁闭》如何阐释了存在主义思想","body":"一、他人即地狱\n\n他人即地狱，是萨特在《禁闭》中主要表现的一个主题。当人与人之间充满猜疑嫉妒和争斗时，人与人之间的关系变得紧张起来，不需要真正的地狱，他人就是地狱。《禁闭》的人物设置是两女一男，其中一个女人是同性恋者，这个设置本身就具有矛盾性，于是冲突便在人与人的相遇和相处中逐渐展开并扩大。萨特看到人与人之间的矛盾冲突，只要人与人相遇，冲突便不可避免地产生。\n\n二、自由选择\n\n存在主义哲学认为，人在这个世界上，每个人都有各自的自由。面对各种环境，采取何种行动，如何采取行动，人都可以做出“自由选择”。因此，戏剧一开场，萨特就给我们一个绝望的，看似离自由选择非常遥远的场景。房间不可改变，房\n\n间里的人不可改换，连房间的布置都是设置好的。剧中人物连想要得到一点安静的休息时间都是完全不可能的，灯永远亮着。人们其实并没有选择，而人们其实又有所选择，比如互不理睬，比如，改变自己。《禁闭》用看似荒诞的情节和艺术手法，展现了现代社会人与人之间关系的困境和现代人在自由选择中的问题，探讨了关于人之存在状态和意义的话题，对人们理解萨特的哲学观点起到辅助作用。\n\n三、存在先于本质\n\n“存在先于本质”的意思是，人的“存在”在先，“本质”在后。首先是“自我感觉到的存在”，然后再由“自我”决定自己的本质。而“自我”是用以选择自己本质的手段，就是上述的“自由选择”。因此，剧中人无论是通过镜子里的自己还是别人对自己的看法，都必须首先证明自己的存在。有了存在，才有一切；我不存在，则一切都不存在。他们是三个亡魂，虽然开始还偶尔能够看到阳间的事情，但是完全没有办法左右世间发生的一切。因此，他们必须也只有通过另外两个人来证明自己的存在，证明自己的本质，证明自己还有力量做出“自由选择”改变自己的本质，也改变自己的境况。\n\n四、世界是荒谬的，人生是痛苦的\n\n《禁闭》的地狱中，三人一个房间，以后的生活领域就是在那间房子里，四壁之外的地方是走廊，走廊的尽头是其他房间，只有听差可以在楼层之间活动。这是对原来宗教关于天堂地狱想象的否定或“恶搞”，用完全与之相反的场景来说明人的局限性，揭露出原来接受的知识有可能是错误的，打破人们知识和信仰的桎梏，进而开始思考世界的真实性与荒谬性。\n\n萨特认为，人在被抛入这个世界时，已经不是孤立的存在，而是为事物所包围，也为他人所包围。他人的存在打乱了“自为存在”的本来秩序，他人把我看成他们的对象，我就不再是自为存在，成了“自在存在”。如果我要恢复自为存在的立场，保持自由，就必须与他人发生冲突；又因为自为存在总有为他人存在的一方面，因而为他人存在就意味着冲突的永远存在。剧中，三个人的纠缠永远不会停歇。","keywords":"他人即地狱 自由选择 存在先于本质 世界是荒谬的 人生是痛苦的","note":"虽然这是一出令人绝望的境遇悲剧，但萨特本人并不认为现实生活中人们的处境也是如此绝望的。他曾特别强调《禁闭》中的人都是死人，而我们则不同。现实生活中，我们每个人都可以选择坚持自我，采取行动改变自己的处境，从而努力挣脱痛苦。只有我们放弃自我选择的权利，放弃自己的努力，过分依赖别人的目光，才会陷入剧中人的困境。"},{"id":"295","stars":"★★★★","title":"概述荒诞派文学的特点","body":"荒诞派戏剧是20世纪50年代兴起于法国，然后迅速流行于欧美各国的一个反传统戏剧流派。荒诞派戏剧以存在主义哲学为思想基础，强调世界的荒诞性、人生的痛苦和反抗的无意义，具有浓厚的悲观主义、宿命论色彩。“荒诞派”戏剧创作的特点主要有：\n\n一、表现世界的荒诞性，人生的痛苦和反抗的无意义\n\n谈论人生的荒诞性，早就见诸古代西方戏剧。荒诞派戏剧家则更进一步对人生的荒诞性表示强烈的反感和深刻的讽刺，为了揭示世界的不合理性，存在的无依据、无理由，人命贱如蝼蚁、微不足道，他们不仅借助语言，而且借助各种舞台手段去表现，使荒诞性本身戏剧化。为表现人生的荒诞，他们任意破坏、支解、割裂传统的戏剧结构，把戏剧的所有传统要素如动作、语言、人物-去掉。荒诞派戏剧一般没有具体的情节，没有符合客观现实的人物形象，整个舞台是突出世界的荒诞性的一种象征。\n\n二、用形象表现对理性的怀疑和否定\n\n尤内斯库、贝克特等人剧作的主题，是人的生存条件的荒诞不经所引起的抽象的恐惧不安之感。他们在表达这个主题时，故意不用合乎逻辑的结构和明智的理性去阐明人的生存处境的不合理性、荒诞性，而是直接用形象表现对理性的怀疑和否定。在他们的剧作中，没有明确的时间地点，行动被压缩到最小极限，甚至不复存在。这些剧作没有戏剧性事件，没有剧情转折、起伏跌宕，没有结局。他们用抽象的、还原到人的原型的形象去代替人物性格的描绘与概括。语言不再是人们交流思想的媒介，他们借助语言本身的空洞无物，以显示存在的空虚；他们以既不连贯又毫无意义的语言、词句的多次重复或语音的反复再现，去夸大语言的机械表象；用滑稽可笑、荒谬绝伦的语言体现人生的荒诞性。\n\n三、舞台象征化\n\n荒诞派戏剧借助于舞台上出现的场景去表现存在的荒诞性，最大限度地调动一切舞台手段，通过机械可笑的动作、灯光和音响等来揭示人生现实的不合理性，把人类的惶惑不安呈现在观众面前。其中一个重要特点是：夸大物体的地位，让大量的物体占领舞台空间，用来说明反理性的世界倒过来压迫人的理性世界，同时也反映了物质文明的高度发达与人的精神空虚的矛盾。\n\n四、人物形象支离破碎\n\n如贝克特剧中的人物都是些丧失“自我”、徒具人形的人。尤内斯库的剧作描述了现实的荒诞、人格的消失、人生的空虚和人存在的无希望无意义。阿达莫夫剧作中的人物几乎全是还原为原型的人，旨在揭示物质文明的残酷和冷漠无情。热奈的剧作最重要的特点是：美化罪恶，使邪恶成为美德，视黑暗为光明的化身，把地狱变为天堂。他笔下的人物全是正常社会之外的人，表明人世间现存的一切都是梦幻和骗局。\n\n总体而言，荒诞派戏剧在艺术上完全抛弃了传统戏剧的程式和手法，而是用荒诞的手法直接表现荒诞的存在。它突破传统戏剧的基本规律，摒弃了传统戏剧的情节与冲突；剧中人物形象支离破碎，缺乏鲜明的个性；舞台象征化，语言混乱好似“梦呓”；以轻松的喜剧形式表达了严肃的主题。","keywords":"世界荒诞性、人生的痛苦和反抗的无意义 用形象表现对理性的怀疑和否定 舞台象征化 人物形象支离破碎","note":"23年东南大学、24年浙江大学都对荒诞派戏剧的特征进行了考查。荒诞派戏剧全面反对传统戏剧的创作程式，这一派戏剧以存在主义哲学为理论基础，在创作上吸取了表现主义、象征主义和超现实主义的表现手法并加以融会，从思想内容和艺术表现方法上独辟蹊径，进行了大胆的试验和创新，创作出了一批离奇怪诞、迥异于传统戏剧的作品，因此被戏剧评论家们称为“先锋派”“反戏剧派”。相关内容可拓展阅读邓中良《反传统·反理性·反戏剧-荒诞派戏剧特征谈》、张倩倩、房永彬《对传统戏剧的彻底颠覆-论荒诞派戏剧的特征》，资料可在李凡文学正版群中获取。这一流派也是一个重点名词解释，大家要注意积累。"},{"id":"296","stars":"★★★","title":"简析荒诞派戏剧与西方传统戏剧之间的异同","body":"荒诞派戏剧是20世纪50年代兴起于法国，然后迅速流行于欧美各国的一个反传统戏剧流派。荒诞派戏剧与西方传统戏剧之间既有相同之处又有不同之处：\n\n一、荒诞派戏剧与西方传统戏剧之间的相同点主要体现在前者对后者的借鉴上\n\n（一）借鉴了传统戏剧中的创作成分\n\n传统戏剧中有巫术成分，荒诞派剧作家借鉴这一成分，创作出了二十世纪的精神仪式，并使现代戏剧具有了原始交感巫术的特点，从而达到一种宣泄情绪和净化心灵的仪式化戏剧效果。\n\n（二）借鉴中世纪的西方木偶剧\n\n西方木偶剧使荒诞派戏剧找到了一种纯粹机制化戏剧模式的理想舞台。通过创造和木偶剧一样的隐喻性舞台，荒诞派戏剧表现出现实世界最本真的状态；通过塑造木偶式的符号化人物，荒诞派戏剧将人物作为直喻的舞台形象的一部分，更加深化了人类异化的主题。\n\n（三）借鉴了契诃夫戏剧\n\n荒诞派剧作家借鉴了十九世纪末的俄国文学家契诃夫创作的不像戏剧的戏剧-“淡化情节与冲突”，在创作中将此类“非戏剧”因素推向了极致。\n\n（四）借鉴超现实主义戏剧\n\n二十世纪超现实主义戏剧通过梦幻的表现方式以及对戏剧语言的颠覆使之成为荒诞派戏剧的先驱。\n\n二、荒诞派戏剧与西方传统戏剧之间的不同点\n\n（一）戏剧情境的设置方式不同\n\n一般说来，传统戏剧的情境是比较具体和确定的，而荒诞派戏剧的情境大多是不确定的，特别是人物关系。典型的例子莫过于尤内斯库《秃头歌女》中的马丁夫妇。传统戏剧的情境设置是合乎理性的，荒诞派戏剧的情境设置则大多具有不合情理、不合逻辑的特征。如尤内斯库的《阿麦迪或脱身术》中，男主人公阿麦迪想当剧作家，在屋里关了15年，就憋出了两句台词。\n\n（二）戏剧结构的安排方式不同\n\n如果说传统戏剧的结构是一种有序的戏剧结构，那么，荒诞派戏剧的结构仿佛是一种无序的结构。同时，荒诞派戏剧往往追求“形式即内容”的直喻效果，在表现人类处境的荒诞性时，常常利用形式的荒诞来“直喻”内容的荒诞。为此，荒诞派戏剧常常采用以下几种结构形态：一是错位式结构形态，二是重复式结构形态，三是片断式结构形态。\n\n（三）戏剧语言的运用方式不同\n\n荒诞派戏剧对语言进行“爆破”，使其表达人物思想、表情达意、塑造人物性格、发展戏剧冲突的功能遭到“毁坏”，\n\n通过创造一种荒诞的语言言说方式，在摧毁意义的同时又于无意义中显示意义，从而揭示荒诞感和荒诞意识。","keywords":"相同点 传统戏剧中的创作成分 西方木偶剧 契诃夫戏剧 超现实主义戏剧 不同点 戏剧情境 戏剧结构 戏剧语言","note":"荒诞派戏剧与西方传统戏剧在时间、形式、思想主题上有承继关系，然而更多表现为差异性。荒诞派戏剧无论是戏剧情境的设置，还是戏剧结构的安排或者戏剧语言的运用都与传统戏剧相背离，主张用荒诞的手法表现荒诞的存在，强调世界的荒诞性、人生的痛苦和反抗的无意义，具有浓厚的悲观主义、宿命论色彩。"},{"id":"297","stars":"★★★★","title":"论述萨缪尔·贝克特《等待戈多》的反戏剧特征","body":"《等待戈多》是贝克特的代表作，也是荒诞派戏剧最具代表性的作品，具有突出的反传统戏剧的特点，对世界当代文学产生广泛影响。《等待戈多》的艺术特征，主要包括以下方面的内容：\n\n一、结构特征：反戏剧\n\n（一）《等待戈多》的第一幕和第二幕大体相同，全剧只有一些微不足道的动作，而且这些动作总是很快中止，构不成可以理解的行为，只不过是一些木偶般的动作而已。\n\n（二）人物像木偶一样，不会进行深入的思维；他们没有性格可言，角色甚至可以对换。\n\n（三）情节没有高潮，人物在徒劳地等待，剧情没有发展，人物之间的关系保持不变，每个细节至少运用两次；时间不是线性的，而是周而复始，明天是今日的重复，今日重复了昨天。\n\n二、人物塑造：没有个性，性格破碎\n\n《等待戈多》首先吸引观众的是那些像丑角式的人物。他们不像生活中的人，且完全不同于传统文学中描写的人物。他们的道具（圆顶礼帽、太大的鞋）、舞台动作（幸运儿在波卓的绳子牵引下的动作、一齐跌倒、身体纠缠在一起）、重复的对话，都有丑角表演的意味。有两点表明，人物其实并没有真正的个性：其一，他们的名字有随意性，剧本里他们叫爱斯特拉贡和弗拉狄米尔，舞台上他们互相叫戈戈和狄狄，一个想自称卡图尔，另一个想自称阿尔贝；其二，人人倒在舞台上，身体的不同在这“堆肉”中消失了。爱斯特拉贡、弗拉狄米尔、波卓和幸运儿只是同一种存在的变异，他们并无重大的不同。\n\n三、思想主题：无力辨清未来、对现实感到绝望、徒劳地等待\n\n《等待戈多》表现的是对美好生活的期待而不可得，隐喻的是人类对现状和未来的茫无所措甚至绝望。艾略特的《荒原》表现了西方世界的荒漠情景，《等待戈多》更进一步，表现了西方人在荒漠之中的悲凉状况和精神状态。波卓的眼瞎和幸运儿的耳聋，可以看作人类看不清现实的一种象征。剧本对荒郊的描写，对枯木的渲染，应该说也是对生活和社会现实的一种象征。这些象征性的描写，是对西方人无力辨清未来、对现实感到绝望、徒劳地等待的表现。\n\n四、内容特征：荒诞\n\n《等待戈多》的内容充分体现了荒诞一词的含义。戈多总是等不来，天天如此，可是剧中人仍然等待，他们的等待不免显得荒诞。第一天树木光秃秃的，第二天却长出四五片叶子；第一天爱斯特拉贡的鞋子不合脚，感到疼痛，第二天随便找到的鞋却非常合脚；波卓第二天变成了瞎子，而幸运儿变成了聋子，剧本没有作任何说明；人物无缘无故摔跤，爬不起来；口中说要离开，却原地不动，等等。这些细节表明世间事物的变化是没有缘由的，不可预测的，因而是荒诞的。人物无法主宰自己的行动，只是像木偶一样动作。这一切都具有荒诞的特点。\n\n五、语言形式：集中与不连贯\n\n贝克特认为艺术创作要“集中”，这种集中尤其表现在语言上。贝克特的母语是英语，但他后来主要用法语写作。用法吾写作对他的思考无疑有约束，引起词汇“贫乏化”“弱化”，趋于“无风格”“无诗意”的写作。有人认为法语词汇比英悟贫乏，词序不那么灵活。但是，法语无疑能做到极其复杂，就像马拉美的诗虽然晦涩难懂，含义却极其丰富。法语对贝克持首先是作为外语那样具有吸引力，他的感受是异乎寻常的。综观全剧，一句话短的只一两个字，一二十句都是如此；长的上千个字，没有标点符号，连成一片。长短结合，生动多姿。《等待戈多》的语言对后来的戏剧产生了重大影响。\n\n传统戏剧作家的创作有一定约定俗成的语法规则，用词讲究，语句通顺，文笔流畅，对剧情有解释说明的作用，推动剧情发展。而荒诞派戏剧的语言没有连贯通顺的逻辑更多的是以唠叨絮语和沉默来表现世界的荒谬。沉默通常在传统戏剧中被视为结束或者开始，而在荒诞剧中，沉默延续了话语，表面的沉默和深层的思想相互依存相互对立，拓宽了荒诞剧的表现形式。《等待戈多》中的对话完全是毫无意义的闲谈，爱斯特拉冈和弗拉季米尔两人的对话重复啰唆，波卓和幸运儿的对话满是粗鄙的谩骂，缺少主题，漫无目的。与此同时对话中间的沉默显得格外突出，沉默更加表现了时间的无意义，揭示了世界荒诞性。","keywords":"反戏剧 性格破碎 对现实感到绝望 内容荒诞 语言集中不连贯","note":"本题为2023年山东师范大学考研真题。《等待戈多》的反戏剧特征，其实就是它的艺术特征。它在结构、人物塑造、语言、主题方面都体现着对传统戏剧的叛逆。同样的，这道题也可以用来回答“《等待戈多》如何体现出了荒诞派戏剧的特征”。相关内容可参考谢琪《论荒诞派戏剧对传统戏剧的反叛-以＜等待戈多＞为例》，资料可在李凡文学正版群中获取。"},{"id":"298","stars":"★★★","title":"简述《等待戈多》的思想内涵（26黑龙江大学）","body":"《等待戈多》是贝克特最重要的作品，也是荒诞派戏剧的经典之作，具有非常丰富的思想内蕴，映射了现代西方人的精神危机，其具体思想内涵，主要有以下方面：\n\n一、体现现代西方人处于信仰危机的基本生存状态\n\n《等待戈多》突出的是一种“等待意识”，并由此派生出人的焦虑、不安、无奈与绝望。爱斯特拉冈和弗拉基米尔把全部希望都寄托在戈多身上，但这个戈多是谁呢？他们并不清楚。也许戈多是上帝？但这个上帝又显然不是《圣经》中那个上帝，而是一种能够赋予世界和人的存在以意义的抽象而神秘的力量。两个流浪汉不安地等待，实际上体现了现代西方人最基本的生存状态。他们等待戈多，却不知道戈多是否真的要来，甚至不清楚戈多是否真的存在。他们想要离开，却又害怕戈多的惩罚。事实上，戈多并不存在于他们之外，而是存在于他们内心，是他们极度空虚的心灵所需求的一个外化物。他们自欺欺人地不愿意正视这一点，因为承认它就无异于否定了他们所存身的世界的终极意义，剥夺了自己苟延残喘的最后一个借口。明知戈多不会来，还要痛苦无奈地等下去，这种信仰危机时代的悲剧人生态度，是对现代人在一个荒诞世界中尴尬处境的触目惊心的表现。\n\n二、隐喻人类处于对现状和未来处于茫无所措甚至绝望的境地\n\n《等待戈多》中人物确实在向戈多祈祷，向他提出“源源不断的乞求”，认为戈多一来，他们就可以“完全弄清楚”自身的处境，就可以得救。尽管等待戈多是一种痛苦的煎熬，“腻烦得要死”，他们还是坚持不懈地等下去。等待无疑是这个戏的戏眼。\n\n因此，《等待戈多》表现的是对美好的生活的期待而不可得，隐喻的是人类对现状和未来处于茫无所措甚至绝望的境地。艾略特的《荒原》表现了西方世界的荒漠情景，《等待戈多》更进一步，表现了西方人在荒漠之中的悲凉状况和精神状态。波卓的眼瞎和幸运儿的耳聋，可以看作人类看不清现实的一种象征。剧本对荒郊的描写，对枯木的渲染，应该说也是对生活和社会现实的一种象征。这些象征性的描写，是对西方人无力辨清未来、对现实感到绝望、徒劳地等待的表现。\n\n三、对西方精神世界进行批判性否定\n\n《等待戈多》还表现了在空等待中人的精神生活状态。剧中人物为了消磨时间，玩起了游戏。这种毫无乐趣可言的消遣，是生活无聊、单调和空虚的一种表现。剧本进一步表明，一切思考都是无用的。幸运儿思索过，是按照波卓的吩咐去做的，可是他的长篇大论只不过是胡言乱语。弗拉狄米尔说：“思想是可怕的。”他进而说，思想只能产生死尸和尸骨，它是死亡的工具；整个世界是一个藏尸所。这惊人的话语振聋发聩，是对西方精神世界颇具批判性的否定。\n\n综上所述，《等待戈多》以一种荒诞的形式表现了一种荒诞的内容，批判性地指出现代人类正处于精神危机之中，对未来茫然无措，具有非常深刻的内涵。","keywords":"信仰危机 基本生存状态 茫无所措甚至绝望的境地 批判性否定","note":"这道题内容其实是比较基础的，主要是看看大家对于《等待戈多》这部作品理解得到不到位。这部作品的核心其实是“等待”，而“等待”这一行为则是当下人类精神困境的象征：不知道未来走向何方，一片迷茫。由此，再去分析这部作品的思想内容即可。"},{"id":"299","stars":"★★★","title":"贝克特的创作特征","body":"一、小说创作\n\n贝克特是新小说的先行者，表现在以下几点：\n\n（一）从不同角度描写现实的荒诞\n\n贝克特小说中的人们在荒诞的现实中难以生存下去。《穆尔菲》的主人公感觉不到生的乐趣，他整天坐在椅子里想入非非；最后，精神病院使他无法生活下去。《马洛纳之死》的主人公生活在一个空空如也的房间里。贝克特描写的是等待、孤\n\n独、异化、衰弱、死亡、无法交流，隐喻的是人类的生存状况。《怎会如此》的人物在一大片烂泥塘里挣扎：灭顶之灾正威胁着人类。\n\n（二）选取流浪汉、老人、残废者、奄奄一息的人作为主人公\n\n这些人物的遭遇比一般人更悲惨，他们的处境像地狱般可怕。穆尔菲同人们隔绝，像待在子宫里一样。莫鲁瓦的行走路程是从荒原、海滩到房间、床、餐馆门前的桶，他所待的精神病院与世隔绝。人物龟缩在内心自省和孤独地对自我观察之中；面对荒诞的现实，他们缩减到只有声音，人不成其为人，而变成会说话的物。有时，不同姓名的人变成同一个人，如莫朗最后变成了莫鲁瓦，萨波像马洛纳、路易、马克曼。在贝克特看来，人都是一样的，没有你我之分，更谈不上有典型性。他们是零，是空白，或者是物，是异化了的东西。\n\n（三）中性的、混乱的语言\n\n所谓中性，是指不带感情，句子之间没有联系，不讲逻辑，更有读不通的句子，可谓前言不搭后语。他的句子跳跃性很强，且爱重复。重复不仅指字句，也指情节。如《莫鲁瓦》前后两部分结构相同。贝克特力图描绘这样一个世界：一切在无休止地重复和重新开始。他时常取消标点符号，人物说话像讲呓语一样。他还喜欢文字游戏、双关语、能抖包袱的词。凡此种种，已开了新小说作家喜爱翻新写作花样的先河。\n\n（四）深受意识流文学影响\n\n贝克特对传统的现实主义手法深恶痛绝。因此，在贝克特的小说创作中，他绝少涉及真实的社会生活场景和具体的社会问题，而是致力于揭示人类生存的困惑、焦虑、孤独以及现代社会中人们丧失自主意识后的悲哀。他喜欢用一些生活的碎片和幻象来负载哲学思想。他的小说没有连贯的情节和动人的故事，其晦涩程度和当时勃兴的意识流小说并无差别。\n\n（五）形式上的解构\n\n在贝克特的小说中，人物或没有身份，或没有姓名，或没有外形；他们只有语言或声音，这语言或声音是混乱的、矛盾的、中性的、重复的、不连贯的。他的小说充斥着叙述者的诉说，没有情节，没有冲突，没有形象，没有联系。“你必须继续讲下去，我不能继续讲下去，我将要继续讲下去。”“我似乎在说话，但不是我，似乎在谈我自己，但不是谈我自己。”小说中的人物及自我在充斥着矛盾、悖谬和反讽的叙事中遭到了彻底的解构。\n\n（六）没有风格的零度语言\n\n贝克特具有鲜明的反叛传统和标新立异的个性，他曾经模仿乔伊斯，但是最终在艺术上对乔伊斯反戈一击，走上了一条追求个性化风格并形成独特叙述风格的创作道路。他颠覆了传统的语言结构，摒弃了正统的语言思维方式和感受方式，采用一种“没有风格”的简约干练、不事雕饰的“零度语言”风格。小说无论在形式还是在内容上都越来越抽象，越来越纯粹，也越来越迈向“虚空”的境界。\n\n二、戏剧创作\n\n（一）偏重于表现人们处境的紧迫感和精神危机\n\n在贝克特笔下，这个世界是空荡荡的、阴郁的，甚至置人于死命。人物是庸庸碌碌、无所作为、麻木不仁的，只有模模糊糊的希望，缺乏美好的理想，更谈不上雄才大略。奴隶和奴隶主处于平静无事的状态，奴隶并无任何反抗的表示。贝克特通过这种象征手法，表明人们的精神处于麻木状态，从而揭示出存在的精神危机。剧中人物同他的小说人物一样，往往是流浪汉、乞丐，既可怜巴巴，又清醒得出奇，他们从自身的贫困处境出发，无情地观察自己的命运，不断提出问题，包括生存、未来生活、身份，对世界抱着悲观的看法。剧中人之间的关系，要么像《等待戈多》中的波卓和幸运儿那样是主奴关系，要么像《一局终了》中的4个人物互相折磨，充满敌意。他们是渣滓，是原子弹爆炸后的残余物；他们感到世界快要分崩离析，对一切失去了信心。他们生存的环境很不舒适，像动物一样蛰居无处逃遁。他们往往眼瞎、耳聋，只有身体没有脚。人物讲话像腹语一样，却又无法忍受沉默，因为沉默是虚无，在一个没有意义的世界里，只有语言才有助于人排除孤独。\n\n（二）充满荒诞感\n\n贝克特戏剧中人物是荒诞的写照，舞台布景则是表现荒诞人的工具。《等待戈多》的布景几乎是光秃秃的，只有一条荒凉的大路；《一局终了》的布景是一个没有家具的房间；《哑剧I》和《啊，美好的日子》剧情在荒漠里展开，象征空虚的、没有意义的世界。贝克特的创新，在于以新的意象和手法来表现荒诞。在《啊，美好的日子》中，老妇人孤零零地埋在土中，这是人被世界和物质吞没的象征。她的一举一动是机械的动作，不是为了生活和需要。对贝克特的人物来说，过去、现在和将来都是荒诞的概念，因为时间静止不动了。他们处在极为悲惨的境遇中，行动不受理智支配，或在烂泥里爬来爬去，或蹲在垃圾箱里，或让土一直埋到脖子根，这类荒诞人是荒诞世界的产物。\n\n学影响 形式上的解构 没有风格的零度语言 戏剧创作 处境的紧迫感和精神危机 荒诞感】","keywords":"","note":"贝克特荒诞派戏剧大师的身份众所周知，但是我们也应该知道，贝克特是新小说创作的先行者，他的小说创作也取得了不俗的成就，已经有了新小说的部分特征。相关内容可以参考张和龙《荒诞·虚空·解构-论塞缪尔·贝克特的小说创作》，资料可在李凡文学正版群中领取。"},{"id":"300","stars":"★★★★","title":"《第二十二条军规》的思想内涵与艺术成就","body":"《第二十二条军规》不仅是海勒的力作，也是“黑色幽默”派的代表作品。在小说所展示的战争、性、军事混乱、黑市生意、人人相残等疯狂场景的背后，实质上也即许多西方人眼中生于斯、长于斯的一个机械化、制度化、黑白颠倒了的异化世界。面临这样的荒诞世界，作者通过小说中众多人物命运的描写，表达了他认为人在荒诞环境中必须作出人生选择的思想。这部小说的思想内涵与艺术成就，主要包括以下内容：\n\n一、思想内涵\n\n（一）揭露战争的荒谬实质\n\n小说暴露了“正义、真理、自由、博爱、荣誉、爱国”等口号的欺骗性。在官僚军事集团的统治下，根本就没有正义与非正义的战争之分，战争成了一些“体面人物”升官发财的手段。这些人利用战争制造混乱，满足自我在社会上和金钱上的欲望，为求飞黄腾达，置他人生命于不顾。\n\n（二）揭示无辜个体的可悲境遇\n\n《第二十二条军规》揭示了在官僚军事集团统治下，无辜的人们处于被异己力量所支配、吞噬，传统道德准则被视为异端，整个社会黑白颠倒甚至出现了生死错位的可悲境遇。军规作为官僚统治集团的金科玉律，是一个无法规避的圈套。这项抽象的、不成文的军规，可以看作是官僚专制意志的一种体现，是套在一切弱者身上的枷锁。在这条无处不在无所不能的军规制约下，普通人成了任意被玩弄、被残害的对象。\n\n（三）关心人生选择\n\n在官僚军事专制统治下，皮亚诺扎岛几乎成了一个令人恐惧的疯人院，多数人在此丧失了人格，迷失了人生的方向。于是，在这样一个颠颠倒倒的荒诞世界里，人们应该作出怎样的人生选择就成了读者所关心的问题。他以尤索林这个人物形象地表达了自己的观点。虽然表面看来，尤索林避死求生的行为并不光彩，但实质上他是一个被颠倒了的英雄，他不仅不是道德上、精神上的死亡者，而且还是当代美国文学中最具道德震撼力的一个形象。他的这种选择可以说是海勒对荒诞世界的价值和社会行为之否定的一种体现。也因此，作者才写他最后逃往瑞典之前还不避艰难，千方百计寻找妓女奈特雷的妹妹，想救她出火海。事实上，在尤索林身上，我们可以看出作者受存在主义思想的影响：强调自由选择、勇敢生存的原则。\n\n二、艺术成就\n\n《第二十二条军规》不仅在思想意义上取得了巨大的成功，它的艺术成就也令人瞩目，突出地体现了“黑色幽默”文学的主要特征。\n\n（一）独特的戏剧性结构\n\n全书写了40余个人物，这种被称为“人像展览式”的描写手法最能反映广阔的生活画面，构成一个喧闹的荒诞世界。\n\n（二）没有完整的故事情节\n\n对有些事件又从不同的角度、不同人物的观点加以反复阐述，粗读时给人重复、拖沓的感觉，细读之下却感到十分巧妙。这些事件互为补充，同时又是人物性格塑造的有力手段。如斯诺登的死，发生在小说开局之前，书中四处提及，每一次都透露更多的信息，这样既为情节铺设了悬念，又不时地引起读者的注意，而且还与全书的荒诞氛围互相呼应。\n\n（三）荒诞不经的形式和反讽式的语言\n\n作品那些合乎逻辑或不合逻辑的细节使读者在荒谬中看到严肃，在不可能中看到可能，而它最大的特点就是既给读者以优虑和恐惧而又不造成他们的心理负担，也即一种“把痛苦与欢乐，异想天开的事实与平静得不相称的反应、残忍与柔情并列在一起的喜剧”形式。","keywords":"思想内涵 战争荒谬的实质 黑白颠倒 生死错位 存在主义思想 独特的戏剧性结构 反复阐述 荒诞不经的形式反讽式的语言","note":"《第二十二条军规》在思想上主要是揭露战争的实质，讽刺了官僚军事集团对人的异化；在艺术成就上，《第二十二条军规》则典型体现了黑色幽默的特征。因此，这《第二十二条军规》的艺术成就也可以用来回答”《第二十二条军规》** --- 是如何体现黑色幽默特征的”，大家要注意灵活应对。"},{"id":"301","stars":"★★★★★","title":"拉美魔幻现实主义文学的基本特征，代表作家和作品","body":"一、魔幻现实主义文学基本特征\n\n（一）思想特征\n\n魔幻现实主义形成于拉丁美洲，60年代以后取得了辉煌的成就。魔幻现实主义作家以“印第安人的灵魂”自命，将印第安人的传统观念和拉丁美洲“神奇的现实”熔为一炉，同时他们又受到欧洲现代主义文学，特别是超现实主义文学的影响，使得他们创作出来的作品既是民族的又是世界的。魔幻现实主义作家一般都很关心祖国和人民的命运，他们的作品具有丰富的社会内容，这在当代文学中显得十分突出。魔幻现实主义作品的基本题材都来自现实生活，但被作家改变了本来面目而披上一层神秘色彩；同时，作家又大量引入各种超自然的力量，从而创造出一种扑朔迷离的新现实，但他们在小说中变现实为魔幻却又不失其真。魔幻现实主义作品的深刻寓意，非凡的艺术造诣，鲜明的民族色彩和广泛的群众性，使它做到了高雅和大众化的奇妙结合。\n\n（二）艺术特征\n\n魔幻现实主义文学最突出的艺术特征便是它的“魔幻性”，主要表现在以下方面：\n\n（1）“魔幻性”带有浓厚的拉丁美洲本土色彩\n\n魔幻现实主义的本土色彩是指拉丁美洲土著的传统文化和传统观念。印第安人的神话传说、神灵崇拜以及他们对生与死、梦幻与现实等问题的看法，都是这种“魔幻”的源泉。《百年孤独》所体现的对于生与死、现世与来世的看法，就是拉美印第安人的看法。\n\n（2）“魔幻性”深受西方现代主义诸多表现手法的影响\n\n由于魔幻现实主义作家所受教育和生活环境的特殊性，决定了他们对于象征主义、表现主义、超现实主义、意识流小说等西方现代主义手法，采取兼收并蓄的积极态度，并在他们的作品中留下了深深的痕迹。这主要表现在：\n\n①象征\n\n以《百年孤独》为例，作品中大大小小的循环怪圈，象征了哥伦比亚甚至整个拉美的社会现实。《百年孤独》中经历了许多沧桑变化的马贡多小镇，正是一百多年来孤独而又多灾多难的拉丁美洲大陆的象征。马贡多的居民们在失眠病毒蔓延之后不久又患上了健忘症，这个情节的象征寓意也是耐人寻味的，它在告诫拉丁美洲人民，民族的历史和文化正在被人遗忘，这是非常危险的。\n\n②荒诞\n\n荒诞手法是贯穿西方现代主义文学的一种重要表现手法。魔幻现实主义作家为了展现拉丁美洲的“神奇现实”，常借用非理性的、极度夸张的荒诞手法，在现实生活的基础上，借助天马行空的想象，抓住事物的特点加以强调夸张。描写看似荒谬，实际上作者也只是借助魔幻现实主义的手法，遵循变现实为幻想而又不失其真的原则，将现实融入了作品中，让读者更清楚地看到现实的荒诞，看清拉美大陆的历史现实。\n\n③意识流手法\n\n魔幻现实主义作家在叙事中大量运用内心独白、自由联想、意识流动和时空倒错的手法，明显是受到西方现代主义的影响。如《佩德罗·帕拉莫》中经常采用随意插笔、打乱时空顺序的写法。在描写年轻时的佩德罗和苏珊娜恋爱的情节中，先是佩德罗的一段内心独白和自由联想，随着他的意识流动，展现了他和苏珊娜在一起的种种甜蜜生活场景。紧接着是他母亲和他的对话：“我说，快从厕所里给我出来，小子。”“好，妈妈，我这就出来。”场景完全不一样，但不会觉得突兀。\n\n二、代表作家和作品\n\n哥伦比亚的加西亚·马尔克斯是最重要的魔幻现实主义代表作家，其作品《百年孤独》代表了魔幻现实主义的最高成就。危地马拉的米格尔·安赫尔·阿斯图里亚斯的《玉米人》、古巴的阿莱霍·卡彭铁尔的《人间王国》、墨西哥的胡安·鲁尔弗的《佩德罗·帕拉莫》，都是魔幻现实主义的重要作品。","keywords":"拉丁美洲本土色彩 西方现代主义诸多表现手法 象征 荒诞 意识流手法","note":"本题为2023年暨南大学考研真题，其中魔幻现实主义的特征这部分内容更加重要，26年西南大学也考查了拉美魔幻现实主义文学的特征。在魔幻现实主义中，魔幻是工具、途径，表现生活现实是目的。用魔幻的东西将现实隐去，展示给读者一个循环往复的、主观时间和客观时间相混合、主客观事物的空间失去界限的世界，是真实情感的需求。可以结合下边“《百年孤独》的魔幻现实主义特点”进行解答。"},{"id":"302","stars":"★★★★","title":"《百年孤独》的主题","body":"《百年孤独》这部小说人物众多，内容复杂，情节离奇，手法新颖，具有多重思想主题，主要包括以下内容：\n\n一、历史与社会政治的影射\n\n《百年孤独》反映了拉丁美洲的愚昧与文明并存的现实，揭露和批判了外国殖民主义者对哥伦比亚和拉丁美洲人民的政治压迫与经济掠夺。作品通过描写马贡多小镇由兴起到消失的全过程，展示了移民拓荒、殖民掠夺、独立革命、党派斗争、连年内战、外国势力入侵、新工业兴起等历史变迁。这些内容显然是作者精心选择的，是拉美社会发展的真实写照。透过似真似幻的艺术帷幔，马尔克斯对拉美现实的全面细致的观察，对拉美民族的历史和生存状态深刻独到的思考，悉数反映在作品中。因而《百年孤独》是一部具有极强历史感和现实感的作品。\n\n二、孤独的主题\n\n所谓“孤独”，既指个体性情上的孤独，也指群体精神上的孤独。在作家笔下，布恩迪亚家族的成员无不忍受着孤独的折磨。由于个体的孤独造成了普遍的愚昧、落后、保守，也由于个体的孤独产生了冷漠、绝望，最终遭到了毁灭。\n\n拉美是世界上开发得最晚的地区之一，始终处于封闭落后的境地，被排斥在现代文明世界的进程之外。而且，在外国殖民势力的侵扰下，长期的内战和独裁统治葬送了拉美民族的前途，加剧了拉美文化的动荡与分裂。\n\n马尔克斯是一位具有强烈社会责任感的作家。他如此浓墨重彩地表现孤独，正是出于对拉美民族命运的优虑与关心，旨在引导读者去思考“百年孤独”的原因，去寻找摆脱悲剧命运的正确途径。\n\n三、反思人类命运\n\n在更深层次上，《百年孤独》还是一部反思人类命运的作品。布恩迪亚家族的故事是一个“圣经般的故事”，马贡多兴衰史与《圣经》之间存在着精神的和叙述模式的联系。它们都是对人类历史的隐喻，警示人类因为自身的堕落而将招致毁灭。","keywords":"愚昧与文明并存 揭露和批判 政治压迫与经济掠夺 孤独的主题 反思人类命运","note":"《百年孤独》的主题主要分为三个层次，首先是批判和揭露，包括拉丁美洲自身和外国殖民主义；其次是孤独，号召大家团结起来。最后则是反思人类的命运，需要大家有所掌握。"},{"id":"303","stars":"★★★","title":"马尔克斯在《百年孤独》中是如何表现“孤独”这一主题的，在马尔克斯看来通过何种途径才能破解拉丁美洲长期以来的孤独","body":"一、孤独的主题\n\n《百年孤独》表现了孤独的主题。所谓“孤独”，既指个体性情上的孤独，也指群体精神上的孤独。在作家笔下，布恩迪亚家族的成员无一不忍受着孤独的折磨。“他们尽管相貌各异，肤色不同，脾性、个子各有差异，但人们从他们的眼神中，一眼便可辨认出那种这一家族特有的、绝对不会弄错的孤独神情。”个体的孤独造成了普遍的愚昧、落后、保守，也产生了冷漠、绝望，最终导致了布恩迪亚家族的毁灭。《百年孤独》中孤独的主题，主要通过以下方式表现出来：\n\n（一）《百年孤独》采用了传统的讲故事的框架，但又不同于传统的现实主义小说，而是置真实的历史事件于神话氛围之中，以丰富的想象打破了主观世界与客观世界的界限，从而深化了作品的主题。作家善于把现实与幻想、白描与隐喻、写实与夸张、严肃与戏谑相结合，通过奇诵的情节，富于象征意味的结构，创造出一个并不失其真的艺术世界。\n\n（二）小说以循环往复的叙述法，将主观时间和客观时间混合在一起，展示了一个建立在过去、现在和将来之间不断轮回循环的现代神话，蕴含了深刻的真实性和现实性，体现了魔幻现实主义文学既有超现实性又有现实性的基本特征。《百年孤独》中，“循环”将个人、家族、社会封闭其中，与外界隔绝，使读者感受到了拉美社会停滞不前、孤寂封闭的状态，同时也暗讽了落后的拉美民族意识：逃避现实、眷恋往昔。\n\n（三）作为魔幻现实主义文学代表性作品，《百年孤独》鲜明地体现了拉美文化的“魔幻性”。小说不是直接再现现实，而是把现实魔幻化，用“变形”的手段折射现实。作品通过描写人鬼混杂、生死交融的奇异世界，和千奇百怪、似是而非的神奇事物，营造了许多光怪陆离、神奇荒诞的情节，创造了一种独特的氛围，为作品主题的开拓、人物形象的刻画和作家艺术风格的发挥提供了极其广阔的空间。\n\n二、破解孤独的方法\n\n马尔克斯遵循“变现实为幻想又不失其真”的魔幻现实主义创作原则，为读者描绘了一幅虚实相间、扑朔迷离的魔幻神\n\n奇的世界，从各个角度和层面反映了拉丁美洲的历史与现实。\n\n拉美是世界上开发得最晚的地区之一，始终处于封闭落后的境地，被排斥在现代文明世界的进程之外。而且，在外国殖民势力的侵扰下，长期的内战和独裁统治葬送了拉美民族的前途，加剧了拉美文化的动荡与分裂。马尔克斯通过书名“百年孤独”表现了强烈的危机感。\n\n马尔克斯是一位具有强烈社会责任感的作家。他如此浓墨重彩地表现孤独，正是出于对拉美民族命运的优虑与关心，旨在引导读者去思考“百年孤独”的原因，去寻找摆脱悲剧命运的正确途径。他指出，孤独的反义词是团结。长期的孤独状态只能给拉丁美洲带来毁灭，只有团结起来，破除闭关自守的落后状态，才能得到拯救，走上富强振兴之路。","keywords":"孤独的主题 个体性情 群体精神 讲故事的框架 循环往复的叙述法 现实魔幻化 破解孤独 团结 破除闭关自守富强振兴","note":"23年北京外国语大学，24年中南民族大学、广东外语外贸大学都对《百年孤独》的孤独主题进行了细致考查。马尔克斯《百年孤独》中的孤独主题，既指的是个体性情的孤独，也指的是群体精神的孤独，而这个主题主要通过结构、叙述方法和艺术手法进行凸显。至于如何破解孤独，则要从拉丁美洲的现实背景进行考虑。"},{"id":"304","stars":"★★★★","title":"谈谈《百年孤独》的循环怪圈及其产生原因和象征意义（25江南大学）","body":"《百年孤独》所展示的，是一个建立在过去、现在和将来重复循环的象征框架中的现代神话。时间的轮回重复，使小说隐含了无数大大小小的循环怪圈，所有的人与事都镶嵌于这些怪圈中，小说也就成了一个魔幻的世界。\n\n一、《百年孤独》中的循环怪圈\n\n（一）整部小说讲述的是马贡多由衰及盛、由盛及衰的历史，一百年的历程，最后回到了原地。这是一个大循环怪圈。\n\n（二）布恩迪亚家族中的前辈因近亲结婚生出带猪尾巴的小孩，到第6代近亲结婚再生出带猪尾巴的小孩，这也是一个大循环怪圈。\n\n（三）这个家族中第一代何塞阿卡迪奥布恩迪亚后半生在小屋里制作小金鱼，这个过程日复一日、年复一年地被重复着，其中隐含的是过去、现在与未来的轮回往复。\n\n（四）而这个家族后来许多人的行为都与制作小金鱼相似，每人都处在过去、现在与将来的重复之中，各自的行为又互成对照，互成循环，构成了一系列大大小小的循环怪圈。\n\n（五）小说中人物的姓名与秉性也是循环往复的。布恩迪亚家族中的男性，基本上是奥雷里亚诺与阿尔卡迪奥的重复或相加，秉性也依次延续，其中隐含的也是时间上的轮回重复。\n\n（六）吉卜赛人几次到马贡多，村民们每次都和最初一次一样被吉卜赛人的磁铁、放大镜耍得团团转。可见，尽管时间在推移，但马贡多人的价值观念、思维方式却一百年如故，其中隐含的仍是时间的重复。\n\n（七）小说中活得最长久的乌苏拉，阅尽了布恩迪亚家族的盛衰演变，在她眼里，一切都无非是过去的重复，她惊呼时间在打圈圈，因而她此后一直沉湎于对过去的回忆之中。她的这种始终如一的对过去的追怀，也是一种时间的重复与轮回。\
