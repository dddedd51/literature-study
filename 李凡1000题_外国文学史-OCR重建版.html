<script>
const DATA=[{"id":"1","stars":"★★★","title":"试分析古代欧洲文学的地位与影响","body":"古代欧洲文学指的是公元前12世纪到前1世纪产生的欧洲本土文学，其中成就最大的是古希腊文学和古罗马文学。古希腊古罗马文化对后世欧洲产生了极为深远的影响，可以说，没有希腊文化和罗马帝国所奠定的基础，也就没有现代的欧洲。古代欧洲文学的地位与影响，主要表现在以下方面：\n\n一、反映了欧洲从氏族社会向奴隶制社会过渡时期的现实生活\n\n古代欧洲文学形象地反映了原始社会和奴隶社会两个历史阶段的社会生活图景，表现了古希腊、罗马人对神秘莫测的大自然，对变幻无常的人生，对各种复杂的社会现象的原始认识。在古代几个重大的历史事件和社会问题上，如特洛伊战争、希波战争、伯罗奔尼撒战争，以及人与自然、人与命运的矛盾冲突，奴隶主民主派与专制派的斗争，妇女的社会地位，等等，古代欧洲文学都作出了反映，表达出古人的幻想、期望、追求，以及战胜强敌、克服困难、向往自由、肯定世俗人生的生命活力，体现了“人类童年时代”朝气蓬勃、积极乐观的时代精神，具有相当高的认识价值和思想意义。\n\n二、为后代许多重要文学体裁和艺术手法开了先河\n\n当古代欧洲的历史进入奴隶制国家时期后，文学的各种表达方式不但呈现出丰富多彩的面貌，而且逐渐固定下来。古希腊、罗马人创造出神话、史诗、抒情诗、哲理诗、寓言、悲剧、喜剧、散文和小说等文学样式。这些文学作品想象丰富，瑰丽多姿，纯朴粗犷，生活气息浓郁，交替使用浪漫主义、现实主义两种基本的艺术方法，成为后代欧洲同类文学的最初范例，为后来的欧洲文学的发展奠定了基础。\n\n三、为后世奠定了文艺理论基础\n\n柏拉图写有对话40篇，这些对话通过对话者之间的辩论，生动而广泛地涉及宗教、神话、政治、伦理、教育及各种文艺和美学问题，是希腊文学中出色的散文作品。后来欧美各国的一些重要的文艺创作者和文艺理论家都受过柏拉图的影响。除此之外，像是亚里士多德的“模仿说”，贺拉斯的“寓教于乐”等文艺主张，都为后代的浪漫主义、现实主义、现代主义等文学流派提供了理论前提，并深刻影响了欧美各国文学。\n\n四、造就了生命意识、人本意识和自由观念等欧洲文学与文化的基本内核\n\n古希腊古罗马文学表现了古希腊古罗马人对宇宙、自然与人生的理解与思考，其中蕴含着他们较为原始的精神、心理、情感和文化的内容。外部世界的神秘莫测，大自然的不可驾驭，人生的变幻无常，使他们形成了带有宗教宿命论色彩的“命运观”。威力无穷的命运给古希腊古罗马人带来了困惑与恐惧，也培养了他们的自我意识和个体精神，此外，他们也在与命运的抗争中激发出了蓬勃的生命活力。古希腊古罗马文学正是在描写人对现世价值的追寻、人与命运的矛盾和抗争中，展示了人性的活泼与美丽，表现了人类童年时期的自由、乐观与浪漫。生命意识、人本意识和自由观念，是古希腊古罗马文学的基本精神，以后也成了欧洲文学与文化的基本内核。","keywords":"反映现实生活 为文学体裁和艺术手法开先河 奠定文艺理论基础 生命意识 人本意识 自由观念 基本内核","note":"古代欧洲文学，也就是古希腊古罗马文学，是后世欧洲文学的重要源头。后世欧洲文学的许多作品之中，都可以** --- 看到古希腊神话、悲剧的影子，像是《尤利西斯》的神话模式，就明显是从《奥德修纪》这一古希腊神话中汲取的资源。可以说，后世欧洲文学的繁荣就是建立在古希腊古罗马文学成就之上的。"},{"id":"2","stars":"★★","title":"试分析古希腊古罗马文学的总体特征","body":"古代欧洲文学指的是公元前12世纪到前1世纪产生的欧洲本土文学，其中成就最大的是古希腊文学和古罗马文学。特别是古希腊文学，它是欧洲文学的源头。古希腊古罗马文学的总体特征，主要表现在以下方面：\n\n一、具有鲜明的民间色彩\n\n氏族部落制末期所产生的神话传说、英雄史诗是不同民族一代代人集体创作的结晶，这些最初的口传文学在后世被整理记录下来后，仍然不失其原有的朴素风格，表达着早期人类的思想感情和理想观念。在此基础上诞生的古希腊古罗马文学与民间口头文学的关系十分密切，尤其是神话、英雄传说和史诗，或则本身就是民间文学，或则从中汲取了丰富的养料，再经过民间歌手的艺术加工，具有文人创作所没有的丰富而瑰丽的想象、纯朴的气息和粗犷的风格。\n\n二、宗教信仰对文学创作影响深刻\n\n宗教信仰在上古时期与人们的社会生活关系密切，人们普遍敬畏神灵，祈求得到佑护和丰产，依照神谕去决定家国大事，去窥测人生命运。宗教信仰的特征和观念，在古希腊古罗马文学中得到了生动的体现。比如古希腊悲剧从产生到消亡都与古希腊的宗教有着密不可分的联系。悲剧作为酒神祭祀仪式的一部分由酒神颂歌演变而来，对酒神狄俄尼索斯的崇拜赋予古希腊悲剧丰富的宗教内涵，这种宗教内涵也正是古希腊悲剧精神的实质所在，是悲剧赖以生存和发展的根源性因素。所以，随着哲学的兴起和宗教的衰亡悲剧最终走向了末路，“舞台上的哲学家”欧里庇得斯正是悲剧走向衰亡的引路者。\n\n三、知识内涵的综合性\n\n古希腊古罗马时期的文学创作，尚不具有后世文学作品那样明确清晰的边界，许多重要的作品、典籍都如“百科全书”般反映着各种知识领域的内容。文学、历史、宗教神学、法律、道德伦理以及古老的风俗制度常常存在于同一部文集或作品中，具有丰富的文化内涵，成为后人了解那一时代人们精神生活和社会生活的珍贵文献。如《埃涅阿斯纪》就包罗了从古希腊到古罗马极丰富的神话、传说、地理、历史、宗教和民族生活习俗、文物制度等具体精确的描写，并因此获得罗马百科全书的称号。","keywords":"鲜明的民间色彩 宗教信仰影响深刻 知识内涵的综合性","note":"相较于古代欧洲文学的地位与影响，古希腊古罗马文学的特征相较而言考查较少，我们也主要是了解为主。可以看到，古希腊古罗马文学的整体特征，与上古文学的整体特征是相一致的，都体现出了文学发展早期的典型特色。通过古希腊古罗马文学的特征，我们也可以对上古文学的整体特征有一个大致的认识。"},{"id":"3","stars":"★★★","title":"试分析古希腊文学对后世欧洲文学发展的影响","body":"古代希腊文化在宗教神话、哲学、文学艺术及科学等诸多方面取得辉煌成就，对其后的西方文明乃至当今的世界文化发展都起到了巨大而深远的影响，这具体表现在如下方面：\n\n一、古希腊宗教神话文化为后世欧洲文学艺术的发展提供了肥沃的土壤\n\n古希腊的宗教与神话是紧密联系在一起的，进一步说就是古希腊的各种神灵信仰是神话传说的思想基础，而神话传说反过来又进一步丰富和发展了古希腊宗教，神话是宗教的核心。这种宗教神话文化，产生了如下重要影响：\n\n（一）促进了理性精神萌发\n\n古希腊宗教没有经典教义，没有教会组织及神职人员，人们在宗教活动中便有很大的自由性，每个公民都可以成为活动的主持，每个公民都有参加或不参加宗教活动的自由，这种自由，便为理性主义打开了精神之窗。\n\n（二）为西方世界创作提供了不竭的题材\n\n古希腊宗教具有“神人同形同性”的特点，古希腊的神是高度人格化的，神与人之间会有联系，有往来，人的行动会体现出支持他的那位神的意志，人类的战争、统治、生活乃至生命，都会被神不同程度地支配，而人类也会因不满神的专制选择反抗神。这些丰富多彩的神话传说，特有的人神关系，自然会被文艺作家们所利用，发挥他们的无限想象，在文艺作品中展现神人世界。如奥维德的《变形记》是希腊神话向西欧传播的来源之一。\n\n二、古希腊哲学开启了世界哲学研究的诸多领域，奠定了哲学派别的基础\n\n在认识论方面，苏格拉底提出了一种可知论，将哲学的研究从自然转向人，认为哲学的目的在于认识自己提高个人的素\n\n质和完善个人品德。诗人克罗封的怀疑主义的观点则为哲学中的“不可知论”的产生提供了契机。在“本体论”方面，赫拉克利特和德谟克里特都是唯物“一元论”者，柏拉图是唯心“一元论”者，而亚里士多德提出了“二元论”的哲学体系，其中所提出的“质料”和“形式”，实际上就是现在西方哲学中“物质”和“意识”的原始表述。可以说，当下的哲学派别之分，在古希腊哲学那里已初见端倪。\n\n三、古希腊的文学艺术成就对西方文化具有开创性影响\n\n史诗和悲剧是古希腊文学中的两颗明珠，光耀夺目。《荷马史诗》是欧洲最早的文学巨著，成为欧洲文学的渊源，是西方文学史上的开山之作，至今仍是当代欧洲人学习文学时的必修一课。古希腊悲剧更是对之后西方戏剧的发展产生了重要的影响。当下演出时的布景、舞蹈、高底靴和轻飘鲜明的服装，都是埃斯库罗斯首先采用而流传至今的。索福克勒斯突破了抒情诗式的悲剧形式，加强了戏剧的作用，使悲剧艺术趋于完善。欧里庇得斯则是开创西方家庭问题剧的第一人。由此可见，古希腊文学的在艺术上的开拓沾溉后人。","keywords":"宗教神话文化 理性精神萌发 提供了不竭的题材 奠定了哲学派别的基础 开创性影响","note":"古希腊文学的分期即古希腊文学的发展脉络，掌握这一大致脉络对我们学习古希腊文学有很大的帮助。相较而言，古希腊文学的影响更为重要，古希腊文学作为西方文学的源头，是外国文学的一个考查重点，南开大学在2023年就出过一道相关题目：“结合具体作品论述古希腊文学对后世欧洲文学的影响”。还有如“古希腊文学为何具有不朽的艺术魅力”“为什么古希腊文学是西方文学的源头”这一类的问题都可以从古希腊文学的影响这一角度切入回答。相关内容可以参考袁晓娟《古希腊文化对西方文化发展的影响》，具体资料可以在李凡文学正版群内领取。"},{"id":"4","stars":"★★★","title":"试分析古希腊神话的基本特征","body":"古希腊神话是古希腊人思想与生活的反映，是原始信仰的产物，是人类正常儿童奉献给人类历史的文化瑰宝。古希腊神话的基本特征，主要表现在以下方面：\n\n一、想象力极强\n\n希腊神话把自然界万事万物拟人化、神话化，也把人类精神领域、感情领域和社会生活领域的现象拟人化、神话化了，而且入情入理，合乎逻辑，创造出令人难忘的意境和鲜明的形象。如阿波罗的爱情故事，法厄同驾太阳马车的故事，潘多拉盒子的故事等。\n\n二、故事性极强\n\n希腊神话故事，普遍具有来龙去脉，前因后果，而且情节曲折，起伏跌宕，娓娓道来，十分动听。如宙斯和伊俄的故事，哈得斯的婚姻故事，普罗米修斯的故事等。\n\n三、哲理性极强\n\n希腊神话，既富有情趣，又极其深刻，是古希腊先民劳动积累和生活经验的凝聚，也是早期人类智慧和思考的结晶，许多故事都寓意颇丰，发人深思，成为后世人类共同的精神财富。如金苹果的故事，西绪福斯的故事，安泰俄斯的故事，赫拉克勒斯选择人生道路的故事等。\n\n四、神人同形同性\n\n希腊神话中的神是高度人格化的。他们具备人类的思想感情，他们的性格也十分鲜明。希腊神话和其他民族的神话不同，他们的神既不是抽象道德概念的化身，也不是阴森、怪诞、令人生畏的偶像。在希腊神话中，神同人类一样，有爱，有恨，七情六欲样样具备，甚至好嫉妒爱虚荣，有时在道德上还不如人。他们不是高高在上，高不可攀。他们常常来到人间同美貌的男女谈情说爱。他们同凡人不同的地方，就在于他们长生不死，具有无比的法术和智慧，有超乎凡人的力量。\n\n五、蕴涵人本精神，整体积极乐观\n\n希腊神话中充满了追求光明、酷爱现实生活、以人为本、肯定人的力量的思想。古希腊人认为享受现实生活就是享受神的恩赐，因此他们追求自然的美景，追求物质的享用，追求文学艺术的赏心悦目，追求自然与人生中的美。同时，虽然希腊神话与其他民族神话一样，相信神，相信命运，有的神话故事与宗教祭祀紧密相连。但是，希腊神话强调的却是人的力量和人的奋斗精神，强调对人生与现实的热烈追求，因此充满乐观主义精神。在某种意义上说，希腊神话更像“人话”。\n\n古希腊神话始终将人置于神话的中心地位，凸显着人的精神，回荡着积极、乐观、健康的气息，不仅对后世的希腊文学产生了深远影响，而且赋予欧洲文学以人本主义的基本倾向。\n\n六、处于发展和变化之中\n\n经过几百年的口头流传，神话经历着发展和变化。以奥林匹斯神统为例，宙斯和赫拉以兄妹结成夫妻，反映出血缘家庭","keywords":"想象力 故事性 哲理性 神人同形同性 人本精神 积极乐观 处于发展和变化之中","note":"这部分内容中，我们需要重点关注的是古希腊神话中的人本精神，这一精神不仅是古希腊神话的鲜明特色，更是古希腊文学的鲜明特色，在古希腊的史诗、悲剧之中都可以看到这一精神的涌动，并且这一精神对后世欧洲文学产生了极为重要的影响。所以，在考查类似“古希腊文学中的人本精神”的题目时，可以联系这部分内容。"},{"id":"5","stars":"★★★","title":"试分析古希腊神话与中国神话的异同","body":"中国和希腊神话因都产生于人类的初始时代，反映了早期人类生活和认识的过程，具有相同点；但两国地理环境和历史演进时序不同，中希神话又有许多不同之处。具体来说，表现在以下方面：\n\n一、相同点\n\n（一）中国和希腊的神话中都流露出早期人类对自然的畏惧感，尤其表现在有关洪水的故事中\n\n希腊神话《皮拉和丢卡利翁》中讲道：由于不喜欢客人，粗暴残忍的阿尔狄国王吕卡翁触怒了做客的宙斯，宙斯决定用洪水淹没人类。闻一多先生的《伏羲考》中也有洪水遗民再造人类的故事情节。在希腊和中国的神话中，洪水被视为上天对人类罪过的惩处。在人类自我控制能力尚不发达的时期，洪水的威慑可以起到规范人类行为的效果。\n\n（二）都具有征服自然的强烈愿望\n\n中国神话中的鲧，为了制服洪水，从天庭偷取了能阻塞洪水的宝物“息壤”遭到天帝杀害。鲧事业未成，不能安心长眠于是在肚子里孕育新的生命-禹。禹长大后继承了父志，终于平治了洪水。古希腊神话中的著名英雄赫拉克里斯堪同样与自然做斗争，勇斗海神派来的大水怪。由此可见，在敬畏自然的同时，中国和希腊神话都表现出了征服自然的强烈愿望。\n\n二、不同点\n\n地域的差别，自然条件的悬殊，特别是历史进展的时序不同，造成了中、希两国在神话传说方面的差异。\n\n（一）神人同形与人兽同体\n\n希腊神话中的神具有人的形态、人的性格、人的情感。古希腊人是按照人的形象创造神的。他们把神看作是最美丽、最健壮、最聪明和最有力量的人。希腊诸神，尤其是主要的神祇，经历了相当彻底的“人化”。奥林匹斯诸神，不仅是自然力量的象征，而且是人性戏剧化的表现。\n\n中国神话则具有人兽同体的特征，其诸神大多是半人半兽形状。如教人播种五谷，为民尝百草而丧生的炎帝神农是牛头人身；和黄帝打仗的蚩尤是人身牛蹄，四目六手。而伏羲、女娲这两位与人类关系极密的尊神，到了文明已高度发展的东汉末年，依然保持着半动物化形象。\n\n（二）男性崇拜与女性崇拜\n\n古希腊神话认为人类来源于男性，把普罗米修斯当作人类的始祖，说他用泥土模仿天神的模样创造了人类。在希腊人心目中，普罗米修斯抗强暴而不畏宙斯，偷天火以造福人类，具备伟岸男性的优秀品质。\n\n中国神话认为人类来源于女性，把女娲当作人类的始祖，说她捏合黄土仿照自己的模样造出了一个个“万物之灵”，从而才有了人类。在中国人的心目中，女娲善良、慈祥，是创造、护卫人类的女神，具有伟大女性的优秀品质。\n\n（三）崇力与尚德\n\n希腊神话和民族精神的形成，得力于经济的、力量的、技术的聚合力。希腊是城邦制文明，强调从自身的经济技术实力战胜其他城邦，得以生存和繁荣。因而在整个希腊神话中，崇尚的是透露着强烈的非伦理倾向的奥林匹斯诸神们强大、神奇、分工细致的力量，所赞美的是叱咤风云，扭转乾坤的有“力”者。\n\n而中国神话与民族精神的形成，得力于礼仪的、伦理道德的聚合力。在古代中国的社会意识里，值得崇拜的不是“力”而是“力”所体现的道德性质，提倡的是三皇五帝式救苦救难，律己甚严的高尚“圣德者”作为统治者，以礼仪、道德和仁义来治理国家、团结人民。这种注重和谐、伦理至上的精神，在中国神话中得到了最为充分且十分自然的表现。\n\n（四）人本和民本\n\n希腊神话中诸神的整体面貌便是生之乐趣。高居于奥林匹斯山上的众神不必为了人类去进行种种的伦理引导和教诫，大部分时间是在寻欢作乐，并因此而引出许多无谓的争吵。这说明了古希腊的神话中透露出浓厚的“人本主义”色彩。\n\n相对而言，中国神话众神们关注的主要是社会整体的和谐与事业的成败。他们不看重个人情感的追求，也不像希腊诸神☑那样情绪大起大落。不同于希腊神话，中国神话显示出厚实的“民本主义”。\n\n总之，中国古代神话和古希腊神话都是人类社会发展处于原始阶段的产物，二者的相同反映了人类神话产生的共同历史背景；而二者的差异，展现了人类神话的多样性，折射了不同地域文化的独特性。","keywords":"相同点 对自然的畏惧感 洪水的故事 征服自然的愿望 不同点 神人同形 人兽同体 男性崇拜 女性崇拜 崇力尚德人本民本","note":"比较希腊神话与中国古代神话，不是为了得出“梅须逊雪三分白”的优势论，也不是为了总结“雪却输梅一段香”的不足点。而是通过比较，探究中西方不同的地理环境、民族心理、民族文化，理解这两个民族气质和性格上的深刻差异。相关内容可以参考吴华群《中国神话与希腊神话比较研究》，具体资料可以在李凡文学正版群中领取。"},{"id":"6","stars":"★★★★","title":"试分析古希腊神话的影响","body":"希腊文化潜移默化地影响着西方人的语言形式、生活方式和思维模式，是孕育西方文化的摇篮，是西方文化发展的源头。希腊文化源于希腊神话，所以在西方历史发展中，希腊的神话是不可忽视的一部分。\n\n一、古希腊神话是古希腊文学艺术的武库和土壤\n\n希腊的各种文学艺术都是从希腊神话中取材。比如著名的荷马史诗是在希腊神话的基础上创作出来的；赫西俄德的《神谱》是用长诗对希腊神话的系统整理；古希腊悲剧诗人的绝大部分剧作，都取材于希腊神话；大量美术雕塑作品也是以它为素材。\n\n二、古希腊神话对古罗马文学艺术产生了巨大影响\n\n古罗马从政治、军事上征服了古希腊，而古希腊的文化艺术又征服了古罗马，其中，希腊神话当居首位。如维吉尔的《埃涅阿斯纪》，从希腊神话中汲取了艺术营养，以至连大量情节也十分相似；奥维德的《变形记》，几乎是对希腊神话的全面转述，只是神祇和英雄的名字被改为罗马名字而已。\n\n三、古希腊神话对后世西方文学艺术影响颇深\n\n（一）为后世文学创作提供了大量题材\n\n后世的文艺复兴时期和古典主义时期，对希腊神话知识的普遍重视形成一股潮流，戏剧作家莎士比亚、高乃依、拉辛，画家达芬奇、普桑，雕塑家米开朗琪罗、贝尔尼尼，直至现当代一些著名作家、艺术家，都以希腊神话为题材来源，创造了流传千古的许多杰作。\n\n（二）古希腊神话奠定了西方文学的人文传统\n\n希腊神话通过神与英雄的故事，不但展示了古代西方社会真实的生活状况和心智状态，更透露出个人主义在古代西方文明中的萌芽与发展，是个人主义在西方文化中的最初沉淀，体现出生机勃勃的抗争精神和以人为本的思想，为此后西方文化的发展创新提供了基础与动力，是促进人类进步的巨大的精神源泉。\n\n（三）希腊神话造就了西方文学创作者别具一格的创作思维和创作方式\n\n希腊神话将人物的个性和人物形象作为创作的重点，这种独特的人物塑造方式成为日后西方文学创作中的主流思维模式和创作理念。此外，希腊神话也出现了诸多生活的哲理，在故事中蕴含着重要且宝贵的思想，这对后世具有深远的教育意义。而这样的创作特征也为西方文学创作者的文学创作提供了独特的创作思维和创作思路，进而直接影响了西方文学家文学创作的艺术特征及风格。","keywords":"源头 希腊文学 罗马文学 西方文学 大量题材 人文传统 创作思维和创作方式","note":"古希腊神话是希腊文化的源头，而希腊文化又是西方文化的重要源头。古希腊神话首先对希腊文学和罗马文学产生了影响，并由此对后世文学产生了重要影响。这种影响表现在题材、思想和艺术手段等多个方面。像是古希腊悲剧、古罗马史诗、后世的文学作品如莎士比亚的《暴风雨》《维纳斯与阿都尼》之中都可以看到古希腊神话的影响。古希腊神话的影响这部分内容是古希腊相关知识中考查频率最高的一部分，大家一定要注意重点掌握。"},{"id":"7","stars":"★★★★","title":"试分析荷马史诗的思想内容","body":"荷马史诗包括《伊利昂纪》和《奥德修纪》两部史诗，它们各自反映的内容虽有不同，但都表现出了共同的思想：\n\n一、用神话方式表现了特定的社会历史内容\n\n《伊利昂纪》题名的原意是“伊利昂的故事”，写的是希腊人围攻特洛伊城的故事，《奥德修纪》题名原意是“奥德修斯的战争”，它写的是希腊英雄奥德修斯在特洛伊战争结束后还乡的故事。两大史诗规模宏伟，内容丰富，极为广阔地描绘\n\n了由氏族社会向奴隶社会过渡时期希腊的社会生活和人们的精神面貌，对当时的社会形态、思想观念宗教活动、田园耕作、体育竞技、家庭生活、商品交换、风俗礼仪等，都作了生动的描绘。荷马史诗对古希腊人来说具有百科全书的性质，他们从中吸取知识，接受教育。在整个古典时期，荷马史诗成了希腊教育和文化的基础。柏拉图在《理想国》里曾提到，荷马教育了希腊人。\n\n二、通过英雄形象的描写，表现了古希腊人个体本位的价值观念\n\n荷马史诗中的英雄们视个人荣誉为第一生命，他们的行为动机都与个人的荣誉、爱情、财产、王位等分不开；他们的“冒险”，也往往出于显示自己的勇敢、技艺、智慧和健美，是为了得到权力、利益、爱情和荣誉。这些都表现了热爱生活，肯定和追求人的现世价值的积极乐观的人本思想，显示了希腊文化乃至整个西方古典文化的一个重要特征：重视生命对于个人的价值，具有很强的个体本位意识。另外，史诗中敌我双方的英雄都得到了史诗的歌颂。在《伊利昂纪》中，不仅阿喀琉斯的形象生动真实、具体鲜活，而且特洛伊王子赫克托耳也被刻画得光彩照人，具有崇高的道德品质。\n\n三、通过对众神的描写，表现了古希腊人古朴的哲学观和人文意识\n\n荷马史诗讲述的是发生在距诗人生活的时代四五百年以前的故事。其时，人们聚居在由王者统治的部族里，生活在宗气息浓烈的氛围中，那是一个神人共处的世界，神与人的关系远比后世密切。按照荷马的观点，众神力大无比，知晓一切，因而理所当然地拥有凡人想要而往往不那么容易获得的东西，并把它们恩赐给可怜的、在心力和智力方面都受到极大局限的凡人。神明主导凡人的生活，在很大程度上决定人的祸福。在一个受到神力控制的世界里没有不能解释的事情。雷电是宙期赠送的，地震是波赛东催导的，性爱是阿佛洛狄忒驱使的。荷马用一种古朴的哲学，用充满诗意的想象解释自然界中的突变（或突发）现象，解释人们复杂的心理活动，初步完成了古代人文意识中的诗与哲学的结合。\n\n四、通过描写人与命运的冲突，表现了古希腊文学和文化中的悲剧意识\n\n荷马认为，除了神以外，人生还受到另一种超自然的力量，即命运或“命限”的制约。凡人从出生的那一刻开始便已受到命运的摆布，带上了死亡的阴影。然而，人生的苦难和局限没有把荷马引向悲观和绝望。诗人在生活的艰辛中看到了生存的意义，在战争的残酷中看到了生命的价值，体现了古希腊人的人生观：用有限的生命抗拒无限的困苦和磨难，在短促的一生中使生命最大限度地展现自身的价值，使它在抗争的最炽烈的热点上闪耀出勇力、智慧和进取精神的光华。人终究还是要死的，但他在生与死的战火中得到了锻炼，表现出即使在最酷烈的条件下也不准备放弃抗争和自我检验的决心。凡人中的精英不应回避生活的挑战，相反，他们有责任在赴汤蹈火的实践中，把对生命的热爱之情上升为对人生价值的追寻。这种人生观，正是西方“悲剧意识”的源头。","keywords":"神话方式 社会历史内容 英雄形象的描写 个体本位的价值观念 对众神的描写 哲学观 人文意识 人与命运的冲突 悲剧意识","note":"荷马史诗规模宏伟，内容丰富，极为广阔地描绘了由氏族社会向奴隶社会过渡时期希腊的社会生活和人们的精神面貌，对当时的社会形态、思想观念、宗教活动、田园耕作、体育竞技、家庭生活、商品交换、风俗礼仪等，都作了生动的描，并在多个方面对后世欧洲文学产生了深远的影响，是考查中出现的高频考点，要重点关注。"},{"id":"8","stars":"★★★★","title":"试分析荷马史诗的艺术特色","body":"荷马史诗不仅是后世诗人难以企及的文学范本，而且也是整个欧洲文学的源头。总体来看，荷马史诗主要具备如下艺术特色：\n\n一、主题明确、中心突出的整体格局\n\n荷马不仅是一位诗人，而且也是一位具有卓越的宏观调度和控制能力的大型文学作品的设计师。亚里士多德认为，史诗诗人中唯有荷马摆脱了历史（或编年史）的局限，着意于模仿完整的行动，使作品避免了流水账式的平铺直叙，形成了主题明确、中心突出的整体格局。《伊利昂纪》围绕着阿喀琉斯的愤怒展开，全诗内容跌宕起伏，读来扣人心弦。《奥德修纪》虽然采用“双线发展”的组合形式，但故事的焦点一直或明或暗地对准奥德修斯的返乡。忒勒马科斯的出访，神的干预，求婚人的恶行，帕涅洛珀的心境所有这一切都带有陪衬和铺垫的性质，起着解说、转折和牵引的作用。亚里士多德盛赞《伊利昂纪》和《奥德修纪》的构思，认为它们体现了史诗的最高成就，是史诗的典范。\n\n二、结构巧妙，布局完整\n\n荷马史诗在题材处理及谋篇布局上显示了惊人的水平。两部史诗都涉及10年时间所发生的事，但都是采取戏剧式的集中、概括和浓缩的手法，把故事集中在一个人物、一个事件和某一段时间上，从而把众多的人物、纷繁的情节和丰富的生活\n\n画面浓缩成一个严谨的整体。《伊利昂纪》把10年的战事集中在最后51天，在51天中又突出地描写关键的20多天，20多天中重点又是4天的战况。在情节的布置上，整个诗篇围绕着阿喀琉斯的两次愤怒而展开。《奥德修纪》把10年历险故事压缩在40天，具体又只写5天；结构上分两条线索一条是海上历险，一条是家中求婚者的包围，两条线索互相映衬，更突出情势的紧急。荷马史诗卓越的结构谋篇艺术，历来为文史家所高度赞扬。\n\n三、多方面塑造人物性格\n\n荷马擅长人物性格的刻画，《荷马史诗》以简洁鲜明的笔触勾勒出一系列英雄形象，在他们身上既集中了氏族集体所要求的英勇品质，又已初步显示出每个人的个性特征。在阿喀琉斯和赫克托耳这两个主要人物身上，诗人更触及了他们性格的复杂性。如阿伽门农刚愎自用，还有富贵豪强的一面，但又勇于自责；阿喀琉斯英勇善战，但又任性、倨傲，不能顾全大局。\n\n同时，荷马还能刻画出人物性格的发展，把英雄的成长看作是一个修炼的过程。如在《奥德修纪》第一卷里，忒勒马科斯还是个涉世不深的热血青年，对处理复杂的事件感到力不从心，但随着情节的发展，年轻的雏鹰逐渐练硬了腾飞的翅膀，和父亲一起打败了作恶多端的求婚人。有的人物在作品中出现的次数不多，但荷马总能用他的“生花妙笔”画龙点睛，往往只用寥寥数语即可勾勒出其性格的不同侧面。\n\n四、语言明快，灵活运用程式化用语\n\n荷马的叙述具有某些显著特点，那就是明晰、快捷、生动和灵活中不失沉稳与庄严。然而，荷马的创作也受到时代的制约。由于他生活的年代文学主要还是一种口头（或口诵）行为，因而多采用一整套固定或相对固定的饰词、短语和段落。不过，反复出现的程式化用语固然在一定程度上阻碍了诗人迅捷、流畅的表达，但也具有明显的优点。它们不仅点出了被修饰者的身份、特征、背景和“属类”，而且也有助于突出作品的凝重、宏伟和肃穆的诗歌品位。\n\n在荷马史诗中，出现率较高的人物（包括神）往往有一个以上，有的甚至有几十个饰词或程式化用语。诗人可以根据格律和音步的需要选用合适的饰词。众多的饰词使诗人有可能不仅根据格律的要求，而且还能有意识地照顾到选择合适的用语。有时，为了维护史诗中程式化用语的稳定性，诗人会有意识地“忽略”饰词的原意和使用的语境而把它们当作单纯充填格律的成分。\n\n五、多使用明喻与象征手法\n\n荷马是一位功底深厚、想象丰富、善于创新的语言大师。荷马史诗辞章华丽，妙语迭出，生动、形象的用词和比喻俯拾皆是。在荷马史诗中，某些程式化饰词包含隐喻，不过总体还是以明喻为主。明喻是荷马用于表述民众生活的一条极富表现力的途径，明喻中的许多“情景”无疑取自诗人身边的生活，是普通人喜闻乐见的。荷马用明喻“调剂”战事的冗长和枯燥，使作品平添了几分情趣，散发出浓郁的生活气息。\n\n象征是诗歌创作中的常用手法，在荷马史诗里也到处可以找到。象征手段的运用给直接、明快的表述增添了耐人寻味的余地，拓宽了作品的纵深度。有时，诗人把象征表述和明喻融为一体，使之更富细巧、隽永的艺术魅力。如奥德修斯孤身渡海，船被巨浪砸成碎片，“像纷扬的谷壳”；抵岸后，他躺在灌木丛里，“像埋藏在灰烬中的火种”，就是将明喻与象征巧妙地结合在了一起的优秀例子。","keywords":"主题明确 中心突出 结构巧妙 布局完整 多方面塑造人物性格 语言明快 灵活运用程式化用语 明喻与象征手法","note":"荷马史诗可以说是古希腊文学成就的最高代表，在西方文学史上占据着极为重要的地位，因而在考查中出现的频率非常之高，尤其需要重点关注的就是荷马史诗的艺术特色。仅24年，就有深圳大学、厦门大学、江苏师范大学等多所院校对其进行了考查。此外，“荷马史诗”也会以名词解释的形式出现，大家要重点关注。"},{"id":"9","stars":"★★★","title":"阿喀琉斯人物形象分析","body":"荷马史诗刻画了一系列古代英雄的形象，阿喀琉斯就是其中最重要的人物形象之一。他是一个生动具体而又真实的伟大英雄的典型。\n\n一、个人英雄主义的典型\n\n阿喀琉斯是神与人之子，是一个非常骁勇善战的将领，对个人荣誉和尊严极度重视与敏感，具有斗争和反抗精神，极端的个人主义是其身上最突出的特质。阿喀琉斯爱自己的国家，但当他所珍视的尊严、荣誉、友情受到伤害时，他不惜一切代价维护。在其价值理念中，实现自己的价值和捍卫自己的荣誉，远比为整个希腊赢得战争更重要。\n\n二、固执、残忍、易怒的人性弱点\n\n阿喀琉斯的性格特征是勇武、暴躁、易怒。他任性、执拗，因为指挥官抢夺他的女俘而罢战，致使希腊军队惨败。面对\n\n此情，他无动于衷。而在挚友帕特洛克罗斯被杀之后，阿喀琉斯不顾希腊人的战败状态而决意复出复仇。\n\n在和杀死帕特洛克罗斯的赫克托耳决战时，赫克托耳曾哀告不要凌辱其尸体，而阿喀琉斯根本不睬，冲天的愤怒使他变成嗜杀的魔鬼，不光用多种形式侮辱赫克托耳的尸体，还疯狂地居杀特洛伊人，以至于尸体把河道堵住，河神出面阻止，他竟然同河神厮杀起来。这些都让我们看到了他残暴鲁莽固执的一面。\n\n三、善良、富有同情心、孩童般的温厚性格\n\n阿喀琉斯表现出残酷和善良的双重性格特征。当希腊联军因为阿伽门农的自私和固执而遭受阿波罗的瘟疫惩治时，阿喀琉斯第一个站出来，愿意放弃代表着他荣誉的战利品，为的是平息阿波罗的怒气。\n\n阿喀琉斯也有自己的恻隐之心。当赫克托耳的父亲老国王普里阿摩斯只身来到他的军营中，跪下来边亲吻他的手，并求他将自己最后一个儿子的尸体归还时，他立刻咒骂这场战争、咒骂引起战争的天神宙斯，并将赫克托耳的尸体还给了普里阿摩斯，宣布停止攻城十二天，让赫克托耳能得以安葬。\n\n由此可见，阿喀琉斯并非杀人如麻的恶魔，其善良本性在这些情境中凸显出来，也显得这半人半神的人物更具人性化特色。\n\n总之，古希腊人民有着海洋民族特有的性格特征和精神风貌。他们崇尚征服和冒险，追求自由和力量。他们推崇智慧和勇气，重视享乐和情欲。他们不懂掩饰，不会虚伪，有的只是孩子般的天真和可爱。阿喀琉斯的性格就是这种典型的希腊式的性格。他性格的复杂性、多样性、矛盾性，也正表现出他完整而丰富的“人”的形象。他既率真又固执，既善良宽厚又残暴凶狠，既任性又懂得尊重他人，与其说他是半人半神，倒不如说他是由神到人的另一种更深层次的进化。","keywords":"个人英雄主义的典型 固执残忍易怒 善良 富有同情心 由神到人","note":"古希腊是英雄的时代，神可以看作是英雄形象特征的理想化。诚然，阿喀琉斯是一个暴戾、杀戮、将自身荣耀建立在他人耻辱之上的英雄。但他重视友情、善良仁慈等诸多性格特点一样散发着光芒，这些性格特点共同构成了这位半人半神的英雄的矛盾共同体，让我们在了解古希腊众神的形象时也能看到其中有些艺术形象散发的人性光辉，其中蕴含的精神特质和价值观在当今时代仍有着不可磨灭的价值。"},{"id":"10","stars":"","title":"有人说阿喀琉斯的愤怒贯穿全诗，是推动全文的核心，结合具体作品，谈谈如何理解阿喀琉斯的愤怒","body":"（26江南大学）★★★\n\n《伊利昂纪》以阿喀琉斯的愤怒为开篇，以其愤怒的终结为结束，可以说，“愤怒”是这部作品十分重要的一个行为，对于阿喀琉斯的愤怒，我们可以做出如下理解：\n\n一、阿喀琉斯的愤怒是全文的主线\n\n《伊利昂纪》没有系统地叙述特洛伊十年战争的全部过程，只是集中笔墨描写了战争结束前一段时间内发生的事情。它描写了4天的战争和21天的埋葬仪式，再加上没有事件发生的26天空虚时间，一共仅有51天。整个文本始于阿喀琉斯的愤怒，以“女神啊，请歌唱佩琉斯之子阿喀琉斯的致命的愤怒”开头，神，希腊人以及特洛伊人在这样的背景下开始行动，结束于阿喀琉斯愤怒的暂时搁置-阿喀琉斯准许特洛伊老王赎回赫克托耳的尸体。因此，阿喀琉斯的愤怒可以说是整篇史诗的主线，起到了贯穿全文，推动故事发展的重要作用。\n\n二、阿喀琉斯的愤怒是两种权威碰撞的结果\n\n阿喀琉斯的愤怒，是两种权威之间较量的结果。阿伽门农的权威是世俗权威：他是阿开亚人的君王，又是希腊联军的最高统帅；他的手中还紧握着祖传下来的权杖，这“使他成为许多岛屿和整个阿尔戈斯的国王”，权杖由神所造也由神授予他的祖先，作为世袭的国王，阿伽门农具有神圣的权力，高高在上，凛然不可冒犯。\n\n阿喀琉斯也是权威-最勇猛的英豪，其勇力还在他这个王者之上，当权威和权威发生冲突时，权威显示自身重要性的最好办法就是以自己的权威优势来攻击对方，让对方的权威失去其权威性，从而有效地保住并抬高自身权威的权威性。所以，阿伽门农通过抢夺阿喀琉斯的女俘虏来维护自己的权威，而阿喀琉斯的愤怒正是自己权威受到侵犯的结果。\n\n三、阿喀琉斯的愤怒体现了“荷马时代”英雄伦理观的集体无意识\n\n在荷马史诗所表现的英雄时代，史诗中的所有人物都处于“威望”的伦理学之下，这种伦理学的核心在于对“威望”的追求，即非常深刻的自我性，自我于英雄本身，自我于英雄的集团本身。它的力量是如此的强大，以至于对死亡的无所畏惧和对现实“不合理”分配的“心甘情愿”。\n\n从阿喀琉斯离开家门登上驶向这个异己的国度开始，他已经把自己完全托付给了他者-“威望”的伦理观和价值观。表面上阿喀琉斯不惧死亡，其实他比谁都更恐惧烟消云散，唯一的解决途径就是抵达不朽的死亡。阿喀琉斯缘自“死亡”的恐惧感在社会极其复杂的因素的浸染下发展为“威望”的伦理观，伴随着其逐渐强大的力量和冲突逐渐形成一种“愤怒”，这种愤怒把他带到了特洛伊战场，使他和人民的国王争吵，然后好友的死让他把愤怒的对象回复到了特洛伊人身上，而老国王的演讲则让他从愤怒中暂时清醒过来，他开始“关心自己”，从古希腊著名的归告“认识你自己”的感性形式中暂时地回到了本己身上。\n\n因此，我们可以说阿喀琉斯作为“荷马时代”英雄的代表，其愤怒是意识形态的情绪化表征，这种意识形态扎根于英雄的伦理观，而这种伦理观是归属于古希腊人的社会“无意识基础”。其典型特征是自我性以及由之引起的对“不朽的死亡”的追求，在一定意义上它具有普遍性，也就是说他是文本里所有英雄共同追求的东西。\n\n综上所述，阿喀琉斯的愤怒，不仅在文本形式上有着重要的意义，还蕴含着非常深刻的文化内涵。","keywords":"全文的主线 两种权威碰撞的结果 英雄伦理观","note":"回答这道题，我们首先是要从文本出发，分析阿喀琉斯的愤怒在文本结构上的作用，但在此之上，我们还要做进一步思考，就是去讨论这一愤怒的背后所蕴含的文化内涵，这也是我们应该理解的内容。相关内容可以参考聂成军《意识形态的情绪化表征-阿喀琉斯的愤怒的初步文本分析》、雷体沛《阿喀琉斯愤怒的人类文化学意义-从完美理论的角度考察》"},{"id":"11","stars":"★★","title":"奥德修斯人物形象分析","body":"奥德修斯这个人物之所以具有巨大的魅力，正是在于他身上寄托着人们对于未知世界的渴求，给世人以激励。\n\n一、智者形象\n\n奥德修斯是荷马史诗中的智者形象，其主要特征是机智和刚毅。他献木马计攻破特洛伊，结束了长达10年战争；他用甜酒把巨人灌醉，刺瞎巨人的眼睛，逃脱了巨人的魔掌；他用蜜蜡把伙伴们的耳朵塞起来，把自己绑在桅杆上，既巧妙地度过了灾难，又欣赏了塞壬女妖的美妙歌声；他摆脱神女卡吕普索的7年挽留，坚持回家与普通人妻子团聚；在与向他妻子求婚的贵族子弟斗争时，他计划周密，暗设巧计，凭借智慧取得了斗争的胜利。\n\n二、深厚的恋土情绪\n\n奥德修斯对自己的故乡和部落集体怀有深厚的感情，认为“任何东西都没有故乡和父母那么亲密，即使我身在富饶之邦，也不能不怀念自己的祖国。”他对妻子和儿子一往情深，女神卡吕普索的身材容貌胜过他的妻子，但他对女神说：“尊贵的女神，请你不要为这件事生气；这一切我自己也晓得；聪明的佩涅洛佩在身材和容貌上都比不过你；她不过是个凡人，你却长生不老。可是我还是天天怀念，想要回家，想看到还乡的那一天。”\n\n三、早期奴隶主特征\n\n奥德修斯身上除了氏族社会贵族英雄的特征而外，也表现出早期奴隶主的特征，他为人狡诈，心胸狭窄，残酷凶狠，私有意识明显。朋友送他回到故乡，他在下船时仔细检查财物，查对数目，怀疑朋友偷他的东西。他对帮助过求婚者的奴隶实行野蛮的杀戮，十分残忍。\n\n总之，奥德修斯是政治家、商人、冒险家的典型，智慧和刚毅为其个性特色。《奥德修纪》集中描写他的机智勇敢、随机应变：木马计为其杰作，海上十年漂泊，全凭其足智多谋而化险为夷。这些英雄行为的动力来自他对部落集体和故乡的眷恋之情，正是这种爱感动了那些企图阻挡他返回故里的神与人。奥德修斯亲吻故乡大地之情节，足以生动表现他对故土之爱。史诗颂扬的这种恋土情绪，也构成后世西方文学的重要母题。","keywords":"智者形象 深厚的恋土情绪 早期奴隶主特征","note":"荷马笔下的奥德修斯个性鲜明饱满，作者礼赞了他的智慧、勇敢和坚毅，突出了他理性克制、善用计谋的特点，也客观刻画了他在奴隶主阶级外衣下不可避免具有的冷酷和残忍。分析奥德修斯复杂多面的个性特征，有助于深入探究古希腊人所推崇的品质与精神，一窥那个英勇而神奇的英雄世界。相关内容可参考陈静《浅析荷马史诗中奥德修斯的个性特征》，资料可在李凡文学正版群中领取。"},{"id":"12","stars":"★★★","title":"分析比较《伊利昂纪》和《奥德修纪》英雄形象（26哈尔滨师范大学）","body":"《伊利昂纪》和《奥德修纪》都塑造了一系列英雄形象，但二者成书于不同时期，诗人的思想难免会有发展，导致这两\n\n部史诗中的英雄形象也会有一定的区别，比较而言，可以从以下方面去分析：\n\n一、相同点\n\n（1）都具有较自觉的自我拯救意识\n\n史诗时代的古希腊人，正处于由野蛮到文明的过渡阶段，具有从人的“自在”性生存到“自为”性生存的过渡性，即人的独立自觉意识正逐步觉醒。在解除人对神的盲目崇拜后，希腊人乐观地相信：通过战场上英勇无畏的战斗，会场上智慧的辩论，竞技场上的角逐等，完全可以实现自我的拯救。《伊利昂纪》中阿喀琉斯是希望通过勇力证明自己的价值，获得自我拯救，而《奥德修纪》中的奥德修斯则是通过智谋平安返乡并成功复仇，以实现自我拯救。\n\n（2）追求世俗生活价值\n\n无论是《伊利昂纪》还是《奥德修纪》中的英雄，都会追求世俗生活的价值。荷马不厌其烦地反复描写英雄们日常生活，即是一个重要体现。比如，英雄们乐于享受丰盛肉肴和甜酒；渴望与女人同床共枕进入甜美的睡眠；他们亲切热情地招待朋友或陌生人；喜欢听歌人歌唱英雄们的事迹，或欣赏年轻人激情澎湃的舞蹈；叱咤风云的英雄遇到伤心事时，也会毫不掩饰地号啕大哭；为了维护自己的利益，他们会展开激烈的竞争，甚至不惜相互辱骂、攻击等等。阿喀琉斯会因为一个女俘而愤怒，奥德修斯要“探察”家中的奴仆，甚至妻子，是否对他仍忠心，维护自己的私有财产不受侵犯，均体现出了这一特点。\n\n二、不同点\n\n（1）体现的价值不同\n\n《伊利昂纪》和《奥德修纪》通过塑造两种不同特质的英雄以及他们暗藏机锋的对峙，对照了两种英雄价值：阿喀琉斯式的英雄，其标志性价值是“力量”，奥德修斯的招牌则是“智谋”。\n\n阿喀琉斯在（而且只在）战场上获得了短暂而光辉夺目的荣誉，他的生命曲线在那一刻达到光辉的顶点。奥德修斯饱受苦难和磨炼，但从战场结局和人生结局来看，他胜出一筹的是，不仅在战争中赢得了不朽的名声，而且平安返家，这正是阿喀琉斯的命运不允许他二者兼得的。\n\n（2）具体的内涵不同\n\n阿喀琉斯的英雄主义代表的是早期希腊英雄品德的最高境地，凭力量和英勇争取属于自己的荣耀，死不足惜；奥德修斯的英雄主义则突出智慧和计谋，纳入了多元的关怀：对名声、自我认知、正义和王权秩序的追求。阿喀琉斯的英雄形象和精神旨归更加单纯，并由此而更显理想者的锐利，就像火神为他打造的那面盾牌一样，其光芒令人难以逼视；奥德修斯则复杂得多，也凡俗得多，后人更容易从他身上看到自己的影子，这样的英雄不像阿喀琉斯只能供人景仰，而是可效仿和追寻的。\n\n（3）面对苦难的方式不同\n\n无论如何强调两类英雄的差异，荷马的英雄都无一例外地面对着生命的苦难。阿喀琉斯以昂然的人生姿态坦然直视之，将苦难掩映在耀眼夺目的荣誉下；奥德修斯则明白他面对的是“无穷无尽的艰难困苦，众多而艰辛，我必须把它们-历尽”，他承受的姿态不像阿喀琉斯那样傲岸，历经磨难的奥德修斯要卑微得多。在这个意义上，《奥德修纪》把英雄主义的魅力还原到人的基本生存状态：英雄只有接受了人之为人的卑微是不可避免的，人不可僭越神明，不可忘乎所以，才可能成功。而这一智识，也是荷马史诗的世界观的核心，英雄的经验、苦难和荣誉成为后人理解世界现实的依托之一。\n\n综上所述，《伊利昂纪》和《奥德修纪》中的英雄形象既有相同点，又有区别，但二者都是荷马时代希腊精神的反映。","keywords":"相同点 较自觉的自我拯救意识 追求世俗生活价值 不同点 价值不同 内涵不同 面对苦难的方式不同","note":""},{"id":"13","stars":"★★★","title":"从荷马史诗塑造的英雄形象谈荷马史诗的主题","body":"荷马史诗是古希腊文学中最早的一部史诗，它代表了古希腊文学创作的高峰，史诗塑造了大量的英雄形象，更突出了英雄人物在历史发展过程中的主导地位。其主题思想是歌颂氏族英雄，透过这些英雄形象，我们可以看到作品表现出了如下主题：\n\n一、古希腊人个体本位的价值观念\n\n荷马史诗中的英雄们视个人荣誉为第一生命，他们的行为动机都与个人的荣誉、爱情、财产、王位等分不开。\n\n尽管被预言要么默默无闻的长寿，要么光荣地战死，阿喀琉斯仍旧踏上了战场，同特洛伊人作战，他展现的不仅是英雄的勇气，更是英雄们所追求的“人的理性追求之最”，不自觉地走上了与神意抗争的道路。\n\n这些都表现了热爱生活，肯定和追求人的现世价值的积极乐观的人本思想，显示了希腊文化乃至整个西方古典文化的一个重要特征：重视生命对于个人的价值，具有很强的个体本位意识。\n\n二、歌颂英雄\n\n史诗的主题思想是歌颂氏族社会的英雄，因而只要代表氏族理想的英雄，不管属于战争的哪一方，都在歌颂之列。《伊利亚特》的基调是把战争看成正当、合理、伟大的事业，但同时又描写了战争的残酷、给人民带来的灾难、人民的厌战反战情绪，并通过英雄们的凄惨结局，隐约地表达了对战争的谴责。\n\n英雄史诗用神奇的笔调描写英雄的形象、突出英雄在历史发展过程中的主导地位，更重要的是它能启发人们的心智、鼓舞人们的斗志、引导人们缅怀祖先的英雄业绩、继承和发扬祖先的荣光、像英雄的祖先那样去进行生存斗争。\n\n三、历史意识\n\n在《荷马史诗》中，已经出现了古希腊人关于“历史”的最初概念，而且在一些篇章中还出现了表示“历史”概念的词语。尽管这个词语在史诗中使用时的含义并不确定，但是它至少已经包括了这样的意思，即：通过对目击者提供的证词进行调查、从而获得事实真相。后来希腊语中的“历史”一词，就是直接从这个含义上演变而来。\n\n四、自由主义\n\n《荷马史诗》是早期英雄时代的大幅全景，也是艺术上的绝妙之作，它以整个希腊及四周的汪洋大海为主要情节的背景，展现了自由主义的自由情景，并为日后希腊人的道德观念（进而为整个西方社会的道德观念），立下了典范。继此而来的，首先是一种追求成就，自我实现的人文伦理观，其次是一种人神同性的自由神学，剥除了精神世界中的神秘恐惧。《荷马史诗》于是成了“希腊的圣经”。\n\n五、抗争精神\n\n《奥德修纪》的基本主题是歌颂人对自然的斗争。古代人和自然相比虽然渺小，但人能够依靠勇敢和智慧战胜它们，同时史诗还歌颂了奥德修斯为维护私有财产和一夫一妻制这种新的社会制度所作的斗争。奥德修斯返乡后恢复家产并残酷报复了求婚者，清楚地显示了这一倾向。\n\n六、悲剧意识\n\n在史诗中，英雄们面对着命运的捉弄、战争的残酷和生死的轮回。虽然他们历经磨难，但始终坚持信念、追求理想，体现了古希腊人对人生悲剧性的深刻认识。\n\n赫克托尔预感到城邦将被摧毁，自己将要阵亡，妻子将沦为奴隶。可是他毅然代父上阵，身先士卒，最后血洒疆场。《伊利亚特》中对于赫克托尔辞别妻子出战和阵亡后全城为其举哀的场面的描写加重了这一形象的悲剧色彩。\n\n这种悲剧意识为欧洲文学的发展提供了重要的启示。","keywords":"个体本位 歌颂英雄 历史意识 自由主义 抗争精神 悲剧意识","note":"这是2023年西安外国语大学考查过的一道题目，大家注意理解。荷马史诗的基本格调是歌颂英雄，在史诗中，英雄们大都是拼搏沙场的战士，他们积极的人生态度，英勇无畏的精神，体现了古希腊人的英雄观。史诗中洋溢的乐观、积极向上的精神和与命运抗争的情怀正是荷马时代的英雄主义精神。"},{"id":"14","stars":"★★★","title":"古希腊悲剧的发生背景、特征，以及代表作家和代表作品","body":"一、产生背景\n\n古希腊悲剧起源于民间祭祀酒神狄俄尼索斯的歌舞和仪式。大约在公元前5世纪，“悲剧”一词开始在雅典用来指称在戏剧节上表现不幸和苦难的戏剧。在祭祀酒神的活动中，参加祭祀的人身披羊皮，装扮成酒神的随从萨提儿，组成颂神的合唱队。由身披山羊皮组成的歌队在祭祀酒神时唱的颂歌，最初既没有音乐性的变化，也缺乏戏剧的艺术性。\n\n从公元前6世纪开始，山羊合唱队开始向戏剧发展。在公元前6世纪中叶，希腊的悲剧演员忒斯庇斯为了让跳舞的人歇息，改变了娱乐的方式。他最早将主要演员从合唱队里分离出来，从而建立起个人表演的概念。他将合唱队之间的相互问答演变成对话，从而构成了戏剧的基本元素。\n\n公元前5世纪，悲剧作家埃斯库罗斯增加了第二个演员，使严格意义上的戏剧对话成为可能，并削弱了歌队的合唱成分，增加了戏剧的对话性，由此，希腊悲剧的形式和主体才固定下来。\n\n后来悲剧作家索福克勒斯又增加了第三个演员。虽然希腊戏剧里的主要演员从来没有超过三个，但是只有一个演员担任\n\n主要角色，其他的演员都担任次要角色。\n\n二、特征\n\n（一）反映社会现实，具有时代意义\n\n希腊悲剧具有高度的时代意义，它通过神话和英雄传说反映当时的社会现实，表现英雄人物的斗争，剧场成为民众发表政治见解的场所，多方面的主题在悲剧中得到表现，如伦理观念、命运观念、宗教信仰、民主制度、社会关系、国际与国内战争、家庭问题等。古希腊悲剧一般具有深远的历史、宗教和人文背景，探讨形而上的问题，把探索的触角指向伦理观的终端，探寻生活的意义，把人的生存看作是对智能和意志的挑战。\n\n（二）在艺术形式方面，悲剧由话语和唱段组成\n\n话语通常用三音段（或六音步）短长格表述，而唱段则采用众多的抒情格写成。希腊悲剧都有固定的结构形式，即开场、入场、插曲、退场。\n\n戏剧开场时由主要演员朗诵开场白。开场白的功能是将场景和剧情安排在戏剧框架里，是全剧不可缺少的一部分。入场即合唱队的入场，接着便是通常的三场戏，最多可达七场。插曲属于悲剧的两个合唱曲之间的部分，这时有新的合唱队演员进入。退场即结束演出，全体演员从舞台上离去。\n\n古希腊悲剧的特点是把表演、舞蹈和歌唱融合在一起，因而更接近歌剧而不是现代戏剧。歌队是悲剧的原始成分，合唱在早期作品中占有相当大的比重。歌队可以以剧中人的身份介入剧情发展，亦可代表观众对人物或事件进行评论，有时还以城邦利益的阐述者身份出现。\n\n三、作家作品\n\n根据希腊历史文献记载，古希腊产生过大量的悲剧作家，但是只有埃斯库罗斯、索福克勒斯和欧里庇得斯有完整的悲剧作品流传下来，成为古代希腊戏剧遗产的代表。\n\n（一）“悲剧之父”埃斯库罗斯\n\n埃斯库罗斯是古希腊悲剧的真正创始者，恩格斯称他为“悲剧之父”和“有强烈倾向的诗人”。埃斯库罗斯通过古老的神话在悲剧中提出了一些重大的社会主题，如从母权制社会向父权制社会转变过程中出现的伦理和道德、正义和法律等方面的社会观念。代表作品《普罗米修斯》是由《被缚的普罗米修斯》《解放了的普罗米修斯》《带火的普罗米修斯》三部悲剧组成的三联剧，后两部没有流传下来。《被缚的普罗米修斯》取材于神话，其中普罗米修斯是反抗暴君、具有民主精神的英雄形象，为了人类的幸福他宁愿忍受一切苦难。马克思赞誉他是“哲学日历中最高尚的圣者和殉道者”。此外，《俄瑞斯忒斯》是埃斯库罗斯所取得的最伟大的成就，也是希腊悲剧中最成功的作品之一，分为《阿伽门农》《莫酒人》《报仇神》三部。\n\n（二）“戏剧艺术的荷马”索福克勒斯\n\n索福克勒斯是雅典奴隶主民主政治繁荣时期的悲剧作家，被誉为“戏剧艺术的荷马”。他的悲剧全面反映了伯里克利黄金时代的社会生活、风俗和观念，具有重要的社会意义和历史意义。他的悲剧对后世作家产生了重要影响，促进了欧洲现代戏剧的发展，加强了人们对悲剧美学的认识。在60年的创作活动中，他共写作130部悲剧，但只有7部悲剧完整地流传下来，它们是《埃阿斯》《安提戈涅》《俄狄浦斯王》《厄勒克特拉》《特拉基斯妇女》《菲罗克忒忒斯》和《俄狄浦斯在科罗诺斯》。其中最重要的悲剧是《俄狄浦斯王》，结构复杂，布局严密巧妙，一环扣一环，表现了人和命运的抗争。亚里士多德认为《俄狄浦斯王》是希腊悲剧的典范，莱辛称赞它是最完美的悲剧。\n\n（三）“剧场里的哲学家”欧里庇得斯\n\n欧里庇得斯的一生经历了雅典民主制上升、繁荣和衰颓的时期，当时的各种政治和经济矛盾，如奴隶主与奴隶之间的矛盾、新产生的城市富豪与贫民之间的矛盾、土地贵族寡头派与工商界民主派之间的矛盾、雅典集团与斯巴达之间的矛盾等，都不同程度地在他的悲剧中得到反映。他拥护民主政治，提倡民主精神，反对雅典对待盟邦的高压政策，谴责给人民带来灾难的战争。他拥护民主政治，提倡民主精神，反对雅典对待盟邦的高压政策，谴责给人民带来灾难的战争。欧里庇得斯对希腊悲剧发展的主要贡献是写实手法和心理刻画，是“问题剧”的创始者，欧里庇得斯突出地描写了妇女题材，对当时社会地位低下的妇女寄予了莫大的同情。欧里庇得斯的主要作品是《特洛亚妇女》和《美狄亚》。《美狄亚》最早为妇女鸣不平，故事取材于神话，是西方早期典型的“社会问题剧”。","keywords":"产生背景 祭祀酒神 山羊合唱队 反映社会现实 话语和唱段组成 作家作品 埃斯库罗斯《俄瑞斯忒斯》索福克勒斯《俄狄浦斯王》欧里庇得斯《美狄亚》","note":"本题为2023年同济大学考研真题。24年中国人民大学、华东师范大学，26年陕西师范大学也对古希腊三大悲剧作家进行了考查，大家要重点掌握。其中古希腊悲剧的发生背景这一小问，其实是在考查悲剧的起源，主要回答希腊悲剧的产生演变过程。另外，后面题目会详细叙述作家作品，大家可以将二者结合记忆。"},{"id":"15","stars":"★★★★★","title":"简析古希腊悲剧的命运观念","body":"在古希腊悲剧中，自始至终都贯穿着“命运”这一主题，悲剧作家们在作品中诠释着对命运的认知，悲剧是古希腊戏剧中最负盛名的艺术形式，希腊悲剧也被后人称作命运悲剧。“命运”构成了希腊悲剧中故事情节和人物性格发展的最重要的线索，也成为希腊悲剧中最摄人心魄、最有魅力的因素。\n\n一、人的意志与命运的冲突是古希腊悲剧中的常见主题\n\n古希腊悲剧主要写主人公的个人意志和命运的冲突。在希腊人看来，不堪苦难而又不得不承受苦难的处境，是神灵也无法逃脱的命运。因此，人的意志与命运的冲突是古希腊悲剧中的一个常见主题。\n\n二、古希腊人的命运观：命运是不可抗拒的\n\n按照古希腊人的观念，命运是不可抗拒的，不可解释的，难以捉摸的。所谓“命运”，其实是客观规律的必然性。古希腊人限于思想及科学水平，无法认识，所谓人与命运的冲突，实际上反映了人与外界环境，人与人之间的冲突。命运悲剧是古希腊人反映社会矛盾的一种特殊形式。在希腊悲剧中，古代希腊人如此悲戚黯然的命运观念，这种对不祥事物不可抗拒的力量的疑惧，对大难临头的祸患的预感，可能来源于一个多灾多难的民族的生命体验和人类处于生产力水平低下时期的感悟。\n\n三、随着社会的发展，命运观也在发生变化\n\n不同社会发展阶段，人们对命运观的认识也不同。古希腊三位悲剧诗人在命运观上的差异就说明了这一点。\n\n（一）埃斯库罗斯继承了荷马带有浓烈悲剧色彩的命运观，神化了古希腊文学一再强调的命运主题。在他生活的时期，社会动荡，新生民主势力迅速崛起，贵族势力逐渐式微。社会制度的变革和社会模式的更替使得埃斯库罗斯的思想也发生了巨大的改变。出身贵族的他，最终冲出了本阶级的束缚，为民主而呼喊，反对贵族阶层的专制，推崇自由。同时，古希腊神秘的宗教对他造成了深刻的影响。\n\n神秘的宿命论贯穿了他一贯的思想。他对命运深信不疑，他认为，在神秘不可测的命运面前，人类是无能为力的，任何努力都归于徒劳。在其代表作《俄瑞斯忒斯》三部曲中，任何人都不能逃脱神的旨意，阿伽门农的妻子在复仇女神的暗示下弑夫，而他的儿子又依照阿波罗神的示意杀掉母亲为父亲复仇。之后，在裁决俄瑞斯忒亚是否应该因杀母而被判罪时，智慧女神雅典娜投出了关键的一票，俄瑞斯忒亚被判无罪。在长达三部的悲剧中，读者可以看出，所有人物的命运都操纵在神的手中。而实际上，悲剧的主角就是命运本身，甚至万神之主宙斯也无法摆脱命运的惩罚。埃斯库罗斯认为，人无法掌控命运，只能消极地任凭命运摆布。\n\n（二）索福克勒斯比埃斯库罗斯晚20多年出生，他的时代正是雅典从奴隶民主制的巅峰逐渐衰退的时代，他目睹了雅典被斯巴达打败的过程。索福克勒斯对政治兴趣浓厚，一生支持民主运动，他一方面为雅典的繁华所骄傲，一方面又看到了这种表面繁华后的虚空，他的悲剧作品正描绘了这个时期雅典的社会风貌。他留给后世最著名的作品莫过于那部集思想性与艺术性于一体的完美悲剧-《俄狄浦斯王》。在他的前辈埃斯库罗斯眼中，命运是公正的，人类只能接受与顺从，而索福克勒斯却大胆地质疑了上天安排的公正性，并与命运进行了抗争。\n\n在埃斯库罗斯的悲剧中，主人公永远是积极向上的，即便命运已经安排好，他们也没有放弃对希望的追求。然而在索福克勒斯笔下，主人公在最后已经被命运折磨得悲观绝望、痛苦哀号，他越积极就离悲剧越近，他的悲剧让我们感到恐怖。不过，索福克勒斯并没有陷入消极宿命论，而是肯定了人对于命运的抗争，推崇了人的自由意志。俄狄浦斯王是理想的化身，勤政爱民。正因为他的灭亡，昭示了命运的不公与非正义，也证明了奋起反抗命运的合理性。\n\n（三）欧里庇德斯是古希腊三大悲剧家中最晚的一位。那时，雅典的奴隶主民主制已经彻底衰落，老百姓过着贫苦的生活。他喜欢安静独立地思考人生，并不热衷于政治运动和公共事务，长久的思考使他的哲学思想达到了前几位悲剧家所没有的高度。在《美狄亚》中，美狄亚的一举一动都是内心驱使，丝毫没有听从神意的摆布。\n\n在之前的悲剧中，俄瑞斯忒亚和俄狄浦斯王都被迫接受了命运的安排，他们所犯的杀母、弑父的罪行证明了命运的强大与不可违抗。然而，美狄亚有着比当今的妇女更独立的意识，虽然她对亲儿子有万般不舍，但她还是毫无悔意，惩罚负心汉伊阿宋，不与命运妥协，是她的终极目的。美狄亚的复仇行动，源于内心的愤怒，为了反抗成为弃妇的命运，她精心策划了杀死孩子的计划。在欧里庇德斯眼中，美狄亚的行为是可以理解的，甚至是值得肯定的。对于命运的反抗，成为悲剧《美狄亚》最震撼人心之处。此时，希腊悲剧中的命运观念已经彻底动摇。\n\n可以说，埃斯库罗斯的悲剧证明了神的公正；索福克勒斯的悲剧质疑了神性，推崇了人的自由意志；而欧里庇德斯则否认了神性，将人的自由意志摆在了前所未有的高度，他将命运完全归咎于人性本身，人内心的激情与欲望是人的命运的根源。\n\n总之，以上三位悲剧诗人的创作从不同的方面反映了当时人们对命运的看法，而因为他们各自创作的时间大致相承接，刚好贯穿了希腊民主制度由建立、繁荣到衰落的发展阶段，其各自对命运的看法与表现，客观上就反映了剧作家民主思想不断增强、主体精神不断提高的发展过程。","keywords":"人的意志与命运的冲突 命运是不可抗拒的 变化 埃斯库罗斯 宿命论 索福克勒斯 质疑抗争 欧里庇德斯 不与命运妥协","note":"古希腊悲剧的命运观念有一个发展的过程，大致是从神性到人性，从命运天定到人的自由意志决定命运的过程。命运观念不仅在古希腊悲剧中有所体现，而且贯穿了整个古希腊文学，如果是问的古希腊文学的命运观念，可以结合神话、史诗进行说明，重点突出悲剧即可。另外，三大诗人各自不同的命运观，也可能会单独设题，需要大家有所掌握。"},{"id":"16","stars":"★★","title":"简述《俄瑞斯忒斯》的内容及主题","body":"一、内容\n\n三部曲《俄瑞斯忒斯》是埃斯库罗斯所取得的最伟大的成就，也是希腊悲剧中最成功的作品之一。悲剧分《阿伽门农》《莫酒人》和《报仇神》三部。《阿伽门农》叙述阿伽门农在特洛伊战后回到家中被其妻及奸夫谋害的经过；《奠酒人》叙述俄瑞斯忒斯（阿伽门农之子）为报父仇而杀母的故事；《报仇神》叙述俄瑞斯忒斯被复仇女神紧追不舍，按照神谕来到雅典向雅典娜求救，最终被判无罪。\n\n二、主题\n\n埃斯库罗斯通过古老的神话在悲剧中提出了一些重大的社会主题，如从母权制社会向父权制社会转变过程中出现的伦理和道德、正义和法律等方面的社会观念。\n\n在《阿伽门农》中阿伽门农的妻子克吕泰涅斯特拉杀死了丈夫，她为自己的罪行辩护的理由主要有两个：一是阿伽门农杀了她女儿祭神，她要为女儿报仇；二是她跟被她杀死的男人没有血缘亲属关系，而只是一种婚姻关系，因此她没有犯罪。\n\n在《莫酒人》中俄瑞斯忒斯杀死了自己的母亲，为父亲报了仇，但是却遭到复仇女神的追逐。\n\n《报仇神》是悲剧最重要的部分，它叙述了俄瑞斯忒斯在阿波罗的指引下来到雅典向雅典娜寻求庇护的故事。雅典娜成立了一个雅典法庭，审判俄瑞斯忒斯杀母一案，并围绕此案出现了与法律、道德和社会正义有关的不同的思想观念。按照母权制时代的观念，克吕泰涅斯特拉和阿伽门农没有血亲关系，因而她杀死丈夫是无罪的。而俄瑞斯忒斯同母亲有着血亲关系，因此他杀母是有罪的。\n\n雅典娜作为理性的化身主持正义，坚决地站在父权制一边。最后法庭判决俄瑞斯忒斯无罪是父权制所取得的胜利，复仇女神的转变也表明母权制终于退出了历史舞台。雅典法庭的建立和对俄瑞斯忒斯一案的成功审判，表明一种以父权制为核心的新的秩序得到确立。","keywords":"母权制过渡到父权制","note":"从三部曲反映的社会生活来看，《俄瑞斯忒斯》悲剧冲突来自母权制向父权制过渡时期两种制度之间的伦理道德冲突。俄瑞斯忒斯的获胜，反映了父权制对母权制的取代。克吕泰涅斯特拉与历史的发展对立，必定是悲剧性结局。她的悲剧不仅在于她自己的毁灭，更在于她代表了一种社会制度的毁灭。三部曲的悲剧冲突是多层次展开的，这使三部曲有了丰富的内涵，表达了多重主题。"},{"id":"17","stars":"★★★★","title":"《俄狄浦斯王》的艺术特点","body":"《俄狄浦斯王》是索福克勒斯的代表作，其在艺术上取得的成就使它成为古希腊悲剧艺术的典范。\n\n一、戏剧结构严谨精巧\n\n《俄狄浦斯王》的故事情节错综复杂，但剧作家以高度的概括能力，采用倒叙的方法，把戏剧冲突浓缩在俄狄浦斯追寻杀死老国王凶手一事上，通过不同人物的上场，将剧情一步一步地推向高潮。因为其结构艺术的突出，索福克勒斯因此被称为“戏剧艺术中的荷马”。\n\n二、戏剧技法巧妙，情节富于戏剧性\n\n索福克勒斯善于运用悬念、回顾、突转和发现的方法推动剧情向前发展。\n\n《俄狄浦斯王》剧本成功地运用了“回顾式”的结构方法，为了使剧情完整，情节集中，悲剧采取倒叙和回溯的手法对情节的前因后果做了一定交代，这样就避免了情节的突兀。如诗人借伊俄卡斯忒和克瑞翁之口对拉伊俄斯之死作了交代，借牧羊人之口介绍了俄狄浦斯的身世，借俄狄浦斯之口讲述了他逃离神谕的行为，这些回溯和剧情构成了一个完整的有机整体。\n\n此外，诗人还借助“发现”和“突转”将剧情层层推进，使情节显得紧张而富有层次。“发现”指从不知到知的转变，“突转”指事情或者人物向顺境或者逆境的转变。在戏剧中，“发现”和“突转”同时出现，会有较好的戏剧效果。剧中第一次“发现”是伊俄卡斯忒说“先王死在山岔路口”，引发了俄狄浦斯的怀疑，如果事实确凿，那么他的身份会发生突转，由明君变为杀害前任国王的凶手。第二次“发现”是报信人告诉俄狄浦斯波吕玻斯死亡的消息，为打消俄狄浦斯的顾虑，报信人告诉俄狄浦斯其实他并非波吕玻斯的亲生儿子，从而引发了俄狄浦斯对自己身世的发现，剧情突转，一个执意逃脱命运的人，一个坚决追查凶手以便让城邦安宁的人，最终成为罪恶的根源。\n\n三、人物性格塑造鲜明生动\n\n索福克勒斯利用剧情的发展推动人物性格的塑造，让角色的个性服务于创作意图的实现。他在塑造俄狄浦斯形象时，将其性格的形成看作是一种目的明确的行动的必然产物，在行动中揭示了他的英雄品格。\n\n俄狄浦斯是一个具有坚强意志的君王，在征服怪兽斯芬克斯之前，为过往路人的安全，他几乎是怀着必死的信念去回答她的谜语；在追查凶手的过程中，尽管先知忒瑞西阿斯和牧羊人一再暗示俄狄浦斯本人就是凶手，他也没有停止追查的脚步；真相大白之后，俄狄浦斯用金别针刺瞎了自己的双眼，并恳求克瑞翁将他驱逐出忒拜，没有丝毫乞怜的意思。所有这些都能体现出他那种坚强的性格。\n\n四、文风严峻，语言细腻\n\n《俄狄浦斯王》整个悲剧情节、人物、气氛庄严肃穆，但语言细腻，采用抑扬格三音步，诗句尾音柔和，节奏停顿富于变化，不失韵律流动之美。","keywords":"结构严谨精巧 戏剧性 悬念、回顾、突转和发现 性格塑造鲜明 文风严峻 语言细腻","note":"《俄狄浦斯王》是索福克勒斯的代表作，其在艺术上取得的成就使它成为古希腊悲剧艺术的典范。古希腊悲剧反映了古希腊人的民主思想，具有“崇高”的美学风格和严谨的结构，布局巧妙，显示了高超的艺术技巧。上述几个特点不仅是《俄狄浦斯王》所具有的，也是所有古希腊悲剧所共有的，所以在考古希腊悲剧的艺术特点时可以借鉴。此外，《俄狄浦斯王》也是一个重点名词解释，大家要注意积累。"},{"id":"18","stars":"★★★","title":"如何看待俄狄浦斯弑父娶母的悲剧","body":"在远古时代，杀父娶母曾经是一种普遍的现象，当新的氏族首领诞生时，他便承接了对氏族女性的支配权，杀父娶母就是在这样一种漠然无知的状态下发生的。但是，由于生产力的发展，道德意识的萌发，人们对以往的杀父娶母行为深感不安，这种乱伦也成为一种禁忌。索福克勒斯的悲剧《俄狄浦斯王》就曲折地反映了人类文化发展的过程，也说明了新旧伦理之间由此展开的激烈冲突。\n\n一、“命运悲剧”\n\n俄狄浦斯可以凭借自己的智慧以及才识来对斯芬克斯谜题进行破解，他的知识让他能够合理地解决瘟疫问题，并成为国王，但是他依旧逃脱不掉“弑父娶母”的命运安排，他越是挣扎，就越是被束缚，最终的结果还是一样。而杀父娶母这一悲剧表现了氏族社会统治者因为争夺王位而导致的血亲残杀，但作者对此进行了加工，将其归宿于命运，反映了后人对这种血亲残杀的文明化解释。\n\n二、“性格悲剧”\n\n俄狄浦斯难以摆脱命运，但他选择了逃避的方式抗争，当抗争无望的时候，他对自己实施了惩治，刺瞎双眼，流浪余生，即“性格悲剧”。\n\n俄狄浦斯王性格中的缺点主要表现在过于自负和自信。比如在对杀死老国王的凶手进行调查，以及消除瘟疫时，俄狄浦斯都坚信只要凭借自己的理性与智慧，就能得到真相、解除瘟疫，并且他坚信，不可能是自己杀死了老国王。他面对质问时说：“你尽管质问，反正不能把我判成凶手。”俄狄浦斯的智慧被自己极端的自负蒙蔽，他开始主观臆断，缺少对自我的审视。俄狄浦斯王性格中的缺陷使得他一步步趋向于悲剧，他的悲剧命运并不是什么神秘的力量导致的，而是他自身性格中的缺陷驱使他行动，进而造成的。\n\n三、新的伦理道德秩序\n\n俄狄浦斯的悲剧本身，表明新的伦理道德秩序已经建立了起来，而且得到了众人的认可，成为了普遍的准则。他追找凶\n\n手，惩治自己，都反映了这种伦理秩序。同时，他的悲剧也从反面说明了破坏这一伦理秩序的可怕后果，即使这种乱伦是无意识的，也仍然要付出惨重的代价，一旦新的社会伦理道德确立就必须遵守与维护，否则就会给心灵以及国家带来痛苦和灾难，作者也借此达到了警戒众人的目的。\n\n总之，俄狄浦斯杀父娶母的悲剧表面上看是神的旨意，实质上却是俄狄浦斯的“宿命”-无论他怎么挣扎也无法摆脱的命运，是他客观上的自我人生选择，更是父权社会下子嗣实现自我价值和自我认同的悲剧结果。俄狄浦斯的悲剧代表着社会文明的进程，说明人类社会已经在新的社会基础上建立了相应的伦理道德关系，并在维护这种新的关系的过程中付出了沉重代价。","keywords":"“命运悲剧”“性格悲剧”新的伦理道德秩序","note":"24年南京师范大学对《俄狄浦斯王》的悲剧内涵进行了考查，同年，广东外语外贸大学也对俄狄浦斯王中所体现出的古希腊命运观做了考查。《俄狄浦斯王》是一个关于命运与人的故事，命运在故事中具有某种必然性和确定性，命定的结局永远无法更改。然而，这种无法改变的结局是通过人的自主选择造成的，是人自己的行为造成了命运的被实现，或者说，人的行为、人的自主选择也不过只是既定命运中的一环罢了。无论结果如何，正如朱光潜在《悲剧心理学》中说的：“悲剧往往是以疑问和探究告终。”俄狄浦斯的言行，正体现了人类对生存意义不停的思考，在这些思考中，人类确立了自我的锚点。"},{"id":"19","stars":"★★★","title":"如何看待《美狄亚》的杀子复仇","body":"欧里庇得斯的代表作《美狄亚》以希腊神话中美狄亚的故事为题材，塑造了一个通过杀害自己儿子而向负心的丈夫伊阿宋复仇的女性形象。如何看待美狄亚杀子复仇的行为，是一个值得探究的问题：\n\n一、内部原因与外部环境的层层叠加\n\n被抛弃的美狄亚在第一场首次出现时有一段大段的独白，令人惊讶的是，诗人并没有让她如寻常弃妇那样先去指责伊阿宋的负心弃义，而是借美狄亚这个外乡女子的视角来批判雅典城邦对于妇女的态度。这样应该更能触动前5世纪舞台下的观众。\n\n美狄亚这个有决断的女子，在剧中一开始质疑的不是伊阿宋喜新厌旧的个人品质，而是伊阿宋身上呈现的新的文明-以男性为中心的父权制文明的规定。她的复仇是在感情遭到巨大打击后采取的有意识反抗，不仅是一种生存抗争，而且还是对压迫她的社会的一种反抗。\n\n二、两性文明失衡\n\n马克思曾经说过，两性关系是最能说明人类在何种程度上摆脱了自然界，而成为了真正意义上的人的。所以，在文明进步的长河中，对于两性文明失衡的质疑与探讨一直是一个萦绕人心经久不息的话题。\n\n当时的古希腊处于奴隶社会时代，虽然确立了一大一妻的家庭形式，但社会的实质仍是男尊女卑，妇女的地位极其低下。\n\n在当时人们的观念中，“真正的生育者被认为是父亲，母亲则被认为只是父亲的种子的培育者和保护者。”男性地位正是通过父与子之间的血缘关系来明确的。\n\n美狄亚的杀子复仇，反映出当时父权制社会观念和伦理道德思想对人们思想和行为的主导作用，同时也反映出美狄亚还是无法摆脱父权制时代的局限。\n\n三、不同地域文化的冲突\n\n美狄亚来自东北部地区，在当时发达的南部地区看来，她及其家乡代表着野蛮。不同地域的文化冲突通过人物之间的台词反映了出来，例如伊阿宋的辩解之词就指向了美狄亚来自蛮荒之地，在这样的背景下，美狄亚同伊阿宋的冲突也就具有了地域文化意义。由此来看，美狄亚的复仇也是地域文化冲突的形象化表达。\n\n四、人类童年时代的个体意识体现\n\n这种个体意识的萌发，其实是作为早期人类的古希腊人本能天真而又深刻的自发表现。马克思把古希腊的神话艺术视为“人类的童年时代”的诗。\n\n弗洛伊德在心理学史上指出，人的理性、道德、文明修养，一方面升华着孩提式的蒙昧，一方面压抑着童年时代对快乐的自由追求、对现实的奇幻想象、对情感的恣意表达。\n\n从埃斯库罗斯的英雄悲剧，到索福克勒斯的性格悲剧，再到欧里庇得斯的心理悲剧，主人公由神走向人。从普罗米修斯到俄狄浦斯再到美狄亚，希腊悲剧记录了人类早年如何一步步体察社会，一步步认识自身的轨迹。","keywords":"女性地位 两性文明失衡 不同地域文化的冲突 人类童年时代的个体意识体现","note":"2023年中国海洋大学有一道类似题目：“如何看待美狄亚的复仇？”如何认识美狄亚杀子复仇，关系着对这部作品思想内容的评价。《美狄亚》中的复仇表现了母权制向父权制让位的过程中社会关系的各种变化，即新旧社会秩序和伦理道德关系在寻找各自的位置时，引起女性在婚姻、家庭、社会地位等各方面的震荡与变换。大家在分析作品中某种现象出现的原因时，要注意到外部的社会原因。"},{"id":"20","stars":"★★★★","title":"古希腊戏剧在审美、主题、人物塑造上的特点及对后世的影响（25首都师范大学）","body":"古希腊戏剧包括悲剧、喜剧、萨图罗斯剧（一译“羊人剧”）和拟剧（一译“模拟剧”）等，古希腊戏剧是西方戏剧的源头，其审美、主题和人物塑造的特点不仅奠定了戏剧艺术的基础，还对后世文学、哲学乃至社会思想产生了深远影响。\n\n一、审美特征\n\n（一）艺术形式的融合性\n\n古希腊戏剧以诗歌、音乐、舞蹈、服饰等多元艺术元素的融合为特点，形成“整体艺术”的审美框架。瓦格纳曾受此启发，认为其表现力超越单一形式，并试图在现代歌剧中复兴这种综合艺术理念。\n\n（二）仪式性与集体性\n\n起源于酒神狄俄尼索斯的祭祀仪式，演出场合（如雅典狄俄尼索斯剧场）具有宗教性和公共性，观众参与感极强。歌队的运用是核心审美特征，既推动剧情又代表“群体声音”，形成抒情与叙事的平衡。\n\n（三）舞台与表演的规范性\n\n采用露天半圆形剧场设计，注重演员的肢体语言与声音表现，合唱队既是剧情参与者，也是情感与哲理的传递者，形成独特的仪式感与沉浸式体验。\n\n（四）庄严的悲剧美学（以悲剧为主）\n\n遵循“三一律”（时间、地点、情节的统一），结构严谨，强调命运的不可抗性与冲突的必然性。通过“突转”与“发现”（如《俄狄浦斯王》中真相揭露）引发观众的“恐惧与怜悯”，实现亚里士多德所说的“卡塔西斯”（净化）。\n\n（五）日神与酒神精神的平衡\n\n尼采提出古希腊戏剧的审美核心是日神（理性、秩序）与酒神（感性、狂欢）的对立统一。悲剧通过两者的动态平衡，既展现表象的和谐，又揭示本质的冲突与生命力量。\n\n二、主题特征\n\n（一）命运与自由的永恒冲突\n\n（1）宿命论的悲剧性表达\n\n悲剧通过英雄无法逃脱的神谕（如俄狄浦斯弑父娶母），强调命运的不可抗性，同时展现人物在困境中保持尊严的崇高精神。\n\n（2）抗争精神的颂扬\n\n普罗米修斯反抗宙斯、安提戈涅挑战王权等情节，凸显人类对自由与正义的追求，赋予悲剧以鼓舞力量。\n\n（二）社会批判与人性探讨\n\n（1）揭露社会矛盾与道德困境\n\n喜剧（如阿里斯托芬《吕西斯忒拉忒》）通过夸张讽刺，批判政治腐败、性别压迫和社会不公；悲剧则通过英雄的受难（如俄狄浦斯的悲剧），揭示人性的盲目与抗争。\n\n（2）哲学与伦理的深层追问\n\n戏剧常借角色对白与合唱队评论，探讨自由意志与命运的对抗（如《俄狄浦斯王》）、个人责任与集体利益的冲突（如《安提戈涅》），引发观众对生命意义与道德选择的思考。\n\n（三）和平与政治的现实关切\n\n（1）反战与和平主题\n\n部分作品（如《吕西斯忒拉忒》）以女性集体反抗战争为线索，呼吁社会和解，反映古希腊城邦对战争与和平的深刻反思。\n\n（2）民主价值观的传递\n\n戏剧通过公共演出形式强化公民意识，批判僭主政治，宣扬民主制度下的自由辩论与集体决策。\n\n三、人物塑造特点\n\n（一）神性与人性的交织\n\n悲剧人物多为兼具神性与人性的英雄（如俄狄浦斯、普罗米修斯），既展现智慧与勇气，又暴露盲目与脆弱，通过命运抗争凸显人性的复杂张力。（二）复杂性与矛盾性\n\n人物多呈现多维性格，如俄狄浦斯兼具智慧与盲目，体现人性的脆弱与抗争；欧里庇得斯笔下的女性角色（如狄安娜）打破被动形象，展现主动性。\n\n（三）象征性与普遍性\n\n神话人物被赋予普世意义，如普罗米修斯象征反抗精神，赫拉克勒斯代表英雄主义，成为后世文学原型的源头。（四）女性角色的颠覆性塑造\n\n突破传统被动形象，美狄亚的复仇、吕西斯忒拉忒的反战行动等，通过女性主体性展现对性别压迫的批判。\n\n（五）边缘群体的隐喻化呈现\n\n奴隶、异邦人等次要角色常作为社会矛盾的观察者，其台词隐含对城邦制度的反思。\n\n四、后世影响\n\n（一）戏剧结构与艺术形式的奠基\n\n（1）歌剧与音乐戏剧的源头\n\n古希腊戏剧中“戏剧性与音乐性”的结合，直接影响了西方歌剧的诞生。文艺复兴时期，歌剧被视为古希腊戏剧精神的复兴与重构，其叙事模式与音乐表达延续了古希腊传统。除此之外，古希腊开创了悲剧（埃斯库罗斯、索福克勒斯、欧里庇得斯）和喜剧（阿里斯托芬）的基本范式，成为后世戏剧类型的源头。\n\n（2）舞台表演的范式创新\n\n索福克勒斯通过增加演员数量、强化人物心理深度（如《俄狄浦斯王》），确立了多角色互动与复杂情节的戏剧结构，为现代戏剧的舞台调度和角色塑造提供原型。\n\n（3）结构程式\n\n如“三一律”（时间、地点、情节的统一）、合唱队的运用、冲突的构建等，影响了文艺复兴时期的莎士比亚、古典主义的拉辛，甚至现代戏剧。\n\n经典题材的传承：许多古希腊戏剧的主题（如俄狄浦斯、美狄亚、安提戈涅）被后世反复改编，成为永恒的文化母题。\n\n（二）文学传统与叙事主题的延续\n\n（1）悲剧精神的永恒母题\n\n古希腊悲剧对命运抗争（如俄狄浦斯）、人性矛盾（如美狄亚）的探讨，成为莎士比亚、歌德等作家创作的核心主题，\n\n并延伸至现代存在主义文学对生存困境的反思。\n\n（2）喜剧讽刺传统的传承\n\n阿里斯托芬通过《鸟》《吕西斯忒拉忒》等作品开创的政治讽刺与社会批判手法，被莫里哀、萧伯纳等剧作家继承，形成西方喜剧针砭时弊的创作传统。\n\n（三）政治思想与公共文化的渗透\n\n（1）民主价值观的传播载体\n\n古希腊戏剧在城邦广场的公演形式，强化了公民参与公共议题的意识。其通过剧情辩论（如《安提戈涅》中法律与伦理的冲突），为现代民主社会的舆论场域提供思想原型。\n\n（2）社会批判的工具性功能\n\n戏剧作为反映贫富差距、性别压迫的媒介（如《吕西斯忒拉忒》的反战主题），启发了后世艺术介入社会运动的实践模式。\n\n（四）哲学与人文主义的启蒙作用\n\n（1）理性思辨的戏剧化表达\n\n古希腊戏剧通过角色对白与合唱队的评论（如《俄狄浦斯王》中的命运之辩），将苏格拉底、柏拉图的哲学思辨转化为大众可感知的叙事，推动启蒙运动对理性主义的推崇。\n\n（2）人性探索的跨时代共鸣\n\n戏剧中对自由意志、道德责任的探讨（如普罗米修斯反抗宙斯），成为文艺复兴人文主义与现代心理学研究人性本质的灵感来源。\n\n（五）对现代文化的影响\n\n（1）文学与影视：从乔伊斯的《尤利西斯》到好莱坞电影（如《角斗士》《特洛伊》），古希腊戏剧的叙事和主题不断被重新诠释。\n\n（2）政治与公共话语：古希腊戏剧的公民教育功能（如通过戏剧讨论民主、正义）影响了现代公共艺术和社会参与式剧场。\n\n（3）心理学与哲学：弗洛伊德的“俄狄浦斯情结”、尼采的《悲剧的诞生》均直接受古希腊戏剧启发。\n\n古希腊戏剧通过审美融合、多元主题与人物塑造，使其成为古典文化的瑰宝，奠定了西方艺术与思想的核心基因。","keywords":"审美特征 融合性 仪式性 集体性 规范性 悲剧美学 日神与酒神精神的平衡 主题特征 命运与自由 宿命论抗争精神 社会批判 人性探讨 和平与政治 人物塑造 神性与人性 复杂性 矛盾性 象征性 普遍性 女性角色 边缘群体 后世影响 奠基 源头 范式创新 结构程式 主题的延续 永恒母题 讽刺传统 渗透 民主价值观 社会批判 启蒙作用 理性思辨人性探索 现代文化","note":"①古希腊戏剧包括悲剧、喜剧等多种类型，不同类型在审美、主题、人物塑造上又各有特点，题目没有明确限定具体的类型，这可能会让大家在答题时感到无从下手，难以在有限的篇幅内全面涵盖所有内容。此外，古希腊戏剧对后世的影响涉及多个领域和不同时期，要全面评价也具有一定的挑战性。②总体而言，这道题题目出的还是很有水平的，各大版本教材中基本都没有原话，因此需要大家融合与思考，答题策略还是分步走：审美、主题、人物塑造、后世影响，最后别忘记总结一句。③大家平时也要注意积累这种宏观题目。"},{"id":"21","stars":"★★","title":"古罗马文学的地位和发展分期","body":"一、历史地位\n\n（一）古罗马文学是古希腊文学与欧洲近代文学的桥梁。古罗马文学在欧洲文学史上起着承前启后的作用。后世很多作家都是通过罗马文学来发掘古希腊文学的价值，在18世纪以前，欧洲各国文学，主要是受古罗马文学的影响。\n\n（二）文艺复兴时期，欧洲资产阶级作家提出复古，是通过古罗马文学来学习希腊文学。17世纪古典主义直接受到古罗马戏剧创作和理论的影响，例如贺拉斯的诗学理论就为古典主义理论家布瓦洛的诗学观点提供了直接的借鉴。18世纪，贺拉斯“寓教于乐”的文艺思想得到了启蒙思想家的推崇。\n\n（三）罗马文学本身也取得了很大成绩，涌现出如贺拉斯和奥维德那样的著名诗人，在文学史上具有一席之地。其文学虽然受到古希腊文学的直接影响，但也具有一些个性特征，即具有更强的理性精神和集体意识，增强了庄严崇高的气质。\n\n二、发展分期\n\n（一）共和时期（前240年一前30年）：罗马文学的形成和发展时期\n\n（1）古罗马文学的正式形成与叫利维乌斯·安德罗尼库斯的希腊人密切相关，他是古罗马文学的奠基人。他翻译、编译了希腊文学的大量作品，将古希腊文学中的某些精品介绍给了缺少书面文学传统的罗马人，把古希腊文学的主要形式移栽到了缺少骨干文学类型的古罗马。\n\n（2）早期罗马诗人中颇多全能作家。如埃纽斯不仅改写和创作过悲剧，而且还写过喜剧、讽刺诗、史诗，后人尊之为“罗马文学之父”。\n\n（3）这一时期喜剧创作成就较高，普劳图斯和泰伦斯是这一时期的代表作家。普劳图斯的喜剧著名的有《孪生兄弟》《一坛黄金》和《撒谎者》，从平民观点讽刺社会风习，特别针对当时淫乱、贪婪、寄生等现象，予以针砭。泰伦斯代表作是《两兄弟》和《婆母》。泰伦斯的喜剧结构严密，人物描写细致入微，语言优美流畅，哲理思想深刻，他以优雅的语言、别开生面的描绘将古希腊的人本思想发扬光大，给剧中人物罩上了一层“人性”的光环，因此后人称他是以艺术扣人心弦。\n\n（二）黄金时期（前100年-17年）：古罗马文学的辉煌时期\n\n“黄金时期”包括“西塞罗时期”（前70年一前30年）和“奥古斯都时期”（前31年-14年）和利维乌斯去世的年代（公元17年）。这一时期文学成就主要表现在散文和诗歌方面。最能体现“黄金时代”特点的作家是“奥古斯都时期”的三位著名诗人：维吉尔、贺拉斯和奥维德。\n\n（1）维吉尔的主要成就是三部诗歌作品，即《牧歌》《农事诗》和《埃涅阿斯纪》，《埃涅阿斯纪》是欧洲文学史上第一部个人创作的史诗，史诗借用神话传说歌颂罗马国家，歌颂奥古斯都统治的历史必然性。其情节结构模仿了荷马史诗，但具体描写有自己的特色。全诗情节生动，故事性强，语言凝练。\n\n（2）贺拉斯是古罗马著名诗人和文艺理论家，其重要的文艺论著为《诗艺》，其文艺思想上承亚里士多德的传统，下启18世纪古典主义戏剧理论，成为欧洲古典文艺理论名篇。诗人从自己的丰富诗歌创作实践出发，畅谈艺术模仿、艺术与生活的关系、文艺的教育作用、诗人的修养等，对后世欧洲文艺理论很有影响。\n\n（3）奥维德是“奥古斯都时期”最后一位大诗人，《变形记》是其代表作，以“变形”为线索串联起250多个故事，是古希腊罗马神话故事的总汇，后代很多作家、艺术家都从中吸取创作材料。\n\n（三）白银时期（17年-130年）：罗马文学的衰落时期\n\n“白银时期”也称“白银拉丁时期”。这一时期的文人继续了黄金时期末年的作家们崇尚文风的花哨、新奇和滥用修辞的倾向，过多地使用强调、对称和警句点缀等修辞手段，使文体显得臃肿，给人过度雕琢的感觉。这一时期悲剧、讽刺诗、传记文学和散文体小说创作较为活跃。\n\n（1）塞内卡的悲剧作品风格崇高严肃，夹杂大量的道德说教，其笔下的对话和人物都缺乏真实感，代表作是《特洛亚妇女》。\n\n（2）塞内卡的侄子卢肯以共和笔调，创作了继《埃涅阿斯纪》之后最好的史诗《法萨利亚》，写了一场轰轰烈烈的战争。\n\n（3）罗马人沿用古希腊对句格创作铭文。公元1世纪，诗人马提阿利写作了1500多首这一类型的短诗，其中不少作品体现了拉丁铭文诗的最高成就。\n\n（4）“白银时期”还产生了罗马历史上最杰出的讽刺诗人。尤维纳利斯选词节俭、精细，往往能用三言两语勾勒出生动、鲜活的形象。他的讽刺诗语气尖利，棱角分明，时而淋漓尽致地嘲笑，时而辛辣幽默地讽刺。\n\n（5）阿普列尤斯的散文体小说《金驴记》是一部具有冒险色彩的传奇作品，也是一部流浪汉小说。小说表现了作者阿普列尤斯丰富的想象力，具有浪漫情调，在文艺复兴时期流传甚广，对近代欧洲小说的产生起了重要作用。","keywords":"共和时期 形成和发展 黄金时期 辉煌 白银时期 衰落","note":"“共和时代”是一个政治概念，“黄金时代”即拉丁语和广义的拉丁文学发展史上的古典或辉煌时期，“白银时代”成就最高的文学样式是反映奴隶主下层思想的讽刺文学和反映旧共和派不满情绪的作品。大家在掌握本题时要注意结合各个时期的主要作家及其代表作品。"},{"id":"22","stars":"★★★","title":"请比较《埃涅阿斯纪》和荷马史诗的异同","body":"维吉尔在写《埃涅阿斯纪》的时候，是以荷马史诗为蓝本的，因此二者相同之处很多。\n\n一、相同之处\n\n（一）从结构上看，史诗的前半部分写埃涅阿斯的海上冒险，模仿《奥德修纪》中奥德修斯海上漂泊以及回家的时间结\n\n构；后半部分写特洛伊人与拉丁姆人之间的战争，模仿《伊利昂纪》中特洛伊战争的空间结构。\n\n（二）在情节上，二者的题材都出于同一个神话传说系统，即特洛伊战争。埃涅阿斯也是特洛伊的一名英雄，其历险同奥德修斯的还乡有不少相似之处。而且与荷马史诗一样，《埃涅阿斯纪》中的神也分成两派，参与人间的战争，以主神宙斯为主的神主宰战争的结局。此外，在战争中起衬托作用的都是一方好友被另一方好友所杀。\n\n（三）在人物上，埃涅阿斯与图尔努斯形成了对比，模仿了阿喀琉斯与赫克托耳的对应。\n\n（四）在叙述手法上，《埃涅阿斯纪》与《奥德修纪》都运用了追叙的手法，前十年的经历都由主人翁在宴会上讲述出来。此外，二者在一些细节上也有相似之处，如主人公游地府，铁匠神应女神之请为主人公铸造甲胄，举行葬礼竞技等等。\n\n（五）在描写手法上，维吉尔同荷马一样，使用了大量比喻和重复的手法。\n\n二、不同之处\n\n（一）就史诗的本质而言，《埃涅阿斯纪》更像是一首民族史诗，有着更成熟的思想和更沉重的历史感。尤其是比之于荷马史诗乐观勇敢的艺术风格，《埃涅阿斯纪》更充满了悲天悯人的忧郁情调，是第一部“文人史诗”。\n\n（二）就民族特色而言，《埃涅阿斯纪》具有鲜明的罗马文学特色。主人公除了具有英雄人物勇敢坚韧的性格外，更具备了敬神、爱国、仁爱、公正等品德，且政治目的性强，为了国家可以历经千辛万苦，能克制个人情感，表现出较强的理性意识、集体意识、责任观念和自我牺牲精神，这与个体意识很强的荷马史诗不同。作者在埃涅阿斯身上寄托了一个对民族英雄和理想君主的美好愿望。\n\n（三）就艺术特色而言，《埃涅阿斯纪》没有荷马史诗自然质朴的特点，缺少口头文学的活力，它的风格哀婉严肃，格律严整，在心理描写上更是超过了荷马史诗。\n\n中世纪文学","keywords":"相同之处 结构 情节 题材 人物** 叙述手法 **描写手法 不同之处 史诗本质 民族特色 艺术特色","note":"北京外国语大学2023年考查过一道相关题目“《埃涅阿斯纪》对荷马史诗有无模仿，请举例说明”。由于维吉尔在写《埃涅阿斯纪》的时候，是以荷马史诗为蓝本。因此，回答相似问题“《埃涅埃斯纪》对荷马史诗有哪些模仿”时，也就是回答二者的相同之处。另外，掌握《埃涅阿斯纪》，也利于我们对荷马史诗的艺术特点理解更深入，二者可以相互补充。"},{"id":"23","stars":"★★","title":"中世纪文学的文化历史背景","body":"从文化来源上讲，欧洲中世纪文学是欧洲多种文明与文化相融合的产物。\n\n一、首先体现在古代希腊罗马文化与蛮族文化的融合上\n\n蛮族南侵之后虽然摧毁了古代的文化，但是，新的文化毕竟又是在曾产生过灿烂的古代文明的欧洲大陆上产生的，古代希腊罗马的文化传统以及意识形态存在于欧洲本土的遗民身上。这一切都决定着新产生的文化并不能完全剪断古代文化的脐带。\n\n例如在中世纪漫长的历史时期，有些封建统治者和教会人士常常就利用古代文化遗产宣传其思想；利用古代天文知识编撰教会历书；利用民间音乐伴唱圣诗等。这说明，当北方的蛮族人与欧洲本土的文明人相互融合在一起的时候，蛮族文化与希腊罗马文化实际上也融合在一起了。\n\n二、欧洲中世纪文学是东西方文化相互影响和交融的产物\n\n这主要体现在欧洲的本土文化与希伯来文化的融合上。希伯来人在神话传说、历史故事、诗歌、小说、预言、箴言等方面，均取得了较高的成就。\n\n这些古代的文学成就后来被收入犹太教的经典之中。而犹太教的经典随着被欧洲人变为自己的宗教-基督教-教义的一部分（即《旧约》）之后，在欧洲大陆开始广泛流传，日益与欧洲大陆的人们的思想观念融为一体。\n\n三、在基督教逐渐成为中世纪欧洲占统治地位的意识形态过程中，它与世俗文化之间形成了两种交融关系\n\n（一）基督教文化在对古希腊以来的世俗文化精神大肆排斥和毁灭的同时，又将某些世俗文化的材料（如古代故事、历史传说、民间传奇等）、体裁（如故事、诗歌、戏剧传奇等）和艺术手法等，经过改造，纳入基督教文化体系之中。\n\n（二）在中世纪出现的很多世俗作品里，都包含着宗教内容。例如，中世纪后期产生的民间文学、骑士文学乃至城市文学，都显示出与基督教文化强烈的融合关系。无论是公元7至11世纪拜占庭封建制度形成与发展时期出现的诗歌创作和散文作品，还是11至13世纪出现的宫廷小说、讽刺作品，都可以看到这一点。","keywords":"蛮族文化 东西方文化 希伯来文化 世俗文化","note":"对于中世纪文化，17世纪英国唯物主义者和18世纪法国唯物主义者形成了一种流行的错误观点，即认为中世纪是人类历史的“中断”，中世纪文化是统治阶级压迫欺诈与老百姓愚昧无知结合的产物。然而，封建制度较之奴隶制，毕竟是更进步的社会结构，中世纪文化扩大了欧洲文化的领域，我们不能对中世纪文化全盘否定。"},{"id":"24","stars":"★★","title":"为什么说中世纪欧洲文学是近代资产阶级文学的发端","body":"欧洲中世纪文学主要由教会文学、骑士文学、英雄史诗和谣曲，以及城市文学所构成。虽然这四种文学繁荣于不同的阶段，但大致可以以宗教文学与世俗文学对它们进行区分。宗教文学占据着中世纪的统治地位，它渗透到各个阶层、各个领域，宣传基督教教义，服务于教会与教皇的意志。然而，教会文学内容枯燥繁琐，艺术苍白单调，很快便在思想和艺术上遭到来自世俗文学的挑战。而世俗文学体现出来的人文关怀精神以及在艺术上的贡献，都为近代资产阶级文学的蓬勃兴起奠定了基础。\n\n一、骑士文学\n\n骑士文学突破了宗教思想和封建意识的禁锢，描写骑士为了赢得贵妇人的爱而冒险的故事，反映了贵族阶级的荣誉观与爱情观，一定程度上冲破了封建神学的禁欲主义束缚，表达出人文主义的呼声。而在艺术上，骑士文学细致地描绘感情，常常围绕一个或两个主人公的经历展开叙事，从而在描写内容和主题、故事结构模式和故事发展模式等方面，都为近代资产阶级文学打下了基础。\n\n二、英雄史诗和谣曲\n\n英雄史诗和谣曲来自口头文学的积累，蕴含着丰富的文化信息和朴实的现实主义精神。英雄史诗虽然因为成文时代的限制而打上了封建意识与基督教思想的烙印，但也通过塑造民族英雄形象而表达了具有人文精神的文化思想，流露出张扬个性的欲望和建功立业的抱负。其记录的民族大迁徙时代的故事传说，则为近代资产阶级文学重新塑造民族精神、创造民族文学\n\n提供了丰富的精神资源。谣曲则更明显地反映了普通民众反对封建领主和教会压迫的强烈要求，表达了争取自由和民主的愿望。\n\n三、城市文学\n\n是中世纪最具有批判精神与现实主义色彩的文学。城市文学作品大多在民间文学的基础上发展起来，直接取材于现实生活，站在市民阶级的立场上，反映中世纪城市生活和新兴市民阶层的思想愿望，揭露封建主和僧侣的暴虐、愚昧与虚伪，赞美市民阶级的机智与才能，具有强烈的现实主义色彩和浓厚的人文关怀精神。例如，市民文学的代表作《列那狐的故事》，表现了市民阶层的聪明才智，具有鲜明的反封建反教会性质。\n\n四、但丁的《神曲》\n\n但丁作为“中世纪最后一位诗人与新时期第一位诗人”，富有代表性地反映了欧洲中世纪文学与近代资产阶级文学之间的联系。不论是在思想内容还是在创作方法上，《神曲》都既体现出了中世纪文学的特征，又反映了处于萌芽状态的资产阶级文学的特质。例如，《神曲》采用了中世纪梦幻文学的形式，大量运用象征和隐喻，但是在语言的运用上，却大胆抛弃了中世纪文化和文学的官方语言，采用意大利俗语进行创作，开启了文艺复兴时期用民族语言进行文学创作的先河。\n\n总之，中世纪世俗文学在思想上和艺术上都为近代资产阶级文学的兴起奠定了基础，文艺复兴时期的人文主义文学就是中世纪世俗文学，尤其是市民文学，进一步发展的丰硕成果，由此来看中世纪欧洲文学，就是近代资产阶级文学的发端。","keywords":"骑士文学 冲破了封建神学 英雄史诗和谣曲 争取自由和民主 城市文学 现实主义色彩 但丁 民族语言","note":"欧洲中世纪文学主要包括教会文学、骑士文学、英雄史诗、谣曲以及城市文学，大家在回答时可以分别从这几种文学类别的影响进行分析。欧洲中世纪影响最大的作家就是但丁，可以补充作答。另外，这里涉及的几个名词解释“教会文学、骑士文学、英雄史诗、谣曲、城市文学、《神曲》”等都需要注意一下。"},{"id":"25","stars":"★★★★","title":"中世纪文学的基本特点","body":"一、思想特点\n\n（一）基督教思想制约着中世纪文化\n\n基督教思想成为中世纪封建统治的精神支柱，各类文学无不打上了它的烙印，教会文学更是为普及宗教教义而产生。有些文学作品公开宣扬基督教教义、鼓吹禁欲主义和来世思想，表现了封建地主阶级及其精神上的代表-僧侣阶级的意识形态特征。同样，也有些作品，仅仅带有崇奉基督教思想的特点。这反映了基督教对文学影响的复杂性。\n\n（二）爱国主义和英雄主义思想突出\n\n在各种文化的交融中，特别是在中世纪封建制度和封建国家形成与确立的历史条件下，中世纪文学突出了各民族文学遗产中的一个基本思想-爱国主义和英雄主义。很多作品描写和反映了欧洲封建国家形成和确立时期的社会现实，歌颂了为保卫国家和民族而献身的英雄人物，赞美了在确保王权地位中起过重大作用的英明帝王。但有些作品又将歌颂英雄和爱国思想与忠君思想、宗教思想结合起来，这实际上是爱国思想和英雄主义的中世纪化，也是东方古代文化中特有因素对中世纪欧洲文学的影响的反映。\n\n（三）不同阶层的文学出现\n\n中世纪的社会结构等级森严，加之时间漫长，不同历史发展时期在具体情况方面的差异，导致为特定阶层服务的文学相继出现，并在不同的发展时期呈现出各自的繁荣景象。例如骑士阶层、市民阶层的出现，就使得在正统的基督教文学占统治地位的同时，世俗文化也以新的形态发展着，骑士阶层、市民阶层的思想感情和生活理想在文学作品中得到了反映。骑士文学将爱情作为描写的主要对象，肯定现世生活，在一定程度上承继了古代文化精神，背离了禁欲主义，具有否定中世纪禁欲主义的积极意义。市民文学将笔触指向城市市井生活和世态人情，具有较强的反封建意义，开启了文艺复兴人文主义文学的先河。\n\n二、艺术特点\n\n（一）文学描写和反映的范围扩大\n\n由于各种不同性质文化的相互交融，古代的、当代的，东方的、西方的，宗教的、世俗的，各种各样的题材进入了文学艺术创作领域，从而极大地拓展了中世纪欧洲文学的描写与反映范围。从中，人们不仅可以看到蛮族早期以及向封建社会过渡时期的生活，也可以看到封建社会发展和巩固时期的生活；不仅可以了解到中世纪欧洲社会主要阶层人们的风俗习惯，也可以感受到各种文化融合后，欧洲独有的社会现实。\n\n（二）艺术形式获得长足发展\n\n在中世纪特定的历史背景和文化氛围中，中世纪文学特有的艺术形式得到了长足的发展。与古希腊古罗马时代比较起来，已有的艺术形式更为成熟，新的艺术形式得以出现。如在各种诗歌样式中，形式因素互相影响，互相交融，从而使诗歌形式发展得更为精雅和完备。在叙事性的作品中，艺术形式开始由“枝蔓繁杂”向“叙述简约”转变。片断生活的描绘和情节线索的单纯集中，愈来愈使作品的结构布局和技巧运用达到自觉的程度。\n\n（三）艺术表现方法得到新的开拓\n\n由于各种文化的影响，中世纪文学在艺术表现手法上有了进一步的开拓。它充分吸收了古代以及各民族文学艺术表现形式，寓意、象征、梦幻、哲理、现实描写、浪漫抒情乃至运用动物故事等都流行一时。采用各种艺术手法写成的成功作品比比皆是。这充分反映了中世纪欧洲作家对古代和各民族、各种文学艺术形式的吸收能力，也说明了当时人们的艺术思维不断发展井逐渐走向复杂化的现实。\n\n（四）对文学情感特性把握的能力进一步提高\n\n对人的内心情感的挖掘是中世纪爱情题材作品的重要特点。在这类作品中，人的愿望激情、喜怒哀乐等复杂的心理活动初步得到成功的描绘，文学的情感特性被创作者自觉追求，从而揭开了人的内心世界帷幕的一角。这是中世纪欧洲艺术上的一个重大的进展，相较于古希腊和古罗马作家的创作，中世纪时用文学艺术形式表现人的情感更趋于自觉和强化。\n\n三、欧洲中世纪文学是多种文明和文化相碰撞的产物，因此，新质的文学具有鲜明的总体性特征\n\n（一）独特的人文精神-历史文化精神的传承性。作为整个欧洲文学史中的一个重要环节，欧洲中世纪文学在其文化精神和艺术精神上与古代文化精神实则有着本质的继承关系。\n\n（二）崭新的神学文化-宗教文化的包容性。众所周知，欧洲中世纪占主导地位的是基督教文化，文学与科学、哲学和其他各门类的学科一样，均成为了神学的附庸。\n\n（三）崭新的文学构成-文学内容和形式的多样性。多种文化的相互融合和基督教文化的包容性，带来了中世纪欧洲文化和文学内容与艺术形式的多元性、交融性和新质性。\n\n综上所述，欧洲中世纪文学是多民族文化碰撞融合的动态过程，是以基督教文化的形式重新吐纳、整合诸种文明成果的过程。而此时的文学，恰好体现出了适应中世纪欧洲社会发展的文化精神。","keywords":"基督教思想 爱国主义和英雄主义 不同阶层 艺术特点 范围扩大 艺术形式长足发展 表现方法开拓 情感特性总体性特征 历史文化精神的传承性 宗教文化的包容性 文学内容和形式的多样性","note":"相较而言，中世纪文学可以考查的内容较少，而这一部分属于中世纪文学的重点，需要熟记。回答特点时从思想、艺术两方面来分析，更加全面，可以再增加总体特征，使回答更加丰富，如果在考场上想不到总结性特点，那么只回答前两点也是足够的。"},{"id":"26","stars":"★★★","title":"骑士文学对后世的影响","body":"骑士文学是西欧封建骑士制度的产物，以描写骑士的冒险经历和骑士的典雅爱情，表现骑士精神为基本内容，包括骑士抒情诗和骑士传奇（骑士叙事诗）两种体裁。中世纪骑士文学代表了中世纪世俗文学的主要成就，对后世也产生了重要影响。\n\n一、积极的思想意义\n\n骑士文学勇于冲破禁欲主义，追求现实的个人幸福和爱情，常常描写单枪匹马的骑士冒险行侠的故事，体现出人本精神以及个人主义思想，对文艺复兴时期的人文主义思想及文学都产生了积极影响。\n\n二、骑士文学使爱情成为叙事文学的一大主题，对后世浪漫主义文学颇有影响\n\n中世纪以前，爱情只不过是叙事文学的点缀，在骑士文学这里则成了独立的主题。至此，爱情作为文学的一大主题反复被人们吟咏、传唱。大量骑士抒情诗的出现，成为近代欧洲人文主义文学爱情作品的发端。骑士叙事诗的浪漫情调、离奇情节、爱情故事，对后世浪漫主义文学也颇有影响。\n\n三、骑士文学开创了追寻的主题\n\n圣杯传奇是骑士传奇的一个重要系统，其中骑士们为了寻找圣杯，实现自己的生命价值，纷纷出发，经历了各种冒险。从此，追寻主题在文学中凸现出来，经久不衰。\n\n四、骑士文学提供了一种结构模式\n\n骑士传奇往往以一两个主要人物的经历为中心线索来构思作品，展开故事，对人物形象及其内心活动描写生动细致，为\n\n后来叙事文学的篇章结构提供了一种范式。\n\n五、骑士文学创造了一种故事模式\n\n骑士文学描写的基本内容是骑士为了赢得贵妇的爱而征战冒险，其故事核心由典雅爱情和冒险活动构成，由此而创造了一种故事模式，即战功加上爱情。它常常以相爱开始，以面临阻挠、历经坎坷为故事主体，以终成眷属为结局。\n\n六、骑士文学激发了一种艺术手段\n\n骑士文学激发了戏拟的诞生，所谓戏拟，是指作家虚构一个对象或情节，然后以戏剧性的手法模仿骑士传奇或骑士小说，以含蓄地批评自己的时代或表达自己的思想、见解。\n\n七、在心理描写方面进行了有益的尝试\n\n骑士文学中的女主人公成为男主人公的精神拯救者，男女主人公常常为表达彼此的爱情而倾诉与独白，这种对内心情感的披露，以及具体的表现方法，都对后世长篇小说关注和描写人物心理奠定了基础。\n\n此外，骑士文学还为后世文学提供了取之不尽、用之不竭的素材，并对长篇小说这一文学体裁的发展给予了巨大的推动。当然，骑士文学对后世的影响不仅局限在文学领域，而且扩展到其他多个领域，如音乐、绘画、电影等。由上述可见，骑士文学在世界文学史上乃至文明史上均占有重要地位，无愧为中世纪乃至整个文学史上的重要文学现象。","keywords":"思想意义 爱情 追寻的主题 结构模式 故事模式 戏拟 心理描写 素材 多个领域","note":"华东师范大学在2023年出过一道简答题：“简述中世纪骑士罗曼司的渊源与成果。”这里的骑士罗曼司就是指骑士传奇。骑士文学对后世的影响是多方面的，主要表现在思想主题、题材、结构、艺术手法等方面，大家可以抓住这几个关键词，逐个进行分析。"},{"id":"27","stars":"★★★★★","title":"《神曲》的现实性与艺术特色","body":"一、现实性\n\n《神曲》是但丁在文艺复兴之前写作的一个非常著名的作品。《神曲》广泛地反映了意大利的社会现实，具有突出的现实性。\n\n（一）但丁写作《神曲》的目的，就是“为了对万恶的社会有所裨益”\n\n作品虽然采用了中世纪梦幻文学的形式，但取材于意大利的现实生活，反映了当时的重大社会问题，如城邦之争、党派之争、封建主与贪官污吏的压迫盘剥、教会与教士的罪恶，涉及哲学、科学、神学和文艺等各领域，具有历史价值和社会认识价值。\n\n（1）《神曲》反映了当时的社会政治局势，描写了各种社会和政治斗争。当时的意大利在政治上四分五裂，罗马教皇和“神圣罗马帝国”皇帝为了统治意大利和掠夺它的财富，彼此进行着长期的斗争。各城市内部各阶级之间也存在着尖锐的矛盾和激烈的冲突，常常通过不同党派间的斗争表现出来。\n\n（2）《神曲》反映了当时的社会发展状况，反映了意大利从中世纪向近代社会过渡的生活现状，既打上了中世纪封建社会和教会文化的印记，也表现了新时代人文主义的曙光。\n\n（3）《神曲》还写到哲学、科学、神学艺术等方面的问题，极其广泛地反映了当时意大利的社会政治和文化方面的情况，口有百科全书的性质。\n\n（二）在一些具体的场景中，但丁采用现实主义直接描写的笔法，真实细致地描写生活场景，塑造人物形象。例如，《地》中描写的地狱酷刑，并非只是作者的设想，其中的各种刑罚，如火刑、斩头、斩手、倒栽等，都是当时宗教刑罚的真实写照。《地狱》第十九篇中对尼科那三世的揭露，以及诗篇对僧侣贵族阶级和佛罗伦萨城的描写，都真实地反映了当时的社会黑暗。\n\n（三）在真实描写的基础上，《神曲》进一步揭露了教会的黑暗和叛国者与暴君的罪恶，并且对贵族、僧侣和政府官员的自私、贪婪给予了猛烈的鞭挞，对佛罗伦萨党派斗争给国家和人民带来的危害进行了严厉谴责，具有强烈的现实批判精神。\n\n二、艺术特色\n\n《神曲》在深度上表现了中世纪很多东西，这个作品最终的落脚点在人的身上，而人又是文艺复兴时期最伟大的口号。所以，但丁《神曲》的创作在深度上表现出了新时代的曙光。《神曲》的艺术特色，主要包括以下内容：\n\n（一）梦幻的神秘色彩与现实的写实手法相结合\n\n但丁在《神曲》中，将中世纪文学所大量使用的象征、寓意、梦幻的手法，同反映现实生活的内容紧密地结合在一起，从而用陈旧的形式表现出了很多崭新的思想内容。\n\n从整个作品而言，主人公的漫游过程象征着人类的灵魂和精神的完善过程。除了象征手法之外，《神曲》还使用了梦幻的手法。比如诗人游历幽冥三界，本身就是一种梦幻形式，这些都是作家对基督教文学形式的继承。\n\n然而，但丁正是通过这些陈旧的手法表现出了强烈的现实精神和崭新的内容。例如他对宗教伪善者的揭发批判，对封建统治阶级的嬉笑怒骂，对世俗爱情生活和异教文化的肯定，以及对当时历史事件和各种人物所作的深刻评判，都是现实生活和时代精神的反映。\n\n（二）结构巧妙而严整\n\n《神曲》结构好像一个严整而有系统的三棱形大建筑，全诗分为“地狱”“炼狱”“天堂”三部分；每部分各三十三篇，加上《地狱篇》前的序言，共一百篇。“三”象征着“三位一体”，“百”表示“完全中之完全”。诗中的地狱、炼狱、天堂等部分，也是完全对称的。三部的结尾，都以“星”字收束。\n\n这样的结构用连锁韵律（每一诗节三行，其中第一与第三行押韵，第二行与下节第一、三行押韵），在不断变化中一直灌注下去。这种完整而有秩序的结构具有一种造型艺术的效果，是中世纪神权思想的体现。\n\n全诗构思宏伟，富有严密性、均衡性与完整性，一直为文学史家所称道。\n\n（三）人物塑造性格鲜明\n\n但丁擅长用寥寥数语勾勒人物性格特点。例如，他只用“他挺胸昂首，对于地狱的权威似乎表示一种轻蔑”这样一句话，就把齐伯林党领袖法利纳塔英勇无畏的英雄气概表现得栩栩如生。再如对荷马、贝娅特丽采等人，只是简洁几笔，便使前者显得庄严崇高，使后者显得纯洁慈爱。再如，当他描写两个鬼魂相遇时，用了世间常见的事物进行比喻：“那里双方的灵魂抢上去相拥抱接吻......很像黑蚁的队伍，在路上互相擦嘴，以探寻前面食品所在的模样。”这种具体的比喻和生动的细节描写在中世纪梦幻文学中是极为少见的。\n\n（四）语言的过渡性质\n\n《神曲》是使用意大利语写成的。当时教会文学作家主要用拉丁语创作，而但丁用意大利语来写作，正是对封建社会文化霸权思想的反叛。但丁用意大利语创作了这样重大的题材，为意大利民族语言和民族文学语言的形成起到了奠基和推动作用。但《神曲》中大量语言和词汇又带有中世纪语言那种烦琐、晦涩、象征的特点，体现了语言的过渡性质。","keywords":"现实性 社会问题 现实主义直接描写 现实批判精神 艺术特色 神秘与写实 结构巧妙严整 人物塑造性格鲜明语言的过渡性质","note":"关于”《神曲》的艺术特征与价值”是各个院校的一个考查重点，仅在2023一年，就有华中师范大学、西南大学两个211院校出过真题，大家要重点记忆。《神曲》可以说是中世纪文学唯一一本需要重点掌握的作品，其中既有中世纪梦幻文学的特点，又有文艺复兴时期人文主义文学的特点，这也是其二重性的表现之一，下面会有详细介绍，要着重掌握。"},{"id":"28","stars":"★★★★★","title":"《神曲》的二重性","body":"但丁是新旧交替时代的一位诗人，他的《神曲》在思想内容和艺术上均表现出二重性。在思想内容方面，《神曲》既有鲜明的进步倾向性，又明显地打上了中世纪神学思想的烙印。在艺术上，《神曲》保留着中世纪文学作品的神秘象征特色，又折射出文艺复兴时期现实主义文学的光芒。\n\n一、思想上的二重性\n\n但丁写作《神曲》的时代，封建的基督教意识形态对社会生活仍然起着重要的作用，但与新的生产关系相适应的思想文化观念也开始萌芽。整个社会新旧思想杂糅、对立冲突激烈，这就决定了《神曲》的思想内容是极其复杂和矛盾的。\n\n（一）世界观\n\n但丁一方面肯定了理想的基督教，对基督教辉煌历史、理想教徒和所谓卓越的教会人物加以热情的赞美。\n\n但另一方面，他深刻地批判现实教会、教皇和僧侣们的贪婪残暴与伪善。如《神曲》伊始，诗人用瘦母狼代表罗马教廷，象征性地指出了教会的贪婪本性。\n\n（二）对世俗生活的态度\n\n《神曲》表现出了较多的陈旧观念，如地狱、炼狱、天堂的构造，对受罚、洗炼、享福的灵魂安排，在很大程度上是根据禁欲主义思想来体现的。尤其是炼狱山，实则就是座“禁欲山”。但丁认为人只有克制情欲，刻苦修炼，才能上天堂。\n\n但《神曲》中又流露出了肯定现世生活的反禁欲主义倾向。在《地狱篇》第五曲中，他把生前犯了通奸罪的保罗和弗兰西斯嘉放到地狱第二层中遭受折磨，让他们的灵魂在阴风苦雨之中漂浮不定。但是当弗兰西斯嘉述说了他们的不幸遭遇之后，\n\n但丁又对他们真挚的爱情表示了深刻的同情，并被感动得“昏倒在地，好像断了气一般”。\n\n（三）政治态度\n\n但丁热情地讴歌了理想中的君王和贵族，把祖国统一的希望寄托在了神圣罗马帝国皇帝亨利七世身上，并在天堂里为他留下了位置。在天堂第六层中，他还放上了很多正直君主的灵魂，并让他们被祥云瑞气所环绕。\n\n同时，他也无情地批判了当时社会上那些残暴的君主和分裂割据、鱼肉人民的封建诸侯，谴贵了他们为了扩大自己权力而进行的封建战争。在《地狱篇》第十二曲中，他就借半人半马的怪物之口，对那些残害人民的君主和贵族，进行了指责和批判。\n\n（四）对待人类文化的看法\n\n《神曲》认为基督教是人类最伟大、最神圣的思想文化结晶。《神曲》中有对中世纪经院哲学的阐述和对神学思想的讴歌。\n\n但同时又对中世纪被排斥的古希腊罗马文化和进步的异教思想，给予了热情的赞美和高度的评价。比如，当诗人来到候判所，见到荷马、贺拉斯、奥维德等人灵魂的时候，兴奋地写道：“我心中因看到他们而感到光明。”“我能躬逢盛会，心里觉得非常光荣。”\n\n《神曲》中的思想矛盾表现了但丁作为中世纪最后一个诗人所具有的神学世界观和作为新时代的第一个诗人的人文主义世界观的矛盾。诗中旧时代的旧观点的痕迹相当明显，但重要的是这些旧时代的旧观点已被新时代的新观点所压倒。正是诗人世界观中的进步因素，使他在中世纪文学中最先创造出广泛反映时代的社会政治生活，具有巨大的思想认识价值和艺术价值的伟大诗篇。\n\n二、艺术上的二重性\n\n《神曲》是新旧时代交替时期不同性质的文学的融合，体现了中世纪文学的主观幻想与文艺复兴时期人文主义文学的真实冷峻的奇妙结合。\n\n（一）梦幻的神秘色彩与现实的写实手法相结合\n\n但丁在《神曲》中，将中世纪文学所大量使用的象征、寓意、梦幻的手法，同反映现实生活的内容紧密地结合在一起，从而用陈旧的形式表现出了很多崭新的思想内容。\n\n一方面，它采用中世纪梦幻文学的表现形式，充满象征和隐喻，带有浓厚的宗教神秘色彩；另一方面又表现出现实主义的特色，呈现出文艺复兴时期人文主义文学的面貌。它以幻想的三界旅行为框架，但目的是为了探讨意大利民族的发展道路。\n\n（二）结构上宗教色彩与意大利语的结合\n\n《神曲》在结构上大量运用具有象征色彩的宗教数字来构思，应和其宗教思想；在语言运用方面，《神曲》大胆抛弃了中世纪的官方教会语言拉丁语，使用民族语言进行创作，为意大利民族语言的发展奠定了基础，也为文艺复兴时期的语言改革做了创新性尝试。\n\n总之，《神曲》中的思想、艺术是极其复杂矛盾的，这种新旧的矛盾正是但丁作为中世纪的终结和新时代的开端这一过渡时期的伟大诗人的特点。尽管如此，《神曲》仍然是中世纪文学中第一部广泛反映时代的社会生活，表现新的人文主义思想萌芽的伟大作品，是欧洲文学史上具有划时代意义的巨著。","keywords":"思想二重性 世界观 对待世俗生活 政治态度 对待人类文化 艺术二重性 神秘与写实 宗教色彩 意大利语","note":""},{"id":"29","stars":"★★★","title":"但丁为什么称《神曲》为“喜剧”？又是如何体现个人印记的（26南京大学）","body":"《神曲》是但丁呕心沥血之下创作的一篇巨著，具有丰富的思想内涵，对西方文学发展起到了非常重要的影响。这部作品被但丁称为“喜剧”，并且鲜明地体现出了但丁的个人印记，具体可以从如下角度进行分析。\n\n一、但丁称《神曲》为“喜剧”的原因\n\n＂comedy”（喜剧）一词起源于“comus”（意为“村镇”）和“oda”（意为“歌曲”），因此喜剧不光说是“村\n\n歌”的意思。喜剧是一种叙事诗，跟其他一切叙事诗不同。在内容上，喜剧虽在开头有不愉快的纠结，但收场总是皆大欢喜。在语言上，喜剧松弛卑微。\n\n《神曲》被但丁题名为“喜剧”，其故在此。就内容论，《神曲》开头是腥臭可怕的，因为内容是关于地狱的事情，但到结尾时则一切顺利、沐浴天恩、万事大吉，因为内容是关于天堂的一切。就语言方法论，《神曲》同样是松弛卑微，因为作品所用的语言正是妇女交际用的俗语。\n\n二、《神曲》中但丁的个人印记\n\n（一）在基督教的框架下进行个人化的阐释\n\n在《神曲》中，中世纪天主教的印痕也罢，异教（古希腊、罗马）的东西也罢，文艺复兴的曙光也罢，一切的一切到但丁这里，都被打上了鲜明的个人印记。他的地狱、炼狱、天堂诚然有基督教的框架，但阐释完全是个人化的，那里面是他的逻辑，他的好恶，他才是这个世界的上帝。他自说自话地安排三界，无所顾忌，笃定得很，一点也不犹豫。\n\n比如地狱，看似与基督教教义吻合，实则他的安排充满了他的个人意志，他把自己的仇敌打入深渊，往神学图景上嫁接了自己分明的爱憎。而他擅自给自己恋慕的对象贝阿特丽丝安排了那样一个无上荣耀的位置，更是将他的“自说自话”发挥到了极致。又比如说，但丁在国家政治上主张政教分离，因此，他对英明君主的世俗统治抱有幻想。但丁认为，一个强大的皇帝对结束意大利各地的党争和抑制教权干政是有利的，所以诗人不但对神圣罗马帝国皇帝加以美化，而且将其与历史上的贤君名相一道放入天堂。\n\n（二）体现出了诗人本身新旧思想共存的特点\n\n但丁的思想具有二重性。他深刻地批判现实教会、教皇和僧侣们的贪婪残暴与伪善。但是，诗人对基督教信仰本身是肯定的，这不仅体现在他坚持最基本的基督教教义和神学观念上，也体现在他对社会人生和人类历史发展的终极思考上。\n\n因此，《神曲》所表达的思想明显具有新旧两个时代的烙印。教会中那些巧取豪夺、恶德败行的神职人员受到但丁尖锐的揭露和猛烈的批判，无论是充满野心的教皇，还是伪善、贪婪的各级教士，都因其所犯的罪恶在地狱中遭受严厉的刑罚。但他在整体上认同基督教对“罪”的理解，不但将人的“罪性”作为解释种种邪恶和社会乱象的根本原因，而且将涤除罪性实现道德净化、最终与上帝同行的爱的至高真理，视为人与社会发展的终极目标。\n\n综上所述，但丁将《神曲》称为“喜剧”，正是因为这部作品在内容和形式上都符合戏剧的规范。而他个人的思想与好恶，都在作品中体现了出来，具有鲜明的个人烙印。","keywords":"原因 内容 语言方法 个人印记 基督教的框架 个人化的阐释 新旧思想共存","note":"这道题一共有两问，我们要分点作答。第一点很简单，主要需要讨论的是第二点。所谓个人印记，简单来说就是《神曲》中体现出来的个人色彩，大家结合作品的内容以及但丁的生平、思想去分析即可。"},{"id":"30","stars":"★★★★","title":"《神曲》的思想内容（25江南大学）","body":"作为新旧交替时代的伟大诗人，但丁以其敏锐的目光洞悉了时代的沧桑巨变，在其《神曲》中描绘了13世纪末14世纪初意大利社会现实的历史图景，创作了一部百科全书式的鸿篇巨制。《神曲》是一部充满隐喻性、象征性，同时又洋溢着鲜明的现实性、倾向性的作品，其思想主题主要体现在以下几方面：\n\n一、精神解放和道德解放\n\n作品表现了通过精神提升来解决现实问题的思想，为意大利民族提供了一条精神解放和道德解放的道路。《神曲》是作者从政治上、道德上探讨意大利民族统一的寓言性总结。\n\n《神曲》中但丁通过自己神游“三界”的故事，意在探索诗人自身、意大利民族乃至人类的未来命运，作家寓意深刻地表达了这样的主题：意大利民族和整个人类必须在信仰的启示下，以理性规范行为，实现道德完善和精神境界的不断超越，才能与最高真理合一，获得光明的前途。\n\n从当代意识来看，诗歌的艺术境界也具有普遍性意义，表现出对人类命运的深沉忧虑，以及对人类美好前景的坚信。\n\n二、思想的矛盾性（二重性）\n\n《神曲》体现了作家思想深刻的矛盾性，反映了新旧交替时期意大利现实生活的本质特征。\n\n（一）在宗教态度上，但丁一方面肯定了理想的基督教，对基督教辉煌历史、理想教徒和所谓卓越的教会人物加以热情的赞美。但另一方面，他又深刻地批判现实教会、教皇和僧侣们的贪婪残暴与伪善；\n\n（二）在对世俗生活的态度上，《神曲》在很大程度上是根据禁欲主义思想来体现的，但其中又流露出了肯定现世生活\n\n的反禁欲主义倾向；\n\n（三）在政治态度上，但丁热情地讴歌了理想中的君王和贵族，把祖国统一的希望寄托在了神圣罗马帝国皇帝亨利七世身上。同时，他也无情地批判了当时社会上那些残暴的君主和分裂割据、鱼肉人民的封建诸侯，谴责了他们为了扩大自己权力而进行的封建战争；\n\n（四）在对待人类文化的看法上，《神曲》认为基督教是人类最伟大、最神圣的思想文化结晶。《神曲》中有对中世纪经院哲学的阐述和对神学思想的讴歌，但同时又对中世纪被排斥的古希腊罗马文化和进步的异教思想，给予了热情的赞美和高度的评价。\n\n可以说，这种种矛盾其实正是新旧交替时期意大利社会各种思想矛盾的深刻体现。\n\n三、《神曲》中最具认识价值的是其广泛而深刻的现实批判\n\n《神曲》通过对地狱的描写，鲜明地反映了意大利的现实生活，揭露了教会的黑暗和封建统治者对人民的剥削压迫。\n\n《神曲》反映了当时的社会政治局势，描写了各种社会和政治斗争。当时的意大利在政治上四分五裂，罗马教皇和“神圣罗马帝国”皇帝为了统治意大利和掠夺它的财富，彼此进行着长期的斗争。\n\n四、《神曲》表现了人文主义思想\n\n诗人站在新旧时代交替的历史高度，极其广泛地描绘了意大利的社会现实，在保持与中世纪文化精神联系的同时，表现了人文主义思想。\n\n诗歌描写了人们对世俗感情和现实幸福的追求，肯定了对知识的探求和理性的重要作用，赞美了人的智慧，体现了人文主义思想的精髓，透露出人文主义思想的曙光。\n\n五、新的精神世界\n\n《神曲》深刻地揭示了人类自身精神世界的构成，反映了中世纪转折时期作家对“人”认识的深化。但丁继承了基督教文化中人是“服从”精神的载体的观念，同时又对人的其他精神特性进行了探讨。\n\n这样，《神曲》中所描绘的人的精神世界就不再是由单一的“服从”特性构成，而是由“服从”“理性”和“信仰”三者合一构成的新的精神世界了。","keywords":"精神解放和道德解放 思想矛盾性 现实批判 人文主义思想 新的精神世界","note":"南开大学在23年出过一道相关题目“分析《神曲》的主题”，主要也是从以上几个方面作答。《神曲》的思想内容主要表现在政治倾向性和对现实的反映上，答题时从这两个大方向上回答都不会出太大的差错，可以结合前面《神曲》在思想性上的二重性进行分析。"},{"id":"31","stars":"★★★★","title":"但丁在文学史上的地位和意义","body":"意大利诗人但丁是人文主义的先驱，中世纪最伟大的作家，现代意大利语的奠基者，在西方文学史乃至整个文学史上都有着非常重大的影响。恩格斯高度评价了但丁及其创作的意义：“封建的中世纪终结和现代主义资本主义的纪元的开端，是以一位大人物为标志的。这位人物就是意大利但丁，他是中世纪的最后一位诗人，同时又是新时代最初的一位诗人。”\n\n一、创作的作品种类丰富\n\n但丁的主要作品有第一部用意大利俗语写的学术性著作《飨宴》，最早一部关于语言和诗律的专著《论俗语》，第一次从理论上阐述了政治和宗教平等、政教分离、反对教会干涉的政治观点的《帝制论》，自传性诗集《新生》，以及在文学史上拥有不朽地位的《神曲》。\n\n二、中世纪文学最高成就的代表\n\n《神曲》是但丁的代表作，同时也代表了中世纪文学的最高成就。但丁在《神曲》中广泛而深刻地暴露了当时的政治和社会现实。他严厉地批判统治阶级对人民的残酷压榨，否定神权统治和教会至上的观点，揭露教会的罪恶，同时他对新兴市民阶级的自私以及正在形成的资本主义关系的弊端也作了一定的指责。\n\n《神曲》中写的虽是来世，但反映的却都是现世的事物。但丁在《神曲》中还反对中世纪的蒙昧主义，提倡发展文化、追求知识、追求真理。\n\n三、第一位意大利民族诗人\n\n《神曲》不是用当时意大利作家们常用的拉丁语、法语或普罗旺斯语，而是用意大利俗语写的，这对意大利文学语言以及民族语言的形成和发展都起到过重大的作用，并使得但丁超越了在他之前的一切意大利作家，成为第一位意大利民族诗人。\n\n四、透露出人文主义的曙光，为文艺复兴奠基\n\n但丁所创作的《神曲》以极其广阔的画面，通过对诗人幻游过程中遇到的上百个各种类型的人物的描写，反映出意大利从中世纪向近代过渡的转折时期的现实生活和各个领域发生的社会、政治变革，透露了人文主义的曙光。\n\n《神曲》不仅在思想性、艺术性上达到了时代的先进水平，是一座划时代的里程碑，而且还是一部反映社会生活状况、传授知识的百科全书式的鸿篇巨制，对中世纪政治、哲学、科学、神学、诗歌、绘画、文化，作了艺术性的阐述和总结，对后世纪欧洲文学影响很大。\n\n《神曲》为文艺复兴时代文学的发展开辟了道路。它一向被誉为“中世纪的史诗”，并对后来的世界文学艺术产生了深远的影响。后世许多诗人、画家、音乐家从《神曲》中汲取创作的养料，并在《神曲》艺术形象魅力的鼓舞下，创作出杰出的作品，如巴尔扎克的《人间喜剧》就是仿效《神曲》的形式创作的，而歌德的《浮士德》则更有异曲同工之妙。但丁的《神曲》直接促成了意大利民族语言的形成，在欧洲文学史上起着承上启下，继往开来的作用。\n\n文艺复兴时期文学","keywords":"种类丰富 文学代表 民族诗人 奠基","note":"地位和影响类的题目，大体都可以从这几点入手。但丁在文学史上的影响是十分深远的，主要可以从他的创作、《神曲》的思想性、艺术性等方面来回答。主体结构主要还是通过《神曲》这部作品来入手，内容可以参照前面几题的回答，这些回答都有共通之处。"},{"id":"32","stars":"★★","title":"文艺复兴文学兴起的时代背景","body":"文艺复兴的本质是新兴资产阶级在复兴希腊罗马古典文化的名义下发起的弘扬资产阶级思想文化的反封建的新文化运动。\n\n一、社会历史背景\n\n从13世纪末和14世纪初开始，处于地中海沿岸的一些城市，由于社会生产力发展和科学技术的进步，在封建社会内部开始陆续出现了资本主义生产关系的萌芽。例如一些沿海城市当时已有了初具规模的手工业和较为发达的商业贸易。正是在这样的历史条件下，从中世纪的农奴中产生了初期城市的城关市民，从这个市民等级中发展出最初的资产阶级分子。\n\n15世纪末，地理大发现和环球航行的成功，使欧洲新兴的资产阶级获得了更为广阔的活动天地，从而更进一步促进了资本主义生产关系的发展。经过对内残酷压榨和对外血腥掠夺的资本原始积累活动，资产阶级很快发展成为一支富于经济实力的社会力量。\n\n这样，封建的生产关系就成了严重束缚新的生产力和生产关系发展的桎梏。新兴的资产阶级要自由发展资本主义的愿望必然要与阻碍其发展的封建制度发生尖锐冲突。中世纪占主导地位的基督教思想体系，是封建统治阶级的精神支柱，维护着封建的生产关系。新兴的资产阶级不仅要用商品经济取代自然经济以求得自身的发展，而且还要求用一种新的思想文化体系来反对封建的和宗教的精神禁锢，为资本主义的发展扫清道路。这种社会历史的原因，从根本上促成了文艺复兴运动的产生。\n\n二、文化背景\n\n这一时期各种文化的融合、碰撞是导致文艺复兴新文化产生的更独特和直接的原因。\n\n（一）随着奥斯曼帝国的入侵，东罗马（拜占庭）的许多学者，带着大批的古希腊和罗马的艺术珍品和文学、历史、哲学等书籍，纷纷逃往西欧避难，使得人才大量聚集。\n\n（二）在中世纪，虽然宗教文化占主导地位，但是民间文学中的进步作品、骑士文学中的非宗教因素以及某些下层僧侣创作中的异端思想，都为文艺复兴时期的文化精神的变革提供了一定的基础。\n\n（三）在13世纪前后的欧洲封建社会内部，已经产生了早期资产阶级文化形态的胚胎和因子-城市市民的文化形态。作为一种性质完全不同于教会文学的市民文学，它本身具有强烈的反封建、反教会倾向，反映的是作为中世纪独特阶层的城市市民的思想感情和愿望要求。这种独特的文化形态受到14世纪初社会生产力发展的作用后，必然会适时而强劲地发展起来，成为文艺复兴时期人文主义思想体系的重要来源和组成部分。\n\n（四）文艺复兴运动产生的直接文化动因是古代希腊罗马文化被重新发现。作为欧洲文化与文学源头的古希腊罗马进步文化，包含着一种朴素的唯物主义的积极乐观精神。其优秀的文学作品是对古代人生的艺术反映，具有与中世纪宗教文化完全不同的人文精神。\n\n三、导火索-黑死病在欧洲流行\n\n3．人文主义文学的基本特点（25西安外国语大学）★★★★\n\n一、主张以人为本\n\n就文学的文化主旨精神而言，人文主义文学与当时的哲学、科学、艺术等领域一样，对人的关注成为人文主义文学的精核心。它反对中世纪封建教会鼓吹的以“神”为本，主张以“人”为本，肯定人的价值与尊严。\n\n他们曾鲜明地提出“人不认识自己，就不能认识上帝”的口号，坚信人是“宇宙的精华，万物的灵长”。正是在这种认的基础上，很多人文主义作家着力塑造无论在智力上还是在体力上均具有“巨人”风采的崭新形象，并以此与僧侣们鼓吹神学权威相抗衡。\n\n二、描写现实生活，表达人文思想\n\n着力描写现实生活，肯定人的权利，用个性解放反对禁欲主义，用理性反对蒙昧主义，这是人文主义文学的基本题材与主题。人文主义者赞美理性，认为理性是人和谐发展、追求进步与幸福的重要条件。人之所以高贵，就在于理性的力量。他们还认为，人的个性欲望是人的本质所在，是人的天性。\n\n三、展示人的精神世界，充满“情”和“欲”\n\n展示人的精神世界、情感特征、欲望要求等是人文主义文学的基本艺术追求。在中世纪的宗教文学中，神的意志排挤人的活生生的情感，干瘪、僵化、苍白和死气沉沉是其艺术的主要特色。而人文主义文学所描写的形象大多充满“情”和“欲”，生机勃勃，或充满着昂扬乐观的进取精神，或展示着令人愉快的生活情趣，或蕴含着人的困惑、渴望与激情。\n\n四、注重写实，加以浪漫的艺术手法\n\n人文主义文学所采取的创作方法基本上是写实主义的，同时，这种文学也十分注重对古希腊罗马文学乃至中世纪民间文学与骑士文学中浪漫的、幻想的艺术手法的继承，但在具体创作中又进一步剔除了中世纪文学中的“玄学”和“神秘”的成分。正是这种写实的方法与浪漫幻想的创作方法的有机结合，使得文艺复兴时期成为欧洲文学发展历史上的一个辉煌时代。\n\n五、扩大了传统文学的体裁领域\n\n在人文主义文学中，原有的一些体裁，如抒情诗、叙事诗、戏剧等，从形式到技巧进一步走向成熟，如将个人欲望、世俗生活、普通人物引进作品，打破悲剧、喜剧的界限等。同时，作为近现代文学主要形式之一的十四行诗、框架式短篇小说，尤其是长篇小说等艺术样式，都发端于这一时期，并取得了辉煌的成就。这种体裁上的鲜明特征，既是人文主义作家继承和借鉴传统体裁形式的结果，同时也是社会生产力的进步使人们视野开阔和个人意识增强的产物。\n\n六、民族语言的使用，具备鲜明的民族特色\n\n人文主义文学突破了拉丁语的束缚，采用民族语言进行创作，体现出了鲜明的民族特色，为各国民族文学的形成奠定了重要的基础。当时一些重要的人文主义作家，一般均是本民族语言的奠基者和文学语言的大师，采用普通老百姓所通晓的俗语、俚语或口语进行创作，取得了极高的成就。","keywords":"社会历史背景 文化背景 导火索\n以人为本 现实生活 人文思想“情”和“欲”写实与浪漫 扩大体裁领域 民族特色","note":"文艺复兴是欧洲新兴资产阶级在14世纪至17世纪初掀起的反封建、反教会的思想运动。它是封建制度开始解体、本主义生产关系形成过程中的产物，文艺复兴运动的时代背景是特别重要的，要结合所学历史知识进行理解背诵。同时，“文艺复兴”也是一个常考名词解释，大家要留意一下。\n人文主义文学是文艺复兴运动的一个重要的组成部分，需要我们重点把握。厦门大学在2023年就考查过相关题目：“论述文艺复兴时期人文主义文学的文学特质与艺术风格”，也就是上述的基本特点。人文主义文学自从诞生之日起，就具备了鲜明的新质文化特征和独特的文学品格。准备时要注意把握这几个关键词，然后用自己的知识对其展开叙述。此外，这里涉及的“人文主义”“人文主义文学”“十四行诗”“框架体结构”也是常考名词解释，大家要注意积累。"},{"id":"33","stars":"★★★★","title":"人文主义文学的基本特点（25西安外国语大学）","body":"一、主张以人为本\n\n就文学的文化主旨精神而言，人文主义文学与当时的哲学、科学、艺术等领域一样，对人的关注成为人文主义文学的精核心。它反对中世纪封建教会鼓吹的以“神”为本，主张以“人”为本，肯定人的价值与尊严。\n\n他们曾鲜明地提出“人不认识自己，就不能认识上帝”的口号，坚信人是“宇宙的精华，万物的灵长”。正是在这种认的基础上，很多人文主义作家着力塑造无论在智力上还是在体力上均具有“巨人”风采的崭新形象，并以此与僧侣们鼓吹神学权威相抗衡。\n\n二、描写现实生活，表达人文思想\n\n着力描写现实生活，肯定人的权利，用个性解放反对禁欲主义，用理性反对蒙昧主义，这是人文主义文学的基本题材与主题。人文主义者赞美理性，认为理性是人和谐发展、追求进步与幸福的重要条件。人之所以高贵，就在于理性的力量。他们还认为，人的个性欲望是人的本质所在，是人的天性。\n\n三、展示人的精神世界，充满“情”和“欲”\n\n展示人的精神世界、情感特征、欲望要求等是人文主义文学的基本艺术追求。在中世纪的宗教文学中，神的意志排挤人的活生生的情感，干瘪、僵化、苍白和死气沉沉是其艺术的主要特色。而人文主义文学所描写的形象大多充满“情”和“欲”，生机勃勃，或充满着昂扬乐观的进取精神，或展示着令人愉快的生活情趣，或蕴含着人的困惑、渴望与激情。\n\n四、注重写实，加以浪漫的艺术手法\n\n人文主义文学所采取的创作方法基本上是写实主义的，同时，这种文学也十分注重对古希腊罗马文学乃至中世纪民间文学与骑士文学中浪漫的、幻想的艺术手法的继承，但在具体创作中又进一步剔除了中世纪文学中的“玄学”和“神秘”的成分。正是这种写实的方法与浪漫幻想的创作方法的有机结合，使得文艺复兴时期成为欧洲文学发展历史上的一个辉煌时代。\n\n五、扩大了传统文学的体裁领域\n\n在人文主义文学中，原有的一些体裁，如抒情诗、叙事诗、戏剧等，从形式到技巧进一步走向成熟，如将个人欲望、世俗生活、普通人物引进作品，打破悲剧、喜剧的界限等。同时，作为近现代文学主要形式之一的十四行诗、框架式短篇小说，尤其是长篇小说等艺术样式，都发端于这一时期，并取得了辉煌的成就。这种体裁上的鲜明特征，既是人文主义作家继承和借鉴传统体裁形式的结果，同时也是社会生产力的进步使人们视野开阔和个人意识增强的产物。\n\n六、民族语言的使用，具备鲜明的民族特色\n\n人文主义文学突破了拉丁语的束缚，采用民族语言进行创作，体现出了鲜明的民族特色，为各国民族文学的形成奠定了重要的基础。当时一些重要的人文主义作家，一般均是本民族语言的奠基者和文学语言的大师，采用普通老百姓所通晓的俗语、俚语或口语进行创作，取得了极高的成就。","keywords":"以人为本 现实生活 人文思想“情”和“欲”写实与浪漫 扩大体裁领域 民族特色","note":"人文主义文学是文艺复兴运动的一个重要的组成部分，需要我们重点把握。厦门大学在2023年就考查过相关题目：“论述文艺复兴时期人文主义文学的文学特质与艺术风格”，也就是上述的基本特点。人文主义文学自从诞生之日起，就具备了鲜明的新质文化特征和独特的文学品格。准备时要注意把握这几个关键词，然后用自己的知识对其展开叙述。此外，这里涉及的“人文主义”“人文主义文学”“十四行诗”“框架体结构”也是常考名词解释，大家要注意积累。"},{"id":"34","stars":"★★★","title":"人文主义思想在文艺复兴时期文学中的体现","body":"“人的发现”概括了文艺复兴时期人文主义的基本观念，即人本主义思想。以人性论为基础，以人为中心，赞扬人的价值和尊严，肯定人对现实幸福和自由的追求，是文艺复兴时期人本主义思想的具体内涵。\n\n在文艺复兴时期的人文主义文学中，这一思想常常通过两方面体现出来，一是通过描写人的力量和智慧，来肯定现实人生；一是通过描写言行矛盾或迂腐笨拙的封建教士，对封建神学和教会予以嘲笑和抨击。\n\n一、拉伯雷的《巨人传》是法国人文主义文学的代表作，洋溢着浓郁的市民精神和平民意识。\n\n这部小说描写了三代巨人的故事，通过三代巨人的成长，反映了人文主义教育对人的健康发展起到的积极作用，批判了扼杀人性的封建神学和经院哲学教育；通过刻画三代巨人的形象，小说理想化地表现了人的力量、人性的健康，以及人性的高贵。三代巨人身形巨大，力量无穷，学识丰富，才能出众，拥有高尚的思想和平等的态度，反映了作者对人的力量和知识的歌颂。拉伯雷在《巨人传》中所倡导的以“自由”为特征的教育思想，其实就是文艺复兴时期的人文主义思想下的人的自由意志的直接体现。\n\n二、意大利人文主义作家薄伽丘在自己的《十日谈》中突出地歌颂了人世间的爱情。\n\n在十个青年男女讲述的100个故事中，绝大部分的故事直接与爱情相关。一方面，小说肯定了追求爱情自由和现实人生幸福的天性，描写了青年男女冲破封建门第障碍的故事；另一方面，小说对道貌岸然的教会人士进行了揭露，描写他们表面上宣扬禁欲主义哲学，暗地里却干着满足贪欲的勾当，勾画了他们丑恶的嘴脸。\n\n三、西班牙作家塞万提斯《堂吉诃德》对封建势力的反抗\n\n堂吉诃德是被嘲讽的典型，但他自认为是站在骑士的角度行事，始终坚定自己的理想，崇尚真理和正义，具有侠义精神，\n\n勇于与恶势力斗争。如他认为风车是恶魔，然后就去攻打风车；他认为混乱的羊群是交战的军队，于是就大战羊群；为了解救受苦的骑士，他打烂了木偶戏台；为了小雇主受的皮肉之苦，他去惩罚财主。这些荒诞的行为中富含着堂吉诃德对人们的同情，体现出他对封建势力的反抗。\n\n四、莎士比亚的《哈姆莱特》中处处表现着人文主义思想\n\n戏剧一开始，就介绍了当时英国社会的种种黑暗，老国王被人害死，新国王上位并迎娶了哈姆莱特的母亲，哈姆莱特在大学中就接受了人文主义思想的教育，他代表着新思想与新阶级。随着之后一系列事件的发生，他的理想开始破灭，但他没有放弃，而是要将个人的复仇上升到为国家、人民幸福的奋斗。\n\n“人的发现”反映了文艺复兴时期的成就，但也暴露了其时代局限。立足于资产阶级人性论，文艺复兴时期对人的认识多是以资产阶级的阶级本性来定义人性，带来了享乐主义、纵欲主义和利己主义等消极思想，也在人文主义文学中产生了不良影响，削弱了文学作品的艺术魅力。\n\n总之，历史地看，对人及其现实生活的表现与肯定，出现在这一时期众多的人文主义作品中，成为时代新文学的主旋律，使得这一时期的人文主义文学成为了文艺复兴运动的重要组成部分。","keywords":"人的发现 人本主义思想 拉伯雷 薄伽丘 塞万提斯 莎士比亚 时代局限","note":"①回答这道题目，我们首先要明确文艺复兴时期人文主义的基本观念，即人本主义思想，然后分别从各个作家及其作品来进行分析。人文主义文学突出的特点便是对人的发现，这体现在一众作品中，比如《哈姆莱特》《十曰谈》等等。**②局限性大家也要谈谈。"},{"id":"35","stars":"★★★★","title":"简述文艺复兴时期欧洲主要国家文学的发展情况和主要成就","body":"文艺复兴在欧洲各国开始的具体时间不同，其文学发展也有差异，但是都取得了巨大的成就。\n\n一、意大利文学\n\n意大利是欧洲文艺复兴的发源地。\n\n彼特拉克被认为是第一个人文主义学者，被誉为“人文主义之父”。他第一个指出，“人学”和“神学”是两个对立的概念，以此与封建教会思想相对抗，他曾写过许多优美的诗篇。他的抒情诗集《歌集》采用十四行诗的形式，歌颂了现实生活中男女之间的爱情，开创了一代诗风。《歌集》中还有一些政治诗，表达了强烈的热爱祖国、反对封建割据，号召和平与统一的思想情感。\n\n薄伽丘的《十日谈》在思想和艺术方面都为欧洲现实主义小说的发展奠定了基础。将彼特拉克开创的意大利人文主义文学发展到了一个新的高度。\n\n15世纪以后，意大利的人文主义文学曾一度繁荣，但总的成就不如早期。重要的作家有卢多维克·阿利奥斯托和托夸多塔索。前者的代表作品为传奇体叙事长诗《疯狂的罗兰》，后者的代表作是叙事长诗《被解放的耶路撒冷》。两个作家的创作均反映了意大利文艺复兴晚期的社会生活，表现了晚期人文主义运动的深刻矛盾。\n\n二、法国文学\n\n法国的人文主义运动开始于15世纪末，16世纪取得了很高的成就。法国的人文主义文学的显著特点是自始至终存在着贵族与平民两种倾向。\n\n龙沙等七人组成的“七星诗社”，具有浓重的贵族倾向。他们肯定生活，歌颂自然与爱情，反对禁欲主义，注重民族语言的统一和民族诗歌的建立，但却轻视民间语言和民间文学，艺术上追求典雅的风格。\n\n拉伯雷是法国人文主义文学平民倾向的杰出代表，欧洲文艺复兴的最重要作家之一。他的《巨人传》是欧洲近代文学中，人的形象首次顶天立地地屹立在神面前的一次成功尝试。他通过两个巨人的形象，全面展示了人文主义理想，对后世讽刺小说产生了巨大影响。\n\n蒙田是法国文艺复兴后期的人文主义作家，他的《随笔集》以怀疑论为武器，探讨了当时的社会问题。他是欧洲近代散文的创始人。\n\n三、西班牙文学\n\n西班牙文学在戏剧和小说上取得了巨大成就。\n\n西班牙戏剧在文艺复兴时期繁荣起来，维加是西班牙戏剧的奠基者，被誉为“西班牙戏剧之父”，代表作《羊泉村》揭露了封建主的暴虐，歌颂了农民为维护自己的权利而进行的正义斗争，具有强烈的战斗性和民主性。\n\n节结构模式，对后世的小说创作产生了巨大影响。\n\n西班牙人文主义的代表作家为塞万提斯，他创作的《堂吉诃德》代表了西班牙人文主义文学的最高成就，融合了骑士传奇和流浪汉小说的长处，为欧洲近代小说的发展与繁荣奠定了基础。\n\n四、英国文学\n\n英国文艺复兴时期人文主义文学成绩斐然。早在14世纪就已经出现了人文主义创作。\n\n乔叟诗作显示出反封建、反教会，追求个性自由的倾向，他的代表作《坎特伯雷故事集》揭露了封建阶级尤其是教会的腐败无耻，肯定了对世俗爱情的追求。作品也流露出市民阶级对纵欲的欣赏以及宗教劝善思想和容忍处世的哲学观念。\n\n15世纪末，英国一批新的人文主义学者登上文坛。莫尔是其中最重要的代表作家。他的主要作品是对话体幻想小说《乌托邦》。这部作品被认为是欧洲最初的空想社会主义著作之一。\n\n16世纪中期以后，英国的人文主义文学出现了空前的繁荣。诗歌方面最著名的作家是斯宾塞，他的长诗《仙后》充满了对生活和大自然的热爱之情，表现了人文主义的新思想。\n\n英国文艺复兴文学中成就最大的是戏剧。以马洛为代表的“大学才子派”的戏剧活动，为莎士比亚的戏剧创作准备了条件。莎士比亚是英国文学的一座高峰，他的历史剧、悲剧、喜剧和传奇剧，对欧洲文学产生了深远影响。","keywords":"意大利 彼特拉克 薄伽丘 法国文学 贵族与平民 龙沙 拉伯雷 西班牙 戏剧和小说 维加 流浪汉小说 塞万提斯 英国 乔叟 莫尔 斯宾塞 马洛 莎士比亚","note":"回答这道题目，需要大家对文艺复兴时期欧洲各个主要国家的文学发展情况有一个大致的掌握，尤其是一些代表作家和他们的代表作品。大家可以结合后面的题目，来对这道题进行拓展。此外，这里涉及的“彼特拉克”“七星诗社”“大学才子派”等名词解释，大家要留意一下。"},{"id":"36","stars":"★★★","title":"《十日谈》的思想主题和艺术特色","body":"一、思想主题\n\n人文主义思想是贯穿《十日谈》的一根红线，也是理解这部作品的一把钥匙，在人文主义思想的指导下，《十日谈》反对宗教蒙昧主义、神秘主义和禁欲主义，大胆地揭露天主教会和教士的腐败与欺骗，以及种种悖情逆理的愚行固念。同时它热情洋溢地歌唱爱情，歌颂人的聪明才智和美好品德，宣扬幸福在人间的积极思想。\n\n（一）揭露禁欲主义和蒙昧主义，批判天主教会的腐化、伪善和欺骗\n\n《十日谈》毫不留情地揭开教会神圣的面纱，把神职人员的贪婪奸诈、奢侈逸乐、虚伪丑陋的一面统统暴露在光天化日之下。更是把矛头对准教廷乃至天主教教义，从总体上揭露教会的虚假性、欺骗性和反人性。薄伽丘认为教士、修女等教会人士与常人一样，有追求现世享乐的要求。而天主教却要求教会人士戒除欲望，虔心事主，这和他们的自然欲望发生了矛盾。于是教会人士置教规教条于不顾，为满足个人淫欲而作出种种伤风败俗的劣行。《十日谈》通过多篇妙趣横生的故事，生动形象地揭露了神职人员的淫行败德，抨击他们的虚伪和奸诈。\n\n（二）从人文主义出发，体现全面发展的人的观念，宣扬现世幸福的思想\n\n薄伽丘从人文主义观念出发，认为人应该全面发展，并对人的各种优秀品质，如聪明、理智、慷慨、友情、爱情等毫无保留地予以表彰，这也是文艺复兴时期对于人的理想。薄伽丘认为爱情是现世幸福最重要的体现，他赞扬人性，追求原欲的解放，反对禁欲主义，抨击封建特权以及男女不平等的现象。《十日谈》通过十个年轻人各自的故事以及他们十天里共同生活的状态，展示了人性之清明、通达的一面，显现出了一个乌托邦社会的雏形。在瘟疫肆虐、传统社会结构崩坍之际，薄伽丘将人文主义理想应用到处理社会危机中来，有着很深的思想寓意。\n\n二、艺术特色\n\n（一）强烈的现实主义色彩\n\n《十日谈》的故事大多取材于现实，以现实主义的手法描写新兴资产阶级的生活，讽刺僧侣和教会，充满了浓厚的现实主义色彩。\n\n（二）采用框架结构形式\n\n薄伽丘采用故事会的形式，以框架式结构把这些故事有机地组成一个严谨、和谐的叙述系统。大瘟疫作为一个引子，借以引出10名男女青年，并点明自然祸害导致社会秩序、人际关系的堕落，为整部作品涂抹出时代底色。引子，作者的开场白、跋，和10名男女在别墅的活动，是一个大框架，巧妙地包容和串联了主人公们讲述的100个故事。这100个故事，除\n\n了第1天和第9天没有命题外，其余8天的故事各在一个共同的主题下展开，使这框架结构浑然一体。大框架中套小框架，故事中套故事，既可鲜明地表达作者的情感、观念，又具有引人入胜的艺术魅力，庞大而活跃、复杂而有序。后世将这种形式称为框架式结构。\n\n（三）注重刻画人物性格，描写人物心理\n\n薄伽丘以丰富的生活知识和出色的艺术概括力，通过叙述故事，概括生活现象，描摹自然，叙写细节，刻画心理，塑造了整个社会的不同阶层，展示出意大利广阔的社会生活画面，抒发了文艺复兴初期的人文主义和自由思想。意大利评论界把薄伽丘的《十日谈》和但丁的《神曲》相媲美，称之为“人曲”。薄伽丘尤其擅长描写恋爱中女子的内心体验，在《十日谈》中很多描写男女之间爱情的故事，都体现出了这一点。\n\n（四）语言精炼流畅、俏皮生动\n\n薄伽丘语言风格一反中世纪晦涩、阴郁的特点，轻松活泼，风趣幽默，洋溢着浓厚的生活气息。它以文学古典名著为典范，又吸收了民间口语的特点，描写事件和人物微妙尽致，灵动多姿。","keywords":"抨击天主教会和宗教神学 赞扬人性 追求原欲 抨击了封建特权 男女不平等 全面发展的人 现实主义色彩 框架结构 刻画人物 语言精炼俏皮","note":"薄伽丘的《十日谈》与但丁的《神曲》井驾齐驱，被意大利评论界称之为《人曲》。英国乔叟的《坎特伯雷故事集》便是文艺复兴时期模仿《十日谈》的经典。20世纪法国“新寓言”派代表作家图尼埃的小说集《爱情半夜餐》，在形式上也借用了《十日谈》的框架结构。对于《十日谈》相关知识点，我们需要重点把握。此外，《十日谈》也会以名词解释的形式出现，大家要注意积累。"},{"id":"37","stars":"★★★","title":"《巨人传》的思想主题和艺术特色","body":"一、思想内容\n\n《巨人传》小说共5部分，描写了巨人家族三代国王高朗古杰、高康大、庞大固埃一代胜过一代的故事。小说通过对力大无穷、形体巨大的巨人家族的描写，全面地展示了人文主义理想。\n\n（一）《巨人传》有强烈的现实隐射和讽喻意味\n\n（1）拉伯雷对天主教会的方方面面展开了辛辣的讽刺，暴露其逐利、残暴、虚假的本质，使其神圣性荡然无存，反映了时代的进步要求。\n\n（2）《巨人传》的另一个批判重点是封建法律制度和司法机构。在从中世纪神权统治向近代资本主义社会过渡时期的法国，法律制度和司法机构在很大程度上还是神权的延伸，王权的仆从，毫无独立性可言。由此造成的严重弊端之一，是法律条款经文化、教条化，叠床架屋，脱离现实生活，且往往相互龃龉、矛盾，使司法低效，也给腐败以可乘之机。《巨人传》有多处对缠讼和司法拖延的描写。在描写庞大固埃一行的海外经历时，对司法腐败与黑暗也有大量嘲讽和批判。\n\n（二）《巨人传》主要通过巨人形象的塑造全方位展现了人文主义价值观\n\n（1）拉伯雷表现了“巨人主题”，强调了人文主义教育和知识的重要。小说描写两代巨人接受教育的过程，其心智与人格因为受到人文主义教育才得到健全的发展，展示了人文主义教育下培养出来的新人形象，完整地表达了人文主义先进、科学的教育理念，充分肯定了人、人性和人的创造力。拉伯雷对巨人外形、力量和生理欲望极度夸张的描写，实质上是把人塑造成追求感官欲望满足的异教自然之神，这是对基督教上帝权威的挑战，对基督教禁欲主义和原罪思想的反动，反映了人文主义者对人的力量的自信和对现世幸福生活的肯定。\n\n（2）《巨人传》提出了新兴资产阶级的社会理想。卡冈都亚为酬谢约翰修士而修建的“德廉美修道院”，其院规是“想干什么就干什么”。这种乌托邦式的社会理想表达了人类要求自由、平等、幸福的愿望，展现了高度物质文明的生活场景，是人文主义者追求快乐人生的思想的集中体现，对天主教会奉行的苦行主义来说，是一种明显的叛逆。\n\n二、艺术特色\n\n（一）《巨人传》以市民语言为基础，植根于民间文学的土壤\n\n《巨人传》取材于法国民间故事，加以创造性改造，表达了新的思想内容。拉伯雷大量采用民间俗语、俚语、行话、古代和外国语言，形成了一种驳杂、雄迈、奔放的风格，极大地丰富了法语的语汇和表现力。在民间传说的基础上，他用深厚的生活功底和渊博的科学知识，驰骋丰富的想象力，使整部小说色彩斑驳，变幻无穷，以多棱镜的形式映出了十六世纪上半叶法国社会的大千世界，传达了新时代的信息。\n\n（二）《巨人传》采取了丰富多样的喜剧化叙事手法\n\n《巨人传》通过制造出狂欢、哄闹、调笑的效果，对受陈旧观念禁锢的身心是一种解放，对封建制度的神圣性和正当性，则有摧枯拉朽般的破坏作用。\n\n（1）怪诞叙事。所谓怪诞叙事，是把人与事夸张到不可思议的幅度，使之发生变形，由此产生怪诞感。《巨人传》中两代巨人及其活动是怪诞叙事的典型，他们的出生、形体、器官、体能、行动，无不被夸大到极致，在庞大固埃与同伴的海外旅程中，还出现了禽兽外形人、香肠人、服饰怪异的灯笼人等许多怪诞人物。此外，小说对皮克罗肖王小丑化的描写，毫无节制地罗列事物名称、数字等，都是怪诞叙事的表现。\n\n（2）粗鄙叙事。《巨人传》对人与动物的生殖排泄器官及其行为功用的描写和隐喻不胜枚举，且用语粗俗，无所顾忌。例如第一部第十三章，大古吉得胜回朝，看望儿子高康大时，问他如何保持全身清洁，高康大回答是找到了擦屁股的新方法。然后就给父亲-列举擦屁股所用的物品数十种，且多数与擦拭功能无关。物品的形象摆脱了与其功能的逻辑联系，纷至沓来，加上高康大罗列并品评时心满意足的语调，凸显了物品使用的闹剧性，令读者忍俊不禁。\n\n（3）滑稽模仿。《巨人传》中的许多场景故事，是对圣书、宗教仪式、宗教或民间节日的戏仿。例如《庞大固埃的家谱溯源》一章，是对《圣经》中对亚当与夏娃后代谱系描写的模仿。第一部中，高康大与皮克罗肖王的大战和法国乡村葡萄节上的狂欢相映成趣，巴汝奇对贵妇人的追求和戏弄，是对圣体节宗教游行的滑稽式改编。\n\n（4）讽刺叙事。即直接对不合理的事物冷嘲热讽。教会和司法是拉伯雷讽刺火力打击的重点。他借人物之口，讽刺教会人物荒淫，“连修道院钟楼的影子都能让女人怀孕”，讽刺教星的敕令臭不可闻。讽刺法律不公，说它像一张蜘蛛网，只逮小苍蝇、小蝴蝶，大牛虻则可以破网而出。这些讽刺总是辛辣犀利，一针见血。\n\n（三）拉伯雷运用写实与幻想相结合的写作手法，传达了新时代的精神风貌\n\n《巨人传》借鉴了中世纪骑士传奇以主人公冒险经历串联情节的模式，但扬弃了骑士传奇主人公为了博取贵妇人垂青而外出冒险游历的俗套，把游历与精神成长、真理追求、现实批判结合起来，赋予了这些情节崭新的人文主义内涵。欧洲长篇小说脱胎于中世纪的英雄史诗和骑士传奇，其转型的关键是从奇幻走向写实，从供大众娱乐的民间口传作品转为作家个人创作，表达个人对生活的理解。《巨人传》中人物形象塑造和情节结构安排是这种转型的重要表征，对欧洲长篇小说的发展起到了重要的示范和奠基作用。","keywords":"思想内容 现实隐射和讽喻意味 人文主义价值观 艺术特色 市民语言 民间文学 喜剧化叙事手法 写实与幻想相结合","note":"《巨人传》是拉伯雷在法国文学史上树立的一座丰碑，对后世知名剧作家、作家如莫里哀、伏尔泰、卢梭、巴尔扎克、夏多布里昂等人有很大影响，我们要重点把握其创作特征。同时《巨人传》以及这里涉及的“乌托邦”都可能以名词解释的形式出现，大家要注意积累。"},{"id":"38","stars":"★★★★★","title":"分析堂吉诃德和桑丘的人物形象以及二者的关系","body":"一、堂吉诃德：西方文学史上第一个正面的喜剧人物，是一个悲剧性和喜剧性混杂在一起的人物形象。\n\n（一）堂吉诃德的形象具有喜剧因素\n\n由于被骑士小说毒害，他终日脱离实际，把维护正义，消除世间的不平作为自己的天职，他见义勇为，置个人生死于度外，他动机善良，由于方法不对而得到相反的结果。这一切使他成了一个夸张的喜剧性角色。\n\n（二）堂吉诃德的形象又具有悲剧因素\n\n堂吉诃德的形象，反映了作者的人道主义思想，堂吉诃德不仅仅是个喜剧性角色，他坚信骑士道，全身心浸透着对理想的忠诚，为理想而甘愿承受种种艰难困苦。从主观上讲，他又是一个带有悲剧因素的人物。\n\n（三）悲剧性和喜剧性在这一人物身上有机融合\n\n在资本主义生产关系兴起的历史时期，堂吉诃德却要复兴封建时期的骑士道，提着破矛屡次外出行侠仗义。在行侠的过程中，堂吉诃德以骑士小说的虚幻眼光看待现实世界，闹出很多笑话，致使自己成了众人的笑柄。但是，他外出行侠是为了维护人间正义，铲除不平。在行侠的过程中，他屡遭挫折，甚至被打断肋骨，但他不屈不挠，勇往直前，显示出崇高的精神品质和执着的奋斗精神。堂吉诃德具有英雄的品质，然而，他的追求不仅跟时代脱节，而且也不被人们所理解，当他最后清醒过来的时候，却即将离开人世，这些都赋予其性格以浓厚的悲剧色彩。\n\n二、桑丘：文艺复兴时期西班牙纯朴农民的典型\n\n（一）桑丘的性格具有农民的时代特征\n\n一方面，桑丘具有劳动人民的勤劳、机智、善良的品质和乐观主义精神，在当“海岛总督”期间表现出惊人的才智和务实的精神。作为农民的桑丘是具备一定的反抗意识的，但是当自身的反抗遇到阻碍，他就会想到顺从。另一方面，桑丘又有封建制度下小生产者眼光短浅、狭隘自私和贪图小利的弱点。他的游侠没有什么高尚的理想，也不为建立什么功勋，只是为了发一笔财，改变自己窘迫的生活。但是他本性善良，同情那些与他地位相近而备受欺凌的人，在这一点上与堂吉诃德逐渐接近。随着故事的发展，他的正直、智慧和才干得到了充分的发挥，体现了劳动人民的优秀品德。\n\n（二）桑丘的思想和性格呈现出了变化发展\n\n在堂吉诃德崇高理想和执着精神的影响下，桑丘的性格发生了改变，善良、乐观逐渐成为其性格的主导方面。他心甘情愿地跟着堂吉诃德受尽磨难，哪怕分文未得；他不再自卑，并且认识到自我的价值，在当总督期间，体现了自己的才能与智慧。桑丘形象的塑造，既衬托了堂吉诃德形象，又真实地反映了文艺复兴时期西班牙农民的艰难处境以及要求改变现状的强烈愿望。\n\n三、堂吉诃德与桑丘关系\n\n（一）小说中桑丘是作为配角出场的，但桑丘并不仅仅是陪衬，更是堂吉诃德的对照，是另外一个性格完全相反的堂吉诃德，也是堂吉诃德骑士事件中最为直接的见证人。堂吉诃德与桑丘这对主仆在作品中构成鲜明的对比关系。他们二人无论从外表还是性格都形成对照，一个又高又瘦，一个又矮又胖；一个沉溺于幻想，目的高尚，一个立足于现实，讲求实际。桑丘是现实世界的代言人，他能不被理想世界所迷惑，能认真地看清现实世界的事物，这一点是堂吉诃德这个骑士幻想者不具有的。可以这样说，如果不是桑丘的这种讲求实际的精神，整篇小说的内容将完全沉浸于理想主义，桑丘对于堂吉诃德的劝阻与对现实的认同也正是作者要发出的呐喊。\n\n（二）堂吉诃德与桑丘两人互相感染，逐渐成为不可分割的整体。堂吉诃德最后终于清醒过来，痛恨骑士小说和骑士道。与此相对应，在堂吉诃德潜移默化的影响下，桑丘的思想和性格也发生了变化，现实的利益从其考虑中退出，代之以与堂吉诃德的友谊、对堂吉诃德的关心。在担任海岛总督期间，桑丘显示了务实精神和治理才能，实现了堂吉诃德的理想。\n\n总之，堂吉诃德和桑丘虽然出身和性格各不相同，但都从不同方面代表了人类普遍的思想感情，二人既互相对比又互相影响的关系，增加了故事的生动性，突出了各自性格的差异，而且还呈现了人性的丰富性与复杂性，多角度地反映了文艺复兴时期西班牙的社会现实。","keywords":"堂吉诃德 悲喜融合 桑丘 农民的时代特征 变化发展 对照 互相感染","note":"堂吉诃德的人物形象是一个考查重点，湖北大学在2023年考研中出现过一道相关题目：“《堂吉诃德》中堂吉诃德的喜剧性和悲剧性”，在这里我们做了拓展延伸，补充了桑丘形象的相关知识。堂吉诃德和桑丘这两个人物既相互陪衬，又相互对照，堂吉诃德的理想主义和桑丘的务实精神相映成趣，正是由于桑丘的存在，堂吉诃德的性格才得以更加鲜活地呈现，二者是相辅相成的关系。此外，“堂吉诃德”也是一个常考名词解释，大家要注意积累。"},{"id":"39","stars":"★★★★","title":"谈谈堂吉诃德的人物性格与现实意义","body":"一、人物性格具有二重性\n\n堂吉诃德是一个性格复杂且矛盾的人物。他身上既有滑稽可笑的特点，又有严肃认真的思考，是一个可笑又可悲、可乐又可敬的具有双重性格组合的人物形象。\n\n（一）沉溺幻想、脱离实际的一面\n\n堂吉诃德爱读骑士小说，羡慕骑士做派，赞赏骑士精神，于是在装备、服饰、举止、行动上处处模仿，亦步亦趋，完全沉浸在骑士小说的幻想世界之中。但他的周围是一个被日常生活逻辑支配的现实世界。当堂吉诃德按照幻想世界的逻辑在现实生活中行动时，他在世人眼里就显出了疯相和病态。堂吉诃德扮骑士仗义行侠，宣称要恢复骑士道，不仅脱离现实，而且落后于时代。\n\n（二）合理的一面\n\n堂吉诃德的骑士理想和行为有其荒唐的一面，但也有许多合理的成分。\n\n（1）具有人文主义思想\n\n堂吉诃德心目中理想的骑士是一个通晓天文、地理、法学、神学、医学、数学的全才。他认为骑士应该除恶扬善、扶弱济贫、爱国爱民、维护正义。他向往一个人人真诚相待，财富不分你我，公正和平友爱的“黄金时代”。他认为自由是人的天然权利，他主张人类要以理性为尊，以美德为贵，而不应该以出身分出贵贱。他悲天悯人，有时刻准备救民于水火的忧患意识和拯救意识，这些思想信念和行动，打的虽然是骑士的旗号，其精神实质却是融合了基督教精神的后期人文主义思想的\n\n反映。\n\n（2）勇敢的战士\n\n堂吉诃德不仅信仰坚定高洁，而且勇于行动，敢于以生命捍卫真理，是一个勇敢的战士形象。堂吉诃德幻想中的江湖世界充斥着妖魔鬼怪，时刻都会遇到艰难困苦的考验，但堂吉诃德总是百折不挠、勇往直前。在和他臆想中的巨人、军队、神怪的战斗中，他从来不惧对手的强大，总是毫不犹豫杀入敌阵，虽伤痕累累而不悔。他对意中人忠心耿耿，拒绝各种诱惑，也不容他人对自己的意中人有任何质疑、嘲笑和亵渎。一旦他确定了为爱情苦修的范式，就不打丝毫折扣，彻底贯彻。\n\n（3）充满童心、智慧与趣味\n\n堂吉诃德还是一个充满童心、智慧，颇有趣味的人。在行侠途中，他和桑丘经常一问一答。对话中的堂吉诃德不仅头脑灵活清楚，而且充满智慧。听堂吉诃德滔滔不绝地纵论人生、社会，是一种绝妙的享受。\n\n二、现实意义\n\n（一）在16、17世纪的西班牙，枪炮已经被广泛应用于军事，骑士逐渐失去了作用，骑士精神已经式微，堂吉诃德还想提着一杆锈烂的铁枪去征战立功，必然碰得头破血流。从这种意义上说，堂吉诃德这个落魄骑士的形象，既是对骑士小说的讽刺，也是对西班牙现实政治的讽刺。\n\n（二）16世纪上半叶西班牙通过连续的战争和殖民征服，建立起强大帝国。骑士小说迎合了国民强烈的荣誉感和自豪感，以及冒险扩张、建功立业的冲动，而封建专制政权也乐于以理想主义和英雄主义迷惑人民，借此巩固自身的统治。\n\n（三）之后西班牙急剧走向衰落，虽然现实发生了巨大的变化，但国家和人民仍然沉醉在盲目乐观自大的幻觉之中，无视日益临近的危机。塞万提斯通过堂吉诃德可笑、可怜的遭遇，给游侠骑士画了一幅讽刺的漫画像，借此对西班牙人给予警策和棒喝，让他们从不切实际的幻想中清醒过来。\n\n（四）堂吉诃德性格的两重性触及人类面临的最深刻的矛盾，即理想与现实的矛盾。他有崇高的理想、纯真的动机、严肃的态度，但是面对着丑恶或庸常的现实，只能遭遇灾祸与不幸，成为悲剧性人物。堂吉诃德的可贵之处在于，他始终对理想保持着纯真的信仰，他在道义上是强大的，他的生命力是强旺的，他的精神为人类在面临理想与现实这一永恒的冲突时如何处置自己，如何保持生命的尊严和勇气，提供了一个光辉的楷模。","keywords":"性格的二重性 沉溺幻想 脱离实际 合理的成分 讽刺骑士小说和现实政治 迎合国民的荣誉感 警策和棒喝 理想与现实的矛盾","note":"这是2023年浙江财经大学考查的一道真题，此外，广西民族大学也在同年针对上述现实意义的第二点出过相关题目：“结合《堂吉诃德》和评论家对它的评价，谈谈你对理想和现实辩证关系的理解”，这道题目也是要从人物性格出发进行把握。一方面，堂吉诃德耽于幻想、脱离实际，另一方面，他在面对理想与现实的冲突时，又能够始终对理想保持着纯真的信仰。堂吉诃德这个形象，一方面体现了对当时的骑士小说和西班牙社会现实的讽刺，另一方面又体现了对人类如何面对理想与现实的矛盾这个问题的思考。"},{"id":"40","stars":"★★★★","title":"《堂吉诃德》的艺术特色","body":"一、现实与虚幻结合\n\n《堂吉诃德》反映了广阔的社会生活图景，具有较强的现实性。作者将现实与虚幻结合起来，在看似荒诞不经的故事中描绘真实的社会现实。《堂吉诃德》在吸取了拉丁文古典小说、英雄史诗、西班牙民歌、田园小说、传奇小说、流浪汉小说和骑士小说的一些特点的基础上，把对社会各阶层的描写同对社会现实的描绘结合起来，逼真地再现出贵族绅士的专横跋扈和普通百姓的辛酸苦辣。在一本小说中，以如此宽广动人的画面来反映时代、反映现实，《堂吉诃德》可以说是一个首创，它给近现代小说的发展以深刻的影响。\n\n二、环性结构\n\n《堂吉诃德》借鉴了骑士小说与流浪汉小说惯用的以主人公的游历统领情节的“线性结构”，其中又穿插了一些独立的短篇小说。这样做的好处是场面多，容量大，自由度高，缺点是情节松散，容易旁逸斜出。《堂吉诃德》取其利而避其害。它安排了主人公的三次出游，每次都以返家结束，从而形成了三个环形，使原本开放的“线性结构”变成了封闭的“环形结构”；同时，三次出行的见闻经历，往往前后呼应；独立的故事与堂吉诃德的游侠主线之间，又常常发生联系，如此经纬交织，使小说情节结构更加严谨，这对初创时期小说的继承与创新是一个极好的示范。\n\n三、滑稽模仿的方式\n\n《堂吉诃德》堪称喜剧艺术的典范。塞万提斯写《堂吉诃德》的初衷，是要“把骑士小说的那一套扫除干净”，他采取滑稽模仿的方式做到了这一点。骑士的命名、意中人的指定、举行受封仪式、向贵夫人献殷勤等，这些骑士小说中的典型情节，《堂吉诃德》都如法炮制，但将其置于现实的场景中，又使堂吉诃德与骑士小说中那些骑士形象的光辉造型严重不符，从而产生滑稽效果，暴露出骑士文学的荒唐之处。\n\n四、人物形象生动\n\n《堂吉诃德》在人物性格的塑造上，取得了突出的成就，用喜剧的手法刻画了一个带有悲剧性的人物。小说塑造了700多个来自不同阶层的人物形象，主要人物性格突出，堂吉诃德和桑丘这两个典型人物的塑造，更是表现了作者高超的人物刻画功力。此外，小说着重描写人物主观动机与客观后果之间的矛盾，在喜剧性的情节中揭示出了悲剧性的内涵。\n\n五、各种表现手法的运用\n\n（一）讽刺。塞万提斯把人物放在一个个不同的情景之中，以讽刺的手法，不断重复描写人物的荒唐行动，突出人物的性格特征和喜剧效果。小说以戏谑的笔调模仿骑士小说，以达到讽刺骑士小说的目的。在叙述过程中，作者通过多重讽刺视角描写生活与人物，借用堂吉诃德的疯话与桑丘的傻话，讽刺人物的迂腐可笑以及黑暗的现实社会，达到了多重目的，具有强烈的讽刺效果。\n\n（二）对比。对比手法在塑造堂吉诃德与桑丘·潘沙两个喜剧人物时发挥了重要作用。他们一主一仆，一瘦一胖，一高一矮，一个重理想，一个讲实际，一个英勇无畏，一个胆小怕事，从身份形体到性格思想，处处形成有趣的对照，而人物却对此不自知。\n\n（三）夸张。塞万提斯往往夸张人物身上的某种特征，使之趋于极端，更强化了幽默和讽刺的效果。\n\n（四）小说中的双关语、笑话、反话、文字游戏俯拾皆是，也令读者捧腹。\n\n六、现代小说特点\n\n（一）多层次叙述\n\n《堂吉诃德》采取的是一种到20世纪才被广泛运用的“多元”叙事技巧，即由多个人物，从多个来源叙述同一个故事。叙述人“我”颇像一位考据家，他以阿拉伯历史学家写的《堂吉诃德·台·拉·曼却传》为主要依据，参考拉·曼却的地方传说和译者的评论加上自己的推测、分析和判断，从而汇总、整理出堂吉诃德的故事。塞万提斯有意把叙述的层次复杂化，在《堂吉诃德》中营构了一个由不同叙述人相互补充印证、反诘所形成的叙述场，使各个叙述层次之间充满歧义和张力，打破了单一叙事的稳定性和权威性，大大加强了小说叙事的纵深感。《堂吉诃德》这部欧洲现代小说的奠基之作，对往后世界文学的发展产生了深远影响。\n\n（二）元小说性\n\n《堂吉诃德》已具有元小说性，也即小说具有了自我意识，自我阅读、自我指涉现象层出不穷。自我指涉性是20世纪西方文学理论中一个重要的术语，其基本含义是指文学将读者的注意力吸引向其自身的特性。《堂吉诃德》中的人物常常跳脱小说框架对写作来一番评论，书中人物仿佛有了预见，共同参与了小说的创作，由此打通了小说内外的界限，模糊了真实与虚幻。如小说第二部中的人物几乎都是第一部的读者并时常对第一部点评：在第二部第三章里，学士参孙和堂吉诃德讨论了第一部里哪几桩功勋最杰出，也指出了第一部创作的一些问题和疏漏，这些都是塞万提斯的自我反思。\n\n塞万提斯还在小说中引用自己以往的作品并担当了批评家的职责。如第一部第六章的书房大审查，塞万提斯本人成了理发师的朋友，借着理发师的声音，塞万提斯评论了自己的作品《伽拉苔亚》，还向读者讲述了自己参军致残被国家遗忘，生活贫困多次被陷害入狱的经历。\n\n七、语言质朴幽默\n\n《堂吉诃德》语言贴近生活，真实、质朴、明晰，叙述中融入了讥诮、幽默的成分，采用了大量的西班牙民间俗语和谚语，语言生动形象，具有丰富的寓意。","keywords":"现实与虚幻结合 环性结构 滑稽模仿 人物形象 表现手法 现代小说特点 语言质朴幽默","note":"南京师范大学在2023年出过一道相关真题：“结合作品分析塞万提斯的小说艺术特色”，回答类似题目，大家可以从作家最主要的作品入手，例如塞万提斯最主要的作品就是《堂吉诃德》。关于《堂吉诃德》的元小说性，大家可以拓展阅读相关文献如魏巍《从视角主义解读（堂吉诃德）》、滕威《＜堂吉诃德》的元小说性》，相关资料可在李凡文学正版群中获取。此外，补充一个小知识点，虽然课本中“堂吉诃德”中间没有加“。”，但我们要知道“堂”是贵族标志，“吉诃德”才是他的名字。"},{"id":"41","stars":"★★","title":"简述塞万提斯的《堂吉诃德》与骑士文学的关系","body":"《堂吉诃德》与骑士文学具有密切的联系，它是塞万提斯采用戏拟骑士传奇的手法创作的一部讽刺骑士传奇的作品，对骑士传奇的社会作用进行了否定，同时也在形式上予以了创新性改造。\n\n一、批判死而不僵的骑士文学\n\n骑士文学作为维护封建领主统治和基督教义的武力阶层，身上所具有的保守性和反动性是显然的。虽然骑士和骑士制度已经消亡，但作为一种文化传统，骑士精神仍旧存在，骑士文学仍旧死而不僵。当时新兴的资产阶级代言人-人文主义者要以人文精神砸碎封建基督的精神枷锁，骑士精神自然属于被批判的行列。《堂吉诃德》便是在此历史背景之下产生的。\n\n塞万提斯在小说中表达了这样一种思想：骑士制度已经随着社会的发展宣告灭亡。骑士精神或骑士行为这种与时代潮流相违背的逆动显得荒谬可笑。显然，《堂吉诃德》是以骑士文学的形式承载新兴的人文思潮，进而对骑士文学本身发难。\n\n二、适当借鉴与继承骑士文学\n\n塞万提斯写作《堂吉诃德》是为了“消除骑士小说在世人当中造成的影响和迷狂”。他指出骑士小说文笔艰涩、情节荒诞，违背了创作原则。但是，他又认为借用骑士小说这种体裁，可以“借题发挥，放笔写去，海阔天空，一无拘束”。为了达到有力地讽刺骑士传奇的目的，作者采用戏拟的方法，借用骑士传奇的形式来设计情节、塑造人物和运用语言，描绘了疯骑士堂吉诃德滑稽荒诞的游侠行径，暴露了骑士传奇的危害性，针砭了时弊。《堂吉诃德》是以骑士文学的形式向骑士文学决绝。\n\n三、创新：奠定新起点\n\n在具体写作中，塞万提斯没有囿于骑士传奇的形式，而是将流浪汉小说的结构特点和现实主义精神融会其中，为西方叙事文学的进一步发展奠定了一个新的起点。\n\n塞万提斯在《堂吉诃德》中将上述两种叙述形式予以融合，以堂吉诃德游侠的经历为线索展开，既批判了封建贵族的贪婪和荒淫，又突出了堂吉诃德为理想而献身的高尚精神以及百折不挠的坚强意志，也提升了小说的思想品格，在反映现实生活的同时，又避免了流浪汉小说消极悲观的色彩。\n\n综上所述，《堂吉诃德》与骑士传奇的关系既有继承，又有批判和创新，因此，它才能够超越骑士传奇的局限，为叙事文学的发展奠定了新的起点，在西方小说发展史上起到了承前启后的重要作用。","keywords":"批判 借鉴 创新","note":"骑士文学与它所表现的骑士制度和骑士精神毕竟是封建制度的产物，它们会随着其所依附的制度的灭亡而走向终结，最终被新的社会制度和能够代表它精神诉求的文学样式所替代。这符合事物发展的规律。《堂吉诃德》正好反映了骑士文学如何走向衰亡的过程，也给骑士文学，尤其是骑士文学在中世纪的最后一种表现形式-骑士小说以摧枯拉朽般的打击，扮演了骑士文学终结者的角色。"},{"id":"42","stars":"★★★★★","title":"《堂吉诃德》的影响和地位","body":"塞万提斯的《堂吉诃德》为西班牙文学带来了世界性的声誉，是西班牙文艺复兴文学的最高成就，在整个欧洲文艺复兴文学中占有突出的地位。19世纪作家狄更斯、福楼拜和陀思妥耶夫斯基等人称塞万提斯为“现代小说之父”，而当代著名作家博尔赫斯与米兰·昆德拉等都对其代表作《堂吉诃德》推崇备至。塞万提斯不仅以新的小说观为指导创作了《堂吉诃德》这部作品，而且还常常借书中人物表达自己对小说艺术的独特思考，在小说观念和创作方法上都对现代小说产生了影响。\n\n一、打破了真实与虚构的界限，颠覆了传统的文学观念\n\n在《堂吉诃德》第二部中，塞万提斯让作品中的人物谈论《堂吉诃德》第一部出版后的影响、仿作者的可笑，甚至还谈论其中出现的自己，以及塞万提斯本人和他创作的其他作品，将真实与虚构置于一体，形成了一个含义复杂的文本世界，改变了人们对于真实与虚构之间传统的、过于简单化的认识，让人们重新思考了小说的本质。\n\n二、打破了文本创作与文本阅读、批评的界限\n\n《堂吉诃德》将文本创作与文本阅读、批评结合在一起并在文本中表现出来，在彼此之间形成的互文性关系中将文本意义的生成过程延伸到阅读和批评阶段。《堂吉诃德》第一部提到了其伪作续篇，回答了伪作对自己的攻击，并让堂吉诃德和桑丘谈论出现在第一部中的自己，甚至品评创作者的得失，并通过大学生参孙之口赞扬了《堂吉诃德》，既巧妙地驳斥了伪作者对这部作品的诋毁，同时也将文本创作与该文本的阅读、批评结合在一起，建构了其意义得以不断生成的开放性空间。\n\n三、在叙述上具有不确定性\n\n塞万提斯在《堂吉诃德》中引入阿拉伯历史学家作为故事的收集人，又不停插入译者、作者对于这位故事收集人和所收集故事之真实性的猜测，也没有交代他们之间时间上的关系，致使故事原貌、故事的来龙去脉都扑朔迷离，充满很多不确定性的因素。此外，对故事涉及的时间、故事内容以及人物的真实性，小说也采取一种模棱两可的态度。例如，当公爵夫妇询问堂吉诃德关于杜尔西内娅传闻的时候，后者的回答是“没法寻根究底”。而对于堂吉诃德在蒙特西诺斯洞穴中的经历，桑丘不相信，小说的叙述者阿拉伯史学家也无法判定真假。然而，正是这种不确定性，为小说表达更为丰富的内容提供了想象的空间，模糊了文本创作与阅读、批评之间的界限，在虚构中表达了作者对文学真实性的崭新认识。\n\n四、承前启后\n\n为了达到有力地讽刺骑士传奇的目的，作者采用戏拟的方法，借用骑士传奇的形式来设计情节、塑造人物和运用语言，描绘了疯骑士堂吉诃德滑稽荒诞的游侠行径，暴露了骑士传奇的危害性，针砭了时弊。《堂吉诃德》以骑士文学的形式向骑士文学决绝。作品超越骑士传奇的局限，为叙事文学的发展奠定了新的起点，在西方小说发展史上起到了承前启后的重要作用。\n\n五、为欧洲近代现实主义小说奠基\n\n《堂吉诃德》主要通过堂吉诃德主仆的游历，对十六七世纪西班牙的现实社会作了广泛而真实的描写，从而奠立了它作为欧洲近代现实主义小说开山之作的地位。《堂吉诃德》出现之前，在欧洲一些国家确实已经出现了一些长篇小说作品，包括文人创作的田园爱情小说和民间流传的流浪汉小说等，不过那些作品大多取材于历史故事、异国题材或民间传说，更多的是通过想象、夸张或传奇来间接而曲折地影射现实，《堂吉诃德》则对作家本人生活于其中的西班牙现实社会进行了直接而真实的描绘。\n\n跟随着堂吉诃德主仆游侠的足迹，我们能够身临其境地观赏到当时西班牙城镇乡村的风土人情，通过小说所描绘的来自社会各阶层的七百多个人物形象，我们能够清晰地看到西班牙当时尖锐的阶级矛盾和严峻的社会危机。\n\n总之，塞万提斯的小说观念和创作实践，反映出其对小说本质、真实与虚构的关系、文本与读者的关系、叙述本身的多义性等都有崭新的认识，为现代小说的出现奠定了新的发展起点。","keywords":"真实与虚构的界限 文本创作与文本阅读批评的界限 叙述的不确定性 承前启后 近代现实主义小说奠基","note":"文学评论家称《堂吉诃德》是西方文学史上的第一部现代小说，是世界文学的瑰宝之一，可见这部小说的重要性。《堂吉诃德》的影响，也是从它“西方文学史上的第一部现代小说”这个特征去展开分析的，客观上，它起到了承前启后，为近代现实主义小说奠基的作用。此外，关于这部小说的现代性，也体现在其艺术特征上，如多元叙述技巧和元小说行，前已有所介绍，此处不再赘述。"},{"id":"43","stars":"★★★","title":"流浪汉小说的特点以及对后世的影响","body":"一、特点\n\n流浪汉小说是16世纪产生于西班牙的一种欧洲近代小说，是城市兴起和经济衰退的产物。其基本特征如下：\n\n（一）从思想倾向上说，流浪汉小说的主人公大多为无业游民，作品在描写他们不幸命运的同时，也描写了主人公为生活所逼迫而进行的欺骗、偷窃和各种恶作剧，表现了不幸者的消极反抗情绪。\n\n（二）从取材方面看，流浪汉小说基本上取材于现实生活，特别是城市平民生活。它反映了下层人民的生活，用下层人民的眼光去观察和讽刺一些社会现象。\n\n（三）从结构上看，流浪汉小说以主人公活动为线索，按主人公活动的足迹，通过主人公的亲身经历和所见所闻来安排各种生活场景。\n\n（四）流浪汉小说所反映的正是当时西班牙骑士传奇作家所不屑于反映的生活，具有一定的现实主义成分。但是，因为流浪汉小说常常采用玩世不恭或同流合污的态度对待种种不合理的社会现象，所以其思想具有一定的消极影响。\n\n西班牙16世纪最著名的流浪汉小说是无名氏的《小癞子》。作品以第一人称的叙事方法，描述了一个名叫拉撒路的穷孩子谋生的复杂经历。小说通过小癞子的活动经历，描绘了各阶层的人物，揭示了社会生活的各个方面。\n\n二、影响\n\n流浪汉小说对欧洲长篇小说的最大影响反映在结构艺术方面。\n\n（1）流浪汉小说通过第一人称自述的方式，描写主人公流浪汉在社会底层漂泊的过程。小说常常以人物的流浪为线索，串联起众多的生活场景，在描写人物经历的过程中展示广阔的社会图景。\n\n（2）流浪汉小说的结构模式影响了此后的欧美小说的发展，并产生了两个分支：一为空间意义上的漂泊或旅行，一为精神或灵魂的探索。前一种继承流浪汉小说穿插缀段式结构，以主人公的游历来串联起不同的生活场景与故事，如塞万提斯的《堂吉诃德》、菲尔丁的《汤姆·琼斯》、拜伦的《唐璜》等，既展示了人物的性格，也真实地反映了广阔的社会生活画面，揭露了社会的黑暗；后一种将空间游历置换成精神成长，以主人公对至善或真理的追求为主线，连缀其成长过程中的经历，如斯丹达尔的《红与黑》、托尔斯泰的《复活》《安娜·卡列尼娜》等，既展示了人物灵魂成长的历史，表达了人道主义思想，同时也在揭示社会环境与人物性格的复杂关系中，取得了概括性地反映社会风貌的效果。","keywords":"城市兴起和经济衰退的产物 思想倾向 消极反抗 取材 城市平民生活 结构 主人公活动为线索 玩世不恭或同流合污 影响 结构艺术 第一人称自述 空间意义上的漂泊 精神意义上的探索","note":"16世纪中叶，西班牙的政治、经济和社会道德日趋衰微，超尘绝俗的骑士文学和田园传奇在当时的文坛上泛滥成灾。在这种特定的历史背景和文化氛围中，流浪汉小说如异峰突起，它以一种崭新的叙事结构形式，展现出五光十色的现实生活画卷，尤其是社会底层人物的喜怒哀乐，不仅在当时的作家和读者心海里刮起了一阵阵奇妙的文学旋风，而且给后世文学带来了深远的影响。“流浪汉小说”常以名词解释的形式出现，大家要注意积累。"},{"id":"44","stars":"★★★","title":"试分析莎士比亚十四行诗的创作特征（24北京大学）","body":"莎士比亚154首十四行诗大约创作于1592-1598年之间，出版于1609年，是文艺复兴时期英国大量的十四行诗集里最好的作品。莎士比亚的十四行诗，主要具备如下特征：\n\n一、主题丰富\n\n莎士比亚认为理想的爱情和友谊是真善美的统一；诗人同时认为，诗歌犹如子嗣，也能让美爱绵延不绝。莎士比亚极力颂扬友谊，通过歌颂友谊的伟大力量与内在的永恒品质表达诗人对生命永恒的向往和对美的永远的追求。可以说，诗人对友谊的重视几乎达到痴迷程度。在他看来，友谊可以治疗一切伤痛，甚至能够战胜一切逆境。而在爱情题材的处理上，莎士比亚的十四行诗摆脱了从彼特拉克到锡德尼再到斯宾塞一路十四行诗表现典雅爱情的传统，描写了一种奇异、复杂而痛苦的情爱。忠贞永恒的爱情是文艺复兴时期乃至整个人类文明史上所赞颂与追求的目标。莎士比亚在诗中尽情表达了这一纯真思想。\n\n除了爱情，诗歌还涉及友谊、时间、生命、死亡、艺术等多个主题。如关于时间的主题，诗人常常感叹时间的流逝和生命的短暂，如“Time dothtransfix the flourish set on youth（时间会刺破青春的华美精致）”，表达了对时光易逝的感慨以及对永恒的渴望。这些主题相互交织，共同构成了一个丰富多彩的思想世界，反映了诗人对人生、社会和人性的深刻思考。\n\n二、莎士比亚体\n\n（一）莎士比亚体的结构特征：在诗体形式方面，莎士比亚将彼特拉克体（又称意大利体）4、4、3、3的格式，改变为4、4、4、2的结构，他的十四行诗将十四个诗行分为两部分，第一部分为三个四行，第二部分为两行，每行十个音节，韵脚为abab,cdcd,efef,gg。以4行内容为一组四行诗，最后2行为一组对句。后人称之为莎士比亚体或英国体十四行诗。\n\n（二）五步抑扬格的韵律控制：每行严格遵循五步抑扬格（iambic pentameter)，通过轻重音交替营造自然流畅的节奏感。例如第116首“Let me not to the marriage of true minds”中，音节与重音的规律分布强化了爱情的庄重与坚定。\n\n三、词汇丰富，修辞恰当，意象生动\n\n莎士比亚拓展了十四行诗的表现范围，感情真挚而又节制，语汇丰富，比喻新奇，意象生动，有很强的节奏感。\n\n（一）在语言上，莎士比亚融合了古罗马语、法语和中古英语的精华，吸收了民间土语的营养，开一代风气之先，用丰富的语言手段，创作出许许多多既优美而又耐人寻味的诗句。\n\n（二）在修辞手法上，莎士比亚巧用双关语，运用矛盾修辞法和新奇的比喻，将诗歌之中的情感升华。\n\n（三）在意象选用上，莎士比亚广泛使用来自自然界的意象和来自日常生活和社会习俗的意象，既具有鲜明的时代特征，又包蕴着深刻的哲思。","keywords":"主题丰富 莎士比亚体 结构特征 五步抑扬格 词汇丰富 修辞恰当 意象生动","note":"莎士比亚十四行诗通过自然隐喻、矛盾修辞与多声部叙事，实现抒情性与思想性的统一。其创作既遵循传统格律，又以主题的复杂性和情感的矛盾性突破彼时诗歌的浪漫化窠臼，成为文艺复兴时期人文精神与艺术创新的双重典范。"},{"id":"45","stars":"★★","title":"简述莎士比亚的戏剧创作分期和特征","body":"威廉·莎士比亚，文艺复兴时期最伟大的诗人和戏剧家，一生著作颇丰，以戏剧为主。根据社会及其思想的发展变化，可将其戏剧创作分为三个时期：\n\n一、第一时期：1590年-1600年\n\n这一时期正值伊丽莎白统治盛年，英国一派繁盛兴旺景象，莎士比亚的创作基调也是乐观明朗的，以写作历史剧、喜剧为主，有9部历史剧、10部喜剧和2部悲剧。\n\n（一）历史剧\n\n9部历史剧中除《约翰王》是写13世纪初英国历史外，其他8部是内容相衔接的两个4部曲：《亨利六世》上、中、下篇与《查理三世》：《查理二世》《亨利四世》（被称为最成功的历史剧）上、下篇与《亨利五世》。\n\n这些历史剧概括了英国历史上百余年间的动乱，塑造了一系列正、反面君主形象，反映了莎士比亚反对封建割据，拥护＝夬集权，谴责暴君暴政，要求开明君主进行自上而下改革，建立和谐社会关系的人文主义政治与道德理想。\n\n（二）喜剧\n\n10部嘉剧《错误的喜剧》《驯悍记》《维洛那二绅士》《爱的徒劳》《仲夏夜之梦》《威尼斯商人》《温莎的风流娘儿们》《无事生非》《皆大欢喜》和《第十二夜》大都以爱情、友谊、婚姻为主题，主人公多是一些具有人文主义智慧与美的青年男女，通过他们争取自由、幸福的斗争，歌颂进步、美好的新人新风，同时也温和地揭露和嘲讽旧事物的衰朽和丑恶，如禁欲主义的虚矫、清教徒的伪善和高利贷者的贪鄙等。（三）悲剧\n\n莎士比亚这一时期戏剧创作的基本情调是乐观、明朗的，充满着以人文主义理想解决社会矛盾的信心，以致写在这一时的悲剧《罗密欧与朱丽叶》中，也洋溢着喜剧气氛。尽管主人公殉情而死，但爱的理想战胜死亡，换来了封建世仇的和解。午多学者和评论家从这个意义上称这出戏是乐观主义的悲剧，也就是人们惯说的悲喜剧。\n\n二、第二时期：1601年-1607年\n\n这一时期的英国社会矛盾表面化、尖锐化，莎士比亚越来越清楚地意识到人文主义理想与黑暗的社会现实之间的深刻矛百的不可调和性。创作中先前那种轻松愉快的色彩被沉郁、悲怆、愤激的情调所代替，揭露批判的力量加强。这一时期莎士北亚的悲剧主要写现实与理想的矛盾及理想的破灭，有人物与人物之间的外部冲突，也有人物内心两种力量的冲突。这一时同是莎士比亚创作的高峰期，以悲剧为主，写了3部罗马剧、5部悲剧和3部“阴暗喜剧”或“问题剧”。\n\n（一）罗马剧\n\n《尤利乌斯·凯撒》《安东尼和克莉奥佩特拉》和《科里奥拉努斯》是取材于普卢塔克《希腊罗马英雄传》的历史剧。\n\n（二）悲剧\n\n四大悲剧《哈姆雷特》《奥赛罗》《李尔王》《麦克白》和悲剧《雅典的泰门》标志着作者对时代、人生的深入思考。\n\n作者着力塑造了这样一些新时代的悲剧主人公：他们从中世纪的禁锢和蒙昧中醒来，在近代黎明照耀下，雄心勃勃地想要发展或完善自己，但又不能克服时代和自身的局限，终于在同环境和内心敌对势力的力量悬殊斗争中，遭到不可避免的失\n\n败和牺牲。\n\n（1）哈姆雷特为报父仇而发现“整个时代脱榫”了，决定担起“重整乾坤”的责任，结果是空怀大志，无力回天。\n\n（2）奥赛罗正直淳朴，相信人而又嫉恶如仇，在奸人摆布下杀妻自戕，为追求至善至美反遭恶报。\n\n（3）李尔王在权势给他带来的尊荣 中迷失本性，丧失理智，幻想以让权分国来证明自己不当国王而做一个普通人，也能同样或更加伟大，因而经受了一番痛苦的磨难。\n\n（4）麦克白本是有功的英雄，性格中有善和美的一面，只因王位的诱惑和野心的驱使，沦为罪人。\n\n这些人物的悲剧，深刻地揭示了在资本原始积累时期已开始出现的种种社会罪恶和资产阶级的利己主义，表现了人文主义理想与残酷现实之间矛盾的不可调和，具有高度的概括意义。\n\n（三）“问题剧”或“阴暗的喜剧”\n\n由于这一时期剧作思想深度和现实主义深度的增强，使《特洛伊罗斯与克瑞西达》《终成眷属》和《一报还一报》等“喜剧”也显露出阴暗的一面，笼罩着背信弃义、尔虞我诈的罪恶阴影，因而被称为“问题剧”或“阴暗喜剧”。\n\n三、第三时期：1608年-1613年\n\n这一时期，英国的各种社会矛盾更加尖锐，莎士比亚从现实中又找不到解决矛盾的出路，便转向幻想的世界，梦想通过超自然的力量，用仁爱、宽恕的精神来调和矛盾，实现理想。他以神话般的传奇方式，描绘人世间的悲欢离合，用以揭露现实的阴暗冷酷，同时又以仁爱、宽恕和谅解的精神，对社会矛盾的解决进行不懈的探索。这一时期莎士比亚作品基调转向清丽、俊秀，呈现出高妙远逸、圣洁至纯的意味。\n\n这一时期莎士比亚的创作主要是倾向于妥协和幻想的悲喜剧或传奇剧。主要作品是4部悲喜剧或传奇剧《泰尔亲王里克里斯》《辛白林》《冬天的故事》《暴风雨》。这些作品多写失散、团聚、诬陷、昭雪。尽管仍然坚持人文主义理想，对黑暗现实有所揭露，但矛盾的解决主要靠魔法、幻想、机缘巧合和偶然事件，并以宣扬宽恕、容忍、妥协、和解告终。","keywords":"第一时期 乐观明朗 历史剧 喜剧 第二时期 沉郁悲怆愤激 悲剧 第三时期 高妙远逸 圣洁至纯 悲喜剧或传奇剧","note":"莎士比亚的不同创作阶段主要是源于时代背景的变换，因此识记这道题时，要参考书上对不同时期背景的介绍，以加深对莎士比亚创作风格转变原因的理解。此外，《罗密欧与朱丽叶》《暴风雨》等作品可能会以名词解释的形式出现，大家要注意积累。"},{"id":"46","stars":"★★★","title":"莎士比亚喜剧的创作特征（25杭州师范大学）","body":"喜剧在莎士比亚戏剧创作中占有相当的分量，共10部。这些喜剧的共同风格是浪漫与抒情，所以被称为“浪漫喜剧”或“抒情喜剧”。这些喜剧的创作特征如下：\n\n一、肯定性、歌颂性的主题\n\n莎士比亚喜剧是歌颂式喜剧，他热情肯定生活中的新生事物，赞美人的力量和价值，情爱和友爱，融会成了莎士比亚喜剧的主旋律。这是时代赋予的崇高主题，莎士比亚艺术地将它表现了出来。同时，对于生活中的阴暗面，莎士比亚也进行了揭露和嘲讽，但是他的讽刺带有温和性，而且在作品中处于次要地位。\n\n二、人文主义的表达\n\n《爱的徒劳》《仲夏夜之梦》《威尼斯商人》《温莎的风流娘儿们》《无事生非》《皆大欢喜》和《第十二夜》大都以爱情、友谊、婚姻为主题，主人公多是一些具有人文主义智慧与美德的青年男女，通过他们争取自由，歌颂进步、美好的新人新风，充满着以人文主义理想解决社会矛盾的信心，同时也温和地揭露和嘲讽旧事物的衰朽和丑恶，如禁欲主义的虚矫、清教徒的伪善和高利贷者的贪鄙等。\n\n三、女性形象优美绝伦\n\n莎士比亚喜剧中的女性形象刻画生动，她们天生丽质，感情纯真，心地善良，才思敏捷，热情活跃，意志坚强。如聪明机智、幽默风趣的鲍西娅，能言善辩、利嘴如刀的贝特丽丝，活泼开朗、调皮狡黠的罗瑟琳，善良无私、坚毅忍耐的薇奥拉，还有感情真挚、追求执着的奥丽维娅，等等。在她们身上，“天赋的灵奇”和“绝色的仙姿”，达到了完美和谐的统一。因此，人们步入莎士比亚喜剧的女性画廊，顿觉春风扑面，彩蝶绕身，如行百花丛中。\n\n四、抒情与写景有机结合\n\n莎士比亚笔下的喜剧场面充满诗情画意、欢声笑语和轻歌曼舞，自然景象的美好宜人是与人物的美好情愫融为一体的。\n\n正是在贝尔蒙特柔和的月光下，在仲夏之夜典雅的森林里，在原始粗犷的亚登森林中，人物的感情才显得格外纯真美好。\n\n五、喜剧语言的运用\n\n莎士比亚的喜剧语言，形象生动，富于感情色彩，充满着奇思妙想和机智风趣，是诗意和机敏相结合的产物，因而洋溢出了绮丽、诙谐的特异光彩。\n\n六、情节的生动性与丰富性\n\n莎士比亚的喜剧作品情节丰富生动，往往有多条线索同时发展、交叉进行，架构往往采用一见钟情、好事多磨、终成眷属三部曲的格式。\n\n七、幽默与讽刺\n\n莎士比亚的喜剧中还包含了幽默、诙谐、滑稽、俏皮的语言，即使是对失恋的描写也表现出富有喜剧性味道的同情，带给人们的是“真正的哲学家的笑”。","keywords":"歌颂性的主题 人文主义的表达 女性形象优美绝伦 抒情与写景有机结合 喜剧语言 情节的生动性与丰富性幽默与讽刺","note":"莎士比亚的喜剧大同小异，都是以爱情为题材，呈现出浪漫主义的整体风格，因此上述几点也可以回答“莎士比亚喜剧的浪漫风格成因”。"},{"id":"47","stars":"★★★","title":"莎士比亚悲剧的创作特征","body":"无论在思想上还是在艺术上，莎士比亚悲剧都体现出了作者鲜明的创作个性。他的悲剧，广泛、深刻地揭露了社会的阴暗面，对人性作了全面、透彻的剖析，深刻揭示了权势和金钱是导致人性普遍堕落的根源，所以他热切呼唤人性的复归。他的悲剧，还闪耀着强烈的理想光芒，表现理想的崇高性和追求理想的执着性，表现正义力量的不可压抑和顽强抗争。具体来说，主要包括以下内容：\n\n一、艺术风格：悲壮、悲喜交融\n\n他专写“高贵”的英雄在残酷的现实面前可悲的毁灭。英雄的高贵性，不仅体现在他们帝王将相等统治阶级的出身上，而且体现在他们的品性上。这些英雄大都具有正面的特质、伟大的性格，是社会中出类拔萃的人物。然而，在纷繁复杂的人生舞台上，他们却从显赫的高位上跌落下来，甚至毁灭了自己的精神和肉体。他们的痛苦与灾难，异乎寻常。他们的悲剧，既是个人的，又在很大
