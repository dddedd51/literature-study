马克·吐温小说创作的三个发展阶段我们可以看出，隐藏在马克·吐温作品表面幽默之下的，是尖锐的批判与讽刺。马克·吐温实质上是一个深刻的社会批判家，他对正义的坚持，对民族歧视、资本主义制度、侵略扩张等的抨击，无不体现了这一点。"},{"id":"195","stars":"★★★","title":"谈谈马克·吐温的幽默风格","body":"马克·吐温是19世纪后期美国的杰出作家。他的作品揭示了美国资本主义社会民主自由的黑暗面，暴露出其内在的拜金主义、种族主义和帝国主义的实质。在文学史上，马克·吐温主要是作为一个幽默讽刺作家而闻名，其作品的幽默风格有如下特点：\n\n一、幽默中蕴含讽刺\n\n虽然早期马克·吐温的创作以轻松愉悦为主，但他对当时投机取巧的风气、迷信落后的习俗、小市民的庸俗习气都作了轻淡的嘲笑和批判。随着对美国社会生活的了解，马克·吐温思想不断深化，中期和后期作品的讽刺更为尖锐辛辣。\n\n二、在对比中显露幽默\n\n马克·吐温善于利用人物言行之间的对比来表现出幽默的风格。例如在《王子与贫儿》中，王子爱德华在王宫外四处流浪、受尽欺凌和嘲讽，与贫儿汤姆在王宫里尽享荣华富贵形成鲜明对比。既令人感到可笑，同时又引起读者深思。\n\n三、漫画式的夸张\n\n马克·吐温的幽默包含着滑稽诙谐的笔调，常常运用漫画式的夸张手法，既揭露现实，也富有哲理意味，具有强烈的艺术感染力。例如在《我怎样编辑农业报》中，成为农业报纸编辑的主人公其实对农业一窍不通，他的文章充满了低级的常识性错误，让人忍俊不禁。马克·吐温正是通过这种夸张幽默的描写，使读者在会心一笑的同时，产生一些深深的思考。\n\n四、反逻辑的情节\n\n马克·吐温善于通过巧妙设置故事情节而达到幽默讽刺的效果。小说的故事常常违反生活逻辑，但却真实地反映了生活的本质，从而达到一种幽默讽刺的效果。例如《百万英镑》中流浪汉被作者赋予了百万富翁的矛盾身份，真真实实地摧毁了人们的认知以及思维。\n\n五、以天真单纯的老实人为主人公\n\n马克·吐温常以天真单纯的老实人作为作品的主人公，单纯的思想跟复杂的现实之间的落差，常常是幽默产生的关键，从而便于揭示幻想与现实之间的矛盾。如《竞选州长》中，在竞选州长时，竞争对手把“我”一个正人君子塑造成了一个自私自利的政治流氓。这种“颠倒是非黑白”的描写使我们更深刻地认识到了资产阶级两党政治的欺骗与虚伪。\n\n马克·吐温小说语言妙语连珠、涉笔成趣。他的语言机智、风趣，具有密西西比河地区浓郁的口语特征，包含有一些生活笑话、喜剧情节等，妙趣横生，韵味无穷。","keywords":"讽刺 对比 夸张 反逻辑 老实人 语言风趣","note":"马克·吐温的大多数作品都通过一些生活笑话、喜剧情节、睿智的品论而使情调诙谐滑稽。甚至一些实际上荒诞不经的故事，读起来也非常有趣味。而他的幽默并非停留在表面，他以一种艺术的风格强烈抨击了社会不公平现象，讽刺了资本主义的腐败，显示出巨大的思想内涵。"},{"id":"196","stars":"★★★","title":"马克·吐温和欧·亨利短篇小说的幽默风格比较","body":"一、相似之处\n\n（一）幽默中蕴藏讽刺，直指社会黑暗面\n\n马克·吐温的创作具有鲜明的美国民族特色，以幽默讽刺见长，他以辛辣的笔触和嬉笑怒骂的讽刺手法揭露了资产阶级社会的种种弊端，被人们称为“美国社会的镜子”。\n\n欧·亨利小说也同样如此。他对小市民生活比较熟悉，小说也多以此类人物为主人公。其中以描写纽约曼哈顿市民生活的作品最著名，有“曼哈顿的桂冠诗人”之称。他擅长利用精心安排的情节和具体的行文语言来揭露社会黑暗面，达到幽默讽刺的效果。\n\n（二）喜中有悲，悲喜融合\n\n传统的幽默体现了一种浓厚的喜剧氛围。而马克·吐温和欧·亨利都打破了这种传统的喜剧方式，他们从日常生活中发掘社会制度的悲剧所产生的喜剧效果，在喜剧中融入悲剧性的成分，并将两者进行有机地结合，达到喜中有悲，悲喜交加的效果。\n\n二、不同之处\n\n（一）叙事角度各有特色\n\n马克·吐温采用内视角，真实直观。马克·吐温的小说主要采用内视角来叙事，即用第一人称来叙述整个故事。他以主人公的经历为线，把他的所见所闻所感串成一篇文章。小说中的“我”要不就是故事的主角，要不就是一个故事的参与者、目击者。用这种方式来叙述可以大大缩短与读者的距离，增加读者感受的真实性。\n\n欧·亨利的小说大都采用全知视角叙述，他常置身于故事以外，来安排整个小说的人物命运以及故事结局，把一幅幅真实的社会生活画面客观地展现在读者眼前，作者的主观情绪则充分内敛，达到一种隽永含蓄，意味深长的效果。\n\n（二）悲喜侧重各不同\n\n马克·吐温的幽默更侧重喜剧元素。马克·吐温被称为“喜剧作家”“幽默家”。他的作品习惯用轻松愉快的喜剧来对资本主义社会进行批判和讽刺，尤其是他的早期作品记载了边疆地带狂放不羁的乐观主义与幽默。\n\n欧·亨利的幽默偏向灰色幽默。作为美国著名的批判现实主义大师，欧·亨利关注处于社会底层的“小人物”，他的近三百篇的短篇小说，大部分都反映了下层人民令人心酸的生活，在他的作品中我们可以感受到他对社会底层人民深切的同情和关怀。主人公的人生往往比较沉郁。他用幽默掩盖了其中的眼泪，但是读者还是能够感受到那种沉重感和压抑。","keywords":"幽默讽刺 悲喜融合 内视角 全知视角 悲喜侧重 轻松愉快 灰色幽默","note":"马克·吐温和欧·亨利都是19世纪后期美国极具影响力的文学大师。他们的幽默风格虽各有差异。但他们对社会和人性进行的深刻剖析，是共同留给读者的思想宝藏。除幽默比较外，两位作家在写作背景、主题、手法上也各有不同，相关内容可拓展阅读张秋爽《从作家的写作艺术分析影视形象-马克·吐温与欧·亨利的艺术比较》，资料可在李凡文学正版群领取。"},{"id":"197","stars":"★★★","title":"马克·吐温《哈克贝利·芬历险记》的思想艺术特色","body":"《哈克贝利·芬历险记》被认为是马克·吐温最杰出的作品，作为《汤姆·索亚历险记》的姊妹篇，这是一部反对种族歧视，主张民主自由，同时又富于童趣的杰作。其思想艺术特色如下：\n\n一、思想内涵\n\n小说的中心主题是反对种族压迫。虽然蓄奴制在南北战争以后从形式上废除了，但实际上种族压迫的情况依然严重。马克·吐温在小说里再现了蓄奴制盛行的年代，使人们回顾那些残忍的岁月，对于仍然存在种族压迫的现实是有很大意义的。在《哈克贝利·芬历险记》里，作者从人道主义出发，以饱蘸同情之笔，写出了处于奴隶地位的黑人们的悲惨遭遇，严厉地谴责\n\n了种族压迫的可耻行径。\n\n二、艺术特色\n\n（一）在这部作品中，马克·吐温把现实主义的精细镂刻与浪漫主义的热烈抒情结合在一起，把人物心理的真实描写与幽默风趣的夸张融为一体。在描写密西西比河岸一带城乡的贫困景象与丑恶现象时，马克·吐温采用的是现实主义的手法；在描写哈克和吉姆对自由向往的心境与密西西比河上的优美风景时，则采用了浓郁的诗情画意式的抒情笔调。在刻画哈克与吉姆的形象时，马克·吐温细致地展现了他们的内心活动；而在描写“国王”和“公爵”这两个骗子时，则采用极度夸张的手法，诙谐幽默，于漫画化的描写中见出真实。\n\n（二）小说采用第一人称叙述手法。哈克作为一个十二三岁的少年，以他生动活泼而又纯真朴实的口吻，天真无邪的孩子的视角，来叙述他对现实的判断、对生活的理解，使小说更显真实、生动，又不失幽默和诙谐。\n\n（三）情节生动曲折，结构散而不乱。在《哈克贝利·芬历险记》中，作者以感情来支配整个叙事，密西西比河在小说中担当着一种耐人寻味的角色。它是小说的磁场，它像一根从北至南的红线，将一个个故事串起来，使故事与故事互相衔接，环环相扣，从而使得整部小说在结构上散而不乱、杂而有序，克服了流浪汉小说结构松散、缺乏中心情节的弊端。\n\n（四）人物形象鲜明生动。作者将资产阶级凶狠贪婪的本性暴露无遗，与哈克的纯真善良形成明显对比，成功塑造出了一批反映当时美国社会的典型。\n\n（五）小说中所使用的美国南方方言、黑人俚语，被称为“英语的新发现”，流畅、准确、口语化的语体，对美国以后的小说创作产生了重大的影响。","keywords":"反对种族压迫 现实主义与浪漫主义 真实与夸张 第一人称叙述手法 结构散而不乱 形象鲜明生动 流畅准确☐语化","note":"马克·吐温是美国19世纪杰出的现实主义作家，也是伟大的儿童文学作家。这些作品虽然以儿童生活为主要内容，但也描绘了广泛的社会生活图景，表达了民主自由的主题，批判了庸俗做作的社会习气、僵化的教育制度和教育体系、虚假的民主制度，以及黑人遭受的不公平对待，具有极大的思想价值。《哈克贝利·芬历险记》作为作者创作成熟期的代表作，无论在思想内涵抑或艺术成就方面，都比其他作品更高一筹。因此当遇到类似“分析马克·吐温儿童小说的特点”这种问题时，大家也可以结合上述内容作答。"},{"id":"198","stars":"★★★","title":"简析《哈克贝利·芬历险记》中哈克和吉姆的人物形象","body":"《哈克贝利·芬历险记》是马克·吐温的代表作。这是一部反对种族歧视，主张种族平等，又富于童趣的杰作。小说中鲜明地塑造了两个儿童形象-哈克和吉姆。\n\n一、哈克\n\n（一）小说的中心人物哈克，是一个年仅十二三岁的孩子，他天真活泼，又聪明、富有冒险精神。与《汤姆·索亚历险记》中喜欢冒险的顽童哈克不同，《哈克贝利·芬历险记》中的哈克已经成长为了一个有头脑、质朴、有正义感、善良而又勇敢的少年。他不仅自己渴望自由，而且还积极帮助吉姆获得自由。\n\n（二）他虽以真诚平等的态度对待吉姆，但他毕竟是生活在蓄奴制的社会中，内心也很矛盾。不过当想到吉姆对自己真诚无私的友谊，他下定决心决不出卖自己的好友吉姆。用马克·吐温的话来说，这是“健全的心灵与畸形的意识发生了冲突，畸形的意识吃了败仗”。所谓“畸形的意识”就是指孩子被当时世俗所污染的种族歧视思想，而“健全的心灵”则是指作家所追求的没有种族歧视、人人平等的民主理想。马克·吐温笔下的哈克也正是这种朴素善良、胸襟坦白、具有民主精神的一个美国下层人民的典型。\n\n二、吉姆\n\n（一）向往自由的角斗士。他是一个有血有肉、富有情感的人，勇于冲破种族樊篱的自由勇士。他虽身为奴隶，却没有卑躬屈膝的奴性。为了摆脱奴隶的命运，他勇敢地从主人家逃走。他不仅向往自由，百折不挠地追求自由，而且具有丰富的精神世界和舍己为人的优秀品质。他朴素憨厚的性格和与哈克的真挚友谊，令人感动。\n\n（二）吉姆是哈克成长道路上心灵的救赎者，是唤醒人们反蓄奴制意识的精神催化剂。在哈克的思想转变过程中，吉姆不仅仅是陪衬物，而且起到了重要作用。吉姆不断地帮助哈克，劝告他、教诲他，还教会他情感和忠诚，是哈克成长道路上的引路人。两人之间这种打破界限的限制、突破社会地位的友情正是整部小说的核心思想。马克·吐温给吉姆的定位并不是一个英雄，但是吉姆的形象却表现出了英雄主义。\n\n全是因为种族歧视制度所造成的恶果。马克·吐温站在民主主义的立场上，塑造了这个精神高尚的黑人典型，说明了他反对种族歧视的进步倾向。","keywords":"哈克 善良而又勇敢 矛盾 畸形的意识 健全的心灵 吉姆 向往自由 哈克成长道路上心灵的救赎者 无知迷信","note":""},{"id":"199","stars":"★★★","title":"马克·吐温《哈克贝利·芬历险记》密西西比河在小说中的文学功能（26南昌大学）","body":"《哈克贝利·芬历险记》是马克·吐温最重要的一部小说作品，在这部作品中，密西西比河这一意象贯穿全篇，在形式和内容上都有着十分重要的作用，具体表现在以下方面：\n\n一、贯穿全文，使小说结构完整\n\n在小说结构上，马克·吐温借鉴了传统流浪汉小说的结构模式，但为了克服传统流浪汉小说结构松散的缺点，马克·吐温使用了密西西比河这一意象作为全文的线索。它是小说的磁场，把作品中的人物紧紧地吸引到大河上，一连串的冒险故事也集中发生在河上或河岸，它像一根从北至南的红线，将一个个故事串起来，使故事与故事互相衔接，环环相扣，从而使得整部小说在结构上散而不乱，杂而有序，克服了流浪汉小说结构松散、缺乏中心情节的弊端。\n\n二、象征着作者内心深处的理想美国，表达了作者对于理想社会的憧憬\n\n大河是一种意味深长的象征，它象征作者内心深处的理想美国。在马克·吐温笔下，美国不再是一个民主和幸福的国家：对于正直而善良的哈克来说，河岸上到处充满残暴和种族歧视，是一个陌生而冷漠的世界，只有那漂浮在密西西比河上的木筏才是唯一自由而光明的地方。每当哈克和吉姆在密西西比河岸上受到挫折或不顺心时，他们总是回到河上来，河中的木筏成了哈克和吉姆甜美的家、心灵的栖息地。他们一踏上木筏，就仿佛跨进了自由的天地。很显然，密西西比河上的“自由王国”是作者一生为之奋斗的理想境界。马克·吐温通过“河上”与“岸上”的鲜明对照，表达了他对那种不分肤色、不分种族、人人平等、自由的理想社会的憧憬。\n\n三、象征着自由的虚无缥缈，表达了作者对于社会现实的批判\n\n从小说文本来看，密西西比河的形象除了象征自由之外，同时也象征了自由的虚无缥缈，因而哈克和吉姆不可能真正实实在在地找到。这样说，有两个依据。一是小说中描写了密西西比河上的重重危险。马克·吐温并没有把他笔下的大自然过分浪漫化，密西西比河上的自然环境使哈克和吉姆的航行险象环生。二是哈克和吉姆在密西西比河上井没有找到他们向往的可以使黑奴获得自由的“卡罗镇”。由此，马克·吐温对社会现实和现代“文明”发出了批评和抗议。\n\n综上所述，密西西比和这一意象不但使全文更加紧凑，更蕴含着作者对于理想社会的憧憬和对当下社会现实的批判，具有十分重要的作用。","keywords":"结构完整 象征理想美国 对于理想社会的憧憬 象征虚无缥缈 对于社会现实的批判","note":"所谓文学功能，一般要从两个方面去考虑，一个是形式上的，一个是内容上的。在形式上，密西西比河这一意象正如同其在现实中的作用一样，串联起了一切；在内容上，这一意象主要是象征，通过象征去表现作者的思想。相关内容可以参考池青《《哈克贝利·费恩历险记＞中“河”的双重寓意》。"},{"id":"200","stars":"★★★","title":"结合作品说明如何理解“社会问题剧”","body":"社会问题剧是易卜生独创的一种戏剧类型，以尖锐地提出现实生活中人们所关心的社会问题来进行分析讨论而著称。这些剧本以日常生活为题材，涉及当时的政治、宗教、法律、道德、家庭、婚姻、妇女等一系列社会问题，矛盾尖锐，文笔犀利，具有较强的揭露批判精神。虽然剧本井没有最终指出答案，但能够启发观众思考和引起“论争”，从而引导人们起而改革社会弊端，在社会历史的进程中起着进步意义。易卜生的社会问题剧可分为两类：一类为家庭问题剧，主要是讨论妇女解放问题，另一类为政治问题剧，集中揭露资产阶级政治黑幕。前者如《玩偶之家》《海上夫人》《群鬼》等，后者如《社会支柱》《人民公敌》《青年同盟》等。这些社会问题剧有如下特点：\n\n一、鲜明的现实主义精神\n\n在19世纪中叶以后，在无病呻吟的“巧凑剧”充斥欧洲戏剧舞台的时候，易卜生的社会问题剧，以其丰富的社会内容和高度的艺术技巧，引发了一场戏剧史上重振现实主义的革命。易卜生的社会问题剧，取材于挪威现实社会，反映出西方世\n\n界中人同社会环境的对立，并通过这种对抗性的矛盾冲突，反映社会弊病，揭露重大的社会问题。如开创社会问题剧先河的《青年同盟》，直接表现了自由主义政客和投机分子的嘴脸，折射了挪威社会政治制度的丑恶。如1877年发表的《社会支柱》，剧中主人公博尼克，据说是以格利姆达城的奠基人为原型的。1879年发表《玩偶之家》，女主人公娜拉也有生活原型。\n\n二、独特的艺术结构\n\n在社会问题剧中，易卜生跳出了自己早期创作浪漫主义历史剧的艺术准则，建立在现实主义风格基础上，大胆创新，通过广大群众喜闻乐见的形式，以最简约的剧情把社会问题和舞台艺术巧妙地糅合起来，融为一体，形成了社会问题剧独特的艺术结构，为现代戏剧发展注入了许多具有先导意义的艺术元素。其结构艺术的主要成就表现为娴熟地使用“追溯法”。\n\n所谓追溯法，就是戏剧某些重要的情节在幕前已经发生，幕后的戏只是幕前情节发展的后果。“追溯法”使戏剧效果更直接、更深刻，同时，使结构更集中、紧凑简练而又完整。如《玩偶之家》把冒名借债以及与此有关的事件进程作为往事处理，而从这件往事引起的危机写起，使剧情线索比较单纯，以集中笔力展示主人公面对危机时的行为表现和心理历程。正是采用了“追溯法”，易卜生可以从容地集中笔力刻画人物性格，避免了剧情拖沓、冗长，使结构紧凑严谨。\n\n三、善于创新的表现手法\n\n易卜生引入象征等新的表现手段，尤其是创造性地把“讨论”带入戏剧，引导观众关注戏剧反映的问题，关注人物命运并进而跟随人物行动进程和心理活动进程，全面深刻地领会那些社会问题。他将戏剧和讨论合而为一，观众和剧中人合而为一，达到了思想内容和戏剧性情节的有机统一。这些“讨论”，既没有脱离人物性格发展的逻辑，又不是剧作家为讨论而讨论强加上去的。“讨论”的场面实际是男女主人公性格冲突的再现。\n\n四、突破传统的心理刻画\n\n易卜生社会问题剧，坚定地继承现实主义传统，却又勇于创新，在采取多种表现手法展示人物性格、揭示戏剧主题的同时，依然遵循戏剧艺术的本质规律，通过人物典型性格的塑造，反映深刻的社会问题。而在这一方面，易卜生的人物心理刻画，借鉴小说艺术的手法，并调动演员的积极性，使之参与创造，不仅使剧中人物栩栩如生，而且开启了现代派戏剧展示人物内心世界的许多新方法的先河。独白是戏剧展示人物心灵世界和刻画人物的传统手法，易卜生一改前人用独白揭示人物隐蔽的内心思想、情感和欲望的表现方法，而借助舞蹈动作、声响等手段，形象反映人物心理活动的过程，突破了传统的心理刻画。","keywords":"家庭问题剧 政治问题剧 现实主义精神 追溯法 讨论 独白","note":"这是南京师范大学2023年的一道真题，需要我们有所掌握。相关内容可拓展阅读周凌枫《易卜生社会问题剧的现实意义》、王忠祥《易卜生“社会问题剧”举隅》，资料可在李凡文学正版群中获取。此外，“社会问题剧”也是一个重点名词解释，大家要留心。"},{"id":"201","stars":"★★★","title":"《玩偶之家》的艺术特征","body":"一、现实主义创作方法\n\n易卜生突破了自古希腊以来戏剧的传奇内核，将社会生活中一般家庭的故事作为戏剧搬上舞台。海尔茂一家是当时社会的普通家庭，他们生活的家就是戏剧发生的场所，他们每天的日常生活就是戏剧的表现内容。易卜生更多地关注社会现实，探讨社会问题，关注人们的生活状态。他不再仅仅将戏剧作为贵族的消遣，而是更多地面向当时社会的普通族群，以他们为创作对象进行戏剧的创新。这种题材转变将现代戏剧带入了一个新的时代。\n\n二、运用“回溯法”使结构交错，矛盾集中\n\n易卜生把剧情安排在圣诞节前后三天之内，从戏剧冲突的高潮时刻写起，在有限的时间内，让多条线索交错发展，大大强了矛盾冲突的戏剧性。在剧中，娜拉的借款与还债，林丹太太与柯洛克斯泰的爱情纠葛，娜拉与阮克医生的友情，海尔重病与娜拉对丈夫的深情等剧情，都是通过“回溯法”巧妙地表述出来的。故事的前因后果脉络分明，剧情结构紧凑、波阑起伏。剧情以现在为主，过去为次，过去是推动现在的潜力，过去加强了现在的深度，过去的回顾使人物性格更鲜明突出。\n\n三、运用“讨论”增强论辩性\n\n易卜生的“社会问题剧”很注重在作品中提出重大的社会问题让剧中人物展开争辩，从而引起人们的反思。“讨论”不又涉及家庭婚姻、男女平等问题，而且涉及宗教、社会制度、法律、道德、责任义务、人权等问题。易卜生把“讨论”带进剧，既激发读者和观众探讨问题的激情，将观众与剧中人物合二为一，又推动了情节的发展，使议论性与戏剧性融合在一，创造了一种新型的戏剧模式。\n\n易卜生将人物的心理活动外化为具体的戏剧动作和性格化的语言。在剧中，娜拉的性格发展主要是通过心理描写表现出来的。幕启时，娜拉心情平静愉悦，柯洛克斯泰的来访打破了她宁静的生活。娜拉的心理变化经历了由平静到混乱，由幻想到破灭，最后彻底觉醒，人物精神反叛的发展过程顺理成章，令人信服。易卜生通过她与柯洛克斯泰等人的谈话，通过她那狂乱的练舞动作，把她的内心矛盾刻画得细致入微，真实感人。\n\n五、层层剥笋的手法\n\n作品通过层层剥笋的手法展开故事情节，分析人物心理，展示人物性格。第一幕开始时，娜拉给观众的印象是个美丽、活泼、无忧无虑的家庭主妇。她对女友林丹太太谈到她为拯救丈夫而自我牺牲的往事，使观众立即感到娜拉是个善良而坚强的女性。随着同海尔茂、柯洛克斯泰的谈话乃至最后娜拉愤怒的长篇独白，娜拉的性格和思想层层揭示出来：一个头脑清醒，渴望独立自由，愿为真理而奋斗的高尚的女性形象鲜活地展现在观众面前。\n\n六、对照手法\n\n在人物方面，娜拉和海尔茂、娜拉和林丹太太、海尔茂和柯洛克斯泰、海尔茂和阮克医生等的对照增强了人物之间的联系和戏剧的张力。故事的最后，柯洛克斯泰和林丹太太生活在一起，这与海尔茂家庭的破裂构成了一组对照。\n\n在戏剧的表现上，易卜生善于运用动静描写并通过彼此的组合对照，使戏剧更加具有表现力。戏剧开始阶段，娜拉是一个活泼灵动的形象，海尔茂则是稳重沉静的形象。戏剧高潮阶段，海尔茂情感爆发，而娜拉却异常冷静。就是在这样一系列对比中，娜拉完成了思想上的巨大转变，给戏剧带来了特殊的效果。\n\n七、巧妙的结局\n\n易卜生对戏剧结局的处理也非常巧妙，娜拉关上了门走出去，这关门声自作品诞生那天起就回响在整个世界的上空，指引着一代又一代的女性走出以前的限制去寻求解放。同时，这样一个干脆的结尾吸引了读者和观众无限的想象和探寻：娜拉走后又会有什么事情发生？海尔茂如何面对这样一个家？娜拉会回来吗？一代又一代的读者无法不去思考这些问题。","keywords":"现实主义 回溯法 讨论 心理描写 层层剥笋 对照 巧妙的结局","note":"《玩偶之家》作为易卜生的名篇，是我们需要掌握的一个重点，西安外国语大学在2023年就对其艺术特色进行了细致考查。我们可以先从作品的整体风格上去把握，然后对作品的结构、艺术手法、人物塑造等进行逐条分析。"},{"id":"202","stars":"★★★","title":"分析《玩偶之家》中娜拉的形象意义","body":"一、娜拉的形象\n\n（一）天真无邪与刚烈倔强井存\n\n娜拉美丽善良，热情活泼，向往自由幸福的家庭生活，热爱丈夫、热爱家庭、热爱生活。她受过较好的学校教育，乐观知足。她不仅对丈夫对家庭充满了爱，对遇到困难的人也都充满了同情和爱怜。\n\n除了小鸟依人式的甜美可爱，娜拉还表现出崇高的牺牲奉献精神和刚烈倔强意志。娜拉最自豪的就是她为了生病的丈夫假冒父亲签字借钱，同时还偷偷积钱还债的秘密。当柯洛克斯泰拿债务威胁她时，她为保全丈夫的声誉，坚持一个人承受一切。当她发现阮克医生对自己不怀好意时，立刻收回借钱的请求。娜拉爱憎分明、鄙视世俗的高尚情操，也是她最后看清海尔茂的真实面目，毅然决然与他分手的思想基础。\n\n（二）觉醒中的资产阶级妇女\n\n娜拉出身中产阶级家庭，从小就是父亲的玩偶，结婚以后又是丈夫的玩偶。起初她并不自知，可是当看清海尔茂的极端自私和虚伪后，她逐渐认识到资产阶级家庭中男女之间的不平等，更进而认识到资产阶级社会的法律、道德、宗教等都是虚伪的和不合理的。于是经过一番激烈的辩论后终于勇敢地出走了。这表明娜拉是一个有着坚强的性格和独立行动能力的妇女，在当时的社会条件下，她的行动表明她是一个资产阶级社会中的叛逆的女性。\n\n二、娜拉形象的意义\n\n娜拉是“易卜生主义”精神反叛的典型。娜拉从幼稚的和谐到复杂的矛盾，从耽于幻想到幻想破灭，从安于玩偶之家到坚决离家出走的过程，是女性从麻木到觉醒的苦难历程。剧本通过娜拉前后的巨大变化，不仅尖锐地提出了妇女的社会地位问题，而且深刻地揭露了一个充斥着谎言的虚伪世界如何摧残着人们的精神，窒息着人们的灵魂。娜拉的出走，无疑是对社会的公开挑战。但娜拉离家以后会如何？作者没有一点儿暗示。只是在问号之后，通过娜拉出走时重重的关门声，给全剧加上了一个震动观众的巨大的惊叹号，从而以独特的形式切入了“女性解放”这个重大的主题。\n\n19世纪自然主义和其他文学流派","keywords":"天真无邪 刚烈倔强 觉醒反叛 出走意义 妇女地位 虚伪世界 女性解放","note":"娜拉这个觉醒的女性形象已经成为世界文学中的一个不朽典型。通过塑造娜拉的形象，易卜生揭露了资产阶级社会一系列制度的虚伪和不合理，回应了女权主义主张。但我们也应注意到，易卜生只提出了问题，并没有给出切实的解决方案（《海上夫人》试图提出解决方案，但井不可行）。"},{"id":"203","stars":"★","title":"试分析自然主义诞生的原因","body":"自然主义是19世纪中后期涌现出来的一股文学思潮，它的出现主要受到以下因素影响：\n\n一、社会原因：自然科学的发展和阶级矛盾的激化\n\n19世纪下半叶，欧洲资本主义获得长足发展，开始由自由资本主义向垄断资本主义过渡，与此同时，国家之间的矛盾和阶级矛盾也在加剧。19世纪50至70年代，拿破仑第三在政治上实行高压政策，迫害共和派。由于他在军事上的无能，导致1870年色当战役惨败。第二帝国的败北加深了民族矛盾，由此产生了1871年的巴黎公社。法国第三共和国时期，当局为了转移矛盾，制造了轰动一时的“德雷福斯案件”。自然科学的发展和阶级矛盾的激化，导致实证主义、唯意志论、直觉主义等哲学思潮广泛流行，推动了自然主义文学的出现。\n\n二、思想原因：实证主义、遗传学说和决定论的深刻影响\n\n随着自然科学的发展和阶级矛盾的激化，实证主义、唯意志论、直觉主义等哲学思潮广泛流行。\n\n19世纪40年代，孔德提出了自己的实证哲学，主张以人的病理状态作为道德研究的基础。法国文学批评家泰纳接受了他的观点，提出“种族、环境、时代”三要素的论点。19世纪下半叶，遗传学说持续发展，遗传学家吕卡斯的《自然遗传论》把一切肉体的和精神的病例都归结为与遗传有关，认为遗传的作用几乎包括社会、政治、世俗等一切方面。1865年，克洛德·贝尔纳的《实验医学研究导论》以实验方法来对抗片面的经验论和唯理论。他把自己的世界观方法论称为决定论，决定论即指精确决定任何现象发生条件的观点。这一理论对自然主义文学也产生了重要影响。\n\n正是在实证哲学和进化论、遗传学、生理学等学科成果的直接影响和启发下，自然主义文学思潮于19世纪中叶的法国开始萌动。\n\n三、文学自身原因：19世纪文学思潮发展的必然产物\n\n自然主义与现实主义联系密切，自然主义作家对巴尔扎克、斯丹达尔和福楼拜十分崇仰，如左拉、莫泊桑等都对这些现实主义大家作过积极的评价。追根溯源，自然主义的先驱是龚古尔兄弟，他们开创了从生理和病理学方面去研究人的先例，为自然主义开辟了道路。此外，他们还提出了搜集“人的材料”的观点，为左拉所接受。综上所述，自然主义的产生存在一条明显的发展轨迹，它是现实主义的一种演变。","keywords":"社会原因 自然科学的发展 阶级矛盾的激化 思想原因 实证主义 遗传学说 决定论 文学自身原因19世纪文学思潮发展 现实主义的一种演变","note":"自然主义的出现总体来看是社会政治经济发展变动的必然结果，在某种程度上也受到了文学自身的调整变动的影响，大家可以从内外两个方面进行分析。这部分内容在考查中出现的可能性不大，大家作为背景知识了解一下就好。此外，“自然主义”名词解释大家要积累一下。"},{"id":"204","stars":"★★★","title":"试述自然主义的理论主张","body":"自然主义在思想上受到实证主义、遗传学说和决定论的深刻影响。具体来说，包括以下内容：\n\n一、实证主义：自然主义文学的哲学基础\n\n实证一词即“实在”“确定”“精确”的意思。孔德的实证哲学只研究具体的事实和现象，而不追究事实和现象领域内的本质与规律性。他把一切现象看成不变的自然规律，不去探索其原因和目的。孔德力图将哲学融化于自然科学中，强调艺术要探索人，认为个人的社会性是由其生理条件所决定的东西，主张以人的病理状态作为道德研究的基础。\n\n法国文学批评家泰纳接受了孔德的观点，提出“种族、环境、时代”三要素的论点。他注意到要综合研究人所受到的各种影响，要写出特定时代、特定环境和特定类型的人物形象，但他不了解更重要的是人有社会属性和阶级属性，过分强调人的种族因素。\n\n在实证主义哲学影响下，自然主义文学接受并发展了巴尔扎克等现实主义作家的主张，将写真实和客观性视为文学创作的首要条件，积极研究制约人的“外部环境”和“内部环境”。\n\n二、遗传学说\n\n19世纪下半叶自然科学迅速发展，遗传学说是其中的一个分支。遗传学家吕卡斯的《自然遗传论》把一切肉体的和精神的病例都归结为与遗传有关，认为遗传分先天和后天两种，生育具有先天性，但个体存在独特性和个性；遗传可表现在外部相似或内部相似，一个家族成员的过失可以影响整个家族；等等，它的作用几乎包括到社会、政治、世俗等一切方面。\n\n在吕卡斯遗传学说的影响下，自然主义文学作家机械地将自然科学的理论搬到文学创作中，从生理角度去表现人，特别是以当时遗传学的观点去理解促使人行动的原因。\n\n三、决定论\n\n克洛德·贝尔纳的《实验医学研究导论》以实验方法来对抗片面的经验论和唯理论。他把自己的世界观方法论称为决定论，决定论即指精确决定任何现象发生条件的观点。他认为在研究任何实物的性质时，必须探讨实物的特性和环境。他承认自然界的客观因果性、必然性、规律性，具有唯物主义的观点。他的理论是左拉的《卢贡-马卡尔家族》的脊柱，更是促使自然主义接受了巴尔扎克描写一段历史时期来反映整个社会的成功经验。","keywords":"实证主义 遗传学说 决定论 泰纳 三要素 左拉 科学 客观中立","note":"这是吉林大学2023年考查过的一道真题，需要我们有所了解。可以看到，自然主义的理论主张，与自然主义文学的思想特点和艺术特点是相互关联的，或者说，自然主义文学正是上述这些主张在文学创作中的实践，所以大家可以把这两方面的内容联系起来理解记忆。"},{"id":"205","stars":"★★★★","title":"试分析自然主义文学的基本特征（25青岛大学）","body":"相较于现实主义文学，自然主义文学在思想内容和艺术特色上都表现出了新的特点，具体如下：\n\n一、思想特点\n\n（一）将写真实和客观性视为文学创作的首要条件\n\n自然主义文学继承19世纪上半叶巴尔扎克、斯丹达尔以及福楼拜的现实主义观点，将写真实和客观性视为文学创作的首要条件。自然主义小说家还提出要运用实证主义批评家的方法，获得“人的材料”，即要研究制约人的“外部环境”和“内部环境”。“外部环境”包括社会、人情、时代等因素，“内部环境”包括心理和生理等条件。他们认为“不要夸张，也不要强调，只要事实”。这是对福楼拜详细占有材料和客观地对待描写对象的发展。\n\n（二）通过描写一段历史时期来反映整个社会\n\n自然主义接受了巴尔扎克描写一段历史时期来反映整个社会的成功经验。左拉等作家对下层人物十分关注，并把他们的贫困生活和犯罪现象当作严重的社会现象来描绘，如把娜娜的堕落与第二帝国上层阶级的腐化联系起来。莫泊桑则擅长描写诺曼底农村和公务员阶层，并对金融界、新闻界和政界之间的黑幕有深刻的揭露。\n\n（三）从生理角度去表现人，特别是以当时遗传学的观点去理解促使人行动的原因\n\n爱德龚古尔说：“今日的小说担负着科学研究和科学课题的工作。”又说：“我们的所有作品都建立在神经性疾病上。”左拉认为遗传是“自然史的全部哲学所在”，把吕卡斯的遗传学观点原封不动地照搬到小说创作中，错误地认为遗传是决定人的行动的“隐秘的动力”，用生理学的观点和方法去洞察人和社会现象，未能正确地反映一个家族的变迁。\n\n二、艺术特点\n\n（一）力图巨细无遗地描绘现实，排斥虚幻的想象，从而给人一种实录生活和照相式的印象\n\n左拉提出，艺术家只是一名记录员，只需陈述事实，对自然不作任何改变和缩减。这种论点违反了艺术应该高于现实的原则，因而给自然主义带来琐碎、芜杂的缺陷，未能真正反映生活的本质。有关放纵性欲的描写也是在这种观点的支持下，成为自然主义招致非议的一点。莫泊桑也步左拉的后尘，在他的几部长篇小说中这样去展现上流社会人物的爱情生活，削弱了批判精神。\n\n（二）擅长描写群众场面，注重群体的写照，逐渐忽略典型的创造，或者说只追求人物的气质特点和变态心理\n\n《小酒店》中古波和热尔维丝的婚礼，《萌芽》中的矿工罢工，《崩溃》中的战争场面，《巴黎之腹》中的菜市场，等等，场面浩大，气势浩瀚。由于自然主义作家更注意“研究气质而不是性格”，更注意生理病例的表现，所以在他们的作品中，人物性格不再突出，他们的果敢、刚毅、富于正义感，或者野心勃勃、淫荡等，都是人物的气质表现，是由他们的生理特点所决定的，但他们并不是具有鲜明个性的典型。\n\n（三）开始淡化情节，不去追求戏剧性的曲折变化，主张按生活的“本来面目”去反映现实\n\n自然主义作家中，龚古尔兄弟的小说已经“没有波折，没有情节”，这是为了“改变读者的文学趣味”。左拉主张情节要像生活一样平淡无奇。莫泊桑的心理分析小说也是情节简单，篇幅不长，甚至《一生》也更注重女主人公的内心情感的刻\n\n画，情节并不复杂。\n\n（四）将某些压迫人、扭曲人的社会现象拟人化\n\n将某些压迫人、扭曲人的社会现象拟人化这一特点主要体现在左拉的作品中。他觉察到资本主义社会科学技术的发展和物质条件的变化，反过来构成一种异化力量，对人形成威胁和压迫。于是在他笔下，矿井是吞噬人的怪物，菜市场、蒸馏器、火车头、交易所都具有生命。","keywords":"写真实和客观性 描写一段历史时期来反映整个社会 将自然科学的理论搬到文学创作中 实录生活和照相式的印象 注重群体的写照 淡化情节 社会现象拟人化","note":"自然主义的特征是一个高频考点，仅在24年，就有北京大学、南京师范大学、厦门大学、云南大学等多所院校对其进行了考查。自然主义文学将现实主义文学客观真实的要求发展到了极致，忽略人的社会属性和阶级属性，只从生理的角度去发现人，这是其最大弊端，同时也是它的最大特色。关于自然主义较现实主义的区别变化，详细看下一题。"},{"id":"206","stars":"★★★","title":"试分析自然主义与现实主义的区别","body":"从文学的渊源关系来看，自然主义由现实主义发展而来。自然主义的产生存在一条明显的发展轨迹，它是现实主义的一种演变。但是，作为一种文学流派，自然主义与现实主义还是有其本质的区别，这主要表现在以下方面：\n\n一、对文学价值的认识不同\n\n现实主义把文学作为分析与研究社会的手段，为人们提供了特定时代丰富多彩的社会历史画面，具有很高的认识价值。\n\n自然主义文学以科学为指导，通过观察研究，为人的行动和命运寻找生理与遗传学的原因。所以，自然主义文学属于现实主义文学，但是它又不同于现实主义文学，是现实主义文学发展的一种极端表现。\n\n二、对真实的理解不同\n\n现实主义作家主张在作品中隐退“自我”，却并不至于丧失“自我”。他们的创作实践说明，“按照生活本来的样子描写生活”只不过是一种特定文化背景下的艺术理想而已；优秀的现实主义文学所反映的生活都体现了作家们对生活的感受、体验与评价，表现了他们在特定生活激流中情感、心绪的演变，因而这些作品所提供的是融入了作家主观情致与个性特征的变形了的生活图画，而并非对生活作机械的模仿。\n\n自然主义力图巨细无遗地描绘现实，排斥虚幻的想象，从而给人一种实录生活和照相式的印象。像左拉就提出艺术家只是一名记录员，只需陈述事实，对自然不作任何改变和缩减，“把自然整体还原出来毫无剔除”。这种论点违反了艺术应该高于现实的原则，因而给自然主义带来琐碎、芜杂的缺陷，未能真正反映生活的本质。\n\n三、对人性的认识不同\n\n现实主义作家在对社会历史现象作出广阔再现和强烈批判的基础上，深刻地展示资本主义条件下人与物、人与社会的矛盾关系，表现人的异化现象，寻求人的心灵自由，表现出深度意义上的人道主义精神。\n\n自然主义文学较为关注人的情欲、身体的机能和难以自制的天性，而现实主义文学突出的是人在社会关系中的位置，自然主义文学注重人和事物的生理属性，现实主义文学普遍关心社会文明发展进程中人的生存处境问题，表现出作家们对人的命运与前途的深切关怀。\n\n四、创作原则和方法不同\n\n现实主义作家接受自然科学和唯物主义哲学的影响，认为人是社会环境的产物。在创作中，他们主张从人物所处的社会历史环境中刻画人物性格，真实地揭示人物和事件的内在联系与本质特征及发展趋势，通过对典型环境中的典型性格形成过程的描写，全面真实地展示现实生活及其本质特征，反映整个时代的风貌。\n\n自然主义擅长描写群众场面，注重群体的写照，逐渐忽略典型的创造，或者说只追求人物的气质特点和变态心理。\n\n总之，自然主义文学发展并强化了现实主义文学的写实倾向和科学精神，但是它沿此方向前进得太远，形成了与现实主义文学的巨大分歧，也背离了文学自身的特性与规律，从而在文学成就和影响上难以与现实主义文学相抗衡。","keywords":"文学价值 真实的理解 人性的认识 创作原则和方法","note":"广东外语外贸大学在24年对这部分知识做了详细考查。自然主义是现实主义的一种演变，自然主义作家对巴尔扎克、福楼拜等现实主义大家也推崇备至，这导致自然主义文学受现实主义文学影响很大，在许多方面都有相似之处。但自然主义毕竟是一种独立的文学思潮，有其自己的个性所在。因此，自然主义文学与现实主义文学的相异之处无疑会更多。像这种将两种文学思潮进行对比的题目在考查中很常见，大家要多做准备。"},{"id":"207","stars":"★","title":"谈谈你对唯美主义的认识","body":"一、理论基础\n\n康德哲学是唯美主义的理论基础。他提出了“无目的的合目的性”的美感学说。他认为美感“是纯主观的自由的愉快，不夹杂任何利害感，在纯粹的具有普遍性的不借助概念的鉴赏判断中得到”。他强调的是主观性、无功利性和纯粹性，这就为唯美主义提供了理论根据。\n\n二、理论主张\n\n（一）唯美主义认为艺术与政治、道德、功利无关，它是超脱一切利害关系，包括金钱的纯粹自由活动。它主张“艺术具有独立的生命”，其口号是“为艺术而艺术”，因而只注重形式美，着力探索文学形式，探索文学与音乐、绘画之间的关系，以增强文学作品的表现力。\n\n（二）唯美主义提出艺术是心灵的故乡的主张。在心的领域，瞬间存在可以达到永恒，狭小的空间可以有无限的容量。因此，艺术高于生命，高于帝王，高于神祇，高于一切，艺术是至高无上的。\n\n（三）唯美主义主张艺术超然于现世，躲进象牙之塔。他们认为现实社会充满市侩气，没有艺术，没有美。因此艺术的发展非但不依赖生活，相反，生活应该追随和模仿艺术。由于唯美主义否定现实社会，于是它向远古时代、未来、梦幻求美。\n\n（四）唯美主义认为艺术家对待题材的态度应是客观、冷漠的。\n\n三、发展过程\n\n（一）唯美主义的形成经历了一个准备阶段。席勒关于“美的显现”的艺术观念，把美看作一个自足的独立体。英国诗人布莱克和基茨的创作已有唯美主义的倾向。济慈和柯勒律治也从不同的角度宣扬了唯美思想。法国诗人泰奥菲尔·戈蒂埃和英国作家约翰·罗斯金为唯美主义奠定了理论基础。\n\n（二）唯美主义发端于19世纪30年代的法国。诗人、小说家戈蒂耶最早抛出了“为艺术而艺术”的主张，成为唯美主义的纲领性口号。19世纪60年代，帕尔纳斯派在诗歌创作中精雕细刻，追求格律的工整和形式的完美，形成一次唯美主义的高潮。\n\n（三）英国唯美主义的兴起稍晚于法国，但却形成了相当的规模，其理论更加完备，创作更加丰富，影响也更加广泛。四五十年代出现的拉斐尔前派是英国唯美主义的先声。佩特最早在《文艺复兴》一书中主张“为艺术而艺术”，并在后来的多部论著中阐述艺术的任务在于培养美感、寻求美的享受的美学观点。19世纪八九十年代，英国唯美主义形成高潮涌现了以王尔德、佩特为首的一批作家和批评家。王尔德以其在这一时期的大量论述和创作，被公认为唯美主义的集大成者。\n\n四、意义与价值\n\n唯美主义在艺术上开拓了审美的领域，扩大了艺术表现的范围，对形式美和美感的独特性的强调有一定的参考价值，但片面强调美的超功利性，过分注重形式而忽略内容，将艺术与生活割裂开来，这些观点则产生了消极影响。","keywords":"理论基础 康德哲学 思想艺术特点 为艺术而艺术 艺术是心灵的故乡 艺术超然于现世 客观 冷漠 形成过程意义与价值 参考价值 消极影响","note":"唯美主义文学表现出了鲜明的“为艺术”的特点，大家可以结合中国现代文学史上“为艺术”一派的特征进行理解。这部分内容中我们尤其要注意的是唯美主义的理论基础，可能会单独出简答题。此外，这里涉及的“唯美主义、为艺术而艺术”等名词解释，大家要注意积累。"},{"id":"208","stars":"★★★","title":"试分析前期象征派的创作特征","body":"前期象征派产生于法国，从19世纪中叶开始流行的唯心主义是它的哲学基础。总体来看，前期象征派的创作主要表现出了如下特征。\n\n一、化丑为美，丑中见美\n\n前期象征派大量描写城市中的丑恶现象，在艺术上则是化丑为美，丑中见美。浪漫主义文学主张美丑对照，而象征派则集中描写丑；浪漫派笔下的丑具有美的内涵，如《巴黎圣母院》中的加西莫多具有心灵美，而象征派笔下的丑是实在的丑，它只作为艺术形象才具有美感。除了外界事物的丑，象征派还把精神状态的忧郁等情感当作另一种丑来表现，因而他们笔下的忧郁也有别于浪漫派描写的忧郁，更具美学价值。\n\n二、通感和象征手法\n\n前期象征派注重挖掘人的精神世界，在艺术上则以具体意象去反映抽象事物，并升华为哲理，它注意到语言的某种结合能产生巨大的效果，这就是运用通感和象征手法。象征派对各种各样的精神现象进行了深入的挖掘，它的创新之处在于用具体的意象去表现抽象的情感，这就是象征手法。象征派还注意到不同的艺术手段之间存在相通之处以及不同的语言组合能产生巨大的效果，这就是通感和所谓“语言炼金术”，后者是兰波提出的概念，是对通感的一种延伸，对后世诗歌语言的跳跃性、不连贯性、多义性、模糊性都产生了极大影响。\n\n三、追求诗歌的音乐效果\n\n前期象征派追求诗歌的音乐效果，诗画结合，在语言和韵律上精益求精，在诗歌形式上追求简练精粹、工整优雅。象征派诗人魏尔伦提出“音乐是诗歌的首要原则”，他的诗歌注重叠韵、音步、诗行字数、音节和谐、韵律多变，尽量发掘诗歌的内在节奏美。象征派反对浪漫派滔滔不绝、不够严整的诗行，寻求短小的诗体，如十四行诗。马拉美以罕见的字和罕见的音去押韵，写出难以模仿的作品，他要寻找诗歌语言的纯粹美。象征主义诗人对音乐性的追求，意在使诗歌能与音乐一样对观念世界作出暗示。内在韵律的丰富，更增添了诗歌梦幻般的诗意和多义的魅力。在诗歌艺术上，前期象征派达到了一个高峰。\n\n四、具有朦胧美和神秘色彩\n\n前期象征派认为诗歌是神秘的，本应晦涩难懂，读者要从表面形式中寻找本质的东西。朦胧美和神秘色彩，是象征主义作品的显著特色。他们的诗句大多流畅自然，富于乐感但其中多有象征、暗示、隐喻，模糊与精确相连，从而使诗意飘忽，半明半暗留下了更多想象、品味的余地。","keywords":"化丑为美 丑中见美 通感和象征 音乐效果 朦胧美 神秘色彩","note":"19世纪70年代崛起于法国的象征主义，与唯美主义有着因缘关系，但其成就、声势、影响，都要大于后者。因而在考查之中，可能针对前期象征派出一些论述题，大家要有所准备。当然，前期象征派这一关键概念也常在名词解释中出现，大家要注意积累。"},{"id":"209","stars":"★","title":"试分析《卢贡-马卡尔家族》的思想主题","body":"在《卢贡-马卡尔家族》中，左拉仿效巴尔扎克的《人间喜剧》，以一个家族的盛衰反映整个历史时代。从主题上来说，这部长篇主要反映了以下内容：\n\n一、政治演变\n\n在《卢贡家族的发迹》中，资产阶级和贵族联合起来，夺取了政权，镇压工人和农民，表现了第二帝国是血腥起家的；《巴黎之腹》描写脑满肠肥的资产者（丽莎）将企图发动起义的无产者（弗洛朗）打下去；《卢贡大人》描写上层权力斗争、卑污的政治内幕和皇帝的专制，预示这个政权的必然灭亡。主人公欧仁·卢贡是这个政权的走狗；《娜娜》暴露从上层到下层的腐化堕落，这个社会追求金钱和肉欲；《崩溃》反映了色当战役的全过程，包括巴黎公社的诞生和浴血的一周。第二帝国的始末和盛衰得到了完整的反映。\n\n二、社会变革的经济状况\n\n《卢贡-马卡尔家族》之中，《女福公司》描绘了现代商业的迅猛发展，反映了大鱼吃小鱼的残酷现象；《金钱》描写股票投机，操纵股票的萨卡尔造成了千千万万人倾家荡产；《萌芽》描写工业发展所依赖的煤矿开采已达到相当大的规模；《人兽》反映了国民经济的动脉-铁路运输的状况；《巴黎之腹》描写城市居民不可或缺的菜市场，五光十色、琳琅满目的食品和熙熙攘攘的人群呈现出城市生活的兴旺；《土地》反映农业的税收和竞争的严峻问题，以及争夺土地的激烈。这套小说反映了第二帝国经济获得长足发展的现实和种种问题。\n\n三、社会状况\n\n《卢贡-马卡尔家族》中的《小酒店》描写巴黎城郊结合部工人的生活变迁和在死亡线上挣扎的贫民的悲惨生活；《家常事》解剖一座公寓里的中小资产阶级乌七八糟的生活，“揭开炖着家庭中的腐败和道德败坏的大锅的盖子”，这里的房客仪表堂堂，暗地里通奸贪财；《穆雷神父的过错》描写神学院把人变成活尸，而爱情才使人获得新生，教士的禁欲是违反人性的；《作品》描写画家的生活，他们为了创新要经历极其艰难的过程；《帕斯卡尔医生》展示生物学家的研究和生活。\n\n四、家族变迁“自然史”\n\n左拉还将吕卡斯的遗传学理论运用到小说中，力图写出“自然史”。卢贡-马卡尔家族第一代阿黛拉伊德·富克有歇斯底里症和抽搐症，她的情夫马卡尔是个酒鬼，精神失调。于是第二代就有一个酒精中毒，另一个患肺病。第三代发展成宗教狂\n\n热和纵火狂。第四代中有共济失调、先天性痴呆、宗教狂、精神病。第五代有三个孩子分别因患脑积水、瘰疬和骨疽而天折。这种描写缺乏科学性。","keywords":"政治演变 社会变革的经济状况 社会状况 家族变迁“自然史”","note":"《卢贡-马卡尔家族》的主题主要受到左拉创作理论的影响。他对现实主义大师巴尔扎克十分推崇，希望通过一个家族反映一个时代的历史变迁。不过，对于左拉作品的考查，还是集中于《卢贡-马卡尔家族》中的《萌芽》这一篇，所以这部分内容，我们作为背景知识了解一下就好。"},{"id":"210","stars":"★★★","title":"试分析左拉的创作特征","body":"左拉是19世纪自然主义文学作家的典型代表，他的创作，主要具有如下特征：\n\n一、善于描写群体及群体性的行动\n\n左拉善于描写罢工工人、军队行进和俘虏营、如海潮般争购的顾客、热尔维丝家聚会的热闹场面等，气势雄浑壮阔，创造出一种散文体的史诗，正如饶勒斯所说：“他的艺术是夹带着整个生活和真理的力量奔腾向前的大江大河。”笔力恢弘，粗犷有力，但重视群体势必削弱典型人物的塑造，淡化人物性格的描绘，这是左拉与巴尔扎克在艺术上的区别之一。\n\n二、擅长精细入微的描绘\n\n左拉擅长精细入微的描绘，无论商场、机车、交易所、矿脉，还是人体上的瑕疵、妓女诱人的肉体、惨不忍睹的尸体，都力求纤毫毕现，在描写客观世界上堪与巴尔扎克媲美，这种描写开了20世纪新小说描写物的先河。在左 拉笔下，火车头、蒸馏器、菜场、矿区，甚至巴黎，都拟人化了，成为有生命的怪物。它们象征着物对人的压迫，这是左拉对环境描写的发展。左拉将巨细无遗的描写与丰富的想象相结合，避免给人冗长的印象，这种拟人化手法别出机杼。只是有时他的描写过于琐碎。\n\n三、浓郁的抒情色彩\n\n左拉不仅仅是手持放大镜去观察客观事物的作家，他没有一头扎在卑微琐屑的描写之中，他对生活仍然抱有美好的期望，他的行文不时带上富有诗意的描绘。他从黑色的矿区和非人的矿工生活中依然看到希望的萌芽，他从帝国的崩溃中依然看到共和国的来临，他从贫困的生活中依然看到美丽的图景。《爱情的一页》是“一部完全浪漫诗人的构思”，《梦》就像一篇童话故事。强烈的诗情流露使左拉的小说具有浓郁的抒情色彩，这是左拉与巴尔扎克的又一个不同之处。\n\n四、以小见大，具有敏锐的洞察力\n\n左拉是一个极为敏感的作家，他能迅速抓住刚刚出现的事物或重大事物，看到其中包含的巨大意义。他及时意识到煤矿工人大罢工的含义，赶往现场去采访和观察；他从名妓身上看到整个社会的腐化；他从商场、铁路、交易所的繁荣撷取描写的题材，显示了一个大作家独具慧眼的洞察力。","keywords":"群体及群体性的行动 精细入微的描绘 浓郁的抒情色彩 敏锐的洞察力","note":"左拉的身上，可以看到巴尔扎克和福楼拜的影子，在艺术特征上，他与这两位现实主义大师有相同之处。关于这部分内容可拓展阅读冯欣《左拉的巴尔扎克情结》、刘澍芃《自然主义与现实主义的叠错合离》、伍茂源《现实主义对左拉文艺思想的影响》，资料可在李凡文学正版群中获取。"},{"id":"211","stars":"★★★★","title":"试结合作品内容，分析左拉《萌芽》的历史意义","body":"《萌芽》是《卢贡一马卡尔家族》的第13部小说，是一部描写煤矿工人为了反抗资本家剥削而奋起斗争的作品。在文学史上，这部作品有着重大的历史意义，具体表现在以下方面：\n\n一、第一部正面描写产业工人罢工的小说\n\n《萌芽》成功地再现了罢工的过程，展现了资本主义社会的重大社会现象，提出了令人振聋发聩的社会问题。《萌芽》的主题是崭新的主题，它表现了工资劳动者的起义，反映了资本主义社会的两大阶级-资产阶级和无产阶级在经济领域、社会领域乃至政治领域的斗争，深入探讨了这一问题出现的多方面原因以及影响。小说提出的这个问题，正是二十世纪最重要的一个问题。\n\n二、指出资产阶级榨取无产阶级的血汗是罢工的症结所在\n\n左拉并没有单纯地描写罢工斗争，他首先写出了罢工的根本原因。小说描绘了矿工令人触目惊心的工作条件，是煤矿工人的一份控诉书，矿工们长年在设备简陋、充满危险的矿井下工作，一天工资仅三法郎，不够买糊口的面包；而资产者日日鲜衣美食，公司经理格雷古瓦家豪华的住宅，他一个人的收入抵得上50个矿工家庭的血汗收入，连最不值钱的陈设也够工\n\n人吃一个月，过着寄生虫的生活。他的财富是建立在劳动者的血汗之上的。小说通过贫富的强烈对比，指出资产阶级的财富是建立在榨取无产阶级的血汗劳动之上的事实。这就是罢工的症结所在。\n\n三、无产阶级作为整体力量第一次出现在文学作品中\n\n《萌芽》描写的这场轰轰烈烈的罢工，是有了觉悟的工人的集体行动。罢工有较正确的思想指导，是在国际工人联合会领导和支持下进行的；在罢工中，工人同无政府主义者的工贼作了一系列斗争。虽然这次罢工仍有工人运动初期捣毁机器等泄愤的行为，但它不仅仅提出了经济要求，还接触到政治权利。左拉写出了工人罢工的巨大力量，显示了产业工人的组织性和坚定性。小说描写的是认识到自身力量的工人群众，是从手工业过渡到大工业的无产阶级，他们在反对取得统治地位的资产阶级、反对寡头政治、反对剥削压迫中站到了历史的前台。这是无产阶级作为整体力量第一次出现在文学作品中。\n\n四、乐观情调与昂扬的战斗气息\n\n在《萌芽》之中，工人们的这次斗争虽然失败了，但是毕竟使资产阶级领教了无产阶级的愤怒力量。因而小说的结尾不是悲观的，而是充满信心。它充满对未来的憧憬和乐观的情调，这是一部悲壮的史诗。左拉相信，工人阶级的正义事业将来一定会开花结果。这种带有预示性的乐观情调赋予这场罢工斗争高昂的战斗气息。","keywords":"正面描写产业工人罢工 罢工的症结 无产阶级作为整体力量第一次出现在文学作品中 乐观情调 昂扬的战斗气息","note":"19世纪中后期，资本主义社会固有的矛盾暴露，社会主义思想开始广泛传播，受此影响，工人运动此起彼伏，《萌芽》正是对这一社会现实的积极反映。在这部作品之中，无产阶级的力量、工人运动的过程都得到了真实的展示，这在文学史上是极具开创性的，这也是《萌芽》受到人们关注的重要原因之一。"},{"id":"212","stars":"★★★★","title":"试分析左拉《萌芽》的艺术特色","body":"《萌芽》的问世标志着左拉思想和创作的重大发展。小说视无产阶级为一个整体，以宏伟的气势反映出他们惊心动魄的反抗斗争，与巴黎公社文学相呼应，构成法国文学史上重要的一页。这部小说的艺术特色，主要表现在以下方面：\n\n一、张弛有度的场面描写\n\n左拉的小说素以描绘群众场面的浩大著称，《萌芽》描写的罢工就是典型的一例。小说用整整一部来写罢工。《萌芽》中对于罢工的描写具有散文体的史诗风格，如描绘古代史诗战争场面一样描绘罢工队伍，罢工的人流得到了绘声绘色的再现。左拉的独到之处，是他能够把粗犷和细致两种因素巧妙地结合在一起，既勾画出了气势磅礴的群众场面和广阔的背景，又有许多极其精微细致的描写。在描绘罢工的人流奔走呼号时，左拉有条不紊地穿插了经理们如何应付这场罢工。小说写得一张一弛，显示了作家的大手笔。\n\n二、善于刻画先进工人形象\n\n在《萌芽》中，除工人集体形象外，左拉还突出地刻画了几个先进工人的形象。工人马厄是千千万万靠诚实的劳动来糊口的工人之一。马厄嫂是一个逐渐觉悟的普通工人的形象，在她身上体现了工人阶级的勤劳、淳朴、坚强和勇于自我牺牲的精神。而书中的艾蒂安更是法国文学史上第一个有阶级觉悟的工人形象，是一个在基层涌现出来的工人领袖。这些工人形象的成功塑造，在文学史上具有重要意义。\n\n三、象征词汇的运用\n\n左拉善于运用具有象征意义的词汇。除了“萌芽”象征希望以外，他还爱用“黑色的”这个形容词。煤矿地区的特点就是一片黑色。小说共40章，只有10章在阳光下进行。这个天地仿佛是“一种物质构成的黑夜”，只有在下雪时，村庄才变成白色，但“像包裹在尸布里一样”。如果说白色是死寂、虚无的标志的话，那么黑色就是忧郁、恐惧、压迫的象征。这黑色的天地就是矿工们生活着的现实世界。这富有象征意义的环境描写具有版画一样的严峻苍凉的力量，增添了小说悲壮的色彩。\n\n四、严密的小说结构\n\n左拉向来看重小说的结构，《萌芽》的结构尤为严密。小说共7部分，开头4个部分是引子、开场、发展、深入，一步步描写矿工反抗情绪的产生、扩大和高涨，第5部分是全书的高潮-罢工，后两部分描写罢工的失败经过和尾声，全书构成一个整体。情节的进展井然有序，节奏沉稳有力。\n\n此外，从容、稳当的节奏同均衡、比例得当的结构密不可分，成为这部小说的又一优点。","keywords":"张弛有度的场面描写 先进工人形象 象征词汇的运用 严密的小说结构","note":"《萌芽》之所以流传后世，不仅仅是因为其对工人运动的表现，更是因为其极高的艺术成就。左拉的创作特征，在这部小说中淋漓尽致地体现了出来。尤其是在这部小说之中，左拉比较成功地塑造了革命的无产者形象，这使得他和他的小说《萌芽》在文学史上占有一个卓越地位。"},{"id":"213","stars":"★★","title":"莫泊桑短篇小说的表现题材主要有哪些","body":"莫泊桑的短篇小说提供了19世纪末叶的一幅社会风俗画卷，大致有如下几个题材：\n\n一、普法战争\n\n莫泊桑着力表现的是法国普通人民的爱国主义激情。莫泊桑根据普法战争题材创作的小说井不多，但是几乎篇篇都是佳作，原因在于莫泊桑将讴歌法国人民高昂的爱国主义精神同暴露敌人的残暴结合起来，将爱国心同自私自利加以对照，主题突出，爱憎分明，意义显豁。这其中尤其是以《羊脂球》最具有代表性，作品中的羊脂球“与正人君子”两相对照，灵魂的美丑昭然若揭。\n\n二、小资产阶级和公务员\n\n莫泊桑揭露了小资产阶级和公务员的爱慕虚荣、势利、庸俗、猥琐。如《项链》的女主人公因一念之差竟失去了半生的幸福。《我的叔叔于勒》中的一家人都以为“叔叔”于勒发了财，一直等他回来，后来在轮船上发现他变成了一个卖牡蛎的穷苦老头，于是避之唯恐不及。莫泊桑对小资产阶级阶层最为熟悉，写来得心应手，因此这个题材写成的小说最多。莫泊桑对他们的态度起先是讽刺、鞭挞，继之怒其不争，最后哀其不幸。\n\n三、农村生活\n\n莫汨桑自幼生活在诺曼底，对农村生活非常熟悉。他通过各种不同的侧面，表现了农村各式人等和多姿多彩的生活。如《一个女雇工的故事》描写农村中的妇女遭受欺骗，无法主宰自己的命运。《穷鬼》表现了农村中无家可归的人的悲惨结局。《老人》通过一个老人勾画出一幅农村的风俗图，并写出两代人的淡漠关系，以及农民虽然无法摆脱习俗约束，但更重实利的心理。\n\n四、怪诞故事\n\n19世纪后期法国出现了一些写怪诞故事的作家，如巴尔贝·多尔维利和维利埃·德利勒·亚当，他们发展了霍夫曼和爱伦·坡的创作倾向，莫泊桑受到这种潮流和复杂的社会思潮的影响，也可看作这是现代性的表现。同时，病痛和药物使莫泊桑常常产生一些幻觉和特殊的感受，他也把这些化为小说。有的小说描写疯狂状态（《疯子》），还有的小说描写催眠术（《催眠梦》）、动物磁气（《磁感作用》）的“超自然”现象。莫泊桑能列入怪诞小说的作品至少有30多篇。\n\n五、爱情、婚姻和家庭生活\n\n莫泊桑写过不少关于爱情、婚姻和家庭生活的短篇。如《遗产》描写一对夫妻为了获得一百万法郎的遗产，演出了一幕幕丑剧；《伙计，来一杯啤酒》揭示为了金钱，夫妻之间的温情荡然无存；《保尔的情妇》描写巴黎中产阶级寻欢作乐的生活；《隆多里姐妹》中的母亲以女儿的色相去勾引男人；《死去的女人》是对爱情和人生的凄凉回顾，指责世人的虚伪和卑劣。","keywords":"普法战争 小资产阶级和公务员 农村生活 怪诞故事 爱情、婚姻和家庭生活","note":"从内容上来说，莫泊桑扩展了短篇小说描绘社会生活的广度和深度，这集中表现在莫泊桑对小资产阶级人物和农民的塑造上。对于小资产阶级，莫泊桑既同情他们的不幸遭遇，又批判了他们的坏习气，无疑有创新的意义。同时，莫泊桑如实地描绘了19世纪下半叶农业获得发展，农民生活有所改善的农村，这在之前的作品中是十分少见的。"},{"id":"214","stars":"★★★","title":"试分析莫泊桑短篇小说的艺术成就","body":"莫泊桑的短篇小说取得了很高的艺术成就，他把短篇小说的创作提高到梅里美没有达到的高度，这主要表现在以下方面：\n\n一、小说结构复杂多样\n\n莫泊桑是谋篇布局的大师。他的小说有时截取生活的一个横断面，有时写人物相当长的一段生活，有时在几小时内进行，有时从侧面去烘托；一般用白描手法，但经常进行心理探索和心灵的挖掘；既有平铺直叙，也有倒叙回忆。他的写作方法集19世纪短篇小说的大成。\n\n二、严格选材\n\n莫泊桑对题材的选择非常严格。例如从《羊脂球》的角色身份、环境、故事情节的选取和对照，足可见其观察的细致、\n\n选材的精到、讽刺的巧妙和犀利。从《羊脂球》精选的场景中，莫泊桑确实提供了他所主张的比现实更全面、更鲜明、更使人信服的东西。\n\n三、人物画廊丰富多彩\n\n莫泊桑擅长描写小资产阶级和农民，他的人物画廊丰富多彩。为了荣誉不惜出卖妻子的萨克尔芒，善良而有爱国心的羊脂球，疾恶如仇的菲菲小姐、米龙老爹、索瓦热老婆婆．....．有的个性突出，有的气质鲜明，这些人物展现了19世纪末叶法国社会的众生相。莫泊桑创造人物之多，可以同莫里哀和巴尔扎克媲美。\n\n四、简洁、紧凑\n\n莫泊桑的短篇写得简洁、紧凑、毫无废话，浓缩到最高度。他的《项链》在这方面就很有代表性。这篇故事分为几个阶段，每个阶段用空一行来表示，省却交代的文字；语言精简到最高程度，但层次分明，一环紧扣一环，导向高潮，再突然刹住。此外，莫泊桑在划分情节发展的阶段时，还往往用一个连接作用的词串起来，如“可是”“一天”“随后”“就这样”，等等，承上启下，妥帖自然，尽量简约。\n\n五、发展了第一人称的叙述方法\n\n莫泊桑的短篇有一半是用第一人称来写的，细分起来，有如下5种：叙述者向听故事的人讲述他亲身经历或目睹的遭遇（47篇）；叙述者遇到一个朋友或相识，将自己的往事讲述给他听（32篇），这两类叙述的结尾，几乎总是回到开头的场面，作个交代；叙述者直接诉诸读者，讲述个人回忆（39篇）；叙述者讲述他听到的一件事，故事正文则用第三人称（24篇）；用书信的形式来写，口气是第一人称（8篇）。第一人称叙述方法在莫泊桑这里得到了长足发展。\n\n六、对大自然的美非常敏感，尤其是对光线与水有特殊爱好\n\n莫泊桑能捕捉到随着季节而变化的光线的细微差别，辨别出冬夜的晶莹剔透和夏夜波动不定的深邃，观察到河上闪烁的、在金色的烟雾中发出彩虹、在金属般的水面上转瞬即逝的光线。光线经常在莫泊桑的风景描写中起作用，就像在莫奈的画布上一样，色调变化多端。\n\n水在莫泊桑的眼里是得天独厚的元素，它给眼睛提供了一系列变幻不定的颜色。在他笔下，水是流逝的时间，是难以达到的无限，是创造的奥秘本身，具有无穷的魅力。水经常是莫泊桑借用来记录他的隐喻和比喻的对象。\n\n七、语言平易通俗、准确有力\n\n莫泊桑是语言大师，他以平易通俗、准确有力、能为所有人接受的文学语言征服读者。很少有作家能写出比他更明晰、更清澈如水、更难捕捉到的语言了。莫泊桑也使用方言土语，但总是以读者能了解为限度。由于语言的纯粹，莫泊桑的短篇已成为学习法语者的范文。很少有读者读不懂莫泊桑的短篇小说，因为其中没有丝毫晦涩的东西；读者只觉得莫泊桑找到了最恰当的描述方式而无法用另一种文字和方式来表达。","keywords":"结构复杂多样 严格选材 人物画廊丰富多彩 简洁紧凑 第一人称的叙述方法 对大自然的美非常敏感 光线 水平易通俗 准确有力","note":"莫泊桑将短篇小说创作艺术向前推进了很大一步，把短篇小说的艺术提高到了一个前所未有的水平，因此被誉为现代文学中的“世界短篇小说之王”，与俄国契诃夫和美国欧·亨利井称为“世界三大短篇小说巨匠”。对于莫泊桑小说创作特征，我们需要关注一下。"},{"id":"215","stars":"★★","title":"试分析莫泊桑《羊脂球》的艺术特色","body":"莫泊桑以《羊脂球》为代表的中短篇小说，把现实主义短篇小说艺术提高到了一个空前的水平。这部小说的创作特征，主要表现在以下方面：\n\n一、巧妙的情节构思和结构布局\n\n《羊脂球》写一个妓女拒绝伺候侵略军官和由此引发的尖锐矛盾。小说把不同阶级、不同社会背景、不同性格的十名旅客安置在一辆马车上，通过他们的首程赶路、中途歇脚、重新上路这三段结构来展现情节，并且，以饥饿为开端，又以饥饿作结，布局设计巧妙别致。\n\n二、语言准确生动\n\n首先，《羊脂球》语言简明准确，往往以短小的篇幅，少量的文字，完整地、准确地、鲜明地表现一种现实、一个事件、一种性格、一种状态。如为了刻画国民自卫军的无能，仅通过开枪打死自己的哨兵等寥寥几笔，就把胆小如鼠、怯弱无能的自卫军的丑恶嘴脸淋漓尽致地描绘出来了。\n\n同时，小说也做到了人物语言个性化，人物的语言都严格地符合他们的身份、教养和性格特点。如乌先生出身低微、缺乏教养，只有他能说出“他奶奶的”这样粗鲁的话。\n\n三、注重肖像描写\n\n《羊脂球》在人物刻画方面，注重细致的肖像描写。如对妓女羊脂球的肖像描写，就抓住了一些极富特征的特点，她身量矮小，胖得“十个手指头也都是肉鼓鼓的，只有骨节周围才凹进去，好像箍着一个圆圈，颇像是几串短短的香肠”；她的脸上“睁着两只非常美的大黑眼睛，四周遮着一圈长而浓的睫毛，睫毛的阴影一直映在眼睛里”。除了主角之外，像是“身量很矮小，挺着一个大皮球似的肚子”的奸商乌先生、“满脸都是麻子”的老修女等人，作者都抓住其外貌上的突出特征，将他们刻画得活灵活现。\n\n四、多层次、多侧面、多角度的对比手法\n\n在对比方面可以说《羊脂球》突破了固有的传统对比方式，而是全方位、多侧面，通过多个人物的纵横交错来进行对比，正反两面的对比贯穿于全篇文章。此外，还有人物自身的表里对比、前后对比，以及同类的互相对比等。作者通过一个个反差极大的对比，使下层人士的不畏强暴的爱国主义精神和极富同情心的人道主义精神，以及上流社会人士的极度自私和寡廉鲜耻的丑恶灵魂跃然纸上。","keywords":"巧妙的情节构思和结构布局 描写手法多样 艺术手法各异 人物语言个性化 注重肖像描写 对比手法","note":"《羊脂球》是法国“短篇小说之王”莫泊桑的成名之作和代表作。小说在具有讽刺性的对比手法的娴熟运用上、语言运用的简练与细腻上都显示了很高的艺术成就，具有重要的学习借鉴意义。相关内容可以参考王佳红《浅谈＜羊脂球＞的艺术成就》，具体资料可以在李凡文学正版群内领取。"},{"id":"216","stars":"★★★","title":"试比较契诃夫和莫泊桑短篇小说创作的异同","body":"法国的莫泊桑和俄国的契诃夫是19世纪后期到20世纪初活跃于文坛并以其各自创作的短篇小说闻名世界的文学大师。他们的短篇小说有许多相似之处，然而，不同的国度、不同的社会历史环境以及不同的文学观念又使这两位作家的作品各呈异彩，可谓同中有异，异中有同，这主要表现在：\n\n一、都在继承现实主义的基础上对现实主义进行超越，但具体取径不同\n\n莫泊桑是在福楼拜的直接哺育下成长起来的。客观、真实、自然是莫泊桑追求的第一目标。在这一点上，契诃夫与莫泊桑十分相似，他为自己的艺术品提出六条标准，其中真实性、客观态度和独创精神是他的现实主义文学思想的核心。\n\n莫泊桑和契诃夫既是现实主义的继承者、捍卫者，又是某种程度的反叛者。莫泊桑是左拉的朋友，“梅塘集团”的成员，他对左拉的自然主义，既有清醒的认识，又潜移默化地接受了它的影响。自然主义的精髓是“自然环境”决定论和人的遗传学、生理学观点。莫泊桑在他的短篇小说《一个儿子》里，就使用了遗传学的观点。契诃夫走出传统模式的途径则和莫泊桑不同。由于契诃夫生活在两个世纪的交合点上，他一方面接受了19世纪俄国文学传统的熏陶，另一方面又感受到20世纪新的文学观念的冲击。因此，在契诃夫的小说中时时透露出一些现代意识。他的有些小说已经不再刻意追求情节和人物性格塑造。他要追求和捕捉的是人物在特定场合产生的某种特定的情绪，人物在一瞬间产生的微妙的精神活动或是客观事物留给作者一瞬间的印象。\n\n二、都揭露与批判现实的黑暗面，但思想容量不同\n\n莫泊桑对资本主义社会现实中的阴暗面的批判、揭露是毫不留情的，有些作品也达到了相当的深度，如《羊脂球》《橄榄园》《遗嘱》等等。契诃夫更是十分强调作家的社会责任感，强烈的社会责任感促使契诃夫对灾难深重的俄国的各种社会问题不断进行思索、探讨。他的那些写得最深刻最优秀的小说，如《第六病室》《带阁楼的房子》等，没有一部不是探索社会问题的。\n\n不过，莫泊桑短篇小说的思想容量不如契诃夫小说那样大，他缺少的也正是像契诃夫那样对社会问题深邃的哲理性的思索。莫泊桑在自己的短篇里，总是满足于叙述故事，呈现图景，刻画性格，而很少对生活进行深入的思考。他的短篇从来都不具有隽永的哲理或深蕴的含义，他在其中要表现的思想往往是显露而浅明的。相较之下，契诃夫避开了对社会黑暗现实一般性的揭露，而是把笔触深入到人物的心灵深处，挖掘他们对社会改革进程的理性思考，这无疑是更加深刻的。\n\n三、都注重小说叙事结构，但具体风格不同\n\n莫泊桑短篇小说的结构艺术主要表现在他说故事的技巧上。他通过自己的艺术实践，开创了短篇小说多层次、多角度的叙事结构。他的短篇小说，很少是由一个人称叙述到底的。他最常用的一种结构方式是大故事里套小故事。这种复杂的叙事结构，在《一个诺曼底人》里得到充分的体现。契诃夫从莫泊桑那里借鉴了简洁、精练地表达思维的技巧，在叙事结构上也\n\n经常采用多角度、多人称的叙述。\n\n不过，在具体风格上，两人显露出了很大的区别。莫泊桑以巧妙的艺术构思见长。莫泊桑的小说有独具匠心的构思、跌宕起伏的情节、出乎意料的结局。他常工于构思又擅于描摹自然真实，并能使两者和谐地统一起来。契诃夫则不是这样。他的作品多用灰暗的笔调，白描的手法去描写停滞的、令人窒息的社会生活。他笔下的生活场景平静而近乎散文式的抒情写景，故事情节平缓而趋于淡化，往往靠平淡无奇的故事来反映庸俗、乏味的社会生活。\n\n总之，契诃夫和莫泊桑同为世界短篇小说大家，通过各自的文学实践，为世界短篇小说的发展作出了巨大的贡献。","keywords":"对现实主义进行超越 具体取径不同 揭露与批判现实 思想深度不同 注重小说叙事结构 具体风格不同","note":"莫泊桑与契诃夫同为短篇小说大家，同样在继承现实主义的基础上进行超越，创作时期也大致相当，同时莫泊桑也对契诃夫的小说创作产生了很大的影响，因而很难不被放在一起进行对比。在进行对比时，可以结合二人的代表作品、创作时间和具体国情进行分析。相关内容可以参考李辰民《契诃夫、莫泊桑、欧·亨利短篇小说比较研究》，资料可在李凡文学正版群内领取。"},{"id":"217","stars":"★★","title":"试述波德莱尔的艺术观","body":"波德莱尔的艺术观令人瞩目，主要表现在以下方面：\n\n一、以丑为美，化丑为美\n\n波德莱尔将传统的属于“丑恶”的对象，纳入了审美表现的范畴中。波德莱尔对美的理解与浪漫主义的“华彩之美”迴然有异，它是一种丑恶的美、病态的美、痛苦的美。波德莱尔不认为丑恶事物就是绝对的丑，而是认为丑中有美。他指出：“自然是丑恶的”，自然事物是“可厌恶的”“平庸的”；自然景色是丑的、“邪恶的”；罪恶“天生是自然的”，“相反，美德是人为的、超自然的”。这种美学观点是20世纪现代派文学遵循的原则之一。\n\n二、通感理论\n\n在波德莱尔看来，大自然是一个神秘的、有生命的整体。万物之间、人与自然之间以及人的各种感觉之间，都有着某种难以明言的联系，都能够产生某种特殊的感应。诗人就是要捕捉这种感应，或者说通过这种感应去把握表象背后的未知，去开掘精神化的内在美。诗人能理解自然。因为自然同人相似；树木是活的柱子，发出含含糊糊的语言。诗人在各种感觉中看到宇宙的可感反映。波德莱尔区分了两种现实：自然的，即物质的现实，这只是表面；精神的，即内在的现实，他认为这是宇宙起源的基因。他由此指出不同感觉之间有通感：“香味、颜色和声音在交相呼应。”诗歌同别的艺术也是相通的，亦即可以用色彩和声音去表达感情。\n\n三、以象征手法表现通感\n\n象征是由自然提供的物质的、具体的符号，也是具有抽象意义的负载者由此达到更高的、精神的现实。波德莱尔认为诗人能破译这些象征符号，穿越象征的森林，把“地上和天上的生活展示的无穷场景暗示的梦幻”揭示出来，“译解好奇的人类所进行的永恒的猜测”，译解自然界与人类社会这部谜一样的“天书”。象征的含义是丰富的、复杂的、深邃的，具有哲理性，这是借有形寓无形。象征手法丰富了挖掘人的精神世界的手段。\n\n四、散文诗的形式\n\n波德莱尔力图解放诗歌的形式，他注意到散文诗这种刚出现的文学样式：“这种散文是诗意的，没有诗韵和节奏，相当灵活，对比相当强烈，以致能适应心灵的抒情冲动，适应梦想的起伏和意识的跳跃。”他认为散文诗是介于诗歌和小说的一种文学体裁，能将诗歌的节奏美、音乐美与小说反映真实的自由结合起来，兼有两者之长。它的主要目标同样是要发掘内心世界。","keywords":"以丑为美 化丑为美 通感理论 以象征表现通感 散文诗的形式","note":"波德莱尔的诗歌创作理论对象征派产生了很大的影响，可以说是象征派诗歌的理论基础，在文学史上占有十分重要的地位，因此许多学校在针对波德莱尔作考查时也会考查其创作主张，相关内容大家还是要了解一下的。"},{"id":"218","stars":"★★","title":"试分析《恶之花》的思想内容","body":"《恶之花》既是资本主义社会的“恶之花”，也是诗人心灵的“恶之花”，是波德莱尔对自身大胆的解剖和真诚的告白，主要包括了以下内容：\n\n一、表现巴黎这座大都会的丑陋\n\n波德莱尔否定以善为内容，而主张以恶为内容；以丑为美，化丑为美，表现自然景色的丑陋和人内心的丑恶，发掘恶中之美。《恶之花》标题中的“恶”字，法文原意不仅指恶劣与罪恶，也指疾病与痛苦。波德莱尔第一次把大都会的生活和丑陋事物带进了诗歌王国，在诗集中大量描写了巴黎这座大城市“丑陋”的人、事、物：落魄的女乞丐、孤独的老人、辛勤的农夫以及在无尽的黑暗中踽踽独行的盲人等底层人民，以及爬满了蜛虫的腐尸、吸血鬼这些令人恶心和厌恶的事物。波德莱尔从这些“丑”的人事物中寻找和发掘美，要让这些“恶”开出美的“花”，试图在丑的世界中，构建起自己理想中美的王国。\n\n二、展示个人的苦闷心理，表现小资产阶级青年的悲惨命运\n\n在《恶之花》中，波德莱尔集中描绘了忧郁的精神状态。诗集第一部分《忧郁和理想》有四首诗以“忧郁”为题，集中描写忧郁；诗中充斥着“忧郁”“忧伤”“痛苦”“厌倦”“虚无”等词。诗人在忧郁的精神状态中，在丑陋的世界里寻求美，实现自己的理想。然而，美却冷冰冰地像一个“石头的梦”，不哭不笑不动，如一尊古代的雕像；诗人遍尝虚无的滋味，看不到希望的光芒，连爱情也不能滋润他的心灵，最后只能到死亡中去寻求安慰和解脱。《恶之花》写出了19世纪中期法国小资产阶级青年找不到出路而陷于悲观绝望的心境，表现了当时法国青年犹如患世纪病一般的苦恼和忧愁。\n\n三、表现了诗人追求美与理想的曲折历程和悲怆的内心感受\n\n《恶之花》第二版分为六个部分：《忧郁与理想》《巴黎风貌》《酒》《恶之花》《叛逆》《死亡》。第一版没有《巴黎风貌》，只有五部分。第三版仍为六部分。诗集中的诗不是按写作年代顺序排列的，而是按诗人要表达的主旨重新组合编排。诚如作者所言，《恶之花》“是一本有头有尾的书”。它具有一以贯之的主题思想，表现了孤独、病态的诗人，在光明与黑暗、现实与虚幻、灵与肉之间的痛苦挣扎，上下求索，不断追求美与理想的曲折历程和悲怆的内心感受。","keywords":"大都会的丑陋个人的苦闷心理 小资产阶级青年的悲惨命运 追求美与理想的曲折历程 悲怆的内心感受","note":""},{"id":"219","stars":"★★★","title":"试分析《恶之花》的艺术特征","body":"在艺术上，《恶之花》独辟蹊径，取得了很高的成就，具体表现在以下方面：\n\n一、使用通感手法\n\n波德莱尔指出：“一切，形态、运动、数量、色彩、香气，无论在自然界还是在精神界，都是富有含义的，相互作用的，相互转换的，相通的。”波德莱尔借助于嗅觉、视觉和听觉等感官，将香气、色彩和声音融合在大自然这座庙宇里，写出了大自然神秘而覆盖万物的气息。这种通感手法的成功运用，使波德莱尔的诗歌中人的精神感觉与自然物质世界达到奇妙而完美的融合与沟通。此外，在波德莱尔笔下，诗歌可以同版画、绘画、音乐、雕塑相通，在《灯塔》中，达·芬奇、米开朗琪罗等大画家的作品在诗人眼里呈现出光怪陆离的意象，它们与物质世界是相通的，通过这些意象，诗人写出了各位大画家的作品特点。\n\n二、大量使用象征手法\n\n《恶之花》中的诗，无论写景状物、表情达意都采用象征手法。诗人通过大量的象征、暗示、隐喻、典故等，使人与自然、精神与物质相互象征、相互感应、相互阐释，从而形象地、生动地表达诗篇深刻的思想内涵，给人以诗意无穷的艺术享受。如《猫》（之一）既是写猫，又是写女人，是借用猫的意象来表达对妻子又爱又恼的复杂感情。《香水瓶》则是一首奇特的爱情诗，诗人把自己比作老旧肮脏而又余香犹存的香水瓶，借用香水瓶散发出来的“强烈的芳香”，象征诗人对心爱的女人强烈的感情。和其他诗人从大自然去寻找意象不同，波德莱尔常常将意象颠倒使用，如“低垂沉重的天幕像锅盖”，而不是锅盖像天空。这种手法以奇取胜，给人以局促、憋闷的感觉，产生了一种压抑感。\n\n三、语言极为精辟\n\n波德莱尔是个典型的苦吟诗人，讲究字酌句斟。他既能为表现出精神的痛苦而写得低回婉转，一唱三叹，又能为抒发对理想和光明的向往而写得轻松、简洁、明快，像蝉翼在阳光下震颤；他像画家，把诗写得富有质感和立体感，还可以惟妙惟肖地表现出事物的细节的真实。同时，波德莱尔反对写长诗，认为浪漫派滔滔不绝的诗歌不够精练。他重新挖掘十四行诗，使之发出新光彩。这些特点，在《恶之花》中都体现了出来。\n\n20世纪欧美现实主义文学","keywords":"通感手法象征手法 语言精辟","note":"《恶之花》体现了波德莱尔对“现代性”的艺术诉求，具有强烈的现代意识。波德莱尔所开创的理念与手法，诸如通过物质世界来表现人的精神状态的创作理念、以丑为美、在丑中发掘美的表现方式、通感和象征手法的运用等，为后来** --- 的意象派等诗歌流派所继承。正是在这个意义上，波德莱尔被视为现代派的鼻祖。所以，《恶之花》的思想特征与艺术特征结合起来，就是“《恶之花》的现代性”这道题的答案，大家要注意灵活应对。"},{"id":"220","stars":"★★","title":"20世纪欧美文学的人文观念有何变化","body":"两次世界大战的爆发，既改变了世界的政治格局，又在人们的思想上带来了重大变化。上帝死了，也即理性死了，非理性得到发展。科学技术突飞猛进，物质财富极大兴盛，人被物所排挤，在20世纪这种新的精神文化氛围里，欧美文学的人文观念表现出了与传统文学的重大差异。\n\n一、非理性人本意识\n\n20世纪文学，特别是现代主义倾向的文学，蕴含的是一种非理性人本意识，它是对传统的以理性为核心的人本意识的一种反拨，也显示了欧美文学在人文观念上的新发展。无论是现代主义还是现实主义倾向的文学，都更注重对人的内心世界作形而上的探索，并往往以荒诞的形式加以表现。20世纪文学特别是现代主义倾向的文学，则把传统文学业已表现的理智与情感、理性与本能欲望、灵与肉、善与恶等二元对立的母题推向深入甚至走向极端，视人的非理性为生命本体，人也就不再是“理性的动物”，而是“非理性的动物”，“人”的形象失去了传统文学那种崇高美，从而沦为“非英雄”或“反英雄”。\n\n在20世纪文学中，“理性”拥有了更广泛的内涵，它往往指抑制人的生命意志（特别是非理性）的一切有形和无形的力量，它被描绘成罪大恶极的刽子手，是荒诞的、不讲理的、总是与人作对的神秘力量。如卡夫卡小说中将人变成“甲虫”，使人无法到达“城堡”的神秘力量，海勒笔下不讲理的“第二十二条军规”等等，都是“理性”力量的具体表现形态。许多作家都站在反理性的立场上描写神秘的非理性和潜意识冲动给人带来的自由感，这就是20世纪文学频频描写病态、畸形、性冲动、死亡、梦境、幻觉、长篇独白、内心回忆、白日梦、痴人梦等内容的重要原因。因此，在20世纪文学，尤其是现代主义倾向的文学中，已很难听到以往文学中那种对人性美的赞歌，这正是欧美文学人文观念转型的表现。\n\n二、人在物面前的软弱与渺小\n\n在20世纪文学中，“物”被泛化为包括金钱、物质财富、科学技术、社会存在等多方面内容在内的整个物质世界，人与物的对立也被泛化为人与除了精神世界之外的整个现代化物质文明的对立，人处在被文明普遍异化的状态之中。而且，以往的传统文学在表现人与物、人与自然的关系时，着重展示人对来自“物”的异化的抵御与不接受，人虽然被物质文明这一异己力量捉弄与吞噬，但依然相信人自身的理性力量，因而仍保留着几分乐观与浪漫。而20世纪西方文学在表现人与物的关系时，着重表现人在物面前的无能为力和恐惧感，人已完全被物支配，物质世界已抛弃了人类，人处在一个难以理喻、无法把握和解释的陌生世界，人自己蜕变成了物，世界是荒诞的、非理性的，人类的生存失去了意义。在艾略特的《荒原》中，物质世界使人的精神世界毁灭。奥尼尔《毛猿》中的扬克象征着物质文明挤压下痛苦地寻找自身归属的现代人。品钦和冯尼格特的小说揭示了科学技术导致人类自我毁灭的悲剧。总之，20世纪文学中表现了人在物面前的软弱与渺小，人的主体性、人的心灵被“物”挤占后成了“空心人”，人被自己创造的文明异化了。因此，20世纪西方文学表现的人与物质文明的矛盾，归根到底是人的生命本体与物质存在、科学理性之间的矛盾；人对物质文明与科学理性的反抗，就是对人性的一种维护，其深层蕴含着非理性人本意识，表现了一种新的人道原则。\n\n总之，20世纪欧美文学在人本意识上的变化，说明了20世纪欧美作家在“人”的问题的探索上的创新与深化，表明了西方文学人文观念的发展进入了新阶段。","keywords":"非理性人本意识 人在物面前的软弱与渺小","note":"从古希腊文学开始，人文观念就一直贯穿西方文学的发展，20世纪受到科学、战争、哲学的影响，西方的人文观念也出现了一些新的变化，最突出的就是非理性色彩。这道题考试直接考查的可能性不大，更多的是让大家作为背景知识了解。"},{"id":"221","stars":"★★★★★","title":"20世纪欧美现实主义文学基本特点","body":"一、思想特点\n\n（一）受社会主义思想影响\n\n十月革命和国际无产阶级革命运动的蓬勃展开，使20世纪的现实主义作家不同程度地受到了社会主义思想的影响，使他们对现实有了更为深刻的认识，批判意识进一步增强，常常从阶级观念或社会主义思想角度观察社会问题，描绘社会现实。\n\n（二）借鉴19世纪现实主义文学经验\n\n许多作家继承了19世纪现实主义文学的创作经验，力图全面反映一个时代的社会生活。他们或者以当代社会为对象，或者对历史进行再认识，充分展开社会背景的描绘。有的作家从一个家族的荣枯变迁去反映整个历史时代的变化，得到了以小见大的效果。有的作家索性将视野局限在一两个家庭中，描写其中各式各样的人物，以此表现社会变化。\n\n（三）内容多表现无产阶级的生活和斗争\n\n无产阶级的贫困化与资产阶级的财富迅速增长，成为20世纪上半叶社会生活的突出现象。工人的斗争变得更有组织，他们的罢工从由经济考虑出发的运动发展为带有政治性质的运动，而且与世界各国无产阶级的斗争结成一个整体，相互支持，相互促进。这种变化必然进入现实主义作家的视野之中。\n\n（四）战争或反法西斯成为一个重要主题\n\n两次世界大战使人们更深刻地认识到战争的灾难性后果，战争或反法西斯成为文学的一个重要主题。有许多现实主义作家关注战争对人类文明的极大破坏性，表现一代人难以痊愈的心灵创伤，谴责战争的邪恶，呼吁和平、良知、人道，如海明威、雷马克、伯尔等作家。\n\n二、艺术特点\n\n（一）频频出现“长河小说”\n\n“长河小说”即多卷集长篇小说，它虽然由多部小说组成，但以一个家庭或一个家族为线索。这种小说能够深入地反映每个历史时期的变迁，更为集中精练，内涵丰富，容量更大。“长河小说”深得现实主义作家的喜爱，20世纪上半叶，长篇小说的繁荣与此密切相关。\n\n（二）受现代主义思潮影响\n\n（1）由于受到现代主义思潮的影响，20世纪的现实主义作家们更倾向于对人物的心灵世界进行开掘，他们的创作明显表现出内向化、主观化特征，心理描写的手法更为丰富。他们也不时探索人物的潜意识，以反映人物完整的内心世界。\n\n（2)20世纪的现实主义作家对现代主义的其他表现技巧，诸如内心独白、梦幻描写、时序颠倒、象征手法、荒诞意识、多层次多角度描写等，都有所吸取，并借鉴其他艺术形式如电影、电视、新闻报道的艺术表现技巧与手段。\n\n（3)20世纪的现实主义作家越来越淡化情节和典型人物的塑造。他们往往描写某一种社会现象、某一种社会心理、某一种犯罪动机，更注重心理变态的描写，而不是情节的曲折。这是向现代主义学习的结果，与传统现实主义有显著不同。","keywords":"社会主义思想19世纪现实主义文学 无产阶级 战争和反法西斯 长河小说 现代主义思潮 内向化主观化表现技巧 淡化情节和典型人物的塑造","note":"整体来讲，20世纪的现实主义文学最突出的特征就是在思想上受到了战争和社会主义的影响，在艺术上则更多受到现代主义的影响。这也使其同19世纪的现实主义相比出现了一些新变化，这是一个常见的命题点。此处涉及的“长河小说”常考查名词解释，大家要注意积累。"},{"id":"222","stars":"★★★★★","title":"谈谈20世纪现实主义文学与19世纪现实主义文学的异同","body":"20世纪现实主义文学是对19世纪现实主义文学的继续和发展，二者有同有异：\n\n一、人文观念方面\n\n20世纪现实主义文学继承了19世纪现实主义文学人道主义精神内核。19世纪现实主义文学以人道主义思想为武器，深刻地揭露与批判社会的黑暗，同情下层人民的苦难，提倡社会改良。20世纪出现在现实主义作品中的人道主义，有师承传统的一面，一些作家担负着人类精神理想的使命，褒扬美、善和爱，并以此为基准，抨击现实社会中的丑恶和压抑人性、压抑个性发展的物质环境，如罗曼·罗兰、高尔斯华绥、托马斯·曼等。\n\n另一方面，20世纪现实主义作家又将人类看作一个整体，反思人类本身固有的缺陷，在社会、文化、存在各个层面上进行自我质询，探讨世界的未来前景，哲学思辨性增强，具体社会背景相对减弱，如法朗士、索尔·贝娄、戈尔丁、布莱希特等。\n\n二、创作方法和原则方面\n\n总体上看，20世纪现实主义文学承袭了19世纪现实主义文学的创作方法和原则。20世纪现实主义一般也都有较为完整的情节系统，明晰的人物形象和清晰的语言。多数作品依然重视刻画细节的真实性，作家们力图全面反映一个时代的社会生活，以当代社会为对象，或者对历史进行再认识，充分展开社会背景的描绘。\n\n但19世纪现实主义强调客观真实地反映生活，而20世纪的现实主义文学更多地表现出对人物内心世界的发掘，发展了内倾化倾向。外在世界不再是作家直接描写的对象，而是通过人物的复杂感受和独特视角逐渐展现出来。有不少作家采用第\n\n一人称视角，使作品呈现出一个喧哗的内在宇宙。这使得20世纪现实主义文学在风格上呈现出更多的细腻、精微和繁复。从继承的角度来看，他们多取法于司汤达、托尔斯泰、陀思妥耶夫斯基这些具有内倾化特点的古典作家。\n\n三、艺术表现方面\n\n19世纪现实主义主要继承了传统的表现手法，以叙事、描写、抒情为主，在科学主义思想影响下，19世纪的作家都企图通过文学创作去研究与分析社会，社会也要求文学真实地反映生活，回答时代和生活提出的一系列问题。在这种精神文化条件下，叙事性的小说就具有显著的生存与发展优势。\n\n20世纪现实主义则更多地吸收了现代主义的表现方法，很多现实主义作家接受了诸如象征、隐喻、时空倒错、自由联想和内心独白等手法，意识流的运用更为普遍。小说体裁方面也具有创新性，创造了多卷本“长河小说”和“音乐小说”的形式。各种手法的融汇使用，刷新了现实主义这一传统流派的面貌，使之具备了20世纪的现代特色。\n\n四、人物塑造方面\n\n19世纪现实主义重视典型人物的塑造，现实主义作家接受自然科学和唯物主义哲学的影响，认为人是社会环境的产物。在创作中，他们主张通过对典型环境中的典型性格形成过程的描写，全面真实地展示现实生活及其本质特征，反映整个时代的风貌。\n\n20世纪现实主义则更加关注普通人的塑造，将主人公置于平庸的社会风气或堕落的文化环境中予以表现，以此反映人物的不幸，较少将其塑造成高大的英雄形象。\n\n五、表现内容方面\n\n19世纪现实主义文学的描写内容比较广泛，涉及社会各个方面。\n\n20世纪现实主义则加大了对战争的反映，表现了反战和反法西斯的主题。","keywords":"人文观念 创作方法和原则 艺术表现 人物塑造 表现内容","note":"20世纪的现实主义文学由19世纪现实主义文学发展而来，因此继承了现实主义文学的许多特点，其与19世纪现实主义文学不同点主要受到时代背景的影响，也与文学自身的发展有关。总体而言，19世纪现实主义文学的成就高于20世纪现实主义文学。"},{"id":"223","stars":"★★★","title":"“迷惘的一代”小说创作的艺术特征（26北京语言大学）","body":"“迷惘的一代”小说犹如一部部全面、生动而又真实地记载美国战后一代精神危机的艺术百科全书，这些小说的蓬勃发展对英美现代主义文学的繁荣，起到了十分积极的促进作用。这些小说的艺术特征，主要表现在以下方面：\n\n一、以客观的形式表达对人主观世界或精神世界的探索与挖掘\n\n与19世纪现实主义小说不同的是，“迷惘的一代”小说不再把反映和摹写外部世界的现实作为自己的任务，而转向了对人的主观世界或精神状态的探索与挖掘。然而尽管他们反映的是主观，却极力用客观的形式去表达。小说的叙述者也不再无所不知，而往往是故事的主要人物，如《了不起的盖茨比》中的尼克·凯洛威、《太阳照样升起》中的杰克·巴恩斯等。\n\n二、非连续性结构、碎片式描写和高度实验的语言表达\n\n在写作手法上，“迷惘的一代”小说摈弃现实主义小说以塑造人物性格为核心、以情节为主体的结构框架，以及开头一发展-高潮一结局的传统套路，而是以非连续性结构、碎片式描写和高度实验的语言表达为基本特征，以象征与传统的决裂，突破传统现实主义小说正常的时间和空间结构，从根本上否定事件发展的连贯性和线性因果关系。不连贯与非逻辑时序能够表现出连续讲故事方式所达不到的效果。“迷惘的一代”小说在写作手法上另一个特点是没有以往常有的解释、评论和总结，有的是种种能调动读者视觉、听觉、触觉的意象和细节的堆砌。它经常留出许多空白让读者去填补，因此使阅读更具挑战性和新鲜感。\n\n三、“非文学性”材料的大量使用\n\n与传统小说相比，“迷惘的一代”小说似乎更具包容性。许多以往不登大雅之堂的“非文学性”材料以及为社会敏感或禁忌的东西都有大胆表现，如海明威和菲茨杰拉德的作品中都有较直露的性描写以及对思想开放的“新女性”的反感和贵难。此外，通俗文化、广告、电影等素材也被请入文学作品，以故意制造出一种与传统小说叙述语言不协调的效果，如《了不起的盖茨比》中宴会上的音乐、笑声等等，一片乌烟瘴气，模糊不清，充分表现出众人无聊、无望和无奈的情状。\n\n四、各种形式主义技巧的广泛运用\n\n对各种形式主义技巧的广泛运用，是“迷惘的一代”小说另一突出特色，使得美国现代主义文学更加灿烂夺目。沃尔夫的作品在写实的基础上采用了抒情与象征的手法，融三者于一体。整个作品包含着强烈的感情，在写实的层面上郁积着浓重\n\n的抒情气氛，使作品呈现出多彩多姿的风貌。帕索斯讲究叙述风格，用不同的形象对比达到讽刺效果，具有一定的内涵，增添了人物描写的深度。而海明威则以其独特的电报体语言风格和文件记录式的情节描写，为1920年代的美国小说创作带来新鲜的活力，其小说创作的“冰山理论”更是被众多批评家、作家及读者推崇备至。菲茨杰拉德以描写战后的精神危机享有盛名，他的小说《人间天堂》和短篇小说集《爵士时代的故事》反映了20世纪20年代美国青年追求美国梦的幻灭，其文笔凝练，以印象主义手法描述细节，作品充满各种意象，具有非比寻常的艺术内涵。\n\n“迷惘的一代”小说不仅在一定程度上满足了一部分青年知识分子的创作欲望，而且也充分反映了文学发展的基本规律。它的崛起揭开了英美现代主义文学的新篇章。","keywords":"客观的形式 探索与挖掘 非连续性结构 碎片式描写 高度实验的语言表达“非文学性”材料 形式主义技巧","note":""},{"id":"224","stars":"★★★","title":"为什么说劳伦斯是一个处在传统与现代交接点上的作家","body":"无论在思想还是艺术上，劳伦斯都是一个处于传统与现代交接点上的作家。\n\n一、在思想上，劳伦斯既继承现实主义文学的批判传统，又跟现代主义文学精神相联系\n\n劳伦斯批判了资本主义社会和文化，继承了现实主义文学的批判传统，但同时，他又从高扬人性与生命本能的角度提出了解决社会问题的方法，与现代主义的文学精神保持了联系。他的小说对生活的描写，一方面真实地再现了现代资本主义社会中人的外部生活和物质形态；另一方面又观照人性、人的自然本能和精神状态，努力展露在自然本能驱使下人物的心理与情绪状态，具有现代小说的那种心理探索的内倾性特征。\n\n二、在艺术上，既有传统小说的特点，又出现了现代小说的特征\n\n（一）劳伦斯小说的结构呈现出由历时结构向共时结构的转变，既有传统小说的情节性、故事性，又不完全具有传统小说情节的节奏感、完整性和清晰度，而且还出现了情节淡化和暗示性等现代小说的特征。\n\n（二）劳伦斯在真实反映生活的同时，又重视对人物心理和本能的挖掘，大量运用象征，表现出现代主义文学的艺术特征。在他的作品中，一切大自然现象几乎都被赋予了人类精神之灵光。在劳伦斯笔下丰富而复杂的象征物中，有的具有传统象征的那种明确而稳定的寓意，有的则是非直指式的，象征物除了具有基本稳定、明确的象征意义外，又蕴含了深刻而含蓄模糊的心理、情绪和形而上的抽象意义。在这类象征描写中，劳伦斯的主要目的，是用自然物象和景致来暗示人的某种心灵隐秘，借以沟通物我，表达人的心灵在自然力启迪下的某种顿悟、反响和心态、情绪与意识的细微变化。这类象征具有传统文学不曾赋予的美学特征。","keywords":"现实主义文学的批判传统 现代主义文学精神 传统小说 现代小说** 历时结构 共时结构 象征","note":"劳伦斯虽然是一名现实主义作家，但同时代的现代主义文学也深深地影响到他，这既表现在其作品的思想内容上，也在艺术表现上体现出来，他的创作融合了现实主义与现代主义的突出特点，因此说他是一个处在传统与现代交接点上的作家。"},{"id":"225","stars":"★★★★","title":"论述劳伦斯长篇小说《虹》在思想和艺术上所取得的成就","body":"《虹》是英国著名小说家劳伦斯的代表作。小说通过一家三代人的生活经历，描写了英国从传统的农业社会向工业社会转变的过程，同时以巨大的热情，深度探索了有关两性的心理问题。在思想和艺术上均取得巨大成就。\n\n一、思想成就\n\n《虹》具有社会批判和个人心理探索的双重主题。\n\n（一）它通过一家三代人的生活经历，追述英国从传统的乡村社会到工业化社会的历史进程，揭示19世纪后半期深刻而巨大的社会变化，对残酷的、毁灭人性的大工业文明进行猛烈抨击，对社会体制、国家机器及其价值体系进行了全面的审视与质疑，对其压抑人性和破坏人与人之间自然和谐关系的罪恶提出了强烈抗议。其批判无疑具有重要的社会意义。\n\n（二）它又是一部探索个人的精神成长与心灵历史的作品。通过布朗温家族三代人，尤其是厄秀拉对爱情、婚姻与人生的探索，表现了现代人的困惑与挣扎，反映了人们希望挣脱精神枷锁、建立和谐的两性关系、追求新生活的强烈愿望。\n\n二、艺术成就\n\n（一）由现实主义向现代主义转变，表现出由外向内转的趋势。小说一方面真实地再现现代资本主义社会的客观生活和物质形态，另一方面又热衷于描绘在自然本能驱使下人物的心理与情绪状态。小说既具备一定的情节性和故事性，又淡化了个人生活史中各个具体事件间的联系，而突出心灵和精神上的联系，具有现代小说心理探索的内倾性特征。\n\n（二）在结构上，呈现出历时的时间结构与共时的空间结构的融合。小说整体采用传统的“历时式方法”，按照事件发生的先后次序叙述布朗温家族三代人的生活和情感经历。但是三代人对两性关系的心理体验，以及这些体验的对照，又使得小说的内在心理共时结构得到突出。\n\n（三）丰富的象征与意象。劳伦斯喜欢用象征手法去表现人的心理情绪，一切大自然的现象在他的作品中几乎都被赋予了人类精神之灵光。“虹”是小说中最重要的象征之一，它穿行于三代人的婚姻追求之中，并在每一代人的故事尾声时清晰地奏响。\n\n（四）采用特殊的词语和隐喻。劳伦斯常常采用一些特殊的词语和隐喻探索人的无意识领域的活动，表现人的非理性冲动和联想，如“他发出耀眼的光芒，缓缓地向前移去，以获得生命的尽端”等。","keywords":"社会批判个人心理探索 双重主题 向内转 历时的时间结构 共时的空间结构 象征与意象 特殊词语和隐喻","note":""},{"id":"226","stars":"★★★","title":"罗曼·罗兰创作的艺术特征","body":"罗曼·罗兰一生留下20多个剧本，5部小说和10多种传记文学作品。作为20世纪法国最伟大的现实主义作家，罗曼·罗兰的艺术创作，主要包括以下特征：\n\n一、内倾性倾向\n\n罗曼·罗兰属于内倾性的现实主义作家，继承了19世纪司汤达、托尔斯泰一派注重表现内心世界的写作传统，善于描写个体生命的成长历程和精神探索。其作品一般都有大的情节框架，但更多的内容不是讲述故事，而是描绘人物的内在精神生活。他特别擅长描绘那些具有“伟大的心灵”的不平凡人物，赋予其汹涌澎湃的内在生命节奏，展示他们孤独奋斗中喧哗的生命河流。\n\n二、人道主义精神\n\n罗曼·罗兰的一生适逢两次世界大战，作为一位真正的人道主义作家，他在作品中一以贯之地赞扬真善美，热爱生命、热爱人类；同时作为一位活跃的社会活动家，他站在人类文明与幸福的高度，反对战争，宣传和平，一生不倦地追求真理。他的一生为世界和平与文化的进步作出了卓越贡献。\n\n三、作品气势宏大，开“长河小说”之先河\n\n罗曼·罗兰往往在一部小说中，通过一两个人的一生经历去反映一个时代的变迁，这就发展了19世纪现实主义作家通过一整套小说去反映时代的写法。罗兰认为，生活就像一条长河那样，连续不断地流动，小说也应反映这种丰富、博大、不停发展的状态。这种“长河小说”，气势雄浑，具有史诗的规模。同时，发展脉络清楚，一气呵成，从结构土来说显得更为完整。\n\n？27．《约翰·克利斯朵夫》的艺术成就★★★\n\n一、真实反映了当时欧洲社会现状\n\n（一）小说描写了一个音乐家的一生。除了德国，主人公还到过法国、意大利、瑞士。当时，欧洲的主要工业国家已发到垄断资本主义，社会矛盾日益加剧，人们的精神面貌也发生了重大变化。小说首先通过主人公的经历去反映这种状况。寸当时的政治事件、革命斗争和工人运动的关心和同情，使罗兰感受到时代跳动的脉搏。小说的描写使读者感到当时的欧洲里伏着深重的政治社会危机。\n\n（二）小说描写了资产阶级的文化和精神的堕落。文化和精神的颓废沉沦是垄断资本主义时代的显著特点之一，小说的\n\n反映是入木三分的。罗兰明知这样描写要得罪不少人，他说：“我攻击了太多的人，以致要被他们的报纸和沙龙乱咬一阵。”然而罗兰感到自己必须说出真相。\n\n（三）小说描写了战争在笼罩欧洲上空的严重威胁。这场战争从19世纪末已经投下了阴影，20世纪初这种歇斯底里的叫嚷更加甚嚣尘上。每当局势紧张时，克利斯朵夫就认为德法两国应当携手，解除仇恨。面对猖獗的军国主义，他们不胜苦闷。他们思考着什么是爱国主义，是否要为统治者效力。奥里维在克利斯朵夫丧母后赶到德国去安慰他，而克利斯朵夫在奥里维跟雅葛丽纳离异后也给他以支持，他们之间心灵的融洽显示了两个民族可以达到和睦的思想。罗兰的思想代表了要求遏止战争的善良愿望。\n\n二、塑造了一个以资产阶级人道主义为思想武器的个人反抗形象\n\n罗兰要写一部“现代心灵的道德史诗”，他通过主人公的幻想、追求、奋斗，写出了小资产阶级的极度心神不安。小说着意于塑造个人反抗的“英雄”，一个信奉“精神独立”的知识分子形象。罗兰认为在这个被卑鄙的利己主义窒息了的世界，需要这样孤独的“英雄”。实际上，这仍然是19世纪现实主义文学中常见的，以资产阶级人道主义为思想武器的个人反抗形象。\n\n三、开创长河小说\n\n《约翰·克利斯朵夫》是典型的“长河小说”，总体属于现实主义写作框架，从主人公的出生、各个阶段的迷惘与奋斗，直到去世，主要线索分明。而且通过人物的精神追求与现实的碰撞经历，间接投射出20世纪初期西欧社会生活的方方面面。在塑造人物时，作家也用了不少细节刻画。但在更多的地方，作者是用直抒胸臆、切入人物精神深处的写法，在其各个生命阶段掘出一股股曲折活水，或奔腾、或死寂、或欢乐、或悲伤，写得汪洋恣肆，荡气回肠。作家用他特有的语句方式把人生思考、历史批判和抒情诗意结合在一起，将人物的精神历程渲染得淋漓尽致。\n\n四、音乐小说（详见“为什么说《约翰·克利斯朵夫》是一部‘音乐小说’★★★★\"）\n\n（一）交响乐般的宏伟气魄、结构和色彩\n\n（二）对音乐家内心世界的细致描写\n\n（三）独立自由的音乐精神成为小说的精神主线\n\n（四）以众多音乐家的生平为素材进行创作\n\n（五）大量描写了与音乐相关的内容\n\n五、抒情因素和哲理政论因素互相交织\n\n作者细致地描绘了人物的心理和思想感情，他们对大自然景物的深切感受，使作品具有浓厚的抒情色彩。作家擅长将人物的精神变化和自然现象结合起来进行描写，而且常用内心启示的方式。可以说，人物往往在各种自然背景中，完成一场灵魂再生过程。可以说，克利斯朵夫的整个生命历程，每一次大的蜕变，都会伴随着一场激烈的内外撞击。\n\n作者又以大自然的美与黑暗的现实相对照，使作品生动地表现出资本主义社会令人窒息的气氛，从而加强了作品的揭露和批判力量。作品的心理描写和自然景物描写，处处与作者的议论和思想发挥相映衬，抒情因素和哲理政论因素互相交织，构成作品“长篇叙事诗”的独特格调。\n\n六、朴素中隐含着绮丽，流畅中蕴含着精粹\n\n罗曼·罗兰文字朴实真诚，不假雕琢，有如清澈见底的流水；一条条清溪汇入大河，浩浩荡荡奔向前去。这样的语言在朴素简单中见出浑厚浩瀚，在平凡静穆中显出深广热烈。","keywords":"欧洲社会现状 个人反抗形象 长河小说 音乐小说 抒情因素和哲理政论因素 朴素中隐含着绮丽 流畅中蕴含着精粹","note":"①24年中南大学对罗曼·罗兰的创作进行了考查。罗曼·罗兰的小说创作特征与当时的社会背景和其自身经历息息相关。当时战争的阴云已经开始笼罩欧洲，所以罗曼·罗兰反对战争，希望争取和平。而当时社会主义思潮的传播，也促使着曼罗兰去描写个人奋斗和思想探索的历程。②可以结合下一道题目的作品做详细展开。\n《约翰·克利斯朵夫》突破了传统小说的叙事模式，不以故事为程序，而以感情为程序，不以逻辑的、外在的因素为先后，而以艺术的、内在的因素为先后，以气氛与调性来做结合作品的原则。罗曼·罗兰创作的这部交响乐式的长篇小说，文学性与音乐性达到了完美的结合，需要我们重点掌握。"},{"id":"227","stars":"★★★","title":"《约翰·克利斯朵夫》的艺术成就","body":"一、真实反映了当时欧洲社会现状\n\n（一）小说描写了一个音乐家的一生。除了德国，主人公还到过法国、意大利、瑞士。当时，欧洲的主要工业国家已发到垄断资本主义，社会矛盾日益加剧，人们的精神面貌也发生了重大变化。小说首先通过主人公的经历去反映这种状况。寸当时的政治事件、革命斗争和工人运动的关心和同情，使罗兰感受到时代跳动的脉搏。小说的描写使读者感到当时的欧洲里伏着深重的政治社会危机。\n\n（二）小说描写了资产阶级的文化和精神的堕落。文化和精神的颓废沉沦是垄断资本主义时代的显著特点之一，小说的反映是入木三分的。罗兰明知这样描写要得罪不少人，他说：“我攻击了太多的人，以致要被他们的报纸和沙龙乱咬一阵。”然而罗兰感到自己必须说出真相。\n\n（三）小说描写了战争在笼罩欧洲上空的严重威胁。这场战争从19世纪末已经投下了阴影，20世纪初这种歇斯底里的叫嚷更加甚嚣尘上。每当局势紧张时，克利斯朵夫就认为德法两国应当携手，解除仇恨。面对猖獗的军国主义，他们不胜苦闷。他们思考着什么是爱国主义，是否要为统治者效力。奥里维在克利斯朵夫丧母后赶到德国去安慰他，而克利斯朵夫在奥里维跟雅葛丽纳离异后也给他以支持，他们之间心灵的融洽显示了两个民族可以达到和睦的思想。罗兰的思想代表了要求遏止战争的善良愿望。\n\n二、塑造了一个以资产阶级人道主义为思想武器的个人反抗形象\n\n罗兰要写一部“现代心灵的道德史诗”，他通过主人公的幻想、追求、奋斗，写出了小资产阶级的极度心神不安。小说着意于塑造个人反抗的“英雄”，一个信奉“精神独立”的知识分子形象。罗兰认为在这个被卑鄙的利己主义窒息了的世界，需要这样孤独的“英雄”。实际上，这仍然是19世纪现实主义文学中常见的，以资产阶级人道主义为思想武器的个人反抗形象。\n\n三、开创长河小说\n\n《约翰·克利斯朵夫》是典型的“长河小说”，总体属于现实主义写作框架，从主人公的出生、各个阶段的迷惘与奋斗，直到去世，主要线索分明。而且通过人物的精神追求与现实的碰撞经历，间接投射出20世纪初期西欧社会生活的方方面面。在塑造人物时，作家也用了不少细节刻画。但在更多的地方，作者是用直抒胸臆、切入人物精神深处的写法，在其各个生命阶段掘出一股股曲折活水，或奔腾、或死寂、或欢乐、或悲伤，写得汪洋恣肆，荡气回肠。作家用他特有的语句方式把人生思考、历史批判和抒情诗意结合在一起，将人物的精神历程渲染得淋漓尽致。\n\n四、音乐小说（详见“为什么说《约翰·克利斯朵夫》是一部‘音乐小说’★★★★\"）\n\n（一）交响乐般的宏伟气魄、结构和色彩\n\n（二）对音乐家内心世界的细致描写\n\n（三）独立自由的音乐精神成为小说的精神主线\n\n（四）以众多音乐家的生平为素材进行创作\n\n（五）大量描写了与音乐相关的内容\n\n五、抒情因素和哲理政论因素互相交织\n\n作者细致地描绘了人物的心理和思想感情，他们对大自然景物的深切感受，使作品具有浓厚的抒情色彩。作家擅长将人物的精神变化和自然现象结合起来进行描写，而且常用内心启示的方式。可以说，人物往往在各种自然背景中，完成一场灵魂再生过程。可以说，克利斯朵夫的整个生命历程，每一次大的蜕变，都会伴随着一场激烈的内外撞击。\n\n作者又以大自然的美与黑暗的现实相对照，使作品生动地表现出资本主义社会令人窒息的气氛，从而加强了作品的揭露和批判力量。作品的心理描写和自然景物描写，处处与作者的议论和思想发挥相映衬，抒情因素和哲理政论因素互相交织，构成作品“长篇叙事诗”的独特格调。\n\n六、朴素中隐含着绮丽，流畅中蕴含着精粹\n\n罗曼·罗兰文字朴实真诚，不假雕琢，有如清澈见底的流水；一条条清溪汇入大河，浩浩荡荡奔向前去。这样的语言在朴素简单中见出浑厚浩瀚，在平凡静穆中显出深广热烈。","keywords":"欧洲社会现状 个人反抗形象 长河小说 音乐小说 抒情因素和哲理政论因素 朴素中隐含着绮丽 流畅中蕴含着精粹","note":"《约翰·克利斯朵夫》突破了传统小说的叙事模式，不以故事为程序，而以感情为程序，不以逻辑的、外在的因素为先后，而以艺术的、内在的因素为先后，以气氛与调性来做结合作品的原则。罗曼·罗兰创作的这部交响乐式的长篇小说，文学性与音乐性达到了完美的结合，需要我们重点掌握。"},{"id":"228","stars":"★★★★","title":"为什么说《约翰·克利斯朵夫》是一部“音乐小说”","body":"《约翰·克利斯朵夫》是一部独具特色的“音乐小说”，它最显著的艺术特点在于具有交响乐一样的宏伟气魄、结构和色彩。《约翰·克利斯朵夫》作为音乐小说的特点主要有：\n\n一、交响乐般的宏伟气魄、结构和色彩\n\n首先，音乐和小说结合在一起，产生了巨大的魅力。罗兰多次谈到这部小说包含着音乐性：“我的思想表达到人物身上，他们的互相吸引和冲突组成了一曲交响乐。在心灵的天地中有着节奏和旋律，这就是我的思想致力于达到的图景。”他又说：“我的精神状态始终是音乐家的而不是画家的精神状态。我先是把整部作品的音乐效果孕育成满天星斗一样璀璨，然后才考虑主要的旋律节奏。”罗曼·罗兰具有精湛的音乐修养，他不仅精通欧洲音乐大师们的作品，而且自己就是个优秀的钢琴家，他还是一个音乐艺术史教授、音乐评论家和音乐家传记作者。这些条件保证了他能在一部长篇小说中创造出交响乐一般的华美瑰丽的效果。\n\n其次，小说结构如同交响乐一样宏伟。从结构上看，《约翰·克利斯朵夫》各卷有如交响乐的几个乐章，将主人公一生分为“少年”“反抗”“悲歌”“复旦”四大部分，是谓序曲、发展、高潮和结尾，气势浩荡，浑然一体。在浩大的气势中又有细部婉转灵活的乐思。因此被大家公认为“音乐小说”。\n\n二、对音乐家内心世界的细致描写\n\n（一）小说突出了主人公对音乐的敏感和觉醒。罗兰细致入微地写出了克利斯朵夫儿时对音乐的敏感和觉醒，万事万物常常在他的心中融会为曲调：“这种无所不在的音乐，在克利斯朵夫心中都有回响。他所见所感，全部化为音乐。”描绘这个小小音乐家的音乐心理活动最为生动的一节是，当克利斯朵夫发现父亲逼他练琴，是为了从他身上捞钱时，他便拒绝练琴，于是被父亲关在黑屋子里的一段描写。他幼小的心灵先是愤怒地咒骂，然后幻想出自己反抗的故事。莱茵河在屋下奔腾，水声引起了他的音乐想象。\n\n（二）小说写出了主人公对音乐的天赋和倔强的个性。小说着重描绘人物的心理状态和心理感受，既反映了主人公的音乐才赋，又表现了他倔强的个性。在描绘青年时期的克利斯朵夫时，作者更是着力于个性的刻画。例如，小说描写克利斯朵夫在一次音乐会中突然觉得一切都是虚伪的，便抑制不住，大声狂笑起来。这个场面把一个狂放不羁的音乐家鲜明地表现了出来。\n\n三、独立自由的音乐精神成为小说的精神主线\n\n小说的主人公是一位音乐家，其音乐人生就成为小说描写的主要内容，而他对音乐精神的理解与不懈追求，对现实生活平庸和势利习气的反抗，就成为小说刻画其坚强意志和反抗精神的重要线索。所以，自由不羁的音乐精神成了主人公高尚灵魂的体现，也构成了小说内在的精神主线。\n\n四、以众多音乐家的生平为素材进行创作\n\n罗曼·罗兰遵循现实主义塑造典型的方法，采用综合的手法去描写人物，克利斯朵夫的生平就是以德国伟大音乐家贝多芬的身世为主要素材，综合其他欧洲音乐家的生平材料创造出来的。克利斯朵夫是20世纪的音乐家形象，被打上了时代的烙印。\n\n五、大量描写了与音乐相关的内容\n\n作者对音乐作品的介绍、分析和评论很能引起人的兴趣和共鸣。罗兰凭着他对欧洲音乐的深厚素养，在小说中穿插对音乐作品和音乐家的评点，带领读者漫游欧洲古典音乐的王国，使读者感到生活在管音琴声的氛围里，陶醉在音乐曲调的享受中。","keywords":"交响乐般的宏伟气魄、结构和色彩 音乐家内心世界 独立自由的音乐精神 众多音乐家的生平 与音乐相关的内容","note":"音乐在《约翰·克利斯朵夫》这部小说中占据了很重要的位置，小说的主人公就是音乐家，小说的结构也与交响乐类似，并且描写了大量与音乐有关的内容，因此被称为是一本“音乐小说”，回答时主要抓住这几个点展开论述。相关内容可参考胡宁《论罗曼·罗兰＜约翰·克里斯朵夫＞的艺术创作特色》，资料可在李凡文学正版群中获取。"},{"id":"229","stars":"★★★","title":"萧伯纳的戏剧创作特征","body":"一、取材现实，批判现实\n\n受现代戏剧之父易卜生的影响，萧伯纳戏剧创作的最突出特点就是取材于现实生活，敢于触及资本主义社会最本质的问题，把剥削阶级的丑恶嘴脸暴露在公众面前。他一贯主张艺术应当反映迫切的社会问题，反对“为艺术而艺术”。他明确提出作家的责任不是用虚构的故事去迎合读者的趣味，而是要探索现实，批评现实。他的戏剧观与创作方法决定了他的创作关注现实，关注民众疾苦。因而，在他的创作中，社会问题剧占有很大的比重。\n\n二、打破传统戏剧模式\n\n（一）情节安排方面\n\n萧伯纳的戏剧大胆革新，在情节安排上，他反对那种以情节公式化为中心的“佳构剧”。他一直提倡、强调并实践现实主义新戏剧，他的戏剧充满着他观察到的深刻的社会与人生的现象。如他写《稣夫之家》的目的就是要打破当时爱情剧千篇一律的情节。他剧中的青年男女并没有陷入理想化的爱情不能自拔，相反，女婿和未来岳丈倒是就嫁妆展开了一场毫无温情和廉耻的谈判。\n\n（二）结构方面\n\n萧伯纳在戏剧的结构上作出了巨大的创新，形成了采用辩证法的正题-反题-合题三段论模式。\n\n（三）戏剧要素方面\n\n观念或思想是萧伯纳的重中之重，它是萧戏剧冲突的中心所在，以及一切矛盾冲突解决的落脚点。在萧的剧作中，传统的戏剧要素排列被颠倒和打乱，观念成为统领其他戏剧要素的核心，传统戏剧中最重要的情节发展和人物刻画成为次要因素，多数情况下萧的戏剧成了观念和思想探讨的战场；以观念为主导，以讨论为主要表现手段和媒介。所以，萧的戏剧被评论家们称之为“观念剧”或“讨论剧”。\n\n三、讽刺手法\n\n在运用讽刺手法上，萧伯纳明显地受到狄更斯的影响。萧伯纳戏剧中那些出自反面人物之口的语言，表面看来是夸大之辞，却隐含着揭示英国殖民主义者丑恶面目的深刻意蕴。萧伯纳的这种夸张手法使他成为现代英国资产阶级社会最辛辣的讽刺者。\n\n四、语言机智灵活\n\n萧伯纳的语言机智、灵活，被公认为英国口语和对白的大师。他常通过人物对话和思想感情交锋来表现戏剧冲突和主题。他笔下的人物不是说话，而是讲演。如在《华伦夫人的职业》中，华伦夫人就娼妓问题与女儿展开争论；在《巴巴拉少校》中，巴巴拉与安德谢夫就统治英国的是金钱还是品质这个问题进行了一番舌战。不过剧中的辩论场面并不是枯燥无味的，而是处处闪烁着智慧的光芒，这不仅归功于萧伯纳对人生、对社会的深刻洞察，更归功于他对语言艺术的高度驾驭能力。\n\n五、音乐性\n\n萧伯纳本身有着深厚的音乐素养，他曾是伦敦最出色的音乐评论家。在他的作品中，许多剧情的发展都是交响乐式的引人入胜。","keywords":"批判现实 易卜生 现实主义新戏剧 正题-反题-合题三段论 观念剧 讨论剧 讽刺 狄更斯 语言机智灵活 音乐性","note":"萧伯纳不仅是杰出的戏剧家，还是著名的社会活动家和社会改革的倡导者。作为费边社的领袖之一，他常运用戏剧作为其有力的宣传工具，因此他的戏剧特征必然离不开社会现实。加之其受易卜生的戏剧影响很深，二者有许多共同点，不过萧伯纳的戏剧更接近闹剧，而且相比易卜生，更进一步对垄断资产阶级的本质进行了无情的揭露。关于二者的对比，请详细阅读下一题。"},{"id":"230","stars":"★★★","title":"试比较萧伯纳和易卜生","body":"萧伯纳是英国杰出的现实主义剧作家，其思想观念和戏剧创作都深受挪威戏剧家易卜生影响。其创作在继承易卜生社会问题剧基本特点的同时，也不乏独特性。\n\n一、思想倾向不同\n\n从思想上来看，易卜生站在中小资产阶级的立场上，运用人道主义思想武器批判封建残余思想和大资产阶级当权派的贪婪专横，主张凭借个人的精神反叛达到追求个性彻底解放的目的。萧伯纳则更多受到进化论和马克思主义的影响，他重视人类社会中的经济活动和社会关系，认识到资本主义社会制度与社会道德堕落的直接关系。相比易卜生的思想，萧伯纳对资本主义社会本质和特征的认识更为深刻、清醒，其思想也更加具有积极建构的色彩。\n\n二、易卜生戏剧风格多样，萧伯纳戏剧风格较为单一\n\n在戏剧创作中，易卜生的创作经过了一个发展的过程，易卜生创作了浪漫主义历史剧、现实主义社会问题剧和象征主义的心理剧等不同风格的戏剧作品，融合了浪漫主义、现实主义、表现主义、象征主义和意识流文学等表现方法；而萧伯纳则主要关注的是易卜生的“社会问题剧”，他的创作主要都是揭露社会弊端的现实主义戏剧，风格较为单一。\n\n三、同样聚焦社会问题，但萧伯纳突出讨论的作用\n\n就聚焦社会问题的这类戏剧创作来看，萧伯纳将易卜生问题剧的内容和特征予以发扬，并更加突出了讨论在戏剧中的作\n\n用。多数情况下萧的戏剧成了观念和思想探讨的战场例如在《华伦夫人的职业》中，华伦夫人跟女儿薇薇论争，在辩论中卑鄙与高尚、邪恶与正义也暴露无遗。因此，萧伯纳的戏剧有“思想剧”“观念剧”“讨论剧”之称。\n\n四、影响不同\n\n从影响上来看，萧伯纳继承了易卜生社会问题剧的传统，反对“为艺术而艺术”的观点，重视戏剧的教谕作用。在这种戏剧观指导下，他创作了反映英国社会现实的剧作，极大地冲击了英国剧坛的形式主义风尚，奠定了英国现代戏剧的基础。而就易卜生的影响来看，其范围所及的广度和深度都超过了萧伯纳。易卜生戏剧的风格更加多样，成就更大，对西方戏剧的影响也更加深远，对后世文学的影响持续到今天，超越了戏剧领域，波及世界各地。","keywords":"继承 独特性 萧对资本主义社会的本质认识更深刻 戏剧创作 不同风格 较为单一 聚焦社会问题 讨论 易卜生影响更大","note":"萧伯纳把易卜生戏剧的主题认定为“理想主义者批判”。萧伯纳创造性地误读了易卜生，并从其思想艺术中汲取力量，走上了自己的戏剧之路。萧伯纳早期戏剧的理想主义者批判，矛头针对维多利亚时代虚伪的道德风尚，20世纪后则指向各种禁锢心灵的意识形态力量。通过“讨论”的系统应用，萧伯纳使戏剧从重视外部情节的冲突，转向表现思想观念的冲突。这种“萧式观念剧”，超越了易卜生，引领了欧洲现代戏剧发展的新方向。相关内容可拓展阅读王永生《鲁迅论易卜生与萧伯纳》、陈燕红《萧伯纳剧作中的易卜生主义》，资料可在李凡文学正版群中查看"},{"id":"231","stars":"★★★","title":"托马斯·曼的小说创作特征","body":"一、思想特征\n\n托马斯·曼在思想上继承了19世纪的人道主义传统，同时又深受叔本华和尼采哲学思想以及弗洛伊德精神分析学的影响，因此他既保持了现实主义的批判精神，又将这种批判精神和20世纪的现代思潮结合在一起，形成了他独特的世界观。这种世界观既是积极的，又是悲观的。积极的一面表现为他对传统社会持严厉的批判态度，而悲观的一面则表现为他对“新世界”的出现始终持保留态度。这种世界观可以说是20世纪西方大多数现实主义作家所共有的，托马斯·曼则是其典型的代表。\n\n二、艺术特征\n\n（一）以欧洲资产阶级社会的衰落为基本主题\n\n托马斯·曼称自己的小说为“尽头的书”，他的“艺术家小说”旨在表现自视清高的艺术家与庸俗的市民社会之间的矛盾，而托马斯·曼对这一矛盾的态度也是矛盾的。在表现艺术创作与现实生活、艺术生产者和艺术消费者之间存在着不可逾越的鸿沟的同时，他既认为艺术家脱离现实生活只能是“死路一条”，但又强烈地表示，艺术家若与庸俗社会“同流合污”，也就无任何艺术可言了，而艺术恰恰是他本人所钟爱的。实际上，艺术和生活之间的这种冲突，从一开始就是托马斯·曼创作中的一个重要主题，而不仅仅是“艺术家小说”才有的。\n\n（二）现实主义基调与现代派手法相融合","keywords":"思想特征 现实主义 现代思潮 既积极又悲观 艺术特征 欧洲资产阶级社会衰落 现实主义基调与现代派手法】【李凡说：作为一个文学大师，把自己的一切，包括自己最深层的感情、思想，详细地、全面地坦露给他的读者的，托马斯曼恐怕是唯一的一位。其思想特征完整地体现在了他的小说创作之中，因而他的思想特征与艺术特征是多有重合的。","note":""},{"id":"232","stars":"★★★★","title":"《布登勃洛克一家》的艺术特色","body":"一、坚持现实主义手法，以塑造人物典型作为创作核心\n\n小说中最具有典型意义的人物形象，是托马斯和他的儿子汉诺。托马斯是19世纪后期欧洲老派实业家的典型，形象地反映了西方商业社会在19世纪后期所面临的深刻危机。托马斯的儿子汉诺是作品中的又一典型形象。他天生的艺术家气质对于布登勃洛克家的事业无疑是一种灾难，同时也象征性地表现了欧洲传统文化的“衰退”。如果说托马斯是18世纪启蒙时代的人格代表的话，那么汉诺就是19世纪浪漫时代的人格代表。小说中其他一些人物形象也具有一定的典型意义。克利\n\n斯蒂安是个败家子形象，但又非常诚实和率直，从不讳言自己活在世上只关心自己，而且常常会以玩世不恭的态度一针见血地说破社会腐败堕落和人生荒诞不经的本质。安冬妮则似乎是她两个兄弟的性格的混合物。她像托马斯一样忠于家族的利益，又像克利斯蒂安一样自私和自负，而其性格的主要特征就是爱虚荣。\n\n二、以小见大，采用象征手法，用一个家族的衰亡表现德国传统社会的没落\n\n布登勃洛克一家四代：老约翰、小约翰、托马斯、汉诺各自有着不同的思想感情和个性，各自反映出他们所生活的那个时代的特点。小说通过一个资产阶级家庭4代人的经历，反映了德国传统社会在19世纪中叶开始走向没落的过程，从而预示着德国社会乃至欧洲社会将发生激烈而巨大的变化。\n\n三、结构严谨，详略得当，前后呼应\n\n小说前半部按照时间顺序展开叙事，后半部则更多聚焦于人物内心世界的揭示。小说擅长描写家庭生活场景，并由此反映了19世纪中叶德国社会的风俗人情，折射了历史的变迁。家庭生活中的同样物件和家庭中的同一人物在小说中重复出现，既起到了见证家庭历史的作用，也具有了联系不同情节线索的功能，标志了故事发展的新阶段。因此，我们看到的并不是流水账式的交代，而是情节的进展。\n\n五、交替使用多种表现手法\n\n作品中还交替使用多种手法表现情节内容，如直接叙述和间接叙述、通篇议论和夹叙夹议、内心独白和借物抒情等，从而使作品呈现出多种情调和气氛。\n\n六、语言平稳含蓄、略带忧郁而间夹讥诮\n\n小说的语言以平稳含蓄、略带忧郁而间夹讥诮为主要特点，但根据作者对待不同人物的不同态度，语言风格也随之变化，如关于海滨避暑、汉诺弹奏钢琴等篇章用的是抒情风格；刻画托马斯性格时语言则很含蓄；而写到克利斯蒂安时又常用讥讽的口吻等等。","keywords":"人物典型 象征手法 富有情趣 多种表现手法 语言平稳含蓄、略带忧郁而间夹讥诮","note":"《布登勃洛克一家》以现实主义的深微精细的笔调，层层叠叠地展开着生活的画面。它不是作无休止的平静的流泻，也不是照相般的复制，而是通过典型化的提炼，显示出生活的真实。小说通过塑造典型人物而反映了整个社会，这是其作为现实主义文学作品的最主要特色，其他还是从手法、结构、语言等方面分析即可。"},{"id":"233","stars":"★★★","title":"布莱希特的戏剧思想","body":"布莱希特创立了世界戏剧三大表演体系之一“史诗剧”，是20世纪最有影响力的戏剧理论家之一．\n\n一、外化\n\n布莱希特的戏剧理论的核心观点是“外化”。他认为，戏剧应该反映现实生活，而不仅仅是表现艺术家的个人情感或思想。他主张演员通过自己的真实情感和生活经验来诠释角色，而不是依赖训练和技巧。这种观点与斯坦尼斯拉夫斯基的“体系”理论形成鲜明对比。\n\n二、史诗剧场\n\n布莱希特的另一个重要观点是“史诗剧场”。他认为，戏剧应该是一种社会活动，能够引发公众对社会问题的关注和讨论。他的许多作品都旨在揭示社会现实，批判社会不公，鼓励观众参与到剧场中，通过互动来体验和理解戏剧。\n\n布莱希特主张史诗剧艺术要让观众产生思维的兴趣，使他们相信世界是可变的，激发观众变革现实的兴趣和愿望，培养观众积极的处世态度。为实现这种主张，他在艺术上创造了一种“陌生化”方法，让观众用新的眼光观察和理解司空见惯的事物。导演和演员借此有意识地在舞台与观众之间，制造一种感情上的距离，使演员既是角色的扮演者，又是角色的裁判；使观众成为清醒的旁观者，用探讨和批判的态度对待舞台上的事件。他的基本想法是，作家应在文学作品中表现世界是可变的这个马克思主义的唯物辩证法，因此，哲学家布洛赫称他为“舞台上的列宁主义者”。\n\n三、教育剧\n\n布莱希特的戏剧美学，是他学习马克思主义和积极进行艺术实践相结合的产物。20年代末30年代初，在布莱希特周围形成一个探讨艺术革新的小团体。他们认为，艺术家既是艺术先锋，又是政治先锋，艺术的物质基础是社会，变革艺术必须同变革社会联系起来。人们称他们的主张为“物质美学”。在这种美学思想指导下，布莱希特于20年代末30年代初创作了一系列“教育剧”，企图借此克服传统戏剧中“看戏”与“行动”脱节的弊病。他认为“教育剧”是一种以集体方式理解人类社会可能性的戏剧形式，这类作品主要不是为观众，而是为培养演员的处世态度而创作的。布莱希特企图借此开创一种全\n\n新的艺术接受方式，使艺术创作与艺术消费合而为一。他称这是一种“大教育学”，认为它能消灭演员与观众的区别，使演员成为“学员”。\n\n四、充分尊重和信赖观众判断是非的能力\n\n布莱希特把大胆妈妈塑造成一个始终未觉悟的人，她丝毫未从自家的遭遇中汲取必要的教训，甚至根本未意识到自己对子女的离散死亡负有道义责任。对于这一点，沃尔夫提出不同意见，认为大胆妈妈最后应对自己的错误有所认识和批判。布莱希特却认为，观众不必期望她最后从自己的经历中认识错误，作者也没有义务非得这样描写，剧作者的目的应该是让观众在这个悲剧故事中受到启发，认清并痛恨这种掠夺战争，只要观众认清大胆妈妈的盲目行动，这出戏就算达到了目的。充分尊重和信赖观众判断是非的能力，是布莱希特美学主张的一个突出特点。","keywords":"外化 史诗剧场 教育剧 尊重和信赖观众判断是非的能力","note":"总之，布莱希特提出，戏剧要借陌生化技巧让观众认识世界是可变的，认识社会事件的因果关系，从而参与变革现实的斗争。布莱希特主张，戏剧作为一种娱乐形式，必须同科学时代的特点联系起来，从学习中汲取娱乐。围绕这个宗旨，他在剧本结构、导演、表演、舞台美术和观众欣赏等方面，提出一整套崭新想法。而他的思想主张，与马克思主义唯物辩证法和德国无产阶级革命密切相关。本题为2023年东南大学考研真题，大家要仔细把握。"},{"id":"234","stars":"★★★★","title":"你怎样看待《大胆妈妈和她的孩子们》戏剧艺术创新问题","body":"《大胆妈妈和她的孩子们》对戏剧艺术进行了创新，这出戏中所运用的新的表现方法，对于认识布莱希特戏剧的艺术特点具有典型意义。\n\n一、内容简洁\n\n这出戏的副标题是“三十年战争纪事”，这种“纪事体”的一个重要特点，是每一场戏之前都有一个内容提要，它的功能是简要介绍一场戏的内容，如剧情的时间、地点、主要人物和大体内容，以缓解观众在看戏过程中对剧情的好奇心。这样，观众在看戏时，所关注的不是表演“什么”，而是“怎样”表演，作者运用一切戏剧手段，调动观众辩证思维的能力，让观众思考从大胆妈妈的行动中应该汲取什么样的教训。这实际上是布莱希特“教育剧”教诲作用的新发展。\n\n二、歌唱性因素\n\n剧中穿插的歌唱具有打断故事情节进行的功能，这是史诗剧为了调动观众的思维而采取的一种特殊手段。歌唱既对剧情起着评论作用，也是刻画人物性格的手段，有时甚至是理解全剧基本布局的一把钥匙。例如贯穿全剧的《大胆妈妈之歌》，就是这出戏的主题歌，它在不同地方出现，具有不同作用。\n\n三、开放形式\n\n（一）结构方面，该剧并未采取亚里士多德式悲剧模式（展示部-转折部-高峰一突变一灾难），无论在时间或情节构筑方面，剧本均未遵循环环相扣的规则，而是呈现一种无头无尾的“松散”状态，整个剧情的发展，像是“随意出没于无边无际的事件的长河里”。\n\n（二）人物描写方面，观众在结尾处井未看到大胆妈妈的命运结局，只是象征性地看到她仍然对未来抱有幻想。这样的结局，加强了人物的悲剧色彩，对于主人公来说，亦不啻是一个令人酸楚的讽刺。\n\n四、共时性场景\n\n共时性场景作为一种戏剧技巧，源于表现主义戏剧，在20年代皮斯卡托的戏剧实验中得到发展和完善。在《大胆妈妈和她的孩子们》里，就有这种同一场戏里两个故事齐头并进的情形。观众在这种共时性场景中能看到剧中人物看不到的事物。布莱希特的意图是，借这种手法让观众以清醒的头脑有意识地看戏，而不要像剧中人那样陷入盲目性。","keywords":"内容简洁 歌唱性因素 开放形式 共时性场景","note":"在文学理论中会提到布莱希特的“间离效果”，这同样也应用于他的戏剧创作之中，布莱希特一直主张让观众保持清醒的判断，这也属于他戏剧的创新之处，大家要注意这种跨学科的知识。此外，这部戏剧也会考查名词解释，大家要留心。"},{"id":"235","stars":"★★★","title":"《大胆妈妈和她的孩子们》中的主人公形象","body":"一、大胆妈妈的形象\n\n（一）为谋生不怕冒险、不计后果\n\n剧中女主人公号称“大胆妈妈”，她带着两个儿子，一个哑女，拉着货车随军叫卖，把战争视为谋生的途径，发财的来源。为了谋生，她不怕冒险、不计后果。她把生活希望完全寄托于战争，但最终却落得家破人亡。\n\n（二）目光短浅\n\n目光的短浅，使大胆妈妈看不到自己随军叫卖的小买卖同战争之间的联系。她本想用战争保存自己，反倒被战争毁灭了家庭。一方面，她用做买卖的行动，延续和支持了战争，另一方面，战争又毁灭了她的儿女，这正是这出戏的教诲意义。\n\n（三）始终未觉悟\n\n大胆妈妈自始至终都未曾觉悟，她丝毫未从自家的遭遇中汲取必要的教训，甚至根本未意识到自己对子女的离散死亡负有道义责任。而这样的处世态度也是造成自己子女死亡的重要原因。\n\n二、大胆妈妈形象的意义\n\n1938年西方资本主义国家为保全自己，一方面同德国订立互不侵犯条约，以图束缚希特勒的侵略野心，另一方面又大量向德国贩卖钢铁，供它制造战争武器。大胆妈妈随军做买卖的行为正是对当时西方资本主义国家行为的影射，而大胆妈妈的悲剧命运则是布莱希特对西方资本主义国家的警告。布莱希特创作这出戏的目的，在于告诫西方各国政府放弃对德“中立和不介入政策”，不要幻想在同德国做买卖中捞取任何利益。","keywords":"不怕冒险 不计后果 目光短浅 始终未觉悟 影射警告西方资本主义国家","note":"本题为2023年湖南师范大学真题。遇到类似的让我们分析人物形象的题目时，我们首先要明确人物形象是怎样的，其次要分析人物形象的意义。大胆妈妈既是战争的支持者，又是战争的牺牲品。这个形象是对当时西方资本主义国家的影射。"},{"id":"236","stars":"★★★","title":"菲茨杰拉德小说的创作特征","body":"一、以“美国梦”的破碎为主题\n\n随着工业化进程的深入和大都市的相继出现，许多人相信在美国这块土地上，人人机会均等，只要努力奋斗，都能获得财富和成功。而这只是一个幻梦。纵观菲茨杰拉德的小说，他描写的都是当时美国青年人的精神状态和社会生活。他的小说主人公都是风华正茂，大有作为的壮志青年，可是随着情节的发展，这些青年充满激情的个人奋斗并没能实现他们梦想中的成功和财富，他们无一不遭受命运的捉弄，往往在经历了残酷而虚假的现实冲击后，彻底丧失了自我，最终一步步走向了毁灭的道路。菲茨杰拉德以他敏锐的观察和诗意的描绘，吟唱了一曲曲“美国梦”遭遇破灭的哀歌。\n\n二、富人生活是重要题材\n\n菲茨杰拉德被称为“20年代富人的分析家”。他的小说既展现了“富人生活中所具有的奇妙动人的自由和魅力”，又揭露了富人的丑恶人格。描写富人的生活，揭露富人空虚的灵魂成了菲茨杰拉德小说的主要题材。\n\n三、自传倾向\n\n菲茨杰拉德的小说创作是一种有自传倾向的自我体验式写作。他以自己的现实生活为基础，细致地描画自己所处的时代和社会风貌。他既身在其中，又超然于外的双重身份，使他的小说极其生动地重现那个时代的风貌、气息，同时又使他能深刻地揭示浮华背后的空虚无聊和腐朽没落。他虽向往灯红酒绿的生活，但能清醒地看到上层富豪和普通百姓之间存在着的无法逾越的鸿沟。菲茨杰拉德小说中的每一个人物，都表现出激烈的思想情感冲突。而这些人物的思想情感，实际上都是菲茨杰拉德个人自我意识的不同表现。\n\n四、擅长叙事\n\n茨杰拉德擅长叙述故事，作品风格幽默细腻，言语流畅，结构严谨，尤其是人物对话写得自然逼真，富有个性。菲茨杰拉德惯常使用的是“双重叙事视角”的叙事方式。这里的“双重叙事视角”，是指小说中的全知叙述者和作品中的人物两种不同的叙事视角。人物的叙事视角多展示人物的内心活动，叙述故事情节的发展；而全知视角则传达着菲茨杰拉德自己的声音。\n\n五、浓郁的抒情气息和梦幻色彩\n\n菲茨杰拉德最引人注目的特色是他那诗人和梦想家的气质和风格。他深受英国浪漫主义诗人济慈的影响，作品富有浓郁的抒情气息。菲茨杰拉德擅长描写梦想，他塑造了一系列有罗曼蒂克精神的、善于做梦的男人，他们梦想财运亨通，梦想得到心爱的女人，这种梦想是那么执着、痴迷，可是最后总是以破灭而告终。","keywords":"“美国梦”破碎 富人生活 自传倾向 擅长叙事 双重叙事视角 抒情 梦想家","note":"菲茨杰拉德一生为两样东西所困：一是才华，二是金钱，他都曾一度拥有，但最后又全部失去。而他的小说也大多以此为描写对象，他注重对自身生活的真实呈现，常叙述有意思的故事，作品常充满美国都市生活的摩登气息。"},{"id":"237","stars":"★★","title":"《了不起的盖茨比》如何描写美国梦的破灭","body":"《了不起的盖茨比》是20世纪美国杰出小说家菲茨杰拉德的代表作。小说的重要意义在于以盖茨比的追求和毁灭来表现“美国梦”的幻灭，深刻揭露了“美国梦”的虚假实质。\n\n盖茨比的梦想一是“发财梦”，二是“爱情梦”，前者是手段，后者是目的。这两个梦对盖茨比来说是“物质和精神的和谐统一而不可分割的”，它是传统的美国梦的具体体现。\n\n一、“发财梦”的破灭：美国20世纪的发展状况与传统的美国梦相悖\n\n“美国梦”起源于19世纪，指的是相信只要经过努力与奋斗便能在美国获得更好的生活的信仰。“美国梦”首先要打破的是人与人之间的地位差异，要求人们必须通过自己的勤奋工作、勇气得到财富，而非依赖于特定的社会阶层或地位。\n\n但现实中的美国却是另一种情况，靠继承上辈财富为基础的上层阶级都有着无比的优越感。因此靠个人奋斗发家致富的盖茨比，缺少可以跻身上流社会的背景，而被汤姆取消了成为上层阶级的资格，这也是黛西抛弃盖茨比的一个重要因素。表面上开放、民主的美国社会实际上却是关闭的。盖茨比无视自己生活在这样一个物质高度发达而精神价值丧失的美国，生活在一个传统的美国梦已支离破碎的时代，仍然抱着自己的幻想盲目地追寻，因而他的悲剧是不可避免的。\n\n二、“爱情梦”的破灭：黛西的背叛\n\n黛西是一个功利的女子，外表温文尔雅，但内里俗气，利欲熏心。她也曾爱过盖茨比，但盖茨比的贫穷让她犹豫退缩。她代表着当时美国人的主流，即遵循金钱社会的道德和行为准则去做事。盖茨比从社会的底层苦斗上来，他想用物质财富来表示自己配得上黛西，但他永远无法撇开低微的出身。因此，黛西在暂时的旧情复发之后还是牺牲了他，投入了粗鲁凶狠的丈夫汤姆的怀抱。至此，盖茨比的“爱情梦”彻底破灭。\n\n总之，菲茨杰拉德在《了不起的盖茨比》中通过描写盖茨比在经济和爱情上的悲剧表现了美国梦的破灭。","keywords":"发财梦 爱情梦 发展状况与传统的美国梦相悖 黛西的背叛","note":"这部分内容我们只需要了解发财梦和爱情梦，以及两者的破灭，然后结合书中的情节去作答就可以了，没有必要专门背诵，相较而言这本书的重要程度没有那么高，因此记住关键词，有大致印象即可。相关内容可拓展阅读张礼龙《美国梦的演变与破灭-（了不起的盖茨比》评析》、岳香君《浅析（了不起的盖茨比＞中美国梦的追求及幻灭原因》，资料可在李凡文学正版群查看。"},{"id":"238","stars":"★★★","title":"《了不起的盖茨比》的艺术特色","body":"《了不起的盖茨比》没有19世纪传统小说的冗长繁缛，也没有当时已萌芽的现代主义的奇奥艰深，它简洁流畅，诗意盎然，又不乏幽默，深得读者的喜爱。其艺术特色主要如下：\n\n一、欲抑先扬，欲言又止\n\n菲茨杰拉德擅长叙述故事，采用了欲抑先扬的方法。小说先慢慢蓄势，通过盖茨比梦幻的眼睛来极力渲染黛西的美丽可爱，使读者产生错觉，然后以黛西在车祸后的表现作为猛然的一击，将读者心目中建立起来的美好形象轰然推倒，把黛西虚伪的真面目暴露出来，更具震撼效果。\n\n小说构思精妙，结构紧凑，一环扣一环，经常到关键处欲言又止，设置悬念，特别是盖茨比的身世，宾客们众说纷纭。作者运用这种巧妙的表现方式，创造了一种强烈的气氛，使盖茨比的形象更加神秘，刺激了读者的好奇心。\n\n二、叙事角度新颖、独特\n\n（一）现代叙事手法，即叙述者是作品中的人物。小说采用尼克的口吻来叙述，这个人物既身在其中，又置身其外，“身在其中”是因为他是联系人物间矛盾冲突的纽带，是主要人物关系网中的核心。“置身其外”是说这些矛盾冲突同尼克个人没有直接的利害关系，他尽可以客观、冷静地判断是非曲直。\n\n（二）多重视角转换。尼克并不是无所不知的上帝，由于受到自身活动范围及时间、空间的限制，他无法知道自己不在场或未曾经历的事件。为了故事情节发展的需要，有时尼克必须让位于其他人物，暂时“退场”，让其他人物来完成叙述。例如乔丹讲述盖茨比当初追求黛西的情景、盖茨比自叙过往经历、沃尔夫山姆谈及盖茨比的发迹和盖茨比父亲讲述儿子年少的梦想等，都是通过叙述角色的转换完成的，这使小说中的故事产生了一种立体感，增强了小说的艺术感染力。\n\n（三）运用“经验自我”的叙述手法\n\n尼克在再现自己所经历的事件时，没有用“叙述自我”的视角，而是采用了“经验自我”的视角，用当时经历事情过程的自我口吻来叙述，产生悬念了效果，而且缩短了读者与故事事件和人物之间的距离，使读者产生一种身临其境的感觉，能够对故事事件和人物作出自己的评价和判断。\n\n三、隐喻手法\n\n小说文笔优美，得益于比喻、拟人化等修辞手法的运用，而且不落俗套。菲茨杰拉德喜欢用隐喻，有时他用人名来隐喻，如黛西（Daisy）意思是雏菊，中间黄，周围白，暗示着金钱与空虚同处，殷实的物质生活不能代替和超越空虚无聊的精神生活。有时他用事物来隐喻，如作品中用飞蛾来隐喻那些“食客”，飞蛾喜欢灯光，盲目寄生，飞蛾的特征揭示出盖茨比家宴会上各色食客的本质。\n\n四、象征手法\n\n小说象征意象种类繁多，最为突出的当为色彩以及与特定色彩相关的器物和自然事物所形成的象征意象，起到了暗示人物的本性、反映时代的特征、深化和丰富小说的主题意义的重要作用。（详见“试分析《了不起的盖茨比》中象征手法的运★★用★★★”）★★","keywords":"欲抑先扬 叙事角度新颖独特 叙述者是作品中的人物 多重视角转换 经验自我 隐喻 象征","note":"关于上述的“经验自我”和“叙述自我”，《（了不起的盖茨比）的叙述视角及艺术效果》一文有与教材不同的看法，下边简要概括给大家参考：尼克在叙述中，采用了“叙述自我”和“经验自我”两种视角。文章举例“我年纪还轻，阅历不深的时候”，“去年秋天我从东部回来的时候”，都明确地表示了尼克对过去的追忆，这种视角即为叙述自我的视角。"},{"id":"239","stars":"★★★","title":"试分析《了不起的盖茨比》中象征手法的运用","body":"菲茨杰拉德用象征手法揭示了狂热追求“美国梦”的人们遭到毁灭的必然结局，大大增强了这部文学作品的震撼力以及艺术表现力。\n\n一、颜色象征\n\n（一）白色。白色是一种美丽而恐怖的颜色，它可以象征纯洁，也可以象征颓丧；可以象征单纯，也可以象征空虚；可以象征高贵，却又显得缥缈、虚幻甚至虚假。白色的这种双重属性被菲茨杰拉德巧妙地应用，成为黛西的代表色。她在小说中总是一袭白色长裙，是众人眼中的天使和焦点。但她的自私、冷漠和空虚又代表了白色的另一面-财富掩盖下的冷酷和虚无，揭示了“爵士乐时代”人们看似文明、高雅，实则庸俗、空洞的荒诞心理。\n\n（二）黄色。黄色是财富的象征，同时也意味着浮夸、庸俗、堕落和不忠。它是资本主义世界人们的崇拜色：盖茨比喜欢打金色的领带，乔丹留有一头枯叶般的黄头发，晚会上穿着黄裙子的姑娘们总是引人注目，特别是被称为“金色女郎”的黛西，黄色代表了黛西灵魂的本色。在白色纯洁外表掩盖下的，其实是一颗世俗虚荣、自私和猜忌的心。\n\n（三）绿色和蓝色。这两种颜色充满了生机和活力，代表着希望和梦幻，隐喻着令人向往的美国梦。蓝色是天空的颜色，富有梦幻。盖茨比的别墅到处都覆盖了一层蓝色，从蓝色的草坪到蓝色调的花园，穿着蓝色制服的司机，一切都令人向往和陶醉，好像生活在这里的人就一定能够获得幸福。绿色富有生命力，代表了希望，盖茨比每天都要眺望的黛西家前面的绿灯，这是梦想中的黛西的象征，代表着盖茨比的希望和理想，象征着他用尽一生所追求的青春、爱情、金钱、地位。同时，绿灯也是整个国家对“美国梦”狂热的追求的象征。但绿灯遥不可及，象征了那些遥望绿灯的人追求“美国梦”的徒劳。\n\n（四）灰色和黑色\n\n灰色代表着破败、贫穷和无望，黑色代表着死亡和罪恶，它们都反映了资本主义社会不愿为人提起的阴暗面。在富人居住的长岛和嘈杂的纽约闹市区之间，有一个阴森恐怖的灰谷，它象征着在爵士乐时代欢乐喧嚣的背后，到处充满着如同灰谷般的黑暗、肮脏；同时还是爵士时代人们传统的道德价值取向崩溃、物质上极为富有、精神上极为荒芜和贫瘠的象征。黑色作为死亡的象征色，在小说中也被多次提起：盖茨比豪宅的前主人的黑色花圈；黛西开车驶过黑色铁桥，在暮色中驶向死亡；被撞死的默特尔双膝跪地，黑色的浓血混入尘埃之中；盖茨比死后躺在黑色的灵柩中鲜有人来祭拜。这两种颜色其实是盖茨比的“美国梦”必然破灭的征兆，是金钱社会看似繁华和富有生机的表象掩盖着的堕落、虚无和危机。\n\n二、人物象征\n\n（一）盖茨比。盖茨比通过个人的奋斗，获得了成就，就如美国通过努力获得了短暂的繁荣。主人公盖茨比具有美国人天真、幼稚的性格，认为金钱可以战胜一切，因此他通过努力奋斗进入上层社会，追求纯真、诚实的爱情，但是现实是他所\n\n追求的爱情是建立在金钱之上，这样的爱情一击即破，正如“美国梦”一样，最终会走向破碎毁灭。\n\n（二）黛西。黛西代表了美貌、财富以及权势，也代表了主人公所追求的梦想，黛西外表美丽、噪音优美，但是内心自私冷漠、恶毒、空洞，就犹如缺乏内涵的“美国梦”。作者菲茨杰拉德在打造“黛西”这个人物时，充分展现了作者对当时社会理解的深刻性，将“黛西”的人物性格描写得淋漓尽致。\n\n（三）尼克。尼克在小说中，既是中心人，也是局外人，能够充分展现作者的真实想法。与小说中汤姆以及盖茨比不同的是，对所发生的一切，尼克都能够站在理性的高度去观察，正确地评判他人。尼克这个人物，寄托了作者对未来发展的希望，他希望整个社会不再有下一个盖茨比，整个社会仍然受道德所约束，而不是一团糟。所以，也可以将尼克视为社会道德规范的象征，而道德规范是社会发展必不可少的。","keywords":"颜色象征 白色 黄色 绿色和蓝色 灰色和黑色 人物象征 盖茨比 黛西 尼克","note":"《了不起的盖茨比》最突出的艺术特征就是运用了大量的隐喻和象征手法，而这其中又属颜色象征最具特色。色彩以及与特定色彩相关的器物和自然事物所形成的象征意象，贯穿全文，揭示了狂热追求“美国梦”的人们遭到毁灭的必然结局。不过也有学者把“绿灯”“灰谷”等归为事物象征一类，而把“黄色”“白色”等单纯的颜色作为颜色象征看待。"},{"id":"240","stars":"★★★★★","title":"谈谈海明威创作的个性特征","body":"海明威是20世纪美国小说家，他的创作独具风格，有鲜明、强烈的个性特征：\n\n一、“迷惘的一代”-“迷惘”的文学主题\n\n“迷惘的一代”指第一次世界大战前后成长起来的一代美国作家，他们是对战后一代美国青年厌恶、恐惧战争，却又找不到出路而痛苦迷惘的集中反映。战争给海明威的精神和肉体以巨大创伤，促使他成为“迷惘的一代”的主要代言人。“迷惘”是海明威创作个性的显著特征，是笼罩他全部作品的统一风格。从《在我们的时代里》到《老人与海》，他的许多作品和主人公都给人以迷惘、怅然若失的印象，它们以不同的形态表现出来-宿命论、逃避、悲剧、放纵、毁灭。即使是现实性和倾向性很强的作品，也有着浓重的迷惘色彩。\n\n二、“硬汉子”-个性鲜明的人物形象\n\n海明威塑造了众多在迷惘中顽强拼搏的“硬汉子”形象。他们以惊人的毅力和旺盛的精力，在同充满敌意的世界对抗中殊死搏斗，表现出共同的性格特征：坚强刚毅、勇敢正直，无畏地面对痛苦和死亡，他们都处在尖锐剧烈的外部和内心冲突中，他们都面对着严酷的悲剧命运，但无论情况多么严重，困难多么巨大，死神多么可怕，他们都不失人的尊严，不失勇气和决心，表现出临危时的优雅风度。这些硬汉形象大致可分三类：\n\n（一）早期的硬汉子多出现在斗牛场或拳击场上，他们孤独、倔强、争强好胜，为了人格尊严和职业的荣誉不惜孤注一掷，以死相搏，夺取胜利。以《打不败的人》中的年老的斗牛士曼努尔为代表。\n\n（二）中期的硬汉子灌注了新的时代精神和崇高信念，具有广泛的社会意义。以《丧钟为谁而鸣》的主人公乔丹为代表。这个形象已经摆脱了孤立主义，是为人民事业献身的英雄，他的对手也不是一般的邪恶势力，而是法西斯主义。\n\n（三）晚期的硬汉子具有浓厚的哲理性与象征意义。以《老人与海》中的老渔夫桑地亚哥为代表。老人桑地亚哥象征一种永恒的、超时空的存在，一种压倒命运的力量。作者将富有生命的形象同朦胧的寓意融合在一起，将现实生活的诗情画意同深刻的哲理融合在一起，创造了一种体现着人类尊严和命运重压下仍有优雅风度的硬汉子形象。\n\n三、“冰山”风格-独特的形式美\n\n海明威的“冰山”理论是其精通现代叙事艺术的集中体现。他认为作家有八分之七的思想情感蕴含在形象的背后，见诸笔端的只有那八分之一的冰尖。这一理论具体表现在他的作品的文体与结构上：\n\n（一）清澈流畅、朴实无华的散文体具有简洁性、含蓄性等风格特点\n\n首先，海明威以简约、清新的文体净化了文风。在他的作品中出现的往往是很卓绝的语句，很简单的句子结构、常用词或日常用语。他习惯于选用具体的感性的表达方式，从而使作者、对象与读者三者之间的距离缩短到最低限度，取得清晰自然、真切疏朗的艺术效果。\n\n其次，他采用了多种简约、含蓄却内涵丰富的表达形式。在他的作品中，经常包含着丰富的潜台词。他的感情总是凝结在艺术形象里，包含在简洁的景色描写、人物动作中。他常用电报式的对话、内心独白、象征手法、意识流手法等来表达复杂的思想感情。这些含而不露的写法为读者留下联想的空间，从而达到厚积薄发，笔不到意到的艺术神韵。\n\n（二）结构上，海明威往往只是截取故事的一个时间段或一个时间点，以集中反映重大的主题或历史事件，至于故事的经过和历史背景，则当作“冰山”的八分之七隐匿在洋面之下，但他又要让读者强烈地感到它的存在。","keywords":"迷惘 主题 硬汉子 形象 冰山 风格","note":"海明威可以说是20世纪现实主义文学最重要的作家，他的硬汉形象、“冰山”风格、“迷惘的一代”这些基本概念都是常考名词解释。尤其要重点注意的是硬汉形象和“冰山”风格，都可能单独设置论述题让大家分析，东北师范大学就在24年对冰山原则进行了考查，注意灵活应对。"},{"id":"241","stars":"★★★★","title":"谈谈《老人与海》中桑地亚哥的形象","body":"《老人与海》是一部命运悲剧，是人类挑战命运但最终未能摆脱命运的悲剧。小说主人公桑地亚哥，主要具备以下性格特征：\n\n一、具有存在主义自由选择的思想\n\n桑地亚哥的处世行为体现了存在主义自由选择的思想。84天一无所获，桑地亚哥依然决定继续捕鱼，因为他认为出海是他生活的意义。在两次战斗中，桑地亚哥完全可以松开钓索，放弃马林鱼，可是他进行了遵从自己意愿的选择，不苟且偷生，不浑浑噩噩，保持了积极的入世姿态。他虽败犹荣，赋予了自己存在的价值和意义。\n\n二、“硬汉子”形象\n\n《老人与海》是一曲英雄主义的赞歌。小说塑造了“重压下保持优雅风度”的老渔夫桑地亚哥的形象。他刚强有力，坚不可摧。桑地亚哥不仅把捕鱼作为谋生的手段，而且将其看作是人生角斗的象征。他捕鱼不单是为了“养活自己”，而且是“为了光荣”。84天一无所获，他不顾他人嘲讽，依然在第85天继续出海；当成群的鲨鱼扑来，他意识到这是注定失败的一场战斗，但一直坚持到底，体现了大无畏的英雄气概。\n\n三、情感丰富\n\n桑地亚哥是个情感丰富的人，这表现于他对曼诺林的依恋，对亡故的妻子的哀悼，对捕鱼业的酷爱。桑地亚哥甚至对与他作对的马林鱼也充满了感情，他一方面把马林鱼看成对手，一定要战胜它、杀死它，另一方面又把它看作朋友，在两天两夜的较量中，他被马林鱼的坚强深深地折服了，他把马林鱼看作另一个“自我”，愈来愈钦佩、热爱马林鱼。\n\n四、孤独者\n\n桑地亚哥孤身一人，没有子女，在捕鱼的过程中，寂寞时时伴随着他，小说几次提到他是一个古怪的老头，常常单独出海，在海上时时想念小徒弟曼诺林，希望有一个交流的对象、排遣苦闷的人。因此，他在海上不得不自言自语，时而跟鱼儿说话，时而对鸟儿说话，时而对自己大声嚷嚷，这一切都反映了桑地亚哥沉重的孤独感，也影射了人类的处境：人在这个世界上是孤独的，孤立无助的。","keywords":"存在主义自由选择 硬汉子 情感丰富 孤独者","note":"《老人与海》是一部命运悲剧，但他仍具有奋发昂扬的基调，给人以振奋的感觉，这其中一个重要原因便是桑地亚哥这个形象的成功塑造。如果可以用一个短语来概括这个人物，那就是“孤独的硬汉”，因此上述二、四两点需要我们重点记忆。"},{"id":"242","stars":"★★★★","title":"谈谈《老人与海》的艺术特色（26中央民族大学）","body":"一、浓郁的象征意味\n\n海明威为小说虚构了一个背景，它没有具体的时间限制，这就使得故事近似寓言。尽管海明威的写作动机并非是象征，可是作品所散发出的浓郁象征意味却是人们普遍能感受到的。大海不仅是一种自然景观，而且也是社会的象征；捕鱼不仅是一种谋生手段，也是显示人生价值的平台；而马林鱼、鲨鱼则是人生路上各种困难厄运的具体意象。由此，一个捕鱼的故事升华到了哲理的高度。\n\n二、大量使用隐喻\n\n在艺术上海明威还运用了大量的隐喻，如狮子是林中之王，棒球运动员乔迪马吉奥是冠军，小说用这些强者的意象来隐喻老人向往做个硬汉子。在小说中，世界被描写成一个一望无际的汪洋大海，充满了大大小小的马林鱼和鲨鱼，充满了惊涛骇浪和暗礁险滩，大海是凶狠的、狂暴的，是深不可测和不可知的，这就是现实世界的写照，人在这个世界上就如在茫茫大海上的一叶破舟，苦苦挣扎着，没有航标灯，没有一丝被援助的希望。\n\n三、意象改写\n\n《老人与海》以《圣经》以及希腊文化为源流，对基督、古代英雄、悲剧意识、命运观念等意象作了改写，塑造了一个\n\n现代的“打不败的英雄”。如老人看到第一条鲨鱼发出的喊声被说成是耶稣被钉死在十字架上发出的喊声，说明鲨鱼的出现对老人来说是一个沉重的打击；老人回到住处时摆出基督被钉在十字架的姿势，这是海明威在暗示老人兼有人性和神性的双重身份；老人在海上的三天相当于基督从受难到复活的三天，说明老人经历磨难最后获得了精神的胜利。\n\n四、“冰山理论”的运用\n\n（一）文体方面，小说中作者运用简洁、清新、干净的散文文体和简短、朴素、生动的语言风格。读者几乎读不到特别长的语句、华丽的语言及大篇幅的描述。这就使这一作品具有丰富的内涵和无穷的魅力。此外，海明威常用小词，省略结构，使语言生动活泼，接近现实生活，能收到言简意赅的效果。简练的语言风格使人从有限的文字中看到丰富的思想内容。\n\n（二）结构方面，小说表面十分简单，含义却十分复杂。海明威将桑地亚哥的家乡、当地人的划船比赛等一切都作为八分之七的东西，隐藏到水面下，只写老人与鱼搏斗的事迹，隐喻了人类最可贵的品格-勇敢坚强，写得集中突出，含蓄深沉，于平淡中见深远，于简约中见博大，这八分之一的东西给读者以强烈的视觉冲击力和心灵的震撼力。\n\n五、寓情于景，情景交融\n\n海明威在作品中很少直接抒情，常常寓情于景，情景交融，把老人内心感受全部倾注在不断变化的景物描写上。如太阳的每次升落都与老人情绪的变化相谐调，与老人捕鱼之进展相巧合。黎明，鱼蠢蠢欲动，老人充满信心等待着；正午，鱼开始剧烈挣扎，老人处于情绪十分紧张的状况；傍晚，鱼稍稍安静，老人也得以歇息。情随景自然变化。\n\n六、精湛的叙事艺术\n\n《老人与海》集中体现了海明威精湛的叙事艺术。（详见“试分析《老人与海》的叙事魅力★★★”）★★","keywords":"浓郁的象征意味 大量使用隐喻 意象改写 冰山理论 叙事艺术","note":"《老人与海》作为海明威的代表作，具有非凡的艺术成就，除了上述几点以外，还要结合其他题目进一步分析小说的人物塑造，叙事手法等。因为都有单独设题，所以不再在此体现，同学们要全面记忆。"},{"id":"243","stars":"★★★★★","title":"试分析《老人与海》的叙事魅力","body":"一、频繁转换叙事情境\n\n小说开头部分“准备出海”采用的是作者叙事情境，用第三人称“他”的口吻描述老人的相貌、阅历、居住环境、生活状况，展现出一位饱经风霜、经济贫困的老渔夫形象。\n\n小说主体部分“老人与鱼搏斗”出现了两种叙事情境，一是作者叙事情境，二是人物叙事情境。关于老人捕鱼动作的细节描写都是由“他”来叙述；关于老人的心理活动，小说则用人物内心独白的方式，让老人自我倾诉，即意识流描写。\n\n情境的转换将主观和客观两个世界最大限度地展现出来，具有了更大的文学表现空间。\n\n二、追求纯客观的叙述效果，不带任何主观色彩\n\n小说开头部分和结尾部分主要通过老人与小孩曼诺林的对话来交代老人的生活背景及老少之间的真挚友谊，采用的是直接引语，而且对话前不带任何导入性词语或阐释性词语，不通过叙述者的转述，没有叙述中介，这是外部聚焦，它使文本与读者的叙述距离缩短为零，读者可以真切地感受人物的情绪。\n\n主体部分伴随着一系列的心理独白，大多采用的是自由直接引语，将老人内心的感受直接袒露在读者面前，这是叙述干预最轻微、叙述距离最近的一种形式。\n\n这两种手法都是隐蔽的叙述方式，作者不发表见解，也不将感情带到人物身上，而是让人物自由地“展示”自己。其达到的目的就是纯粹的客观，这是海明威美学思想的核心部分。\n\n三、采用“重复”叙述，增加叙述频率\n\n譬如老人孤独寂寞地漂荡在海中，特别想念曼诺林，他9次重复说“但愿那孩子在这儿就好了”，频率的增加放慢了叙述速度，更衬托出老人的孤寂。\n\n四、语言干净、朴素、简练、直白\n\n作品没有任何深奥的词汇，都是日常生活中最常用的词语，却有极强的表现力。在描写捕鱼的过程中，海明威只用动词推动情节，不用形容词、副词修饰，叙述显得干净利落，很有力度，让每一个动作都显示老人高超的技艺。","keywords":"转换叙事情境 纯客观的叙述效果 重复叙述 语言干净、朴素、简练、直白","note":"海明威精湛而独具魅力的叙事是其小说的一大特色，在叙事结构上，主要采用了意识流心理型结构，以求客观；在叙事时间上，小说交叉使用顺叙、倒叙以及省略、重复等手法；在叙事情境上，多种叙事情景转换，拓宽了文学表现空间。至于语言特色，既是叙事魅力，也是艺术特色，同时也体现了作者对冰山理论的运用。"},{"id":"244","stars":"★★★★","title":"《永别了，武器》的艺术特色","body":"《永别了，武器》通过描述亨利和凯瑟琳的爱情，揭示了战争的荒唐和残酷的本质，反映了战争中人与人之间的相互残杀以及战争对人的精神和情感的毁灭。其艺术特色如下：\n\n一、文笔含蓄、简约\n\n海明威遵循“冰山原理”进行创作，即尽量做到不把所要表现的内容--铺陈开来，而是给读者留下更多的想象空间让读者自己去咀嚼和品味，以增加审美难度和情趣。在语言上，作者往往选用最普通的日常语言和短句子，很少用形容词和复句，行文如同电报一样简洁。\n\n二、运用象征手法\n\n小说中，“雨”“平原”“高山”等意象具有鲜明的象征意义。在这部作品中，“雨”象征着恶劣的外部环境、深切的内心矛盾与痛苦，也昭示着不幸与死亡。海明威似乎在给读者暗示：战争就如同小说中的雨一样，给热爱生活、热爱和平的人们带来不幸。此外，小说中的“平原”总是与战争、疾病、痛苦、不幸和死亡联系在一起；与之相对应的则是与和平、健康、幸福、美好的爱情生活联系在一起的“高山”，从而形成“在生命和家庭的形象与战争和死亡的形象之间的深刻的、占中心地位的对照”。\n\n三、叙事技巧娴熟\n\n小说虽然以第一人称进行叙事，但善于借助对话展开故事情节、刻画人物。作品每一章开头，往往先用三言两语介绍环境和人物，然后将叙事者隐去，让人物对话。这些富有动作性的、个性化的对话，推动了情节的发展，揭示了人物的性格。除此之外，小说中，在第一人称叙事者亨利的声音与作者和其他人物的声音之间形成的距离构成了一种张力，表明了海明威高超的叙事技巧。","keywords":"文笔含蓄简约 运用象征手法 叙事技巧娴熟","note":"24年辽宁大学对《永别了，武器》的艺术特色进行了考查。这部作品显露了海明威小说风格的基本特色和“现代叙事艺术”。作品故事情节简单，意境纯一。情景交融的环境描写，电文式的对话，简洁而真切的内心独白，托讽于有意无意之间，构成了海明威独特的创作风格。小说也因此而成为了一部现代世界文学名著。"},{"id":"245","stars":"★★★★","title":"谈谈《飘》的思想内涵","body":"《飘》以美国南北战争前后的历史为背景，以南方社会生活、特别是亚特兰大及周边奴隶主庄园生活为场景，以郝思嘉为中心人物，广泛反映了1861至1865年前后美国南方社会的历史风貌，展现了南方社会各色人等在这场巨大的社会变革中的命运，并以南方女性作家特有的视角和观点对南北战争和战后重建进行了独特的反映，从而引起人们对这一特殊历史时期的进一步思考。《飘》的思想内容是丰富而复杂的，主要表现在以下方面：\n\n一、历史小说-南北战争风暴\n\n《飘》以美国南北战争时期的真实事件为背景，真实地再现了这一段具有划时代意义的历史。战前南方奴隶主庄园的乡间宴会、田园生活，战争临近时南方贵族对“蓄奴制”的鼓吹，战争初期南方军队的不可一世，北方军队转败为胜的大反攻，新制度取代旧制度摧枯拉朽的阵势，战后重建时期南方社会的混乱与南方贵族们逐渐衰落的命运，等等，这些生动真实的场景，把人们带回到那个特殊的历史环境。作者以冷静客观的眼光和忠于历史事实的精神，写出了南方奴隶制社会被这场战争风暴彻底席卷而去的事实，并且揭示了这一历史趋势的不可抗拒性。\n\n二、爱情小说-理想与纠葛\n\n《飘》以郝思嘉、卫希礼、白瑞德、媚兰这4位人物的爱情纠葛为线索，揭示了蕴藏在青年男女身上美好的爱情理想。郝思嘉对卫希礼所表现的真挚爱情，虽然过于理想、过于浪漫，却展示了人性中最美好的东西，与其身上存在的一系列缺点形成鲜明对比。白瑞德对郝思嘉的爱，表达方式独特怪异，却也表现出真诚、热情和耐心。媚兰对卫希礼的爱则是南方贵族妇女爱情的写照。\n\n三、地方色彩小说-“种植园传说的百科全书”\n\n《飘》以伤感的情调、怀旧的情结、忠于历史的眼光，呈现了一幅19世纪中叶南方社会的写真图。战前南方庄园的日常生活、劳动、社交被描绘得富有诗情画意；塔罗庄园、“12棵橡树”、亚特兰大等地在战争与和平环境中的兴衰更替被展示得栩栩如生；战火纷飞的场景、收容伤兵的临时医院、战火之后的田野庄园、重建时期的亚特兰大，描绘逼真；南方人的\n\n行为举止、生活习惯、性格心理也被表现得淋漓尽致。","keywords":"历史小说 南北战争 爱情小说 爱情理想 浓厚地方色彩 南方社会","note":"《飘》的思想内容十分丰富，从不同的角度去分析，我们可以获得不同的体会。总体来说，作品以独特的女性视角，为我们呈现了南北战争时期美国南方地区的风貌和当时青年男女的爱情理想。"},{"id":"246","stars":"★★★","title":"试析《飘》的艺术特点","body":"《飘》现实主义地反映了十九世纪中叶美国南方农场主阶级的动荡生活，真实地再现了南北战争、战后重建时期的社会生活画面；生动地塑造了几个鲜明而丰满的主要人物艺术形象。其独特的艺术成就主要表现在：\n\n一、在真实的历史生活背景上塑造了一系列丰满的立体感强的圆形人物\n\n（一）主人公郝思嘉是一个极其复杂的南方女性形象，充满性格的多重性与传奇性。在为爱情、生存和振兴家业的奋斗中，她不断成长为一个纯真与野性、自由与自私、善良与邪恶、痴情与无情相混杂，既能吃苦耐劳而又贪图享受、既浪漫又现实、既无知又聪明能干的“乱世佳人”。但这样的个性也注定了她最后的悲剧结局，她在爱情上的浪漫主义、理想主义幻想，在现实生活中的利己主义、享乐主义、功利主义价值取向，导致了她对爱情和物质财富追求的双重失败。\n\n（二）卫希礼本是南方贵族中的佼佼者，醉心于南方田园牧歌生活。但在南北战争的风云洗礼中，却成了一个经不起风浪的弱者、现实生活的逃避者，一心沉浸在对往日贵族生活的回忆中，成了时代的“多余人”。他对一切都看得明明白白，却又无可奈何，明知历史潮流不可阻挡，却又不能适应，也不打算去适应。这种性格也决定了他难以接受郝思嘉大胆的爱情表白，难以支撑生活的重担，只好到回忆中寻找精神寄托。\n\n（三）媚兰与郝思嘉形成鲜明对比，她有着与生俱来的高贵气质和淑女风范以及完美无缺的个人修养和为人处世之道，是无可挑剔的上流社会贵妇人。但战争打破了她的固有生活，她以自己的爱与善、宽容与大度处理人际关系，肯定郝思嘉的勇敢、顽强、上进，也敬佩白瑞德的见义勇为。然而，她不了解时代发生的巨大变化，无法真正汇入这一时代的生活潮流。\n\n（四）白瑞德是一个具有传奇色彩的人物形象，他是一位南方贵族家庭的叛逆者，不被传统的贵族圈子所接纳。但他头脑冷静、机敏，见多识广，对时局、特别是南方社会的命运看得清清楚楚，因此他能抓住一切时机赚钱，大发战难财，表现出自私自利、不择手段、富有冒险精神的资产者投机性格。同时白瑞德身上也不乏真情和善良的一面，这是一个在特殊的社会历史环境和非凡的经历中成长起来的复杂形象。\n\n二、以时间先后为顺序，以郝思嘉的故事为中心线索，形成严谨的结构\n\n（一）小说按时间顺序叙述。全篇结构分成战争前、战争中、战争后三部分，非常紧凑。故事情节沿着南北战争发生的时间向前推进，主人公的性格与命运随着战争的发展、爱情的变故而逐步发生变化，线索极为清晰。\n\n（二）以郝思嘉的故事为中心线索。作者通过郝思嘉的经历和目光、她在塔罗庄园和亚特兰大之间的行踪，把南北战争时期的南方社会尽收笔下，同时其性格也在这种典型的时代环境中得到了有力的表现。\n\n（三）不落俗套的开头结尾。作品一开始这样写道：“那郝思嘉小姐长得并不美，可是极富于魅力，男人见了她往往要着迷。”与这个意味深长的开头相对应，小说结尾也使用开放式结尾让读者回味无穷。\n\n三、出色的心理描绘\n\n米切尔以女性的独特视角和心理感受，对郝思嘉的心理活动尤其是爱情心理进行了生动的展现。作者时而作为旁观者，对郝思嘉进行观察，从外部细小的变化来表现其心理活动，时而又自己化身为主人公本人，深入其内心，把想法-罗列出来。\n\n四、情节曲折紧张，具有通俗文学的传奇色彩\n\n小说讲述了郝思嘉作为爱情冒险家、婚姻冒险家和创业冒险家的一系列故事，富有传奇性，给读者留下了强烈的印象。\n\n20世纪俄苏文学","keywords":"圆形人物 时间顺序 心理描绘 情节曲折紧张","note":"郝思嘉的经历及个性与作家玛格丽特的亲身经历相似，因此小说具有鲜明的现实主义倾向。她以历史上的美国南北战争为故事背景，再现了真实的美国南部庄园场景。以郝思嘉的经历为中心线索，形成严谨的结构。人物的双重性格的塑造以及出色的心理描写，增添了作品的艺术魅力。作品情节曲折紧张，具有通俗文学的传奇色彩。"},{"id":"247","stars":"★","title":"谈谈你对俄国文学“白银时代”的认识","body":"一、俄国“白银时代”的内涵\n\n从19世纪90年代起，俄罗斯文学中先后出现象征主义、“阿克梅派”、未来主义等新流派，它们和变化发展了的现实主义一起，构成多种思潮和流派并存发展的文坛新格局。这个时代后来被人们称为俄罗斯文学的“白银时代”\n\n二、“白银时代”出现的原因\n\n19世纪末20世纪初，经济落后的俄国，社会矛盾十分尖锐。同时，马克思主义和西方各种现代哲学思潮开始传播，欧洲优秀的艺术成果也越来越多地被介绍到了俄国，这为俄国文化的发展带来了新的推动力，并促成了新的文化高潮（所谓“白银时代”）的到来。\n\n三、“白银时代”的成就\n\n“白银时代”的一批文学巨匠，在对前人的文化遗产加以继承的同时，做出了创造性的发挥，他们所涉及的许多思想命题，不仅在当时，而且在现在都愈来愈多地引起了各国知识分子的关注。这一时期的俄国文学取得了如下重大成就：\n\n（一）现实主义文学在这一时期仍获得重大进展\n\n这一时期，俄国年老的现实主义作家仍然活跃于文坛，例如托尔斯泰、契诃夫都在创作揭露社会黑暗的作品。高尔基是这一时期现实主义文学的杰出代表。他和布宁、安德列耶夫、库普林、魏列萨耶夫等作家一起，在继承前人的基础上锐意创新，借鉴多种新的艺术表现手法，把现实主义文学带入更广阔的境地。\n\n（二）现代主义文学派别纷纷涌现\n\n这一时期，象征主义、未来主义、阿克梅派等各种流派纷纷在俄国文学界登场，出现了许多各具特色的作家（特别是诗人），如巴尔蒙特、别雷、梅烈日可夫斯基、梭罗古勃、勃留索夫、勃洛克、洛扎诺夫、古米廖夫、阿赫玛托娃、曼德尔施塔姆、谢维里亚宁、赫列勃尼可夫、阿尔志跋绥夫等，他们为俄国文学打开了一片新的天地。\n\n总之，俄国“白银时代”的知识分子所留下的鸿篇巨著，所走过的思想历程，所拥有过的经验和教训，对当代世界文化界都有极大的参考价值和深刻的启迪意义。这个群星璀璨，人才辈出的时期，虽然在历史的长河中只是一闪即逝，但在俄罗斯文化史和世界文化史上，都留下了极其光辉灿烂的篇章。","keywords":"现实主义文学仍获得重大进展 现代主义文学派别纷纷涌现 象征主义“阿克梅派”未来主义诗人","note":"俄国白银时期文学的出现，深深影响了后世，推动了俄罗斯文学的崭新发展。它创造性地运用语言，开拓了新的文学路径和文学语言，具有深刻的社会价值批判性，有助于理解俄国社会的变革。俄国白银时期文学，也为世界文学增添了一道宝贵的风景。20世纪俄苏文学中“白银时代”和“解冻文学”这两个概念都有可能考查名词解释，要注意前者与古罗马文学“白银时代”的区分。此外，“阿克梅派”也是一个名词解释，大家要注意积累。"},{"id":"248","stars":"★","title":"试述高尔基创作的发展变化","body":"马克西姆·高尔基是20世纪苏联文学的奠基人，从沙皇俄国时期到十月革命之后，他一直笔耕不辍，而他的创作道路，大体上可以分为三个时期：\n\n一、前期创作（1892-1907）\n\n高尔基的前期作品带有浓厚的社会批判色彩。19世纪90年代，俄罗斯人民反对沙皇专制制度的斗争日益高涨。作为来自受压迫最深的底层的作家，高尔基倾向于革命。但他此时尚未形成明确的政治信仰，他是作为生活真理的寻求者走进俄国文坛的。表现时代的惨烈与人民心中的渴望，是他前期作品的基本主题。他从童年时代起，便对时代的悲怆有了心灵感应。人民的现实处境与追求解脱的努力，是他创作的主旋律。回荡在他早期作品中的基本曲调，是苦难与希望的二重奏。高尔基认为文学的目的在于帮助人理解自己，提高人的自信心。从开始文学生活的第一天起，他就致力于描写人的觉醒，探索新人的诞生。前期作品在形式上多种多样，有特写、寓言故事、诗歌、小说等短篇作品，也有剧本和长篇小说。在风格上则是浪漫主义和现实主义两种格调并存，这反映了他探索新的艺术方法的尝试。\n\n二、中期创作（1908-1917）\n\n高尔基这一时期的创作，仍然关注俄国当代社会和人民的命运，评价各种社会思潮。他观察俄国社会的历史主义立场没有改变，但是，对现实的审美把握方式正在发生变化，从以社会批判为主转向以心理分析、精神揭示为主，特别重视对俄罗斯民族心理的分析。\n\n三、晚期创作（1918-1936）\n\n1918年，苏维埃政权建立，高尔基在新政权下从事大量的文化组织工作，同时进行文学创作。高尔基在十月革命以后的思想探索和艺术探索，都表现得极其复杂。他在对待十月革命的态度上与布尔什维克发生了分歧，尽管在列宁的帮助下，高尔基正在克服自己思想上的偏见，然而欲在精神和情绪上完全摆脱低沉迷惘的状态尚需时日。20世纪以来世界的动荡、世界文学思潮的迅速更替和变化，又促使高尔基重新思考文学艺术与现实的关系等一系列重大问题。因此他主张更全面地认识生活，更多样地表现生活，强调把握生活的全部复杂性和多样性。他在20世纪20年代创作的短篇小说，就是新的艺术形式的尝试。","keywords":"前期创作 社会批判色彩 中期创作 审美把握方式 晚期创作 极其复杂 新的艺术形式的尝试","note":"高尔基的创作道路，是在不断地变化发展着的，因为他所处的社会环境，是在不断地变化发展着的。在这三个创作阶段中，无论是在思想上，还是在艺术上，高尔基一直都在进行探索与创新。"},{"id":"249","stars":"★★","title":"试分析《母亲》的创作成就","body":"《母亲》的问世揭开了无产阶级文学的新纪元。作品以1905年俄国革命中的工人运动为背景，集中描绘了攻读禁书、“沼地戈比”事件、五一游行、法庭斗争、车站被捕等中心情节。《母亲》的创作成就，主要表现在以下方面：\n\n一、塑造了一种新人的典型，把文学中的“人学”观念提高到一个崭新阶段\n\n《母亲》整部作品都在写人的成长，表现觉醒后的无产阶级革命者可以焕发出多么大的力量去完成他的历史使命。巴维尔的形象，不仅启迪人们憎恨旧社会，而且激发人们向往新生活。这种在推翻旧世界的斗争中觉醒了的人，正是高尔基在世界文学史上首次塑造的无产阶级革命者的生动形象。如果没有巴维尔·符拉索夫，文学史上英雄人物的演化过程是不完整的。无产阶级的社会理想被具体化为生动的艺术形象，获得了艺术生命。这部小说对文学史的独特贡献，首先是塑造了一种新人的典型，把文学中的“人学”观念提高到一个崭新阶段。\n\n二、展示了历史发展的总的趋势\n\n《母亲》通过一系列无产阶级革命者形象的描绘，特别是工人阶级形象的塑造，再现了20世纪初俄国革命人民的觉醒、马克思主义和工人运动相结合的过程。高尔基坚持了辩证唯物主义的观点，《母亲》写的是俄国1905年革命前夕无产阶级的斗争，却深刻地表现了俄国革命向社会主义发展的现实。巴维尔、尼洛夫娜这样的革命者在当时并不很普遍，但代表着具有无限生命力的社会新兴力量，代表着社会的发展方向。愈来愈多的群众同情并参加了巴维尔所献身的革命事业。作品有力地展示了历史发展的总的趋势。\n\n三、高扬了革命浪漫主义一革命理想主义的精神\n\n高尔基在《母亲》中充分表现了工人阶级的英雄气概和伟大理想，指明走向胜利的道路-和沙皇专制及资本主义进行顽强的斗争，并展示了美好的明天和壮丽的远景。这就对工人阶级能起到巨大的鼓舞作用。作品中虽然写到了革命者艰苦的斗争，暂时的失败，但他们在伟大理想的光辉照耀下，却充满了革命乐观主义精神。在作品最后，巴维尔和尼洛夫娜都先后被捕了，但从巴威尔在法庭的演说中，从尼洛夫娜在车站的宣传中，读者深深意识到：伟大的社会主义事业必胜，资本主义统治必亡。","keywords":"塑造新人典型“人学”观念崭新阶段 历史发展总的趋势 革命浪漫主义一革命理想主义","note":"《母亲》深刻地反映了20世纪初无产阶级政党领导下波澜壮阔的群众革命斗争：工人运动从自发到自觉，从经济斗争转到政治罢工，农民和工人在斗争中结成同盟。小说第一次塑造了具有社会主义觉悟的无产阶级英雄的形象，因而在世界文学史上占有一席之地。"},{"id":"250","stars":"★★","title":"试分析高尔基自传体三部曲的创作成就","body":"高尔基的自传体长篇三部曲包括《童年》《在人间》《我的大学》这三部小说，这不仅仅是高尔基个人的自传，更是具有极高艺术价值的文学作品，具体表现在以下方面：\n\n一、三部曲按照一定的艺术构思和创作原则，描绘了20世纪俄国社会新人性格的形成过程\n\n阿辽沙是旧社会的弃儿，自觉投身于改造旧世界的洪流，并在这个过程中使自身得到锤炼。可以说人格地描绘了阿辽沙成长的主客观条件，在强大的精神力量的支持下，他抵御了各种不良事件的诱惑，在艰苦的环境中也经受了种种严峻的考验。成年以后的阿辽沙，思想已经具备当时俄国各种社会思潮的考验，同时处处作为一位思考者，留下他的人生足迹。他憎恨邪恶、向往自由和革命，在三部曲结束时，他已走上了通往真理之路。而这种比较深刻复杂的艺术心理，他没有被壮烈的事情或英雄人物动摇了（俄罗斯传统不求本体的反叛性表意体式，不是根据某种模式塑造的阿辽沙，而是面向未来的一代新人的代表。）\n\n二、通过阿辽沙的视角展示了沙俄时代的生活现实\n\n自传三部曲通过阿辽沙的视角，凸现了沙俄时代俄罗斯生活的困塞、稚嫩和世俗，写出了\"俄国国民性的种种症相\"，小市民的生活如此贫苦和孤寞，却到处是冷漠寡淡、无聊空虚和逆来顺受，这些普通人的俄罗斯人并不是天生的恶魔，是被冷酷、专制、虚伪、孤独和背叛的俄罗斯人，小马哥吃了那个年代\"俄罗斯式的愚珠\"，将革命前途的\"人\"间慈慕\"演绎得淋漓尽致。\n\n三、做到了事实与虚构的统一\n\n高尔基的自传体三部曲在艺术上树立了传记文学的典范，三部曲的真正实现，体现了历史真实与文学真实的和谐统一。生活事实的再现，作家所选出的时代风貌是真实的，传记中的人物和情节也是真实的。这些传记文学作品，尊重历史的事实真实，把人物放在具体的历史背景下去写他的精神的成长，体现了历史与文学的共融，突出了\"事实\"这个传记文学的关键词。作家，又不离开事实，所有的事件和生活细节，作者都在头脑中作了过滤，然后把全部生活的本质呈现到读者面前。事实是一点，有赖于高尔基巧妙的叙事策略，三部曲自始至终在捕捉作者本人心灵的真实，无论是做私生活的场面还是丰盛入微的细节，映入眼帘的都是从传主的心里喷发出来的，把传主思想和性格刻画得清晰生动。这种心灵的真实性体现了传记的本质。","keywords":"描绘人性格形成过程 揭示了沙俄时代生活现实 暴露了事实与虚构的统一","note":"高尔基的自传体三部曲不仅是高尔基的自传，而且是一部价值很高的文学作品，既暴露了黑暗的社会现实，又通过阿辽沙形象的塑造表现出了对劳动新人出现的期许。关于阿辽沙的形象可参考宋家源《一代新人的成长——读高尔基自传体三部曲<阿辽沙>》，具体材料可在李凡文学正版群中领取。"},{"id":"251","stars":"★★","title":"试分析《顿河故事》的艺术特色","body":"《顿河故事》已显露出肖洛霍夫善于写悲剧的某些特点，同时也表现出肖洛霍夫特有的幽默和喜剧才能。而这正是肖洛霍夫正是以自己这多种风格的短篇小说为基础，创作出闻名世界的宏伟悲剧史诗《静静的顿河》。《顿河故事》的艺术特色，主要表现在以下方面：\n\n一、以残酷的阶级斗争为基调\n\n《顿河故事》引人注目的基调是把人物分为敌对双方的残酷阶级斗争。革命和国内战争震撼了顿河大地，影响着哥萨克的各个阶层乃至家庭关系，不仅体现为贫农和富农、红军和白军的斗争，而且深入到每个阶层、每个家庭内部，如《霍瓜里的人们》就描写任村中战地法庭警卫队长的父亲，打死了同情红军俘虏的妻子，他的小儿子为替救当红军的哥哥，砍死了前来搜寻哥哥的父亲。\n\n二、把巨大的阶级斗争场面浓缩在人与人的关系上\n\n《顿河故事》中的短篇小说特别着力于描写社会冲突的尖锐和严酷性，从而鲜明地表现年青作家的现实主义特点。肖洛霍夫对国内战争的描写、观察角度和表现方式与其他作家不同。绥拉菲摩维奇的《铁流》、富尔曼诺夫的《恰巴耶夫》、法捷耶夫的《毁灭》等作品描写的国内战争，场面较大，规模宏伟，表现一群人对一群人、一个阶层对一个阶层的斗争、集团之间的斗争和集团同个体的斗争。人之间的矛盾和冲突处在集团和阶级斗争的后面。而《顿河故事》把巨大的阶级斗争场面浓缩在人与人的关系上，通过家庭矛盾，通过父与子、夫妻、兄弟之间的对立和冲突表现出来，这就更加鲜明和突出地反映出时代变革的急遽和严酷。\n\n三、具有人道主义情怀\n\n《顿河故事》中的短篇小说里回荡着年轻作家的人道主义激情。《粮食委员》中的波加加斯凭着革命的坚定性，没蓄积因私囊粮食而被枪决的父亲，却在草原上不顾敌人的追击，救了一个冻僵的孤儿，最后被追上来的敌人杀死。这种自我牺牲精神体现了革命者崇高的情操。另一篇出色的故事《小马》讲述红军战士特罗斐姆为救一匹卷入漩涡的小马，自己反而被白军的子弹射中。作家通过这个坚强战士对小马的怜爱和温厚的感情，表现出一个普通劳动者、革命战士丰富的内心世界。\n\n四、显露出作者的幽默和戏剧才能\n\n《顿河故事》的另一类短篇小说，描写革命和新生活给予人的深刻影响。这类故事的调子明朗欢快，表现出肖洛霍夫的幽默和喜剧才能。《高尔察克、荨麻和别的》用第一人称讲故事的方式，通过喜剧性格和幽默明朗的调子，描写革命改变了哥萨克妇女的地位，确立了新的家庭关系。","keywords":"引人注目的基调 残酷阶级斗争 现实主义特点 国内战争 人道主义激情 革命和新生活 善于写悲剧","note":"《顿河故事》可以说是《静静的顿河》的前奏，正是在这部小说集之中，肖洛霍夫锻炼并完善了自己的写作技巧，为之后的长篇创作打下了坚实的基础。因而这部作品的重要性虽不如《静静的顿河》，但也值得我们稍微关注一下。"},{"id":"252","stars":"★★","title":"试分析《静静的顿河》中的人物塑造成就","body":"一、把农民推上历史舞台的中心，塑造的哥萨克农民形象达到了一个新的艺术高度\n\n肖洛霍夫在文学中第一次真正把农民推上历史舞台的中心，使他们站在最醒目的地方，让读者清晰地看见他们的形象，听见他们在革命的暴风雨年代前进的脚步声，感觉到他们心灵的跳动，理解他们复杂的性格，把握他们充满矛盾和不断变化的心理。肖洛霍夫笔下的农民，具备以下特征：\n\n（一）是历史的创造者、感受者、思考者、行动者、追求者\n\n《静静的顿河》中的葛利高里积极寻求“真理”，苦苦地探索、思虑。肖洛霍夫在他身上充分而深刻地表现了哥萨克农民所具有的属于新与旧、属于未来和过去的多重复杂本质。柯晒沃依也以一个新时代的主人翁的姿态积极行动着，他带着自己的偏激和忠于革命的心，勇往直前、无所畏惧地投入建立苏维埃政权的斗争中......这些普普通通的农民，无论他们是顺着历史潮流而动，还是逆历史风向而行，都是积极的行动者。\n\n（二）有着丰富的内心世界\n\n肖洛霍夫的人物都生活在丰富的感情当中。他们的感情不只局限在个人的狭小圈子里，这些感情同时融汇在社会生活中，并具有显著的主动性和进取性。同样，肖洛霍夫笔下的农民也有着丰富的内心世界，有感受爱情、友谊、欢乐和痛苦的丰富情感，这在俄国文学的农民形象塑造方面标志着一个新水平。\n\n二、不仅描写人物感情，而且描绘其复杂而细微的心理变化\n\n在《静静的顿河》中，娜塔莉亚在暴风雨中诅咒葛利高里，让上帝惩罚他。她由深爱葛利高里而痛苦，又由痛苦而愤怒、而不平。可是在临死时，她对葛利高里深切、热烈的爱情一下子又放射出奇异的光辉，她要求婆婆在她死后给她穿上葛利高里喜欢的那条裙子，她为不能最后见到葛利高里而惋惜，她嘱咐儿子米沙特加把她的吻和她的爱转达给葛利高里。娜塔莉亚对于葛利高里复杂的情感变化，被彻底地表现出来。\n\n三、始终把人物置于社会生活之中，置于大自然的背景之中\n\n在肖洛霍夫的作品中，人、社会、自然和谐地构成一个统一体。人物心灵的变化，反映着历史事件的发展和社会生活的变化，而自然景物又随着人物心灵的变化而变化。葛利高里再度和阿克西妮亚从村中出逃、阿克西妮亚中弹身亡的时候，葛利高里看见自己头顶上是“一片黑色的天空和一轮耀眼的黑色太阳”。“黑色的天空”和“黑色的太阳”表现了葛利高里痛苦绝望的心态和心灵上无比巨大的震撼，表现了艺术之真的至悲至美之境。","keywords":"历史的创造者 感受者 思考者 行动者 追求者 丰富的内心世界 心理变化 社会生活 大自然的背景","note":"肖洛霍夫在人物塑造这一方面取得了长足的进步，这集中表现在《静静的顿河》这部作品之中。也正是如此，肖洛霍夫才得以塑造出葛利高里等一系列生动的哥萨克农民的形象，向我们展示哥萨克人在时代的巨变中不断求索的过程。26年辽宁师范大学就考查到了哥萨克农民形象这一知识点，在农民形象塑造上，肖洛霍夫具有重要的开拓作用。"},{"id":"253","stars":"★★★★","title":"试分析《静静的顿河》的艺术特征","body":"《静静的顿河》生动地描写了从第一次世界大战到俄国国内战争结束这个动荡的历史年代顿河哥萨克人的生活和斗争，表现苏维埃政权在哥萨克地区建立和巩固的艰苦过程。它的艺术特征，主要包括以下内容：\n\n一、结构宏大，气势雄浑，格调悲壮，颇具史诗的风格特征\n\n《静静的顿河》堪称“顿河史诗”。作家的目光并非仅仅停留在男女主人公的命运上，而是将笔触伸向了广阔的社会空\n\n阿辽沙是旧社会的弃儿，自觉投身于改造旧世界的洪流，并在这个过程中使自身得到锤炼。小说令人信服地描绘了阿辽沙成长的主客观条件。在强大的精神力量的支持下，他抵御了各种不健康行为的诱惑，在艰苦的环境中也不悲观失望。成年以后的阿辽沙，思想又经受了当时俄国各种社会思潮的考验，时时处处作为一位思考者，留下了他的人生足迹。他憎恨邪恶，向往善良和高尚，在三部曲结束时，他尽管还没找到真理，但已走上了通往真理之路。阿辽沙·彼什科夫形象，不是根据某种模式塑造出来的概念化人物，而是深深扎根于生活的土壤，有丰满的性格，又是面向未来的一代新人的代表。\n\n二、通过阿辽沙的视角暴露了沙俄时代的生活现实\n\n自传三部曲通过阿辽沙的视角，凸现了沙俄时代俄罗斯生活的闭塞、粗野和恶俗，写出了“俄国国民性的种种相”。小市民的生活如此贫困和屈辱，却到处是尔虞我诈、无聊空虚和逆来顺受。这些普通的俄罗斯人并非天生的恶棍，是弱肉强食和专制残酷的社会环境泯灭了这些人的良知，使他们变得贪婪、冷酷，甚至变态。小说写尽了那个年代“俄罗斯式的愚昧”，将革命前俄国的“人间喜剧”演绎得淋漓尽致。\n\n三、做到了事实与虚构的统一\n\n高尔基的自传体三部曲，在艺术上树立了传记文学的典范。三部曲的真实观，体现了历史真实与文学真实的和谐统一。传主的生活经历是真实的，传主所生活的时代风貌是真实的，传记中的人物和情节也是真实的。这部传记文学作品，尊重历史的本质真实，把人物放在具体的历史背景上去书写他的精神成长，体现了历史与文学的共振，突出了“事实”这个传记文学的关键词。\n\n然而，作家又不囿于事实，所有的生活事件和生活细节，作者都在头脑中作了过滤，然后再把生活的本质呈现到读者面前。实现这一点，有赖于高尔基巧妙的叙事策略。三部曲自始至终都在捕捉传主心灵的真实，无论是恢弘壮观的场面还是丰繁入微的细节，无论是个性鲜明的对话还是朦胧依稀的回忆，都是从传主的心灵中喷发出来的，从而把传主的思想和性格刻画得清晰生动。这种心灵的真实体现了传记的本质。\n\n251．试分析《顿河故事》的艺术特色★★\n\n《顿河故事》已显露出肖洛霍夫善于写悲剧的某些特点，同时也表现出肖洛霍夫特有的幽默和喜剧才能。肖洛霍夫正是以自己这些多种风格的短篇小说为基础，创作出闻名世界的宏伟悲剧史诗《静静的顿河》。《顿河故事》的艺术特色，主要表现在以下方面：\n\n一、以残酷的阶级斗争为基调\n\n《顿河故事》引人注目的基调是把人分为敌对双方的残酷阶级斗争。革命和国内战争震撼了顿河大地，影响着哥萨克的各个阶层乃至家庭关系，不仅体现为贫农和富农、红军和白军的斗争，而且深入每个阶层、每个家庭内部。如《看瓜田的人》就描写担任村中战地法庭警卫队长的父亲，打死了同情红军俘虏的妻子，他的小儿子为了营救当红军的哥哥，砍死了前来搜寻哥哥的父亲。\n\n二、把巨大的阶级斗争场面浓缩在人与人的关系上\n\n《顿河故事》中的短篇小说特别着力于描写社会冲突的尖锐和严酷性，从而鲜明地表现年轻作家创作的现实主义特点。肖洛霍夫对国内战争的描写、观察角度和表现方式与其他作家有所不同。绥拉菲莫维奇的《铁流》、富尔曼诺夫的《恰巴耶夫》、法捷耶夫的《毁灭》等作品所描写的国内战争，场面较大，规模宏伟，表现一群人对一群人、一个阶层对一个阶层的斗争，阶级、集团之间的斗争占据主位，个人之间的矛盾和冲突隐伏在集团和阶级斗争的后面。肖洛霍夫则不然，他把巨大的阶级斗争场面浓缩在人与人的关系上，通过家庭矛盾，通过父子、夫妻、兄弟之间的对立和冲突表现出来，这就更加鲜明和突出地反映出时代变革的急遽和严酷。\n\n三、具有人道主义情怀\n\n《顿河故事》中的短篇小说里回荡着年轻作家的人道主义激情。《粮食委员》中的波加庚凭着革命的坚定性，没营救因私藏粮食而被枪决的父亲，却在草原上不顾敌人的追击，救了一个冻僵的孤儿，最后被追上来的敌人杀死。这种自我牺牲精\n\n间、波澜壮阔的历史事件。小说通过葛利高里悲剧性的人生道路，一方面描写了苏维埃政权在顿河地区从建立到巩固的历史进程，另一方面描写了麦列霍夫一家由盛而衰的历史命运。这两条线索交织在一起，全面展示了从第一次世界大战到国内战争结束的整个时代的风云变幻，构成了一幅波澜壮阔、多彩多姿的历史画卷。其中既有重大的政治历史事件，也有硝烟弥漫的战场厮杀，还有洋溢着浓厚乡土气息的哥萨克人的劳动、爱情和日常生活。小说结构庞大复杂而又严谨有序，显示出作家驾驭鸿篇巨制的非凡才能。\n\n二、突破悲剧传统模式，表达出对人的价值的关注\n\n在叙事方式上，《静静的顿河》突破了悲剧的传统模式，没有刻意制造的悲剧效果，却将读者引向更为深远和开阔的精神境界。肖洛霍夫在书中着重写的是：在旧政权和新政权、红军和白军、新世界和旧世界斗争过程中，以葛利高里·麦列霍夫为代表的哥萨克人走向新生活的艰难曲折的历史道路和他们中许多人充满迷误和痛苦的悲剧命运，以及在两个时代急剧转变中的整个哥萨克世界，并由此表达出了对人的价值的关注。\n\n三、人物众多，主要人物个性鲜明\n\n《静静的顿河》人物众多，几乎囊括了各个阶级、各个阶层、各种类型的人物。其中几个主要人物极富个性。沉着干练的施托克曼，对革命忠心耿耿的彭楚克，勇敢乐观而又鲁莽偏激的珂晒沃依，令人掩卷难忘。妲丽亚肮脏无耻，阿克西妮亚热情放荡，娜塔莉亚善良端庄，杜妮亚希珈天真活泼，这几个哥萨克妇女则各具特色。当然，小说杰出的艺术成就是成功塑造了葛利高里这个不朽的典型形象。葛利高里既有哥萨克人的共性，又有独特的个性，既不是单纯的正面人物，也不能简单地归类为反面人物，而是一个血肉丰满的艺术典型，他在苏联文学乃至世界文学的人物画廊中卓尔不群，熠熠生辉。\n\n四、具有浓郁的顿河乡土气息\n\n小说在哥萨克民风民情的描写和粗犷豪迈性格的刻画上，在哥萨克民歌民谣的采集和方言俚语的运用上，都极具特色。作品笔调清新，语言幽默，比喻新鲜，景物描写出色，作者厚实的生活积累使得作品塑造的画面极为生动，充满了浓郁的顿河乡土气息。\n\n现代主义文学","keywords":"描绘了新人性格形成过程 暴露了生活现实 事实与虚构的统一\n“顿河史诗”结构宏大 突破了悲剧的传统模式 对人的价值的关注 人物众多 个性鲜明 顿河乡土气息","note":"高尔基的自传体三部曲不仅仅是高尔基的自传，而且是一部价值极高的文学作品，既暴露了黑暗的社会现实，又通过阿辽沙形象的塑造表现出了对社会新人出现的期许。其中尤其值得我们注意的是以虚实结合的方式创作传记文学，这一手法极具开拓性，为传记文学处理虚实之间的关系树立了典范。关于阿辽沙的形象可参考宋寅展《一代新人的成长-谈高尔基自传体三部曲中阿辽沙的形象》，具体资料可在李凡文学正版群中领取。\n《静静的顿河》从人道主义的立场揭示了战争和人性真实的内涵，反思了革命与战争的正义性与非正义性问题，揭示了人性和良心的本真面目，对真实的生命内涵进行了探索。这些都是人道主义在那个特殊年代的具体表现，也折射出了现代文明中人类所面临的生存困境，从而使作品具有永恒的魅力。这部作品的艺术特征，需要我们仔细记忆。"},{"id":"254","stars":"★★","title":"现代主义文学出现的原因","body":"现代主义文学是西方现代工业社会的产物，是20世纪动荡不安的欧美社会的时代精神的艺术表述。而现代主义文学的出现与流行，并非仅仅受外部因素的作用，同时还受文学自身规律的制约和推动，因而它并非是脱离文学传统突然从一个历史断层中冒出来的，而是传统文学合规律的发展与延续。\n\n一、外部因素\n\n19世纪中后期到20世纪初，欧美的科学技术飞速发展，刷新了西方文明的面貌，改变了人们对宇宙、世界和人的看法。欧美社会的现实矛盾使现代西方人动摇了传统的真、善、美的观念，动摇了宗教信仰，对人类的本性产生了怀疑，对未来的命运与前途深感悲观与焦虑。在这种社会背景下，西方非理性主义的文化思潮一时间在社会中普遍流行。从文化思想的角度看，现代主义文学正是西方现代非理性哲学和现代心理学结合后的产物。叔本华的唯意志论、尼采的权力意志论、柏格森的直觉主义、弗洛伊德的精神分析说等理论和学说，使现代主义文学染上了非理性主义和悲观主义色彩。\n\n二、内部因素\n\n现代主义文学也是西方文学自身发展演变的结果。19世纪后期一些作家开始感觉到，以往的文学，尤其是现实主义文学，过于强调再现外部客观世界，使得文学自身应有的表现功能相对萎缩，艺术形象中的客观外部因素过于突出，而主观内在因素一定程度上遭排挤了。于是，他们开始转而重视对主观内心世界的真实展示，而使现代主义文学具有明显的反传统特征。这显示了对传统文学的超越，同时这种超越又是传统文学演变的结果。无论是浪漫主义、现实主义还是自然主义都或多或少地露出了些现代主义文学的端倪，为现代主义文学提供借鉴。","keywords":"科学技术飞速发展 对宇宙、世界和人的看法 非理性主义 对传统文学的超越 传统文学演变","note":"现代主义文学出现并流行，一方面是外部原因，科学技术发展和社会变动、战争等因素改变了人们的思想，导致非理性主义流行；另一方面，现代主义文学出现也是文学自身发展规律的表现，体现了对现实主义文学局限性的反思，现代主义文学是传统文学的发展与延续。另外注意，“现代主义”是一个常考名词解释，大家要注意积累。"},{"id":"255","stars":"★★★★★","title":"试结合相关作品分析20世纪西方现代主义文学的基本特征（26湖南师范大学）","body":"欧美现代主义文学是对思想上具有强烈反传统倾向、艺术形式上追求实验创新的20世纪西方众多文学流派的总称，主要包括后期象征主义、表现主义、意识流、超现实主义、存在主义和魔幻现实主义等重要文学流派。它是西方现代社会生活\n\n的产物，也是欧美文学发展、演变的必然结果。\n\n一、思想特征\n\n（一）现代主义具有强烈的文化
