程度上带有普遍的性质，是时代和社会的悲剧，因而特别动人心魄，发人深省。\n\n但莎士比亚悲剧一般不把悲喜截然分开，而是在不损害悲剧基调的原则下把它们结合起来，在情节发展的进程中，让庄严中有轻松，从而达到以喜衬悲、以喜促悲的效果，并使主题、意蕴得以升华。《麦克白》中“看门人”一场，还有《哈姆莱特》中“墓园”一场，便是最鲜明的例证。\n\n二、形象塑造：深刻精致\n\n莎士比亚不仅将人物放在外部冲突中去描绘，而且写出了人物的内心冲突，这就体现出了形象塑造的深刻性和精致性。如奥赛罗在信任与怀疑之间，在爱与恨之间，进行了激烈的斗争，灵魂里掀起了巨大的风暴。麦克白由于野心和权势的诱惑，走上了弑君犯罪的邪途，因而在谋杀邓肯之前，充满了痛苦和激烈的思想斗争，在事后又充满了无穷的悔恨。精神上的巨大痛苦和烦扰，剥夺了他的一切欢娱，甚至使他感到人生的毫无意义。\n\n三、表现手段：充分想象\n\n莎士比亚充分发挥自己的艺术想象。他让鬼魂、女巫上场，直接参与舞台表演，利用伊丽莎白时代人们普遍存在的迷信观念，来帮助制造气氛，展开情节，刻画人物，从而取得了惊人的戏剧效果。\n\n四、语言特色：意象运用\n\n意象的充分运用构成了莎士比亚悲剧语言上的最大特色。莎士比亚悲剧中的意象不仅是大量的、成群的，而且在每一剧中，均有一个乃至几个主导意象，而这又直接关系到作品主题的表达。例如《罗密欧与朱丽叶》中的“光”的意象，《哈姆莱特》中的“疾病”的意象，《麦克白》中的“黑暗”“鲜血”“不合身的衣衫”等意象，它们具体形象，含蕴深远，最大限度地表达了作家的意念与思绪。","keywords":"艺术风格：悲壮 悲喜交融 形象塑造：深刻精致 表现手段：充分想象 语言特色：意象运用","note":"24年扬州大学和西南大学都对莎士比亚的悲剧进行了考查，我们要重点掌握。大家在作答时，可以结合莎士比亚比较有代表性的悲剧作品，如《哈姆莱特》《奥赛罗》等进行分析，丰富答案的内容。"},{"id":"48","stars":"★★","title":"莎士比亚的传奇剧有何审美特色","body":"一、浪漫情节中的奇崛美\n\n莎士比亚通过神话般的奇特故事，梦境、神谕和魔法的神秘性，以及偶然性与巧合的频繁发生，构成了一出出险峻奇兀、惊心动魄的戏剧。它不仅渗透着作者的狂放想象，也蕴含着作者对于人生的洞彻理解和豁达态度。\n\n二、田园背景里的恬适美\n\n在莎士比亚的传奇剧里，在剧情由“悲”转“喜”的过渡阶段，都有一个自然背景和田园环境的描绘。如威尔士的深山密林（《辛白林》），波希米亚的辽阔草原（《冬天的故事》），地中海里的无名孤岛（《暴风雨》）等。这里人迹罕至，荒远偏僻，但却山清水秀，鸟语花香，气候宜人，物产丰富。这样的田园背景，自然也就成了落难人物最好的去处，因为它不仅有助于抚慰他们受伤的心灵，还有助于拓宽他们善良的胸怀，陶冶他们美好的性情。这样的描绘，显然是属于作者心造的幻影，但这却是饱经风霜岁月、洞察人情世故之后的一种幻想，渗透着一种真挚的感情追求，一种持久的美好向往，因而弥足珍贵。\n\n三、象征结构内的和谐美\n\n莎士比亚传奇剧的结构原则为：剧情由合到分再到合，即家庭关系由和谐到分裂再到和谐，而场景则由宫廷到社会（田园）再到宫廷。这一“圆”形结构方式，反映出“周而复始、循环往复”的自然规律，也蕴含着作者对于社会现实的理解与希望。当然，这一理想境界的达到，并非一朝一夕之事。所以，在他的传奇剧里，从悲剧性情节到喜剧性结尾，其间往往插入了一段漫长的过渡阶段。这就反映出作者的创作意图：从分裂到和谐，从不幸到欢乐，既取决于人们心灵创伤的治愈，又取决于人们污浊灵魂的净化，而这两者，都是需要“时间”的。这样，“时间”也就成了一个“寓意人物”，在剧中扮演着十分重要的角色。此外，在这个“圆”形结构方式的终点上，情节无一例外地归结为婚姻的缔结，家庭的欢聚，用以表示和解的最终实现、新生活的由此开始。这是戏剧中的诱人现实，也是莎士比亚理想中的光辉未来。","keywords":"浪漫情节中的奇崛美 田园背景里的恬适美 象征结构内的和谐美","note":"莎士比亚传奇剧的特征，主要体现在浪漫情节、田园背景和象征结构三个方面。莎士比亚的传奇剧和他的悲剧、喜剧相比，重要性有所下降，但仍值得我们去注意。"},{"id":"49","stars":"★★★★★","title":"哈姆莱特人物形象分析","body":"《哈姆莱特》悲剧主人公哈姆莱特是一个处于理想与现实矛盾中的人文主义者的形象，他的形象，经历了以下几个层次的变化：\n\n一、快乐的王子\n\n哈姆莱特是丹麦的王子，他在威登堡大学念书时，接受了人文主义思想的熏陶。那时，他把世界看成是光彩夺目的美好天地，他认为“负载万物的大地”是“一座美好的框架”，“覆盖众生的苍穹”是“一顶壮丽的帐幕”。哈姆莱特以人为中心去认识世界，认识人生，认为人是“了不起的杰作”，是“宇宙的精华，万物的灵长”。这种议论，体现了人文主义者对人、对社会所寄托的理想，说明哈姆莱特曾经是个怀抱理想的乐观的人文主义者。正是这种乐观思想，使他将父亲看成一个十全十美的理想君王，将母亲看成圣母一样纯洁的女性。那时的哈姆莱特是“快乐的王子”。\n\n二、忧郁延宕的王子\n\n剧本一开始，世界便已“颠倒混乱”，人们噩梦不断，惶惶不可终日。面对父死母嫁、王位被篡夺的严酷现实，哈姆莱特像一夜间遭到严霜袭击的娇花，精神颓唐，痛苦与忧虑使他成了一个“忧郁王子”。在昔日的理想被击碎的情况下，他一方面激愤地诅咒这个“冷酷的人间”，一方面又深入地思考与研究生活于其间的人。他对世界的看法有了根本性的改变，在此时的哈姆莱特眼中，“负载万物的大地，只不过是一个不毛的荒岬；这个覆盖众生的苍穹，只是一大堆污浊的瘴气的集合”。至于人，“在我看来，这个泥塑的生命算得了什么？”可见，严酷的现实，已击碎了他昔日的梦幻；梦幻的破灭，意味着他的人文主义理想和信念的破灭，他成了一个面对重重矛盾，精神无所寄托的“流浪儿”。\n\n父亲蹊跷离世；母亲快速改嫁，叔父继承了王位并且娶了他的母亲，现实的急剧变化让哈姆莱特跌入痛苦之中，对人生和世界感到失望。面对父亲鬼魂的嘱托，他辨析忠奸、寻找机会，却在复仇行动中表现得犹疑不决，理想与现实的矛盾，造成了他行为上的延宕，使他表现为一个“延宕的王子”。\n\n三、行动的王子\n\n哈姆莱特虽有延宕，但是，他最后还是成为了一个“行动的王子”，在与强大的邪恶势力斗争中献出了自己的生命，不仅为父亲复仇，也达到了重整社会秩序的目的。\n\n总之，哈姆莱特形象概括了新旧交替时期人文主义者的思想面貌，表现出了人文主义者同黑暗现实的矛盾和斗争，以及他们探求真理的历程，揭示了理想和现实的矛盾与距离，以及解决这一矛盾、缩短这种距离的必要性和迫切性。","keywords":"快乐的王子 忧郁延宕的王子 行动的王子","note":"《哈姆莱特》这部悲剧作品非常受欢迎，很大程度上是因为这部作品的人物形象的复杂性以及它的艺术价值。性格决定命运，从整个故事发展中我们不难发现，剧中人物的悲剧命运都和他们的性格有着直接的关系，哈姆莱特也不例外，掌握其形象特征有助于我们更好地理解作品主题。此外，这一形象也常以名词解释的形式进行考查，大家要注意积累。"},{"id":"50","stars":"★★★★","title":"谈谈对《哈姆莱特》复仇主题的认识","body":"《哈姆莱特》整个故事是围绕复仇这个主题展开的，如何认识其复仇主题，关系到如何认识这部作品。\n\n一、具有社会性\n\n从社会学的角度看，哈姆莱特在鬼魂那里得知了父王猝死的原因，接受了复仇的任务后，他迟迟不付诸行动，表现出行为上的拖延和犹豫，这是由于他所面对的社会邪恶势力过于强大，作为新兴资产阶级代表的哈姆莱特还不能胜任“重整乾坤”、改造社会的历史重任，因而，他的复仇以及他的悲剧具有深刻的社会意义。这也是整个剧情的发展赋予这一形象的社会历史层面的含义。\n\n二、表现出了人性的复杂\n\n哈姆莱特形象的深度、复杂性及艺术魅力还有待于在哲学和艺术层面上的阐释。哈姆莱特的犹豫不只因为找不到复仇的方法，还因为他所进行的关于人类生命本体的哲学探讨，涉及人的生存、死亡与灵魂等形而上的问题。在理想幻灭的哈姆莱特眼中，人的心灵是阴暗污浊的，人在本体意义上是丑恶的。哈姆莱特对人的这种认识是偏激的和悲观的，但却有其历史的深刻性和艺术的概括性，因为这实际上隐喻了文艺复兴时期在个性解放的口号下人们“为所欲为”、一味放纵情欲带来的社会罪恶。可见，哈姆莱特的犹豫不只是找不到复仇方法时产生的矛盾的心理，而且是他感悟到人的渺小、人的不完美、人生的虚无时那迷惘与优虑心态的外现，同时也是欧洲文艺复兴晚期信仰失落时人们进退两难的矛盾心理的象征性表述。哈姆莱特身上所表现出来的关于人性复杂、人性悖谬的思想，成了近代以来欧洲文学关于人的问题思索的基本指向。\n\n三、肯定了哈姆莱特在道义上的胜利\n\n复仇以悲剧结局，但戏剧没有渲染悲观思想，而是肯定了哈姆莱特在道义上的胜利。哈姆莱特在公众面前揭露了克劳狄斯的罪行，并与之同归于尽，既铲除了奸人，也达到了以正视听的目的。戏剧通过霍拉旭为哈姆莱特举行的葬礼，表达了哈姆莱特在道义上的胜利。","keywords":"社会性 人性的复杂 肯定了哈姆莱特在道义上的胜利","note":"总的来说，《哈姆莱特》中的复仇主题探讨了复仇的动机、方式、代价、道德、人性等多个方面，剧中角色的复仇之路也充分展示了复仇的痛苦、复杂和无法解决问题的局限性。通过这一主题，莎士比亚向读者展示了人性中的弱点和黑暗面，也给人们带来了反思和启示。"},{"id":"51","stars":"★★★★","title":"《哈姆莱特》的艺术特色","body":"《哈姆莱特》在艺术上代表了莎士比亚戏剧的最高成就，其艺术特色主要表现在以下几方面：\n\n一、人物形象塑造手法多样\n\n（一）《哈姆莱特》着重通过内心矛盾冲突的描写揭示人物的深度。莎士比亚的悲剧以描写人及人的自然本性为核心，在戏剧冲突的建构上，表现人与人以及人自身的理智、信念与情感、欲望之间的冲突，这就构成了内与外双重矛盾冲突。因此，莎士比亚的悲剧在人的内心世界的开掘上达到了空前的深度。哈姆莱特是世界文学史上一个极富艺术魅力的典型，这种魅力的产生很大程度上依赖于形象心理蕴含的丰富性。例如哈姆莱特追怀理想，又对现实的丑恶感到失望甚至悲观；向往人性的善，又深信人自身有恶的渊薮；觉得人生无意义，又对死后的世界充满恐惧，等等。这一系列的内心冲突描写既显示了主人公心灵世界的丰富性，也展示出了其性格的复杂性。\n\n（二）出于展示人物心灵世界和刻画人物性格的需要，莎士比亚善于运用内心独白这一艺术手段。哈姆莱特的多次独白，表达出他对社会与人生、生与死、爱与恨、理想与现实等方面的哲学探索，披露出他内心的矛盾、苦闷、困惑、迷惘和恐惧\n\n等多方面的心理内容，有效地刻画了人物性格，也推动了剧情的发展。他关于“生存还是毁灭”的著名独白，十分准确地传达出了他此时的矛盾心态，是他犹豫延宕性格的一个典型例证。\n\n（三）为了使人物形象达到丰富性和个性化的有机结合，莎士比亚还成功地把对比手法用于人物塑造。《哈姆莱特》形象众多，不光有正、反人物之间的对比，还有同一类人物之间的对比。老哈姆莱特与克劳狄斯，同为君王形象，但前者相貌优雅、精神威凛、姿态矫健、仪表卓越，如同“天神”一般；后者乱伦奸淫、诡诈阴险、卑鄙无耻，是“一个冒充国王的丑角、一个盗国窃位的扒手”。\n\n二、情节的生动性与丰富性\n\n莎士比亚戏剧情节一般都是多层次、多线索的，两条或两条以上的情节线索，或平行发展，或交错递进，产生强烈的戏剧效果。《哈姆莱特》一剧除哈姆莱特复仇的线索之外，还有雷欧提斯和挪威王子福丁布拉斯的复仇线索。三条线索以哈姆莱特的复仇为主线，以雷欧提斯和挪威王子福丁布拉斯的复仇为副线，交错发展而又主次分明。三条线索起到了互成对比、激化矛盾的作用，使戏剧场面不断转换，造成戏剧高潮，产生动人心弦的艺术效果，共同表现全剧的主题。\n\n三、创作方法具有现实主义和浪漫主义两重性\n\n（一）《哈姆莱特》通过一系列具体场景的描绘，诸如御前会议上的唇枪舌剑，宫廷大厅里的酗酒纵乐等，勾画出了一个矛盾重重、浊流泛滥、内外交困、险象环生的国家现实，令人不得不联想到作者生活的现实状况。同时，场景中活动着的人物，他们的思想感情、行为方式和理想追求莫不显示出英国社会现实的“本来面目”。\n\n（二）作者在运用现实主义手法的同时，也融会了浪漫主义的因素，从而使剧作的内容和形式更为和谐统一，色彩更为丰满诱人。作者的笔触，深入到了人物灵魂的底部，反映出了他们的忧虑与悲哀、愤懑与激越、苦闷与彷徨。\n\n莎士比亚通过对白的巧妙运用，展示了人物复杂深邃的感情世界。另外，通过想象而构成的一幕幕奇特怪异的场景，诸如夜半城楼鬼魂的显现，“戏中戏”的巧置机关，荒芜墓地中的戏谑与格斗，等等，更是引人注目，动人心弦，充满浪漫诡谲的色调。莎士比亚悲剧之所以具有如此巨大而迷人的魅力，其根源就在这里。\n\n四、语言具有个性化、形象化特征\n\n《哈姆莱特》的语言形象化突出，特别善于运用比喻和隐喻来表达人物的复杂心理，人物的语言呈现出多样化风格，紧密地配合着人物的性格。莎士比亚的人物语言，不仅符合人物的身份，而且贴合人物当时所处的环境，和人物的戏剧动作相称相依。他还善于使用恰当的比喻、双关语、成语等形象化的语言。","keywords":"人物塑造 内心矛盾冲突 内心独白 对比手法 情节结构 多层次多线索 现实主义和浪漫主义 语言个性化形象化","note":"《哈姆莱特》在思想内容上具有强烈的反封建意义，在艺术上是莎士比亚戏剧艺术成熟的标志。复杂的人物性格以及丰富完美的悲剧艺术手法，体现着莎士比亚高超的戏剧创作水准。《哈姆莱特》代表着整个西方文艺复兴时期文学的最高成就，需要我们重点掌握。"},{"id":"52","stars":"★★★★","title":"分析哈姆莱特形象的悲剧性","body":"一、人物关系的悲剧性\n\n（一）亲情的悲剧\n\n首先，对于哈姆莱特来说，父亲离奇去世、母亲突然改嫁，是亲情的悲剧；其次，哈姆莱特在处理同王后的亲情关系上同样展现出悲剧性。其实王后并非是哈姆莱特想象中的淫荡恶毒的形象，相反这是一个善良且又无辜的角色，在整出悲剧中是一个无辜者和牺牲品的形象。王后对克劳狄斯的谋杀计划一概不知。改嫁也并非是她主动的行为。作为一个妻子和母亲，王后的所作所为是无可挑剔的。最后王后阴差阳错地饮下了原本为哈姆莱特准备的毒酒，终结了自己悲剧的一生。这是王后生命悲剧的归宿，也是哈姆莱特在亲情上的悲剧体现，是整部作品的悲剧性的一部分。\n\n（二）爱情的悲剧\n\n哈姆莱特同奥菲利娅的爱情关系体现出极大的悲剧性。哈姆莱特曾经疯狂地迷恋奥菲利娅，对她热情地追求，但是在遭遇父亲遇难和母亲改嫁的变故后，他对爱情失去了信心并且产生了动摇，同时为了复仇，哈姆莱特不得不选择冷落奥菲利娅，哈姆莱特将对母亲的怒气全部都转移到了奥菲利娅身上。而奥菲利娅也经受了父亲被心爱的人错杀，兄长失踪，哈姆莱特被流放的多重不幸。她孤身一人，精神极度崩溃，最终在河边失足而死。奥菲利娅的死亡和悲剧都与哈姆莱特有着直接的关系这都体现着哈姆莱特与奥菲利娅爱情的悲剧性。\n\n二、人物性格的悲剧性\n\n就哈姆莱特这一形象本身而言，其性格和思想中的一些局限也增加了其悲剧性色彩。哈姆莱特在学校接受了人文主义教育，虽然学识丰富、才能超凡，但不得不过早承担为父报仇和扭转社会局面的责任，这些对他而言都太过于沉重，加之其人文主义思想本身缺乏现实的磨炼，并且受到了宗教思想的影响，导致他一再延误复仇的行动，错失了良机，在铲除奸人的同时也献出了自己的生命。例如，哈姆莱特本可以轻松地杀掉正在忏悔的克劳狄斯，但宗教观念和公开惩罚恶人的社会责任，让他放弃了机会，为其最后牺牲直接埋下了隐患。可见，哈姆莱特形象的悲剧也可以在其命运和性格、思想中找到肇因。\n\n三、斗争结局的悲剧性\n\n哈姆莱特形象的悲剧性，就突出地体现在代表人文主义理想的哈姆莱特与封建僭主克劳狄斯之间进行的斗争中。奸人克劳狄斯毒死了自己的哥哥，篡夺了王位，王子哈姆莱特接受了为父报仇的重任。但是，作为一名在德国接受了人文主义教育的王子，哈姆莱特认识到铲除奸人并不仅仅事关需要履行的家庭职责，它还联系着“重整乾坤”这一社会责任。然而，在哈姆莱特与克劳狄斯的较量中，他们之间力量悬殊，克劳狄斯利用权力、欺骗和威胁，让宫廷大臣和哈姆莱特的母亲、女友、同学都成了自己控制哈姆莱特的工具。在这种力量悬殊的斗争中，哈姆莱特没有退缩，最后与奸人同归于尽，既到达了为父报仇、铲除奸人的个人目的，也到达了“重整乾坤”的社会目的。哈姆莱特的复仇以及他为复仇而献出自己生命的行为，代表了正义对邪恶的抗争，体现出鲜明的崇高精神，他的毁灭具有强烈的悲剧性。\n\n总之，哈姆莱特这一人物形象的悲剧性具有丰富的内容，融合了多种悲剧结局，既反映了人文主义理想和严酷现实的剧烈冲突，折射了时代的特征，同时也反映了作为一个具体的个体在历史发展过程中所具有的独特性和真实性，以及人性本身和现实人生所具有的复杂性。","keywords":"人物关系的悲剧性 亲情的悲剧 爱情的悲剧 人物性格的悲剧性 斗争结局的悲剧性","note":"《哈姆莱特》中表现出来的悲剧性是时代背景下的必然结果，也与哈姆莱特自身的性格缺陷有着不可避免的关系。《哈姆莱特》通过哈姆莱特的斗争表现出人文主义者同封建旧势力的斗争，歌颂了人文主义精神，而哈姆莱特自身反映出来的缺陷却也影射着时代的迷茫和混沌。"},{"id":"53","stars":"★★★★★","title":"试论述莎士比亚《哈姆雷特》中王子复仇延宕的原因","body":"哈姆莱特是文艺复兴末期人文主义者的典型形象，他接受了人文主义新思想与新观念，认为人是“了不起的杰作”，是“宇宙的精华，万物的灵长”，回国后却一连遭受父死母嫁、叔叔篡位的三重打击。在理想与现实的残酷碰撞下，哈姆莱特原先对人和社会的美好看法受到严峻挑战，他也因而陷入了深刻的精神危机。在严酷的现实面前，哈姆莱特理想幻灭，开始了痛苦的探索。然而哈姆莱特并没有抓住机会进行复仇，而是贻误时机，造成了行动上的“延宕”，也因此引起了后人对此的各种推测。\n\n一、外在冲突\n\n（一）哈姆莱特的延宕有其深刻的社会原因，那就是在复仇的过程中，他逐渐认识到自己的行动已不单是为父报仇，而是与整个国家民族的命运联系在一起，他有责任和义务在这个颠倒混乱的时代改造现实，重整乾坤。相比之下，仅仅为父报仇就要简单得多，哈姆莱特所怀疑的不是应该做什么，而是如何做好它。\n\n（二）哈姆莱特推迟为父复仇的行动是因为敌我双方力量的悬殊。哈姆莱特与克劳狄斯的冲突构成了悲剧的主要冲突，也代表了正义与邪恶的斗争，他需要将克劳狄斯的僭主嘴脸昭示天下，达到以正视听的目的。为此，他不得不选择合适的时机。恶势力过于强大，而时代与人文主义的局限性又决定他不可能去依靠、发动群众，因此他只能孤军奋战，最后终于被恶势力吞没。相对沆瀣一气的宫廷，他显得势单力薄，不得不确定事情的真相，以免误入奸王的圈套，客观上造成了复仇行为的延宕。从这个意义上来说，哈姆莱特的悲剧已不仅仅是一出个人的悲剧，而是人文主义者和整个时代的悲剧。\n\n二、内在冲突\n\n（一）哈姆莱特自身的性格矛盾加重了他在复仇方面表现出来的延宕。哈姆莱特的人文主义思想来自学校教育，所以，作为一位人文主义者，其思想的形成缺乏现实检验与成熟思考的过程。在严酷的现实面前，哈姆莱特就容易走向犹疑和彷徨而过多地陷于思考之中，重新审视、认识人生。对人文主义理想的坚信与怀疑，构成了哈姆莱特内心激烈冲突的核心。这些痛苦的思考，使得哈姆莱特一度推迟了复仇行为。\n\n（二）宗教意识浓烈。哈姆莱特报仇的第一个非常有利的机会是他的叔父在祈祷的时候，但是举刀之际，哈姆莱特却犹豫了，理由是：“一个恶人杀死我的父亲；我，他的独生子，却把这个恶人送上天堂。啊，这简直是以恩报怨了。”“现在他正在洗涤他的灵魂，要是我在这个时候结果了他的性命，那么天国的路是为他开放着，这样还算是复仇吗？”由此可见，\n\n哈姆莱特的思想认识具有浓重的宗教色彩，信奉人向上帝忏悔就能被饶恕，人死可以上天堂。他不能让害死父亲的仇人洗清在人间的罪名，进入极乐世界。他下意识认为如果不把叔父的罪恶向世人昭示，让他受到世人的唾弃，道义的谴责，那么，即使杀死了他，也不算是真正意义上的报仇。正是这种思想里的宗教因素使他错失了复仇的机会。\n\n总之，哈姆莱特在悲剧中表现出来的延宕，既反映了社会的时代特征，再现了人文主义理想与现实的差距，以及缩短这一差距的必要性与迫切性；也突出了哈姆莱特这一人物形象的性格特点，表现了他作为一个王子，一个具体的个体，在正义与邪恶的永恒斗争中所承受的痛苦与独特性的存在境遇。","keywords":"外在冲突 社会原因 敌我双方力量的悬殊 内在冲突 自身的性格矛盾 宗教意识浓烈","note":"哈姆莱特作为延宕的王子，延宕是其最突出的性格特点，这也是各个院校的一个考查重点，例如在2023年，就有北京外国语大学、扬州大学两所学校进行了考查：“论述哈姆莱特的延宕及其复仇的原因”“怎样看待哈姆莱特复仇行动上的犹豫”。虽然题目中的话术不同，但作答时总体离不开外在冲突、内在冲突两点，大家可以据此进行拓展延伸。在作答时，大家注意文本和历史背景的结合，不能将哈姆莱特的情感和思想与当时的社会背景和文化环境脱离开来。"},{"id":"54","stars":"★★★","title":"简析哈姆莱特性格的忧郁特征","body":"忧郁是哈姆莱特性格的一个重要特征，因此，他常常被后人称为“忧郁的王子”。其忧郁主要表现在以下几点：\n\n一、对人生的厌倦，对死的向往，是哈姆莱特思考的主要内容，也是他忧郁的具体表现。在《哈姆莱特》中，哈姆莱特的忧郁通过旁人的台词和他自己的独白表现了出来，而著名的独白“生存还是毁灭”更是充分地揭示了哈姆莱特内心的痛苦，以及他对人生的厌倦。\n\n二、忧郁不是哈姆莱特的天性，而是其人文主义理想破灭之后的精神表现。哈姆莱特从学校接受了人文主义理想的教育，对人、人性和世界充满了积极、乐观的看法，赞扬人是“万物的灵长、宇宙的精华”，世界是“一座巨大的花园”。其父母在他的眼里就成了人文主义理想的典范。但是，面对父死母嫁、王位被篡夺的严酷现实，哈姆莱特像一夜间遭到严霜袭击的娇花，精神颓唐，痛苦与忧虑使他成了一个“忧郁王子”。在昔日的理想被击碎的情况下，他一方面激愤地诅咒这个“冷酷的人间”，一方面又深入地思考与研究生活于其间的人。他对世界的看法有了根本性的改变，在此时的哈姆莱特眼中，“负载万物的大地，只不过是一个不毛的荒岬；这个覆盖众生的苍穹，只是一大堆污浊的瘴气的集合”。他甚至改变了对人的看法：“在我看来，这个泥塑的生命算得了什么？”可见，严酷的现实，已击碎了他昔日的梦幻；梦幻的破灭，意味着他的人文主义理想和信念的破灭，他成了一个面对重重矛盾，精神无所寄托的“流浪儿”。\n\n三、哈姆莱特的忧郁还具有丰富的社会内涵。家庭的变故让他感受到了现实的严酷，看到了现实的混乱与丑恶。他的台词在哀叹自身的不幸、命运的不公的同时，也充满了对现实的批判。在他眼里，人世“长满恶毒的莠草”，是一个“荒芜不治的花园”，丹麦是“一座牢狱”，到处是“世人的鞭挞和讥嘲、压迫者的凌辱、傲慢者的冷眼、被轻蔑的爱情的惨痛、法律的迁延、官吏的横暴和费尽辛勤所换来的小人的鄙视”。混乱的现实让哈姆莱特“重整乾坤”的责任更加迫切，也更加沉重，加剧了哈姆莱特精神的忧郁特征。\n\n总之，哈姆莱特的忧郁并不是其天性，而是理想与现实之间冲突的折射，它反映了莎士比亚对人文主义思想及其运动的反思。","keywords":"厌倦人生 人文主义理想破灭之后的精神表现 丰富的社会内涵","note":"哈姆莱特的忧郁主要表现为对生的厌倦与对死的向往，他的忧郁是人文主义理想破灭后的精神表现，是理想与现实之间的落差造成的。沉重的现实改变了哈姆莱特对世界、对人的看法，让他表现出“忧郁”的特征。同时，哈姆莱特的忧郁有丰富的社会内涵，体现出了莎士比亚对人文主义思想及其运动的反思。"},{"id":"55","stars":"★★★★★","title":"比较哈姆莱特和堂吉诃德性格之异同","body":"堂吉诃德和哈姆莱特是文艺复兴时期人文主义文学塑造的两位性格丰满、个性鲜明的人物形象。他们之间既存在共性，也有着巨大的差异。\n\n一、相同点\n\n（一）都是文艺复兴时期人文主义精神的代表\n\n《堂吉诃德》和《哈姆莱特》两部作品出版的时间仅相隔一年，哈姆莱特与堂吉诃德作为同一时代的文化产儿，都被作家寄托了美好的人文主义理想，闪烁着人文主义的思想光辉。他们都是文艺复兴时期人文主义精神的代表。\n\n哈姆莱特接受了人文主义教育，将替父复仇的义务上升为“重整乾坤”的社会责任。\n\n堂吉诃德虽然是一位不切实际的幻想者，但其扶弱济困的理想具有人文主义思想特征。当他不谈骑士道时，他是一位学识渊博的学者，不乏真知灼见。在追寻理想的过程中，堂吉诃德不畏艰难，勇敢执着，表现出崇高的精神。\n\n他们对社会的批评，对战争、法律、道德、爱情、文学艺术都具有远见卓识和独特见解，闪耀着人文主义思想的光辉，他们都胸怀崇高的理想和远大的抱负，在他们身上，寄托了作者美好的人文主义理想。\n\n（二）两人都体现出超越时代、不被理解的悲剧性内涵\n\n相对外部世界，哈姆莱特和堂吉诃德的理想和精神品质都使其格格不入，而且两个人的人文主义理想在实现的过程中都不被人所理解，都遇到了不同程度的阻挠。最后两个人都成为了孤独的英雄，由此折射了人性的高贵以及不被世人理解的痛苦。\n\n哈姆莱特面对强大的敌人，孤军奋战，不得不以疯癫伪装自己，最后在铲除奸人的同时也牺牲了自己的生命。\n\n堂吉诃德以中世纪骑士精神武装自己，胸怀扶弱济困的理想行侠天下，却成为众人的笑柄和讽刺的对象。\n\n二、不同点\n\n（一）两人性格的基本特征不同\n\n哈姆莱特则是一个优柔寡断的人，他只相信个人的作用，强调思想的力量，往往想的多，却行动的少，是个思想的巨人，行动的矮子。他时时感到忧郁、茫然，行动犹豫延宕。想为父亲报仇，却因为犹豫而失去了好几个良机，最终以失败告终。他的性格特征和悲剧结局反映了人文主义的思想危机和致命弱点。\n\n堂吉诃德是个带有喜剧色彩的悲剧人物。他脱离现实，耽于幻想，终日沉浸于骑士美梦，对现实生活失去了切实感受，他失掉任何现实感觉的幻想，使他成为普遍的笑柄，具有充分的喜剧性。然而他又惨遭生活的无尽捉弄，是个悲剧人物。另外，他冲动而热情，虽然有一种无畏的精神和执着的勇气，在行动上不折不挠，但是缺乏沉着、冷静的思考，不知道从失败中吸取教训，只是一味地盲干，注定失败。\n\n（二）两人代表了人文主义精神的不同发展方向\n\n哈姆莱特忧郁的背后，是他对人文主义思想的重新思考，以及他对人性和社会阴暗面的体认，他激烈的内心冲突反映了他对分析和批判的执着，体现出一种冷静的理性思考能力。\n\n堂吉诃德勇往直前地行侠仗义，为此无暇顾及自我的安危，源于其乐观精神和对理想的坚定信念，体现出来的是理想感召下积极进取的斗争精神，反映了对人类至善的执着追求和坚定信念。\n\n总之，哈姆莱特和堂吉诃德两个典型形象代表了世界文学人物形象塑造的成就，它们之间互相对应、互相对照。","keywords":"人文主义精神的代表 超越时代不被理解 性格的基本特征不同 人文主义精神的不同发展方向","note":"哈姆莱特和堂吉诃德同为文艺复兴时期作品中的典型人物形象，相互的比较自然是少不了的，西北大学2023年就考查过相关题目，大家要结合二者各自形象理解记忆。他们两个都是反映文艺复兴时期人文主义者的理想和现实矛盾冲突的形象。所以无论是堂吉诃德还是哈姆莱特，都是作者糅合了自己对社会现实的理解与认识，结合自己的主观意志等因素成功塑造出来的人物。"},{"id":"56","stars":"★★★","title":"《麦克白》中，邪恶主人公的毁灭为什么产生了强烈的悲剧效果","body":"《麦克白》是一部揭露和鞭挞野心的悲剧。麦克白由于野心的驱使，走上了犯罪的道路。他谋杀贤君，暗害忠良，血染整个苏格兰大地，最终成为一个令人憎恶的暴君，成为举国声讨的历史罪人。剧本从反面印证了保持人的善良本性的重要性。麦克白原为一个万人敬仰、品性卓著的英雄人物，却在腥风血雨、浊流泛滥的岁月里，经受不住野心和权势的蛊惑，改变了生活的正途，不仅给国家和民族带来了深重灾难，也彻底毁灭了自己宝贵的一生。麦克白形象的特殊悲剧性，正表现在这里。\n\n一、麦克白由善变恶的人生值得同情\n\n作为苏格兰一位威猛的大将和忠诚的臣子，麦克白勇敢善战，正直忠诚，得到国王的信任和民众的敬爱。但是，在女巫蛊惑下，麦克白的野心萌发，加之妻子的怂恿，他一步步走向叛臣暴君的人生道路。之后他陷入深深的悔恨和绝望，面对着正义之师的讨伐，昔日威风凛凛的英雄众叛亲离，垂死挣扎，作最后一搏。\n\n人物的可悲之处，不在于他的灭亡，而是在灭亡过程中，他所代表的善良和正义的死亡。其悲剧性的人生，以及他身上高尚品德的丧失，展示了有价值的东西毁灭的过程，引起人们的同情，获得了悲剧性效果。\n\n二、走向堕落的麦克白时刻承受着良心的煎熬，进一步增加了其悲剧人生的感人力量。\n\n为了夺得王位和保住王位，麦克白杀的人越来越多，但其良心并没有泯灭，沉重的罪恶感让麦克白日夜不得安宁，恰如\n\n他自己所言：“麦克白杀死了睡眠。”野心和良心的博弈，贯穿着麦克白的悲剧性人生，而其妻子的最后疯狂，更是将其置于罪恶感的深渊，在惊心动魄的精神泯灭的过程中，悲剧彰显了良心与恐惧的崇高的道德力量。\n\n三、命运与欲望交织下的悲剧渲染\n\n难以控制的命运或欲望在麦克白人生悲剧中起到了至关重要的作用，反衬了人性的脆弱，增加了麦克白悲剧的怜悯效果。荒野中三个女巫的预言引发了麦克白一生的悲剧，而麦克白一生的发展也印证了女巫们的预言，三个女巫的形象既代表了命运，也是人内心欲望的化身，她们的预言和麦克白的人生经历的关系，显示了人在命运或欲望面前的软弱。\n\n总之，虽然麦克白是杀人凶手，但他的毁灭却具有悲剧性质，引发同情与怜悯。通过麦克白的悲剧，作品表达了人文主义的政治理想，同时还思考了人的价值，展示了人性的复杂，追问了灵魂的归属，充满了人道主义的悲悯情怀。","keywords":"揭露和鞭挞野心 由善变恶的人生 良心的煎熬 难以控制的命运或欲望","note":"莎士比亚的戏剧创作常常描写人性不可遏制的欲望而导致的人生悲剧，上海师范大学在2023年考研中就针对这一点进行了细致考查：“结合莎士比亚的一部具体作品，谈谈对人性不可遏制的欲望与人生悲剧的认知。”《麦克白》就是一出因权欲膨胀而导致的悲剧，作品的悲剧性就在于主人公的野心战胜了善良的天性，这场善与恶的搏斗在他内心引起极度的矛盾和痛苦。他“杀害了睡眠”，不仅杀死了睡眠中的邓肯王，也杀死了他自己内心的宁静。此外，《麦克白》属莎士比亚四大悲剧之一，这里的“《麦克白》、四大悲剧”都可能会以名词解释的形式进行考查，大家要注意积累。"},{"id":"57","stars":"★★","title":"简析《麦克白》中女巫形象的功能意义","body":"一、从三女巫行动的内容上看，她们几次出场，主要都是在对麦克白的命运进行预言。当麦克白从战场凯旋，女巫们分别对他表示了祝贺，但每次的称谓都不同，“葛莱密斯爵士”“考特爵士”“未来的君王”。而第二个称谓恰恰与国王邓肯的命令内容相吻合，于是，麦克白开始相信了她们的话，进而对那第三个称谓的预言也动了心，写信给妻子开始了他们的行动。杀死邓肯后，麦克白一直担惊忍怕，他主动找到女巫，寻求破解疑惑之法。于是，模棱两可的预言再次鼓起了杀人者的勇气，女巫们又为他“指明”了道路。而这一次却是最终将他送上了不归路。尽管她们努力为他展示了未来的图景，但麦克白并没有醒悟，他不相信那些预言会成为现实，他也不愿接受那样的现实，不管麦克白相信与否，所有的事件都是按照女巫展示给麦克白的那些图景发展的。\n\n二、莎士比亚通过神鬼形象曲折地反映了16世纪混乱的社会状况，女巫是邪恶力量的拟人化，象征了社会的黑暗、恐怖，同时也渲染了戏剧的神秘气氛和宿命论色彩。同时，因为班柯的后代确实成为苏格兰国王，而且是詹姆斯的祖先，莎士比亚为了取悦詹姆斯，突出利用了三个女巫，影射詹姆斯继承了英王忏悔者爱德华能治病的特异功能，并提到班柯后裔的一位国王手里拿着两个权球和三根权杖，也是指詹姆斯。\n\n三、女巫代表着命运。莎士比亚正是利用了超自然现象说明了命运的不可抗拒性。正如，女巫甲、乙、丙向麦克白问安时话中有话的引诱：“葛莱密斯爵士、考特爵士、未来的君王......”这个问安实际上就是一种命运的安排。在莎士比亚时代，人是无法与鬼怪抗拒的，只有受鬼神的控制和摆布的命运。同时，人更难超越的是自己内心的鬼神。这些都体现在《麦克白》之中。\n\n四、女巫象征着人性的外化。三女巫的外形看上去似人非人，说是女巫，却还长着胡子。从本质上讲，女巫应当是具有神奇魔法、能预言未来的人，仍是女性，她们与神还是有很大区别的。她们没有神的光辉，只有阴暗、狠毒、诡计，她们烹煮心、肝、肺等用来修炼，靠妖言来引诱英雄犯错。她们是女人中的另类，是真善美女性的反面形象之集大成者。女巫是麦克白邪恶心灵的外化，是麦克白意识潜在的显示物，是人物隐秘心理外化的一种表现方式。“残忍、勇敢、坚决，像狮子一样骄傲而无畏......”表面看是女巫制造出来的幽灵对麦克白的告诫，实际上这是麦克白内心深处的潜在意识在作祟。","keywords":"预言 社会状况 邪恶力量的拟人化 神秘气氛和宿命论色彩 代表着命运 人性的外化","note":"《麦克白》一直被认为是莎士比亚四大悲剧中最阴暗的一部。戏剧中三女巫的形象给人留下了深刻印象。她们在戏中起到了十分特殊的作用，既带有那个时代的特征，又表达了某种深藏于人们意识深处的感觉，给作品增添了更多神秘色彩。"},{"id":"58","stars":"★★★","title":"简要说明《麦克白》中人物心理刻画的手法","body":"莎士比亚向来以描写人物心理和内心矛盾冲突见长，而《麦克白》更是莎剧中最出色的心理悲剧。麦克白内心善与恶的斗争，构成了戏剧内在的情节冲突。为了揭示出麦克白复杂的内心世界，莎士比亚运用了多种艺术方法。\n\n一、形象化的独白或旁白，大量运用意象\n\n当麦克白杀死了国王之后，他在独白中说自己感到被鲜血包围，手上沾满鲜血，大海的水也不能将其洗净，反而会被它染成殷红。他宣告自己杀死的不是国王，而是睡眠。这些意象手法的运用恰如其分地表现了他的心理挣扎和内心深处的痛苦。而他的痛苦带有极大的强制性，无法从内心中摆脱，更无法掩饰，显得那么残酷无情，难以忍受，因而就更带有悲剧性。于是观众也可以通过这些形象的语言体会到主人公的痛苦和感受，从而了解其心理世界，引起共鸣。\n\n二、运用幻象或象征的方式，形象地揭示人物的心理\n\n通过人物看见的幻象和运用象征，莎士比亚将人物隐秘的内心世界和盘托出。麦克白在准备杀死国王的过程中，看见了一把指向自己的鲜血淋淋的匕首，他伸手去拿匕首，匕首却消失了。这个幻象暗示了麦克白即将进行的阴谋。莎士比亚在此意在说明，是外部的邪恶势力推动而非麦克白本人意图不轨。尽管他本人很清楚地知道自己在犯下大罪，但他仍然无法抗拒权势和野心的诱惑。因此，他在战场上的无畏精神在阴谋中变得软弱。最终，在野心的驱使下，麦克白犹豫不决地迈进地狱。\n\n剧中女巫的形象非常具有象征性，她们出现在黑夜的荒原中，外化了麦克白内心深处难以觉察的欲望与野心。三个女巫两次出现在舞台上，象征了麦克白两次不同的内心世界变化：最初，麦克白在战胜归来的途中偶遇女巫，当时的他，踌躇满志，大权在握，万民景仰。她们的预言立即激发了他心中一直深藏的勃勃野心，受到诱惑的麦克白不顾自己良心和道德的谴责，开始迈出罪恶的一步。第二次，已经杀害了老国王和班柯等人的麦克白变得残忍冷血而绝望，并已感到穷途末路。他向女巫们寻求帮助，她们表面上用言语支持他，实则用虚妄的预言将他引上绝路。她们给他的误导也正象征了他当时的心理特点-野心实现后，麦克白陷入深深的悔恨和绝望，面对着正义之师的讨伐，昔日威风凛凛的英雄众叛亲离，垂死挣扎，作最后一搏。人物的可悲之处，不在于他的灭亡，而是在灭亡过程中，他所代表的善良和正义的死亡。\n\n三、紧张恐惧气氛的渲染，烘托了人物内心斗争的激烈程度\n\n《麦克白》的剧情多发生在黑夜，女巫出现在黑夜雷电交加的荒野或阴森恐怖的洞穴，鬼魂在黑夜游荡，麦克白夫人疯狂后梦游并说出疯言疯语，都渲染了紧张恐惧的气氛。而麦克白杀死国王之后的静场，更是将这种恐惧推向了情感高潮。\n\n总之，通过运用传统和富有创新性的艺术手法，莎士比亚将一步步堕落为僭主暴君的麦克白的内心世界揭示了出来，展示了善与恶在其内心展开的较量，刻画了人性在欲望和野心诱惑下的挣扎，从而赋予这一人物形象以丰富的艺术魅力。","keywords":"形象化的独白或旁白 大量运用意象 运用幻象或象征的方式 紧张恐惧气氛的渲染","note":"通过对《麦克白》的心理描写分析，我们不难看到麦克白的心理挣扎和内心世界的冲突以及种种转变。麦克白的悲剧展示了人生的残忍，也揭示了这样一个真理：人性的解放与自我意识的觉醒，虽然使人的自我意志的实现成为可能，但一旦背离了道德与良知，人就不可能真正获得自身解放的力量。"},{"id":"59","stars":"★★★★","title":"结合莎士比亚的作品，说明莎士比亚喜剧作品中爱情关系所表现的政治内涵","body":"莎士比亚的爱情喜剧既表达了他的人文主义的爱情观，又反映了他的政治立场。\n\n一、通过男女争取爱情和婚姻自由表达人文主义的生活理想。在以爱情为主题的喜剧作品中，莎士比亚反对宗教神学的禁欲主义，鼓励青年男女冲破封建伦理道德、传统偏见和宗教禁忌的束缚，追求个人权力和幸福，满足个人的要求和欲望，享受真正的爱情，如《仲夏夜之梦》中的男女青年反对家长干涉、自由恋爱的故事，反映了莎士比亚作为人文主义者，强调“人性”和“人权”，反对“神性”和“神权”的人性光辉。\n\n二、通过表现爱情中男女平等的关系，体现了资产阶级革命时期进步资产阶级的特点。莎士比亚认为，在理想的爱情面前人人平等，不应附带任何物质条件，人们的爱情和婚姻中不应该存在金钱关系和等级制度观念。如在《威尼斯商人》中，莎士比亚表达了反对包办婚姻，主张爱情应该超越金钱和社会地位的观点。\n\n三、通过批判那些企图破坏爱情秩序的人，表达拥护中央集权的君主专制制度，反对封建割据的政治观念。如在《温莎的风流娘儿们》中，妄图插足别人家庭的没落骑士福斯塔夫的丑行最终被下层妇女揭露，受到了人们的嘲笑，并得到应有的惩罚，体现了莎士比亚对封建上层阶级的批判。\n\n四、通过爱情中恶人的悔悟和好人的宽恕使矛盾得到解决，表现了莎士比亚作为资产阶级在政治上的软弱与妥协。如在《威尼斯商人》中，朱利亚化妆充当负心郎普洛丢斯的仆童，以规劝其回心转意。最后，曾经喜新厌旧、背弃海誓山盟的普洛丢斯终因妻子的爱情感化而浪子回头，回到了原来的生活轨道，体现了莎士比亚政治思想的局限性。","keywords":"人文主义的生活理想 进步资产阶级的特点 拥护中央集权的君主专制制度 资产阶级在政治上的软弱与妥协","note":"莎士比亚的喜剧中的爱情关系，体现了莎士比亚的政治倾向。在分析时，大家可以首先明确莎士比亚的政治倾向是怎样的，比如资产阶级的特点、拥护中央集权的君主专制制度等，然后再从莎士比亚喜剧中的爱情关系中寻找对应的内容。"},{"id":"60","stars":"★★★","title":"结合具体作品，论述莎士比亚戏剧情节的丰富性","body":"一、莎士比亚戏剧情节的丰富性首先表现在以曲折丰富的手法表现错综复杂的现实\n\n莎士比亚是一位伟大艺术家，他具有人文主义的思想灵魂，诗人的敏锐洞察力和火一样的热情，那“神奇的眼睛，狂放的一转”，就将英国文艺复兴时代错综复杂的阶级关系，民族矛盾，五光十色的社会生活，千姿百态的人物形象摄入眼帘。然而作家并不满足于对现实生活作直接的“摹仿”，而是充分发挥艺术家的想象与联想，运用象征、寓意、虚构、夸张等手法将天上人间、古往今来、真实与虚幻、理想与现实熔为一炉，编织出丰富多彩的故事情节，将大干世界，光怪陆离的社会与人生的种种奇观，万花筒似地呈现给观众和读者。\n\n二、莎士比亚戏剧情节的生动性、丰富性还表现在善于把两种对立的因素统一起来，悲剧中有喜剧因素，喜剧中有悲剧因素，严肃中有滑稽，可怕中有可笑等等\n\n如历史剧《亨利四世》由两条线索组成。一条为悲剧气氛十分浓郁的正剧线索。写亨利四世一上台，内优外患一齐向他袭来，内部不断发生贵族叛乱，外部异族入侵，他一生都在东征西讨中，并因自己是谋权篡位而内心充满了冲突，最后死在军中。另一线索为喜剧线索，写以没落骑士约翰·福斯塔夫为首的野猪头酒店的平民社会，这里充满了窃贼，酒徒，妓女和元业游民的风趣、幽默、滑稽的喜剧场面。作品就是以往来于宫廷和野猪头酒店的哈尔太子为穿线人，把王室的严肃斗争与“五光十色”的平民社会结合起来，把悲、喜剧内容有机地融合在一起，展示了特定历史时代的社会历史风貌。\n\n除大的情节方面的悲喜剧交织外，可以说莎剧的每一部都可看到这种对立因素的紧密杂糅。如《哈姆莱特》整部戏是悲剧，但其中不时穿插喜剧情节，如戏中戏，比剑、竞技表演，哈姆莱特与情人奥菲利娅的谈情说爱等等。他在悲愤中装疯，但疯话中却充满了喜剧的幽默与诙谐。这种悲中喜、乐中悲，对立因素的广泛运用使莎剧情节不但变得曲折、跌宕，而且极大增强了戏剧的生动性。马克思、恩格斯非常赞赏地指出这是“崇高和卑下，可怕和可笑、英雄和丑角的奇妙结合”。特别应当指出的是，悲剧中的喜剧性插曲，不但没有破坏悲剧事件，反而更加重了全剧的悲剧效果。\n\n三、莎士比亚戏剧情节的丰富性与生动性，还表现在他的多线索的复杂艺术结构上\n\n莎剧情节有单线、双线、三线、五线、七线、最多达十二条线索。这些线索有平行、有交叉、有环形和网络式，构成一个完整的结构体系。\n\n单线结构的有按时间顺序描写人物一生活动的纵式结构，如历史剧《约翰王》，悲剧《麦克白》等；有充分展示人物性格的各个方面的横向辐射式结构，如历史剧《理查三世》；双线平行交叉式结构如历史剧《亨利四世》；三条线索紧密交织的悲剧《哈姆莱特》；五条线索的《李尔王》等等。\n\n四、灵活多变的戏剧节奏是莎士比亚戏剧情节丰富性和生动性的又一特点\n\n总观莎剧情节的动势，可谓张弛有致，舒缓相间，起伏跌宕，变化万端。\n\n悲剧《麦克白》和历史剧《理查三世》为急骤的鼓点式节奏。作品写两个野心家在谋权篡位的过程中一个接一个地杀人剧情一阵紧似一阵，到高潮戛然而止。\n\n悲剧《哈姆莱特》由三条复仇线索组成，雷欧提斯要刺杀哈姆莱特是为父报仇，是个人复仇；福丁勃拉斯带兵攻丹麦是为国复仇；哈姆莱特不断揭露克劳迪斯谋权篡位的罪恶，是为“重整乾坤”，改造社会而复仇，是封建阶级和资产阶级的两个阶级的生死较量。这三条线索时而平行，时而交叉，相辅相成，使情节曲折多变，而主线哈姆莱特又由于性格的犹豫，对于复仇的行动一再推诿延宕，在真相不断被揭穿，基本矛盾不断紧张激化的同时，作品不时穿插宫室活动，婚礼，宴会，密\n\n谋，试探演戏，祈祷，竞技表演等动作缓慢的情节，使戏剧节奏时而急，时而缓，疏密相间，张弛有致，起伏跌宕。\n\n莎翁的历史剧多是以人物一生活动为线索，充满了波澜曲折的戏剧情势。\n\n喜剧都是采取多线索、网络式结构，矛盾被表现得盘根错节，层层套连，有时几条矛盾纠结在一起，如一团乱麻，令你剪不断、理还乱，造成一种紧张，激烈的动势，观众为之喘不过气来。但一经作家轻轻梳理，又如丝丝细柳，豁然撒开，戏剧动作变得散漫自然，令观众为之细气长舒。\n\n总之，莎剧的节奏是灵活多变的，有时急如星火，如长江大河，奔腾叫哮；有时如山涧溪流，轻盈跳荡，有时又如万流归海，平静舒展，这种曲折多变、跌宕起伏的戏剧节奏，构成一种交响乐式的音乐美，必然在观众心中时时激起某种诗意盎然的情感波滔。","keywords":"曲折丰富的手法 错综复杂的现实 两种对立因素统一 多线索复杂艺术结构 灵活多变的戏剧节奏","note":"莎士比亚的戏剧情节之所以不朽，情节丰富是其中重要一环，《哈姆雷特》的多重线索交织，《麦克白》的心理推进，《仲夏夜之梦》的多线井行，《亨利四世》的虚实结合，《暴风雨》的奇幻元素。同时，我们还要注意一个细节，莎士比亚也致力于融合民间故事、历史记载，并创新改编，使其情节更复杂。"},{"id":"61","stars":"★★★","title":"古希腊的悲剧与莎士比亚的悲剧有什么不同","body":"一、悲剧主题不同\n\n古希腊悲剧作家受到古希腊人命运观的影响，常常在悲剧作品中表现人与命运的冲突，以命运的不可抗拒来反衬人的抗争，赞扬由此折射的主体精神，故被称为“命运悲剧”。\n\n莎士比亚的悲剧虽然也有对命运的涉及，但其重要性大大降低，人物性格和时代的局限常常成为人物悲剧的主要原因，故被称为“性格悲剧”。莎翁悲剧主要是表现人们为实现某种理想而付出牺牲，这种牺牲表现在社会生活中就是政治悲剧，表现在个人生活中则是爱情悲剧，有时候两者也是结合在一起的。\n\n二、悲剧题材不同\n\n古希腊悲剧基本取材于神话和传说，其所描写的内容是人和命运、人和自然环境之间、人和社会之间几乎无处不在的尖锐矛盾，且这些矛盾不可调和。\n\n莎士比亚悲剧内容广泛，涉及社会生活的各个方面，描写的是人类的七情六欲。\n\n三、具体内涵不同\n\n古希腊悲剧所揭示的是古希腊由氏族社会向奴隶民主制社会转化时期的矛盾冲突，反映的是古希腊剧作家对当时各种社会问题的看法与思索。\n\n莎氏悲剧所揭示的则是一个古老封闭的封建宗法社会向开放的商业社会过渡时，人们所表现出的崇尚个性而又保持整体社会和谐的人文主义思想如何与残酷的现实发生冲突；人们之间的和谐关系如何在权利与金钱的双重作用下异化；以及那些执着地为实现个人意愿而遭受磨难，直至毁灭的主人公们的伟大精神。\n\n简言之，古希腊悲剧主要表现的是人与自然、与命运的斗争；莎士比亚悲剧则表现的是一个旧体制向新体制过渡时的社会“失衡”状态。\n\n四、悲剧人物不同\n\n（一）人物类型的区别\n\n在古希腊悲剧中，主人公大多是传说中的神或英雄，他们看上去十分强大，统治着人类，但在深层次上，他们却受制于命运。古希腊多数的悲剧是以男子与女子为共同主人公，有的则是以男子或女子为主人公。在古希腊悲剧中，男女主人公的不幸遭遇构成了悲怆的主旋律。其对人们心灵的冲击不是一时的震撼，而是深沉、久远的哀伤。\n\n而在莎氏悲剧中，主人公都是身居高位的统治者，主要是帝王或国家首领，并且全部都是男性角色，而女性角色在莎氏悲剧中则只是男主人公毁灭的殉葬品，比如奥菲利娅，考狄利娅等等。\n\n（二）人物性格的区别\n\n（1）古希腊悲剧，大多数主人公无论从道德还是审美角度看都近乎完美。他们自身没有什么导致悲剧的“致命”弱点，只是命运一直在捉弄他们，使他们一步步走向悲剧的人生。\n\n然而，在莎翁的悲剧主人公中，我们很难找到一个完美的人，他认为“人无完人”，哈姆莱特可以说是莎氏人文主义理只的化身，但他在面对义不容辞的复仇重任时却反复犹豫延宕，一味沉溺于对生存死亡的思辨与看破红尘的厌世之情中。\n\n（2）人物的单一性与复杂性的区别，是古希腊悲剧和莎士比亚悲剧另一个明显的区别，即所谓“类型化”与“典型化”\n\n的区别。古希腊悲剧的人物单纯明晰，大多数主人公的善恶基调都是极其鲜明的。正面主人公会受到赞美和同情，反面人物会遭受人们的切齿痛恨。\n\n而莎翁悲剧的不朽魅力在很大程度上则来自于它所创造的那些复杂而丰满的人物，他们极大地满足了现代人的审美情趣。如哈姆莱特，一名皇室成员，先天带有封建的因素，但同时又具有人文主义者的先进理念。再者，莎氏悲剧人物的特征还具有两重性，这使得人们往往难以用固定的道德尺度来衡量他们。\n\n五、悲剧界限不同\n\n古希腊悲剧和喜剧界限严格，悲剧单纯崇高。\n\n莎士比亚的悲剧常常融合了喜剧的因素，拓展了悲剧的表现内容，增加了悲剧的生动性，也衬托了悲剧气氛。\n\n六、悲剧风格不同\n\n古希腊悲剧着意在“严肃”，而不在“悲”。这一点从亚里士多德给悲剧下的定义就可以看出来。例如欧里庇得斯的《伊菲革涅亚在陶洛人里》没有杀人流血，而是圆满收场，却仍然是“悲剧”。古希腊悲剧所描写的事件和情调是很严肃的，其所探讨的内容常放在形而上学的层面上，指向价值的终端，考量生存的意义。\n\n但在莎氏悲剧中，所表现的则是彻头彻尾的悲，它以人物的毁灭为结局，留给人们对现存秩序的怀疑和对主人公不幸遭遇的思索。带给人们以更强烈的悲剧震撼。莎士比亚悲剧基调是沉郁、悲怆、愤激的，对人性作了全面、透彻的分析，深刻揭示了权势和金钱是导致人性普遍堕落的根源，呼唤人性的复归。\n\n七、悲剧结构不同\n\n古希腊悲剧多围绕单一的情节线索展开悲剧冲突，而莎士比亚的悲剧往往是几条情节线索交叉，既紧凑严谨，又生动丰富。\n\n八、悲剧形式不同\n\n在艺术形式方面，古希腊悲剧由话语和唱段组成，话语通常用三段音（或六音步）短长格表述，而唱段则采用众多的抒情格写成。\n\n而莎士比亚悲剧语言上的最大特色主要是个性化的语言与意象的充分运用。\n\n总之，古希腊悲剧和莎士比亚悲剧的不同，主要是这两种悲剧创作的时代背景不同，在文学史上的位置不同，但二者作为悲剧创作中的两座高峰，人类文明的瑰宝，值得我们铭记。\n\n17世纪文学","keywords":"主题 题材 内涵 人物类型 人物 界限 风格 结构 形式","note":"西南大学在24年考查了“莎士比亚悲剧对古代悲剧的继承与发展”，二中同为悲剧创作中的两座高峰，主要是由于时代背景与文化背景的不同，而表现出不同的写作倾向。这部分内容可以拓展阅读吴晓凤《莎士比亚悲剧与古希腊悲剧之比较研究》、胡淑莉《论莎士比亚的戏剧创作对古希腊悲剧的继承性》、刘小溪《论莎士比亚对古希腊悲剧创作传统的继承与发展》，相关资料可在李凡文学正版群中领取。"},{"id":"62","stars":"★★★","title":"17世纪文学历史背景及概况","body":"一、历史背景\n\n（一）英国爆发资产阶级革命\n\n英国资产阶级发展壮大，进而要求扩大政治权力。为推翻封建主义制度，英国在1649年进行了资产阶级革命，废除了君主制，建立了共和国。1688年经过“光荣革命”，英国建立了君主立宪制，确立了资产阶级的统治地位。英国资产阶级革命对17世纪英国文学有着直接的影响。\n\n（二）法国封建王权的统治处于强盛时期\n\n法国君主专制是资产阶级和封建贵族相互抗衡与妥协的产物。为了与教会抗衡，法国封建王权与发展中的资产阶级妥协，以使其为王权服务。同时资产阶级的力量还不够强大，需要王权的保护，才能维护自身利益。\n\n以上原因，使得法国的封建王权与资产阶级关系密切，它们的结合对于巩固法国的统一，反对梵蒂冈宗教势力的控制具有积极作用。\n\n二、文学概况\n\n17世纪文学主要包括古典主义文学、巴洛克文学和反映清教徒思想的文学。\n\n（一）古典主义文学\n\n古典主义是17世纪欧洲的主要文学思潮。它形成和繁荣于法国，随后扩展到欧洲其他国家。古典主义文学思潮是新兴资产阶级与封建贵族在政治上妥协的产物，其繁荣同路易十四的爱好和政策也存在密切关系。\n\n古典主义文学提倡以古希腊、罗马文学为典范，学习古代作品和发扬古代理论。古典主义文学在思想内容上崇尚理性，拥护王权，具有鲜明的政治倾向性。在艺术上，它要求符合规范化的艺术形式。在法国，古典主义形成了完整的理论体系，涌现出一批杰出的文艺理论家和作家，如奥比尼亚克、布瓦洛、高乃依、拉辛、莫里哀等人，他们创作出了一批影响全欧乃至全世界的文艺理论著作和文学作品。\n\n（二）巴洛克文学\n\n巴洛克文学产生于16世纪下半叶，在17世纪上半叶达到盛期。巴洛克文学起源于意大利和西班牙，兴盛于法国。绮丽浮华的写作风格，夸张的语言，颓废的思想，都是巴洛克文学的体现，同时巴洛克文学也是一种贵族文学形式的体现。巴洛克文学的内容多数带有神秘色彩，偏向于对生的意义、灵与肉的关系、人生的归宿等问题作终极的拷问。艺术上追求奇特的效果，采用奇特的比喻、夸张的意象、冷僻的典故、强烈的对比、梦幻的手法等各种各样的修辞手段。代表作家有意大利的马里诺、西班牙的贡戈拉、卡尔德隆、英国玄学派诗人约翰多恩和德国的格里美豪森等人。\n\n总的说来，巴洛克文学发展了一种新的美学趣味和倾向，它不满足于固有的价值体系，它的出现适应了当时的社会愿望和需要。它的艺术手法对19世纪的浪漫主义文学产生了直接作用，对19世纪以来的拉美文学也有深刻影响。\n\n（三）清教徒文学\n\n17世纪的英国文学以体现清教徒思想的作品最为出色，这是英国资产阶级革命的产物，这场革命是在宗教的外衣下进行的，斗争主要在保王的国教与革命的清教之间展开。清教徒反对国教铺张豪华的宗教仪式和贵族奢侈淫靡的生活方式，敌视戏剧娱乐活动，提倡勤俭节约，以利资本积累。清教徒的思想代表了17世纪英国资产阶级的人生观，反映了时代精神。资产阶级在清教旗帜下，以《圣经》作为斗争的思想武器，掀起了反对封建专制的革命运动。在这种背景下产生了清教徒文学，以约翰·弥尔顿和约翰·班扬为代表。","keywords":"英国爆发产阶级革命 法国封建王权强盛 文学概况 古典主义文学 巴洛克文学 清教徒文学","note":"法国的古典主义是17世纪欧洲的主要文学思潮，以戏剧成就最为突出，出现了以高乃依、拉辛为代表的悲剧作家，以莫里哀为代表的喜剧作家，以及文艺理论家布瓦洛和寓言诗人拉封丹等。巴洛克文学的代表人物是意大利的马里诺、西班牙的贡戈拉和卡尔德隆。英国清教徒文学的最重要人物是弥尔顿，他的代表作《失乐园》被认为是欧洲文学史上文人史诗的绝唱。这里涉及的“英国资产阶级革命文学、古典主义、巴洛克文学、清教徒文学”等名词解释，大家要关注一下。"},{"id":"63","stars":"★★★","title":"试述古典主义文学的产生基础及创作特征","body":"17世纪的古典主义文学最早出现于法国，是指17世纪流行于西欧，特别是法国的一种带有浓厚封建色彩的资产阶级文学思潮。因为它在文艺理论和创作实践上以希腊罗马文学为典范，故称“古典主义”。其产生基础与创作特征如下：\n\n一、产生基础\n\n首先，古典主义文学思潮是新兴资产阶级与封建贵族在政治上妥协的产物。\n\n其次，它的繁荣同路易十四的爱好和政策也存在密切关系。\n\n再次，17世纪笛卡儿的唯理主义哲学形成很大声势，影响到法国社会风气的变化，推崇理性、轻视感情逐渐成为时代的精神特征，唯理主义便成了古典主义的哲学基础。\n\n最后，经过文艺复兴之后，欧洲文学面临着较为繁杂的局面，就文学自身的发展来看，对此进行适当的整饬也就符合文学发展自身调节的规律。\n\n二、创作特征\n\n（一）思想特征\n\n（1）鲜明的政治倾向性-拥护王权\n\n古典主义作家都与宫廷有千丝万缕的联系，他们领取官方俸禄，受宫廷控制、国王庇护，这决定了他们颂扬专制君主、拥护绝对王权、维护等级秩序的基本政治立场。\n\n王权实际上是贵族和资产阶级相互妥协的产物。由于君主专制制度在17世纪法国的特定时空下对反对封建割据、维护国家统一、促进资本主义发展来说具有进步意义，因而古典主义作家对封建王权和秩序的支持符合历史发展的要求。\n\n古典主义作品大多描写主人公的感情与家族责任或国家义务的冲突，表现感情服从责任、个人服从义务的主题。\n\n当然，古典主义作家对统治阶级并不是一味歌功颂德，他们对君王大臣的昏庸残暴、贵族的刚愎愚顽、天主教会的伪善，也给予了辛辣的讽刺和批判。\n\n（2）宣扬理性，要求克制个人情欲\n\n古典主义文学所宣扬的理性主要是指对情感和欲望的自我克制能力。它把人性理解为情感与理性的二元组合，认为理性高于情感，主张用理性约束情感、克制欲望。\n\n相对于文艺复兴时期人文主义对人性的认识侧重于感性层面，古典主义文学对人性的理解更加丰富，且这种认识是对文艺复兴时期过度追求个性解放导致道德失范、情欲泛滥局面的一种反拨。\n\n古典主义文学还重视国家利益，强调公民责任，崇尚美德、纪律、意志和勇气，这些理性原则具有普遍价值。古典主义文学批判因放纵欲望而导致的种种罪恶及悖情逆理的行为，对合乎道德的爱情给予肯定，有惩恶扬善、匡范世风的正面意义。\n\n（3）揭露社会弊端\n\n古典主义文学尖锐抨击贵族的奢侈淫逸、腐化堕落，同时也批判资产阶级的愚顽、附庸风雅和想成为贵族的心理。古典主义作家敢于揭露社会上的恶习和弊端，对披着宗教外衣进行罪恶活动的不法分子和团体给予毫不留情的打击。尤其是古典主义喜剧，主张在笑中移风易俗。\n\n（4）反映上层生活\n\n古典主义悲剧多以帝王将相、宫闱秘事为题材，继承了古希腊悲剧的传统，是宫廷和贵族上层生活的折射。其中，高乃依的悲剧排除了古代悲剧的灵魂-命运观念。高乃依笔下的英雄是自己命运的缔造者，不再屈服于超人的力量。这种人物虽然不由自主地投入意料不到的事件中，但他能从自身汲取必要的力量，战胜巨大的困难。\n\n（5）反映广阔社会生活\n\n古典主义喜剧、寓言和散文具有较广的文学视野和较多的民主精神。较之古典主义悲剧，古典主义喜剧、寓言和散文反映的生活面要广阔得多，思维也较为活跃。古典主义喜剧表现资产阶级、平民、学者、医生、戏子、仆人、厨师等的生活状况；古典主义寓言除了以动物写人外，也接触到同样多的人物；古典主义散文除了记录重大的历史事件以外，还有人物特写、哲理沉思和对人生的深刻思考。\n\n（二）艺术特征\n\n（1）从古希腊、古罗马文学中汲取艺术形式和题材\n\n这一点似乎同文艺复兴时期的作家一样，实际上二者却有明显不同。文艺复兴时期人文主义者所做的工作是将淹没了一\n\n千多年的古籍发掘出来；古典主义文学则是在吸收了古希腊、古罗马文学的艺术形式和题材之后，完成了创新。古典主义的悲剧和喜剧与古希腊古罗马的悲剧和喜剧已有很大的不同，它们已具备现代戏剧的基本形式，有一定的幕数，适宜于在一定的时间内演出。戏剧冲突十分尖锐，心理刻画非常细腻，达到了悲剧和喜剧的新高峰。从世界范围来看，也处于一个发展的重要阶段。\n\n（2）有一套严格的艺术规范和标准\n\n古典主义戏剧创作要遵守“三一律”，即情节、时间、地点必须保持“整一”，须围绕单一的剧情进行，排除一切次要的插曲，在一天中进行，在一个地点进行。不过“三一律”虽有使剧情集中、冲突尖锐的作用，但更多的是束缚。此外，古典主义对文学体裁作出高低之分，推崇悲剧，贬低喜剧、寓言和民间文学，反映了一种贵族观念。\n\n（3）语言具有宫廷趣味\n\n古典主义文学主张语言准确、精练、典雅，表现出较多的宫廷趣味。高乃依和拉辛的悲剧最有代表性，它们都具有庄重典雅的风格，高乃依的悲剧多一点雄健，拉辛的悲剧多一点柔情，但同样都有雅致的特点。古典主义诗剧往往是完美的艺术品。\n\n（4）人物塑造类型化\n\n布瓦洛要求“凡是英雄都应该保持其本性”。古典主义作家只追求“普遍人性”，性格单一，他们把人的本质看作是每个人生来就有的抽象的属性，而不是一切社会关系的总和，往往将人物的性格塑造成凝固不变的嗜癖，忽略环境对人物产生的影响。","keywords":"产生基础 政治上妥协 爱好和政策 唯理主义 自身调节的规律 思想特征政治倾向性宣扬理性揭露社会弊端 反映上层生活 反映广阔社会生活 艺术特征 古希腊古罗马 艺术规范和标准 宫廷趣味 人物塑造类型化","note":"黑龙江大学在24年、南京师范大学在26年对古典主义的特征进行了考查。虽然古典主义不如现实主义、浪漫主义重要，但是与他们关系密切，或继承或反叛，因此掌握好这部分内容有利于后续的学习。"},{"id":"64","stars":"★★★","title":"什么是“三一律”，谈谈它的利弊","body":"“三一律”又称“三整一律”，是一种关于戏剧结构的规则，首先由文艺复兴时期意大利戏剧理论家钦提奥约于1554年提出，后由法国古典主义戏剧家确定和推行。所谓“三整一”，就是要求戏剧创作在时间、地点和情节三者之间保持一致性，即时间整一，剧中的时间不能超过24小时；地点整一，故事要始终发生在同一个地点；情节整一，情节必须集中统一，服从于一个主题。\n\n一、起源与发展\n\n“三一律”是从亚里士多德的《诗学》引申出来的。在《诗学》中，亚里士多德论述了戏剧行动的一致性，同时他也提到“悲剧力图以太阳的一周为限”，但这只是指演出时间的长度。16世纪，亚里士多德的观点被阐发、曲解。意大利理论家基拉尔底·钦提奥在1554年首先提出“太阳运行一周”指的是剧情的时间。\n\n其后，洛德维加卡斯特尔维屈罗在注释《诗学》时又进一步阐述了剧情时间与演出时间必须一致的观点，并认为戏剧“必须真正限于一个单一的地点”。\n\n法国古典主义戏剧理论家布瓦洛在其著作《诗的艺术》把三一律总括为“要用一地、一天内完成的一个故事从开头直到末尾维持着舞台充实”，并以此作为不能违背的结构法规。\n\n二、积极影响\n\n（一）政治上符合君主专制政体的要求\n\n从社会意义的角度来看，“三一律”在政治上符合君主专制政体的要求，17世纪的法国因王权需要而推崇理性主义哲学，进而采用“三一律”作为文学创作的标准，因此“三一律”也成了人类走向理性、反对神权主义的推动力。\n\n（二）在艺术上体现了时间和空间方面高度简练、紧凑、集中等优点，使戏剧结构严谨、情节集中，冲突能迅速展开，达到高潮。古典主义戏剧一般都严格遵守三一律，例如莫里哀的作品基本上都遵循了三一律。《伪君子》的时间、地点、情节均符合“三一律”的规定，整部戏剧时间大致从前一天问“早安”开始，到第二天问“早安”结束，没有超过24小时；整个故事情节都集中在奥尔贡家里的一间客厅里展开；其情节单一，围绕揭露达尔杜弗性格的伪善而展开，不枝不蔓。\n\n（三）从实际观众角度，“三一律”所要求的舞台紧迫感和真实性恰恰为观众营造了逼真的氛围，使观众情不自禁地陷入其中，这一点，体现了戏剧这一文学体裁的独特性。\n\n（四）从戏剧的发展来看，“三一律”作为古典主义的正统创作原则，推动了一批古典主义戏剧的产生和兴盛。尤其是在西方悲剧的创作中有独特的影响，即使到21世纪的今天，相比于其他地区的戏剧，“三一律”仍然是西方戏剧较为鲜的特征。\n\n三、消极作用\n\n（一）由于它对情节、时间和地点都有严格规定，导致戏剧被限制得太死，戏剧作家们失去了一部分的自由创作空间。\n\n（二）“三一律”中对演出时间和剧情时间一致的规定也显然是不合理的，因为戏剧中有时由于剧情的需要，时间跨要远大于现实中的时间，导致一些戏剧本身出现了逻辑问题。\n\n（三）“三一律”容易束缚剧作家的手脚、束缚戏剧艺术的发展，导致出现人物性格单一化、类型化、公式化、概念化戏剧结构上绝对化、程式化等弱点，削弱了作品的艺术感染力，最终为后人所摒弃。\n\n比如莫里哀戏剧创作由于受古典主义“三一律”影响，反映的生活面比较狭窄，他的喜剧常常发生在资产阶级家庭，而且剧中人物类型化、片面化，干人一面，干篇一律。\n\n在当今时代，我们应该用辩证的眼光来看待“三一律”，做到取其精华，去其糟粕。这一创作理论所体现出的时间短暂地点紧凑和情节连贯的概念依然对戏剧的创作有指导意义，值得我们借鉴和学习。","keywords":"起源 积极作用 消极作用","note":"23年西安外国语大学、24年华中师范大学、四川大学、广西大学都对三一律以简答形式进行了考查。不过更多时候，“三一律”是作为名词解释来出题的，遇到简答题我们可以联系具体作家作品进行扩充说明。运用“三一律”原则的经典剧作有拉辛的《安德洛玛克》、莫里哀的《伪君子》等。此外，对我国影响最强烈的当属《雷雨》，由一个周公馆的小小客厅，一天一夜的时间铺开去，展现的却是错综的人物关系之间三十年的恩怨，是一部严格遵循“三一律”原则的话剧佳作。"},{"id":"65","stars":"★★★★","title":"分析古典主义文学与文艺复兴文学的不同","body":"文艺复兴时期的文学受人文主义思想的影响，重视人的价值，追求个性自由，反对禁欲主义。例如《罗密欧与朱丽叶》是莎士比亚创作的具有广泛影响的一部悲剧，它在歌颂爱情自由方面表现得非常突出。在《罗密欧与朱丽叶》中，两位热恋的青年因为各自家庭间的世仇而被迫分离，并被夺去了生命。通过他们的爱情悲剧，莎士比亚否定了封建仇杀，批判了封建包办婚姻制度，歌颂了自由爱情。\n\n古典主义文学是17世纪随着封建王权的巩固而出现的一股文学思潮，它是资产阶级与封建势力相妥协的产物，其创作具有鲜明的政治倾向性和特定的主题，即歌颂封建王权，赞扬理性对感情的胜利。例如《熙德》是法国古典主义戏剧家高乃依的代表作，它描写的是一对热恋中的贵族青年，因为父辈的纠葛，而陷入了追求感情与践行义务之间的冲突中，表现了责任和义务战胜个人感情的过程。\n\n文艺复兴时期人文主义文学产生的时间要早于古典主义文学，它在神学统治了千年之久的中世纪末期爆发，对人性的肯定，对人的价值和尊严的强调，成为人文主义文学反对封建统治和教会禁锢的有力武器。因此，抨击封建制度和禁欲主义，揭露和批判教会和封建贵族的种种罪行，宣扬人性、人权和现实幸福就成了人文主义文学的主要的思想内容。与此相一致，人文主义文学追求艺术形式的多样性，表现方法的独创性。\n\n古典主义兴起于17世纪的法国，处于法国封建王权最为巩固和强大的历史时期。服务于王权的统治，是古典主义文学产生和发展的现实基础。古典主义文学以笛卡尔的理性主义哲学为理论支撑，但狭隘地理解了理性，过分追求秩序与明晰，排斥感情，宣扬个人感情服从家庭义务，家庭利益服从王权利益。在文学表现方法和形式上，古典主义强调规则，反对创新致使其故事情节单一，对生活认识简单，人物塑造类型化突出。","keywords":"重视人的价值 追求个性自由 歌颂封建王权 赞扬理性对感情的胜利 艺术形式的多样性 表现方法的独创性强调规则 反对创新","note":"人文主义以复兴古希腊、古罗马文化为标志，反对中世纪禁欲主义和宗教观。古典主义是以古希腊、古罗马文化为典范，维护王权，主张用典雅的民族规范文字写作，追求高雅，均衡，和谐，统一的风格。二者形成鲜明对照，分析它们的不同，有助于我们对其各自的特点有更为清晰的了解。"},{"id":"66","stars":"★★","title":"高乃依和拉辛的创作比较","body":"一、相同点\n\n高乃依和拉辛都是法国古典主义文学的代表作家。二者都具有进步的民族主义思想，主要创作悲剧，取材于古代，肯定理性的重要，并在一定程度上表示了对专制集权的不满。\n\n（一）政治倾向性\n\n拉辛和高乃依的戏剧，尤其是悲剧，体现了十七世纪法国封建社会向绝对王权发展的时代要求和精神风貌，具有鲜明的政治倾向性。高乃依的悲剧《熙德》明显表现出要求把国家利益摆在第一位，把国王作为国家民族利益的最高代表来歌颂；拉辛的《安德洛玛刻》也谴责为了自己的私欲而不顾国家民族利益的行为。绝对王权在当时代表着混乱中的秩序，因此，拥护符合资产阶级要求的王权是古典主义者的必然选择。\n\n（二）崇尚理性，主张克制个人情欲\n\n古典主义产生的年代，国家统一，君权确立，社会秩序的整顿和典章制度的建立成为当务之急，急需理性发挥作用。于是拉辛、高乃依等古典主义者在其悲剧创作中不可避免地崇尚理性，主张克制个人情欲。高乃依的《熙德》和拉辛的《安德洛玛刻》虽内容不同，但都强调理性的重要性。\n\n二、不同点\n\n（一）所处时代不同导致主题不同\n\n高乃依的悲剧以反映国家民族的大事、英雄伟业为主，从正面突出了理性的崇高，表现了资产阶级力求妥协和维护王权的思想情绪。\n\n而拉辛的悲剧则较多地关注个人感情，注重揭露封建统治的黑暗和贵族阶级的贪婪，表现了更加鲜明的民主倾向。\n\n这一悲剧主题上的区别与他们生活的环境有关：高乃依的悲剧反映的是1630年后的法国社会生活，当时法国君主专制制度的上升时期，内忧外患，造就了艰苦卓绝的人物，所以他以歌颂英雄为主；而拉辛的悲剧则反映的是1660年后的法国，封建王朝处于衰落时期，这时的法国太平日久，宫廷贵族过着剥削生活，讲究的是沙龙应酬，情场角逐，拉辛的作品正是反映和揭露了这些现象。\n\n（二）人物塑造不同\n\n高乃依描写意志坚强的理想人物，在剧情中用理性战胜感情，人物结局圆满。\n\n拉辛描写有缺点的人物，在剧情中让情欲战胜理性，对理性约束情感的能力产生了怀疑，以悲剧收场，折射了这一时期法国社会人欲横流、道德沦丧的现实，因而更具批判性。\n\n（三）语言风格不同\n\n高乃依用热烈生动的语言表现人物的伟大，语言有崇高的阳刚之美。\n\n拉辛则重在情感的揭示，尤其擅长描写女性心理。拉辛的语言典雅、和谐而简洁，具有柔情细腻的优雅风韵。\n\n（四）对“三一律”原则的遵守程度不同\n\n高乃依悲剧中复杂的情节不易严守“三一律”，而拉辛相对简单的情节比较容易合乎“三一律”。拉辛的悲剧情节更加紧凑，结构更加严谨，情感描写更加细腻，对人物内心世界的观察和把握更加深入，从而把古典主义的悲剧艺术推向顶峰，其《安德洛玛刻》被誉为第一部标准的古典主义悲剧。而高乃依的《熙德》虽是法国第一部成功的古典主义悲剧却因不符合“三一律”而受到批评。\n\n＄7．《伪君子》的艺术特点★★★★\n\n一、按照古典主义原则来创作，遵守三一律\n\n《伪君子》故事情节单一，围绕达尔杜弗的伪善展开，故事发展时间也控制在24小时之内，故事发生地点集中在奥尔\n\n贡家中的客厅。\n\n二、戏剧结构严谨，冲突集中，层次分明\n\n《伪君子》通过前两幕的争吵引出戏剧冲突，暗示人物的性格特征，他们争论的焦点是达尔杜弗，这是以“间接描绘”来塑造伪君子的形象。观众虽然已经大体上了解到他的伪善，但百闻不如一见，勾起了好奇心。歌德认为这是他所看到的最伟大的最好的开场了。\n\n三、笔墨简练、高效\n\n《伪君子》全剧总共31场，奥尔贡在20场中出现，而达尔杜弗的戏只有10场；全剧共1962行诗，奥尔贡占342行，而达尔杜弗只占290行，但是达尔杜弗出现的场次却是关键性的，其性格被塑造得非常鲜明。花如此少的笔墨在这个中心人物身上，在莫里哀的戏剧中是独一无二的，在世界戏剧史上也是罕见的。\n\n四、喜剧中融入悲剧、闹剧等多种戏剧因素\n\n奥尔贡女儿的婚姻几乎被断送，他自己面对的是失去财产、被捕入狱的命运，这些都构成了该剧的悲剧因素，使剧情发展更为紧张，矛盾更为尖锐，从而使反面人物的丑恶本质和作品的社会批判性显露得更加突出。而民间闹剧、风俗喜剧和传奇喜剧因素的加入，则增加了该剧滑稽戏谑的情趣、浓郁的生活气息和冲突的紧张性。\n\n第四幕第五场奥尔贡藏在桌子底下是富于喜剧色彩的安排。达尔杜弗的表白愈是坦率，就愈是可笑，因为观众知道他的话都让奥尔贡听到了。艾耳密尔既在对达尔杜弗讲话，也是在对丈夫讲话，而且为了让伪君子暴露，还设法挑逗达尔杜弗，以便让丈夫觉悟。可是这回奥尔贡倒是沉得住气，始终没有露面，急得艾耳密尔又是咳嗽，又是敲桌子，提醒丈夫她是在做戏。最后，奥尔贡等达尔杜弗出去张望之际钻了出来，藏在妻子背后，直到达尔杜弗动手动脚，才迎了上去，让达尔杜弗吻个正着，至此，喜剧效果也达到高潮。\n\n五、运用了重复手法\n\n首先是词句的重复，对于桃丽娜报告太太身体不适，奥尔贡不关心，却问：“达尔杜弗呢？”桃丽娜回答达尔杜弗身体好得过头，奥尔贡则说：“可怜的人！”这样一连四次，喜剧效果强烈。《伪君子》中还有行为和局面的重复，第三幕第六场，达尔杜弗下跪，表示自惭形秽，随之奥尔贡也面对面跪下，显露出被人牵着走的状况，十分可笑；达尔杜弗有四次脱下假面具，第一次对奥尔贡承认自己装假，显得滑稽，第二次把自己贬得一文不值，这是大实话，可笑的是奥尔贡不相信，还有第四幕第五场和第七场，达尔杜弗终于露出了他的真正意图。\n\n六、戏剧语言个性化\n\n《伪君子》中人物的语言都符合各自的身份，桃丽娜的语言犀利、朴素、生动，符合其爽朗的个性；达尔杜弗的语言矫饰、造作，长篇大论地玩弄教义，暴露了这个伪善者口是心非、表里不一的本质。","keywords":"相同点 悲剧 政治倾向性 崇尚理性 不同点 主题不同 人物塑造不同 语言风格不同“三一律”原则\n三一律 结构严谨 冲突集中 层次分明 间接描绘 笔墨简练 悲剧 重复手法 语言个性化","note":"拉辛、高乃依两位伟大的悲剧作家同为十七世纪法国古典主义文学做出了突出贡献。他们在悲剧创作艺术上的共同点体现了当时古典主义者适应时代要求的普遍创作取向；而两者的不同点则大大地丰富了法国古典主义悲剧的表现方式，表现出古典主义悲剧发展道路上的多样性。相关内容可拓展阅读廖敏《法国古典主义戏剧大师-高乃依与拉辛比较》、袁？华《论古典主义的理性-兼比较高乃依与拉辛创作中的理性倾向》，资料可在李凡文学正版群中获取。\n《伪君子》是莫里哀的代表作品，也是古典主义戏剧的典范。在分析《伪君子》的艺术特点时，我们可以从古典主义戏剧的特点和莫里哀戏剧创作的特点这两个角度出发，结合《伪君子》的具体内容理解。"},{"id":"67","stars":"★★★★","title":"《伪君子》的艺术特点","body":"一、按照古典主义原则来创作，遵守三一律\n\n《伪君子》故事情节单一，围绕达尔杜弗的伪善展开，故事发展时间也控制在24小时之内，故事发生地点集中在奥尔贡家中的客厅。\n\n二、戏剧结构严谨，冲突集中，层次分明\n\n《伪君子》通过前两幕的争吵引出戏剧冲突，暗示人物的性格特征，他们争论的焦点是达尔杜弗，这是以“间接描绘”来塑造伪君子的形象。观众虽然已经大体上了解到他的伪善，但百闻不如一见，勾起了好奇心。歌德认为这是他所看到的最伟大的最好的开场了。\n\n三、笔墨简练、高效\n\n《伪君子》全剧总共31场，奥尔贡在20场中出现，而达尔杜弗的戏只有10场；全剧共1962行诗，奥尔贡占342行，而达尔杜弗只占290行，但是达尔杜弗出现的场次却是关键性的，其性格被塑造得非常鲜明。花如此少的笔墨在这个中心人物身上，在莫里哀的戏剧中是独一无二的，在世界戏剧史上也是罕见的。\n\n四、喜剧中融入悲剧、闹剧等多种戏剧因素\n\n奥尔贡女儿的婚姻几乎被断送，他自己面对的是失去财产、被捕入狱的命运，这些都构成了该剧的悲剧因素，使剧情发展更为紧张，矛盾更为尖锐，从而使反面人物的丑恶本质和作品的社会批判性显露得更加突出。而民间闹剧、风俗喜剧和传奇喜剧因素的加入，则增加了该剧滑稽戏谑的情趣、浓郁的生活气息和冲突的紧张性。\n\n第四幕第五场奥尔贡藏在桌子底下是富于喜剧色彩的安排。达尔杜弗的表白愈是坦率，就愈是可笑，因为观众知道他的话都让奥尔贡听到了。艾耳密尔既在对达尔杜弗讲话，也是在对丈夫讲话，而且为了让伪君子暴露，还设法挑逗达尔杜弗，以便让丈夫觉悟。可是这回奥尔贡倒是沉得住气，始终没有露面，急得艾耳密尔又是咳嗽，又是敲桌子，提醒丈夫她是在做戏。最后，奥尔贡等达尔杜弗出去张望之际钻了出来，藏在妻子背后，直到达尔杜弗动手动脚，才迎了上去，让达尔杜弗吻个正着，至此，喜剧效果也达到高潮。\n\n五、运用了重复手法\n\n首先是词句的重复，对于桃丽娜报告太太身体不适，奥尔贡不关心，却问：“达尔杜弗呢？”桃丽娜回答达尔杜弗身体好得过头，奥尔贡则说：“可怜的人！”这样一连四次，喜剧效果强烈。《伪君子》中还有行为和局面的重复，第三幕第六场，达尔杜弗下跪，表示自惭形秽，随之奥尔贡也面对面跪下，显露出被人牵着走的状况，十分可笑；达尔杜弗有四次脱下假面具，第一次对奥尔贡承认自己装假，显得滑稽，第二次把自己贬得一文不值，这是大实话，可笑的是奥尔贡不相信，还有第四幕第五场和第七场，达尔杜弗终于露出了他的真正意图。\n\n六、戏剧语言个性化\n\n《伪君子》中人物的语言都符合各自的身份，桃丽娜的语言犀利、朴素、生动，符合其爽朗的个性；达尔杜弗的语言矫饰、造作，长篇大论地玩弄教义，暴露了这个伪善者口是心非、表里不一的本质。","keywords":"三一律 结构严谨 冲突集中 层次分明 间接描绘 笔墨简练 悲剧 重复手法 语言个性化","note":"《伪君子》是莫里哀的代表作品，也是古典主义戏剧的典范。在分析《伪君子》的艺术特点时，我们可以从古典主义戏剧的特点和莫里哀戏剧创作的特点这两个角度出发，结合《伪君子》的具体内容理解。"},{"id":"68","stars":"★★★★","title":"莫里哀对古典主义的运用和突破","body":"一、莫里哀在其喜剧创作中积极地运用了古典主义原则\n\n（一）莫里哀遵循古典主义文学对戏剧创作目的的要求，歌颂绝对王权。莫里哀在他的代表作《伪君子》中歌颂了国王的圣明。该剧的最后一幕，正当达尔杜弗自以为阴谋得逞之时，剧情突转，圣明的国王识破其阴谋，将达尔杜弗绳之以法，这样的结局符合古典主义戏剧的目的。\n\n（二）莫里哀熟练掌握古典主义的创作规则，并且在作品中表现更加深刻的社会内容和更加强烈的民主倾向，作品的思想性、战斗性和艺术性都达到了很高水平。他的《伪君子》是一部讽刺教会僧侣的力作，强烈的战斗性和高度的艺术性使它在莫里哀的创作中占有特殊的地位。\n\n（三）遵守“三一律”的创作规则和古典主义的语言规范。《伪君子》的时间、地点、情节均符合“三一律”的规定，整部戏剧时间大致从前一天问“早安”开始，到第二天问“早安”结束，没有超过24小时；整个故事情节都集中在奥尔贡家里的一间客厅里展开；其情节单一，围绕揭露达尔杜弗性格的伪善而展开，不枝不蔓。在语言上，该剧采用亚历山大诗体，具有优雅流畅、韵律优美的特点。\n\n二、作为一位具有突出的平民意识的喜剧作家，以及在民间戏剧经验上具有深厚积累的戏剧演员，莫里哀在遵守古典主\n\n义戏剧规则的同时，也进行了富有创新性的尝试。\n\n（一）突破尊悲剧贬喜剧的观点\n\n莫里哀突破了古典主义将喜剧贬为“低级体”以及它给喜剧在表现内容和表现方法上规定的等级观念和狭隘性，在理论与实践上，他不但为法兰西喜剧赢得了崇高的地位，而且扩大了喜剧的表现范围。对古典主义尊悲剧贬喜剧的观点，莫里哀公然持否定态度。在喜剧《妇人学堂的批评》里，他理直气壮地为喜剧辩护，指出喜剧并不比悲剧低。他既肯定了悲剧的意义，也肯定了喜剧的价值。\n\n（二）对待下层人物的态度转变\n\n莫里哀在自己的喜剧中挑战般地把那些在古典主义规定为喜剧所取笑的对象-普通老百姓，列为歌颂的对象。在他的喜剧里，描写了不少仆人、厨师、农民等下层人物，如《冒失鬼》中的玛斯加里尔，《唐璜》中的斯卡纳赖尔，《女博士》中的马丁娜，《伪君子》中的桃丽娜，等等，莫里哀笔下的这些下层人物都是头脑清醒、聪明伶俐、能说会道、性格爽朗、举止活泼、敢说敢为、正直公平和富有生气的。而他所“抨击”和“指责”的全部对象是教会、廷臣、贵族和资产阶级。\n\n（三）突破古典主义摹仿古代的界限，面向现实\n\n莫里哀对古典主义那种崇尚古典、轻贱现实生活和民间文学的反现实主义倾向简直是不屑一顾的，他的创作走的是一条一反古典主义而面向现实人生、反映劳动人民高尚的审美理想和充满活力的艺术趣味的健康道路。他的创作主要取材于现实生活，剧中提出的都是一系列严肃的社会问题。虽然他的创作有些也取材于古代，但他完全用它表现了自己时代的社会生活，如他的著名喜剧《悭吝人》的情节来自于罗马喜剧作家普劳图斯的《一坛黄金》，莫里哀对它进行了“脱胎换骨”的改造，概括了所处时代早期资产阶级的自私贪婪的本质。\n\n（四）重视民间文学\n\n莫里哀同古典主义者轻蔑民间文学不同，莫里哀对健康而富有生命力的民间文学保持着持久不衰的兴趣，他是一个善于汲取民间创作营养的伟大作家，正是这样，他才创作了一系列内容与形式完美统一的、符合广大群众欣赏要求的不朽喜剧。莫里哀一些伟大的作品，往往是表现了劳动人民生活的美，表达了劳动人民的思想、感情和愿望，集中反映了劳动人民高尚的审美理想和健康的艺术趣味，莫里哀的喜剧的光辉正是从这里显示出来的，而这也正是他不受古典主义的束缚，接受了丰富多彩、新鲜活泼的民间文学优秀传统的结果。\n\n（五）突破古典主义的狭隘规则的阻碍\n\n当古典主义的有些规则不妨碍他的创作时，他当然愿意遵守，但是，如果剧情的内在逻辑的发展受到古典主义的狭隘规则的阻碍，那么，他就完全根据剧情的需要而抛弃那些规则。\n\n（1）打破“三一律”原则：“三一律”阻碍了喜剧《打出来的医生》的创作，莫里哀就毫不犹豫地违背了“三一律”，而《唐璜》则完全抛开了“三一律”。\n\n（2）打破悲喜界限：莫里哀的喜剧同古典主义要求悲剧、喜剧必须严格划分，不准交错的原则不同，他的喜剧往往充满着悲剧的因素，增加了喜剧冲突的激烈程度和社会批判的力度。\n\n（3）打破体裁界限：莫里哀常常不顾古典主义对各种体裁的严格划分，把喜剧同其他戏剧体裁融合在一起，常将传奇剧、闹剧、民间风俗剧等表现形式融合其中，增加了喜剧的表现力，活跃了气氛。\n\n（4）打破单纯明晰的戏剧结构：莫里哀并没有简单地遵照古典主义的单纯明晰，而是利用了悬念等表现方法增加情节的张力。例如，《伪君子》的开场就因为成功利用悬念而被视为“伟大的开场”之一。在前两幕中，伪君子达尔杜弗并没有出场，然而舞台上的各种人物围绕伪君子进行着激烈的争论，留下悬念，引人关注。\n\n总之，莫里哀对古典主义戏剧的突破，使法国喜剧面目一新，使喜剧具有了高度的艺术价值和严肃的教育意义；其喜剧创作上承人文主义戏剧家莎士比亚和维加的优良传统，下启18世纪启蒙戏剧，在西方戏剧史上起到了承上启下的作用。","keywords":"运用 歌颂绝对王权 掌握古典主义的创作规则 三一律 语言规范 突破尊悲剧贬喜剧 歌颂下层人物 面向现实重视民间文学 突破 狭隘规则","note":"关于这部分内容，可拓展阅读孔耕蕻《论莫里哀对古典主义的突破-莫里哀喜剧创作新探》，相关资料可在李凡文学正版群中获取。此外，莫里哀的喜剧除了对古典主义有所突破，而且对以往的喜剧艺术也有所创新：①莫里哀对喜剧的形式加以改造。在他之前，喜剧的情节荒唐，充斥着海盗劫掠、多角恋爱、女扮男装、误会重叠、调换襁褓、海难沉船、最后认亲等俗套情节。这类喜剧谈不上什么社会意义。莫里哀则写出风格喜剧和性格喜剧，从根本上改造了旧喜剧，让戏剧的表现天地更加广阔，随之而来的是艺术水准的全面上升。②莫里哀对喜剧手法进行过深入的探索，对喜剧艺术作出重大贡献。莫里哀懂得，并不是人物生理上的缺陷使人发笑，而是某种怪癖、某种恶习令人发噱。有这种怪癖和恶习的人井不值得** --- 我们同情。他改变了传统的喜剧观念。古典主义传统观念贬低喜剧艺术，而莫里哀却借用喜剧提出了各种严肃的社会问题，反映了当时的风俗人情，让喜剧艺术具有了浓厚的现实主义特征和鲜明的战斗精神。因此，他的喜剧获得了“严肃喜剧”的称号。此外，还有部分与对古典主义的突破有所重合，不再赘述。"},{"id":"69","stars":"★★★★","title":"莫里哀喜剧创作的平民化特点","body":"莫里哀是17世纪具有鲜明民主倾向的喜剧作家。他曾经带着剧团在外省巡演13年，亲自体验了下层人民的生活，熟悉民间戏剧。这些生活的积累都增加了他对现实的认识，使其平民意识得到进一步增强，为其日后戏剧创作中表现出来的平民化倾向奠定了坚实的生活和思想基础。莫里哀的平民化特点表现为以下几个方面：\n\n一、戏剧观念上：民主立场\n\n在戏剧观念上，莫里哀继承了人文主义传统，维护个性自由，反对封建意识，他在接受古典主义规则的时候并没有放弃自己的民主立场。莫里哀提出了自己的艺术主张，他认为戏剧应该面向广大的“池座观众”，不必迎合少数坐在戏台上观剧的上层人物，他认为戏剧不是为特权阶级服务，而是为广大人民服务；戏剧的优劣不在于遵守艺术法则，而在于教育观众，剧本的好坏当看它能否打动观众，教育观众，不应该用死板的规则来束缚作者；他认为不应该把文体（如喜剧、悲剧）分为等级的高下；喜剧的责任在于表现“本世纪人们的缺点”，起着移风易俗的作用。\n\n二、题材形式上：喜剧为主\n\n在题材形式上，当时其他的古典主义戏剧家，采用高雅的悲剧艺术形式，以王公贵族为表现对象，创作脱离现实生活的作品；莫里哀则是以写作改变社会风俗的喜剧为己任，取材于现实生活，揭露社会不良习气和丑恶的社会现象。他的喜剧多以农村、乡镇生活为题材，如《打出来的医生》《司卡班的诡计》等，充满着浓郁的下层人民的生活气息。\n\n三、思想主题上：平民化立场\n\n在思想主题上，莫里哀的戏剧作品大胆地揭露了贵族的腐朽、僧侣的伪善和资产阶级的贪婪愚昧与虚荣盲目，赞美与肯定了下层劳动人民的聪明才智和优秀品质，反映了其平民化的立场。莫里哀认为喜剧要描绘当代风俗，修饰本世纪的肖像。这个“静观人”（布瓦洛语）比同时代作家的经历丰富得多，对人情世态的观察深入细致，在人文主义传统、伽桑狄和古代唯物论哲学家的影响下，在与下层人民接触中形成的民主主义思想的指导下，他的观察高度比别人略胜一筹。\n\n四、创作艺术中：各类技巧浑融\n\n在戏剧创作艺术的探索中，莫里哀突破了古典主义的严格限制，将悲喜剧因素融合在一起，运用了各种民间喜剧的表现技巧和方法，例如打耳光、父子反目、桌下藏人等，大大增加了作品的喜剧性和生活气息，也反映了民间戏剧艺术的滋养与其戏剧成就的密切关系。","keywords":"戏剧观念 民主立场 题材形式 喜剧 思想主题 平民化立场 创作艺术多元","note":"从形式到内容，从观念到创作，莫里哀的喜剧创作都表现出鲜明的平民化特点，这也是其对古典主义的突破之一。"},{"id":"70","stars":"★★★","title":"试分析达尔杜弗的人物形象及其揭露意义","body":"一、人物形象\n\n（一）伪善、贪婪、阴险狡诈、卑鄙凶狠、能言善辩\n\n达尔杜弗原本是贵族，破落后成为了一名修士，表面上是诚心向着上帝的苦修者，善待困苦的人民，但实际上包藏祸心，坑害他人，从不拒绝世俗享受，是贪吃的饕餮鬼。\n\n例如，达尔杜弗假惺惺地表示不能看妇女袒胸露臂的装束，可是却盯着女仆桃丽娜的胸衣看个不停，又假装掏出手帕，用严厉的口吻教训桃丽娜说：“把你双乳遮起来，我不便看见。因为这种东西，看了灵魂就受伤，能够引起不洁的念头。”\n\n达尔杜弗伪装不爱钱财，却借上帝的口吻，利用奥尔贡的昏庸，不断获取奥尔贡的信任，直到奥尔贡对他的信任已经超过了对儿子的信任，最后骗取了奥尔贡的全部财产。\n\n达尔杜弗声称不杀生，却向国王告密，称奥尔贡私藏反叛者的文件，想要处死奥尔贡。幸好由于国王英明，洞察一切，下令逮捕了达尔杜弗，并赦免了奥尔贡。\n\n伪善者的可怕就在于其隐蔽性和欺骗性，达尔杜弗伪善的形象贯穿整个戏剧，同时他的贪财、阴险狡诈、卑鄙凶狠、能言善辩也体现在每一个故事中。\n\n（二）贪恋女色与两面性\n\n达尔杜弗作为一名修士，宗教的禁忌无不使其克制着对世俗的向往，但是他追求欲望，展现了人的原欲与现实禁忌之间的矛盾。剧中达尔杜弗的出场很精彩，他看到女仆就故意提高音量对他的仆人说：“劳朗，把我的鬃毛紧身衣和鞭子藏起来，求上帝永远赐给你光明。倘使有人来找我，你就说我去给囚犯们分捐款去了。”这是要向人说明他是个禁欲主义者，不近女色。但现实中，他一方面向奥尔贡的女儿求婚，另一方面企图勾引奥尔贡续妻艾耳密尔。因此，达尔杜弗在表面上依附教会，但实际上还是追求世俗生活。\n\n二、揭露意义\n\n《伪君子》深刻地揭露了教会势力的虚伪性和欺骗性，这完全体现在中心人物达尔杜弗的身上，达尔杜弗的形象的社会意义在于切中时弊，把批判的锋芒直指教会以及打着宗教幌子进行秘密特务勾当的“圣体会”。达尔杜弗具有高度的典型性，其形象已经成了“伪善者”的代名词。当时外省有不少像达尔杜弗这样的中小贵族，他们大多成为骗子，伪善不仅存在于教会中，它还充斥于贵族阶层，形成了社会恶习。通过达尔杜弗这个人物，莫里哀深刻地揭露了上流社会伪善的习气和教会的虚伪荒淫，暴露了宗教骗子的社会危害性，显示出强烈的反宗教倾向。","keywords":"伪善 贪爱金钱财富 有心机 阴险狡诈 卑鄙 凶狠 贪恋女色 两面性 教会势力 虚伪性 欺骗性","note":"达尔杜弗是莫里哀笔下超越时空的不朽形象之一。他的不朽，在于“达尔杜弗决不只是一个达尔杜弗先生，而是全人类的达尔杜弗的总和”。达尔杜弗伪善的形象十分具有典型性，莫里哀通过达尔杜弗这个人物，揭露了上流社会的伪善和教会的虚伪荒淫，显示出了强烈的反宗教倾向。"},{"id":"71","stars":"★★★","title":"试比较莎士比亚与莫里哀戏剧创作的区别","body":"莎士比亚被称为“英国戏剧之父”，是文艺复兴时期杰出的戏剧家。莫里哀是古典主义戏剧的创始人和奠基者。他们对欧洲戏剧事业尤其是喜剧的发展起了很大的推动作用。然而莎士比亚的戏剧在古典主义时期遭到了古典主义者的否定，由此可见其各自戏剧的巨大差异，这主要表现在以下几个方面：\n\n一、人物刻画不同\n\n在人物刻画上，莎士比亚善于写人物性格的复杂性，重视人物性格的发展变化，将人物置于客观环境和内心世界的两重冲突之下予以塑造。例如，在《哈姆莱特》中，哈姆莱特就经历了从快乐的王子、优郁的王子、延宕的王子到复仇的王子的变化过程。\n\n莫里哀作为古典主义作家，往往突出人物性格的某一方面，人物性格表现得比较单一，具有类型化的特点。而且其人物性格在剧情展开过程中基本是定型的，始终一成不变。例如，在《伪君子》中，莫里哀就把伪善者的一切特征都集中在达尔杜弗身上，使他几乎成为伪善的化身。整部戏剧就是围绕达尔杜弗的伪善性格而展开，达尔杜弗就成了伪君子最典型的代表。\n\n二、剧情安排不同\n\n在剧情安排上，莎士比亚的戏剧情节具有生动性和丰富性的特征，往往多条线索交错发展，彼此对照，戏剧冲突多层次展开，紧张激烈。多线条是莎士比亚组织喜剧动作的最大特点，以诗情画意来串联动作是莎士比亚的独特之处。莎士比亚的喜剧不是对现实的模仿，而是充分发挥了艺术家的想象力进行创作。为了增加喜剧性，莎士比亚不放过任何的次要线索，让每一个人都有戏。\n\n莫里哀的古典主义戏剧往往遵循“三一律”原则，情节结构单一，整个故事围绕一个剧情展开。例如，《伪君子》就主要围绕达尔杜弗的伪善性格展开，开端、发展、高潮、结局都是以这一个人物为中心，其情节发展的时间不能超过24小时，只能在一个固定的地点展开。但莫里哀也对戏剧表现方法进行了深入探索，其喜剧描写令人发笑的怪癖以及恶习，善于利用地位颠倒和意料不到的逆转、舞台动作以及语言技巧来制造喜剧效果。他的选材很生活化，极尽夸张之能事，这也是他喜剧效果最成功的手法之一。\n\n三、戏剧容量的不同\n\n莎士比亚摆脱了“三一律”的束缚，自由发挥，剧中常常是悲喜交融、互为点缀、彼此衬托，所以剧本容量显得特别大。在一部戏里，不仅近似因素，就连完全矛盾的因素，也常常能粘合在一起，所以莎士比亚能在广阔的画面里塑造出众多的人物形象和浩瀚多变的场面描写，语言量更是宏大。\n\n莫里哀戏剧创作由于受古典主义“三一律”影响，反映的生活面比较狭窄，他的剧本大多数直接取材于17世纪法国社会的现实生活，他的喜剧常常发生在资产阶级家庭，具有浓厚的生活气息和时代特征。\n\n四、思想内容的不同\n\n斗争，歌颂了人文主义在个人和家庭生活中的胜利。\n\n莫里哀的喜剧具有深刻的思想内容，其喜剧直接描绘现实，具有民主主义思想。\n\n五、喜剧分属两种不同的体系\n\n莎士比亚的喜剧属于肯定型的喜剧，大多是抒情喜剧、浪漫喜剧。莎士比亚的喜剧是建立在对喜剧人物的肯定上的，剧人物主要是被誉扬的对象，是审美的客体的组成部分，因而被认为是开创了一种新型喜剧-歌颂喜剧。\n\n莫里哀的喜剧则属于否定喜剧，主要是讽刺喜剧。莫里哀的喜剧在本质上与中世纪闹剧接近，但是有思想性，与莎士比亚不同的是他更侧重于对平凡日常生活的描写，更多地直接取材于现实社会，因而很有战斗精神和时代气息，其风格活泼、辛辣、明朗、夸张。\n\n总的来说，莫里哀与莎士比亚分别是古希腊喜剧和古罗马喜剧两个喜剧传统的后继者。莫里哀形成了以揶揄讽刺为风格特征的喜剧，莎士比亚则形成了以浪漫抒情为风格特征的喜剧，二者同出一源，又各分东西，成为欧洲文学史上两位杰出的戏剧大师。","keywords":"人物刻画 剧情安排 戏剧容量 思想内容 不同体系","note":"莫里哀与莎士比亚都是世界文学史上杰出的喜剧家，他们分别代表着欧洲文艺复兴时期和新古典主义时期这两个重要时代的戏剧艺术高峰。但由于二者所处的时代不同，所接受的文学思潮不同，对戏剧创作的理解不同，导致二者的戏剧创作有很大区别，大家可以在对比中明确二者各自的创作特色。相关内容可参考吴敏《莎士比亚与莫里哀戏剧比较》、陈国强《两种喜剧-试论莎士比亚喜剧与莫里哀喜剧的根本差异》、汤志民《莎士比亚与莫里哀戏剧创作比较》，资料可在李凡文学正版群中查看。"},{"id":"72","stars":"★★","title":"《失乐园》的结构特点","body":"弥尔顿以圣经题材故事为基本构架，同时借鉴了文人史诗的形式，使其诗篇形成了壮阔宏伟又严整精巧的结构特色。\n\n一、宏大而匀称的篇章结构\n\n《失乐园》运用宏大而匀称的篇章结构，囊括了非常广阔的时空背景。史诗模仿维吉尔的《埃涅阿斯纪》，分12卷，由三大部分组成。第1、2卷为第一部分，以深不可测的地狱为场景，第3至8卷为第二部分，以浩瀚无际的宇宙为背景，第9至12卷为第三部分，以地上乐园为中心。而在描写内容上，前六卷主要写天使，后六卷主要写人类的始祖。\n\n二、两条线索交织\n\n《失乐园》中，两条线索交织，铺展情节：一是撒旦率军反抗天帝，被打入地狱而失去天上乐园的故事；二是人类始祖亚当、夏娃偷吃禁果失去地上乐园的故事。在第九卷，撒旦引诱亚当、夏娃犯罪时，两条线索得以交汇。诗人让两条线索彼此推动，将地狱、天上、人间发生的上帝、人类、魔鬼之间的故事表现了出来，既显示了诗歌在气魄和容量上的史诗特性，也反映了诗歌在内部形成的紧密联系。\n\n三、叙事结构复杂生动\n\n《失乐园》的内容按时空顺序依次展开，同时辅以倒叙和插叙，增加了结构的复杂性和生动性。每一部分的开端，都有引言，概括情节和题意，各部分情节依次展开，但是在每一部分的具体描写和叙述中，则灵活地运用了倒叙和插叙等其他叙述手法。例如，诗歌以描写犯罪天使被贬入地狱后试图联合人类始祖谋反作为开始，但是直到第五、六、七卷才由天使拉斐尔向亚当追述撒旦的叛乱史。","keywords":"宏大而匀称的篇章结构 两条线索交织 叙事结构复杂生动","note":"在结构上，《失乐园》继承了古希腊、罗马史诗的传统，是英国文学中一部杰出的史诗。结构特点也是艺术特点之一，可以运用在下一道题目上。此外，《失乐园》也会以名词解释的形式出现，大家要注意积累。"},{"id":"73","stars":"★★★","title":"《失乐园》的艺术特色（26辽宁大学）","body":"一、史诗结构宏伟，场面壮阔，风格崇高\n\n《失乐园》以一万多诗行来吟咏上帝、人类和魔鬼之间发生的故事，在现在、过去和未来之间穿梭，囊括地狱、天国和伊甸园三个组成部分。地狱阴森恐怖、惊心动魄，天国富丽堂皇、气势辽荡，伊甸园幽雅美丽、诗意盎然。史诗中人物活动的场景，从渺渺太空到茫茫混沌，从净火天上到地狱火湖，从天界星座到人间乐园，气势雄浑，景象宏伟。如撒旦的叛军与天军作战的场面，写得有声有色，惊天动地，雄奇澎湃，蔚为壮观。因而人们公认，崇高的风格是弥尔顿诗作最突出的艺术\n\n特征。\n\n二、采用无的诗体，节奏感强，富有音乐美\n\n《失乐园》采用了16世纪英国诗人惯用的无韵体诗的格式，诗行通常是五音步抑扬格，音调铿锵，抑扬顿挫，有强烈的节奏感。弥尔顿认为：诗歌的音乐性存在于一个诗节到一个诗节的推移中，在字里行间给人以各种快感，并不在于句尾音韵的雷同。诗人十分自信地表示，《失乐园》树立了以音乐感为诗歌至高形式的样本。该诗依照诗人思想感情的变化来安排诗的节奏和声响，注重意象的明暗、音步的轻重、诗句的长短等一系列诗歌形式的巧妙安排。诗句中长音舒缓别致，短音急促有力，它们长短交错，舒急有序，表达出诗人微妙变化的情绪。整篇史诗，读起来有如行云流水，给人带来极大的艺术享受。\n\n三、比喻生动，语言瑰丽雄奇\n\n弥尔顿语言修养极高，他吸收了《圣经》和古希腊罗马文学的精华，独具风格。《失乐园》大量使用比喻，明喻之中常常夹杂着暗喻，这就不仅使其想象更加生动鲜明，而且大大地拓展了作品内涵的张力。例如第一卷中对邪恶天使昏睡于火湖的描写，为了说明火湖中天使众多，诗人先是把他们比作意大利茂林之下的河上落叶，又比作红海秋后漂泛的海藻，最后又比作《圣经》故事里的情节：上帝的选民以色列人在神的庇护下，涉渡红海后，回顾海面，只见上面漂浮着那么多的尸体和破碎的战车。这些比喻不仅描绘了火湖上天使众多的情形，而且也暗示了他们堕落后的凄惨痛苦境地。诗人还善于运用排比、倒装等多种修辞手法，产生华丽的夸饰效果，形成史诗的崇高风格。\n\n总之，《失乐园》所表现出来的那种构思宏伟、音调铿锵、语言雄奇瑰丽的独特风格，使之在17世纪欧洲文学中占有重要的地位。这部史诗既继承了人文主义的古典传统，又表现了清教主义的激情，亦即把希腊罗马文化的重兴与基督教的宗教改革二者结合了起来，形成了英国文艺复兴最后的灿烂时刻。","keywords":"结构宏伟 场面壮阔 风格崇高 无韵诗体 节奏感强 比喻生动 语言瑰丽雄奇","note":"在《失乐园》里，弥尔顿显示了高超的艺术。诗人的革命热情和高远的想象使他雕塑出十分雄伟的人物形象，如撒旦等，描绘了壮阔的背景，如地狱、混沌、人间等。诗中运用了璀璨瑰丽、富有抒情气氛的比喻，运用了独特的拉丁语的句法和雄浑洪亮的音调等，整体呈现出一种高昂的风格。"},{"id":"74","stars":"★★★","title":"《失乐园》中撒旦的形象（25北京外国语大学）","body":"弥尔顿的代表性长篇诗作《失乐园》创造性地借用了《圣经》中的故事，表达了符合时代发展和个人价值追求的新思想。对撒旦形象的理解是正确把握史诗主题的关键。撒旦在《圣经》中是个反面人物，他的失利与受罚昭示了上帝的公正和无上权威，但《失乐园》中的撒旦形象十分复杂，历来都受到极大的争议。弥尔顿笔下的撒旦颠覆了传统的撒旦形象，塑造了一个崭新的撒旦，这主要表现在：\n\n一、弥尔顿笔下的撒旦首先是位英雄，代表着弥尔顿的革命思想\n\n在史诗的前半部分，撒旦被刻意描绘成一个敢于藐视权威、反抗强暴的英雄。是撒旦首先敢于怀疑毫无道理却非让人盲目服从的绝对命令，他是叛逆天使们的“强大首领”和“威严统帅”，他以王者的赫赫气概，率领天军部下揭旗北进，与上帝分庭抗礼，在激战中表现出了超人的勇气和力量；他有着强烈的反抗精神，虽然被打入地狱，依然斗志昂扬，桀骜不驯。撒旦的英雄气魄在于他具有敢于向最高权威抗争的精神：为争取平等和自由，推翻上帝的独裁统治。\n\n弥尔顿通过描写撒旦的反抗与战斗，赋予其高昂的革命激情，表达出对其不屈不挠的复仇意志和毫不妥协的革命精神的赞美之情。正因为如此，以雪莱等为代表的“撒旦主义派”把撒旦定性为“革命者”，认为撒旦是诗中的主角和英雄，上帝则是否定的形象。\n\n二、弥尔顿揭示了其野心勃勃、骄矜自满、为非作歹的恶魔特征\n\n撒旦利欲熏心，妄图取代上帝，建立自己作威作福的权势。他还骄傲地认为自己是“衡量万物的标准”，是宇宙的中心，从而认为对于他“一切都可容许”。在地狱，他为自己建立了金碧辉煌的万魔殿。当他看到人类始祖仪容俊秀、生活幸福时，便心生妒忌，处心积虑地引诱夏娃等犯罪，以此来报复上帝，毁掉上帝所创造的福境-人类始祖居住的伊甸园，使人类受到上帝的惩罚，从而达到自己不可告人的目的。\n\n撒旦无论是反叛上帝还是引诱人类，都是由于骄横嫉妒，有主宰世界的野心。撒旦在极端个人主义的驱使下，一步步走向堕落，以致到了暴虐和放荡的地步。\n\n三、撒旦是弥尔顿自由意志和理性原则并重思想主张的艺术载体\n\n弥尔顿笔下的撒旦虽然是一位个性鲜明的反叛人物，但他也是一位悲剧人物。他的反叛失败以及所遭受的迫害都充分体\n\n现了这一点。人们既同情他悲惨的结局，也憎恶他由于丧失理性与约束所表现出的狂妄、暴虐和放荡。从他的可悲下场中可以认识到缺乏理性约束、放纵自私欲望所带来的危害。\n\n诗人着力塑造这一形象的意图，在于撒旦的堕落和人的堕落有着很大程度的相似性：同样是因为上帝所赋予的自由意志，他们有超越神所赋予的自由范围的选择权；同样是在自由意志下的“自我意识”的作祟，使撒旦和夏娃不能经受住超越自身限制的骄傲的诱惑而违抗神意；同样是自我私欲高过对神的敬畏，撒旦和亚当顺从私欲，背弃真神，落入罪恶；同样是在罪恶的诱惑下，撒旦和人一步步地堕落，一步步地经受罪恶带来的更大的痛苦和煎熬。\n\n撒旦以上三个方面的形象构成了其性格的复杂性和矛盾性，这也是这一人物形象的独特魅力和价值之所在。诗人赋予批旦形象以深刻的寓意：既要讴歌当年反对封建专制王朝、建立共和国的那些资产阶级的英雄们，也要批评资产阶级革命者（尤其是领导人物）的傲慢自满、骄奢淫逸，正是这些弱点导致了革命失败。\n\n18世纪启蒙主义文学","keywords":"敢于藐视权威、反抗强暴的英雄 赞美 野心勃勃、骄矜自满、为非作歹的恶魔特征 艺术载体 复杂性和矛性讴歌批评","note":"弥尔顿在思想上批判骄矜的撒旦，在感情上却同情他所处的地位，因为撒旦受上帝惩罚，很像资产阶级受封建族的压迫一样。在描绘地狱一场时，弥尔顿虽然口口声声说撒旦骄傲、野心勃勃，但在对话里，在形象上，撒旦又完全是一个受迫害的革命者。《失乐园》中撒旦形象的复杂性和具体内涵，我们要仔细把握。"},{"id":"75","stars":"★★★","title":"启蒙运动的产生背景","body":"18世纪的欧洲已处于由封建社会向资本主义过渡的社会转型时期，政治、经济、思想文化等新旧力量撞击十分剧烈，因此，在思想文化领域，18世纪的欧洲出现了资产阶级发动的第二次反封建、反教会的伟大的思想解放运动-启蒙运动，它的出现，主要归因于以下几方面：\n\n一、政治方面\n\n就当时的整个欧洲来说，封建的社会和政治制度仍处于统治地位，只是更加反动腐朽了。英国虽然进行过资产阶级革命，但其革命的不彻底性，封建势力同包括一般资产阶级在内的人民群众的矛盾日益尖锐化，推翻封建制度，铲除封建残余，建立和发展资本主义社会的历史任务，先后提到了欧洲各国的历史日程上。顺应这一历史要求，在文化领域，全欧范围便产生了被称为“启蒙运动”的思想文化革新运动。\n\n二、经济方面\n\n资本主义经济发展创造了社会条件。17、18世纪，西欧资本主义获得了较大发展，新兴资产阶级的力量日益壮大，掌握了越来越雄厚的经济实力。资本主义经济的发展和资产阶级力量的壮大，为启蒙运动的兴起奠定了经济基础和阶级基础。但是，与这一社会需求相对立的却是当时欧洲大陆独霸政权的专制主义和教权主义。所以，反封建、反教会，甚至反宗教，就提上了资产阶级革命的议事日程。\n\n三、生产力发展\n\n促使启蒙运动诞生的社会内驱力还在于科学和生产力取得突破性发展。自然科学和生产力的突破性发展，带来人的价值的进一步发现。当时数学、物理、化学、生物学和地质学等自然科学已经各自形成了独立的学科。牛顿发现的万有引力定律为其他许多学科的大发展奠定了基础。瓦特于18世纪60年代发明高热效率的蒸汽机，并使之成为工业可用的发动机，于是英国开始了工业革命，法国稍后也开始使用机器生产。科学运用于生产实践，大大扩大了国际贸易，提高了工农业的生产力，资本主义经济和资产阶级力量空前壮大。人的视野更加开阔，人的价值进一步被发现。\n\n四、思想方面\n\n受政治、经济、生产力各方面影响，人们开始从新的视角重新审视世界，反封建的情绪空前高涨，产生了一大批新思想。\n\n英国资产阶级革命后所建立的君主立宪政体和代议制，英国自17世纪以来的哲学、社会科学等进步思想文化的发展，对欧洲启蒙运动的诞生产生了直接影响。霍布斯反对“君权神授”、关于“自然状态”和社会契约的理论，洛克关于知识来源于人的后天经验的经验主义哲学，托兰德反对传统宗教的自然神论和无神论，等等，实际上就是18世纪启蒙运动的序幕。英国的哲学和社会科学等进步思想成为了欧洲资产阶级学者认真研读的对象，这些新思想的传播，为启蒙主义运动提供了理论基础和思想支撑。\n\n综上，启蒙运动的产生有其深刻的历史原因，它是跟资本主义生产关系得到较快发展和资产阶级已经形成强大的政治力量紧密联系的，也是与第一次工业革命完成所导致的无神论思想的出现密切相关的。它既是资本主义与封建主义继续斗争在思想领域的表现，也是对文艺复兴时期人文主义思潮与近代自然科学思想的继承与发展。","keywords":"政治方面 经济方面 生产力方面 思想方面","note":"启蒙运动的背景相当于我们学习启蒙文学的引子，值得注意的是题目问的是启蒙运动而非启蒙文学，大家要分清二者的不同，启蒙文学是在启蒙运动的影响下出现的文学运动，而启蒙运动是资产阶级为了反封建、反教会发起的思想革命运动。"},{"id":"76","stars":"★★★★","title":"启蒙文学的特点","body":"启蒙主义文学是启蒙运动的重要组成部分，它的产生一方面适应了欧洲资产阶级政治斗争的需要，另一方面也是新时代文学内容要求突破与封建主义相适应的古典主义的各种规律的艺术表达。启蒙文学在欧洲各国的发展各具特色，然而各国文学家们的美学思想与创作取向仍然具有一致性，这也就可以概括成启蒙文学的特点。\n\n一、鲜明的政治倾向性\n\n启蒙作家往往就是启蒙思想家和活动家。他们在作品中猛烈抨击封建制度和教会，热情宣传自由、平等、博爱思想，描\n\n绘理性王国蓝图。启蒙主义文学家们一般站在无神论或朴素唯物论的立场来理解艺术与现实的关系，竭力捍卫艺术的民主倾向，使文学面向广大人民群众，着重描写平民的日常生活，塑造了普通人的正面形象，把普通人的情感和理智、希望和追求幸福和痛苦，都写进文学作品之中。\n\n二、深厚的哲理色彩\n\n启蒙作家的理性崇拜和渴望参加现实斗争的倾向，使启蒙文学具有鲜明的哲理性和政论性。这种特点在哲理小说方面体现得最为明显。启蒙作家常常有意识地把自己的政治观点、哲学思想融入作品中，对生活进行分析、思索和评论，使作品带有寓意和象征性，具有说教和政论特色，这类作品尤以小说为多，此类小说被称为哲理小说。有的作品以一定的哲理论点作为组织材料、结构情节的中心，集中讨论哲学、政治、宗教、教育、道德等问题；有的作品通过在一定程度上作为作者代言人的主人公，随时发表深刻的理论见解；有的作品着力塑造富于哲理意蕴的艺术典型，以人物性格的丰富内涵具体显现某种哲理。哲理小说同时影响了其他文体，使整个启蒙文学闪耀着富于理性精神的所谓“阿波罗风范”。但启蒙文学的哲理性和分析性，也给作品带来概念化的缺陷，作品中纯理性的成分较多，忽视对人物性格的刻画，使艺术形象缺乏个性特点，从而削弱了文学作品的艺术感染力。\n\n三、真实自然的创作风格\n\n启蒙作家们遵循法国启蒙思想家狄德罗提出的“创作要真实自然”这一主张，相信文学艺术的美是来源于自然，来自于生活。在他们看来，文艺的美应该来自自然，来自生活，因此他们要求艺术真实地反映现实，从而更深刻反映社会生活中的各种矛盾、形形色色的人物以及他们的思想感情。\n\n四、活泼多样的文学形式\n\n在文体形式方面，启蒙作家为了宣传启蒙思想，逐渐扬弃古典主义关于体裁高低之分的清规戒律，平等地广泛采用小说、诗歌、戏剧和文艺性的政论等各种文体，打破了自古以来诗体文学独尊的局面，开创了文学史上的散文时代。这一时期小说的形式多种多样，有书信体、游记体、自白体、自传体、对话体，等等，以英国现实主义长篇小说和法国的哲理小说成就最为杰出。戏剧方面的创新突出地表现在市民剧的形成上，市民剧表现市民和普通人的日常生活，打破悲剧和喜剧的严格界限，不遵守“三一律”，运用散文语言创作，开创了后来长足发展的话剧的先河。\n\n五、丰富多彩的艺术手法\n\n与内容的丰富性和文体的多样化相适应，启蒙文学的艺术手法丰富多彩。由于当时新旧大陆以及东西方交流的扩大和频繁，作家们认识到，在不同文化传统的地区，人们对待同一问题的看法反差甚大，又因为受到当时启蒙作家所特有的“普遍理性”和“自然人”论的观点影响，他们就在创作时虚构出了具有“自然理性”的“外方人”，让这些“外方人”置身于欧洲社会或特定社会的文化氛围内，从他们“外方人”的视角观察、评论人们习以为常的生活和传统。这样，被批判的社会便在“外方人”少见多怪的眼睛里呈现出丑恶和不合理的本质，既滑稽有趣又能振聋发聩。\n\n六、资产阶级或平民主人公\n\n启蒙文学的主人公较之以往的文学发生了根本性变化。启蒙文学把资产阶级和其他平民当作主人公甚至英雄人物进行描写，成功地塑造了如鲁滨逊、汤姆琼斯、拉摩的侄儿、费加罗、维特、浮士德等一系列不朽的艺术典型，许多人物既闪耀着富有时代特色的理性光芒，也呈现出人的灵魂内部理与情、灵与肉、生与死等各种心理因素的多维矛盾，揭示出更为丰富复杂的人性内涵，例如拉摩的侄儿、浮士德就在这方面获得了黑格尔以及马克思、恩格斯的高度称赞。\n\n总之，正是因为将十八世纪哲学方面、政治方面、思想观念方面的建树都进行了总结和概括，并将之巧妙地结合，启蒙文学无论在思想的深度上，还是在体裁的广度上都达到了前所未有的高度。为19世纪欧洲文学的空前繁荣打下良好基础。","keywords":"鲜明的政治倾向性 深厚的哲理色彩 真实自然的创作风格 活泼多样的文学形式 丰富多彩的艺术手法 资产阶级或平民主人公","note":"启蒙文学的特点相当于一个总的介绍，背诵这一题对于我们回答一些启蒙文学作品的特点有很大的帮助，如果不知道某部启蒙文学作品的特点，可以参考这个总体特点来回答，一题多用。此外，“启蒙文学”名词解释大家要积累一下。"},{"id":"77","stars":"★★","title":"试比较启蒙文学与人文主义文学的异同","body":"启蒙主义是人文主义的继续和发展，作为启蒙运动组成部分的启蒙文学和文艺复兴时期的人文主义文学既有相同点，也有不同之处。\n\n一、反封建的程度上\n\n（一）启蒙主义文学与人文主义文学都是新兴资产阶级反封建、反教会的重要思想工具，但人文主义文学偏重于伦理道德和生活领域，着重揭露教会的黑暗和教士的伪善贪婪，反对封建教会，但不反对神学。\n\n（二）启蒙文学则把矛头直指封建制度和宗教迷信，为资产阶级夺取政权制造舆论，其反封建反教会的思想内容，较之文艺复兴人文主义文学具有更强烈的政治性和革命性，启蒙主义不仅反对封建教会，而且作家们以自然神论甚至无神论为武器，对传统教会的批判达到空前激烈的程度，从理论深度上根本动摇了封建教会存在的合理性。\n\n二、政治方面\n\n人文主义主张维护封建王权，以巩固国家的统一，而启蒙主义在政治上提出了更为激进的主张，要求实现君主立宪制或民主共和制。\n\n三、人的解放议题方面\n\n人文主义肯定人有享受世俗幸福的权利，主要关注的是如何从教会的束缚下解放人的个性，而启蒙运动的思想家们则进而要求破除宗教迷信，摧毁宗教偶像，反对贵族特权，推翻封建统治，争取的是精神自由和政治平等的权利。\n\n四、人物形象方面\n\n两者的正面主人公都体现了资产阶级的愿望，但人文主义文学中主人公往往披着帝王将相、才子佳人的外衣，而启蒙文学则直接以第三等级的人物作为歌颂的对象，把封建贵族作为讽刺批判的对象。\n\n五、艺术手法方面\n\n两者都运用写实主义手法，强调反映社会现实，都体现了现实主义文学的特点，但人文主义文学往往采用古代和外国的题材，而启蒙文学则大多直接取材于现实生活，具有更为突出的现实针对性。\n\n六、新的文学形式\n\n两者都创造了一些新的文学形式，如前者首创了十四行诗和小说等，后者独创了哲理小说和正剧等。","keywords":"反封建程度 政治方面 人的解放 人物形象 艺术手法 新的文学形式","note":"人文主义和启蒙运动两股思潮都对资本主义的发展起着推波助澜的作用，但是我们要注意到启蒙主义是人文主义的继续和发展，文艺复兴时期的反封建和反宗教意识并不彻底，而启蒙文学继承了文艺复兴时期的人文主义文学的传统，接过了反封建、反教会的旗帜，并将其精神发扬光大，具有更强烈的批判意识和更深刻的民主思想。"},{"id":"78","stars":"★★★","title":"谈谈18世纪有哪些文学思潮为19世纪浪漫主义奠定了基础","body":"18世纪文学的主潮是启蒙文学，但是因为各国具体情况的差异，启蒙文学在各国的发展和表现形式也有所不同，同时还催生了一些其他的文学思潮。这些思潮的出现不仅有其历史必然性，而且还为即将到来的浪漫主义文学奠定了初步的基础。\n\n一、英国感伤主义文学\n\n感伤主义是18世纪后期流行于欧洲的一种文学思潮，因英国作家斯泰恩的游记《感伤的旅行》而得名。感伤主义文学的特点是崇尚感情，把情感放在理性之上，夸大感情的作用，细致地描写人物的心情和不幸遭遇，以唤起读者对人物命运的同情与怜悯，同时也因为对劳动者的疾苦深表同情，流露出对社会的不满，具有人道主义思想，但常常以生、死、黑夜和孤独为题材，因此格调悲哀，语言灰暗。感伤主义文学突出感情，呈现出主观性和情感性的审美特质，成为19世纪浪漫主义文学的先声。\n\n二、狂飙突进运动\n\n狂飙突进运动发生于18世纪70年代到80年代中叶的德国。它是德国新兴资产阶级发起的第一次全国性的文学运动，也是启蒙运动在德国的继续与发展。狂飙突进运动的参与者多为青年知识分子，充满反叛激情，主张民族统一，强调文学的民族性，要求发扬文学的民族风格；反对封建束缚，强调天才，强烈地要求个性解放；接受了卢梭返回自然的思想，歌颂理想化的大自然和淳朴的人民。其成就主要体现在戏剧领域，代表作家是青年时期的歌德和席勒，理论家是赫尔德。这一运动促进了德国民族意识和个性的觉醒，将德国启蒙文学推向迅猛发展的阶段。其对感情和天才的强调，对民族文学的重视，也使这一运动成了19世纪浪漫主义文学的先导。\n\n三、哥特式小说\n\n哥特小说是18世纪后期在英国出现的一种新的小说体裁。哥特小说以中世纪哥特式古堡为背景，写发生在阴森恐怖的城堡中的神秘故事和谋杀事件，充满神秘、恐怖、怪诞的气氛。哥特小说是对理性主义的反拨，表现了人们对资产阶级革命后的社会现实产生的不满情绪，对后来的浪漫主义、现实主义和现代主义都有不同程度的影响。\n\n总之，以上出现于18世纪的文学思潮在文学创作和理论方面都取得了一定成就，成为浪漫主义文学的先导，而被称为\n\n“前浪漫主义”。","keywords":"英国感伤主义文学 狂飙突进运动 哥特式小说 前浪漫主义","note":"大家在识记这部分内容时，要注意感伤主义文学和哥特式小说都是英国文学思潮，而狂飙突进运动是德国文学思潮。这三种文学思潮都不同程度地推动了浪漫主义文学思潮的出现。每一小点都可以当作名词解释进行识记。"},{"id":"79","stars":"★★","title":"哥特式小说的艺术特征","body":"一、哥特式小说\n\n“哥特”原指哥特人和中世纪的哥特式建筑。哥特小说是18世纪后期在英国出现的一种新的小说体裁。哥特小说以中世纪哥特式古堡为背景，描写发生在阴森恐怖的城堡中的神秘故事和谋杀事件，充满神秘、恐怖、怪诞的气氛。\n\n哥特小说由英国作家华尔波尔首创，代表作是华尔波尔的《奥特朗图堡》、拉德克利夫夫人的《奥多芙的神秘》和马修G刘易斯的《修道士》。哥特小说是对理性主义的反拨，表现了人们对资产阶级革命后的社会现实产生的不满情绪，对后来的浪漫主义、现实主义和现代主义都有不同程度的影响。\n\n二、艺术特征\n\n在英国文学史上，哥特式小说主要通过赞美人类从极端情感中得到的乐趣及至高哲学来对抗传统逻辑方式。这一点跟哥特式建筑具有相似的特点，那就是哥特式建筑也是对作为理性时代代表的古典建筑的对抗。从这一点来看，无论是哥特式建筑还是哥特式小说均有挑战传统风格的特点。正是这一特点使其构成激发哥特式小说核心矛盾的关键，也使其推动故事情节向离奇曲折的方向发展。哥特式写作手法在18世纪和19世纪早期欧美文学作品中反映出的特点是：\n\n（一）哥特式小说通常将时间选定为中世纪，故事一般发生在荒僻地带，背景建筑往往是古老的城堡、庄园、地牢、修道院、幽闭的城堡、阴森的旧宅等。以破败阴森的哥特式城堡、废城或荒野为背景，描写因欲望和钱财导致的阴谋和凶杀，交织着鬼怪的活动和超自然现象的影响。\n\n（二）哥特小说主题不外乎暴力、仇恨、阴谋、凶杀、兄弟残杀、夺人之妻等引起人们负面情感的事情。一般通过家族仇恨、继承权的争夺等来揭示人性的邪恶和社会的罪恶，是关于善与恶、光明与黑暗、正义与邪恶的冲突。\n\n（三）哥特式小说故事情节充满悬念，紧张刺激，哥特式小说家认为恐惧是“人类最老最强烈的情感”，为了激起恐惧以期达到对神秘的超验力量的敬畏，哥特式小说的情节往往充满悬念而且惊心动魄，有时还会涉及衰败和死亡；故事内容可能会有家族秘密、非常态的人或事，有时甚至会有暴力或性。\n\n（四）在人物塑造方面上，评论家莱斯利·菲德勒在《美国小说中的爱和死亡》一书中这样论述：“恶棍英雄确实是哥特体裁的创造......该体裁往往以恶棍英雄既引诱别人又自己遭受苦难，既迷人又邪恶为主题。”也就是说，哥特式小说的主人公-“恶棍英雄”既是迫害者又是受害者。此外，哥特式小说人物心理刻画细腻深入。作家们致力于表现人物神秘的内心体验，强调非理性因素。《修道士》就描写了安布罗斯怎样在欲望和禁欲律令中辗转的过程，揭示了其隐秘曲折、复杂微妙的深层精神世界，展示了其内心的痛苦与恐惧，描绘了他走向毁灭的全过程。\n\n（五）富有想象力，呈现出恐怖与诗意的奇特结合。哥特式小说描写超自然的现象和非现实的人物，显示出作家丰富的想象力。在氛围营造方面除了会使用哥特式建筑、天气、黑暗等来烘托神秘恐怖的气氛之外，还独特地通过反复运用意象和梦幻，来衬托心境。另外，哥特式小说富有诗意，在小说内容中穿插有诗歌，颇有意境。例如哥特式小说的代表作家刘易斯本身就是一位颇有造诣的诗人，其《修道院》就穿插了大量诗歌。\n\n总而言之，这类题材文学或是影视作品常会给人阴暗和恐惧的感觉。故事真相往往都隐藏在那些看似充满浪漫色彩的故事情节或神秘而恐怖的气氛中。哥特式小说的艺术特征，反映了哥特式小说的性质，即对理性主义的反拨，也表现了18世纪资产阶级革命后人们对社会现实的不满情绪，对后来的浪漫主义、现实主义和现代主义都有不同程度的影响。","keywords":"挑战传统风格 中世纪 主题 情节 人物塑造 想象力","note":"哥特式小说一般被认为随着贺瑞斯·华尔波尔的《奥特朗图堡》的出版而产生。哥特式小说可以说是恐怖电影的鼻祖，更重要的是，它使我们今天习惯地将哥特式与黑暗、恐怖联系在一起。显著的哥特式小说元素包括恐怖、神秘、超自然、厄运、死亡、颓废、住着幽灵的老房子、癫狂、家族诅咒等。大家可以从这个角度去切入理解哥特式小说的整体风格。"},{"id":"80","stars":"★★★","title":"法国启蒙文学的主要成就","body":"法国启蒙文学与法国启蒙运动同步发展，是18世纪法国文学的主流，广泛传播了启蒙思想，推动了启蒙运动的发展。\n\n法国启蒙文学是在资产阶级积极酝酿革命的背景下诞生和发展的，所以批判力度最强，最富于民主战斗精神。\n\n一、法国启蒙文学在18世纪20年代兴起，经过了前期、中期和后期三个发展阶段，涌现出一大批杰出的启蒙文学家。\n\n（一）孟德斯鸠和伏尔泰是法国18世纪上半期启蒙文学的代表作家。孟德斯鸠是法国第一位真正意义上的启蒙作家。他的理论著作《论法的精神》把法制提高到国家政治生活的首位，并详细论证了三权分立学说，该书已成为关于国家学说的世界名著。他的书信体小说《波斯人信札》是第一部著名的启蒙哲理小说，为法国启蒙文学开辟了道路。伏尔泰是法国启蒙运动中具有领袖威望的作家。他倡导文艺为社会改良和宣传启蒙思想服务，但又强调古典主义的规则应该遵守，极想使自己成为高乃依和拉辛的后继者。\n\n（二）法国启蒙文学发展到世纪中期，新一辈作家狄德罗、卢梭等以更为激进的姿态登上文坛，把法国启蒙文学推向繁荣的顶峰。狄德罗是法国启蒙运动的中坚，唯物主义哲学家、现实主义美学家和作家。卢梭是古典自然法学派和法国启蒙运动的代表，其文学创作是浪漫主义文学的先声。卢梭的代表作《新爱洛依丝》《爱弥儿》《山中来信》《忏悔录》等都产生了巨大反响。\n\n（三）法国启蒙文学在后期阶段的代表主要是博马舍，他是著名的剧作家和戏剧理论家。他继承了狄德罗的戏剧理论，提倡“介乎英雄悲剧和轻快喜剧之间的中间类别的严肃喜剧”。他第一个把这种戏剧称为“正剧”，并强调这种戏剧是现实生活的真实反映。他主张描写第三等级的普通人，使用普通人的日常语言。博马舍的代表作有《塞维勒的理发师》《费加罗的婚姻》等。\n\n这些启蒙文学家创作风格多样，自成一体，涉及散文、小说、戏剧和诗歌等文学样式，体现了启蒙文学内部的多样性和丰富性。\n\n二、法国启蒙作家利用文学来宣传自己关于社会生活、宗教制度、政治体制等方面的看法，创造了哲理小说、启蒙戏剧等新的文学表现方式。\n\n（一）哲理小说的作者往往利用带有明显寓意的形象来创作，使得这类小说具有透彻的说理和辛辣的讽刺。哲理小说通过人物形象和故事，传播启蒙思想，批判封建专制社会。其语言明晰简朴，叙事简洁明快，但并不注意情节结构的完整、人物形象的典型性。孟德斯鸠的《波斯人信札》，伏尔泰的《查第格》《老实人》和《天真汉》，狄德罗的《拉摩的侄儿》和《宿命论者雅克》等都是其突出代表。\n\n（二）启蒙戏剧也称“正剧”或“悲喜剧”，它打破了传统戏剧中喜剧和悲剧的二分，将它们糅为一体，从而真实地反映了日常生活，并从正面对资产阶级的人物进行刻画，站在市民立场反映社会生活，塑造正面的市民形象，对资产阶级的道德主张进行了有力的宣扬。启蒙戏剧不论在内容还是在形式上都奠定了现代戏剧的基础。狄德罗是启蒙戏剧理论的倡导者与实践者；博马舍则是其实践者，创作了代表作《塞维勒的理发师》和《费加罗的婚姻》。","keywords":"前期 孟德斯鸠 伏尔泰 中期 狄德罗 卢梭 后期 博马舍 哲理小说 启蒙戏剧","note":"启蒙文学对西方文学的影响是巨大而持久的，在法国尤为突出。此外，“哲理小说、启蒙戏剧”等名词解释大家也要关注一下。"},{"id":"81","stars":"★★★","title":"简述亨利·菲尔丁的文学创作成就","body":"菲尔丁的文学创作集中于小说和戏剧两部分，在短短的四十七年里，他一共编写了二十几个剧本，办过四个刊物，创作了四部小说。他继承了阿里斯托芬、拉伯雷、塞万提斯、莫里哀和斯威夫特等人优良的讽刺传统，加以发扬光大，创造了无与伦比的讽刺文学，给十九世纪英国伟大现实主义小说家，如狄更斯、萨克雷以深刻的影响。\n\n一、小说创作\n\n菲尔丁是18世纪英国戏剧家和最杰出的小说家之一，也是英国小说得以定型的关键人物，他为欧洲小说的发展作出了里程碑式的贡献。其小说创作特点如下：\n\n（一）菲尔丁的小说突破了资产阶级家庭生活的范围，反映了英国社会生活中的许多重要现象，展现出一幅幅社会风俗图景。菲尔丁常常参加巡回法庭的审判工作，了解到很多社会底层的现实状况，并以之为素材创作发表了大量的杂文、书简和特写，抨击了社会黑暗现象。例如他的第一部小说《约瑟夫·安德鲁斯的经历》就借约瑟夫、范妮和亚当斯牧师的漫游经历反映了英国广阔的城乡生活。\n\n（二）菲尔丁的小说敢于反抗时代风气，对传统的道德、宗教、法律提出尖锐批评。例如在《约瑟夫·安德鲁斯的经历》中，监狱成了英国整个政治社会生活的象征，被他用来影射讽刺两党斗争和议会政治。与此同时，菲尔丁运用斯威夫特式的讽刺手法，揭露人性中虚妄伪装的面目和可笑的本质，以引起人们的“惊奇和快感”，从而达到教育、感化读者的目的。也\n\n正是因为菲尔丁刻意地颠倒黑白，用反讽手法塑造人物，所以给读者提供了主动思考、独立做出自己道德判断的机会和可能。菲尔丁的现实主义社会批判小说为19世纪英国批判现实主义小说奠定了基础，萨克雷、狄更斯等人的创作都深受其影响。\n\n（三）在小说艺术结构上，菲尔丁仍然采用了流浪汉小说的结构框架，但是进行了恰当的剪裁。他通过主人公的历险，结合人物性格和命运的发展突出主要事件，将五光十色的社会生活图景摄入作品，在社会环境中塑造人物，优化了结构，扩充了小说的表现内容。\n\n（四）菲尔丁是提出较为系统的现实主义小说理论的第一人。菲尔丁将小说定义为“散文滑稽史诗”，它既有史诗的特点-有情节、有人物，又是没有韵律的、含有幽默滑稽成分的散文体。用散文写史诗，用“滑稽”而不用“严肃”笔法，小说的故事情节可以轻松可笑，可以描写下层社会群众的生活，而作家的任务就是通过这些看似轻松可笑滑稽的故事暴露出人性的虚伪。\n\n二、戏剧创作\n\n（一）通过翻译、改编莫里哀的喜剧，菲尔丁更好地继承了莫里哀的讽刺艺术。他先写出了喜剧《悲剧的悲剧》，用以挖苦复辟时期的产物-夸大的“英雄戏剧”；随后又写了挖苦英国选举制度的《堂吉诃德在英国》。1736年，菲尔丁的著名政治讽刺剧《巴斯昆，时代的讽刺剧》上演。之后于1737年上演了《1736年历史年鉴》，戏分六出，两出是对戏剧男的讽刺，其余四出是对当时社会的邪恶与政治的辛辣讽刺。菲尔丁的社会和政治喜剧剧本毫不留情地揭露英国政府的贪污院败，谴责贵族阶级的道德沦丧，具有鲜明的讽刺性。\n\n（二）菲尔丁的剧本在艺术上广泛地吸收了民间戏剧的手法，继承了欧洲戏剧创作的传统，同时关注当时的社会生活，对英国戏剧的发展作出了贡献。在讨论重大政治问题时，考虑到观众的接受度，菲尔丁还在其中加入了诙谐怪诞的成分，由此创造出了“社会政治喜剧”。正是这种观众喜闻乐见的形式使得菲尔丁的讽刺戏剧深入人心，也使得当时的英国政府产生了极大的恐慌。\n\n总之，菲尔丁的戏剧和小说都对下层劳动人民的淳朴善良寄予了强烈的同情，并深刻揭露了上层统治阶级的贪婪自私、虚伪狂妄。在艺术上，菲尔丁主张创作要源于生活，同时也强调“模仿自然”与分析思考并重，这些观点在狄更斯、萨克雷以至马克·吐温的作品中都能找到影子。","keywords":"小说创作 社会生活 尖锐批评 流浪汉小说 现实主义 散文滑稽史诗 戏剧创作 讽刺艺术 民间戏剧 诙谐怪诞社会政治喜剧","note":"本题为2023年辽宁大学考研真题。菲尔丁是一位真正富有正义感和充满战斗精神的作家，是英国现实主义小说的奠基者，需要大家有所掌握。他提出的“散文滑稽史诗”“社会政治喜剧”等是常考的名词解释，大家要注意积累。"},{"id":"82","stars":"★★★","title":"《汤姆·琼斯》的艺术特色","body":"一、独特的全视角第三人称叙事方式\n\n作为一个启蒙主义者，菲尔丁从未忘记文学作品的教育功能。他用非韵文（散文）形式，夹叙夹议地展开故事。菲尔丁在《汤姆·琼斯》中采用全视角的第三人称叙事方式展开故事，但他这种第三人称叙事视角很特别，作者本人如“洞悉一切的上帝”，时不时出现在故事的解读中，如一位向导，始终指引着叙事过程，随着故事的展开赞美“真实的人性”，暴露“虚伪的人性”，创造具有真实人性的人物性格，以达到娱乐和教育的双重目的。\n\n二、讽刺幽默的现实主义创作手法\n\n菲尔丁的讽刺幽默手法是老到而富有新意的。他把正面人物也放在可笑境地，让正面人物置身于他不习惯的、不理解的世界里去，用旁人的眼睛去观察、评论现实生活，以一种新的眼光、不同的视角看出日常生活的有趣、新鲜、滑稽之处。\n\n菲尔丁为现代小说的发展作出了巨大的贡献，奠定了从当时到19世纪末一直支配着英国小说的全面反映当时社会的环实主义传统。菲尔丁在《汤姆·琼斯》各卷绪论中提出关于小说创作的意见，认为作家应该熟悉生活，深入生活，真实的艺术必须对社会发挥教育作用。他坚决反对离开生活的虚构，《汤姆·琼斯》中所写的伦敦生活、乡村、监狱等都是菲尔丁亲身经历或熟知的场景，这些场景被菲尔丁以讽刺幽默的手法刻画得生动而真实可信。\n\n三、人物刻画个性鲜明\n\n《汤姆·琼斯》中人物众多，共涉及49个人物，即使次要人物也被菲尔丁写得栩栩如生。而菲尔丁对一些主要人物的刻画是极其深刻的，他通过人物在社会关系、语言、行动和日常生活细节上所流露出来的思想感情去表现人物的性格。菲尔丁所塑造的人物个性鲜明，不重复雷同，无论在外表还是在性格特征上都具有独特性。\n\n四、通过对比手法，塑造“有缺点的好人”\n\n菲尔丁笔下刻画的都是“有缺点的好人”，他认为人非圣贤，无须完美，但求真实。在小说《汤姆·琼斯》中，汤姆不是个理想化的青年楷模，他性情急躁、冲动、鲁莽，经不起诱惑，在与女性相处方面不够检点。但是他天性善良，光明磊落，富有同情心，乐于助人，从不做损人利己、落井下石的事。汤姆不是完美道德的化身，但他生机勃勃，体现了自然、健康的人性。\n\n而布力非则与汤姆品质、性情截然相反，布力非外表看来笃信上帝，彬彬有礼，循规蹈矩，满口责任道德，实际上内心诡诈，自私贪婪，虔诚和美德只是他谋取私利的面具。布力非的卑鄙自私突出了汤姆的无私慷慨，贝拉斯顿夫人的堕落无耻反衬出苏菲亚的纯真无瑕。通过对比来反衬人物个性，使人物形象更为鲜明生动、深入人心，也是菲尔丁小说人物塑造的常用技巧。\n\n五、结构布局精巧\n\n《汤姆·琼斯》的结构艺术代表了当时长篇小说结构艺术的最高成就，主要表现在以下方面：\n\n（一）融合了西方叙事文学的传统。《汤姆·琼斯》一方面借鉴《小癞子》《堂吉诃德》等流浪汉小说的时间结构模式，另一方面又学习《巨人传》的空间转换形式，从而构成一种新的小说结构类型。小说保留了流浪汉小说以主人公生平传记构成小说基本情节的特征，抛弃了流浪汉小说情节凌乱的弊端，集中描写几个空间场景来串联故事情节。\n\n（二）结构精巧严谨，详略得当。《汤姆·琼斯》全书共18卷，按照故事发生的背景可以分为三大部分：第一卷到第六卷，以偏僻的外省为背景；第七卷到第十二卷，主要描写男女主人公从乡村到伦敦路上的经历；第十三卷到第十八卷，场面移到伦敦，以都市生活为背景。汤姆的青少年经历占全篇的三分之一，22岁后的生活占三分之二，这样既可以进行全局的鸟瞰，又可以进行重点描写。\n\n（三）情节线索多样，故事发展曲折。作家采用一种复杂的多重情节并行发展的结构来创作小说，琼斯的身世之谜随着情节发展终于大白于天下，而读者并不觉得这是为了结束故事而故意安排的，反而认为这揭示了一种命运的必然性-这深刻体现了菲尔丁的现实主义理念。\n\n全书大致有四条主线平行展开：弃儿汤姆的身世之谜，琼斯与苏菲娅从相爱到结合的各种波折，琼斯与布力非的对照，琼斯与其他女人厮混的经历。菲尔丁以琼斯的生平为经贯穿全文，又以他同苏菲娅的爱情以及布力非的行为为纬，牵带出各色人物以及相应的事件，使得小说的容量大大增加，故事情节紧凑而不纷乱，前后衔接，左右契合，由此，全书成为浑然一体的艺术整体。\n\n（四）小说每章之前均有序言，用以发表作者对各种问题的看法，各章节中还插入许多论说与旁白。作者在叙事过程中不断进行道德和社会批判，促使读者进行理性思考，起到了深化主题的作用。","keywords":"独特的全视角第三人称叙事方式 讽刺幽默的现实主义创作手法 人物刻画个性鲜明 对比手法“有缺点的好人”结构布局精巧","note":"《汤姆·琼斯》通过讲述汤姆·琼斯从童年到青年的成长故事和爱情经历，描绘了社会生活百态，规模宏大、人物众多，具有史诗般的气魄。在这部作品中，菲尔丁采用幽默、讽刺的手法，营造了机智、滑稽的喜剧氛围。他以独特的全视角第三人称叙事展开故事，刻画“真实的人性”，揭露“虚伪的人性”，赞扬劳动人民的纯朴善良，揭露上流社会的伪善和庸俗，抨击社会不公和政治腐败，希望通过人们的道德改善达到社会和谐。"},{"id":"83","stars":"★★★","title":"卢梭的创作特征","body":"一、“返回自然”的理想美\n\n卢梭在“返回自然”的思想指导下，讴歌大自然，把千姿百态的自然景色写进作品，大大开阔了人们的审美视野。无论是日内瓦湖和瓦莱山区，还是蒙莫朗西森林和布洛涅树林的优美景色，都得到了卢梭绘声绘色的描绘。卢梭笔下大自然的美是作为现实生活丑恶的对照出现的，因而具有理想美的特质。\n\n二、对人性作了深入挖掘，并做自我审视\n\n卢梭一生颠沛流离，命运坎坷，充满了戏剧性，经历了世态炎凉，体味了人性的黑暗与负面。他在晚年写下《忏悔录》，不是为自己一生的言行进行辩护，而是在坦白、展现和忏悔。\n\n三、充满激情，并进行富有逻辑的思考\n\n卢梭像一个辩证学家那样将自己的思想融进议论之中。在《社会契约论》中，他简洁而明晰地分析契约的性质，在《一个孤独漫步者的遐想》徐徐行进的章节中，他插入对谎言加以尖锐批驳的篇页。他带着战斗和摧毁对方的激情，进行笔战的\n\n表述。他像明晰的心理学家那样研究自己的心灵状态，经常作抒情的倾诉，当沉湎于遐想的时候，他就变成了一个真正的诗人。他的散文富有小说家的想象，而他的自传作品往往有小说的兴味。\n\n四、具有演说家的风格，以定义的方式有力地表达自己的思想\n\n卢梭文风激进，常以警句来表达，如：“老人的研究在于学会死。”表现出几何般精确的冷漠和不加修饰。如《论科学与艺术》中法布里西乌斯面对新罗马的混乱发出痛苦和羞愧的喊声：“疯狂的人，你们干了些什么？你们，民族的主宰，你们把自己变成了战败的浅薄者的奴隶。”\n\n五、文笔细腻准确\n\n卢梭的描绘朴实清新，如《忏悔录》中关于采摘樱桃和《一个孤独漫步者的遐想》中在布洛涅树林里遇到小姑娘的故事，文笔清新又富有诗意，如这样的句子：“但愿它能再生！但愿我能在这迷人的岛上了结我的余生！”“啊！但愿我满足了她的心，就像她满足我的心，我们在一起度过多么平静和多么美妙的日子！”","keywords":"返回自然 对人性作了深入挖掘 充满激情 演说家的风格 文笔细腻准确","note":"卢梭是启蒙主义思想家中最激进的一位，他文学创作的艺术特点，也体现出了卢梭的激进风格，比如充满激情，演说家的风格。同时，卢梭“返回自然”，讴歌大自然，文笔细腻准确的这些特征，也体现出了启蒙文学内容和艺术手法的多样性。"},{"id":"84","stars":"★★★","title":"为什么说《新爱洛依丝》是18世纪欧洲最重要的小说","body":"书信体小说《新爱洛依丝》是卢梭的代表作，是一部描写爱情悲剧的小说。这部小说描写了家庭教师圣普乐与贵族女学生朱丽的爱情悲剧。小说反映的是18世纪的生活，但是卢梭采用中世纪爱情悲剧的女主角爱洛依丝的名字来为其命名，突出了小说反封建反专制的时代主题。这部小说的重要性，主要表现在以下方面：\n\n一、对爱情热烈讴歌\n\n在《新爱洛依丝》中，卢梭贯注了自己的感情的描写深深地感染了读者，并将爱情和道德准则调和起来。在古典主义时期，爱情受到无情的道德责难。在《新爱洛依丝》中，爱情虽然是被禁止的，但它的火焰并未熄灭。卢梭甚至暗示激情和道德之间存在不可分割的联系：两者都是敏感的形式。唯独有激情的人才能真正看重道德。\n\n二、表现了作者的民主主义思想，深化了对封建社会的揭露与批判\n\n卢梭是启蒙思想家中最富有民主精神的一位思想家和文学家，其民主主义思想的表达，拓展了小说的社会容量，也加深了小说的批判力度，加强了这部作品在启蒙文学中的代表性。\n\n《新爱洛依丝》通过描写主人公追求合乎人性的爱情而经受的折磨与痛苦，揭露了“社会道德”对自然人性的扼杀，挞伐了非人道的封建观念。\n\n卢梭从社会、政治、经济等角度去丰富小说的内容，使小说中的爱情描写获得了赖以存在的社会背景，从而更深刻地揭露了封建意识的根深蒂固和它对人们精神的危害。\n\n三、描写并赞颂了大自然的神奇与美丽\n\n小说中，卢梭描绘了日内瓦湖的美丽风景与乡村生活场景，并将其与腐败堕落的都市生活对立起来，展现了大自然和宁静的乡村生活对人们身心的积极影响，对丑恶的现实生活作出了否定。\n\n四、开启了19世纪浪漫主义文学的先河\n\n《新爱洛伊丝》在描写的内容和方法上，突破了18世纪启蒙主义文学哲理小说的局限。它以激烈的感情、美丽的大自然作为描写对象，以饱含情感的笔墨，情景交融的手法，将这激烈的感情和美丽的大自然再现于读者眼前，既反映了人与自然的和谐关系，也增加了作品的艺术感染力，在文学性上超越了18世纪的启蒙文学，并以其创新性的贡献预示了下一个文学时代的到来。\n\n总之，《新爱洛伊丝》是一部爱情悲剧小说，但它超越了对爱情的描写，表现了要求人性解放、个性自由的强烈愿望，谴责了封建等级制度和门第观念，体现了作者激进的民主主义思想。这也是一部承上启下的作品，反映了18世纪启蒙文学要求自由的呼声，批判了封建专制制度和社会习气，并在内容和风格上率先表现出了19世纪浪漫主义文学的特征。","keywords":"书信体小说 爱情悲剧 反封建 民主主义 大自然的神奇与美丽 浪漫主义文学 承上启下","note":"《新爱洛伊丝》不仅是一部爱情小说，还是一部哲理小说，其中包含了卢梭的重要思想，无论是教育观点、文艺观点、农村经济、社会平等的思想、宗教观点，还是园艺、决斗、自杀，小说都有多触及。在艺术上，这部作品主要用五个** --- 朋友相互间的通信这一单纯的手法构成，卢梭曾指出《新爱洛伊丝》艺术上的突出特点是“题材的简单和中心思想的连贯”。24年中南民族大学对此进行了考查，需要大家有所掌握。"},{"id":"85","stars":"★★★","title":"以《忏悔录》为例，剖析自传性作品的表述策略及自传作家的人格面具","body":"卢梭撰写《忏悔录》具有现实目的，即回击伏尔泰等人对其人格的攻击，为自己进行道德辩护。多年来，《忏悔录》被视为一部自传性作品的代表作。自传性作品有其独特的表述策略，这里我们以《忏悔录》为例，进行分析，主要包括如下内容：\n\n一、“真诚”是其采用的首要表述策略\n\n卢梭曾经攻击蒙田在写作《随笔集》时不够真诚。在《忏悔录》中，卢梭对自己忏悔时的真诚非常自负，认为忏悔可以证明自己的真诚。可见，通过真诚，传主可以与读者建立亲密的关系，获得读者的信任，为即将开始的辩护打下值得信赖的基石。\n\n二、叙述自己的隐私或“可爱”的缺点\n\n为了获得“真实”的效果。卢梭在《忏悔录》中坦白地回忆了自己的生活经历，揭开了自己的人格面具，极其真实地袒露自己，如懒惰、撒谎、偷盗、嫖妓。\n\n三、潜移默化的表述方式\n\n自传性作品通过揭示内心的不安，既达到真实的目的，又潜移默化地为自己的过错进行道德辩护。在《忏悔录》中，卢梭提到了年轻时的偷窃和撒谎。他偷了女主人扎头发的丝带，被发现后反而诬赖是女仆玛丽永送给他的，为此在四十多年里饱受良心折磨。\n\n四、自传性作品的“真实”仍然不能完全等同于真实\n\n无论作者自我的心理结构，还是文化环境的规定，都决定了自传性作品不可能完全真实。作者往往为了达到某种目的而对过去进行了选择与修改，并且冠以真实的名义为自己进行道德辩护，以期获得他人的理解和同情。此外，自传性作品像文学作品一样，具有公开性，这也决定了作者不可能将内心的隐秘进行完全暴露。所以，在《忏悔录》中，卢梭隐瞒了自己将五个孩子送进育婴堂而一直不管不问的事实，而多次提到自己为年轻时撒谎承受的良心煎熬。\n\n总之，自传性作品的作者有选择地讲述过去的某些事情，并将之故事化或理想化，以期符合他关于“自我”的定义和概念，达到对社会许可的人格面具进行修正之目的，或达到以真实的名义为内心的自我寻找道德保护的目的。","keywords":"“真诚”“可爱”的缺点 潜移默化的表述方式 真实性思辨","note":"通过在自传中对个体意识的觉醒以公民身份的大胆言说以及在忏悔中的自我解释，卢梭在《忏悔录》中表现出了一个现代的自我，同时为自传写作树立了经典的内涵与范式，其文体文风影响了很多人，因此需要大家有所了解。"},{"id":"86","stars":"★★★★","title":"卢梭对浪漫主义的影响","body":"卢梭的社会政治思想体现了启蒙运动激进民主派的倾向，其文学创作是浪漫主义文学的先声，因此他被称为“浪漫主义之父”。卢梭的思想和文学创作对文学发展作出了重要贡献，其思想对19世纪的浪漫主义作家和诗人产生了积极影响，其创作开启了浪漫主义文学的先河，具有示范意义，这主要表现在以下方面：\n\n一、拓展了审美视野，扩大了文学的表现范围\n\n卢梭提出了“返回自然”的号召，并将大自然作为审美观照的对象予以再现，描写并讴歌大自然的神奇与美丽，拓展了审美视野，扩大了文学的表现范围。\n\n卢梭返回自然的主张，影响着许多浪漫派作家，法国浪漫派的倡导者斯达尔夫人效法卢梭，将自然、先天的美德当作自己的信仰，通过著书极力宣传卢梭的主张。法国后期浪漫派作家乔治·桑自称是卢梭的学生，她根据卢梭“只有在庄稼人的粗布衣服下面，而不是在宠臣的绣金衣服下面，才能发现有力的身躯”的思想，在自己作品中着力描写了心地质朴的农民及其恬静愉快的田园生活。\n\n卢梭不仅描写了大自然，而且将人的感想赋予自然。他的返回自然、描写自然正是反映了新兴资产阶级的愿望。许多进步作家接受了卢梭返回自然、描写自然的主张，有力地表达了民主主义的激情，开拓了艺术世界的新天地。\n\n二、注重对感情的表现，对人性进行了深入挖掘\n\n（一）崇尚感情。卢梭的作品被称为“抒情长诗”，以浓郁的感情色彩见长，文笔细腻准确，将对自然景物的描写与\n\n人物感情的抒发结合在一起，情景交融，感人至深。《新爱洛依丝》颂扬了人的真实感情，尤其是男女之间充满激情的爱情描绘了日内瓦湖区美丽的自然风光和宁静的乡村生活，展现了人与自然和谐相处的美好境界。《忏悔录》抒发了主人公“我”内心的喜怒哀乐，感情的起伏如潮水涨落，朗读起来仿佛有着和谐的音节。卢梭称它是一本最讲感情的传奇小说。\n\n（二）强调自我。卢梭思想感情的核心是强调自我、提倡个性解放。卢梭的自传体小说《忏悔录》剖析了作者自我的灵魂，开启了文学艺术坦诚描写自我的先河，主人公敏感的性格，对大自然的感情，甚至无名的优郁，都成为后来浪漫主义文学中主人公的共同特征。\n\n卢梭崇尚感情，强调自我，塑造了富有个性的人物，冲破了17世纪以来欧洲文坛上沉闷的局面，推动了许多人物自述和日记书信体裁的抒发感情的作品的出现。\n\n法国作家、卢梭的得意门生贝尔纳丹的代表作《保尔和薇吉妮》同《新爱洛依丝》极为相似。法国浪漫主义倡导者夏多布里昂受卢梭的影响更大。卢梭富有感情的种子，移植到德国，就出现了歌德的《少年维特之烦恼》。英国浪漫主义诗人拜伦在《恰尔德·哈洛尔德游记》中称赞卢梭的作品有激情，能使人流下同情的眼泪。\n\n三、“社会契约论”的理论支持\n\n卢梭提出“社会契约论”，主张社会权力的合法性来源于人民的共同意志。这一思想为浪漫主义强调个人自由、反对机械化的社会体制提供了理论支持。浪漫主义者们由此强调每个人都有权利追求自己的幸福和真实情感，反对任何形式的集体生活和社会机械性。\n\n总之，卢梭对大自然的重新认识，对文学描写对象的拓展，以及对新的表现方法的创新性尝试，都对19世纪浪漫主义作家和诗人的思想与创作产生了积极影响，他的创作奠定了浪漫主义文学发展的文学基础，可以说，浪漫主义作家和诗人正是在卢梭开创的道路上前进的。","keywords":"拓展了审美视野 返回自然 崇尚感情 强调自我 社会契约论","note":"浪漫主义是文学上的自由主义，反对专制制度是浪漫主义文学的政治诉求，也是其文学创作的动力。卢梭“返回自然”的思想无疑推动了浪漫主义对专制制度的反叛，而且还提供了具体的参照对象，即大自然。所以，浪漫主义文学不仅继承了卢梭对封建专制的批判精神，而且还受到了其对大自然所赋予的新价值的影响，赞美人性的自由发展，表达人与自然和谐、精神相通的主题。此外，卢梭对中国现代浪漫主义思潮亦有影响，具体内容可在李凡文学正版群中查看。"},{"id":"87","stars":"★★★★","title":"为什么歌德说：“伏尔泰结束了一个时代，而卢梭则开创了一个时代。”","body":"伏尔泰和卢梭都是18世纪启蒙运动中杰出的倡导者和实践者，但是二者思想的具体内容和倾向却存在差异，歌德的评价，就是对此的概括。\n\n一、从思想上来说，伏尔泰首先向封建神学发起了冲击，而卢梭则提出了更加激进的民主共和政体的理想。\n\n（一）伏尔泰是法国启蒙运动的领袖人物和导师，伏尔泰在政治上主张君主立宪制，在哲学上信奉经验论，在宗教上是一名自然神论者。他较早地接受唯物主义思想，承认物质的客观性，而摒弃传统的唯心主义哲学，他认为宗教是人类理性的大敌，希望建立一种以人类文明为中心的世界体系。\n\n伏尔泰认为“人们本质上是平等的”，要求人人享有“自然权利”。他主张法律面前人人平等，但又认为财产权利的不平等是不可避免的。他把英国的君主立宪制理想化了，认为最理想的是由“开明”的君主按哲学家的意见来治理国家。在启蒙运动中，他反映了上层资产阶级的利益，主张开明君主制。\n\n伏尔泰在反封建的启蒙运动中做出的巨大的贡献，结束了人们对宗教的一味信奉，所以说他结束了一个旧时代。\n\n（二）卢梭在启蒙运动中期开始参与启蒙活动，在社会观上，他提出了“天赋人权”的观念，主张建立“契约”制社会，缔造民主共和的政治制度。卢梭的思想直接成为了1789年法国大革命的政治宪章。\n\n在教育上，卢梭主张教育目的在于培养自然人；反对封建教育戕害、轻视儿童，要求提高儿童在教育中的地位，这反映了资产阶级和广大劳动人民希望从封建专制主义下解放出来的要求。\n\n但在宗教上，卢梭仍极力为宗教的合理性辩护。\n\n在自然观和对儿童的教育上，卢梭比伏尔泰走得更远，在某种程度上开辟了西方历史发展的一个新时代。\n\n所以，从两人各自的思想来看，伏尔泰揭起的是反封建反神学的大旗，终结的是一个腐朽反动的封建王朝和神学统治的时代，而卢梭则裹挟着更为广大的中小资产阶级的政治愿望登上启蒙的历史舞台，他开启的是一个资产阶级政治革命的时代。\n\n二、从文学创作上来看，伏尔泰的创作更多地反映了启蒙文学与古典主义文学之间的替代关系，而卢梭的创作则预示了\n\n19世纪浪漫主义文学的到来。\n\n（一）伏尔泰的文学创作涉及诗歌、戏剧和小说等各方面，其史诗和戏剧在内容上宣传了启蒙思想，在形式上虽然也借鉴了莎士比亚戏剧的优点，但更多的是受到了古典主义戏剧家高乃依和拉辛的影响。\n\n伏尔泰在文学上的突出成就反映在他的哲理小说中，这种小说不仅宣传了他的启蒙思想，更重要的是在形式上进行了创新。所以从整体上看，他的创作呈现了文学思潮交替时期的复杂情况，反映了他本人在探索与启蒙思想相一致的文学表达形式方面的努力与发展。\n\n（二）卢梭是浪漫主义文学的先驱。与伏尔泰相同的是，卢梭也通过文学作品反映了其追求自由民主的思想与情怀。但不同的是，他不仅没有表现出与古典主义文学的承接关系，而且还超越了同时代启蒙文学家创作的颇具理性色彩的哲理小说，在描写对象和方法上进行大胆创新，提出了“返回自然”的浪漫主义文学主张，从而在文学精神上呈现了与下一个新时代的联系。\n\n法国作家斯丹达尔，早期是浪漫主义者，他说过：“最近我们的人民完全发现了自然的美，这种美伏尔泰还不知道，是卢梭使它风行一时的。”许多进步作家接受卢梭返回自然、描写自然的主张，有力地表达了民主主义的激情，开拓了艺术世界的新天地。卢梭崇尚感情，强调自我，塑造了许多富有个性的人物，冲破了17世纪以来欧洲文坛上沉闷的局面，推动了许多人物自述和日记书信体裁的抒发感情的作品的出现。\n\n因此在文学方面，可以说卢梭开启了浪漫主义新时代。\n\n总之，伏尔泰和卢梭，这两位法国启蒙运动的领袖和斗士，其各自的思想和创作表现出了法国启蒙运动及其思想内部和文学成就的复杂性与丰富性，也展示了它们之间的内在联系与发展变化。","keywords":"思想 向封建神学发起冲击 提出民主共和政体 文学创作 启蒙文学与古典主义文学 浪漫主义文学","note":"之所以说“伏尔泰结束了一个时代，而卢梭则开创了一个时代”，主要是因为伏尔泰的思想政治主张和文学创作是对前一个时代的终结，而卢梭的思想政治主张和文学创作预示了一个崭新时代的到来。大家可以分别从思想和文学两方面进行分析。"},{"id":"88","stars":"★★★","title":"如何理解少年维特的烦恼","body":"歌德青年时期创作的作品《少年维特之烦恼》，通过描写市民阶层青年维特爱情和事业的失意，反映了一代青年在平庸、鄙俗的现实下产生的苦闷的时代情绪。维特的烦恼是多方面的。\n\n一、维特的烦恼集中表现在爱情上\n\n维特与周围环境格格不入，又无力改变这一切，这促使他专注个人情感体验，试图在爱情的小天地里寻求慰藉。他爱上绿蒂，全身心投入，明明知道对方已经订婚，仍然一往情深。在他眼里，绿蒂是一个善良贤惠的姑娘，体现了自然人性的光辉。她的勤劳，她待人的温情，她对弟弟妹妹的悉心照料都让维特感动不已。然而横亘在他和绿蒂之间的是封建的婚姻制度和传统的社会习俗，以及金钱和门第的差距，绿蒂难以违抗父母之命，维特也生性柔弱，不敢向心中恋人倾诉衷肠。\n\n二、维特因为事业的挫折而烦恼\n\n失去爱情的维特希望通过事业排遣痛苦，他投身工作，当上公使秘书，但官场等级森严，低下的社会地位使他屡受侮辱，贵族们的冷遇和白眼更加深了他的烦恼，于是他愤而辞职，回到绿蒂身边，回到爱情的小世界，继续体验着爱情的痛苦而无法自拔。爱情无望，事业上又走投无路，维特感觉不到任何的人生价值，最后选择了自杀。\n\n三、维特因为自我与社会的冲突而烦恼\n\n维特与恶俗的社会格格不入，但缺乏具体的斗争目标和勇气。青年维特富有才能和学识，拥有高傲的人格与独立的见解，与当时平庸鄙俗的现实冲突尖锐。但是，他总是在冲突中选择逃避，以孤傲来对抗丑恶的社会，自然难以摆脱苦闷郁悒的折磨，这也决定了其烦恼的不可避免性。\n\n从根本上说，维特是一个消极反抗者的形象，他缺乏积极的行动能力。他看到了社会黑暗并且表示不满，但他是狭隘的，看不到人生意义来源于积极的反抗、争取和开拓；他渴望爱情，但又从未向绿蒂敞开心扉。他有一颗敏感的心，但总是感伤有余，激情不足，希望社会改变而又不首先改变自己，因此黑格尔说他是“幽美的灵魂”。\n\n四、维特的悲剧有着深刻的时代和社会意义\n\n歌德通过维特的生活道路，通过对维特心理活动的深入描绘，揭露批判了现实生活中种种不合理的现象，表明正是落后的社会制度和风俗扼杀了维特年轻的生命。\n\n维特的性格也反映了那个时代年轻一代成长中的痛苦和烦恼，他们追求自由平等，渴望情感解放，要求挣脱封建桎梏，\n\n但又由于自身的软弱狭隘，缺乏坚强意志，找不到正确的人生方向，无力改变现实，因而痛苦绝望。\n\n总之，维特的烦恼是多方面的，但其根源却是社会造成的。他反抗的不彻底性，反映了觉醒的德国进步青年的时代局限他与社会在爱情和事业上展开的交锋，是以失败而告终的，虽然最后维特以死抗争，但这客观上仍然展现了社会恶势力的强大，反映了年轻人苦闷绝望的时代情绪。他的悲剧，是时代的悲剧；他的烦恼，体现的是一个时代的觉醒者跟平庸鄙俗的社会环境的冲突。","keywords":"爱情 事业 自我与社会的冲突 时代和社会意义","note":"维特的烦恼，从表面上看，是爱情的烦恼，事业的烦恼，但实质上，维特的烦恼是自我与社会冲突的烦恼，其源在于当时的社会。歌德通过这一形象，揭露和批判了当时的社会，反映了觉醒的德国进步青年的时代局限。"},{"id":"89","stars":"★★★","title":"《浮士德》的创新体现在哪些方面（《浮士德》的思想价值）","body":"一、《浮士德》形象地展示了新的世界观和思想体系\n\n《浮士德》题材来源于德国民间传说，但歌德对原有的题材进行了巨大的改造。他在作品的开头加上了“天上序幕”-场。这是歌德的首创，蕴含着歌德对世界的基本看法：天帝代表了宇宙中的“至善”，而与天帝相对立的“魔鬼”，则是“至恶”的化身。二者相生相克、相辅相成。\n\n这样，天帝与魔鬼，亦即善与恶之间的矛盾和斗争，就构成了宇宙间最基本的矛盾关系。而代表人类的浮士德，则是天帝与魔鬼用来赌赛的人物，是善恶之争的对象。\n\n正是这三个形象的独特关系，构成了《浮士德》全剧最基本的精神结构形式：善恶冲突作用于人类，人类则在善与恶的规定下行动，以决定自己的归宿。但人类自身究竟会怎么样呢？通过魔鬼与浮士德的第二次赌赛，全剧的情节从天上转入人间，浮士德也在与魔鬼打赌后开始了自己探索真理的过程。\n\n二、《浮士德》也展示了作者对人类命运的新思考\n\n人的身上充满着矛盾，作为人类代表的浮士德本身就是一个矛盾体。他自己就说过：“有两种精神盘踞在心中，这一个想和那一个离分。一个沉溺在强烈的爱欲当中，以固执的官能贴紧尘世；另一个则强要脱离尘世，向崇高的灵的境界飞升。这种“灵”与“肉”的冲突其实就是“天上序幕”中天帝与魔鬼的冲突在具体事物上的反映。而这种性格的二重性使他既易受魔鬼的诱惑，也能从种种的诱惑之中超升出来，克服自己身上恶的因素，战胜诱惑。也可以说，正是他性格中的这种内在矛盾的相互作用和辩证发展，推动他不断前进。\n\n三、歌德的《浮士德》把对辩证法的理解提升到了一个新的高度\n\n在启蒙运动之前，欧洲人的思维方式基本上是“二元论”的，体现为或天国与地狱的对立，或善与恶的对立。而经过启蒙运动的洗礼，人们的思维方式发生了重大的变化。《浮士德》就强调了“恶”在社会历史发展过程中的作用。在浮士德的发展中，没有反面力量（恶）的出现与推动，那么正面力量（善）也就始终处于静止或概念上的封闭状态，得不到进一步的展开。正是由于靡非斯特的参与，浮士德才能经历五个阶段的上下求索历程。靡非斯特的存在不但没有使浮士德堕落，反而使浮士德不断趋向崇高与完善。其灵魂最终为上帝所救，这一象征性的胜利不是突然的宗教奇迹式的胜利，也不是简单的善对恶的胜利，而是辩证法的胜利。\n\n四、对人类知识体系的深度思考\n\n《浮士德》作品涵盖了广泛的文化知识，包括哲学、艺术、宗教和科学等领域。反映了作者对人类智慧的追寻和对文化的渴望，呈现了歌德对知识与经验的深刻思考。\n\n在寻求知识和满足欲望的过程中，不断面临自由与命运之间的冲突。这引发了有关个人选择、责任和宿命等重大哲学问题的讨论。","keywords":"新的世界观和思想体系 人类命运新思考 辩证法 知识体系","note":"23年暨南大学、24年华中师范大学和东北师范大学都对浮士德的思想价值进行了考查，这是需要大家重点掌握的一个知识点。《浮士德》的创新性，其实就是歌德对原有题材的改造，这种改造和当时社会的政治、思想等方面的变动息息相关，大家可以联系时代背景进行掌握。"},{"id":"90","stars":"★★★★★","title":"《浮士德》的艺术特色","body":"一、形象性与哲理性的高度统一\n\n歌德在《浮士德》中大量使用了典故与象征的表现手法，这使歌德笔下《浮士德》的世界和人物，既是形象化的，又是富于哲理的。例如浮士德的苦闷、热恋、享受、追求等，无不具有现实生活中常人的情感特征。而学者书斋、下层酒寮、皇帝宫廷等场景，也富有鲜明具体的形象性。\n\n不过，也由于作者大量运用典故和象征手法，《浮士德》内容变得庞杂艰深，晦涩难懂，尤其是在第二部中，浮士德形象变得抽象化、概念化，更不易为广大群众所接受。\n\n二、现实主义与浪漫主义的完美结合，表现主观精神与反映客观现实的有机结合\n\n《浮士德》诗剧的整体构架是充满浪漫幻想的，而对许多情节与细节的描绘却是真实的；浮士德形象及其经历是虚构的，但他活动的背景却是从现实生活中提炼的。\n\n《浮士德》本来就是一部精神发展史，是诗人主观感受的产物，但歌德却将自己独特的生活体验和精神感受融汇到了大的时代背景之中，从“小我”的个人感受出发，运用古老的故事，通过象征性的情节和表现方式，展示了时代的“大我”，从而反映了文艺复兴300多年来，欧洲尤其是西欧新兴资产阶级精神发展的实践。例如浮士德对德国死气沉沉的思想统治感到窒息的时候，人们不能不联想到中世纪封建神学思想对鲜活人性的禁锢；当看到浮士德主张依靠所谓“开明君主”来发展资本主义事业的时候，不能不想到歌德在魏玛公国屈从于小封建主号令的行为的荒唐可笑。\n\n三、艺术的传统性与现代性密切结合\n\n歌德在《浮士德》中对传统的艺术方法内涵（即遵从生活本身的逻辑和作家主观情感的逻辑）的继承，已达到了出神入化的程度。但同时，《浮士德》在艺术表现上又体现着明显的现代性，这主要表现在以下方面：\n\n（一）时空颠倒、混淆。作为一个生活在18世纪末、19世纪初的伟大诗人，歌德的美学思想基本上是主张现实主义的。但被20世纪现代主义作家所广泛使用的时空颠倒、场景混淆的表现手法，在《浮士德》中已显露端倪。作品中所出现的浮士德与靡非斯特的赌赛、浮士德喝魔汤变得年轻、浮士德穿过岁月回到几千年前的古希腊去寻找美女海伦等情节，显示出了作者对时空顺序的有意颠倒与混淆。\n\n（二）形象的分身与变形。为了表现主观的内心冲突，20世纪的现代主义作家常在其创作中采用分身手法，将一个人剖为两个甚至几个人，以表现同一意识的不同侧面。不仅如此，为了表现作家的某种主观情绪，他们也常将笔下的人物变形，以适应其思想情绪的变化，在《浮士德》中，天帝和浮士德，都是歌德观念中“善”的载体，但天帝是“至善”，而浮士德则是“善”的具体化形式。歌德在这里采用的正是形象的分身法。至于靡非斯特由恶魔变成人，乃至变成狗；浮士德忽而为老年学士，忽而为壮硕的中年探索者，忽而又为白发苍苍的老人，也可见变形手法的运用。但需要指出的是，歌德对上述手法的运用，与现代主义作家主张以此来表现人物的潜意识的根本区别在于，歌德借此表现的是人的观念的辩证发展过程。\n\n四、矛盾对比原则\n\n《浮士德》是按照矛盾对比的原则来配置人物关系并设置场面的。譬如整部诗剧以浮士德为中心，依据他性格不同侧面的对比关系，来配置相应的人物形象，其他的人物如靡非斯特、玛甘泪、瓦格纳、海伦等，都与他形成对比。全诗的构思中，光明与黑暗，崇高与卑劣，和谐与混乱等常常是交替出现的。阴暗的书斋与明丽的城郊，宁静的玛甘泪闺房与狂乱的瓦普几斯之夜，魔怪逞威、浑浑噩赢的神话世界与庄严清明的古代希腊等都形成矛盾对比、互相映衬的关系。\n\n五、诗歌形式多样\n\n为了适应《浮士德》丰富多彩、变化万千的内容，歌德还采用了多种多样的诗歌形式，以便更好地描写环境，烘托气氛，塑造形象。如诗剧的开头用自由韵体，玛甘泪口中又唱出一曲曲纯朴的民歌，海伦部分则运用古希腊悲剧的诗体。当时欧洲的各种诗体都在《浮士德》中出现，诗中的语言风格也变化多端，有颂扬，有嘲讽，有诙谐，有庄严，有明喻，有影射，显示了歌德高超的艺术才能。","keywords":"形象性与哲理性的高度统一 主观精神与反映客观现实的有机结合 艺术的传统性与现代性密切结合 时空颠倒、混淆 形象的分身与变形 矛盾对比原则 诗歌形式多样","note":"《浮士德》构思宏伟，内容复杂，结构庞大，风格多变，熔现实主义与浪漫主义于一炉，将真实的描写与奔放的想象、当代的生活与古代的神话传说杂糅一处，善于运用矛盾对比之法安排场面、配置人物、时庄时谐、有讽有颂、形式多样、色彩斑驳，达到了极高的艺术境界。这部分内容十分重要，需要大家仔细记忆。"},{"id":"91","stars":"★★★★★","title":"浮士德人物形象分析","body":"浮士德既是带有作者精神自传特征的人物形象，也是资本主义上升时期资产阶级的典型，还是整个人类的代表。\n\n一、歌德本人的自我写照\n\n浮士德形象融汇了歌德本人一生的生活经历与思想体验，是“歌德的一部精神自传”，譬如浮士德对爱情与政治生活的追求，映射出歌德青年时代的爱情生活及其后来在魏玛宫廷任枢密院顾问时的政治生活的影像。浮士德人生追求的5个阶段与诗人思想性格发展变化的过程也非常吻合。\n\n二、近代资产阶级知识分子的典型\n\n经过歌德的丰富与改造，诗剧中的浮士德成了一个近代资产阶级知识分子的典型，他通过五个阶段的人生追求，充分展示了现代文化精神。\n\n（一）坚持不懈、永不满足的追求精神\n\n浮士德出场时，已开始厌倦了书斋里追求知识的生活，渴望付诸行动。在靡非斯特的帮助下，浮士德返老还童，并疯狂地追求爱情。在经历了与玛甘泪的爱情悲剧之后，浮士德走出个人生活小天地，来到社会大世界，试图施展自己的政治抱负。但由于现实政治的腐败，浮士德很难有所作为，所以他把追求的目标投向古典美的艺术，渴望通过希腊艺术来消解现实的丑恶。当海伦随着欧福良的天折而遁逝后，浮士德又开始了对创造性事业的追求，希望通过填海造田来建设一个理想王国。\n\n（二）自觉的批判精神\n\n浮士德一方面对周围世界总是持有激烈的批判态度，能够敏锐地察觉到现实生活的丑陋，另一方面他也在不断地进行自我批判，自觉地审察自身的局限性。他人生追求的视野因此而不断地得到开拓，他也不断地超越了自我。\n\n（三）人道主义精神\n\n最初浮士德或许只是感到个性的压抑和生活的灰暗，渴望一种更人性化的生活，随着人生追求的展开和批判的深入，代的思想境界不断提升，其人道主义思想也升华成一种自觉的精神和宽广的情怀，最后他所追求的创造性事业已经完全超越了自我，是要“为几百万人开拓疆土”，他的理想就是要看到每个人“在自由的土地上跟自由的人民结邻”，“自由”概念成为浮士德人道主义精神的真正内核。\n\n但与此同时，浮士德也反映了资产阶级特有的局限性。在探索的过程中，浮士德只是满足于个人的探索，对真理的追求也只局限于思想领域，一旦面临现实困境，他就选择逃避而不是反抗，其最后的理性王国也是建立在掠夺和占有的基础上，这些客观上反映了资产阶级的局限性和阶级本质。\n\n三、人类的代表\n\n浮士德是人类的代表，概括了人类积极进取的精神，反映了人性的双重性，他的探索“囊括着人类的全部历史”。虽然浮士德历经挫折，但他积极探索，表现出一种向善的精神。同时，浮士德身上也体现了人性的双重性，存在着善与恶、灵与肉的冲突。一方面，他不满足于既有的生活，另一方面他也时常沉迷于名利、地位和权势之中，虽然最后摆脱了现实诱惑和个人欲求的束缚，但是他抵达理想世界的曲折过程本身就说明了其人性内在冲突的存在。\n\n浮士德身上的这种“灵”与“肉”的矛盾，“善”与“恶”的斗争，展示了人类自身的复杂性和真实性，体现了歌德的唯物主义辩证法思想，也反映了人类探求真理的艰巨性以及歌德对人类终将走向至善的坚定信念。","keywords":"自我写照 近代资产阶级知识分子的典型 坚持不懈、永不满足的追求精神 自觉的批判精神 深刻的人道主义精神 资产阶级特有的局限性 人类的代表","note":"24年曲阜师范大学和西安外国语大学都对浮士德形象进行了考查，需要大家有所掌握。浮士德的形象体现着歌德本人的生活经历和思想体验，也是当时资产阶级知识分子的典型，反映了当时资产阶级的进取精神和局限性。同时，歌德所创作的浮士德身上充满着矛盾。但总的来说，浮士德的优秀品质掩盖住了他的人性弱点，这也是《浮士德》能够经久不衰的文学魅力所在。"},{"id":"92","stars":"★★★★","title":"为什么说靡非斯特是作恶造善的力之一","body":"靡非斯特是《浮士德》中一个重要的人物形象，其脱胎于欧洲的历史传说，但已不是传统的反面人物。在诗剧中，这一形象超越了传统的魔鬼原型，而表达了新的内涵。\n\n一、靡非斯特作为浮士德形象的对立面而存在，是恶的代表\n\n靡非斯特是虚无主义、悲观主义、颓废主义的代表，是欲望的化身。他体现了恶的本性，其首要性格特征是蔑视人类，不相信人的理性，否定人的努力，与人类为敌。其次是否定社会进步，对现实中神圣和崇高的事物一概予以鄙视嘲讽。再次他没有任何道德观念和是非标准，一再向浮士德灌输及时行乐的庸俗思想，他不断引诱浮士德堕落，毁灭了善和美，可以说靡非斯特就是恶的集合体。靡菲斯特这个形象反映了文艺复兴以来伴随资本主义而生的不择手段以获取财富与权势的野心家、\n\n冒险家特性，体现了新兴资产阶级极端利己主义者贪婪、冷酷的精神特征。\n\n二、靡非斯特是激发浮士德不断进取的动力\n\n恶并不是一无是处，它可以从反面推动事物的发展，人类也正是在战胜恶的过程中趋于完善。正是因为靡非斯特的引诱，浮士德才得以走出书斋，走向更为广阔的社会，踏上了不断探索的人生之路。靡非斯特阻碍浮士德实现自己的人生梦想，客观上却使浮士德从错误中摸索到正途，从而不断推动浮士德前进，促成浮士德在生活实践中转向善。所以，靡非斯特客观上推动着浮士德向善的发展，成了浮士德前进路上不可或缺的动力与条件。\n\n三、靡非斯特自身有善的一面\n\n靡非斯特诙谐、机智、灵巧、神通广大，而且目光敏锐，洞悉社会罪恶，熟谙处世之术，精通实际生活的知识。他时常冷嘲热讽、嬉笑怒骂，攻击现实中的某些落后与丑恶，正如作家所指出的，“他是广阔人生经验的生动的结果”。\n\n总之，在歌德看来，善与恶并不是绝对对立，而是可以相互转化的，是一个统一的整体。恶的作用不全是破坏，它还可以造善。人类在与恶的较量中，不断取得进步，从而走向至善的理想境界。从这一方面说，靡非斯特是作恶造善的力之一。对靡非斯特积极作用的认识，反映了歌德的唯物辩证主义思想，以及他对人类探索真理道路的美好未来的信念。","keywords":"恶的代表 善的一面 唯物辩证主义思想","note":"这一题其实主要是分析靡非斯特的人物形象。浮士德和靡菲斯特两个人物形象在诗剧中是一种辩证的关系，因此这两个角色的形象特征要结合起来记忆。2023年陕西师范大学考研真题中就出现一道相关题目：“根据浮士德形象的变迁来论述浮士德和靡菲斯特的辩证关系，并论述这个形象的创新性”，大家可以结合浮士德形象的意义与局限性进行作答。在对待宗教神学和封建制度方面，浮士德和靡菲斯特都具有强烈的批判精神，而在兼井土地和扩大资本原始积累方面，浮士德的贪婪也不亚于靡菲斯特，所以，两者的思想和性格实际上反映了新兴资产阶级精神特征的两个方面，而这两个方面对于新兴资产阶级来说是不可分割的。"},{"id":"93","stars":"★★★★★","title":"试论浮士德一生几个阶段的追求及不同阶段所展现出的悲剧意义","body":"《浮士德》描写了主人公浮士德一生不断奋斗的五个阶段的悲剧。\n\n一、浮士德第一个人生阶段为追求书本知识阶段，展现的是知识悲剧\n\n首次出场的浮士德是位年过半百的学者，虽博览群书，但到头来却发现这些书本知识毫无用处，他为此甚至想结束自己的生命。他在魔鬼的化身靡非斯特的帮助下，走出书斋，开始了新的生活。浮士德的这段生活史否定了陈腐的书本知识和死气沉沉的书斋生活，象征了文艺复兴时期人文主义者摆脱中世纪书本教条，投身社会、探索人生真理的战斗历程，表达了新兴资产阶级要求个性解放，渴望实践的强烈愿望。\n\n二、浮士德第二个人生阶段为追求爱情阶段，展现的是爱情悲剧\n\n魔鬼带着浮士德来到德国的一个小镇，并帮助他得到了少女玛甘泪的爱情。但这段爱情很快酿成悲剧，玛甘泪为了与浮士德幽会，无意中让母亲吃了过量的安眠药，毒死了母亲。哥哥也因反对她与浮士德的结合而死于浮士德的剑下。她自己未婚生子，因害怕社会舆论压力而溺死了自己的婴儿，被判死刑。玛甘泪因浮士德的爱情而陷入苦难，浮士德却在魔鬼的诱惑下沉溺于瓦普几斯之夜与魔女的欢会中。当他得知玛甘泪的遭遇，赶到监狱去搭救时，玛甘泪已精神失常，甘愿承受上天的惩罚而不肯越狱。爱情的悲剧结局让浮士德心生自责，从而结束了对爱情的追求。浮士德认识到围绕个人生活的狭小圈子追求理想是不可能的，必须克服“小我”走向“大我”，向着更高的境界前进。这段描写实际上是对文艺复兴时期那种过分追求官能享受和个人主义泛滥的现实的否定。\n\n三、浮士德第三个人生阶段为政治生活阶段，展现的是政治悲剧\n\n魔鬼把浮士德带到帝国的宫廷，使他有机会为皇帝服务。当时帝国里一片混乱，诸侯各霸一方，官吏贪赃枉法，士兵抢劫成风，百姓随时都可能揭竿而起，更严重的是国库里山穷水尽。浮士德在魔鬼建议下大量发行纸币，暂时解决了王朝的财政危机。\n\n可皇帝仍懒于过问国事，只求寻欢作乐，竟异想天开地提出要见希腊古代美女海伦，浮士德只得在魔鬼帮助下设法招来海伦的幻影。但当看到海伦与帕里斯调情的场面时，浮士德不禁怒火中烧，拿起魔术钥匙击打帕里斯，结果引起爆炸，精灵们烟消云散，浮士德昏倒在地，从此结束了他的政治生活。\n\n这段描写反映了资产阶级企图依靠封建统治阶级改革社会的幻想的破灭，实际上也是歌德对自己在魏玛从政十年的反思。通过对弄臣生涯的描绘，诗剧揭露了封建王朝的腐朽与黑暗，也体现了资产阶级自身的软弱性、妥协性，歌德最终也否定了政治追求。\n\n四、浮士德第四个人生阶段为追求古典美阶段，展现的是对美的追求的悲剧\n\n魔鬼背着昏迷不醒的浮士德回到书斋，浮士德的学生瓦格纳在实验室里造出了一个小人-“荷蒙古鲁士”。荷蒙古鲁士看出昏迷中的浮士德对海伦仍念念不忘，遂引导他来到古希腊，让他与海伦结合。他们生下的儿子欧福良继承了浮士德永不满足、向往实际行动的性格，当他听到远方的人们为自由独立而斗争的消息时，也渴望参加战斗。但因跳跃太高，欧福良被天火所击，殒落在父母的脚下。海伦悲痛欲绝，随即在浮士德的怀抱中消失，只留下白色的长袍和面纱。长袍化为白云，把浮士德托起，飞回北方。浮士德追求美的悲剧说明企图用古代美来消除现代社会的丑恶是不可能的，从而否定了德国作家企图用艺术力量改造社会的幻想。\n\n五、浮士德第五个人生阶段为改造大自然阶段，展现的是事业悲剧\n\n从虚幻的世界重新回到现实中来的浮士德，因帮助皇帝镇压叛乱获得了一片海滨封地。面对波涛汹涌的大海，浮士德对人生的真谛有了新的认识，试图通过实践来改变自然和世界。他发动群众移山填海，征服大自然，企图创造一个人间乐园。这时的浮士德已是百岁老人，双目失明。“死灵”到来，为他挖掘墓穴。浮士德听到铁锹挖地的声音，以为一项造福人类的伟大事业正在进行，于是他恍然大悟：“要每天每日去开拓生活和自由，然后才能够作自由与生活的享受。”他情不自禁地说：“你真美呀，请停留一下！”按照契约，他倒地死去，但魔鬼并未能拘走他的灵魂，因为光明女神把他接到了天上。在天上，浮士德见到了已经成为圣女的玛甘泪。浮士德这一阶段的经历表现了资产阶级思想家对人类社会美好愿景的向往以及对当时流行于欧洲的空想社会主义思想的呼应。\n\n从现实的层面来看，浮士德最后是以悲剧结束了他的人生探索，在与魔鬼的化身靡非斯特的赌赛中输掉了。但是，从人类发展历史的精神层面来看，他的失败却反衬了其精神的超越性，所以，浮士德是积极进取精神、美好善良人性和人道主义思想的体现者和胜利者。\n\n他不停地探索，经历了丰富多彩的生活，不断拓展了自己的视野，并在最后将个人追求与民众幸福联系在了一起，从劳动中领略到了生活的真谛。虽然最后失去了自己的生命，但是浮士德的精神却代表了人类进步的动力，他的奋斗“囊括着人类的全部历史”。\n\n正是因为如此，上帝就人类的灵魂能否得救而与魔鬼进行的赌赛最后以上帝的获胜结束。上帝把浮士德的灵魂从魔鬼那里抢走的时刻，正是浮士德精神获得永恒生命的时刻，而这也是对人类不断进取的精神的褒奖。\n\n所以，通过对浮士德形象的塑造和对其一生不断探索的历程的描述，歌德不仅总结了自己精神的发展历史，也象征性地反映了自宗教改革以来西方进步知识分子的奋斗历程，概括了人类的生存境遇、历史的发展进程，提炼出不断进取、立足现实、肯定人生的斗争精神，并且予之以象征性地再现与肯定。","keywords":"追求书本知识阶段 追求爱情阶段 政治生活阶段 追求古典美阶段 改造大自然阶段","note":"武汉大学在24年对《浮士德》的悲剧内涵进行了考查。浮士德是一种积极进取精神的代表，是一个自强不息、执着探索者的形象。他一生五个阶段的探索与悲剧，反映了宗教改革以来西方进步知识分子的奋斗历程，同时也概括了人类的历史发展进程。"},{"id":"94","stars":"★★★★★","title":"“浮士德精神”与“浮士德难题”的具体内涵","body":"一、浮士德精神\n\n《浮士德》中主人公浮士德永不停息的人生探索，体现出一种积极进取的精神，文学史称之为“浮士德精神”，所谓“浮士德精神”，就是不满现状、不断追求、积极进取、勇于探索，渴望和追求美好的理想，并不断地付之于行动的精神。\n\n（一）浮士德在探索中不断前进，永远不停止，即使经历了一次又一次的悲剧，他仍然继续着自己的人生探索。他身上突出表现了永不满足、自强不息的特征。他的人生道路艰难曲折，魔鬼靡非斯特引诱他屡犯错误，但他在不断追求中改正错误，一直向更高境界攀登，去找寻人生真谛。\n\n（二）浮士德不断追寻至善，从追寻个人的爱情，到服务于宫廷，再到追寻古典美的世界，最后发展到与大海争地，开辟荒滩，为人类安居乐业而奋斗。\n\n（三）浮士德肯定人的作用，肯定人生的目的在于行动，在于作出有益于社会的实践，通过实践而不断追求真理，最后领悟人生的真谛，即劳动和实践的可贵，领悟到“人必须每天每时去争取生活与自由”。当浮士德意识到自己所学的书本知识毫无用处时，他决心摆脱一切桎梏，追求变革。他将《圣经》中的“泰初有道”改为“泰初有为”，表明他渴望行动，要求投身到现实的实践中，于是他充满自信，敢于与魔鬼打赌，走出象牙塔，在不断剖析自我中找到满足与幸福。\n\n总之，“浮士德精神”的核心就是不断进取、肯定现实人生、以人为本的精神，反映了上升时期资产阶级积极的精神特征。 二、浮士德难题\n\n浮士德难题其实是人类共同的难题，它是每个人在追寻人生的价值和意义时都将无法逃避的“灵”与“肉”、理性与非理性、善与恶的斗争的问题。\n\n（一）“紧贴凡尘爱欲”与“先人的灵魂”的矛盾\n\n浮士德一方面不断进取、追求理想，另一方面也有贪图享乐、沉迷于感官刺激的时候。为此，他的内心充满了矛盾和冲突。在诗剧中，浮士德时刻感受到这种内心冲突，并将之归纳为“紧贴凡尘爱欲”与“先人的灵魂”之矛盾，这也是康德所探讨的自然欲求与道德律令之间的矛盾。浮士德面临的矛盾，折射了当时的各种社会斗争，也反映了人类共同的生存境遇，是人类走向成熟时对情感与理智、自然欲望和精神追求、个人发展与社会改造等矛盾的思考，是人性的真实写照。\n\n（二）歌德对人类命运的思考\n\n歌德通过描写浮士德精神和他生活中的问题，揭示了人类共同的两难处境，并表现了歌德的辩证思想。在《浮士德》中，理性与非理性、灵与肉的矛盾冲突，致使浮士德内心骚动不安，为了解决矛盾，他必须寻找新的人生领域，由此，他走出个人世界，走向更为广阔的社会，开始了对政治、经济、文化和实践的探索。所以，灵与肉的冲突、理性与非理性的矛盾、善与恶的斗争，是现实存在的反映，它带来的是人类社会的发展。同时，歌德还在诗剧中通过玛甘泪之死和欧福良的早天，象征性地表达了对无限制地追求自由和满足个性欲望的否定，提出了发展自我、追求个人欲望的满足与责任和道德之间微妙的平衡问题。","keywords":"在探索中不断前进 不断追寻至善 行动实践 灵与肉的冲突 理性与非理性的矛盾 善与恶的斗争","note":"浮士德精神是我们需要重点掌握的一个知识点，仅在2023年，就有北京大学、湖南师范大学、南京大学等多所学校对其内涵进行过考查。一般认为，浮士德精神的基本内涵是“永不满足，永远进取，不断超越”，满足就意味着死亡，魔鬼可以满足他的一切欲望，唯一的条件就是他不能满足。《浮士德》的确体现了启蒙主义重理性、重科学、重实践的精神，但歌德超越了一般启蒙主义者的地方，就在于他对人的永恒追求的可能性提出了疑问。通过浮士德的悲剧，歌德提出了著名的“浮士德难题”，这个难题讲述了奋斗者们面临的普遍境遇，体现了歌德对于人类命运的思考。"},{"id":"95","stars":"★★★","title":"试比较《失乐园》中撒旦和《浮士德》中靡非斯特两个魔鬼形象","body":"《失乐园》中的撒旦和《浮士德》中的靡非斯特两个魔鬼形象，都是恶的象征，都是作品中的反面人物。但是，由于这两部作品出现的时代不同，所表达的主题也不同，这两个魔鬼的形象也有不同之处。具体来说，二者的异同，主要表现在以下方面：\n\n一、相同点\n\n（一）二者都想要引诱人类的堕落\n\n在《失乐园》中，撒旦为了复仇，化身为蛇，到伊甸园中去引诱夏娃吃下智慧果，致使亚当和夏娃被逐出伊甸园；靡非斯特与上帝打赌，否定人生，否定社会的进步，他去诱惑浮士德，希望使浮士德堕落，而让自己赢得赌局。\n\n（二）二者都是恶的象征\n\n撒旦作为堕落的大天使，他一心想使人类陷入深渊之中，其本身就具有恶的本性，其本质就是魔鬼的化身。《浮士德》中的靡非斯特，以宗教人物的形象出现，与上帝相对，也是浮士德的对立面，代表“恶”的否定精神，是十足的恶的化身。他不相信世界上会有什么好事情，因此能冷静而机械地表现社会的邪恶和人的弱点。\n\n二、不同点\n\n（一）二者形象的寓意不同\n\n在《失乐园》中，诗人赋予撒旦形象以深刻的寓意：既要讴歌当年反对封建专制王朝、建立共和国的那些资产阶级的英雄们，也要批评资产阶级革命者（尤其是领导人物）的傲慢自满、骄奢淫逸，正是这些弱点导致了革命失败。\n\n在《浮士德》中，靡非斯特形象反映了文艺复兴以来伴随资本主义而生的不择手段以获取财富与权势的野心家、冒险家特性，概括了新兴资产阶级极端利己主义者贪婪、冷酷的精神特征。\n\n（二）二者所表现的思想不同\n\n在《失乐园》的前半部分，撒旦被刻意描绘成一个敢于藐视权威、反抗强暴的英雄。他是叛逆天使们的“强大首领”和“威严统帅”，他以王者的赫赫气概，率领天军部下揭旗北进，与上帝分庭抗礼，在激战中表现出了超人的勇气和力量；他\n\n有着强烈的反抗精神，虽然被打入地狱，依然斗志昂扬，桀骜不驯。弥尔顿通过描写撒旦的反抗与战斗，赋予其高昂的革命激情，表达出对其不屈不挠的复仇意志和毫不妥协的革命精神的赞美之情。但同时，撒旦后半部分的作为体现了当时资产阶级革命者的局限性，对此，弥尔顿也作出了批判。\n\n靡非斯特与浮士德之间相反相成的关系，深刻地揭示了人类文化不断发展的辩证法：人类发展的道路是曲折坎坷的，但由于人类具有追求真善美的基本精神，所以总是在不断进步；人类在前进路上总会遭遇外在或内在的各种恶的阻挠，难免会有失误，但人类只要守护住向善的基本精神，终将克服各种障碍，进而使得那些恶的东西客观上也成了从反面激励人类发展的推动力。\n\n（三）二者起到的作用不同\n\n在《失乐园》中，撒旦寄身于蛇，趁夏娃独处之时，花言巧语引诱夏娃违背上帝戒规，偷尝了智慧树上的果子。亚当知其犯罪，决定和她同死，也吃了禁果。上帝派天使米迦勒带队把亚当和夏娃逐出了伊甸园。可以说，正是因为撒旦的引诱，夏娃和亚当才会被逐出伊甸园，他是亚当与夏娃命运中的阻碍。\n\n《浮士德》中，正是因为靡非斯特的引诱，浮士德才得以走出书斋，走向了更为广阔的社会，踏上了不断探索的人生之路。靡非斯特阻碍浮士德实现自己的人生梦想，客观上却使浮士德从错误中摸索到正途，从而不断推动浮士德前进，促成浮士德在生活实践中转向善。所以，靡非斯特客观上推动着浮士德向善的发展，成了浮士德前进路上不可或缺的动力与条件。","keywords":"相同点 引诱人类的堕落 恶的象征 不同点 寓意不同 思想不同 作用不同","note":"撒旦与靡非斯特虽同为魔鬼，但撒旦身上体现的是反抗精神，反映了17世纪资产阶级革命者的反抗精神和自身局限性；而在靡菲斯特身上，歌德除了反映当时资产阶级不择手段获取财富的丑恶嘴脸，还更深一步地表现出了自己对人生的思考。"},{"id":"96","stars":"★★★★","title":"为什么说《浮士德》高度概括了文艺复兴以来欧洲资产阶级的发展史","body":"《浮士德》是歌德所写的诗体悲剧，以浮士德对人生意义的探索和真理的追求为贯穿全剧的红线，具有自传性色彩。歌德在浮士德形象中所概括的历史经验，实际上是资产阶级进步人士思想探索的历程。这具体体现在以下几个方面：\n\n一、浮士德的五个探索阶段，是欧洲数百年间思想发展历程的写照\n\n通过浮士德知识悲剧、爱情悲剧、政治悲剧、古典美悲剧和改造大自然悲剧五个悲剧阶段，诗剧囊括了人道主义、古典主义和启蒙主义等各种思想，反映了自宗教改革以来数百年间资产阶级人文主义思想的发展历程。例如，浮士德走出书斋，大声疾呼冲出牢笼，要了解自然秘密的老学者形象，体现了文艺复兴、宗教改革到“狂飙突进”运动的反封建精神。浮士德走出书斋后，诗中思想境界不断开阔，包含着歌德本人和许多资产阶级思想家们的经历和体会。最后浮士德发动群众，以集体劳动改造自然，建立了理想乐园，找到了人生的真理，从这里我们可以看到18世纪启蒙思想家关于“理性王国”的蓝图，也可以听到19世纪空想社会主义者的声音。因此，这部诗剧以史诗般的规模总结了文艺复兴以来三百年间资产阶级精神发展的历史。\n\n二、浮士德形象反映了处于上升时期的资产阶级的积极进取精神\n\n浮士德永不满足的探索，是资产阶级进取精神的艺术写照，他代表了资产阶级永不满足、探求不止、勤奋刻苦、自强不息、始终向上向善的进取精神，是时代特征的鲜明反映。浮士德最后领悟了人必须每天劳动的重要性，体现了资产阶级勤劳的本性。这些都是欧洲资产阶级上升时期勇往直前的知识分子的精神写照。\n\n三、浮士德形象还反映了资产阶级的阶级本性\n\n浮士德本身具有资产阶级所特有的冷酷无情和人道主义的局限。他贪图名利、地位、权势、金钱，追求感官享受，易受到各种诱惑而迷失方向。同时，他并不主张消除反动制度，并且依靠统治者来获得土地，将理想寄托于君主与封建贵族的妥协，害怕自上而下的革命，缺乏革命激情。浮士德在探索的过程中也体现了资产阶级个人奋斗的特点，他并不把希望建立在相信人民的基础上，而是将人民作为自己驱使的对象，恩赐他们幸福。他还从事海盗勾当，通过殖民手段拓展财富，这揭示了资产阶级原始积累的过程，展现了资产阶级的血腥发家史。以上这些都体现了资产阶级自身的消极性与妥协性。","keywords":"资产阶级进步人士思想探索的历程 五个探索阶段 欧洲数百年间思想发展历程 资产阶级的积极进取精神 阶级本性","note":"西南大学2023年对相关内容进行过考查，“如何理解《浮士德》是欧洲文艺复兴三百年以来的思想史”其实就是在说诗剧概括了文艺复兴以来欧洲资产阶级的发展史。此题可与前面的五个阶段、“浮士德精神”等相互借鉴，互相补充，** --- 浮士德作为一个人文主义的继承者，批判精神和辩证精神贯穿着他的一生，而他自己也在不停地探索真理，资产阶级与封建阶级之间的斗争，是浮士德精神产生的时代根源。浮士德身上，浓缩着资产阶级精神世界探索的道路。"},{"id":"97","stars":"★★★","title":"如何认识歌德一生的矛盾","body":"对于歌德一生的矛盾，恩格斯曾经作出过精辟的阐述：“在他心中经常进行着天才诗人和法兰克福市议员的谨慎的儿子、可敬的魏玛的枢密顾问之间的斗争。”\n\n一、歌德一生的矛盾就是反抗与妥协的冲突\n\n在狂飙突进运动时期，歌德以饱含激情的反叛赢得了世人的关注，创作了批判社会的作品《少年维特之烦恼》。但是，在1775年，他在26岁之际，应年仅18岁的魏玛公爵的邀请担任该公国的枢密官。从此，歌德从一个具有反叛精神的作家变成了一个封建小朝廷的官吏和宫廷文人，政治主张上日趋保守。\n\n但是，他的内心是充满着矛盾的。为了行政工作，他不得不在许多方面对外妥协，对己克制。为此他常常感到痛苦。他曾一度对政务厌倦，埋头于自然科学研究。之后法国大革命爆发，歌德逐渐抛弃了青年时期的反叛态度和激进思想，开始倡导温和的改革路线，即通过对国民进行教育，改善人性，从而变革社会。为此，他一度对法国大革命进行冷嘲热讽。所以，不难理解恩格斯何以说：“歌德有时非常伟大，有时极为渺小。”\n\n二、歌德一生的矛盾实际上是思想上的矛盾\n\n歌德的矛盾源于其政治思想的矛盾性。一方面，他接受了资产阶级革命思想的影响，表现出反封建的叛逆精神；另一方面，他又将希望寄托于理想君王身上，主张改良，缺乏革命热情。法国大革命爆发后，歌德曾热情欢呼，说这次革命将是“世界历史上的一个新时代的开始”。但是，随着革命的深入，随着革命破坏性一面的显现，歌德开始反思革命的意义，甚至指责革命中出现的问题，如《威尼斯铭语》的某些部分，剧本《大科普塔》《市民将军》和《受鼓动的人》。从本质上讲，歌德是赞成“合乎自然，和平的发展进化”，不赞成革命的暴力。\n\n三、歌德的矛盾实际上反映了近代德国资产阶级知识分子的时代特征和阶级属性，带有普遍性和社会性\n\n歌德生活的时代，德国正处于四分五裂、封建割据的时期，资本主义发展落后于英法等国，资产阶级力量有限，而且对封建制度和贵族阶级的依附性突出，鄙俗和自私成为一股弥漫的社会风气，致使德国的启蒙运动难以像法国那样酿成思想革命和政治革命，只能在文化艺术领域展开。在这样的时代环境中，以歌德为代表的德国资产阶级知识分子对待革命的保守和游离态度也是可以理解的。所以，歌德一生的矛盾，实际上反映了时代的特征，也暴露了德国资产阶级的软弱性和妥协性。\n\n四、就其文学创作来看，歌德一生的矛盾也反映了其思想兼容井蓄、不断发展的过程\n\n歌德一生跨越了18世纪和19世纪，经历了多次重大的历史事件，博闻强识，加之在知识探索方面从不懈怠，使其视野得到不断拓展，能够以开放的心态接受外界包括东方文化的各种影响，形成了具有包容性的辩证唯物思想，而这正为他作为一位文学家提供了更为自由的表现空间和源源不断的表现题材，所以，从其文学创作来看，歌德一生的矛盾不仅不是其缺陷，相反还是其创作几经变化、兼收并蓄的动力。","keywords":"反抗与妥协的冲突 思想上的矛盾 近代德国资产阶级知识分子的时代特征和阶级属性 普遍性和社会性 思想兼容并蓄不断发展","note":"歌德的作品和思想在不同阶段呈现出了不同的特点和矛盾，通过对比这些作品和思想，可以更好地理解他的矛盾性。歌德的生平经历中有许多转折点，这些转折点对他的思想和行为产生了深远的影响，分析这些转折点可以更好地理解他的矛盾。歌德的人格中也呈现出了许多矛盾之处，如内向和外向、情感和理性等，通过探究他的人格可以更好地理解其思想和行为的矛盾。"},{"id":"98","stars":"★★★","title":"浮士德的一生贯穿着歌德哪些精神","body":"一、诗剧在描写浮士德的一生时，贯穿着批判的精神\n\n（一）《浮士德》描写德国的资产阶级先进分子与德国现实之间的不可调和的矛盾，其批判的锋芒指向上至宫廷、下至市民社会，包括教会和一切经院哲学在内的整个腐朽鄙陋的德国。全诗像当时的许多启蒙文学作品一样，具有反封建反教会的战斗性。\n\n（二）歌德通过靡非斯特用“海盗、走私、战斗”三位一体的方法开拓事业和无情地摧残山上老夫妻等情节，谴责了资本主义原始积累的残酷性。\n\n（三）诗剧的批判精神还表现在对资产阶级自身的种种不切实际的幻想的否定之中。\n\n二、诗剧在描写浮士德的一生时，也贯穿着辩证的精神\n\n《天上序幕》中天帝说：人类往往贪图安逸，他们的精神易于弛靡，所以他造出恶魔来“以激发人们努力为能”。这里预示了纵贯全剧的浮士德与靡非斯特之间的对立统一的关系。浮士德不断寻找至善至美，体现了肯定的精神。靡非斯特体现了恶，体现了否定的精神，正如他自己所说：“犯罪，毁灭，更简单一个字，‘恶＇，这便是我的本质。”他不相信历史会前进，不相信人类会进步，对一切都抱着轻蔑嘲笑的态度。当他以这种态度对待现实中的某些丑恶事物时，能够清醒地看清事物的本质，给之以尖锐的嘲讽。并且对于浮士德这样一个不断追求的人来讲，他的恶能够从反面起到推动的作用。他一再引诱浮士德作恶，实际上使浮士德从错误中摸索到正途，不断向真理前进，促成了浮士德的向善。这样，靡非斯特便成了浮士德前进路上不可缺少的动力。总之，在歌德看来，善与恶并不是绝对对立的，而是互相依存、互相转化的，恶的作用并不全是破坏，人类正是在同恶的斗争中克服自身的矛盾而取得进步。所以靡非斯特说，他是“作恶造善的力之一体”。\n\n三、诗剧在描写浮士德的一生时，贯穿着人道主义精神\n\n歌德作为资本主义上升时期的伟大思想家与文学家，他所关注的目标和中心点始终是人，包括人的激情、本性，以及人与现实生活和人与世界的关系。他的人道主义和个性完善思想，深刻地体现了当时德国人的主要特征，从而与现实不断发生冲突。浮士德能够始终坚持追求和批判，是因为诗人赋予他以一种深刻的人道主义精神，这既是浮士德人生追求的动力与理想，也是他能够自觉地进行深刻批判的内在依据。最初浮士德或许只是感到个性的压抑和生活的灰暗，渴望一种更人性化的生活，随着人生追求的展开和批判的深入，他的思想境界不断提升，其人道主义思想也升华成一种自觉的精神和宽广的情怀，最后他所追求的创造性事业已经完全超越了自我，是要“为几百万人开拓疆土”，他的理想就是要看到每个人“在自由的土地上跟自由的人民结邻”，“自由”概念成为浮士德人道主义精神的真正内核。\n\n四、诗剧在描写浮士德的一生时，表现出一种坚持不懈、永不满足的追求精神\n\n歌德的思想历程与欧洲文艺复兴以来资产阶级思想发展历程具有某种相似性。他早年尊重个性自由，崇尚激情，与人文主义者的思想较为一致；在创作中期，他崇尚古典美，渴望深入实际生活并试图在具体的工作中改造社会，具有17、18世纪资产阶级思想家与文学家的特点；而在晚年，他从思想体系的角度探讨人与世界的关系，又明显带有19世纪初黑格尔哲学和空想社会主义思想的特征。\n\n可以说，他的一生就是不断求索的一生，这也通过浮士德的一生表现出来。","keywords":"批判的精神 辩证的精神 追求精神 人道主义精神","note":"大家在回答这道题目时，首先可以结合《浮士德》的思想价值和靡非斯特的人物形象进行分析，归纳出批判、辩证几点。其次，可以联系歌德的生平经历、思想观念进行分析，归纳出不断追求与人道主义几点。这题其实也是浮士德精神的扩大版，大家可以将这二者联系起来理解。"},{"id":"99","stars":"★★★","title":"结合作品谈谈简·奥斯汀最突出的创作艺术特色（26北京大学）","body":"奥斯汀继承欧洲文学的反讽传统，以高度的艺术自觉，熔铸出更为成熟的反讽艺术。在她的小说中，反讽不仅表现为暗讽的语调，挖苦的文字，而且运用于人物塑造；不仅见于个别场面、情节的处理，还融汇在整部作品的构思之中。它是奥斯汀理解，评价生活的惬意的载体，也成为她的小说的基调和风格标志。\n\n一、人物塑造上的反讽\n\n奥斯汀以丰富的反讽技巧发展了次要“漫画人物”的塑造，还把它普遍运用到主角的塑造上，揭示他们优劣并存的复杂性格及其发展过程。\n\n奥斯汀的每一部小说都出现一些性格比较单一、受到叙事者嘲讽
