旭诺和波阿莱良心的出卖、大学生皮安训的义举以及伏盖太太的活动等八个故事，其中拉斯蒂涅与高老头故事是中心。这些线索不是独立存在、孤立发展的，而是相互纠缠、彼此推动的，从而使情节不断向前发展。其间，拉斯蒂涅起着穿针引线的作用，由此八条线索编织成一张有机的情节网。这是典型的巴尔扎克式小说结构模式。","keywords":"思想内容 拜金主义 政治野心家 贵族被资产阶级取代 艺术特色 物质环境 典型性格 不同塑造手法 细节描写 人物再现 对比 语言多姿多彩 比喻深刻 网状结构","note":"《高老头》作为《人间喜剧》的一部杰出代表，显示出《人间喜剧》中“巴尔扎克式”的艺术特征。中南民族大学、北京外国语大学在24年都对其进行了考查。在分析它的特色时，可以联系《人间喜剧》的创作特征，结合具体作品作答。此外，要注意，上述艺术特色中的前六点，可以归结为“《高老头》人物塑造的特点”，大家要灵活提炼归纳。"},{"id":"149","stars":"★★★","title":"高里奥形象与李尔王形象对比","body":"一、相同点\n\n（一）都处在有阶级矛盾冲突的社会历史背景下\n\n《李尔王》与《高老头》两部作品都采用了相同的社会关系横截面来反映社会转型时期人们观念和精神境界的冲突。两部作品的父女关系反映出了金钱在资本主义萌芽时期对农业文明人伦关系的巨大排斥性，即金钱意识对家庭伦理血缘关系的冲击。\n\n李尔王生活在17世纪的英国，英国正处于资本主义原始积累时期，封建社会正向资本主义社会转化过渡。高老头生活在19世纪的法国，封建贵族逐渐没落，资本主义兴起，金钱至上的观念腐蚀人心。\n\n（二）相似的失败的家庭教育\n\n作为父亲，李尔王与高老头都爱自己的女儿，并以土地、金钱、权力等形式表达父爱，导致缺乏精神文明上的教育。\n\n李尔王以自己的言行来教育女儿。李尔王长期处于高位，喜欢别人拍马屁，恭迎自己，所以他的大女儿、二女儿也很懂得谄媚恭维。同样因为李尔王长期处于高位，让两个女儿只感受到了对父亲的服从和敬畏，没有感受到亲情。在这种高压与谄媚的环境下，女儿们的精神世界已经逐渐扭曲。\n\n高老头的教育具有盲目性。在妻子去世后，他把所有的感情都注入了孩子身上，认为在物质上无条件的供给就是爱。他的行为满足了女儿当贵妇人的幻想，但没有教育女儿基本道德准则，所以他的两个女儿成了别人的摇钱树。\n\n（三）两个父亲都以悲剧结尾\n\n李尔王年事已高想要退居幕后，把自己所有的权力和土地都分给了两个女儿。结果，大女儿骂父亲李尔王是老废物，并处处限制李尔王的行动。李尔王愤怒地离开大女儿，去投靠二女儿。而大女儿却写信唆使妹妹也不要接纳父亲，姐妹俩串通一气。\n\n高老头的两个女儿出了事需要钱的时候，她们首先想到的肯定是父亲。然而两个女儿却在父亲病了之后拒绝来看他。高老头到死也未能见到自己心爱的女儿，死后两个女儿女婿只派了两驾空车跟在灵柩后面。\n\n二、不同点\n\n（一）不同的人生地位和性格特点\n\n李尔王是一个英国的旧式君主，由于久居权势之位，变得刚愎自用，处事随心所欲。当所有的事情都脱离了他的控制，他就会觉得很失落，觉得被背叛了，开始破口大骂。\n\n高老头是一个资产阶级的暴发户，看够了商场上的尔虞我诈，他迫切地希望能够有真正关爱自己的人，于是他就把所有的金钱都给了自己的女儿，希望用物质的爱换回精神的爱，换回他想要的亲情。\n\n（二）反映的社会道德规范不同\n\n莎士比亚虽然描写了现实社会中人情的刻薄，在权欲和金钱关系的影响下，子女对父亲见利忘义。但他又把人文主义理想与现实的冲突解释为善与恶的冲突，寄希望于道德改善。\n\n巴尔扎克的高老头虽然最终醒悟金钱的作用，却没有道德这一层面的意义，作者也未在他身上寄托理想，只是借塑造他的形象客观地反映现实。","keywords":"相同的社会历史背景 相同的矛盾冲突 相似的失败的家庭教育 两个父亲都以悲剧结尾 不同的人生地位和性格特点 反映的社会道德规范不同","note":"高老头和李尔王都是特定时代、特定环境中的典型。高老头不仅是那个时代与时俱进的资产者，有着那个时代人追逐金钱的本能和自私自利的共性，同时他也是宗法制社会父爱的典型。他把金钱视为万能，殊不知金钱毁灭人性，败坏良心，破坏家庭亲情。高老头自然成为了金钱关系的受害者，同时他也是实施者与受害者的统一。李尔王其实也不然，只是他把权力看得太重，是一个虚荣者与权威者的统一，这注定了他将成为权力关系的受害者。"},{"id":"150","stars":"★★★★","title":"以拉斯蒂涅所受的“人生三课”为主线，简析《高老头》的社会批判性","body":"拉斯蒂涅在物质环境的刺激下，在“人生三课”的教育下，经过良心与野心的激烈搏斗，完成了野心家性格发展的过程，最终从一个没落的贵族子弟，变成了资产阶级野心家。他是贵族子弟资产阶级化的典型。在这一过程中，饱含着巴尔扎克的社会批判激情。\n\n一、抨击了资产阶级利己主义道德原则\n\n拉斯蒂涅的第一次人生大课是他的远房表姐鲍赛昂夫人的指点和教诲。这个熟谙上流社会的贵妇人，将她所掌握的资本主义社会“关系学”毫无保留地教给了她的远房表兄弟，教他怎样以牙还牙，怎样没心没肺，怎样勾引女人，怎样凭借女人往上爬等，堪称拉斯蒂涅的启蒙者。鲍赛昂子爵夫人亲自教他读“人生这部书”，培养他自私自利的人生观，传授他以牙还牙对付社会和他人的伎俩。在这一过程中，巴尔扎克批判了资产阶级利己主义道德原则。\n\n二、揭露了资产阶级取代贵族阶级的罪恶发家史\n\n拉斯蒂涅的第二次人生大课，是伏脱冷近乎斥骂的教诲。伏脱冷是一个拼命想爬上贵族社会的恶汉，他最终未能如愿以偿，但积累了宝贵的经验。与鲍赛昂夫人相比，他的教导是赤裸裸的强盗逻辑。他先以自己的复杂经历去打动拉斯蒂涅，教拉斯蒂涅要“对什么都不服从”。他以鹰犬一样锐利的目光透视拉斯蒂涅的心灵，劝诫他要出人头地，不能只靠求学，要想别的办法，要有野心。他建议拉斯蒂涅与维多莉小姐订婚，杀死她的哥哥，继承父亲的全部财产，以迅速成为百万富翁。这种赤裸裸的资产阶级掠夺方式，虽让拉斯蒂涅感到不适应，却还是为此心动。巴尔扎克揭露了以拉斯蒂涅为代表的资产阶级取代贵族阶级的罪恶发家史。\n\n三、批判了在物欲横流的社会里金钱的罪恶\n\n拉斯蒂涅的第三次人生大课，是高老头的死。高老头是一个资产阶级暴发户，他极度溺爱自己的女儿，把自己的全部家产都花在了她们的身上，最后却落得临死前都未能看到女儿们来看他一眼的下场。从高老头的死中，他悟出了资本主义社会人与人之间关系的纽带全在于金钱，这使他更加坚定了获取金钱、立足上流社会的决心。高老头的苦难和死亡，最终完成了他的社会教育。他埋葬了高老头，也埋掉了自己的最后一点人性，这时的他决定堕落成为向财富和权势进攻的资产阶级野心家。在这一课中，巴尔扎克批判了在物欲横流的社会里金钱的罪恶。\n\n总之，拉斯蒂涅通过三次人生大课的教育，一步一步走上了野心家的道路。小说通过他的堕落过程的描写，揭露了金钱的统治作用和拜金主义的种种罪恶，揭露了统治阶层的卑鄙丑恶，抨击了资产阶级的道德原则，从而揭示了人欲横流的社会现实。","keywords":"鲍赛昂夫人 资产阶级利己主义道德原则 伏脱冷 资产阶级取代贵族阶级的罪恶发家史 高老头 物欲横流的社会里金钱的罪恶","note":"东北师范大学在23年对拉斯蒂涅的三次人生大课内容进行了相关考查，“扼要概括《高老头》中三个主要人物** --- 对拉斯蒂涅的教育”，对此我们还延伸解析了这人生三课所表现出的社会批判性，大家要有所掌握。"},{"id":"151","stars":"★★★","title":"比较分析于连和拉斯蒂涅人物形象的异同","body":"一、相同点\n\n于连和拉斯蒂涅都有志向有雄心，聪明能干，意志坚强，都以个人名利为前提，想通过自己的奋斗发财致富，飞黄腾达，并具有敢于冒险的英雄主义热情。在行动上，他们最终都走了一条不择手段向上爬的道路。\n\n拉斯蒂涅是复辟王朝后期到七月王朝时期的资产阶级和野心家的典型。他出身于没落贵族，梦想夺取一番功名，结果社会的三堂课让拉斯蒂涅认清了现实，开始不择手段地向上爬。\n\n于连是法国复辟王朝时期个人奋斗者的典型。他出生于小业主家庭，很早就形成反抗心理，对贵族大资产阶级本能的厌恶。他理想的晋升道路已然关闭，于是转而投靠污秽不堪的教会，希望通过教会实现个人美梦。在认清现实后，于连采取了绝望和反抗的举动，以死来反抗不公平的社会，走完了他悲剧的一生。\n\n二、不同点\n\n（一）于连和拉斯蒂涅的人生追求不同\n\n于连有火一样的热情和勃勃的事业雄心，有更高的生活理想与人生价值，拉斯蒂涅是清醒地盯准金钱、地位。所以二者有着根本性的区别。\n\n拉斯蒂涅出身于外省破落小贵族。生活的贫穷与家庭的义务，催生了他对于权力的欲望。起初他是想通过勤奋地读书一步一步稳稳地向上爬，但身边的现实，使拉斯蒂涅看清社会的本相：财产就是一切。于是金钱、权势成了拉斯蒂涅追求的人生目标。\n\n于连是一个已经发迹的厂主的儿子。低下的社会地位与压抑的家庭环境给了于连奋斗的决心，同时对奢侈生活与社会地位的向往也是于连奋斗的动力。但他有更高的人生目的，那就是他的“荣誉”。\n\n（二）实现人生目标的手段不同\n\n拉斯蒂涅用泯灭人性的手段不断向上爬。他一进入巴黎，就努力使自己适应变化了的形势，在不同人的指导下，他很快学会了上流社会的生存法则，学会了逢迎谄媚、虚伪和自私。他凭自己的热情和才气，加之风流倜傥的仪表，引诱和利用女性，不断更换目标，利用倾心于他的女子一步步地爬上去。\n\n于连在追求上流社会的同时并没有完全丧失属于自己的自尊和人性。他所走的恋爱、当主教、当教师等每一个环节，内心都经过了激烈的挣扎，他的选择并没有违背良心，在某种程度上还保留了自尊，他更多地依靠自己的奋斗，平民的自尊及对统治阶级的反抗不会让他完全沦陷。\n\n（三）于连和拉斯蒂涅的性格不同\n\n拉斯蒂涅是复辟王朝时期为资本主义社会金钱所腐蚀的贵族子弟的典型。他看到了巴黎的世界，受到子爵夫人、伏脱冷和高老头的影响，明白了这个社会的本质，而高老头的死更是让他把为人的最后一点良心与正义埋葬了。\n\n于连的心理矛盾及扭曲是由两个阶级的对立引起的。他出身低贱，备受凌辱，但受资产阶级启蒙思想影响的他又有着宏伟的理想。他虽不满封建等级制度，但要实现报复又不得不依赖于他们。反抗与妥协是他思想中来回翻滚，造就了他身上的双重性格特征，勇敢与胆怯、自负与自卑的性格在他身上交织。\n\n可以看出，拉斯蒂涅的痛苦在于现实的生活状况与对物欲的渴望之间的巨大距离；而于连的思想矛盾更具复杂性：那是一种典型环境造就的典型性格，是下层人民反复辟情绪与贵族专横腐化现实的尖锐冲突的折射。","keywords":"都有志向有雄心 都以个人名利为前提 具有敢于冒险的英雄主义热情 人生追求不同 性格不同 奋斗手段不同","note":""},{"id":"152","stars":"★★★","title":"结合斯丹达尔和巴尔扎克作品，论述他们塑造人物、构造情节方法的异同","body":"斯丹达尔与巴尔扎克同是19世纪法国批判现实主义作家，但受个体审美心理机制的制约，二者塑造人物和构造情节的方式各有侧重，表现在以下方面：\n\n一、人物塑造方面\n\n（一）人物数量不同\n\n斯丹达尔刻意展示的是人的心灵世界，故他喜欢集中笔墨塑造一两个典型。例如《红与黑》就着重刻画于连形象。\n\n巴尔扎克则采用“人物再现法”，在他的“人间喜剧”里共生活着2400多个人物，囊括了19世纪法国社会生活的众生相，如高布赛克、葛朗台、纽沁根、拉斯蒂涅、鲍赛昂夫人、伏脱冷、夏倍上校等。\n\n（二）人物类型不同\n\n斯丹达尔塑造的主人公都是强者，他们要追求幸福，认为这是天性使然。他们个性坚强，激情满怀，毅力过人，企图使世界屈服于自己的准则。\n\n巴尔扎克则喜欢夸张地描写人的情欲，把某种情欲强化，凝聚在一个人的身上，让这种情欲排除其他感情，发展到病态程度，在这种文学形象的画廊里增加了一批著名的“偏执狂”。如父爱成狂的高里奥，阴险偏狭的贝姨等。\n\n（三）塑造视角不同\n\n斯丹达尔自称为“人心的观察者”，始终把人的心灵世界作为对象进行细致的观察和解剖，深刻发掘人类心灵的隐私，努力寻找激荡在人心中的任何情感因素，注重心理分析。他善于以冷峻的目光将人物放置于社会解剖的手术台上，细致入微地揭示出复杂人物的内心冲突。他的心理描写通常十分简短，却是多种多样的。斯丹达尔注重捕捉具有激情的人物内心世界的细腻变化，开创了现实主义文学内倾性的方向，也预示了20世纪文学“向内转”的新特点。\n\n巴尔扎克则把视野聚焦于社会，并以自己丰富的想象和对世界上一切人与事物的博闻强识来表达自己的认识和感受。他擅长研究与把握事物的外部特征，对社会外部形态的广阔而真实的描绘，是巴尔扎克现实主义的一大特色，但是，巴尔扎克同时也关心人的精神与心灵世界，只是，他对人的研究不像斯丹达尔那样直接深入人的内心世界，而往往从描写所处的环境和外部形态开始；他更注重于研究人的心灵怎样在社会外部物质形态的刺激影响下产生惊人的变化，尤其是金钱时代，人的灵魂怎样在金钱的催化下引起奇妙的“裂变”。\n\n（四）人物与环境关系不同\n\n斯丹达尔善于使人物性格的形成和发展与人物活动的环境紧密相连，典型的环境为人物性格的形成和发展提供了合理的依据。不过，人物的性格演变并不是被动地由环境决定的，而是既受制于环境的作用，又决定于性格系统内部的驱动力，是内因与外因共同作用的结果；环境的作用是性格演变的前提，性格系统内部的驱动力是性格演变的根据。因此，在斯丹达尔笔下，性格与环境的关系是辩证的。这使得《红与黑》这部作品不仅塑造了一系列栩栩如生、富有鲜明个性的典型形象，而且使整部作品具有浓郁的时代气息。\n\n而在巴尔扎克的小说中，无论是物质环境还是社会环境，对人的性格都起着决定性的作用。他笔下的主人公，几乎始终处于物质环境和社会环境的重重包围之中。他们与环境有搏斗，但又无法高于环境和超越环境，而往往是被环境战胜、改造和重塑。他们与环境搏斗的过程，在终极意义上成了向环境学习并顺应环境的过程，性格的形成、发展和演变依赖于、受制于环境，甚至是环境的直接引申。\n\n二、情节结构方面\n\n斯丹达尔的文学创作结构从传统的封闭结构向现代开放结构过渡。例如作品《红与黑》以于连的爱情、仕途为发展线索，重点描写了他在小城、省城、巴黎和监狱4个场景，主干明显，疏密得当。《红与黑》摆脱了纯粹按照时间延续安排情节的格局，向着“空间”长篇小说过渡。作品表现的是1830年这样一个特定时代在空间和时间上的心灵变化，时间、地点的迅速变换，人物的忽隐忽现，呈现出现代因素，使小说平添了现代小说“心理结构”的特征。\n\n巴尔扎克开创了西方小说新的结构模式。19世纪以前的西方小说，基本上采用“流浪汉小说”的结构模式，以单一线索纵向直线型演进为特色，通过一条纵向线索贯穿一个个独立的小故事，来反映生活的流程。巴尔扎克小说的结构模式则不同，它通过众多的情节线索有机的交织，形成纵横交错的情节网络，立体地展示生活的横断面。这种网状结构模式既有助于反法日益复杂的社会生活，也有助于描写多元复杂的人物性格，合乎时代对小说发展提出的要求。因此，这种结构模式在巴尔扎克之后被广泛采用，这也标志着西方小说在结构上的发展与成熟。","keywords":"人物塑造 数量 类型 视角 与环境关系 情节结构 主干明显 心理结构 众多线索 网状结构","note":"这是2023年陕西师范大学考查过的一道真题。斯丹达尔和巴尔扎克作为批判现实主义的两位大家，创作方面必定是同中有异，异中有同。回答这类题目，需要大家对两位作家都有一定了解，再结合相关作品来谈即可。"},{"id":"153","stars":"★★★","title":"《包法利夫人》的思想价值及艺术特色","body":"《包法利夫人》是19世纪法国批判现实主义作家福楼拜的代表作，是现实主义文学中的一部力作，副标题是“外省风俗”，讲述的是法国外省一个富裕农民的独生女爱玛的悲剧性的一生，其思想价值与艺术特色如下：\n\n一、思想价值\n\n（一）控诉恶浊鄙俗的社会\n\n作者以现实主义的深刻描绘，指出爱玛的悲剧是社会造成的。爱玛本是一个小资产阶级女子，本性纯洁，但是社会环境和社会影响把她一步步引向毁灭。修道院违背常情的宗教生活戕害了她稚弱的心灵，浪漫主义文学作品又使她对爱情生活充满虚妄的遐想。待她走进社会以后，狭隘闭塞、单调沉闷的外省环境和缺乏精神生活的家庭，不能满足她感情生活的要求；而淫靡享乐的社会风气，进一步腐蚀了她的心灵，使她对上流社会腐化堕落的生活悠然神往，终于在罗道耳弗的引诱下，走上了堕落的道路\n\n（二）分析艾玛悲剧的物质原因\n\n作者在小说中不但写出了爱玛堕落和毁灭的社会原因，而且分析了它的物质基础。罗道耳弗和赖昂对爱玛的背叛，不只是由于他们堕落的生活态度，而且是对金钱、地位的利己主义计较的结果。作者在小说中每写爱玛的一次爱情生活，就调转笔锋写一次高利贷者的钻营行径，以此强调了造成爱玛悲剧的物质原因。爱玛是被无法偿还的巨大债务和一次次的爱情幻灭引向灭亡的。小说通过爱玛的悲剧既控诉了资本主义社会金钱关系的罪恶，又有力地揭露了资本主义社会精神生活的空虚和堕落。作者认为爱玛的悲剧带有普遍性。\n\n二、艺术特色\n\n（一）符合典型环境中的典型人物原则，但有独特之处\n\n在典型的塑造上，作者更注重精神气质的描绘，而不是性格特点的刻画。爱玛的耽于幻想，包法利的浑浑噩噩，郝麦的讲求实际，都是从人物的精神状态和特点去表现的。\n\n这种精神气质的形成同环境存在密切关系，换言之这是环境的产物。因此，福楼拜刻画的仍然是典型环境中的典型人物。在环境描写方面，作者将环境描写融合到情节的叙述中，与人物塑造有机地结合起来。农业展览会一章是环境与人物塑造紧密结合的成功范例。\n\n（二）遣词造句精美贴切\n\n《包法利夫人》文字的精美在法国小说中可以说首屈一指，名句不胜枚举。福楼拜用“像人行道一样平板”来形容包法利谈话的平庸；爱玛渴望爱情，“就像厨房桌子上一条鲤鱼巴望水”，比喻贴切，声音铿锵，都是不易之句。此外，郝麦的夸张用语，罗道耳弗的甜言蜜语，女掌柜的生动词汇，都符合人物身份，极见功力。福楼拜还十分重视段落的安排和前后文的配搭关系。\n\n（三）叙述角度力求变化\n\n福楼拜经常在白描与人物感受之间进行转化，这种角度转化被称之为电影手法。农业展览一章中，全景描写与摇扫镜头的交替使用，特写镜头与中心场面的轮流交换，都是典型的电影手法。\n\n（四）结构创新\n\n全书分成基本对称的两部分，按女主人公的经历来安排，她的发展至农业展览会形成高潮，然后走下坡路，直至结尾。这种均衡的配置使得全书的结构非常稳固，有别于其他小说。","keywords":"思想价值 控诉社会 物质原因 艺术特色 典型环境中的典型人物 精神气 情节叙述 遣词造句精美贴切 叙述角度力求变化 结构创新","note":"《包法利夫人》是福楼拜的代表作品，其思想内容是通过对爱玛人生悲剧的展示与剖析，表达对当时资本主义社会的批判。而它的艺术特色，我们则要从人物塑造、语言、叙述角度和结构几个方面进行分析，要注意结合作品内容。此外，作品也会以名词解释的形式出现，大家要注意灵活应对。"},{"id":"154","stars":"★★★★","title":"以《包法利夫人》为例，谈谈福楼拜的创新及其对后世的影响","body":"一、创新\n\n（一）新的理论主张\n\n在艺术上，福楼拜提出和实践一套新主张，既包含巴尔扎克式的现实主义，又探索了一种对现代小说审美趋向的超越性意识，展现出后现代主义文学的先驱性。\n\n（1）追求真实性\n\n福楼拜特别重视对材料的搜集。他认为：“美学就是真实......现实并不屈从于理想，而合于理想。”他又说：“只有在真实的情况下才是理想的，只有进行概括才能真实。”因此，他认为材料是作家写作压倒一切的条件。福楼拜使小说创作向极端准确的方向发展，可以说是材料派的第一位大师。据研究，《包法利夫人》小说来源于一个真实的故事。其中，爱玛的丈夫包法利的原型正是福楼拜父亲手下的一位实习医生。在写作《包法利夫人》的时候，福楼拜就以临床医学者的身份对爱玛悲剧中所发生的一切都做了缜密的调查研究。\n\n（2）追求客观态度\n\n福楼拜指出：“伟大的艺术是科学的和客观的。”他认为作家要像天主一样隐身不见，不在作品中露面。在《包法利夫人》中，他为了追求客观的叙述效果，采用了克制、中立的方式讲述故事，在叙述角度上进行了大胆创新，打破了传统的现实主义文学权威叙述人全知叙事的模式，采用了多种视角叙述，并在其中进行灵活转换。在语言上，大量运用自由间接引语模糊叙述人语言和人物语言的界限，取得了客观而又含蓄隽永的独特效果。这并不是说，作家的态度绝对不能融化到人物身上，相反，作家在写作时要设身处地想象人物的活动。福楼拜在写到爱玛自杀时就产生过吃毒药的感觉，于是禁不住呕吐起来。\n\n（3）追求艺术美\n\n福楼拜认为：“艺术的目的，首先是美。”因此他对形式美极为重视。不过，他能正确认识形式与内容的关系，强调形式与内容的统一。福楼拜把自己比喻成一个珍珠采集者，一丝不苟、不厌其烦地锤炼句子，采集语言的珍珠。《包法利夫人》文字的精美在法国小说中可以说首屈一指，名句不胜枚举。不仅比喻贴切，声音铿锵，同时不同人物的语言都符合人物身份，极见功力。\n\n（二）新的创作特征\n\n（1）符合典型环境中的典型人物原则，但有独特之处\n\n在典型的塑造上，福楼拜更注重精神气质的描绘，而不是性格特点的刻画。爱玛的耽于幻想，包法利的浑浑噩噩，郝麦的讲求实际，都是从人物的精神状态和特点去表现的。\n\n在描写环境方面，福楼拜不像巴尔扎克那样往往独立成章，大段描写，而是将环境描写融合到情节的叙述中，与人物塑造有机地结合起来。农业展览会一章是环境与人物塑造紧密结合的成功范例。人物在不同的地方活动，经历了不同的历史时期，但整个社会环境没有多大变化，这种环境自然而然对人物的精神和命运产生决定性影响。福楼拜的写法较之前人无疑更为高明。\n\n（2）叙述角度力求变化\n\n福楼拜经常在白描与人物感受之间进行转化，这种角度转化被称之为电影手法。农业展览一章中，全景描写与摇扫镜头的交替使用，特写镜头与中心场面的轮流交换，都是典型的电影手法。\n\n（3）小说结构上的创新\n\n《包法利夫人》全书分成基本对称的两部分，按女主人公的经历来安排，她的发展至农业展览会形成高潮，然后走下坡路，直到结尾。这种十分均衡的配置使得全书的结构非常稳固，有别于其他小说。\n\n二、对后世的影响\n\n福楼拜提倡真实与美的艺术准则，确立了新的艺术法典。体现了从现实主义向自然主义的过渡。在法国文学史上，福楼拜被视为19世纪中期现实主义文学和末期现代主义文学之间的“桥梁”。\n\n（一）福楼拜对“客观而无动于衷”美学原则和创作方法的倡导，直接影响到19世纪中后期的自然主义文学。\n\n（二）福楼拜对文学形式美的强调，以及他对严谨精致的语言风格的追求，为19世纪后期的唯美主义、象征主义推崇形式美奠定了基础。\n\n（三）福楼拜对叙事进行的创新性尝试，为现代小说技巧的创新作出了贡献，被称为“当代小说的真正发明者”“是19世纪中期以来最重要的技巧进步的源泉”。\n\n（四）福楼拜小说描写内容和对象向平庸的日常生活转变，反映了他对迅速发展的资本主义社会及其价值观念的失望情绪和否定态度，开启了19世纪后期、20世纪初期现代主义文学对西方文化价值观念的批判与反思。","keywords":"创新 理论主张 追求客观态度 追求艺术美 追求真实性 典型人物注重精神气质 典型环境融合到情节叙述中叙述角度力求变化 结构创新 影响 自然主义 唯美主义 象征主义 现代小说叙事技巧 平庸的日常生活","note":"福楼拜的小说创作承前启后，既发扬了巴尔扎克式的现实主义传统，又开创了一种文体更为精湛、严格的小说艺术，直接引导启发了后代小说家的创作，他把小说引向了更为宽阔的领域，小人物的描写、新的创作手法的运用，直接引发了法国以及欧洲小说界的重大变革，是世界小说发展的重要转折点，是现代新小说派的开山祖师。此外，关于“如何理解福楼拜说“我就是包法利夫人’”这类问题，也是在变相考查福楼拜的文学主张，相关内容可在李凡文学正版群中获取。"},{"id":"155","stars":"★★","title":"比较堂吉诃德与包法利夫人的形象大","body":"一、不同点\n\n（一）包法利夫人是以现实主义典型化手法塑造的带有悲剧性的普通人\n\n包法利夫人是一户农民的独生女儿，自幼热爱浪漫主义文学，父母把她送到修道院接受贵族教育，母亲死后，她回家帮父亲料理家务。在她生活的小镇里，医生更受人尊敬，所以父亲做主就把爱玛嫁给了包法利医生，婚后由于对生活和丈夫平庸的不满，以及对资产阶级和浪漫主义向往，她开始并沉浸在偷情生活中，同时借了大笔的债来满足放荡的生活，终至债务缠身无法解脱，被迫自杀。\n\n（二）堂吉诃德是以虚构夸张的方式构造的内涵极为丰富复杂的象征性人物\n\n堂吉诃德是乡村的一个小绅士，因为沉迷于骑士小说，幻想自己是个中世纪骑士，最终从梦幻中苏醒过来，回到家乡后死去。堂吉诃德身上具有英雄气和正直无私的品格，他也有为理想而献身的执着精神。他的形象具有明显的滑稽意味，他似疯非疯，滑稽中有崇高，渺小中有伟大，喜剧性格与悲剧性格融为一体。\n\n二、相同点\n\n（一）包法利夫人和堂吉诃德两人都是用幻想指导生活\n\n包法利夫人和堂吉诃德两人都深受小说影响，憧憬书中的生活，不切实际地去追求幻想中的世界，导致理想与现实相脱离、主观与客观相分裂。\n\n堂吉诃德好读骑士小说，在现实生活中模仿骑士的行为，三次出门游侠，做了诸多荒唐可笑的事。包法利夫人装满了对贵族生活和浪漫爱情的遐想，为寻求理想的爱情，堕入放荡的深渊。\n\n（二）包法利夫人和堂吉诃德都以悲剧结尾\n\n堂吉诃德十分偏执，在他看来，他的主观所想就是客观现实，他不会随便听从别人的劝说而改变看法。在他陷入骑士道的幻想之后，一些好心的帮助者和恶意的捉弄者假戏真做。比如，公爵夫妇动用大批人力物力装扮成魔法师在林中出现等，人为地给现实蒙上一层虚幻色彩，更使堂吉诃德误以为现实和他头脑中的现象吻合了，因而更加执着地推行他的骑士道。而堂吉诃德在临死前突然清醒，明白自己这一生被骑士小说深深地误导了。\n\n包法利夫人自幼扎根于心底的浪漫主义思想在参加完侯爵的舞会后彻底进发，她看到了理想与现实的差距，不顾一切地去追寻心中所想，最终债务缠身，被情人抛弃，服毒自杀。爱玛临终前终于明白，她永远和贵族及浪漫爱情无缘，她一生的幻想完全破灭了。","keywords":"用幻想指导生活 现实主义典型化手法 虚构夸张 理想与现实相脱离 主观与客观相分裂 悲剧结尾","note":"塞万提斯的《堂吉诃德》和福楼拜的《包法利夫人》这两部经典文学作品，虽然时代背景不同，但都创造性地塑造了一种纯粹的理想主义者，相关内容可参考陈小蝶《文本细读下的理想主义-＜堂吉诃德）和（包法利夫人）的比较》、刘武和《“女性的吉诃德”-包法利夫人》，资料可在李凡文学正版群中领取。"},{"id":"156","stars":"★★★","title":"简要划分狄更斯的创作阶段","body":"狄更斯一生共写作了百余篇短篇小说，几十篇中篇小说，15部长篇小说，还有大量的散文、特写、游记、剧本、演讲、书信，等等。除了诗歌，当时所有的文学体裁他几乎都尝试过，但成就最高的还是小说，特别是他的长篇小说。根据他的生平与创作实际，可以把他的创作分为三个时期：\n\n一、第一时期：1837-1841年\n\n从1837到1841年，狄更斯接连发表了《匹克威克外传》《奥立佛·退斯特》《尼古拉斯·尼克尔贝》《老古玩店》《巴纳比·拉奇》5部长篇小说。\n\n这一时期作者正处于青春年少，事业蒸蒸日上，对社会的认识还比较肤浅。他把生活看作是善与恶之间的斗争，同时认为恶是个别现象，并且最终为善所克服。反映在其创作中，就是这一时期小说的基调是乐观向上的。\n\n在艺术方面，狄更斯这一时期的小说受流浪汉小说的影响比较突出，作者自己的创作风格虽已形成，但尚待进一步完善、成熟，特别是在小说结构与人物塑造方面，作者还未完全把握得住。这一时期虽然大都是鸿篇巨制，然而结构还比较松散，人物塑造艺术有待进一步圆熟。可是，作品对人性探索的深刻和浓重的幽默，从一开始就十分突出，部分地弥补了上述不足，\n\n二、第二时期：1842-1858年\n\n这一时期时间跨度最大，作品也最多，狄更斯共创作了《马丁·朱述尔维特》《董贝父子》等6部长篇小说。就创作密度看，作者的创作速度显然放慢了，但质量却有所提高。特别是《大卫·科波菲尔》《荒凉山庄》《艰难时世》《小杜丽》，部部都是杰作。\n\n1842年，狄更斯首次访问美国，但却对这个梦想中的自由民主的天堂大失所望。幻想的破灭使他加深了对社会的认识，并促使他进一步观察、思考。他不再把恶看作是个别现象，而是把它与整个社会体制特别是政治与法律体制联系起来。他仍然相信善、强调善，但已开始认识到善不一定总是能战胜恶。这一时期的作品，总的基调仍是乐观的，不过其中已露出一丝悲凉之音。\n\n在艺术上，这一时期作者的小说已经成熟，完整的风格已经确立。从《马丁·朱述尔维特》开始，小说的情节不再由人物的经历所决定，而是有了一个总的事件和框架。到了《荒凉山庄》，这种结构上的完整性就更为明显。人物塑造的艺术也更为成熟，出现了一系列成功的人物形象。这一时期，狄更斯对人性的探索进一步深入，但由于作品冷峻的一面有所加强，小说的幽默受到一定的影响。\n\n三、第三时期：1858-1870年\n\n这一时期共创作了《双城记》《远大前程》《我们共同的朋友》《艾德温·德鲁德之谜》4部长篇小说。最后一部没有完成。\n\n由于对社会黑暗的认识进一步加深，加上年龄的增长，婚姻爱情生活上的不幸等，狄更斯思想中抑郁的一面有所增强。反映在创作中，乐观的基调大大削弱。善，仍然战胜了恶，但经历了一个曲折的过程，有的甚至不得不采取某些“恶”的形式。正面主人公仍然得到好的结局，而达到这结局的过程不仅饱经磨难，而且总是需要付出一定的有时甚至是惨重的代价。与此同时，小说中还常常出现一些与过去、死亡、衰败联系在一起的意象，给小说增添了冷峻的色调。\n\n这一时期的小说艺术上仍有发展。《双城记》《远大前程》的结构都异常严谨。早、中期小说中已经出现的侦探、破案的成分，这一时期大大增强。《艾德温·德鲁德之谜》从类型上看基本上是一部破案小说。与此相关，悬念的作用大大加强，不仅是一种写作手法，而且成为结构故事的重要手段。幽默在这一时期则有所削弱，与早期小说《匹克威克外传》等相比，它更多地表现在作者的行文、描写上，较少地出于人物性格的本身。","keywords":"第一时期 乐观向上 艺术尚未成熟 第二时期 悲凉之音 艺术成熟 幽默受影响 第三时期 乐观削弱 悬念 幽默削弱","note":"分析一部作品要做到知人论世。掌握狄更斯创作的阶段特征以及不同阶段的代表作品，对大家去分析没有读过的作品很有帮助。因此，这部分内容，需要大家有所了解。"},{"id":"157","stars":"★★★★★","title":"狄更斯小说的创作特征","body":"狄更斯的长篇小说代表了19世纪英国现实主义文学的最高成就，同时为英国小说创作的发展和繁荣作出了重要贡献。其创作特征如下：\n\n一、思想特征\n\n狄更斯小说的思想内容是丰富而复杂的，但有三个基本的侧面。首先，是对维多利亚时代英国资本主义社会的批判。其次，是对伦理道德的提倡与弘扬。第三，是对人性的广泛而深入的探索。而贯穿这三个方面的则是作者的人道主义思想。人性是狄更斯人道主义的基础与出发点，道德是狄更斯人道主义思想的主要内容，对社会的批判是狄更斯从人道主义出发对社会进行观察和评价的结果。在人道主义思想的统率下，三个方面既各自独立，又互相联系、配合，共同形成一部复杂而又和谐的三重奏。\n\n二、艺术特征\n\n（一）侧重当代题材\n\n狄更斯不再故意虚构惊心动魄的情节和顶天立地的英雄，而是把现实的社会生活作为自己取材的对象，竭力挖掘其中的内涵，发现其中蕴含着的美与魅力。他的小说充分显示了文学的社会功能。他不仅用自己的作品反映生活，而且评价和干预生活。他从人道主义思想出发，本着艺术家的良心，对社会的黑暗与不公正进行了坚决的揭露和批判，产生了巨大影响，直接促使一些弊端的消除。\n\n（二）人物塑造鲜明\n\n狄更斯笔下的人物性格鲜明独特，具有明显的特色，具体表现在5个方面：人物性格的单层次、人物本质的确定化、人物形象的基调化、人物的明晰性、深厚的人性内涵。\n\n（1）头两个特点与狄更斯喜欢从道德的角度描写人物有关。人物的性格是复杂的，其中既有道德的因素，又有政治、阶级、经济等方面的因素，呈现出复杂的多层次的状态，但狄更斯侧重描写的，往往是人物的道德层次。由于这一层次过于突出，其他层次相对而言便显得不够重要，从而使人物性格呈现出单层次的特点。\n\n（2）另一方面，狄更斯小说人物的道德内容又是分层次的，其核心层次是高尚、诚实、仁爱。狄更斯笔下人物身上其他层次的道德因素仍然是人物固有的品质。这样从道德的角度看，狄更斯笔下的人物一出场本质便被确定下来，“终生”不再改变。单层次和确定化造成了狄更斯笔下性格单纯、静止的人物比较多。但是它们也不限制人物性格的复杂与发展。\n\n（3）基调化指的是以艺术形象中的某个方面、部分或特征作为中心贯穿整个艺术形象并使该形象的各个方面都吻合这个中心。比如《艰难时世》中的葛擂硬，他的性格的基本特征就是他的“事实哲学”。他只相信事实，只尊重事实，只讲事实，只要求事实。他的言行、外貌、住房以及所生活的集煤镇，都被打上了“事实”的烙印。\n\n（4）明晰性是指人物的感性表象能比较好地表现其理性内涵。狄更斯笔下的人物，其性格虽然有的单纯，有的复杂，但其本质、评价、价值取向都比较明显，读者比较容易把握，他们的性格比较符合理性与常识，非理性的因素比较少，人物的外部表现与内在本质比较一致。自然，明晰不等于性格没有深度，在明晰的同时也可达到深厚的内涵。\n\n（5）狄更斯小说人物具有深厚的人性内涵。这有两层意思，一是说他们有着丰富的人性内容，一是说他们的人性内容有着很厚的深度。狄更斯善于挖掘人物身上隐含的人性因素，并通过它们来反映人性中某些普遍性的倾向和规律性的东西。\n\n（三）感受型的现实主义\n\n在创作方法上，狄更斯是个现实主义者。但他不是像福楼拜那样严格地按照现实生活的本来面貌进行描写，而是侧重描写自己感受到的生活和自己生活中的感受，可以称为感受型的现实主义。感受型现实主义的总的特点是侧重表现作家感受到的生活，同时遵循生活的本来面貌。具体到狄更斯，表现在三个方面：\n\n（1）侧重生活的奇异面与遵循生活的本来面貌的有机结合。狄更斯描写现实生活，但他选择的往往是生活中罕见、特殊、戏剧性的内容，而在描写这些内容时，又是严格遵照生活的本来面貌的。\n\n（2）主观的生活进程与客观的生活逻辑的有机结合，狄更斯小说中的生活进程，在总体上总是按照作者的主观意图发展的，但在对具体的生活事件的描写中，作者又严格遵循着现实生活的逻辑。\n\n（3）重视细节的真实和强调主观的介入的有机结合。狄更斯小说中的细节繁复丰富，真实客观而又具体。为了表达自己的感受，作者又常常通过带着褒贬的描写，直接的议论、抒情等表达自己的思想感情。\n\n（四）多元整一的典型结构\n\n所谓多元，指的是多个叙事单元，所谓叙事单元，是由一定的人物、事件和背景组成的一个具有内在自足性和内在独立性的故事。这里的内在自足性指故事本身是完整的，有着组成一个故事所必需的要素。内在独立性是指故事不依附或包含在其他故事之中。\n\n所谓整一，是指小说虽然由几个叙事单元组成，但又通过人物、线索、情节等的联系、渗透组成一个统一的整体。狄更斯成熟的长篇小说大都具有多元整一结构，如《荒凉山庄》《大卫·科波菲尔》《双城记》等。\n\n（五）幽默\n\n幽默是狄更斯小说魅力的重要来源之一。这种幽默的内在机制是矛盾。作者善于运用矛盾，显示事物的不协调、不相称，突出事物的荒谬、滑稽、可笑之处，引起读者的回味与思考，同时打破读者的期待视野，使其发生意外的转折，从而产生强烈的喜剧效果。作者还常常运用夸张，把人物和情节场面中隐含的幽默因素放大、突出出来，从而产生强烈的效果。狄更斯小说中的幽默往往包含讽刺、滑稽的因素，形成自己的特色。\n\n（六）内心世界的外化\n\n在内心描写方面，狄更斯不大直接展示人物的内心世界。他一般不像意识流作家那样，把人物微妙复杂的内心活动直接展示在读者面前。但他善于通过人物的外部表现如表情、行动、语言，以及作者的叙述等，把人物的内心世界暗示出来。这\n\n种方法可以称为内心世界的外化，它所反映的人物的内心世界仍是丰富多彩、千变万化的。这也并不意味着狄更斯小说中没有心理描写。《大卫·科波菲尔》对儿童心理的出色描写，可以与任何心理大师笔下的心理描写相媲美。\n\n（七）粗线条的故事讲述与细腻的心理刻画相结合\n\n狄更斯把英国长篇小说提高到成熟的高度。在他之前，斯摩莱特、斯威夫特、菲尔丁侧重故事的讲述，描写是粗线条的.以理查逊、斯泰恩为代表的小说家侧重人物心理描写，刻画比较细腻。狄更斯吸收了两者的长处。\n\n（八）大众化\n\n狄更斯使小说成为真正大众化的艺术形式。他通过连载，使小说走进千家万户。","keywords":"思想特征 社会批判 人性探索 人道主义思想 艺术特征 当代题材 人物塑造鲜明 感受型的现实主义 多元一的典型结构 幽默 内心世界的外化 粗线条的故事讲述与细腻的心理刻画相结合 大众化","note":"狄更斯对英国小说的发展主要集中在长篇小说上面，他不但使英国长篇小说走向成熟，而且通过连载，使小说去进干家万户，使小说成为真正大众化的艺术形式，并且充分显示了文学的社会功能，促进了英国小说向前发展。郑克鲁版教材对这部分内容作了逻辑清晰的列举，需要重点掌握。"},{"id":"158","stars":"★★★★","title":"试述《双城记》的思想主题及艺术特征","body":"一、思想主题\n\n《双城记》是部历史小说，但处理的却是现实问题。狄更斯深切地感受到当时英国社会矛盾的尖锐、贫富的悬殊，下层群众中普遍存在着的愤懑与不满，觉得情况与法国大革命前的法国有些类似。他担心英国爆发像法国大革命那样的革命，故以法国大革命为背景，写出《双城记》，向英国统治阶级提出警告，呼吁改良，要求缓和社会矛盾。\n\n（一）探讨法国大革命爆发的原因，肯定法国大革命的正义性\n\n狄更斯指出，法国大革命的爆发是贵族阶级的腐朽、残忍、飞扬跋扈的结果，是下层人民长期仇恨的总爆发，小说通过厄弗里蒙地侯爵、“朱古力爵爷”的荒淫、奢侈、残暴，梅尼特医生和得伐石太太一家的苦难遭遇，雄辩地说明了这一点。由此写出法国大革命的爆发是必然的，也是正义的。\n\n（二）反对革命暴力和大规模的群众运动\n\n作者虽然肯定了法国大革命的必然性与正义性，却反对革命暴力和大规模的群众运动。在作者看来，大规模的群众运动是可怕的，运动中的群众是疯狂的、盲目的、丧失理智的。在小说中，他通过大量的描写表达了这一观点。如群众跳“卡尔马纽尔”舞的场面、法庭审判的场面。作者认为暴力并不能改造社会，反而伤害了无辜。不仅代尔那、露茜、卡尔登等无辜者受到革命暴力的伤害，连真心拥护革命的孤苦伶仃的女缝工也被送上了断头台。正因如此，作者对贵族和革命的领导者们都作了否定的描写，把他们统统称作压迫者。\n\n（三）宣扬个人的道德修养和道德感化\n\n在狄更斯看来，只要大家的道德水准提高了，人人讲究仁爱、宽恕，社会就会美好起来。因此，他一面不厌其烦地宣传自己的道德理想，一面塑造了梅尼特、代尔那、卡尔登、露茜、劳雷等一系列道德高尚的人物，作为人们学习的榜样。实际上，道德不仅是小说思想内容的基本方面，也是小说描写、评价人物、事件的出发点。\n\n二、艺术特征\n\n（一）典型的多元整一结构：严谨有序\n\n《双城记》由5个叙事单元组成：梅尼特一家的故事；得伐石夫妇的故事；厄弗里蒙地家族的故事：卡尔登的生活与献身；克朗丘的生活与经历。5个单元之间虽有紧密联系，但并不互相包含或隶属，而是互相独立、平行发展的。\n\n另一方面，5个单元又是整一的。它们各自独立，同时又相互联系、交叉、渗透。从结构的角度看，这种整一主要是由人物、情节和线索三种因素形成的。如情节分开来看，《双城记》的叙事单元各自具有内在自足性；而合起来看，它们又是互相联系的。如卡尔登为了露茜的幸福，移花接木，换取了代尔那的出逃，从而把小说推向高潮。\n\n（二）侧重描写感受世界的现实主义创作方法\n\n为了如实反映法国大革命，狄更斯阅读了大量的原始材料，所以关于大革命的描写才那样真实具体。另一方面，为了表达自己的意图，他又对生活进行了某种程度的变形。如厄弗里蒙地侯爵兄弟奸淫农妇、杀死农民，又把告发者关进监狱的情节，是他对生活的原貌作了符合自己主观意图的改动，这种改动是成功的。在小说中，狄更斯投入了丰富的感情。他通过带着褒贬的描写、议论、抒情等把自己的思想、感情毫无保留地表达出来。如在塑造得伐石太太时，前后态度的变化。\n\n（三）悬念与象征的艺术手法\n\n小说中不仅有大的悬念，如梅尼特与厄弗里蒙地家族的关系，以及他在狱中写下的那份文件，而且有不少小的悬念，如克朗丘的盗墓。在小说中，随着主要悬念的逐渐解开，过去的事件也一件件被翻起，情节一步步向前发展。到梅尼特医生被关进巴士底狱的原因与经过被彻底揭出，情节也就急转直下，最后，以卡尔登的从容就义收束全书。\n\n在小说中，作者常采用象征手法暗示某种意象或预兆，渲染气氛。小说第5章对流淌在圣安东尼区狭窄街道上的酒的描写是著名的。酒是红的，鲜红的酒象征着鲜红的血，它暗示着法国大革命即将到来，象征着狂暴的群众运动即将开始。\n\n此外，《双城记》对攻打巴士底狱、法庭审判等群众场面的描写，对顺序、插叙、倒叙等叙述方法的灵活运用，都是很出色的。","keywords":"思想主题 探讨法国大革命爆发的原因 肯定法国大革命的正义性 反对革命暴力和大规模的群众运动 宣扬个人的道德修养和道德感化 艺术特征 典型的多元整一结构 感受世界的现实主义 悬念与象征","note":"西安外国语大学在23年对这部分内容做了细致考查。狄更斯一生的创作在思想方面经历了一个发展过程，与此相伴随，他的写作技巧渐臻圆熟，艺术风格也可以说发生了很大变化。1859年所作的《双城记》不但从思想内容上看是狄更斯最重要的作品之一，同时也最能代表他后期的创作风格。结合小说的主题思想探讨其艺术特色，更有助于我们全面认识狄更斯的创作个性。"},{"id":"159","stars":"★★★","title":"从《双城记》看狄更斯的人道主义思想","body":"在《双城记》这部小说中，狄更斯以法国作为社会背景，以此来映射英国当时的社会情况，同时针对伦敦、巴黎对应的阶级斗争情况进行了全面的阐述，以求为同时代的英国人提供借鉴。作者全面阐述各个社会阶层对应的命运变化，充分展现了他对于人道主义精神的认知和理解。\n\n一、人道主义思想在《双城记》中的体现\n\n（一）梅尼特\n\n梅尼特是狄更斯笔下始终坚持人道主义信念的典型代表。梅尼特去侯爵家看诊，目睹了漂亮农妇的惨死情景，向朝廷揭发侯爵兄弟的罪行，却被关进巴士底监狱整整十八年。但出狱后女儿露茜却爱上了代尔那，这使他陷入了巨大的痛苦和矛盾之中。后来代尔那被判处死刑，梅尼特原谅了侯爵兄弟的恶行，并且通过自己的影响解救代尔那。狄更斯通过对这一系列细节的描述，表现了梅尼特的博爱思想。为了突出这个人物形象，作者甚至将他塑造成不论敌友都平等对待的形象。可以说，梅尼特身上充分彰显出惩恶扬善的精神理念，从侧面展现狄更斯的以德报怨思想，充分展现了狄更斯的人道主义原则。\n\n（二）露茜\n\n露茜对身边每一个人都持有一颗真诚之心，善良地与他人相处。露茜幼时悲惨的遭遇并没有改变她的个人品质，她依然善良温柔，关怀他人。她用爱去感化父亲，促使他再次获取生的希望；用善良去开导自暴自弃的卡尔登，打开了卡尔登封闭已久的内心，使他拥有了生活的勇气。露茜不仅是博爱的化身，还是勇气的代表。当露茜得知丈夫代尔那被关进监狱时，她义无反顾地去法国解救丈夫。露茜的形象体现了狄更斯的人道主义精神，用仁爱之心去爱他人、爱社会。\n\n（三）代尔那\n\n代尔那属于贵族阶级当中的反叛者，是《双城记》中具有丰富理想主义的代表人物。代尔那对自己家族曾犯下的过错感到愧疚和痛苦，并拒绝相应的权力、地位，独身一人进入到英国，在面临权力与地位时，充分彰显出自身对于人道主义精神的崇尚。\n\n（四）卡尔登\n\n青年律师卡尔登具有羡煞旁人的才学、智慧，然而因为其本身生活的社会背景，权钱交易的普遍导致卡尔登不得不面临艰难的发展局面。在历经无数次打击以后，卡尔登本身已经放弃了自身对于理想的追求。露茜的出现，使得卡尔登的生活发生了巨大的变化，深埋内心的爱，使得卡尔登愿意付出自身的一切。最终，他代替代尔那上了断头台，抵挡了一种无人可抵的横暴的力量。在卡尔登内心中，只有露茜、梅尼特、代尔那这种善良的群体才是社会未来发展的希望所在，这也是卡尔登愿意付出生命的重要原因。\n\n二、狄更斯人道主义思想分析\n\n（一）真诚地同情劳动人民所受的苦难\n\n在《双城记》中，狄更斯通过阶级对比，证明贵族压迫才是导致底层人民贫穷的重要原因，正是因为这种压迫才引发人民群众的仇恨。这种压迫不仅仅体现在经济层面，也存在于精神层面。众生均有生存的权利正是人道主义的基本理念，狄更\n\n斯能深切地同情下层阶级，对上层阶级充满愤恨，这本身就是人道主义思想的体现。\n\n（二）反对暴力压制一切\n\n作者既肯定革命的必然性和正义性，又反对群众运动和革命暴力，这里明显存在着矛盾，因为一场翻天覆地的变革只有通过群众的暴力革命运动才能实现。狄更斯宣扬个人的道德修养和道德感化。在他看来，只要大家的道德水准提高了，人人讲究仁爱、宽恕，社会就会美好起来。因此，他一面不厌其烦地宣传自己的道德理想，一面塑造了梅尼特、代尔那、卡尔登、露茜、劳雷等一系列道德高尚的人物，作为人们学习的榜样。实际上，道德不仅是小说思想内容的基本方面，也是小说描写评价人物、事件的出发点。纵观上述角色，充分彰显出暴力对人性产生的压抑，从侧面印证出人道主义精神的重要性。\n\n（三）爱是狄更斯人道主义思想的根本\n\n基于对现实情况认知的深入，作者意识到仅仅通过阶级调和难以解决阶级之间产生的矛盾。在上述背景下，作者提出类似宗教信仰方式的人道主义精神-爱，而卡尔登正是这种精神的重要代表。在描述卡尔登生涯的时候，作者将其对于宗教思想的理解充分表达出来，从侧面反映出作者认知的变化，即理想社会的构建仅仅通过梅尼特、代尔那是远远不足的，还必须通过宗教信仰的加持，使得人们产生信念。狄更斯认为，一旦出现信仰缺失的情况，各个阶层的人民均会表现为残暴。所以，作者通过刻画充满仁爱的人物形象，通过博爱的人道主义精神来激发人类内心的正直、善良。通过信仰来缓解阶级矛盾这正是《双城记》中所体现出的人道主义思想精华。","keywords":"自由、平等、博爱 对贵族阶级表现出极大的憎恶与蔑视 深切地关注和同情贫苦百姓的非人命运 具有双重性","note":""},{"id":"160","stars":"★★★★","title":"简述《大卫·科波菲尔》中的现实主义特点","body":"《大卫·科波菲尔》是19世纪英国批判现实主义大师狄更斯的一部代表作，其现实主义特点主要表现为：\n\n一、自传性\n\n《大卫·科波菲尔》是一部带有自传色彩的小说，是移植于自身经历的。少年时代亲身经历的种种成为狄更斯文学创作的源泉。\n\n二、强烈的批判性\n\n狄更斯以写实的笔法揭露社会上层和资产阶级的虚伪、贪婪、狡诈，展示了下层社会特别是妇女、儿童和老人的悲惨境遇，以及开始觉醒的劳苦大众的抗争。随着英国工业革命进程的加快，资本主义社会进入了“维多利亚盛世”的繁荣时期，但资本主义的弊端日益显露，社会两极分化十分严重。上流社会的人们生活极其奢华，而处在社会底层的人生活困顿，难以维持生计，大卫也一直游走于社会两极之间的鸿沟。作品多层次地揭示了当时社会的真实面貌，批判了童工问题、教育问题、孤儿问题、女性地位问题、阶级问题、拜金主义等。\n\n三、充分展现了金钱的罪恶\n\n《大卫·科波菲尔》通过主人公大卫一生的悲欢离合，多层次地揭示了当时社会的真实面貌，突出表现了金钱对婚姻、家庭和社会的腐蚀作用。小说中一系列悲剧的形成都是金钱导致的。摩德斯通骗娶大卫的母亲是觊觎她的财产；爱弥丽的私奔是经受不起金钱的诱惑；威克菲尔一家的痛苦，海姆的绝望，无一不是金钱造成的恶果。而卑鄙小人希普也是在金钱诱惑下一步步堕落的，最后落得个终身监禁的可耻下场。狄更斯正是从人道主义的思想出发，暴露了金钱的罪恶，从而揭开“维多利亚盛世”美丽帷幕背后的社会真相。\n\n四、寄托了作者美好的理想\n\n作品致力于讴歌人性中的真善美，憧憬更美好的社会和更理想的人生。表现出对小人物不幸遭遇的同情和改善他们境遇的善良愿望。小说在批判现实主义精神方面的价值还在于对人性的肯定和赞扬，描写真实而伟大的爱。安妮丝是人性美的化身，她既美丽又体贴，是外在美和内在美的完美结合，是理想的妻子。最终和大卫的完美结合使整个曲折的故事有了幸福洋溢的美好结局，是狄更斯反对“非人道”，赞扬“人道”精神的体现，这与恶人得到的结局形成了鲜明的对比，透露出作者“爱欲其生，恶欲其死”的价值观。\n\n五、揭示了社会存在的诸多问题\n\n作品多层次地揭示了当时社会的真实面貌，批判了童工问题、教育问题、孤儿问题、女性地位问题、阶级问题、拜金主义等，深刻表现了狄更斯的正义感和人道主义情怀，使作品充满鲜明的现实主义色彩。","keywords":"强烈的批判性 充分展现了金钱的罪恶 寄托了作者美好的理想 揭示了社会存在的诸多问题","note":"《大卫·科波菲尔》集中体现了狄更斯的批判性，通过主人公大卫一生的悲欢离合，多层次的展现了金钱的罪恶和社会存在的诸多问题，同时也寄寓着作者对美好理想的期望。这些都是它现实主义特点的体现。"},{"id":"161","stars":"★★★★","title":"请分析简·爱的人物形象","body":"简·爱是夏洛蒂·勃朗特的代表作《简·爱》中的人物，是一个新型女主人公，其形象特征如下：\n\n一、平民女子形象\n\n简·爱是一个出身贫苦的孤儿和一个家庭女教师，她不再是传统小说中那种无病呻吟的上流社会的小姐，而是从广大平民中选取的一个具有代表性的女性形象，更能突出对妇女地位的关注和反思。以这样一个人物作为小说主人公，这在当时确属新型。\n\n二、觉醒女性的典型\n\n简·爱这一形象代表着19世纪正处于萌芽状态的欧美女性运动，表达了来自女性、尤其是出身贫寒的平民女性内心的强烈愿望，即要求男女平等，捍卫自己独立的人格与尊严，以及自由表现自己的爱憎。简·爱渴望并追求自食其力的诚实劳动和独立，她追求自由的爱情。她大胆地爱上了贵族罗切斯特，而当得知罗切斯特已有妻子后，她又果断地离开了他；当圣·约翰向她求婚时，她又断然拒绝，她不执念于感激之情而委屈顺从；最后当罗切斯特的妻子死后，虽然他已双目失明，她却主动向他表白了自己的爱情。所有这些，都显示出简·爱对女性人格尊严的追求，她不仅要维护自己的名誉，而且要维护自己的独立。这正是当时处于觉醒之中的新型女性的特征。\n\n三、勇敢的反抗者形象\n\n这不仅表现在恋爱和婚姻方面她敢于冲破阶级鸿沟，蔑视社会习俗，而且还表现在其他各个方面。譬如，她童年时，寄居舅家，受一家人虐待，她即种下了反抗和质疑精神的种子；她大胆反抗当时所谓的“学校教育”，多次顶撞蛮横无理的院长和学监；此外，在宗教信仰方面，她也是个大胆的反抗者：她不愿嫁给圣·约翰，因为她认为上帝并不能给她带来幸福。这种对传统教育以及宗教信仰的怀疑和抗拒态度，充分反映出新型女性与传统社会之间的冲突，同时也表现出她勇敢无畏的反抗精神。\n\n作者通过对简·爱这个典型人物形象的塑造，既是对不合理的资产阶级的社会的揭露和批判，也表达了女性对独立、平等和自由的强烈渴望。","keywords":"平民女子形象 要求和男子平等 反抗者 独立、自主、坚定的女性形象","note":"简·爱首先是一位平民女子形象，反映了当时平民女性要求和男子平等，追求个人的独立和尊严的思想。同时，她又是一位反抗者，这在众多方面都表现了出来。"},{"id":"162","stars":"★★","title":"论《简·爱》的道德理想和道德追求","body":"夏洛蒂·勃朗特的作品《简·爱》成为女权主义文学的经典之作，其鲜明突出、具有现代色彩的女性主义道德观念和不懈的道德追求，成为这部作品经久弥新的重要原因之一。在这部小说中，通过小资产阶级女性简·爱的成长和婚姻，作家表现了一种新的道德理想，即女性精神、经济独立的价值观，建立在爱情基础上的人格平等的婚姻观。\n\n一、从简·爱的成长来看，独立不羁、追求自由的特征就成为其性格的基调。简·爱这一形象代表着19世纪正处于萌芽状态的欧美女性运动，表达了来自女性、尤其是出身贫寒的平民女性内心的强烈愿望，即要求和男子平等，捍卫自己独立的人格与尊严，以及自由表现自己的爱憎。简·爱渴望并追求自食其力的诚实劳动和独立，她追求自由的爱情。她大胆地爱上了贵族罗切斯特，而当得知罗切斯特已有妻子后，她又果断地离开了他；当圣·约翰向她求婚时，她又断然拒绝，她不执念于感激之情而委屈顺从；最后当罗切斯特的妻子死后，虽然他已双目失明，她却主动向他表白了自己的爱情。所有这些，都显示出简·爱对女性人格尊严的追求，她不仅要维护自己的名誉，而且要维护自己的独立。这正是当时处于觉醒之中的新型女性的特征。\n\n二、从当时的社会发展来看，简·爱具有女性主义色彩的道德理想和为此而进行不懈拼搏的道德追求，反映了夏洛蒂·勃朗特思想的超越性与进步性，呼应了英国开始兴起的女权主义运动。作者通过对简·爱和罗切斯特这两个典型形象的塑造，既是\n\n对不合理的资产阶级社会的揭露和批判，也热烈表达了女性对独立、平等和自由的强烈渴望。在女主人公身上，作家突出探讨了情感与理智之间的矛盾与平衡的关系。作者热烈捍卫了妇女的平等权利，虽然这还不是政治上的平等，而指在家庭和工作方面的男女平等。夏洛蒂勃朗特虽不是妇女解放运动的正式参加者，甚至还在信中否认自己的作品具有男女平权主义倾向但她始终忠实于在她看来无疑是进步的男女平等原则。\n\n从今天发展的女性主义思想来看，夏洛蒂·勃朗特对简·爱的塑造也存在着一定的局限，主要体现在女性主义意识的西方中心主义色彩和一定程度的妥协。但是，瑕不掩瑜，简·爱身上呈现出来的富有挑战性的道德理想和不懈的道德追求，仍然无可辩驳地使这部作品成为女性主义文学发展史上的扛鼎之作。","keywords":"新的道德理想 独立不羁 追求自由 女性主义色彩","note":"《简·爱》的道德理想和道德追求主要体现在女性主义色彩方面，回答时一定要紧扣这个方面作答。如果问《简·爱的思想内容，其实也可以参考这一题的答案，突出作品中表现出的自由平等、追求爱情、具有女性主义色彩的思想特点。"},{"id":"163","stars":"★★★","title":"《简·爱》的艺术特征","body":"一、现实主义与浪漫主义相结合\n\n《简·爱》浸透着简·爱和罗切斯特的言行的感情魅力。这里，现实主义同拜伦和雪莱的浪漫主义传统结合起来了。一方面用现实主义写法，敏锐地感受到普遍的情绪和感受，强调家庭的幸福，常人的情爱的价值；另一方面，富于幻想的、诗意写法，唤起升华状态的情感，现实主义与浪漫主义得以统一。\n\n二、人物的个性化\n\n主人公简·爱第一次出场，就在舞台上占据支配地位：故事通过她自己的眼光来展现，第一人称的叙事，又突出了简·爱个人性的体验和感受。这使其个性的展示有了充分的条件。简·爱的个性是：聪明而谦逊、强而善良、沉静而热烈。这些个性点既表现在简·爱的童年生活中，如她在孤儿院里因不服“管教”而受罚，同时也在她和罗切斯特的关系中强烈地表现出来，如她从不因为自己是个地位低下的家庭教师而在罗切斯特面前奴颜婢膝，但又极其理智而有教养：她多次陷入理智与感情矛盾，从理智压抑感情，到感情进发，又到理智与感情趋于统一，经过一系列内心冲突之后，才真正体现出她崇高、优美而感人的性格特征。作家采用第一人称叙述，在很大程度上也是自己强烈感情的宣泄。\n\n同样，罗切斯特的个性也非常具有吸引力。夏洛蒂·勃朗特显然在这个人物的身上使用了“内外对照法”，即：他傲慢外表和温柔的内心构成彼此的映衬。随着简·爱逐渐透过他的外表了解到他的内心，逐渐从怕他到最后爱他，他的形象在读者心目中也越来越丰富动人。这样不仅使他们曲折而离奇的爱情显得非常可信，同时也使读者为他们的命运所感动。\n\n三、以一个中心人物统摄片段性的情节\n\n夏洛蒂·勃朗特是讲故事的高手。她总是从一个戏剧性的情节着手，当这个情节进行到一半时，不作任何预报就抛开了它转到另一个同样戏剧性的情节上去，而不顾前面已发生的事或以后将发生的事。《简·爱》的开头四分之一是写简·爱的童年生活；后半部分则专写她和罗切斯特的关系；在书的最后四分之一，圣·约翰出现了，除了最后几章外，余下的部分都与两人关系有关。然而，《简·爱》却以保持对一个中心人物的关注与兴趣统摄了小说的整体。\n\n四、细致入微的心理描写\n\n作者通过心理描写和分析，通过内心独白和心灵对话，通过梦境和幻觉，预兆和感应，象征和隐喻，景色与外物的描绘等等，真实而生动地刻画了简在爱情生活中丰富而复杂的心理活动。小说的内容是个人生活的琐碎，情节似乎也很稀松平常但主人公的内心世界很丰富。作者把这个寄人篱下的孤儿悲愤不平的心理，想爱又不敢爱的内心斗争，高度的自我克制与忍受痛苦的毅力，忘我的牺牲喜悦，写得几近真实。\n\n五、象征手法\n\n《简·爱》创造了一个充满深意与隐喻的寓言境界，夏洛蒂·勃朗特巧妙地利用各种象征元素，如天气变化、自然景观，以及特定的物品，来映射人物复杂的情感世界。例如，在作品中，“暴风雨”这个意象常被用来象征主人公内心的冲突和动荡而“安静的乡村景色”则映衬了其内心片刻的平静。这些意象的运用不仅增强了故事的层次感，也使得读者能够在阅读过中体会到更深层次的，来自主人公的情感共鸣。\n\n总之，这部小说情节引人入胜，语言质朴无华，景物描写富有浓厚的地方色彩小说，还具有一定神秘色彩。尽管小说中对桑菲尔德庄园的描写带有俗套的哥特式小说痕迹，小说的大团圆结局也有庸常之嫌，但那是当时读者的嗜好，夏洛蒂·勃朗特也迁就了读者的这种普遍要求。总之，《简·爱》是一部反映19世纪英国现实生活不可多得的艺术杰作，它的女性主题对\n\n后世英美作家产生了重要影响。","keywords":"现实主义与浪漫主义相结合 人物的个性化一个中心人物 片段性的情节 心理描写 象征手法","note":"《简·爱》的艺术特征，我们主要从风格、人物塑造、结构安排和手法几个角度去分析，其中特别需要注意的是《简爱》个性化的人物塑造，涉及了许多独特的手法。相关内容可参考赵永梅、田瑜《浅谈＜简·爱）的艺术特色》，安然《英国文学经典名著的多维阐释-以（简·爱）为例》，资料可在李凡文学正版群中领取。"},{"id":"164","stars":"★★★","title":"《呼啸山庄》的艺术特色","body":"一、丰富的艺术想象力\n\n艾米莉·勃朗特只活了短短的30年，一生几乎全部是在约克郡的她父亲的教区牧师住宅里度过的。但枯燥乏味的生活井没有使她的才思枯竭，反而使她进发出独特的艺术想象力，虚构出了约克郡原野上一段惊世骇俗的恋情。\n\n艾米莉·勃朗特的艺术想象力还表现在它的强烈性、实在性、自然性和诗性等方面。它是按照一种有生命的精神所给予的感受去表现自然的，它需要一种对于景物的富于想象力的理解。它强烈的情感力量具有极强的诗性，很好地表达了一种与普通经验有很大距离的世界观。\n\n二、复杂而独创的情节结构\n\n小说运用了一种不寻常的叙事手法。采用一系列第一人称的叙述，但并不完全按照直线型的时间顺序进行。小说的时间跨度是从1753年到1803年，但小说开局则是从1801年开始。小说通过2个主要叙事者和5个次要叙事者完成叙述，他们因观点不一致而相互补充，并且也不时转换了时间和视角。在《呼啸山庄》里，故事一部分由林惇家的仆人丁耐莉来叙述，一部分是由爱德加·林死后租用画眉田庄的洛克乌德先生来叙述的。这个方法达到了两个目的。首先，它保证读者看到的故事情节和当时的旁观者所看到的一样是新鲜的现实，其次，因为这些旁观者是超然和正常的，读者所看到的是没有经过那些置身事件之中的人物的情感影响而变形的真实情况。采取多种不同的叙述声音，让读者在阅读过程中体味多种复杂的审美趣味，也极大地挑战了读者的阅读习惯。她的叙事模式打破了传统的较为简洁明晰的叙述模式，具有超前性和“现代性”。\n\n三、作者塑造了鲜明的人物形象\n\n艾米莉笔下的几个主要人物都有血有肉，生动逼真，使读者感受到他们鲜明的个性和强烈的情感。希刺克厉夫的残忍与冷酷，辛德雷的骄横与专断，爱德加的软弱，凯瑟琳的自私和伊莎贝拉的痴傻均被作者描绘得栩栩如生，跃然纸上。作者在塑造人物形象时，既不谴责他们，也不为他们开脱罪责，而是揭示无情的事实，让读者用自己的目光去审视和评判人物的性格。\n\n四、用生动的场景和自然环境来渲染营造作品的气氛\n\n艾米莉·勃朗特是大自然的骄子，她与大自然之间具有一种生命相系、彼此和谐相容的关系。因此，在她的笔下自然环境的描写和自然意象的选择都与人物的塑造、主题的表达达到了和谐统一的程度。悲剧就从和谐被破坏开始，并在和谐重新恢复后结束。小说中的自然环境描写和自然意象的选择都具有高度的诗意和象征意义，成为渲染气氛、刻画人物性格的重要手段。小说还体现出浓郁的英国北方的乡土气息。艾米莉·勃朗特忠实地以她成长的土地以及这块土地上的人们为蓝本来描绘人生，这就使其小说具有明显的约克郡地方特色，独立于19世纪小说主流之外。自然环境的描写极大地渲染了小说的主题，增强了作品的神秘主义色彩。\n\n五、具有个性化风格的语言\n\n艾米莉·勃朗特善于运用丰富多彩的语言来表现人物的思想情绪与个性特征，使语言成为小说中塑造人物性格、表现主题的有力手段。如小说中为了表现希刺克厉夫对生活的绝望和强抑的激情，艾米莉·勃朗特设计了其专横、粗暴而又不连贯的语言风格。为了表现凯瑟琳临终前的精神崩溃，艾米莉·勃朗特设计了大段混乱而无系统的呓语，恰到好处地表现了女主人公所受到的心理煎熬。普通语言在艾米莉·勃朗特笔下具有一种天然的魅力。她用的可能是日常口语材料，可是她的清新自然和力量使她能把它们变成极具表现力和审美性的语言，自如恰切地表达最难以捉摸的微妙气氛和强烈的感情。她的语言具有独创性，总是给人一种回味，句子的节奏感很强，和它所传达的情感的变化和谐一致。\n\n六、融合多种艺术风格\n\n《呼啸山庄》既具有19世纪英国现实主义小说的许多特征，又具有浓厚的浪漫主义色彩，某些艺术手法则近似于20世纪现代小说的风格。在所有19世纪中叶的英国小说家中，艾米莉是最接近浪漫主义的。小说中男女主人公那种超越时空、超越死亡、充满激情的爱情是女作家艺术想象的主观产物。然而，作品的悲剧情节又有浓厚的生活作基础，是建立在艾米莉对于生活的悲剧性理解上的。她对人物的塑造和刻画具有极强的真实性和典型性。小说中对自然环境的典型描写都是作家对\n\n自己长期生活的环境的再现。在作家非凡的想象力基础上所形成的作品的结构、叙述、语言、主题等方面所具有的超越性，都使作品呈现出“现代性”特征。","keywords":"丰富的艺术想象力 复杂而独创的情节结构 鲜明的人物形象 场景和自然环境 个性化的语言 多种艺术风格","note":""},{"id":"165","stars":"★★★","title":"简论《呼啸山庄》的小说叙述特点","body":"《呼啸山庄》的叙事艺术使其具有超越历史时空的独特魅力，被誉为具有超验性的文本，具体表现如下：\n\n一、叙事视角的灵活转化\n\n《呼啸山庄》突破传统的叙事模式，并不局限于使用单一视点，而是根据故事情节的需要，不时地转换叙事视角和叙事者，使得叙事呈多元化展开，构成了一幅立体的图像。作品采用了第一人称“我”的内聚焦叙事角度。营造一个“我”讲故事给读者听的环境。读者透过“我”的眼睛，身临其境地看到了有限的世界，使想象有更多的活动余地。这种叙述角度有如下特点：这个人物作为叙事者兼角色，不但可以参与事件过程，又可以离开作品环境面向读者进行描述和评价；同时，他作为叙事者的视角受到了角色身份的限制，不能叙述本角色不知道的内容。\n\n二、采用“套层结构”的叙事结构\n\n《呼啸山庄》在叙事结构上显示出了层层嵌套的复合模式，叙事时间的倒错增加了文本的层次，以洛克乌德为主的顺叙构成了小说的“外叙事”，也即从外在的层面引导、启发了小说情节的发展；而在洛克乌德的转述中，以丁耐莉为主的顺叙则构成了文本的“内叙事”，也即小说内在的、本然的故事情节，这一叙事也构成了小说情节的主要内容；而丁耐莉以倒叙形式叙述的、以希刺克厉夫与凯瑟琳的爱情悲剧为主线的故事本身则形成了文本的“元叙事”，也即故事中的人物讲述的故事。三重复杂的叙事结构层层嵌套叠加，共同构成了小说整体的叙事结构。这种复杂的、层层嵌套的叙事结构匹配以多重叙事的视角，产生了“不可靠叙述”的效果，使读者能够通过不同叙事者的叙述从不同层面了解故事的真相，同时也留有诸多“留白”以供读者驰骋想象，形成了丰厚的叙事层次。\n\n三、叙述时间的巧妙安排\n\n（一）时间顺序的倒错\n\n《呼啸山庄》的叙事时间颠覆了按时间顺序进行叙述的叙事传统，将不同叙事时间发生的故事进行了有意味的编排，让叙事的时间发生倒错、叙事的节奏发生变化。《呼啸山庄》中的叙事时间构成了“顺序一倒叙一顺序一倒叙”的时间结构，往往是在顺序中形成悬念，再通过倒叙进行解答，在提出谜题与解开谜底之间不断回环往复。而只有抵达了叙述的终点时，穿插在“现在”中的“过去”才在读者的意识中形成了一个完整体，读者这才拨开作者借由叙事时间的倒错制造的“迷雾”。对叙事时间的重构使《呼啸山庄》变成了一个叙事的“迷宫”，接受者通过不断地对往事进行漫溯、对现状进行整理，才能够真正理解作家的叙事意图，叙事时间的倒错多变造成了接受的延宕，使文本的整体叙事契合俄国形式主义所谓的“陌生化”美学。\n\n（二）时间距离的多变\n\n在叙事的时距上，艾米丽·勃朗特也进行了具有超前性的叙事实验，以省略、跳跃以及延缓等方式调节着叙事的时长与节奏，对维多利亚时期传统的“匀速”叙事产生了颠覆性的效果，显示出了对叙事时间的显著意识。如《呼啸山庄》中对希刺克厉夫被逼远走的时间的悬置，希刺克厉夫在这段时间中的经历与其发家史被一井模糊化处理。但是读者观其归来后的巨大改变，从粗鲁野蛮变得文质彬彬、从叛逆直率变得心机深沉，便能够自动构想其远走期间受到的困难与艰险，导致其性情发生了地覆天翻的变化。\n\n这种时间顺序的倒错与时间距离的多变显示出了作家对物理意义层面的时间与心理意义层面的时间的探索。令读者沉滩的主体故事无疑是以“回忆”的姿态出现的，它们已经丧失了现实存在性而变为一种“心理时间”；同时作家又借由叙述者洛克伍德的日记，以具体的数字提示着读者实在的时间节点，也即以明确的“物理时间”来确定文本叙述稳定的时间秩序。两种时间在文本中的交缠形成了独特的叙事结构，使小说在思想情感意义之外具备了叙事学研究的价值。\n\n四、寓意多元的叙事空间\n\n《呼啸山庄》的叙事空间负载着多重意义，在德勒兹“游牧”空间理论的视域下，不同叙事空间的置换折射着作家本人的精神世界的流变与主体情感的投射。《呼啸山庄》的叙事情节最主要的两重并置空间便是“家宅一荒原”，两重空间在主人公内心地位的置换影射着主人公主体心灵的变化，这种情感嬗变也赋予了叙事空间以丰富的寓意。从封闭家宅向自由荒原的出走中，凝结着主人公在社会身份与自我心灵之间的彷徨，拘囿于房屋之中苦痛的心灵终于以魂灵的身份实现了对世俗枷锁的挣脱，回应了发自于人性深处的呼唤。\n\n★★166．论述哈代“威塞克斯”小说创作的发展及艺术特色 ★★★★★\n\n威塞克斯小说是19世纪英国小说家哈代以其家乡的社会风貌和自然风光为背景创作的一系列小说，因为他在小说中以该地区的古地名“威塞克斯”来称呼这一地区，所以这些小说被称为“威塞克斯”小说。\n\n一、发展阶段\n\n这些小说以生动的艺术形象记叙了19世纪英国南部农村社会的历史变迁以及农民生活发生的巨大变化，揭示英国宗法制农村社会向现代资本主义社会演变的过程。它们在主题思想、人物形象和结构技巧方面都具有内在的逻辑性，呈现出阶段发展的特点。从时间上来说，可以分为三个阶段：\n\n（一）第一个阶段（1871-1876）主要描写宗法制农村社会的传统风习，表现威塞克斯农村充满诗情画意的田园生活。哈代极力歌颂未曾遭受资本主义工业文明污染的自然之美，歌颂在自然状态下生活的农民的质朴、勤劳、高尚、正直等优秀品德，赞扬他们自得其乐的传统生活方式，即使表现了一些矛盾和冲突，最终都能够得到圆满的解决。这时的创作基调是乐观、轻松、愉快的。以《绿荫下》《远离尘器》为代表。\n\n（二）第二个阶段（1878-1887）主要描写由于资产阶级关系的入侵，造成威塞克斯农村社会解体的过程，反映农民阶级因为破产而毁灭的历史，哈代试图以希腊人的命运观念对威塞克斯农村社会发生的悲剧进行诠释，强调一种不可知的力量对人的命运的作用。在表现手法上采取了悲剧小说的形式，作品的基调是忧郁、迷茫、阴沉的。以《还乡》《卡斯特桥市长》为代表。\n\n（三）第三个阶段（1891-1896）主要探索和描写失去了赖以生存的社会基础以后，威塞克斯农民向工人阶级转化的必然趋向，以及他们在新环境中的前途与命运，哈代的悲剧观也由希腊悲剧的命运观念转向了社会观念，他把悲剧看成是人同环境、同社会政治制度之间的冲突，认识到悲剧人物的灾难、痛苦、挫折、失败、毁灭与客观环境和社会制度的内在联系。作品增强了人道主义色彩，加强了对心理和精神因素在人物悲剧中意义的研究，基调是悲怆、深沉、思辨的。以《德伯家的苔丝》《无名的裘德》为代表。\n\n整体来看，哈代的威塞克斯小说反映了70到90年代英国的资本主义经济侵入农村后带来的社会经济、政治、道德和风俗的巨大变化，展示了特定历史时期的农村劳动人民的悲惨命运和心灵创伤，展现了威塞克斯农村社会的悲剧性历史。表现出作者对造成威塞克斯社会和威塞克斯人悲剧命运的探讨，反映了哈代对当时社会的全面批判，揭露了维多利亚时代虚假的乐观主义，揭穿了英国社会在宗教与道德风尚方面都臻于完善的谎言。\n\n二、艺术特色\n\n（一）现实主义手法中见创新。残酷的社会现实使得哈代在创作中坚定地采取现实主义创作手法，真实地描绘了英国农村生活的面貌，揭露了社会的黑暗和描写人民的不幸。同时又做出了发展创新。他精确地再现了英国西南部的自然风光、风土人情、社会风俗以及时代氛围。但是，这些现实的描写也与自然的神秘力量、大量的心理和精神分析联系在一起。\n\n（二）具有强烈的主观情愫。哈代的叙述带有浓厚的抒情色彩，富有诗意，而且把自然景色与人物个性有机地结合在一起，自然景物充满人性，情景交融。\n\n（三）出色的写景技巧。哈代对于景物的运用往往具有象征意义，如《林地居民》中弯曲畸形的矮树暗示人生中“未获完成的意志”。在哈代的小说中，景物既是客观自然的再现，同时也是作家主观自然的反映。\n\n（四）哈代的作品结构精密，且含有诗意。哈代重视小说情节结构的设计安排。他常以主要人物之间婚姻恋爱的多角纠葛作为结构线索，通过情感纠葛推进情节的发展，刻画人物，表达对生活的认识和对社会的批判。\n\n（五）注重心理描写。哈代注重在矛盾冲突中刻画心绪流程，表现人物复杂的心态和丰富的精神世界。例如苔丝与克莱相爱的整个过程中，心中始终交织着幸福、痛苦、恐惧、悔恨、屈辱等各种感情，作者把苔丝置于极度的矛盾漩涡中展示丰富复杂的内心世界，使这一形象富有立体感和真实感。\n\n（六）开创了英国小说的农村题材。威塞克斯小说开创了以农村为题材的英国小说传统。","keywords":"叙事视角的灵活转化 套层结构 叙述时间的巧妙安排 寓意多元的叙事空间\n三个阶段 自然之美 命运观念 社会观念 巨大变化 悲剧性历史 虚假的乐观主义 现实主义 创新 主观情愫写景技巧 结构精密 心理描写 农村题材","note":"《呼啸山庄》是一本在叙述上非常有特色的小说，在背诵时应该要注意到其叙述特点。如果题目问的是其艺术特点，大家可以在以上内容的基础上，添加人物塑造、浪漫主义和象征主义色彩等方面的内容。相关内容可参考姜乐洁《略论（呼啸山庄）的叙述特点》、吴蓉《荒原中的人性呼唤-论（呼啸山庄）的叙事艺术》。此外，由于《呼啸山庄》和《简爱》都淋漓尽致地表现出了男权时代下女性所受到的压迫和歧视，描写了女主人公对自由和独立的渴望和追求、对社会现实的抗争，且两位作者还是姐妹，所以两部作品常被放到一起比较，相关内容可拓展阅读范羽佳《（简·爱）与（呼啸山庄）风格比较》、邢翠英《（简·爱）与（呼啸山庄＞比较分析》。上述资料均可在李凡文学正版群中获取。\n江南大学在26年的考查中针对哈代威塞克斯小说的主题特征进行了考查，哈代的威塞克斯小说历经了几个发展阶段，不同阶段呈现出不同的思想内涵和艺术风格，但从整体上看它们是作者的悲剧观念变化发展的循序渐进的反映。回答这道题目可以分阶段展开，也可以从整体上去概括。此外，“威塞克斯小说”是一个常考名词解释，大家要注意一下。"},{"id":"166","stars":"★★★★★","title":"论述哈代\"威塞克斯\"小说创作的发展及艺术特色","body":"威塞克斯小说是19世纪英国小说家哈代以其家乡的社会风貌和自然风光为背景创作的一系列小说，因为他在小说中以该地区的古地名“威塞克斯”来称呼这一地区，所以这些小说被称为“威塞克斯”小说。\n\n一、发展阶段\n\n这些小说以生动的艺术形象记叙了19世纪英国南部农村社会的历史变迁以及农民生活发生的巨大变化，揭示英国宗法制农村社会向现代资本主义社会演变的过程。它们在主题思想、人物形象和结构技巧方面都具有内在的逻辑性，呈现出阶段发展的特点。从时间上来说，可以分为三个阶段：\n\n（一）第一个阶段（1871-1876）主要描写宗法制农村社会的传统风习，表现威塞克斯农村充满诗情画意的田园生活。哈代极力歌颂未曾遭受资本主义工业文明污染的自然之美，歌颂在自然状态下生活的农民的质朴、勤劳、高尚、正直等优秀品德，赞扬他们自得其乐的传统生活方式，即使表现了一些矛盾和冲突，最终都能够得到圆满的解决。这时的创作基调是乐观、轻松、愉快的。以《绿荫下》《远离尘器》为代表。\n\n（二）第二个阶段（1878-1887）主要描写由于资产阶级关系的入侵，造成威塞克斯农村社会解体的过程，反映农民阶级因为破产而毁灭的历史，哈代试图以希腊人的命运观念对威塞克斯农村社会发生的悲剧进行诠释，强调一种不可知的力量对人的命运的作用。在表现手法上采取了悲剧小说的形式，作品的基调是忧郁、迷茫、阴沉的。以《还乡》《卡斯特桥市长》为代表。\n\n（三）第三个阶段（1891-1896）主要探索和描写失去了赖以生存的社会基础以后，威塞克斯农民向工人阶级转化的必然趋向，以及他们在新环境中的前途与命运，哈代的悲剧观也由希腊悲剧的命运观念转向了社会观念，他把悲剧看成是人同环境、同社会政治制度之间的冲突，认识到悲剧人物的灾难、痛苦、挫折、失败、毁灭与客观环境和社会制度的内在联系。作品增强了人道主义色彩，加强了对心理和精神因素在人物悲剧中意义的研究，基调是悲怆、深沉、思辨的。以《德伯家的苔丝》《无名的裘德》为代表。\n\n整体来看，哈代的威塞克斯小说反映了70到90年代英国的资本主义经济侵入农村后带来的社会经济、政治、道德和风俗的巨大变化，展示了特定历史时期的农村劳动人民的悲惨命运和心灵创伤，展现了威塞克斯农村社会的悲剧性历史。表现出作者对造成威塞克斯社会和威塞克斯人悲剧命运的探讨，反映了哈代对当时社会的全面批判，揭露了维多利亚时代虚假的乐观主义，揭穿了英国社会在宗教与道德风尚方面都臻于完善的谎言。\n\n二、艺术特色\n\n（一）现实主义手法中见创新。残酷的社会现实使得哈代在创作中坚定地采取现实主义创作手法，真实地描绘了英国农村生活的面貌，揭露了社会的黑暗和描写人民的不幸。同时又做出了发展创新。他精确地再现了英国西南部的自然风光、风土人情、社会风俗以及时代氛围。但是，这些现实的描写也与自然的神秘力量、大量的心理和精神分析联系在一起。\n\n（二）具有强烈的主观情愫。哈代的叙述带有浓厚的抒情色彩，富有诗意，而且把自然景色与人物个性有机地结合在一起，自然景物充满人性，情景交融。\n\n（三）出色的写景技巧。哈代对于景物的运用往往具有象征意义，如《林地居民》中弯曲畸形的矮树暗示人生中“未获完成的意志”。在哈代的小说中，景物既是客观自然的再现，同时也是作家主观自然的反映。\n\n（四）哈代的作品结构精密，且含有诗意。哈代重视小说情节结构的设计安排。他常以主要人物之间婚姻恋爱的多角纠葛作为结构线索，通过情感纠葛推进情节的发展，刻画人物，表达对生活的认识和对社会的批判。\n\n（五）注重心理描写。哈代注重在矛盾冲突中刻画心绪流程，表现人物复杂的心态和丰富的精神世界。例如苔丝与克莱相爱的整个过程中，心中始终交织着幸福、痛苦、恐惧、悔恨、屈辱等各种感情，作者把苔丝置于极度的矛盾漩涡中展示丰富复杂的内心世界，使这一形象富有立体感和真实感。\n\n（六）开创了英国小说的农村题材。威塞克斯小说开创了以农村为题材的英国小说传统。","keywords":"三个阶段 自然之美 命运观念 社会观念 巨大变化 悲剧性历史 虚假的乐观主义 现实主义 创新 主观情愫写景技巧 结构精密 心理描写 农村题材","note":"江南大学在26年的考查中针对哈代威塞克斯小说的主题特征进行了考查，哈代的威塞克斯小说历经了几个发展阶段，不同阶段呈现出不同的思想内涵和艺术风格，但从整体上看它们是作者的悲剧观念变化发展的循序渐进的反映。回答这道题目可以分阶段展开，也可以从整体上去概括。此外，“威塞克斯小说”是一个常考名词解释，大家要注意一下。"},{"id":"167","stars":"★★★","title":"分析苔丝人物形象及其悲剧原因","body":"《德伯家的苔丝》叙述的是农家姑娘苔丝为了帮助家庭摆脱经济困难外出做工而遭遇的不幸和悲剧。苔丝是哈代塑造的最优秀的典型形象之一，同时也是资本主义侵入农村、引起小农经济破产这一社会转型期的无辜牺牲品。\n\n一、人物形象\n\n（一）苔丝是一个外在美与内心美相统一的女性形象，是美的象征\n\n在哈代笔下，苔丝被描写成美的象征和爱的化身，既代表着传统，又融合了现代的特点。她外表天生丽质、充满女性美和青春的活力。她内心真挚可爱，品德高尚，富有热情，能够容忍和敢于自我牺牲。在苔丝身上，作者集中概括了劳动人民的优秀品质，赞扬了她的勤劳、善良、感情真挚和心地纯洁，也代表了工业革命时代背景下广大的小农经济人民。\n\n（二）苔丝是一个具有高尚道德和强烈反抗精神的女性\n\n为了帮助解决家庭困难，她不得不到冒牌本家亚雷·德伯家寻求帮助。她被亚雷诱奸以后，不顾亚雷的挽留，坚决回到自己的家，而不是像艾略特笔下的海蒂·沙勒尔那样出于道德上的考虑最后嫁给损害她的人。因此，苔丝的灵魂是纯洁的，道德是高尚的。\n\n苔丝明明是受到侵犯的人，但是在资产阶级的道德面前，在陈腐落后的世俗偏见中，她却被看成是伤风败俗的罪人。代表资本主义伪善道德和法律的亚雷，代表封建宗法制传统贞洁观念的克莱，毁灭了她美好的人生。但是，她从不自暴自弃，始终不向环境和命运屈服，具有鲜明的反抗精神。\n\n二、悲剧原因\n\n（一）时代原因\n\n苔丝悲剧命运具有社会性，代表着英国南部农村整个农民阶级的命运，她的毁灭不仅是她个人的悲剧，也是时代的悲剧。小说开头特林汉姆牧师对德伯家的考古发现，从历史的角度说明了苔丝毁灭的历史必然性。接着，苔丝在替父亲送蜂窝时撞死了老马，导致苔丝一家人丧失了赖以生存的经济基础，迫使苔丝不得不去解决经济问题，由此导致苔丝被资产阶级毁灭。她的苦难历程，代表着整个农民阶级向工人阶级转化的过程及悲剧性命运。\n\n（二）性格弱点\n\n苔丝敢于大胆反抗社会的不公正，但却不能彻底摆脱传统道德对自身的羁绊。苔丝明白自己是社会暴力和伦理道德的受害者，但在受到乡里人非议的同时，她也按照传统的贞操观来衡量自己的清白，也认为自己是“有罪”的。她过分夸大了失去贞操所带来的罪恶，使得她一直受到这种道德的谴责而无法自拔，最终走向毁灭。\n\n总之，苔丝的形象是善与美的化身，寄托了作者美好的愿望。其悲剧命运既有时代的影响，也与自身的性格弱点有关，这些都丰富了人物形象，使苔丝更加真实鲜活。","keywords":"外在美与内心美相统一 美的象征 爱的化身 高尚道德 强烈反抗精神 时代悲剧 性格弱点","note":"分析苔丝的形象主要是回答人物性格的优点、比如善良美丽等等，同时苔丝是一个悲剧性的人物，所以也要分析其悲剧性成因，包括内外两个因素，即时代因素与人物自身的性格缺点。"},{"id":"168","stars":"★★★","title":"分析哈代《德伯家的苔丝》中对苔丝的人物描写","body":"《德伯家的苔丝》叙述的是农家姑娘苔丝为了帮助家庭摆脱经济困难外出做工而遭遇的不幸和悲剧。在哈代笔下，苔丝被描写成美的象征和爱的化身，既代表着传统，又融合了现代的特点。她天生丽质，品德高尚，能够容忍和敢于自我牺牲。在小说中，哈代使用了多种方法完成了对苔丝形象的塑造，并探究了苔丝悲剧背后的原因，具体来说，主要包括以下内容：\n\n一、《德伯家的苔丝》小说的副题是“一个纯洁的女人”，鲜明地表达了作者同情女主人公的人道主义立场，同时也是对资产阶级道德的一个大胆挑战。他赋予苔丝以劳动妇女的一切美好品质。坚强、勤劳而富于反抗性，是她性格上的主要特征。自食其力的尊严感和意志使她在困难和磨难面前表现出无比坚强而多次“绝处逢生”。她对克莱的爱是真诚的、高洁的。苔丝对宗教的反抗也表现得大胆而坚决，她从生活磨难中体会到了“她一心信仰的上帝”的虚妄，不但毅然斩断了自己和教会的关系，而且从她对摇身一变而成为牧师的亚雷的尖酸刻薄的态度上，可以看出她对宗教的极端鄙视。\n\n二、在赋予苔丝众多正面特征的同时，作家也展现了苔丝形象的内在复杂性和时代印记。苔丝生活在一个新旧交替的时代，残存于农民身上的某些旧道德观念和宿命观点，对她的思想意识产生影响。她既有反抗命运的一面，又有顺从命运安排的一面。作者一方面认为苔丝是社会的牺牲品，因而他痛恨那个社会，同情女主人公。另一方面又认为苔丝是命运的牺牲品，进行反抗也是枉然，因而安排了她那样的结局。作者在小说中时时发出悲天悯人的慨叹，流露出一种对人类永远无法解脱悲剧命运的无可奈何的悲哀。\n\n三、哈代在描写资产阶级生产关系的特点的时候，并没有停留在苔丝到养鸡场养鸡、到奶牛厂挤奶或到农场种地这些表面现象上，而是通过这些现象强调苔丝的命运与资产阶级制度的联系。作者充分看到了苔丝命运的典型性和社会性质，指出苔丝的悲剧是由资产阶级的社会制度造成的。苔丝被判处死刑证明了资产阶级政治制度的反动性，表明下层阶级的小人物在社会中是不公正的。哈代在小说中指出她是被资产阶级的制度毁灭的，从而把她的悲剧意义上升到了为广大劳动人民要求人权和对整个资本主义制度进行揭露和控诉的高度。\n\n★★169．试分析哈代《德伯家的苔丝》的创作特征★★★★★\n\n《德伯家的苔丝》是哈代后期小说创作的代表，体现了哈代小说创作思想与艺术的进一步发展。总体来看，这部小说的创作特征，表现在以下方面：\n\n一、主题广泛深刻，人道主义色彩浓郁\n\n在《德伯家的苔丝》中，哈代不仅明确提出了威塞克斯农民在资产阶级世界中的地位问题，而且为被压迫的人们要求自由和博爱，要求人道主义的同情。哈代对资本主义不再作象征性的粗略描写，而是把描写的内容扩大到资产阶级社会的各个方面，表现维多利亚时代资产阶级的伦理道德、宗教法律、婚姻爱情、教育制度、人际关系等重大社会主题，从对资产阶级社会的一般性描写转入对这个社会的揭露、控诉和批判。小说正是通过对一个无辜少女备受迫害的描绘，对资产阶级社会及其法律、道德和实质做出了有力的揭露，提出了强烈的控诉。\n\n二、强烈的悲剧性\n\n《德伯家的苔丝》的发表意味着哈代悲剧小说创作达到了顶峰，因为它将命运悲剧、社会悲剧、性格悲剧融为一体，具有立体感和层次感，因而很有悲剧的震撼力。\n\n（一）命运悲剧。作者把苔丝的一切不幸归于冥冥之中难以理喻、难以驾驭的命运之神之所为。这就是哈代所认为的命运悲剧在苔丝身上的体现。\n\n（二）社会悲剧。小说通过苔丝与亚雷和克莱的关系，具体描写了苔丝所受到的双重压迫-这正是社会对苔丝压迫的体体现。\n\n（三）性格悲剧。苔丝的悲剧更是她自己的性格悲剧。苔丝性格及其矛盾性与冲突是造成苔丝悲剧的深层原因。\n\n三、对自然环境的描写与人物命运、小说主题相结合\n\n小说中的景物描写极为出色。它不仅是人物活动的背景，而且富于感情和生命。如小说一开始，秀美的景色衬托着苔丝\n\n的纯洁、天真、美丽。苔丝刚到芙仑谷，所见到的是辽阔的草原、清凉的河水、无数的牛羊。她迎着南风往前跳着走去，“她的希望和日光两相融合，仿佛幻出了一团光辉的气氛环绕着她”。这里由情入景、情景交融，淋漓尽致地渲染了苔丝长期被压抑后获得解脱的心理。而当展示主人公厄运的时候，小说则着力描写荒原黑夜。女主人公的悲惨事变往往伴随着冷酷阴沉的黑夜发生。\n\n四、注重在矛盾冲突中刻画人物心理\n\n哈代是心理学大师，他对人物的精神世界、心灵的微妙变化揭示得十分出色。其主要特色是注重在矛盾冲突中刻画心绪流程，表现人物复杂的心态和丰富的精神世界。如苔丝在与克莱相爱的过程中，心里始终交织着幸福、痛苦、恐惧、悔恨、屈辱等各种感情。人物处在矛盾情感的漩涡中，显得极为真实、丰满和可信。\n\n五、结构严谨\n\n在苔丝悲惨的一生中，亚雷对苔丝的奸污与玩弄，克莱对她的爱慕与遗弃，苔丝的忍辱与复仇以及最终的逃亡和被当局“明正典刑”，前后几个阶段的安排井然有序，结构巧妙。","keywords":"美好品质 内在复杂性和时代印记 资产阶级制度\n主题广泛深刻 人道主义色彩 强烈的悲剧性 自然环境描写与人物命运、小说主题相结合 在矛盾冲突中刻画人物心理 结构严谨","note":"本题为2023年杭州师范大学考研真题。在《德伯家的苔丝》中，哈代对苔丝的人物描写，不仅表现出了她身上的正面特质，而且表现出了她内在的复杂性和时代烙印。更重要的是，通过对苔丝形象的描写，哈代深入探究了苔丝命运与资产阶级制度的联系，对资本主义制度进行了揭露和控诉。\n在哈代小说创作的晚期，威塞克斯农村社会产生了根本性变化，与之相联系，威塞克斯农村的主要矛盾也发生了变化，这导致哈代小说的主题也发生了很大的变化，这种变化集中体现在他的《德伯家的苔丝》这部作品之中，由此可见这部作品的重要性，大家需要重点关注。"},{"id":"169","stars":"★★★★★","title":"试分析哈代《德伯家的苔丝》的创作特征","body":"《德伯家的苔丝》是哈代后期小说创作的代表，体现了哈代小说创作思想与艺术的进一步发展。总体来看，这部小说的创作特征，表现在以下方面：\n\n一、主题广泛深刻，人道主义色彩浓郁\n\n在《德伯家的苔丝》中，哈代不仅明确提出了威塞克斯农民在资产阶级世界中的地位问题，而且为被压迫的人们要求自由和博爱，要求人道主义的同情。哈代对资本主义不再作象征性的粗略描写，而是把描写的内容扩大到资产阶级社会的各个方面，表现维多利亚时代资产阶级的伦理道德、宗教法律、婚姻爱情、教育制度、人际关系等重大社会主题，从对资产阶级社会的一般性描写转入对这个社会的揭露、控诉和批判。小说正是通过对一个无辜少女备受迫害的描绘，对资产阶级社会及其法律、道德和实质做出了有力的揭露，提出了强烈的控诉。\n\n二、强烈的悲剧性\n\n《德伯家的苔丝》的发表意味着哈代悲剧小说创作达到了顶峰，因为它将命运悲剧、社会悲剧、性格悲剧融为一体，具有立体感和层次感，因而很有悲剧的震撼力。\n\n（一）命运悲剧。作者把苔丝的一切不幸归于冥冥之中难以理喻、难以驾驭的命运之神之所为。这就是哈代所认为的命运悲剧在苔丝身上的体现。\n\n（二）社会悲剧。小说通过苔丝与亚雷和克莱的关系，具体描写了苔丝所受到的双重压迫-这正是社会对苔丝压迫的体体现。\n\n（三）性格悲剧。苔丝的悲剧更是她自己的性格悲剧。苔丝性格及其矛盾性与冲突是造成苔丝悲剧的深层原因。\n\n三、对自然环境的描写与人物命运、小说主题相结合\n\n小说中的景物描写极为出色。它不仅是人物活动的背景，而且富于感情和生命。如小说一开始，秀美的景色衬托着苔丝的纯洁、天真、美丽。苔丝刚到芙仑谷，所见到的是辽阔的草原、清凉的河水、无数的牛羊。她迎着南风往前跳着走去，“她的希望和日光两相融合，仿佛幻出了一团光辉的气氛环绕着她”。这里由情入景、情景交融，淋漓尽致地渲染了苔丝长期被压抑后获得解脱的心理。而当展示主人公厄运的时候，小说则着力描写荒原黑夜。女主人公的悲惨事变往往伴随着冷酷阴沉的黑夜发生。\n\n四、注重在矛盾冲突中刻画人物心理\n\n哈代是心理学大师，他对人物的精神世界、心灵的微妙变化揭示得十分出色。其主要特色是注重在矛盾冲突中刻画心绪流程，表现人物复杂的心态和丰富的精神世界。如苔丝在与克莱相爱的过程中，心里始终交织着幸福、痛苦、恐惧、悔恨、屈辱等各种感情。人物处在矛盾情感的漩涡中，显得极为真实、丰满和可信。\n\n五、结构严谨\n\n在苔丝悲惨的一生中，亚雷对苔丝的奸污与玩弄，克莱对她的爱慕与遗弃，苔丝的忍辱与复仇以及最终的逃亡和被当局“明正典刑”，前后几个阶段的安排井然有序，结构巧妙。","keywords":"主题广泛深刻 人道主义色彩 强烈的悲剧性 自然环境描写与人物命运、小说主题相结合 在矛盾冲突中刻画人物心理 结构严谨","note":"在哈代小说创作的晚期，威塞克斯农村社会产生了根本性变化，与之相联系，威塞克斯农村的主要矛盾也发生了变化，这导致哈代小说的主题也发生了很大的变化，这种变化集中体现在他的《德伯家的苔丝》这部作品之中，由此可见这部作品的重要性，大家需要重点关注。"},{"id":"170","stars":"★★★","title":"试分析《德伯家的苔丝》的乡土文化色彩","body":"深沉的乡土意识构成了哈代创作的精神内核，决定了他的小说具有浓厚的乡土色彩。这在《德伯家的苔丝》中，主要表现在以下方面：\n\n一、故事创意具有浓厚的民间文学色彩\n\n《德伯家的苔丝》整部小说的故事创意充满着浓厚的民间文学的色彩。对这一点评论界早有认同，骚塞在评论哈代的专著中认为，《德伯家的苔丝》是由这样两个独特因素构成的：“以处女被花哨的年轻绅士诱奸这样一个民谣故事为全书的基础，再加上一层严肃的道德批评。”而戴维森更是认为：“具有哈代特色的长篇小说是根据口述（或吟唱）的故事那样构思的，至少不是根据文学故事那样构思，它是传统的民谣或口头故事，以现代散文小说的形式扩大而成的。”\n\n二、生动丰富、趣味盎然的民情风俗\n\n《德伯家的苔丝》中穿插了很多民歌、民谣、传说、轶事、趣闻、节日、预兆等风土人情，或神秘恐怖，或幽默嘲讽，或诙谐风趣，反映出当地独特的民情风俗，揭示人物性格，丰富了情节，增添了趣味性。如小说一开始就描写五月的五朔节，苔丝和女伴们一起参加妇女游行会。小说中的民歌、民谣、传说和轶闻趣事也随处可见，如苔丝参加五朔节游行集会回到家时，她的母亲边摇着摇篮，边唱着特别心爱的民歌《花牛曲》，从曲中看出德伯太太那一副苦中找乐、乐天知命的性格。此外，小说中提到的风俗民情还有：有关德伯家大马车的故事，新婚之夜克莱挂在蚊帐顶下的一丛寄生草.....这些都使小说充满了英格兰农村风俗的奇情异彩，令人觉得可亲又可信。\n\n三、“荒原意志”的地域悲剧色彩\n\n哈代的小说，始终笼罩着一股浓烈的悲剧意识，其中的人物活动范围大都局限于爱敦荒原。这种悲剧观与哈代生活的时代和地域环境也有很大的关系。\n\n从生活的时代来看，哈代开始创作的19世纪末，正是资本主义经济侵入英国农村，个体农民逐渐走向贫困和破产的时期。哈代虽然对这些农民的悲惨遭遇抱有深深的同情，但他不能全面深刻理解人间苦难产生的社会根源，只好把这一切归结为“性格与环境”的冲突，认为现实的危机和不可克服的社会矛盾，是神秘不可预测的上天意志：他称之为“宇宙意志”或“荒原意志”。\n\n从个人经历看，哈代的这种“荒原意志”也具有强烈的地域色彩。哈代的祖母和母亲都是土生土长的威塞克斯乡村妇女，具有浓厚的宿命论思想；当时生活于偏僻乡村的威塞克斯村民面对现代工业的入侵，往往感到无所适从，无能为力，只好听任命运的安排，具有一种普遍的悲观情绪。这些都促进了哈代悲剧意识的形成。","keywords":"浓厚的民间文学色彩 民情风俗 地域悲剧色彩","note":"一直以来，哈代和沈从文一样，都被视为乡土小说作家的代表，二人还会被放在一起进行对比。乡土文化对哈代** --- 的影响是多方面的，这集中体现在《德伯家的苔丝》这部作品之中。相关内容可以参考刘丽琼《浓郁的乡情深沉的悲戚-从（德伯家的苔丝）看哈代创作的乡土色彩》，具体资料可以在李凡文学正版群获取。"},{"id":"171","stars":"★★★★","title":"《死魂灵》的艺术特点（26山东师范大学）","body":"一、“含泪的笑”\n\n如果说果戈理的前期创作中更多的是一种“含着忧郁和感动之泪的笑”的话，那么我们在《死魂灵》中看到的则是“饱含讥讽与愤怒之泪的笑”。可以说，小说中的丑类无一能逃脱作者辛辣的讽刺锋芒。\n\n果戈理采用了多种多样的讽刺手法，或明讽、暗讽，或采用反语、夸大语，等等，造成了强烈的讽刺效果。作者没有故意去制造什么笑料，他的讽刺的基石是形象的真实。放荡的罗士特莱夫在豢养的狗群中俨然“像家庭里的父亲一般”走动，笨拙的索巴凯维奇家里的家具也件件结实粗糙，仿佛都在说“我也是一个索巴凯维奇”。作者无情嘲笑和鞭笞俄罗斯的丑恶，而在这种“分明的笑，和谁也不知道的不分明的泪”中，饱含着作者对祖国命运深切的优虑和关注。正如鲁迅先生所说“以不可见之泪痕悲色，振其邦人。”\n\n二、个性鲜明的艺术形象\n\n小说以偏僻的乡村为主要背景，相当广阔地反映了农奴制俄国的真实生活，深刻批判了唯利是图的新兴资产者、腐朽没落的官僚阶层，以及作为农奴制支柱的宗法制地主。在层层展示这幅“群丑图”时，作者运用典型化手法，显示出高度的艺术概括力量。这部小说塑造了“与众不同、各具特色的性格”，其中地主群像的塑造尤为人称道，如被惰性和幻想吞噬的活尸型的地主形象玛尼罗夫；愚昧闭塞、务实浅薄的俄国乡村小地主形象科罗潘契加；极度卑琐贪婪的吝啬鬼守财奴形象泼留希金。\n\n三、平实逼真的细节描写\n\n那个甜腻腻的地主玛尼罗夫的性格就是靠着一系列的典型细节给凸现出来的。乞乞科夫来到玛尼罗夫家的客厅门前，两人都不肯先走进门去。经过长时间的谦让之后，两人终于侧着身子，相互稍稍挤了一下，并排跨进了客厅。在这过了头的客套后面，揭露出了他俗不可耐的虚伪和做作。小说描写玛尼罗夫的书房里，“总放着一本书，在第十四页间总夹着玛尼罗夫的一条书签；这一本书他还是在两年以前看起的”。他的客厅陈设华丽，可是两把未完工的靠手椅，四年来始终“只绷着麻布”。他常常呆坐，冥思苦想种种计划，但这些计划全是空想。作者没有直写玛尼罗夫的空虚和无能，而是靠着诸多传神的细节使其跃然纸上。\n\n四、高明的人物肖像描摹手法\n\n在果戈理的笔下，五个地主的肖像无不令人叫绝。索巴凯维奇外形像头笨熊，面容出奇地粗糙拙劣，造化似乎不必在他的脸上多费心机，“只要简单地劈几斧就成。一下-鼻子有了，两下-嘴唇已在适当之处，再用大锥子在眼睛的地方钻两个洞，这家伙就完全成功。也无须再把他刨平，磨光，就说道‘他活着哩，送到世上去＇”。这样入木三分的肖像描写不仅使索巴凯维奇形象立时凸现出来，而且也成了揭示人物性格的一面镜子。同样，当作者用寥寥数笔勾出泼留希金那对小老鼠般的骨碌碌转动的小眼睛时，人物内在的卑琐也就随之纤毫毕现了。\n\n五、特色的语言描写\n\n小说中人物的语言很有特色，且与其个性相吻合。如果说玛尼罗夫的语言矫饰空泛、索巴凯维奇的语言率直粗俗的话，那么罗士特莱夫的语言则是冲动蛮横和缺乏逻辑的。小说中，同样是请乞乞科夫进屋，玛尼罗夫说了一大堆废话而索巴凯维奇“只简短地道了一声‘请”，就引他到里面去了”。而罗士特莱夫则用不容商量的口吻“请”来乞乞科夫，并用“无聊家伙”“懒虫”和“废料”这类词汇侮辱他请来的朋友。从这些极富个性的语言中，人们不难体会到人物的性格特征。\n\n六、自然流畅的叙事结构\n\n第一章是开场白，主要是概述当时的社会状况，除泼留希金外，文中出现的地主都亮相了。第二章到第六章介绍了五个地主。第七章到第十章写的都是城里的官僚。第十一章即最后一章写的是乞乞科夫的性格发展史。整篇小说围绕着乞乞科夫展开，线索清晰。自然流畅的叙事结构是作者的匠心所在，在这样的安排下，文中虽有众多人物和故事，却有条不紊地-展开，体现出作家深厚的功力。","keywords":"含泪的笑 幽默讽刺 艺术形象 细节描写 肖像描写 语言描写 叙事结构","note":"《死魂灵》是俄国批判现实主义文学发展的基石，也是果戈理的现实主义创作发展的顶峰，所以对其大致情节、人物形象、艺术特征我们都要了解。艺术特色上最突出的就是讽刺，同时这讽刺的背后又有浓厚的悲伤，由此构成了果戈理“含泪的笑”的特点。"},{"id":"172","stars":"★★★","title":"谈谈《死魂灵》对地主群丑图的刻画","body":"果戈理的《死魂灵》描写了一系列地主形象，在揭示其共同具有的剥削、贪婪、寄生等阶级属性的同时，又刻画了几位地主的不同个性。\n\n一、五位地主的形象\n\n（一）玛尼罗夫是一个懒惰、虚伪、“无灵魂”的地主形象\n\n玛尼罗夫表面谈吐高雅、慷慨好客，实际是极度的空虚和装腔作势。他的性格游移不定，又无理财的本领，整天沉溺于沉思冥想之中，是一个丧失了实际生活的能力、被惰性和幻想吞噬了灵魂的活尸型的地主形象。\n\n（二）女地主科罗潘契加是个终日为农务操劳的乡村小地主\n\n“科罗潘契加”一词意为“小匣子”，这个女地主如她的姓所寓意的那样，耳目闭塞、性情迟钝。她善于积聚小钱，讲求实利，但极为浅薄，一心扑在自己的庄园里。在听了乞乞科夫的吹嘘后以为有利可图，马上露出一副殷勤相。作为愚昧闭塞、务实浅薄的俄国乡村小地主形象，科罗潘契加十分典型。\n\n（三）罗士特莱夫是一个厚颜无耻的流氓加恶棍式的地主形象\n\n表面上的豪爽掩盖不了罗士特莱夫吃喝嫖赌以放荡为人生嗜好的本性，无聊的生活和无赖的性格使他终日耽于寻欢作乐哪里有集会哪里就有他。农奴的血汗换来的财富使他得以挥金如土，在赌场上毫不在乎地抛出大笔钱财。出于自身的劣根性罗士特莱夫热衷于搅乱秩序，散布谣言破坏交易。这是一个彻头彻尾的恶棍形象。\n\n（四）索巴凯维奇的是一个顽固、凶狠、冷酷的大地主形象\n\n索巴凯维奇是一个生活方式畸形的地主，他有熊一般的胃口、外形以及冷酷的动物性，他讨厌新事物，讨厌文明行为，以固执的目光审视着人际关系。对待钱财从不含糊，能强取豪夺的从不犹豫，同时又老练地耍弄手腕，以至连工于算计的骗子乞乞科夫也不得不甘拜下风。索巴凯维奇之流是俄国地主阶级中最顽固、最凶狠的一部分，是沙俄赖以生存的社会支柱。\n\n（五）泼留希金是守财奴和吝啬鬼的典型\n\n泼留希金拥有巨额的资产、广袤的土地和1000多个农奴，但他极端吝啬，庄园破烂不堪，本人衣着褴褛。贪欲使他失掉了对物品价值的起码认识，一方面他让库房里堆积如山的东西霉烂变质，另一方面他又在路上捡拾着破布、碎瓦、铁钉。贪欲也使他丧失了人的感情，甚至连自己的亲生儿女亦可抛弃。这个极度卑琐贪婪的吝啬鬼正是俄国地主阶层日趋没落的写照。\n\n二、刻画手法\n\n（一）平实逼真的细节描写\n\n甜腻腻的地主玛尼罗夫的性格就是靠着一系列的典型细节给凸显出来的，乞乞科夫来到玛尼罗夫家的客厅门前，两人都不肯先走进门去。经过长时间的谦让之后，两人终于侧着身子，相互稍稍挤了一下，并排跨进了客厅。对这过了头的客套的描写，突出了其俗不可耐的虚伪和做作。\n\n（二）入木三分的肖像描写\n\n在果戈理的笔下，5个地主的肖像无不令人叫绝。索巴凯维奇外形就像头笨熊，他的面容也出奇的粗糙拙劣。对于索巴凯维奇外形的描写不仅使其形象立时凸显，而且也成了揭示人物性格的一面镜子。同样当作者用寥寥数笔勾出玛尼罗夫那老挂在脸上的甜腻腻的笑容和泼留希金那对小老鼠般骨碌碌转动的小眼睛时，人物内在的庸俗和卑琐也就随之显现了。\n\n（三）通过语言塑造人物性格\n\n小说中人物的语言也很有特色，且与其个性相吻合。玛尼罗夫的语言矫饰空泛，索巴凯维奇的语言率直粗俗，罗士特莱夫的语言是冲动的、蛮横的和缺乏逻辑的。从这些极富个性的语言中，人们不难体会到人物的性格特征。\n\n三、刻画意义\n\n五个地主不仅仅代表了俄国地主阶级的不同类型，而且从各个侧面，互为补充地反映了地主阶级共有的寄生、腐朽和卑劣的特征，显示了滋生这些真正的“死魂灵”的专制制度必然灭亡的趋势。","keywords":"阶级属性 不同个性 活尸型 愚昧闭塞 厚颜无耻 顽固凶狠 守财奴和音啬鬼 细节描写 肖像描写 语言","note":"《死魂灵》塑造最成功的人物就是五个地主形象，其中最重要的是泼留希金，也是四大吝啬鬼之一，会和其他音啬鬼-葛朗台、夏洛克、阿巴贡放在一起比较，需要大家对这些人物形象都有所掌握，相关内容可参考杜春荣、郎景成《欧洲文学史上的奇观-四大吝啬鬼的比较分析》、岳引弟《西方文学四大吝啬鬼形象意蕴解析》，资料可在李凡文学正版群** --- 中查看。"},{"id":"173","stars":"★★★★","title":"如何理解果戈理小说中“含泪的笑”（25湖南大学）","body":"“含泪的笑”是别林斯基给予果戈理作品的高度评价，也是果戈理小说讽刺艺术的特点。所谓“含泪的笑”，果戈理自己表白说：“凭着神秘的运命之力，我还要和我的主角携着手，长久地向前走，在全世界，由分明的笑，和谁也不知道的不分明的泪，来历览一切壮大活动的人生。”就是说，作者把“分明的笑”和“不分明的泪“操合一起，历览人生，同主角携着手，在痛苦的笑声中反映那个时代的社会生活。具体说来，有如下特征：\n\n一、发展变化\n\n果戈理“含泪的笑”有一个发展变化的过程，在不同的创作时期，对不同的人物，“笑声”和“眼泪”是有差别的，这与作家观察生活、理解社会问题不断加深引起思想感情的变化有密切关系。\n\n（一）果戈理前期创作中更多的是一种“含着忧郁和感动之泪的笑”，如1835年《密尔格拉得》问世，其中《旧式地主》具有代表性，初步触及了社会生活的重大问题，充分体现了这一阶段“含泪的笑”的特点。果戈理含着忧伤、哀怜的眼泪，描写了地主日常生活的空虚、无聊、愚蠢、可笑，刻划了地主的性格特征。人们得以透过忧伤、哀怜的眼泪发出笑声，是这一阶段“含泪的笑”的特点。\n\n（二）后期的创作则更多是“饱含讥讽与愤怒之泪的笑”，以《死魂灵》为代表，小说中的丑类无一能逃脱作者辛辣的讽刺锋芒。果戈理采用了多种多样的讽刺手法，或明讽、暗讽，或采用反语、夸大语，等等，造成了强烈的讽刺效果。作者没有故意去制造什么笑料，他的讽刺的基石是形象的真实。放荡的罗士特莱夫在豢养的狗群中俨然“像家庭里的父亲一般”走动，笨拙的索巴凯维奇家里的家具也件件结实粗糙，仿佛都在说“我也是一个索巴凯维奇”。\n\n二、特征\n\n（一）根源于深刻的社会现实\n\n没有人不希望自己的祖国强盛、人民幸福，可是果戈理所处的时代，地主阶级已是没落的阶级，他们不是腐朽无能，就是反动透顶，黑暗丑恶的社会现状让果戈理为祖国的命运而担忧，但个人力量终究渺小，难以改变现状，唯有哀其不幸怒其不争。因此果戈理对种种不公乃至畸形的社会现状，既感到滑稽可笑，又痛心含泪。\n\n（二）人物自身就是可笑的化身\n\n果戈理在他的作品中刻划的众多人物确实滑稽可笑，但这种可笑其实是极为严肃的，并非作者扮出个滑稽的脸子，或者故意说一些俏皮话，而是描写的人物本身可笑。这些可笑的人物是俄罗斯现实生活中大量存在的，是沙皇专制农奴制度的产物。如玛尼罗夫以人类文明和美德的楷模自居，实际上只不过是一个虚有其表的蠢类；索巴凯维奇满心鄙视地将别人都看作骗子、恶棍和强盗，而他自己却正是他所鄙弃的那种人；泼留希金已完全淹没在极度贪婪吝啬的、卑劣渺小的感情之中，但他从未怀疑过自己感情行为的合理性。由于人物的主观感受与客观实际完全背离，在形象上形成鲜明而极不协调的对照，幽默和讽刺的艺术魅力便从中而生。\n\n（三）悲悯相在笑，欢喜相在哭\n\n果戈理的作品中，笑与泪并非单独存在，更多的是融合在了一起。他在嘲笑现实中的种种丑恶现象的同时，是在为俄国社会的苦难而悲伤，那是作者通过文学的方式，在审视社会与制度的黑暗，他想通过对作品中人物与事件的“笑”，来反衬我国社会的黑暗，笑中带泪，以笑当哭。\n\n（四）背后是对祖国和人民的热爱\n\n正如鲁迅先生所说“以不可见之泪痕悲色，振其邦人。”作者无情嘲笑和鞭答俄国的丑恶，而在这种“分明的笑，和谁也不知道的不分明的泪”中，饱含着作者对祖国命运深切的忧虑和关注。","keywords":"根植社会现实 人物可笑 伤痛 悲喜融合 热爱祖国和人民","note":"“含泪的笑”是果戈理创作的一大特色，这一特点既与当时俄国的社会情况密切相关，也与果戈理个人的成长经万有关。“含泪的笑”不仅表现出了果戈理对腐朽制度的不满，同时也表现出了果戈理对祖国发展的深切担忧。此外，“含泪的笑”也会作为名词解释出现，大家要关注一下。"},{"id":"174","stars":"★★★★★","title":"简述俄国文学中的多余人现象","body":"“多余人”这一称谓是在屠格涅夫1850年发表中篇小说《多余人日记》之后才广为流传的，但这类人物的基本特征在\n\n奥涅金身上就已经确定下来了。\n\n“多余人”是出身贵族，生活在优裕的环境中，受过良好的文化教育的青年人。他们虽有高尚的理想，却远离人民；虽不满现实，却缺少行动，他们是“思想上的巨人，行动上的矮子”，只能在愤世嫉俗中白白地浪费自己的才华。他们既不愿站在政府的一边，与上流社会同流合污，又不能和人民站在一起，反对专制制度和农奴制度。他们很是心仪西方的自由思想，他们也很不满俄国的现状，然而他们又是大贵族和权势者的代表人物，不可能与底层人民相结合以改变俄国的现状。\n\n一、“多余人”的具体形象\n\n（一）聪明的废物-奥涅金\n\n普希金诗体小说《叶甫盖尼·奥涅金》里的主人公奥涅金是19世纪20年代俄国进步贵族知识分子的典型，是俄国文学史上第一个“多余人”形象，在某种意义上可以说是“多余人”的鼻祖。\n\n奥涅金具有所有“多余人”的共性，即聪明、博学、有才华；生活在上流社会，过着奢侈空虚的生活；厌恶自己的生活圈子却不得不依赖于它；有理想却缺乏实干精神与坚强的毅力；精神苦闷不知所措，最终迷失自我。他也具有自己的个性，即他对新生活充满了憧憬，厌恶旧有的社会体制，表现出了强烈的叛逆精神。但他没有任何实际工作能力，没有毅力，事事不能坚持到底，内心非常痛苦，性格也更加阴郁、孤僻，被称为“聪明的废物”。\n\n（二）当代英雄-毕巧林\n\n莱蒙托夫小说《当代英雄》中的毕巧林是俄国19世纪30年代的“多余人”形象。此时的俄国正处在农奴制最黑暗最反动的年代，统治者的残暴让人民生活于水深火热之中，革命的前途黑暗渺茫。与第一代“多余人”的代表奥涅金相比，除了拥有“多余人”的共性，毕巧林更狂热，更玩世不恭，更损人利己，更具有破坏性，表现得更加孤独、更加忧郁。\n\n“狂热好动”与“人格分裂”是毕巧林的两大个性。他是一个极端的冷热矛盾结合体。一方面渴望生活，具有丰富的感情与奔放的激情，另一方面对生活和人类丧失信心，往往激情与冷漠并存，显得喜怒无常。他年轻聪明，富有激情，具有深刻的洞察力，也因此对社会看得更透彻，心灰意冷得更彻底，可又止不住幻想，幻想过后又是更大的失望。所以毕巧林的玩世不恭、碌碌无为是那个时代的产物。莱蒙托夫笔下的毕巧林已是一个拥有高度自觉的自我意识的个体，一个冷静地怀疑着、分析着、求索着的个体。他比奥涅金有才能，也敢于真诚地把自身的弱点与毛病都无情地抖搂出来，他是一只勇于与风雨搏击的海燕，因而他的命运也更具有悲剧意味。\n\n（三）理想的斗士-罗亭\n\n屠格涅夫《罗亭》中的同名主人公罗亭是俄罗斯文学史上的第三代“多余人”，产生于19世纪40年代。罗亭最大的特点是雄辩，最大的不足是缺乏实干能力，因此成了典型的“语言的巨人，行动的矮子”。\n\n与奥涅金、毕巧林相比，罗亭更光彩夺目，更具有行动力。他是为了理想而活。罗亭用其热情、勇敢的言辞在青年人的心灵中播下了革命的种子，使之萌生出高尚的思想和感情，激励他们去行动，去战斗。在进行革命斗争的道路上，罗亭是最优秀的革命传道者。虽然很多工作由于缺乏毅力而失败，虽然一生漂泊，虽然最终还是一事无成，摆脱不了“多余人”的宿命，然而，无论在任何时候，罗亭都没有放弃自己的追求，真理与理想之火始终在他的胸中燃烧，为了公众利益，他永不妥协。最后，他战死在巴黎街头。读者可以看到一位英雄的崛起。在众多“多余人”中，罗亭无疑是最富有人性色彩与悲剧色彩的。\n\n（四）“昏睡之神”-奥勃洛摩夫\n\n19世纪50年代的奥勃洛摩夫是“多余人”的“终结者”。冈察洛夫敏锐地感受到了俄国革命的来临，贵族阶级最终要退出历史舞台，是平民知识分子挑起革命重担的时候了。因此他塑造了一个具有“黄金一般美好心灵的”废物。他是一个罕见的好人，却整日耽于幻想、昏沉度日，不理会周遭的一切，不希望生活中有任何变动。虽然有理想，有改良计划，但是从来不付诸实践，友谊和爱情都不能使他振作起来。他是一个没有任何行动能力的寄生虫。\n\n如果说奥涅金、毕巧林、罗亭这些人在沉重历史重担下，尽管困惑彷徨，但毕竟还没有束手待毙，还可以感受到他们存在的力量，也能理解他们是被时代毁了的人而已，那么，到了奥勃洛摩夫时期，能看到的只是丧失一切行动能力的躯壳，没有办法让人产生同情与怜悯，只有鄙夷与厌恶。早期“多余人”身上那种热情和信念，早已被黑暗的社会磨灭，他们已丧失了一切存在的意义，除了同所属的贵族阶级一同退出历史舞台之外，再没有更好的出路。奥勃洛摩夫宣告了俄国贵族革命时期的终结，也宣告了“多余人”时代的终结。\n\n二、“多余人”形象的意义\n\n（一）它揭示了19世纪俄国社会历史发展中存在的一些深刻矛盾和问题\n\n“多余人”形象的现实意义在于，它揭示了19世纪俄国社会的一个重要特征，即社会的停滞和落后。俄国社会在这个时期面临着沙星专制制度和农奴制度的危机，需要进行彻底的变革和进步。但是，由于各种原因，这种变革和进步却受到了很多阻碍和困难。对于旧时代而言，他们是“多余的”，因为他们的思想已经脱离了他们的时代；然而，对于新时代而言，他们也是多余的，因为他们的身份、地位、阶级属性都根深蒂固地处于旧时代的社会结构之中。他们是一种社会现象，也是一种社会问题。他们表明了俄国社会需要变革的迫切性和必要性，也表明了俄国社会变革的困难性和复杂性。\n\n（二）现实主义和批判主义\n\n“多余人”形象的艺术价值在于，它展示了19世纪俄国文学的一个重要特点，即文学的现实主义和批判主义。\n\n俄国文学在这个时期达到了一个高峰，产生了一批杰出的作家和作品。这些作家和作品都以现实主义为基本方法，以批判主义为基本态度，以描写和分析俄国社会现实为基本内容。他们用细致入微、生动逼真、深刻透彻的笔触，塑造了一系列具有典型性和代表性的人物形象。\n\n（三）呼唤关注边缘群体的命运\n\n多余人形象的意义不仅仅在于揭示社会中的不公平和边缘化现象，更重要的是通过对这样的形象的刻画，提醒人们对于社会中边缘群体的关注和关怀。多余人形象是作家们对社会中虚弱群体的关怀和呼唤，是对人们共情和同理心的唤起。通过揭示多余人的命运，作家们希望唤起社会对于这些人的关注，改变社会对于边缘群体的态度和偏见，使他们获得应有的尊重和帮助。\n\n（四）人性价值\n\n俄国文学中的多余人形象还具有一种深刻的人性探讨的意义。通过多余人形象的描绘，作家们反思了人的本质和命运的问题。多余人所表现的是人的无奈和孤独，也体现了人在这个世界上的渺小和无助。他们在社会中艰难求生，却无法找到自己的归属和价值。通过对多余人形象的描绘，作家们让读者反思自身的存在和意义，引发读者对于人生的思考。\n\n从以上“多余人”形象可以看出，“多余人”形象不仅是一种文学现象，也是一种社会现象。它揭示了19世纪俄国社会历史发展中存在的一些深刻矛盾和问题。它表达了俄国知识分子的不满和迷茫，也反映了俄国文学的创新和发展。它是一种具有深刻现实意义和艺术价值的人物形象。","keywords":"奥涅金 聪明的废物 毕巧林 狂热好动 人格分裂 罗亭 雄辩 缺乏实干能力 奥勃洛摩夫 终结者","note":"23年云南师范大学，24年江南大学、中国海洋大学都对“多余人”形象系列进行了考查。“多余人”系列对后世产生了很大影响，比如中国二三十年代文学史上的几个主要“多余人”形象是：鲁迅笔下的涓生、巴金笔下的觉新、柔石笔下的肖涧秋、叶圣陶笔下的倪焕之、曹禺笔下的周萍等等。如有比较类题目，需要大家对这些形象都有所掌握。可拓展阅读翟业军《中俄文学“多余人”形象比较论》、徐慧民《鲁迅笔下的“多余人”与俄国文学史中“多余人”之比较研究》、杨巧珍《中俄文学中的多余人-别里托夫与方鸿渐的形象比较》，资料可在李凡文学正版群中获取。此外，“多余人、奥勃洛摩夫性格”等也常考查名词解释，大家要留心。"},{"id":"175","stars":"★★★","title":"简述俄国文学中的小人物传统","body":"“小人物”指的是十九世纪俄国文学中出现的处于社会阶层底部的人们。他们生活在社会底层，受尽剥削欺凌，但又逆来顺受，胆小怕事。他们是显赫的大人物统治下被侮辱、被损害的牺牲者。俄国一些具有民主主义和人道主义思想的作家，通过塑造这类形象，表达了对这些小人物的同情，批判黑暗的沙皇专制制度。\n\n1830年普希金的《驿站长》开创了俄罗斯文学中“小人物”的先河。此后，果戈理创作的《狂人日记》《外套》，陀思妥耶夫斯基的《穷人》等都塑造了新的小人物形象。\n\n一、普希金的《驿站长》-开创“小人物”形象的先河\n\n普希金的代表作《驿站长》展现了驿站长维林凄苦的一生，揭示了小人物的悲剧命运。作者以故事叙述人的身份描写“她”三过小驿站所见到的维林命运的变化。主人公维林年迈体衰，由于丧偶，晚景孤寂，与女儿杜妮亚相依为命。谁料，他唯一的女儿被贵族军官拐骗。他五内俱焚，徒步去彼得堡想寻回“迷途的羔羊”，可是狠心的贵族军官却将他拒之门外。为此，维林失去了生活的依靠和希望终日闷闷不乐，借酒浇愁，最后含恨死去。作品通篇都令人感到社会的冷酷和残暴，揭示出腐朽的社会已无法挽救和旧制度必然灭亡的历史命运，鲜明地反映出作者的民主主义思想。\n\n《驿站长》塑造了俄罗斯文学史上第一个“小人物”形象。从此，俄国文学界描写“小人物”便蔚然成风。\n\n二、果戈理的《狂人日记》和《外套》-进一步突出了“小人物”的主题\n\n果戈理直接继承了普希金的传统，进一步突出了“小人物”的主题，形成了批判现实主义文学的创作基调。在《狂人日\n\n记》和《外套》这两篇具有相同题材的作品中，作者深刻地表现了当时俄国最尖锐的社会矛盾之-沙皇官僚机构的代表人物与被压迫的“小人物”之间的冲突，无情地揭露了“大人物”的冷酷和利己主义，满怀同情地保护了被侮辱的“小人物”。\n\n（一）《狂人日记》中的波普里希钦\n\n《狂人日记》中的主人公波普里希钦是在一个官僚机构中供职的九等文官，作者在描述他的人生悲剧时，揭示了他的双重人格。一方面，他职务低微，仪表陋俗，才能平庸，生活拮据，服饰破旧，精神上备受压抑。另一方面，他又无时不在留恋昔日年华，倾慕富贵排场，梦想官运亨通，甚至痴迷局长小姐，由于这一切都被“大人物”夺去，他便变得沉溺于幻想，神志不清，终于成为疯子，只能在狂言呓语中宣泄对不合理的社会制度的怨愤。\n\n（二）《外套》中的巴施马奇金\n\n在《外套》中，果戈理用一种幽默而不无夸张的冷峻笔法，刻画了九品文官巴施马奇金这一形象。他历尽千辛万苦省吃俭用做了一件聊以过冬的新外套，却不料在第二天晚上赴宴回家的途中遇到强盗，新外套被从身上剥下夺走。巴施马奇金又急又恼，告到官府，反遭“大人物”一顿训斥。“大人物”的耀武扬威、颐指气使，使一生胆小的巴施马奇金受惊吓而病倒，在家里抑郁而死。\n\n三、陀思妥耶夫斯基的《穷人》-深化“小人物”这一主题\n\n陀思妥耶夫斯基的《穷人》中，作者站在民主主义和人道主义立场上，满怀深情地描写了下层人民的优秀品质。在《穷人》中，卑微的公务员杰符什金生活困苦，但他通过自己的努力将孤苦的少女瓦莲卡从狠毒的地主手里救出，并倾其全力帮助她、保护她，可是，瓦莲卡为生活强迫，沦为娼妓，并接受了一个地主的求婚。这使杰符什金失去了一切，从而对不合理的社会发生了绝望的哀怨。作品反复渲染了底层人民的凄苦生活，逼真地反映了城市贫民的悲惨世界，控诉了专制政权的黑暗与残暴。\n\n四、契诃夫的《套中人》-把“小人物”推向了新境界\n\n19世纪末俄国现实主义作家契诃夫也在继续创作反映小人物生活的作品，小人物形象在其笔下出现了新的变化，从被同情的对象发展成被讽刺和批判的对象。《套中人》《一个文官的死》《胖子和瘦子》和《变色龙》等都描写了被奴化的低级官吏或小职员形象，在沉重的、等级森严的官僚体系和严酷的专制制度压榨下，这些小人物形象身上的人性和尊严已经荡然无存，变得谨小慎微，害怕变革，甚至痛恨革命。通过这些小人物形象的塑造，契诃夫批判了腐朽反动的社会，也对小人物表达了“哀其不幸，怒其不争”的复杂情感。\n\n综上，从普希金、果戈理到陀思妥耶夫斯基、契诃夫，这些有良知的俄国现实主义作家们，着眼于社会的黑暗、人类的痛苦，始终把目光投射在那些被侮辱、被损害的小人物身上，揭露了沙皇专制制度的腐朽和黑暗。","keywords":"普希金 果戈理 陀思妥耶夫斯基 契诃夫","note":"24年江苏师范大学对小人物进行了考查-“谈谈陀思妥耶夫斯基和果戈理作品中小人物的形象”。小人物形象和多余人形象都是很重要的人物形象系列，是俄国现实主义文学对世界文学的贡献，影响十分深远。回答时先对小人物形象做一个简要的解释，然后再回答其发展的脉络及与社会的联系。"},{"id":"176","stars":"★★★★","title":"论述《罪与罚》所叙述的主要问题及叙述特点","body":"小说《罪与罚》是陀思妥耶夫斯基的代表作，反映了作家充满矛盾的世界观以及现代主义的创作倾向，作品涉及的问题及叙述特点如下：\n\n一、《罪与罚》叙述的主要问题\n\n（一）展示了19世纪中叶俄国城市贫民的悲惨境遇\n\n在《罪与罚》中，陀思妥耶夫斯基真实地展示了19世纪中叶俄国城市贫民的悲惨境遇。作者笔下的京城彼得堡是一派暗无天日的景象：草场上聚集着眼睛被打得发青的妓女，污浊的河水中挣扎着投河自尽的女工，穷困潦倒的小公务员被马车撞倒在街头，发疯的女人带着孩子沿街乞讨......与此同时，放高利贷的老太婆瞪大凶狠的眼睛，要榨干穷人的最后一滴血汗；满身铜臭的市侩不惜用诱骗诬陷的手段残害小人物，以达到自己不可告人的目的；荒淫无耻的贵族不断干出令人发指的勾当......作者怀着满腔的激愤和巨大的同情将俄国可怕的社会贫困和穷人走投无路的状况无情地展现在读者面前。表现了作者对贫苦人民的深切同情和对地主阶级、资产阶级的深恶痛绝。\n\n（二）揭示拉斯柯尔尼科夫的“理论”内核\n\n小说还触及了更深层次的东西。在作者笔下，主人公拉斯柯尔尼科夫是一个具有双重人格的人物形象。拉斯柯尔尼科夫\n\n根据自己对现实的观察和思考，创造了这样一种“理论”：人可以分为两类，即“不平凡的人”和“平凡的人”。前者能“推动这个世界”，这种人为了达到自己的目的，可以不择手段，为所欲为，甚至杀人犯罪；后者是平庸的芸芸众生，不过是“繁殖同类的材料”和前者的工具。小说真实地揭示了拉斯柯尔尼科夫的“理论”的内核，这种理论尽管也是对社会不公的一种抗议，但更是对无政府主义的抗议。它不仅不能使主人公获得梦寐以求的穷人的生存权，反而肯定了少数人奴役和掠夺他人的权利。小说深刻地写出了这种“理论”的必然破产，指出了它的极端个人主义的实质。\n\n（三）宣扬“用宗教复活人”的思想\n\n作者试图通过主人公的悲剧，强调一个人如果无视传统和社会准则，那么就会导致道德的堕落和精神的崩溃。最高的审判不是法庭，而是道德；最严厉的惩罚不是苦役，而是良心。不过，作者对这一“理论”的批判始终停留在伦理道德和宗教思想的基点上，并把拉斯柯尔尼科夫的犯罪行为归结为主人公抛弃了对上帝的信仰。作者为他安排的一条“新生”之路，实际上就是与现实妥协的道路，也就是“索尼娅的道路”。作者把索尼娅看作人类苦难的象征，并在她身上体现了虔信上帝、承受不幸、通过苦难净化灵魂的思想。作为一个黑暗社会的牺牲品，索尼娅的形象有着不可低估的意义，但是作为一个理想人物，她却显得苍白。显然，“用宗教复活人”的思想与整部作品所显示的强大的批判力量是不相协调的。\n\n二、《罪与罚》的叙述特点\n\n（一）剖析人物自身感受\n\n《罪与罚》在浓缩的时空中容纳了丰富的思想内容，并充分显示了作家“刻画人的心灵深处的奥秘”的巨大才华。描绘“人的内心的全部深度”，特别是通过人物的自身感受和内心分析，无情剖析人格分裂的主人公的病态心理，正是作家最显著的艺术特色之一。\n\n（二）人物人格的“心理对位体”\n\n作者是将冲突激烈的主人公的两重人格构成的“心理对位体”作为小说的结构中心，以此来制约小说的总体布局。“心理对位体”本身除了始终处在尖锐冲突状态外，它还随着对位双方平衡的破坏而表现出阶段性的变化。主人公拉斯柯尔尼科夫不断地动摇在对自己的“理论”的肯定与否定之间。犯罪前，前者逐渐占上风；犯罪后，两者呈紧张的相持状态；在残酷的现实和道德惩罚面前，主人公终于否定了自己的“理论”。“心理对位体”的几个发展阶段大体决定了小说的布局。由于作者着力于拓宽人物内在的心理结构，小说的情节结构则相对地处在了从属的地位。\n\n（三）复调小说的共时性特色\n\n陀思妥耶夫斯基“创造了一种全新的艺术思维类型-复调型的艺术思维”，作家在小说中提供了多种声音，多种音调，使得小说具备了一种新的品格。在《罪与罚》里，几乎所有的重要人物都有自己的声音，拉斯柯尔尼科夫的“哲学”，索尼娅的“东正教观念”，预审员波尔菲里的“生活求实和法律的观念”，卢仁的极端个人主义和同样极端的“边沁主义”以及地主斯维德里加依洛夫的无耻哲学，等等。好像是众多的地位平等的意识，连同它们各自的世界，结合在某个统一事件中，但互相之间并不融合。每一个人物都成了直抒己见的主体，作品人物的意识成了一种可以称为“他人意识”的东西。这就是“复调小说”的内涵和表现形态。这种艺术上的创新具有十分深远的意义。","keywords":"展示了19世纪中叶俄国城市贫民的悲惨境遇 揭示拉斯柯尔尼科夫的“理论”内核 否定俄罗斯的社会道路和思想 宣扬“用宗教复活人”的思想 剖析人物自身感受 人物人格的“心理对位体”复调小说的共时性特色","note":"作为现实主义作家陀思妥耶夫斯基的代表作，《罪与罚》理所当然地反映了当时俄国的真实状况。同时，这部作品中还浸透着作者个人的思想，体现出了复调小说的特征。此处涉及的名词解释“复调小说”大家要注意积累一下。"},{"id":"177","stars":"★★★","title":"谈谈对陀思妥耶夫斯基小说中的复调现象的认识","body":"复调本是音乐术语，指欧洲18世纪（古典主义）以前广泛运用的一种音乐体裁，它与和弦及十二音律音乐不同，没有主旋律和伴声之分，所有声音都按自己的声部行进，相互层叠，构成复调体音乐。\n\n复调小说是前苏联学者巴赫金创设的概念。巴赫金借用这一术语来概括陀思妥耶夫斯基小说的诗学特征，以区别于那种基本上属于独白型（单旋律）的已经定型的欧洲小说模式。“复调小说”的概念是现代文论的一个重大飞跃，对读者反映论、接受美学、解构主义等都有深刻影响。陀氏“复调艺术”的特点主要表现在：\n\n一、全面对话性\n\n对话是复调艺术的基础和灵魂，复调小说的展开不是从故事情节展开，而是从对话展开。在陀氏的复调小说中，对话并不是单一形式的，是“大型对话”与“微型对话”的结合。\n\n是陀氏小说的“大型对话”。在作品《罪与罚》中，拉斯柯尔尼科夫行为上的罪与法律规范的罚是一组大型的对话关系，拉斯柯尔尼科夫的超人哲学思想即“不平凡的人”与索尼娅宗教拯救罪恶思想形成对话关系。陀氏作品存在的善与恶、是与非、美与丑等等的对立关系都是小说大型对话的表现。\n\n（二）“微型对话”是指作品中的人物之间对话及人物内心对话，这种对话具有双重指向性。一方面是针对话语内容的一般话语，一方面是针对他人语言的他人话语，它们形成同意与反对或两者补充或问与答的对话关系。在《罪与罚》中，拉斯柯尔尼科夫在向索尼娅寻求救赎时，对索尼娅的思想有语言对话上的反驳，在拉斯柯尔尼科夫内心独白也常常出现同意与反对、自问自答的紧张的对话关系。\n\n二、意识主体性\n\n相对于传统“独白型”小说的客体性主人公，复调小说的主人公意识获得了相对的独立与自由，他们的声音被认为是可以与作者平起平坐的有同等价值的意识，主人公意识具有了主体性。\n\n“对陀思妥耶夫斯基来说，重要的不是主人公是怎样出现于世界，而首先是世界对他来说是什么，和他自身对自己来说是什么。”作品《罪与罚》便是从小官吏与拉斯柯尔尼科夫的对话开始的，以内视角引出主人公自己的苦难、彷徨、绝望，以及主人公的处世态度、对现实社会生活的思考，都是通过主人公自己的思考得出的。主人公成为了创作思想言论的主体，而不是作者描绘的客观对象，世界成为主人公视野的一部分，他们的思考与对话不再是作者的传声筒，而是符合主人公身份地位的自己的声音。作者意识进行让步，主人公意识加强，实现了从传统主人公客体向主人公独立意识主体的转变。\n\n三、未完成性\n\n巴赫金在《陀思妥耶夫斯基诗学问题》提到“他们都深切的感受到自己内在的未完成，感到自己有能力从内部发生变化，从而把对他们所作的表面化的盖棺定论的一切评语，全都化成谬误，只要人活着，他的生活意义就在于他还没有完成，还没有说出自己的最终见解”。\n\n在作品《罪与罚》中，主人公拉斯柯尔尼科夫一直与自己争论，“超人意识”与传统社会道德难分高下，使他长期处于紧张的自我精神折磨中，他一直在寻找一个答案，可是即使到了文章最后结局，他接受了法律的惩罚，但他依然也没有找到正确的定论。研究陀氏的作品可以发现，他小说的结尾，往往难以让人觉得一切明晰，这正是复调小说的未完成性特征。陀氏笔下有各种各样的人物，每一个人物都处于与人物自己，与作者，与他人的争辩之中，他们的性格思想在不断的对话中变化，永远没有结局。\n\n四、多声部\n\n巴赫金认为陀思妥耶夫斯基“创造了一种全新的艺术思维类型-复调型的艺术思维”，作家在小说中提供了多种声音，多种音调，使得小说具备了一种新的品格。\n\n在《罪与罚》里，几乎所有的重要人物都有自己的声音，拉斯柯尔尼科夫的“哲学”，索尼娅的“东正教观念”，预审员波尔菲里的“生活求实和法律的观念”，卢仁的极端个人主义和同样极端的“边沁主义”以及地主斯维德里加依洛夫的无耻哲学，等等。好像是众多的地位平等的意识，连同它们各自的世界，结合在某个统一事件中，但互相之间并不融合。每一个人物都成了直抒己见的主体，作品人物的意识成了一种可以称为“他人意识”的东西。这就是“复调小说”的内涵和表现形态。","keywords":"全面对话性 意识主体性 未完成性 多声部","note":"23年杭州师范大学考查“对陀氏‘多声部’小说的理解”。这里“多声部”小说是“复调”小说的另一名称。24年陕西师范大学也对此进行了考查。作为理论家的巴赫金在对文学文本展开研究并深化为理论的过程中，也疏漏了文本存在的一些问题，未能阐释清楚陀思妥耶夫斯基文学文本中复调如何与作家的创作思想、价值观统一的问题。此外，过多从形式角度强调复调，也难以恰当回答陀思妥耶夫斯基作品的价值追求与作品复调结构之间的复杂关系。关于复调理论，详细可参考钱中文《复调小说：主人公与作者-巴赫金的叙述理论》、汪月华《浅论陀思妥耶夫斯基复调小说的创作艺术》，资料可在李凡文学正版群中获取。"},{"id":"178","stars":"★★★","title":"如何理解陀思妥耶夫斯基的小说是对灵魂的拷问","body":"鲁迅先生称陀思妥耶夫斯基是“一位拷问人类灵魂的残酷天才”，准确地指出了其文学创作的特点，并予以了积极评价。陀思妥耶夫斯基的文学创作侧重探讨人，尤其是人内心自我的复杂性，表现苦难及苦难中人的追求与犯罪，注重从信仰和灵魂的角度思考问题，使得他的作品具有强烈的震撼力，触及灵魂深处。\n\n一、“心理现实主义”是陀思妥耶夫斯基的创作观\n\n陀思妥耶夫斯基以表现心理的真实为己任，将自己的文学称之为“心理现实主义”。19世纪中后期的俄罗斯发生了巨大的社会变化，尤其是随着农奴制度的废除，资本主义得以在封建习气仍然十分浓厚的俄罗斯内部大力发展，这些都对人们的思想道德观念产生了很大的影响。出身于平民家庭的陀思妥耶夫斯基对城市贫民的生活非常熟悉，深切地感受到社会动荡带来的种种社会问题，尤其是人内心世界的痛苦与精神的异化感，决定将文学拓展到人的精神领域，揭示人的本性或人性的复杂。\n\n二、陀思妥耶夫斯基较为关注的是人的病态思想和潜意识体验\n\n在人的精神世界中，陀思妥耶夫斯基较为关注的是人的病态思想和潜意识体验，涉及乱伦、凶杀、癫狂等伦理或心理问题，触及较少被反映的禁区或空白，直面了人性的阴暗面，反映了善与恶在人物心灵中的较量，从而在较深层次上拷问了人的灵魂。例如，在其代表作《卡拉马佐夫兄弟》中，描写了这个家庭父子身上人性本身的邪恶，以及善与恶对他们灵魂的争夺，呈现了精神的焦灼不安与人格濒临分裂的痛苦。\n\n三、陀思妥耶夫斯基拷问灵魂的目的是为了表达宗教救赎的主题\n\n陀思妥耶夫斯基致力于表现人们心灵承受的深重苦难和人性的阴暗面，但他的作品并没有让人感到消沉悲观，因为他表现的目的是为了寻找解决之道，其笔下的人物最后总能在宗教宣扬的谦卑与博爱中找到内心的安宁。例如，《罪与罚》中的青年大学生拉斯柯尔尼科夫为了证明自己是“不平凡的人”而走向杀人之路，但却陷入无穷无尽的精神折磨，最后在索尼娅的指引下主动“自首”接受惩罚，找到了心灵的宁静与宽慰。\n\n总之，陀思妥耶夫斯对人物心灵的拷问是在一定的时代背景下形成的，其对内心世界的关注仍然是为了揭露现实的丑恶与非人道，从而为人们背负着沉重十字架的灵魂找到一条救赎之路，虽然带有宗教说教的色彩，但其不避禁区、大胆探索的勇气以及充溢其中的人道主义情怀，都具有积极的意义。","keywords":"“心理现实主义”病态思想和潜意识体验 宗教救赎","note":"陀思妥耶夫斯基作为一位思想和创作都极为复杂的作家，在作品中呈现了其极为深刻的对人性的认识，通过拉斯柯尔尼科夫等一系列人物形象，深刻诠释了对灵魂的拷问，对精神的关注，以及通过宗教进行的思想救赎。他对病态心理的描写极为擅长，同时具有强烈的人道主义思想，他关注现实的丑恶，假民主，假自由，假平等，他的人格和创作艺术都散发着无限的魅力，他关注现实，批判现实，表达民主思想，既敢于揭露，又有浓厚的悲悯情怀，这都使得他长期立于世界文坛。"},{"id":"179","stars":"★★★★★","title":"托尔斯泰小说创作的思想及艺术特征","body":"一、思想特征\n\n（一）寻求人类真理\n\n托尔斯泰出身贵族，但他总是独立地按自己的人生准则去生活，他主动地接近人民，苦苦地追寻着消除贫富，使广大民众摆脱贫困境遇的方法，认真地思考祖国以及人类的命运与未来。他始终认为，真正的作家要严于律己，热爱人民，热切地为他们谋幸福。托尔斯泰的一生，就是在焦虑与不安、对真理紧张不断地求索和勤奋地创作中度过的，他是一位为寻求人类真理而献身的高尚的殉道者。\n\n（二）作品中蕴含着一颗正直无私、纯真善良的巨人之心\n\n托尔斯泰通过文学创作对现存的制度和现实生活中一切虚伪、荒谬与不人道、不道德的东西进行了无情的、毁灭性的揭露和批判。他认为人身上存在着灵魂与肉体的矛盾，他把物质的、肉体的欲望同利己主义联系起来，主张人应该让灵魂主宰肉体，从而走向道德自我完善。他认为私有财产是诱发人的私欲、滋生人类恶的外在根据，主张彻底铲除私有财产制度，但他又从宗教道德的人生观出发，主张放弃一切形式的社会斗争，“勿以暴力抗恶”，否定同恶进行暴力斗争。他高度重视人、尊重人、同情人，对人及其内在的力量，对人类崇高的精神品质始终给予高度信赖，即使在悲观中也永远富有崇高与乐观，因而始终富有人性的魅力。\n\n二、艺术特征\n\n（一）全景式的史诗性叙事艺术\n\n描写人的外在生活和心理现象，使托尔斯泰的创作显得博大精深。他小说叙事的惊人广度、对人物内心世界的深刻刻画、对社会恶的大胆暴露、对崇高道德的追求、对那些应当成为社会生活之基础的真正合乎人道的原则的揭示，使其作品既具有再现生活的广阔性和丰富性，又具有表现人的心灵世界的深刻性和真实性。\n\n（二）“心灵辩证法”\n\n托尔斯泰在心理描写上表现出了卓越的才华，这是他对现实主义文学作出的巨大贡献。他把个人、人民和人类在精神上的完善与复活，作为改造社会的最高理想，这是他创作激情的来源。他致力于对人的灵魂与道德问题的探索，从体悟与解剖自己的心理开始，推己及人地在作品中表现人物的心理。他最感兴趣的是心理过程本身的形态和规律，他能描述出一些感情和心理怎样演变为另一些感情和心理，展示心理流动形态的多样性与内在联系。这就是车尔尼雪夫斯基评价托尔斯泰心理描写技巧时所说的“心灵辩证法”的基本内容。托尔斯泰描写人的心理的复杂性时所关注的，不是人的心灵中那些阴暗、神秘莫测的东西，而是性格发展和人们战胜黑暗与邪恶的能力。在这方面他和把人的灵魂看作是一个无底深渊的陀思妥耶夫斯基有着明显差别。\n\n三、善于把握人物性格与环境之间的辩证关系，注意揭示人物性格的内在力量和自主性\n\n托尔斯泰和其他现实主义作家一样，在描写人物时常常指出他们对环境、对社会状况的依赖关系，但是，他的独特性在于，他把揭示人对环境的反抗，展示出性格的自主性特征，把描写性格同环境的冲突、性格对环境的超越作为创作的重要任务。他笔下的那些探索型人物的性格与环境每每发生冲突，都企图克服环境的影响，走向精神的独立，并在冲突中展示超越性与自主性，从而说明环境的落后与不合理。在这个方面，托尔斯泰与果戈理、巴尔扎克、狄更斯、福楼拜等注重描写性格的自在性，强调性格对环境的依赖作用的现实主义作家，有明显的不同。","keywords":"思想特征 寻求人类真理 正直无私 纯真善良 艺术特征 全景式的史诗性叙事艺术“心灵辩证法”人物性格与环境之间的辩证关系 人物性格的内在力量和自主性","note":"托尔斯泰是俄国现实主义文学家中最重要的一位，他的思想虽有局限性，但他在作品中表现出来的对人的肯定与认同，体现出了他正直无私、纯真善良的性格。而在艺术上，托尔斯泰的心理描写和对人物性格与环境关系的处理，和其他现实主义作家有很大区别，需要重点掌握。“心灵辩证法”也会单独设题，东北师范大学在24年就对此进行了考查，要求结合《安娜·卡列尼娜》谈谈“心灵辩证法”，这是作品艺术特征之一，可查看后续相关题目。此外，“心灵辩证法”也常考名词解释，大家要重点关注。"},{"id":"180","stars":"★★★★","title":"结合作品谈谈托尔斯泰的人道主义精神","body":"列夫托尔斯泰的人道主义思想，不仅表现在他的文学作品中，也表现在他的生活中，他的人道主义思想相当完整，极富个人色彩。具体说来，托尔斯泰的人道主义思想可以归纳为以下几个方面：\n\n一、同情底层人民，敌视专制与农奴制\n\n与18-19世纪的俄国作家一样，托尔斯泰对处于社会底层的人寄予极大的同情，对于专制制度和农奴制非常敌视，对于社会不公极为愤慨。这种俄罗斯文学中人道主义的优秀传统在托尔斯泰这里体现得更加明显，如《舞会之后》就揭露了专制制度的残忍和不人道，《黑暗的势力》揭露资本主义制度的罪恶。\n\n二、对人性的探索\n\n与陀思妥耶夫斯基相近，托尔斯泰也认为人性是复杂的。但他更具体地对人性进行了分析，认为人性中既有与神类似的神性方面，也有与尘世万物相仿的动物性方面，二者缺一不可，这是由人的生命决定的。不过，二者在人的生命整体中的地\n\n位和作用是大不相同的，动物性生命并非人的生命的真正内容，决定人之为人的是神性的生命，而非动物性生命。托尔斯泰认为，人在自己一生中应努力向上帝靠近，向神性的生命靠近，净化自己的心灵，这样才能挣脱动物性的束缚。\n\n《安娜·卡列尼娜》中列文和安娜两个人物的对比很好地说明了托尔斯泰的这一思想，列文迷惑于死之奥秘，进而苦苦地追寻生的意义，他试图放弃部分财产，尝试与农民一起劳动，想在平凡的生活中体验生命的价值，但并不能解除苦恼。农民普拉东的话启发了他：人应该“为上帝、为灵魂而活着”。他终于明白，上帝不是高高在上的神秘存在，“神力的明确无误的表现，就是藉着启示而向人们显露的善的法则，而我感觉到它就在我的心中”。这样，列文在向神靠近的过程中得到了精神上的新生。安娜没能获得这种新生，“因为她过于关注个人的幸福-几乎完全以身体幸福的获得为满足，从未感受到内心神性的存在，也从未通过理性的方式去寻找过心中的神性，从未有过向神性靠近的努力，所以，安娜最终只能在精神错乱的状态下走向死亡，走向作家早已预设的一个结局。”\n\n三、道德的自我完善\n\n在托尔斯泰看来，人之向上帝靠近的过程也就是道德自我完善的过程。这是一个人人自己可以实现且只有自己才可以实现的过程，在这方面人人是平等的，正因为如此，才有“道德自我完善”的命题。\n\n如在《复活》之中，男女主人公复活的道路是不同的，但作者认为他们的精神归宿是一致的，即“博爱”与“宽恕”。托尔斯泰通过对男女主人公“复活”的描写，强调了“道德自我完善”在改造人与社会中的重要作用。\n\n四、“勿以暴力抗恶”\n\n由道德自我完善理论必然会推出“勿以暴力抗恶”的论断。托尔斯泰的“勿以暴力抗恶”是从理性和爱出发的，是为了实现他的理想世界而提出来的。\n\n“勿以暴力抗恶”原则不仅与托尔斯泰的道德理想紧密相联，而且它自身也不是简单空洞的。它含有两方面的内容，其一是对现实的暴力统治的抗议。暴力是恶，现实的暴力是现实的恶，这是此原则的基本要义。正是基于这一要义，托尔斯泰在他的许多著作中都尖锐地揭露了现实的暴力之残酷与丑恶。他在《复活》中揭露“法院无非是一种行政工具，用来维持对我们的阶级有利的现行制度罢了”，揭露监狱长和看守们“十分心安理得地用尽一切力量去虐待人们”，揭露那些将军们的“职责就在于把男女政治犯监禁在地牢和单人牢房里，而且把这些人囚禁得不出十年就死掉一半”，揭露他们“为了消除一个真正危险的人，宁可利用惩罚来消除十个没有危险的人”等等。\n\n其二，对如何铲除暴力的思考，托尔斯泰认为，暴力是恶，即使为了铲除暴力之恶也不能使用暴力，因为铲除暴力的暴力也是恶，如果以暴易暴，最后仍然是暴力统治，仍然是恶的世界。所以，“要取得实际上的自由，不能靠任何新的暴力机关，而只能靠停止服从他人的意志。”而要使人停止服从他人（首先是作为以暴力进行统治的国家）的意志，那就要使人在理性上掌握真理。在他看来，让人们掌握真理是最难的，需要付出长久努力。\n\n托尔斯泰的人道主义精神是其文学与思想的核心支柱，既体现在对个体灵魂的深刻悲悯，也表现为对制度性压迫的激烈批判，对俄国社会和人类思想的发展产生了深远的影响。","keywords":"同情底层人民 敌视专制与农奴制 对人性的探索 道德的自我完善 勿以暴力抗恶 抗议 思考","note":"①除却上述文字之外，还要注意托尔斯泰所处的历史背景，19世纪俄国社会的农奴制改革和社会动荡，这些现实问题如何影响他的创作。他的作品不仅是对个人道德的探讨，也是对社会制度的批判，这体现了他人道主义精神的社会维度。②还要注意托尔斯泰的人道主义精神对后世的影响，比如对甘地、马丁·路德·金等非暴力运动领袖的启发。这样可以让回答更加全面，展示其思想的深远意义。"},{"id":"181","stars":"★★★★","title":"简述《复活》的艺术特征","body":"托尔斯泰晚年写的长篇小说《复活》对俄国旧社会的揭露和批判空前激烈，对托尔斯泰主义的宣传也异常集中，可以说是他世界观和创作的总结。这部小说的艺术特征，主要包括以下内容：\n\n一、强烈的场景对比\n\n《复活》是一幅“无与伦比的俄国生活的图画”，小说成功地运用强烈的场景对比来揭示主题，如聂赫留朵夫的早晨与玛丝洛娃的早晨，副省长的沙龙与监狱里的体刑等等。平凡的生活现象通过作家在布局上的调动造成了强烈的反差，生活现象本身深刻的社会意义和震撼人心的艺术力量，在这些对应场面的不协调中显示了出来，效果强烈。\n\n二、思想上把人的精神复活看作社会根本转变的起点\n\n托尔斯泰在《复活》中通过对男女主人公精神复活的描写来体现恶的社会的转变。\n\n首先是纯洁善良、追求理想的阶段。第二阶段是放纵情欲、走向堕落。第三阶段是从忏悔走向复活。法庭上与玛丝洛娃重逢后，聂赫留朵夫心灵深处的“精神的人”开始苏醒，他决心悔过自新。这时，按作者的观点看，“精神的人”战胜了“动物的人”，聂赫留朵夫走向了灵魂的“复活”。这就是人性由失落到复归的过程，也即改恶从善，善战胜恶，道德自我完善的过程。\n\n（二）玛丝洛娃是一个被侮辱与被损害的下层妇女的形象\n\n玛丝洛娃的生活经历是通过描写她同社会现实的基本冲突的角度展现出来的。她的“复活”是通过纠正她在病态社会里所染上的恶习来完成的，是通过认识善的存在的可能性、树立对善的信念来实现的。\n\n男女主人公复活的道路是不同的，但作者认为他们的精神归宿是一致的，即“博爱”与“宽恕”。托尔斯泰强调了“道德自我完善”在改造人与社会中的重要作用，但这种宗教道德药方是空想性、虚幻性的，也是具有消极性的。不过，作为一个“最清醒的现实主义者”，作者阐述了这样一个道理：人的精神的升华和人的成长，不仅意味着对现实恶的否定，也意味着对产生这种恶的社会根源的否定。小说的这一思想是深刻而积极的。\n\n三、强烈的批判性\n\n在作品中，作者“撕下一切假面具”，对沙皇俄国时代的一切国家制度、社会制度、教会制度和经济制度作了强烈的批判。小说对宗教式虚幻世界的追求与对现实中各种社会现象之实质的深刻洞察、揭露与批判是共存的。因此，尽管这部作品在思想内容上有消极性的一面，但它的社会批判的深度和力度以及对社会各阶级描写的表现力，是超过作者以往任何一部作品的。此外，小说还突出地表现出作者讽刺的才能。这部作品的强烈的批判性和深刻的揭露性，常常是在对一定的生活方式、人的行为和社会制度的讽刺性描写中表现出来的。\n\n四、史诗风格\n\n《复活》在题材的广泛性、内容的深刻性和丰富性以及心理描写技巧的多样性方面，又一次呈现了史诗的风格。小说围绕女主人公玛丝洛娃蒙冤下狱并被流放、聂赫留朵夫为她奔走上诉以及陪她前往西伯利亚这条线索，以描写男女主人公的遭遇及其所处的社会环境为主，广阔而深入地反映了沙皇俄国的面貌，真实而又富有艺术性地反映了农奴制改革的前期，沙皇统治下贵族制度的腐朽与颓废。","keywords":"强烈的场景对比 人的精神的升华 人的成长 强烈的批判性 史诗风格","note":"《复活》是托尔斯泰晚年十分重要的一部作品，是托尔斯泰创作观和世界观的总结，体现了强烈的批判性，这种批判性主要通过强烈的对比体现出来。而作者的思想，也主要蕴含在男女主人公“复活”的过程中。"},{"id":"182","stars":"★★★★","title":"论述《复活》中“复活”内涵及其意义与局限性","body":"一、“复活”的内涵\n\n“复活”的内涵主要是由小说的男女主人公的心路历程体现出来的。\n\n（一）聂赫留朵夫是一个“忏悔贵族”形象，他经历了从纯洁善良到放纵堕落再到忏悔反思的自我道德“复活”，体现了托尔斯泰主义的说教，是“托尔斯泰主义”的化身，他的思想和性格的发展经历了三个阶段：\n\n（1）纯洁善良、追求理想的阶段\n\n这时的聂赫留朵夫健康、真诚、充实、崇高，乐于为一切美好的事业而献身。他信奉斯宾塞“正义不容许土地私有”的理论，把继承父亲的土地送给了农民。他真诚地爱着姑母家的半养女半婢女的玛丝洛娃，此时他的爱情具有一种纯洁和富有诗意的特点。\n\n（2）放纵情欲、走向堕落的阶段\n\n小说强调了生活中“通行的”和“习惯的”东西对聂赫留朵夫的影响。当他厌恶自己的不洁欲望时，“应该像大家那样去做才对”的声音很快压倒了那点善良的念头，于是，他很自然地滑向了堕落的泥潭，变得猥琐、低下、空虚和渺小。托尔斯泰在作品中较为充分地展示了男主人公灵魂深处两种矛盾的感情冲突：真正的爱和淫欲、希望玛丝洛娃幸福和渴求肉欲的享乐的冲突。\n\n（3）从忏悔走向复活的阶段\n\n法庭上，聂赫留朵夫走向了灵魂的“复活”。聂赫留朵夫与玛丝洛娃不期而遇，他的心灵上受到了强烈的震撼，沉睡在心灵深处的精神的人开始苏醒。他认清了自己虚伪可耻的面目，决心悔过自新。他为玛丝洛娃四处奔走，还按照“真理的原则”处理家庭财产，最后在上帝那里找到了灵魂的归宿。\n\n（二）玛丝洛娃经历了纯真少女到娼妓囚徒再到重获新生的“复活”历程：\n\n（1）天真美好的少女时期\n\n玛丝洛娃原是一个农妇的私生女，由于母亲早死，被女主人收养，成为主人家里的婢女兼养女，16岁时，她与女主人的侄子聂赫留朵夫真诚相爱，热情地憧憬着未来，然而她的幻想、憧憬被阶级的壁垒撞了个粉碎。当聂赫留朵夫成为近卫军之后，卑鄙地占有了她，塞给她100卢布，无情地抛弃了她。\n\n（2）遭受凌辱，自暴自弃，怨恨社会的阶段\n\n玛丝洛娃由于不明不白地怀了孕，被女主人赶出了家门，在经历了说不清的凌辱和痛苦之后，她最终走上了那个黑暗社会为她这样的弱女子安排的唯一出路-沦为娼妓。她的悲惨遭遇，使她对聂赫留朵夫以及整个黑暗社会产生了深深的仇恨，这种发自内心的控诉和谴责，是对贵族们居高临下的施舍行为的反抗，更是对自己作为人的应有尊严的护卫。\n\n（3）从谅解走向复活\n\n托尔斯泰在作品中刻画了玛丝洛娃回到牢房的心理活动。“她明白他是一个什么人，决不会对他让步，决不容许他像从前在肉体上使用她那样现在又在精神上使用她，她决不容许他把她变成他表现宽宏大量的对象。”这种想法，直观地表明了玛丝洛娃从过去的自暴自弃、麻木不仁的生活中真正觉醒了。\n\n但在后续的故事发展中，玛丝洛娃对聂赫留朵夫的认识和态度发生了质的变化。由于聂赫留朵夫真诚的悔改，再加上青年时期他们确实有过一段真诚的恋爱，于是她不仅原谅了聂赫留朵夫，并又一次爱上了他。这就是作者描写的玛丝洛娃的“复活”的精神内核-完全为别人着想，为此不惜牺牲自己的个人感情、个人幸福，从而求得道德的自我完善。\n\n二、“复活”主题的意义\n\n（一）作者通过“复活”体现其创作主旨和社会理想\n\n作者把在出身、地位、教养、经历等方面迥然不同的两位主人公艺术地捏合在一起，通过二人精神上的“复活”生动地体现自己的创作主旨及思想体系，艺术地阐释其改良社会的理想，即他的“不以暴力抗恶”“道德自我完善”“爱仇敌”等学说主张。\n\n（二）“复活”具有超越时代和阶级的典型性\n\n在这部作品中，作者通过讲述两个主人公的故事，挖掘普遍的人性。作者不仅着眼于他们现阶段的道德面貌，更是表达了自己对未来的向往。通过这些人物追求美好的道德理想、和谐的人际关系，反对人与人之间的敌对、剥削和压迫，反映了人类追求道德完善的不懈努力和执着精神，因此作品具有超越时代和阶级的典型性。\n\n三、“复活”主题的局限性\n\n（一）脱离现实\n\n托尔斯泰对社会问题提出了道德解决方案，主张放弃一切形式的社会斗争，这是不切实际的，甚至在人民革命运动兴起时期表现得较为消极和反动。\n\n（二）阶级局限性\n\n托尔斯泰关于道德自我完善和精神纯洁的思想是针对贵族阶级的道德堕落而提出来的。《复活》中，玛丝洛娃是农民阶级的代表人物，而聂赫留朵夫是贵族阶级的代表人物。倘若人人能够像玛丝洛娃原谅聂赫留朵夫一样，那么俄国的社会矛盾、种种的不合理现象也就解决了。托尔斯泰把这一方案献给俄国，期望人人完成自我的道德完善。他的乌托邦的幻想充分反映了俄罗斯农民幻想的不成熟，政治素养的缺乏和革命的软弱性，这是作者的不足和局限，也是历史与现实的产儿，更是俄罗斯宗法制农民的思想模式的文化使然。","keywords":"男女主人公的心路历程 忏悔的贵族 托尔斯泰主义 从谅解走向复活 典型性 幻想成分 贵族阶级的道德堕落","note":""},{"id":"183","stars":"★★★★★","title":"《安娜·卡列尼娜》的艺术特点","body":"一、以史诗性的笔调描绘社会生活\n\n《安娜·卡列尼娜》具有史诗式的生活涵盖面和大容量地反映社会问题的特点，从彼得堡利欲熏心的上流社会到改革风波冲击下的农村庄园，生活内涵极为丰富，这为人物形象的丰满创造了条件，而人物的广泛活动也有力地拓宽了长篇小说表现\n\n生活的幅度。作家不仅探索了家庭婚姻、伦理道德、农村经济关系与阶级关系这些重要问题，还广泛涉及了社会制度、政治思潮，以及哲学、宗教、艺术、教育等一系列问题。因此，这部小说成为反映那一时代俄国生活的百科全书式的巨著。\n\n二、拱形结构\n\n小说有两条线索：一条线索写贵族妇女安娜对贵族青年军官伏伦斯基产生爱情而离开家庭后又受到伏伦斯基的冷遇，终于绝望而卧轨自杀。这里表现了城市贵族和资产阶级生活的状况。另一条线索写外省地主列文和贵族小姐吉提的恋爱，经过波折结成了幸福家庭。这里反映了农奴制改革后俄国农村的动向，也体现了作者的社会理想。两条线索并非各自独立，而是相互照应。作者用有形和无形的方式使两条主线联结成自然而严整的拱形结构：\n\n（一）有形：小说在两条主线之间穿插了奥勃朗斯基和道丽的家庭生活这条中间线，它在外部结构上成了两条主线的拱顶结合处。\n\n（二）无形：小说运用人物向心对照法沟通了两条主线间的内在联系。男女主人公安娜和列文的对照贯穿了小说的始终。此外，安娜和道丽、列文和奥勃朗斯基、奥勃朗斯基和卡列宁等也形成对照。这就使两条平行主线在社会的、宗教伦理的和心理内容的意义上互相沟通，共同表现着小说深刻的主题。\n\n三、出色的心理描写\n\n（一）小说注重描述人物心理运动、变化的过程，体现出“心灵辩证法”的主要特点。如列文的心理运动是伴随着精神探索的历程有层次地展开的。此外，小说还有许多对人物瞬间心理变化过程的描述。这类描写往往准确、深刻地披露了特定情境中人物的心理变化过程。\n\n（二）小说善于通过描写人物的外部特征来揭示其内心世界。作者常常利用眼神、动作来传达内心情感，这种直接的、自然发展中的情感与心理更显真实。如安娜形象的美主要导源于她那丰富的情感与心理世界。\n\n（三）小说通过内心话语的描写直接展示人物的内心世界。托尔斯泰描写的内心话语常常表现出不规则、间断跳跃和随机的特点，使所揭示的心理内容更真实、自然和深刻。小说对安娜自杀前的内心话语的描写就是这方面的典型例子。","keywords":"史诗性 拱形结构 有形 无形 心理描写 心灵辩证法 外部特征 内心话语","note":"《安娜·卡列尼娜》作为托尔斯泰的代表作之一，典型地体现了他的艺术创作风格。小说在思想上是当时托尔斯泰精神状态的艺术外化；在艺术手法上，延续了史诗体小说的创作风格，并且集中体现了托尔斯泰的心理描写艺术；在结构上，小说严谨缜密，构成拱形结构。上述几点都有可能单独设题，需着重把握。"},{"id":"184","stars":"★★★★","title":"谈谈你对《安娜·卡列尼娜》中安娜形象的认识（25浙江师范大学）","body":"一、热爱生活，向往真正的爱情\n\n安娜天赋卓越，真诚坦率，充满着生命的活力。她具有强烈的情感，这种情感有时表现为纯真的母爱，有时表现为炽热的情爱，有时还表现为火样的愤怒、深深的绝望和难忍的屈辱等等。在这些感情中表现最强烈并且贯穿始终的是安娜对生活的热爱和对真正爱情的向往。她不仅外貌娴雅、端庄、自然而质朴，而且有丰富深刻的精神世界、强烈而真挚的感情、充沛的生命力和获得真正幸福的渴望，在思想道德和才智等方面，她都高于当时一般的贵族妇女。\n\n二、具有资产阶级个性解放思想的贵族叛逆者\n\n在她对爱情自由的执着追求中，表现出了她性格的正直、坦率、勇敢和心灵的高尚、精神境界的崇高，展示出有生命的、生机勃勃的个体对平庸的、死气沉沉的现实环境的顽强反抗。作为贵族社会思想道德的叛逆者，安娜追求的虽然只是个人的爱情自由，采用的也只是个人反抗的方式，但她勇于面对整个上流社会，誓死不做虚伪的社会道德的俘虏：在冲破封建束缚、反抗社会压迫方面，她做到了处在她那个地位和环境中所能做到的一切。这对当时的贵族资产阶级社会，具有深刻的批判揭露意义。\n\n三、性格的丰富与矛盾\n\n安娜在热烈追求时又常常自我谴责，在大胆反抗时又时时妥协，个性坚强又恐惧多疑。她的思想和行为不时受到封建道德和宗教感情的内在制约，她无法真正脱离所处的贵族社会，这使她的抗争从一开始就带上了悲剧色彩。\n\n四、悲剧性的命运\n\n安娜追求的只是个性的解放，却为之付出了昂贵的乃至生命的代价。这一悲剧深刻地反映了沙俄社会及其法律、道德、宗教的虚伪，也清晰地表明，尽管安娜的追求符合时代发展的趋势，但是孤独的反抗方式决定了她不可能获得幸福的结局。安娜的悲剧从根本上说，是由那个罪恶的社会造成的。","keywords":"热爱生活 向往真正爱情 个性解放 叛逆者 性格的丰富与矛盾 悲剧命运","note":"24年贵州师范大学对安娜形象做了细致考查。安娜身上有着对真正生活的向往，执着追求爱情自由，体现出了一种反抗精神。大胆追求有价值的生活和个性解放是安娜最鲜明的特点。但她是一个悲剧性的人物，她的悲剧是由她内心爱的追求的脆弱性和外部社会的罪恶两方面造成的。而也正是由于安娜的追求并未达到善与人道的最高形式，所以作者对她的态度十分矛盾。"},{"id":"185","stars":"★★★★","title":"谈谈《安娜·卡列尼娜》的经典性","body":"《安娜·卡列尼娜》经久不衰的原因在于它具有永恒的艺术魅力和艺术经典性，主要表现在以下几个方面：\n\n一、思想内容的经典性\n\n（一）充分展现俄国社会生活的复杂矛盾和时代特征。小说通过安娜和列文追求新生活这两条平行而又互相联系的线索，以史诗般的风格展现了农奴制度废除以后俄国动荡不安的社会生活，真实地反映了19世纪70年代俄国社会生活的复杂矛盾和时代特征，也体现了这个时期托尔斯泰思想的变化。\n\n（二）批判贵族社会的虚伪和落后。通过安娜追求爱情的悲剧，作品批判了贵族社会的虚伪。列文进行改革失败，最后在宗教中获得解脱，反映了农奴制废除后俄国农村的动向，体现了托尔斯泰的社会思想。\n\n（三）深刻再现了托尔斯泰的精神痛苦。这部作品写于他世界观激变的前夕，真实记录了托尔斯泰本人的精神探索，尤其是他的精神痛苦。列文体验到的改革失败的痛苦，对俄国现实的焦虑，很好地反映了托尔斯泰的思想特征。\n\n二、人物形象的经典性\n\n（一）安娜是一个有着资产阶级个性解放思想的贵族社会的叛逆者形象，通过这一形象的毁灭，托尔斯泰批判了贵族上流社会的虚伪与堕落，剖析了其悲剧的社会内涵，同时反映了托尔斯泰思想的局限以及他坚持现实主义创作原则的胜利。\n\n（二）列文是“忏悔贵族”的典型，具有自传性色彩的主人公。这一人物形象更多的是在探索俄国社会的发展道路。他以“不流血的革命”来抵制资本主义的侵蚀，但这样的社会主张不过是美丽的幻想，列文精神濒临崩溃，最后在宗教中获得灵魂的安宁。通过这一精神探索者的形象，托尔斯泰表达了自己的社会思想。\n\n三、人物悲剧的经典性\n\n（一）封建社会和虚伪的道德习俗造成了安娜的不幸。被姑母安排的门当户对但没有感情的婚姻从一开始就成为安娜不幸的根源。安娜在封建专制社会里追求个性解放、感情自由，必然引起社会顽固势力的反扑。走投无路的安娜选择了自杀，以自己的生命完成了对封建社会和习俗的最后也是最强烈的抗争。\n\n（二）安娜自我思想意识未能彻底解放，也成为其悲剧命运的内在原因。她无法从心理上彻底摆脱社会习俗和舆论对其行为的指责，常常产生“犯罪”的恐惧，加剧了其内心的矛盾和痛苦，只能通过自杀来寻求解脱。\n\n（三）托尔斯泰对安娜追求个性解放的矛盾态度，也是造成安娜悲剧的一个原因。在小说中，托尔斯泰虽然将美丽的外表和丰富的精神世界赋予了安娜，并倾注了深刻的同情。但就托尔斯泰自身的婚姻观、价值观来看，他一直都不赞成西方的个人主义思想，反对女性抛弃家庭的责任，主张传统的女性观。所以，他给予安娜的命运结局是悲剧性的。\n\n四、艺术成就的经典性\n\n（一）以史诗性的笔调描绘社会生活。《安娜·卡列尼娜》具有史诗式的生活涵盖面和大容量地反映社会问题的特点，是反映那一时代俄国生活的百科全书式的巨著。\n\n（二）拱形结构。小说中两条线索平行发展，相互照应。作者用有形和无形的方式使两条主线联结成自然而严整的拱形结构，使两条平行主线共同表现着小说深刻的主题。\n\n（三）出色的心理描写。小说注重描述人物心理运动、变化的过程，体现出“心灵辩证法”的特点。作者善于通过人物的外部特征和内心话语内外两部分来描写人物的内心世界。\n\n总之，《安娜·卡列尼娜》巨大的思想和艺术价值，使得这部巨著自发表起经久不衰。","keywords":"思想内容 俄国社会生活 虚伪落后 精神痛苦 人物形象 安娜 列文 人物悲剧社会 自我 作者矛盾态度 艺术成就 史诗性的笔调 拱形结构 心理描写","note":"上述几个知识点之间都是相互关联的，《安娜·卡列尼娜》的经典性其实就是论述其在艺术手法、人物塑造和主题思想等方面取得的成就，简要概括前面内容即可。"},{"id":"186","stars":"★★★","title":"《包法利夫人》中的爱玛和《安娜·卡列尼娜》中的安娜都因爱情而死，分析二者命运异同","body":"一、相同点\n\n（一）爱玛和安娜的悲剧都是社会造成的\n\n福楼拜以现实主义的深刻描绘，指出爱玛的悲剧是社会造成的。修道院违背常情的宗教生活戕害了爱玛稚弱的心灵，浪漫主义文学作品又使她对爱情生活充满虚妄的遐想。狭隘闭塞、单调沉闷的外省环境和缺乏精神生活的家庭，不能满足她感情生活的要求，而淫靡享乐的社会风气，进一步腐蚀了她的心灵。终于在罗道耳弗的引诱下，走上了堕落的道路。\n\n安娜是一个追求新生活，具有个性解放特点的贵族妇女形象，她的悲剧是她的性格与社会环境产生尖锐冲突的必然结果。安娜无法在那个虚伪冷酷的环境中继续生存，只能以死来抗争，用生命向那个罪恶的社会提出了强烈的抗议和控诉。安娜的悲剧从根本上说，是由那个罪恶的社会造成的。\n\n（二）爱玛和安娜命运的转折都源于对爱情和生活的渴望\n\n少女时期，爱玛被送到修道院寄宿学校陶养。在修道院里，她养成了贵族的思想感情，幻想浪漫主义小说中所描写的恋爱生活。她渴望真正的爱情与生活。情场老手罗道耳弗看穿了爱玛的渴望，乘虚而入。失足的爱玛从此不可遏止地走向堕落和毁灭的道路。\n\n安娜热爱生活，向往真正的爱情。对伏伦斯基的爱激起了她对真正有价值的生活的强烈渴望。她不愿再克制自己，而是冲破封建束缚，去反抗社会的压迫。\n\n（三）爱玛和安娜都因为对生活失去希望而自杀作为自己生命的结束\n\n《包法利夫人》中，堕落腐化的生活使爱玛债台高筑，在高利贷商人的逼迫下，爱玛求告无门，服毒自尽。\n\n《安娜·卡列尼娜》中，安娜失去一切，伏伦斯基的态度使她的心灵受到了致命的打击，以致走上卧轨自杀之路。安娜无法在这个虚伪冷酷的环境中继续生存，只能以死来抗争，用生命向那个罪恶的社会提出了强烈的抗议和控诉。\n\n二、不同点\n\n（一）爱玛屈从于社会，而安娜则反抗社会\n\n爱玛身上有爱幻想的习惯。这种不切实际、想入非非的品性被称为“包法利主义”。“包法利主义”是平庸卑污的现实与渴望理想爱情、超越实际可能的幻想相冲突的产物。爱玛爱幻想的习惯和对巴黎社交生活的向往，体现了她对这个腐朽社会的屈从。\n\n安娜不屈从于她认为不合理的环境，勇敢地追求和保卫所向往的幸福生活。她拒绝丈夫对她的劝说，反抗丈夫的阻挠，冲破社会舆论的压制，公开与伏伦斯基一起生活。在她对爱情自由的执着追求中，表现出了她性格的正直、坦率、勇敢和心灵的高尚、精神境界的崇高，展示出有生命的、生机勃勃的东西对平庸的、死气沉沉的现实环境的顽强反抗。\n\n（二）对爱情的认识不同\n\n爱玛的爱恋对象带有虚幻的、朦胧的性质。爱玛作为农户之女，有着非常强烈的灰姑娘思想，具有浪漫主义性格和对爱情的向往。爱玛所追求的爱情是如书中般的浪漫的爱情，她的每一个情人都是子爵的影子，她所追求的，其实是欲望。\n\n而安娜则从一开始就只有一个目的，那就是追求她与伏伦斯基的爱情，其出轨也是对于爱情的忠贞。安娜不只是为了满足自己的爱情追求，而是从真正意义上爱上了伏伦斯基，她所追求的，是真正的爱情。","keywords":"相同点 悲剧都是社会造成的 命运的转折都源于对爱情和生活的渴望 因为对生活失去希望而自杀 屈从 反抗对爱情的认识","note":"本题为2023年上海大学考研真题。爱玛和安娜都死于爱情，她们身上都有对爱情与生活的渴望与追求，她们的悲剧都是社会造成的。但是具体的对待社会与爱情的态度，她们两个又有所不同。相关内容可参考崔大庆《《包法利夫人）与＜安娜·卡列尼娜＞作品及人物比较》、夏爱元《安娜与包法利夫人的爱情悲剧比较》，资料可在李凡文学正版群中获取。"},{"id":"187","stars":"★★★","title":"试述托尔斯泰小说中“心灵探索者”形象系列","body":"托尔斯泰小说中“心灵探索者”形象包括自传三部曲中的尼古林卡，《一个地主的早晨》中的聂赫留朵夫，《哥萨克》中的奥列宁，《战争与和平》中的安德烈和彼埃尔，《安娜·卡列尼娜》中的列文，《复活》中的聂赫留朵夫等。这些人物形象具有一定的共同特点，即都是受过教育和先进思想影响的贵族青年，有敏锐的观察能力和分析能力，有丰富的学识和独特的天赋，对上流社会都持不同程度的批判态度，追求道德完善，并且常常以道德赎罪的形式表现出来，进行着艰苦的精神探\n\n索。这些人物形象有如下意义：\n\n一、自传性\n\n托尔斯泰的探索主人公形象具有自传性色彩，真实地反映了作家思想发展的历程。自传三部曲通过对贵族出身的尼古林卡的思想与感情变化的描写，反映出他努力寻找自己生活使命的过程，这个过程也是托尔斯泰寻找自己生活使命的过程；聂赫留朵夫作为一个“忏悔贵族”，思想由对自我道德堕落的忏悔走向了对所属阶级罪恶的认识，对应的是托尔斯泰思想转变之后形成的“托尔斯泰主义”，体现了托尔斯泰自己世界观的矛盾；列文的痛苦探索和最后结局，体现了“托尔斯泰主义”的进一步发展。\n\n二、典型性\n\n这些探索主人公对当时社会的批判，对道德与美的追求，十分典型地反映了俄国从封建主义向资本主义过渡时期贵族知识分子们的精神探索与时代特征。\n\n三、超越性\n\n在这些人物身上，托尔斯泰寄予了对美好人性的期盼，具有超越时代和阶级的普遍意义。在这些人物身上，作家挖掘普遍的人性，不仅着眼于他们现阶段的道德面貌，而且还通过他们表达了自己对未来的向往。这些人物追求美好的道德理想以及人与人之间的和谐关系，反对人与人之间的敌对、剥削和压迫，反映的是人类追求道德完善的不懈努力和执著精神。\n\n四、幻想性\n\n托尔斯泰对社会问题提出了道德解决方案，有不切实际的幻想成分，甚至在人民革命运动兴起时期表现得较为消极和反动，但他身上体现出来的顽强探索精神则是人类应该具有的优秀品质，任何时候都值得赞扬和提倡。","keywords":"自传性 典型性 超越性 幻想性","note":"这些“心灵探索者”的形象在托尔斯泰的作品中常常出现，反映了托尔斯泰本人的思想发展历程，虽然带有一定的幻想色彩，但是无论在当时还是现在，这些人物所表现出来的顽强探索精神，都是全人类共同的精神财富。“心灵探索者”常考名词解释，大家要注意灵活应对。"},{"id":"188","stars":"★★★","title":"为什么说托尔斯泰是俄国革命的一面镜子（为什么说托尔斯泰的作品达到了“最清醒的现实主义”高度）","body":"列宁指出：“托尔斯泰富于独创性，因为他的全部观点，总的说来，恰恰表现了我国革命是农民资产阶级革命的特点。从这个角度来看，托尔斯泰观点中的矛盾，的确是一面反映农民在我国革命中的历史活动所处的各种矛盾状况的镜子。”列宁又说托尔斯泰这面镜子“反映了一直到最深的底层都在汹涌激荡的伟大的人民的海洋，既反映了它的一切弱点，也反映了它的一切有力的方面”。而列宁之所以如此评价托尔斯泰，原因如下：\n\n一、反映了革命主体的有力的方面\n\n托尔斯泰背离了自己所属的贵族阶级，站在俄国宗法制农民的立场上，来反映俄国19世纪的社会生活，对沙皇专制制度和统治体系进行了全面、彻底的鞭挞，达到了“最清醒的现实主义”高度。托尔斯泰以一个开明地主的身份，实施改革，并在自己的文学创作中进一步探讨俄国农民以及俄国的出路问题，从人道主义立场出发，反映了俄国的社会现实生活，塑造了与俄国人民保持密切联系的进步贵族，鞭挞了自私自利、放纵堕落的宫廷贵族，批判了资本主义社会的利己原则。19世纪70年代末到80年代初，托尔斯泰的思想完成了转变，认同了宗法制农民的立场，在生活中贯彻平民化思想，在创作中体现出深刻的批判性，将批判的矛头对准了沙皇俄国的所有上层制度和意识形态，以及正在兴起的资本主义金钱原则。\n\n二、反映了革命主体的弱点\n\n托尔斯泰在接受俄国农民阶级立场的同时，也认同了俄国农民身上的宗教态度，高度评价了他们身上体现出的忍耐精神。从虔诚的俄国农民身上，他提炼出“托尔斯泰主义”，即宽恕、博爱、不以暴力抵抗邪恶等宗教道德准则，并以此作为解决社会矛盾、阶级冲突的指南，暴露了其思想的局限性。所以，在19世纪即将结束的历史时期，当俄国工人运动正在酝酿之时，托尔斯泰思想和创作的革命性意义已经开始消失。\n\n总之，作为19世纪俄国农民思想和情绪表达的喉舌，其折射的是19世纪俄国革命的性质和历史作用，即既反映了19世纪俄国革命主体力量的积极性，也反映了19世纪俄国革命主体力量的局限性。","keywords":"农民资产阶级革命 有力 农民立场 弱点 宗教态度","note":"这一题其实是在问托尔斯泰的思想，所以回答时还是紧扣他的托尔斯泰主义。上述第一段列宁的评价不用背诵，** --- 大家了解一下原话即可。"},{"id":"189","stars":"★★★","title":"比较托尔斯泰与斯丹达尔在人物心理刻画方面的异同","body":"一、相同点\n\n（一）客观性\n\n心理描写的客观性是指客观现实对人的心理所产生的制约和影响作用，这种制约和影响是不以人的心理意志为转移的，它使人的心理特征打上了社会属性的烙印和客观性特点。斯丹达尔和托尔斯泰的心理主题基本上都是客观性和社会性的。他们通常是将人物的心理冲突放在一定的社会背景上展开，人物的内在复杂性表现在社会环境和人的密切联系中。因此，客观性就构成了二位大师心理描写的深层底蕴。\n\n斯丹达尔《红与黑》主人公于连的心理活动是“特定环境”和“一定情势”下的产物，是法国1830年前后人们的社会、经济地位直接影响的结果。于连的心理变化过程，具有鲜明的时代色彩，表现了他决心通过个人奋斗改变命运的心理历程，反映了变革期法国一代青年追求生命价值的时代背景。\n\n托尔斯泰《安娜·卡列尼娜》突出地描写了主人公心理的客观性特点，再现了1861年农奴制改革以后，俄国社会在资本主义冲击下“一切都翻了个身，一切都刚刚开始安排”的时代特征。面对剧烈的社会变革，托尔斯泰通过安娜内心的情感运动来揭示客观环境对人物心理的影响。不仅是安娜，连安娜的丈夫与情人的心理活动也体现了变革期对立阶级较量的时代特征。\n\n（二）动态性\n\n把人物的心灵运动作为观照的重点，进而通过人物变化的心态表现旧道德已面临新观念的严峻挑战是斯丹达尔和托尔斯泰心理描写最重要的艺术表现手法，这种动态性的表现方法构成了二位大师心理描写的主体部分。\n\n作为先天的心理生理气质“内省型的”“人类心灵的观察者”，斯丹达尔主张通过对人物心理变化过程的描写来展现人物的心灵史。《红与黑》中德·瑞那夫人对家庭教师于连爱情的心理演变，正是这一主张的成功尝试。\n\n作为“心灵辩证法”大师的托尔斯泰在个性气质上也具有一种先天的自我内省意识，这种心理品格为他仔细准确地展露人物心灵奥秘提供了方便。他也是通过剖析人物感觉、知觉系统的丰富变幻来表现心理运动过程的。比如安娜与伦斯基的爱情，与儿子的亲情，与丈夫的冲突，与周围环境的碰撞，始终贯穿于她的心理发展变化过程。\n\n（三）现代性\n\n所谓“现代性”是与传统心理现实主义相对而言的。现代小说中一个显著的美学特征就是心理描写所表现的非理性心理学特征，即弗洛伊德所说的潜意识心理活动。现实主义和现代主义在某种程度上存在着对立，但并不意味着两者间的相互隔绝。作为现实主义一代宗师，斯丹达尔、托尔斯泰之所以能透彻入微地刻画出人物心灵的骚动不安、激情奔突，正是在展示人物心路历程时，触及了人物的潜意识。尽管其他一些现实主义作家对此也有所触及，但远不如斯丹达尔和托尔斯泰的突出和明显，这正体现了两位大师心理描写的独特性。因而，现代性构成了二位大师心理描写的高层境界。\n\n二、不同点\n\n（一）客观性的内涵不同\n\n斯丹达尔心理描写的客观性富有浓浓的政治色彩，写作的时代正当法国“七月革命”前后，革命与复辟激烈争斗，政治斗争尖锐复杂，社会动荡不安，这种时代环境把人们卷入了政治的漩涡。斯丹达尔以政治家的敏锐体察到了时代的风云变化，运用象征手段艺术地再现了那个时代人们追求自我意识的历程。《红与黑》曾被誉为一部“哲理性的政治小说”，其心理描写极具象征性。作品描写于连在狱中关于猎人踢毁蚁穴、踢死蚂蚁的一段心理独白，就具有丰富的心理象征意蕴，是主人公对社会和政治所作的象征性的心理概括。表明为维护人格尊严，摆脱政治陷阱，人们所持的宁死不屈的强硬态度，再现了人们追求自我意识的时代特质。\n\n而托尔斯泰心理描写的客观性则倾注了作者强烈的人道主义思想，表现了作者矛盾的世界观。托尔斯泰心理描写的客观性不是通过含蓄、隐晦、象征等手法表现人物心理活动，而是运用多角度、多侧面、全方位的技巧来展示心灵进程的纵向深度。《安娜·卡列尼娜》巧妙地安排了“安娜看儿子”这一细节，把客观环境下安娜矛盾而复杂的心理状态通过听觉、视觉、动作、神色等侧面活灵活现地表现出来。如安娜对儿子的爱，对丈夫的恨，仅此一眼就昭然若揭。托尔斯泰从人道主义观点出发，一方面对以卡列宁为代表的压抑摧残人性的社会给予强烈谴责；另一方面又对安娜的大胆叛逆举动不以为然，从而曲折地表现了作为人道主义作家的托尔斯泰在对待主人公态度上的矛盾性。\n\n（二）动态性的着眼点与表现角度不同\n\n斯丹达尔与托尔斯泰心理描写的动态性的主要区别在于：前者显示了顺着心理的表层向深层（亦或由理智向感情）逐步深入探索人物心理历程的趋向，后者表现了沿着心理的深层向表层（亦或由感情向理智）逐渐移动揣摩人物心理历程的走势；前者重点写心理演变的过程，后者重点写心理演变的结果。两人动态心理描写差异的成因表现在两个方面：一是着眼点不同。斯丹达尔多半着眼于物质世界的人生，托尔斯泰多半着眼于精神世界的人生。二是选择表现角度不同。斯丹达尔的艺术目光聚焦于表现人物心理流程是怎样的，托尔斯泰的艺术视角集中于人物心理活动为什么是这样的；斯丹达尔挖掘人物内心时，特别喜欢揭示人物的情感运动，从而引发主人公波涛般的情感涌动，托尔斯泰描写人物心理活动时，尤其善于表现人物理智与感情激烈斗争，以及感情战胜理智的心理流程；斯丹达尔多从美学和心理学的角度披露人物心理运动，托尔斯泰多从伦理学和社会学角度探索人的心灵轨迹。\n\n斯丹达尔虽然对贵族和资产阶级作了无情的针砭，但是他无意于成为一名社会批评家，他更多地关注着特定社会空间活动着的人物所表现出的心理动态，人物的遭遇使他对人生产生诸多疑问，进而把笔触伸向人物内心深处，通过人物心理活动间接地作出象征性暗示。所有这些都使其心理描写获得一种艺术的空灵感。他笔下的人物真诚的感情、沸腾的激情以及勇往直前的忘我精神，都在情感向理性的大胆挑战中得以充分展现。\n\n托尔斯泰作为精神探索的杰出代表无疑是著名的社会批评家，他通过主人公动态心理的表白，对扼杀人性的社会提出了强烈抗议，同时又从宗教伦理道德观出发，让缺乏理性的人物遭到“报应”，在剖析人物内心世界时则直接地作出指向性判断。他还善于对人物瞬间心理变化给予描摹，并借机发表对人物过甚激情的担忧和困惑，还有对执拗理性的无可奈何。这种独树一帜的心理描写，决定了托尔斯泰心理描写的准确性、情感细节的真实性和个性化的深度。\n\n（三）现代性的表现不同\n\n斯丹达尔笔下人物的心理冲突，集中显露了潜意识中的“欲望”。于连与德·瑞那夫人漫长的爱情心理演绎过程有很长的历程就是通过潜意识描写来完成的。作者把笔触伸向了主人公的深层心理，伸向了主人公不曾意识到的潜感觉之中。这种潜意识的深层挖掘，既强化了作品表现的力度，又拓宽了反映生活的领域。\n\n托尔斯泰的心理描写与现代意识流心理描写有相似的一面，即通过自由联想的方式发现“人的心灵”秘密，写出了凌乱、跳跃、不合逻辑的意识流。托尔斯泰用很长的篇幅写安娜发现伦斯基爱情降温之后萌发自杀念头的过程和去火车站时的一系列心理变化，这一系列心理描写，是用蒙太奇手法组合而成的以回想、幻觉和恐惧为主要内容的意识流画面，体现了回忆的明确性和思维的凌乱性、朦胧性相混杂的特点。这种时空交错和非规则非理性特征，具有现代小说时空的美学特征，标志着传统美学时空意识向现代时空意识的过渡。","keywords":"客观性 动态性 现代性","note":"通过人物心理描写揭示19世纪欧洲社会转型期的时代本质，是现实主义作家斯丹达尔和托尔斯泰小说创作中最显著的特征，表现为客观性、动态性和现代性。客观性特征揭示了追求自我意识的时代历程，动态性特征标志着激情向传统伦理的抗争，现代性特征透视了呼唤人性回归的心声。比较两位作家的心理描写对于审视和探索现代商品经济社会人们高扬自我价值、期盼观念更新、憧憬开明政治的心灵动向有着借鉴作用。"},{"id":"190","stars":"★★★★","title":"契诃夫短篇小说的特点","body":"契诃夫是俄国19世纪末叶最为重要的小说家和剧作家，有“短篇小说大师”之称，他与法国莫泊桑，美国欧·亨利并称为“世界三大短篇小说巨匠”。契诃夫短篇小说的创作特点主要表现在：\n\n一、思想特点\n\n（一）创作早期\n\n契诃夫早期的小说虽大多是一些逗人发笑的作品，但有相当一部分具有深刻的社会意义，可分为两类：一类是无情地嘲笑和揭露专制警察制度和小市民的奴性心理，如《小公务员之死》《变色龙》等；另一类是反映劳动人民的贫困和痛苦生活，如《哀伤》《苦恼》《万卡》等，作者在这类作品中通过对生活琐事的描写，对下层人民的悲愁给予深切的同情，使作品带有浓重的阴郁和伤感的情调。\n\n（二）创作后期\n\n1890年的库页岛之行对他起了良好的影响，使他亲眼看到俄国政治犯的悲惨生活和斗争精神。自此，其创作对黑暗社会的揭露更为有力，他批判托尔斯泰主义等错误思潮，同时也对知识分子的空虚无为和小市民的庸俗丑恶进行了有力的抨击。这表现在《套中人》《跳来跳去的女人》《文学教师》《姚尼奇》等作品中。在19世纪末20世纪初革命形势的感染下，契\n\n诃夫晚年对新时代的憧憬使其作品充满乐观主义情调。\n\n二、艺术特点\n\n（一）高度的简洁\n\n（1）开头部分，契诃夫擅长运用开门见山的笔法；结尾则具有开放性，给读者留下想象的空间。\n\n（2）刻画人物方面，作家尽可能不在人物的外形描写上浪费笔墨，而多在心理与性格刻画上下功夫，使小说具有心理抒情小说的特点；而且在揭示人物性格时能够做到一针见血的形象化点染。\n\n（3）在结构方面，简括精练，作品中人物不多，情节简单。\n\n（4）语言运用方面，则是简洁生动，朴实凝练。小说叙述简洁，用语明确，没有冗长的描写，不作啰唆的对话，往往是通过人物的言行表现人物的内心世界或作品的主题思想，不用作者发议论。\n\n（二）以小见大\n\n在选材方面，契诃夫善于从日常生活中习见的人和事取材，甚至能通过一些平凡小事，尖锐地提出社会问题，深刻揭示蕴含的哲理，鞭挞庸俗的习气。\n\n（三）幽默的笔调\n\n契诃夫的小说具有悲剧性和喜剧性相结合的特点，他善于运用“含泪的笑”的讽刺，通过漫画式的夸张以及对比手法，一针见血地揭示人物性格，达到讽刺的目的。","keywords":"思想特点 早期 专制警察制度 奴性心理 劳动人民的贫困和痛苦 阴郁伤感 后期 揭露更有力 批判托尔斯泰主义 乐观主义 艺术特点 简洁 以小见大 幽默","note":"契诃夫是俄国杰出的短篇小说巨匠，他的思想有一个发展演变的过程，自然而然也体现在其创作中。分析他的创作特点，可以先分析其思想的演变，再总述其艺术特点。"},{"id":"191","stars":"★★★","title":"《套中人》的思想艺术特色","body":"一、思想特色\n\n《套中人》鲜明地塑造了一个旧制度的卫道者、新事物的反对者的典型形象。别里科夫是个性格孤僻、思想守旧、与外界隔绝、胆小怕事的小人物，他把奉公守法当作苟且偷安的护身符，像害怕瘟疫一样害怕新生事物，自觉或不自觉地充当反动制度的警犬。他龟缩在“硬壳”和“套子”里、在惊恐和不安中郁郁而终。在专制制度腐朽没落的年代，作者拿出别里科夫这个典型来加以鞭挞，就是呼吁人们从“三俄尺土地”的局限中跳出来，抛弃把一切都装进“套子”里的“套中人”生活，去追求表现人的自由精神的广阔天地。“套中人”也因其蕴含的深广的社会意义，而成为顽固保守、反对变革者的代名词。\n\n二、艺术特色\n\n（一）小中见大，平中见奇\n\n契诃夫善于从日常生活常见的人和事中取材，看似信手拈来，但通过微不足道的平凡生活琐事，却常常反映出带有本质性的社会问题，收到小中见大、平中见奇的效果。别里科夫一出场，给人的感觉确实普通渺小，而且胆怯怕惊吓。但当有人冒犯了他奉为神明的“当局”和上司时，这位成天龟缩在硬壳里的蜗牛便一反常态，勇敢地露出凶相来，要挟别人同意他的主张。契诃夫在短短的篇幅里。通过这一平凡小人物的言语和行动，以讽刺的手法，入木三分地刻画出一个沙皇专制制度的忠实卫道士的典型形象。\n\n（二）结构巧妙，寓意深刻\n\n作者采用了故事套故事的结构模式。主要故事情节是以作品中人物交谈的方式叙述出来的。契诃夫用简洁生动的语言描述了故事的内容，叙述清晰，秩序井然。小说从一个月夜两位打猎朋友的闲聊开始，之后别里科夫的故事引起了他们的感慨和深思。开始的轻松宁静和别里科夫故事的沉闷气氛形成了一种反差。于是在那个月夜里，布尔金和内奇两个人联想到生活中的种种套子，在结尾处说道“再也不能照这样生活下去了！”，耐人寻味。\n\n（三）幽默讽刺，含蓄冷峻\n\n契诃夫的创作基本上倾向于批判现实主义。他善于透过日常生活揭示出具有典型意义的社会主题。为了达到目的，他多采用幽默这一艺术手法来嘲讽丑恶的社会现象。小说《套中人》自始至终都采取了幽默讽刺的手法来表现别里科夫的性格，刻写了一个为扼杀一切新事物，不惜用盯梢、告密等卑鄙手段，搞得全城都怕他的小人形象，呼吁人们起来改变这个窒息创造精神的社会。","keywords":"追求自由精神 小中见大 结构巧妙 幽默讽刺","note":"契诃夫的小说不靠曲折离奇的情节取胜，而是以揭示深藏在生活中的悲剧因素取胜。他的小说具有深厚感人的艺术魅力。不论是现实主义的创作手法，还是精美完整的结构艺术，或是深刻的思想内涵，都无愧于“短篇小说大师”的美誉。此外，“别里科夫性格”可能会考查名词解释，大家要留心。"},{"id":"192","stars":"★★★★","title":"契诃夫戏剧创作的特征","body":"契诃夫被称作现代西方戏剧的开拓者，他对欧洲传统戏剧的创作模式和审美观念进行了锐意改革，对于戏剧结构的创新更是影响了20世纪现代戏剧的发展。代表作有《海鸥》《万尼亚舅舅》《三姐妹》《樱桃园》等。契诃夫的戏剧创作，主要包括以下特征：\n\n一、现代性\n\n（一）艺术上的现代性\n\n契诃夫把现代主义的精华吸收到自己的现实主义的艺术机体里，从而实现了对于传统现实主义的超越。如他把诗的抒情性、小说的叙述性都编织进戏剧的机体里，对19世纪末露头的自然主义与象征主义也作了去粗取精的借鉴。\n\n（二）对生活认识的现代性\n\n契诃夫的后期剧作，扬弃了对于戏剧人物非此即彼、非黑即白的简单化判断，他的戏剧人物很难用传统的“正面人物”或“反面人物”的尺度来区分。在戏剧冲突的构建上，常以“人与环境的冲突”取代传统的“人与人的冲突”的戏剧冲突模式。\n\n（三）对现代人精神状态的准确把握\n\n只要物质与精神还没有结合在美妙的和谐之中，契诃夫戏剧便永远保持新鲜的现代感。这就是早已解决了温饱问题的现代人，还可以理解契诃夫的戏剧人物的精神痛苦的原因。但是，痛苦并不能压倒契诃夫的戏剧人物，他的戏剧依然洋溢着乐观主义的情绪。\n\n二、场景的生活化\n\n契诃夫有意通过自己的戏剧创作去矫正当时俄罗斯戏剧舞台上盛行的虚妄、矫饰之风。他的戏剧作品中没有风急浪高的冲突，没有紧张惊险的情节，甚至没有缠绵悱恻的爱情，有的只是日常生活场景。然而，契诃夫却赋予这些看似平淡的生活现象以浓郁的生活气息和深邃而丰富的精神意蕴，实现了小中见大、平中见奇的创作宗旨。\n\n三、结构的散文化\n\n契诃夫向注重叙事、情节和外部冲突的传统戏剧创作发出挑战，他倡导一种新颖的、散文诗式的松散戏剧结构，目的就是最大程度地还原再现生活本身。\n\n（一）在契诃夫的剧作中，就其情节而言，所表现的都是一些生活琐事，人物也只是随处可见的一些小人物。\n\n（二）剧作中没有完整的中心事件，人物也没有主次之分，整场戏仿佛零碎地分散在舞台上，人物语言也是不连贯的表达，具有很强的散文性倾向。\n\n（三）传统剧作家视为戏剧生命的戏剧冲突-“发现”和“突转”，被契诃夫放到了幕后进行“斯坦尼斯拉夫斯基式”的暗场处理。剧场中观众只听到枪声，却不见开枪人，人物的激烈动作全都被屏蔽掉了。\n\n（四）剧作中人物的社会身份大多是小知识分子，他们对事件的表达符合自己身份和行事方式-低调含蓄，这就更加强化了剧作“散文化”的特点。\n\n四、情节的复调性\n\n契诃夫的戏剧本身具有多面性观赏维度，有着“复调”性特征。《海鸥》的“复调”色彩最为突出。作品虽然剧情简单，却有着双线索、多层次的戏剧结构，既展示出反映人们日常生活的爱情主题，又表现出具有浓郁抒情色彩与作家自我感受的艺术主题，二者平行发展、相互渗透，从不同角度推动着剧情的发展。\n\n五、动作的内在性\n\n按照契诃夫的戏剧理想，矛盾和冲突不应表现在外部，而应在内部。这一革新思想，为契诃夫的戏剧带来了“静态性”效果。契诃夫将原本可以展开的剧情淡化到几乎没有，将人物之间的冲突转移到内心世界的活动中，因而，契诃夫的戏剧又被称为“间接动作剧”。人物的动作不再推动剧情的发展，而具有阻滞性。舞台上的人们来来往往，各自体会着自己的喜怒哀乐，心灵的悲痛并不通过动作呈现出来，每个人都默默地独自承受着一切。\n\n六、浓厚的象征性\n\n契诃夫的象征风格具有鲜明的特色，它没有象征主义的神秘奇幻，只是在描绘平常人的生活时运用题目、主题、人物形象、故事情节以及不被人注意的背景场景和声音来象征性地解读着人物的丰富内心、性格及其命运。","keywords":"现代性 场景生活化 戏剧散文化 情节的复调性 动作的内在性 象征性","note":"契诃夫的戏剧既运用了现实主义的创作手法，又有大量的现代主义表现手段，具有承上启下的作用。上述的几个特点在契诃夫的不同剧作中分别有不同程度的体现。当涉及具体作品的艺术特点时，结合上边几点具体分析就好。"},{"id":"193","stars":"★★★","title":"契诃夫《樱桃园》的艺术特征","body":"一、乐观主义情绪\n\n痛苦并不能压倒契诃夫的戏剧人物，而契诃夫戏剧特殊的迷人之处，恰恰在于他的戏剧总是洋溢着乐观主义的情绪。在《樱桃园》里，两个年轻人已经在呼唤“新生活，你好”！已经在呼吁“建设一座更加美丽的樱桃园”，因为“人类向着.....地面上能允许有的更高的幸福节节前进”，显示出积极的乐观情调。\n\n二、戏剧散文化\n\n契诃夫一生做着戏剧散文化的努力。他追求的戏剧行动要像生活一样简单，也像生活一样复杂。日常生活环境，包括天气的寒冷或温暖、花草的开放或凋谢，于契诃夫的戏剧都不是可有可无的。《樱桃园》第一幕的舞台指示与开场的两句对白，轻轻地、自然地把戏剧行动发生的时间-五月某一天凌晨两点-点了出来。樱花、晨霜等白色意象也随之进入读者的脑海。戏剧行动的地点则在舞台指示的第一句里强调了出来-“一间相沿仍称幼儿室的屋子。”《樱桃园》中的情节，比如朗涅夫斯卡娅从巴黎回到故居的幼儿室时所说的那段台词：“幼儿室啊！我的亲爱的、美丽的幼儿室啊！我顶小的时候就睡在这儿。”（按照剧本的舞台指示，说到这儿，朗涅夫斯卡娅要“哭泣”）这都可以看作偏向于悲剧性，或偏向于喜剧性来表现。眼泪是一定要流的，但眼泪的内涵可以是不同色彩的。这也是契诃夫戏剧的丰富性的一个方面。\n\n二、浓厚的象征性\n\n契诃夫的戏剧从《海鸥》开始，都有浓厚的象征性。到了《樱桃园》，契诃夫的象征手法运用得更加含蓄与广泛了。\n\n（一）《樱桃园》中有两个人物，管家叶比霍多夫和家庭教师夏洛蒂，乍一看来，他们似乎是无关紧要的角色，但深作思索，就可发现，契诃夫绝不是随便把这两个人作为仆人写进剧本里去的。夏洛蒂是个无根的浮萍式的人物，也是个孤独的人。她的这两个特征在某种意义上恰好是她的女主人朗涅夫斯卡娅的性格命运的象征。而管家叶比霍多夫是一个最不实际的人，是一个小市民式的浪漫主义的人。他的这些性格形象特征，同样可以视作他的主人加耶夫性格形象的映照。\n\n（二）在《樱桃园》中，还有更为含蓄与情绪化的艺术象征。比如，在剧中两次出现的“类似琴弦绷断的声音”，就是一种非常特殊的象征手段。读者很难断定它确切的象征含义，但还是能从中感觉到它在象征、暗示剧中人物的某种难以名状的情绪。例如，《樱桃园》第二幕中：“忽然间，远处，仿佛从天边传来了一种类似琴弦绷断的声音，然后忧郁而缥缈地消逝了。”这个来自天边的古怪的声音，烘托着剧中人物的情绪，这声音的不可名状是和人物情绪的不可名状相适应的。\n\n（三）《樱桃园》最为宏大的象征性形象，自然就是这座满园开着白花的樱桃园了。时代在按着历史的法则前进，人类不得不与一些旧的但也美丽的事物告别。在这日新月异的时代，人类好像每天都在迎接新的“别墅楼”拔地而起，同时也每天都在目睹旧的“樱桃园”就地消失。《樱桃园》在人们心中勾起的正是这种面对新时代的忧喜参半的复杂情感。","keywords":"乐观主义情绪 戏剧散文化 浓厚的象征性","note":"《樱桃园》是契诃夫的最后一部剧作，也可以说是他呕心沥血的绝笔。可以视为世纪之交一部最有意义的俄罗斯文学名作。无论从思想探索的角度还是从艺术探索的角度，《樱桃园》都带有总结性的意义。这其中大家要特别注意《樱桃园》的象征意义，可能会单独设题。"},{"id":"194","stars":"★★★","title":"马克·吐温文学创作的发展","body":"马克·吐温一生创作了许多长篇小说、中短篇小说、政论、杂文、游记等。他近50年的创作生活，大体可以分为三个时期：\n\n一、早期创作：19世纪60年代\n\n马克·吐温的早期创作从南北战争期间开始，他的资产阶级民主主义世界观也在这个时期初步形成。当时，马克·吐温对整个资本主义制度还充满着幻想，这个时期所写的幽默、诙谐的作品充满着轻松而欢乐的调子。他的幽默所包含的滑稽诙谐以及他常运用的极度夸张的手法，是一种揭露现实的手段，同时又富于生活气息，深受读者喜爱。他常以天真单纯的老实人作\n\n为作品的主人公，从而便于揭示幻想与现实之间的矛盾。虽然他对当时投机取巧的风气、迷信落后的习俗、小市民的庸俗习气都作了嘲笑和批判，但是挖掘不深，在很大程度上还只是一种轻淡的嘲讽。\n\n这一时期的代表作有《竞选州长》《哥尔斯密的朋友再度出洋》《傻子出国记》等。\n\n二、中期创作：19世纪70年代到90年代\n\n这一时期是马克·吐温创作的黄金时代，也是他在继续观察社会的基础上，加深对美国的政治制度、生活方式、思想情操的思考和探索的时期，尖锐的讽刺和无情的揭露是这一时期作品的主要特点。马克·吐温作品的基调，随着思想的深化，已由轻松幽默转向辛辣讽刺，诙谐、滑稽的成分减少了。在表现方法上，作者的想象更为自由活泼，常常大胆地转换主人公生活的时代和环境，并运用这种手法把历史与现实、不同的社会地位和社会环境加以对照，使作品的主题开掘得更为深刻。在人物的心理描写方面，作者的技巧更为成熟。作者总是从表现主题的需要出发，紧紧扣住特定的环境，用细腻而深刻的笔触，对资产阶级的虚伪心理，进行无情的剖析和鞭挞。\n\n这一时期的代表作有《镀金时代》《汤姆·索亚历险记》《哈克贝利·芬历险记》《百万英镑》《王子与贫儿》等。\n\n三、晚期创作：19世纪90年代末到20世纪初\n\n19世纪90年代后期，随着美国进入帝国主义阶段，马克·吐温的创作转入第三个时期。作为一位杰出的反帝反殖战士，揭露和抨击侵略扩张政策是马克·吐温这一时期作品的最重要内容。在创作形式上，马克·吐温也开辟了一个新的园地，即从创作小说转到创作大量的游记、杂文和政论上来。虽然马克·吐温后期创作笔锋犀利，嘲讽辛辣，揭露深刻，但由于他看不到人民的力量和人类光明的前途，在对资本主义现实极度失望的情况下，作品悲凉哀婉的情调也很浓重。\n\n这一时期的代表作有《败坏了赫德莱堡的人》《战争祈祷》《什么叫做人？》等。","keywords":"三个时期 早期：轻淡的嘲讽 中期：辛辣讽刺 晚期：悲凉哀婉","note":"从
