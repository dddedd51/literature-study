的次要人物，在塑造这些人物时，奥斯汀的基本手法是反讽与写实相结合，运用了丰富的反讽技巧：有时，反讽寓于特征介绍、心理描写之中，如《爱玛》中对伍德豪斯先生的介绍；有时，让人物的言与行形成反讽对照，如《曼斯菲尔德庄园》开篇，诺里斯太太关于无私仁爱的自我表白，与她的行为一做对比即形成尖锐的讽刺；有时，则报导式地摆出人物言行，让人物十分认真的反常表现同读者正常的审美趣味形成距离，产生反讽，《傲慢与偏见》中柯林斯向伊丽莎白求婚是绝妙的例子。不仅如此，简·奥斯汀还让他们在外表与内心、言语与行为，得计之时的作为和暴露之后的结局之间形成强烈反差，嘲讽其可鄙与可悲。\n\n而在塑造主要角色时，简·奥斯汀既运用反讽展现人物性格中的怪癖、错觉、自相矛盾等这些东西，又让人物性格在不同发展阶段上前后对照，构成反讽，以此揭示人物性格的发展过程。如伊丽莎白、玛丽安、凯瑟琳、爱玛等的性格变化的过程\n\n都是如此揭露出来的。\n\n二、场面、情节结构的反讽\n\n奥斯汀的小说通常被认为是小说中的“世态喜剧”，由一连串的戏剧性场面构成有机的情节，又由步步推进的情节构成严整的总体结构。反讽，总是渗透在场面、情节及总体结构中。\n\n奥斯汀场面描写的特色在于反讽和戏剧化。她不是告诉人物如何如何，她把人物摆在我们面前，让他们自己“表演”。不尽的讽意完全借助角色的“表演”渗透出来。奥斯汀的小说每每有这样非常生动的场面。如《傲慢与偏见》中伊丽莎白和达西、柯林斯、咖苔琳的对话；《爱玛》中埃尔顿向爱玛的求婚；《曼斯菲尔德庄园》中关于收留芳妮的讨论等等。\n\n奥斯汀的反讽也微妙地贯穿在情节结构之中。奥斯汀以反讽手法塑造人物，但投射到角色身上的反讽色彩，都有一个逐渐淡化的趋势。这是因为，随着情节的推进，叙事者的反讽对象-主人公自我意识的欠缺或外在于主人公的社会性的理智欠缺-逐步得到克服。与这过程相伴随的是小说的表现手法和叙事角度都发生了微妙的转移。奥斯汀反讽最典型最常见的形式是反讽的叙事语调和场面描写。在她的六部小说中，这两种形式的反讽普遍相对集中于小说的前半部分，而到小说的后半部分，往往是“虽然反讽意味表现得都很有趣，但相对来说，戏剧性趋于平淡。”这过程中，就隐含着表现手法从“戏剧化”（或称“戏剧手法”）向“叙事化”（或称“小说手法”）的转化，小说视角从“叙事者视角”向“女主角视角”的转化。这个情况，在奥斯汀的其他小说中都有不同程度的表现。\n\n三、语言上的反讽\n\n奥斯汀的小说语言非常富有戏剧性，她的反讽的特点是陈述中的两个对题不但相安无事，甚至往往相反相成，达到一种二律背反似的浑和的境界。比如，奥斯汀常常会用一些奇特的词句搭配：如“陈旧的新闻”“沉重的玩笑”“文雅的暴力”之类。每组搭配中的两个词虽然意义相反，从逻辑上讲相互矛盾，但实际上并不相互排斥。这并非文字游戏，而是反映了生活的现实。奥斯汀似乎看透了我们这个世界的似非而是或似是而非性，所以她并不学斯威夫特的样，用内涵的截然相反的意思同字面上表达的内容进行激烈对抗，反而是经常是同时肯定两个相反的方面（或是同时否定）。\n\n综上所述，反讽这种特征不但体现在简·奥斯汀小说的语言上，更是体现在人物塑造和场景结构上，因此，反讽毫无疑问是简·奥斯汀最重要的艺术特征。\n\n19世纪浪漫主义文学","keywords":"人物塑造 反讽与写实相结合 揭示人物性格的发展过程 场面、情节结构 语言 二律背反","note":"2025年是简·奥斯汀诞辰250周年，所以今年北京大学专门针对这一比较冷门的知识点出题。作答这道题，我们主要是明确简·奥斯汀最重要的一个特征-反讽，然后去详细分析她的反讽艺术。这部分内容在教材上较少提及，相关内容可以参考林文琛《奥斯丁反讽艺术片谈-奥斯丁人物塑造、情节结构的反讽艺术》、钱震来《论简·奥斯丁》这两篇论文。"},{"id":"100","stars":"★★★★","title":"19世纪浪漫主义文学出现的原因","body":"一、浪漫主义文学是法国大革命催生的社会思潮的产物\n\n（一）“自由、平等、博爱”思想\n\n法国大革命标榜的“自由、平等、博爱”思想推动了个性解放和情感抒发的要求。对个人独立和极端自由的强调，成为浪漫主义文学的核心思想。浪漫派作家往往从个性受压抑、个人才能得不到发展、个人愿望和抱负得不到实现等角度，表现人物与社会的矛盾，表现人物在这种矛盾状态中的感情、行动和悲剧。浪漫主义文学描写的以个人的失望与忧郁为内容的“世纪病”、以个人与社会的徒劳对立为表现形式的“个人反抗”，都是由此而产生的。\n\n（二）自由竞争法则\n\n《人权宣言》所宣扬的自由竞争的法则，形成了一种社会心理：资产者、小资产者都企图通过巧取豪夺，有朝一日达到权力和财富的顶峰；在革命中破产落魄的贵族，也力图利用新的社会法则来改善自己的地位。人们对飞来好运的期望变得更加炽热，耽于好梦和幻想成为普遍的社会心理状态。\n\n（三）消极的社会心理\n\n对贵族来说，大革命使他们失去了天堂，于是，悲观颓唐、消沉阴郁的情绪，人生虚幻、命途多舛的感慨以及对神秘彼岸的热烈向往，便纷然杂呈；对资产者、小资产者来说，启蒙思想家所描绘的理想社会的图景在资本主义现实面前破灭，不免使他们失望、苦闷和彷徨。这种社会现象和心理为浪漫主义的盛行提供了肥沃的土壤。\n\n（四）法国大革命对一些作家直接产生了影响\n\n德国城市图宾根，为了祝贺攻克巴士底狱，在大学里立了一尊自由神胸像；歌德、谢林和荷尔德林在城郊植下了自由树；《耶拿文学报》刊载了有关大革命的政治著作；《柏林月刊》征集对人权的争论文章；克洛普斯托克写出赞美第三等级的颂歌；弗·施莱格尔撰文指出大革命是当代三大事件之一。大革命对英国湖畔派诗人产生的影响也是众所周知的。法国大革命对作家的浪漫主义倾向的形成起了决定性的作用。\n\n二、思想理论基础：德国古典哲学和空想社会主义\n\n（一）德国古典哲学为浪漫主义文学的主观性提供了理论根据\n\n德国古典哲学的基调是唯心主义，它的理论体系本身就是哲学领域的浪漫主义。康德认为世界本身不像反映在人的头脑里那样，人在建造世界时也形成了认识，由此证明了世界的理想性质和神秘性质。浪漫主义的非理性在康德那里找到了合理的解释。康德的继承者费希特认为现实只是人的一种创造，反对自在之物能限制人的悟性的观点。他的主观唯心主义强调天才、灵感的主观能动性，把人的心灵提高到客观世界创造者的地位。这些都为浪漫主义文学的主观性提供了理论根据。\n\n（二）法国空想社会主义为浪漫主义文学家的理想提供思想基础\n\n空想社会主义者看透了资本主义制度的矛盾和不合理，从而勾画、鼓吹没有压迫、人人平等的幸福的空想的乌托邦。圣西门认为人类社会是不断进步的，他否定了现行的社会。傅立叶揭露了资本主义的贫困现象、民主自由的虚伪、婚姻制度的腐朽、殖民掠夺的残酷。他们提出了未来社会的图景，强调阶级调和、阶级互爱，以此解决社会矛盾。\n\n三、18世纪的启蒙运动为浪漫主义的出现做了准备\n\n就流派的演变来说，浪漫主义是对17世纪以来占文坛主导地位的古典主义的“反抗”，而这面反抗的旗帜最先是由启蒙作家树起的。莱辛、狄德罗的“市民悲剧”；菲尔丁的“散文滑稽史诗”。18世纪英国感伤主义文学、法国卢梭的“主情文学”和德国狂飙突进文学对浪漫主义思潮的产生和发展有着巨大的影响。它们崇尚感情，强调个性自由，迷恋大自然，可以说是浪漫主义的先导。\n\n四、19世纪浪漫主义文学经历了历史的发展过程\n\n无论荷马的史诗《伊利昂纪》还是神话，无论古希腊的悲剧还是维吉尔的《埃涅阿斯纪》，都运用了浪漫主义手法。至于中世纪的骑士传奇，则与浪漫主义有直接的渊源。浪漫主义来源于传奇一词。18世纪下半叶，“浪漫”一词开始在英、德、法流行开来。18世纪末，歌德首先注意到“古典诗和浪漫诗的概念”，席勒也区分了素朴的诗和感伤的诗。应该指出，18世纪的作家有不少作品已经具备了浪漫主义的因素。浪漫主义一词的发展反映了这种创作手法和文学形式逐渐形成和成熟起来的过程。换言之，19世纪欧美的浪漫主义文学是以往浪漫主义手法的集大成。","keywords":"法国大革命 德国古典哲学 空想社会主义 启蒙运动 历史发展","note":"19世纪浪漫主义文学出现，有其社会原因，即法国大革命；有其思想源泉，即德国古典哲学和空想社会主义；有其自身原因，即对以往浪漫主义手法的继承和发扬。这部分内容，需要我们仔细掌握。“浪漫主义文学”“世纪病”“湖畔派诗人”等名词解释大家都要留心一下。"},{"id":"101","stars":"★★★★","title":"19世纪浪漫主义文学的思想特征","body":"一、追求个性解放\n\n浪漫主义在发展过程中与古典主义进行了激烈的斗争。古典主义的主张已成为束缚文学发展的桎梏，浪漫主义强调创作的绝对自由，反对古典主义的清规戒律，要求突破文学描绘现实的范围，在创作自由的口号下开辟了文学的新天地。个性解放是他们高举的旗帜，反对社会对人的精神束缚和压迫，这是他们宣扬的时代新精神。对个人独立和极端自由的强调，成为浪漫主义文学的核心思想。\n\n二、以人道主义为思想武器\n\n浪漫派作家可分为带有资产阶级倾向和带有贵族倾向的两类。前者具有高昂的革命热情，揭露现实的黑暗和不合理现象，对未来社会充满美好的理想。后者以怀旧的态度去抨击资本主义。但是，这两类作家批判现实的思想武器都是人道主义，他们都从民主主义的立场或留恋旧制度的立场，抨击封建制度和资本主义的罪恶现象，同情下层人民的苦难生活，并以此去构筑理想的社会图景。\n\n三、酷爱描写中世纪和以往的历史\n\n从司各特开始，雨果、大仲马等浪漫派小说家，大都以历史题材为描写对象。古典主义贬斥中世纪的历史和文学，把它看成漆黑一团，浪漫派则反其道而行之，在重新挖掘中世纪和文艺复兴时期的文化的同时，也把这段历史作为描写的内容。但浪漫派井不重视是否反映历史的本质面貌，他们往往只撷取历史的一个小插曲，这个小插曲在史书上语焉不详，可以任凭作者自由驰骋，因而有时不顾主人公在历史上的真实情况，大仲马的小说就是如此。\n\n四、偏重于描写自然风光\n\n19世纪浪漫主义作家把自然看作一种神秘力量或某种精神境界的象征，标举卢梭“回归自然”的主张。他们厌恶资本主义文明和现实，寄忧思于自然，用自然美来对照社会的丑。他们不仅歌咏本国自然之美，而且乐于描绘异国风光，如美洲的丛林和大草原，地中海沿岸各国，少数民族的生活风俗，哥特式的建筑，古代的废墟，等等。","keywords":"个性解放 人道主义 历史 自然风光","note":"19世纪浪漫主义文学的思想特征突出的是对古典主义文学的反叛和对封建制度或资本主义制度的抨击，在内容上显示出逃避当下、逃避现实的特征，大家可以结合浪漫主义文学的代表作品如《巴黎圣母院》加以理解。"},{"id":"102","stars":"★★★★★","title":"19世纪浪漫主义文学的艺术特征","body":"一、强调个人感情的自由抒发，有强烈的主观性\n\n浪漫派作家认为古典主义宣扬的理性束缚了文艺，于是把抒发情感置于首要地位，对内心世界进行深入挖掘。由此浪漫派发现了“自我”，它成为对人和世界的新视野的源泉。\n\n浪漫派认为爱情是人最强烈的情感表现之一，通过爱情，一切都生活在其中，因而爱情便成为浪漫派作家竭力表现的对象，他们把爱情作为人的内心世界的一个重要方面来看待。\n\n浪漫派进一步发展了对梦境的探索。梦境既有现实生活的折射内容，也有大量非理性的精神表现。浪漫派对内心世界的挖掘与20世纪文学直接相通。\n\n二、对民间文学的重视以及诗体长篇小说的创造\n\n浪漫派从民歌民谣、民间传说中撷取题材，学习表现手法，采用民间口语、民歌韵律创作，大大丰富了文学的表现手法，在当时一味仿古或庸俗低劣的作品充斥文坛的情况下，这无疑带来了清新、活泼、健康的新气象。\n\n拜伦首创的诗体长篇小说，是在诗剧的基础上发展起来的，它视野宽广，将欧洲各国的社会生活熔于一炉。这种新形式扩大了诗歌反映现实的范围，对长篇小说的发展也起了推动作用。\n\n此外，浪漫派对语言的功能进行了深入开掘，丰富了语言的表现力，为日后的巴那斯派和象征派开辟了道路。\n\n三、浪漫主义文学惯用对比和夸张，重视丑的美学价值，大力提倡想象\n\n浪漫派作家已经懂得丑在美学上的重要价值。丑角在小说中起着衬托主人公的重要作用。浪漫派对丑的美学价值的认识给后世文学以重大影响。\n\n浪漫派寻求强烈的艺术效果，追求异乎寻常的情节，描写异乎寻常的事件，刻画异乎寻常的性格，塑造出超凡、孤独的叛逆形象，大大发展了传统的夸张手法。他们把想象视作“各种才能之母后”，为了取得惊人的效果，他们充分发挥想象，浪漫色彩由此而生。\n\n四、忧郁感伤的情调\n\n忧郁是浪漫派作家与周围现实不相协调而产生的精神状态，有贵族倾向的作家以此表达不满时代潮流的态度，如以勒内为代表的“世纪病”文学；资产阶级作家对现实深感失望时，同样流露出忧郁感伤的情绪，也表现出世纪病的症状。","keywords":"个人感情的自由抒发 民间文学 诗体长篇小说 对比和夸张 丑的美学价值 想象 忧郁感伤","note":"19世纪浪漫主义文学的艺术特征，是我们需要把握的一个重点，23年浙江大学、杭州师范大学，24年扬州大学、首都师范大学都对相关知识点进行了考查。浪漫主义的文学特征，主要表现在表达方式、艺术形式、艺术手法和情感基调四个方面，大家可以结合具有代表性的作家作品，从这四个方面去记忆。"},{"id":"103","stars":"★★★","title":"举例阐述欧洲浪漫主义文学对中国文学的影响","body":"一、鲜明的自我意识\n\n对自我的标举和崇尚是欧洲浪漫主义文学的思想核心。受其影响，久受封建思想蒙蔽的中国作家终于认清自己“活死人”的存在状态，识破传统伦理泯灭人性的真实面目，同时也第一次产生了个体意识的自觉，萌生了对自我价值与权利的渴求。这种新的对人的理解标示着一个个体的“人”的觉醒和发现。它使这时期的文学普遍带有了一种鲜明的自我意识。\n\n（一）表现自我、歌唱自我，成了五四新文学的一个基本主题。不难看出，郭沫若的诗歌创作就始终处于自我扩张和个性张扬的癫狂状态，其中始终矗立着一个巨大的“自我”。这个“自我”能“立在地球边上放号”，能“把全宇宙来吞了”，甚至还可以像浴火的凤凰那样死而复生。这些极为夸张的自我形象生动反映了五四青年一代的精神状态，表达了他们反抗压迫、追求自由的愿望与决心。\n\n（二）与这种思想内容上的自我表现相适应，作家们的取材也更多地切近自我，作品侧重描写个人身边的事物。除了抒情诗备受青睐外，他们还采用自传、日记等主观色彩较强的文体。郁达夫笔下的于质夫、文朴等角色，在很大程度上可谓作家自我形象的写照。\n\n二、强烈的抒情性\n\n欧洲浪漫主义文学以人的感情为本位，强调想象、灵感和直觉等主观内容。这一理论也在中国作家中引起强烈反响。\n\n（一）五四新文学在呼唤“人的文学”的口号下提出了个性自由的强烈要求，从而开启了波澜壮阔的情感大解放的壮观景象。当时的作家们尽管在很多具体的创作观念上存在差异，但都众口一词地推崇感情，认同主情说。以这一理论为导向，五四新文学最终摆脱了旧文学重理与说教的陋习而到处弥漫着抒情主义的气氛。讴歌理想时的昂奋、热烈，批判现实时的愤激、慷慨，疏离于社会后的孤独、苦闷，爱情破碎后的感伤、忧郁，这些都是作品中常见的情感色调。\n\n（二）以表现情感为旨归，文学的艺术形式也发生了相应的变化。那些以郭沫若为代表的抒发“火山爆发式的内发情感”的诗歌和戏剧成了浪漫主义文学的主要体裁。即使是以叙事为主的小说，在这种情况下也开始注意于描写内心的纷争苦闷，甚至还出现了抒情小说。郁达夫是这方面的代表。他的小说，如《银灰色的死》《沉沦》和《南迁》等，可以说都是抒发现代青年情感压抑和苦闷的诗。\n\n三、主张文学非功利性\n\n艺术创作上的自由不仅指诗歌内容的缘情而发，自由选择也不仅指表达形式的不受限制，它还应包括独立于任何社会功利的目的，追求艺术的自足和自律，这才是“文学上的自由主义”，即浪漫主义。受这一观念影响，中国现代文学中也出现过一股主张文学非功利性的潮流。\n\n五四新文学运动时期，青年作家们在反对封建文学的过程中激进地批判“文以载道”和“诗言志”的传统文学功利观，同时强调文学的非功利性。其实，浪漫主义者对纯文学的追求并不意味着他们完全摒弃了文学的社会功利性，他们只是认为文学的功利目的必须通过审美的中介来实现。这无疑对强调文学的道德和社会功用的极端倾向具有一定的矫正作用，但在当时民族危机愈益严峻，救亡图存成为时代首务的历史语境下，这一主张显然也逐渐成为一种不合时宜的声音。\n\n四、歌颂自然\n\n19世纪欧洲浪漫主义文学接受了卢梭“返归自然”的口号，将大自然作为对抗丑恶现实和城市文明、寄托作家精神人格和道德理想的完美世界。歌颂自然，描绘具有自然本色的风物与人性是浪漫主义文学区别于古典主义的一个重要特征。中国传统文化也向来推崇“天人合一”的自然观，在文学中，对自然的描绘也曾是诗歌表现内容的一个重要组成。因此，中国现代文学中自然成分的加强固然源自对这一文学遗产的继承，但也与欧洲浪漫主义文学的传播和影响是分不开的。\n\n（一）欧洲浪漫主义文学的自然观为现代作家的创作注入了一股清新的自然气息，使之呈现出一派崭新的面貌，即自然景物不再是可以被忽略的部分，而成为文学表现的一个重要对象。比如，徐志摩的《夜》中“西风”的意象分明出自雪莱的《西风颂》，《黄鹂》中的黄鹂鸟显然脱化于雪莱的《致云雀》。另外如郭沫若的《女神》中巍峨的金字塔、郁达夫的《薄奠》中北京的晴空远山等，都与传统文学中静默无息、毫无生气的自然不同，而是具有自己的意志和生命的鲜活生灵，是一个能与“我”平等对话和沟通的独立主体。\n\n（二）与传统文学中作家将自然作为生命欲求的止息之地不同，现代作家对自然的热爱和归附却恰恰是以对生命欲求的肯定为前提的。正因如此，现代文学中的自然不仅具有传统文学中的宁静、优雅、绮丽、谐和等美感特征，而且增添了欧洲浪漫主义文学中的狂暴、遒劲、恢弘、壮丽等美感因素。自然不再只是作家心灵受伤后的精神栖息之所或遁逃之地，它还是能够表达愤怒情绪和抗争意识的顽强斗士。虽然到三四十年代，这一特点又逐渐回复为带有道家色彩的自然状态，但其中所贯注的生命意识仍可透视出浪漫主义影响的痕迹。比如沈从文笔下，除了人物，湘西山水本身也包含着作者对理想世界和原始生命的礼赞。\n\n总的来看，19世纪欧洲浪漫主义文学对中国现代文学的影响并不是全面的，也不是持久的。就前者而言，正如有学者指出的，欧洲浪漫主义的宗教色彩、回到中世纪的情绪以及反资本主义的性质都没有在现代文学中“落地生根”。就后者而言，它的影响主要集中于五四新文学运动时期，而对后来文学的影响就不那么直接和明显了。当然，这也是除现实主义之外，其他很多欧洲文学思潮在现代中国的普遍命运。","keywords":"自我意识 主观抒情 非功利性 歌颂自然","note":"本题为2023年北京大学外国语学院真题，原题是“论述欧美浪漫主义文学的时代特征，并举例阐述其对中国或日本文学的影响”。前者主要是回答19世纪浪漫主义文学的思想特征及艺术特征，因前面两题已有详细解答，所以本题不再赘述；后者属于比较文学范畴，需要我们结合中国近代文学和亚非文学相关知识进行讨论。关于对日本文学的影响，可参看孙艳华《日本浪漫主义对欧洲浪漫主义的摄取》，陈灵侠《日本浪漫主义文学思潮》，相关资料可在李凡文学正版群中获取。"},{"id":"104","stars":"★★★","title":"德、英、法三国的浪漫主义文学有何不同","body":"由于各国的政治、经济发展不平衡，文化、历史传统有差异，浪漫主义文学作为19世纪早期欧美文学主潮，在各国的发展情况及取得的成就也不相同。德、英、法三国浪漫主义文学的不同，主要表现在以下方面：\n\n一、德国浪漫主义文学\n\n浪漫主义文学首先在德国产生。德国在当时的西欧是非常落后、守旧的国家。严重的封建割据，使得全国四分五裂，封建势力十分强大，法国大革命的结果使不少人对革命怀有疑虑和恐惧，形成了一种压抑沉闷的空气。当时的古典哲学对德国作家们则产生了直接影响，促使他们在不满现实的同时，向精神领域寻找寄托和探索实现理想的途径。不少作家沉醉于对民间文学的收集与整理，有的则用赞美中世纪和基督教来抵制现实。于是，一种带有浓厚的神秘色彩、悲观情调的浪漫主义就在德国形成。\n\n德国浪漫主义是欧洲浪漫主义思潮的先导，它对欧洲乃至整个世界浪漫主义运动的兴起与流行，作出了重大贡献，也为德国民族文学的形成与繁荣奠定了基础。被勃兰兑斯称为“浪漫主义病院”的德国浪漫派，是一些内心敏感、善于体悟人的情绪与心理状态、热衷于描写离奇怪诞充满神秘色彩事物的作家，他们对人的感性自我的关注远远胜过对理性自我的张扬；他们热衷于表现的怪诞、梦幻、疯狂、神秘、恐怖等等，恰恰是人的理性的触角所难以触及的感性内容。无论是诺瓦里斯还是霍夫曼，虽然他们与宗教、与神秘主义有着密切联系，但宗教与神秘主义使他们步入了启蒙作家与思想家所极少涉足的人的深层心理与感性世界。\n\n二、英国浪漫主义文学\n\n18世纪末19世纪初的英国是欧洲最大的工业国，资本主义的力量比较强大，作家的自由民主意识也较强，因此，英国浪漫主义文学更具有反封建精神，更注重对社会问题的探讨。英国浪漫主义文学明显分为两派，即“湖畔派”和“撒旦派”（又称“恶魔派”）。\n\n“湖畔派”指19世纪英国早期浪漫主义运动中的一个流派。主要代表有威廉·华兹华斯、萨缪尔·柯尔律治和罗伯特骚塞。他们同情法国大革命，对资本主义的工业文明和金钱关系感到不满，主张回到大自然，复兴宗法制。他们常常隐居于英国西部的昆布兰湖区，寄情于湖畔山水，歌颂大自然，缅怀中世纪，以表示他们对现实社会的不满与憎恶，“湖畔派”也就因此而得名。\n\n“撒旦派”诗人主要有拜伦、雪莱和济慈。1821年，骚塞在《审判的幻景》文中对拜伦、雪莱、济慈等进行猛烈攻击，把拜伦的作品说成是恐怖、嘲笑、下流、邪恶的荒谬结合。拜伦也以《审判的幻景》为题进行回击。由于此派诗人蔑视传统、敢于斗争，因而被英国绅士斥为“撒旦”（即魔鬼），所以，文学史上就称拜伦、雪莱、济慈等为“撒旦派”。在思想上，他们和“湖畔派”诗人有分歧；在艺术上，他们继承并发展了“湖畔派”开创的浪漫主义诗歌传统。\n\n英国浪漫主义作家崇尚“自然”，表达的主要是人对自然纯真的人性的崇尚、对被理性与文明压制下的人的自然情感与欲望的追寻。华兹华斯总是怀着一颗纯真的童心，在超然于世俗、人与自然交融的境界中捕捉着纯然的人性之美。济慈则习惯于用敏感的诗心在自然中静观默察，体悟大自然生命纤维的律动，把握生命存在之真，捕捉在自然中隐藏的永恒的生命，进而歌颂纯真人性之美。雪莱的诗歌善于凭借奇特而丰富的想象去感受自然中的无穷力量，借以抒发人性自由的理想，凸显了一个充满激情、追求个性自由的“自我”。拜伦通过一系列“拜伦式英雄”形象，展示了充满感性欲望和自我扩张意识、与传统理性主义价值观相抗衡，因而具有非道德化倾向的人文观念，其间延续着古希腊式的人本传统。总之，英国浪漫主义文学是欧洲浪漫主义文学运动中成就最大的。在这短短的四十多年中，英国文坛上群星灿烂，人才辈出，成为英国文学史上辉煌的一页。\n\n三、法国浪漫主义文学\n\n在德国、英国浪漫主义文学思潮的影响下，法国浪漫主义文学也在19世纪初兴起，并在1830年前后进入高潮。法兰西民族是一个富有激情、极为浪漫的民族，而在18世纪，法国又是古典主义的大本营，加之在政治上革命与复辟的斗争异常激烈，因此，法国的浪漫主义具有强烈的政治色彩，它是在同古典主义反复较量后才得以在文坛上确立的。\n\n法国浪漫主义在30年代战胜古典主义后，一直和现实主义并驾齐驱，到19世纪下半叶才逐渐衰退。法国浪漫主义文学既少有德国式的“颓废”，也缺乏英国式的回归自然的宁静与欢欣，而充溢着由剧烈的社会变革所致的自由与激情。夏多布里昂试图通过小说创作表达对基督教的赞美，但实际上，他的小说通过狂野的人性、狂放的原欲之爱与宗教的尖锐冲突，显示了潜藏于人们心底的不可抗拒的人性之爱的美，说明了自然人性原本就是美的。梅里美热衷于表现人的原始、赤裸的强力，他笔下的人物类似于反文明、非道德化倾向的“拜伦式英雄”，揭示了文明与人性的潜在矛盾，展现了狂放不羁的“自我”。乔治·桑因其对道德戒律的蔑视与反叛而被守旧贵族称为“魔女”，她的小说尽情地表达着人的狂放的激情。法国浪漫主义文学展现的是渴望自由、热情奔放、张扬“自我”、个性主义的人文观念。","keywords":"德国浪漫主义文学 浓厚的神秘色彩 悲观情调 英国浪漫主义文学 反封建精神 对社会问题的探讨 崇尚“自然”法国浪漫主义文学 自由与激情","note":"19世纪不同国家浪漫主义文学之间有统一之处，但由于各国国情不同，也会有很大的区别，大家要对各个国家浪漫主义的不同表现有所了解，例如2023年东北师范大学就对英国浪漫主义文学的特征进行了单独考查，类似这样的题目要大家结合具体作家作品扩充自己的阐述。"},{"id":"105","stars":"★★★","title":"浪漫主义文学的反古典特征","body":"一、强调感情的抒发，偏重理想的追求，有很强的主观性\n\n古典主义文学崇尚理性和法则，反对个人感情的自由表达。浪漫主义则认为古典主义的理性原则对作家的创作是一种束缚，反对运用理性观念来认识和概括现实，主张从情感与想象等主观意志出发，追求创作的绝对自由。\n\n在浪漫主义者看来，文学作品实质上是把内在的情感与思想变为外在物象，是感情冲动时的一种外泄的结果，展示的是作者的知觉、情感的幻想，是表现而不是模仿与再现。浪漫主义文学把个人感情、主观世界诉之于海阔天空的想象。如雪莱的诗歌，理想色彩和抒情性都十分明显。正是由于浪漫主义者重理想、情感与想象，所以他们的作品往往热情奔放，抒情色彩浓厚，具有很强的主观性。这是浪漫主义文学思潮的本质特征。\n\n二、歌颂自然\n\n浪漫主义文学反对古典主义只注重描写历史题材和宫廷生活，着力于表现自然景物和乡间的纯朴生活，歌颂和赞美大自然。浪漫主义作家往往对现实社会中的封建残余不满，也不肯接受限制个性自由的资本主义文明。他们认为，人类应有更好\n\n的生存方式，而那未经文明染指的原始的和自然的境界，是最能体现自由理想，最符合人性的，因此，他们接受卢梭“返回自然”的主张和泛神论思想，崇尚自然。\n\n三、重视民间文学和民族传统\n\n17世纪古典主义文学排斥民间文学而推崇古希腊罗马文学，追求典雅崇高的艺术风格。浪漫主义则重视民族传统和民间文学，尤其是中世纪的民间文学。因为民间文学往往感情真挚，想象丰富，形式自由，语言不拘一格，这正符合浪漫主义力图摆脱古典主义清规戒律的束缚，追求创作自由的要求。\n\n实际上，欧洲的浪漫主义首先是在整理和发掘民间文学的基础上形成和发展起来的，浪漫主义在艺术上的创新，很大程度上也得力于他们对民间文学中优秀传统的继承和发展。对民间文学的重视，也表现出作家们民族意识的增强以及对民族独立与解放的追求。","keywords":"感情的抒发 主观性 歌颂自然 民间文学和民族传统","note":"浪漫主义文学是在冲破古典主义束缚，继承英国的感伤主义文学、德国的“狂飙突进”文学和法国作家卢梭的创作的基础上发展起来的。在回答时，我们主要提取浪漫主义文学特征中对于古典主义文学反叛的部分，条理清晰地作答即可。"},{"id":"106","stars":"★★★","title":"浪漫主义为何会成为一种世界性的文学思潮","body":"一、适应各国文学发展要求\n\n浪漫主义诗人和作家受到民主主义、自由主义思想的洗礼，站在民主主义的立场上，批判封建制度或资本主义社会的罪恶。同时，浪漫主义反对古典主义的清规戒律，要求创作的绝对自由，推崇想象和艺术创造力。这种新的文学精神和审美追求适应了世界各国文学发展的要求，很快被各国作家所接受，成为一种世界性的共同的文学追求。\n\n二、历史必然性\n\n18世纪末19世纪初的欧洲和北美处于一个急剧动荡的时代，资产阶级处于上升时期，进而要求政治权利，而封建势力正处于强弩之末，仍在苟延残喘，两个阶级之间的斗争在欧洲各国爆发，并日趋白热化。1789年，法国爆发革命，给欧洲封建统治以强烈冲击，俄、普、奥等国封建势力纠结在一起，组成“神圣同盟”，围剿法国革命。这种在欧洲首先爆发的两个阶级的革命斗争，预示了此后世界历史的一个重要阶段的到来，具有普遍性。社会发展的历史过程与特征，为浪漫主义成为一种世界性的思潮奠定了历史必然性。\n\n三、理论基础\n\n法国大革命给封建王权以巨大的打击，而英国工业革命则展示了资产阶级获胜后的成就，推动了民主、平等、自由的思想在世界各地的广泛传播，各国人民追求民主自由，争取民族独立、民主解放的运动此起彼伏。要求独立、平等和个性解放的呼声纷纷唱响，革命情绪不断高涨，革命热情空前膨胀，民族意识觉醒。这些给浪漫主义文学成为世界性思潮提供了坚实的理论基础，营造了普遍的社会条件和时代氛围。\n\n四、心理基础\n\n随着革命的进一步发展，社会动荡的局势加剧，一些青年产生了不适应感，尤其是革命之后并没有实现启蒙理想，甚至封建王权在斗争过程中建立起复辟政权，倒行逆施，这一时期复杂的社会现实使得这一时期的人们处于憧憬与失望的波峰浪谷之中，需要一种途径释放苦闷情绪，表现自我感受，为浪漫主义形成一股世界性的文艺思潮奠定了心理基础。\n\n总之，在新的历史时期，因循守旧，维护封建王权利益的古典主义已经适应不了时代的发展，而浪漫主义文艺肯定个性与人的主动性，反对专制与压迫，追求自由、活泼的形式，则应运而生，作为时代的产物，很快获得人们的普遍认同，形成了一种世界性的文艺思潮，推动了各国民族民主解放运动的开展。","keywords":"适应各国发展要求 历史必然性 理论基础 心理基础","note":"这部分内容中，第一点属于文学自身发展的规律，是内部的原因，后面三点都是外部的原因。一般回答原因都从内部和外部这两个方面去分析，既要考虑到文学自身的发展规律，也要考虑到外部环境对它的影响。"},{"id":"107","stars":"★★","title":"简述英国浪漫主义诗歌的发展历程","body":"一、英国浪漫主义先驱-彭斯和布莱克\n\n彭斯从苏格兰民歌中吸取养料，擅长抒情与讽刺。《苏格兰方言诗集》揭露了贵族的贪婪残暴、荒淫无耻，赞颂了农民的淳朴、勤劳、善良，风格清新刚健，语言通俗，音韵响亮，达到了18世纪英国诗歌的高峰。\n\n布莱克的《天真之歌》和《经验之歌》充满了对生活的热爱和革命的热情，前者以“羔羊”为典型，抒写温柔仁爱的想世界，后者以“老虎”为典型，表现对黑暗社会的不满。长诗《四天神》揭露统治者对外掠夺、对内压榨的反动本质。也运用清新的民歌体和奔放的无韵体写诗，具有象征意义和神秘色彩，因而受到20世纪评论家的重视。\n\n二、英国第一代浪漫主义诗人-“湖畔派”诗人群\n\n真正开创英国浪漫主义潮流的是“湖畔派”三诗人：华兹华斯、萨缪尔·柯勒律治和罗伯特·骚塞。“湖畔派”诗人从颂法国大革命到产生抵触情绪，蛰居到英国西北湖区，寄情山水，缅怀中世纪和宗法式农村生活。柯勒律治与华兹华斯的《情歌谣集》是英国浪漫主义的奠基作，提出了浪漫主义艺术的要点。柯勒律治的《古舟子咏》《忽必烈汗》即收入其中，这两首诗写出东方古代的景色，充满幻觉和奇诵的意象，赋予大自然以强烈的魅力。骚塞的短诗《书斋咏怀》在故纸堆中寻知音，发思古之幽情，与世俗格格不入。这三位诗人对大自然的歌咏成为英国浪漫主义文学的重要特色之一。\n\n三、英国第二代浪漫主义诗人-拜伦、雪莱和济慈\n\n这三位诗人与“湖畔派”诗人不同，他们始终忠于法国革命理想，反对专制暴政，同情人民苦难，支持各国人民的民解放运动，具有鲜明的资产阶级民主主义倾向。\n\n拜伦在“东方叙事诗”中塑造了一系列“拜伦式英雄”，其《唐璜》更因思想艺术上的突出成就而成为世界不朽的名著\n\n雪莱的诗剧《解放了的普罗米修斯》气势磅礴，富有感染力。其《西风颂》《致云雀》等抒情诗歌，音韵铿锵，感情挚，闪耀着深邃思想的光辉。\n\n济慈的诗形象生动、想象丰富，真正达到了诗中有画的境界。其代表作是《夜莺颂》。\n\n此外还有司各特，他早期创作诗歌，富有浪漫主义色彩，后转向小说，成为欧洲历史小说的创始人。从整体看，英国浪漫主义文学作家不满于资本主义的发展，具有愤世嫉俗和向往大自然的倾向。","keywords":"先驱 彭斯和布莱克 第一代“湖畔派”诗人群 第二代 拜伦 雪莱 济慈","note":"英国浪漫主义文学的成就主要在诗歌方面，所以题目就算问的是英国浪漫主义文学的发展也能这样回答。从总体上看，英国浪漫主义文学多表现自然风光和具有异国情调，这两点是需要注意的，有可能会单独考查，届时结合本题以及-些作品回答即可。"},{"id":"108","stars":"★★★","title":"华兹华斯诗歌创作的艺术特征","body":"一、歌咏大自然\n\n与同时代的其他英国诗人相比，华兹华斯是最乐于也最善于描写大自然的。他对大自然怀有深厚的感情，对实现工业之后具有种种痼疾的城市却颇为厌恶；他认为大自然能够启迪人性中的博爱和善良的情感，而且，融合在大自然之中能够人得到真正的幸福。他一生中的绝大多数时间都是在他出生地所在的湖区一带度过的，他的诗歌中有很大一部分就是直观描绘那里的自然风貌。\n\n华兹华斯厌恶城市生活和现代文明，因而逃避到英国的南部湖区。但他不是一个完全脱离社会现实和遁入大自然的隐士而是在歌咏美好的大自然时又同现实保持紧密联系的社会观察家和速写画家。他在湖区没有把自己同社会隔绝开来而沉溺子浪漫主义的幻想，而是通过对社会现实的观察同样写出了许多反映现实并富有深刻社会思考的优秀诗篇。\n\n二、人民性\n\n华兹华斯是一位独创的革命的浪漫主义诗人，他的创作较之他的前辈作家更加接近人民。他继承和发扬了罗伯特·彭斯歌诗风的人民性特点，把诗歌创作变成表现劳动人民生活的艺术。他描写了大量的劳动人民的形象，广泛地反映了下层社会的生活内容，表现了英国社会中劳动人民在资本主义和封建主义冲突中所经历的悲惨命运的主题。如《玛格丽特的忧伤》写母亲对流入城市的独子的怀念，写出了慈母的悲伤、凄凉和溺爱孩子的懊悔，其他诸如《孤独的收割者》《露茜》《她眼睛已疯狂》《流浪汉》《罗斯》《抱怨》等，都从不同方面反映了劳动者的苦难和不幸，并对他们寄予真挚的同情。\n\n三、善于抒情，擅长表现内心世界\n\n华兹华斯从广大的劳动人民的生活中撷取创作素材，以丰富的想象和酣畅的笔墨描写小人物的命运，并以朴实无华的文字渲染出浓郁的抒情气氛，流露出人道主义的同情。华兹华斯在以穷苦人民的悲惨生活为内容的诗篇里，倾吐自己深沉的闷和低徊的感伤，在浪漫的遐想和激动的诗情之间，流露出缠绵悱恻的情愫，在这类诗歌里，我们特别感到情感的力量。\n\n华兹华斯在诗歌中用满蘸感情的艺术之笔抒写平凡的人物和平凡的事件，善于描写复杂的心理活动和探察隐蔽的内心也界。他往往能透过普通的小事洞悉人物的内心深处，抓住细腻微妙的情感，把诗的意境写得更深刻，把内容写得更含蓄。\n\n《我们是七个》《可怜的苏珊的冥想》《彼得·贝尔》等。在这些诗里，处处显示出诗人对人世间的不幸和苦难的高度敏感，渗透着诗人的不安和痛苦，同时又激荡着对于美好未来的憧憬和追求。\n\n总的来说，华兹华斯的诗风是：不尚奇幻，以其宁静的沉思和富于想象力的风格将诗写得真挚自然，亲切质朴，既注重自然的可感性而着意捕捉细节，又从人们的日常生活中开掘感情宝藏，以取得新鲜感和奇特的效果。","keywords":"歌咏大自然 人民性 善于抒情 擅长表现内心世界 不尚奇幻","note":"华兹华斯的题材偏向与情感流露使其创作整体呈现出清新明朗、真挚自然的特色。相关内容可参考聂珍钊《论华兹华斯的诗》，资料可在李凡文学正版群中获取。"},{"id":"109","stars":"★★★","title":"《抒情歌谣集》体现了华兹华斯的哪些理论主张","body":"一、关于诗歌的题材问题\n\n在题材方面，华兹华斯要求突破古典主义的“规范”，把审美对象从宫廷转向民间，从城市转向山乡湖畔。他主张“选择日常生活的事件和情节”，而在这种选择中他又“通常都选择微贱的田园生活作题材”，因为“在这种生活里，我们的各种基本情感共同存在于一种更为单纯的状态之下”“人们的热情是与自然的美和永久的形式合而为一的”。\n\n二、关于诗歌的语言问题\n\n华兹华斯主张，诗应该“自始至终竭力采用人们真正使用的语言来加以叙述或描写”。这里所说的“人们”，是指农村的下层民众，或者是过着“微贱的田园生活”的人，因为他们的语言是从“最好的外界事物得来的”，是与美妙的大自然息息相通的。\n\n三、关于诗歌的本质问题\n\n（一）诗的定义\n\n华兹华斯把诗与知识，即人的理性联系在一起，同时又与人的情感联系在一起，而且更强调后者。所以，他为诗下的定义是：“诗是强烈情感的自然流露。”\n\n（二）诗的目的\n\n华兹华斯认为“诗的目的在于真理......普遍的和有效的真理”；同时又认为，诗“必须直接给人以愉快”，要“带有一种愉快的热情”，把真理“传达给读者”。换言之，诗以真与善为目的，但却是通过美来达到这一目的的。\n\n四、关于诗人的特殊才能\n\n华兹华斯认为诗人与一般人之所以不同，关键在于“没有外界直接的刺激他也能比别人更敏捷地思考和感受，并且比别人更有能力把内心产生的思想和感情表现出来”。也就是说，诗人比一般人更具想象力和语言表达能力。这种对诗人想象力的强调，可以说是英国浪漫主义诗论的核心。\n\n关于诗歌题材和诗歌语言的问题，实际上就是文学内容和形式问题，而他对情感和想象在创作过程中的重要性的强调，则是对传统古典主义理性原则的直接挑战。所有这些，在当时都具有开拓性质，不仅直接推动了英国诗学和诗歌创作的发展，而且还在西方文学史上产生了深远影响。","keywords":"题材 语言 本质 定义 目的 诗人的特殊才能","note":"华兹华斯《抒情歌谣集》的考查重点是在理论贡献方面，艺术特色一般考查较少，如果考到也可以结合其理论主张以及英国浪漫主义文学的共同特色来回答，大家要注意灵活应对。"},{"id":"110","stars":"★★★","title":"请简要介绍什么是“拜伦式英雄”（26华中师范大学）","body":"在拜伦创作的一系列优秀诗篇里，诞生于1813至1816年间的一组以东方故事为题材的传奇作品，具有特殊的价值。这一组独具特色的诗歌被称为“东方叙事诗”，由《异教徒》《阿比道斯的新娘》《海盗》《莱拉》《柯林斯之围》和《巴里西纳》这六部长诗组成。诗歌中拜伦塑造了一批著名的带有拜伦自身思想性格特征的英雄形象，即以作者命名的“拜伦式英雄”的形象。\n\n一、“拜伦式英雄”的特征\n\n（一）主要由海盗、异教徒、被放逐者组成\n\n“拜伦式英雄”大都是一些单枪匹马的复仇者，有着崇高的道德观和侠义心肠，爱好自由，忠于爱情，愤世嫉俗，往来神秘。他们有高傲孤独、倔强的叛逆者，如《异教徒》中的威尼斯人；有的是强者形象，如《海盗》中的康拉德和《阿比道\n\n斯的新娘》中的塞里姆；有的是社会的反叛者形象，如《莱拉》中的莱拉，《柯林斯之围》中的阿尔普。\n\n（二）具有强烈的个人反抗精神和坚强的意志\n\n“拜伦式英雄”最为显著的特征是“个人反抗”。他们与其生活的社会格格不入，具有高度的个人性，独自反抗暴政、权威、命运，追求自由解放。如哈罗德独自叛离资产阶级社会；曼弗雷德独自背负起所有自身和人类的罪孽，并独自以毁灭来抗拒命运。他们表现出拜伦式英雄的典型的个人英雄主义情结。这类人物表现出矛盾的思想和非凡的性格，他们热情似火，热爱生活，追求爱情，渴望幸福，与社会恶势力誓不两立，敢于蔑视现存制度，做一个社会的反叛者。\n\n（三）往往伴随着悲剧与失败\n\n“拜伦式英雄”的思想基础是个人主义和自由主义，没有明确的政治目标和清晰的社会理想，试图以有限的个体去穷尽宇宙的奥秘，摆脱自身乃至人类的悲剧性处境，并达到自由和完整的境界，他们满怀热情，傲世独立，行踪诡秘，好走极端，在斗争中单枪匹马，远离群众，因而注定了他们是以失败告终。\n\n二、“拜伦式英雄”的意义\n\n（一）反映现实社会，具有进步意义，对革命起到两面性影响\n\n“拜伦式英雄”虽是诗人艺术化的人物，但也表现了一定程度的现实社会，他们对个性解放和自由幸福的追求也正是当时时代精神的体现，因此在当时社会产生了强烈的反响。“拜伦式英雄”具有强烈的反抗精神，对世界上被压迫民族的革命志士和民族解放的志士都起过积极的影响。但他们带有的个人主义，无政府主义和悲观厌世情绪，又往往会给读者带来消极的作用。\n\n（二）传播浪漫主义，促进欧洲文学发展\n\n拜伦的“东方叙事诗”题材新颖，叙事抒情，意境深远，充满了浪漫情调。在拜伦的创作中，“东方叙事诗”为“拜伦式英雄”提供了一个尽情展示自我性格特点的舞台，发展了此前创作的浪漫诗篇《恰尔德·哈洛尔德游记》中的主人公形象，使拜伦式形象变得更丰满、更生动，也更有特点。在以后的诗剧《曼弗雷德》《该隐》等作品中，“拜伦式英雄”的性格又有新的发展。“拜伦式英雄”在欧洲各个阶层的读者中都引起广泛的共鸣。俄国诗人普希金在他创作的诗体小说《叶甫盖尼奥涅金》中塑造的“多余人”，就明显有“拜伦式英雄”的影子。后来莱蒙托夫笔下的毕巧林、屠格涅夫笔下的罗亭等“多今人”形象，也明显带有“拜伦式英雄”的性格特征。","keywords":"带有拜伦自身思想性格特征 由海盗、异教徒、被放逐者组成 不同特点 坚强的意志 强烈的反叛精神 悲剧与失败 反映现实社会，具有进步意义，对革命起到两面性影响 传播浪漫主义 更丰满、更生动，也更有特点 广泛的共鸣","note":"“拜伦式英雄”是一个常考点，23年南开大学、中南大学，24年浙江师范大学、东北师范大学都有过相关考查，它常以名词解释的形式出现，“东方叙事诗”也是一个常考名词解释，大家也要关注。“拜伦式英雄”曾在欧洲引起广泛共鸣，影响了后来作家的人物塑造。这些形象身上显露着拜伦的思想性格特征，通过这些形象我们能够更深入地认识拜伦。"},{"id":"111","stars":"★★★","title":"拜伦的创作特征","body":"一、思想特征\n\n（一）对专制势力的反叛\n\n在《东方叙事诗》的那些传奇色彩极浓的诗篇里，拜伦对暴君即封建强权统治的抗议甚为激烈。他所塑造一系列带有无政府主义色彩和个人英雄主义色彩的人物，即“拜伦式英雄”。他们都是一些异常孤独、脱离群众的反叛者的形象。他们与罪恶社会势不两立，并且也敢于进行毫不妥协的斗争。他们的共同特征是：顽强、高傲、勇敢和坚定。像《海盗》的主人公康拉特就是一个典型。\n\n（二）热爱自由、渴望自由\n\n拜伦在短诗《耶夫萨的女儿》中刻画了一个为祖国自由而甘愿牺牲的姑娘的形象；在《你的生命完了》一诗中歌颂了一个为人民的自由而献身的英雄；在长诗《恰尔德·哈洛尔德游记》和《唐璜》中，诗人对当时各国的卫国战争和欧洲风起云涌的民族解放运动都给以热情的歌颂和支持。\n\n二、艺术特征\n\n作为浪漫主义一代宗师，拜伦创作了包括抒情诗、驳论诗、讽刺诗、故事诗、诗剧、长篇叙事诗等在内的大量作品。它们虽然宗旨不同，体裁各异，风格多样，但无不富有才情，显示出强有力的个性和潇洒独立的风采。\n\n（一）强烈的主观抒情性和鲜明的政治倾向性\n\n拜伦名言“诗的本身即是热情”可谓其诗美学的核心。由于拜伦是个积极入世的政治家诗人，所以其满腔激情往往升华为对自由与正义的呼唤。他的大部分诗作具有鲜明的政治色彩或倾向性。抒情诗如此，长诗如此，诗剧亦然。拜伦作品中，负有沉重历史感的时代豪情常占据主导地位。在其笔下，高山和大海无不雄奇、豪壮、粗犷，是自由的象征，是力与美的凝聚，是英雄性格与激情的体现。\n\n（二）辛辣的讽刺性\n\n就气质论，拜伦主要是位讽刺诗人，他发展了英国文学独特的讽刺传统，并将之推向前所未有的广度和深度。他的讽刺机智微妙，变化万千，耐人品味，使其诗作具有特别的战斗性和摧毁力。此外，拜伦并非纯然从主观、从内心体验汲取灵感，而是紧紧盯着人和人类社会，这又使他的讽刺往往一针见血，入木三分，大大加强了作品的现实感和生命力。","keywords":"对专制势力的反叛 热爱自由 渴望自由 强烈的主观抒情性和鲜明的政治倾向性 辛辣的讽刺性","note":"拜伦不仅是伟大的诗人、天才的作家，更是伟大的革命家。拜伦思想上最突出的特征便是其叛逆性格，自由和正义是他思想的核心。在他的思想倾向影响下，他的诗歌创作显示出了强烈的抒情性和政治倾向性，以及辛辣的讽刺性。回答时可以结合具体作品进行分析。"},{"id":"112","stars":"★★★★","title":"《唐璜》的思想价值","body":"一、揭露与讽刺\n\n作者把故事发生的时间放在18世纪末叶，但诗中的议论却几乎触及当时英国与欧陆所有重大的政治事件，这就把历史和当代的社会生活奇妙地交织起来了。\n\n（一）《唐璜》通过主人公的冒险足迹-海盗称霸的希腊岛屿、土耳其禁闱、俄罗斯宫廷及英国上流社会-揭示出：那个时代的特征就是封建专制的暴虐和社会道德的虚伪。到处是流血、战争、兼并，到处是欺诈、出卖、抢劫。残暴的君主专制，猖獗的商业资本，把人作为物出卖的奴隶交易，等等，气焰嚣张、横行无忌。诗人剥下那些女皇、君主、政客、将军的画皮，指出他们原来不过是荡妇、恶棍、无赖、刽子手之流。\n\n（二）以英国社会为标本，讽刺它的各个方面。拜伦对英国社会最为熟悉，因而对英国的讽刺也最为有力。帝国屠杀恫吓世界，政府压迫盘剥国民；权贵跋扈，政治家撒谎；绅士老爷高视阔步，街头神女风尘飘荡；无行文人变节，唯心主义横行；贵族上流社会罪恶及拜金主义猖獗......拜伦对这些都作了痛快淋漓的冷嘲热讽。\n\n（三）表现了不合理的婚姻以及与之相联系的上流社会夫妇之间互相欺骗的现象，揭示了建筑在封建的或是资产阶级的经济与伦理基础上的婚姻普遍的不幸。23岁的少妇朱丽亚背着50岁的荒唐丈夫勾引一个16岁的孩子，本身便是对其婚姻的绝妙讽刺；诗人还以讥诮戏谑的笔调写到唐璜父母的不和，苏丹王卧榻上的同床异梦和沙俄女皇的沉醉嬖宠，尤其是亨利爵士“明媒正娶”的模式化家庭以及某公爵夫妇虚假的“神圣”关系，等等。\n\n二、热爱自由\n\n爱自由，一向是拜伦创作的主调，当然《唐璜》也不例外。唐璜的同情与怜悯正是从人是否保持了自由这一点出发的，基于此，他才对被关押在像“修道院那样冰冷”的后宫里的嫔娥们哀哀长叹，也正是为了自由，他坚决主张革命。因此，《唐璜》中充满了对正义事物的爱，对失去自由的人的同情和对被压迫者的战斗号召。\n\n三、哲学的思索\n\n拜伦“有着极强的沉思的倾向”，所以他的诗作一向富有哲理，《唐璜》里亦不乏哲学的思索，“沉思人世的变化无常”，推究“生与死”之奥妙。但面对“永恒的岁月之流滚滚而去”，却不免陷入迷惘，产生对生的怀疑、对死的迷惑，堕入不可知的迷途，这就往往导致虚无主义，视“人生是场游戏”而滑向另一个极端-享乐主义。但这类消极的情调不是主要的，在《唐璜》里，诗人更多的是把人生体验诸如爱的苦恼、家庭风波、内心回旋之类娓娓道来，随便却深刻，把人类生活中各样奇异的矛盾变化-尤其是心理的或精神的-微妙但是向着极端的发展揭示出来，启发你洞察心灵或意识的幽微。","keywords":"揭露与讽刺 热爱自由 哲学的思索","note":"拜伦是时代的歌者，《唐璜》则是时代精神的结晶。分析其思想价值，也可以从唐璜的人物形象入手。唐璜原是中世纪西班牙传说中无恶不作、卑劣凶顽的好色之徒，但到了拜伦笔下，唐璜却被赋予热情善良的品格。他的爱情故事大多是对上流社会虚伪道德的讽刺，而他和海盗女儿海黛的经历，更多的是体现一种充满诗意的理想。他与传说中的唐璜亦非完全绝缘，例如喜好女色、玩世不恭等，还能见出其原始性格的痕迹。其性格的二重性再好不过地体现了现实世界里生活的多样性和道德的复杂性。"},{"id":"113","stars":"★★★★","title":"《唐璜》的艺术特征","body":"一、浪漫主义色彩\n\n《唐璜》在艺术上，尽管其中现实主义的描绘比比皆是，但浓郁的浪漫色彩仍然是主要的。\n\n（一）《唐璜》的浪漫色彩突出表现于它的传奇性以及那妙笔营造的传奇性氛围-离奇的故事、异域的情调，还有出不穷的戏剧性场面，诸如人吃人的惨剧、土耳其宫闱内的风波等。\n\n（二）《唐璜》的浪漫色彩还表现在那优美而略带感伤的抒情性，似乎无处不在，统贯全篇。拜伦长于抒情，其奥妙？于恰到好处地把握分寸，奔放或者含蓄，根据情境与火候使之“水到渠成”。很多情况下，“淡淡的哀愁”可用以描述拜诗情之特殊优美的境界，这从唐璜与朱丽亚相恋的场面甚至仅仅从朱丽亚的诀别信就可体会了。\n\n二、兼叙兼议\n\n从表现手法上说，《唐璜》最突出的特点是以兼叙兼议为主，即在第三人称的叙述中插入第一人称的谈话，诗人似乎法按捺自己，随时向他的主人公和读者大发议论，这种议论甚至占到全诗一半以上篇幅。通过该形式，评点国事，臧否人物追思遐忆，海阔天空，无所不至，而且娓娓动听，似无夯尽。若从性质上说，插笔大致有两种，一是讽刺性的，二是抒情的。前者多涉及时事，这给长诗以相当浓烈的现实主义成分；后者则多直抒胸臆，比如或回忆儿时的故乡，或倾吐去国的思，或哦吟大自然的神奇，或高歌往古的遗迹，更多属于浪漫主义的感慨。这类插笔不唯美妙，而且尤其感人。\n\n三、语言明白晓畅\n\n拜伦总是化繁缛为简约，变抽象为具体；广采口语词汇，亦不拒散文句法，形成白而不俗、谑而不陋，风趣中见隽永、轻松里显力度的风格。读其诗，感觉若泉水涌出，洋洋洒洒，既不装腔作势，更无故弄玄虚，但幽默、婉曲、感伤、愤激、讥嘲等却尽在其中，仿佛信笔而成，无意为之，在滔滔不绝里显出奔放、洒脱与雄辩。\n\n长诗的笔调极富变化：时而缠绵如切切琴诉，时而雄辩如江水滔滔，时而激昂如惊涛拍岸，时而凌厉如峭风肆虐。写黛，是那样的轻灵可爱，“像一只小鸟飞向她年轻的配偶”；写卡萨琳，又是那样轻浮；写土耳其王宫，便极尽铺陈，呈旖旎风光；写海上罹难或战场上的格杀，则充满神情动作，淋漓着血的殷红。整部长诗，既高亢激越又哀婉深沉，犹如交乐一般扣人心弦。\n\n四、“8行3韵体”\n\n在格律上，诗人创造性地借鉴了意大利滑稽史诗所用的“8行3韵体”，即每行5音步，前6行隔行互韵，最后两行韵对押。拜伦驾驭这种诗体到了得心应手的境界，嬉笑怒骂，皆成诗章，而且常常警句迭出，妙语连珠。为了加强讽刺效果或忽庄忽谐，或欲擒故纵，一切都像成竹在胸，挥洒自如；挖苦、奚落、反语、调侃等俯拾即是，而机智、幽默、诙谐、趣也仿佛是随手拈来，无有穷尽。","keywords":"浪漫主义色彩 兼叙兼议 语言明白晓畅“8行3韵体”","note":"世界各国的评论家对《唐璜》的评价都极高，这部以社会讽刺为基调的诗体小说虽未完成，但已因其深刻的思内容、广阔的生活容量和独特的艺术风格，而被歌德称为“绝顶天才之作”，因此我们要对其有所把握。"},{"id":"114","stars":"★★★★","title":"雨果诗歌创作的特征","body":"雨果的诗歌创作贯穿他的一生，他集抒情诗人、讽刺诗人和史诗诗人于一身，取得了超越前人的成就。\n\n一、思想内容\n\n雨果的诗歌反映了他的人道主义和民主主义思想，他的讽刺诗和史诗，批判了倒行逆施的法国统治者，表达了对人类不断走向进步的信心。他的抒情诗并没有停留在抒发个人情感上面，而是表达了其宽广的胸怀和博大的人道主义思想，既有对劳动和劳动者的尊重，也有对大自然魅力的感知，还有对人类苦难的同情和对自由的召唤。\n\n二、诗歌艺术\n\n（一）开拓诗歌领域\n\n在雨果的笔下，什么都可以入诗：无论抒情、讽刺、写景、咏史，还是哲理沉思，他都得心应手，诗歌的表现功能扩大了。在这方面，没有哪一个法国诗人能与他媲美。\n\n（二）富有激情\n\n雨果是一个富有激情的诗人，他的诗句有时如长河滔滔滚滚，不可遏止；有时则短小精悍，十分凝重，气度恢弘。他的\n\n风格豪放阔大，洋洋洒洒。\n\n（三）对照原则的运用\n\n雨果的诗歌创作中，时而是意象的比照，时而是运用相反的词语，时而是在结句出现令人意想不到的变化，戛然止住，对比强烈，效果突出。\n\n（四）大量运用同位语隐喻\n\n雨果在修辞上有一个重要特点，就是大量运用同位语隐喻。例如，“心灵一牝狼”“欧洲一巨人”。这种构词法是将抽象概念与具体意象结合在一起，从而产生新的含义，同象征手法一脉相通。因此，这种手法在哲理诗、史诗和政治讽刺诗中的出现频率，远远大于抒情诗中的运用次数，就不是偶然的。\n\n（五）丰富的想象力\n\n海洋风暴中的惊涛骇浪，阳光的千变万化，伊甸园的瑰丽，东方之夜的辉煌，日耳曼王宫巨大餐厅的神秘、恐怖气氛，都被雨果写得五光十色，绚丽多彩。无生命的东西则具有生命形态。小型史诗的情节写得离奇突兀，对其中的人物则以夸张笔法来表现。\n\n（六）诗歌形式富于变化\n\n雨果的诗歌语言丰富多彩，韵律运用自如，千变万化，诗节形形色色，手法灵活多变，他以牧歌写情诗，以哀歌写悼诗，以颂歌写哲理沉思；以轻灵的诗句描写风流趣事，开象征派先驱魏尔伦的先河；有时，他写出巴那斯派所希求的有造型美的诗歌。雨果丰富多变的诗歌在后世产生了重大影响。","keywords":"人道主义和民主主义 开拓诗歌领域 富有激情 对照原则 同位语隐喻 丰富的想象力 诗歌形式富于变化","note":""},{"id":"115","stars":"★★★★★","title":"结合具体的文学作品内容谈谈雨果作品的浪漫主义特征（25北京师范大学）","body":"一、运用对照手法的大师\n\n善与恶、美与丑既体现在情节上，也体现在人物身上；既体现在人物与人物之间，也体现在人物自身之中。雨果擅长塑造外貌丑、心地美的形象，既给文学画廊增添了崭新的典型，又有美学上的重要意义。这种形式丑与内容美的结合，为后世文学开辟了一条新路。\n\n二、善于塑造下层人物的形象\n\n雨果小说的主人公几乎都是处于社会底层的人，他们朴实善良，酷爱正义，有的虽然改变了社会地位，但是却保持着优异品质。雨果关注劳动者的命运。\n\n三、力图以史诗的气魄和规模去再现社会和历史\n\n《悲惨世界》是一幅历史壁画。《巴黎圣母院》描绘了乞丐王国、宫廷、古建筑，特别是人民起义，也有史诗气氛。《海上劳工》是一篇人与大自然搏斗的史诗。《九三年》是再现法国大革命的史诗。雨果力图在一部小说中再现一个历史时期的社会生活，这是他的小说具有史诗色彩的重要原因。\n\n四、情节的传奇性\n\n雨果小说的许多情节并不建立在史实的基础上，情节大起大落，悲欢离合，出人意表。有时纯粹出于浪漫的想象：爱丝梅拉达和加西莫多两人，死后尸骨一分开就成了灰烬；吉利亚特和巨大的章鱼搏斗并战而胜之。这种奇特的想象是雨果浪漫手法的重要特点之一。\n\n五、注重心理描写\n\n在《笑面人》中，雨果用了大量的心理分析，细致入微地刻画了主人公的高贵品质：纯洁正直，不为美色所动，不受荣华富贵引诱。小说中的女公爵那种既自认高贵，又自卑自贱的变态心理，活生生地写出了一个在百无聊赖、淫邪放荡的环境中产生的宫廷贵妇。在浪漫派小说家中，雨果是运用心理描写较多的一个。\n\n六、赋予无生命事物以生命\n\n雨果善于将无生命或非人的事物，描绘得如同有生命的物体一样神奇、动人心魄、令人惊叹。巴黎圣母院这座巍然壮观的古建筑，仿佛有灵有性，像一个人物那样活动着。《海上劳工》中的雷、电、风浪，都似乎是有生命的东西，章鱼如同吸血鬼一样可怕。《九三年》开篇的大炮，就像肆无忌惮、所向披靡的无形力量，胜过一支强大的舰队，使一艘战船失去了战斗力。\n\n总之，雨果综合运用了种种浪漫手法，并吸收了现实主义的描写方法，在小说创作中另辟蹊径，成就卓著。","keywords":"对照手法 塑造下层人物 再现社会和历史 情节的传奇性 心理描写 赋予无生命事物以生命","note":"雨果被称为浪漫手法的大师，主要是因为他那杰出的浪漫主义小说创作手法。所以，这道题也可以用来回答“果的小说创作有何艺术特征”。这部分内容十分重要，大家要重点掌握。"},{"id":"116","stars":"★★★","title":"请简述《巴黎圣母院》的情节，并结合作品分析《巴黎圣母院》的四个主要人物形象","body":"一、情节\n\n故事发生在1482年，爱丝梅拉达是靠卖艺为生的吉卜赛女郎，她被巴黎圣母院的副主教克洛德看中。愚人节那天，克洛德指使敲钟人加西莫多抢劫少女，幸亏弓箭队队长菲比斯赶到，解救了她。她来到乞丐的聚居地“奇迹王朝”，解救了人格兰古瓦。第二天，加西莫多在广场上受鞭刑，只有爱丝梅拉达把水送到他嘴边。爱丝梅拉达看中菲比斯，他却是逢场作戏。正当两人幽会时，克洛德刺伤了菲比斯。宗教法庭咬定爱丝梅拉达是女巫，驱使黑衣魔鬼杀害菲比斯。她屈打成招，被法庭判处绞刑。当夜，克洛德来到监狱，要带少女逃走，被她拒绝。第二天行刑时，加西莫多劫持法场，把爱丝梅拉达抱治圣母院。法庭扬言要捉拿少女，乞丐们闻讯后，前来营救。国王得知暴动的真正目的后，下令镇压，圣母院门前尸横遍地。克洛德本想胁迫爱丝梅拉达就范，无奈她宁死不从。他把她交给女隐士，而女隐士恰是她失散多年的母亲；母女相认，但亲最终因救女儿而身亡。克洛德正得意地观看处死爱丝梅拉达时，被加西莫多从塔楼推了下去。后来，人们在墓窟里发现了两具尸体，一具是吉卜赛女郎，另一具是个畸形人。\n\n二、人物形象\n\n（一）爱丝梅拉达\n\n爱丝梅拉达是《巴黎圣母院》的中心人物。雨果采用了多角恋爱的描写方式：克洛德副主教和敲钟人加西莫多都爱上了这个吉卜赛女郎，弓箭队队长菲比斯也对她颇感兴趣，诗人格兰古瓦一心想成为她名副其实的丈夫。小说的几个主要人物都围绕着这个圆心旋转。但实际上，爱情描写在小说中只起着穿针引线的作用，小说描写爱丝梅拉达的经历和悲剧则是主线。\n\n爱丝梅拉达是作者理想中“美”的化身。她既有美丽动人的容貌，又有纯洁无邪的心灵和诚挚善良的品德，体现了外貌美和心灵美的和谐统一。她是一个纯真、善良、富有同情心又乐于助人的女孩。当失意落魄的诗人格兰古瓦在黑暗中误入了“奇迹王朝”的“圣迹宫”大厅，即将被处死时，爱丝梅拉达不忍心看着这个素不相识的无辜的人死去，表示愿意嫁给他，和他结为名义上的夫妻，并且以“我只爱有能力保护我的男子汉”的爱情观拒绝了他想做真正夫妻的请求；当加西莫多因劫持自己而被绑在广场的转盘上示众，惨遭鞭打，在烈日下口渴难耐时，她不计前嫌、不顾众议，将怀中的水葫芦温柔地送到加西莫多干裂的嘴边，使加西莫多第一次感受到人间的温暖，“有生以来第一次”流泪。\n\n爱丝梅拉达纯洁无邪，热情天真，对爱情充满憧憬。她遇到了自己所爱的人，便不顾一切无怨无悔地爱上了对方。不管这种爱情是否有结果，不管对方是否真的爱自己，甚至明明知道这种爱情不可能有结果，甚至明明知道对方并不真心爱自己，也依然一往情深地爱着对方，依然对这样虚幻的爱情忠贞不渝。正因为她以为世人都像她一样真心实意地待人，所以当菲比斯在巡逻中偶然救了她后，她就爱上了他。正因为她纯洁无邪地追求纯真的爱情和幸福的生活，所以至死都爱着菲比斯，丝毫没有怀疑他会欺骗和背叛自己，还幻想他会再来搭救自己，其天真令人感到心痛惋惜。\n\n（二）克洛德\n\n雨果有意暴露教会同官府的勾结，描写封建统治者以愚昧迷信控制人民的精神。克洛德是教会势力的代表。他道貌岸然过着清苦刻板的生活。实际上，他抵挡不住美色，为了美色甚至不惜施展恶毒阴谋。他派遣自己的义子加西莫多去绑架吉卜赛女郎；他遭到爱丝梅拉达拒绝后，又煽起宗教狂热，散布对波希米亚人的偏见，诬陷爱丝梅拉达是“以巫术害人的女巫”。他经常制造这一类“巫术案”。而实际上，他在自己的房间里大搞“炼金术”，以这种巫术去骗人。他集巫师和黑袍教士一身，是个卑鄙、诡诈、毒似蛇蝎的人物。他多次威逼爱丝梅拉达屈从自己的淫欲，愿望落空后，立即通知官府捉拿她，并暗中操纵法庭，把她判处死刑。他站在巴黎圣母院的高处，得意地观看处死爱丝梅拉达的场面，露出难以觉察的奸笑。雨果正因为突破了传统的观点，才塑造出这样一个有血有肉的形象，写出中世纪教会作为王权支柱的重要作用。\n\n（三）加西莫多\n\n巴黎圣母院的敲钟人加西莫多是个奇特的角色，也是使这部长篇小说具有浪漫色彩的重要人物。加西莫多是当时社会穷苦大众的典型代表。加西莫多从小被父母遗弃在巴黎圣母院门口，他是一个有着“几何形的脸，四面体的鼻子，马蹄形的嘴，参差不齐的牙齿，独眼，耳聋，驼背，难听而忠厚的声音”的畸形儿。加西莫多是被命运所背弃的，他从来就不被人关注，\n\n收养他的克洛德从来不把他当人看，只是把他当作自己的奴隶。就好比当时的法国最底层的人民，他们从来不被世人关注，有的只是无尽的压迫和负担，在这样的压迫和负担下，他们变得扭曲，变得毫无生气。\n\n他爱慕爱丝梅拉达却不敢表达，从来都只能躲在暗处默默关心着她，直到她被送上绞刑架，他再也无法沉默，终于挺身而出救下爱丝梅拉达。爱丝梅拉达是革命者的代表，法国最底层的人民向往革命甚至羡慕革命，可是他们终究不敢革命，他们把自己的命运和法国封建贵族的命运捆绑在一起。当压迫触及了他们的底线时，他们忍无可忍，终于投入到革命的洪流中去，从而改变命运。\n\n加西莫多的人物形象有一个明显的变化：故事开始时，他被克洛德收养，每天负责敲钟。为报恩，他对克洛德言听计从，包括去绑架爱丝梅拉达，似乎根本没有常人的一般感情。在遇到爱丝梅拉达之后，他真诚善良、忠实勇敢的本性被复活了，奋不顾身地去救处于危险中的爱丝梅拉达，并且不图任何回报，与克洛德、菲比斯的人物形象形成了鲜明的对比。\n\n（四）菲比斯\n\n菲比斯的形象与爱丝梅拉达、加西莫多和克洛德相比较而言，显得不是那么丰富多彩。这是一个寻花问柳、喜新厌旧的花花公子。他本来已有未婚妻，遇见活泼多情、窈窕俏丽的爱丝梅拉达，便想逢场做戏。爱丝梅拉达出身低微，他不可能娶她为妻。他的表妹出身名门，又有一笔诱人的嫁妆，这才是他追求的对象。为了骗取爱丝梅拉达的爱情，他把在许多相似情景下说过多少遍的“我爱你，我除了你没有爱过别的人”的情话背诵出来。但爱丝梅拉达因为他被刺而被判死刑之时，他却根本不愿出庭证明她无罪。他的卑劣面目昭然若揭。","keywords":"爱丝梅拉达 中心人物“美”的化身 对爱情充满憧憬 克洛德 教会势力 道貌岸然 加西莫多 穷苦大众 畸形儿 变化 菲比斯 寻花问柳、喜新厌旧","note":"这是闽南师范大学23年的一道真题。《巴黎圣母院》是雨果的重要作品之一，这类名家作品，我们都需要对其情节内容、人物形象有所了解，许多重点院校的题目都是在情节内容的基础上延伸而来的。此外，这部作品也会以名词解释的形式进行考查，大家要留心。"},{"id":"117","stars":"★★★★★","title":"《巴黎圣母院》的浪漫主义手法是如何体现的","body":"《巴黎圣母院》集中体现了雨果的浪漫主义文艺观，其鲜明的浪漫主义特色，主要表现在以下方面：\n\n一、再现中世纪的世俗民情\n\n作者以浓烈的色彩描绘了中世纪特征鲜明和绚丽的城市图景，给读者展现了一个充满绚烂和奇特声响的世界。尤其是对巴黎圣母院的描写堪称“巨大的石头交响乐”。在雨果的笔下，这座美轮美奂的大教堂不仅仅是一座教堂，它既包含着法兰西历史的一页，也是科学史和艺术史的一页，象征着中世纪文明。巴黎圣母院这个庞然大物仿佛一个生命体，俯视着巴黎的历代生活和眼前的悲剧，成为历史和当代生活的见证人。这些描写都极大地增强了小说的浪漫主义色彩。\n\n二、情节复杂、离奇\n\n《巴黎圣母院》情节曲折、复杂、离奇，富有戏剧性，充满了现实生活中不可能有的巧合、夸张和怪诞。如爱丝梅拉达母女重逢、爱丝梅拉达和加西莫多的尸骨一被分开就化为灰尘等。这些曲折多变、紧张生动的情节极大地增强了小说的感染力。\n\n三、美丑对照原则的运用\n\n（一）情节场面对照\n\n雨果安排了两个王朝、两个国王、两个法庭、两种审判的对比。一个是路易十一的封建王朝，另一个是乞丐王朝。巨大的巴士底狱成了国王处理国事的地方。路易十一毕生竭力维护中央集权，又是一个狡猾狠毒的政治家。而乞丐王国则是一个松散的组织，并没有等级森严的官阶，“国王”仅仅是首领而已，他靠江湖义气来号召大伙儿。封建王朝的法庭随心所欲，栽赃陷害，草菅人命。而“奇迹宫廷”的法律是由乞丐、流民自己制定的，目的是为了维护这个区域，不让其他阶层的人擅自闯入。此外，宗教节日的嘈杂纷乱、狂欢的场面与广场上万头换动、争看处决犯人的对比；巴黎圣母院平日肃静庄严的气氛与乞丐们奋力攻打、乱成一片以及加西莫多全力守卫的对比，都造成色彩缤纷、摄人心魄的效果。\n\n（二）人物对照\n\n（1）人物间的对照\n\n①同为正面人物，爱丝梅拉达和加西莫多都有心灵美，但爱丝梅拉达的爱情是盲目的，不能分辨美丑，而加西莫多爱憎分明；在形体上，他们是美与丑的对照，爱丝梅拉达美若天仙，而加西莫多是丑人之王，除了畸形，眼睛上还长了个瘤，因为长年打钟，成了个聋子。\n\n②反面人物的克洛德和菲比斯则有不同的心灵丑，克洛德奸诈狠毒，不能满足自己的私欲，便置对方于死地；而菲比斯快活风流，看重钱财，只关心自己的利益。\n\n③爱丝梅拉达与克洛德又是一对矛盾，纯洁与阴毒是他们相互对照的特征。\n\n④爱丝梅拉达与菲比斯是另一对矛盾，那是纯真与虚假的比照。\n\n⑤加西莫多和克洛德实际上是一仆一主，一个看来头脑简单，只知道服从；另一个威严，一味发号施令。其实，一个善良富有同情心，在紧要关头敢作敢为；另一个恶毒，暗地里制造阴谋诡计。\n\n⑥加西莫多和菲比斯在形体上是一丑一美，加西莫多形体丑而心灵美，菲比斯外貌美而心灵丑。\n\n人物之间的相互对照使得形象特点鲜明。人物之间的关系像有无形的纽带一样联系起来。\n\n（2）人物本身的对照\n\n①爱丝梅拉达天生丽质，热烈单纯，表里一致，是外在美和内在美的结合。\n\n②加西莫多外貌奇丑，而心灵崇高，形成美丑对照。雨果曾指出，这样描写能使渺小变成伟大，畸形变成美好。\n\n③克洛德外表严峻冷漠，内心凶残歹毒，嘴上标榜禁欲主义，心里欲火炎炎。\n\n④菲比斯仪表堂堂，像太阳神一样俊美，可是行为轻浮，灵魂空虚，是所谓愚蠢的美。\n\n人物的自我对照突出了心灵美的价值：内在美与外在美统一固然好，然而最重要的是内在美，即心灵美。心灵美是决定一个人好坏的唯一标准。人物的相互对照与自我对照互为补充，并联合以爱丝梅拉达为中心的诸多对照，从而形成多层次对照网，这显然是雨果塑造人物的独特方法及其艺术魅力所在。","keywords":"再现中世纪的世俗民情 情节复杂离奇 美丑对照原则 情节场面对照 人物对照","note":"《巴黎圣母院》的美丑对照原则可能会单独命题，仅24年就有福建师范大学、浙江工商大学、浙江财经大学等多所院校考查。主要分场景及人物两方面，四个人物除了自身内在与外在的对照，两两对照，六种组合，每种对照都产生出独特的效果，使人物形象更为鲜明，这是作品具有巨大艺术魅力的要点之一。此外，“美丑对照原则”也会考查名词解释，大家可以结合这部分内容灵活应对。"},{"id":"118","stars":"★★★","title":"试分析雨果在《巴黎圣母院》中是如何使用对照原则的（26南京师范大学）","body":"从艺术上看，《巴黎圣母院》有很多奇思异想，都是浪漫想象开放出来的奇葩，雨果在小说中运用的浪漫主义手法，将对照原则运用得出神入化。\n\n一、情节场面的对照\n\n雨果安排了两个王朝、两个国王、两个法庭、两种审判的对比。一个是路易十一的封建王朝，另一个是乞丐王朝。\n\n巨大的巴士底狱成了国王处理国事的地方。路易十一毕生竭力维护中央集权，又是一个狡猾狠毒的政治家。而乞丐王国则是一个松散的组织，并没有等级森严的官阶，“国王”仅仅是首领而已，他靠江湖义气来号召大伙儿。封建王朝的法庭随心所欲，栽赃陷害，草菅人命。法庭明知菲比斯活着，客店老板关于银币变枯叶的证词并不可信，但仍诬陷爱丝梅拉达为女巫；对加西莫多的审讯也是这样，法官是聋子，加西莫多也是聋子，聋子审问聋子，弄得满堂哄笑，而“奇迹宫廷”的法律是由乞丐、流民自己制定的，目的是为了维护这个区域，不让其他阶层的人擅自入。\n\n此外，宗教节日的嘈杂纷乱、狂欢的场面与广场上万头攒动、争看处决犯人的对比；巴黎圣母院平日肃静庄严的气氛与乞丐们奋力攻打、乱成一片以及加西莫多全力守卫的对比，都造成色彩缤纷、摄人心魄的效果。\n\n二、人物的对照\n\n人物的对照是小说对照艺术的精髓，《巴黎圣母院》中人物的对照，既有人物之间的对照，又有人物本身的对照。\n\n（一）人物之间的对照\n\n同为正面人物，爱丝梅拉达和加西莫多都有心灵美，但爱丝梅拉达的爱情是盲目的，不能分辨美丑，而加西莫多爱憎分明；在形体上，他们是美与丑的对照，爱丝梅拉达美若天仙，而加西莫多是丑人之王，除了畸形，眼睛上还长了个瘤，因为长年打钟，成了个聋子。\n\n反面人物的克洛德和菲比斯则有不同的心灵丑，克洛德奸诈狠毒，不能满足自己的私欲，便置对方于死地，而菲比斯快活风流，看重钱财，只关心自己的利益。\n\n爱丝梅拉达与克洛德又是一对矛盾，纯洁与阴毒是他们的相互对照特征；爱丝梅拉达与菲比斯是另一对矛盾，那是纯真与虚假的比照。\n\n加西莫多和克洛德实际上是一仆一主，一个看来头脑简单，只知道服从；另一个威严，一味发号施令。其实，一个善良，富有同情心，在紧要关头敢作敢为；另一个恶毒，暗地里制造阴谋诡计。\n\n加西莫多和菲比斯在形体上是一丑一美，加西莫多形体丑而心灵美，菲比斯外貌美而心灵丑。人物之间的相互对照使得形象特点鲜明。人物之间的关系像有无形的纽带联系起来。\n\n（二）人物本身的对照\n\n雨果的人物对照还应用到人物本身之中。\n\n爱丝梅拉达天生丽质，热烈单纯，表里一致，是外在美和内在美的结合。加西莫多外貌奇丑，而心灵崇高，形成美丑对照。克洛德外表严峻冷漠，内心凶残歹毒，嘴上标榜禁欲主义，心里欲火炎炎。菲比斯仪表堂堂，像太阳神一样俊美，可是行为轻浮，灵魂空虚，是所谓愚蠢的美。\n\n人物的自我对照突出了心灵美的价值：内在美与外在美统一固然好，然而最重要的是内在美，即心灵美。心灵美是决定一个人好坏的唯一标准。\n\n人物的相互对照与自我对照互为补充，并联合以爱丝梅拉达为中心的诸多对照，从而形成多层次对照网，这显然是雨果塑造人物的独特方法及其艺术魅力所在。","keywords":"情节场面的对照 两个王朝 两个国王 两个法庭 两种审判 人物的对照 人物之间 人物本身","note":"这道题相对来说就比较基础了，回答这道题，主要是需要对《巴黎圣母院》这部作品有着比较深入的认识，并且对对照原则有较为深入的了解。在进行答题时，主要是将作品中比较庞杂的内容给有条理地梳理清楚。大家在作答类似的题目时，答题框架一定要清晰。"},{"id":"119","stars":"★★★★★","title":"《悲惨世界》的艺术特征","body":"一、现实主义和浪漫主义相结合\n\n（一）浪漫主义\n\n小说独特的人物、戏剧化的情节无不充满了浪漫主义的传奇色彩和理想光辉。\n\n（1）人物理想化。贫穷的苦役犯冉·阿让一跃成为蒙特漪市的企业主和市长；显然，冉阿让这一人物是高度理想化即“观念化”的，作者为了通过他来体现人道主义的精神力量，不断赋予其诸多异于常人的非凡举动，他无所不包的宽恕、毫无私心杂念的爱心，使其超凡脱俗成为具有人道主义“神格”的人物。\n\n（2）细节和场景的描写充斥着夸张与巧合。例如冉·阿让攀上战舰极高的横杆去救一个水手而自己跳入海中逃走；被警察追捕得走投无路竟能抱着珂赛特翻高墙进入修道院，而碰到的人又恰好是受过他恩惠的割风伯伯，等等。\n\n（二）现实主义\n\n（1）史诗般的规模。《悲惨世界》艺术世界的历史经纬，上限可上溯到福来主教曾经历的1793年大革命高潮的年代，卷末一直延伸到马吕斯所参加的1832年巴黎民众起义。\n\n（2）广阔的社会生活。小说展现了近半个世纪历史长卷中法国社会的广阔生活画面：外省偏僻的小城，滨海的新兴工业城镇，可怕的法庭，黑暗的监狱，巴黎悲惨的贫民窟，阴暗的修道院，恐怖的坟场，郊区寒碜的客店，保王派的沙龙，资产阶级的家庭，大学生聚集的拉丁区，惨烈绝伦的滑铁卢战场，藏污纳垢的下水道.....\n\n（3）以社会底层受苦受难的穷人为描写对象。作者在全部历史景象与过程的中心，安置了一个触目惊心的社会现实，即下层人民的悲惨命运。《悲惨世界》的几个主要人物都是生活在死亡线上的人物，他们代表了千千万万的穷人。雨果的写作主旨就是要为这些穷人鸣不平。\n\n二、兼具政论与抒情风格\n\n（一）雨果力图把自己的作品变成社会讲坛，因此不断亲自出来表达对一些问题的看法，力图在感情上影响读者，使之接受自己的观点。这种政论风格，不仅体现为人物与情节的观念化，而且也直接表现为或是由作者直接出场或是由作者借人物之口所发表的大量议论中。例如，关于作者所关心的“法律”问题、“贫穷”问题以及“革命”问题等，小说中都有直接表态。\n\n（二）小说的抒情风格既来自于作者不时喷涌而出的大段大段的直抒胸臆，也来自于其作为浪漫派作家所固有的高昂、激越、热情的语言。\n\n人心是雨果着力描绘的对象。如冉·阿让洗心革面以后，遇到的第一个考验是如何对待尚马蒂厄案件。当他从沙威口中得知尚马蒂厄要为他顶替罪名时，思想中展开了一场激烈斗争。一系列心理描写，把冉·阿让的矛盾心理刻画得淋漓尽致。\n\n四、对照艺术\n\n《悲惨世界》中的对照超越了《巴黎圣母院》中的美丑对照，是以不同类型的性格、经历、精神特点为对照物，使对照艺术得到更充分的运用，人物形象显得更鲜明。\n\n（一）冉·阿让与沙威是一对矛盾，互为对照。一个虽是罪犯，但要改恶从善，另一个虽是警察，但执法过严；一个不断做善事，却屡屡碰壁，另一个不断做错事，也未见得步步高升；一个平安死去，另一个以自杀告终。\n\n（二）冉·阿让与福来主教是彼此相关的另一对。冉·阿让由恶到善，而福来主教是善的化身；后者是善的本源，前者是善的扩散。\n\n（三）沙威与泰纳迪埃又是互有关联的另一对。沙威是一条看门狗，不管对什么人都乱吠一气，不过本质上并不能说坏到极点；而泰纳迪埃是恶的化身，狡猾、阴险、恶毒、工于心计（他的妻子与他构成夫唱妻随的又一对，形体上一胖一瘦，一大一小，精神上是同样歹毒）。\n\n（四）芳汀和柯赛特的身世形成对照，芳汀悲惨，而柯赛特是先苦后甜，她享受到母亲得不到的幸福。\n\n（五）马里于斯和吉尔诺曼老人是一对，他们都是犟脾气，一个年轻气盛，决不让步，爱情热烈专一；另一个年老体衰，出于爱后代不得不让步，性格轻薄，爱寻花问柳。\n\n五、语言高昂热情\n\n小说的语言高昂、激动和热情，经常运用多义词，富有隐喻性，有的句子类似于成语格言。这些特点使这部小说的叙述具有一种崇高的史诗般的风格。","keywords":"现实主义和浪漫主义相结合 政论与抒情 心理描写 对照艺术 语言高昂","note":"《悲惨世界》是雨果最重要的一部作品，也是19世纪浪漫主义文学中最重要的一部作品。它最大的特征是浪漫主义与现实主义相结合，这一点十分重要。同时，《悲惨世界》的史诗笔法、对照艺术、心理描写这些内容都有可能单独出题，大家仔细掌握。"},{"id":"120","stars":"★★★","title":"《基督山伯爵》的艺术特征","body":"《基督山伯爵》的艺术特点代表了优秀通俗小说的成就，主要包括以下内容：\n\n一、情节曲折，安排合理\n\n《基督山伯爵》是情节曲折、波澜起伏的成功小说之一，小说开头就吸引了读者的目光。其小说中富有戏剧性的开场，为下文作好了铺垫。后来主人公在黑牢中的描写，更加具有特色，是全小说中最精彩的情节之一，再后来，他居然通过与死人的偷梁换柱方法，逃出了黑牢，这也是作者的奇妙构思的一部分，这为其后来的崛起，并成为亿万富翁奠定了基础。小说的最主要部分是复仇，大仲马在《基督山伯爵》中，三次复仇写得各不相同，并且富有乐趣，将三个不同仇人的职业与其罪恶性质互相关联起来，使复仇的故事情节不过于呆板，让读者在富有变化的过程中发现意想不到的故事结果。大仲马还在故事中穿入了不少的惊险场面，让故事情节迂回曲折，奇峰突起，富有大起大落的艺术特色。\n\n二、光怪陆离，熔于一炉\n\n小说触及的生活面极其广阔，上自路易十八的宫廷、上流社会的灯红酒绿，下至监狱的阴森可怕和犯人的阴暗心理、强盗的仗义疏财，也有市民的清贫生活。五光十色的社会生活和斑斓夺目的地方色彩、异国情调有机地结合在一起，广阔的视野和浪漫主义的艺术趣味水乳交融，加强了小说的传奇性。全景式的描写以丰富多彩的色调作为点缀，能满足不同阶层读者的兴趣。\n\n三、结构完整，一气呵成\n\n《基督山伯爵》基本上分为两大部分：前面四分之一的篇幅写主人公被陷害的经过，后面四分之三写主人公如何复仇。第一部分是楔子；复仇虽然分成三条线索，但彼此交叉进行，有条不紊，每条线索保持一定的独立性，最后才汇合到一起，环环相扣，步步深入。次要情节的插入别具匠心。主次情节相得益彰使小说酣畅自如、首尾贯一。\n\n四、善写对话，戏剧性强\n\n全书十分之八的篇幅都由对话写成。人物的思想和性格往往通过对话来表现。与这种对话体相配合的，是大仲马采用了短段落的写法，有时一句话就是一段，小说中几乎找不到超过一个印刷页的段落。短段落能起到便于阅读、行文流畅的效果，\n\n这种写法已为金庸、古龙、梁羽生等当代通俗小说家所承袭，可见是行之有效的叙述手段。\n\n小说中的对话都写得像戏剧性场面，充满矛盾冲突。对话近乎日常生活的口语，通俗晓畅，而激烈动荡的感情和尖锐曲折的冲突是对现实生活的提炼和概括，使内容变得复杂而生动。小说对这两方面的成功结合也堪称范例。\n\n五、形象鲜明，个性突出\n\n大仲马能从时代的变迁去刻画人物的变化。唐泰斯原本是一个正直单纯的水手，对世事的复杂一无所知。他获得财富以后阅历渐深，变得老谋深算，失去单纯，而且铁面无情，手段凶狠。唐格拉尔是阴骘之徒，费尔南是无赖小人；唐格拉尔当上银行家以后，他的不择手段、唯利是图又得到充分表露；而费尔南的背信弃义、卑鄙无耻进一步发展。他们的变化反映了七月王朝精华人物的发家过程，具有一定的典型意义。","keywords":"情节曲折 光怪陆离 结构完整 善写对话 戏剧性强 形象鲜明","note":"《基督山伯爵》是一部具有叙事性质的艺术杰作，它融合了浪漫的色彩，具有传奇新颖的叙述元素，是一部离奇曲折、充满叙述艺术魅力的作品，体现了当时优秀通俗小说的艺术成就，云南师范大学在2023年就对这部作品进行过考查，需要大家有所掌握。"},{"id":"121","stars":"★★★","title":"海涅的诗歌创作类型及风格","body":"一般认为，海涅是继歌德之后德国最重要的诗人。他的诗歌创作主要有三大类，即抒情诗、政治诗和讽刺诗。\n\n一、抒情诗\n\n从总体上说，海涅的早期创作以抒情诗为主，内容大多是抒写爱情的欢乐和痛苦，明显地带有浪漫主义色彩。但是，即便在早期，海涅的抒情诗也已表现出与一般浪漫派诗人不同的个性与倾向。那就是他不像一般的浪漫派诗人那样往往以诗的美来掩盖现实生活的丑恶，或者沉湎于浪漫的梦境之中而逃避严酷的现实。相反，海涅的抒情诗常常是使用他所谓的“浪漫主义嘲讽”手法，使梦境破灭，而在梦境的废墟上，他让人分明看到现实生活的丑恶。这样反过来哀叹梦醒时的空虚和惆怅，艺术效果更胜于一般的浪漫主义抒情诗。\n\n二、政治诗和讽刺诗\n\n海涅的中期和晚期创作以政治诗和讽刺诗为主。实际上，他的中、晚期创作是他早期创作的合理延伸，因为在他的早期创作中已经表现出了他对现实尤其是对当时德国落后的政治现状的嘲讽和批判态度。\n\n（一）政治诗\n\n海涅的政治诗有别于当时那些只有革命口号而无任何诗意的所谓“倾向诗”，而是以诗意浓郁、内容新颖并符合时代精神见长，常常是用诗歌形式表现新的思想，把政治观点和美学思想有机地结合在一起，因此他的政治诗既有强烈的战斗性，又有高度的艺术性。譬如，著名的《西里西亚纺织工人之歌》就是这样一首被恩格斯称为“宣传社会主义”的政治诗。\n\n（二）讽刺诗\n\n海涅的讽刺诗，大体有两类：一类是普通的讽刺诗，大多讽刺德国小市民的庸俗生活，如《阐明》和长诗《阿塔特罗尔，一个仲夏夜的梦》等；一类是政治讽刺诗，大多是嘲讽和鞭笞当时的政界要人和德国政府的昏庸，如讽刺普鲁士国王威廉·弗里德里希四世的《中国皇帝》等。海涅的讽刺诗和他的政治诗一样，是政治与艺术的巧妙结合，可以说是19世纪德国讽刺艺术中的精品。","keywords":"抒情诗 浪漫主义嘲讽 政治诗 强烈的战斗性 高度的艺术性 讽刺诗 普通的讽刺诗 政治讽刺诗","note":"纵观海涅的诗歌创作，不论是前期还是中晚期，不论是抒情诗还是政治诗、讽刺诗，都显示出对当时德国政治的嘲讽态度，这是其诗歌创作的总体特征，作答时可以结合作家的具体作品分析。"},{"id":"122","stars":"★★★","title":"《德国，一个冬天的童话》的思想内容与艺术特征","body":"一、思想内容\n\n海涅一方面看到了祖国河山之美，另一方面又目睹了丑恶的社会现实。因此其创作长诗的意图就是要制作“新的歌”来启发人们，激励人们在德国建设起人间天堂。但是，要建设天堂，必须先摧毁地狱，因此诗人在长诗中主要还是暴露和批判他所见到的“现实的”德国，这包括以下几方面内容：\n\n（一）对德国检查制度的讽刺。诗人一入国境，就遇到税关对他的行李的严密检查。这种检查并非要查什么走私品，而是当时德国的一种压迫人的制度，即竭力封锁外来进步思想的传入。诗人觉得这种封锁新思想的检查制度既恶毒又愚蠢得可\n\n怜，在诗中活画出那些“可怜虫”的愚蠢，同时也揭露了德国封建制度对进步思想的恐惧。\n\n（二）对德国封建制度的憎恨。在长诗中，诗人对德国当时的君主独裁制度喷射出仇恨的怒火。譬如，在第3首诗《无聊的亚琛》里，他对亚琛驿舍招牌上的普鲁士政府的大鹰国徽表示了极度的憎恶。封建德国的落后，使诗人深以为耻，而他所向往的，是像法国那样的共和制度。\n\n（三）对基督教会的批判。在第4首诗《科隆大教堂》里，诗人对教会大胆露骨地嘲讽。因为从中世纪起，教会就是封建制度的精神支柱，而对于像当时的海涅这样一个充满激进思想的人来说，教会无疑是一座“精神的巴士底监狱”。\n\n（四）对社会革命的预言。在黑暗丑恶的现实中，海涅预感到了大革命的征兆。海涅生动地把当时德国36个诸侯国比喻成36个粪坑正在发出熏天的臭气，与德国将来的气息相对照，海涅认定，只有轰轰烈烈的社会大革命才能荡涤这36个坑里的恶臭，才能有新生的、朝气蓬勃的德国。\n\n总的来说，《德国，一个冬天的童话》充分显示了海涅在40年代的激进思想：他对旧德国深恶痛绝，满心希望一个德国的诞生。\n\n二、艺术特征\n\n（一）浪漫主义和现实主义的高度结合\n\n诗人采用了多种多样的表现手法，把真实的生活图景和浪漫的幻想境界交织起来，让历史传统和时代精神作鲜明对比。诗人笔下的关税检查人员、亚琛的普鲁士军人、汉堡的市民以及他们生活的场所，都是逼真的、典型的，这显然是现实主的笔墨。\n\n与此同时，诗人又描绘了许多象征性的图景，使长诗出现了想象的梦幻的世界与人物，如“地上天国”“明登古堡”“物鹅王女”“汉堡女神”“听莱茵河呻吟”“与红胡子大帝争论”，等等，这显然是浪漫主义的手法。\n\n诗人有意给封建的“德国”现实涂上“冬天的童话”的“冷色”。“冬天”象征着“严寒”“冷酷”“死气沉沉”的德国，“童话”指那些不应当存在而已经发生的荒诞故事。诗人看到的是“真实的现实”，同时也是一个“冬天的童话”。这些统一起来的图画，让人们看透封建德国畸形现实的虚伪本质，从而向往德国未来的真正美好的现实。\n\n（二）高超的讽刺才能\n\n长诗浓厚的战斗色彩，很大程度上得益于海涅的讽刺艺术。诗人交替使用素描式的讽刺和漫画式的讽刺，这些讽刺都不曾离开生活的真实。素描式的讽刺通过不加夸饰的真实的描写来表现社会实质，如诗人对普鲁士“关税同盟”与书报检查度的讽刺，尤其是诗人借一位旅客之口“表彰”反动事物，讽刺非常深刻。漫画式的讽刺通过夸张描写，表达诗人对丑恶事物的憎恶，如汉堡市民的漫画像，讽刺得入木三分，令人看了作呕。\n\n（三）以游记为结构形式\n\n长诗采用游记形式作为全诗的结构形式，这样适合于表现时间和地点各不相同的各种事物，而且比较灵活，合则为一体，分则为各首小诗，这种形式的诗歌在其他诗人的作品中是罕见的。\n\n（四）抒情和叙事相结合\n\n长诗将叙事和抒情巧妙地结合，有时甚至夹叙夹议，这种见物兴感的写法有助于揭露现实。\n\n（五）直接对话形式\n\n长诗多处采用直接对话的方式，有些诗如《红胡子的马匹》和《我们也能解放自己》等是由对话构成的，使诗句生动泼。","keywords":"思想内容 检查制度 封建制度 基督教会 社会革命 艺术特征 浪漫主义和现实主义结合 讽刺 游记结构 抒和叙事相结合 对话","note":"在海涅的所有作品中，集其抒情和政治讽刺艺术于一身的，就是这篇最著名的长诗《德国-一个冬天的童话》然而这个美好的名字只是表象，整首诗歌都是在抨击德国的政治体制，国家统治如同冬天般寒冷。这部长诗，是海涅一生作的顶峰，也是一部标志着德国浪漫主义新发展，同时又预示着德国现实主义即将登台的里程碑著作。因此这首长诗艺术特征第一点是需要大家重点掌握的内容。"},{"id":"123","stars":"★★★★","title":"普希金诗歌创作的艺术特征","body":"一、真诚，自然、朴素而优雅\n\n首先是真诚。别林斯基指出，普希金的诗的特征之一，那使他和以前的诗派严格区别的东西，是他的诚恳。所以别林\n\n基特别提出“真诚”这一概念来评论普希金的诗歌。\n\n与真诚密切相联系，普希金诗歌的另一个显著特点就是自然、朴素而优雅。普希金真正地把它们统一在一起，这就是普希金的高超之处。普希金的秘诀在于，他的情感“不仅是人的情感，而且是作为艺术家的人的情感”，这样，诗的品位在很大程度上就取决于艺术家情感和思想的品位了，或者说取决于诗人的思想和艺术的素质了。别林斯基认为：“在这一方面，可以把普希金的诗比作因感情和思想而变得炯炯有神的眼睛的美，如果您夺去使这双眼睛变得炯炯有神的感情和思想，它们只能是美丽的眼睛，却不再是神奇和秀美的眼睛了。”\n\n二、简洁和独特的音韵美\n\n普希金在综合前辈诗人创作成果的基础上，形成了自己独特的音韵美。他的诗从一开始就表现出异乎寻常的简练。这也许是和他的自然朴素之风相联系的。\n\n三、明朗的忧郁\n\n普希金的诗歌在情调和风格上表现出来的又一特点是一种忧郁，这是一种明朗的忧郁，一种“深刻而又明亮的悲哀”。普希金的忧郁，自然与他无时不在思考相联系。他的忧郁与哈姆莱特式的忧郁或拜伦式的忧郁不无相通之处，也就是说是一种社会性的忧郁。这里所说的优郁主要是一种艺术风格，一种诗意的情调，它虽然与忧愁、哀伤乃至悲惨的生活内容相关，但它仍然主要是一种美学的或者说是一种审美的效果。换句话说，生活中的忧郁在普希金情感的熔炉中经受冶炼以后成为一种美，它远高于那种具体的、世俗的忧愁和哀伤，而且，它唤起的也不仅仅是忧郁，而是思索、力量和美感：“我忧郁而轻快，我的哀愁是明亮的。”","keywords":"真诚 自然、朴素而优雅 简洁 独特的音韵美 明朗的忧郁","note":"普希金在俄罗斯文学史上具有重要的地位，他既是俄罗斯浪漫主义的杰出代表，又是俄罗斯现实主义的奠基人，他的诗歌创作，对后来许多俄罗斯作家产生了重要影响，这部分内容，要仔细掌握。"},{"id":"124","stars":"★★★","title":"谈谈你对奥涅金形象的认识","body":"一、19世纪俄罗斯患上“时代的忧郁病”的贵族青年的典型\n\n（一）“时代的忧郁病”\n\n作为一部现实主义作品，《叶甫盖尼·奥涅金》再现了19世纪20年代俄罗斯广阔的社会生活，别林斯基曾称它为“俄罗斯生活的百科全书”。20年代，正是俄罗斯解放运动第一代战士-贵族革命家成长的时期，同时也是十二月党人革命的酝酿、爆发和失败的时期。当时，俄罗斯取得了1812年反拿破仑入侵战争的胜利，民族意识普遍觉醒，广大人民特别是农民对专制农奴制的不满和反抗情绪日益高涨。在这种情势下，贵族青年中的一部分人，感到时代的风暴即将来临，不甘心和贵族阶级一道灭亡，但阶级的局限又使他们没有勇气与能力去参加革命斗争，也看不见社会发展的前景，因此终日彷徨苦闷、焦躁不安，即染上了当时人们所说的“时代的忧郁病”。\n\n（二）奥涅金的忧郁病\n\n普希金笔下的奥涅金正是患上“时代的忧郁病”的贵族青年典型。上流社会的花天酒地的生活，虽然使这个花花公子沉湎一时，但他终于也厌倦起来，害上了“时代的忧郁病”。\n\n（1）厌恶旧文化并不采取行动，认同新文化也无力去实践\n\n奥涅金毕竟还是受到了时代精神的感染和进步思潮的影响，但是，奥涅金在农村进行的改革，并不能说明他真想为人民做点什么，那不过是一时心血来潮而已，事实上他很快就抛开了这件事。\n\n（2）在对待爱情上奥涅金是个自欺欺人者\n\n奥涅金拒绝达吉雅娜的爱情，并不是因为他真的有什么明确的理想和追求，只不过是他厌倦了这种多情表白。他低估了达吉雅娜的真诚，他甚至也不明白在爱情中应该追求什么。在奥涅金回到彼得堡后，他又爱上了达吉雅娜，身为人妇的达吉雅娜拒绝了他。\n\n（3）奥涅金是个利己主义者\n\n奥涅金鄙视上流社会，却又不得不服从它的陈规陋习。他没有勇气向朋友承认自己的错误，他本想拒绝决斗，但又怕人嘲笑和诽谤，最终杀死了好朋友连斯基。\n\n普希金通过奥涅金的形象提出了当时最重大的社会问题之一，即贵族知识分子脱离人民的问题。\n\n二、具有极大的时代和民族特征的概括性\n\n奥涅金的性格是真实的，他不仅代表了贵族知识分子的苦闷与彷徨，忧郁、无能为力，而且反映了整个时代的情绪，真\n\n实地反映了人民的生活和命运，所以这一文学形象具有极大的时代和民族特征的概括性。\n\n在时代矛盾日益尖锐、社会问题层出不穷的历史大背景下，奥涅金在社会上找不到自己的位置，苦苦寻求俄罗斯的出路，但是不知道该做什么，怎么做，只会浑浑噩噩地混日子。赫尔岑曾说过：“像奥涅金这样的人在俄罗斯每走一步路都会碰见他。”\n\n三、“多余人”的鼻祖\n\n在俄罗斯文学中，所谓“多余人”是一个人物系列，杜勃罗留波夫曾指出，“多余人”是“我们土生的民族的典型，所以我们那些严肃的艺术家，没有一个是能够避开这种典型的”。而奥涅金在某种意义上可以说是“多余人”的鼻祖，在后来的文学作品中相继出现的“多余人”的典型，诸如莱蒙托夫笔下的毕巧林、屠格涅夫笔下的罗亭、冈察洛夫笔下的奥勃洛摩☒夫等，他们身上无一不或多或少有着奥涅金的影子。“多余人”形象系列是19世纪俄罗斯文学独有的成就，同时也是19世纪俄罗斯文学的最高成就之一。","keywords":"时代的忧郁病 贵族知识分子脱离人民 极大的概括性“多余人”的鼻祖","note":"辽宁大学在24年对奥涅金形象的时代意义进行了考查。普希金笔下奥涅金的形象，反映了当时贵族知识分子脱离人民的问题，也是“多余人”这个系列形象的鼻祖。此外，要注意奥涅金与毕巧林、罗亭等形象的比较，相关内容可参考孙保国《析“多余人”奥涅金和毕巧林的形象特质》、聂杉杉《浪漫主义文学中“多余人”的形象塑造分析》，资料可在李凡文学正版群中查看。"},{"id":"125","stars":"★★★","title":"谈谈你对达吉雅娜形象的认识","body":"诗体长篇小说《叶甫盖尼·奥涅金》的女主人公达吉雅娜是一个拥有“俄罗斯灵魂”的迷人的艺术形象。作为小说的女主人公，达吉雅娜的形象在许多方面与男主人公奥涅金的形象形成鲜明的对照，同时他们又相互烘托，相互解释。这个形象，主要有以下特征：\n\n一、与人民深厚的联系\n\n如果说普希金在奥涅金身上着重突出的是他与人民的脱离，那么在达吉雅娜身上，诗人着意表现的是她与人民深厚的联系。诗人给女主人公取了一个平民化的名字-达吉雅娜，这个在当年丫环们身上才使用的名字便暗示出她生长于远离城市的乡村和淳朴的人民之中。她后期嫁给一个将军，学习、融入、感受上流社会的经历也体现了她扎根于人民，与人民联系深厚。\n\n二、受当时社会思潮影响\n\n普希金描写了当时席卷欧洲和俄罗斯的社会思潮对达吉雅娜的影响，诗人写到达雅娜最喜欢读理查逊和卢梭的作品，尤其是卢梭的《新爱洛依丝》。普希金描写达吉雅娜在花园里读《新爱洛依丝》这本“危险的书”的情节，与《红楼梦》中林黛玉在花园里读《西厢记》的情节如出一辙，有异曲同工之妙。不过应该指出，诗人仅仅在道德的范畴中，特别是在个性解放这一点上表现了这种影响。这与当时俄罗斯女性无权参与社会活动的地位是相符合的。\n\n三、“圣母”式形象\n\n从安静的乡村少女到刚进入上流社会的忧郁、寡言，再到让所有人瞩目的端庄贵妇，达吉雅娜经历了很多，但是仍然坚持当初那颗纯朴自然的“圣母”心。在达吉雅娜的生活中，大自然始终是她最亲密的朋友，它培育了女主人公真诚、善良的感情，造就了她淳朴、美好的气质。\n\n在达吉雅娜的勇敢表白被奥涅金拒绝时，她独自一人默默地吞咽爱情的巨大伤悲；她“憎恨上流社会的纷乱”，却最终顺从家人的安排嫁给一个陌生的将军，投身于这个自己讨厌的社会；而当她心爱的奥涅金向她表白时，已为人妇的达吉雅娜竭力保持镇静，始终忠诚于自己的丈夫和自己的家庭。这种对自己的行为负责的态度集中体现出她的精神美，而这种精神美是深深植根于人民的土壤之中的。达吉雅娜如圣母一般承受接纳着不幸命运所给予的一切，成为俄国文学人物长廊中令人难以忘怀的女性形象。\n\n达吉雅娜这一优美动人的女性形象对后来许多俄罗斯作家提供了有益的启示，产生了重大的影响，俄罗斯文学中有许多动人的女性形象，在不同程度上都可以说是“脱胎”于达吉雅娜。","keywords":"与人民深厚的联系 真诚、善良 淳朴、美好 受当时社会思潮影响 悲剧性 精神美","note":"达吉雅娜与人民联系深厚，具有真诚、善良的品性和淳朴、美好的气质，展现出了一种精神美。这个带有悲剧性的角色，影响了俄罗斯作家对于女性形象的塑造。相关内容可参考李晶晶《从＜叶甫盖尼·奥涅金＞看达吉雅娜性格特征》、** --- 刘张贺薇《＜叶甫盖尼·奥涅金）达吉雅娜形象分析》，资料可在李凡文学正版群中查看。"},{"id":"126","stars":"★★★★★","title":"谈谈《叶甫盖尼·奥涅金》的艺术特征","body":"一、诗与散文的有机结合\n\n普希金第一个在俄罗斯文学中把诗的抒情性和散文的叙事性有机地结合起来，从而创造出他自己所说的“自由的形式”的“诗体长篇小说”，其中既有浓郁的抒情性，又有对性格的精细的刻画。这是一种全新的独创性的艺术形式，是普希金在艺术形式上对俄罗斯文学的重大贡献。\n\n（一）诗的抒情性。作品中始终贯穿着诗人自己的形象，贯穿着“作者的声音”。作品中出现大量的“抒情插笔”。这些“抒情插笔”，有时是作者对人物的褒贬，有时是对事件和场面的评论，有时是对往事的追忆；有的严肃庄重、富于哲理，有的尖锐激烈、锋芒毕露，有的诙谐幽默、妙趣横生，有的画龙点睛、入木三分。正是这些大量的多角度多层次的“抒情插笔”，扩大了作品的容量，深化了作品的内涵，加强了作品的感染力。\n\n（二）散文的叙事性。《叶甫盖尼·奥涅金》作为一部大型的叙事作品，在再现社会生活的广度和深度上、典型性格的塑造上、环境和场景的描写上都达到了当时俄罗斯文学的最高水平。在诗体长篇小说中，普希金围绕人物性格塑造这一主线，巧妙地穿插上流社会的场景和乡村的风俗画面，这些初看起来仿佛是诗人信手拈来的无意之笔，却包含着真正的艺术家的着意安排和匠心。\n\n二、突出地采用了对比的手法\n\n在人物性格塑造上，《叶甫盖尼·奥涅金》突出地采用了对比的手法，奥涅金和连斯基、达吉雅娜和奥丽嘉在彼此之间的对照中，各自的性格特征被表现得十分鲜明和突出。普希金在这部作品中成功地运用了这种手法，并以深厚的现实主义的力度揭示出性格的社会根源。从这里可以看出普希金对浪漫主义有效的借鉴和利用。\n\n三、典范的俄罗斯文学语言\n\n《叶甫盖尼·奥涅金》在语言上是很有特色的。作为俄罗斯语言和俄罗斯文学的创造者，普希金把诗的精练、含蓄和散文的流畅、朴素天衣无缝地结合起来，从而创造出典范的俄罗斯文学语言，它既是诗的，又是散文的。\n\n四、抑扬顿挫的音步和错落有致的韵律\n\n在这部诗体长篇小说中，除了男女主人公各写的两封信以外，均为用四步抑扬格写成的十四行诗组成的诗节，这种诗节后来被人们称为“奥涅金诗节”。每节诗又可分为四组：前面三组都是四行，最后一组为两行。其韵式为：第一组采用交叉韵，即abab；第二组为连韵，即ccdd；第三组为抱韵，即effe；最后一组为连韵，即gg。抑扬顿挫音步和错落有致的韵律使得“奥涅金诗节”读来既铿锵有力又缠绵悠长，具有一种独特的韵味。","keywords":"诗与散文的有机结合 对比 典范的俄罗斯文学语言 抑扬顿挫的音步 错落有致的韵律","note":"《叶甫盖尼·奥涅金》的艺术特征主要包括形式、手法、语言和格律四个方面，其中最重要的是它那诗与散文有机结合的形式，显示出了强烈的抒情性，这在考查中可能会以“《叶甫盖尼·奥涅金》的抒情性特征”这样的提问方式出现，大家要仔细记忆。"},{"id":"127","stars":"★★★","title":"试析《草叶集》的主题和艺术特点","body":"《草叶集》既是惠特曼自我心灵发展的史诗，又是美利坚民族发展、成长的史诗。《草叶集》的主题与艺术特征，主要包括以下内容：\n\n一、思想主题\n\n（一）自我\n\n诗人笔下的自我，不同于欧洲浪漫主义传统中那种感伤纤弱、自怨自艾的自我，而是一个强健有力，甚至有些粗鲁的自我。在诗人看来，健康而完美的自我应当是心灵与肉体、头脑与感官和谐发展的自我，而不应该是感伤纤弱、沉思冥想的自我。健康的自我呼吸着现实的空气，立足于现实的土壤，是个实干家。他不怨天尤人，而是自主、自强，自己决定自己的命运，自己开辟自己的道路，自己承担自己的责任。\n\n从自我出发，必然会涉及自我与他我的关系。在惠特曼看来，每一个自我都息息相通，就像无穷无尽地旋转于苍穹中的星球，所以，歌颂自我也就是歌颂他我，发现自我，描写自我，也就是发现美国，描绘美国。越是充分地探索自己的灵魂，探索自己的存在，也就越充分地了解了美国，表达了美利坚的灵魂。诗人自觉地担当起美国的预言家的角色。这样，“小我”\n\n就扩展为大我，自我意识就扩大为民族意识、宇宙意识，自我形象与美利坚民族的形象，与宇宙中生长繁殖的一切有生之物就合而为一了。\n\n（二）创造\n\n在自我观照中，诗人看到了宇宙中生生不息的创造力之伟大，也看到了人在宇宙中所占的位置，那就是不断地以自己的劳作加入宇宙的生命大循环。惠特曼比一般浪漫主义者的高明之处在于，他不但歌颂蛮荒自然，也歌颂经过人类创造的二度自然：城市、电报、印刷机、海底电缆、木屋、斧头、书籍、十字架、偶像、书稿、钱币、邮局等等。总之，凡是人所创造的一切，在诗人看来，都是美的，正是劳作和创造使人变得神圣。\n\n（二）民主\n\n诗人出身平民，没有一般贵族浪漫主义者的孤傲之气，生活在这片由不同肤色、种族、背景的移民共同开发的新大陆上，诗人感到无比的欢欣。诗人把民主称为“我的爱人”，愿意献出“同志间的男子汉的爱”，为民主服务。诗人热情讴歌各种职业的劳动者开拓新大陆、建立城市、创造新世界的伟大业绩；歌颂起茧的双手、流汗的身体，以及男人的生殖力。\n\n民主不是赐予的，而是争得的，为了它，有时需要付出血的代价。在南北战争爆发后写的《桴鼓集》中，诗人歌颂了那些为民主而献身的美利坚的普通人民，诗人的民主主义的“同志式的爱”还从美国扩展到欧洲。晚年，诗人的意识由美国、欧洲扩展到宇宙意识的边缘。早期诗歌中较为潜沉的意象到晚年逐渐凸显，成为主宰。诗人从“滚滚的人海中”，从“永恒摇荡着的摇篮里”，听到了“神圣的死的低语”，永远的时间与空间的神秘运载着诗人超越生死的界限。\n\n二、艺术特征\n\n（一）富于象征性\n\n惠特曼有意选择了“草叶”这一既简单又复杂的意象作为他的诗集的总名。草叶是生命力的象征，不论高山平地，不论地方宽窄，它都能扎根、生长，草叶又是发展的象征，它自发性地生长、繁殖，不需要人们的照料、栽培。《草叶集》本身就是自发性生长的一个极好的例子。最后，草叶又是民主的象征，民主的理想和草叶的意象是合二为一的。在诗人眼中，遍布新大陆的草叶与星球的运行同样重要、同样神圣；正如在社会生活中，黑人与白人、男人与女人、总统与平民没有高下、卑贱之分一样。\n\n（二）风格多样\n\n《草叶集》的风格正像当时新生的美利坚民族一样，具有丰富的多样性。诗人在赞美普通人的生活和价值观时，显得大胆、直率，甚至粗鲁；而在讴歌民主主义理想时，又显得高亢有力，充满鼓动家的热情。当主题涉及死亡、宇宙的奥秘时，诗人的笔调又变得轻柔哀怨，如泣如诉，令人难以忘怀。\n\n（三）自由体诗的新形式\n\n《草叶集》在艺术形式上所做的革命性贡献是大胆打破了传统诗歌格律，创造了后来被称为自由体诗的新形式。诗人认为，民主之声不能受传统的诗歌形式的束缚。拖长的、流畅的诗行本身就体现了贯穿全诗的自由主题。把俚语土话引进诗歌这个艺术殿堂，也就等于为普通百姓争得了艺术创作的权利。\n\n（四）结构严谨\n\n《草叶集》的总体结构是严谨的，有章法可寻的。评论家们分析说，惠特曼最喜欢运用的是“目录诗”和“平行句”。“目录诗”类似我国汉赋中的铺陈手法。诗人以一种新生儿的眼光，注视着展开在他面前的生气勃勃的世界，怀着对生活的爱，把他所见所闻的一切事物都囊括进诗歌中。与此同时，诗人又用了大量的平行句，词类和思想都依照平行的原则，遵循相同的秩序，所以读者虽然会觉得目不暇接，但心中并不感到杂乱无章，而能在一连串纷呈的形象和意念中感触到主题的脉络，所有这些，都给表面上看来漫无章法的自由诗以一种内在的节奏感。","keywords":"思想主题 自我 创造 民主 象征 风格多样 自由体诗的新形式 总体结构严谨，有章法可寻","note":"云南师范大学在2023年对相关知识点进行了考查，给出了惠特曼的诗歌问惠特曼的诗歌观念。由于《草叶集》是惠特曼一生中唯-部诗集，所以作家的诗歌观念也就集中体现在这部诗集中。此外，“《草叶集》”还有可能以名词解释的形式进行考查，大家也要积累一下。"},{"id":"128","stars":"★★★","title":"谈谈《白鲸》的多重意义","body":"一、社会意义\n\n《白鲸》通过“披谷德号”捕鲸船出航捕鲸的故事，揭露了资本主义社会财富的血腥来源，抨击了资本主义制度的残酷\n\n和黑暗，反映了捕鲸工人危险而又艰苦的生活，歌颂了工人们机智、勇敢、互相支援的高贵品德。\n\n二、宗教意义\n\n麦尔维尔生长于加尔文教的环境里，加尔文教强调宿命论，强调“原罪”，人类只有通过上帝的慈悲，而不是人本身的力量，才能得到拯救。\n\n一种观点认为，在麦尔维尔的小说中，白鲸就象征着“恶”与“原罪”，“披谷德号”的远航象征着人生的漫漫旅途。埃哈伯的决心再大，意志再坚强，也无法对抗白鲸所代表的超人力量，无法改变自己的命运。另一种观点将白鲸与埃哈伯作了完全相反的理解。这种观点将白鲸看作是上帝神力的象征，而埃哈伯则代表着人类的邪恶力量。于是小说的主题成了谴责埃哈伯对神的反叛。\n\n三、象征意义\n\n小说的这种复杂的象征意义主要体现在白鲸“莫比·迪克”和船长埃哈伯这两个形象身上。\n\n（一）白鲸“莫比·迪克”\n\n白鲸既代表着高洁安宁，又象征着恐怖邪恶，或者它干脆就是矛盾冲突的化身。\n\n（1）“白鲸”在小说中成了一种超然的、对人怀有敌意而又难以征服的神秘物，进而它又被理解为世间一切“恶”的化身，最后它甚至就等于资本主义制度本身。白鲸是作者对资本主义强大的生产力既感到不可理解，又感到恐惧不安的心理的真实反映。\n\n（2）白鲸同时又是上帝神力的象征，是正义的化身，或者说，它就是大自然本身。这样，小说的象征意义又在于表明：人类如果永无止境地疯狂掠夺大自然，最终必然被大自然所埋葬。人与大自然的关系在这里得到了充分的展现。\n\n（二）埃哈伯船长\n\n埃哈伯船长是白鲸的对立面，他的性格是多重的、矛盾的，这一形象的象征意义也是复杂的、朦胧的、难以把握的。在他身上善与恶并存、美与丑相共。他既是害人者又是受害者。他对大自然的反叛必然招致自取灭亡，他与人性之恶的较量又像是演出了一幕西绪福斯式的悲剧，他自杀性的自我表现和反叛社会的疯狂行为，原本是社会对他彻底孤立的必然结果。埃哈伯的悲剧具有极其深刻而又恢弘的意义。","keywords":"社会意义 宗教意义 象征意义","note":"《白鲸》是一部社会内涵和艺术内涵都非常丰富的小说。作者麦尔维尔结合社会现状，多处运用象征手法，真实而生动地描写了19世纪北美渔业捕鲸员的生活，全面而细腻地刻画了追杀白鲸莫比·迪克的过程。总体来说，这部小说寓意深远，令人回味无穷。"},{"id":"129","stars":"★★★","title":"《白鲸》的艺术特征","body":"一、象征手法\n\n除了作者塑造的各类形象均有象征意义外，小说对景物、细节的描写也往往具有极其丰富的象征、暗示意义。譬如，在小说中，烟斗代表生活中的享乐，因此，在客店里以实玛利和季奎格分享一个烟斗，便暗示他们之间已结成了有福同享的友谊；二副斯德布烟斗不离口，象征着他一味追求享乐，而埃哈伯将烟斗投进大海，则表明了他宁可抛弃生活享乐，也要捕杀白鲸的决心。另外，陆地和海洋也有着明显的互相对立的象征意义：陆地象征着安闲舒适，海洋象征着凶险莫测；陆地代表着封闭自足，海洋代表着冒险求知。\n\n二、对大自然进行了卓越的描写\n\n《白鲸》对大自然进行了卓越的描写，其对大海的描写给人印象极深。那一望无际的大海，一会儿宁静肃穆、柔和如练，给人以田园牧歌式的遐想；一会儿汹涌奔腾、咆哮若狂，令人头晕目眩。春夏秋冬，一年四季，景色各异；海底世界，高深莫测，奥妙无穷。作者对大海的描写既饱含着浓郁的诗情画意，同时又从侧面烘托了人物在同大自然斗争中的顽强精神和心理活动。\n\n三、运用大量的引征和议论\n\n作者常常故意中断故事的叙述，插入大量有关捕鲸业和大鲸的知识，旁征博引，使得小说有如一部百科全书，具有一定的科学性和严密性，从而增强了小说的知识性和真实性。作者还常常在叙述故事和描写景物的同时，直接出来和读者对话，直抒胸臆，大发议论，这样便增强了小说的力度和深度。\n\n总之，“《白鲸》部分是戏剧，部分是历险故事，部分是哲学探讨，部分是科学研究，部分是史诗。它是一部神奇的皇皇巨著”。但是，作者在文体方面的这种大胆的改革和探索在当时并没有得到读者的普遍认同和喝彩，反倒受到冷落和诋毁，\n\n以致《白鲸》被湮没了半个多世纪。\n\n19世纪现实主义文学","keywords":"象征手法 对大自然进行了卓越的描写 引征和议论","note":"《白鲸》的艺术特征，首先是象征手法，这在《白鲸》的主题中也有所涉及；其次是对大自然的描写，最后是大量知识性的引征和议论，增强了这部小说的真实性和知识性。这些内容，我们要有所了解。"},{"id":"130","stars":"★★★","title":"19世纪现实主义文学的形成的条件","body":"一、资本主义制度确立和发展\n\n现实主义文学是西欧资本主义制度确立和发展时期的产物。1830年法国爆发“七月革命”，法国资产阶级取得了统治地位；1832年英国实行了议会改革，英国资产阶级的统治地位得到了进一步巩固。这两大政治事件是西欧资本主义制度确立的标志。欧洲各国在英、法资本主义势力的影响下，相继经历了从封建制度向资本主义制度的历史性过渡。这种特定的社会政治经济形势，直接影响着文学，成为现实主义文学形成与发展的决定性因素。\n\n二、人的道德观念和文化价值观念发生变化\n\n社会政治经济结构形态的剧变，使人的道德观念和文化价值观念也发生了深刻的变化。资本主义在欧洲各国不同程度的发展，使人们头脑中的物质利益观念不断加强。在热衷于创造物质财富并依赖于物质财富的生存环境中，人对人的压迫与剥削以新的形态表现出来，人与人之间的关系趋于恶化。所以他们不得不用冷静的眼光来看现实的社会，思考人的命运问题，从更现实的角度去思考。于是，务实、追求客观冷静地分析与解剖现实的社会心理和风气随之形成。作家在创作上也就摒弃浪漫主义的主观想象和抒情性，通过对社会作如实细致的描绘，揭露社会的黑暗，展示物欲挤压下人的各种心态，并倡导社会改良。于是一种写实性与批判性很强的现实主义文学思潮就应运而生了。\n\n三、自然科学精神与哲学推动\n\n19世纪欧洲的科学取得了比18世纪更辉煌的成就，而且科学与技术相结合加速了财富的创造，所以科学的地位得到提升，理性也自然被认为是人之为人、人之高贵强大的根本属性。正是理性崇拜之风，使人们对科学的追求不仅仅限于科学本身，而是将科学的方法运用到其他领域。现实主义作家延续着启蒙哲学的理性主义思想，并接纳与借用自然科学的方法与理念进行文学创作，形成了普遍遵循的“写实”原则。正是这种“写实”原则，促使现实主义作家在客观“再现”与“反映”生活的过程中，普遍展开了对人的灵魂的空前真实、细致的剖析，从而改变着欧美文学“人”的观念。\n\n哲学对现实主义文学产生有更大的影响。科学成功改变了人类对世界的看法，也带来了哲学观念的更新，人们的思维方式也相应变化。黑格尔的辩证法、费尔巴哈的“人本学说”和孔德的实证哲学等都是19世纪现实主义文学的理论基础。此外，揭露资本主义社会贫富不均现象，主张改良资本主义社会的法国空想社会主义，也催化了现实主义的那种分析批判精神。\n\n四、自身发展规律和内部原因\n\n19世纪现实主义文学思潮的形成，是现实的创新，也是历史的继承。作为创作方法和艺术精神，现实主义早在古希腊文学中就已存在。亚里士多德在总结古希腊文艺创作的基础上提出了“模仿说”，对现实主义文艺作出了朴素而有力的论证。文艺复兴时的人文主义作家对这种原始形态的现实主义作了继承与发扬。他们着眼于现实，并真实地反映生活。18世纪启蒙文学在人文主义文学的基础上加强了社会分析的成分，这对19世纪现实主义产生了很大的影响。18世纪启蒙小说对人物的刻画和细节的描绘为现实主义提供了借鉴。即使是与现实主义相对立的19世纪浪漫主义文学，也为现实主义的繁荣做了准备。","keywords":"资本主义制度确立 人的道德观念和文化价值观念变化 科学 哲学 自身发展规律","note":"类似这种分析一种文学思潮或一种文学现象的出现的题目，都可以从内部原因与外部原因两方面来回答，外部原因又可分别从经济政治文化几方面入手。相似的题目后续还会出现，总结出一定规律就能灵活应对了。此外，“批判现实主义”名词解释大家要积累一下。"},{"id":"131","stars":"★★★★★","title":"19世纪现实主义的基本特点（26辽宁大学、西南交通大学）","body":"一、思想特征\n\n（一）展现社会历史生活\n\n19世纪自然科学和历史科学的成就，改变了人们的思维方式，科学主义成为一种时代风尚。作家们都以研究与分析社会为己任，把广阔真实地反映时代的风俗史作为文学创作的最高理想。文学中的历史意识重新受到高度重视，于是现实主义文学艺术地再现了人类历史上封建制度衰亡、资本主义制度上升这一重大历史变革，具有珍贵的历史文献价值和很高的社会认识价值。\n\n（二）批判黑暗现实，提倡社会改良\n\n现实主义作家既看到了金钱社会中贵族阶级的腐化堕落和新兴资产阶级的贪婪卑劣，也看到了下层人民以及小资产阶级知识分子的不幸遭遇，因此对现存制度的合理性有所怀疑。他们倡导“自由”“平等”“博爱”的人道主义理想，要求维护人的尊严与价值，深刻地揭露和批判社会的恶德败行，有的还涉及上层建筑和国家机器，触及了资本主义制度的病根。同时，现实主义作同情下层人民，并希望统治阶级以仁爱为怀，改善与被压迫者之间的关系，表现出社会改良的愿望。\n\n（三）深切关怀人类命运与前途\n\n现实主义作家在再现和强烈批判社会历史现象的基础上，深刻地展示资本主义下人与物、人与社会的矛盾关系，表现人的异化现象，表现出深度意义上的人道主义精神。现实主义作家通过文学创作，深入解剖物欲驱动下人千奇百怪的心灵世界，从而警告人们：不可沉湎于物质的追求中而忘却人的精神本质。现实主义文学反映了西方资本主义文明的历史进程中出现的种种反人性的弊病，探讨的是关于人的自由与解放的问题，虽然这种探讨并没有达到马克思主义的思想高度，而且还常常陷入宗教悲观主义和厌世主义的境地，但却拥有深层意蕴和深远的警世意义，从而显示了现实主义的深刻性。\n\n二、艺术特征\n\n（一）追求写实\n\n现实主义作家格外重视艺术描写的客观真实性，为了使创作达到真实的艺术效果，现实主义作家反对在作品中显示“自我”，而要让作者的思想与情感在具体的情节描写与人物塑造中自然而然地流露出来，让文学对生活表现出镜子般的忠实。\n\n但这并不意味着作品的文本世界等同于生活。优秀的现实主义文学所反映的生活都体现了作家们对生活的感受与评价，表现了他们在特定生活中情感、心绪的演变。因而现实主义文学作品是融入了作家主观情致与个性特征的变形了的生活图画，而并非是对生活作机械的模仿。\n\n（二）塑造典型环境中的典型性格\n\n现实主义作家受自然科学和唯物主义哲学的影响，认为人是社会环境的产物。他们主张从人物所处的社会历史环境中刻画人物性格，真实地揭示人物和事件的内在联系与本质特征及发展趋势，通过对典型环境中的典型性格形成过程的描写，全面真实地展示现实生活及其本质特征，反映整个时代的风貌，在这种人物塑造原则的指导下，现实主义文学中的人物形象通常都十分贴近生活，且具有很强的概括性，显示了社会历史的盛衰。他们的思想、性格、情感、心理也往往与生活中的人一样丰富而复杂。\n\n（三）具有内倾性和外倾性两种倾向\n\n现实主义作家由于各自审美心理机制和艺术思维方式的差异性，在真实地反映生活时，在外部世界与内部世界的艺术把握上就有所侧重。因此，现实主义文学中存在着反映生活上的内倾性与外倾性两种倾向。这两种倾向在不同作家的创作中常常兼而有之，而并非互相对立。如托尔斯泰在以内倾性为主导的基础上又融合了外倾性特征，巴尔扎克则在以外倾性为主的基础上又融合了内倾性的特点。因此，现实主义文学的成就既表现在反映外部社会生活的广阔性上，又表现在内部心灵世界表现的深刻性上。\n\n（四）叙事文学为主\n\n现实主义以叙事文学为主，小说创作特别是长篇小说走向了成熟与繁荣。在科学主义思想影响下，19世纪的作家都企图通过文学创作去研究与分析社会，社会也要求文学真实地反映生活，回答时代和生活提出的一系列问题。因此叙事性的小说就比抒情性的诗歌具有显著的生存与发展优势。现实主义的长篇小说通常都是广泛概括和分析现实生活的社会小说，它往往在科学意识和历史意识指导下，综合地反映整个时代、社会各阶层的生活风俗，真实地展现错综复杂的历史事件和社会历史画面。","keywords":"思想特征 分析与研究社会 以人道主义思想为武器 对人的命运与前途的深切关怀 艺术特征 追求艺术的真实模式 客观真实地反映生活 重视人与社会环境的关系 典型环境中的典型性格 内倾性和外倾性两种倾向 叙事文学为主","note":"19世纪现实主义文学在外国文学史中占有非常重要的地位，是重点考查的内容。23年闽南师范大学，24年苏州大学、湖南师范大学、浙江工商大学都对现实主义的文学特征做了细致考查。这部分内容比较庞杂，需要大家仔细记忆。此外，这里的思想特征和艺术特征都有可能单独出题。"},{"id":"132","stars":"★★★★","title":"谈谈19世纪浪漫主义和现实主义的区别","body":"19世纪是世界艺术发展的高峰阶段，世界范围内的文学潮流不断涌现，产生了许多不同特征和风格的派别。其中，浪漫\n\n主义和现实主义是较为鲜明的两个对立分支，二者的区别如下：\n\n一、艺术思维方式不同\n\n（一）浪漫主义：主观性\n\n追求主观想象的浪漫主义在艺术思维方式上强调个人感情的自由抒发，有强烈的主观性。换句话说就是：浪漫主义比较注重个人主观感觉，轻客观揭示，注重自我表现，轻客观模仿。浪漫主义是强调鼓舞和想象的文学艺术形式。\n\n（二）现实主义：客观性\n\n强调客观写实的现实主义在艺术思维方式上追求艺术的真实模式，强调客观真实地反映生活。现实主义作家把文学作为研究社会的手段，认为作家应该“按照生活本来的样子去反映生活”。为了使创作达到真实的艺术效果，他们反对在作品中显示“自我”，而要让作者的思想与情感在具体的情节描写与人物塑造中自然而然地流露出来，让文学对生活表现出镜子般的忠实。\n\n二、表现手法不同\n\n（一）浪漫主义：想象、夸张\n\n浪漫主义文学是通过作者的想象和夸张等手法，以神话、传奇等题材来表现生活，具有浓厚的理想色彩，作家往往在这理想的境界中表现他们憧憬的社会、人生和人性。\n\n（二）现实主义：真实再现\n\n现实主义再现社会现实生活，并且忠于现实生活，不回避矛盾，不粉饰生活，对人和人的生活环境做最真实的描写，通过典型人物的细节描写来表现更广泛的内容，揭示出隐藏在琐碎生活现象背后的某种本质性的东西。\n\n三、主要艺术形式不同\n\n（一）浪漫主义：民间文学、诗体长篇小说\n\n在德国和英国，浪漫主义就是从搜集和整理民间文学开始的。浪漫派从民歌民谣、民间传说中撷取题材，学习表现手法，采用民间口语、民歌韵律创作，大大丰富了文学的表现手法。在当时一味仿古或庸俗低劣的作品充斥文坛的情况下，浪漫主义文学无疑带来了清新、活泼、健康的新气象。\n\n比如拜伦首创的诗体长篇小说，就是在诗剧的基础上发展起来的，视野宽广，将欧洲各国的社会生活熔于一炉。这种新形式扩大了诗歌反映现实的范围，对长篇小说的发展也起了推动作用。此外，浪漫派对语言的功能进行了深入开掘，丰富了语言的表现力，为日后的巴那斯派和象征派开辟了道路。\n\n（二）现实主义：叙事文学，尤其是长篇小说\n\n在科学主义思想影响下，19世纪的作家都企图通过文学创作去研究与分析社会，社会也要求文学真实地反映生活，回答时代和生活提出的一系列问题。在这种精神文化条件下，叙事性的小说就比抒情性的诗歌具有显著的生存与发展优势。在作家们的共同努力下，19世纪现实主义小说在叙事艺术、情节结构和人物描写方面都比以往的小说更成熟，它以前所未有的辉煌成就成为这一时期文坛最重要的艺术形式。","keywords":"艺术思维方式 表现手法 主要艺术形式","note":"这是上海师范大学2023年考查过的一道真题，24年深圳大学也要求结合雨果和巴尔扎克的创作，对现实主义和浪漫主义进行比较。浪漫主义与现实主义的区别与联系需要我们重点掌握。另外要注意，在欧洲，现实主义文学思潮形成于19世纪30年代，它的出现是对浪漫主义的反拨，但并不是对浪漫主义的彻底否定。许多作家都是从浪漫主义转向现实主义的。"},{"id":"133","stars":"★★★","title":"分析19世纪欧美国家的人文观念有什么变化","body":"一、19世纪初期：浪漫主义人文观念\n\n18世纪的欧洲是科学的和理性的世纪，启蒙运动就是科学主义和理性主义的产物。而浪漫主义思潮就是继卢梭之后的对这种理性主义的又一反叛。在浪漫主义者心目中，“理性”代表的是同“自然”相对而言的文化与文明，因而与人的自然本性和感性能力相对。浪漫主义对“理性”的反抗，实质上是个体的人对传统文化和现代文明的反叛，是对人的感性世界的解放和个性自由的呼唤，是人对精神独立与精神自由的追寻。\n\n总之，浪漫主义文学在自由精神的鼓舞下，弘扬个性，肯定自我，揭示了人的丰富而纤弱的感情世界，塑造了充满扩张欲望的“自我”，表达了现代人要求摆脱传统文明束缚的强烈的个性主义愿望，使西方文学中“人”的形象拥有了更丰富的内涵和鲜明的主体意识。\n\n二、19世纪中期：现实主义人文观念\n\n与浪漫主义文学相反，现实主义作家延续着启蒙哲学的理性主义思想，并接纳与借用自然科学的方法与理念进行文学创作，形成了共同遵循的“写实”原则。这促使现实主义作家在客观“再现”与“反映”生活的过程中，普遍展开了对人的灵魂的空前真实、细致的剖析，从而改变了西方文学“人”的观念。\n\n现实主义普遍展开了对道德善恶的灵魂拷问，表现了人的原欲与理性的冲突。现实主义作家大都从人的自然原欲会滋生邪恶的角度持性恶论或人性趋恶论观点。在理性与原欲之冲突的描写上，他们强调理性对原欲的贬抑与限制，并由此对人物作出道德评价。正是由于这一原因，现实主义作家一方面崇尚科学理性，强调用人智意义上的人的理性去研究人与社会，另一方面又崇尚基督教传统文化中宗教人本意义上的理性，也即道德“上帝”，并以之去规约人的行为，扼制自然原欲，不使人性滑向邪恶。因此，现实主义作家的“理性”是希伯来-基督教人本传统的延续，同时又有西方近代科学理性的渗透。这样一种理性意识，不把人的自然原欲简单地视作人的原恶，而是强调对其作道德规约，使之与人的原欲达成相对意义上的语和，这就比传统的宗教理性更富有生命意蕴与现代意味，从而也避免了文艺复兴人文主义和浪漫主义的“自我”的那种个人主义偏颇。在这种人文基础上形成的“人道主义”，并不对人作简单的善恶划分，而是对“类”的意义上的人的生命存在给予普遍的尊重、重视与同情，因而“人道主义”对感性意义上的“人”和理性意义上的“人”都给予了高度的关注，它比以往的世俗人本主义和宗教人本主义有了更大的包容性，现实主义文学也借“人道主义”表达了既理性化又更富有人性内蕴的“人”的观念。在这些“人”身上，既有强烈的自然欲望和生命意识，追求着人性自由和解放，又始终受制于理性规约，灵魂深处蕴积着因灵与肉、善与恶的冲突而产生的心理张力。\n\n现实主义作家以非人格化的道德“上帝”去规约人，表现的是人自己拯救自己的世俗式拯救意识。但是，在人欲横流的自由资本主义时代，这个“上帝”对人的制约力量显得十分微弱，而被激活了的人的欲望就如巴尔扎克小说所描写的那样强悍而有力，托尔斯泰为之感到忧虑与困惑，陀思妥耶夫斯基也为之深感恐惧。他们作品中表现的人的惶恐与焦虑，表征了“上帝死了”，道德“上帝”难以帮助人类料理世俗事务，更深重的信仰危机时代即将到来。福楼拜式的悲观、冷漠与执着，预示着一种新的人生观、世界观、价值观的兴起。总之，现实主义作家在对传统理性主义文化价值观念的承接与怀疑中走向了新的时代。\n\n三、19世纪后期：自然主义人文观念\n\n自然主义产生于19世纪后期，对它的形成起重大作用的是达尔文的进化论。进化论把人们作为自然物的一部分，作为动物界的一员，人成了科学研究的目标。达尔文的进化论以及在其影响下发展起来的生物学、生理学等自然科学，改变着世纪后期欧洲社会的精神文化气候，自然主义正是这种精神文化气候的产物。\n\n自然主义的代表左拉接受了达尔文的思想，形成了对人与世界的新的认识，传统理性主义的“人”，在他头脑中一大半被“生物的人”所取代。他认为：“具有思想意识的人已经死去，我们整个领域将被生物的人所占有。”在创作中，自然主义作家往往把生理研究与社会分析结合在一起，而且生理学与遗传学始终是他们研究和描写人的切入点和基本方法。在自然主义文学中，人的“动物性”被看成既定的科学事实，生物界“弱肉强食，适者生存”的自然规律被用来解释人的私欲、“恶”以及永恒的破坏力产生与存在的原因，以前文学中那高贵的“人”的形象，从神圣的理性殿堂跌入动物王国。自然主义的这种人文观念突破了理性主义的规范，使文学对人的描写扩展到了生理性区域，表现出了非理性、非道德化倾向。\n\n四、19世纪末：唯美主义和象征主义人文观念\n\n19世纪末，资本主义的工业文明进一步给人带来心灵的挤压，物欲主义、享乐主义、悲观主义、颓废主义笼罩了整个西方社会。现实主义作家们曾为之忧虑的“恶”的现象，不仅未曾被遏制，反而更加肆无忌惮地在社会中蔓延。在这个缺少理性的世界上，浪漫主义的理想显得天真而空泛，自然主义所验证的人的“生物性”，倒是让人们在现实中看到了实证。这时，欧洲开始流行的非理性主义哲学很好地归纳了这种时代精神，同时又反过来助长了西方社会的悲观情绪和危机感。在这种“世纪末”颓废精神弥漫的文化条件下产生出来的唯美主义和象征主义文学，已不再信守传统的理性原则，而是崇拜非理性本能和潜意识；也不再执着地去追寻理想和美好的未来，而是热衷于描写人与社会的畸形、病态和混乱。在这类文学作品中，人的理性内容被抽空后，注入了非理性内容，“人”的形象也就发生了质的变化。由此，西方文学发展到19世纪末，开始了历史性的转折，唯美主义和象征主义成了20世纪现代主义文学的先驱，这两种文学的人文观念进入了现代文化的范畴。","keywords":"浪漫主义 现实主义 自然主义","note":"本题为2023年广东外语外贸大学考研真题。19世纪欧美人文观念经历了从理性（18世纪启蒙）到感性（浪漫主义）到理性（现实主义）再到非理性（自然主义、唯美主义、象征主义）的过程，我们要对此有一个整体性的认知，"},{"id":"134","stars":"★★★","title":"欧美各国现实主义文学的基本特点","body":"一、法国现实主义文学\n\n法国是现实主义文学的发源地，其现实主义文学基本特点如下：\n\n（一）以反映阶级矛盾和社会黑暗为基本主题\n\n法国经历了巨大的历史变革，资产阶级与贵族阶级进行了反复的较量。作为中小资产阶级的作家们，切身感受到了法国大革命时期的热情与后来的冷酷现实，感受到了平民青年和没落贵族青年的郁郁不得志。所以，法国现实主义的基本主题是反映资产阶级和封建贵族阶级的矛盾，揭露金钱的罪恶和资产阶级必将取代封建贵族阶级的历史规律，塑造个人反抗者和野心家的形象。\n\n（二）科学和理性主义精神\n\n受科学思潮和社会学研究的影响，法国现实主义文学贯穿着科学和理性主义精神。比如巴尔扎克的《人间喜剧》反映了资产阶级取代贵族阶级的罪恶发家史、贵族阶级的没落衰亡史，塑造了众多栩栩如生的上升资产阶级和贵族形象，如拉斯蒂涅、高老头、伏脱冷等。\n\n二、英国现实主义文学\n\n资本主义的确立与劳资矛盾的激化密切相关，而各种改良主义思潮的影响，使英国现实主义文学在揭露现实的广度和深度上有了更进一步的发展，形成自己独特的风貌：\n\n（一）批判劳资矛盾\n\n英国现实主义文学强调对社会现象和文化风俗的反映，作家们试图直接揭露社会的许多问题和矛盾，如劳资矛盾、阶级冲突等，揭露资本家对工人的残酷剥削和政治欺骗，正面描写工人的斗争生活。\n\n（二）关注“小人物”\n\n英国现实主义文学善于描写“小人物”的命运，成功地表现了小资产阶级的痛苦挣扎和个人奋斗的经历。这些作品常常以普通人的生活为背景，关注他们的喜怒哀乐，以及他们与社会、家庭的关系。\n\n（三）人道主义和改良主义色彩\n\n英国批判现实主义文学的人道主义和改良主义色彩比较浓厚，充满温情与道德感化。这与统治阶级的理论宣传和作家本身的局限分不开。许多作品都呼吁社会关注弱势群体，追求社会公正和平。\n\n（四）女性文学异军突起\n\n英国出现了一大批有成就的女作家。比如盖斯凯尔夫人，她的代表作《玛丽·巴顿》，是最早接触劳资矛盾的小说，从侧面反映了英国的宪章运动。\n\n三、俄国现实主义文学\n\n俄国现实主义成就最高，特点如下：\n\n（一）批判尖锐而全面\n\n俄国现实主义文学与民主解放运动紧密相连，对社会的批判异常尖锐而全面，以批判沙皇专制制度和农奴制度作为主要内容，而且还批判了宗教制度和资本主义社会的道德原则，具有很强的革命性、战斗性和民主倾向。\n\n（二）人道主义思想\n\n俄国现实主义文学对贵族知识分子的责任和民族出路的探索越来越迫切，对灵魂苦难的关注越来越执着，基督教人道主义思想也越来越浓厚。\n\n（三）独特的形象系列\n\n俄国现实主义文学塑造了贵族知识分子的“多余人”形象系列，孤苦无告而又愚昧麻木的“小人物”形象系列，由贵族地主立场向平民立场转化的“忏悔的贵族”形象系列等众多形象系列。\n\n（四）系统的文学理论和批评\n\n俄国现实主义文学有系统、进步的文学理论和批评作指导。别林斯基、车尔尼雪夫斯基和杜勃罗留波夫的美学思想及其各自的文学批评活动，阐释和捍卫了俄国现实主义文学的批判方向，推动了俄国现实主义文学的发展。\n\n四、美国现实主义文学\n\n美国的资本主义发展较晚，因此，美国现实主义文学在19世纪80年代才真正形成。其特点如下：\n\n美国现实主义文学常常从民主主义理想出发，揭露美国式民主的欺骗性，批判资本主义的罪恶，追求自由平等的民主理想，具有较强的民主性和人民性。\n\n（二）民族性\n\n现实主义文学兴起的时期，正是美国文学追求独立品格、繁荣民族文学的时期，现实主义作家创作的作品大多地域色彩浓厚，口语化特征明显，增加了美国文学的民族性。","keywords":"法国 英国 俄国 美国","note":"现实主义文学虽然在总体特征上具有一致性，但是，欧美各国在社会制度、经济发展等方面的差异，导致各国现实主义文学发展状况和具体特征出现了差异。这部分内容，我们要有所了解。"},{"id":"135","stars":"★★★","title":"维多利亚时期女性作家群的创作风貌（26陕西师范大学）","body":"维多利亚时代是英国文学史上不能忽略的时代，尤其在这段时间，英国涌现出大量优秀的女性作家，她们的写作不仅推动了英国小说界的发展，也体现出女性书写的革新与进步。这些女性作家的创作风貌，主要表现为以下方面：\n\n一、控诉男性的压迫，对社会歧视、压迫女性的抗议\n\n自从女性传统地位丧失的“世界性失败”之后，便是父权主义大行其道的漫漫长夜，女子作为男子的附庸和点缀物，其自然属性成为被奴役的对象，日益沦为生育的工具和家庭的奴隶，女性被当作一个不完整的存在而遭到以男性为代表的社会的压迫。在女性独立、自由意识觉醒的维多利亚时代，女作家们在她们的作品中再现了一个女性备受迫害的社会。\n\n二、塑造不囿于传统规范的争取独立、自由的女性形象\n\n19世纪前半叶，英国社会并没有掀起轰轰烈烈的女权运动，但妇女开始走向社会，妇女与男性社会的对立，已在各个领域中表现出来。这是维多利亚妇女作家生活感受中一个相当重要的问题。而妇女要求解放的自由意识也正是在妇女走向社会后，在所遇到的不平等的社会待遇中逐渐形成和加强的。妇女们渴望获得自由，而不愿做“家庭的天使”。妇女们为保持自己独立的人格而顽强拼搏。文学作品中一系列具有自由、独立意识的女性形象应运而生。简·爱这个人物身上，最明显地表现了妇女要求平等、维护女性的人的尊严的要求。\n\n三、表现对爱情的深刻理解和感受\n\n爱情、婚姻在任何时代都是人类生存的基本问题、社会的基本问题。爱情是维多利亚时期女性作家小说的主要成分和创作母题。不过，相较于之前表现爱情的作品，维多利亚时期的女性作家对于爱情的理解更加深刻，像是勃朗特姊妹的创作，突破了一见钟情的局限，强调人格力量对爱情的作用。她们笔下的女主人公外貌都不算美，简·爱几乎是英国文学史上第一个容貌平平的女主人公，是她身上丰富的个性和思想感情使罗切斯特感到这样一个身材瘦小并无动人姿色的家庭女教师具有一种不平凡的气质，两个叛逆的灵魂才互相呼应和吸引。这就构成了他们相爱的基础。这也即是“人格力量”在爱情中的作用。\n\n四、颠覆不够彻底，具有妥协性\n\n维多利亚时期女性文学的繁荣是不言而喻的，但任何事物的发展都离不开时代的局限性，因此这一时期的女性文学也摆脱不了这样的限制。维多利亚时期虽然女性的思想有所解放、地位有所提升，但从总体来说，这个时期作品中的理想女性仍然是把美满婚姻作为其最终归宿，温柔顺从、自我牺牲，在作品中，女性的智慧和精神有所突破，不再成为男性的附庸和从属，但大多数作品中的男女主人的美满结局无一例外的都是建立在有一定经济基础的前提之上，西方传统的“灰姑娘”模式仍然盛行，这种颠覆远远不够彻底。\n\n维多利亚时期的女性作家深情地守望着社会和女性群体，用作品创造了一个别样的世界，她们的作品对当下的女性文学创作和研究仍有重要的启发意义。","keywords":"控诉压迫 抗议 争取独立、自由 对爱情的深刻理解和感受 妥协性","note":"回答这道题，正确理解题目是十分重要的。所谓维多利亚时期，指的是英国维多利亚女王在位时期，也即1837年到1901年，也就是说，让我们讨论这一时期的文学。此外，这一概念除了限定时间外，限定了空间，既然是英国的“维多利亚时期”，所以我们应该主要讨论的是英国文学。明确了这一点之后，我们结合当时的女性作家创作，以及当时的时代风貌去讨论就可以了，可以多围绕勃朗特三姐妹等比较知名的作家去讨论。相关内容可以参考刘晓文《建立女性的“神话”-论维多利亚时代的女性文学》这篇论文。"},{"id":"136","stars":"★★★","title":"试分析19世纪法国现实主义文学中的个人奋斗者形象（25江南大学）","body":"19世纪的法国经历了政治动荡，现实主义作家敏锐捕捉到人生百态，通过个人奋斗者的命运揭示了社会结构的虚伪与残酷。\n\n一、典型形象及其矛盾性\n\n（一）于连·索雷尔（斯丹达尔《红与黑》）\n\n“红”与“黑”的象征：于连身兼革命热情（红）与教会伪善（黑），试图通过知识改变命运。他周旋于贵族沙龙与教会之间，以虚伪为武器，却因自尊心与真情的矛盾走向断头台。\n\n斯丹达尔深入刻画于连的敏感与骄傲，如他拒绝贵族施舍时的内心独白：“宁可死一千次，也要飞黄腾达！”其悲剧源于个人理想与社会现实的不可调和。\n\n（二）拉斯蒂涅（巴尔扎克《高老头》）\n\n初到巴黎的拉斯蒂涅目睹高老头被女儿抛弃、伏脱冷的被捕，逐渐接受伏脱冷的教诲：“人生就像厨房，要么弄脏手，要么饿死。”他最终向巴黎宣战：“现在咱们来拼一拼吧！”标志其从天真青年蜕变为野心家。\n\n通过高老头的父爱悲剧、伏脱冷的cynical哲学，巴尔扎克展现社会如何将道德碾碎，逼迫个人成为制度的共谋。\n\n二、此类形象的深广意义\n\n（一）反映社会现实：于连和拉斯蒂涅的个人奋斗历程反映了19世纪法国社会的种种现实问题，如阶级对立、社会的虚伪和道德的沦丧。他们的经历揭示了在当时的社会环境下，平民子弟想要通过个人努力改变命运是多么艰难，同时也展现了上流社会的腐朽和黑暗。\n\n（二）批判社会制度：此类形象对当时的社会制度进行了深刻的批判。他们的悲剧命运表明，在那个金钱至上、等级森严的社会里，个人的努力往往无法战胜强大的社会现实。作者通过对他们命运的描写，表达了对封建贵族和新兴资产阶级的不满和批判，呼吁社会的变革和公平。\n\n（三）展现人性的复杂：于连和拉斯蒂涅都是复杂的人物形象，他们既有善良、真诚的一面，又有自私、虚伪的一面。他们在个人奋斗过程中的种种挣扎和转变，展现了人性在社会环境影响下的复杂性和脆弱性。这也让读者更加深入地思考人性与社会环境之间的关系，以及在追求个人目标的过程中如何保持自我和道德底线。\n\n三、现实意义的延续性\n\n（一）个体与体制冲突的永恒性\n\n个人奋斗者的困境至今仍具启示性，如现代社会中的阶层固化、工具理性对人性异化等问题，与19世纪法国存在本质相似性。\n\n（二）阶级壁垒的不可逾越性\n\n个人奋斗者无论多努力，最终被贵族或资产阶级排斥（如于连的“汝等出身”审判），揭露了“平等”表象下的等级森严。\n\n19世纪法国现实主义文学通过个人奋斗者形象，完成了对资本主义上升期社会矛盾的深度解剖，其艺术真实性与批判力\n\n度至今仍为文学介入现实的典范。","keywords":"典型形象 于连·索雷尔 拉斯蒂涅 深广意义 反映社会现实 批判社会制度 展现人性的复杂 现实意义** 个**与体制冲突 永恒性 阶级壁垒","note":"答题切入点，首先，直接定位到19世纪的法国现实主义，之后联想到以巴尔扎克、斯丹达尔、福楼拜等作家为代表的文学流派。第二，“个人奋斗者形象”指的是那些在小说中通过自身努力试图改变命运的角色。比如，巴尔扎克《高老头》中的拉斯蒂涅，斯丹达尔《红与黑》中的于连。第三，广泛联想，比如社会背景、典型人物分析、作者手法、主题意义等。同时要确保有足够的文本例子支撑，避免泛泛而谈。此题是一个概括类的题目，可切入的作家作品众多，大家可按自己所学实际进行个人化书写，亦可参考李凡文学1000题中的“19世纪现实主义文学”板块。"},{"id":"137","stars":"★★★","title":"试论19世纪外国文学中的女性意识","body":"女性意识就是女性作为主体在客观世界中的地位、作用和价值的自觉意识，具体地说，是指女性能够自觉地意识并履行自己的历史使命、社会责任、人生义务，又清醒地知道自身的特点，并以独特的方式参与社会生活，肯定和实现自己社会价值和人生需求。19世纪，随着资本主义制度确立与发展，欧美女性意识与女性主义观念不断加强，这些都反映到了当时作家和作家的创作中，主要有以下内容：\n\n一、《包法利夫人》：对受侮辱受损害的女性的关切与同情\n\n《包法利夫人》叙述了法国一个平民女子的悲剧命运。爱玛的悲剧是对卑污得令人窒息的现实的深刻揭露。作者对爱玛的悲剧命运抱有深切的同情。她死后被世人指责，但那些无耻之徒却左右逢源，步步高升。这个结局饱含了作者对现存社会愤怒的斥贵。福楼拜基本上把爱玛看作受侮辱受损害的女性。\n\n二、夏洛蒂·勃朗特：关心女性自身命运、权益和地位的女作家先驱\n\n夏洛蒂·勃朗特最突出的主题就是女性要求独立自主，追求男女平等。她笔下的女主人公简·爱、卡罗林、露西等都处于低下的社会地位，但她们纯洁而正直，勇于向上，渴望爱情的自由和男女的平等。夏洛蒂·勃朗特往往以男女主人公的爱情与婚姻为主线，并以此来揭示社会的矛盾与不公，同时以丰富的想象力和非凡的艺术匠心，成功地塑造了简·爱、谢莉和露西等新的妇女形象。女性主题加上抒情笔调，夏洛蒂对当时乃至20世纪的作家和读者产生了深刻影响。\n\n三、《安娜·卡列尼娜》：罪恶社会下追求个性解放的妇女的悲剧\n\n安娜是一个追求新生活，具有个性解放特点的贵族妇女形象，她的悲剧是她的性格与社会环境产生尖锐冲突的必然结果.安娜真诚、善良，最初的内心冲突，来自于她对生活的狂热渴望，对人与人之间纯真的关系的追求，对周围人当中比比皆是的谎言和伪善的厌恶。她不屈从于她认为不合理的环境，勇敢地追求和保卫所向往的幸福生活。安娜在伏伦斯基的爱中看到了生命的意义，并义无反顾地去追求属于自己的生活，冲破社会舆论的压制，公开与伏伦斯基一起生活。在她对爱情自由的执着追求中，表现出了她性格的正直、坦率、勇敢和心灵的高尚、精神境界的崇高，展示出有生命的、生机勃勃的东西对平庸的、死气沉沉的现实环境的顽强反抗。\n\n然而这种反抗本身决定了安娜的性格与命运是悲剧性的。安娜无法在这个虚伪冷酷的环境中继续生存，只能以死来抗争，用生命向那个罪恶的社会提出了强烈的抗议和控诉。安娜的悲剧从根本上说，是由那个罪恶的社会造成的。\n\n四、《德伯家的苔丝》：同情女主人公的人道主义立场\n\n《德伯家的苔丝》的副题是“一个纯洁的女人”，鲜明地表达了作者同情女主人公的人道主义立场，同时也是对资产阶级道德的一个大胆挑战。苔丝坚强、勤劳而富于反抗性，自食其力的尊严感和意志使她在困难和磨难面前表现出无比坚强的态度而多次“绝处逢生”。她对资产阶级社会及其虚伪的道德充满憎恶，并不断与它作斗争。她爱克莱尔，主要是因为她认为他心地善良，并非是觊觎他的财产，这种爱是真诚的、高洁的。\n\n五、《玩偶之家》：自由的女性向男权统治的世界的宣战\n\n《玩偶之家》中，娜拉在戏的结尾愤而离家出走，砰然把门关上的情景，是现代欧洲戏剧中极为出彩的一笔。这一举动往往被诠释为一个自由的女性向男权统治的世界的一种宣战。正是由于这一独特的戏剧手法，易卜生常常被誉为妇女解放运动的先驱，在欧洲戏剧史上开创了描写妇女为追求自由，为捍卫自己的独立人格而斗争的戏剧的先河。自《玩偶之家》出版和演出以来，妇女们广泛参与社会活动，而且享受到了比以往更多的自由。","keywords":"自觉意识 受侮辱受损害的女性的关切与同情 女性要求独立自主 追求男女平等 个性解放 同情女主人公的人道主义立场 向男权统治的世界的一种宣战","note":"本题为2023年西北大学考研真题。回答这道题，首先要明确什么是女性意识。其次，我们要知道，女性意识反映到作家作品中，就是对女性个性解放、独立地位、女性尊严与权益等的关注与思索，大家结合相关作家作品，综合作答即可。"},{"id":"138","stars":"★★★★","title":"19世纪欧洲文学巨匠的人道主义思想对其创作的影响及意义（26江苏师范大学）","body":"人道主义思想是源于欧洲文艺复兴时期的一种思想，提倡关怀人，尊重人，以人为中心的世界观，主张人格平等，互相尊重。这一思想被后世作家不断地继承与发展，在不同的作家那里有不同的表现，对他们的创作产生了非常深远的影响。19世纪欧洲的几位文学巨匠，无不怀有人道主义思想，下面就以几位作家为例，分析人道主义思想对其创作的影响及意义。\n\n一、雨果的人道主义思想：博爱、仁慈、宽恕和道德感化\n\n雨果人道主义思想的基本含义是“博爱、仁慈、宽恕和道德感化”。他相信善必战胜恶。雨果的创作从一开始就表现出对社会问题的深刻思索。例如1823年发表的长篇小说《冰岛凶汉》，描写面目狰狞的冰岛魔王的残暴行径与一国之君的贤德国王对下层人的深仁厚泽，形成了鲜明的对比。反映出雨果的爱憎分明，也是作者在创作中关注哲学和社会学主题的萌芽。《巴黎圣母院》借中世纪的历史题材影射19世纪波旁王朝复辟时期的社会现实。通过对国王路易十一的描写，抨击了封建专制王权统治时期的残暴与黑暗，封建教会的虚伪与反动，以及司法机构的罪恶行径；赞颂了下层人民淳朴善良的品格，正直勇敢的斗争精神。雨果认为，世界是善与恶的角逐场，历史就是这两种原则的斗争。他在小说中解释历史事件和描写人物形象时，充分体现了他的人道主义思想和浪漫主义激情。\n\n二、狄更斯的人道主义思想：仁爱思想与维护稳固的家庭观念\n\n狄更斯的人道主义思想表现为一种仁爱思想，这种仁爱思想不仅表现在对现实生活的批判、对弱小者的同情、对善行的支持上，同时也表现在对恶人的宽容上。他倡导人们“勿以暴抗恶”，用仁爱、宽恕的精神来对待敌对的阶级。凡是“以暴抗暴”，违反这种基督教仁慈精神的必然会自食其果。像是在《双城记》中，狄更斯一方面极力颂扬梅尼特医生身上的仁爱精神，另一方面又对得伐石太太的激进革命斗争持否定态度。\n\n狄更斯小说人道主义的一个突出特征，就是注重塑造儿童形象，关注儿童的命运。狄更斯小说中的儿童，大多数没有家庭温暖，他们是孤儿、养女、私生子、遗腹子......甚至是来历不明的流浪儿，往往都有过一段孤苦伶仃、流浪漂泊的遭遇。如《雾都孤儿》中的奥列佛、《大卫·科波菲尔》中的大卫·科波菲尔等人物都有着一个共同点：他们的童年都遭遇过各种各样的不幸。小说对这些孩子遭遇的同情，表现出狄更斯人道主义的一个方面：对稳固的家庭观念的维护。\n\n三、托尔斯泰的人道主义思想：托尔斯泰主义\n\n列夫托尔斯泰将人道主义思想与宗教信仰相结合，融人道主义于宗教信念之中，以彻底否定暴力的方式，建构起“托尔斯泰主义”：追求道德的自我完善，主张“勿以暴力抗恶”。在《复活》中，托尔斯泰就通过对男女主人公“复活”的描写，强调了“道德自我完善”在改造人和社会中的重要作用。\n\n至于“勿以暴力抗恶”，则广泛体现在托尔斯泰早期的战争小说中。托尔斯泰以博大的胸怀、真诚的心灵拥抱自然万物，对于破坏环境、荼毒生灵、暴殄天物、灭绝物种的行为深恶痛绝。他认为，给自然环境造成严重破坏、给天地众生带来深重灾难的莫过于战争；因此，反对战争、拒绝暴力成为托尔斯泰早期创作的一个重要主题。作为战争的参加者，作家亲眼目睹了战争的残酷，《塞瓦斯托波尔故事》即以作家在战争中的深刻体验为基轴，描绘出一幅真实的战争图景，揭开了人类战争的神秘面纱，剥去了关于战争的一切浪漫色彩，这些特写被称为是“反抗战争的催眠魅力的先驱”。\n\n总体看下来，虽然具体表现各不相同，但人道主义思想是19世纪这些欧洲文学巨匠们所普遍秉持的精神，并且对其创作产生了非常重要的影响。不仅如此，他们的思想还流传后世，直至当下依旧有着十分重要的意义。","keywords":"雨果 博爱、仁慈、宽恕 道德感化 狄更斯 仁爱 维护稳固的家庭 托尔斯泰 托尔斯泰主义","note":"这道题相对来说还是比较开放的，只是给我们限定了时间，但并没有限定地域，所以19世纪的文学巨匠我们都可以拿来讨论。不过需要注意的是，题目要求的是“文学巨匠”，所以至少应该是课本上单独开一章讨论的作家才能称得上是巨匠。大家在分析时，从这些作家思想中的人道主义方面出发，结合他们的作品去分析即可。相关内容可以参考徐荣鸿《论雨果的人道主义思想-雨果创作思想发展轨迹》、邱细平、朱祥《狄更斯人道主义思想的演义与双重性》、闫吉青《从托尔斯泰早期的战争小说看其人道主义思想》"},{"id":"139","stars":"★★★","title":"试论19世纪俄国现实主义文学的发展历史","body":"俄国现实主义文学形成于19世纪30年代，50至60年代不断发展，70至80年代达到鼎盛阶段，20世纪初逐渐衰落。\n\n一、形成：19世纪30、40年代\n\n普希金《叶甫盖尼·奥涅金》的发表，奠定了俄国现实主义文学的基础。之后，莱蒙托夫为俄国现实主义文学的发展作出了重要贡献，19世纪40年代，果戈理写作了揭露封建农奴制度和专制体系腐朽堕落的作品，继承并发展了普希金和莱蒙托夫开创的现实主义传统，形成了俄国文学史上的“自然派”-俄国现实主义。文艺批评家别林斯基在果戈理受到攻击时，挺身而出，以一系列论文，从革命民主主义的观点出发，在理论上阐发和捍卫了果戈理的现实主义传统。经过别林斯基的论证，由普希金开创的俄国现实主义文学传统才得以确立，以后俄国的进步作家都沿着这个传统进行创作，从而迎来了俄国现实主义文学辉煌的时代。\n\n二、发展：19世纪50、60年代\n\n这一时期平民知识分子开始加入作家和批评家行列，文学批评的民主主义色彩进一步增强，文学呈现出繁荣的局势，三要作家有冈察洛夫、屠格涅夫、车尔尼雪夫斯基和奥斯特洛夫斯基。亚历山大罗维奇·冈察洛夫是重要的现实主义作家，他的小说反映俄国社会的变化。屠格涅夫在60年代创作的小说《父与子》等作品中塑造了带有“新人”形象特征的平民知识分子的形象，这些形象表现了“多余人”向“新人”的转变过程，却不是典型的“新人”形象。尼古拉·加夫里洛维奇·车尔尼雪夫斯基是革命民主主义者、文学批评家和作家。作者借“新人”形象表达了革命民主主义者反农奴制的政治主张。车尔尼雪夫斯基的富有战斗性、思想犀利的美学和文学论文，维护了普希金、果戈理和别林斯基开创的现实主义传统，推动了俄国习实主义文学的蓬勃发展。涅克拉索夫的长诗《在俄罗斯谁能过好日子》以童话的形式真实地反映了农奴制改革后俄国农村的贫穷与落后，揭露了农奴制改革的欺骗性，号召人民起来为幸福的未来而斗争。\n\n三、鼎盛：19世纪70、80年代\n\n农奴制改革后，俄国社会矛盾更趋尖锐，农民的苦难更加深重。俄国批判现实主义作家对贵族地主和资产阶级提出更为强烈的批判，并且更加注意反映农民和城市平民的苦难。但是，由于作家世界观上的矛盾，批判现实主义作家阵营的思想分野也更趋明显。费奥多尔·米哈伊洛维奇·陀思妥耶夫斯基在本时期创作了《群魔》和《卡拉马佐夫兄弟》等作品，鼓吹宗教和“仁爱”哲学，攻击革命者，同时也暴露了俄国社会的黑暗面。谢德林在本时期写出了他的代表作《戈罗夫略夫一家》，辰示地主阶级必然灭亡的命运。列夫·托尔斯泰在70年代末至80年代初发生了世界观的剧变，转到宗法制农民的观点上来，在本时期创作了《安娜·卡列尼娜》和《复活》等名著，“对现代一切国家制度、教会制度、社会制度和经济制度作了激烈的批判”，达到了批判现实主义文学前所未有的激烈程度和深刻程度。契诃夫于80年代开始文学创作活动，他的作品反映了19世纪末至1905年资产阶级民主革命前夕俄国的社会生活，也反映了对新生活的追求和渴望。契诃夫的作品在体裁、题材艺术手法、风格上都独具一格，在世界上享有声誉。\n\n四、消退：19世纪末、20世纪初\n\n这一时期俄国社会涌动着革命的浪潮，作为19世纪文学主潮的现实主义文学开始消退，取而代之的则是无产阶级文学19世纪末期的现实主义作家、戏剧家契诃夫的创作很好地反映了时代交替时期的社会特征。与现实主义文学相比，无产阶文学在作家队伍构成、描写内容和主题上都表现出较大差异。来自工人和农民的作家成为无产阶级文学的主力，他们描写无产阶级推翻资产阶级的斗争，表达了马克思主义的革命思想，高尔基为其中的杰出代表。","keywords":"现实主义文学 民主解放运动 革命性 战斗性 民主倾向 现实主义作家群体平民知识分子 民主主义色彩** 鼎盛**时期 无产阶级文学 时代交替时期 独特性","note":"对俄国现实主义文学进行以上划分，是因为俄国文学的发展与民主解放运动密切相连，其批判性的不断增强、作家队伍构成的变化等，都是进行如此划分的重要依据。俄国19世纪文学的发展轨迹具有独特性，紧紧把握文学批判性的发展和作家队伍的构成来进行文学分期，是对俄国19世纪具体的文化环境、文学自身发展规律的把握，较好地切合了文学实际，有利于整体掌握文学发展格局。"},{"id":"140","stars":"★★★","title":"斯丹达尔小说创作的主题和艺术特色","body":"一、作品主题\n\n（一）斯丹达尔擅长以政治斗争和不同势力集团之间的斗争，去反映某一历史时期的本质。如《红与黑》描写复辟王朝\n\n时期不同政治派别的矛盾、贵族与平民的尖锐冲突、统治者企图让外国势力干预政局，以此反映波旁王朝的反动和腐朽。\n\n（二）斯丹达尔着力于通过主人公的命运去表现时代的变化。《红与黑》中的于连企图改变平民地位，不择手段地向上爬，最后遭到贵族阶级的扼杀。《帕尔马修道院》中的法布利斯想摆脱专制统治、争取幸福和爱情而碰壁，虽然最后做了大主教，却没有达成自己的目的。\n\n（三）斯丹达尔作品中的意大利题材引人注目，斯丹达尔长期住在意大利，对这个国家情有独钟。《帕尔马修道院》写的是意大利一个小公国。《意大利遗事》对16世纪至18世纪的意大利上层社会有独到的描绘，通过贵族少女的爱情悲剧、大贵族的胡作非为和教皇亲属的罪行，批判封建社会的黑暗。其中的人物具有“意大利”性格特征。斯丹达尔的早期著作如《意大利游记》《意大利绘画史》《罗马、那不勒斯和佛罗伦萨》《罗西尼传》《罗马漫步》等大半是意大利题材。\n\n二、艺术特色\n\n（一）斯丹达尔是世界上第一个自觉地运用心理分析的小说家。他的心理分析可以称为心理独白。在他的作品中，有时人物作连续的思素，有时人物突然下个决心，有时是短暂的激动，有时则是浮想联翩。斯丹达尔以科学的冷漠态度去分析人物心灵的活动，尤其是着力表现人物的内心斗争和人物对与之不断发生冲突的社会所抱有的态度。斯丹达尔的心理分析经常表现为作者插话。这类插话有时与人物当时的心理紧密相连，有时则是对人物的行动发表自己的看法，像古希腊戏剧中的歌队或者纪录片中的解说词。\n\n（二）斯丹达尔采取客观的叙述方法。例如在《帕尔马修道院》开头对滑铁卢战场的描绘中，斯丹达尔不像雨果那样描绘战场的全景和历史背景，他只描写战役的部分情景，他的所见所闻带领读者亲临战场，这已成为描绘战争的经典例子。从结构来看，小说主干突出时间和地点迅速变换，人物忽隐忽现，既与流浪汉体小说有相近之处，又有更多的不同。\n\n（三）斯丹达尔的风格极其纯净、简洁。《红与黑》就是简洁、清新、自然、流畅风格的典范。他避免一开始就完整地描写环境，或者描绘人物的全身像。他的方法是让主人公逐渐发现周围的世界。他几乎不写景，不描写室内布置，也很少描绘肖像。他的行文舒卷自如，巴尔扎克和福楼拜都达不到这种地步。\n\n（四）斯丹达尔的人物塑造也非常成功。他的主人公都是强者。他们要追求幸福，认为这是天性使然。他们个性坚强，激情满怀，毅力过人，企图使世界屈服于自己的准则。斯丹达尔笔下的次要人物也十分生动，连出现过一两次的人物也能给读者留下深刻印象。如《红与黑》中的咖啡店女招待阿芒德·比内、年轻的阿格德主教、给于连提供情书的科克索夫亲王，都是很有特点的人物。\n\n★★141．斯丹达尔《红与黑》为什么被称为爱情小说，风俗小说，政治小说（思想内容，25辽宁大学）★★★★★★★\n\n一、爱情小说\n\n斯丹达尔从批判封建婚姻的角度去描写于连的两次爱情。\n\n（一）德·雷纳尔夫人在于连身上发现了平民阶级的优异品质：具有进取心、自尊心强、不愿屈服于贵族之下、聪明能干、感情炽烈、一旦尝到了爱情便投身其中。她爱上于连的行动是对封建婚姻的反叛。\n\n（二）玛蒂尔德愿意放弃贵族门第与于连结合，不顾自己的名誉跑到维里埃尔四处活动，为搭救于连而不遗余力，即使她的行动中有着矫情的成分，但她的表现是违反贵族阶级的道德准则和行为规范的。\n\n（三）至于于连，斯丹达尔描写了他的平民反抗意识，他把自己的行动看作“战斗”，要完成自己的“责任”，以报复市长对他的蔑视。他受到德·雷纳尔夫人热烈纯真的爱情感染，产生了相应的爱情。他的平等的意识非常强烈，因此，他十分警惕她的贵族意识的流露。\n\n于连对玛蒂尔德的爱情掺杂了较多的理智成分和目的，他企图对那些贵族青年挑战，并通过玛蒂尔德向上爬。他的内心对玛蒂尔德缺乏真正的爱情，因为他并不喜欢她的性格，然而他的野心支配了他的行动。\n\n二、政治小说\n\n斯丹达尔通过对乞丐收容所和神学院的描写，暴露了当时各种机构的腐败、勾心斗角和金钱的罪恶。人人都想着如何捞钱，卖官鬻爵；没有人不腐蚀别人，又被别人腐蚀。从法官到狱卒，莫不如此。钱能打通各种关节。在这样的社会背景下，贵族与平民的矛盾异常尖锐。贵族总是害怕罗伯斯庇尔会卷土重来，这种可能性主要出现在像于连这样的下层阶级人物身上，于连的死表现了贵族阶级与平民的尖锐对立。\n\n（二）描绘复辟王朝时期激烈的政治斗争\n\n当时，党派斗争剑拔弩张：极端保王党不满于君主立宪，妄想把法国拉回到绝对君主时代；自由党中不少人成为百万富翁，渴望着权力；君主立宪派遭到来自各方的攻击，教会各派联合各个党派，兴风作浪。小说以真实政治为蓝本，对当时的激烈政治斗争作了全面描绘。另外，小说大量提到保王派报纸《日报》《法兰西报》和反对派报纸《宪政报》。当时报纸盛行，是党派活动的晴雨表。这一幅幅复杂的政治斗争的图景，形象地反映了形势的混乱，预示了山雨欲来风满楼的局势。\n\n（三）对贵族政权企图依靠外国势力干预政局的揭露\n\n第21至23章中对贵族政权企图依靠外国势力干预政局的揭露，是《红与黑》对现实抨击最尖锐的描写。《秘密记录》一章是对1818年“秘密备忘录”事件的影射。当时的内阁首相波利涅克在小说中成为与会者奈瓦尔。他们提出用暗杀或大屠杀的手段来维持政权。最后他们一致同意让神圣同盟进行军事干预。与会者面目可憎，矛盾重重，勾心斗角，显示出这些保王党分子的外强中干。这几章将复辟王朝狗急跳墙的卖国企图暴露无遗。\n\n三、风俗小说\n\n《红与黑》的风俗描写广泛而深入，提供了复辟王朝时期法国社会的一幅真实画卷。故事发生在三个地方：汝拉山区的小城维里埃尔、贝尚松的神学院和巴黎的德拉莫尔侯爵府。这三个地方概括了当时法国的风貌。\n\n（一）维里埃尔是外省城市的写照，它虽然位于偏僻山区，可是已经受到现代社会的熏染，兴起了小型工业。随着工业的兴起，唯利是图也就成了人们的行动准则。如乞丐收容所这个福利机构就成了瓦勒诺发财致富的工具。\n\n（二）神学院是社会的另一个缩影。它像监狱一样阴森可怖，行李要经过仔细搜查，信件往往被扣压。神父、学生都互相倾轧，虚伪做作笼罩着一切。由于院长和副院长有矛盾，选择谁做自己的忏悔神父就成了重要抉择，关系到依附哪一派。\n\n（三）德·拉莫尔侯爵府是上层社会的写照。这里是巴黎上流社会的活动中心之一，也是“阴谋和伪善的中心”。侯爵是个精明干练的政治家，复辟王朝的红人。这个贵族府第在灯烛辉煌的外表下，不免露出了衰败的征兆。贵族们敌视自由思想，深怕再出现罗伯斯庇尔和拿破仑式的人物，表现了他们的虚弱和反动。","keywords":"主题 集团斗争反映本质 主人公命运表现时代变化 意大利题材 艺术特色 心理分析 客观叙述风格纯净简洁人物塑造成功\n爱情小说 政治小说 风俗小说","note":"斯丹达尔的小说创作主题主要有三，整体特征是喜欢以小见大，通过政治斗争和人物的命运来反映时代，并钟情意大利题材。而他的艺术特色，我们则要从手法、叙述方法、风格、人物塑造四个维度去分析，要注意紧密结合作品。\n《红与黑》的主题主要有三层，其中最重要的是“政治小说”这一层面，可能会以“谈谈《红与黑》的政治倾向性”这样的题目出现，大家要特别注意。"},{"id":"141","stars":"★★★★★","title":"斯丹达尔《红与黑》为什么被称为爱情小说，风俗小说，政治小说（思想内容，25辽宁大学）","body":"一、爱情小说\n\n斯丹达尔从批判封建婚姻的角度去描写于连的两次爱情。\n\n（一）德·雷纳尔夫人在于连身上发现了平民阶级的优异品质：具有进取心、自尊心强、不愿屈服于贵族之下、聪明能干、感情炽烈、一旦尝到了爱情便投身其中。她爱上于连的行动是对封建婚姻的反叛。\n\n（二）玛蒂尔德愿意放弃贵族门第与于连结合，不顾自己的名誉跑到维里埃尔四处活动，为搭救于连而不遗余力，即使她的行动中有着矫情的成分，但她的表现是违反贵族阶级的道德准则和行为规范的。\n\n（三）至于于连，斯丹达尔描写了他的平民反抗意识，他把自己的行动看作“战斗”，要完成自己的“责任”，以报复市长对他的蔑视。他受到德·雷纳尔夫人热烈纯真的爱情感染，产生了相应的爱情。他的平等的意识非常强烈，因此，他十分警惕她的贵族意识的流露。\n\n于连对玛蒂尔德的爱情掺杂了较多的理智成分和目的，他企图对那些贵族青年挑战，并通过玛蒂尔德向上爬。他的内心对玛蒂尔德缺乏真正的爱情，因为他并不喜欢她的性格，然而他的野心支配了他的行动。\n\n二、政治小说斯丹达尔通过对乞丐收容所和神学院的描写，暴露了当时各种机构的腐败、勾心斗角和金钱的罪恶。人人都想着如何捞钱，卖官鬻爵；没有人不腐蚀别人，又被别人腐蚀。从法官到狱卒，莫不如此。钱能打通各种关节。在这样的社会背景下，贵族与平民的矛盾异常尖锐。贵族总是害怕罗伯斯庇尔会卷土重来，这种可能性主要出现在像于连这样的下层阶级人物身上，于连的死表现了贵族阶级与平民的尖锐对立。\n\n（二）描绘复辟王朝时期激烈的政治斗争\n\n当时，党派斗争剑拔弩张：极端保王党不满于君主立宪，妄想把法国拉回到绝对君主时代；自由党中不少人成为百万富翁，渴望着权力；君主立宪派遭到来自各方的攻击，教会各派联合各个党派，兴风作浪。小说以真实政治为蓝本，对当时的激烈政治斗争作了全面描绘。另外，小说大量提到保王派报纸《日报》《法兰西报》和反对派报纸《宪政报》。当时报纸盛行，是党派活动的晴雨表。这一幅幅复杂的政治斗争的图景，形象地反映了形势的混乱，预示了山雨欲来风满楼的局势。\n\n（三）对贵族政权企图依靠外国势力干预政局的揭露\n\n第21至23章中对贵族政权企图依靠外国势力干预政局的揭露，是《红与黑》对现实抨击最尖锐的描写。《秘密记录》一章是对1818年“秘密备忘录”事件的影射。当时的内阁首相波利涅克在小说中成为与会者奈瓦尔。他们提出用暗杀或大屠杀的手段来维持政权。最后他们一致同意让神圣同盟进行军事干预。与会者面目可憎，矛盾重重，勾心斗角，显示出这些保王党分子的外强中干。这几章将复辟王朝狗急跳墙的卖国企图暴露无遗。\n\n三、风俗小说\n\n《红与黑》的风俗描写广泛而深入，提供了复辟王朝时期法国社会的一幅真实画卷。故事发生在三个地方：汝拉山区的小城维里埃尔、贝尚松的神学院和巴黎的德拉莫尔侯爵府。这三个地方概括了当时法国的风貌。\n\n（一）维里埃尔是外省城市的写照，它虽然位于偏僻山区，可是已经受到现代社会的熏染，兴起了小型工业。随着工业的兴起，唯利是图也就成了人们的行动准则。如乞丐收容所这个福利机构就成了瓦勒诺发财致富的工具。\n\n（二）神学院是社会的另一个缩影。它像监狱一样阴森可怖，行李要经过仔细搜查，信件往往被扣压。神父、学生都互相倾轧，虚伪做作笼罩着一切。由于院长和副院长有矛盾，选择谁做自己的忏悔神父就成了重要抉择，关系到依附哪一派。\n\n（三）德·拉莫尔侯爵府是上层社会的写照。这里是巴黎上流社会的活动中心之一，也是“阴谋和伪善的中心”。侯爵是个精明干练的政治家，复辟王朝的红人。这个贵族府第在灯烛辉煌的外表下，不免露出了衰败的征兆。贵族们敌视自由思想，深怕再出现罗伯斯庇尔和拿破仑式的人物，表现了他们的虚弱和反动。","keywords":"爱情小说 政治小说 风俗小说","note":"《红与黑》的主题主要有三层，其中最重要的是“政治小说”这一层面，可能会以“谈谈《红与黑》的政治倾向性”这样的题目出现，大家要特别注意。"},{"id":"142","stars":"★★★★★","title":"试分析于连的人物形象（26吉林大学）","body":"于连是法国波旁王朝复辟时期受压抑的小资产阶级青年的典型形象，是个人奋斗者的典型。他出身低下，受到启蒙思想的影响，希望自己能施展才华、建功立业，并开始了个人奋斗的人生。在实现个人理想的过程中，于连多层次、矛盾的性格得到了揭示。\n\n一、强烈的自我观念、平等意识和反抗精神\n\n在启蒙思想的影响下，于连形成了强烈的自我意识，并由此产生出平等观念、反抗意识与个人野心。于连个性刚强，充满激情，富有毅力。他虽然表面长得文弱，但是“心里竟藏着宁可死一千次也要飞黄腾达的不可动摇的决心”。外表和内心的强烈反差，是于连形象的一大特点。\n\n于连出身于木匠家庭，地位低下，常受人歧视，即使在家里，也因不是一块当木匠的好料而常遭父兄的打骂。于连不甘心过这种受欺侮的生活，几次想离家出走，这表现出他对独立人格的渴求。当父亲要他到德·瑞那市长家当家庭教师时，他的回答是：“我不愿当奴仆。”在市长家当家庭教师的过程中，他对门第观念极强的市长先生极为反感，在骄横的市长把他当仆人一样训斥时，于连“眼里射出残酷可怕的复仇的模糊希望”，愤然回答说：“先生，没有你我也不会饿死。”为了报复、惩罚市长，他在夜晚乘凉时握住了市长夫人的手。由此可以看到他那强烈的自我观念、平等意识和反抗精神。\n\n二、虚伪的妥协性\n\n于连从小崇拜拿破仑，对拿破仑凭自己的才能、“身佩长剑做了世界的主人”佩服得五体投地，时时追怀和向往不计资历、不讲血统而单凭个人才能便可以取得社会地位的拿破仑时代，并且怀有30岁当将军的雄心壮志。然而，拿破仑失败后\n\n的复辟时代，这条路已走不通，但是，像于连这样有才能的平民青年如同种子要发芽一样，仍然要寻找向上爬的机会。他看到主教的丰厚收入，便想到当教士，于是背诵《圣经》，愿到神学院去，忍气吞声想适应那里的生活。他看到侯爵能让他改变平民的命运，便甘心为他效劳，不再反抗了。个人野心支配着他的一切行动。\n\n直到发现贵族阶级对平民存在根本的敌视以后，他才又恢复了反抗精神，而且反抗的强烈程度是前所未有的，宁死也不肯妥协。于连的多变反映的是复辟王朝时期谋求个人奋斗的平民青年的特点。\n\n总之，于连是一个具有双重人格和双重精神的人物：他既有反抗精神，又很容易屈服；他既憎恨贵族的卑劣，又不惮玷污自己的双手；他既看重别人的善良正直，又信奉虚伪的道德观；他既崇拜拿破仑，又能随意改变自己的奋斗方向，走一条截然相反的道路；他既热衷于向上爬，又愤然选择了死亡，不肯向卑污的现实让步。这种双重性构成了于连性格和思想的复杂性。这个形象的丰富性标志着斯丹达尔的小说艺术所达到的高度成就。","keywords":"反抗 妥协 双重人格","note":"于连作为名作《红与黑》中的主人公，是各个院校常考的重点，浙江师范大学就在23年对其进行了考查。于连的性格发展跟环境有着密切关系，经历了从反抗到妥协再到反抗的变化。这是因为自我观念始终是于连思想性格的底蕴，因而，在不同的生存环境里，他有不同的表现。内因与外因共同支配着于连的行动，这也体现了典型环境中的典型人物原则，需要我们有所掌握。"},{"id":"143","stars":"★★★","title":"《红与黑》的艺术特色","body":"一、塑造典型环境中的典型性格\n\n斯丹达尔是自觉的现实主义作家，其创作活动有着明确的现实主义诉求，对复辟时期法国社会的深入观察和研究，又使他能比较准确地把握时代的本质特征。小说里所描写的唯利是图的维里埃尔、人间地狱般的贝尚松神学院和“阴谋与伪善的中心”巴黎德拉莫尔侯爵府，是揭示作品主题、展示时代特征、表现人物性格的典型环境。\n\n作者善于使人物性格的形成和发展与人物活动的环境紧密相连，典型的环境为人物性格的形成和发展提供了合理的依据。于连一生的奋斗，主要是在上述三个典型环境中进行的，他的性格，也随着环境的变迁而流变，揭示性格形成与发展的社会原因，也就达到了再现社会风貌，表现时代精神的目的。不过，于连的性格演变并不是被动地由环境决定的，而是既受制于环境的作用，又决定于性格系统内部的驱动力，是内因与外因共同作用的结果；环境的作用是性格演变的前提，性格系统内部的驱动力是性格演变的根据。因此，在斯丹达尔笔下，性格与环境的关系是辩证的。这使得《红与黑》这部作品不仅塑造了一系列栩栩如生、富有鲜明个性的典型形象，而且使整部作品具有浓郁的时代气息。\n\n二、深刻细腻的心理描写\n\n《红与黑》的心理描写开创了现实主义内倾性的方向。斯丹达尔的心理描写通常十分简短，却是多种多样的。有时作者是以客观的态度表现人物对环境压迫的直接反应，有时是作者的分析，有时人物在代表作者说话，有时作者干脆直接发表见解。这种既深入人物内心，又始终待在他们身边的写法，是斯丹达尔最拿手的笔法。它显示出很强的客观性，与浪漫派作家强烈的主观性截然不同。进行这些心理描写的既不是全能的叙述者，也不是无动于衷的观察家。他与人物的眼睛一起观看，与人物一起感觉，即使不是与人物的想法完全一样，但他通过同人物身份一致，尽可能地表现出人物的思路发展过程。\n\n三、戏剧性冲突\n\n斯丹达尔的“观念富有戏剧性”，他善于运用戏剧性冲突场面来展示人物性格，推动情节的发展。于连到哇列诺家赴宴的一场，写得有声有色，富于戏剧性。哇列诺及其周围人的鄙俗与无知，这位暴发户洋洋得意的神态及其背后的丑恶，于连的思想反应和心理活动，在这戏剧性场面中都得到生动的刻画和充分的展示。\n\n四、向现代开放结构过渡\n\n《红与黑》继承了《汤姆琼斯》的布局手法，以于连的爱情、仕途为发展线索，重点描写了他在小城、省城、巴黎和监狱4个场景；又克服了《汤姆·琼斯》拖沓的弊病，主干明显，疏密得当。《红与黑》摆脱了纯粹按照时间延续安排情节的格局，向着“空间”长篇小说过渡。作品表现的是1830年这样一个特定时代在空间和时间上的心灵变化，时间、地点的迅速变换，人物的忽隐忽现，呈现出现代因素。于连得知德·雷纳尔夫人的揭发信后，从巴黎赶到小城，至少得三四天，甚至一周，亢奋情绪很难持续如此之长，这一情节形成的时空上的多层化，使小说平添了现代小说“心理结构”的特征。\n\n五、叙述简洁明快，语言清丽朴素、自然流畅\n\n斯丹达尔反对古典主义的矫揉造作，而强调文学创作要表达自然真实的感情。《红与黑》中铺陈描写的成分极少，而往往以简明、概括的笔触描绘出引人入胜的画面。如写于连初到贝尚松神学院时，作者开门见山地写神学院大门上“那个镀金\n\n的十字架”，接着写开门者“相貌古怪”“绿眼珠”，继而写院内的阴暗沉寂，这简约的文字，就把神学院这个阴森恐怖充满罪恶的环境传神地勾画出来了。《红与黑》的语言也是口语化的，朴素而自然。斯丹达尔对自然、朴素、简洁、明快之文风的追求，继承了17、18世纪法国散文的风格。","keywords":"典型环境中的典型性格 心理描写 戏剧性冲突 现代开放结构 叙述简洁明快 语言朴素自然","note":"《红与黑》作为现实主义文学的奠基作，以新的艺术风格和艺术技巧，开创了一个新的文学时代，它表现出了现实主义文学的一般特征。类似的题目，大家都可以结合现实主义文学的特点与具体作品进行分析作答。"},{"id":"144","stars":"★★★★","title":"谈谈巴尔扎克批判现实主义小说的基本特征","body":"一、思想特征\n\n对于巴尔扎克的思想和创作，列宁曾给予过中肯评价，一方面高度称赞他为“伟大艺术家”和思想家，另一方面也指出了其作品、思想中的矛盾。\n\n（一）整体再现法国社会的历史现实\n\n巴尔扎克受到自然科学的影响，成了唯物论的信仰者，从整体发展的角度看待社会，认识到经济对社会发展的制约作用，并能由此把握资本主义制度必然取代封建制度的时代发展方向。所以，在小说创作中，他以一种整体把握的方法来描写法国社会风俗的发展历史，准确地展示了资产阶级对贵族阶级的胜利，着重刻画了环境对人物思想和行为的影响。例如，在其代表作《人间喜剧》中，他就描绘了三种形象化的历史。\n\n（二）宣扬宗教的作用，同情贵族命运\n\n作为中下层资产阶级的代表，巴尔扎克在政治上主张建立君主立宪制，实行强权政治，既抑制大资产阶级，发展中小资产阶级；又控制工人运动，反对人民参与政权。从这样的政治观出发，他认识到宗教的作用，宣扬用宗教来医治社会，调和矛盾。所以，他从人性论和宗教思想出发，把封建宗法制社会的道德观予以美化、抽象，对贵族阶级予以同情，对天主教的作用大力鼓吹，反对工人、农民执政，维护现存社会，这或多或少削弱了作品的揭露意义。但是唯物主义的思想和现实主义的创作观都为其正确地把握历史发展方向起到了积极作用，从而更多地在创作中展现了其思想中的进步内容。\n\n二、艺术特征\n\n巴尔扎克在艺术上也取得了巨大成就。作为现实主义的奠基人之一，巴尔扎克提出了一整套现实主义美学，要点如下：\n\n（一）文学反映整个历史时代\n\n巴尔扎克的哲学思想认为世界是一个统一体，存在多样性，但彼此相连，由此出发，他要求文学反映整个历史时代。在表现社会的广度和深度方面，巴尔扎克取得了超越前人的巨大成就。如《人间喜剧》全方位地反映了法国社会方方面面的生活，形象化地展示了贵族阶级的衰亡史、资产阶级的发家史和金钱的罪恶史。\n\n（二）真实再现现实\n\n巴尔扎克认为艺术的任务在于再现自然，文学中的真实不等于生活中的真实，需要经过艺术加工，进行选择，从而令人觉得是真实的；他严格遵循真实地再现现实的原则，暴露社会的丑恶和黑暗面多于理想的阐发，他的作品绝大部分以悲剧结尾。如《人间喜剧》通过真实的细节描写，提供了法国社会环境的图景，展示了时代的面貌。\n\n（三）塑造典型人物\n\n巴尔扎克强调艺术必须创造典型，亦即人物要典型化，典型要个性化，通过典型去反映现实。他创作出各个阶层的人物在《人间喜剧》中出现的2000多个人物中，性格鲜明的典型有数十个。他塑造人物的方法符合“典型环境中的典型人物”的现实主义原则。\n\n（四）环境对人物的决定性作用\n\n巴尔扎克发展了狄德罗的“美是关系”的观点，看到环境对人物的决定性作用，环境既是人物活动的舞台，又是产生人物的思想和行动的基础。在塑造人物的过程中，他注重人物命运变化、性格发展与环境的关系，从而使人物更具代表性。\n\n（五）幻想家\n\n巴尔扎克不仅是一个严格而缜密的观察家，而且像波德莱尔所说的，是一个热烈的幻想家；他具有“第二视觉”，“生活在持续不断的幻觉中”，一进入写作，各种想法便像干军万马纷至沓来。\n\n（六）滑稽丑怪的人物和社会现象\n\n巴尔扎克十分注意滑稽丑怪的人物和社会现象，看到表面与本质之间存在一致和矛盾，也看出其中蕴含的美学意义。如\n\n在《人间喜剧》中，巴尔扎克通过对金钱至上的一系列丑恶现象的描绘，把握了金钱时代人性异化的本质特征。\n\n（七）结构和叙述方面突破前人\n\n巴尔扎克在小说结构和叙述方面进行了富有成效的探索。他的小说有序幕、展开、高潮、结尾，往往冲突激烈，戏剧性很强。他的小说不少以陈述开始介绍环境，但也有多种变化，或从谈话开始，或以描写肖像作引子，有时则先写家庭变迁。有的哲理小说没有什么情节，而以精彩的议论取胜。巴尔扎克的夹叙夹议大多有声有色，充满智慧。他的短篇小说多半以第一人称来叙述，以小说人物讲故事的方式来引出主要情节，但各篇又有不同的变化。从叙事学的角度看，或者叙述者大于人物，他具有全知视角，或者叙述者等于人物，或者叙述者小于人物，巴尔扎克大半采用第一种和第二种叙述语态。","keywords":"整体再现法国社会的历史现实 宣扬宗教的作用 同情贵族命运 文学反映整个历史时代 真实再现现实 塑造典型人物 环境对人物的决定性作用 幻想家 滑稽丑怪的人物和社会现象 结构和叙述","note":"巴尔扎克以其甘当法国社会的“书记”的创作态度，为读者提供了一部法国社会特别是巴黎上流社会的卓越的现实主义历史，全面而深刻地反映了19世纪法国社会的历史。巴尔扎克的小说无论是思想内容还是艺术成就，都达到了现实主义小说的顶峰。在这些艺术特点中，最重要的是三四两点，可以合并为“典型环境中的典型人物”原则。"},{"id":"145","stars":"★★★","title":"巴尔扎克《人间喜剧》的思想内容","body":"巴尔扎克将《人间喜剧》分为三类：“风俗研究”“哲学研究”“分析研究”。其中“风俗研究”主要描写法国当代社会风貌，内涵最为丰富，包括的小说也最多，是主体部分。在这一部分里，作者根据作品反映生活的侧重点，又划分为六个场景：“私人生活场景”，代表作有《高利贷者》《夏倍上校》和《高老头》；“外省生活场景”，代表作有《欧也妮·葛朗台》《幻灭》；“巴黎生活场景”，代表作有《纽沁根银行》《贝姨》：“政治生活场景”，代表作有《一件恐怖时代之轶事》；“军事生活场景”，代表作有《朱安党人》；“乡村生活场景”，代表作有《农民》《乡村医生》。这是一部“百科全书”式的作品，它是法国文学史上规模空前内容丰富的现实主义杰作，是一部包罗万象的社会风俗史。\n\n一、封建贵族阶级的没落衰亡史\n\n在资产阶级金钱势力的逼攻下，贵族阶级节节败退，逐步走向死亡。他们有的在资产阶级的金钱腐蚀下转变成了资产阶级，如贵族青年拉斯蒂涅经受不住金钱的诱惑堕落为资产阶级野心家；有的自知敌不过资产阶级，含恨退出了历史舞台，如名门贵族鲍赛昂夫人，在情场上抵挡不住金钱的进攻，最后败在资产阶级手下，把上流社会的特权让给了纽沁根太太等新兴资产阶级。巴尔扎克按现实主义方法如实地描写当时的历史事实，因而揭示了贵族阶级必然要败在资产阶级手下，最终退出历史舞台的命运。就这样，《人间喜剧》真实地描写了法国历史上封建贵族和资产阶级之间的曲折斗争。但是，在这些描写中，巴尔扎克对贵族阶级寄予了深深的同情，为他们唱了一曲无尽的挽歌。这一方面说明了巴尔扎克头脑中残留着贵族观念，他有一种对旧阶级、旧时代的依恋之情。另一方面，从深层象征意蕴上看，一些贵族形象又是人欲横流时代人的理性与善的象征，在这些形象身上寄托了作者对异化时代人性复归的一线希望。\n\n二、资产阶级的罪恶发家史\n\n资产阶级的发家史，是充满罪恶的。巴尔扎克在《人间喜剧》中，以现实主义笔触，通过一系列资产阶级典型形象的塑造，真实地展示了他们的罪恶历史。《高利贷者》的主人公高布赛克，依靠放高利贷的方式获取利润，是资本原始积累时期资产者的典型。《欧也妮·葛朗台》中的葛朗台，一身兼有高利贷者、银行家、工商业主金融资本家的特点，是资本原始积累时期向自由竞争过渡时期的资产阶级典型。《纽沁根银行》中的纽沁根开办银行，用资金的不断周转来获取利润，且能利用法律保护银行，搞假倒闭牟取暴利，他是资本主义高度发展时期金融资本家的典型。这一系列形象各自代表着资产阶级发展过程中的断代史，联成整体时就构成了资产阶级的整个罪恶发迹史。\n\n三、人被异化的历史悲剧\n\n《人间喜剧》中，真正的“英雄”是灵魂交给了金钱上帝的人，被金钱煽起的情欲是小说的真正主人公。葛朗台老爹一生只恋着金钱，从来是认钱不认人；高老头的女儿们领受了父亲的金钱而抛弃父爱，踩着父亲的尸体登上了巴黎上流社会的高层；纽沁根在金钱的战争中，用无数人的尸体垒起了他银行家的高楼大厦；目西安出卖灵魂而得以平步青云；大卫为保持灵魂的纯洁而身败名裂，锒铛入狱......巴尔扎克在这艺术性的集中和夸张中把握了金钱时代人性异化的本质特征。\n\n巴尔扎克的小说还以一种象征隐喻的模式表述了人类生存发展中的悖谬现象：历史的进步是靠财富的创造来推动的，而财富创造的过程必然伴随着人性的失落；金钱所点燃的情欲驱动着人们去疯狂、忘我地积聚财富，而情欲之火又烤干了人性的脉脉温情，也耗尽了追求者的精力与生命；人类在与物质世界的不懈斗争中不断征服自然，创造物质文明，而与之抗衡的对象又不断吞噬着人类，使人沦为物的奴隶。在人类发展进程的“对物的依赖”阶段尤其如此，这是人类文明发展所要付出\n\n的沉重代价。巴尔扎克由此思考与探索着人的生存与发展的问题。\n\n此外，《人间喜剧》还真实地反映了当时的经济状况，其价值堪比职业历史学家、经济学家和统计学家提供的材料。《人间喜剧》也描写到底层人物，尤其塑造了共和主义的英雄克雷斯蒂安。这是巴尔扎克政治上的死对头，但他看出这是未来真正的人。在创作中摆脱自己的政治观点，无疑是巴尔扎克的现实主义的胜利。","keywords":"贵族阶级的没落衰亡史 资产阶级的罪恶发家史 人被异化的历史悲剧 经济状况 底层人物","note":"《人间喜剧》既是一部资产阶级逐渐取代贵族的罪恶发家史，又是一部贵族阶级的没落史，还表现了当时金钱至上能够左右一切人际关系的社会风气，真实而深刻地反映了当时的经济状况。其中前两点是有机地联系在一起的。另外，“《人间喜剧》”名词解释出现频率较高，大家要适当关注。"},{"id":"146","stars":"★★★★","title":"《人间喜剧》的艺术特色","body":"一、分类编排\n\n《人间喜剧》有90多部作品，2400多个人物。巴尔扎克将其分类整理为三类：“风俗研究”“哲学研究”“分析研究”其中“风俗研究”主要描写法国当代社会风貌，内涵最为丰富，包括的小说也最多，它成了《人间喜剧》的主体部分。在这一部分里，作者根据作品反映生活的侧重点，又划分为六个场景：“私人生活场景”，代表作有《高利贷者》《夏倍上校》和《高老头》；“外省生活场景”，代表作有《欧也妮·葛朗台》《幻灭》；“巴黎生活场景”，代表作有《纽沁根银行》《贝姨》；“政治生活场景”，代表作有《一件恐怖时代之轶事》；“军事生活场景”，代表作有《朱安党人》；“乡村生活场景”，代表作有《农民》《乡村医生》。\n\n二、由外到内、广阔而深刻地反映生活\n\n巴尔扎克把文学作为研究社会的手段，主张真实地再现现实，强调艺术描写与现实生活的契合和对位关系，他在文学创作上为自己设立的追求目标首先是再现时代风俗史，做法国历史的“书记员”。但是，巴尔扎克同时也关心人的精神与心灵世界，只是，他往往从描写所处的环境和外部形态开始；他更注重于研究人的心灵怎样在社会外部物质形态的刺激影响下产生惊人的变化，尤其是金钱时代，人的灵魂怎样在金钱的催化下引起奇妙的“裂变”。所以，真实的社会外部形态是巴尔扎克小说所呈现的艺术世界的第一层面，金钱时代人的情感和心理状态是第二层面；第一层面因第二层面的存在显示其艺术的本质的真实，而在第一层面的“外壳”内包藏的是更为广阔和躁动不安的精神宇宙。巴尔扎克既是19世纪上半期的法国社会的“书记员”，又是金钱时代人类灵魂的发掘者。\n\n三、强调典型环境的决定性作用\n\n在巴尔扎克的小说中，对人的生存环境的描写拥有极为重要的地位，无论是物质环境还是社会环境，对人的性格都起着决定性的作用。他笔下的主人公，几乎始终处于物质环境和社会环境的重重包围之中。他们与环境有搏斗，但又无法高于环境和超越环境，而往往是被环境战胜、改造和重塑。他们与环境搏斗的过程，在终极意义上成了向环境学习并顺应环境的过程，性格的形成、发展和演变依赖于、受制于环境，甚至是环境的直接引申。《高老头》中的拉斯蒂涅来到巴黎后，一开始就对环境的诱惑失去抗衡能力，在环境的刺激下，他一步步走向了堕落；《幻灭》中的吕西安经不住环境的诱惑而出卖灵魂.他们的性格是环境的产物。巴尔扎克对人与环境之关系的理解是缺乏辩证法思想的，但这也体现着他对物欲横流、人被普追“物化”的现实世界的洞察与理解，有其深刻性的一面。\n\n四、典型形象的塑造\n\n在欧洲文学史上，没有任何一位作家塑造的人物形象能像巴尔扎克笔下的这样宏大充实，2400多个人物活跃在“巴尔扎克社会”里，其中生动而具有典型意义的就不下六七十个。为此，他使用了多种艺术手段：\n\n（一）巴尔扎克善于按照典型化的原则塑造人物，既注意选取同类人物的典型特征集中在一个人物身上，又注意刻画人物的独特个性，因此，成功的形象都是共性和个性的统一体。\n\n（二）巴尔扎克喜欢夸张地描写人的情欲，把某种情欲强化，凝聚在一个人的身上，让这种情欲排除其他感情，发展到病态程度，在这种文学形象的画廊里增加了一批著名的“偏执狂”。如父爱成狂的高里奥，阴险偏狭的贝姨等。\n\n（三）巴尔扎克通过人物再现法，让同一人物在几部作品中出现，每部作品中只表现这个人物的某一段或某一侧面的生活，几部作品合在一起就完成了对这一人物生活史的描写，构成一个完整形象。在巴尔扎克的《人间喜剧》中，有460多个人物是重复出现的，分散在75部小说中，有些重要人物重复次数达二三十次之多。\n\n（四）巴尔扎克也善于通过细节、肖像、动作、对话来表现人物的精神境界，刻画丰满鲜明的典型形象。\n\n五、网状结构模式\n\n19世纪以前的西方小说，基本上采用“流浪汉小说”的结构模式，以单一线索纵向直线型演进为特色，通过一条纵向线索贯穿一个个独立的小故事，来反映生活的流程，巴尔扎克小说则通过众多的情节线索有机的交织，形成纵横交错的情节网络，立体地展示生活的横断面，这是一种网状结构模式，例如，《欧也妮·葛朗台》就写了欧也妮的故事、老葛朗台的故事、查理的故事、拿依的故事、蓬风所长的故事、克罗旭的故事等，其中又以欧也妮和老葛朗台的故事为中心，其余的情节都和两条中心线交织在一起，展现索漠城横向的生活面貌。","keywords":"分类编排 由外到内 典型环境 典型形象 网状结构","note":"上述艺术特征每点都有可能单独设题，要重点掌握。第一点虽不会单独提问分类，但是会与《人间喜剧》的内容结合在一起，考查作品的内容主题，也是需要同学们有所了解的。此外，“分类整理法”“人物再现法”常考名词解释，大家要注意积累一下。"},{"id":"147","stars":"★★★","title":"结合具体文本分析《人间喜剧》体现出的金钱观（25兰州大学）","body":"巴尔扎克的《人间喜剧》是由九十多部独立而又有所联系的小说组成的巨著，被誉为“资本主义社会的百科全书”，以全景式笔法描绘了19世纪法国社会的金钱帝国，深刻揭示了资本主义崛起时期金钱对人性的腐蚀、对伦理的颠覆以及对社会的重构。这部作品的金钱观并非简单的道德批判，而是通过具体文本中的人物命运、情节冲突和细节描写，呈现出一幅复杂而立体的“金钱社会学”图景。\n\n一、正面金钱观\n\n（一）金钱造福人类：在《乡村医生》《乡村教士》中，作者描绘了理想的社会蓝图，村民合理开发资源，富人兴办工厂、农场，村民付出劳动力，共同创造财富，促进社会可持续发展。如巴尔扎克所言，“金钱流通在所有人心中有了挣钱欲望”，肯定了人们通过辛勤劳动获取金钱、创造幸福生活的方式。在《金眼女郎》中，也提到兢兢业业的工人、勤劳的小型资产者、坚韧的文学家等理智者通过自身努力致富，展现了金钱可以成为人们积极生活、实现自我价值的动力。\n\n（二）金钱发展事业：在确定欧洲资本主义制度后，金钱成为推动事业发展的重要因素。《人间喜剧》中刻画了一些组织生产、投身慈善事业的人物形象，他们用金钱造福天下苍生，发挥了金钱的积极作用。虽然这类人物描写不多，但反映了巴尔扎克梦想中的社会状态，凸显了金钱在推动社会进步、发展公益事业方面的正面意义。\n\n二、负面金钱观\n\n（一）金钱腐蚀人性：巴尔扎克塑造了众多“视金钱如命”的人物形象，如《高布赛克》中的主人公是贪婪吝啬的高利贷者，以高利贷剥削他人财产，为几法郎也计较半天。《欧也妮·葛朗台》中的葛朗台是狡猾的吝啬鬼，通过高额放贷、公债投机、种植园林等聚财，为争夺财产害死妻子、骗走女儿继承权，致使女儿爱情受阻，将金钱置于亲情、爱情之上，展现出人性的贪婪和丑恶。\n\n《交际花盛衰记》中的妓女埃丝黛以美貌为资本周旋于银行家纽沁根、法官卡缪索之间，她的身体成为流通于权钱市场的特殊商品。当她试图用爱情超越交易逻辑时，最终却被毒杀。这一悲剧印证了马克思所言：“资产阶级撕下了罩在家庭关系上的温情脉脉的面纱，把这种关系变成了纯粹的金钱关系。”\n\n（二）金钱毒化社会：在《幻灭》中，新闻媒体、文学界等沦为肮脏的地狱，新闻媒体人出卖人格和灵魂，文学创作刮起不正之风，书籍报纸成为“销售思想的妓院”，政坛也受到金钱的腐蚀。《金眼女郎》在描述不同阶层人群时，聚焦于金\n\n钱、享乐等话题，揭露了工人劳累、市民疲惫，上层人士不择手段敛财，编辑和艺术家残酷构思的社会现实，展现了金钱主义弥漫下整个法国社会的丑恶嘴脸，人们的精神世界被金钱腐蚀，人际关系金钱化，社会道德沦丧。\n\n《夏倍上校》中，被误认为战死的夏倍上校归来后，妻子为霸占其遗产，伙同律师伪造文件将他关进疯人院。法律文当成为“合法化谋杀”的工具，婚姻契约在金钱面前暴露出赤裸裸的暴力性。巴尔扎克在此揭示了资本主义社会的根本法则：契约精神服务于资本增殖，而非道德正义。\n\n综上，《人间喜剧》通过2400多个人物构建的“金钱关系网络”，成为19世纪法国从封建伦理向资本法则过渡的病理学标本，恩格斯称其为“现实主义最伟大的胜利”。","keywords":"正面 造福人类 发展事业 负面 腐蚀人性 毒化社会","note":"《人间喜剧》中的金钱观呈现复杂性：既视金钱为腐蚀人性的“万恶之源”，又承认其重构社会秩序的历史必然性。因此本题切入点可分为负面金钱观和正面金钱观，别忘记题目要求中的结合文本。"},{"id":"148","stars":"★★★★★","title":"巴尔扎克《高老头》的思想内容及艺术特色","body":"《高老头》是巴尔扎克的著名作品。《高老头》以1819年末至1820年初的巴黎为时代背景，以伏盖公寓和鲍赛昂夫人的沙龙为舞台，以高老头和拉斯蒂涅两个人物基本平行而又交叉的故事为主要情节，真实地勾画出波旁复辟王朝时期法国社会的面貌。这部小说深刻反映了复辟时期的法国社会，暴露了金钱的罪恶作用，在艺术上也是巴尔扎克的一个高峰。\n\n一、思想内容\n\n（一）《高老头》淋漓尽致地揭露了金钱的统治作用和拜金主义的种种罪恶。这在高老头和他的两个女儿的故事中得到集中的表现。\n\n（二）《高老头》还从不同角度写出政治野心家的成长过程，揭露统治阶层的卑鄙丑恶，抨击资产阶级的道德原则，从而揭示人欲横流的社会现实。\n\n（三）《高老头》还反映了巴尔扎克对现实关系的深刻了解。小说通过鲍赛昂子爵夫人情场失意的描写，说明资产阶级暴发户终于打败了世代簪缨的贵族，显示了复辟时期贵族被资产阶级取代的历史过程。\n\n二、艺术特色\n\n（一）精细地描摹物质环境，为塑造典型环境中的典型人物服务\n\n由于巴尔扎克十分强调人物性格与环境的关系，因而，《高老头》不仅通过复杂的情节来揭示人物所处的复杂的社会环境，还精确细致地描写出风俗画式的物质环境，揭示“物”对人的精神一心理的侵蚀作用。《高老头》对伏盖公寓的描写是精确而细致的，我们从寓所的“集体饭厅”这一角，就可窥见公寓的全貌。这个饭厅是伏盖公寓里的人活动的中心场所，作者精确细致地描绘饭厅，也便是在界定生活于其间的人的社会身份和精神面貌。透过这幅“毫无诗意”的寒酸的餐厅图画，我们就可以窥见就餐者的灵魂。\n\n（二）塑造典型性格\n\n环境的描写只是为性格刻画提供了客观依据，更重要的还在于性格描写本身。巴尔扎克认为，塑造典型必须表现出某类人物“最鲜明的性格特征”，为此，他在刻画性格时，紧紧抓住某个重要人物的一种炽烈的情欲进行反复描写，使人物的一言一行都受这种情欲驱使，并处于为满足这种情欲的煎熬之中。拉斯蒂涅始终受着金钱欲望的吞噬；高老头日夜渴望着父女之间爱的情感，因而被人们称为“父爱的典型”；鲍赛昂夫人企求的是贵族荣誉与地位。他们各自为某一情欲所驱使，也就显示出了各自的个性。\n\n（三）不同人物不同塑造手法\n\n巴尔扎克在塑造拉斯蒂涅时，运用了心理描写，细致地描写了拉斯蒂涅在接受“人生三课”过程中的思想波动和斗争，不断描绘出拉斯蒂涅在与新环境接触时的所思所想，以精细的心理描写刻画了这个年轻野心家的心理变化；在塑造伏脱冷时，运用肖像描写，对他身体的细节描写给人健壮和粗野的印象；塑造高老头时，运用倒叙的方法介绍了他的发家史，全面表现这一人物的整体面貌。\n\n（四）细节描写多样\n\n巴尔扎克十分善于运用经济细节、肖像细节、行为细节、语言细节等来揭示人物的个性特征。如高老头在伏盖公寓的生活费是逐步下降的，在伏盖太太心目中，他的身价和人格也就随之下降，她对他的称呼由“高里奥先生”“高老头”再变为“老熊猫”“老混蛋”，这里的经济细节和语言细节，活画出了伏盖太太充满金钱铜臭的灵魂；伏脱冷第一次出场时的肖像\n\n描写和语言描写，活画出了这个黑社会铁腕人物的栩栩如生的形象。\n\n（五）人物再现\n\n《高老头》是巴尔扎克运用人物再现这一手法创作的第一部作品，因此被称为《人间喜剧》的序幕。作品中的拉斯蒂涅、纽沁根、伏脱冷、皮安训、鲍赛昂子爵夫人等，在以后的作品中反复出现。《高老头》中还是初出茅庐的资产阶级野心家拉斯蒂涅，在《纽沁根银行》中已是纽沁根的得力助手，在《不知道自己是演员的演员》中成了伯爵、部长、无耻政客。\n\n（六）广泛地运用了对比的原则\n\n人物对比如高老头对女儿的溺爱与泰伊番将女儿赶出家门，高老头的痴情与女儿的绝情，从中引出抑恶扬善的教训。环境对比如上流社会和伏盖公寓下层社会对比，刺激了拉斯蒂涅的野心，揭露了贵族表面兴盛和资产阶级暴发户的粗俗。\n\n（七）语言多姿多彩、比喻深刻\n\n《高老头》中人物语言充分个性化，如伏脱冷语言锋利、赤裸裸、一针见血；高老头的语言中充满对女儿的痴情。而且比喻深刻，如高老头没钱遭到女儿们的遗弃“就像柠檬榨干了”，她们“把剩下的皮扔在街上”。\n\n（八）网状结构模式\n\n《高老头》写了拉斯蒂涅的堕落、高老头的惨死、伏脱冷的再度被捕、鲍赛昂夫人的退出巴黎、泰伊番小姐的遭遇、米
